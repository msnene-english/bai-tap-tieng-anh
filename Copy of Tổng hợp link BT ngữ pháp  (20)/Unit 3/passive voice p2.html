<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 BỊ ĐỘNG CỦA CÂU HỎI — 40 câu — Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g1:#ff9a9e;--g2:#fecfef;--g3:#a18cd1;--g4:#fbc2eb;
  --glass:rgba(255,255,255,.68);--glb:rgba(255,255,255,.85);--gsh:0 8px 32px rgba(161,140,209,.25);
  --ink:#2d3436;--pu:#8e44ad;--pk:#fd79a8;--good:#00b894;--bad:#e74c3c;--dim:#7a6a86}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(-45deg,var(--g1),var(--g2),var(--g3),var(--g4));
  background-size:400% 400%;background-attachment:fixed;animation:bg 15s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
/* ── HOA ANH ĐÀO RƠI ── */
.pt{position:fixed;top:-26px;pointer-events:none;z-index:0;animation:fallP linear infinite}
.pt i{display:block;width:var(--s);height:calc(var(--s)*.78);background:var(--c);
  border-radius:100% 0 100% 0;box-shadow:0 1px 3px rgba(160,60,110,.18);
  animation:spinP ease-in-out infinite alternate}
.pt em{display:block;font-style:normal;line-height:1}
@keyframes fallP{0%{transform:translateY(-30px) translateX(0);opacity:0}6%{opacity:.95}88%{opacity:.8}
  100%{transform:translateY(110vh) translateX(var(--dx));opacity:0}}
@keyframes spinP{from{transform:rotate(-28deg) skewX(-8deg)}to{transform:rotate(205deg) skewX(8deg)}}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:16px 14px 80px}
.gl{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glb);border-radius:20px;box-shadow:var(--gsh)}
.hdr{padding:20px 18px 17px;text-align:center;margin:8px 0 18px}
.hdr h1{font-size:clamp(17px,3.6vw,25px);line-height:1.35;color:var(--pu);font-weight:900}
.hdr p{font-size:.85rem;font-weight:700;color:#6d4c7d;margin-top:7px;line-height:1.7}
.hdr p b{color:var(--pk)}
.sb{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;
  margin-bottom:18px;border-radius:999px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);
  border:1px solid var(--glb);box-shadow:0 4px 14px rgba(161,140,209,.22)}
.sb b{font-size:1.08rem;color:var(--pu);font-weight:900}
.tr{flex:1;height:10px;background:rgba(253,121,168,.18);border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--pk),var(--g3));transition:width .45s}
.sec{padding:20px 15px 18px;margin-bottom:24px}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:2px 0 5px}
.pill{color:#fff;border-radius:999px;padding:3px 15px;font-size:.88rem;font-weight:900;
  box-shadow:0 3px 10px rgba(161,140,209,.35)}
.st h2{font-size:1.05rem;line-height:1.4;color:var(--pu);font-weight:900}
.si{font-size:.86rem;font-weight:700;color:var(--dim);font-style:italic;margin:3px 0 14px;line-height:1.7}
/* ── LÝ THUYẾT NGẮN ── */
.th{background:rgba(255,255,255,.62);border:1px solid rgba(253,121,168,.35);border-radius:15px;
  padding:12px 13px 13px;margin-bottom:14px}
.th h3{font-size:.94rem;color:var(--pu);margin-bottom:9px;font-weight:900}
.fm{background:rgba(253,121,168,.12);border:1px dashed var(--pk);border-radius:11px;padding:9px 12px;
  text-align:center;font-weight:900;font-size:1rem;color:#a3325f;line-height:1.75;margin-bottom:8px}
.ru{background:#fff;border-left:5px solid var(--g3);border-radius:0 10px 10px 0;padding:6px 11px;
  margin-bottom:6px;font-size:.92rem;line-height:1.75;font-weight:700}
.ru b{color:var(--pu)}
.eg{display:inline-block;background:#fff0f6;border:1.5px solid var(--pk);border-radius:8px;padding:0 8px;
  font-weight:800;color:#a3325f;margin:2px 3px 0 0;font-size:.89rem}
.tb{width:100%;border-collapse:collapse;margin:7px 0;font-size:.86rem}
.tb th{background:var(--g3);color:#fff;padding:6px 8px;border:1px solid #fff;font-size:.86rem}
.tb td{background:#fff;padding:6px 8px;border:1px solid #f3d9ea;font-weight:700;line-height:1.65}
.tb tr:nth-child(even) td{background:#fff8fc}
.tb td b{color:var(--good)}.tb td s{color:var(--bad)}
.tip{background:#e8fdf6;border:1.5px solid var(--good);border-radius:11px;padding:8px 12px;font-size:.9rem;
  font-weight:700;line-height:1.78;color:#046a4e}
.wn{background:#fff0f0;border:1.5px solid var(--bad);border-radius:11px;padding:8px 12px;font-size:.9rem;
  font-weight:700;line-height:1.78;color:#a02020;margin-top:7px}
.wn s{color:#c0392b}
/* ── CÂU HỎI ── */
.q{background:rgba(255,255,255,.9);border-radius:14px;padding:11px 12px 12px;margin-bottom:11px;
  box-shadow:0 3px 10px rgba(161,140,209,.18);border-left:5px solid var(--g4)}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:var(--pk);color:#fff;border-radius:9px;min-width:31px;text-align:center;
  padding:0 8px;margin-right:7px;font-size:.9rem;font-weight:900}
.qt{font-weight:700;font-size:1rem;line-height:1.85}
.src{background:#fff6fa;border-left:4px solid var(--g3);border-radius:0 10px 10px 0;padding:8px 12px;
  margin-top:8px;font-weight:800;font-size1rem;font-size:1rem;line-height:1.8;color:#4a2d55}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.suf{font-weight:800;font-size:1rem;color:var(--ink);white-space:normal;line-height:1.6}
.ti{flex:1;min-width:210px;padding:9px 13px;border:2px solid #f6cfe3;border-radius:11px;
  font-family:'Nunito';font-size:.98rem;font-weight:800;outline:none;background:#fffdfe;color:var(--ink)}
.ti::placeholder{color:#c9a8bd}
.ti:focus{border-color:var(--pk);background:#fff}
.ti.ok{border-color:var(--good);background:#e8fdf6}.ti.no{border-color:var(--bad);background:#fff0f0}
.ck{background:linear-gradient(135deg,#fd79a8,#a29bfe);color:#fff;border:none;border-radius:11px;
  padding:9px 19px;font-family:'Nunito';font-size:.95rem;font-weight:900;cursor:pointer;
  box-shadow:0 4px 12px rgba(253,121,168,.38);white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.42;cursor:default}
/* ── GIẢI THÍCH (gọn) ── */
.ex{display:none;margin-top:10px;background:#fffdfe;border:1px solid #f3d9ea;border-radius:12px;padding:11px;
  font-size:.93rem;line-height:1.8}
.ex.show{display:block}
.kb{background:#e8fdf6;border:1.5px solid var(--good);border-radius:9px;padding:6px 11px;margin-bottom:7px;
  font-weight:900;color:#046a4e;line-height:1.7}
.vi{background:#fff8e6;border-left:4px solid #f0a30a;border-radius:0 8px 8px 0;padding:6px 11px;
  margin-bottom:7px;font-weight:700;color:#8a5a00;line-height:1.7}
.sp{background:#fdf7fb;border:1px solid #f3d9ea;border-radius:9px;padding:6px 11px;margin-bottom:6px;
  line-height:1.78}
.sp .l{display:inline-block;background:var(--g3);color:#fff;border-radius:6px;padding:0 8px;font-size:.76rem;
  font-weight:900;margin-right:5px}
.pg{background:linear-gradient(transparent 55%,#ffe9a8 55%);font-weight:800}
.hi{color:var(--pu);font-weight:900}
.fx{display:inline-block;background:#ffe0e0;color:#a02020;border-radius:5px;padding:0 6px;font-weight:900;
  text-decoration:line-through}
.fy{display:inline-block;background:#d9f7ec;color:#046a4e;border-radius:5px;padding:0 6px;font-weight:900}
u{background:#ffe9a8;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800}
.sub{text-align:center;margin-top:22px}
.sbtn{background:linear-gradient(135deg,#fd79a8,#a29bfe);color:#fff;border:none;border-radius:999px;
  padding:13px 40px;font-family:'Nunito';font-size:1.15rem;font-weight:900;cursor:pointer;
  box-shadow:0 6px 18px rgba(253,121,168,.45)}
.sbtn:hover{transform:translateY(-2px)}
.ov{position:fixed;inset:0;background:rgba(90,60,110,.6);z-index:99;display:none;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.mb{background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--glb);
  border-radius:22px;box-shadow:0 12px 40px rgba(120,60,140,.35);padding:24px;width:420px;max-width:96%;
  text-align:center;max-height:90vh;overflow-y:auto}
.mb h2{font-size:1.28rem;color:var(--pu);margin-bottom:11px;font-weight:900}
.mb input{width:100%;padding:11px;border:2px solid #f6cfe3;border-radius:11px;font-family:'Nunito';
  font-weight:800;font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#fff0f0;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-size:1.2rem;color:var(--pu);font-weight:900;line-height:1.3;margin-bottom:4px}
.mb .rs{font-size:2.4rem;color:var(--pk);font-weight:900}
.mb .rt{font-weight:900;color:#6d4c7d;font-size:1.06rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.92rem;line-height:1.65;margin-bottom:10px;color:#5a4a66}
.mb img{width:100%;max-width:250px;border-radius:13px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr gl">
    <h1>🌸 BỊ ĐỘNG CỦA CÂU HỎI · PASSIVE QUESTIONS</h1>
    <p>🎓 Giáo viên tạo: Ms MS Chí Nên<br>
    <b>40 câu</b> &nbsp;·&nbsp; 20 câu hỏi <b>Yes/No</b> &nbsp;+&nbsp; 20 câu hỏi <b>Wh-</b> &nbsp;·&nbsp; có cả dạng đặc biệt với <b>WHO</b></p>
  </div>
  <div class="sb">🌸 <b><span id="sc">0</span>/<span id="tt">0</span></b>
    <div class="tr"><div class="fl" id="fb"></div></div><span id="md">💪</span></div>
  <div id="app"></div>
  <div class="sub"><button class="sbtn" onclick="openName()">🌸 NỘP BÀI</button></div>
</div>
<div class="ov" id="nOv"><div class="mb"><h2>✍️ Nhập tên của con</h2>
  <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="em" id="nEr">⚠️ Con chưa nhập tên kìa!</div>
  <button class="sbtn" style="width:100%;font-size:1.03rem;padding:10px" onclick="showResult()">🚀 Xem kết quả</button></div></div>
<div class="ov" id="rOv"><div class="mb"><div class="gr" id="rG"></div>
  <div class="rs" id="rS"></div><div class="rt" id="rT"></div><img id="rI" alt=""><div class="rm" id="rM"></div>
  <button class="sbtn" style="width:100%;font-size:1.03rem;padding:10px" onclick="location.reload()">🔄 Làm lại</button></div></div>

<script>
/* ══ 30 CÁNH HOA ANH ĐÀO RƠI ══ */
(function(){
 const col=['#ffb7c5','#ffc9d6','#ff9ab5','#fff0f5','#f8bbd0','#ffd1dc'];
 for(let i=0;i<30;i++){
  const d=document.createElement('div');d.className='pt';
  if(i%6===5){const e=document.createElement('em');e.textContent='🌸';
   e.style.fontSize=(11+Math.random()*11).toFixed(0)+'px';d.appendChild(e);}
  else{const p=document.createElement('i');
   p.style.setProperty('--s',(7+Math.random()*8).toFixed(0)+'px');
   p.style.setProperty('--c',col[i%col.length]);
   p.style.animationDuration=(1.6+Math.random()*2).toFixed(1)+'s';d.appendChild(p);}
  d.style.left=(Math.random()*98)+'%';
  d.style.setProperty('--dx',(Math.random()*160-40).toFixed(0)+'px');
  d.style.animationDuration=(9+Math.random()*11).toFixed(1)+'s';
  d.style.animationDelay=(-Math.random()*20).toFixed(1)+'s';
  document.body.appendChild(d);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#fd79a8','#ffb7c5','#a18cd1','#00b894','#ffd1dc'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
/* ══ DỮ LIỆU ══ */
const Q=[];
/* giải thích GỌN: đáp án · dịch · cách làm · bẫy */
function EX(k,vn,how,trap){
 return '<div class="kb">✅ '+k+'</div><div class="vi">💬 '+vn+'</div>'+
  '<div class="sp"><span class="l">CÁCH LÀM</span>'+how+'</div>'+
  '<div class="sp"><span class="l">BẪY</span><span class="pg">'+trap+'</span></div>'}
function full(ans,suf){return suf.trim()==='?'?ans+'?':ans+' '+suf}
function q(sec,num,act,suf,ans,accept,vn,how,trap){
 Q.push({sec,num,act,suf,ans,accept,ex:EX('<b>'+full(ans,suf)+'</b>',vn,how,trap)});
}

/* ═════ A — CÂU HỎI YES/NO (20 câu) ═════ */
const A=(n,act,suf,ans,acc,vn,how,trap)=>q('S1',n,act,suf,ans,acc,vn,how,trap);
A(1,'Does Mr Hung water these plants every morning?','by Mr Hung every morning?',
 'Are these plants watered',['are these plants watered'],
 'Những cây này có được tưới mỗi sáng không?',
 '<b>Does</b> + hiện tại đơn ➔ bỏ “does”, dùng <b>Are</b> (vì “these plants” số nhiều) <b>+ V3</b>.',
 'Chủ ngữ mới SỐ NHIỀU ➔ <s>Is these plants watered</s> ✘.');
A(2,'Did the villagers build this bamboo bridge?','by the villagers?',
 'Was this bamboo bridge built',['was this bamboo bridge built'],
 'Chiếc cầu tre này có phải do dân làng xây không?',
 '<b>Did</b> ➔ quá khứ ➔ đảo <b>Was</b> (số ít) lên đầu <b>+ V3 (built)</b>.',
 '<s>Was this bridge build</s> ✘ — phải dùng V3. <b>build ➔ built</b>.');
A(3,'Has the postman delivered the parcel?','by the postman?',
 'Has the parcel been delivered',['has the parcel been delivered'],
 'Bưu kiện đã được giao chưa?',
 'Hiện tại hoàn thành ➔ giữ <b>Has</b> ở đầu, thêm <b>been + V3</b>.',
 'Bắt buộc có <b>been</b> ➔ <s>Has the parcel delivered</s> ✘');
A(4,'Are the workers painting the school gate?','by the workers?',
 'Is the school gate being painted',['is the school gate being painted'],
 'Cổng trường có đang được sơn không?',
 'Tiếp diễn ➔ <b>Is</b> (số ít) <b>+ being + V3</b>.',
 'Thiếu <b>being</b> là mất nghĩa “đang” ➔ <s>Is the school gate painted</s> ✘');
A(5,'Will your class plant more trees next week?','by your class next week?',
 'Will more trees be planted',['will more trees be planted'],
 'Tuần sau có thêm cây nào được trồng không?',
 'Giữ <b>Will</b> ở đầu, thêm <b>be + V3</b>.',
 '<s>Will more trees planted</s> ✘ thiếu “be” · <s>will be plant</s> ✘ phải V3.');
A(6,'Is she going to bake a birthday cake?','?',
 'Is a birthday cake going to be baked',['is a birthday cake going to be baked'],
 'Có một chiếc bánh sinh nhật sắp được làm không?',
 'Tương lai gần ➔ <b>Is</b> + S + <b>going to be + V3</b>.',
 'Câu này có <u>hai</u> chữ “be”: <b>Is</b>… going to <b>be</b> baked ➔ <s>going to baked</s> ✘');
A(7,'Can the doctors cure this disease?','by the doctors?',
 'Can this disease be cured',['can this disease be cured'],
 'Bệnh này có thể chữa được không?',
 'Modal ➔ giữ <b>Can</b> ở đầu, thêm <b>be + V3</b>.',
 'Sau modal luôn là <b>be</b> nguyên thể ➔ <s>Can this disease cured?</s> ✘');
A(8,'Must we hand in the reports today?','today?',
 'Must the reports be handed in',['must the reports be handed in'],
 'Hôm nay có phải nộp báo cáo không?',
 '<b>Must + be + V3</b>; cụm <b>hand in</b> giữ nguyên giới từ <b>in</b>.',
 'Đừng bỏ mất <b>in</b> ➔ <s>Must the reports be handed</s> ✘. Và “we” chung chung ➔ bỏ hẳn tác nhân.');
A(9,'Did someone feed the rabbits yesterday?','yesterday?',
 'Were the rabbits fed',['were the rabbits fed'],
 'Hôm qua những con thỏ có được cho ăn không?',
 '“rabbits” số nhiều + quá khứ ➔ <b>Were + V3 (fed)</b>. “someone” chung chung ➔ bỏ hẳn tác nhân.',
 '<b>feed ➔ fed</b>, không phải “feeded”.');
A(10,'Do people sell fresh milk at that market?','at that market?',
 'Is fresh milk sold',['is fresh milk sold'],
 'Sữa tươi có được bán ở chợ đó không?',
 '“milk” không đếm được ➔ <b>Is + V3 (sold)</b>. “people” chung chung ➔ bỏ hẳn tác nhân.',
 '<b>sell ➔ sold</b>, không phải “selled”.');
A(11,'Was the chef preparing the fish soup?','by the chef?',
 'Was the fish soup being prepared',['was the fish soup being prepared'],
 'Món canh cá có đang được đầu bếp chuẩn bị không?',
 'Quá khứ tiếp diễn ➔ <b>Was + being + V3</b>.',
 'Phân biệt: <b>is being</b> (đang, hiện tại) ↔ <b>was being</b> (đang, quá khứ).');
A(12,'Had the guards locked all the gates?','by the guards?',
 'Had all the gates been locked',['had all the gates been locked'],
 'Tất cả các cổng đã được khoá (trước đó) chưa?',
 'Quá khứ hoàn thành ➔ giữ <b>Had</b>, thêm <b>been + V3</b>.',
 '<b>Had been</b> không đổi theo số ➔ đúng cho cả số ít và số nhiều.');
A(13,'Should we water the orchids twice a week?','twice a week?',
 'Should the orchids be watered',['should the orchids be watered'],
 'Có nên tưới lan hai lần một tuần không?',
 '<b>Should + be + V3</b>. “we” chung chung ➔ bỏ hẳn tác nhân.',
 '<s>Should the orchids watered</s> ✘ thiếu “be”.');
A(14,'Have they repaired the broken lift yet?','yet?',
 'Has the broken lift been repaired',['has the broken lift been repaired'],
 'Chiếc thang máy bị hỏng đã được sửa chưa?',

/* ══ DỰNG TRANG ══ */
const TOTAL=Q.length;let answered=0,score=0;const done={};
function bump(){document.getElementById('fb').style.width=(answered/TOTAL*100)+'%';
 document.getElementById('sc').textContent=score;
 const p=answered?score/answered:1;
 document.getElementById('md').textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){
 const d=document.createElement('div');d.className='sec gl';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+
  '</span><h2>'+title+'</h2></div><div class="si">'+ins+'</div>';
 APP.appendChild(d);CUR=d}
function put(h){CUR.insertAdjacentHTML('beforeend',h)}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

sec('linear-gradient(135deg,#fd79a8,#a29bfe)','BÀI A','❓ Bị động của câu hỏi YES/NO',
 'Chỉ cần gõ phần <b>còn thiếu</b> vào ô trống — phần đuôi câu (tác nhân/trạng từ/dấu chấm hỏi) đã cho sẵn. Không phân biệt hoa/thường. (20 câu)');
put('<div class="th"><h3>🌸 Lý thuyết ngắn — 3 bước</h3>'+
 '<div class="fm">① về câu kể &nbsp;➔&nbsp; ② chuyển bị động &nbsp;➔&nbsp; ③ đảo <b>be / trợ động từ</b> lên đầu</div>'+
 '<table class="tb"><tr><th>Câu hỏi chủ động</th><th>Câu hỏi bị động</th></tr>'+
 '<tr><td>Do / Does + S + V?</td><td><b>Am/Is/Are</b> + S + V3?</td></tr>'+
 '<tr><td>Did + S + V?</td><td><b>Was/Were</b> + S + V3?</td></tr>'+
 '<tr><td>Is/Are + S + V-ing?</td><td><b>Is/Are</b> + S + <b>being</b> + V3?</td></tr>'+
 '<tr><td>Have/Has/Had + S + V3?</td><td><b>Have/Has/Had</b> + S + <b>been</b> + V3?</td></tr>'+
 '<tr><td>Will / modal + S + V?</td><td><b>Will / modal</b> + S + <b>be</b> + V3?</td></tr>'+
 '<tr><td>Is + S + going to + V?</td><td><b>Is</b> + S + going to <b>be</b> + V3?</td></tr></table>'+
 '<div class="tip">💡 <b>Do/Does/Did biến mất</b> — thay bằng <b>am/is/are/was/were</b>. '+
 'Chia theo <u>chủ ngữ MỚI</u>, không theo chủ ngữ cũ.</div>'+
 '<div class="wn">⚠️ Tác nhân chung chung (<b>people · someone · anyone · they · we</b>) ➔ '+
 '<u>bỏ hẳn</u> “by…”.</div></div>');
render('S1');

sec('linear-gradient(135deg,#a18cd1,#fd79a8)','BÀI B','🔍 Bị động của câu hỏi WH-',
 'Chỉ cần gõ phần <b>còn thiếu</b> vào ô trống (giữ từ hỏi ở đầu, làm như câu Yes/No). Không phân biệt hoa/thường. (20 câu)');
put('<div class="th"><h3>🌸 Lý thuyết ngắn — Wh- &amp; WHO</h3>'+
 '<div class="fm">Wh- &nbsp;+&nbsp; <b>be / trợ động từ</b> &nbsp;+&nbsp; S &nbsp;+&nbsp; <b>V3</b> &nbsp;…?</div>'+
 '<div class="ru">Giữ <b>nguyên cả cụm từ hỏi</b> ở đầu câu: <span class="eg">How often</span>'+
 '<span class="eg">How many + N</span><span class="eg">Which + N</span></div>'+
 '<div class="ru"><b>What</b> nếu là tân ngữ ➔ chính nó thành <b>chủ ngữ mới</b>, không thêm chủ ngữ nào khác.</div>'+
 '<div class="tip">💡 <b>Riêng WHO</b> (hỏi người làm hành động) ➔ <b>By whom + be + S + V3?</b> '+
 '(trang trọng) = <b>Who + be + S + V3 + by?</b> (thông dụng) — cô nhận cả hai.</div>'+
 '<div class="wn">⚠️ Nhớ bỏ <b>do/does/did</b> và dùng <b>V3</b>, không phải V nguyên thể hay V2.</div></div>');
render('S2');

document.getElementById('tt').textContent=TOTAL;bump();

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 c.innerHTML='<div class="qt"><span class="qn">'+m.num+'</span>Chuyển câu hỏi sau sang bị động:'+
  '<div class="src">❓ '+m.act+'</div></div>'+
  '<div class="fr">✍️ <input class="ti" id="i_'+gid+'" placeholder="...gõ phần còn thiếu..." autocomplete="off" spellcheck="false">'+
  '<span class="suf">'+m.suf+'</span></div>'+
  '<div class="fr"><button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
 const go=()=>{
  if(done[gid])return;
  const v=norm(inp.value);
  if(!v){inp.classList.add('no');c.classList.add('shk');
   setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
  done[gid]=true;answered++;
  const ok=m.accept.map(norm).indexOf(v)>-1;
  inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
  document.getElementById('e_'+gid).classList.add('show');
  if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
  bump();
 };
 bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 return c;
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — bị động câu hỏi quá vững! 🌸';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Rất tốt rồi! Nhớ 3 bước và nhớ bỏ do/does/did khi chuyển bị động nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Xem lại bảng trợ động từ rồi làm lại nhé! 🌸';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
