<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASSIVE VOICE · TỔNG HỢP 50 CÂU — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--coral:#FF5D6C;--amber:#FFB020;--teal:#12C2B0;--indigo:#4C6FFF;--violet:#8B4DE8;
  --ink:#181433;--paper:#FFF7EC;--bad:#FF3B4E;--good:#08A24B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;
  background:linear-gradient(-45deg,#FF5D6C,#FFB020,#12C2B0,#4C6FFF,#8B4DE8);background-size:400% 400%;
  animation:bg 22s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(0,0,0,.12) 1.4px,transparent 1.6px);background-size:16px 16px}
.pattern{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.pattern span{position:absolute;font-family:'Bangers',cursive;color:#fff;opacity:.5;
  -webkit-text-stroke:2px var(--ink);animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(112vh) rotate(-12deg)}100%{transform:translateY(-25vh) rotate(12deg)}}
.wrap{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:14px 14px 80px}
.teacher{display:inline-block;font-family:'Bangers',cursive;letter-spacing:1px;font-size:1rem;color:var(--ink);
  background:var(--amber);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;
  box-shadow:3px 3px 0 var(--ink);margin:2px 0 10px}
header.top{text-align:center;margin-bottom:16px}
header.top h1{font-family:'Bangers',cursive;font-size:clamp(30px,6.6vw,54px);line-height:.95;letter-spacing:2px;color:#fff;
  -webkit-text-stroke:2.5px var(--ink);text-shadow:5px 5px 0 var(--coral),8px 8px 0 rgba(0,0,0,.18)}
header.top .unit{display:inline-block;margin-top:9px;font-family:'Bangers',cursive;font-size:1.05rem;letter-spacing:1px;
  color:#fff;background:var(--violet);border:3px solid var(--ink);border-radius:12px;padding:3px 16px;
  box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg)}
.scorebar{position:sticky;top:8px;z-index:6;margin:0 auto 18px;max-width:540px;background:#fff;
  border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;
  gap:12px;padding:9px 14px}
.scorebar b{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.15rem}
.track{flex:1;height:14px;background:#eee;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .5s}
.section{background:rgba(255,255,255,.95);border:3px solid var(--ink);border-radius:20px;
  box-shadow:6px 6px 0 var(--ink);padding:16px 15px 18px;margin-bottom:20px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.chip{font-family:'Bangers',cursive;letter-spacing:1px;color:#fff;border:3px solid var(--ink);border-radius:10px;
  padding:3px 12px;box-shadow:2px 2px 0 var(--ink);font-size:.95rem}
.sec-head h2{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.28rem}
.sec-instruct{font-style:italic;font-weight:700;color:#5b5570;margin:2px 0 11px;font-size:.94rem}
/* ── SCAFFOLD RẤT NGẮN ── */
.th{background:#FFFDF3;border:2.5px dashed var(--violet);border-radius:14px;padding:10px 12px 11px;margin-bottom:13px}
.th h3{font-family:'Bangers',cursive;letter-spacing:.8px;font-size:1rem;color:var(--violet);margin-bottom:7px}
.fm{background:#EAF0FF;border:2px solid var(--indigo);border-radius:10px;padding:7px 11px;text-align:center;
  font-weight:900;font-size:.99rem;color:#1E3A8A;line-height:1.7;margin-bottom:7px}
.st1{font-weight:700;font-size:.93rem;line-height:1.8}
.st1 b{color:var(--violet)}
.eg{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:7px;padding:0 7px;
  font-weight:800;margin:2px 3px 0 0;font-size:.88rem;box-shadow:1.5px 1.5px 0 var(--ink)}
/* ── CÂU HỎI ── */
.q{border:2.5px dashed #cfc9de;border-radius:14px;padding:12px 12px 13px;margin-bottom:12px;background:#fff}
.q.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}
 60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.qnum{display:inline-block;font-family:'Bangers',cursive;background:var(--coral);color:#fff;border:2.5px solid var(--ink);
  border-radius:9px;min-width:34px;text-align:center;padding:1px 8px;box-shadow:2px 2px 0 var(--ink);margin-right:8px;
  font-size:1rem}
.stem{display:inline;font-weight:700;font-size:1.02rem;line-height:1.8}
.bl{display:inline-block;min-width:96px;border-bottom:3px solid var(--indigo);text-align:center;color:var(--indigo);
  font-weight:900}
.src{background:#FFF7EC;border:2.5px solid var(--ink);border-radius:11px;padding:8px 12px;margin-top:9px;
  font-weight:800;font-size:1rem;line-height:1.75;box-shadow:2px 2px 0 rgba(24,20,51,.18)}
.cue{background:#FFF2C2;border:2px dashed var(--amber);border-radius:10px;padding:7px 11px;margin-top:8px;
  font-weight:800;font-size:.98rem;line-height:1.7}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.opts.c4{grid-template-columns:repeat(4,1fr)}.opts.c1{grid-template-columns:1fr}
@media(max-width:680px){.opts.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:2.5px solid var(--ink);border-radius:11px;background:#fff;padding:10px 13px;font-weight:700;cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);transition:transform .1s,background .15s;font-size:1rem;text-align:center;
  font-family:'Nunito';color:var(--ink);line-height:1.5}
.opt:hover:not(.dn){transform:translate(-1px,-1px)}
.opt.ok{background:#C9F7DB;border-color:var(--good)}
.opt.no{background:#FFD6DB;border-color:var(--bad)}
.opt.dim{opacity:.42}
.blankwrap{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pre,.suf{font-weight:800;font-size:1rem;color:var(--ink);line-height:1.6}
.pre{white-space:nowrap}
.suf{white-space:normal}
input.ans{font-family:'Nunito';font-weight:800;font-size:1rem;padding:8px 12px;border:2.5px solid var(--ink);
  border-radius:10px;min-width:170px;box-shadow:2px 2px 0 var(--ink);background:#FFFDF6;flex:1;color:var(--ink)}
input.ans::placeholder{color:#a09ab5}
input.ans:focus{outline:none;border-color:var(--indigo);background:#fff}
input.ans.ok{border-color:var(--good);background:#DFF7E8}
input.ans.no{border-color:var(--bad);background:#FFE1E5}
.btn{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.15rem;color:#fff;background:var(--teal);
  border:3px solid var(--ink);border-radius:12px;padding:10px 24px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;
  transition:transform .1s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:7px 16px;font-size:1rem;border-width:2.5px;box-shadow:3px 3px 0 var(--ink)}
/* ── TÌM & SỬA LỖI ── */
.efline{font-weight:700;font-size:1.03rem;line-height:2.2;margin-top:8px}
.ul{display:inline-block;position:relative;cursor:pointer;font-weight:800;padding:0 3px;
  border-bottom:3px solid var(--indigo);transition:background .15s;border-radius:4px 4px 0 0}
.ul:hover:not(.dn){background:#EAF0FF}
.ul .tag{font-family:'Bangers',cursive;font-size:.68rem;color:#fff;background:var(--indigo);border:1.5px solid var(--ink);
  border-radius:5px;padding:0 4px;margin-left:2px;vertical-align:super}
.ul.sel{background:#FFF2C2;border-bottom-color:var(--amber)}
.ul.sel .tag{background:var(--amber);color:var(--ink)}
.ul.ok{background:#C9F7DB;border-bottom-color:var(--good)}.ul.ok .tag{background:var(--good)}
.ul.no{background:#FFD6DB;border-bottom-color:var(--bad)}.ul.no .tag{background:var(--bad)}
.ul.dn{cursor:default}.ul.dimx{opacity:.45}
.effix{margin-top:11px;display:none;flex-wrap:wrap;gap:8px;align-items:center;background:#F5F2FF;
  border:2px dashed #c9bfe8;border-radius:12px;padding:10px}
.effix.show{display:flex}
.effix .lb{font-weight:800;color:var(--violet);font-size:.94rem;width:100%}
.hint{margin-top:9px;background:#FFF7EC;border:2px dashed var(--amber);border-radius:10px;padding:7px 11px;
  font-size:.9rem;font-weight:700;line-height:1.7}
/* ── GIẢI THÍCH 4 BƯỚC ── */
.exp{margin-top:11px;border-radius:12px;padding:14px 13px;font-weight:600;line-height:1.7;font-size:.98rem;
  display:none;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff}
.exp.show{display:block;animation:pop .3s}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.kb{background:#C9F7DB;border:2px solid var(--good);border-radius:9px;padding:7px 11px;margin-bottom:9px;
  font-weight:900;color:#065F35;line-height:1.7}
.vnt{background:#FFF3CD;font-weight:800;padding:8px 12px;border-radius:8px;color:#856404;margin-bottom:10px;
  border:2px dashed #ffe69c;line-height:1.7}
.stp{background:#FAF9FF;border:2px solid #e6e1f5;border-radius:10px;padding:8px 11px;margin-bottom:8px;line-height:1.8}
.stp .tg{display:inline-block;font-family:'Bangers',cursive;letter-spacing:.7px;background:var(--violet);color:#fff;
  border:2px solid var(--ink);border-radius:7px;padding:0 9px;font-size:.82rem;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:7px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#f8fafc;border:2px solid #e2e8f0;border-radius:8px;padding:7px 11px;line-height:1.65}
.wt{background:#e2e8f0;color:#475569;padding:1px 6px;border-radius:4px;font-size:.82em;font-weight:800;margin:0 4px}
.p-word{color:#2563eb;font-weight:800}.p-mean{color:#c2410c;font-weight:700}
.hl-green{color:#16a34a;font-weight:900}
.pg{background:linear-gradient(transparent 55%,#FFE066 55%);font-weight:800}
.fx{display:inline-block;background:#FFD6DB;color:#B3121F;border-radius:6px;padding:0 6px;font-weight:900;
  text-decoration:line-through}
.fy{display:inline-block;background:#C9F7DB;color:#065F35;border-radius:6px;padding:0 6px;font-weight:900}
u{background:#FFE066;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800}
.submit-bar{text-align:center;margin-top:26px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;
  justify-content:center;backdrop-filter:blur(4px);padding:16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-box{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink);
  padding:24px;max-width:96%;width:430px;text-align:center;animation:pop .4s;max-height:92vh;overflow-y:auto}
.modal-box h2{font-family:'Bangers',cursive;font-size:1.9rem;letter-spacing:1px;color:var(--indigo);margin-bottom:12px}
.modal-box input{width:100%;font-family:'Nunito';font-weight:800;font-size:1.05rem;padding:11px;
  border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);margin-bottom:14px;outline:none}
.modal-box input.error{border-color:var(--bad);background:#FFE1E5;animation:shake .45s}
.modal-box .err-msg{color:var(--bad);font-weight:800;font-size:.9rem;margin:-8px 0 12px;display:none}
.modal-box .res-score{font-family:'Bangers',cursive;font-size:2.9rem;color:var(--coral);
  -webkit-text-stroke:2px var(--ink);line-height:1}
.modal-box .res-scale{font-weight:900;color:var(--violet);font-size:1.25rem;margin-top:8px}
.modal-box .res-msg{font-weight:700;line-height:1.6;margin:10px 0 4px}
.modal-box img{width:100%;max-width:290px;border-radius:16px;border:3px solid var(--ink);margin:14px auto;display:block;
  box-shadow:4px 4px 0 var(--ink)}
.confetti{position:fixed;top:0;left:0;width:11px;height:16px;z-index:150;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>
<div class="wrap">
  <header class="top">
    <div class="teacher">★ Ms. Chí Nên · ULIS ★</div>
    <h1>PASSIVE VOICE!</h1>
    <div class="unit">TỔNG HỢP 50 CÂU · 6 DẠNG BÀI · MỤC 1 → 5</div>
  </header>
  <div class="scorebar"><span>⭐</span>
    <b><span id="score">0</span> / <span id="total">50</span></b>
    <div class="track"><div class="fill" id="fill"></div></div><span id="mood">💪</span></div>
  <div id="app"></div>
  <div class="submit-bar"><button class="btn" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
</div>
<div class="modal-overlay" id="modalName"><div class="modal-box">
  <h2>NHẬP TÊN CỦA BẠN</h2>
  <p style="font-weight:700;margin-bottom:12px">Cho cô biết tên của thiên tài đang làm bài nhé!</p>
  <input id="inpName" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" autocomplete="off"
    onkeydown="if(event.key==='Enter')showResult()">
  <div class="err-msg" id="nameErr">❌ Ô kìa, bạn chưa nhập tên kìa!</div>
  <button class="btn" onclick="showResult()">🚀 XEM KẾT QUẢ THÔI!</button></div></div>
<div class="modal-overlay" id="modalResult"><div class="modal-box">
  <h2 id="resGreeting"></h2>
  <div class="res-score"><span id="resCorrect">0</span> / <span id="resTotal">50</span></div>
  <div class="res-scale" id="resScale"></div><img id="resGif" alt="">
  <div class="res-msg" id="resMsg"></div>
  <button class="btn" onclick="location.reload()">🔄 LÀM LẠI</button></div></div>

<script>
/* ══ CHỮ COMIC BAY ══ */
(function(){
 const W=['POW!','BAM!','ZAP!','WOW!','BOOM!','V3!','BE!','BY!','WITH!','WHAM!','OOF!','YES!'];
 const P=document.getElementById('pattern');
 for(let i=0;i<16;i++){
  const s=document.createElement('span');s.textContent=W[i%W.length];
  s.style.left=(Math.random()*94)+'%';s.style.fontSize=(17+Math.random()*24).toFixed(0)+'px';
  s.style.animationDuration=(16+Math.random()*16).toFixed(1)+'s';
  s.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  P.appendChild(s);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#FF5D6C','#FFB020','#12C2B0','#4C6FFF','#8B4DE8'];
 for(let i=0;i<32;i++){const d=document.createElement('div');d.className='confetti';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
/* ══ DỮ LIỆU ══ */
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fullAns(pre,ans,suf){const p=pre?pre+' ':'';return suf.trim()==='.'||suf.trim()==='?'?p+ans+suf.trim():p+ans+' '+suf}
function fil(sec,num,q,pre,suf,ans,accept,ex){Q.push({t:'fill',sec,num,q,pre,suf,correct:ans,accept,ex})}
function fxq(sec,num,parts,letter,corr,accept,ex){Q.push({t:'fix',sec,num,parts,letter,corr,accept,ex})}
function W(w,ty,m){return "<div><span class='p-word'>"+w+"</span><span class='wt'>"+ty+"</span>= <span class='p-mean'>"+m+"</span></div>"}
function G(w,ty,m){return "<div><span class='hl-green'>"+w+"</span><span class='wt'>"+ty+"</span>= <span class='p-mean'>"+m+"</span></div>"}
function EX(k,vn,cells,why,trap){
 return '<div class="kb">✅ '+k+'</div><div class="vnt">💬 <b>Dịch:</b> '+vn+'</div>'+
  '<div class="stp"><span class="tg">① PHÂN TÍCH</span><div class="grid2">'+cells+'</div></div>'+
  '<div class="stp"><span class="tg">② TẠI SAO ĐÚNG</span><br><span class="pg">'+why+'</span></div>'+
  '<div class="stp"><span class="tg">③ BẪY / MẸO</span><br><span class="pg">'+trap+'</span></div>'}

/* ═════ A — CHỌN DẠNG BỊ ĐỘNG ĐÚNG (12 câu) ═════ */
const A=(n,s,a,o,vn,c,w,t)=>mcq('S1',n,'<b>'+n+'.</b> '+s,a,o,EX('<b>'+a+'</b>',vn,c,w,t),'c4');
A(1,'Kites <span class="bl">?</span> from bamboo and paper in this village.','are made',
 ['make','are made','are making','are being made'],
 'Diều được làm từ tre và giấy ở làng này.',
 G('am/is/are + V3','công thức','HIỆN TẠI ĐƠN bị động')+W('Kites','n','những chiếc diều ➔ SỐ NHIỀU ➔ “are”')+
 W('make – made – made','v','làm ➔ V3 “made”')+G('sự thật, nghề truyền thống','manh mối','➔ hiện tại đơn'),
 'Đây là <b>sự thật/thói quen</b> ➔ hiện tại đơn ➔ <b>are made</b>.',
 '<s>are making</s> ✘ là tiếp diễn CHỦ ĐỘNG · <s>are being made</s> ✘ chỉ dùng khi việc '+
 'đang diễn ra NGAY LÚC NÀY · <s>make</s> ✘ chủ động (diều tự làm à?).');
A(2,'The old well <span class="bl">?</span> by the villagers in 1975.','was dug',
 ['dug','was dug','was dig','is dug'],
 'Cái giếng cũ được dân làng đào vào năm 1975.',
 G('was/were + V3','công thức','QUÁ KHỨ ĐƠN bị động')+W('in 1975','adv','năm 1975 ➔ dấu hiệu QUÁ KHỨ')+
 W('dig – dug – dug','v','đào ➔ V3 “dug”')+W('The old well','n','SỐ ÍT ➔ “was”'),
 'Mốc thời gian <b>in 1975</b> ➔ quá khứ đơn ➔ <b>was + V3</b>.',
 '<s>was dig</s> ✘ phải dùng V3. Động từ <b>dig</b> có V2 = V3 = <b>dug</b> — dễ nhớ!');
A(3,'Listen! A folk song <span class="bl">?</span> on the stage.','is being sung',
 ['is sung','is singing','is being sung','is been sung'],

const APP=document.getElementById('app');let CUR=null;
function sec(col,chip,title,ins){
 const d=document.createElement('div');d.className='section';
 d.innerHTML='<div class="sec-head"><span class="chip" style="background:'+col+'">'+chip+
  '</span><h2>'+title+'</h2></div><div class="sec-instruct">'+ins+'</div>';

function put(h){CUR.insertAdjacentHTML('beforeend',h)}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

/* ══ RENDER ══ */
function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qnum">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="stem">'+h+m.q+'</div><div class="opts '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="opt" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="exp" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="stem">'+h+'Tìm ô chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="efline" id="sg_'+gid+'">'+
   m.parts.map(p=>'<span class="ul" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     p[1]+'<span class="tag">'+p[0]+'</span></span>').join(' ')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào ô con cho là SAI.</div>'+
   '<div class="effix" id="fz_'+gid+'"><span class="lb" id="fl_'+gid+'"></span>'+
   '<input class="ans" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="btn small" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="exp" id="e_'+gid+'">'+m.ex+'</div>';
  const bt=c.querySelector('#b_'+gid),inp=c.querySelector('#i_'+gid);
  bt.onclick=()=>chkf(gid);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else {
  c.innerHTML='<div class="stem">'+h+m.q+'</div>'+
   '<div class="blankwrap">'+(m.pre?'<span class="pre">'+m.pre+'</span>':'')+
   '<input class="ans" id="i_'+gid+'" placeholder="...gõ phần còn thiếu..." autocomplete="off" spellcheck="false">'+
   '<span class="suf">'+m.suf+'</span></div>'+
   '<div class="blankwrap"><button class="btn small" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="exp" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shake');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shake')},470);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   const e=document.getElementById('e_'+gid);e.classList.add('show',ok?'ok':'no');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),470)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .ul').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Đã chọn ô <b>'+L+'</b>. <b>Bước 2:</b> gõ phần đã sửa rồi bấm '+
  '<b>KIỂM TRA</b>. (Bấm ô khác nếu muốn đổi.)';
 const fz=document.getElementById('fz_'+gid);fz.classList.add('show');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa ô <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),
       inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),470);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),470);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter,okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .ul').forEach(s=>{
  s.classList.remove('sel');s.classList.add('dn');
  if(s.dataset.l===m.letter)s.classList.add('ok');
  else if(s.dataset.l===sel[gid])s.classList.add('no');
  else s.classList.add('dimx');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
  ? '🎉 <b>Tuyệt vời!</b> Đúng ô <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
  : (okL?'⚠️ Đúng ô <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
       :(okW?'⚠️ Sửa đúng từ nhưng chọn SAI ô. Lỗi ở ô <b>'+m.letter+'</b>.'
            :'❌ Lỗi ở ô <b>'+m.letter+'</b>, phải sửa thành <b>'+m.corr+'</b>.'));
 const e=document.getElementById('e_'+gid);e.classList.add('show',ok?'ok':'no');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),470)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 const e=document.getElementById('e_'+gid);e.classList.add('show',ok?'ok':'no');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),470)}
 bump();
}
function openName(){document.getElementById('modalName').classList.add('show');
 setTimeout(()=>document.getElementById('inpName').focus(),180)}
function showResult(){
 const inp=document.getElementById('inpName'),er=document.getElementById('nameErr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('error');er.style.display='block';setTimeout(()=>inp.classList.remove('error'),480);return}
 er.style.display='none';document.getElementById('modalName').classList.remove('show');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 SIÊU NHÂN NGỮ PHÁP!';msg=nm+' đúng TOÀN BỘ '+TOTAL+' câu — câu bị động không còn gì phải sợ! 💥';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Rất tốt rồi! Nhớ 4 bước chuyển đổi và luôn dùng V3 (cột thứ ba) nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại bảng công thức theo thì rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('resGreeting').textContent=g;
 document.getElementById('resCorrect').textContent=score;
 document.getElementById('resScale').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('resGif').src=gif;
 document.getElementById('resMsg').textContent=msg;
 document.getElementById('modalResult').classList.add('show');
 if(pct>=.6){confetti();ding()}
}
</script>
