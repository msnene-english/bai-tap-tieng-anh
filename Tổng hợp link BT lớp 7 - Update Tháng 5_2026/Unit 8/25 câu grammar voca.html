<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chí Nên - Grade 6 Unit 8: Films & Adjectives</title>
    
    <!-- Google Fonts: Nunito & Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #F0F3FA;
            --card-bg: #FFFFFF;
            --text-color: #2D3436;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#8854c0 1.5px, transparent 1.5px), radial-gradient(#8854c0 1.5px, #f0f3fa 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--primary-purple);
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--primary-purple);
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #636e72;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 50px;
            margin: 20px 0;
            height: 20px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-teal);
            border-radius: 50px;
            transition: width 0.5s ease;
        }

        /* Question Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 0 #dfe6e9; /* 3D depth */
            border: 2px solid #b2bec3;
            transition: transform 0.3s ease;
            position: relative;
        }

        .question-badge {
            display: inline-block;
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #2d3436;
        }

        /* Answer Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 3D Button Styles */
        .answer-btn {
            background-color: white;
            border: 2px solid #dfe6e9;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #636e72;
            cursor: pointer;
            position: relative;
            box-shadow: 0 5px 0 #dfe6e9; /* Bottom shadow for 3D */
            transition: all 0.1s ease;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #dfe6e9;
            border-color: var(--primary-purple);
            color: var(--primary-purple);
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 0 0 #dfe6e9;
        }

        /* Correct/Wrong States */
        .answer-btn.correct {
            background-color: var(--correct-green);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 5px 0 #00b85c;
        }

        .answer-btn.wrong {
            background-color: var(--wrong-red);
            color: white;
            border-color: #e63b49;
            box-shadow: 0 5px 0 #e63b49;
            animation: shake 0.5s;
        }

        .answer-btn:disabled {
            cursor: default;
            opacity: 0.7;
            transform: none !important;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background-color: #e3f2fd;
            border: 2px dashed #2196f3;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: popIn 0.4s ease-out;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: #1565c0;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #37474f;
            white-space: pre-line; /* Respect line breaks */
        }
        
        .explanation-content strong {
            color: #d35400;
        }

        /* Footer/Submit */
        .footer-controls {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .submit-btn {
            background-color: var(--primary-purple);
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 8px 0 #6c4299;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 0 #6c4299;
        }
        
        .submit-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #6c4299;
        }

        /* Result Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 4px solid var(--primary-teal);
            box-shadow: 0 20px 0 rgba(0,0,0,0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary-purple);
            margin: 20px 0;
        }

        .message {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #2d3436;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Ms. Chí Nên</h1>
            <div class="subtitle">🎓 Grade 6 - Unit 8: Films & Adjectives 🎬</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div style="font-weight: bold; color: var(--primary-purple);">
                Điểm số: <span id="currentScore">0</span> / 25
            </div>
        </header>

        <!-- Quiz Container -->
        <div id="quiz-container">
            <!-- Questions will be injected here by JS -->
        </div>

        <div class="footer-controls">
            <button class="submit-btn" onclick="finishQuiz()">Nộp Bài & Xem Điểm 🏁</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary-teal); font-size: 2rem; margin:0;">KẾT QUẢ</h2>
            <div class="score-display" id="finalScore">0/25</div>
            <p class="message" id="finalMessage">Tuyệt vời!</p>
            <button class="submit-btn" onclick="closeModal()">Xem lại bài làm</button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sound-cheer" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <script>
        // --- DATASET ---
        const quizData = {

            {

              "answerOptions": [
                {
                  "text": "B. lovely",
                  "rationale": "Giải thích: Sau động từ chỉ giác quan (look, feel, taste...) ta dùng **Tính từ (Adjective)**.\n- lovely (adj): đáng yêu, xinh đẹp. (Lưu ý: đuôi -ly nhưng là tính từ).\n- love (v/n): yêu\n- loving (adj): âu yếm\n- lovelily (không dùng dạng này phổ biến)\n\nDịch: Trong bữa tiệc tối qua, cô ấy trông thật xinh đẹp trong chiếc váy đỏ.",
                  "isCorrect": true
                },
                { "text": "A. love", "isCorrect": false },
                { "text": "C. loving", "isCorrect": false },
                { "text": "D. lovelily", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 3,
              "question": "Is Minh __________ with the final semester’s result?",
              "answerOptions": [
                {
                  "text": "B. satisfied",
                  "rationale": "Giải thích: Tính từ đuôi **-ed** dùng để chỉ cảm xúc của con người. Cấu trúc: **be satisfied with** (hài lòng với).\n- satisfy (v): làm hài lòng\n- satisfying (adj -ing): mang tính thỏa mãn (tính chất sự vật)\n\nDịch: Minh có hài lòng với kết quả học kỳ cuối không?",

                { "text": "A. satisfy", "isCorrect": false },
                { "text": "C. satisfying", "isCorrect": false },
                { "text": "D. be satisfying", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 4,
              "question": "The ending of the film is __________. All audiences are very sad.",
              "answerOptions": [
                {
                  "text": "C. disappointing",
                  "rationale": "Giải thích: Chủ ngữ là 'The ending' (sự vật) -> Dùng tính từ đuôi **-ing** để chỉ tính chất. Vì khán giả buồn (sad), nên cái kết mang tính 'gây thất vọng'.\n- disappointed (adj -ed): cảm thấy thất vọng (người)\n- satisfying (adj): thỏa mãn (tích cực -> sai ngữ cảnh)\n- satisfied (adj): hài lòng\n\nDịch: Kết thúc của bộ phim thật đáng thất vọng. Tất cả khán giả đều rất buồn.",
                  "isCorrect": true
                },
                { "text": "A. disappointed", "isCorrect": false },
                { "text": "B. satisfying", "isCorrect": false },
                { "text": "D. satisfied", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 5,
              "question": "This is a __________ film and it makes me cry a lot.",
              "answerOptions": [
                {
                  "text": "B. moving",
                  "rationale": "Giải thích: Từ khóa 'makes me cry' (làm tôi khóc) -> phim cảm động.\n- moving (adj): cảm động\n- funny (adj): hài hước\n- comedy (n): phim hài\n- excited (adj): hào hứng (cảm xúc người)\n\nDịch: Đây là một bộ phim cảm động và nó làm tôi khóc rất nhiều.",
                  "isCorrect": true

                { "text": "A. funny", "isCorrect": false },
                { "text": "C. comedy", "isCorrect": false },
                { "text": "D. excited", "isCorrect": false }

            {

                {

                  "rationale": "Giải thích: Mệnh đề chỉ sự tương phản (Giàu có >< Keo kiệt). Sau chỗ trống là một mệnh đề (S + V: he is...) nên dùng **Although**.\n- Although + S + V: Mặc dù\n- Despite + Noun/V-ing: Mặc dù\n- Because/Because of: Bởi vì (sai nghĩa)\n\nDịch: Mặc dù ông ấy là giám đốc điều hành và kiếm rất nhiều tiền, ông ấy rất keo kiệt.",

                { "text": "D. Because of", "isCorrect": false }

            {

                {

                  "isCorrect": true
                },
                { "text": "A. horror film", "isCorrect": false },
                { "text": "B. sci-fi", "isCorrect": false },
                { "text": "C. comedy", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 8,
              "question": "He __________ the Oscar Prize as the best actress this year.",
              "answerOptions": [
                {
                  "text": "A. wins",
                  "rationale": "Giải thích: Động từ đi với giải thưởng (Prize) là 'win'. (Lưu ý: Đề bài dùng 'He' nhưng giải lại là 'actress' - nữ diễn viên, đây có thể là lỗi in ấn của đề, nhưng về mặt ngữ pháp động từ thì 'wins' là đúng nhất).\n- win (v): giành chiến thắng/đạt giải\n- act (v): diễn\n- perform (v): biểu diễn\n- direct (v): đạo diễn\n\nDịch: Anh ấy giành giải Oscar cho [vai nam] diễn viên xuất sắc nhất năm nay.",

                { "text": "B. acts", "isCorrect": false },
                { "text": "C. performs", "isCorrect": false },
                { "text": "D. directs", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 9,
              "question": "She is hard working __________, she isn’t lucky in examinations.",
              "answerOptions": [
                {
                  "text": "B. But",
                  "rationale": "Giải thích: Hai vế câu mang nghĩa tương phản (chăm chỉ >< không may mắn), ngăn cách bởi dấu phẩy.\n- But: nhưng (nối 2 mệnh đề)\n- However: tuy nhiên (thường đứng đầu câu hoặc sau dấu chấm phẩy ';')\n- Therefore/So: vì vậy (chỉ kết quả -> sai nghĩa)\n\nDịch: Cô ấy chăm chỉ, nhưng cô ấy không may mắn trong các kỳ thi.",

            },
            {

              "question": "She decided to quit this job __________ the low salary.",

            {

            {

              "question": "That was a __________ and boring horror film so I slept from the beginning to the end.",
              "answerOptions": [

                  "rationale": "Giải thích: Từ khóa 'boring' (nhàm chán) và 'slept' (ngủ) -> Cần một tính từ mang nghĩa tiêu cực.\n- predictable (adj): dễ đoán (gây nhàm chán)\n- shocking (adj): gây sốc\n- entertaining (adj): mang tính giải trí\n- gripping (adj): lôi cuốn\n\nDịch: Đó là một bộ phim kinh dị dễ đoán và nhàm chán nên tôi đã ngủ từ đầu đến cuối.",

        // --- STATE & LOGIC ---
        let score = 0;
        const totalQuestions = quizData.questions.length;

        const container = document.getElementById('quiz-container');
        const progressBar = document.getElementById('progressBar');
        const scoreSpan = document.getElementById('currentScore');
        
        // Sound Effects
        const soundCorrect = document.getElementById('sound-correct');
        const soundWrong = document.getElementById('sound-wrong');
        const soundCheer = document.getElementById('sound-cheer');

        function initQuiz() {
            quizData.questions.forEach((q, index) => {
                // Determine the correct rationale object to find correct option text for filtering
                // Though logic below uses the isCorrect flag directly.
                
                // Shuffle options for randomness (Optional - keeping original order for now as per A,B,C,D text)
                // If we shuffle, we must remove A, B, C, D from the text string, but let's keep it simple.

                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `q-card-${index}`;

                // Header Badge
                const badge = document.createElement('div');
                badge.className = 'question-badge';
                badge.innerText = `Câu hỏi ${q.questionNumber}`;
                card.appendChild(badge);

                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = q.question;
                card.appendChild(qText);

                // Options Grid
                const grid = document.createElement('div');
                grid.className = 'options-grid';

                // Find Correct Answer Info for Explanation
                const correctOpt = q.answerOptions.find(opt => opt.isCorrect);
                const explanationText = correctOpt.rationale.replace(/\n/g, '<br>');

                q.answerOptions.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'answer-btn';
                    btn.innerText = opt.text;
                    btn.onclick = (e) => checkAnswer(e.target, opt.isCorrect, index, explanationText);
                    grid.appendChild(btn);
                });
                card.appendChild(grid);

                // Explanation Box
                const explainBox = document.createElement('div');
                explainBox.className = 'explanation-box';
                explainBox.id = `explain-${index}`;
                explainBox.innerHTML = `
                    <div class="explanation-header">
                        <span>👩‍🏫</span> Ms. Chí Nên giải thích:
                    </div>
                    <div class="explanation-content">
                        ${explanationText}
                    </div>
                `;
                card.appendChild(explainBox);

                container.appendChild(card);
            });
        }

        function checkAnswer(btn, isCorrect, questionIndex, rationale) {
            const card = document.getElementById(`q-card-${questionIndex}`);
            const buttons = card.querySelectorAll('.answer-btn');
            const explanation = document.getElementById(`explain-${questionIndex}`);

            // Disable all buttons in this card
            buttons.forEach(b => {
                b.disabled = true;
                // Highlight the correct answer even if they chose wrong
                const btnText = b.innerText;
                // Note: In a real robust app we'd map IDs. Here we check logic from data.
                // We need to find which button corresponds to the correct answer visually.
                // A simplified way since we have the button element:
            });

            // Re-loop to highlight correct answer visually
            const currentQuestion = quizData.questions[questionIndex];
            buttons.forEach((b, idx) => {
                if (currentQuestion.answerOptions[idx].isCorrect) {
                     b.classList.add('correct'); // Always show the correct one green
                }
            });

            if (isCorrect) {
                // User chose correctly
                score++;
                scoreSpan.innerText = score;
                soundCorrect.currentTime = 0;
                soundCorrect.play();
                
                // Confetti Effect
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00C9A7', '#8854C0', '#FFD700']
                });

            } else {
                // User chose wrongly
                btn.classList.add('wrong'); // Add red shake to clicked button
                soundWrong.currentTime = 0;
                soundWrong.play();
            }

            // Update Progress
            const completed = document.querySelectorAll('.answer-btn:disabled').length / 4; // Approx logic or just count questions answered
            // Better progress logic:
            const totalAnswered = document.querySelectorAll('.explanation-box[style*="display: block"]').length + 1;
            const percent = (totalAnswered / totalQuestions) * 100;
            progressBar.style.width = `${percent}%`;

            // Show Explanation
            explanation.style.display = 'block';
        }

        function finishQuiz() {
            const modal = document.getElementById('resultModal');
            const finalScore = document.getElementById('finalScore');
            const finalMessage = document.getElementById('finalMessage');

            finalScore.innerText = `${score} / ${totalQuestions}`;
            
            let msg = "";
            const ratio = score / totalQuestions;
            if (ratio === 1) {
                msg = "Xuất sắc! Em là thiên tài tiếng Anh! 🌟🏆";
                soundCheer.play();
                confetti({ particleCount: 500, spread: 180 });
            } else if (ratio >= 0.8) {
                msg = "Làm tốt lắm! Em rất nắm chắc kiến thức! 👏";
                soundCheer.play();
            } else if (ratio >= 0.5) {
                msg = "Khá tốt! Cố gắng ôn lại phần giải thích nhé! 💪";
            } else {
                msg = "Đừng buồn! Hãy đọc kỹ giải thích của cô và làm lại nhé! 🌱";
            }
            finalMessage.innerText = msg;

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        initQuiz();
