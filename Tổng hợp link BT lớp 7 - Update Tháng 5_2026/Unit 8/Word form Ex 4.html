    <style>
        /* Custom Styles for Gamification */
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4; /* Light green tint */
            background-image: radial-gradient(#00C9A7 1px, transparent 1px), radial-gradient(#00C9A7 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #2d3748;
        }

        .header-bg {
            background: linear-gradient(135deg, #8854C0 0%, #6c5ce7 100%);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.4);
        }

        .card-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-bottom: 6px solid #e2e8f0;
            transition: transform 0.3s ease;
        }

        /* 3D Button Styles */
        .btn-option {
            transition: all 0.1s;
            border: 2px solid #e2e8f0;
            background-color: white;
            box-shadow: 0 5px 0 #cbd5e0;
            border-radius: 16px;
            font-weight: 700;
            color: #4a5568;
            position: relative;
            overflow: hidden;
        }

        .btn-option:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .btn-option.correct {
            background-color: #00D26A !important;
            border-color: #00b85c !important;
            box-shadow: 0 5px 0 #009e4f !important;
            color: white !important;
        }
        
        .btn-option.correct:active {
            box-shadow: none !important;
        }

        .btn-option.incorrect {
            background-color: #FF4757 !important;
            border-color: #ff2e40 !important;
            box-shadow: 0 5px 0 #d61c2e !important;
            color: white !important;
        }

        .btn-option.incorrect:active {
            box-shadow: none !important;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .explanation-box {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 5px solid #8854C0;
        }

        .marker-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 800;
            margin-right: 5px;
        }
        
        .badge-A { background: #FF9F43; color: white; }
        .badge-B { background: #54a0ff; color: white; }
        .badge-C { background: #5f27cd; color: white; }
        .badge-D { background: #ff6b6b; color: white; }

        .submit-btn {
            background: #00C9A7;
            color: white;
            box-shadow: 0 6px 0 #009e86;
        }
        .submit-btn:hover { background: #00b899; }
        .submit-btn:active { transform: translateY(6px); box-shadow: none; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #8854C0; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #6c5ce7; }
        
        /* Teacher Badge */
        .teacher-badge {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Script -->
    <script>
        // --- DATA ---
        const quizData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "It's bad for young kids to see ________ on TV.",
              "answerOptions": [
                { "text": "violent", "type": "adj", "meaning": "bạo lực, hung dữ" },
                { "text": "violence", "type": "n", "meaning": "sự bạo lực, hành vi bạo lực" },
                { "text": "violently", "type": "adv", "meaning": "một cách bạo lực" },
                { "text": "violates", "type": "v", "meaning": "vi phạm" }
              ],
              "correctIndex": 1,
              "explanation": {
                "translation": "Thật không tốt cho trẻ nhỏ khi xem những cảnh bạo lực trên TV.",
                "whyCorrect": "Sau động từ 'see' và để chỉ một khái niệm chung trên TV, ta cần một Danh từ (Noun) đóng vai trò tân ngữ trả lời cho câu hỏi 'see what?'. Cụm 'violence on TV' là một collocation phổ biến.",
                "whyWrong": "<b>violent</b> là tính từ. <b>violently</b> là trạng từ. <b>violates</b> là động từ chia ngôi thứ 3. Tất cả đều không đứng làm tân ngữ trực tiếp được trong ngữ cảnh này."
              }
            },
            {
              "questionNumber": 2,
              "question": "This is a ________ story, you shouldn't read it alone.",
              "answerOptions": [
                { "text": "frighten", "type": "v", "meaning": "làm hoảng sợ" },
                { "text": "frightened", "type": "adj", "meaning": "bị làm cho hoảng sợ (cảm xúc)" },
                { "text": "frightening", "type": "adj", "meaning": "đáng sợ (tính chất)" },
                { "text": "fright", "type": "n", "meaning": "sự hoảng sợ" }
              ],
              "correctIndex": 2,
              "explanation": {
                "translation": "Đây là một câu chuyện đáng sợ, bạn không nên đọc nó một mình.",
                "whyCorrect": "Cần một tính từ bổ nghĩa cho danh từ 'story' (câu chuyện). Vì câu chuyện GÂY RA nỗi sợ (tính chất chủ động), ta dùng tính từ đuôi -ing (frightening).",
                "whyWrong": "<b>frightened</b> (đuôi -ed) dùng để chỉ cảm xúc của người bị tác động (Ví dụ: I am frightened). <b>frighten</b> là động từ. <b>fright</b> là danh từ."
              }
            },
            {
              "questionNumber": 3,
              "question": "Titanic is a ________ movie. It has a sad ending and everyone cries watching it.",
              "answerOptions": [
                { "text": "moving", "type": "adj", "meaning": "cảm động (gây xúc động)" },
                { "text": "moved", "type": "adj", "meaning": "bị cảm động (cảm xúc)" },
                { "text": "movement", "type": "n", "meaning": "sự chuyển động" },
                { "text": "move", "type": "v", "meaning": "di chuyển" }
              ],
              "correctIndex": 0,
              "explanation": {
                "translation": "Titanic là một bộ phim cảm động. Nó có kết thúc buồn và mọi người đều khóc khi xem.",
                "whyCorrect": "Cần tính từ chỉ tính chất của bộ phim (chủ ngữ gây ra cảm xúc). Bộ phim làm người khác xúc động nên dùng tính từ đuôi -ing (moving).",
                "whyWrong": "<b>moved</b> dùng cho cảm xúc người xem. <b>movement</b> là danh từ chỉ sự di chuyển vật lý. <b>move</b> là động từ."
              }
            },
            {
              "questionNumber": 4,
              "question": "Paul Walker has won Oscar for the best ________.",
              "answerOptions": [
                { "text": "acting", "type": "n/v", "meaning": "diễn xuất" },
                { "text": "actor", "type": "n", "meaning": "nam diễn viên" },
                { "text": "action", "type": "n", "meaning": "hành động" },
                { "text": "active", "type": "adj", "meaning": "năng động" }
              ],
              "correctIndex": 1,
              "explanation": {
                "translation": "Paul Walker đã giành giải Oscar cho nam diễn viên xuất sắc nhất.",
                "whyCorrect": "Paul Walker là người. Giải thưởng Oscar thường trao cho các hạng mục như 'Best Actor' (Nam diễn viên xuất sắc nhất) hoặc 'Best Actress'. Đây là cụm từ cố định.",
                "whyWrong": "<b>acting</b> là kỹ năng diễn xuất, giải thưởng thường gọi tên người nhận (Actor). <b>action</b> (phim hành động). <b>active</b> là tính từ."
              }
            },
            {
              "questionNumber": 5,
              "question": "This girl sings ________ although she is a ________.",
              "answerOptions": [
                { "text": "bad / singer", "type": "adj / n", "meaning": "tệ / ca sĩ" },
                { "text": "badly / sing", "type": "adv / v", "meaning": "tệ / hát" },
                { "text": "badly / singer", "type": "adv / n", "meaning": "một cách tồi tệ / ca sĩ" },
                { "text": "bad / song", "type": "adj / n", "meaning": "tệ / bài hát" }
              ],
              "correctIndex": 2,
              "explanation": {
                "translation": "Cô gái này hát dở tệ mặc dù cô ấy là một ca sĩ.",
                "whyCorrect": "Vị trí 1: Bổ nghĩa cho động từ thường 'sings' cần một Trạng từ (Adv) -> <b>badly</b>. Vị trí 2: Sau mạo từ 'a' cần một Danh từ chỉ người (nghề nghiệp) phù hợp ngữ cảnh -> <b>singer</b>.",
                "whyWrong": "<b>bad</b> là tính từ không bổ nghĩa cho động từ 'sing'. <b>sing</b> là động từ không đứng sau 'a'. <b>song</b> không hợp lý về nghĩa (cô ấy là một bài hát)."
              }
            },
            {
              "questionNumber": 6,
              "question": "This film made a strong ________ on me.",
              "answerOptions": [
                { "text": "impress", "type": "v", "meaning": "gây ấn tượng" },
                { "text": "impression", "type": "n", "meaning": "sự ấn tượng" },
                { "text": "impressive", "type": "adj", "meaning": "đầy ấn tượng" },
                { "text": "impressively", "type": "adv", "meaning": "một cách ấn tượng" }
              ],
              "correctIndex": 1,
              "explanation": {
                "translation": "Bộ phim này đã tạo một ấn tượng mạnh mẽ đối với tôi.",
                "whyCorrect": "Cấu trúc Collocation: 'make an impression on somebody' (gây ấn tượng với ai). Sau tính từ 'strong' ta cần một danh từ.",
                "whyWrong": "<b>impress</b> là động từ. <b>impressive</b> là tính từ (không đứng sau 'strong' nếu không có danh từ đi kèm). <b>impressively</b> là trạng từ."
              }
            },
            {
              "questionNumber": 7,
              "question": "Have you ever seen this comedy? It's really ________.",
              "answerOptions": [
                { "text": "funny", "type": "adj", "meaning": "buồn cười, hài hước" },
                { "text": "funnily", "type": "adv", "meaning": "một cách buồn cười" },
                { "text": "fun", "type": "n/adj", "meaning": "niềm vui" },
                { "text": "funs", "type": "n", "meaning": "không dùng dạng này" }
              ],
              "correctIndex": 0,
              "explanation": {
                "translation": "Bạn đã xem phim hài này chưa? Nó thực sự rất buồn cười.",
                "whyCorrect": "Đang nói về 'comedy' (phim hài), nên tính từ 'funny' (gây cười/hài hước) là từ chính xác nhất để miêu tả tính chất đặc trưng của nó.",
                "whyWrong": "<b>funnily</b> là trạng từ. <b>fun</b> thường chỉ sự vui vẻ chung chung (enjoyable), còn phim hài thì phải là <b>funny</b> (humorous)."
              }
            },
            {
              "questionNumber": 8,
              "question": "The film was ________ though they spent millions of dollars making it.",
              "answerOptions": [
                { "text": "successful", "type": "adj", "meaning": "thành công" },
                { "text": "success", "type": "n", "meaning": "sự thành công" },
                { "text": "unsuccessful", "type": "adj", "meaning": "không thành công, thất bại" },
                { "text": "succeed", "type": "v", "meaning": "thành công" }
              ],
              "correctIndex": 2,
              "explanation": {
                "translation": "Bộ phim đã không thành công mặc dù họ đã tiêu hàng triệu đô la để làm nó.",
                "whyCorrect": "Từ 'though' (mặc dù) báo hiệu sự tương phản. Tiêu hàng triệu đô (kỳ vọng cao) NHƯNG kết quả tệ -> Cần tính từ mang nghĩa phủ định 'unsuccessful'.",
                "whyWrong": "<b>successful</b> (thành công) không tạo ra sự tương phản với 'though'. <b>success</b> là danh từ (sau tobe 'was' cần tính từ). <b>succeed</b> là động từ."
              }
            },
            {
              "questionNumber": 9,
              "question": "I love action films. They're very ________.",
              "answerOptions": [
                { "text": "excited", "type": "adj", "meaning": "hào hứng (cảm xúc)" },
                { "text": "exciting", "type": "adj", "meaning": "thú vị, kịch tính (tính chất)" },
                { "text": "excitement", "type": "n", "meaning": "sự hào hứng" },
                { "text": "excite", "type": "v", "meaning": "kích thích" }
              ],
              "correctIndex": 1,
              "explanation": {
                "translation": "Tôi thích phim hành động. Chúng rất kịch tính/thú vị.",
                "whyCorrect": "Chủ ngữ là 'They' (thay cho action films). Phim hành động mang lại sự hào hứng cho người xem (tính chất chủ động) nên dùng tính từ đuôi -ing (exciting).",
                "whyWrong": "<b>excited</b> dùng cho người (I am excited). <b>excitement</b> là danh từ. <b>excite</b> là động từ."
              }
            },
            {
              "questionNumber": 10,
              "question": "Big Ben Down is about a group of ________ who take control of Big Ben.",
              "answerOptions": [
                { "text": "terror", "type": "n", "meaning": "sự kinh hoàng" },
                { "text": "terrorists", "type": "n", "meaning": "những kẻ khủng bố" },
                { "text": "terrorism", "type": "n", "meaning": "chủ nghĩa khủng bố" },
                { "text": "terrifies", "type": "v", "meaning": "làm khiếp sợ" }
              ],
              "correctIndex": 1,
              "explanation": {
                "translation": "Big Ben Down nói về một nhóm những kẻ khủng bố chiếm quyền kiểm soát tháp Big Ben.",
                "whyCorrect": "Cụm 'a group of...' (một nhóm...) cần danh từ đếm được số nhiều chỉ NGƯỜI thực hiện hành động 'take control'.",
                "whyWrong": "<b>terror</b> và <b>terrorism</b> là danh từ trừu tượng, không phải người. <b>terrifies</b> là động từ."
              }
            },
            {
              "questionNumber": 11,
              "question": "We were ________ with the service at the cinema. Everything was terrible.",
              "answerOptions": [
                { "text": "satisfied", "type": "adj", "meaning": "hài lòng" },
                { "text": "satisfying", "type": "adj", "meaning": "làm thỏa mãn" },
                { "text": "dissatisfied", "type": "adj", "meaning": "không hài lòng, bất mãn" },
                { "text": "satisfaction", "type": "n", "meaning": "sự hài lòng" }
              ],
              "correctIndex": 2,
              "explanation": {
                "translation": "Chúng tôi đã không hài lòng với dịch vụ tại rạp chiếu phim. Mọi thứ đều tồi tệ.",
                "whyCorrect": "Chủ ngữ 'We' chỉ người -> dùng tính từ đuôi -ed. Ngữ cảnh 'terrible' (tồi tệ) -> cần tính từ mang nghĩa phủ định (dissatisfied).",
                "whyWrong": "<b>satisfied</b> (hài lòng) mâu thuẫn với 'terrible'. <b>satisfying</b> dùng cho vật. <b>satisfaction</b> là danh từ."
              }
            },
            {
              "questionNumber": 12,
              "question": "The film is a big ________. It is boring from beginning to end.",
              "answerOptions": [
                { "text": "disappointing", "type": "adj", "meaning": "gây thất vọng" },
                { "text": "disappointment", "type": "n", "meaning": "sự thất vọng, nỗi thất vọng" },
                { "text": "disappointed", "type": "adj", "meaning": "bị thất vọng" },
                { "text": "disappoint", "type": "v", "meaning": "gây thất vọng" }
              ],
              "correctIndex": 1,
              "explanation": {
                "translation": "Bộ phim là một nỗi thất vọng lớn. Nó nhàm chán từ đầu đến cuối.",
                "whyCorrect": "Cấu trúc 'a big + Noun'. 'Disappointment' ở đây ám chỉ bộ phim (vật) là một 'nỗi thất vọng'.",
                "whyWrong": "<b>disappointing</b> là tính từ, thiếu danh từ theo sau. <b>disappointed</b> chỉ cảm xúc người. <b>disappoint</b> là động từ."
              }
            }
          ]
        };

        let userAnswers = {};
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- SOUND SYSTEM (Synthesized) ---
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding sound (High pitch sine wave fade out)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                // Buzz sound (Low pitch sawtooth)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- RENDER LOGIC ---
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            quizData.questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = "card-container p-6 relative";
                card.id = `q-card-${index}`;

                // Question Header
                const qHeader = `
                    <div class="flex items-start mb-6">
                        <div class="bg-[#8854C0] text-white rounded-lg w-10 h-10 flex-shrink-0 flex items-center justify-center font-bold text-lg mr-4 shadow-md">
                            ${index + 1}
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 leading-snug pt-1">${q.question}</h3>
                    </div>
                `;

                // Options Grid
                let optionsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">';
                q.answerOptions.forEach((opt, optIndex) => {
                    const badge = optIndex === 0 ? 'A' : optIndex === 1 ? 'B' : optIndex === 2 ? 'C' : 'D';
                    optionsHtml += `
                        <button id="btn-${index}-${optIndex}" onclick="checkAnswer(${index}, ${optIndex})" 
                            class="btn-option w-full py-4 px-6 text-left flex items-center group">
                            <span class="marker-badge badge-${badge} w-8 h-8 flex items-center justify-center rounded-md mr-3 shadow-sm text-sm">${badge}</span>
                            <span class="text-lg">${opt.text}</span>
                        </button>
                    `;
                });
                optionsHtml += '</div>';

                // Explanation Area (Hidden by default)
                const explanationHtml = `
                    <div id="explanation-${index}" class="hidden explanation-box bg-purple-50 p-6 rounded-r-xl rounded-bl-xl mt-4">
                        <div class="flex items-center mb-3">
                            <div class="bg-[#00C9A7] text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mr-2">
                                <i class="fa-solid fa-lightbulb mr-1"></i> Giải thích chi tiết
                            </div>
                            <span class="text-xs text-gray-500 font-semibold italic">Ms. Chí Nên</span>
                        </div>
                        
                        <!-- 1. Translation -->
                        <div class="mb-4 pb-3 border-b border-purple-100">
                            <p class="font-bold text-[#8854C0] text-sm uppercase mb-1"><i class="fa-solid fa-language mr-1"></i> Dịch câu hỏi:</p>
                            <p class="text-gray-700 italic">"${q.explanation.translation}"</p>
                        </div>

                        <!-- 2. Option Analysis -->
                        <div class="mb-4">
                            <p class="font-bold text-[#8854C0] text-sm uppercase mb-2"><i class="fa-solid fa-magnifying-glass mr-1"></i> Phân tích từ vựng:</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
                                ${q.answerOptions.map((opt, i) => {
                                    const label = i === 0 ? 'A' : i === 1 ? 'B' : i === 2 ? 'C' : 'D';
                                    const isCorrect = i === q.correctIndex;
                                    const colorClass = isCorrect ? "text-green-600 font-bold bg-green-50" : "text-gray-600";
                                    return `<div class="${colorClass} p-1 rounded"><span class="font-extrabold mr-1">${label}.</span> ${opt.text} <span class="text-xs text-gray-500">(${opt.type}):</span> ${opt.meaning}</div>`;
                                }).join('')}
                            </div>
                        </div>

                        <!-- 3. Why Correct -->
                        <div class="mb-3">
                            <p class="font-bold text-green-600 text-sm uppercase mb-1"><i class="fa-solid fa-check-circle mr-1"></i> Tại sao ĐÚNG?</p>
                            <p class="text-gray-700 text-sm leading-relaxed">${q.explanation.whyCorrect}</p>
                        </div>

                        <!-- 4. Why Wrong -->
                        <div>
                            <p class="font-bold text-red-500 text-sm uppercase mb-1"><i class="fa-solid fa-circle-xmark mr-1"></i> Tại sao SAI?</p>
                            <p class="text-gray-700 text-sm leading-relaxed">${q.explanation.whyWrong}</p>
                        </div>
                    </div>
                `;

                card.innerHTML = qHeader + optionsHtml + explanationHtml;
                container.appendChild(card);
            });
            
            updateProgressBar();
        }

        // --- INTERACTION LOGIC ---
        function checkAnswer(questionIndex, selectedIndex) {
            // Prevent re-answering
            if (userAnswers[questionIndex] !== undefined) return;

            const question = quizData.questions[questionIndex];
            const isCorrect = selectedIndex === question.correctIndex;
            userAnswers[questionIndex] = isCorrect;

            const btnSelected = document.getElementById(`btn-${questionIndex}-${selectedIndex}`);
            const btnCorrect = document.getElementById(`btn-${questionIndex}-${question.correctIndex}`);
            const card = document.getElementById(`q-card-${questionIndex}`);

            // Visual Feedback & Sound
            if (isCorrect) {
                btnSelected.classList.add('correct');
                playSound('correct');
                // Confetti specific to this card position (approximate)
                confetti({
                    particleCount: 50,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00C9A7', '#8854C0', '#ffbe76']
                });
            } else {
                btnSelected.classList.add('incorrect');
                btnCorrect.classList.add('correct'); // Show correct answer
                playSound('incorrect');
                // Shake animation
                card.classList.add('shake-anim');
                setTimeout(() => card.classList.remove('shake-anim'), 500);
            }

            // Disable all buttons in this question
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`btn-${questionIndex}-${i}`);
                btn.classList.add('cursor-default');
                btn.onclick = null; // Remove handler
                if (i !== selectedIndex && i !== question.correctIndex) {
                    btn.classList.add('opacity-50');
                }
            }

            // Show Explanation immediately
            const expBox = document.getElementById(`explanation-${questionIndex}`);
            expBox.classList.remove('hidden');

            updateProgressBar();
        }

        function updateProgressBar() {
            const total = quizData.questions.length;
            const answered = Object.keys(userAnswers).length;
            const pct = (answered / total) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function calculateResult() {
            const total = quizData.questions.length;
            const answered = Object.keys(userAnswers).length;

            if (answered < total) {
                const confirmSubmit = confirm(`Bạn mới làm ${answered}/${total} câu. Bạn có chắc chắn muốn nộp bài không?`);
                if (!confirmSubmit) return;
            }

            let score = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === true) score++;
            }

            // Feedback Logic
            const percentage = (score / total) * 100;
            let feedback = "";
            let iconClass = "fa-trophy text-yellow-400";
            
            if (percentage === 100) {
                feedback = "Xuất sắc! Bạn là thiên tài Word Form! 🌟";
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
            } else if (percentage >= 80) {
                feedback = "Rất tốt! Bạn nắm rất chắc kiến thức! 🔥";
            } else if (percentage >= 50) {
                feedback = "Khá lắm! Cố gắng thêm một chút nữa nhé! 💪";
                iconClass = "fa-thumbs-up text-blue-400";
            } else {
                feedback = "Đừng buồn! Hãy xem lại phần giải thích kỹ hơn nhé! 📚";
                iconClass = "fa-book-open-reader text-gray-400";
            }

            document.getElementById('score-text').innerText = `${score}/${total}`;
            document.getElementById('feedback-text').innerText = feedback;
            document.getElementById('modal-icon').className = `fa-solid ${iconClass} text-6xl drop-shadow-md`;
            
            document.getElementById('result-modal').classList.remove('hidden');
            playSound('correct'); // Final ding
        }

        function closeModal() {
            // Reload page to reset
            window.scrollTo(0, 0);
            location.reload();
        }

        // Initial Render
        renderQuiz();

    </script>
</body>
</html>
