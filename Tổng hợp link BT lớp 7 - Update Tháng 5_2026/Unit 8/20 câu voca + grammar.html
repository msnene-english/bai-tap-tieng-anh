<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 7 - Ex6: Conjunctions & Vocab - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Tím hồng */
            --primary-dark: #6c4299;
            --secondary: #00C9A7; /* Xanh ngọc */
            --secondary-dark: #00a186;
            --correct: #00D26A; /* Xanh lá */
            --correct-dark: #00a855;
            --wrong: #FF4757; /* Đỏ cam */
            --wrong-dark: #d6303e;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2f3542;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1d8e0 20%, transparent 20%),
                              radial-gradient(#d1d8e0 20%, transparent 20%);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            color: var(--primary);
            font-size: 2rem;
            text-shadow: 2px 2px 0px #ffffff;
            margin: 0;
            background: white;
            padding: 10px 20px;
            border-radius: 15px;
            border: 3px solid var(--primary);
            box-shadow: 5px 5px 0px rgba(136, 84, 192, 0.3);
            display: inline-block;
        }

        .teacher-tag {
            display: block;
            margin-top: 5px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--secondary-dark);
            background: #e0fbf6;
            padding: 5px 15px;
            border-radius: 20px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        /* Main Container */
        .quiz-container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            border-bottom: 6px solid #e1e1e1;
            animation: slideIn 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 1.1rem;
            font-weight: 800;
            color: #a4b0be;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.5;
            color: #2f3542;
            margin-bottom: 25px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 1.5rem; }
            .question-text { font-size: 1.2rem; }
        }

        /* Buttons 3D Style */
        .option-btn {
            background: #ffffff;
            border: 2px solid #dfe4ea;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #57606f;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 0 #dfe4ea;
            position: relative;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 6px 0 #d1d8e0;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #dfe4ea;
        }

        .option-letter {
            background: #f1f2f6;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: 800;
            font-size: 0.9rem;
            color: #a4b0be;
            flex-shrink: 0;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background-color: var(--correct) !important;
            border-color: var(--correct-dark) !important;
            box-shadow: 0 4px 0 var(--correct-dark) !important;
            color: white !important;
        }
        .option-btn.correct .option-letter {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong) !important;
            border-color: var(--wrong-dark) !important;
            box-shadow: 0 4px 0 var(--wrong-dark) !important;
            color: white !important;
            animation: shake 0.5s;
        }
        .option-btn.wrong .option-letter {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        /* Disabled state after answer */
        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }
        .option-btn:disabled:hover {
            transform: none;
        }
        .option-btn.correct:disabled, .option-btn.wrong:disabled {
            opacity: 1;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            background: #f8f0ff;
            border-left: 5px solid var(--primary);
            border-radius: 10px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: expand 0.4s ease-out;
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .exp-header svg { width: 20px; height: 20px; }

        .exp-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2f3542;
        }

        /* Customizing the Markdown-like content from JSON */
        .exp-content p { margin: 8px 0; }
        .exp-content strong { color: var(--secondary-dark); }
        .exp-content ul { padding-left: 20px; list-style-type: none; background: white; padding: 15px; border-radius: 10px; border: 1px dashed #ced6e0; }
        .exp-content li { margin-bottom: 5px; position: relative; padding-left: 20px;}
        .exp-content li:before { content: '🔹'; position: absolute; left: -5px; top: 0; font-size: 0.8rem;}

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }
        
        @keyframes expand {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Progress & Footer */
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #dfe4ea;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #ced6e0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            width: 0%;
            transition: width 0.5s ease;
        }

        .submit-area {
            text-align: center;
            margin-top: 30px;
            padding-bottom: 50px;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 6px 0 var(--primary-dark);
            cursor: pointer;
            transition: all 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 var(--primary-dark);
        }
        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 var(--primary-dark);
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--secondary);
        }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }
        .message { font-size: 1.2rem; margin-bottom: 20px; color: #57606f; }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <span class="teacher-tag">Giáo viên: Ms. Chí Nên (ULIS)</span>
        <h1>Exercise 6: Conjunctions & Vocab</h1>
    </header>

    <div class="quiz-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div id="quiz-content">
            <!-- Questions will be injected here -->
        </div>

        <div class="submit-area">
            <button class="submit-btn" onclick="showFinalResult()">NỘP BÀI & XEM ĐIỂM</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="result-modal">
        <div class="result-card">
            <h2 style="color: var(--secondary);">KẾT QUẢ CỦA BẠN</h2>
            <div class="score-display" id="final-score">0/20</div>
            <p class="message" id="final-message">Bạn làm rất tốt!</p>
            <button class="submit-btn" style="background: var(--secondary); box-shadow: 0 6px 0 var(--secondary-dark);" onclick="closeModal()">Xem lại bài</button>
        </div>
    </div>

    <script>
        // --- DATA FROM USER INPUT ---
        const quizData = [
    {
      "questionNumber": 1,
      "question": "The ending of the film is ________. All audiences are very sad.",
      "options": [
        { "text": "disappointed", "isCorrect": false },
        { "text": "satisfying", "isCorrect": false },
        { "text": "disappointing", "isCorrect": true },
        { "text": "satisfied", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Tính từ đuôi -ing chỉ tính chất của sự vật.<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. disappointed (adj): thất vọng (cảm xúc)</li><li>B. satisfying (adj): thỏa mãn</li><li>C. disappointing (adj): gây thất vọng</li><li>D. satisfied (adj): hài lòng</li></ul><br><strong>Giải thích:</strong> Chủ ngữ là 'The ending of the film' (Kết thúc của phim) -> sự vật -> dùng tính từ đuôi -ing. Vì khán giả buồn (sad) nên kết phim phải gây thất vọng.<br><br><strong>Dịch câu:</strong> Kết thúc của bộ phim thật đáng thất vọng. Tất cả khán giả đều rất buồn."
    },
    {
      "questionNumber": 2,
      "question": "This is a ________ film and it makes me cry a lot.",
      "options": [
        { "text": "funny", "isCorrect": false },
        { "text": "moving", "isCorrect": true },
        { "text": "comedy", "isCorrect": false },
        { "text": "excited", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Phim cảm động làm rơi nước mắt.<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. funny (adj): hài hước</li><li>B. moving (adj): cảm động</li><li>C. comedy (n): phim hài</li><li>D. excited (adj): hào hứng</li></ul><br><strong>Giải thích:</strong> Cụm từ 'makes me cry a lot' (làm tôi khóc nhiều) cho thấy bộ phim chạm đến cảm xúc.<br><br><strong>Dịch câu:</strong> Đây là một bộ phim cảm động và nó làm tôi khóc rất nhiều."
    },
    {
      "questionNumber": 3,
      "question": "________ he is a CEO and earns a lot of money, he is very mean.",
      "options": [
        { "text": "Because", "isCorrect": false },
        { "text": "Although", "isCorrect": true },
        { "text": "Despite", "isCorrect": false },
        { "text": "Because of", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Sau 'Although' là một mệnh đề (S + V).<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. Because: Bởi vì</li><li>B. Although: Mặc dù (+ Mệnh đề)</li><li>C. Despite: Mặc dù (+ Noun/V-ing)</li><li>D. Because of: Bởi vì (+ Noun/V-ing)</li></ul><br><strong>Giải thích:</strong> 'he is a CEO...' là một mệnh đề có đầy đủ chủ ngữ và động từ. Hai vế tương phản (Giàu >< Keo kiệt) nên dùng 'Although'.<br><br><strong>Dịch câu:</strong> Mặc dù ông ấy là giám đốc điều hành và kiếm nhiều tiền, ông ấy rất keo kiệt."
    },
    {
      "questionNumber": 4,
      "question": "This is a (n) ________ on real life during wars in Vietnam in 1945.",
      "options": [
        { "text": "horror film", "isCorrect": false },
        { "text": "sci-fi", "isCorrect": false },
        { "text": "comedy", "isCorrect": false },
        { "text": "documentary", "isCorrect": true }
      ],
      "rationale": "✅ Đúng. Phim tài liệu nói về sự thật lịch sử.<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. horror film (n): phim kinh dị</li><li>B. sci-fi (n): phim khoa học viễn tưởng</li><li>C. comedy (n): phim hài</li><li>D. documentary (n): phim tài liệu</li></ul><br><strong>Giải thích:</strong> Từ khóa 'real life' (đời thực) và bối cảnh lịch sử 'wars in Vietnam in 1945' cho thấy đây là phim tài liệu.<br><br><strong>Dịch câu:</strong> Đây là một bộ phim tài liệu về đời sống thực trong chiến tranh ở Việt Nam năm 1945."
    },
    {
      "questionNumber": 5,
      "question": "She ________ the Oscar Prize as the best actress this year.",
      "options": [
        { "text": "wins", "isCorrect": true },
        { "text": "acts", "isCorrect": false },
        { "text": "performs", "isCorrect": false },
        { "text": "directs", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Chiến thắng giải thưởng.<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. wins (v): chiến thắng, giành được</li><li>B. acts (v): diễn xuất</li><li>C. performs (v): biểu diễn</li><li>D. directs (v): đạo diễn</li></ul><br><strong>Giải thích:</strong> Với giải thưởng (Prize), động từ phù hợp nhất là 'win'.<br><br><strong>Dịch câu:</strong> Cô ấy giành giải Oscar cho nữ diễn viên xuất sắc nhất năm nay."
    },
    {
      "questionNumber": 6,
      "question": "She is hard-working. ________, she isn't lucky in examinations.",
      "options": [
        { "text": "Therefore", "isCorrect": false },
        { "text": "But", "isCorrect": false },
        { "text": "However", "isCorrect": true },
        { "text": "So", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Đứng sau dấu chấm, trước dấu phẩy để chỉ sự tương phản.<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. Therefore (adv): Do đó, vì vậy</li><li>B. But (conj): Nhưng</li><li>C. However (adv): Tuy nhiên</li><li>D. So (conj): Vì vậy</li></ul><br><strong>Giải thích:</strong> Cấu trúc: [Câu 1]. However, [Câu 2]. Hai câu có ý nghĩa trái ngược: chăm chỉ >< không may mắn.<br><br><strong>Dịch câu:</strong> Cô ấy rất chăm chỉ. Tuy nhiên, cô ấy không may mắn trong các kỳ thi."
    },
    {
      "questionNumber": 7,
      "question": "Before you go to the cinema, you can watch the trailer and read ________ of the film.",
      "options": [
        { "text": "reviews", "isCorrect": true },
        { "text": "disaster", "isCorrect": false },
        { "text": "critic", "isCorrect": false },
        { "text": "character", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Bài đánh giá phim.<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. reviews (n): bài nhận xét, đánh giá</li><li>B. disaster (n): thảm họa</li><li>C. critic (n): nhà phê bình (người)</li><li>D. character (n): nhân vật</li></ul><br><strong>Giải thích:</strong> Chúng ta đọc các bài nhận xét (reviews) để biết phim hay hay dở trước khi xem.<br><br><strong>Dịch câu:</strong> Trước khi đến rạp, bạn có thể xem trailer và đọc các bài đánh giá về bộ phim."
    },
    {
      "questionNumber": 8,
      "question": "The film was so _______. However, my father saw it from beginning to end.",
      "options": [
        { "text": "interesting", "isCorrect": false },
        { "text": "exciting", "isCorrect": false },
        { "text": "boring", "isCorrect": true },
        { "text": "fascinating", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Phim chán nhưng vẫn xem hết -> Tương phản.<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. interesting (adj): thú vị</li><li>B. exciting (adj): hào hứng</li><li>C. boring (adj): nhàm chán</li><li>D. fascinating (adj): lôi cuốn</li></ul><br><strong>Giải thích:</strong> Từ 'However' (Tuy nhiên) báo hiệu sự trái ngược. Việc 'xem từ đầu đến cuối' là nỗ lực đáng khen, trái ngược với việc phim 'chán'.<br><br><strong>Dịch câu:</strong> Bộ phim rất nhàm chán. Tuy nhiên bố tôi đã xem nó từ đầu đến cuối."
    },
    {
      "questionNumber": 9,
      "question": "The end of the film was so _______ that many people cried.",
      "options": [
        { "text": "boring", "isCorrect": false },
        { "text": "shocking", "isCorrect": false },
        { "text": "exciting", "isCorrect": false },
        { "text": "moving", "isCorrect": true }
      ],
      "rationale": "✅ Đúng. Cảm động -> khóc.<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. boring (adj): chán</li><li>B. shocking (adj): gây sốc</li><li>C. exciting (adj): hào hứng</li><li>D. moving (adj): cảm động</li></ul><br><strong>Giải thích:</strong> Kết quả là 'many people cried' (nhiều người khóc) -> phim cảm động.<br><br><strong>Dịch câu:</strong> Kết thúc của phim quá cảm động đến nỗi nhiều người đã khóc."
    },
    {
      "questionNumber": 10,
      "question": "They are making this film based _______ a true story.",
      "options": [
        { "text": "to", "isCorrect": false },
        { "text": "after", "isCorrect": false },
        { "text": "on", "isCorrect": true },
        { "text": "for", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Cụm từ 'based on'.<br><br><strong>Phân tích & Dịch:</strong><ul><li>based on: dựa trên</li></ul><br><strong>Giải thích:</strong> Đây là cụm từ cố định (collocation): 'to be based on something' (được dựa trên cái gì).<br><br><strong>Dịch câu:</strong> Họ đang làm bộ phim này dựa trên một câu chuyện có thật."
    },
    {
      "questionNumber": 11,
      "question": "________ she has lots of money, she is very modest.",
      "options": [
        { "text": "Although", "isCorrect": true },
        { "text": "Because", "isCorrect": false },
        { "text": "However", "isCorrect": false },
        { "text": "Despite", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Cộng với mệnh đề, chỉ sự tương phản.<br><br><strong>Phân tích & Dịch:</strong><ul><li>A. Although (+ clause): Mặc dù</li><li>B. Because (+ clause): Bởi vì</li><li>C. However: Tuy nhiên</li><li>D. Despite (+ Noun/V-ing): Mặc dù</li></ul><br><strong>Giải thích:</strong> 'she has lots of money' là một mệnh đề (S+V). Hai vế đối lập (Nhiều tiền >< Khiêm tốn) -> Dùng Although.<br><br><strong>Dịch câu:</strong> Mặc dù cô ấy có nhiều tiền, cô ấy rất khiêm tốn."
    },
    {
      "questionNumber": 12,
      "question": "My younger sister didn’t choose that job ________ the salary was high.",
      "options": [
        { "text": "so", "isCorrect": false },
        { "text": "in spite of", "isCorrect": false },
        { "text": "though", "isCorrect": true },

        let score = 0;
        let answeredCount = 0;

        // --- SOUND LOGIC (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding sound (High pitch sine wave fade out)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                // Wrong sound (Low pitch sawtooth wobbly)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // --- RENDER QUIZ ---
        function renderQuiz() {
            const container = document.getElementById('quiz-content');
            
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                // Question Header
                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Question ${index + 1}`;
                
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = item.question;

                // Options Grid
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options-grid';

                const letters = ['A', 'B', 'C', 'D'];
                item.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span class="option-letter">${letters[i]}</span> ${opt.text}`;
                    btn.onclick = () => checkAnswer(index, i, opt.isCorrect, btn);
                    optionsDiv.appendChild(btn);
                });

                // Explanation Box
                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp-${index}`;
                expBox.innerHTML = `
                    <div class="exp-header">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        GIẢI THÍCH CHI TIẾT - CÔ MS Chí Nên
                    </div>
                    <div class="exp-content">
                        ${item.rationale.replace(/\n/g, '<br>')}
                    </div>
                `;

                card.appendChild(qNum);
                card.appendChild(qText);
                card.appendChild(optionsDiv);
                card.appendChild(expBox);
                container.appendChild(card);
            });
        }

        function checkAnswer(qIndex, optIndex, isCorrect, btnElement) {
            const card = document.getElementById(`q-card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            
            // Disable all buttons in this card
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                btnElement.classList.add('correct');
                playSound('correct');
                confettiEffect(btnElement.getBoundingClientRect());
                score++;
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                // Highlight correct one automatically
                quizData[qIndex].options.forEach((opt, i) => {
                    if (opt.isCorrect) buttons[i].classList.add('correct');
                });
            }

            // Show explanation
            document.getElementById(`exp-${qIndex}`).style.display = 'block';

            // Update progress
            answeredCount++;
            const total = quizData.length;
            const percentage = (answeredCount / total) * 100;
            document.getElementById('progress-fill').style.width = `${percentage}%`;
        }

        // --- CONFETTI EFFECT ---
        function confettiEffect(rect) {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD32A', '#00D26A'];

            // Create particles starting from the button position
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 50; i++) {
                pieces.push({
                    x: centerX,
                    y: centerY,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() - 1) * 10 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                
                pieces.forEach(p => {
                    if (p.life > 0) {
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.w, p.h);
                        p.x += p.dx;
                        p.y += p.dy;
                        p.dy += 0.5; // gravity
                        p.life--;
                        active = true;
                    }
                });

                if (active) requestAnimationFrame(animate);
                else ctx.clearRect(0,0,canvas.width, canvas.height);
            }
            animate();
        }

        // --- FINAL RESULTS ---
        function showFinalResult() {
            const modal = document.getElementById('result-modal');
            const scoreText = document.getElementById('final-score');
            const msgText = document.getElementById('final-message');

            scoreText.innerText = `${score}/${quizData.length}`;
            
            if (score === quizData.length) {
                msgText.innerText = "Tuyệt vời! Bạn là siêu sao Tiếng Anh! 🌟";
                playSound('correct');
            } else if (score >= quizData.length * 0.8) {
                msgText.innerText = "Làm tốt lắm! Chỉ một chút nữa thôi! 🔥";
            } else {
                msgText.innerText = "Hãy cố gắng hơn lần sau nhé! 💪";
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // Init
        window.onload = renderQuiz;

    </script>
