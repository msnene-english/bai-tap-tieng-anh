<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập: Mệnh đề Tương phản - Ms. MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #8854C0; /* Tím Pastel */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --text-dark: #2f3542;
            --text-light: #ffffff;
            --bg-pattern: #f0f4f8;
            --card-shadow: 0 8px 0 rgba(0,0,0,0.15);
            --btn-shadow: 0 5px 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#dfe4ea 15%, transparent 16%), radial-gradient(#dfe4ea 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.2);
            border-bottom: 5px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        .header h1 {
            color: var(--primary);
            font-weight: 800;
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            color: #747d8c;
            font-weight: 600;
            margin-top: 10px;
        }

        .teacher-badge {
            background: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Question Card */
        .quiz-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 2px solid #f1f2f6;
            position: relative;
            transition: transform 0.3s;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-number {
            background: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 800;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .hint-text {
            background: #fff4e6;
            color: #d35400;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border-left: 4px solid #e67e22;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-bottom: 4px solid #e1e1e1; /* 3D effect */
            padding: 15px 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #57606f;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            position: relative;
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
            background: #f8f0ff;
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(2px);
            border-bottom-width: 0;
            margin-top: 4px;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background: var(--correct) !important;
            color: white !important;
            border-color: #00b85c !important;
            border-bottom-color: #008f47 !important;
        }

        .option-btn.wrong {
            background: var(--wrong) !important;
            color: white !important;
            border-color: #ff2e40 !important;
            border-bottom-color: #d61c2d !important;
            animation: shake 0.5s;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
            pointer-events: none;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #f0fdf4;
            border: 2px solid var(--correct);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }
        
        .explanation-box.show {
            display: block;
        }

        .teacher-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--correct);
            float: left;
            margin-right: 15px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .explanation-title {
            color: #009432;
            font-weight: 800;
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2f3542;
        }

        .explanation-detail-item {
            margin-bottom: 8px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 8px;
        }
        .explanation-detail-item:last-child {
            border-bottom: none;
        }
        .explanation-label {
            font-weight: 700;
            color: var(--primary);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer-submit {
            text-align: center;
            margin-top: 50px;
            padding-bottom: 50px;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #6c429c, 0 15px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            font-family: 'Nunito', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            background: #9b59d6;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #6c429c;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: zoomIn 0.4s;
            position: relative;
            overflow: hidden;
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary);
            margin: 20px 0;
        }

        .feedback-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Canvas for confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

    </style>
</head>
<body>

    <div class="header">
        <span class="teacher-badge">Giáo viên: Ms. MS Chí Nên</span>
        <h1>Bài tập: Mệnh đề Tương phản</h1>
        <p>Thử thách kiến thức: Concessive Clauses</p>
    </div>

    <div class="container" id="quiz-container">
        <!-- Questions will be rendered here via JS -->
    </div>

    <div class="footer-submit">
        <button class="submit-btn" onclick="finishQuiz()">NỘP BÀI <i class="fas fa-paper-plane"></i></button>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="result-card">
            <h2>Kết Quả Của Bạn</h2>
            <div class="score-display">
                <span id="final-score">0</span>/30
            </div>
            <p class="feedback-text" id="feedback-msg">Bạn làm rất tốt!</p>
            <button class="submit-btn" style="font-size: 1.2rem; padding: 10px 30px;" onclick="closeModal()">Xem lại bài</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

<script>
    // DATA TỪ FILE GỐC (30 CÂU HỎI)
    const quizData = [
    {
      "questionNumber": 1,
      "question": "______ he is rich, he is not happy.",
      "hint": "Phía sau chỗ trống là 'he is rich' (S + V).",
      "answerOptions": [
        { "text": "Because", "rationale": "Dịch: Bởi vì (conj). \nGiải thích: Sai nghĩa. (Giàu có thường đi đôi với sung sướng, nếu dùng 'bởi vì' thì mâu thuẫn với vế sau 'không hạnh phúc').", "isCorrect": false },
        { "text": "Although", "rationale": "Dịch: Mặc dù (conj). \nGiải thích: Đúng. 'Although' + Mệnh đề (S + V) dùng để chỉ sự tương phản. \nDịch câu: Mặc dù ông ấy giàu, ông ấy không hạnh phúc.", "isCorrect": true },
        { "text": "Despite", "rationale": "Dịch: Mặc dù (prep). \nGiải thích: Sai ngữ pháp. 'Despite' đi với danh từ, không đi với mệnh đề.", "isCorrect": false },
        { "text": "In spite", "rationale": "Dịch: Mặc dù (prep phrase). \nGiải thích: Sai. Thiếu giới từ 'of'.", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 2,
      "question": "______ the rain, we went to the beach.",
      "hint": "'the rain' là một cụm danh từ (noun phrase).",
      "answerOptions": [
        { "text": "Even though", "rationale": "Dịch: Thậm chí mặc dù (conj). \nGiải thích: Sai. Cần mệnh đề (S + V).", "isCorrect": false },
        { "text": "Although", "rationale": "Dịch: Mặc dù (conj). \nGiải thích: Sai. Cần mệnh đề (S + V).", "isCorrect": false },
        { "text": "In spite of", "rationale": "Dịch: Mặc dù (prep phrase). \nGiải thích: Đúng. 'In spite of' + Noun Phrase (the rain). \nDịch câu: Bất chấp trời mưa, chúng tôi vẫn đi biển.", "isCorrect": true },
        { "text": "Because of", "rationale": "Dịch: Bởi vì (prep phrase). \nGiải thích: Sai nghĩa. (Không ai đi biển 'bởi vì' trời mưa).", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 3,
      "question": "She went to work ______ she was ill.",
      "hint": "'she was ill' là một mệnh đề (S + V).",
      "answerOptions": [
        { "text": "despite", "rationale": "Dịch: mặc dù (prep). \nGiải thích: Sai ngữ pháp.", "isCorrect": false },
        { "text": "in spite of", "rationale": "Dịch: mặc dù (prep). \nGiải thích: Sai ngữ pháp.", "isCorrect": false },
        { "text": "even though", "rationale": "Dịch: mặc dù/thậm chí là (conj). \nGiải thích: Đúng. Even though + S + V. \nDịch câu: Cô ấy vẫn đi làm mặc dù cô ấy bị ốm.", "isCorrect": true },
        { "text": "because", "rationale": "Dịch: bởi vì (conj). \nGiải thích: Sai nghĩa.", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 4,
      "question": "______ having a headache, I enjoyed the movie.",
      "hint": "'having a headache' là cụm V-ing (Gerund phrase).",
      "answerOptions": [
        { "text": "Although", "rationale": "Dịch: Mặc dù (conj). \nGiải thích: Sai. Although không đi trực tiếp với V-ing trong ngữ cảnh này.", "isCorrect": false },
        { "text": "Despite", "rationale": "Dịch: Mặc dù (prep). \nGiải thích: Đúng. Despite + V-ing. \nDịch câu: Mặc dù bị đau đầu, tôi vẫn thích bộ phim.", "isCorrect": true },
        { "text": "Though", "rationale": "Dịch: Mặc dù (conj). \nGiải thích: Sai.", "isCorrect": false },
        { "text": "Because", "rationale": "Dịch: Bởi vì (conj). \nGiải thích: Sai nghĩa.", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 5,
      "question": "We plan to go camping ______ the bad weather forecast.",
      "hint": "'the bad weather forecast' là cụm danh từ.",
      "answerOptions": [
        { "text": "although", "rationale": "Dịch: mặc dù. \nGiải thích: Sai (cần mệnh đề).", "isCorrect": false },
        { "text": "despite of", "rationale": "Dịch: mặc dù. \nGiải thích: Sai ngữ pháp. 'Despite' không bao giờ đi với 'of'.", "isCorrect": false },
        { "text": "in spite of", "rationale": "Dịch: mặc dù. \nGiải thích: Đúng. In spite of + Noun phrase. \nDịch câu: Chúng tôi dự định đi cắm trại bất chấp dự báo thời tiết xấu.", "isCorrect": true },
        { "text": "even though", "rationale": "Dịch: mặc dù. \nGiải thích: Sai (cần mệnh đề).", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 6,
      "question": "______ he studied hard, he failed the exam.",
      "hint": "Hai vế tương phản (học chăm - trượt).",
      "answerOptions": [
        { "text": "Because", "rationale": "Dịch: Bởi vì. \nGiải thích: Sai nghĩa.", "isCorrect": false },
        { "text": "Though", "rationale": "Dịch: Mặc dù (conj). \nGiải thích: Đúng. Though + S + V. \nDịch câu: Dù anh ấy học chăm, anh ấy vẫn trượt.", "isCorrect": true },
        { "text": "Despite", "rationale": "Dịch: Mặc dù. \nGiải thích: Sai ngữ pháp.", "isCorrect": false },
        { "text": "In spite", "rationale": "Dịch: Mặc dù. \nGiải thích: Sai (thiếu 'of').", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 7,
      "question": "Which sentence is correct?",
      "hint": "Kiểm tra lỗi dùng 'Despite of' hoặc kết hợp 'Although' và 'But'.",
      "answerOptions": [
        { "text": "Although he is tired, but he keeps working.", "rationale": "Dịch: Mặc dù... nhưng... \nGiải thích: Sai. Không dùng 'Although' và 'But' cùng lúc.", "isCorrect": false },
        { "text": "Despite of being tired, he keeps working.", "rationale": "Dịch: Mặc dù mệt... \nGiải thích: Sai. Thừa 'of' sau Despite.", "isCorrect": false },
        { "text": "In spite he is tired, he keeps working.", "rationale": "Dịch: Sai ngữ pháp. \nGiải thích: Thiếu 'of' và sau đó phải là N/V-ing.", "isCorrect": false },
        { "text": "Though he is tired, he keeps working.", "rationale": "Dịch: Mặc dù anh ấy mệt, anh ấy vẫn tiếp tục làm việc. \nGiải thích: Đúng ngữ pháp.", "isCorrect": true }
      ]
    },
    {
      "questionNumber": 8,
      "question": "______ the fact that I was hungry, I didn't eat anything.",
      "hint": "Cấu trúc 'The fact that' biến mệnh đề thành cụm danh từ để đi với giới từ.",
      "answerOptions": [
        { "text": "Despite", "rationale": "Dịch: Mặc dù (prep). \nGiải thích: Đúng. Despite + Noun Phrase (the fact that...). \nDịch câu: Mặc dù thực tế là tôi đói, tôi đã không ăn gì.", "isCorrect": true },
        { "text": "Although", "rationale": "Dịch: Mặc dù (conj). \nGiải thích: Sai. Although + S + V trực tiếp.", "isCorrect": false },
        { "text": "Though", "rationale": "Dịch: Mặc dù (conj). \nGiải thích: Sai tương tự Although.", "isCorrect": false },
        { "text": "Even though", "rationale": "Dịch: Mặc dù (conj). \nGiải thích: Sai tương tự Although.", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 9,
      "question": "______ beautiful she is, nobody likes her.",
      "hint": "Cấu trúc đảo ngữ nhấn mạnh tính từ: Adj + as/though + S + V.",
      "answerOptions": [
        { "text": "However", "rationale": "Dịch: Tuy nhiên. \nGiải thích: Đúng. However + adj + S + V (No matter how beautiful she is). \nDịch: Dù cô ấy đẹp đến thế nào, không ai thích cô ấy.", "isCorrect": true },
        { "text": "Although", "rationale": "Dịch: Mặc dù. \nGiải thích: Sai cấu trúc. Phải là 'Although she is beautiful'.", "isCorrect": false },
        { "text": "Much as", "rationale": "Dịch: Mặc dù nhiều... \nGiải thích: 'Much as' thường đi với động từ (Much as I like you...).", "isCorrect": false },
        { "text": "Beautiful as", "rationale": "Dịch: Dù đẹp... \nGiải thích: Sai vị trí. Phải là 'Beautiful as she is'.", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 10,
      "question": "Safe ______ it was, we didn't want to stay there.",
      "hint": "Cấu trúc đảo: Adj + AS/THOUGH + S + be.",
      "answerOptions": [
        { "text": "although", "rationale": "Dịch: mặc dù. \nGiải thích: Sai vị trí.", "isCorrect": false },
        { "text": "as", "rationale": "Dịch: mặc dù (trong cấu trúc đảo). \nGiải thích: Đúng. Safe (adj) + as + it (S) + was (V). \nDịch câu: Mặc dù nó an toàn, chúng tôi không muốn ở lại đó.", "isCorrect": true },

      ]
    },
    {
      "questionNumber": 11,
      "question": "Rewrite: 'Although he is strong, he can't lift the box.' -> 'Despite ______'",
      "hint": "Strong (adj) -> Strength (noun). Dùng tính từ sở hữu 'his'.",
      "answerOptions": [
        { "text": "his strong", "rationale": "Dịch: Sai loại từ (strong là adj).", "isCorrect": false },
        { "text": "his strength", "rationale": "Dịch: sức mạnh của anh ấy. \nGiải thích: Đúng. Despite + his strength (Noun). \nDịch: Mặc dù có sức mạnh, anh ấy không nhấc nổi cái hộp.", "isCorrect": true },
        { "text": "he is strong", "rationale": "Dịch: Sai ngữ pháp (mệnh đề).", "isCorrect": false },
        { "text": "being strength", "rationale": "Dịch: Sai ngữ pháp (strength là N, sau being phải là adj hoặc N chỉ thân phận).", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 12,
      "question": "______ I explained it to him, he didn't understand.",
      "hint": "S + V ('I explained...').",
      "answerOptions": [
        { "text": "In spite of", "rationale": "Dịch: Mặc dù. \nGiải thích: Sai ngữ pháp.", "isCorrect": false },
        { "text": "Despite", "rationale": "Dịch: Mặc dù. \nGiải thích: Sai ngữ pháp.", "isCorrect": false },
        { "text": "Even though", "rationale": "Dịch: Thậm chí mặc dù. \nGiải thích: Đúng. Even though + S + V. \nDịch câu: Dù tôi đã giải thích cho anh ấy, anh ấy vẫn không hiểu.", "isCorrect": true },
        { "text": "Because of", "rationale": "Dịch: Bởi vì. \nGiải thích: Sai ngữ pháp và nghĩa.", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 13,

    let currentScore = 0;
    const answeredState = new Array(quizData.length).fill(false);

    // RENDER QUESTIONS
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        
        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            
            // Build Options HTML
            let optionsHtml = '';
            item.answerOptions.forEach((opt, optIndex) => {
                optionsHtml += `<button class="option-btn" id="q${index}_opt${optIndex}" onclick="checkAnswer(${index}, ${optIndex})">${String.fromCharCode(65 + optIndex)}. ${opt.text}</button>`;
            });

            // Build Explanation Content (Aggregated)
            let explanationDetails = '';
            item.answerOptions.forEach((opt, optIndex) => {
                const label = String.fromCharCode(65 + optIndex);
                // Clean up rationale for display (bolding text)
                const formattedRationale = opt.rationale.replace(/\n/g, '<br>').replace(/Dịch:/g, '<b>Dịch:</b>').replace(/Giải thích:/g, '<b>Giải thích:</b>');
                const colorStyle = opt.isCorrect ? 'color:#009432' : 'color:#57606f';
                explanationDetails += `
                    <div class="explanation-detail-item" style="${colorStyle}">
                        <span class="explanation-label">${label}. ${opt.text}</span><br>
                        ${formattedRationale}
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="question-header">
                    <div class="question-number">${item.questionNumber}</div>
                    <div style="color: #a4b0be; font-weight: 600;">Question ${index + 1}/30</div>
                </div>
                <div class="question-text">${item.question}</div>
                ${item.hint ? `<div class="hint-text"><i class="far fa-lightbulb"></i> Gợi ý: ${item.hint}</div>` : ''}
                <div class="options-grid">
                    ${optionsHtml}
                </div>
                <div class="explanation-box" id="explain_${index}">
                    <div class="teacher-avatar">👩‍🏫</div>
                    <span class="explanation-title">Cô MS Chí Nên giải thích:</span>
                    <div class="explanation-content">
                       ${explanationDetails}
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // CHECK ANSWER LOGIC
    function checkAnswer(qIndex, optIndex) {
        if (answeredState[qIndex]) return; // Prevent changing answer
        answeredState[qIndex] = true;

        const question = quizData[qIndex];
        const selectedOpt = question.answerOptions[optIndex];
        const correctOptIndex = question.answerOptions.findIndex(o => o.isCorrect);

        const btnSelected = document.getElementById(`q${qIndex}_opt${optIndex}`);
        const btnCorrect = document.getElementById(`q${qIndex}_opt${correctOptIndex}`);

        // Disable all buttons in this question
        for(let i=0; i<4; i++) {
            const btn = document.getElementById(`q${qIndex}_opt${i}`);
            if(btn) btn.classList.add('disabled');
        }

        if (selectedOpt.isCorrect) {
            btnSelected.classList.add('correct');
            currentScore++;
            playSound('correct');
            triggerConfetti(btnSelected);
        } else {
            btnSelected.classList.add('wrong');
            btnCorrect.classList.add('correct');
            playSound('wrong');
        }

        // Show Explanation
        const explainBox = document.getElementById(`explain_${qIndex}`);
        explainBox.classList.add('show');
    }

    // FINISH QUIZ
    function finishQuiz() {
        const notAnswered = answeredState.filter(x => x === false).length;
        if (notAnswered > 0) {
            if(!confirm(`Bạn còn ${notAnswered} câu chưa làm. Bạn có chắc muốn nộp bài không?`)) return;
        }
        
        document.getElementById('final-score').innerText = currentScore;
        const msg = document.getElementById('feedback-msg');
        
        if(currentScore === 30) msg.innerText = "Xuất sắc! Bạn là thiên tài ngữ pháp! 🏆";
        else if(currentScore >= 20) msg.innerText = "Giỏi lắm! Bạn nắm khá chắc kiến thức rồi! 🌟";
        else if(currentScore >= 10) msg.innerText = "Khá tốt! Hãy xem lại phần giải thích để hiểu rõ hơn nhé! 💪";
        else msg.innerText = "Cố lên! Hãy ôn lại bài và thử lại lần nữa nhé! 📚";

        document.getElementById('resultModal').style.display = 'flex';
        playSound('finish');
    }

    function closeModal() {
        document.getElementById('resultModal').style.display = 'none';
    }

    // SOUNDS (Base64 for Single File Portability)
    // Short Ding
    const soundCorrect = new Audio("data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="); 
    // We will use a real simple beep synthesis instead of heavy base64 strings to ensure it works
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'finish') {
             // Simple melody
             const now = audioCtx.currentTime;
             [500, 600, 800].forEach((freq, i) => {
                 const o = audioCtx.createOscillator();
                 const g = audioCtx.createGain();
                 o.connect(g);
                 g.connect(audioCtx.destination);
                 o.frequency.value = freq;
                 g.gain.setValueAtTime(0.2, now + i*0.15);
                 g.gain.exponentialRampToValueAtTime(0.001, now + i*0.15 + 0.3);
                 o.start(now + i*0.15);
                 o.stop(now + i*0.15 + 0.3);
             });
        }
    }

    // CONFETTI LOGIC
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    function triggerConfetti(element) {
        const rect = element.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;

        for (let i = 0; i < 30; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10 - 5,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                life: 100
            });
        }
        requestAnimationFrame(updateConfetti);
    }

    function updateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // gravity
            p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 6, 6);
        }
        particles = particles.filter(p => p.life > 0);
        if (particles.length > 0) requestAnimationFrame(updateConfetti);
    }

    // Initialize
    renderQuiz();
