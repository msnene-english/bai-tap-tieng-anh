<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #8854C0; /* Tím hồng chủ đạo */
            --secondary: #00C9A7; /* Xanh ngọc */
            --accent: #FF9F43; /* Cam nhạt */
            --correct: #00D26A; /* Xanh lá đúng */
            --wrong: #FF4757; /* Đỏ sai */
            --text-dark: #2f3542;
            --text-light: #ffffff;
            --bg-pattern: #f0f2f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e5e5f7;
            background-image:  repeating-linear-gradient(45deg, #f1f3f9 25%, transparent 25%, transparent 75%, #f1f3f9 75%, #f1f3f9), repeating-linear-gradient(45deg, #f1f3f9 25%, #e5e5f7 25%, #e5e5f7 75%, #f1f3f9 75%, #f1f3f9);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(136, 84, 192, 0.2);
            overflow: hidden;
            margin-bottom: 50px;
            border: 4px solid #fff;
        }

        /* Header Styles */
        header {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            padding: 20px;
            text-align: center;
            color: white;
            position: relative;
            border-bottom: 5px solid rgba(0,0,0,0.1);
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .badge-teacher {
            background: #fff;
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Score Board */
        .score-board {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-dark);
            border-bottom: 2px dashed #eee;
        }

        .score-item span {
            color: var(--primary);
            font-size: 1.3rem;
        }

        /* Question Card */
        .quiz-content {
            padding: 30px;
        }

        .question-card {
            margin-bottom: 30px;
            display: none; /* Hidden by default, shown via JS */
            animation: slideIn 0.5s ease;
        }

        .question-card.active {
            display: block;
        }

        .question-number {
            color: var(--secondary);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            color: #2c3e50;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid var(--secondary);
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-bottom: 6px solid #e0e0e0; /* 3D effect */
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--secondary);
            background-color: #f0fffc;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct);
            border-color: #00b85c;
            border-bottom-color: #008f47;
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            border-color: #ff2e40;
            border-bottom-color: #d61c2d;
            color: white;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #fff;
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden initially */
            animation: fadeIn 0.5s ease;
            position: relative;
        }
        
        .explanation-box::before {
            content: "✨ Giải thích của cô MS Chí Nên:";
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--primary);
            color: white;
            padding: 2px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .exp-section {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #eee;
        }
        
        .exp-section:last-child {
            border-bottom: none;
        }

        .exp-label {
            font-weight: 800;
            color: var(--primary);
            display: inline-block;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .exp-content {
            color: #57606f;
            line-height: 1.6;
        }

        .highlight-text {
            color: var(--secondary);
            font-weight: 700;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-bottom: 5px solid #6c429c;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }

        .next-btn:hover {
            transform: translateY(-2px);
        }
        
        .next-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        /* Summary Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 5px solid var(--secondary);
            animation: zoomIn 0.3s;
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .final-score {
            font-size: 3rem;
            color: var(--primary);
            font-weight: 800;
            margin: 20px 0;
        }

        .reload-btn {
            background: var(--secondary);
            color: white;
            border: none;
            border-bottom: 5px solid #009e82;
            padding: 15px 40px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .reload-btn:hover {
            filter: brightness(1.1);
        }

    </style>
</head>

    <script>
        // --- SOUND EFFECTS (Web Audio API for Single File Reliability) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // High pitch "Ding"
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Low pitch "Buzz"
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- DATA FROM USER ---

                    </div>
                `

        // --- RENDER LOGIC ---
        const quizContainer = document.getElementById('quiz-container');
        const totalQSpan = document.getElementById('total-q');
        const currentQSpan = document.getElementById('current-q');
        const scoreSpan = document.getElementById('score');
        
        let currentQuestionIndex = 0;
        let score = 0;

        // Shuffle Options for Randomness while keeping correct answer tracked
        // Note: For this specific fixed content, I'm rendering as per input for simplicity in mapping explanations, 
        // but the code allows for shuffling if we wanted to expand.

        function initQuiz() {
            totalQSpan.textContent = quizData.length;
            renderQuestion(currentQuestionIndex);
        }

        function renderQuestion(index) {
            // Hide all questions
            const allCards = document.querySelectorAll('.question-card');
            allCards.forEach(card => card.classList.remove('active'));

            // If card exists, show it. If not, create it.
            let card = document.getElementById(`q-card-${index}`);
            
            if (!card) {
                card = createQuestionCard(quizData[index], index);
                quizContainer.appendChild(card);
            }
            
            // Allow reflow then add class for animation
            setTimeout(() => card.classList.add('active'), 10);
            currentQSpan.textContent = index + 1;
        }

        function createQuestionCard(data, index) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${index}`;

            const qNum = document.createElement('div');
            qNum.className = 'question-number';
            qNum.innerHTML = `<i class="fas fa-question-circle"></i> Câu hỏi ${index + 1}`;

            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = data.text; // Allows HTML like <u> or <b> if needed

            const optionsGrid = document.createElement('div');
            optionsGrid.className = 'options-grid';

            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
                btn.onclick = () => handleAnswer(btn, i, data, index);
                optionsGrid.appendChild(btn);
            });

            // Explanation Section
            const expBox = document.createElement('div');
            expBox.className = 'explanation-box';
            expBox.innerHTML = data.explanation;

            // Next Button
            const nextBtnContainer = document.createElement('div');
            nextBtnContainer.className = 'nav-buttons';
            
            const nextBtn = document.createElement('button');
            nextBtn.className = 'next-btn';
            nextBtn.innerHTML = index === quizData.length - 1 ? 'Nộp bài & Xem điểm <i class="fas fa-flag-checkered"></i>' : 'Câu tiếp theo <i class="fas fa-arrow-right"></i>';
            nextBtn.onclick = () => {
                if (index === quizData.length - 1) {
                    showFinalSummary();
                } else {
                    currentQuestionIndex++;
                    renderQuestion(currentQuestionIndex);
                }
            };
            nextBtnContainer.appendChild(nextBtn);

            card.appendChild(qNum);
            card.appendChild(qText);
            card.appendChild(optionsGrid);
            card.appendChild(expBox);
            card.appendChild(nextBtnContainer);

            return card;
        }

        function handleAnswer(btn, choiceIndex, data, qIndex) {
            const card = document.getElementById(`q-card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const expBox = card.querySelector('.explanation-box');
            const nextBtn = card.querySelector('.next-btn');

            // Disable all buttons
            buttons.forEach(b => b.disabled = true);

            if (choiceIndex === data.correct) {
                // Correct
                btn.classList.add('correct');
                playSound('correct');
                score += 1;
                scoreSpan.textContent = score;
                // Confetti effect
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                // Wrong
                btn.classList.add('wrong');
                playSound('wrong');
                // Highlight correct answer
                buttons[data.correct].classList.add('correct');
            }

            // Show explanation
            expBox.style.display = 'block';
            nextBtn.style.display = 'block';
        }

        function showFinalSummary() {
            const modal = document.getElementById('summary-modal');
            const scoreDisplay = document.getElementById('final-score-display');
            const feedback = document.getElementById('feedback-text');

            scoreDisplay.textContent = `${score}/${quizData.length}`;

            const percentage = (score / quizData.length) * 100;
            if (percentage === 100) {
                feedback.textContent = "Xuất sắc! Bạn là thiên tài tiếng Anh! 🌟🏆";
                playSound('correct');
                confetti({ particleCount: 200, spread: 100 });
            } else if (percentage >= 80) {
                feedback.textContent = "Giỏi lắm! Cố gắng thêm chút nữa là hoàn hảo! 💪";
            } else if (percentage >= 50) {
                feedback.textContent = "Khá tốt, nhưng hãy xem lại phần giải thích kỹ hơn nhé! 📚";
            } else {
                feedback.textContent = "Đừng buồn, hãy làm lại để ôn tập kiến thức nhé! 🌱";
            }

            modal.style.display = 'flex';
        }

        // Initialize the app
        window.onload = initQuiz;

    </script>
