<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Liên từ - Ms MS Chí Nên</title>
    <!-- Google Fonts: Nunito & Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-pastel: #F0F3F8;
            --text-dark: #2D3436;
            --card-shadow: 0 8px 0 rgba(0,0,0,0.15);
            --card-shadow-hover: 0 12px 0 rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #74b9ff;
            background-image: radial-gradient(#81ecec 20%, transparent 20%),
                              radial-gradient(#81ecec 20%, transparent 20%);
            background-position: 0 0, 50px 50px;
            background-size: 100px 100px;
            color: var(--text-dark);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Header Styles */
        header {
            background: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Quicksand', sans-serif;
            color: var(--primary-purple);
            font-weight: 800;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #dfe6e9;
        }

        .subtitle {
            color: var(--primary-teal);
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Question Card */
        .quiz-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.05);
            border: 2px solid #dfe6e9;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .question-number {
            display: inline-block;
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 800;
            margin-bottom: 15px;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #2d3436;
        }

        /* Answer Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .question-text {
                font-size: 1.2rem;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #636e72;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 4px 0 #e0e0e0;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #e0e0e0;
            border-color: var(--primary-teal);
            color: var(--primary-teal);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #e0e0e0;
        }

        .option-label {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
            background: #f1f2f6;
            border-radius: 50%;
            margin-right: 15px;
            font-weight: 800;
            font-size: 0.9rem;
            color: #b2bec3;
        }

        /* States */
        .option-btn.correct {
            background: var(--correct-green);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 4px 0 #00b85c;
        }
        .option-btn.correct .option-label {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .option-btn.wrong {
            background: var(--wrong-red);
            color: white;
            border-color: #e84118;
            box-shadow: 0 4px 0 #e84118;
            animation: shake 0.5s;
        }
        .option-btn.wrong .option-label {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }
        
        .option-btn.dimmed {
            opacity: 0.5;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #f8f9fa;
            border-left: 5px solid var(--primary-purple);
            padding: 20px;
            border-radius: 0 10px 10px 0;
            display: none; /* Hidden by default */
            animation: popIn 0.4s ease-out forwards;
        }

        .explanation-header {
            font-weight: 800;
            color: var(--primary-purple);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2d3436;
            white-space: pre-wrap; /* Keeps line breaks from data */
        }
        
        .explanation-content strong {
            color: #d63031;
            background: #ffeaa7;
            padding: 0 4px;
            border-radius: 4px;
        }

        /* Footer / Score */
        .finish-btn-container {
            text-align: center;
            margin-top: 40px;
        }

        .finish-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #6c429e;
            transition: all 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        .finish-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 0 #6c429e;
            background: #9c6ade;
        }

        .finish-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #6c429e;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Score Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 0 rgba(0,0,0,0.1);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .score-number {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-teal);
            margin: 20px 0;
            text-shadow: 3px 3px 0 #b2bec3;
        }

        .feedback-text {
            font-size: 1.2rem;
            color: #636e72;
            margin-bottom: 30px;
        }

    </style>
</head>
<body>

    <header>
        <h1>Ms. MS Chí Nên</h1>
        <div class="subtitle">Bài tập Liên từ & Trạng từ liên kết (Exercise 8, 9, 10)</div>
    </header>

    <div class="container" id="quiz-container">
        <!-- Questions will be injected here by JavaScript -->
    </div>

    <div class="finish-btn-container">
        <button class="finish-btn" onclick="showFinalScore()">NỘP BÀI & XEM ĐIỂM</button>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-content">
            <h2>KẾT QUẢ CỦA CON</h2>
            <div class="score-number" id="finalScoreDisplay">0/30</div>
            <p class="feedback-text" id="finalFeedback">Cố gắng lên nhé!</p>
            <button class="finish-btn" onclick="closeModal()">Làm lại bài</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <!-- Audio Elements using Base64 to keep single file -->
    <!-- Ding (Correct) -->
    <audio id="audio-correct" src="data:audio/mp3;base64,//uQRAAAAWMSLwUIYAAsYkXgoQwAEaYLWfkWgAI0wWs/ItAAAG1xUAA5CAAOd86376kf/uQDAAABip9UEbIpC2OeOozRzFbdEP7lRIt12t2//+7UAIWthhD//+D0+gxEnRG5KB//uQDAAAAgFQD0a688EuJ1iOA7XgO///0Lf////66M7kHK/9IT+gH65k39PT15bb//uQDAAAAgF8Dw71419130mMg5Jb////80P////701/iTB8NCNlVHkv/3fZ5+e//uQDAAAAgF8Dw71419130mMg5Jb////80P////701/iTB8NCNlVHkv/3fZ5+e"></audio>
    <!-- Buzz (Wrong) -->
    <audio id="audio-wrong" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="></audio>

    <script>
        // --- DATA ---
        const quizData = [
    {
      "questionNumber": 1,
      "question": "I haven’t gone to a movie yet. ________, I don’t feel sad.",
      "answerOptions": [
        { "text": "However", "isCorrect": true },
        { "text": "Although", "isCorrect": false },
        { "text": "But", "isCorrect": false },
        { "text": "So", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Dùng cho sự tương phản, đứng sau dấu chấm và trước dấu phẩy.\n\n**Phân tích & Dịch:**\n- A. However: Tuy nhiên (đứng đầu câu, có dấu phẩy phía sau)\n- B. Although: Mặc dù (đi liền với mệnh đề, không có dấu phẩy ngay sau)\n- C. But: Nhưng (thường không đứng đầu câu trong văn viết trang trọng)\n- D. So: Vì vậy\n\n**Giải thích:** Cấu trúc: [Câu 1]. However, [Câu 2].\n\n**Dịch câu:** Tôi vẫn chưa đi xem phim. Tuy nhiên, tôi không cảm thấy buồn."
    },
    {
      "questionNumber": 2,
      "question": "Happy ending is an old trend. ________, people enjoy it.",
      "answerOptions": [
        { "text": "But", "isCorrect": false },
        { "text": "However", "isCorrect": true },
        { "text": "Therefore", "isCorrect": false },
        { "text": "Although", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Chỉ sự tương phản.\n\n**Phân tích & Dịch:**\n- A. But: Nhưng\n- B. However: Tuy nhiên\n- C. Therefore: Do đó\n- D. Although: Mặc dù\n\n**Giải thích:** Dấu hiệu: Đứng đầu câu và có dấu phẩy ( , ) phía sau.\n\n**Dịch câu:** Kết thúc có hậu là một xu hướng cũ. Tuy nhiên, mọi người vẫn thích nó."
    },
    {
      "questionNumber": 3,
      "question": "I really like the film ________ most critics say it’s not worth seeing.",
      "answerOptions": [
        { "text": "though", "isCorrect": true },
        { "text": "and", "isCorrect": false },
        { "text": "so", "isCorrect": false },
        { "text": "or", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. 'Though' = 'Although', chỉ sự nhượng bộ.\n\n**Phân tích & Dịch:**\n- A. and: và\n- B. though: mặc dù\n- C. so: vì vậy\n- D. or: hoặc\n\n**Giải thích:** Hai vế đối lập: Thích phim (like) >< Các nhà phê bình chê (not worth seeing).\n\n**Dịch câu:** Tôi thực sự thích bộ phim này mặc dù hầu hết các nhà phê bình nói rằng nó không đáng xem."
    },
    {
      "questionNumber": 4,
      "question": "I feel as badly as you do, ________ we don’t have time for this.",
      "answerOptions": [
        { "text": "but", "isCorrect": true },
        { "text": "though", "isCorrect": false },
        { "text": "so", "isCorrect": false },
        { "text": "because", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Nối hai mệnh đề đối lập.\n\n**Phân tích & Dịch:**\n- A. though: mặc dù (thường không đi sau dấu phẩy theo cách này để nối câu đẳng lập)\n- B. but: nhưng\n- C. so: vì vậy\n- D. because: bởi vì\n\n**Giải thích:** Tôi cũng buồn, NHƯNG chúng ta không có thời gian để buồn đâu.\n\n**Dịch câu:** Tôi cũng cảm thấy tồi tệ như bạn, nhưng chúng ta không có thời gian cho việc này đâu."
    },
    {
      "questionNumber": 5,
      "question": "Linh can’t get tickets ________ she has queued for hours.",
      "answerOptions": [
        { "text": "although", "isCorrect": true },
        { "text": "or", "isCorrect": false },
        { "text": "so", "isCorrect": false },
        { "text": "because", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Mệnh đề chỉ sự nhượng bộ.\n\n**Phân tích & Dịch:**\n- A. although: mặc dù\n- B. or: hoặc\n- C. so: vì vậy\n- D. because: bởi vì\n\n**Giải thích:** Tương phản: Không mua được vé >< Đã xếp hàng nhiều giờ.\n\n**Dịch câu:** Linh không thể mua vé mặc dù cô ấy đã xếp hàng nhiều giờ liền."
    },
    {
      "questionNumber": 6,
      "question": "He knows Chinese, ________ he can watch the film without the subtitles.",
      "answerOptions": [
        { "text": "so", "isCorrect": true },
        { "text": "and", "isCorrect": false },
        { "text": "but", "isCorrect": false },
        { "text": "or", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Chỉ kết quả.\n\n**Phân tích & Dịch:**\n- A. and: và\n- B. so: vì vậy, cho nên\n- C. but: nhưng\n- D. or: hoặc\n\n**Giải thích:** Nguyên nhân: Biết tiếng Trung -> Kết quả: Xem phim không cần phụ đề.\n\n**Dịch câu:** Anh ấy biết tiếng Trung, vì vậy anh ấy có thể xem phim mà không cần phụ đề."
    },
    {
      "questionNumber": 7,
      "question": "Please be quiet, ________ you will wake the baby up.",
      "answerOptions": [
        { "text": "or", "isCorrect": true },
        { "text": "however", "isCorrect": false },
        { "text": "and", "isCorrect": false },
        { "text": "so", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Chỉ hậu quả/sự lựa chọn.\n\n**Phân tích & Dịch:**\n- A. however: tuy nhiên\n- B. or: hoặc, nếu không thì (trong câu mệnh lệnh)\n- C. and: và\n- D. so: vì vậy\n\n**Giải thích:** Trong câu mệnh lệnh, 'or' mang nghĩa cảnh báo: 'Hãy làm đi, nếu không thì...'.\n\n**Dịch câu:** Làm ơn trật tự đi, nếu không bạn sẽ đánh thức em bé dậy đấy."
    },
    {
      "questionNumber": 8,
      "question": "Leonardo was nominated for six films. ________, he only won one.",
      "answerOptions": [
        { "text": "However", "isCorrect": true },
        { "text": "Though", "isCorrect": false },
        { "text": "Therefore", "isCorrect": false },
        { "text": "But", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Đứng đầu câu, có dấu phẩy.\n\n**Phân tích & Dịch:**\n- A. Though: Mặc dù (không đứng đầu câu rồi phẩy ngay)\n- B. However: Tuy nhiên\n- C. Therefore: Do đó\n- D. But: Nhưng\n\n**Giải thích:** Tương phản: Đề cử 6 >< Thắng 1. Cấu trúc [Chấm] + However + [Phẩy].\n\n**Dịch câu:** Leonardo được đề cử cho 6 bộ phim. Tuy nhiên, anh ấy chỉ thắng một giải."
    },
    {
      "questionNumber": 9,
      "question": "The film is based on a story in the 19th century ________ it is set in modern time.",
      "answerOptions": [
        { "text": "though", "isCorrect": true },
        { "text": "so", "isCorrect": false },
        { "text": "because", "isCorrect": false },
        { "text": "or", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Chỉ sự tương phản.\n\n**Phân tích & Dịch:**\n- A. so: vì vậy\n- B. though: mặc dù\n- C. because: bởi vì\n- D. or: hoặc\n\n**Giải thích:** Dựa trên truyện thế kỷ 19 >< Bối cảnh hiện đại. Hai ý ngược nhau.\n\n**Dịch câu:** Bộ phim dựa trên một câu chuyện ở thế kỷ 19 mặc dù nó được đặt trong bối cảnh hiện đại."
    },
    {
      "questionNumber": 10,
      "question": "He can’t hear, ________ he can hardly speak either.",
      "answerOptions": [
        { "text": "and", "isCorrect": true },
        { "text": "because", "isCorrect": false },
        { "text": "but", "isCorrect": false },
        { "text": "or", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Bổ sung thông tin.\n\n**Phân tích & Dịch:**\n- A. and: và\n- B. because: bởi vì\n- C. but: nhưng\n- D. or: hoặc\n\n**Giải thích:** 'can hardly speak either' (cũng hầu như không nói được). Từ 'either' ở cuối câu phủ định gợi ý sự bổ sung tương đồng -> dùng 'and'.\n\n**Dịch câu:** Anh ấy không thể nghe, và anh ấy cũng hầu như không thể nói."
    },
    {
      "questionNumber": 11,
      "question": "They went on holiday ________ they didn’t have much money.",
      "answerOptions": [
        { "text": "although", "isCorrect": true },
        { "text": "however", "isCorrect": false },
        { "text": "because", "isCorrect": false },
        { "text": "despite", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Đi liền với mệnh đề nhượng bộ.\n\n**Phân tích & Dịch:**\n- A. although: mặc dù\n- B. however: tuy nhiên\n- C. because: bởi vì\n- D. despite: mặc dù\n\n**Giải thích:** 'they didn't have much money' là mệnh đề. Nghĩa tương phản (Đi chơi >< ít tiền). Không có dấu phẩy ngăn cách -> dùng 'although'.\n\n**Dịch câu:** Họ đã đi nghỉ mát mặc dù họ không có nhiều tiền."
    },
    {
      "questionNumber": 12,
      "question": "He left on time; ________, heavy traffic caused him to be late.",
      "answerOptions": [
        { "text": "however", "isCorrect": true },
        { "text": "although", "isCorrect": false },
        { "text": "so", "isCorrect": false },
        { "text": "but", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Dấu hiệu: ; ____ ,\n\n**Phân tích & Dịch:**\n- A. although\n- B. however\n- C. so\n- D. but\n\n**Giải thích:** Có dấu chấm phẩy trước và dấu phẩy sau -> Dùng 'however' để chỉ sự tương phản.\n\n**Dịch câu:** Anh ấy đi đúng giờ; tuy nhiên, giao thông ùn tắc đã khiến anh ấy bị muộn."
    },
    {
      "questionNumber": 13,
      "question": "________ he is a good personal trainer, they don’t like him very much.",
      "answerOptions": [
        { "text": "Although", "isCorrect": true },
        { "text": "However", "isCorrect": false },
        { "text": "Because", "isCorrect": false },
        { "text": "Despite", "isCorrect": false }
      ],
      "rationale": "✅ Đúng. Đứng đầu câu, đi với mệnh đề.\n\n**Phân tích & Dịch:**\n- A. Although\n- B. However\n- C. Because\n- D. Despite\n\n**Giải thích:** Tương phản: Giỏi >< Không được thích. 'Although' đứng đầu câu + Mệnh đề + Phẩy + Mệnh đề chính.\n\n**Dịch câu:** Mặc dù anh ấy là một huấn luyện viên cá nhân giỏi, họ không thích anh ấy lắm."

        let correctCount = 0;

        // --- HELPER FUNCTIONS ---
        function formatRationale(text) {
            // Converts newlines to <br> and **text** to <strong>text</strong>
            let formatted = text.replace(/\n/g, '<br>');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Bold A., B., C., D. for clarity
            formatted = formatted.replace(/([ABCD]\.) /g, '<strong>$1</strong> ');
            return formatted;
        }

        // --- CONFETTI ENGINE ---
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#f1c40f', '#e74c3c', '#8e44ad', '#3498db', '#2ecc71'];

        function createConfetti() {
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    speedY: Math.random() * 5 + 2,
                    speedX: Math.random() * 4 - 2,
                    angle: Math.random() * 360,
                    spin: Math.random() < 0.5 ? 1 : -1
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            if (particles.length === 0) {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                return;
            }
            
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            particles.forEach((p, index) => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.angle += p.spin;
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();

                if (p.y > confettiCanvas.height) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateConfetti);
        }

        // --- MAIN GAME LOGIC ---
        const container = document.getElementById('quiz-container');
        const dingSound = document.getElementById('audio-correct');
        const buzzSound = document.getElementById('audio-wrong');

        function renderQuiz() {
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `card-${index}`;

                // Question
                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Câu ${item.questionNumber}`;
                card.appendChild(qNum);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = item.question;
                card.appendChild(qText);

                // Options
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options-grid';
                
                const labels = ['A', 'B', 'C', 'D'];
                item.answerOptions.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span class="option-label">${labels[optIndex]}</span> ${opt.text}`;
                    btn.onclick = () => checkAnswer(index, optIndex, opt.isCorrect, btn);
                    optionsDiv.appendChild(btn);
                });
                card.appendChild(optionsDiv);

                // Explanation (Hidden initially)
                const expDiv = document.createElement('div');
                expDiv.className = 'explanation-box';
                expDiv.id = `exp-${index}`;
                expDiv.innerHTML = `
                    <div class="explanation-header">
                        <span>👩‍🏫</span> Giải thích chi tiết từ Ms. MS Chí Nên:
                    </div>
                    <div class="explanation-content">
                        ${formatRationale(item.rationale)}
                    </div>
                `;
                card.appendChild(expDiv);

                container.appendChild(card);
            });
        }

        function checkAnswer(questionIndex, optIndex, isCorrect, btnElement) {
            const card = document.getElementById(`card-${questionIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            
            // Disable all buttons in this card
            buttons.forEach(b => {
                b.disabled = true;
                if(b !== btnElement) b.classList.add('dimmed');
            });

            if (isCorrect) {
                // Correct
                btnElement.classList.add('correct');
                dingSound.currentTime = 0;
                dingSound.play().catch(e => console.log("Audio requires interaction first"));
                createConfetti();
                correctCount++;
            } else {
                // Wrong: Highlight selected as wrong, and find the correct one
                btnElement.classList.add('wrong');
                // Fake buzzer sound needs to be created, using correct audio for demo
                // Ideally, use a different base64 for buzz
                // Re-using a dummy "wrong" sound loaded in HTML
                const buzz = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU"+Array(100).join("A")); // Short buzz placeholder logic if needed, but using HTML tag instead
                // Actually playing the audio tag element
                try {
                    buzzSound.currentTime = 0;
                    buzzSound.play();
                } catch(e){}

                // Highlight the actual correct answer
                const options = quizData[questionIndex].answerOptions;
                options.forEach((opt, idx) => {
                    if (opt.isCorrect) {
                        buttons[idx].classList.remove('dimmed');
                        buttons[idx].classList.add('correct');
                    }
                });
            }

            // Show explanation
            const expBox = document.getElementById(`exp-${questionIndex}`);
            expBox.style.display = 'block';
        }

        function showFinalScore() {
            const modal = document.getElementById('scoreModal');
            const scoreDisplay = document.getElementById('finalScoreDisplay');
            const feedback = document.getElementById('finalFeedback');
            
            scoreDisplay.innerText = `${correctCount}/${quizData.length}`;
            
            const percentage = (correctCount / quizData.length) * 100;
            if (percentage === 100) {
                feedback.innerText = "Xuất sắc! Con là thiên tài ngoại ngữ! 🌟";
                createConfetti();
            } else if (percentage >= 80) {
                feedback.innerText = "Giỏi lắm! Con làm bài rất tốt! 💪";
            } else if (percentage >= 50) {
                feedback.innerText = "Khá tốt, nhưng hãy đọc kỹ giải thích thêm nhé! 📚";
            } else {
                feedback.innerText = "Đừng buồn, hãy ôn tập lại cùng cô MS Chí Nên nào! ❤";
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            location.reload();
