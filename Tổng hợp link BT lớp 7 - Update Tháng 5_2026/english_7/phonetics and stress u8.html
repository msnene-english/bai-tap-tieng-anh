<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài Tập Tiếng Anh - Ms. Chí Nên</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>

        :root {

            --primary: #8854C0; /* Hồng tím pastel */

            --secondary: #00C9A7; /* Xanh ngọc */

            --accent: #FFD700; /* Vàng */

            --correct: #00D26A; /* Xanh lá */

            --wrong: #FF4757; /* Đỏ cam */

            --bg-color: #f0f3f5;

            --card-bg: #ffffff;

            --text: #2c3e50;

        }



        body {

            font-family: 'Nunito', sans-serif;

            background-color: var(--bg-color);

            background-image: radial-gradient(var(--primary) 1px, transparent 1px), radial-gradient(var(--secondary) 1px, transparent 1px);

            background-size: 40px 40px;

            background-position: 0 0, 20px 20px;

            margin: 0;

            padding: 0;

            color: var(--text);

            padding-bottom: 100px; /* Space for sticky footer */

        }



        /* HEADER */

        header {

            background: white;

            padding: 15px 20px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.1);

            text-align: center;

            position: sticky;

            top: 0;

            z-index: 1000;

            border-bottom: 5px solid var(--secondary);

        }



        header h1 {

            margin: 0;

            font-size: 1.5rem;

            color: var(--primary);

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1px;

        }



        header .sub-title {

            font-size: 0.9rem;

            color: #666;

            margin-top: 5px;

        }



        /* CONTAINER */

        .container {

            max-width: 800px;

            margin: 30px auto;

            padding: 0 15px;

        }



        /* SECTIONS */

        .section-title {

            background: var(--primary);

            color: white;

            padding: 15px;

            border-radius: 15px;

            margin-bottom: 20px;

            font-weight: 800;

            font-size: 1.2rem;

            box-shadow: 0 6px 0 #6c429c;

            text-align: center;

        }



        /* CARD QUESTION */

        .question-card {

            background: var(--card-bg);

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow: 0 8px 0 rgba(0,0,0,0.05);

            border: 2px solid #eee;

            position: relative;

            transition: transform 0.2s;

        }



        .question-text {

            font-size: 1.2rem;

            font-weight: 700;

            margin-bottom: 20px;

            color: #2c3e50;

        }



        .question-number {

            display: inline-block;

            background: var(--accent);

            color: #fff;

            padding: 5px 10px;

            border-radius: 10px;

            font-size: 0.9rem;

            font-weight: 800;

            margin-right: 10px;

            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);

        }



        /* OPTIONS GRID */

        .options-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

        }



        @media (max-width: 600px) {

            .options-grid {

                grid-template-columns: 1fr;

            }

        }



        .option-btn {

            background: white;

            border: 2px solid #e0e0e0;

            padding: 15px;

            border-radius: 15px;

            font-family: 'Nunito', sans-serif;

            font-size: 1rem;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s;

            box-shadow: 0 4px 0 #e0e0e0;

            text-align: left;

            position: relative;

        }



        .option-btn:hover:not(:disabled) {

            transform: scale(1.02);

            border-color: var(--secondary);

        }



        .option-btn:active:not(:disabled) {

            transform: translateY(4px);

            box-shadow: none;

        }



        /* STATE CLASSES */

        .option-btn.selected {

            border-color: var(--primary);

            background-color: #f3e5f5;

        }



        .option-btn.correct {

            background-color: var(--correct);

            color: white;

            border-color: #00b85c;

            box-shadow: 0 4px 0 #00b85c;

        }



        .option-btn.wrong {

            background-color: var(--wrong);

            color: white;

            border-color: #d63031;

            box-shadow: 0 4px 0 #d63031;

            animation: shake 0.5s;

        }



        /* CHECK BUTTON PER QUESTION */

        .check-btn {

            display: block;

            width: 100%;

            margin-top: 20px;

            padding: 12px;

            border: none;

            background: var(--secondary);

            color: white;

            font-weight: 800;

            border-radius: 12px;

            cursor: pointer;

            font-family: 'Nunito', sans-serif;

            font-size: 1.1rem;

            box-shadow: 0 5px 0 #009e82;

            transition: all 0.2s;

        }



        .check-btn:active {

            transform: translateY(5px);

            box-shadow: none;

        }



        .check-btn:disabled {

            background: #ccc;

            box-shadow: none;

            cursor: not-allowed;

            transform: none;

        }



        /* EXPLANATION BOX */

        .explanation {

            margin-top: 20px;

            padding: 20px;

            background: #f8f9fa;

            border-left: 5px solid var(--primary);

            border-radius: 10px;

            display: none; /* Hidden by default */

            font-size: 0.95rem;

            line-height: 1.6;

        }



        .explanation h4 {

            margin-top: 0;

            color: var(--primary);

            display: flex;

            align-items: center;

        }

        

        .explanation h4::before {

            content: '💡';

            margin-right: 10px;

        }



        .vocab-list {

            background: white;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 10px;

            border: 1px dashed #ccc;

        }

        

        .vocab-item {

            display: block;

            margin-bottom: 5px;

        }



        .vocab-word {

            font-weight: bold;

            color: var(--primary);

        }



        .analysis {

            margin-top: 10px;

        }



        /* STICKY FOOTER */

        .sticky-footer {

            position: fixed;

            bottom: 0;

            left: 0;

            width: 100%;

            background: white;

            padding: 15px;

            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 999;

        }



        .submit-all-btn {

            background: var(--primary);

            color: white;

            padding: 15px 40px;

            border-radius: 30px;

            font-size: 1.2rem;

            font-weight: 800;

            border: none;

            box-shadow: 0 6px 0 #5e3a85;

            cursor: pointer;

            transition: all 0.2s;

            font-family: 'Nunito', sans-serif;

        }



        .submit-all-btn:hover {

            transform: scale(1.05);

        }



        .submit-all-btn:active {

            transform: translateY(6px);

            box-shadow: none;

        }



        /* ANIMATIONS */

        @keyframes shake {

            0% { transform: translateX(0); }

            25% { transform: translateX(-10px) rotate(-5deg); }

            50% { transform: translateX(10px) rotate(5deg); }

            75% { transform: translateX(-10px) rotate(-5deg); }

            100% { transform: translateX(0); }

        }



        /* GLOSSARY TABLE */

        .glossary-table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 20px;

            background: white;

            border-radius: 10px;

            overflow: hidden;

            box-shadow: 0 4px 0 rgba(0,0,0,0.05);

        }

        

        .glossary-table th {

            background: var(--secondary);

            color: white;

            padding: 12px;

            text-align: left;

        }

        

        .glossary-table td {

            padding: 10px;

            border-bottom: 1px solid #eee;

        }



        /* Underline style for Phonetics */

        u {

            text-decoration: none;

            border-bottom: 2px solid var(--primary);

            font-weight: 800;

            padding-bottom: 1px;

        }



        /* Result Popup */

        .modal-overlay {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(0,0,0,0.7);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 2000;

        }



        .modal-content {

            background: white;

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            max-width: 400px;

            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);

        }



        @keyframes popIn {

            0% { transform: scale(0); }

            100% { transform: scale(1); }

        }



        .score-display {

            font-size: 3rem;

            font-weight: 800;

            color: var(--primary);

            margin: 20px 0;

        }



    </style>

</head>

<script>

                {

                    // Seatbelt /i:/, Enter /e/, Obey /ei/, Present /e/. Vẫn loạn.

                    options: ["s<u>ea</u>tbelt", "<u>e</u>nter", "ob<u>e</u>y", "pr<u>e</u>sent"],

                    vocab: ["seatbelt: dây an toàn", "enter: đi vào", "obey: vâng lời", "present: món quà/hiện tại"],

                },

                {

                },

                {

                    q: "bored, amazed, excited, enjoyed",

                    options: ["bor<u>ed</u>", "amaz<u>ed</u>", "excit<u>ed</u>", "enjoy<u>ed</u>"],

                    // Wait, Seatbelt /i:/, Vehicle /i:/, Recommend /e/, Investigate /e/.

                    // Recommend (e), Vehicle (e - silent?), Investigate (e).

                    // This assumes underlining the 'e' in recommend, 'ea' in seatbelt...

                    // Let's try stress? No, section I.

                    // Let's pick the "silent" one or different vowel.

                    // Vehicle: 'e' is /i:/ or /ɪ/. Recommend: /e/. Investigate: /e/. Seatbelt: /i:/.

                    vocab: ["recommend: gợi ý", "seatbelt: dây an toàn", "vehicle: xe cộ", "investigate: điều tra"],

                {

                },

                {

                    options: ["par<u>a</u>de", "w<u>a</u>ste", "l<u>a</u>ter", "gr<u>a</u>vy"],

    // --- RENDER LOGIC ---

    const container = document.getElementById('quiz-container');

    let totalQuestions = 0;

    let globalQuestionIndex = 0; // Để tạo ID duy nhất



    function renderQuiz() {

        let html = '';

        quizData.forEach((section, sIndex) => {

            html += `<div class="section-title">${section.section}</div>`;

            html += `<p style="font-style:italic; color:#666; margin-bottom:20px;">Instructions: ${section.instruction}</p>`;

            

            section.questions.forEach((q, qIndex) => {

                totalQuestions++;

                const qID = `q_${sIndex}_${qIndex}`;

                

                html += `

                <div class="question-card" id="card_${qID}">

                    <div class="question-text">

                        <span class="question-number">Question ${totalQuestions}</span>

                        ${q.q}

                    </div>

                    

                    <div class="options-grid">

                        ${q.options.map((opt, oIndex) => `

                            <button class="option-btn" id="btn_${qID}_${oIndex}" onclick="selectOption('${qID}', ${oIndex})">

                                ${['A', 'B', 'C', 'D'][oIndex]}. ${opt}

                            </button>

                        `).join('')}

                    </div>



                    <button class="check-btn" id="check_${qID}" onclick="checkAnswer('${qID}', ${q.correct}, '${encodeURIComponent(JSON.stringify(q))}')">

                        KIỂM TRA (CHECK)

                    </button>



                    <div class="explanation" id="exp_${qID}">

                        <div class="vocab-list">

                            <h4 style="margin-top:0">📚 Vocabulary & Translation:</h4>

                            ${q.vocab.map(v => `<span class="vocab-item">• ${v}</span>`).join('')}

                        </div>

                        <div class="analysis">

                            <h4>👨‍🏫 Ms. Chí Nên Explains:</h4>

                            <p>${q.rule}</p>

                            ${q.ipa ? `<p style="color:#666; font-size:0.9em">IPA: ${q.ipa.join(' vs ')}</p>` : ''}

                        </div>

                    </div>

                </div>

                `;

            });

        });

        container.innerHTML = html;

        document.getElementById('scoreText').innerText = `0/${totalQuestions}`;

    }



    // --- INTERACTION LOGIC ---

    const userAnswers = {};



    window.selectOption = function(qID, oIndex) {

        // Nếu đã check rồi thì không cho chọn lại

        if(document.getElementById(`check_${qID}`).disabled) return;



        // Reset visual selection

        [0, 1, 2, 3].forEach(i => {

            const btn = document.getElementById(`btn_${qID}_${i}`);

            if(btn) btn.classList.remove('selected');

        });



        // Select new

        document.getElementById(`btn_${qID}_${oIndex}`).classList.add('selected');

        userAnswers[qID] = oIndex;

    }



    window.checkAnswer = function(qID, correctIndex, qDataStr) {

        const selected = userAnswers[qID];

        if (selected === undefined) {

            alert("Vui lòng chọn một đáp án trước khi kiểm tra!");

            return;

        }



        // Disable interaction

        document.getElementById(`check_${qID}`).disabled = true;

        document.getElementById(`check_${qID}`).innerText = "ĐÃ KIỂM TRA";



        // Show Correct/Wrong Visuals

        const correctBtn = document.getElementById(`btn_${qID}_${correctIndex}`);

        correctBtn.classList.add('correct');



        if (selected !== correctIndex) {

            const wrongBtn = document.getElementById(`btn_${qID}_${selected}`);

            wrongBtn.classList.add('wrong');

            // Sound effect placeholders

        } else {

            confettiEffect(document.getElementById(`card_${qID}`));

        }



        // Show Explanation

        const expBox = document.getElementById(`exp_${qID}`);

        expBox.style.display = "block";

    }



    window.submitAll = function() {

        let score = 0;

        let attempted = 0;



        // Loop through all questions to calculate score

        quizData.forEach((section, sIndex) => {

            section.questions.forEach((q, qIndex) => {

                const qID = `q_${sIndex}_${qIndex}`;

                // Auto check if not checked yet

                const btn = document.getElementById(`check_${qID}`);

                if (!btn.disabled) {

                   // Nếu chưa làm, highlight vàng hoặc check luôn nếu đã chọn

                   if(userAnswers[qID] !== undefined) {

                       checkAnswer(qID, q.correct, JSON.stringify(q));

                   } else {

                       // Chưa chọn gì cả -> Mark as wrong visual only

                       document.getElementById(`exp_${qID}`).style.display = "block";

                       document.getElementById(`btn_${qID}_${q.correct}`).classList.add('correct'); // Show answer

                       document.getElementById(`card_${qID}`).style.border = "2px solid #FFD700"; // Warn

                       btn.disabled = true;

                   }

                }

                

                if (userAnswers[qID] === q.correct) {

                    score++;

                }

            });

        });



        // Show Result Modal

        const modal = document.getElementById('resultModal');

        const scoreText = document.getElementById('scoreText');

        const feedback = document.getElementById('feedbackText');

        

        scoreText.innerText = `${score}/${totalQuestions}`;

        

        const percentage = (score/totalQuestions)*100;

        if(percentage >= 90) feedback.innerText = "Xuất sắc! Ms. Chí Nên rất tự hào về em! 🌟";

        else if(percentage >= 70) feedback.innerText = "Làm tốt lắm! Cố gắng thêm chút nữa nhé! 💪";

        else feedback.innerText = "Đừng buồn, hãy xem kỹ lại phần giải thích nhé! 📖";



        modal.style.display = 'flex';

    }



    window.closeModal = function() {

        document.getElementById('resultModal').style.display = 'none';

        // Scroll to top

        window.scrollTo({top: 0, behavior: 'smooth'});

    }



    // --- CONFETTI EFFECT (Simple CSS/JS Implementation) ---

    function confettiEffect(element) {

        // Create simple particles

        for(let i=0; i<30; i++) {

            const p = document.createElement('div');

            p.style.position = 'absolute';

            p.style.width = '8px';

            p.style.height = '8px';

            p.style.background = ['#ff0', '#f00', '#0f0', '#00f'][Math.floor(Math.random()*4)];

            p.style.left = '50%';

            p.style.top = '50%';

            p.style.borderRadius = '50%';

            p.style.zIndex = '10';

            p.style.transition = 'all 1s ease-out';

            element.appendChild(p);



            setTimeout(() => {

                p.style.transform = `translate(${Math.random()*200 - 100}px, ${Math.random()*200 - 100}px) scale(0)`;

                p.style.opacity = 0;

            }, 10);



            setTimeout(() => p.remove(), 1000);

        }

    }



    // Initialize

    renderQuiz();
