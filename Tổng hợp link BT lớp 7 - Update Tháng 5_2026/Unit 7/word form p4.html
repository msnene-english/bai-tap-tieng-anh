<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chí Nên - Word Form Masterclass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-pattern: #f0f2f5;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#8854c033 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2d3436;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 4px solid white;
        }

        .btn-option {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-bottom: 6px solid rgba(0,0,0,0.2);
            position: relative;
        }

        .btn-option:hover {
            transform: scale(1.03);
            border-bottom-width: 4px;
            margin-top: 2px;
        }

        .btn-option:active {
            transform: scale(0.98);
            border-bottom-width: 0px;
            margin-top: 6px;
        }

        .explanation-box {
            display: none;
            animation: slideUp 0.5s ease-out forwards;
            border-left: 8px solid var(--primary-purple);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }

        .floating-heading {
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            font-size: 0.9rem;
        }

        .progress-bar {
            height: 12px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-teal), var(--primary-purple));
            transition: width 0.3s ease;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--primary-purple); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-8">

    <!-- Header -->
    <div class="text-center mb-6">
        <span class="floating-heading bg-white text-purple-600 px-4 py-1 rounded-full font-bold shadow-sm border border-purple-100">
            Giáo viên tạo: Ms. Chí Nên 🎓
        </span>
        <h1 class="text-3xl md:text-4xl font-extrabold mt-3 text-gray-800">
            Word Form Masterclass <span class="text-teal-500">(Part 3)</span>
        </h1>
    </div>

    <!-- Main Quiz Container -->
    <div id="quiz-container" class="w-full max-w-3xl">
        
        <!-- Progress -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold text-gray-600" id="question-counter">Câu hỏi 1/18</span>
                <span class="font-bold text-purple-600" id="score-display">Điểm: 0</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 5.5%"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div id="question-card" class="glass-card p-6 md:p-10 mb-8 relative overflow-hidden">
            <div id="question-text" class="text-xl md:text-2xl font-bold text-gray-800 mb-8 leading-relaxed text-center">
                <!-- Question content goes here -->
            </div>

            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Options go here -->
            </div>

            <!-- Explanation Box -->
            <div id="explanation-container" class="explanation-box mt-8 p-6 bg-purple-50 rounded-2xl">
                <div class="flex items-center mb-3">
                    <span class="bg-purple-600 text-white p-2 rounded-lg mr-3">💡</span>
                    <h3 class="font-extrabold text-purple-800 text-lg">Ms. Chí Nên giải thích:</h3>
                </div>
                <div id="explanation-content" class="text-gray-700 leading-relaxed text-sm md:text-base">
                    <!-- Explanation content goes here -->
                </div>
                <button onclick="nextQuestion()" class="mt-6 w-full py-4 bg-teal-500 text-white rounded-2xl font-black text-lg hover:bg-teal-600 transition-colors shadow-lg border-b-4 border-teal-700">
                    TIẾP THEO ➔
                </button>
            </div>
        </div>
    </div>

    <!-- Final Result Modal (Hidden) -->
    <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="glass-card w-full max-w-md p-10 text-center scale-up">
            <div class="text-6xl mb-4" id="result-emoji">🏆</div>
            <h2 class="text-3xl font-black text-gray-800 mb-2" id="result-title">XUẤT SẮC!</h2>
            <p class="text-gray-600 mb-6 text-lg" id="result-score-text">Bạn đã đạt được 10/10 câu đúng!</p>
            <div id="result-feedback" class="italic text-purple-600 mb-8 px-4 font-bold">
                "Kiến thức của bạn thật tuyệt vời, hãy tiếp tục phát huy nhé!"
            </div>
            <button onclick="location.reload()" class="w-full py-4 bg-purple-600 text-white rounded-2xl font-black text-xl hover:bg-purple-700 transition-all border-b-4 border-purple-900">
                LÀM LẠI BÀI TEST
            </button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <script>
        const quizData = [
            {
                qNumber: 33,
                word: "ENTER",
                question: "The ________ exam is very difficult and few students can finish it.",
                options: [
                    { text: "entrance", isCorrect: true, type: "n", mean: "kỳ thi tuyển sinh/lối vào" },
                    { text: "enter", isCorrect: false, type: "v", mean: "đi vào" },
                    { text: "entry", isCorrect: false, type: "n", mean: "sự đi vào/mục nhập" },
                    { text: "entering", isCorrect: false, type: "v-ing", mean: "việc đi vào" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>entrance</b> (n): lối vào / kỳ thi tuyển sinh</li>
                        <li>B. <b>enter</b> (v): đi vào</li>
                        <li>C. <b>entry</b> (n): sự đi vào / sự tham gia</li>
                        <li>D. <b>entering</b> (v-ing): hành động đi vào</li>
                    </ul>
                    <p><b>2. Dịch nghĩa:</b> "Kỳ thi tuyển sinh rất khó và rất ít học sinh có thể hoàn thành nó."</p>
                    <p><b>3. Tại sao đúng:</b> Ta có cụm danh từ cố định (collocation) <b>"entrance exam"</b> mang nghĩa là kỳ thi đầu vào/tuyển sinh.</p>
                    <p><b>4. Tại sao sai:</b> Enter là động từ không đứng trước danh từ 'exam' để tạo nghĩa này. Entry dùng để chỉ sự gia nhập chung chung hơn.</p>
                `
            },
            {
                qNumber: 34,
                word: "SLOW",
                question: "The bus ran so ________ that I was late for school.",
                options: [
                    { text: "slowly", isCorrect: true, type: "adv", mean: "một cách chậm chạp" },
                    { text: "slow", isCorrect: false, type: "adj", mean: "chậm" },
                    { text: "slowness", isCorrect: false, type: "n", mean: "sự chậm chạp" },
                    { text: "slowing", isCorrect: false, type: "v-ing", mean: "đang làm chậm lại" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>slowly</b> (adv): một cách chậm chạp</li>
                        <li>B. <b>slow</b> (adj): chậm</li>
                        <li>C. <b>slowness</b> (n): sự chậm chạp</li>
                        <li>D. <b>slowing</b> (v-ing): làm chậm lại</li>
                    </ul>
                    <p><b>2. Dịch nghĩa:</b> "Xe buýt chạy chậm đến nỗi tôi bị muộn học."</p>
                    <p><b>3. Tại sao đúng:</b> 'Ran' (quá khứ của run) là động từ thường, nên cần một <b>trạng từ (adv)</b> theo sau để bổ nghĩa cho hành động chạy.</p>
                    <p><b>4. Tại sao sai:</b> 'Slow' là tính từ thường đi sau tobe. 'Slowness' là danh từ không đứng ở vị trí này.</p>
                `
            },
            {
                qNumber: 35,
                word: "TIRED",
                question: "My brother took part in the Vietnam Mountain Marathon in 2019. Although the race was so ________, he really enjoyed the beautiful wild nature.",
                options: [
                    { text: "tiring", isCorrect: true, type: "adj", mean: "gây mệt mỏi (tính chất)" },
                    { text: "tired", isCorrect: false, type: "adj", mean: "mệt mỏi (cảm xúc)" },
                    { text: "tiredness", isCorrect: false, type: "n", mean: "sự mệt mỏi" },
                    { text: "tiresome", isCorrect: false, type: "adj", mean: "phiền hà" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>tiring</b> (adj): gây mệt mỏi</li>
                        <li>B. <b>tired</b> (adj): bị mệt</li>
                        <li>C. <b>tiredness</b> (n): sự mệt mỏi</li>
                        <li>D. <b>tiresome</b> (adj): gây khó chịu</li>
                    </ul>
                    <p><b>2. Dịch nghĩa:</b> "Mặc dù cuộc đua rất mệt mỏi, anh ấy thực sự tận hưởng thiên nhiên..."</p>
                    <p><b>3. Tại sao đúng:</b> Ta dùng tính từ đuôi <b>-ing</b> (tiring) để mô tả tính chất của vật/sự việc (the race - cuộc đua).</p>
                    <p><b>4. Tại sao sai:</b> 'Tired' dùng cho người khi họ cảm thấy mệt mỏi. Ở đây ta đang nói về bản chất của cuộc đua.</p>
                `
            },
            {
                qNumber: 36,
                word: "DIFFER",
                question: "There are ________ ways that you can do to help the community.",
                options: [
                    { text: "different", isCorrect: true, type: "adj", mean: "khác nhau" },
                    { text: "difference", isCorrect: false, type: "n", mean: "sự khác biệt" },
                    { text: "differently", isCorrect: false, type: "adv", mean: "một cách khác biệt" },
                    { text: "differ", isCorrect: false, type: "v", mean: "khác biệt" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>different</b> (adj): khác nhau</li>
                        <li>B. <b>difference</b> (n): sự khác biệt</li>
                        <li>C. <b>differently</b> (adv): một cách khác nhau</li>
                        <li>D. <b>differ</b> (v): khác nhau</li>
                    </ul>
                    <p><b>2. Dịch nghĩa:</b> "Có nhiều cách khác nhau mà bạn có thể làm để giúp đỡ cộng đồng."</p>
                    <p><b>3. Tại sao đúng:</b> Trước danh từ 'ways' cần một <b>tính từ (adj)</b> để bổ nghĩa.</p>
                    <p><b>4. Tại sao sai:</b> Danh từ 'difference' và trạng từ 'differently' không đứng trước danh từ để bổ nghĩa theo cách này.</p>
                `
            },
            {
                qNumber: 37,
                word: "COLOUR",
                question: "Streets are decorated with ________ lights and red banners.",
                options: [
                    { text: "colorful", isCorrect: true, type: "adj", mean: "rực rỡ/nhiều màu" },
                    { text: "colorless", isCorrect: false, type: "adj", mean: "không màu" },
                    { text: "color", isCorrect: false, type: "n", mean: "màu sắc" },
                    { text: "colorfully", isCorrect: false, type: "adv", mean: "một cách rực rỡ" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>colorful</b> (adj): rực rỡ, đầy màu sắc</li>
                        <li>B. <b>colorless</b> (adj): không màu</li>
                        <li>C. <b>color</b> (n): màu sắc</li>
                        <li>D. <b>colorfully</b> (adv): một cách rực rỡ</li>
                    </ul>
                    <p><b>2. Dịch nghĩa:</b> "Đường phố được trang trí bằng đèn rực rỡ và biểu ngữ đỏ."</p>
                    <p><b>3. Tại sao đúng:</b> Trước danh từ 'lights' cần một <b>tính từ</b>. 'Colorful' phù hợp với ngữ cảnh 'trang trí' (decorated).</p>
                    <p><b>4. Tại sao sai:</b> 'Colorless' là không màu, không phù hợp để trang trí lễ hội.</p>
                `
            },
            {
                qNumber: 38,
                word: "CELEBRATE",
                question: "Vietnam's New Year is ________ according to the Lunar calendar.",
                options: [
                    { text: "celebrated", isCorrect: true, type: "v-p2", mean: "được tổ chức" },
                    { text: "celebration", isCorrect: false, type: "n", mean: "lễ kỷ niệm" },
                    { text: "celebrate", isCorrect: false, type: "v", mean: "tổ chức" },
                    { text: "celebrating", isCorrect: false, type: "v-ing", mean: "đang tổ chức" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>celebrated</b> (V3/ed): được tổ chức</li>
                        <li>B. <b>celebration</b> (n): sự tổ chức/lễ</li>
                        <li>C. <b>celebrate</b> (v): tổ chức</li>
                        <li>D. <b>celebrating</b> (v-ing): việc tổ chức</li>
                    </ul>
                    <p><b>2. Dịch nghĩa:</b> "Năm mới của Việt Nam được tổ chức theo âm lịch."</p>
                    <p><b>3. Tại sao đúng:</b> Đây là câu <b>bị động (Passive Voice)</b>: S + be + V3/ed. Tết không thể tự tổ chức mà phải được con người tổ chức.</p>
                    <p><b>4. Tại sao sai:</b> Sau 'is' trong câu này không thể dùng 'celebration' (danh từ) vì nó không định nghĩa chủ ngữ.</p>
                `
            },
            {
                qNumber: 39,
                word: "TRADITION",
                question: "________, this dish is cooked with coconut and beans.",
                options: [
                    { text: "Traditionally", isCorrect: true, type: "adv", mean: "theo truyền thống" },
                    { text: "Traditional", isCorrect: false, type: "adj", mean: "thuộc về truyền thống" },
                    { text: "Tradition", isCorrect: false, type: "n", mean: "truyền thống" },
                    { text: "Traditionalist", isCorrect: false, type: "n", mean: "người bảo thủ" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>Traditionally</b> (adv): một cách truyền thống</li>
                        <li>B. <b>Traditional</b> (adj): mang tính truyền thống</li>
                        <li>C. <b>Tradition</b> (n): truyền thống</li>
                        <li>D. <b>Traditionalist</b> (n): người theo chủ nghĩa truyền thống</li>
                    </ul>
                    <p><b>2. Dịch nghĩa:</b> "Theo truyền thống, món ăn này được nấu với dừa và đậu."</p>
                    <p><b>3. Tại sao đúng:</b> Từ đứng đầu câu, ngăn cách bằng dấu phẩy và bổ nghĩa cho cả mệnh đề phải là một <b>trạng từ (adv)</b>.</p>
                    <p><b>4. Tại sao sai:</b> Các loại từ khác không thể đứng một mình đầu câu làm chức năng bổ nghĩa cho cả câu.</p>
                `
            },
            {
                qNumber: 40,
                word: "PROPER",
                question: "You should eat ________ every day and you shouldn't skip breakfast.",
                options: [
                    { text: "properly", isCorrect: true, type: "adv", mean: "một cách đúng đắn" },
                    { text: "proper", isCorrect: false, type: "adj", mean: "đúng đắn" },
                    { text: "property", isCorrect: false, type: "n", mean: "tài sản" },
                    { text: "appropriately", isCorrect: false, type: "adv", mean: "thích hợp" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>properly</b> (adv): đúng cách, hợp lý</li>
                        <li>B. <b>proper</b> (adj): thích đáng</li>
                        <li>C. <b>property</b> (n): tài sản</li>
                        <li>D. <b>appropriately</b> (adv): phù hợp</li>
                    </ul>
                    <p><b>2. Dịch nghĩa:</b> "Bạn nên ăn uống đúng cách mỗi ngày và không nên bỏ bữa sáng."</p>
                    <p><b>3. Tại sao đúng:</b> Bổ nghĩa cho động từ 'eat' cần một trạng từ (adv).</p>
                    <p><b>4. Tại sao sai:</b> 'Property' là danh từ chỉ tài sản, hoàn toàn sai nghĩa.</p>
                `
            },
            {
                qNumber: 41,
                word: "VOLUNTEER",
                question: "The homeless shelters are entirely operated by ________ worker.",
                options: [
                    { text: "volunteer", isCorrect: true, type: "n/adj", mean: "tình nguyện viên" },
                    { text: "voluntary", isCorrect: false, type: "adj", mean: "tự nguyện" },
                    { text: "voluntarily", isCorrect: false, type: "adv", mean: "một cách tự nguyện" },
                    { text: "volunteering", isCorrect: false, type: "v-ing", mean: "việc làm tình nguyện" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>volunteer</b>: (n/adj) tình nguyện viên</li>
                        <li>B. <b>voluntary</b>: (adj) tự nguyện</li>
                        <li>C. <b>voluntarily</b>: (adv) một cách tự nguyện</li>
                        <li>D. <b>volunteering</b>: (v-ing) hoạt động tình nguyện</li>
                    </ul>
                    <p><b>2. Dịch nghĩa:</b> "Các nơi trú ẩn cho người vô gia cư được điều hành hoàn toàn bởi nhân viên tình nguyện."</p>
                    <p><b>3. Tại sao đúng:</b> <b>"Volunteer worker"</b> là một danh từ ghép (compound noun) cực kỳ phổ biến.</p>
                    <p><b>4. Tại sao sai:</b> Voluntary (adj) thường dùng cho hành động 'voluntary action', còn chỉ người làm tình nguyện ta dùng 'volunteer'.</p>
                `
            },
            {
                qNumber: 42,
                word: "IMPRESS",
                question: "This film made a strong ________ on me.",
                options: [
                    { text: "impression", isCorrect: true, type: "n", mean: "sự ấn tượng" },
                    { text: "impressive", isCorrect: false, type: "adj", mean: "ấn tượng" },
                    { text: "impressively", isCorrect: false, type: "adv", mean: "một cách ấn tượng" },
                    { text: "impress", isCorrect: false, type: "v", mean: "gây ấn tượng" }
                ],
                explanation: `
                    <p><b>1. Phân tích 4 đáp án:</b></p>
                    <ul class="list-disc ml-5 mb-3">
                        <li>A. <b>impression</b> (n): sự ấn tượng</li>
                        <li>B. <b>impressive</b> (adj): mang tính ấn tượng</li>
                        <li>C. <b>impressively</b> (adv): một cách ấn tượng</li>

        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];

        function initQuiz() {
            shuffledQuestions = [...quizData].sort(() => Math.random() - 0.5);
            showQuestion();
        }

        function showQuestion() {
            const q = shuffledQuestions[currentQuestionIndex];
            const qText = document.getElementById("question-text");
            const optionsGrid = document.getElementById("options-grid");
            const explanationContainer = document.getElementById("explanation-container");
            const counter = document.getElementById("question-counter");
            const progress = document.getElementById("progress-fill");

            // Reset UI
            explanationContainer.style.display = "none";
            optionsGrid.innerHTML = "";
            counter.innerText = `Câu hỏi ${currentQuestionIndex + 1}/${shuffledQuestions.length}`;
            progress.style.width = `${((currentQuestionIndex + 1) / shuffledQuestions.length) * 100}%`;

            // Set question text with blank
            qText.innerHTML = `<div class="mb-4"><span class="bg-teal-100 text-teal-800 text-sm py-1 px-3 rounded-full font-bold uppercase">Từ gốc: ${q.word}</span></div>` + 
                              q.question.replace("________", `<span id="blank-space" class="border-b-4 border-dashed border-purple-400 px-4 text-purple-600">________</span>`);

            // Shuffle options for this question
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "btn-option bg-white p-5 rounded-2xl text-left font-bold text-gray-700 shadow-sm border-2 border-gray-100 flex items-center group";
                btn.innerHTML = `
                    <span class="w-10 h-10 flex-shrink-0 bg-gray-100 group-hover:bg-purple-100 rounded-full flex items-center justify-center mr-4 text-purple-600 transition-colors">
                        ${String.fromCharCode(65 + index)}
                    </span>
                    <span class="text-lg">${opt.text}</span>
                `;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, btn) {
            const allButtons = document.querySelectorAll(".btn-option");
            allButtons.forEach(b => b.disabled = true); // Disable all

            const soundCorrect = document.getElementById("sound-correct");
            const soundWrong = document.getElementById("sound-wrong");
            const explanationContainer = document.getElementById("explanation-container");
            const explanationContent = document.getElementById("explanation-content");
            const blankSpace = document.getElementById("blank-space");
            const scoreDisplay = document.getElementById("score-display");

            if (selectedOption.isCorrect) {
                // CORRECT
                score += 1;
                scoreDisplay.innerText = `Điểm: ${score}`;
                btn.classList.add("bg-green-100", "border-green-500", "text-green-700");
                btn.style.borderBottomColor = "#00A855";
                blankSpace.innerText = selectedOption.text;
                blankSpace.classList.add("text-green-600", "border-solid", "border-green-500");
                
                // Play sound
                soundCorrect.currentTime = 0;
                soundCorrect.play().catch(e => {});

                // Confetti
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00C9A7', '#8854C0', '#00D26A']
                });
            } else {
                // WRONG
                btn.classList.add("bg-red-100", "border-red-500", "text-red-700", "shake-anim");
                btn.style.borderBottomColor = "#D63031";
                
                // Highlight correct one
                allButtons.forEach(b => {
                    const optText = b.querySelector(".text-lg").innerText;
                    const originalOpt = shuffledQuestions[currentQuestionIndex].options.find(o => o.text === optText);
                    if (originalOpt && originalOpt.isCorrect) {
                        b.classList.add("bg-green-50", "border-green-300");
                    }
                });

                // Play sound
                soundWrong.currentTime = 0;
                soundWrong.play().catch(e => {});
            }

            // Show explanation
            explanationContent.innerHTML = shuffledQuestions[currentQuestionIndex].explanation;
            explanationContainer.style.display = "block";
            
            // Scroll to explanation
            setTimeout(() => {
                explanationContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                showQuestion();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            const modal = document.getElementById("result-modal");
            const scoreText = document.getElementById("result-score-text");
            const feedback = document.getElementById("result-feedback");
            const emoji = document.getElementById("result-emoji");
            const title = document.getElementById("result-title");

            scoreText.innerText = `Bạn đã đạt được ${score}/${shuffledQuestions.length} câu đúng!`;
            
            const percent = (score / shuffledQuestions.length) * 100;
            if (percent >= 90) {
                emoji.innerText = "👑";
                title.innerText = "SIÊU NHÂN CỦA CÔ!";
                feedback.innerText = "Ms. Chí Nên cực kỳ tự hào về em. Kiến thức của em vững như bàn thạch!";
            } else if (percent >= 70) {
                emoji.innerText = "🌟";
                title.innerText = "LÀM TỐT LẮM!";
                feedback.innerText = "Em rất có tiềm năng đấy, chỉ cần chú ý hơn các bẫy từ loại một chút thôi nhé.";
            } else {
                emoji.innerText = "💪";
                title.innerText = "CỐ GẮNG LÊN NÀO!";
                feedback.innerText = "Đừng nản lòng nhé, hãy xem lại các phần giải thích của cô và thử lại lần nữa!";
            }

            modal.classList.remove("hidden");
            confetti({
                particleCount: 200,
                spread: 100,
                origin: { y: 0.6 }
            });
        }

        // Initialize on load
        window.onload = initQuiz;

    </script>
