<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Mastery Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #00C9A7;
            --accent: #FFD166;
            --correct: #00D26A;
            --correct-shadow: #00994d;
            --wrong: #FF4757;
            --wrong-shadow: #cc0000;
            --text: #2d3436;
            --bg-light: rgba(255, 255, 255, 0.95);
        }

        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text);
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-small {
            text-align: center;
            font-size: 14px;
            color: var(--primary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            background: #fff;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .main-title {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 0 var(--primary), -2px -2px 0 var(--primary), 2px -2px 0 var(--primary), -2px 2px 0 var(--primary), 0 4px 0 rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .section-title {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 800;
            margin-top: 40px;
            margin-bottom: 20px;
            box-shadow: 0 5px 0 #5f3a87;
        }

        .card {
            background: var(--bg-light);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05);
            transition: transform 0.3s;
            position: relative;
        }

        .question-text {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* MCQ Styles */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-option {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #e0e0e0;
            text-align: left;
        }

        .btn-option:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: var(--secondary);
            box-shadow: 0 5px 0 var(--secondary);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 0 0 transparent;
        }

        .btn-option.correct {
            background: var(--correct);
            border-color: var(--correct);
            color: white;
            box-shadow: 0 5px 0 var(--correct-shadow);
        }

        .btn-option.wrong {
            background: var(--wrong);
            border-color: var(--wrong);
            color: white;
            box-shadow: 0 5px 0 var(--wrong-shadow);
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Gap Fill Styles */
        .gap {
            display: inline-block;
            min-width: 80px;
            height: 35px;
            border-bottom: 3px solid var(--primary);
            background: #f0e6ff;
            border-radius: 8px 8px 0 0;
            margin: 0 5px;
            cursor: pointer;
            text-align: center;
            font-weight: 800;
            color: var(--primary);
            line-height: 35px;
            padding: 0 10px;
            transition: all 0.2s;
        }

        .gap:hover {
            background: var(--accent);
            border-bottom-color: #e6b800;
        }

        .gap.filled-correct {
            background: var(--correct);
            border-bottom-color: var(--correct-shadow);
            color: white;
            pointer-events: none;
        }
        
        .gap.filled-wrong {
            background: var(--wrong);
            border-bottom-color: var(--wrong-shadow);
            color: white;
            animation: shake 0.4s;
        }

        /* Sorting/Reorder Styles */
        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            min-height: 50px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #ccc;
        }

        .chip {
            background: var(--secondary);
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #009980;
            transition: all 0.2s;
        }
        .chip:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        .check-order-btn {
            background: var(--accent);
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 16px;
            color: #d49a00;
            cursor: pointer;
            box-shadow: 0 5px 0 #d49a00;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .check-order-btn:hover { transform: scale(1.05); }
        .check-order-btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }

        /* Explanation Box */
        .explanation {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fdfbf7;
            border: 2px solid #ffeaa7;
            border-left: 8px solid var(--accent);
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.6;
            animation: slideDown 0.3s ease-out;
        }
        .explanation h4 {
            margin-top: 0;
            color: #d35400;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .explanation strong { color: var(--primary); }
        .explanation ul { padding-left: 20px; }
        .explanation li { margin-bottom: 8px; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Popup Modal for Gap Fill */
        #gapModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-btn {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #5f3a87;
        }
        .modal-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        /* Submit Button */
        .submit-container {
            text-align: center;
            margin: 40px 0;
        }
        .submit-btn {
            background: var(--primary);
            color: white;
            font-size: 24px;
            font-weight: 900;
            padding: 15px 40px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 #5f3a87;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
        }
        .submit-btn:hover { transform: scale(1.05); }
        .submit-btn:active { transform: translateY(8px); box-shadow: 0 0 0 transparent; }

        /* Result Popup */
        #resultModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .result-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .result-score {
            font-size: 48px;
            font-weight: 900;
            color: var(--primary);
            margin: 20px 0;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <audio id="sound-correct" src="https://actions.google.com/sounds/v1/cartoon/bell_ding.ogg"></audio>
    <audio id="sound-wrong" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>

    <div class="container" id="quiz-container">
        <div style="text-align: center;">
            <div class="header-small">Giáo viên tạo: Ms. Chí Nên </div>
            <div class="main-title">🌟 ENGLISH MASTERY TEST 🌟</div>
        </div>

        </div>

    <div class="submit-container">
        <button class="submit-btn" onclick="showResults()"><i class="fas fa-flag-checkered"></i> NỘP BÀI!</button>
    </div>

    <div id="gapModal">
        <div class="modal-content" id="gapModalContent">
            <h3 style="margin-top:0; color: var(--primary);">Chọn đáp án đúng</h3>
            <div id="gapOptionsContainer"></div>
            <button onclick="closeGapModal()" style="margin-top:15px; padding:10px; border-radius:10px; border:none; background:#ccc; cursor:pointer;">Hủy</button>
        </div>
    </div>

    <div id="resultModal">
        <div class="result-content">
            <h2 style="color: var(--primary); font-size: 32px;"><i class="fas fa-crown"></i> CHÚC MỪNG!</h2>
            <p style="font-size: 18px; color: #666;">Bạn đã hoàn thành xuất sắc bài kiểm tra!</p>
            <div class="result-score" id="finalScore">0 / 0</div>
            <p id="resultMessage" style="font-size: 20px; font-weight: 700; color: var(--secondary);"></p>
            <button class="submit-btn" style="font-size: 18px; padding: 10px 30px;" onclick="location.reload()">Làm Lại Nhé!</button>
        </div>
    </div>

<script>
// ==========================================
// CƠ SỞ DỮ LIỆU CÂU HỎI & GIẢI THÍCH SIÊU CHI TIẾT
// ==========================================
const quizData = [
    {
        section: "I. Find the word which has a different stress position from the others.",
        questions: [
            {
                type: "mcq",
                q: "1. A. culture B. farmer C. native D. arrive",
                options: ["A. culture", "B. farmer", "C. native", "D. arrive"],
                answer: "D. arrive",
                exp: `1. <strong>Dịch câu hỏi:</strong> Tìm từ có trọng âm khác với các từ còn lại.<br>
                      2. <strong>Phân tích 4 đáp án:</strong><br>
                      - A. culture /ˈkʌl.tʃər/ (n): văn hóa -> Trọng âm âm tiết 1.<br>
                      - B. farmer /ˈfɑː.mər/ (n): nông dân -> Trọng âm âm tiết 1.<br>
                      - C. native /ˈneɪ.tɪv/ (adj): bản địa -> Trọng âm âm tiết 1.<br>
                      - D. arrive /əˈraɪv/ (v): đến -> Trọng âm âm tiết 2.<br>
                      3. <strong>Tại sao chọn D?</strong> Vì 'arrive' có trọng âm rơi vào âm tiết thứ 2, trong khi các từ còn lại rơi vào âm tiết 1.<br>
                      4. <strong>Tại sao 3 đáp án còn lại sai?</strong> Vì chúng đều có chung quy luật trọng âm (rơi vào âm 1), không phải là từ có sự khác biệt.`
            },
            {
                type: "mcq",
                q: "2. A. species B. until C. complete D. throughout",
                options: ["A. species", "B. until", "C. complete", "D. throughout"],
                answer: "A. species",
                exp: `1. <strong>Dịch câu hỏi:</strong> Tìm từ có trọng âm khác biệt.<br>
                      2. <strong>Phân tích:</strong><br>
                      - A. species /ˈspiː.ʃiːz/ (n): giống, loài -> Trọng âm 1.<br>
                      - B. until /ənˈtɪl/ (prep): cho đến khi -> Trọng âm 2.<br>
                      - C. complete /kəmˈpliːt/ (v/adj): hoàn thành -> Trọng âm 2.<br>
                      - D. throughout /θruːˈaʊt/ (prep): xuyên suốt -> Trọng âm 2.<br>
                      3. <strong>Tại sao chọn A?</strong> Trọng âm của 'species' rơi vào âm 1, các từ còn lại âm 2.<br>
                      4. <strong>Tại sao sai?</strong> B, C, D đều có chung trọng âm 2.`
            },
            {
                type: "mcq",
                q: "3. A. honesty B. variety C. usually D. musical",
                options: ["A. honesty", "B. variety", "C. usually", "D. musical"],
                answer: "B. variety",
                exp: `1. <strong>Dịch:</strong> Tìm từ có trọng âm khác biệt.<br>
                      2. <strong>Phân tích:</strong><br>
                      - A. honesty /ˈɒn.ə.sti/ (n): sự trung thực -> Trọng âm 1.<br>
                      - B. variety /vəˈraɪ.ə.ti/ (n): sự đa dạng -> Trọng âm 2. (Quy tắc: từ tận cùng đuôi -ety trọng âm rơi vào trước nó).<br>
                      - C. usually /ˈjuː.ʒu.ə.li/ (adv): thường xuyên -> Trọng âm 1.<br>
                      - D. musical /ˈmjuː.zɪ.kəl/ (adj): thuộc về âm nhạc -> Trọng âm 1.<br>
                      3. <strong>Tại sao chọn B?</strong> Trọng âm rơi vào âm tiết 2, khác với các từ còn lại rơi vào âm 1.`
            },
            {
                type: "mcq",
                q: "4. A. yesterday B. occasion C. generous D. evening",
                options: ["A. yesterday", "B. occasion", "C. generous", "D. evening"],
                answer: "B. occasion",
                exp: `1. <strong>Dịch:</strong> Tìm từ có trọng âm khác biệt.<br>
                      2. <strong>Phân tích:</strong><br>
                      - A. yesterday /ˈjes.tə.deɪ/ (n/adv): ngày hôm qua -> Trọng âm 1.<br>
                      - B. occasion /əˈkeɪ.ʒən/ (n): dịp, cơ hội -> Trọng âm 2. (Từ đuôi -ion trọng âm rơi vào ngay trước nó).<br>
                      - C. generous /ˈdʒen.ər.əs/ (adj): hào phóng -> Trọng âm 1.<br>
                      - D. evening /ˈiːv.nɪŋ/ (n): buổi tối -> Trọng âm 1.<br>
                      3. <strong>Tại sao chọn B?</strong> 'occasion' có trọng âm 2, khác với phần còn lại có trọng âm 1.`
            },
            {
                type: "mcq",
                q: "5. A. disadvantage B. environment C. speciality D. nationality",
                options: ["A. disadvantage", "B. environment", "C. speciality", "D. nationality"],
                answer: "B. environment",
                exp: `1. <strong>Dịch:</strong> Tìm từ có trọng âm khác biệt.<br>
                      2. <strong>Phân tích:</strong><br>
                      - A. disadvantage /ˌdɪs.ədˈvɑːn.tɪdʒ/ (n): bất lợi -> Trọng âm chính rơi vào âm 3.<br>
                      - B. environment /ɪnˈvaɪ.rən.mənt/ (n): môi trường -> Trọng âm 2.<br>
                      - C. speciality /ˌspeʃ.iˈæl.ə.ti/ (n): đặc sản -> Trọng âm 3 (đuôi -ity).<br>
                      - D. nationality /ˌnæʃ.ənˈæl.ə.ti/ (n): quốc tịch -> Trọng âm 3 (đuôi -ity).<br>
                      3. <strong>Tại sao chọn B?</strong> 'environment' có trọng âm 2, trong khi các từ còn lại có trọng âm chính rơi vào âm tiết thứ 3.`
            }
        ]
    },
    {
        section: "II. Complete the sentences with the correct form of the words in brackets. (GAP FILL)",
        questions: [
            {
                type: "gap",
                text: "1. The tornado [gap] lots of roofs in our village. (damage)",
                options: ["damage", "damaged", "damages", "damaging"],
                answer: "damaged",
                exp: `1. <strong>Dịch câu:</strong> Cơn lốc xoáy đã làm hư hỏng nhiều mái nhà trong làng của chúng tôi.<br>
                      2. <strong>Phân tích từ:</strong> Từ gốc "damage" (động từ/danh từ). Cần điền một động từ. Các dạng: damage (V1), damaged (V-ed), damages (V-s), damaging (V-ing).<br>
                      3. <strong>Tại sao chọn 'damaged'?</strong> Sự việc "cơn lốc xoáy tàn phá" đã xảy ra trong quá khứ, nên phải chia thì Quá khứ đơn (Past Simple).<br>
                      4. <strong>Tại sao các dạng khác sai?</strong> 'damage'/'damages' (hiện tại) sai ngữ cảnh, 'damaging' thiếu to be (was damaging).`
            },
            {
                type: "gap",
                text: "2. I want to [gap] about this problem with your manager. (complaint)",
                options: ["complain", "complaint", "complained", "complaining"],
                answer: "complain",
                exp: `1. <strong>Dịch câu:</strong> Tôi muốn phàn nàn về vấn đề này với quản lý của bạn.<br>
                      2. <strong>Phân tích từ:</strong> Từ gốc "complaint" (Danh từ: lời phàn nàn). Động từ tương ứng là "complain" (phàn nàn).<br>
                      3. <strong>Tại sao chọn 'complain'?</strong> Cấu trúc <strong>want to + V(nguyên thể)</strong>. Do đó ta cần đổi danh từ complaint thành động từ nguyên thể complain.<br>
                      4. <strong>Tại sao sai?</strong> 'complaint' là danh từ không đứng sau 'to' ở đây. 'complained' / 'complaining' sai dạng động từ sau 'to'.`
            },
            {
                type: "gap",
                text: "3. There is a [gap] store at the end of the street. (convenient)",
                options: ["convenient", "convenience", "conveniently", "inconvenient"],
                answer: "convenience",
                exp: `1. <strong>Dịch câu:</strong> Có một cửa hàng tiện lợi ở cuối con phố.<br>
                      2. <strong>Phân tích từ:</strong> "convenient" (Tính từ: tiện lợi). Danh từ là "convenience".<br>
                      3. <strong>Tại sao chọn 'convenience'?</strong> Trong tiếng Anh có Collocation (cụm từ cố định) là <strong>"convenience store"</strong> (cửa hàng tiện lợi), sử dụng danh từ ghép.<br>
                      4. <strong>Tại sao sai?</strong> Không dùng tính từ 'convenient store' dù dịch ra tiếng Việt nghe có vẻ hợp lý. Đây là bẫy cụm từ cố định.`
            },
            {
                type: "gap",
                text: "4. She gave us practical tips about treating [gap] wastes. (poison)",
                options: ["poison", "poisonous", "poisoned", "poisoning"],
                answer: "poisonous",

                      2. <strong>Phân tích:</strong><br>
                      "next Saturday" (thứ 7 tới) -> Tương lai.<br>
                      3. <strong>Tại sao chọn C?</strong> Tương tự câu 5, sự kiện khai trương/khuyến mãi đã được <strong>lên lịch trình sẵn cố định (timetable/schedule)</strong>, ta dùng thì <strong>Hiện tại đơn</strong> để diễn đạt. Vì "sales" là số nhiều -> động từ giữ nguyên "start".<br>
                      4. <strong>Tại sao sai?</strong> D (starts) sai vì chia số ít. B (will start) không sai hoàn toàn nhưng trong văn phạm tiếng Anh chuẩn thì lịch trình chuộng hiện tại đơn hơn.`
            },
            {
                type: "mcq",
                q: "8. There __________ only a few houses left standing after the tornado hit.",
                options: ["A. was", "B. is", "C. were", "D. be"],
                answer: "C. were",
                exp: `1. <strong>Dịch:</strong> Chỉ còn lại vài ngôi nhà đứng vững sau khi cơn lốc xoáy tàn phá.<br>
                      2. <strong>Phân tích:</strong><br>
                      "after the tornado hit" (sau khi lốc xoáy tàn phá) -> Sự việc trong quá khứ -> Dùng to be ở Quá khứ.<br>
                      3. <strong>Tại sao chọn C?</strong> Cấu trúc There + to-be phụ thuộc vào danh từ đứng sau. "a few houses" (một vài ngôi nhà) là <strong>danh từ số nhiều</strong>. Do đó to be quá khứ số nhiều là <strong>"were"</strong>.`
            },
            {
                type: "mcq",
                q: "9. I __________ how to use the computer until my father taught me.",
                options: ["A. don’t know", "B. didn't know", "C. know", "D. won’t know"],
                answer: "B. didn't know",
                exp: `1. <strong>Dịch:</strong> Tôi đã không biết cách sử dụng máy tính cho đến khi bố dạy tôi.<br>
                      2. <strong>Phân tích:</strong><br>
                      Vế sau: "until my father <strong>taught</strong> me" (taught là V2 của teach - Quá khứ).<br>
                      3. <strong>Tại sao chọn B?</strong> Vì sự việc xảy ra trong quá khứ, nên động từ ở vế trước cũng phải lùi về Quá khứ đơn (phủ định) -> didn't know.<br>
                      4. <strong>Tại sao sai?</strong> A, C, D là các thì Hiện tại / Tương lai, sai sự hòa hợp về thì (Sequence of Tenses).`
            },
            {
                type: "mcq",
                q: "10. Listen to the announcement. The train __________ till 12:00.",
                options: ["A. leaves", "B. left", "C. won’t leave", "D. doesn’t leave"],
                answer: "D. doesn’t leave",
                exp: `1. <strong>Dịch:</strong> Hãy nghe thông báo kìa. Chuyến tàu sẽ không rời đi cho đến tận 12:00.<br>
                      2. <strong>Phân tích:</strong><br>
                      "The train... till 12:00" -> Lịch trình tàu chạy.<br>
                      3. <strong>Tại sao chọn D?</strong> Lịch trình tàu xe luôn sử dụng thì <strong>Hiện tại đơn</strong> để chỉ tương lai. Thể phủ định của The train (số ít) ở hiện tại đơn là <strong>doesn't leave</strong>.<br>
                      4. <strong>Tại sao sai?</strong> C (won't leave) là tương lai đơn, không dùng cho lịch trình cố định của phương tiện giao thông.`
            }
        ]
    },
    {
        section: "VIII. Reorder the words and phrases to make complete sentences.",
        questions: [
            {
                type: "reorder",
                words: "example / A / a / is / an / marine ecosystem / of / coral reef /.",
                answer: "A coral reef is an example of a marine ecosystem.",
                exp: `1. <strong>Dịch câu hoàn chỉnh:</strong> Rạn san hô là một ví dụ về hệ sinh thái biển.<br>
                      2. <strong>Phân tích từ vựng/ngữ pháp:</strong><br>
                      - "A coral reef": Rạn san hô (Chủ ngữ).<br>
                      - "is an example of": là một ví dụ của (Cụm cấu trúc cố định).<br>
                      - "a marine ecosystem": một hệ sinh thái biển (Tân ngữ).<br>
                      3. <strong>Tại sao sắp xếp vậy?</strong> Chủ ngữ (A coral reef) + Động từ to be (is) + Cụm danh từ bổ ngữ (an example of a marine ecosystem). Nhớ viết hoa chữ A đầu câu.`
            },
            {
                type: "reorder",
                words: "species / The / is / endangered / sea turtle / an /.",
                answer: "The sea turtle is an endangered species.",
                exp: `1. <strong>Dịch câu hoàn chỉnh:</strong> Rùa biển là một loài đang bị đe dọa (có nguy cơ tuyệt chủng).<br>
                      2. <strong>Phân tích từ vựng/ngữ pháp:</strong><br>
                      - "The sea turtle": Rùa biển (Chủ ngữ đại diện cho cả loài).<br>
                      - "an endangered species": một loài có nguy cơ tuyệt chủng.<br>
                      3. <strong>Cấu trúc:</strong> S + is + N. Tính từ 'endangered' đứng trước danh từ 'species'. Vì 'endangered' bắt đầu bằng nguyên âm 'e' nên phải dùng mạo từ 'an'.`
            },
            {
                type: "reorder",
                words: "kind / of / What / disasters / are / talking / about, / they / or manmade / natural / ?",
                answer: "What kind of disasters are they talking about, natural or manmade?",
                exp: `1. <strong>Dịch câu hoàn chỉnh:</strong> Họ đang nói về loại thảm họa nào, thiên nhiên hay nhân tạo?<br>
                      2. <strong>Phân tích cấu trúc:</strong><br>
                      - Cấu trúc câu hỏi: "What kind of + Danh từ số nhiều" (Loại ... nào?). -> What kind of disasters...<br>
                      - Hiện tại tiếp diễn: ...are they talking about...?<br>
                      - Cụm liệt kê lựa chọn: natural or manmade (thiên nhiên hay nhân tạo).<br>
                      3. <strong>Tại sao sắp xếp vậy?</strong> Bắt đầu bằng từ để hỏi (What), ghép cụm từ hỏi (What kind of disasters), đảo to be (are) lên trước chủ ngữ (they), động từ (talking about), và cuối cùng là cụm liệt kê.`
            },
            {
                type: "reorder",
                words: "watch / Can / bought / return / the / that / I / I / yesterday / your / shop / from?",
                answer: "Can I return the watch that I bought from your shop yesterday?",
                exp: `1. <strong>Dịch câu hoàn chỉnh:</strong> Tôi có thể trả lại chiếc đồng hồ mà tôi đã mua từ cửa hàng của bạn hôm qua không?<br>
                      2. <strong>Phân tích ngữ pháp (Mệnh đề quan hệ):</strong><br>
                      - Câu hỏi lịch sự: Can I return the watch...?<br>
                      - Mệnh đề quan hệ bổ nghĩa cho 'the watch': "that I bought from your shop yesterday".<br>
                      3. <strong>Lỗi thường gặp:</strong> Học sinh hay nhầm để 'yesterday' vào giữa câu. Trạng từ chỉ thời gian (yesterday) thường đứng cuối câu.`
            },
            {
                type: "reorder",
                words: "sell / People / at / the / a lot of / open-air market / local specialities /.",
                answer: "People sell a lot of local specialities at the open-air market.",
                exp: `1. <strong>Dịch câu hoàn chỉnh:</strong> Người ta bán rất nhiều đặc sản địa phương ở khu chợ ngoài trời.<br>
                      2. <strong>Phân tích thành phần câu:</strong><br>
                      - Chủ ngữ: People (Người ta).<br>
                      - Động từ: sell (bán).<br>
                      - Tân ngữ (Bán cái gì?): a lot of local specialities (nhiều đặc sản địa phương).<br>
                      - Trạng ngữ chỉ nơi chốn: at the open-air market (tại chợ ngoài trời).<br>
                      3. <strong>Cấu trúc:</strong> S + V + O + Nơi chốn.`
            },
            {
                type: "reorder",
                words: "participate / More and more / activities / people / Earth Day / in /.",
                answer: "More and more people participate in Earth Day activities.",
                exp: `1. <strong>Dịch câu hoàn chỉnh:</strong> Ngày càng có nhiều người tham gia vào các hoạt động của Ngày Trái Đất.<br>
                      2. <strong>Phân tích cụm từ:</strong><br>
                      - Cụm so sánh kép: "More and more people" (Ngày càng nhiều người).<br>
                      - Collocation: "participate in" (tham gia vào).<br>
                      - Cụm danh từ: "Earth Day activities" (các hoạt động Ngày Trái Đất).<br>
                      3. <strong>Tại sao sắp xếp vậy?</strong> Chủ ngữ (More and more people) + Động từ (participate in) + Tân ngữ (Earth Day activities).`
            }
        ]
    }
];

// ==========================================
// RENDER & LOGIC ĐIỀU KHIỂN
// ==========================================
let totalQuestions = 0;
let correctAnswers = 0;
let isAnswered = {}; // Trạng thái lưu câu nào đã làm
let currentGapTarget = null; // Quản lý gap đang click

const container = document.getElementById('quiz-container');

// Hàm trộn mảng (Shuffle array)
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// Khởi tạo giao diện
function initQuiz() {
    let qIndex = 0;
    quizData.forEach((sec, secIndex) => {
        // Render Section Title
        const secTitle = document.createElement('div');
        secTitle.className = 'section-title';
        secTitle.innerHTML = `<i class="fas fa-star" style="color:#FFD166;"></i> ${sec.section}`;
        container.appendChild(secTitle);

        sec.questions.forEach((q, qLocalIndex) => {
            qIndex++;
            totalQuestions++;
            isAnswered[qIndex] = false;

            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${qIndex}`;

            // Render dựa trên Type (mcq, gap, reorder)
            if (q.type === 'mcq') {
                let optionsHtml = '';
                // Shuffle options
                const shuffledOpts = shuffleArray([...q.options]);
                shuffledOpts.forEach(opt => {
                    optionsHtml += `<button class="btn-option" onclick="checkMCQ('${opt}', '${q.answer}', ${qIndex}, this)">${opt}</button>`;
                });

                card.innerHTML = `
                    <div class="question-text">${q.q}</div>
                    <div class="options-grid" id="options-${qIndex}">${optionsHtml}</div>
                    <div class="explanation" id="exp-${qIndex}">
                        <h4><i class="fas fa-lightbulb"></i> GIẢI THÍCH CHI TIẾT</h4>
                        ${q.exp}
                    </div>
                `;
            } 
            else if (q.type === 'gap') {
                let renderedText = q.text;
                // Nếu là gap có nhiều chỗ trống (VD: past simple vs continuous)
                const gapsAnswer = Array.isArray(q.answer) ? q.answer : [q.answer];
                
                gapsAnswer.forEach((ans, idx) => {
                    const optsString = Array.isArray(q.options) ? q.options.join('|') : q.options;
                    // Build special data structure to pass to popup
                    renderedText = renderedText.replace('[gap]', `<span class="gap" data-qindex="${qIndex}" data-gapindex="${idx}" data-answer="${ans}" data-options="${optsString}" onclick="openGapModal(this)">___</span>`);
                });

                card.innerHTML = `
                    <div class="question-text">${renderedText}</div>
                    <div class="explanation" id="exp-${qIndex}">
                        <h4><i class="fas fa-lightbulb"></i> GIẢI THÍCH CHI TIẾT</h4>
                        ${q.exp}
                    </div>
                `;
            }
            else if (q.type === 'reorder') {
                const words = shuffleArray(q.words.split(' / ').filter(w => w !== '.' && w !== '?' && w !== ''));
                let chipsHtml = '';
                words.forEach((w, wIdx) => {
                    chipsHtml += `<div class="chip" onclick="moveChip(this, 'bank-${qIndex}', 'answer-${qIndex}')">${w}</div>`;
                });

                // Xử lý dấu câu cuối (nếu có)
                const endMark = q.words.includes('?') ? '?' : '.';

                card.innerHTML = `
                    <div class="question-text"><i class="fas fa-sort-amount-down-alt" style="color:var(--primary)"></i> Sắp xếp lại câu (Bấm vào từ để di chuyển):</div>
                    <div class="chip-container" id="bank-${qIndex}">${chipsHtml}</div>
                    <div class="question-text">Câu trả lời của bạn:</div>
                    <div class="chip-container" id="answer-${qIndex}" style="background:#fff; border-color:var(--primary);"></div>
                    <button class="check-order-btn" onclick="checkReorder(${qIndex}, '${q.answer.replace(/'/g, "\\'")}', '${endMark}')"><i class="fas fa-check-circle"></i> Kiểm tra</button>
                    <div class="explanation" id="exp-${qIndex}">
                        <h4><i class="fas fa-lightbulb"></i> GIẢI THÍCH CHI TIẾT</h4>
                        ${q.exp}
                    </div>
                `;
            }
            container.appendChild(card);
        });
    });
}

// Play Sound function
function playSound(type) {
    try {
        const audio = document.getElementById(`sound-${type}`);
        audio.currentTime = 0;
        audio.play();
    } catch(e) {}
}

// Trigger Confetti
function shootConfetti() {
    confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#8854C0', '#00C9A7', '#FFD166']
    });
}

// Kiểm tra Multiple Choice
function checkMCQ(selected, correct, qIndex, btnEl) {
    if (isAnswered[qIndex]) return;
    isAnswered[qIndex] = true;

    const optionsDiv = document.getElementById(`options-${qIndex}`);
    const buttons = optionsDiv.getElementsByTagName('button');

    for (let btn of buttons) {
        btn.disabled = true;
        if (btn.innerText === correct) {
            btn.classList.add('correct');
        } else if (btn === btnEl && selected !== correct) {
            btn.classList.add('wrong');
        }
    }

    if (selected === correct) {
        correctAnswers++;
        playSound('correct');
        shootConfetti();
    } else {
        playSound('wrong');
    }

    // Hiển thị giải thích
    document.getElementById(`exp-${qIndex}`).style.display = 'block';
}

// Logic cho Gap Fill
function openGapModal(gapEl) {
    if (gapEl.classList.contains('filled-correct') || gapEl.classList.contains('filled-wrong')) return; // Đã điền xong
    
    currentGapTarget = gapEl;
    const optionsRaw = gapEl.getAttribute('data-options').split('|');
    
    // Nếu option có dạng "Were you swimming|stole", ta phải cắt ra tùy vào vị trí gap
    const gapIndex = parseInt(gapEl.getAttribute('data-gapindex') || 0);
    
    const container = document.getElementById('gapOptionsContainer');
    container.innerHTML = '';

    // Xử lý options: Trộn mảng để tạo sự bất ngờ
    const finalOptions = [];
    optionsRaw.forEach(optString => {
        const parts = optString.split('|');
        if (parts.length > 1) {
            finalOptions.push(parts[gapIndex]);
        } else {
            finalOptions.push(optString);
        }
    });

    // Lọc trùng và trộn
    const uniqueOptions = shuffleArray([...new Set(finalOptions)]);

    uniqueOptions.forEach(opt => {
        container.innerHTML += `<button class="modal-btn" onclick="selectGapOption('${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
    });

    document.getElementById('gapModal').style.display = 'flex';
}

function closeGapModal() {
    document.getElementById('gapModal').style.display = 'none';
    currentGapTarget = null;
}

function selectGapOption(selectedText) {
    if(!currentGapTarget) return;

    const correctText = currentGapTarget.getAttribute('data-answer');
    const qIndex = currentGapTarget.getAttribute('data-qindex');
    currentGapTarget.innerText = selectedText;

    if (selectedText === correctText) {
        currentGapTarget.classList.add('filled-correct');
        playSound('correct');
    } else {
        currentGapTarget.classList.add('filled-wrong');
        playSound('wrong');
    }

    closeGapModal();

    // Kiểm tra xem tất cả các gap của câu hỏi này đã được điền chưa
    checkAllGaps(qIndex);
}

function checkAllGaps(qIndex) {
    const card = document.getElementById(`card-${qIndex}`);
    const gaps = card.querySelectorAll('.gap');
    let allFilled = true;
    let allCorrect = true;

    gaps.forEach(g => {
        if (!g.classList.contains('filled-correct') && !g.classList.contains('filled-wrong')) {
            allFilled = false;
        }
        if (g.innerText !== g.getAttribute('data-answer')) {
            allCorrect = false;
        }
    });

    if (allFilled) {
        isAnswered[qIndex] = true;
        document.getElementById(`exp-${qIndex}`).style.display = 'block';
        if (allCorrect) {
            correctAnswers++;
            shootConfetti();
        }
    }
}

// Logic cho Reorder (Sắp xếp)
function moveChip(chipEl, fromId, toId) {
    const targetBox = document.getElementById(chipEl.parentElement.id === fromId ? toId : fromId);
    targetBox.appendChild(chipEl);
}

function checkReorder(qIndex, correctAnswer, endMark) {
    if (isAnswered[qIndex]) return;

    const answerBox = document.getElementById(`answer-${qIndex}`);
    const chips = answerBox.querySelectorAll('.chip');
    let userSentence = Array.from(chips).map(c => c.innerText).join(' ');
    
    // Thêm dấu câu vào cuối nếu cần để so khớp chính xác
    if(userSentence.length > 0) userSentence += endMark;

    const isCorrect = (userSentence.toLowerCase().replace(/\s+/g, '') === correctAnswer.toLowerCase().replace(/\s+/g, ''));

    if (isCorrect) {
        playSound('correct');
        shootConfetti();
        correctAnswers++;
        answerBox.style.backgroundColor = 'var(--correct)';
        answerBox.style.color = 'white';
        // Vô hiệu hóa click
        chips.forEach(c => c.style.pointerEvents = 'none');
    } else {
        playSound('wrong');
        answerBox.style.animation = 'none';
        setTimeout(() => answerBox.style.animation = 'shake 0.4s', 10);
        answerBox.style.backgroundColor = '#ffebe6';
        answerBox.style.borderColor = 'var(--wrong)';
    }

    isAnswered[qIndex] = true;
    document.getElementById(`exp-${qIndex}`).style.display = 'block';
}

// Submit Result
function showResults() {
    let msg = "";
    const percentage = (correctAnswers / totalQuestions) * 100;
    
    if (percentage === 100) msg = "Tuyệt đỉnh! Bạn là một Master Tiếng Anh thực thụ! 🏆";
    else if (percentage >= 80) msg = "Quá giỏi! Cố gắng chút xíu nữa là đạt điểm tuyệt đối rồi! 🌟";
    else if (percentage >= 50) msg = "Làm tốt lắm! Hãy xem kỹ phần giải thích để tiến bộ hơn nhé! 👍";
    else msg = "Đừng nản chí! Học tiếng Anh là một hành trình dài. Thử lại nhé! 💪";

    document.getElementById('finalScore').innerText = `${correctAnswers} / ${totalQuestions}`;
    document.getElementById('resultMessage').innerText = msg;
    document.getElementById('resultModal').style.display = 'flex';
    shootConfetti();
    setTimeout(shootConfetti, 500);
    setTimeout(shootConfetti, 1000);
}

// Initialize on load
window.onload = initQuiz;

</script>
