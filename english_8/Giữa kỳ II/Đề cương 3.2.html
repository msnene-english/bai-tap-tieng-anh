<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* TỰ ĐỘNG HÓA GIAO DIỆN THEO CHỦ ĐỀ (DYNAMIC THEME) - CHỦ ĐỀ: EARTH & LIFE (🌍 🌿 🌧️) */
        :root {
            --primary-color: #2D9CDB; /* Xanh dương của nước/trời */
            --secondary-color: #27AE60; /* Xanh lá của cây cỏ */
            --correct-color: #00D26A;
            --incorrect-color: #FF4757;
            --bg-light: #F0F9FF;
            --text-main: #2C3E50;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            /* SVG Background Tự động sinh với Emoji chủ đề Môi trường / Đời sống */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8) 0%, rgba(240,249,255,0.9) 100%),
                url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='30' font-size='20'%3E🌍%3C/text%3E%3Ctext x='70' y='80' font-size='25'%3E🌿%3C/text%3E%3Ctext x='30' y='100' font-size='15'%3E🌧️%3C/text%3E%3Ctext x='90' y='20' font-size='18'%3E📱%3C/text%3E%3C/svg%3E");
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOP BAR */
        .top-bar {
            background: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            z-index: 10;
        }
        .header-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timer-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #timer-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            background: #f1f2f6;
            padding: 5px 20px;
            border-radius: 15px;
            border: 2px solid #dfe4ea;
            width: 130px;
            text-align: center;
        }
        .btn {
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .btn-start {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 5px 0 #1A73E8;
        }
        .btn-start:active { transform: translateY(5px); box-shadow: none; }
        
        .btn-submit {
            background: #FFA502;
            color: white;
            box-shadow: 0 5px 0 #E58E26;
        }
        .btn-submit:active { transform: translateY(5px); box-shadow: none; }

        /* SPLIT SCREEN */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .left-panel, .right-panel {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .left-panel {
            border-right: 3px dashed #dfe4ea;
            background: rgba(255, 255, 255, 0.6);
        }

        /* PASSAGE STYLES */
        .passage-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 0 #dfe4ea, 0 15px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 2px solid #f1f2f6;
            line-height: 1.8;
            font-size: 1.15rem;
        }
        .passage-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 15px;
            text-align: center;
        }
        .passage-content {
            text-align: justify;
        }
        .btn-translate {
            background: #7BED9F;
            color: #2F3542;
            font-weight: 800;
            border: none;
            padding: 8px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 0 #2ED573;
            cursor: pointer;
            margin-top: 15px;
            font-size: 1rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-translate:active { transform: translateY(4px); box-shadow: none; }
        .translation-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #E8F8F5;
            border-left: 5px solid var(--secondary-color);
            border-radius: 10px;
            font-size: 1.05rem;
            color: #2C3E50;
        }

        /* GLOSSARY TABLE */
        .glossary-wrapper {
            margin-top: 25px;
        }
        .glossary-title {
            font-weight: 800;
            color: #E15F41;
            margin-bottom: 10px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #f1f2f6;
        }
        th {
            background: #F8EFBA;
            color: #D4A106;
            font-weight: 800;
        }
        tr:last-child td { border-bottom: none; }
        .word-col { font-weight: 800; color: var(--primary-color); }
        .pos-col { font-style: italic; color: #747d8c; }

        /* QUESTION STYLES */
        .question-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 0 #dfe4ea, 0 15px 20px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 2px solid #f1f2f6;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .option-btn {
            background: white;
            border: 2px solid #dfe4ea;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 6px 0 #dfe4ea;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: var(--primary-color);
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: none;
        }
        .option-btn.correct {
            background: var(--correct-color);
            color: white;
            border-color: var(--correct-color);
            box-shadow: 0 6px 0 #00A855;
        }
        .option-btn.wrong {
            background: var(--incorrect-color);
            color: white;
            border-color: var(--incorrect-color);
            box-shadow: 0 6px 0 #D03A47;
            animation: shake 0.4s;
        }
        .option-btn:disabled { cursor: not-allowed; }

        /* EXPLANATION BOX */
        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #FFF3CD;
            border: 2px dashed #FFC107;
            border-radius: 15px;
            animation: fadeIn 0.5s ease;
        }
        .explanation-title {
            font-weight: 900;
            color: #D35400;
            margin-bottom: 10px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        .explanation-content {
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .explanation-content b { color: #C0392B; }

        /* ANIMATIONS */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: fadeIn 0.4s;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 0 #1A73E8;
        }
        .modal-message {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        /* CONFETTI CANVAS */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f2f6; }
        ::-webkit-scrollbar-thumb { background: #ced6e0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a4b0be; }

        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header class="top-bar">
        <div class="header-title">👨‍🏫 Ms. Chí Nên  - English Test</div>
        <div class="timer-container">
            <button class="btn btn-start" id="btn-timer" onclick="toggleTimer()">BẮT ĐẦU TÍNH GIỜ</button>
            <div id="timer-display">10:00</div>
            <button class="btn btn-submit" onclick="submitTest()">NỘP BÀI</button>
        </div>
    </header>

    <main class="main-container">
        <div class="left-panel" id="left-panel">
            </div>

        <div class="right-panel" id="right-panel">
            </div>
    </main>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="score-circle" id="score-circle">0/0</div>
            <div class="modal-message" id="modal-message">Tuyệt vời!</div>
            <p id="modal-submessage" style="margin-bottom: 20px; font-size: 1.1rem; color: #747d8c;"></p>
            <button class="btn btn-start" onclick="closeModal()">Xem Lại Bài</button>
        </div>
    </div>

    <div class="modal-overlay" id="timeout-modal">
        <div class="modal-content">
            <h2 style="color: #E15F41; font-weight: 900; font-size: 2rem; margin-bottom: 15px;">⏰ Đã Hết Giờ!</h2>
            <p style="font-size: 1.2rem; line-height: 1.6; margin-bottom: 25px;">Bạn vẫn có thể tiếp tục làm bài đẻ kiểm tra kiến thức, nhưng nhớ là trong phòng thi thật, bạn chỉ nên làm một bài như thế này trong 10 phút thôi nha!</p>
            <button class="btn btn-start" onclick="document.getElementById('timeout-modal').style.display='none'">Tiếp Tục Làm Bài</button>
        </div>
    </div>

    <script>
        // ==========================================
        // DỮ LIỆU ĐỀ BÀI CHUẨN (GIỮ 100% NỘI DUNG)
        // ==========================================
        const passagesData = [
            {
                id: "p1",
                title: "NOTICE ABOUT THE GRADUATION CEREMONY",
                content: `The School Youth Union announces the following information:<br><br>
                All Grade 12 students (13) ...... be present at the school hall by 5:00 p.m. on June 29, 2024.<br>
                Female students are requested to wear traditional (14) ......, while male students should wear white shirts with dark trousers.<br>
                (15) ...... parents require more details, please contact Mr. Cuong at 0356.211.439.<br>
                Kindly inform us if you (16) ...... anyone with you.`,
                translation: `Đoàn Thanh niên Trường xin thông báo thông tin sau:<br><br>Tất cả học sinh khối 12 phải có mặt tại hội trường nhà trường trước 5:00 chiều ngày 29 tháng 6 năm 2024.<br>Học sinh nữ được yêu cầu mặc trang phục truyền thống, trong khi học sinh nam nên mặc áo sơ mi trắng với quần âu sẫm màu.<br>Nếu phụ huynh cần thêm thông tin chi tiết, vui lòng liên hệ Thầy Cường qua số 0356.211.439.<br>Vui lòng thông báo cho chúng tôi nếu bạn dẫn theo bất kỳ ai.`,
                glossary: [
                    { word: "Announce", pos: "v", meaning: "Thông báo" },
                    { word: "Present", pos: "adj", meaning: "Có mặt, hiện diện" },
                    { word: "Request", pos: "v", meaning: "Yêu cầu, thỉnh cầu" },
                    { word: "Traditional", pos: "adj", meaning: "Thuộc về truyền thống" },
                    { word: "Costume", pos: "n", meaning: "Trang phục (đặc trưng)" },
                    { word: "Require", pos: "v", meaning: "Đòi hỏi, cần đến" },
                    { word: "Detail", pos: "n", meaning: "Chi tiết" },
                    { word: "Contact", pos: "v", meaning: "Liên lạc, liên hệ" },
                    { word: "Kindly", pos: "adv", meaning: "Vui lòng, làm ơn" },
                    { word: "Inform", pos: "v", meaning: "Báo cho biết, cung cấp thông tin" }
                ]
            },
            {
                id: "p2",
                title: "SHOPPING APPLICATIONS",
                content: `If you often shop at certain stores or websites, you may already have their shopping applications installed on your phone. In some cases, you might (19) ...... an app to receive a discount on your first order or get early access to special sales. Many shopping apps offer multiple features. They can allow you (20) ...... a shopping list and send notifications such as sale alerts, (21) ...... codes, coupons, special offers, or other rewards depending on how much you (22) ...... <br><br>
                When creating an account or making your first purchase through a shopping app, you will probably be asked to save or link your (23) ...... information. Some applications automatically charge your credit card, debit card, or bank account whenever you make a purchase. (24) ...... apps allow users to add money in advance and spend that balance each time they shop. Always check the app description or user agreement before installing to understand how payments are handled and what steps to take if there is a billing issue.`,
                translation: `Nếu bạn thường xuyên mua sắm tại một số cửa hàng hoặc trang web nhất định, bạn có thể đã cài đặt ứng dụng mua sắm của họ trên điện thoại. Trong một số trường hợp, bạn có thể tải xuống một ứng dụng để nhận được giảm giá cho đơn hàng đầu tiên hoặc có quyền truy cập sớm vào các chương trình giảm giá đặc biệt. Nhiều ứng dụng mua sắm cung cấp nhiều tính năng. Chúng có thể cho phép bạn lưu trữ danh sách mua sắm và gửi các thông báo như cảnh báo giảm giá, mã giảm giá, phiếu giảm giá, ưu đãi đặc biệt hoặc các phần thưởng khác tùy thuộc vào mức độ bạn mua sắm.<br><br>Khi tạo tài khoản hoặc thực hiện giao dịch mua hàng đầu tiên qua một ứng dụng mua sắm, bạn có thể sẽ được yêu cầu lưu hoặc liên kết thông tin thanh toán của mình. Một số ứng dụng tự động tính phí thẻ tín dụng, thẻ ghi nợ hoặc tài khoản ngân hàng của bạn bất cứ khi nào bạn mua hàng. Các ứng dụng khác cho phép người dùng nạp tiền trước và tiêu số dư đó mỗi lần họ mua sắm. Luôn kiểm tra mô tả ứng dụng hoặc thỏa thuận người dùng trước khi cài đặt để hiểu cách các khoản thanh toán được xử lý và cần thực hiện các bước nào nếu có vấn đề về thanh toán.`,
                glossary: [
                    { word: "Install", pos: "v", meaning: "Cài đặt" },
                    { word: "Discount", pos: "n", meaning: "Sự giảm giá, chiết khấu" },
                    { word: "Multiple", pos: "adj", meaning: "Nhiều, đa dạng" },
                    { word: "Feature", pos: "n", meaning: "Tính năng, đặc điểm" },
                    { word: "Notification", pos: "n", meaning: "Thông báo" },
                    { word: "Purchase", pos: "n/v", meaning: "Sự mua sắm / Mua" },
                    { word: "Link", pos: "v", meaning: "Liên kết, kết nối" },
                    { word: "Charge", pos: "v", meaning: "Tính phí" },
                    { word: "Debit card", pos: "n", meaning: "Thẻ ghi nợ" },
                    { word: "Balance", pos: "n", meaning: "Số dư (tài khoản)" },
                    { word: "Advance", pos: "n", meaning: "(in advance) Trước" },
                    { word: "Agreement", pos: "n", meaning: "Thỏa thuận, hợp đồng" }
                ]
            },
            {
                id: "p3",
                title: "PROTECTING THE ENVIRONMENT STARTS AT HOME",
                content: `Environmental pollution exists not only on a global scale but also inside our own homes. It is caused by household chemicals, excessive water consumption, and the large amount of waste people create and throw away every day. So what can we do to reduce this pollution? In fact, individuals can make a difference by taking simple actions in daily life.<br><br>
                First of all, recycling should be practiced regularly. Recycling allows materials to be reused many times and helps reduce the number of trees cut down to make paper products. It requires little effort. Simply placing plastic bottles, glass containers, aluminum cans, and paper into recycling bins is easy and something everyone can do.<br><br>
                Secondly, people should manage their water use more carefully at home. Water can be saved by taking quick showers instead of baths, fixing leaking taps, running dishwashers or washing machines only when they are full, and turning off the tap while brushing teeth.<br><br>

                - C sai vì tái chế giúp GIẢM việc sản xuất mới chứ không phải "produce more" (sản xuất thêm).<br>
                <b>4. Chốt đáp án D.</b>`
            },
            {
                id: 34, passageId: "p3", text: "Question 34. Which of the following is NOT mentioned as a cause of pollution?",
                options: [
                    { text: "A. Water in rivers", isCorrect: true },
                    { text: "B. water from households", isCorrect: false },
                    { text: "C. wastes", isCorrect: false },
                    { text: "D. house chemicals", isCorrect: false }
                ],
                explanation: `<b>1. Phân tích câu hỏi:</b> Điều nào KHÔNG ĐƯỢC NHẮC ĐẾN như một nguyên nhân gây ô nhiễm?<br>
                <b>2. Dẫn chứng trong bài (Đoạn 1):</b> <i>"It is caused by <b>household chemicals</b>, excessive <b>water consumption</b>, and the large amount of <b>waste</b>..."</i> (Nó được gây ra bởi hóa chất gia dụng, tiêu thụ nước quá mức, và lượng rác khổng lồ...)<br>
                <b>3. Đối chiếu đáp án:</b><br>
                - B tương ứng với "water consumption" (tại nhà).<br>
                - C tương ứng với "waste".<br>
                - D tương ứng với "household chemicals".<br>
                -> Xuyên suốt bài không hề nhắc đến "Water in rivers" (Nước sông).<br>
                <b>4. Chốt đáp án A.</b>`
            },
            {
                id: 35, passageId: "p3", text: "Question 35. The word “It” in paragraph 2 refers to ______.",
                options: [
                    { text: "A. Cutting down", isCorrect: false },
                    { text: "B. the number", isCorrect: false },
                    { text: "C. recycling", isCorrect: true },
                    { text: "D. effort", isCorrect: false }
                ],
                explanation: `<b>1. Dẫn chứng trong bài (Đoạn 2):</b> <i>"<b>Recycling</b> allows materials to be reused... <b>It</b> requires little effort."</i><br>
                <b>2. Dịch nghĩa:</b> "<b>Tái chế</b> cho phép vật liệu được tái sử dụng... <b>Nó</b> (Việc tái chế) đòi hỏi rất ít nỗ lực."<br>
                <b>3. Suy luận:</b> Đại từ "It" luôn thay thế cho danh từ số ít hoặc danh động từ xuất hiện ngay câu trước đó để tránh lặp từ. Chủ thể hành động chính đang được nói tới ở đây là "Recycling".<br>
                <b>4. Chốt đáp án C.</b>`
            },
            {
                id: 36, passageId: "p3", text: "Question 36. The word “effectively” in paragraph 4 is closest in meaning to the opposite of ______.",
                options: [
                    { text: "A. Attractively", isCorrect: false },
                    { text: "B. worthlessly", isCorrect: true },
                    { text: "C. harmfully", isCorrect: false },
                    { text: "D. efficiently", isCorrect: false }
                ],
                explanation: `<b>1. Phân tích yêu cầu TRICKY của đề:</b> "closest in meaning to the <b>opposite</b> of" -> Tìm TỪ TRÁI NGHĨA với từ "effectively".<br>
                <b>2. Phân tích từ vựng:</b><br>
                - effectively (adv): một cách hiệu quả, hữu ích.<br>
                - attractively (adv): hấp dẫn.<br>
                - worthlessly (adv): vô giá trị, không có tác dụng.<br>
                - harmfully (adv): có hại.<br>
                - efficiently (adv): hiệu quả (Đây là từ ĐỒNG NGHĨA).<br>
                <b>3. Tại sao chọn B?</b> Trái nghĩa với "hiệu quả/hữu ích" chính là "vô giá trị/không mang lại lợi ích gì" (worthlessly). Rất nhiều học sinh bị lừa chọn D vì không đọc kỹ chữ "opposite".`
            },

            // PASSAGE 4
            {
                id: 37, passageId: "p4", text: "Question 37. On October 15th, 2013, (37) ________.",
                options: [
                    { text: "A. It caused heavy rainfall and serious flooding in many areas", isCorrect: false },
                    { text: "B. a powerful storm suddenly formed over the East Sea", isCorrect: true },
                    { text: "C. Bringing strong winds of up to 150 kilometres an hour", isCorrect: false },
                    { text: "D. where it weakened but still caused considerable damage", isCorrect: false }
                ],
                explanation: `<b>1. Phân tích ngữ cảnh:</b> Vị trí 37 nằm ở đầu chuỗi sự kiện, ngay sau mốc thời gian "On October 15th, 2013". Cần một mệnh đề giới thiệu sự xuất hiện của cơn bão Nari.<br>
                <b>2. Phân tích đáp án:</b><br>
                - B. "một cơn bão mạnh bất ngờ hình thành trên Biển Đông" -> Rất hợp lý để mở đầu câu chuyện về bão Nari xuất hiện.<br>
                - Các đáp án khác: A (gây lũ lụt - chưa bão đã lũ), C (mang theo gió - sai ngữ pháp vì thiếu chủ ngữ nếu đứng độc lập sau dấu phẩy của trạng ngữ thời gian), D (nơi nó suy yếu - sai logic).<br>
                <b>3. Chốt đáp án B.</b>`
            },
            {
                id: 38, passageId: "p4", text: "Question 38. (38) ________, the storm grew rapidly and moved toward the mainland.",
                options: [
                    { text: "A. It caused heavy rainfall and serious flooding in many areas", isCorrect: false },
                    { text: "B. a powerful storm suddenly formed over the East Sea", isCorrect: false },
                    { text: "C. Bringing strong winds of up to 150 kilometres an hour", isCorrect: true },
                    { text: "D. where it weakened but still caused considerable damage", isCorrect: false }
                ],
                explanation: `<b>1. Phân tích ngữ pháp:</b> Vị trí 38 nằm đầu câu, ngăn cách với mệnh đề chính bằng dấu phẩy. Đây là vị trí lý tưởng cho một cụm Phân từ hiện tại (V-ing) đóng vai trò trạng ngữ chỉ sự đồng thời hoặc nguyên nhân.<br>
                <b>2. Dịch nghĩa:</b> "<b>Mang theo sức gió mạnh lên tới 150 km/giờ</b>, cơn bão lớn nhanh chóng và di chuyển về phía đất liền."<br>
                <b>3. Chốt đáp án C.</b>`
            },
            {
                id: 39, passageId: "p4", text: "Question 39. (39) ________. More than 200 people were killed or went missing...",
                options: [
                    { text: "A. It caused heavy rainfall and serious flooding in many areas", isCorrect: true },
                    { text: "B. a powerful storm suddenly formed over the East Sea", isCorrect: false },
                    { text: "C. Bringing strong winds of up to 150 kilometres an hour", isCorrect: false },
                    { text: "D. where it weakened but still caused considerable damage", isCorrect: false }
                ],
                explanation: `<b>1. Phân tích logic:</b> Câu trước nói bão di chuyển vào đất liền. Câu sau nói hậu quả "Hơn 200 người chết hoặc mất tích, nhà cửa bị phá hủy". Vị trí 39 cần một câu miêu tả sức tàn phá trực tiếp của bão khi vào đất liền.<br>
                <b>2. Dịch nghĩa:</b> "<b>Nó đã gây ra mưa lớn và lũ lụt nghiêm trọng ở nhiều khu vực.</b> Hơn 200 người đã thiệt mạng..." Sự liên kết nhân quả cực kỳ mượt mà.<br>
                <b>3. Chốt đáp án A.</b>`
            },
            {
                id: 40, passageId: "p4", text: "Question 40. ...the storm continued its path to Laos, (40) ________.",
                options: [
                    { text: "A. It caused heavy rainfall and serious flooding in many areas", isCorrect: false },
                    { text: "B. a powerful storm suddenly formed over the East Sea", isCorrect: false },
                    { text: "C. Bringing strong winds of up to 150 kilometres an hour", isCorrect: false },
                    { text: "D. where it weakened but still caused considerable damage", isCorrect: true }
                ],
                explanation: `<b>1. Phân tích ngữ pháp:</b> Vị trí 40 đứng ngay sau một địa điểm "Laos" (Lào) và có dấu phẩy. Cần một Mệnh đề quan hệ bắt đầu bằng đại từ quan hệ chỉ nơi chốn "where" (tại nơi đó).<br>
                <b>2. Dịch nghĩa:</b> "...cơn bão tiếp tục đường đi tới Lào, <b>nơi nó suy yếu nhưng vẫn gây ra thiệt hại đáng kể.</b>"<br>
                <b>3. Chốt đáp án D.</b> Tuyệt đối chính xác về cả ngữ pháp lẫn nghĩa.`
            }
        ];

        let score = 0;
        let totalQuestions = questionsData.length;
        let answeredQuestions = 0;

        // ==========================================
        // KHỞI TẠO GIAO DIỆN
        // ==========================================
        function initApp() {
            const leftPanel = document.getElementById('left-panel');
            const rightPanel = document.getElementById('right-panel');

            // Render Passages
            passagesData.forEach(p => {
                let glossaryHtml = '';
                if (p.glossary.length > 0) {
                    glossaryHtml = `
                        <div class="glossary-wrapper">
                            <div class="glossary-title">📚 Vocabulary Glossary (Từ vựng B1-C2)</div>
                            <table>
                                <tr><th>Word</th><th>Part of Speech</th><th>Meaning</th></tr>
                                ${p.glossary.map(g => `
                                    <tr>
                                        <td class="word-col">${g.word}</td>
                                        <td class="pos-col">${g.pos}</td>
                                        <td>${g.meaning}</td>
                                    </tr>
                                `).join('')}
                            </table>
                        </div>
                    `;
                }

                const passageHtml = `
                    <div class="passage-card" id="passage-${p.id}">
                        <div class="passage-title">${p.title}</div>
                        <div class="passage-content">${p.content}</div>
                        <button class="btn-translate" onclick="toggleTranslation('${p.id}')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"></path></svg>
                            BẢN DỊCH ĐẦY ĐỦ
                        </button>
                        <div class="translation-box" id="trans-${p.id}">
                            <b>Bản dịch tiếng Việt:</b><br><br>
                            ${p.translation}
                        </div>
                        ${glossaryHtml}
                    </div>
                `;
                leftPanel.innerHTML += passageHtml;
            });

            // Render Questions
            questionsData.forEach((q, index) => {
                // Thuật toán xáo trộn đáp án (Shuffle)
                let shuffledOptions = [...q.options];
                for (let i = shuffledOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
                }

                // Chữ cái A, B, C, D động
                const labels = ['A', 'B', 'C', 'D'];

                let optionsHtml = '';
                shuffledOptions.forEach((opt, optIdx) => {
                    // Nếu là câu 37-40 (text dài), cho nút dài full width
                    const isLongText = opt.text.length > 30 ? 'full-width' : '';
                    
                    // Nếu là câu điền khuyết ABCD, render nhãn ABCD
                    let displayLabel = labels[optIdx] + ". ";
                    if(opt.text.startsWith("A.") || opt.text.startsWith("B.") || opt.text.startsWith("C.") || opt.text.startsWith("D.")) {
                        displayLabel = ""; // Tránh trùng lặp nếu đáp án đã có sẵn A. B. C. D.
                    }

                    optionsHtml += `
                        <button class="option-btn ${isLongText}" id="btn-${q.id}-${optIdx}" onclick="checkAnswer(${q.id}, ${optIdx}, ${opt.isCorrect})">
                            ${displayLabel}${opt.text}
                        </button>
                    `;
                });

                const qHtml = `
                    <div class="question-card" id="qcard-${q.id}">
                        <div class="question-text">${q.text}</div>
                        <div class="options-grid" id="options-${q.id}">
                            ${optionsHtml}
                        </div>
                        <div class="explanation-box" id="exp-${q.id}">
                            <div class="explanation-title">💡 Giải thích chi tiết từ Thạc sĩMs. Chí Nên:</div>
                            <div class="explanation-content">${q.explanation}</div>
                        </div>
                    </div>
                `;
                rightPanel.innerHTML += qHtml;
            });
        }

        // ==========================================
        // LOGIC TƯƠNG TÁC
        // ==========================================
        function toggleTranslation(id) {
            const box = document.getElementById(`trans-${id}`);
            if (box.style.display === 'block') {
                box.style.display = 'none';
            } else {
                box.style.display = 'block';
                box.style.animation = 'fadeIn 0.4s';
            }
        }

        function checkAnswer(qId, optIdx, isCorrect) {
            const qCard = document.getElementById(`qcard-${qId}`);
            const buttons = document.querySelectorAll(`#options-${qId} .option-btn`);
            
            // Khóa các nút sau khi chọn
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.style.cursor = 'default';
            });

            const clickedBtn = document.getElementById(`btn-${qId}-${optIdx}`);

            if (isCorrect) {
                clickedBtn.classList.add('correct');
                playDing();
                fireConfetti();
                score++;
            } else {
                clickedBtn.classList.add('wrong');
                playWrong();
                // Tìm nút đúng để bôi xanh
                const qData = questionsData.find(q => q.id === qId);
                // Vì đã xáo trộn, phải tìm lại trong DOM nút nào đang chứa text của đáp án đúng.
                // Cách an toàn hơn: Duyệt mảng buttons, ta truyền isCorrect vào onclick, nhưng không truyền vị trí thật.
                // Xử lý tìm nút đúng:
                buttons.forEach(btn => {
                    const btnHtml = btn.innerHTML;
                    const correctText = qData.options.find(o => o.isCorrect).text;
                    if (btnHtml.includes(correctText)) {
                        btn.classList.add('correct');
                        btn.style.boxShadow = '0 0 15px #00D26A';
                    }
                });
            }

            // Hiện giải thích chi tiết
            const expBox = document.getElementById(`exp-${qId}`);
            expBox.style.display = 'block';

            // Cuộn đoạn văn tương ứng bên trái
            const passageId = questionsData.find(q => q.id === qId).passageId;
            const passageEl = document.getElementById(`passage-${passageId}`);
            document.getElementById('left-panel').scrollTo({
                top: passageEl.offsetTop - 30,
                behavior: 'smooth'
            });

            answeredQuestions++;
        }

        // ==========================================
        // WEB AUDIO API (KHÔNG DÙNG FILE NGOÀI)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playDing() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playWrong() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // ==========================================
        // JS CONFETTI (KHÔNG DÙNG THƯ VIỆN NGOÀI)
        // ==========================================
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];

        function fireConfetti() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height / 2 - canvas.height/2,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 4 - 2,
                    dy: Math.random() * 5 + 2,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.dx;
                p.y += p.dy;
                if (p.y > canvas.height) particles.splice(i, 1);
            }
            requestAnimationFrame(animateConfetti);
        }
        animateConfetti();

        // ==========================================
        // TIMER & SUBMIT
        // ==========================================
        let timeLeft = 600; // 10 minutes = 600 seconds
        let timerInterval;
        let isRunning = false;

        function updateTimerDisplay() {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('btn-timer');
            if (isRunning) {
                clearInterval(timerInterval);
                btn.innerText = "TIẾP TỤC BÀI THI";
                btn.style.background = "#95a5a6";
                btn.style.boxShadow = "0 5px 0 #7f8c8d";
            } else {
                if(timeLeft === 0) return; // Nếu hết giờ kh cho bấm
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        document.getElementById('timeout-modal').style.display = 'flex';
                        btn.innerText = "ĐÃ HẾT GIỜ";
                        btn.style.background = "#e74c3c";
                        btn.style.boxShadow = "0 5px 0 #c0392b";
                        btn.disabled = true;
                    }
                }, 1000);
                btn.innerText = "TẠM DỪNG THỜI GIAN";
                btn.style.background = "#E15F41";
                btn.style.boxShadow = "0 5px 0 #c44569";
            }
            isRunning = !isRunning;
        }

        function submitTest() {
            if (timerInterval) clearInterval(timerInterval);
            
            const modal = document.getElementById('result-modal');
            const scoreDiv = document.getElementById('score-circle');
            const msgDiv = document.getElementById('modal-message');
            const subMsg = document.getElementById('modal-submessage');

            scoreDiv.innerText = `${score}/${totalQuestions}`;
            
            let ratio = score / totalQuestions;
            if (ratio === 1) {
                msgDiv.innerText = "Thiên Tài Ngôn Ngữ! 🏆";
                msgDiv.style.color = "#FFC312";
                subMsg.innerText = "Wow, 100% chính xác! Ms. Chí Nên rất tự hào về bạn!";
                for(let i=0; i<3; i++) setTimeout(fireConfetti, i*300); // Bắn pháo giấy 3 lần
                playDing();
            } else if (ratio >= 0.7) {
                msgDiv.innerText = "Làm Tốt Lắm! 🌟";
                msgDiv.style.color = "#009432";
                subMsg.innerText = "Bạn nắm kiến thức rất vững. Đọc kỹ thêm phần giải thích để vươn tới điểm tuyệt đối nhé!";
                fireConfetti();
            } else if (ratio >= 0.4) {
                msgDiv.innerText = "Khá Ổn Đó! 👍";
                msgDiv.style.color = "#0652DD";
                subMsg.innerText = "Cố gắng lên một chút nữa. Hãy xem lại bảng từ vựng và lời giải thích nhé.";
            } else {
                msgDiv.innerText = "Cần Cố Gắng Hơn! 💪";
                msgDiv.style.color = "#EA2027";
                subMsg.innerText = "Đừng buồn, học ngôn ngữ cần thời gian. Bạn hãy đọc kỹ lại phần dịch nghĩa và giải thích chi tiết nha!";
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // Initialize
        window.onload = () => {
            initApp();
            updateTimerDisplay();
        };

    </script>
</body>
</html>
