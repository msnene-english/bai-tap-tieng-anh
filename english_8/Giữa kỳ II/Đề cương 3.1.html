<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #00C9A7;
            --correct: #00D26A;
            --wrong: #FF4757;
            --yellow: #FFC312;
            --bg-card: #ffffff;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf6e3;
            /* Họa tiết vui nhộn chấm bi bằng CSS thuần */
            background-image: 
                radial-gradient(var(--secondary) 2px, transparent 2px),
                radial-gradient(var(--primary) 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header h3 {
            margin: 5px 0 0 0;
            font-size: 16px;
            font-weight: 700;
            opacity: 0.9;
        }

        #quiz-container {
            width: 100%;
            max-width: 800px;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.05);
            border: 2px solid #eaeaea;
            transition: transform 0.3s;
        }

        .question-card:hover {
            transform: translateY(-5px);
        }

        .instruction {
            font-style: italic;
            color: #666;
            margin-bottom: 15px;
            font-size: 15px;
            border-left: 4px solid var(--yellow);
            padding-left: 10px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: white;
            border: 2px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: #444;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            border-bottom-width: 8px;
            border-color: var(--secondary);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .option-btn.correct {
            background: var(--correct);
            border-color: #00b35a;
            color: white;
        }

        .option-btn.wrong {
            background: var(--wrong);
            border-color: #e03e4d;
            color: white;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Gap Fill Style */
        .gap-btn {
            background: #f1f2f6;
            border: 2px dashed var(--primary);
            border-radius: 10px;
            padding: 5px 15px;
            font-size: 18px;
            font-weight: 900;
            color: var(--primary);
            cursor: pointer;
            margin: 0 5px;
            transition: 0.2s;
        }
        .gap-btn:hover {
            background: #eccc68;
            color: #333;
        }
        .gap-btn.filled-correct { background: var(--correct); color: white; border-style: solid; border-color: #00b35a; }
        .gap-btn.filled-wrong { background: var(--wrong); color: white; border-style: solid; border-color: #e03e4d; }

        /* Khung Giải Thích */
        .explanation {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fffbdf;
            border: 2px dashed var(--yellow);
            border-radius: 15px;
            font-size: 15px;
            color: #333;
            animation: slideDown 0.4s ease-out;
        }

        .explanation-title {
            font-weight: 900;
            color: #ff5252;
            font-size: 18px;
            margin-bottom: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .expl-step {
            margin-bottom: 10px;
            line-height: 1.6;
            background: rgba(255,255,255,0.6);
            padding: 10px;
            border-radius: 10px;
        }

        /* CSS Animation */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px) rotate(-1deg); }
            40%, 80% { transform: translateX(6px) rotate(1deg); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 9999;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        /* CSS Cho Nút Submit */
        .submit-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            font-size: 22px;
            font-weight: 900;
            padding: 20px 50px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 0 #c0392b;
            cursor: pointer;
            margin: 30px 0 50px 0;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 13px 0 #c0392b; }
        .submit-btn:active { transform: translateY(7px); box-shadow: 0 3px 0 #c0392b; }

        /* Modal Kết Quả */
        #result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-content h2 { font-size: 30px; color: var(--primary); margin-top: 0; }
        .modal-content p { font-size: 18px; color: #555; font-weight: bold; }
        .close-modal {
            margin-top: 20px;
            padding: 12px 25px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* CSS Vẽ Biển Báo Q29 & Q30 */
        .css-sign-q29 {
            border: 5px solid #FF4757; border-radius: 12px; width: max-content; 
            padding: 15px; text-align: center; margin: 15px auto; background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .css-sign-q29-icon {
            position: relative; width: 90px; height: 90px; border: 6px solid #FF4757; 
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; overflow: hidden; font-size: 40px;
        }
        .css-sign-q29-slash {
            position: absolute; width: 120%; height: 6px; background: #FF4757; 
            transform: rotate(-45deg);
        }
        .css-sign-q30 {
            border: 4px solid #3b82f6; border-radius: 8px; background-color: #fef08a; 
            padding: 20px; width: max-content; text-align: center; margin: 15px auto; 
            box-shadow: 3px 3px 0 rgba(0,0,0,0.1); font-family: 'Times New Roman', serif;
        }
    </style>
</head>

    let correctCount = 0;
    const totalQuestions = rawQuizData.length;
    let audioCtx;

    // --- 2. HỆ THỐNG ÂM THANH & HIỆU ỨNG ---
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }
    // Kích hoạt audio khi user tương tác lần đầu
    document.addEventListener('click', initAudio, { once: true });

    function playSound(type) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // Âm 'Ding' vui tai
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        } else {
            // Âm 'Téo tèo' báo lỗi
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    function createConfetti() {
        const colors = ['#00C9A7', '#FF4757', '#8854C0', '#FFC312', '#00D26A'];
        for (let i = 0; i < 40; i++) {
            let conf = document.createElement('div');
            conf.classList.add('confetti');
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDuration = (Math.random() * 2 + 1) + 's';
            // Tạo kích thước ngẫu nhiên
            let size = Math.random() * 10 + 5;
            conf.style.width = size + 'px';
            conf.style.height = size + 'px';
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 3000);
        }
    }

    // --- 3. RENDER GIAO DIỆN & LOGIC ---
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        
        rawQuizData.forEach((q, qIndex) => {
            // Xáo trộn ngẫu nhiên đáp án cho mỗi người chơi
            q.shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            
            let card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${q.id}`;

            let htmlContent = `<div class="instruction">${q.instruction}</div>`;

            // Xử lý loại câu hỏi
            if (q.type === 'gap-fill') {
                // Biến đổi câu hỏi Gap Fill
                let parts = q.questionText.split('GAP_PLACEHOLDER');
                htmlContent += `
                    <div class="question-text">
                        ${parts[0]} <button class="gap-btn" id="gap-${q.id}">[ Bấm Chọn Từ ]</button> ${parts[1] || ''}
                    </div>
                `;
            } else if (q.type === 'image') {
                htmlContent += `<div class="question-text">${q.questionHtml}</div>`;
            } else {
                htmlContent += `<div class="question-text">${q.question}</div>`;
            }

            // Sinh khung đáp án Grid
            htmlContent += `<div class="options-grid" id="grid-${q.id}">`;
            const letters = ['A', 'B', 'C', 'D'];
            
            q.shuffledOptions.forEach((opt, optIndex) => {
                let letter = letters[optIndex];
                htmlContent += `
                    <button class="option-btn" onclick="handleSelect(${qIndex}, ${optIndex}, this)">
                        <b>${letter}.</b> ${opt.text}
                    </button>
                `;
            });
            htmlContent += `</div>`;

            // Khung giải thích (ẩn ban đầu)
            htmlContent += `<div class="explanation" id="expl-${q.id}"></div>`;

            card.innerHTML = htmlContent;
            container.appendChild(card);
        });
    }

    // Hàm Xử lý khi người dùng bấm chọn đáp án
    function handleSelect(qIndex, optIndex, btnElement) {
        initAudio();
        const q = rawQuizData[qIndex];
        const selectedOption = q.shuffledOptions[optIndex];
        const card = document.getElementById(`q-card-${q.id}`);
        const grid = document.getElementById(`grid-${q.id}`);
        const explDiv = document.getElementById(`expl-${q.id}`);
        const gapBtn = document.getElementById(`gap-${q.id}`);

        // Vô hiệu hóa các nút khác trong câu này
        const buttons = grid.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        // Sinh phần giải thích SIÊU CHI TIẾT tự động khớp với thứ tự chữ cái ĐÃ XÁO TRỘN
        const letters = ['A', 'B', 'C', 'D'];
        let correctLetter = '';
        let wrongLetters = [];
        let optionAnalysis = '';

        q.shuffledOptions.forEach((opt, idx) => {
            let l = letters[idx];
            if (opt.isCorrect) correctLetter = l;
            else wrongLetters.push(l);
            
            optionAnalysis += `<b>${l}. ${opt.text}</b> ${opt.expl}<br>`;
        });

        // 4 Bước giải thích khắt khe
        explDiv.innerHTML = `
            <div class="explanation-title">📝 GIẢI THÍCH CHI TIẾT:</div>
            <div class="expl-step"><b>1. Dịch câu hỏi:</b> ${q.translation}</div>
            <div class="expl-step"><b>2. Phân tích 4 đáp án:</b><br>${optionAnalysis}</div>
            <div class="expl-step"><b>3. Tại sao chọn ${correctLetter}?</b><br>${q.correctReason}</div>
            <div class="expl-step"><b>4. Tại sao 3 đáp án còn lại sai?</b><br>Loại ${wrongLetters.join(', ')} vì ${q.wrongReason}</div>
        `;

        // Kiểm tra đúng / sai
        if (selectedOption.isCorrect) {
            btnElement.classList.add('correct');
            if(gapBtn) {
                gapBtn.innerHTML = selectedOption.text;
                gapBtn.classList.add('filled-correct');
            }
            playSound('correct');
            createConfetti();
            correctCount++;
        } else {
            btnElement.classList.add('wrong');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 400); // Xóa class để có thể shake lại nếu cần
            if(gapBtn) {
                gapBtn.innerHTML = selectedOption.text;
                gapBtn.classList.add('filled-wrong');
            }
            playSound('wrong');
            
            // Hiển thị thêm màu xanh cho nút đúng để học sinh biết
            q.shuffledOptions.forEach((opt, idx) => {
                if(opt.isCorrect) {
                    buttons[idx].style.border = "3px solid var(--correct)";
                }
            });
        }

        // Hiện khung giải thích ngay lập tức
        explDiv.style.display = 'block';
    }

    // --- 4. TÍNH ĐIỂM & TỔNG KẾT ---
    function showResults() {
        const modal = document.getElementById('result-modal');
        const scoreText = document.getElementById('score-text');
        const feedbackText = document.getElementById('feedback-text');

        scoreText.innerHTML = `Bạn đã trả lời đúng <span style="color:var(--correct); font-size:24px;">${correctCount} / ${totalQuestions}</span> câu!`;

        let feedback = "";
        if (correctCount === totalQuestions) {
            feedback = "🏆 Xuất sắc! Bạn đúng là THIÊN TÀI Tiếng Anh!";
            createConfetti(); createConfetti();
        } else if (correctCount >= totalQuestions * 0.7) {
            feedback = "🔥 Rất giỏi! Khả năng ngoại ngữ của bạn rất tuyệt vời!";
            createConfetti();
        } else if (correctCount >= totalQuestions * 0.5) {
            feedback = "👍 Khá lắm! Hãy xem kỹ phần giải thích để tiến bộ hơn nhé!";
        } else {
            feedback = "💪 Đừng buồn nhé! Cố gắng luyện tập thêm, Ms. Chí Nên tin bạn sẽ làm tốt hơn ở lần sau!";
        }

        feedbackText.innerHTML = feedback;
        modal.style.display = 'flex';
    }

    // Khởi tạo Quiz khi load trang
    window.onload = renderQuiz;

</script>
