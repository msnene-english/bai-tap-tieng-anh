<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Test Part 2 - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 50%, #00C9A7 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --correct: #00D26A;
            --wrong: #FF4757;
            --text: #2D3436;
            --btn-bg: #F0F2F5;
            --btn-shadow: #DFE4EA;
            --writing-bg: #E1F5FE;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--primary-bg);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
        }

        /* Họa tiết background mờ (Ngôi sao & Hoa) */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg"><path d="M25 0l5 15h15l-12 10 5 15-13-10-13 10 5-15-12-10h15z" fill="rgba(255,255,255,0.15)"/></svg>');
            z-index: -1;
            pointer-events: none;
        }

        .header-title {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        .section-title {
            color: white;
            font-size: 1.4rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            margin-top: 40px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.25);
            padding: 12px 25px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.2s;
            border: 4px solid white;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #34495E;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: var(--btn-bg);
            border: 3px solid transparent;
            border-radius: 18px;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            box-shadow: 0 6px 0 var(--btn-shadow);
            transition: all 0.15s ease;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 0 var(--btn-shadow);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-shadow);
        }

        .option-btn.correct {
            background: #E5F9E0;
            border-color: var(--correct);
            color: var(--correct);
            box-shadow: 0 6px 0 #00A352;
        }

        .option-btn.wrong {
            background: #FFEBEC;
            border-color: var(--wrong);
            color: var(--wrong);
            box-shadow: 0 6px 0 #D63031;
        }

        /* --- STYLES CHO PHẦN TỰ LUẬN (WRITING) --- */
        .writing-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .writing-input {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            border: 3px solid #DFE4EA;
            border-radius: 15px;
            background: var(--writing-bg);
            resize: vertical;
            min-height: 80px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .writing-input:focus {
            outline: none;
            border-color: #0984E3;
            background: white;
        }
        .check-writing-btn {
            align-self: flex-start;
            background: #0984E3;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            box-shadow: 0 5px 0 #0764AC;
            transition: all 0.15s;
        }
        .check-writing-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #0764AC;
        }
        .check-writing-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0764AC;
        }

        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #F8F9FA;
            border-left: 6px solid #00C9A7;
            border-radius: 15px;
            display: none;
            font-size: 1.05rem;
            line-height: 1.6;
            animation: slideDown 0.3s ease-out forwards;
            color: #2D3436;
        }

        .explanation h4 {
            margin: 0 0 10px 0;
            color: #8854C0;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .explanation p {
            margin: 8px 0;
        }

        .submit-container {
            text-align: center;
            margin: 50px 0;
        }

        .submit-btn {
            background: linear-gradient(to right, #FFE53B, #FF2525);
            border: none;
            padding: 20px 50px;
            border-radius: 40px;
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #D32F2F;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 0 #D32F2F;
        }

        .submit-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #D32F2F;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-3deg); }
            75% { transform: translateX(10px) rotate(3deg); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 12px; height: 12px;
            background: red;
            pointer-events: none;
            border-radius: 3px;
            z-index: 100;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Popup Score */
        #scorePopup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }
        .popup-content {
            background: white; padding: 50px; border-radius: 40px;
            text-align: center; max-width: 450px; width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 5px solid #00C9A7;
            animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popup-score { font-size: 4rem; color: #8854C0; font-weight: 900; margin: 20px 0; text-shadow: 2px 2px 0px #DFE4EA; }
        .popup-msg { font-size: 1.6rem; color: #FF4757; font-weight: 800; margin-bottom: 20px;}
        .popup-btn {
            padding: 15px 40px; background: #00C9A7;
            color: white; border: none; border-radius: 20px; font-size: 1.3rem;
            cursor: pointer; font-weight: 900; box-shadow: 0 6px 0 #00A352;
            transition: transform 0.1s;
        }
        .popup-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #00A352; }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h2 class="header-title">🌟 BÀI KIỂM TRA TIẾNG ANH - PHẦN 2 🌟<br><small>Giáo viên tạo: Ms. Chí Nên </small></h2>
    
    <div class="container" id="quizContainer">
        </div>

    <div class="submit-container">
        <button class="submit-btn" onclick="submitQuiz()">🏆 Nộp bài ngay! 🏆</button>
    </div>

    <div id="scorePopup">
        <div class="popup-content">
            <h2 style="color: #00C9A7; font-size: 2.2rem; margin-top:0;">KẾT QUẢ CỦA EM</h2>
            <div class="popup-score" id="scoreDisplay">0/0</div>
            <div class="popup-msg" id="scoreMsg">Thật tuyệt vời!</div>
            <p style="color: #7f8c8d; font-size: 1.1rem;">*Điểm số chỉ tính các câu Trắc nghiệm ABCD. Các câu Tự luận hãy tự thưởng điểm cho mình nếu làm đúng nhé!*</p>
            <button class="popup-btn" onclick="document.getElementById('scorePopup').style.display='none'">Xem lại bài làm</button>
        </div>
    </div>

<script>
    // --- AUDIO SYSTEM ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) audioCtx = new AudioContext();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'ding') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'buzz') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'pop') {
            // Âm thanh nhẹ khi bấm xem đáp án tự luận
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    // --- CONFETTI SYSTEM ---
    function fireConfetti(x, y) {
        const colors = ['#00D26A', '#FF4757', '#FFE53B', '#0984E3', '#8854C0', '#00C9A7'];
        for (let i = 0; i < 40; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = (x + (Math.random() * 100 - 50)) + 'px';
            conf.style.top = (y + (Math.random() * 50 - 25)) + 'px';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            const duration = Math.random() * 1.5 + 1;
            conf.style.animation = `fall ${duration}s cubic-bezier(.37,0,.63,1) forwards`;
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), duration * 1000);
        }
    }

    // --- DATA SYSTEM (Dữ liệu JSON 100% gốc, giải thích siêu chi tiết) ---
    const quizData = [
        { section: "IV. Choose the underlined word or phrase, A, B, C or D that needs correcting" },
        { q: "1. <u>Before</u> we reduce the use of <u>single-use products</u>, we <u>help</u> protect the <u>environment</u>.", type: "mc",
          opts: { A: "Before", B: "reduce", C: "single-use products", D: "protect" }, ans: "A", // Đề gốc lỗi gạch chân, đã suy luận
          exp: "1. Dịch: [Trước khi] chúng ta giảm việc dùng sản phẩm dùng 1 lần, chúng ta giúp bảo vệ môi trường.\n2. Phân tích: A. Before (Trước khi); B. reduce (giảm); C. single-use products (sản phẩm 1 lần); D. protect (bảo vệ).\n3. Tại sao chọn A sai? Logic thời gian bị ngược. Phải là 'After' (Sau khi) hoặc 'When' (Khi) giảm rác thải thì mới bảo vệ được môi trường.\n4. B, C, D đều sử dụng đúng từ loại và cấu trúc." },
        { q: "2. Technology <u>has</u> a long way <u>to go</u> before <u>it can make</u> a large impact <u>in</u> the atmosphere.", type: "mc",
          opts: { A: "has", B: "to go", C: "it can make", D: "in" }, ans: "D",
          exp: "1. Dịch: Công nghệ còn một chặng đường dài trước khi nó có thể tạo ra tác động lớn [vào] bầu khí quyển.\n2. Phân tích: A. has; B. to go; C. it can make; D. in (đề gốc ghi in- on ngầm ý sửa).\n3. Tại sao chọn D sai? Collocation bắt buộc trong tiếng Anh là 'make an impact ON something' (tạo tác động LÊN cái gì).\n4. Sửa 'in' thành 'on'." },
        { q: "3. I learned <u>a lot</u> about wildlife <u>until</u> I visited <u>Cuc Phuong National</u> Park <u>last week</u>.", type: "mc",
          opts: { A: "a lot", B: "until", C: "National", D: "last week" }, ans: "B",
          exp: "1. Dịch: Tôi đã học được rất nhiều về động vật hoang dã [cho đến khi] tôi đến thăm Rừng Cúc Phương tuần trước.\n2. Phân tích: A. a lot; B. until; C. National; D. last week.\n3. Tại sao chọn B sai? Dùng 'until' (cho đến khi) làm sai logic câu (Học được nhiều cho đến khi thăm -> nghĩa là thăm xong thì không học nữa?). Phải sửa thành 'when' (khi) hoặc 'after' (sau khi).\n4. Các phần còn lại đúng ngữ pháp quá khứ đơn." },
        { q: "4. <u>While</u> they <u>came</u> home, they <u>fed</u> their dogs <u>and</u> cats.", type: "mc",
          opts: { A: "While", B: "came", C: "fed", D: "and" }, ans: "A", // Đề gốc thứ tự ABCD lộn xộn, map lại theo logic
          exp: "1. Dịch: [Trong khi] họ về nhà, họ đã cho chó và mèo ăn.\n2. Phân tích: A. While (Trong khi); B. came; C. fed; D. and.\n3. Tại sao chọn A sai? 'Come home' là hành động ngắn, không kéo dài, nên không dùng 'While' (dành cho hành động tiếp diễn). \n4. Cần sửa 'While' thành 'When' (Khi họ về đến nhà, họ cho chó mèo ăn)." },
        { q: "5. I <u>watched</u> TV <u>when</u> my building <u>started</u> <u>trembling</u>.", type: "mc",
          opts: { A: "watched", B: "when", C: "started", D: "trembling" }, ans: "A",
          exp: "1. Dịch: Tôi [đã xem] TV khi tòa nhà của tôi bắt đầu rung lắc.\n2. Phân tích sự phối hợp thì: Một hành động ĐANG xảy ra (xem TV) thì hành động khác CẮT NGANG (tòa nhà rung lắc).\n3. Tại sao chọn A sai? Động từ xem TV phải chia ở Quá khứ tiếp diễn (was watching) chứ không phải Quá khứ đơn (watched).\n4. B, C, D hoàn toàn chính xác theo quy tắc ngữ pháp." },
        { q: "6. What <u>did you do</u> <u>when</u> the volcano <u>erupted</u> <u>last week</u>?", type: "mc",
          opts: { A: "did you do", B: "when", C: "erupted", D: "last week" }, ans: "A",
          exp: "1. Dịch: Bạn [đã làm gì] khi núi lửa phun trào tuần trước?\n2. Phân tích ý nghĩa: Người hỏi muốn biết BẠN ĐANG LÀM GÌ tại thời điểm ngọn núi lửa bất ngờ phun trào.\n3. Tại sao chọn A sai? Cần dùng thì Quá khứ tiếp diễn cho hành động đang diễn ra -> Sửa thành 'were you doing'.\n4. C (erupted) chia quá khứ đơn cho hành động cắt ngang là đúng." },
        { q: "7. <u>As soon as</u> my brother is <u>chatting</u> with his friend on the <u>telephone</u>, I am writing <u>an</u> email to my cousin.", type: "mc",
          opts: { A: "As soon as", B: "chatting", C: "telephone", D: "an" }, ans: "A",
          exp: "1. Dịch: [Ngay khi] anh trai tôi đang nhắn tin trên điện thoại, tôi đang viết email.\n2. Phân tích: Hai hành động đang diễn ra song song cùng một lúc ở hiện tại (is chatting / am writing).\n3. Tại sao chọn A sai? Liên từ 'As soon as' (ngay khi - chỉ sự nối tiếp) không dùng cho 2 hành động song song tiếp diễn. \n4. Phải sửa thành 'While' (Trong khi)." },
        { q: "8. Trung <u>learned</u> how to ride a <u>bike</u> <u>then</u> his parents bought him <u>one</u>.", type: "mc",
          opts: { A: "learned", B: "bike", C: "then", D: "one" }, ans: "C",
          exp: "1. Dịch: Trung học cách đạp xe [sau đó/thì] bố mẹ cậu ấy mua cho cậu 1 chiếc.\n2. Phân tích logic: Thường thì được mua xe xong mới học lái, hoặc học xong thì được thưởng xe. Dùng liên từ nối mệnh đề.\n3. Tại sao chọn C sai? Dùng 'then' nối 2 mệnh đề độc lập mà không có 'and' là sai ngữ pháp (run-on sentence). Sửa thành 'when' (khi) hoặc 'after' (sau khi).\n4. D (one) thay thế cho 'a bike' là chính xác." },
        { q: "9. <u>The</u> <u>ecosystem</u> of Cuc Phuong Nation Park is <u>diverse</u> <u>for</u> various types of animals and plants.", type: "mc",
          opts: { A: "The", B: "ecosystem", C: "diverse", D: "for" }, ans: "D",
          exp: "1. Dịch: Hệ sinh thái rừng Cúc Phương rất đa dạng [cho] nhiều loại động thực vật.\n2. Phân tích giới từ đi kèm tính từ.\n3. Tại sao chọn D sai? 'Diverse in' hoặc câu này ý muốn nói là 'nơi sinh sống của' thì phải dùng 'is home TO various types...'. Nếu giữ diverse thì 'diverse WITH/IN'. Chữ 'for' ở đây sai cách kết hợp từ (collocation).\n4. Các từ vựng khác đúng ngữ cảnh." },
        { q: "10. You should look at <u>both</u> sides <u>carefully</u> <u>after</u> you cross <u>the</u> street.", type: "mc",
          opts: { A: "both", B: "carefully", C: "after", D: "the" }, ans: "C",
          exp: "1. Dịch: Bạn nên nhìn cả 2 phía cẩn thận [sau khi] bạn sang đường.\n2. Phân tích logic an toàn giao thông.\n3. Tại sao chọn C sai? Sang đường xong mới nhìn thì quá muộn! Phải đổi liên từ 'after' thành 'before' (trước khi).\n4. Đây là một câu bẫy học sinh về mặt ngữ nghĩa." },
        { q: "11. I <u>didn’t check</u> Facebook <u>at</u> 7pm yesterday, but I <u>was watching</u> the news <u>about</u> the flood.", type: "mc",
          opts: { A: "didn’t check", B: "at", C: "was watching", D: "about" }, ans: "A",
          exp: "1. Dịch: Tôi [đã không kiểm tra] FB vào ĐÚNG 7h tối qua, mà tôi ĐANG xem tin tức...\n2. Phân tích: Có thời gian xác định cụ thể trong quá khứ 'at 7pm yesterday' -> Bắt buộc dùng thì Quá khứ tiếp diễn.\n3. Tại sao chọn A sai? 'didn't check' là QK đơn. Cần sửa thành 'wasn't checking' để diễn tả hành động đang không xảy ra tại 1 thời điểm cụ thể.\n4. C (was watching) đã làm rất chuẩn quy tắc này." },
        { q: "12. Jack and Jane <u>still discussed</u> the trends <u>of</u> fashion <u>when</u> I <u>got</u> back to their room.", type: "mc",
          opts: { A: "still discussed", B: "of", C: "when", D: "got" }, ans: "A",
          exp: "1. Dịch: Jack và Jane [vẫn đã thảo luận] về xu hướng thời trang khi tôi quay lại phòng.\n2. Phân tích hành động: Khi tôi quay lại (hành động ngắn) thì họ ĐANG thảo luận (hành động dài).\n3. Tại sao chọn A sai? Phải chia Quá khứ tiếp diễn 'were still discussing' thay vì quá khứ đơn.\n4. Sự phối hợp thì (QK Tiếp Diễn + When + QK Đơn)." },
        { q: "13. The summer term <u>will begin</u> <u>on</u> April 10th, so you should <u>carefully</u> prepare for <u>it</u>.", type: "mc",
          opts: { A: "will begin", B: "on", C: "carefully", D: "it" }, ans: "A",
          exp: "1. Dịch: Học kỳ mùa hè [sẽ bắt đầu] vào ngày 10/4, vì vậy...\n2. Phân tích lịch trình: Ngày bắt đầu học kỳ là một lịch trình cố định (timetable/schedule).\n3. Tại sao chọn A sai? Đối với lịch trình cố định, ta dùng thì Hiện Tại Đơn (begins) mang ý nghĩa tương lai, không dùng 'will begin'.\n4. B (on + ngày tháng) là chuẩn xác." },

        { section: "V. Mark the letter A, B, C or D to indicate the word(s) CLOSEST in meaning" },
        { q: "1. It’s important to <u>obey</u> the traffic rules when you are a road user.", type: "mc",
          opts: { A: "remember", B: "follow", C: "forget", D: "ignore" }, ans: "B",
          exp: "1. Dịch: Điều quan trọng là phải tuân thủ luật giao thông.\n2. Từ vựng:\n- obey (v): tuân lệnh, tuân thủ\nA. remember (v): nhớ\nB. follow (v): theo, tuân theo\nC. forget (v): quên\nD. ignore (v): phớt lờ\n3. Chọn B vì 'obey' đồng nghĩa với 'follow' (tuân theo luật).\n4. C và D là từ trái nghĩa." },
        { q: "2. Many young children ride their bikes <u>dangerously</u>.", type: "mc",
          opts: { A: "safely", B: "carefully", C: "carelessly", D: "happily" }, ans: "C",
          exp: "1. Dịch: Nhiều trẻ em đạp xe một cách nguy hiểm.\n2. Từ vựng:\n- dangerously (adv): một cách nguy hiểm\nA. safely: an toàn\nB. carefully: cẩn thận\nC. carelessly: bất cẩn, cẩu thả\nD. happily: vui vẻ\n3. Chọn C vì 'carelessly' (bất cẩn) gần nghĩa nhất với việc lái xe gây nguy hiểm trong ngữ cảnh này.\n4. A và B là trái nghĩa." },
        { q: "3. Many schools provide environment education to raise student’s <u>awareness</u> of conservation needs.", type: "mc",
          opts: { A: "effort", B: "benefit", C: "exploitation", D: "knowledge" }, ans: "D",
          exp: "1. Dịch: ...giáo dục môi trường để nâng cao nhận thức của học sinh.\n2. Từ vựng:\n- awareness (n): sự nhận thức, sự hiểu biết\nA. effort (n): nỗ lực\nB. benefit (n): lợi ích\nC. exploitation (n): sự bóc lột/khai thác\nD. knowledge (n): kiến thức, sự hiểu biết\n3. Chọn D vì 'knowledge' gần nghĩa nhất với 'awareness'.\n4. Các từ còn lại sai khác hoàn toàn về nghĩa." },
        { q: "4. It was great to see monkeys in their natural <u>habitat</u>.", type: "mc",
          opts: { A: "sky", B: "home", C: "forest", D: "land" }, ans: "B",
          exp: "1. Dịch: Thật tuyệt khi thấy những chú khỉ trong môi trường sống tự nhiên của chúng.\n2. Từ vựng:\n- habitat (n): môi trường sống, chỗ ở tự nhiên\nA. sky: bầu trời\nB. home: nhà, nơi ở\nC. forest: rừng\nD. land: đất đai\n3. Chọn B vì 'home' là từ gần nghĩa nhất chỉ nơi sinh sống.\n4. Dù khỉ sống ở rừng (C), nhưng 'habitat' bao hàm nghĩa rộng là 'home' cho mọi loài, không chỉ forest." },
        { q: "5. Most mothers love shopping at the <u>discount</u> shops because they offer lower prices.", type: "mc",
          opts: { A: "increase", B: "reduction", C: "agreement", D: "extension" }, ans: "B",
          exp: "1. Dịch: Hầu hết các bà mẹ thích mua sắm ở cửa hàng giảm giá...\n2. Từ vựng:\n- discount (n): sự giảm giá, chiết khấu\nA. increase (n): sự tăng lên\nB. reduction (n): sự sụt giảm, giảm giá\nC. agreement (n): thỏa thuận\nD. extension (n): sự mở rộng\n3. Chọn B vì 'reduction' (giảm bớt) đồng nghĩa với 'discount'.\n4. A là từ trái nghĩa." },
        { q: "6. All the <u>items</u> have fixed prices on their price tag.", type: "mc",
          opts: { A: "clothes", B: "drinks", C: "food", D: "goods" }, ans: "D",
          exp: "1. Dịch: Tất cả các mặt hàng đều có giá cố định trên thẻ giá.\n2. Từ vựng:\n- items (n): món đồ, mặt hàng\nA. clothes: quần áo\nB. drinks: đồ uống\nC. food: thức ăn\nD. goods: hàng hóa\n3. Chọn D vì 'goods' (hàng hóa nói chung) mang nghĩa bao quát nhất, tương đương với 'items'.\n4. A, B, C quá cụ thể, không đại diện cho toàn bộ 'items'." },
        { q: "7. Cornbread is one of the <u>traditional</u> dishes on Thanksgiving Day.", type: "mc",
          opts: { A: "old", B: "modern", C: "different", D: "irregular" }, ans: "A",
          exp: "1. Dịch: Bánh ngô là một trong những món ăn truyền thống vào Lễ Tạ Ơn.\n2. Từ vựng:\n- traditional (adj): thuộc về truyền thống, lâu đời\nA. old (adj): cũ, lâu đời\nB. modern (adj): hiện đại\nC. different (adj): khác biệt\nD. irregular (adj): bất quy tắc\n3. Chọn A vì 'old' truyền tải nghĩa có từ lâu đời tương tự 'traditional'.\n4. B là từ trái nghĩa." },
        { q: "8. A lot of people go to Cusco, Peru, to <u>attend</u> the festival.", type: "mc",
          opts: { A: "miss", B: "celebrate", C: "promise", D: "go to" }, ans: "D",
          exp: "1. Dịch: Nhiều người đến Peru để tham dự lễ hội.\n2. Từ vựng:\n- attend (v): tham dự, có mặt\nA. miss (v): bỏ lỡ\nB. celebrate (v): ăn mừng\nC. promise (v): hứa\nD. go to (v): đi đến, tham gia vào\n3. Chọn D vì 'go to' (đến dự) sát nghĩa với 'attend' nhất trong bối cảnh này.\n4. A là trái nghĩa. B chỉ hành động 'ăn mừng' chứ không hẳn là 'tham dự' một cách vật lý." },

        { section: "VI. Mark the letter A, B, C or D to indicate the word(s) OPPOSITE in meaning" },
        { q: "1. The new laws to <u>conserve</u> wildlife in the area will come into force next month.", type: "mc",
          opts: { A: "pollute", B: "destroy", C: "eliminate", D: "protect" }, ans: "B",
          exp: "1. Dịch: Luật mới để bảo tồn động vật hoang dã sẽ có hiệu lực.\n2. Từ vựng:\n- conserve (v): bảo tồn, gìn giữ\nA. pollute: làm ô nhiễm\nB. destroy: phá hủy\nC. eliminate: loại bỏ\nD. protect: bảo vệ\n3. Chọn B vì 'destroy' (phá hủy) trái nghĩa hoàn toàn với 'conserve' (bảo tồn).\n4. D là từ đồng nghĩa, đề yêu cầu tìm từ TRÁI NGHĨA." },
        { q: "2. Many human activities harm <u>natural</u> habitats.", type: "mc",
          opts: { A: "non-living", B: "unpolluted", C: "clean", D: "man-made" }, ans: "D",
          exp: "1. Dịch: Nhiều hoạt động con người gây hại cho môi trường sống tự nhiên.\n2. Từ vựng:\n- natural (adj): thuộc tự nhiên\nA. non-living: không có sự sống\nB. unpolluted: không bị ô nhiễm\nC. clean: sạch\nD. man-made: nhân tạo (do người làm ra)\n3. Chọn D vì 'man-made' (nhân tạo) trái nghĩa với 'natural' (tự nhiên).\n4. Các từ còn lại không mang ý đối lập trực tiếp về nguồn gốc." },
        { q: "3. It's easy to <u>waste</u> time browsing online when shopping, isn’t it?", type: "mc",
          opts: { A: "protect", B: "conserve", C: "save", D: "spend" }, ans: "C",
          exp: "1. Dịch: Rất dễ lãng phí thời gian khi lướt mạng mua sắm phải không?\n2. Từ vựng:\n- waste (v): lãng phí\nA. protect: bảo vệ\nB. conserve: bảo tồn\nC. save: tiết kiệm\nD. spend: tiêu xài\n3. Chọn C vì 'save' (tiết kiệm) là từ trái nghĩa hoàn hảo của 'waste' (lãng phí).\n4. D (spend) chỉ hành động tiêu tốn chung chung." },
        { q: "4. Window shopping filled me with <u>excitement</u> even though I didn’t plan to buy anything.", type: "mc",
          opts: { A: "enjoyment", B: "ugliness", C: "inattention", D: "boredom" }, ans: "D",
          exp: "1. Dịch: Ngắm đồ qua tủ kính làm tôi tràn ngập sự phấn khích...\n2. Từ vựng:\n- excitement (n): sự phấn khích, hào hứng\nA. enjoyment: sự thích thú\nB. ugliness: sự xấu xí\nC. inattention: sự thiếu chú ý\nD. boredom: sự nhàm chán\n3. Chọn D vì 'boredom' (chán nản) trái nghĩa với 'excitement' (phấn khích).\n4. A là từ gần nghĩa." },
        { q: "5. It’s raining hard, but Mr Long is driving <u>quickly</u>.", type: "mc",
          opts: { A: "slowly", B: "fast", C: "brightly", D: "frequently" }, ans: "A",
          exp: "1. Dịch: Trời đang mưa to, nhưng ông Long lại đang lái xe nhanh.\n2. Từ vựng:\n- quickly (adv): một cách nhanh chóng\nA. slowly (adv): một cách chậm chạp\nB. fast (adv): nhanh\nC. brightly (adv): sáng sủa\nD. frequently (adv): thường xuyên\n3. Chọn A vì 'slowly' trái nghĩa với 'quickly'.\n4. B là từ đồng nghĩa." },
        { q: "6. The roads in Mumbai are so <u>narrow</u> that cars cannot move.", type: "mc",
          opts: { A: "tight", B: "small", C: "bumpy", D: "wide" }, ans: "D",
          exp: "1. Dịch: Đường ở Mumbai quá chật hẹp đến nỗi ô tô không di chuyển được.\n2. Từ vựng:\n- narrow (adj): chật hẹp\nA. tight: chặt\nB. small: nhỏ\nC. bumpy: gập ghềnh\nD. wide: rộng rãi\n3. Chọn D vì 'wide' (rộng lớn) trái nghĩa với 'narrow' (hẹp).\n4. A, B mang nét nghĩa gần tương đồng với sự chật chội." },

        { section: "VII. Mark the letter A, B, C or D to indicate the most suitable response" },
        { q: "1. - Tom: ________\n- Nam: I think it’s a great idea.", type: "mc",
          opts: { A: "We did a great job.", B: "The wildlife series is on VTV3.", C: "What do you think about our 3Rs project?", D: "What do you think about the environment?" }, ans: "C",
          exp: "1. Dịch:\nNam: Mình nghĩ đó là một ý tưởng tuyệt vời.\n2. Phân tích ngữ cảnh: Câu trả lời đánh giá một 'ý tưởng' (idea).\n3. Chọn C (Bạn nghĩ sao về dự án 3R của chúng ta?) là hợp lý nhất vì dự án là một ý tưởng cần đánh giá.\n4. D hỏi chung chung về môi trường (không phải ý tưởng cụ thể). A và B là câu trần thuật không ăn nhập." },
        { q: "2. - Nick: What should we do to reduce the use of clean water?\n- Mi: ________", type: "mc",
          opts: { A: "Turn off the tap tight.", B: "No, you shouldn’t.", C: "Educate children how to use clean water.", D: "I think it’s easy." }, ans: "A",
          exp: "1. Dịch: Nick: Chúng ta nên làm gì để giảm việc sử dụng nước sạch?\n2. Phân tích: Cần đưa ra một hành động cụ thể để tiết kiệm nước.\n3. Chọn A (Vặn chặt vòi nước) là biện pháp trực tiếp và chính xác nhất.\n4. C là giáo dục cách dùng chung chung, không trực tiếp trả lời câu hỏi 'chúng ta làm gì ngay lúc này'. B sai logic trả lời." },
        { q: "3. - Duong: I'm afraid there is a slight problem with the service in your hotel. The electricity was cut off for nearly 2 hours...\n- Ms Ha: ___________", type: "mc",
          opts: { A: "I'm unhappy about your behavior.", B: "I'm so sorry, but this will never happen again.", C: "I’m pleased you’re safe and sound.", D: "Thank you for your encouragement." }, ans: "B",
          exp: "1. Dịch: Dương phàn nàn về việc mất điện 2 tiếng ở khách sạn.\n2. Phân tích: Khi khách hàng phàn nàn, nhân viên cần xin lỗi và cam kết khắc phục.\n3. Chọn B (Tôi rất xin lỗi, điều này sẽ không bao giờ xảy ra nữa) là mẫu câu chuẩn trong ngành dịch vụ.\n4. A là mắng lại khách. C và D hoàn toàn lạc đề." },
        { q: "4. “Hello, I’d like to make a complaint about my internet service.”\n– “ _________________”", type: "mc",
          opts: { A: "Thank you for your service.", B: "I’m sorry to hear that, what is the problem?", C: "Help yourself.", D: "Your internet speed is very slow." }, ans: "B",
          exp: "1. Dịch: Khách: 'Xin chào, tôi muốn khiếu nại về dịch vụ internet.'\n2. Phân tích: Đáp lại lời phàn nàn, cần lịch sự xin lỗi và hỏi nguyên nhân.\n3. Chọn B (Tôi rất tiếc khi nghe điều đó, có vấn đề gì vậy ạ?) thể hiện sự chuyên nghiệp.\n4. A là cám ơn sai hoàn cảnh. C là 'cứ tự nhiên'. D là nhân viên tự chê mạng nhà mình (sai logic)." },

        { section: "IX. WRITING (Tự Luận - Em hãy tự gõ đáp án nhé!)" },
        // Part I
        { q: "I. 1. Ice sheets and glaciers are shrinking. Sea levels are rising at the same time. (while)", type: "write",
          ans: "Ice sheets and glaciers are shrinking while sea levels are rising.",
          exp: "1. Dịch: Các dải băng và sông băng đang co lại trong khi mực nước biển đang dâng lên.\n2. Cấu trúc: 'While' (trong khi) nối 2 hành động xảy ra song song. Bỏ 'at the same time' vì 'while' đã mang nghĩa đó." },
        { q: "I. 2. I saw an accident. I was waiting for my bus. (while)", type: "write",
          ans: "I saw an accident while I was waiting for my bus.",
          exp: "1. Dịch: Tôi đã thấy một tai nạn trong khi tôi đang đợi xe buýt.\n2. Cấu trúc: Hành động dài (đang đợi) đứng sau liên từ 'while' (Quá khứ tiếp diễn), hành động ngắn (nhìn thấy) chia Quá khứ đơn." },
        { q: "I. 3. I do the shopping. Then I will come back home. (after)", type: "write",
          ans: "After I do the shopping, I will come back home. / I will come back home after I do the shopping.",
          exp: "1. Dịch: Sau khi tôi mua sắm xong, tôi sẽ về nhà.\n2. Cấu trúc: 'After' đứng trước hành động xảy ra trước. Lưu ý bỏ chữ 'Then' (sau đó) trong câu gốc." },
        { q: "I. 4. We can solve any problem. It’s important to understand it first. (before)", type: "write",
          ans: "Before we can solve any problem, it’s important to understand it first. / It’s important to understand any problem before we can solve it.",
          exp: "1. Dịch: Trước khi chúng ta có thể giải quyết bất kỳ vấn đề nào, hiểu nó trước là điều quan trọng.\n2. Logic: Hành động 'hiểu' phải diễn ra TRƯỚC khi 'giải quyết'." },
        { q: "I. 5. He left for work. He had a cup of tea. (before)", type: "write",
          ans: "He had a cup of tea before he left for work. / Before he left for work, he had a cup of tea.",
          exp: "1. Dịch: Trước khi anh ấy rời đi làm, anh ấy đã uống 1 tách trà.\n2. Logic: Hành động uống trà xảy ra trước hành động đi làm." },
        { q: "I. 6. We should always turn off the lights. And then we leave a room. (as soon as)", type: "write",
          ans: "We should always turn off the lights as soon as we leave a room.",
          exp: "1. Dịch: Chúng ta luôn nên tắt đèn ngay khi chúng ta rời khỏi phòng.\n2. Cấu trúc: 'As soon as' (Ngay khi) thay thế cho 'And then' mang ý nghĩa nối tiếp lập tức." },
        { q: "I. 7. I will call my mom. I get the result. (as soon as)", type: "write",
          ans: "I will call my mom as soon as I get the result.",
          exp: "1. Dịch: Mình sẽ gọi cho mẹ ngay khi mình nhận được kết quả.\n2. Mệnh đề thời gian bắt đầu bằng 'As soon as' chia ở hiện tại đơn (get), mệnh đề chính chia tương lai (will call)." },
        { q: "I. 8. The road condition is poor. There have been several accidents. (Because)", type: "write",
          ans: "Because the road condition is poor, there have been several accidents.",
          exp: "1. Dịch: Bởi vì điều kiện đường xá kém, đã có vài vụ tai nạn xảy ra.\n2. 'Because' (bởi vì) đứng trước mệnh đề chỉ nguyên nhân. Nếu đặt ở đầu câu, nhớ dùng dấu phẩy ngăn cách 2 mệnh đề." },
        { q: "I. 9. I finish my study. I will take a walk in the park. (as soon as)", type: "write",
          ans: "As soon as I finish my study, I will take a walk in the park.",
          exp: "1. Dịch: Ngay khi tôi hoàn thành việc học, tôi sẽ đi dạo trong công viên.\n2. 'As soon as' diễn tả hành động nối tiếp ngay lập tức ở tương lai." },
        { q: "I. 10. Balloons are released into the air. They become deadly litter right after that. (as soon as)", type: "write",
          ans: "As soon as balloons are released into the air, they become deadly litter.",
          exp: "1. Dịch: Ngay khi bóng bay được thả lên trời, chúng biến thành rác thải chết chóc.\n2. Lưu ý bỏ cụm 'right after that' vì 'as soon as' đã bao hàm nghĩa đó rồi." },
        // Part II
        { q: "II. 1. Unless treated waste water is used and managed properly, health effects will occur.<br>-> If...", type: "write",
          ans: "If treated waste water is not used and managed properly, health effects will occur.",
          exp: "1. Cấu trúc: Unless = If ... not (Nếu ... không). \n2. Biến đổi: Thêm 'not' vào mệnh đề điều kiện: 'is NOT used...'" },
        { q: "II. 2. We can’t slow down climate change unless we stop using fossil fuels.<br>🡪 If...", type: "write",
          ans: "If we don't stop using fossil fuels, we can’t slow down climate change.",
          exp: "1. Cấu trúc: Biến Unless thành If + phủ định.\n2. Biến đổi: 'unless we stop' -> 'If we don't stop'. (Mượn trợ động từ do/does)." },
        { q: "II. 4. If they don’t bring a compass, they will get lost in the jungle.<br>🡪 Unless James...", type: "write",
          ans: "Unless James brings a compass, he (they) will get lost in the jungle.",
          exp: "1. Cấu trúc: If ... not = Unless. Bỏ 'don't' và chia lại động từ.\n2. Chủ ngữ yêu cầu đổi thành 'James' -> động từ 'bring' thêm 's' thành 'brings'." },
        { q: "II. 5. The guidelines for evacuation will be useless if people don’t read and follow them.<br>🡪 Unless people...", type: "write",
          ans: "Unless people read and follow the guidelines for evacuation, they will be useless.",
          exp: "1. Cấu trúc: If + don't read = Unless + read.\n2. Nhớ đảo vế để câu có chủ ngữ rõ ràng trước, đại từ 'they' thay cho guidelines ở vế sau." },
        { q: "II. 6. Let’s go to a shopping mall instead of surfing the online stores.<br>🡪 Why don’t...", type: "write",
          ans: "Why don’t we go to a shopping mall instead of surfing the online stores?",
          exp: "1. Cấu trúc gợi ý: Let's + V-nguyên thể = Why don't we + V-nguyên thể? (Tại sao chúng ta không...)\n2. Lưu ý thêm dấu chấm hỏi (?) ở cuối câu nhé!" },
        { q: "II. 7. They predict the hurricane won’t hit the city, but the residents still get prepared for the worst.<br>🡪 Although...", type: "write",
          ans: "Although they predict the hurricane won’t hit the city, the residents still get prepared for the worst.",
          exp: "1. Cấu trúc nhượng bộ: Although (Mặc dù). \n2. Rất quan trọng: Khi dùng 'Although' ở đầu câu, tuyệt đối PHẢI BỎ chữ 'but' ở giữa câu." },
        { q: "II. 8. It was raining heavily but Kathy still decided to go to school.<br>🡪 Although it...", type: "write",
          ans: "Although it was raining heavily, Kathy still decided to go to school.",
          exp: "1. Cấu trúc: Tương tự câu trên. Although S + V, S + V.\n2. Phải bỏ chữ 'but' đi." },
        { q: "II. 9. Although ordering food online is convenient, it can be more expensive and sometimes have delivery delays. (however)<br>-> Ordering...", type: "write",
          ans: "Ordering food online is convenient; however, it can be more expensive and sometimes have delivery delays.",
          exp: "1. Cấu trúc: Clause 1; however, Clause 2. (Tuy nhiên).\n2. Dấu câu rất quan trọng: Dùng dấu chấm phẩy (;) trước however và dấu phẩy (,) sau however." },
        // Part III
        { q: "III. 1. When / phone /ring/ Peter /play/ computer games.", type: "write",
          ans: "When the phone rang, Peter was playing computer games.",
          exp: "1. Dịch: Khi điện thoại reo, Peter đang chơi game.\n2. Sự phối hợp thì: Hành động đang xảy ra dùng QK Tiếp diễn (was playing), hành động cắt ngang dùng QK đơn (rang)." },
        { q: "III. 2. you /visit/ your grandparents/ when/ I /text/ you?", type: "write",
          ans: "Were you visiting your grandparents when I texted you?",
          exp: "1. Dịch: Bạn đang thăm ông bà khi tôi nhắn tin cho bạn phải không?\n2. Câu hỏi Yes/No ở thì QK Tiếp diễn, đảo 'Were' lên đầu." },
        { q: "III. 3. What / you /do/ when/ the volcano/ erupt /?", type: "write",
          ans: "What were you doing when the volcano erupted?",
          exp: "1. Dịch: Bạn đang làm gì khi núi lửa phun trào?\n2. Câu hỏi WH- ở thì QK Tiếp Diễn (were you doing), vế 'when' chia QK Đơn (erupted)." },
        { q: "III. 4. I /find/my old diary /when/ I clean/ my bedroom.", type: "write",
          ans: "I found my old diary when I was cleaning my bedroom.",
          exp: "1. Dịch: Tôi đã tìm thấy nhật ký cũ khi tôi đang dọn phòng.\n2. Find -> found (QK đơn); clean -> was cleaning (QK Tiếp diễn)." },
        { q: "III. 5. They/ listen/ music /while /revising /their exams.", type: "write",
          ans: "They were listening to music while revising for their exams.",
          exp: "1. Dịch: Họ đang nghe nhạc trong lúc ôn thi.\n2. Listen -> listen to music. Rút gọn chủ ngữ sau 'while' (while revising) là chính xác." },
        { q: "III. 6. We / clean / the beach/ as soon as / it/ stop/ rain/.", type: "write",
          ans: "We will clean the beach as soon as it stops raining.",
          exp: "1. Dịch: Chúng tôi sẽ dọn biển ngay khi trời tạnh mưa.\n2. Tương lai đơn (will clean) + As soon as + Hiện tại đơn (stops). Sau stop dùng V-ing (raining)." },
        { q: "III. 7. According/ timetable / we / have / Home Economics/ next semester /.", type: "write",
          ans: "According to the timetable, we have Home Economics next semester.",
          exp: "1. Dịch: Theo lịch trình, chúng ta có môn Kinh tế gia đình vào kỳ tới.\n2. 'According to' (Theo như). Vì là lịch trình cố định nên chia Hiện tại đơn (have) dù có cụm từ tương lai 'next semester'." }
    ];

    // --- RENDER SYSTEM ---
    const quizContainer = document.getElementById('quizContainer');
    let totalMCQuestions = 0;
    let correctCount = 0;
    let answeredMCQuestions = new Set();

    // Thuật toán xáo trộn (Chỉ xáo trộn đáp án Trắc nghiệm ABCD)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    quizData.forEach((item, index) => {
        if (item.section) {
            const sectionTitle = document.createElement('div');
            sectionTitle.className = 'section-title';
            sectionTitle.innerHTML = item.section;
            quizContainer.appendChild(sectionTitle);
            return;
        }

        const card = document.createElement('div');
        card.className = 'question-card';
        
        if(item.type === "mc") {
            totalMCQuestions++;
            const optionsArr = [
                { key: 'A', text: item.opts.A },
                { key: 'B', text: item.opts.B },
                { key: 'C', text: item.opts.C },
                { key: 'D', text: item.opts.D }
            ];
            
            shuffleArray(optionsArr);
            let optionsHTML = '';
            optionsArr.forEach(opt => {
                optionsHTML += `<button class="option-btn" onclick="checkMCAnswer(this, '${opt.key}', '${item.ans}', ${index})">
                    <strong style="margin-right:10px; color:#8854C0; font-size:1.2rem;">${opt.key}.</strong> ${opt.text}
                </button>`;
            });

            const formattedExp = item.exp.replace(/\n/g, '<br>');
            card.innerHTML = `
                <div class="question-text">${item.q}</div>
                <div class="options-grid">${optionsHTML}</div>
                <div class="explanation" id="exp-${index}">
                    <h4>💡 GIẢI THÍCH CHI TIẾT:</h4>
                    <p>${formattedExp}</p>
                </div>
            `;
        } else if (item.type === "write") {
            const formattedExp = item.exp.replace(/\n/g, '<br>');
            card.innerHTML = `
                <div class="question-text">${item.q}</div>
                <div class="writing-area">
                    <textarea class="writing-input" placeholder="✍️ Gõ câu trả lời của em vào đây nhé..."></textarea>
                    <button class="check-writing-btn" onclick="checkWritingAnswer(this, ${index})">🔍 Xem Đáp Án & Giải Thích</button>
                </div>
                <div class="explanation" id="exp-${index}">
                    <h4 style="color:#00C9A7;">✅ ĐÁP ÁN GỢI Ý:</h4>
                    <p style="font-weight:bold; font-size:1.15rem; color:#d35400;">${item.ans}</p>
                    <hr style="border:1px dashed #ccc; margin:15px 0;">
                    <h4>💡 PHÂN TÍCH NGỮ PHÁP:</h4>
                    <p>${formattedExp}</p>
                </div>
            `;
        }

        quizContainer.appendChild(card);
    });

    // --- LOGIC TRẮC NGHIỆM ABCD ---
    function checkMCAnswer(btn, selectedKey, correctKey, questionIndex) {
        const card = btn.closest('.question-card');
        if (card.classList.contains('answered')) return;
        card.classList.add('answered');

        const buttons = card.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        const expBox = document.getElementById(`exp-${questionIndex}`);
        
        if (selectedKey === correctKey) {
            btn.classList.add('correct');
            playSound('ding');
            const rect = btn.getBoundingClientRect();
            fireConfetti(rect.left + rect.width / 2, rect.top);
            correctCount++;
        } else {
            btn.classList.add('wrong');
            btn.classList.add('shake');
            playSound('buzz');
            buttons.forEach(b => {
                if(b.innerHTML.includes(`>${correctKey}.<`)) {
                    b.style.border = "3px solid #00D26A";
                    b.style.background = "#E5F9E0";
                }
            });
        }

        expBox.style.display = 'block';
        answeredMCQuestions.add(questionIndex);
    }

    // --- LOGIC TỰ LUẬN (WRITING) ---
    function checkWritingAnswer(btn, questionIndex) {
        playSound('pop');
        const expBox = document.getElementById(`exp-${questionIndex}`);
        expBox.style.display = 'block';
        btn.style.display = 'none'; // Ẩn nút sau khi xem
        
        // Bắn pháo giấy khích lệ tinh thần làm bài tự luận
        const rect = btn.getBoundingClientRect();
        fireConfetti(rect.left + rect.width / 2, rect.top);
    }

    // --- NỘP BÀI TỔNG KẾT ---
    function submitQuiz() {
        if (answeredMCQuestions.size < totalMCQuestions) {
            alert(`Em ơi, vẫn còn ${totalMCQuestions - answeredMCQuestions.size} câu trắc nghiệm chưa làm kìa! Cố lên nhé!`);
            return;
        }

        const percentage = (correctCount / totalMCQuestions) * 100;
        let msg = "";
        
        if (percentage >= 90) msg = "Đỉnh của chóp! Em là cao thủ Tiếng Anh! 🏆✨";
        else if (percentage >= 70) msg = "Tuyệt cú mèo! Em đã nắm bài rất vững! 🌟";
        else if (percentage >= 50) msg = "Khá lắm! Luyện thêm một xíu nữa là hoàn hảo! 💪";
        else msg = "Thua keo này ta bày keo khác! Hãy đọc kỹ giải thích nhé! ❤️";

        document.getElementById('scoreDisplay').innerText = `${correctCount} / ${totalMCQuestions}`;
        document.getElementById('scoreMsg').innerText = msg;
        
        document.getElementById('scorePopup').style.display = 'flex';
        
        if(percentage >= 50) {
            playSound('ding');
            setTimeout(() => fireConfetti(window.innerWidth/2, window.innerHeight/2), 100);
            setTimeout(() => fireConfetti(window.innerWidth/3, window.innerHeight/3), 500);
            setTimeout(() => fireConfetti(window.innerWidth*0.7, window.innerHeight/3), 900);
        }
    }
</script>
