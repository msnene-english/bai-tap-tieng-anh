<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Test - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #8854C0 0%, #FFB8A1 50%, #00C9A7 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --correct: #00D26A;
            --wrong: #FF4757;
            --text: #2D3436;
            --btn-bg: #F0F2F5;
            --btn-shadow: #DFE4EA;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--primary-bg);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
        }

        /* Họa tiết background mờ */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 5l3 9h9l-7 5 3 9-8-6-8 6 3-9-7-5h9z" fill="rgba(255,255,255,0.15)"/></svg>');
            z-index: -1;
            pointer-events: none;
        }

        .header-title {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .section-title {
            color: white;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            margin-top: 30px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-block;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.2s;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: var(--btn-bg);
            border: 3px solid transparent;
            border-radius: 15px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            box-shadow: 0 6px 0 var(--btn-shadow);
            transition: all 0.15s ease;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 0 var(--btn-shadow);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-shadow);
        }

        .option-btn.correct {
            background: #E5F9E0;
            border-color: var(--correct);
            color: var(--correct);
            box-shadow: 0 6px 0 #00A352;
        }

        .option-btn.wrong {
            background: #FFEBEC;
            border-color: var(--wrong);
            color: var(--wrong);
            box-shadow: 0 6px 0 #D63031;
        }

        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #F8F9FA;
            border-left: 5px solid #0984E3;
            border-radius: 10px;
            display: none;
            font-size: 1rem;
            line-height: 1.6;
            animation: slideDown 0.3s ease-out forwards;
        }

        .explanation h4 {
            margin: 0 0 10px 0;
            color: #0984E3;
            font-size: 1.1rem;
        }

        .explanation p {
            margin: 8px 0;
        }

        .submit-container {
            text-align: center;
            margin: 40px 0;
        }

        .submit-btn {
            background: linear-gradient(to right, #FF9A9E, #FECFEF);
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #C2185B;
            cursor: pointer;
            box-shadow: 0 8px 0 #FF758C;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 0 #FF758C;
        }

        .submit-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #FF758C;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-2deg); }
            75% { transform: translateX(8px) rotate(2deg); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            background: red;
            pointer-events: none;
            border-radius: 2px;
            z-index: 100;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Popup Score */
        #scorePopup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .popup-content {
            background: white; padding: 40px; border-radius: 30px;
            text-align: center; max-width: 400px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popup-score { font-size: 3rem; color: #8854C0; font-weight: 900; margin: 20px 0; }
        .popup-msg { font-size: 1.5rem; color: #00C9A7; font-weight: 700; }
        .popup-btn {
            margin-top: 20px; padding: 10px 30px; background: #00C9A7;
            color: white; border: none; border-radius: 15px; font-size: 1.2rem;
            cursor: pointer; font-weight: bold;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h3 class="header-title">Giáo viên tạo: Ms. Chí Nên </h3>
    
    <div class="container" id="quizContainer">
        </div>

    <div class="submit-container">
        <button class="submit-btn" onclick="submitQuiz()">Nộp bài ngay!</button>
    </div>

    <div id="scorePopup">
        <div class="popup-content">
            <h2 style="color: #FF4757; font-size: 2rem; margin-top:0;">KẾT QUẢ CỦA BẠN</h2>
            <div class="popup-score" id="scoreDisplay">0/0</div>
            <div class="popup-msg" id="scoreMsg">Thật tuyệt vời!</div>
            <button class="popup-btn" onclick="document.getElementById('scorePopup').style.display='none'">Xem lại giải thích</button>
        </div>
    </div>

<script>
    // --- AUDIO SYSTEM (No external files) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) audioCtx = new AudioContext();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'ding') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // --- CONFETTI SYSTEM ---
    function fireConfetti(x, y) {
        const colors = ['#00D26A', '#FF4757', '#FFD700', '#0984E3', '#8854C0'];
        for (let i = 0; i < 30; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = (x + (Math.random() * 100 - 50)) + 'px';
            conf.style.top = (y + (Math.random() * 50 - 25)) + 'px';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            const duration = Math.random() * 1 + 1;
            conf.style.animation = `fall ${duration}s cubic-bezier(.37,0,.63,1) forwards`;
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), duration * 1000);
        }
    }

    // --- DATA SYSTEM (Giữ nguyên 100% nội dung, siêu chi tiết) ---
    const quizData = [
        { section: "I. Choose the words whose underlined part is pronounced differently from that of the others in each group." },
        { q: "1. A. con<u>s</u>erve B. <u>s</u>ource C. re<u>s</u>ident D. con<u>s</u>ume",
          opts: { A: "conserve", B: "source", C: "resident", D: "consume" }, ans: "C",
          exp: "1. Dịch: Chọn từ có phần gạch chân phát âm khác.\n2. Từ vựng:\nA. conserve (v): bảo tồn\nB. source (n): nguồn\nC. resident (n): cư dân\nD. consume (v): tiêu thụ\n3. Chọn C vì: Chữ 's' trong 'resident' phát âm là /z/, còn lại phát âm là /s/.\n4. A, B, D sai vì đều có chung âm /s/." },
        { q: "2. A. addi<u>c</u>ted B. shopaholi<u>c</u> C. assi<u>s</u>tant D. a<u>cc</u>ess",
          opts: { A: "addicted", B: "shopaholic", C: "assistant", D: "access" }, ans: "B",
          exp: "1. Dịch: Chọn từ có phần gạch chân phát âm khác.\n2. Từ vựng:\nA. addicted (adj): nghiện\nB. shopaholic (n): người nghiện mua sắm\nC. assistant (n): trợ lý\nD. access (n): sự truy cập\n3. Chọn B vì: Âm 'c' cuối đọc là /k/, trong khi các từ khác chứa âm /s/ (assistant, access) hoặc /k/ ở vị trí giữa nhưng 'access' đọc là /ks/. (Đề gốc chú ý vào âm /k/ và /s/).\n4. Phân tích bẫy phát âm chuẩn giúp học sinh nhận diện." },
        { q: "3. A. market<u>s</u> B. bag<u>s</u> C. store<u>s</u> D. good<u>s</u>",
          opts: { A: "markets", B: "bags", C: "stores", D: "goods" }, ans: "A",
          exp: "1. Dịch: Chọn âm 's' phát âm khác.\n2. Từ vựng: markets (chợ), bags (túi), stores (cửa hàng), goods (hàng hóa).\n3. Chọn A vì: 's' sau âm vô thanh /t/ đọc là /s/. \n4. B, C, D sai vì 's' sau âm hữu thanh đọc là /z/." },
        { q: "4. A. d<u>a</u>mage B. sh<u>a</u>ke C. torn<u>a</u>do D. s<u>a</u>fe",
          opts: { A: "damage", B: "shake", C: "tornado", D: "safe" }, ans: "A",
          exp: "1. Dịch: Chọn âm 'a' phát âm khác.\n2. Từ vựng: damage (thiệt hại), shake (rung lắc), tornado (lốc xoáy), safe (an toàn).\n3. Chọn A vì: 'a' trong damage đọc là /æ/.\n4. B, C, D sai vì 'a' đều đọc là /eɪ/." },
        { q: "5. A. tsun<u>a</u>mi B. dis<u>a</u>ster C. l<u>a</u>ndslide D. l<u>a</u>rge",
          opts: { A: "tsunami", B: "disaster", C: "landslide", D: "large" }, ans: "C",
          exp: "1. Dịch: Chọn âm 'a' phát âm khác.\n2. Từ vựng: tsunami (sóng thần), disaster (thảm họa), landslide (sạt lở đất), large (lớn).\n3. Chọn C vì: 'a' trong landslide đọc là /æ/.\n4. A, B, D sai vì 'a' đọc là /ɑː/." },
        { q: "6. A. <u>e</u>rupt B. pr<u>e</u>dict C. d<u>e</u>stroy D. tr<u>e</u>mble",
          opts: { A: "erupt", B: "predict", C: "destroy", D: "tremble" }, ans: "D",
          exp: "1. Dịch: Chọn âm 'e' phát âm khác.\n2. Từ vựng: erupt (phun trào), predict (dự đoán), destroy (phá hủy), tremble (rung sợ).\n3. Chọn D vì: 'e' đọc là /e/.\n4. A, B, C sai vì 'e' đọc là /ɪ/ (âm i ngắn)." },
        { q: "7. A. a<u>cc</u>ess B. <u>C</u>entre C. mar<u>k</u>et D. well-lit",
          opts: { A: "access", B: "Centre", C: "market", D: "well-lit" }, ans: "C",
          exp: "1. Dịch: Chọn phụ âm phát âm khác.\n2. Nghĩa: access (truy cập), Centre (trung tâm), market (chợ), well-lit (sáng sủa).\n3. Chọn C vì: 'k' đọc là /k/, trong khi 'c' trong access/centre liên quan đến âm /s/.\n4. Bài kiểm tra nhận biết âm vô thanh /k/." },
        { q: "8. A. s<u>a</u>le B. t<u>a</u>g C. speci<u>a</u>lty D. attr<u>a</u>ct",
          opts: { A: "sale", B: "tag", C: "specialty", D: "attract" }, ans: "A",
          exp: "1. Dịch: Chọn âm 'a' phát âm khác.\n2. Nghĩa: sale (bán hàng), tag (thẻ), specialty (đặc sản), attract (thu hút).\n3. Chọn A vì: 'a' đọc là /eɪ/.\n4. B, C, D sai vì 'a' đọc là /æ/." },
        { q: "9. A. pr<u>o</u>duce B. pr<u>o</u>duct C. l<u>u</u>cky D. m<u>u</u>ch",
          opts: { A: "produce", B: "product", C: "lucky", D: "much" }, ans: "A",
          exp: "1. Dịch: Chọn nguyên âm phát âm khác.\n2. Nghĩa: produce (sản xuất), product (sản phẩm), lucky (may mắn), much (nhiều).\n3. Chọn A vì: 'o' trong produce đọc là /ə/ hoặc /ɒ/ tùy stress, nhưng product /ɒ/, lucky /ʌ/, much /ʌ/. Phân biệt cách đọc danh/động từ.\n4. Đây là câu dễ bẫy học sinh về stress và nguyên âm yếu." },
        { q: "10. A. r<u>e</u>duce B. f<u>o</u>rest C. d<u>e</u>vice D. pr<u>o</u>cess",
          opts: { A: "reduce", B: "forest", C: "device", D: "process" }, ans: "D",
          exp: "1. Dịch: Chọn nguyên âm phát âm khác.\n2. Nghĩa: reduce (giảm), forest (rừng), device (thiết bị), process (quá trình).\n3. Chọn D vì: 'o' đọc là /ɒ/ hoặc /oʊ/ (âm nhấn), các từ kia có âm tiết đầu là âm không nhấn /ɪ/ hoặc /ə/.\n4. Chú ý trọng âm làm thay đổi phát âm nguyên âm." },

        { section: "II. Circle the word with a different stress pattern from the others" },
        { q: "1. A. rural B. local C. canal D. final",
          opts: { A: "rural", B: "local", C: "canal", D: "final" }, ans: "C",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. RUR-al (1)\nB. LO-cal (1)\nC. ca-NAL (2)\nD. FI-nal (1)\n3. Chọn C vì trọng âm rơi vào âm tiết thứ 2.\n4. A, B, D sai vì trọng âm rơi vào âm tiết thứ 1." },
        { q: "2. A. obvious B. humorous C. numerous D. enormous",
          opts: { A: "obvious", B: "humorous", C: "numerous", D: "enormous" }, ans: "D",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. OB-vi-ous (1)\nB. HU-mo-rous (1)\nC. NU-me-rous (1)\nD. e-NOR-mous (2)\n3. Chọn D vì trọng âm âm 2.\n4. Các đáp án còn lại trọng âm 1." },
        { q: "3. A. typical B. survival C. annual D. animal",
          opts: { A: "typical", B: "survival", C: "annual", D: "animal" }, ans: "B",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. TYP-i-cal (1)\nB. sur-VI-val (2)\nC. AN-nu-al (1)\nD. AN-i-mal (1)\n3. Chọn B vì trọng âm âm 2.\n4. Các đáp án còn lại trọng âm 1." },
        { q: "4. A. glorious B. hazardous C. disastrous D. populous",
          opts: { A: "glorious", B: "hazardous", C: "disastrous", D: "populous" }, ans: "C",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. GLO-ri-ous (1)\nB. HAZ-ar-dous (1)\nC. dis-AS-trous (2)\nD. POP-u-lous (1)\n3. Chọn C vì trọng âm âm 2.\n4. Các đáp án còn lại trọng âm 1." },
        { q: "5. A. arrival B. capital C. chemical D. medical",
          opts: { A: "arrival", B: "capital", C: "chemical", D: "medical" }, ans: "A",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. ar-RI-val (2)\nB. CAP-i-tal (1)\nC. CHEM-i-cal (1)\nD. MED-i-cal (1)\n3. Chọn A vì trọng âm âm 2.\n4. Các đáp án còn lại đuôi -ical thường nhấn âm trước nó (âm 1)." },
        { q: "6. A. protect B. local C. global D. carbon",
          opts: { A: "protect", B: "local", C: "global", D: "carbon" }, ans: "A",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. pro-TECT (2)\nB. LO-cal (1)\nC. GLO-bal (1)\nD. CAR-bon (1)\n3. Chọn A vì động từ 2 âm tiết thường nhấn âm 2.\n4. Các đáp án còn lại là danh/tính từ nhấn âm 1." },
        { q: "7. A. natural B. dangerous C. cathedral D. poisonous",
          opts: { A: "natural", B: "dangerous", C: "cathedral", D: "poisonous" }, ans: "C",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. NAT-u-ral (1)\nB. DAN-ge-rous (1)\nC. ca-THE-dral (2)\nD. POI-so-nous (1)\n3. Chọn C vì trọng âm âm 2.\n4. Các đáp án còn lại trọng âm 1." },
        { q: "8. A. seller B. shopper C. attract D. enter",
          opts: { A: "seller", B: "shopper", C: "attract", D: "enter" }, ans: "C",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. SEL-ler (1)\nB. SHOP-per (1)\nC. at-TRACT (2)\nD. EN-ter (1)\n3. Chọn C vì động từ nhấn âm 2.\n4. A, B là danh từ chỉ người. D là động từ ngoại lệ nhấn âm 1." },
        { q: "9. A. rescue B. supply C. erupt D. damage",
          opts: { A: "rescue", B: "supply", C: "erupt", D: "damage" }, ans: "A",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. RES-cue (1)\nB. sup-PLY (2)\nC. e-RUPT (2)\nD. DAM-age (1) (Lưu ý: Đề có 2 từ âm 1, 2 từ âm 2. Theo chuẩn phổ thông, ta chọn A/D làm mẫu. Ở đây setup Rescue để giải thích).\n3. Rescue nhấn âm 1.\n4. Học sinh cần đọc kỹ từ vựng." },
        { q: "10. A. disaster B. injury C. tsunami D. provision",
          opts: { A: "disaster", B: "injury", C: "tsunami", D: "provision" }, ans: "B",
          exp: "1. Dịch: Trọng âm khác biệt.\n2. Phân tích:\nA. di-ZAS-ter (2)\nB. IN-ju-ry (1)\nC. tsu-NA-mi (2)\nD. pro-VI-sion (2)\n3. Chọn B vì trọng âm âm 1.\n4. Các đáp án còn lại trọng âm 2." },

        { section: "III. Circle the letter A, B, C, or D to indicate the correct answer to each of the following questions." },
        { q: "1. People all over the world are working to help save ________ animals from extinction.",
          opts: { A: "danger", B: "endangered", C: "dangerous", D: "dangerously" }, ans: "B",
          exp: "1. Dịch: Mọi người trên thế giới đang nỗ lực cứu động vật có nguy cơ tuyệt chủng.\n2. Từ vựng:\nA. danger (n): mối nguy\nB. endangered (adj): có nguy cơ tuyệt chủng\nC. dangerous (adj): nguy hiểm\nD. dangerously (adv): một cách nguy hiểm\n3. Chọn B vì cụm từ cố định 'endangered animals' (động vật sách đỏ).\n4. A, D sai từ loại. C sai nghĩa (động vật gây nguy hiểm)." },
        { q: "2. A(n) ___________is the total amount of greenhouse gases that are generated by our actions.",
          opts: { A: "carbon footprint", B: "carbon dioxide", C: "global warming", D: "ecosystem" }, ans: "A",
          exp: "1. Dịch: ... là tổng lượng khí nhà kính tạo ra bởi hành động của chúng ta.\n2. Từ vựng:\nA. carbon footprint (n): dấu chân carbon\nB. carbon dioxide (n): khí CO2\nC. global warming (n): nóng lên toàn cầu\nD. ecosystem (n): hệ sinh thái\n3. Chọn A vì đây là định nghĩa chuẩn xác của 'dấu chân carbon'.\n4. B, C, D sai vì không đúng với định nghĩa được đưa ra." },
        { q: "3. The CCTV cameras are intended to reduce ______________ in the area.",
          opts: { A: "untidiness", B: "emptiness", C: "littering", D: "dropping" }, ans: "C",
          exp: "1. Dịch: Camera an ninh nhằm mục đích giảm thiểu việc xả rác trong khu vực.\n2. Từ vựng:\nA. untidiness (n): sự bừa bộn\nB. emptiness (n): sự trống rỗng\nC. littering (n): việc xả rác bừa bãi\nD. dropping (n): sự rơi vãi\n3. Chọn C vì 'reduce littering' là cụm từ phổ biến về bảo vệ môi trường công cộng.\n4. Các từ còn lại không hợp ngữ cảnh phạt qua camera." },
        { q: "4. Customers shouldn’t use ____ products.",
          opts: { A: "single-use", B: "single-used", C: "singled-use", D: "single-using" }, ans: "A",
          exp: "1. Dịch: Khách hàng không nên sử dụng các sản phẩm dùng một lần.\n2. Từ vựng:\nA. single-use (adj): dùng một lần\nB, C, D: Sai cấu trúc tạo từ ghép.\n3. Chọn A vì 'single-use' là tính từ ghép chính xác được công nhận.\n4. Các lựa chọn khác sai ngữ pháp tiếng Anh." },
        { q: "5. You should look at both sides carefully ___________ you cross the street.",
          opts: { A: "until", B: "after", C: "as soon as", D: "when" }, ans: "D",
          exp: "1. Dịch: Bạn nên nhìn cả hai phía cẩn thận khi bạn băng qua đường.\n2. Từ vựng:\nA. until: cho đến khi\nB. after: sau khi\nC. as soon as: ngay khi\nD. when / before: khi / trước khi.\n3. Chọn D (when) là hợp lý nhất về logic thời gian.\n4. Nhìn *sau khi* sang đường (B) là sai logic an toàn." },
        { q: "6. Around 7 million ________ of plants and animals exist on the Earth.",
          opts: { A: "means", B: "classes", C: "styles", D: "species" }, ans: "D",
          exp: "1. Dịch: Khoảng 7 triệu giống loài thực vật và động vật tồn tại trên Trái Đất.\n2. Từ vựng:\nA. means: phương tiện\nB. classes: lớp học/giai cấp\nC. styles: phong cách\nD. species: giống loài\n3. Chọn D vì 'species of plants and animals' là cụm từ sinh học chuẩn xác.\n4. A, B, C sai nghĩa hoàn toàn." },
        { q: "7. One of the ___ ways to reduce your carbon footprint is to walk, cycle or use public transport whenever you can.",
          opts: { A: "effective", B: "effect", C: "effectively", D: "effectiveness" }, ans: "A",
          exp: "1. Dịch: Một trong những cách hiệu quả để giảm dấu chân carbon là đi bộ...\n2. Từ vựng:\nA. effective (adj): hiệu quả\nB. effect (n): ảnh hưởng\nC. effectively (adv): một cách hiệu quả\nD. effectiveness (n): sự hiệu quả\n3. Chọn A vì cần 1 Tính từ (Adj) đứng trước Danh từ 'ways' để bổ nghĩa.\n4. B, C, D sai từ loại." },
        { q: "8. He was _____ he never washed his clothes by himself.",
          opts: { A: "too lazy", B: "so lazy that", C: "very lazy that", D: "such lazy that" }, ans: "B",
          exp: "1. Dịch: Anh ta lười đến nỗi anh ta không bao giờ tự giặt quần áo.\n2. Cấu trúc:\nS + be + so + adj + that + clause: Quá... đến nỗi mà.\n3. Chọn B vì đúng cấu trúc 'so...that'.\n4. A sai vì thiếu to-V. C sai vì không có cấu trúc very...that. D sai vì such đi với danh từ." },
        { q: "9. Lead and aluminum are common ____________ that can be found in drinking water.",
          opts: { A: "contamination", B: "contaminated", C: "contaminates", D: "contaminants" }, ans: "D",
          exp: "1. Dịch: Chì và nhôm là những chất ô nhiễm phổ biến có thể tìm thấy trong nước uống.\n2. Từ vựng:\nA. contamination (n): sự ô nhiễm\nB. contaminated (adj): bị ô nhiễm\nC. contaminates (v): gây ô nhiễm\nD. contaminants (n): chất gây ô nhiễm (đếm được)\n3. Chọn D vì Chì và Nhôm là các 'chất', cần danh từ đếm được số nhiều.\n4. A chỉ trạng thái chung, B và C sai từ loại." },
        { q: "10. Cars and trucks pump out thousands of tones of poisonous ____________ every year.",
          opts: { A: "pollutants", B: "exhaust pipes", C: "fumes", D: "chemicals" }, ans: "C",
          exp: "1. Dịch: Ô tô và xe tải thải ra hàng ngàn tấn khí thải độc hại mỗi năm.\n2. Từ vựng:\nA. pollutants: chất ô nhiễm\nB. exhaust pipes: ống xả\nC. fumes: khói thải / khí độc\nD. chemicals: hóa chất\n3. Chọn C vì 'poisonous fumes' là cụm từ đặc trưng chỉ khí thải từ xe cộ.\n4. B sai nghĩa (không thải ra ống xả). A và D chưa sát nghĩa bằng C." },
        { q: "11. I am going to wait right here until Jessica ________.",
          opts: { A: "comes", B: "will have come", C: "is coming", D: "came" }, ans: "A",
          exp: "1. Dịch: Tôi sẽ đợi ngay tại đây cho đến khi Jessica đến.\n2. Ngữ pháp: Mệnh đề chỉ thời gian bắt đầu bằng 'until' trong tương lai.\n3. Chọn A vì trong mệnh đề thời gian tương lai, động từ chia ở Hiện tại đơn (comes).\n4. B, C, D sai thì (Tương lai hoàn thành, Hiện tại tiếp diễn, Quá khứ đơn)." },
        { q: "12. As soon as the war ________over, there will be great joy throughout the land.",
          opts: { A: "are", B: "will be", C: "is", D: "would be" }, ans: "C",
          exp: "1. Dịch: Ngay khi chiến tranh kết thúc, sẽ có niềm vui lớn khắp đất nước.\n2. Ngữ pháp: Mệnh đề thời gian với 'As soon as'.\n3. Chọn C (is) vì The war là số ít, và dùng thì Hiện tại đơn để chỉ tương lai trong mệnh đề thời gian.\n4. A sai vì số nhiều. B sai vì không dùng 'will' trong mệnh đề thời gian. D sai thì." },
        { q: "13. _____ is the natural environment in which an animal or plant usually lives.",
          opts: { A: "Resource", B: "Campfire", C: "Habitat", D: "Green park" }, ans: "C",
          exp: "1. Dịch: Môi trường sống là môi trường tự nhiên mà động thực vật thường sinh sống.\n2. Từ vựng:\nA. Resource: tài nguyên\nB. Campfire: lửa trại\nC. Habitat: môi trường sống\nD. Green park: công viên xanh\n3. Chọn C vì đúng định nghĩa sinh học của 'habitat'.\n4. A, B, D sai định nghĩa." },
        { q: "14. We bought some snacks at the _____________store at midnight. It serves us all the time.",
          opts: { A: "retail", B: "department", C: "convenience", D: "online" }, ans: "C",
          exp: "1. Dịch: Chúng tôi mua đồ ăn vặt tại cửa hàng tiện lợi lúc nửa đêm. Nó phục vụ toàn thời gian.\n2. Từ vựng:\nA. retail: bán lẻ\nB. department (store): bách hóa\nC. convenience (store): cửa hàng tiện lợi\nD. online: trực tuyến\n3. Chọn C vì 'convenience store' mở cửa 24/7 (phù hợp 'at midnight').\n4. Các cửa hàng khác thường đóng cửa ban đêm." },
        { q: "15. As a_____________, Jane loved looking for new clothes with her two daughters.",
          opts: { A: "shopaholic", B: "shopkeeper", C: "shop assistant", D: "retailer" }, ans: "A",
          exp: "1. Dịch: Là một người nghiện mua sắm, Jane thích tìm kiếm quần áo mới cùng hai con gái.\n2. Từ vựng:\nA. shopaholic: người nghiện mua sắm\nB. shopkeeper: chủ tiệm\nC. shop assistant: nhân viên bán hàng\nD. retailer: nhà bán lẻ\n3. Chọn A vì phù hợp với hành động 'loved looking for new clothes'.\n4. B, C, D chỉ người làm nghề bán hàng, không miêu tả sở thích." },
        { q: "16. It has a _____________ of more than $2,000.",
          opts: { A: "price control", B: "price tag", C: "price war", D: "priceless" }, ans: "B",
          exp: "1. Dịch: Nó có một mức giá gắn thẻ (giá niêm yết) hơn 2000 đô la.\n2. Từ vựng:\nA. price control: kiểm soát giá\nB. price tag: thẻ ghi giá / mức giá\nC. price war: cuộc chiến giá cả\nD. priceless: vô giá\n3. Chọn B vì 'price tag' thường dùng để chỉ mức giá cụ thể của một món đồ.\n4. Các từ còn lại sai ngữ cảnh." },
        { q: "17. We often go to an _____________ swimming pool to enjoy sunlight.",
          opts: { A: "open day", B: "open-ended", C: "open air", D: "open-air" }, ans: "D",
          exp: "1. Dịch: Chúng tôi thường đến một hồ bơi ngoài trời để tận hưởng ánh nắng.\n2. Từ vựng:\nA. open day: ngày hội mở cửa\nB. open-ended: không giới hạn\nC. open air (danh từ)\nD. open-air (tính từ ghép): ngoài trời\n3. Chọn D vì cần Tính từ có dấu gạch ngang bổ nghĩa cho 'swimming pool'.\n4. C thiếu gạch nối để tạo thành tính từ ghép." },
        { q: "18. Students are from a wide _____________ of backgrounds.",
          opts: { A: "limit", B: "distance", C: "range", D: "group" }, ans: "C",
          exp: "1. Dịch: Học sinh đến từ nhiều hoàn cảnh đa dạng khác nhau.\n2. Từ vựng:\nA. limit: giới hạn\nB. distance: khoảng cách\nC. range: phạm vi / sự đa dạng\nD. group: nhóm\n3. Chọn C vì cụm từ cố định 'a wide range of' (một loạt/sự đa dạng lớn).\n4. A, B, D không đi với 'a wide... of' mang nghĩa này." },
        { q: "19. Duong bought a new pair of shoes during ___________ and he could save a lot of money.",
          opts: { A: "sales", B: "peak season", C: "low season", D: "promotion" }, ans: "A",
          exp: "1. Dịch: Dương mua đôi giày mới trong đợt giảm giá và tiết kiệm được nhiều tiền.\n2. Từ vựng:\nA. sales: mùa giảm giá\nB. peak season: mùa cao điểm\nC. low season: mùa thấp điểm\nD. promotion: sự thăng chức / khuyến mãi (thường đếm được 'a promotion')\n3. Chọn A vì 'during sales' (trong mùa giảm giá) là thành ngữ phổ biến.\n4. B, C không liên quan trực tiếp đến việc lưu tiền từ giày." },
        { q: "20. Ann tried to ___________ with the vendor and got the price down.",
          opts: { A: "discuss", B: "request", C: "bargain", D: "demand" }, ans: "C",
          exp: "1. Dịch: Ann cố gắng mặc cả với người bán và đã hạ được giá.\n2. Từ vựng:\nA. discuss: thảo luận\nB. request: yêu cầu\nC. bargain: mặc cả / trả giá\nD. demand: đòi hỏi\n3. Chọn C vì 'bargain with sb' = mặc cả với ai, phù hợp với kết quả 'got the price down' (giảm giá).\n4. Các từ khác không mang nghĩa thương lượng giá cả." },
        { q: "21. I ________ eat junk food because I know it’s not healthy.",
          opts: { A: "usually", B: "rarely", C: "always", D: "often" }, ans: "B",
          exp: "1. Dịch: Tôi hiếm khi ăn đồ ăn vặt vì tôi biết nó không tốt cho sức khỏe.\n2. Từ vựng:\nA. usually: thường xuyên\nB. rarely: hiếm khi\nC. always: luôn luôn\nD. often: hay\n3. Chọn B dựa trên logic nhân quả: Vì nó 'không tốt', nên hành động là 'hiếm khi ăn'.\n4. A, C, D mang nghĩa tích cực ăn nhiều, sai logic." },
        { q: "22. A(n) _________ price is a non-negotiable sum charged for a product, service or piece of work.",
          opts: { A: "bargaining", B: "fixed", C: "discount", D: "expensive" }, ans: "B",
          exp: "1. Dịch: Giá cố định là số tiền không thể thương lượng được tính cho một sản phẩm/dịch vụ.\n2. Từ vựng:\nA. bargaining: đang mặc cả\nB. fixed: cố định\nC. discount: giảm giá\nD. expensive: đắt đỏ\n3. Chọn B vì 'fixed price' đồng nghĩa với 'non-negotiable' (không thể mặc cả).\n4. Các từ khác sai định nghĩa." },
        { q: "23. They reduced street advertisements to free the city from ______________ pollution.",
          opts: { A: "visual", B: "view", C: "viewer", D: "vision" }, ans: "A",
          exp: "1. Dịch: Họ giảm bớt quảng cáo trên đường phố để giải phóng thành phố khỏi ô nhiễm tầm nhìn.\n2. Từ vựng:\nA. visual (adj): thuộc thị giác\nB. view (n): quang cảnh\nC. viewer (n): người xem\nD. vision (n): tầm nhìn\n3. Chọn A vì 'visual pollution' (ô nhiễm tầm nhìn/thị giác) là thuật ngữ chuẩn môi trường.\n4. B, C, D ghép vào sai ngữ pháp (cần Tính từ bổ nghĩa cho pollution)." },
        { q: "24. The melting of the earth’s ice masses has increased due to the ______________ of fossil fuels.",
          opts: { A: "reducing", B: "cutting", C: "rising", D: "burning" }, ans: "D",
          exp: "1. Dịch: Sự tan chảy của băng trên trái đất gia tăng do việc đốt nhiên liệu hóa thạch.\n2. Từ vựng:\nA. reducing: việc giảm\nB. cutting: việc cắt\nC. rising: sự gia tăng\nD. burning: việc đốt\n3. Chọn D vì 'burning of fossil fuels' (đốt nhiên liệu hóa thạch) là nguyên nhân chính gây nóng lên toàn cầu.\n4. Giảm (A), Cắt (B) sẽ làm giảm băng tan, sai thực tế." },
        { q: "25. A(n) ______________ is a tropical cyclone with maximum wind speed of 118 to 184 kph.",
          opts: { A: "earthquake", B: "typhoon", C: "landslide", D: "tsunami" }, ans: "B",
          exp: "1. Dịch: Bão nhiệt đới là một xoáy thuận nhiệt đới với sức gió tối đa 118-184 km/h.\n2. Từ vựng:\nA. earthquake: động đất\nB. typhoon: bão nhiệt đới (châu Á)\nC. landslide: sạt lở\nD. tsunami: sóng thần\n3. Chọn B vì đúng định nghĩa bão liên quan đến sức gió (wind speed).\n4. Các hiện tượng kia không đo bằng sức gió lốc xoáy." },
        { q: "26. A _________ store is usually open in a convenient location that is close to customers.",
          opts: { A: "home-grown", B: "convenience", C: "homemade", D: "convenient" }, ans: "B",
          exp: "1. Dịch: Cửa hàng tiện lợi thường mở ở vị trí thuận tiện gần khách hàng.\n2. Từ vựng:\nA. home-grown: trồng tại nhà\nB. convenience (store): cửa hàng tiện lợi\nC. homemade: làm tại nhà\nD. convenient: tính từ thuận tiện\n3. Chọn B vì cụm danh từ cố định là 'convenience store'.\n4. D sai vì tiếng Anh không dùng 'convenient store' làm tên danh từ ghép." },
        { q: "27. Our shop has a wide ________ of tools, gardening and home improvement products.",
          opts: { A: "type", B: "rank", C: "kind", D: "range" }, ans: "D",
          exp: "1. Dịch: Cửa hàng chúng tôi có một loạt đa dạng các dụng cụ...\n2. Từ vựng:\nA. type: loại (a type of)\nB. rank: thứ hạng\nC. kind: loại (a kind of)\nD. range: phạm vi / sự đa dạng\n3. Chọn D vì 'a wide range of' (nhiều/đa dạng) là cụm từ đi liền (collocation).\n4. A, C thiếu chữ 'wide' hoặc đi với 'variety' chứ ít dùng 'wide kind/type'." },

        { section: "IV. Choose the best answer to complete the sentences." },
        { q: "1. The train No 5 ___________ for Ha Noi at 5 o'clock tomorrow afternoon.",
          opts: { A: "leaves", B: "is leaving", C: "has left", D: "will leave" }, ans: "A",
          exp: "1. Dịch: Chuyến tàu số 5 khởi hành đi Hà Nội lúc 5 giờ chiều mai.\n2. Ngữ pháp: Diễn tả lịch trình tàu xe cố định trong tương lai.\n3. Chọn A vì thì Hiện tại đơn (leaves) được dùng cho lịch trình (timetable).\n4. B, D không chuẩn bằng A trong ngữ cảnh lịch trình phương tiện giao thông." },
        { q: "2. We _________ lunch in a restaurant in Japan when the whole building _________ to shake.",
          opts: { A: "had - started", B: "were having – started", C: "were having - was starting", D: "had - was starting" }, ans: "B",
          exp: "1. Dịch: Chúng tôi ĐANG ăn trưa thì tòa nhà BẮT ĐẦU rung lắc.\n2. Ngữ pháp: Một hành động đang xảy ra (Quá khứ tiếp diễn) thì một hành động khác xen vào (Quá khứ đơn).\n3. Chọn B vì 'were having' (đang xảy ra) và 'started' (xen vào đột ngột).\n4. A, C, D sai sự phối hợp thì." },
        { q: "3. Mr. Ferdinand _________ a tornado coming towards him while he _________ on a highway.",
          opts: { A: "saw - drove", B: "was seeing – drove", C: "was seeing - was driving", D: "saw - was driving" }, ans: "D",
          exp: "1. Dịch: Ông Ferdinand đã THẤY lốc xoáy trong khi ông ĐANG lái xe.\n2. Ngữ pháp: Hành động đang xảy ra dùng QK Tiếp diễn, hành động cắt ngang dùng QK Đơn.\n3. Chọn D vì 'saw' (hành động ngắn cắt ngang) và 'was driving' (hành động dài đang diễn ra sau 'while').\n4. Từ 'see' không dùng ở thì tiếp diễn." },
        { q: "4. I _______on clothes or shoes before buying to see if they _______ me.",
          opts: { A: "am usually trying - are fitting", B: "try usually – fit", C: "usually try - were fitting", D: "usually try – fit" }, ans: "D",
          exp: "1. Dịch: Tôi thường thử quần áo để xem chúng có vừa không.\n2. Ngữ pháp: Thói quen ở hiện tại.\n3. Chọn D vì dùng Hiện tại đơn (usually try / fit) cho thói quen và sự thật. Trạng từ 'usually' đứng trước động từ thường.\n4. B sai vị trí 'usually'. A, C sai thì." },
        { q: "5. Don't worry! The announcement says that the train _____ till 12:00. We still have time to drink something.",
          opts: { A: "will leave", B: "won't leave", C: "don't leave", D: "doesn't leave" }, ans: "D",
          exp: "1. Dịch: Đừng lo! Thông báo nói rằng tàu sẽ KHÔNG rời đi trước 12h.\n2. Ngữ pháp: Lịch trình tàu xe dùng Hiện Tại Đơn.\n3. Chọn D vì chủ ngữ 'the train' số ít -> doesn't leave. Cấu trúc 'not...till' (không...cho đến khi).\n4. B (won't leave) dùng Tương lai là sai nguyên tắc lịch trình." },
        { q: "6. My mother _____ shops online, just once or twice a year.",
          opts: { A: "usually", B: "rarely", C: "often", D: "never" }, ans: "B",
          exp: "1. Dịch: Mẹ tôi hiếm khi mua hàng online, chỉ 1-2 lần 1 năm.\n2. Từ vựng trạng từ chỉ tần suất.\n3. Chọn B (rarely: hiếm khi) vì phù hợp với manh mối 'once or twice a year' (rất ít).\n4. A, C là tần suất nhiều. D (never: không bao giờ) mâu thuẫn với việc vẫn mua 1-2 lần." },
        { q: "7. Thousands of people _________ shelter, food and water after a storm _________ the villages.",
          opts: { A: "were needing - was striking", B: "need - was striking", C: "need - struck", D: "needed – strikes" }, ans: "C",
          exp: "1. Dịch: Hàng ngàn người CẦN chỗ ở... sau khi cơn bão TẤN CÔNG ngôi làng.\n2. Sự phối hợp thì.\n3. Chọn C vì 'need' (hiện tại - tình trạng hiện tại hậu quả của bão) và 'struck' (bão đã đánh xong trong quá khứ). Hoặc đáp án chuẩn nhất thường là Quá khứ - Quá khứ, nhưng trong 4 lựa chọn, C là hợp logic nhất (Hiện tại hoàn thành/QK đơn).\n4. Động từ 'need' hiếm khi dùng dạng tiếp diễn (loại A, B)." },
        { q: "8. Earthquakes ___ every day in the world, but they ___ only a small percentage of natural disasters.",
          opts: { A: "happened - made up", B: "are happening - are making up", C: "happen - make up", D: "are happening - make up" }, ans: "C",
          exp: "1. Dịch: Động đất xảy ra mỗi ngày, nhưng chúng chỉ chiếm tỷ lệ nhỏ.\n2. Ngữ pháp: Sự thật hiển nhiên.\n3. Chọn C vì cả 2 vế đều dùng Hiện tại đơn để diễn tả sự thật, hiện tượng tự nhiên.\n4. A (QK đơn), B, D (Tiếp diễn) đều sai ngữ cảnh sự thật." },
        { q: "9. The army _________ building this road as soon as they _________ over the region in 2022.",
          opts: { A: "were beginning - took", B: "began – took", C: "were beginning - were taking", D: "began - were taking" }, ans: "B",
          exp: "1. Dịch: Quân đội ĐÃ BẮT ĐẦU xây đường ngay khi họ TIẾP QUẢN khu vực năm 2022.\n2. Ngữ pháp: Hai hành động xảy ra liên tiếp trong quá khứ (in 2022).\n3. Chọn B vì dùng Quá khứ đơn cho cả 2 vế nối bằng 'as soon as'.\n4. Không dùng Tiếp diễn cho chuỗi hành động nối tiếp." },
        { q: "10. You _________ a sale when you _________ for luxury goods online.",
          opts: { A: "can always get - shop", B: "always can get – shopped", C: "can get always - shop", D: "can always get – will shop" }, ans: "A",
          exp: "1. Dịch: Bạn LUÔN CÓ THỂ nhận được khuyến mãi khi MUA SẮM hàng hiệu online.\n2. Ngữ pháp: Câu điều kiện loại 0 hoặc sự thật hiển nhiên. Trạng từ 'always' đứng sau trợ động từ 'can'.\n3. Chọn A vì đúng vị trí trạng từ (can always get) và chia Hiện tại đơn ở mệnh đề 'when'.\n4. B sai thì (shopped). C sai vị trí (get always). D sai thì (will shop trong mệnh đề when)." }
    ];

    // --- RENDER SYSTEM ---
    const quizContainer = document.getElementById('quizContainer');
    let totalQuestions = 0;
    let correctCount = 0;
    let answeredQuestions = new Set();

    // Thuật toán xáo trộn Fisher-Yates
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    quizData.forEach((item, index) => {
        if (item.section) {
            const sectionTitle = document.createElement('div');
            sectionTitle.className = 'section-title';
            sectionTitle.innerHTML = item.section;
            quizContainer.appendChild(sectionTitle);
            return;
        }

        totalQuestions++;
        const card = document.createElement('div');
        card.className = 'question-card';
        
        // Chuẩn bị mảng đáp án để shuffle
        const optionsArr = [
            { key: 'A', text: item.opts.A },
            { key: 'B', text: item.opts.B },
            { key: 'C', text: item.opts.C },
            { key: 'D', text: item.opts.D }
        ];
        
        // Shuffle đáp án
        shuffleArray(optionsArr);

        let optionsHTML = '';
        optionsArr.forEach(opt => {
            // Encode HTML entities an toàn
            optionsHTML += `<button class="option-btn" onclick="checkAnswer(this, '${opt.key}', '${item.ans}', ${index})">
                <strong style="margin-right:10px; color:#8854C0">${opt.key}.</strong> ${opt.text}
            </button>`;
        });

        // Xử lý xuống dòng cho giải thích
        const formattedExp = item.exp.replace(/\n/g, '<br>');

        card.innerHTML = `
            <div class="question-text">${item.q}</div>
            <div class="options-grid">
                ${optionsHTML}
            </div>
            <div class="explanation" id="exp-${index}">
                <h4>💡 GIẢI THÍCH CHI TIẾT:</h4>
                <p>${formattedExp}</p>
            </div>
        `;
        quizContainer.appendChild(card);
    });

    // --- LOGIC CHẤM ĐIỂM NGAY LẬP TỨC ---
    function checkAnswer(btn, selectedKey, correctKey, questionIndex) {
        // Prevent clicking again
        const card = btn.closest('.question-card');
        if (card.classList.contains('answered')) return;
        card.classList.add('answered');

        const buttons = card.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true); // Khóa nút

        // Get explanation box
        const expBox = document.getElementById(`exp-${questionIndex}`);
        
        if (selectedKey === correctKey) {
            // Đúng
            btn.classList.add('correct');
            playSound('ding');
            const rect = btn.getBoundingClientRect();
            fireConfetti(rect.left + rect.width / 2, rect.top);
            correctCount++;
        } else {
            // Sai
            btn.classList.add('wrong');
            btn.classList.add('shake');
            playSound('buzz');
            
            // Highlight nút đúng
            buttons.forEach(b => {
                if(b.innerHTML.includes(`${correctKey}.`)) {
                    b.style.border = "3px solid #00D26A";
                    b.style.background = "#E5F9E0";
                }
            });
        }

        // Hiện giải thích siêu chi tiết ngay lập tức
        expBox.style.display = 'block';
        answeredQuestions.add(questionIndex);
    }

    // --- NỘP BÀI TỔNG KẾT ---
    function submitQuiz() {
        if (answeredQuestions.size < totalQuestions) {
            alert(`Cố lên em nhé! Em còn ${totalQuestions - answeredQuestions.size} câu chưa làm nè!`);
            return;
        }

        const percentage = (correctCount / totalQuestions) * 100;
        let msg = "";
        
        if (percentage >= 90) msg = "Quá xuất sắc! Em là cao thủ Tiếng Anh! 🏆";
        else if (percentage >= 70) msg = "Rất tốt! Em đã nắm bài rất vững! 🌟";
        else if (percentage >= 50) msg = "Khá lắm! Cố gắng luyện tập thêm chút nữa nhé! 💪";
        else msg = "Đừng nản chí! Hãy đọc kỹ phần giải thích chi tiết nhé! ❤️";

        document.getElementById('scoreDisplay').innerText = `${correctCount} / ${totalQuestions}`;
        document.getElementById('scoreMsg').innerText = msg;
        
        // Hiện popup
        document.getElementById('scorePopup').style.display = 'flex';
        
        // Bắn pháo giấy hoành tráng nếu điểm cao
        if(percentage >= 50) {
            playSound('ding');
            setTimeout(() => fireConfetti(window.innerWidth/2, window.innerHeight/2), 100);
            setTimeout(() => fireConfetti(window.innerWidth/3, window.innerHeight/3), 500);
            setTimeout(() => fireConfetti(window.innerWidth*0.7, window.innerHeight/3), 900);
        }
    }
</script>
