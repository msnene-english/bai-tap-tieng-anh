<!DOCTYPE html>

<html lang="vi">

<head>

 <meta charset="UTF-8">

 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Bài Tập Quá Khứ Tiếp Diễn - Ms. Chí Nên</title>

 <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

 <style>

 :root {

 --primary: #8854C0; /* Hồng tím pastel */

 --secondary: #00C9A7; /* Xanh ngọc */

 --correct: #00D26A; /* Xanh lá */

 --wrong: #FF4757; /* Đỏ cam */

 --bg-pattern: radial-gradient(#e9e9e9 1px, transparent 1px);

 }



 body {

 font-family: 'Nunito', sans-serif;

 background-color: #f0f3f5;

 background-image: var(--bg-pattern);

 background-size: 20px 20px;

 margin: 0;

 padding: 20px;

 display: flex;

 justify-content: center;

 min-height: 100vh;

 color: #333;

 }



 .container {

 width: 100%;

 max-width: 800px;

 background: white;

 border-radius: 20px;

 box-shadow: 0 10px 25px rgba(136, 84, 192, 0.2);

 padding: 30px;

 position: relative;

 overflow: hidden;

 border: 4px solid var(--primary);

 }



 /* Header */

 .header {

 text-align: center;

 margin-bottom: 20px;

 border-bottom: 2px dashed #ddd;

 padding-bottom: 10px;

 }



 .header h4 {

 color: var(--primary);

 margin: 0;

 font-weight: 800;

 text-transform: uppercase;

 letter-spacing: 1px;

 font-size: 1.2rem;

 }



 .progress-bar {

 background: #eee;

 height: 10px;

 border-radius: 5px;

 margin-top: 10px;

 overflow: hidden;

 }



 .progress-fill {

 height: 100%;

 background: var(--secondary);

 width: 0%;

 transition: width 0.3s ease;

 }



 /* Question */

 .question-box {

 font-size: 1.3rem;

 font-weight: 700;

 text-align: center;

 margin: 20px 0 30px;

 color: #2c3e50;

 }



 /* Options */

 .options-grid {

 display: grid;

 grid-template-columns: 1fr 1fr;

 gap: 15px;

 }



 @media (max-width: 600px) {

 .options-grid {

 grid-template-columns: 1fr;

 }

 }



 .option-btn {

 background: white;

 border: 2px solid #eee;

 border-radius: 15px;

 padding: 15px;

 font-size: 1.1rem;

 font-family: 'Nunito', sans-serif;

 font-weight: 600;

 cursor: pointer;

 transition: all 0.2s;

 box-shadow: 0 4px 0 #ddd; /* 3D effect */

 position: relative;

 text-align: left;

 }



 .option-btn:hover:not(:disabled) {

 transform: scale(1.02);

 border-color: var(--secondary);

 }



 .option-btn:active:not(:disabled) {

 transform: translateY(4px);

 box-shadow: none;

 }



 .option-btn.correct {

 background-color: var(--correct);

 color: white;

 border-color: var(--correct);

 box-shadow: 0 4px 0 #009e4d;

 }



 .option-btn.wrong {

 background-color: var(--wrong);

 color: white;

 border-color: var(--wrong);

 box-shadow: 0 4px 0 #c22a38;

 animation: shake 0.5s;

 }



 /* Explanation */

 .explanation-box {

 margin-top: 25px;

 background: #f8f9fa;

 border-radius: 15px;

 border-left: 5px solid var(--primary);

 padding: 20px;

 display: none; /* Hidden by default */

 animation: slideDown 0.4s ease;

 }



 .exp-header {

 font-weight: 800;

 color: var(--primary);

 margin-bottom: 10px;

 display: flex;

 align-items: center;

 }



 .exp-header::before {

 content: '💡';

 margin-right: 8px;

 font-size: 1.5rem;

 }



 .exp-content p {

 margin: 8px 0;

 line-height: 1.6;

 }



 .vocab-list {

 margin-top: 10px;

 background: white;

 padding: 10px;

 border-radius: 10px;

 border: 1px solid #eee;

 }



 .vocab-item {

 display: flex;

 justify-content: space-between;

 border-bottom: 1px dashed #eee;

 padding: 5px 0;

 }

 

 .vocab-item:last-child { border-bottom: none; }

 .vocab-word { font-weight: 700; color: #333; }

 .vocab-type { font-style: italic; color: #888; font-size: 0.9rem; }

 .vocab-mean { color: var(--secondary); font-weight: 600; }



 .why-correct { color: var(--correct); font-weight: bold; }

 .why-wrong { color: var(--wrong); }



 /* Next Button */

 .next-btn {

 display: none;

 width: 100%;

 margin-top: 20px;

 padding: 15px;

 border: none;

 border-radius: 15px;

 background: var(--primary);

 color: white;

 font-size: 1.2rem;

 font-weight: 800;

 cursor: pointer;

 box-shadow: 0 5px 0 #6c429c;

 transition: transform 0.2s;

 }



 .next-btn:hover {

 transform: translateY(-2px);

 }



 .next-btn:active {

 transform: translateY(3px);

 box-shadow: none;

 }



 /* Animations */

 @keyframes shake {

 0% { transform: translateX(0); }

 25% { transform: translateX(-10px); }

 50% { transform: translateX(10px); }

 75% { transform: translateX(-10px); }

 100% { transform: translateX(0); }

 }



 @keyframes slideDown {

 from { opacity: 0; transform: translateY(-10px); }

 to { opacity: 1; transform: translateY(0); }

 }



 /* Result Popup */

 .popup-overlay {

 position: fixed;

 top: 0; left: 0;

 width: 100%; height: 100%;

 background: rgba(0,0,0,0.7);

 display: none;

 justify-content: center;

 align-items: center;

 z-index: 1000;

 }



 .popup-content {

 background: white;

 padding: 40px;

 border-radius: 25px;

 text-align: center;

 width: 90%;

 max-width: 400px;

 animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);

 }



 .score-circle {

 width: 120px;

 height: 120px;

 background: var(--secondary);

 border-radius: 50%;

 display: flex;

 justify-content: center;

 align-items: center;

 margin: 0 auto 20px;

 color: white;

 font-size: 2.5rem;

 font-weight: 800;

 border: 5px solid white;

 box-shadow: 0 0 0 5px var(--secondary);

 }



 @keyframes zoomIn {

 from { transform: scale(0); opacity: 0; }

 to { transform: scale(1); opacity: 1; }

 }



 /* Canvas for Confetti */

 #confetti {

 position: fixed;

 top: 0;

 left: 0;

 width: 100%;

 height: 100%;

 pointer-events: none;

 z-index: 999;

 }

 </style>

</head>

<body>



 <canvas id="confetti"></canvas>



 <div class="container">

 <div class="header">

 <h4>Giáo viên tạo: Ms. Chí Nên</h4>

 <div style="display: flex; justify-content: space-between; margin-top: 10px; font-weight: bold; color: #666;">

 <span id="q-number">Câu 1/30</span>

 <span id="score-display">Điểm: 0</span>

 </div>

 <div class="progress-bar">

 <div class="progress-fill" id="progress"></div>

 </div>

 </div>



 <div id="quiz-area">

 <div class="question-box" id="question-text">

 </div>



 <div class="options-grid" id="options-area">

 </div>



 <div class="explanation-box" id="explanation">

 <div class="exp-header">Cô Chí Nên giải thích chi tiết:</div>

 <div class="exp-content" id="exp-content">

 </div>

 </div>



 <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➜</button>

 <button class="next-btn" id="finish-btn" onclick="showResult()" style="display:none; background-color: #FF4757;">Nộp bài & Xem điểm</button>

 </div>

 </div>



 <div class="popup-overlay" id="result-popup">

 <div class="popup-content">

 <div class="score-circle" id="final-score">10/10</div>

 <h2 style="color: var(--primary);">Chúc mừng!</h2>

 <p id="feedback-msg" style="font-size: 1.1rem; color: #555;">Bạn đã làm rất tốt!</p>

 <button onclick="location.reload()" class="next-btn" style="display: block; margin-top: 20px;">Làm lại bài</button>

 </div>

 </div>



 <script>

 // --- DATA BÀI TẬP (30 Câu - Generated based on provided theory) ---

 const rawQuestions = [

 {

 q: "At 7 p.m yesterday, I ______ dinner with my family.",

 opts: ["cooked", "was cooking", "cook", "am cooking"],

 correct: 1, // B

 trans: "Vào lúc 7 giờ tối hôm qua, tôi đang nấu bữa tối cùng gia đình.",

 vocab: [

 {w: "cook", t: "v", m: "nấu ăn"},

 {w: "dinner", t: "n", m: "bữa tối"}

 ],

 why: "Có mốc thời gian cụ thể trong quá khứ 'At 7 p.m yesterday' nên dùng thì Quá khứ tiếp diễn (S + was/were + V-ing).",

 wrong: "A là quá khứ đơn (dùng cho hđ đã xong). C là hiện tại đơn. D là hiện tại tiếp diễn."

 },

 {

 q: "They ______ badminton when I came yesterday.",

 opts: ["played", "are playing", "were playing", "play"],

 correct: 2, // C

 trans: "Họ đang chơi cầu lông khi tôi đến ngày hôm qua.",

 vocab: [

 {w: "badminton", t: "n", m: "cầu lông"},

 {w: "come/came", t: "v", m: "đến"}

 ],

 why: "Hành động 'chơi cầu lông' đang xảy ra (QKTD) thì hành động 'tôi đến' xen vào (QKĐ). Cấu trúc: S + were + V-ing.",

 wrong: "A dùng cho hành động ngắn. B là hiện tại. D là hiện tại đơn."

 },

 {

 q: "He ______ working when his boss came yesterday.",

 opts: ["weren't", "isn't", "wasn't", "didn't"],

 correct: 2, // C

 trans: "Anh ấy đang không làm việc khi ông chủ của anh ấy đến hôm qua.",

 vocab: [

 {w: "boss", t: "n", m: "ông chủ"},

 {w: "work", t: "v", m: "làm việc"}

 ],

 why: "Chủ ngữ 'He' số ít -> đi với 'was'. Câu phủ định -> 'wasn't'. Đây là hành động đang diễn ra bị xen vào.",

 wrong: "A dùng cho số nhiều. B là hiện tại. D là trợ động từ quá khứ đơn (không đi với V-ing)."

 },

 {

 q: "______ your mother going to the market at 7 a.m yesterday?",

 opts: ["Did", "Was", "Is", "Were"],

 correct: 1, // B

 trans: "Mẹ bạn đang đi chợ lúc 7 giờ sáng hôm qua phải không?",

 vocab: [

 {w: "market", t: "n", m: "chợ"},

 {w: "go", t: "v", m: "đi"}

 ],

 why: "Câu hỏi QKTD với chủ ngữ 'your mother' (số ít) -> Đảo 'Was' lên đầu.",

 wrong: "A dùng cho QKĐ. C dùng cho HTTD. D dùng cho chủ ngữ số nhiều."

 },

 {

 q: "At 12 o’clock yesterday, we ______ lunch.",

 opts: ["had", "are having", "were having", "have"],

 correct: 2, // C

 trans: "Vào lúc 12 giờ trưa hôm qua, chúng tôi đang ăn trưa.",

 vocab: [

 {w: "have lunch", t: "collocation", m: "ăn trưa"}

 ],

 why: "Mốc thời gian cụ thể 'At 12 o’clock yesterday' -> Quá khứ tiếp diễn. Chủ ngữ 'We' -> were having.",

 wrong: "A là quá khứ đơn. B là hiện tại. D là nguyên thể."

 },

 {

 q: "I ______ TV when he phoned me.",

 opts: ["watched", "was watching", "am watching", "watch"],

 correct: 1, // B

 trans: "Tôi đang xem TV thì anh ấy gọi điện cho tôi.",

 vocab: [

 {w: "phone", t: "v", m: "gọi điện"},

 {w: "watch", t: "v", m: "xem"}

 ],

 why: "Hành động đang xem TV là hành động dài (đang xảy ra) -> Was watching.",

 wrong: "A là hành động ngắn. C sai thì. D sai thì."

 },

 {

 q: "While Ellen ______ reading, Tim ______ watching television.",

 opts: ["was / was", "were / was", "was / were", "is / is"],

 correct: 0, // A

 trans: "Trong khi Ellen đang đọc sách thì Tim đang xem TV.",

 vocab: [

 {w: "while", t: "conj", m: "trong khi"},

 {w: "read", t: "v", m: "đọc"}

 ],

 why: "Hai hành động xảy ra song song trong quá khứ -> Cả 2 đều chia QKTD. Ellen (số ít) -> was, Tim (số ít) -> was.",

 wrong: "B, C sai ngôi. D sai thì (hiện tại)."

 },

 {

 q: "While we ______ to the park, it started to rain.",

 opts: ["go", "went", "were going", "are going"],

 correct: 2, // C

 trans: "Trong khi chúng tôi đang đi đến công viên, trời bắt đầu mưa.",

 vocab: [

 {w: "park", t: "n", m: "công viên"},

 {w: "start", t: "v", m: "bắt đầu"}

 ],

 why: "Sau 'While' thường là QKTD diễn tả hành động đang xảy ra (đang đi). 'We' -> were going.",

 wrong: "A, D sai thì. B là QKĐ (hành động ngắn/đã xong)."

 },

 {

 q: "What ______ you doing at this time yesterday?",

 opts: ["are", "did", "were", "do"],

 correct: 2, // C

 trans: "Bạn đang làm gì vào thời điểm này ngày hôm qua?",

 vocab: [

 {w: "at this time", t: "adv", m: "vào thời điểm này"}

 ],

 why: "Dấu hiệu 'at this time yesterday' -> QKTD. Chủ ngữ 'you' -> Were.",

 wrong: "A là hiện tại. B là trợ động từ QKĐ. D là trợ động từ HTĐ."

 },

 {

 q: "She ______ her homework at 8 o’clock last night.",

 opts: ["did", "was doing", "does", "is doing"],

 correct: 1, // B

 trans: "Cô ấy đang làm bài tập về nhà lúc 8 giờ tối qua.",

 vocab: [

 {w: "homework", t: "n", m: "bài tập về nhà"}

 ],

 why: "Giờ + quá khứ (8 o'clock last night) -> QKTD. She -> was doing.",

 wrong: "A là QKĐ. C, D là thì hiện tại."

 },

 {

 q: "It ______ heavily while I was sleeping.",

 opts: ["rained", "was raining", "rains", "is raining"],

 correct: 1, // B

 trans: "Trời đang mưa to trong khi tôi đang ngủ.",

 vocab: [

 {w: "heavily", t: "adv", m: "nặng hạt/to"},

 {w: "sleep", t: "v", m: "ngủ"}

 ],

 why: "Hai hành động song song: Mưa và Ngủ đều đang diễn ra. Hoặc nhấn mạnh quá trình mưa trong lúc ngủ.",

 wrong: "A là QKĐ (nhấn mạnh kết quả hơn quá trình). C, D sai thì."

 },

 {

 q: "When the teacher came in, the students ______ noise.",

 opts: ["make", "made", "are making", "were making"],

 correct: 3, // D

 trans: "Khi giáo viên bước vào, các học sinh đang làm ồn.",

 vocab: [

 {w: "noise", t: "n", m: "tiếng ồn"},

 {w: "come in", t: "v", m: "bước vào"}

 ],

 why: "Hành động 'làm ồn' đang diễn ra thì giáo viên 'bước vào' (xen ngang). Students (số nhiều) -> were making.",

 wrong: "A, C sai thì. B là QKĐ (nghĩa là giáo viên vào rồi mới làm ồn - sai ngữ cảnh)."

 },

 {

 q: "Some people fell off the road while they ______ motorbikes.",

 opts: ["ride", "rode", "were riding", "are riding"],

 correct: 2, // C

 trans: "Một vài người ngã xuống đường khi họ đang lái xe máy.",

 vocab: [

 {w: "fall off", t: "v", m: "ngã khỏi"},

 {w: "ride", t: "v", m: "lái (xe máy/ngựa)"}

 ],

 why: "Hành động 'ngã' (fell - QKĐ) xen vào hành động 'đang lái xe' (QKTD). They -> were riding.",

 wrong: "A, D sai thì. B là QKĐ."

 },

 {

 q: "While my father was reading news, my mother ______ dinner.",

 opts: ["cooked", "was cooking", "cooks", "is cooking"],

 correct: 1, // B

 trans: "Trong khi bố tôi đang đọc tin tức, mẹ tôi đang nấu bữa tối.",

 vocab: [

 {w: "news", t: "n", m: "tin tức"}

 ],

 why: "Hai hành động song song (Parallel actions) dùng While. Cả hai đều chia QKTD.",

 wrong: "A ngắt quãng sự song song. C, D sai thì."

 },

 {

 q: "______ they staying with you when I called you yesterday?",

 opts: ["Did", "Do", "Were", "Are"],

 correct: 2, // C

 trans: "Họ có đang ở cùng bạn khi tôi gọi hôm qua không?",

 vocab: [

 {w: "stay with", t: "v", m: "ở cùng"}

 ],

 why: "Câu hỏi QKTD: Were + S + V-ing? Chủ ngữ 'they' -> Were.",

 wrong: "A dùng cho QKĐ (Did + V-inf). B, D sai thì."

 },

 {

 q: "Just as I ______ the street, the traffic light turned red.",

 opts: ["crossed", "was crossing", "am crossing", "cross"],

 correct: 1, // B

 trans: "Ngay khi tôi đang băng qua đường, đèn giao thông chuyển sang màu đỏ.",

 vocab: [

 {w: "cross", t: "v", m: "băng qua"},

 {w: "traffic light", t: "n", m: "đèn giao thông"}

 ],

 why: "Hành động 'băng qua đường' đang xảy ra (WAS CROSSING) thì đèn chuyển đỏ.",

 wrong: "A là hành động ngắn. C, D sai thì."

 },

 {

 q: "Who ______ you talking to on the phone at 9 pm last night?",

 opts: ["did", "are", "were", "was"],

 correct: 2, // C

 trans: "Bạn đang nói chuyện với ai trên điện thoại lúc 9 giờ tối qua?",

 vocab: [

 {w: "talk to", t: "v", m: "nói chuyện với"}

 ],

 why: "Câu hỏi Wh-question thì QKTD. Chủ ngữ 'you' -> Were.",

 wrong: "A đi với V-nguyên thể. B sai thì. D dùng cho số ít."

 },

 {

 q: "My computer ______ down while I was working.",

 opts: ["broke", "was breaking", "breaks", "is breaking"],

 correct: 0, // A

 trans: "Máy tính của tôi bị hỏng trong khi tôi đang làm việc.",

 vocab: [

 {w: "break down", t: "v", m: "hỏng hóc"},

 {w: "working", t: "v", m: "làm việc"}

 ],

 why: "Hành động 'hỏng' (broke) xảy ra đột ngột, cắt ngang hành động 'đang làm việc'. Dùng QKĐ.",

 wrong: "B sai vì hỏng là hđ tức thì, không kéo dài. C, D sai thì."

 },

 {

 q: "She ______ constantly ______ in class in those days.",

 opts: ["was / talking", "is / talking", "did / talk", "talked / null"],

 correct: 0, // A

 trans: "Hồi đó cô ấy cứ nói chuyện liên tục trong lớp.",

 vocab: [

 {w: "constantly", t: "adv", m: "liên tục/thường xuyên"},

 {w: "in those days", t: "adv", m: "trong những ngày đó (quá khứ)"}

 ],

 why: "QKTD + always/constantly diễn tả sự phàn nàn trong quá khứ.",

 wrong: "B là hiện tại. C, D không mang sắc thái phàn nàn rõ rệt như QKTD."

 },

 {

 q: "The children ______ hide and seek in the garden at 4 pm.",

 opts: ["played", "were playing", "play", "are playing"],

 correct: 1, // B

 trans: "Bọn trẻ đang chơi trốn tìm trong vườn lúc 4 giờ chiều.",

 vocab: [

 {w: "hide and seek", t: "n", m: "trò trốn tìm"}

 ],

 why: "Thời điểm cụ thể trong quá khứ -> QKTD. Children (số nhiều) -> were playing.",

 wrong: "A là QKĐ. C, D sai thì."

 },

 {

 q: "What was she doing when you ______ her?",

 opts: ["see", "saw", "was seeing", "seen"],

 correct: 1, // B

 trans: "Cô ấy đang làm gì khi bạn nhìn thấy cô ấy?",

 vocab: [

 {w: "see", t: "v", m: "nhìn thấy"}

 ],

 why: "Mệnh đề sau 'When' (hành động xen vào) chia Quá khứ đơn -> Saw.",

 wrong: "A là HTĐ. C sai vì 'see' là động từ tri giác, ít dùng tiếp diễn, và đây là hành động ngắn. D là V3."

 },

 {

 q: "While I ______ for the bus, I saw a car accident.",

 opts: ["waited", "was waiting", "am waiting", "wait"],

 correct: 1, // B

 trans: "Trong khi tôi đang đợi xe buýt, tôi nhìn thấy một vụ tai nạn xe hơi.",

 vocab: [

 {w: "wait for", t: "v", m: "chờ đợi"},

 {w: "accident", t: "n", m: "tai nạn"}

 ],

 why: "Sau While là hành động đang diễn ra (đang đợi) -> QKTD: was waiting.",

 wrong: "A là hành động ngắn. C, D sai thì."

 },

 {

 q: "He ______ a shower when the phone rang.",

 opts: ["had", "has", "was having", "is having"],

 correct: 2, // C

 trans: "Anh ấy đang tắm thì điện thoại reo.",

 vocab: [

 {w: "have a shower", t: "v", m: "đi tắm"},

 {w: "ring/rang", t: "v", m: "reo (chuông)"}

 ],

 why: "Hành động 'tắm' là hành động dài -> Was having. Hành động 'reo' xen vào.",

 wrong: "A là QKĐ. B, D sai thì."

 },

 {

 q: "We ______ English at this time last week.",

 opts: ["learnt", "were learning", "learn", "are learning"],

 correct: 1, // B

 trans: "Chúng tôi đang học tiếng Anh vào giờ này tuần trước.",

 vocab: [

 {w: "learn", t: "v", m: "học"}

 ],

 // --- Âm thanh (Base64 để chạy Single File) ---

 const soundCorrect = new Audio("data:audio/mp3;base64,//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"); 

 // (Lưu ý: Để tối ưu, tôi dùng placeholder base64 ngắn. Thực tế nên dùng link mp3 ngoài hoặc base64 full nếu muốn file hoạt động độc lập hoàn toàn. Ở đây tôi sẽ dùng logic JS tạo âm thanh đơn giản bằng Web Audio API để không cần file ngoài)



 const audioCtx = new (window.AudioContext || window.webkitAudioContext)();



 function playTone(freq, type, duration) {

 const osc = audioCtx.createOscillator();

 const gain = audioCtx.createGain();

 osc.type = type;

 osc.frequency.value = freq;

 osc.connect(gain);

 gain.connect(audioCtx.destination);

 osc.start();

 gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);

 osc.stop(audioCtx.currentTime + duration);

 }



 function playCorrectSound() {

 playTone(600, 'sine', 0.1);

 setTimeout(() => playTone(800, 'sine', 0.2), 100);

 }



 function playWrongSound() {

 playTone(150, 'sawtooth', 0.3);

 setTimeout(() => playTone(100, 'sawtooth', 0.3), 150);

 }



 // --- Logic Game ---

 let currentQ = 0;

 let score = 0;

 let shuffledQuestions = [];



 function shuffleArray(array) {

 for (let i = array.length - 1; i > 0; i--) {

 const j = Math.floor(Math.random() * (i + 1));

 [array[i], array[j]] = [array[j], array[i]];

 }

 return array;

 }



 function initGame() {

 shuffledQuestions = shuffleArray([...rawQuestions]);

 currentQ = 0;

 score = 0;

 document.getElementById('progress').style.width = '0%';

 document.getElementById('finish-btn').style.display = 'none';

 document.getElementById('next-btn').style.display = 'block';

 loadQuestion();

 }



 function loadQuestion() {

 if (currentQ >= shuffledQuestions.length) {

 // End game logic handled in nextQuestion

 return;

 }



 const qData = shuffledQuestions[currentQ];

 document.getElementById('q-number').innerText = `Câu ${currentQ + 1}/${shuffledQuestions.length}`;

 document.getElementById('question-text').innerText = qData.q;

 document.getElementById('explanation').style.display = 'none';

 document.getElementById('next-btn').style.display = 'none';



 // Reset options

 const optsDiv = document.getElementById('options-area');

 optsDiv.innerHTML = '';



 qData.opts.forEach((opt, index) => {

 const btn = document.createElement('button');

 btn.className = 'option-btn';

 btn.innerHTML = `<span style="font-weight:800; color:var(--primary)">${String.fromCharCode(65 + index)}.</span> ${opt}`;

 btn.onclick = () => checkAnswer(index, btn, qData);

 optsDiv.appendChild(btn);

 });



 // Update Progress

 const progressPercent = ((currentQ) / shuffledQuestions.length) * 100;

 document.getElementById('progress').style.width = `${progressPercent}%`;

 }



 function checkAnswer(selectedIndex, btn, qData) {

 // Disable all buttons

 const buttons = document.querySelectorAll('.option-btn');

 buttons.forEach(b => b.disabled = true);



 if (selectedIndex === qData.correct) {

 // Correct

 btn.classList.add('correct');

 playCorrectSound();

 score++;

 document.getElementById('score-display').innerText = `Điểm: ${score}`;

 fireConfetti();

 } else {

 // Wrong

 btn.classList.add('wrong');

 playWrongSound();

 // Highlight correct one

 buttons[qData.correct].classList.add('correct');

 }



 showExplanation(qData);

 

 // Show Next or Finish button

 if (currentQ < shuffledQuestions.length - 1) {

 document.getElementById('next-btn').style.display = 'block';

 } else {

 const finishBtn = document.getElementById('finish-btn');

 finishBtn.style.display = 'block';

 document.getElementById('next-btn').style.display = 'none';

 }

 }



 function showExplanation(qData) {

 const expDiv = document.getElementById('explanation');

 const contentDiv = document.getElementById('exp-content');

 

 // Build vocab list

 let vocabHTML = '';

 if (qData.vocab && qData.vocab.length > 0) {

 vocabHTML = `<div class="vocab-list">`;

 qData.vocab.forEach(v => {

 vocabHTML += `

 <div class="vocab-item">

 <span class="vocab-word">${v.w}</span>

 <span class="vocab-type">(${v.t})</span>

 <span class="vocab-mean">${v.m}</span>

 </div>`;

 });

 vocabHTML += `</div>`;

 }



 contentDiv.innerHTML = `

 <p><strong>🌐 Dịch câu:</strong> "${qData.trans}"</p>

 <p><strong>📚 Phân tích từ vựng:</strong></p>

 ${vocabHTML}

 <hr style="border:0; border-top:1px dashed #ccc; margin:15px 0;">

 <p class="why-correct"><strong>✅ Tại sao ĐÚNG:</strong> ${qData.why}</p>

 <p class="why-wrong"><strong>❌ Tại sao SAI:</strong> ${qData.wrong}</p>

 `;

 

 expDiv.style.display = 'block';

 // Scroll to explanation

 expDiv.scrollIntoView({behavior: 'smooth', block: 'center'});

 }



 function nextQuestion() {

 currentQ++;

 loadQuestion();

 window.scrollTo(0, 0);

 }



 function showResult() {

 const popup = document.getElementById('result-popup');

 const scoreCircle = document.getElementById('final-score');

 const feedback = document.getElementById('feedback-msg');



 scoreCircle.innerText = `${score}/${shuffledQuestions.length}`;

 

 if (score === shuffledQuestions.length) {

 feedback.innerText = "Xuất sắc! Bạn là bậc thầy Quá khứ tiếp diễn! 🏆";

 fireConfetti();

 } else if (score >= shuffledQuestions.length * 0.8) {

 feedback.innerText = "Giỏi lắm! Bạn nắm rất chắc kiến thức! 🌟";

 } else if (score >= shuffledQuestions.length * 0.5) {

 feedback.innerText = "Khá tốt! Hãy ôn lại một chút để đạt điểm tối đa nhé! 💪";

 } else {

 feedback.innerText = "Cố lên! Hãy xem lại phần giải thích để hiểu rõ hơn nha! 📚";

 }



 popup.style.display = 'flex';

 }



 // --- Simple Confetti Effect ---

 function fireConfetti() {

 const canvas = document.getElementById('confetti');

 const ctx = canvas.getContext('2d');

 canvas.width = window.innerWidth;

 canvas.height = window.innerHeight;



 const pieces = [];

 const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD700', '#00D26A'];



 for (let i = 0; i < 100; i++) {

 pieces.push({

 x: Math.random() * canvas.width,

 y: Math.random() * canvas.height - canvas.height,

 w: Math.random() * 10 + 5,

 h: Math.random() * 10 + 5,

 color: colors[Math.floor(Math.random() * colors.length)],

 vy: Math.random() * 5 + 2,

 vx: Math.random() * 4 - 2

 });

 }



 function animate() {

 ctx.clearRect(0, 0, canvas.width, canvas.height);

 let active = false;

 pieces.forEach(p => {

 p.y += p.vy;

 p.x += p.vx;

 ctx.fillStyle = p.color;

 ctx.fillRect(p.x, p.y, p.w, p.h);

 if (p.y < canvas.height) active = true;

 });

 if (active) requestAnimationFrame(animate);

 else ctx.clearRect(0, 0, canvas.width, canvas.height);

 }

 animate();

 }



 // Start Game

 window.onload = initGame;



 </script>
