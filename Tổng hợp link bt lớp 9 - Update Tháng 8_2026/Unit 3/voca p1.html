<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 3: Healthy Living for Teens | Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08041a;--sk:#ffb7c5;--pu:#c778dd;--tl:#06d6a0;--gd:#ffd700;--rd:#ef4444;
  --correct:#06d6a0;--wrong:#ef4444;
  --glass:rgba(12,4,30,.82);--glb:rgba(255,183,197,.18);
  --text:#f0e6ff;--text2:#c4a8d4;
  --shadow:0 8px 32px rgba(0,0,50,.55);--glow:0 0 22px rgba(199,120,221,.1);
  --hg:linear-gradient(90deg,#ffb7c5,#c778dd,#06d6a0,#ffd700,#ff9a9a);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Nunito',sans-serif;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1a0535 0%,#08041a 55%,#04020e 100%);color:var(--text);overflow-x:hidden;}

/* ── SAKURA PETALS ── */
.sakura{position:fixed;pointer-events:none;z-index:1;animation:sakuraFall linear infinite;will-change:transform;}
@keyframes sakuraFall{
  0%{transform:translateY(-30px) rotate(0deg) translateX(0);opacity:0;}
  5%{opacity:.85;}
  85%{opacity:.6;}
  100%{transform:translateY(110vh) rotate(540deg) translateX(50px);opacity:0;}
}

/* ── MOON ── */
.moon{position:fixed;top:4%;right:6%;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff9c4,#ffd700 40%,#ffb300 80%);box-shadow:0 0 40px rgba(255,215,0,.45),0 0 80px rgba(255,215,0,.2);z-index:0;pointer-events:none;animation:moonGlow 6s ease-in-out infinite;}
@keyframes moonGlow{0%,100%{box-shadow:0 0 40px rgba(255,215,0,.45),0 0 80px rgba(255,215,0,.2);}50%{box-shadow:0 0 60px rgba(255,215,0,.7),0 0 100px rgba(255,215,0,.3);}}

/* ── STARS ── */
.star{position:fixed;border-radius:50%;background:#fff;pointer-events:none;z-index:0;animation:twinkle ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.1;}50%{opacity:.85;}}

/* ── FIREFLIES ── */
.firefly{position:fixed;border-radius:50%;pointer-events:none;z-index:0;animation:ffFloat ease-in-out infinite;background:radial-gradient(circle,rgba(255,215,0,.8),transparent);}
@keyframes ffFloat{0%,100%{transform:translate(0,0);opacity:.7;}33%{transform:translate(20px,-18px);opacity:.2;}66%{transform:translate(-14px,12px);opacity:.9;}}

/* ── LANTERNS ── */
.lantern{position:fixed;pointer-events:none;z-index:0;animation:lanternFloat ease-in-out infinite;font-size:1.4rem;opacity:.35;}
@keyframes lanternFloat{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-25px) rotate(5deg);}}

/* ── LAYOUT ── */
#app{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:16px;}

/* ── HEADER ── */
header{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glb);border-radius:22px;padding:16px 22px 13px;text-align:center;margin-bottom:18px;box-shadow:var(--shadow),0 0 50px rgba(199,120,221,.06);position:relative;overflow:hidden;}
header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(199,120,221,.07),transparent 60%);}
header::after{content:'🌸 ✦ 🌙 ✦ 🌸';display:block;font-size:.72rem;letter-spacing:7px;color:var(--sk);opacity:.55;margin-bottom:5px;}
header h1{font-family:'Quicksand',sans-serif;font-size:1.2rem;font-weight:800;background:var(--hg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;position:relative;}
header .sub{font-size:.82rem;color:var(--text2);margin-top:4px;font-weight:600;}
header .teacher{font-size:.78rem;background:linear-gradient(90deg,var(--gd),var(--sk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;}

/* ── PROGRESS ── */
#prog-wrap{background:rgba(0,0,30,.6);border-radius:30px;height:12px;margin-bottom:18px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4);}
#prog-bar{height:100%;border-radius:30px;background:linear-gradient(90deg,var(--sk),var(--pu));box-shadow:0 0 12px rgba(199,120,221,.6);transition:width .4s ease;width:0%;}
#prog-txt{text-align:center;font-size:.78rem;color:var(--text2);margin-top:4px;font-weight:700;}

/* ── SECTION HEADER ── */
.sec-hd{background:linear-gradient(135deg,rgba(255,183,197,.1),rgba(199,120,221,.07));backdrop-filter:blur(8px);border:1px solid rgba(255,183,197,.2);border-radius:18px;padding:12px 20px;margin:26px 0 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--glow);}
.sec-hd .si{font-size:1.5rem;}
.sec-hd h2{font-family:'Quicksand',sans-serif;font-size:.98rem;font-weight:800;color:var(--sk);}
.sec-hd p{font-size:.78rem;color:var(--text2);margin-top:2px;}

/* ── GLOBAL DEFS BOX (EX I) ── */
.def-box-global{flex-direction:column;align-items:stretch;padding:16px 20px;}
.def-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
@media(max-width:600px){.def-grid{grid-template-columns:1fr;}}
.def-item{background:rgba(255,255,255,.05);border:1px solid rgba(199,120,221,.2);border-left:3px solid var(--pu);padding:10px 14px;border-radius:10px;font-size:.88rem;color:var(--text);line-height:1.45;}
.def-letter{color:var(--gd);font-weight:900;font-size:1rem;margin-right:6px;}

/* ── Q CARD ── */
.q-card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glb);border-radius:20px;padding:18px 20px 14px;margin-bottom:14px;box-shadow:var(--shadow),var(--glow);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,183,197,.45),transparent);}
.q-card:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 0 28px rgba(199,120,221,.15);}
.q-num{display:inline-block;background:linear-gradient(135deg,var(--sk),var(--pu));color:#fff;font-weight:900;font-size:.78rem;border-radius:30px;padding:2px 10px;margin-bottom:8px;box-shadow:0 0 10px rgba(199,120,221,.4);}
.q-text{font-size:1.06rem;font-weight:700;color:var(--text);line-height:1.65;margin-bottom:12px;}

/* ── MATCHING LETTERS ── */
.match-letters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.letter-btn{background:rgba(199,120,221,.1);border:1.5px solid rgba(199,120,221,.28);border-radius:12px;padding:7px 14px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:900;color:var(--pu);transition:all .15s;}
.letter-btn:not(.answered):hover{background:rgba(199,120,221,.25);border-color:var(--pu);box-shadow:0 0 12px rgba(199,120,221,.3);}
.letter-btn.correct{background:rgba(6,214,160,.18)!important;border-color:var(--correct)!important;color:#a7f3d0!important;box-shadow:0 0 14px rgba(6,214,160,.3)!important;}
.letter-btn.wrong{background:rgba(239,68,68,.18)!important;border-color:var(--wrong)!important;color:#fca5a5!important;}
.letter-btn.shake{animation:shake .4s ease;}
.letter-btn.answered{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px)};}

/* ── FILL IN ── */
.fill-sentence{font-size:1.04rem;font-weight:600;color:var(--text);line-height:2.4;}
.fi{display:inline-block;min-width:110px;max-width:200px;padding:4px 9px;background:rgba(255,183,197,.07);border:2px solid rgba(255,183,197,.27);border-radius:8px;color:var(--text);font-family:'Nunito',sans-serif;font-size:.93rem;font-weight:700;vertical-align:middle;outline:none;text-align:center;transition:border-color .2s,background .2s;}
.fi:focus{border-color:var(--sk);background:rgba(255,183,197,.13);}
.fi.ok{border-color:var(--correct)!important;background:rgba(6,214,160,.14)!important;color:#a7f3d0!important;}
.fi.no{border-color:var(--wrong)!important;background:rgba(239,68,68,.12)!important;color:#fca5a5!important;}
.fi[readonly]{pointer-events:none;}
.chk-btn{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,rgba(255,183,197,.2),rgba(199,120,221,.14));border:1px solid rgba(255,183,197,.35);border-radius:20px;padding:5px 15px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;color:var(--sk);cursor:pointer;margin-top:10px;transition:transform .15s,box-shadow .15s;}
.chk-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(255,183,197,.28);}
.chk-btn:disabled{opacity:.4;cursor:default;}
.fill-fb{font-size:.82rem;font-weight:700;margin-top:6px;min-height:18px;}
.fill-fb.ok{color:var(--correct);}
.fill-fb.no{color:var(--wrong);}

/* ── WORD BANK ── */
.wbk{background:rgba(255,183,197,.05);border:1px dashed rgba(255,183,197,.28);border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.wb-lbl{font-weight:800;color:var(--sk);font-size:.8rem;white-space:nowrap;}
.wbc{background:rgba(255,183,197,.1);border:1px solid rgba(255,183,197,.26);border-radius:20px;padding:3px 12px;font-weight:800;color:var(--sk);font-size:.84rem;}

/* ── 4-STEP EXPLANATION BOX ── */
.expl-box{
  display:none;margin-top:14px;
  background:rgba(255,183,197,.04);
  border:1px solid rgba(255,183,197,.18);
  border-left:4px solid var(--sk);
  border-radius:14px;padding:16px 16px 12px;
  font-size:.93rem;line-height:1.72;color:var(--text);
  animation:slideDown .35s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.expl-box.show{display:block;}
.expl-step{margin-bottom:12px;padding:10px 13px;background:rgba(255,255,255,.04);border-radius:12px;position:relative;}
.expl-step:last-child{margin-bottom:0;}
.expl-step-title{font-weight:900;font-size:.85rem;margin-bottom:6px;display:block;}
.est-1{color:#06d6a0;}
.est-2{color:var(--gd);}
.est-3{color:var(--sk);}
.est-4{color:#f87171;}

/* ── KEYWORD STYLES ── */
.p-word{color:#60a5fa;font-weight:800;font-size:1em;}
.p-phonetic{background:rgba(167,139,250,.2);color:#c4b5fd;padding:1px 6px;border-radius:5px;font-family:monospace;font-size:.9em;font-style:normal;}
.p-mean{color:#fb923c;font-weight:700;}
.p-grammar{text-decoration:underline;text-decoration-color:#f87171;text-decoration-thickness:2px;text-underline-offset:2px;font-weight:800;color:#fca5a5;}
.hl-green{color:#86efac;font-weight:900;}
.hl-red{text-decoration:line-through;color:#fca5a5;font-weight:700;}
.vns{background:rgba(255,215,0,.1);border-left:3px solid var(--gd);padding:5px 10px;border-radius:8px;font-style:italic;margin:5px 0;font-weight:600;color:#fde68a;display:block;}

/* ── SUBMIT & MODALS ── */
#submit-wrap{text-align:center;margin:28px 0 20px;}
#submit-btn{background:linear-gradient(135deg,var(--sk),var(--pu));border:none;border-radius:50px;padding:15px 40px;font-family:'Nunito',sans-serif;font-size:1.08rem;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 6px 22px rgba(199,120,221,.45);transition:transform .2s,box-shadow .2s;letter-spacing:.5px;}
#submit-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 35px rgba(199,120,221,.55);}
.modal-ov{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);align-items:center;justify-content:center;}
.modal-ov.show{display:flex;}
.modal-box{background:linear-gradient(135deg,rgba(8,4,26,.96),rgba(15,6,35,.94));backdrop-filter:blur(20px);border:1px solid rgba(255,183,197,.24);border-radius:28px;padding:32px 28px;width:min(90vw,470px);text-align:center;box-shadow:0 20px 60px rgba(0,0,50,.85),0 0 60px rgba(199,120,221,.1);animation:popIn .35s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.modal-box h2{font-family:'Quicksand',sans-serif;font-size:1.35rem;font-weight:800;background:var(--hg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;}
.modal-box input{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid rgba(255,183,197,.26);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;color:var(--text);background:rgba(0,10,30,.7);margin:12px 0;outline:none;transition:border-color .2s;}
.modal-box input:focus{border-color:var(--sk);}
.modal-box input.err{border-color:var(--wrong)!important;}
.err-msg{color:var(--wrong);font-size:.85rem;font-weight:700;min-height:20px;}
.modal-btn{background:linear-gradient(135deg,var(--sk),var(--pu));border:none;border-radius:30px;padding:12px 32px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;color:#fff;cursor:pointer;margin-top:8px;box-shadow:0 5px 16px rgba(199,120,221,.4);transition:transform .15s;}
.modal-btn:hover{transform:translateY(-2px);}
.pm-sub{font-size:.88rem;color:var(--text2);margin-top:4px;}
.score-wrap{position:relative;width:140px;height:140px;margin:14px auto;}
.score-ring{width:140px;height:140px;border-radius:50%;background:conic-gradient(#ffb7c5,#c778dd,#06d6a0,#ffd700,#ff9a9a,#ffb7c5);box-shadow:0 0 50px rgba(255,183,197,.5);}
.score-inner{position:absolute;inset:5px;border-radius:50%;background:linear-gradient(135deg,#08041a,#0f0625);display:flex;align-items:center;justify-content:center;flex-direction:column;}
.big-num{font-size:1.8rem;font-weight:900;color:#fff;line-height:1;}
.sc-sub{font-size:.7rem;color:rgba(255,255,255,.8);font-weight:700;}
.score-10{font-size:1.6rem;font-weight:900;background:linear-gradient(90deg,var(--gd),var(--sk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:6px 0;}
.res-gif{width:170px;height:auto;border-radius:16px;margin:10px auto;display:block;}
.res-btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.retry-btn{background:linear-gradient(135deg,rgba(255,183,197,.17),rgba(199,120,221,.14));border:1px solid rgba(255,183,197,.28);border-radius:30px;padding:11px 26px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;color:var(--sk);cursor:pointer;transition:transform .15s;}
.retry-btn:hover{transform:translateY(-2px);}
.sco-bd{margin:10px 0;font-size:.83rem;text-align:left;}
.sco-row{display:flex;justify-content:space-between;padding:4px 8px;border-radius:7px;margin:3px 0;background:rgba(255,255,255,.04);}
.sco-lbl{color:var(--text2);font-weight:600;}
.sco-val{color:var(--sk);font-weight:800;}

/* ── CONFETTI ── */
#cw{position:fixed;inset:0;pointer-events:none;z-index:9999;}
.cp{position:absolute;width:9px;height:9px;top:-20px;animation:cfFall linear forwards;border-radius:2px;}
@keyframes cfFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
</style>
</head>
<body>

<div class="moon"></div>
<div id="cw"></div>

<script>
for(let i=0;i<90;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+.4;s.style.cssText=`width:${sz}px;height:${sz}px;position:fixed;left:${Math.random()*99}%;top:${Math.random()*65}%;animation-duration:${2+Math.random()*4}s;animation-delay:${-Math.random()*5}s;z-index:0;pointer-events:none;`;document.body.appendChild(s);}
for(let i=0;i<16;i++){const f=document.createElement('div');f.className='firefly';const s=3+Math.random()*4;f.style.cssText=`width:${s}px;height:${s}px;position:fixed;left:${Math.random()*96}%;top:${20+Math.random()*70}%;animation-duration:${4+Math.random()*8}s;animation-delay:${-Math.random()*8}s;z-index:0;pointer-events:none;`;document.body.appendChild(f);}
['🏮','🕯️','🌸'].forEach((e,i)=>{const l=document.createElement('div');l.className='lantern';l.textContent=e;l.style.cssText=`left:${8+i*30}%;top:${5+i*8}%;animation-duration:${7+i*2}s;animation-delay:${-i*2}s;`;document.body.appendChild(l);});
const petalEmojis=['🌸','🌺','🌷','✿','❀'];
setInterval(()=>{const p=document.createElement('div');p.className='sakura';p.textContent=petalEmojis[Math.floor(Math.random()*petalEmojis.length)];p.style.left=Math.random()*97+'%';p.style.animationDuration=(8+Math.random()*10)+'s';p.style.fontSize=(.7+Math.random()*.7)+'rem';document.body.appendChild(p);setTimeout(()=>p.remove(),20000);},700);
</script>

<div id="app">
  <header>
    <h1>🌸 UNIT 3 – HEALTHY LIVING FOR TEENS</h1>
    <p class="sub">Vocabulary Matching • Fill-in Sentences • Verb Forms | Grade 9</p>
    <p class="teacher">👩‍🏫 Giáo viên tạo: Ms. Chí Nên</p>
  </header>

  <div id="prog-wrap"><div id="prog-bar"></div></div>
  <div id="prog-txt">0 / 36 câu đã trả lời</div>
  <div id="quiz-container"></div>
  <div id="submit-wrap">
    <button id="submit-btn" onclick="openNameModal()">🌸 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>
</div>

<div class="modal-ov" id="name-modal">
  <div class="modal-box">
    <h2>🌙 Nhập tên của bạn</h2>
    <p class="pm-sub">để nhận kết quả dưới ánh trăng Sakura!</p>
    <input type="text" id="student-name" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="40" onkeydown="if(event.key==='Enter')confirmName()">
    <div class="err-msg" id="name-err"></div>
    <button class="modal-btn" onclick="confirmName()">🌟 XEM KẾT QUẢ</button>
  </div>
</div>

<div class="modal-ov" id="result-modal">
  <div class="modal-box">
    <h2 id="res-greet">🌸</h2>
    <div class="score-wrap"><div class="score-ring"></div>
      <div class="score-inner"><span class="big-num" id="res-frac">0/36</span><span class="sc-sub">đúng</span></div>
    </div>
    <div class="score-10" id="res-10"></div>
    <div class="sco-bd" id="res-bd"></div>
    <img id="res-gif" class="res-gif" src="" alt="">
    <div class="res-btns">
      <button class="modal-btn" onclick="closeResult()">📖 Xem lại</button>
      <button class="retry-btn" onclick="retryQuiz()">🔄 Làm lại</button>
    </div>
  </div>
</div>

<script>
/* ══ AUDIO ══ */
const AC=window.AudioContext||window.webkitAudioContext;let actx=null;
function gAC(){if(!actx)actx=new AC();return actx;}
function playOK(){try{const a=gAC();[523,659,784,1047].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,a.currentTime+i*.07);g.gain.linearRampToValueAtTime(.13,a.currentTime+i*.07+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.07+.28);o.start(a.currentTime+i*.07);o.stop(a.currentTime+i*.07+.32);});}catch(e){}}
function playBAD(){try{const a=gAC();[200,170,140].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;o.type='sawtooth';g.gain.setValueAtTime(.09,a.currentTime+i*.07);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.07+.2);o.start(a.currentTime+i*.07);o.stop(a.currentTime+i*.07+.25);});}catch(e){}}
function boom(){const w=document.getElementById('cw');['#ffb7c5','#c778dd','#06d6a0','#ffd700','#ff9a9a','#fff'].forEach(c=>{for(let i=0;i<8;i++){const p=document.createElement('div');p.className='cp';p.style.left=Math.random()*100+'%';p.style.background=c;p.style.animationDuration=(1.5+Math.random()*2)+'s';p.style.animationDelay=(Math.random()*.6)+'s';p.style.borderRadius=Math.random()>.5?'50%':'2px';w.appendChild(p);setTimeout(()=>p.remove(),4000);}});}
function sfl(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

/* ══ STATE ══ */
let s1=0,s2=0,s3=0,s4=0,done={},interactions=0;
const TOTAL=36;
function addDone(k){if(!done[k]){done[k]=true;interactions++;document.getElementById('prog-bar').style.width=(interactions/TOTAL*100)+'%';document.getElementById('prog-txt').textContent=`${interactions} / ${TOTAL} câu đã trả lời`;}}

/* ══════════════════════ DATA ══════════════════════ */
const DEFS={
  a:'so worried and tired that you cannot relax',
  b:'likely to make you fat',
  c:"connected with a person's body rather than their mind",
  d:'more than what was agreed or expected',

/* ══ HELPERS ══ */
function secHd(icon,title,desc){const d=document.createElement('div');d.className='sec-hd';d.innerHTML=`<span class="si">${icon}</span><div><h2>${title}</h2><p>${desc}</p></div>`;return d;}

/* ══ MATCHING (Ex I) ══ */
function renderMatch(q){
  const card=document.createElement('div');card.className='q-card';
  const allLetters=['a','b','c','d','e','f','g','h'];
  const sh=sfl(allLetters);
  card.innerHTML=`<span class="q-num">Câu ${q.num}</span>
    <div class="q-text"><strong>${q.num}. <span style="color:var(--sk)">${q.word}</span></strong></div>
    <div class="match-letters" id="lbts-${q.id}">
      ${sh.map(l=>`<button class="letter-btn" onclick="handleMatch('${q.id}','${l}','${q.correct}',this)">${l.toUpperCase()}</button>`).join('')}
    </div>
    <div class="fill-fb" id="fb-${q.id}"></div>
    <div class="expl-box" id="expl-${q.id}">${q.expl}</div>`;
  return card;
}
function handleMatch(qid,chosen,correct,btn){
  if(done['m_'+qid])return;done['m_'+qid]=true;addDone('m_'+qid);
  document.querySelectorAll(`#lbts-${qid} .letter-btn`).forEach(b=>b.classList.add('answered'));
  const fb=document.getElementById('fb-'+qid);
  if(chosen===correct){btn.classList.add('correct');playOK();boom();s1++;fb.className='fill-fb ok';fb.textContent='✅ Chính xác!';}
  else{btn.classList.add('wrong');btn.classList.add('shake');const cb=document.querySelector(`#lbts-${qid} .letter-btn:nth-child(${['a','b','c','d','e','f','g','h'].indexOf(correct)+1})`);document.querySelectorAll(`#lbts-${qid} .letter-btn`).forEach(b=>{if(b.textContent.toLowerCase()===correct)b.classList.add('correct');});playBAD();setTimeout(()=>btn.classList.remove('shake'),450);fb.className='fill-fb no';fb.innerHTML=`❌ Đáp án đúng: <strong style="color:var(--correct)">${correct.toUpperCase()}</strong>`;}
  document.getElementById(`expl-${qid}`).classList.add('show');
}

/* ══ FILL-IN (II, III, IV) ══ */
function renderFill(q,sec){
  const card=document.createElement('div');card.className='q-card';
  let tmpl=q.template;
  q.blanks.forEach(bl=>{tmpl=tmpl.replace(`id="${bl.id}"`,`id="inp-${bl.id}"`);});
  card.innerHTML=`<span class="q-num">Câu ${q.num}</span>
    <div class="fill-sentence">${tmpl}</div>
    <button class="chk-btn" id="btn-${q.id}" onclick="checkFill('${q.id}','${sec}')">🔍 Kiểm tra</button>
    <div class="fill-fb" id="fb-${q.id}"></div>
    <div class="expl-box" id="expl-${q.id}">${q.expl}</div>`;
  setTimeout(()=>{card.querySelectorAll('.fi').forEach(inp=>{inp.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-'+q.id)?.click();});});},0);
  return card;
}
function checkFill(qid,sec){
  if(done['f_'+qid])return;done['f_'+qid]=true;addDone('f_'+qid);
  const allQ=[...EX2,...EX3,...EX4];
  const q=allQ.find(x=>x.id===qid);if(!q)return;
  let allOK=true;
  q.blanks.forEach(bl=>{
    const inp=document.getElementById('inp-'+bl.id);if(!inp)return;
    const val=(inp.value||'').trim().toLowerCase();
    const ok=bl.ans.map(a=>a.toLowerCase()).includes(val);
    inp.classList.add(ok?'ok':'no');inp.readOnly=true;if(!ok)allOK=false;
  });
  const fb=document.getElementById('fb-'+qid);
  if(allOK){fb.className='fill-fb ok';fb.textContent='✅ Chính xác! Xuất sắc!';if(sec==='e2')s2++;else if(sec==='e3')s3++;else s4++;playOK();boom();}
  else{const hints=q.blanks.map(bl=>`<span style="color:var(--correct);font-weight:800">${bl.ans[0]}</span>`).join(' ');fb.className='fill-fb no';fb.innerHTML=`❌ Đáp án: ${hints}`;playBAD();}
  document.getElementById(`expl-${qid}`).classList.add('show');
  document.getElementById('btn-'+qid).disabled=true;
}

/* ══ BUILD ══ */
function buildQuiz(){
  const cont=document.getElementById('quiz-container');cont.innerHTML='';
  s1=0;s2=0;s3=0;s4=0;for(const k in done)delete done[k];interactions=0;
  document.getElementById('prog-bar').style.width='0%';
  document.getElementById('prog-txt').textContent=`0 / ${TOTAL} câu đã trả lời`;

  cont.appendChild(secHd('🔗','I – Match adjectives with definitions (8 câu)','Đọc bảng định nghĩa dưới đây và chọn chữ cái tương ứng cho mỗi từ.'));
  
  const wb1 = document.createElement('div');
  wb1.className = 'wbk def-box-global';
  wb1.innerHTML = `<span class="wb-lbl" style="font-size:1rem;">📋 Bảng Định Nghĩa:</span>
    <div class="def-grid">
      <div class="def-item"><span class="def-letter">a.</span>${DEFS.a}</div>
      <div class="def-item"><span class="def-letter">b.</span>${DEFS.b}</div>
      <div class="def-item"><span class="def-letter">c.</span>${DEFS.c}</div>
      <div class="def-item"><span class="def-letter">d.</span>${DEFS.d}</div>
      <div class="def-item"><span class="def-letter">e.</span>${DEFS.e}</div>
      <div class="def-item"><span class="def-letter">f.</span>${DEFS.f}</div>
      <div class="def-item"><span class="def-letter">g.</span>${DEFS.g}</div>
      <div class="def-item"><span class="def-letter">h.</span>${DEFS.h}</div>
    </div>`;
  cont.appendChild(wb1);
  EX1.forEach(q=>cont.appendChild(renderMatch(q)));

  cont.appendChild(secHd('✏️','II – Complete with adjectives from Part I (8 câu)','Điền tính từ thích hợp từ Word Box dưới đây vào chỗ trống.'));
  
  const wb2 = document.createElement('div');
  wb2.className = 'wbk';
  wb2.innerHTML = '<span class="wb-lbl">📦 Word Box:</span>' + ['stressed out', 'healthy', 'optimistic', 'physical', 'additional', 'well-balanced', 'fattening', 'mental'].map(w=>`<span class="wbc">${w}</span>`).join('');
  cont.appendChild(wb2);
  EX2.forEach(q=>cont.appendChild(renderFill(q,'e2')));

  cont.appendChild(secHd('📦','III – Complete with words from box (10 câu)','Điền từ/cụm từ thích hợp từ Word Box vào chỗ trống.'));
  const wb3=document.createElement('div');wb3.className='wbk';
  wb3.innerHTML='<span class="wb-lbl">📦 Word Box:</span>'+['counsellors','priority','balance','due date','distractions','anxiety','celebrities','deadline','assignments','mood'].map(w=>`<span class="wbc">${w}</span>`).join('');
  cont.appendChild(wb3);
  EX3.forEach(q=>cont.appendChild(renderFill(q,'e3')));

  cont.appendChild(secHd('⚙️','IV – Correct form/tense of verbs (10 câu)','Điền dạng đúng của động từ từ hộp vào chỗ trống.'));
  const wb4=document.createElement('div');wb4.className='wbk';
  wb4.innerHTML='<span class="wb-lbl">📦 Verb Box:</span>'+['maintain','balance','delay','distract','manage','prioritise','accomplish','overcome','concentrate','keep away'].map(w=>`<span class="wbc">${w}</span>`).join('');
  cont.appendChild(wb4);
  EX4.forEach(q=>cont.appendChild(renderFill(q,'e4')));
}

function openNameModal(){document.getElementById('name-modal').classList.add('show');document.getElementById('student-name').focus();}
function confirmName(){
  const inp=document.getElementById('student-name'),err=document.getElementById('name-err'),nm=inp.value.trim();
  if(!nm){inp.classList.add('err');err.textContent='⚠️ Vui lòng nhập tên!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('name-modal').classList.remove('show');showResult(nm);
}
function showResult(nm){
  const total=36,cor=s1+s2+s3+s4,pct=Math.round(cor/total*100);
  let greet,gif;
  if(pct>=90){greet=`🌸 XUẤT SẮC! ${nm} rực rỡ như hoa anh đào!`;gif='https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif';}
  else if(pct>=60){greet=`🌙 TUYỆT VỜI! ${nm} đang nở rộ!`;gif='https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif';}
  else{greet=`🌸 CỐ LÊN! ${nm} hãy tiếp tục nở hoa!`;gif='https://media.giphy.com/media/3o6gbbuLW76jkt8vIc/giphy.gif';}
  document.getElementById('res-greet').textContent=greet;
  document.getElementById('res-frac').textContent=`${cor}/${total}`;
  document.getElementById('res-10').textContent=`⭐ ${(cor/total*10).toFixed(1)} / 10 điểm`;
  document.getElementById('res-gif').src=gif;
  document.getElementById('res-bd').innerHTML=`
    <div class="sco-row"><span class="sco-lbl">I – Matching adjectives</span><span class="sco-val">${s1}/8</span></div>
    <div class="sco-row"><span class="sco-lbl">II – Fill adjectives in sentences</span><span class="sco-val">${s2}/8</span></div>
    <div class="sco-row"><span class="sco-lbl">III – Fill words from box</span><span class="sco-val">${s3}/10</span></div>
    <div class="sco-row"><span class="sco-lbl">IV – Correct verb forms</span><span class="sco-val">${s4}/10</span></div>`;
  document.getElementById('result-modal').classList.add('show');if(pct>=90)boom();
}
function closeResult(){document.getElementById('result-modal').classList.remove('show');}
function retryQuiz(){document.getElementById('result-modal').classList.remove('show');buildQuiz();window.scrollTo({top:0,behavior:'smooth'});}

buildQuiz();
</script>
