<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 3: Healthy Living for Teens – Bài Tập Tiếng Anh 9</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g1:#06d6a0;--g2:#ffd166;--g3:#ef476f;--g4:#118ab2;--g5:#7209b7;--ok:#06d6a0;--err:#ef476f;--gl:rgba(15,23,42,0.85);--gb:rgba(255,255,255,0.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;color:#fff}
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,#06d6a0,#ffd166,#ef476f,#7209b7,#118ab2,#06d6a0);background-size:400% 400%;animation:bgf 15s ease infinite}
@keyframes bgf{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.fll{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fi{position:absolute;opacity:0;animation:fup linear infinite}
@keyframes fup{0%{transform:translateY(110vh) rotate(0deg) scale(.7);opacity:0}8%{opacity:.2}88%{opacity:.15}100%{transform:translateY(-15vh) rotate(560deg) scale(1.1);opacity:0}}
header{text-align:center;padding:12px 16px 6px;position:relative;z-index:10}
header h1{font-size:1.15rem;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.5)}
header .sub{font-size:.76rem;font-weight:700;opacity:.9;margin-top:2px;color:#ffd166;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:3px 12px;font-size:.72rem;font-weight:800;margin-top:3px}
.pw{max-width:800px;margin:0 auto 8px;padding:0 14px}
.pb{height:8px;background:rgba(0,0,0,.4);border-radius:99px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.pf{height:100%;background:linear-gradient(90deg,#06d6a0,#ffd166);border-radius:99px;transition:width .4s;width:0%;box-shadow:0 0 8px rgba(6,214,160,.6)}
.pt{font-size:.75rem;font-weight:900;text-align:right;margin-top:3px;opacity:.95;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.main{max-width:800px;margin:0 auto;padding:0 14px 120px}
.sec{background:rgba(0,0,0,.65);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:11px 15px;margin:20px 0 12px;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.sec h2{font-size:1.05rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#ffd166}
.sec p{font-size:.85rem;opacity:.9;margin-top:4px;font-style:italic}
.card{background:var(--gl);backdrop-filter:blur(16px);border:1px solid var(--gb);border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.cn{font-size:.75rem;font-weight:900;opacity:.85;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;color:#06d6a0}
.cq{font-size:1.08rem;font-weight:700;line-height:1.6;margin-bottom:11px}
/* WORD FORM */
.wfi{background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.38);border-radius:11px;padding:8px 14px;font-family:'Nunito',sans-serif;font-size:.97rem;font-weight:700;color:#fff;outline:none;transition:all .2s;min-width:140px;flex:1;box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
.wfi::placeholder{color:rgba(255,255,255,.45)}
.wfi:focus{border-color:#ffd166;background:rgba(0,0,0,.6)}
.wfi.ok{border-color:#06d6a0!important;background:rgba(6,214,160,.2)!important;color:#9fff5b}
.wfi.bad{border-color:#ef476f!important;background:rgba(239,71,111,.15)!important;animation:shk .5s;color:#ff7b8a}
.hw{background:rgba(255,209,102,.25);border:1px solid rgba(255,209,102,.5);border-radius:8px;padding:3px 10px;font-size:.85rem;font-weight:800;color:#ffd166;white-space:nowrap}
.bck{background:linear-gradient(135deg,#06d6a0,#118ab2);border:none;border-radius:11px;padding:8px 16px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(6,214,160,.38);transition:transform .15s;white-space:nowrap}
.bck:hover:not(:disabled){transform:translateY(-2px)}
.bck:disabled{opacity:.55;cursor:default;transform:none;filter:grayscale(0.6)}
/* ERROR CORRECTION */
.ec-sent{font-size:1.02rem;font-weight:600;line-height:1.8;margin-bottom:12px;background:rgba(0,0,0,.2);padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.ec-sent .uw{text-decoration:underline;text-decoration-color:rgba(255,209,102,.8);text-decoration-thickness:2px;font-weight:800;cursor:pointer;padding:0 2px;border-radius:4px;transition:all .2s}
.ec-sent .uw:hover{background:rgba(255,209,102,.2)}
.ec-sent .uw.sel{background:rgba(255,209,102,.4);color:#ffd166}
.ec-sent .uw.cor{background:rgba(6,214,160,.4);color:#9fff5b;text-decoration-color:#06d6a0}
.ec-sent .uw.wrg{background:rgba(239,71,111,.4);color:#ff7b8a;text-decoration-color:#ef476f}
.ec-opts{display:none} /* Hidden as requested, clicking words directly */
.vii-inp-area{display:none;width:100%;margin-top:14px;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.4);padding:12px;border-radius:12px;border:1px dashed rgba(255,209,102,.5)}
.vii-inp-area.show{display:flex;animation:sld .3s ease}
/* DIALOGUE */
.opt-box{background:rgba(0,0,0,.4);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid rgba(255,255,255,.15)}
.opt-lbl{font-size:.8rem;font-weight:900;color:#06d6a0;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.dial-line{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;font-size:.98rem;line-height:1.55}
.dial-sp{font-weight:900;color:#ffd166;min-width:45px;flex-shrink:0;padding-top:1px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.dial-hoa{opacity:.95;font-style:italic}
.blank-row{display:flex;flex-direction:column;gap:6px;flex:1}
.blank-btns{display:flex;gap:6px;flex-wrap:wrap}
.dob{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);border-radius:9px;padding:6px 12px;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:800;color:#fff;cursor:pointer;transition:all .18s}
.dob:hover:not(:disabled):not(.used){transform:translateY(-2px);background:rgba(255,255,255,.25)}
.dob.cor{background:#06d6a0;border-color:#03a07a}
.dob.wrg{background:#ef476f;border-color:#c0334e;animation:shk .5s}
.dob.used{opacity:.3;cursor:default}
.blank-filled{background:rgba(6,214,160,.2);border:1.5px solid rgba(6,214,160,.6);border-radius:9px;padding:8px 12px;font-size:.9rem;font-weight:700;color:#fff;display:none;box-shadow:inset 0 2px 5px rgba(0,0,0,.2)}
.blank-filled.show{display:block}
/* SENTENCE TRANSFORM */
.st-orig{font-size:1rem;line-height:1.55;margin-bottom:10px;background:rgba(0,0,0,.3);border-radius:10px;padding:10px 14px;font-style:italic;border-left:3px solid #118ab2}
.stkw{background:#ffd166;color:#111;border-radius:6px;padding:3px 10px;font-weight:900;font-style:normal;font-size:.88rem;margin-left:5px;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.sta{width:100%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.3);border-radius:11px;padding:10px 14px;font-family:'Nunito',sans-serif;font-size:.98rem;font-weight:600;color:#fff;outline:none;resize:vertical;min-height:50px;line-height:1.5;transition:all .2s;margin-top:6px;box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
.sta::placeholder{color:rgba(255,255,255,.45)}
.sta:focus{border-color:#ffd166;background:rgba(0,0,0,.6)}
.brv{background:linear-gradient(135deg,#ffd166,#ef476f);border:none;border-radius:11px;padding:8px 18px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(255,209,102,.4);transition:transform .15s;margin-top:8px}
.brv:hover:not(:disabled){transform:translateY(-2px)}
.brv:disabled{opacity:.55;cursor:default;transform:none;filter:grayscale(0.6)}
.mans{background:rgba(6,214,160,.15);border:1.5px dashed #06d6a0;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:.95rem;font-weight:700;display:none}
.mans.show{display:block}
.mans .ml{font-size:.75rem;font-weight:900;color:#06d6a0;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
/* EXPLANATION CSS - THE CORE REQUIREMENT */
.ex{display:none;margin-top:14px;background:rgba(10,15,25,0.95);border-left:4px solid #06d6a0;border-radius:0 12px 12px 0;padding:14px 16px;font-size:.96rem;line-height:1.75;animation:sld .4s ease;box-shadow:0 4px 15px rgba(0,0,0,.5);color:#f8f9fa}
.ex.show{display:block}
@keyframes sld{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.ex h4{font-size:.85rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;color:#ffd166;border-bottom:1px dashed rgba(255,255,255,0.2);padding-bottom:5px}
.ex ol{padding-left:20px}
.ex li{margin-bottom:8px}
.ex ul{padding-left:18px;margin-top:4px}
/* COLOR CODING RULES */
.p-word{color:#70e2ff;font-weight:800} /* Xanh dương */
.p-mean{color:#ffa647;font-weight:700} /* Cam / Đất nung */
.p-grammar{text-decoration:underline;text-decoration-color:#ef476f;text-decoration-thickness:2px;color:#ffd6da;font-weight:700} /* Đỏ gạch chân */
.hl-green{color:#9fff5b;font-weight:900} /* Xanh lá đậm */
.hl-red{color:#ff7b8a;text-decoration:line-through;font-weight:700} /* Đỏ gạch ngang */
.vnt{background:rgba(255,165,71,.15);border-left:3px solid #ffa647;padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0 10px;font-weight:800;color:#fff9e6;font-style:italic;font-size:.95rem}
.wt{background:rgba(255,255,255,.2);border-radius:6px;padding:2px 6px;font-size:.75rem;font-weight:800;margin-left:4px;vertical-align:middle;color:#fff}
/* SUBMIT */
.subw{text-align:center;padding:22px 0 35px}
.bsub{background:linear-gradient(135deg,#ef476f,#ffd166);border:none;border-radius:24px;padding:16px 36px;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 6px 20px rgba(239,71,111,.48),0 9px 0 rgba(130,25,50,.5);transition:transform .15s}
.bsub:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(239,71,111,.55),0 9px 0 rgba(130,25,50,.5)}
/* MODALS */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center;padding:20px}
.ov.show{display:flex}
.mb{background:linear-gradient(135deg,rgba(15,23,42,.95),rgba(17,138,178,.95));border:2px solid rgba(255,255,255,.4);border-radius:24px;padding:30px 25px;max-width:440px;width:100%;text-align:center;animation:mpop .4s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 15px 40px rgba(0,0,0,.6)}
@keyframes mpop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.mb h2{font-size:1.45rem;font-weight:900;margin-bottom:8px;color:#ffd166}
.mb p{font-size:1rem;opacity:.95;margin-bottom:16px}
.ni{width:100%;padding:12px 15px;border-radius:12px;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;color:#fff;outline:none;margin-bottom:5px;transition:border-color .2s;box-shadow:inset 0 3px 6px rgba(0,0,0,.3)}
.ni::placeholder{color:rgba(255,255,255,.5)}
.ni:focus{border-color:#06d6a0}
.ni.ne{border-color:#ef476f!important;animation:shk .5s}
.em{color:#ff7b8a;font-size:.85rem;font-weight:800;min-height:16px;margin-bottom:12px}
.bok{background:linear-gradient(135deg,#06d6a0,#118ab2);border:none;border-radius:12px;padding:12px 30px;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:900;color:#fff;cursor:pointer;transition:transform .15s;box-shadow:0 5px 15px rgba(6,214,160,.4)}
.bok:hover{transform:translateY(-3px)}
.rg{font-size:3.2rem;margin:5px 0 5px;animation:bop .6s}
@keyframes bop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.rname{font-size:1.25rem;font-weight:900;color:#ffd166;margin-bottom:5px}
.rscore{font-size:1.85rem;font-weight:900;margin:10px 0;color:#06d6a0}
.sm{background:rgba(0,0,0,.5);border-radius:99px;height:12px;margin:8px 0 14px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.sf{height:100%;border-radius:99px;background:linear-gradient(90deg,#06d6a0,#ffd166);transition:width 1s ease;box-shadow:0 0 10px rgba(6,214,160,.6)}
.rmeme{width:160px;height:120px;object-fit:cover;border-radius:12px;margin:10px auto;display:block;border:2px solid rgba(255,255,255,.4)}
.brty{background:linear-gradient(135deg,#118ab2,#06d6a0);border:none;border-radius:12px;padding:10px 26px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:900;color:#fff;cursor:pointer;margin-top:10px;transition:transform .15s;box-shadow:0 5px 15px rgba(17,138,178,.4)}
.brty:hover{transform:translateY(-3px)}
.conf{position:fixed;pointer-events:none;z-index:9999;animation:cfl linear forwards}
@keyframes cfl{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media(max-width:480px){.ec-opts{gap:8px}.blank-btns{gap:5px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="fll" id="fll"></div>
<header>
  <h1>🌿 UNIT 3 – HEALTHY LIVING FOR TEENS</h1>
  <p class="sub">✏️ Giáo viên tạo: Ms. Chí Nên – ULIS</p>
  <div class="badge">BÀI TẬP TIẾNG ANH 9 – PHẦN BÀI TẬP</div>
</header>
<div class="pw"><div class="pb"><div class="pf" id="pf"></div></div><div class="pt" id="pt">0 / 37 câu đã trả lời</div></div>
<div class="main" id="main"></div>
<div class="ov" id="nov"><div class="mb"><h2>🎯 Nộp Bài & Xem Kết Quả</h2><p>Nhập tên của bạn nhé!</p><input class="ni" id="ni" type="text" placeholder="Ví dụ: Nguyễn Văn A..."><div class="em" id="em"></div><button class="bok" onclick="subN()">✅ Xem Kết Quả!</button></div></div>
<div class="ov" id="rov"><div class="mb"><div class="rg" id="rg">🌟</div><div class="rname" id="rname"></div><div id="rmsg" style="font-size:1rem;margin-bottom:5px;opacity:.95"></div><div class="rscore" id="rscore"></div><div class="sm"><div class="sf" id="sfi" style="width:0%"></div></div><img class="rmeme" id="rmeme" src="" alt=""><br><button class="brty" onclick="window.location.reload()">🔄 Làm Lại</button></div></div>
<script>
// FLOATERS
const EM=['🍎','🥦','💪','🏃','❤️','🌿','💧','🧘','🌱','⚡','🥑','🍋','🌞','🍓','🎽','🩺','💚','🫀'];
const fll=document.getElementById('fll');
for(let i=0;i<26;i++){const d=document.createElement('div');d.className='fi';d.textContent=EM[i%EM.length];d.style.cssText=`left:${Math.random()*100}%;font-size:${13+Math.random()*24}px;animation-duration:${9+Math.random()*14}s;animation-delay:${Math.random()*11}s`;fll.appendChild(d);}

// AUDIO
const AC=new(window.AudioContext||window.webkitAudioContext)();
function pOk(){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(520,AC.currentTime);o.frequency.exponentialRampToValueAtTime(900,AC.currentTime+.14);g.gain.setValueAtTime(.3,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.42);o.start();o.stop(AC.currentTime+.42);}
function pErr(){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(210,AC.currentTime);o.frequency.exponentialRampToValueAtTime(95,AC.currentTime+.28);g.gain.setValueAtTime(.22,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.32);o.start();o.stop(AC.currentTime+.32);}

// CONFETTI
function confetti(){const cs=['#06d6a0','#ffd166','#ef476f','#118ab2','#7209b7','#f8961e'];for(let i=0;i<48;i++){const c=document.createElement('div');c.className='conf';c.style.cssText=`left:${Math.random()*100}%;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;background:${cs[Math.floor(Math.random()*cs.length)]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.4}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),3500);}}

// STATE
let answered=0,score=0;
const TOTAL=37;// VI:10 VII:10 VIII:7 XI:10
function inc(pts){answered++;score+=pts;const p=Math.round(answered/TOTAL*100);document.getElementById('pf').style.width=p+'%';document.getElementById('pt').textContent=`${answered} / ${TOTAL} câu đã trả lời`;}

// ============================================================
// SECTION VI DATA
// ============================================================
const VI=[
  {n:1,sent:"Homework can be <span class='blank-span' id='bvi0'></span> not only for kids but for parents as well.",hint:'stress',ans:'stressful',
   ex:`<h4>📖 Giải thích chi tiết</h4>
<div class='vnt'>💬 Dịch nghĩa: "Bài tập về nhà có thể gây căng thẳng không chỉ cho trẻ em mà còn cho phụ huynh."</div>
<ol>
<li><b>Từ gốc cần xét:</b> <span class='p-word'>stress</span> <span class='p-mean'>(danh từ/động từ: sự căng thẳng, lo lắng)</span>.</li>
<li><b>Phân tích vị trí & Ngữ pháp:</b> Đứng sau động từ to be <span class='p-grammar'>can be</span>, ta cần một tính từ (Adjective) để bổ nghĩa cho chủ ngữ chỉ vật là "Homework".</li>
<li><b>Tại sao chọn <span class='hl-green'>stressful</span>?</b> <span class='hl-green'>stressful</span> mang nghĩa là "gây ra căng thẳng, áp lực". Nó được dùng để miêu tả tính chất của một sự vật hoặc tình huống (ở đây là bài tập về nhà).</li>
<li><b>Tại sao các từ khác sai?</b> <span class='hl-red'>stressed</span> cũng là tính từ nhưng mang nghĩa "bị căng thẳng", chỉ được dùng để miêu tả <b>cảm xúc của con người</b> (Ví dụ: I am stressed). <span class='hl-red'>stressfully</span> là trạng từ, không thể đứng ngay sau động từ to be trong trường hợp này.</li>
</ol>`},
  {n:2,sent:"A good night's sleep will improve your <span class='blank-span' id='bvi1'></span>.",hint:'concentrate',ans:'concentration',
   ex:`<h4>📖 Giải thích chi tiết</h4>
<div class='vnt'>💬 Dịch nghĩa: "Một giấc ngủ ngon vào ban đêm sẽ cải thiện sự tập trung của bạn."</div>
<ol>
<li><b>Từ gốc cần xét:</b> <span class='p-word'>concentrate</span> <span class='p-mean'>(động từ: tập trung)</span>.</li>
<li><b>Phân tích vị trí & Ngữ pháp:</b> Đứng ngay sau tính từ sở hữu <span class='p-grammar'>your</span> (của bạn), vị trí này bắt buộc phải là một danh từ (Noun).</li>
<li><b>Tại sao chọn <span class='hl-green'>concentration</span>?</b> Thêm hậu tố "-tion" vào động từ để tạo thành danh từ <span class='hl-green'>concentration</span> <span class='p-mean'>(sự tập trung)</span>, hoàn toàn phù hợp với ngữ cảnh cải thiện trí não.</li>
<li><b>Tại sao các từ khác sai?</b> <span class='hl-red'>concentrated</span> (tính từ/V-ed) nghĩa là cô đặc hoặc đã tập trung, <span class='hl-red'>concentrating</span> (V-ing) đang tập trung -> Cả hai đều sai từ loại khi đứng sau "your" mà không có danh từ theo sau.</li>
</ol>`},
  {n:3,sent:"If you want to lose weight, try to avoid <span class='blank-span' id='bvi2'></span> desserts like cakes or ice-cream – eat a piece of fruit instead.",hint:'fat',ans:'fattening',

    {sp:'Mom',blank:3},
    {sp:'Hoa',text:"Yes. We discussed how to set up a camp for our group and we couldn't agree on any plans."},
    {sp:'Mom',blank:4},

const viDone=new Array(10).fill(false);
const viiDone=new Array(10).fill(false);
let viiSelected = new Array(10).fill(null);
const viiiDone=new Array(7).fill(false);
const xiDone=new Array(10).fill(false);

function chkVI(i){
  if(AC.state==='suspended')AC.resume();
  if(viDone[i])return;
  const inp=document.getElementById(`vi${i}`);
  const val=inp.value.trim().toLowerCase();
  if(!val)return;
  const cor=VI[i].ans.toLowerCase();
  
  viDone[i]=true;
  inp.disabled=true;
  document.getElementById(`vibtn${i}`).disabled=true;
  
  if(val===cor){
    inp.classList.add('ok');
    pOk();confetti();inc(1);
  }else{
    inp.classList.add('bad');
    // Hiển thị đáp án đúng vào ô nếu học sinh làm sai
    inp.value = `❌ ${val} (Đúng: ${VI[i].ans})`;
    pErr();
    inc(0);
  }
  // Yêu cầu: Dù đúng hay sai cũng hiện NGAY KEY CHI TIẾT
  document.getElementById(`vix${i}`).classList.add('show');
}

// LOGIC CHỐNG LỤI PHẦN VII (Sửa theo yêu cầu: Click thẳng vào text)
function selVII(qi, oi) {
  if (viiDone[qi]) return;
  viiSelected[qi] = oi;
  for (let j = 0; j < 4; j++) {
    const uw = document.getElementById(`u${qi+1}_${j}`);
    if (j === oi) uw.classList.add('sel');
    else uw.classList.remove('sel');
  }
  const area = document.getElementById(`viiarea${qi}`);
  area.classList.add('show');
  document.getElementById(`viiinp${qi}`).focus();
}

function chkVII(qi) {
  if(AC.state==='suspended')AC.resume();
  if(viiDone[qi]) return;
  const sel = viiSelected[qi];
  if(sel === null) return; // Chưa chọn từ gạch chân nào

  const inp = document.getElementById(`viiinp${qi}`);
  const val = inp.value.trim().toLowerCase().replace(/\s+/g, ' ');
  if(!val) {
     inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad');
     setTimeout(()=>inp.classList.remove('bad'), 500);
     return;
  }

  const corIdx = VII[qi].ans;
  const validFixes = VII[qi].fix.toLowerCase().split('/').map(s => s.trim());
  const normalizedVal = val.replace(/['']/g, "'");
  const isFixCorrect = validFixes.some(f => f.replace(/['']/g, "'") === normalizedVal);

  // Khóa form ngay lập tức (Yêu cầu: làm 1 lần hiện giải luôn)
  viiDone[qi] = true;
  inp.disabled = true;
  document.getElementById(`viichk${qi}`).disabled = true;

  // Xử lý giao diện cho phần Text gạch chân
  for (let j = 0; j < 4; j++) {
    const uw = document.getElementById(`u${qi+1}_${j}`);
    uw.style.pointerEvents = 'none'; // Không cho click nữa
    uw.classList.remove('sel');
    if (j === corIdx) {
        uw.classList.add('cor'); // Bôi xanh đáp án đúng
    } else if (j === sel && sel !== corIdx) {
        uw.classList.add('wrg'); // Bôi đỏ nếu chọn sai chữ cái
    }
  }

  if (sel === corIdx && isFixCorrect) {
    // Hoàn toàn chính xác
    inp.classList.add('ok');
    pOk(); confetti(); inc(1);
  } else {
    // Sai (chọn sai chữ hoặc gõ sai từ)
    inp.classList.add('bad');
    // Bổ sung hiển thị trực tiếp đáp án đúng vào ô để học sinh thấy ngay
    const correctStr = validFixes[0];
    inp.value = `❌ Sai rồi! (Từ đúng: ${correctStr})`;
    pErr(); inc(0);
  }
  
  // LUÔN LUÔN HIỆN GIẢI THÍCH CHI TIẾT
  document.getElementById(`viix${qi}`).classList.add('show');
}

function chkVIII(idx,letter){
  if(AC.state==='suspended')AC.resume();
  if(viiiDone[idx])return;
  const cor=VANS[idx];
  const thisBtn=document.getElementById(`dob${idx}_${letter}`);
  
  viiiDone[idx]=true;
  
  ['A','B','C','D','E','F','G'].forEach(k=>{
    const b=document.getElementById(`dob${idx}_${k}`);
    if(b){
      b.disabled=true;
      if(k!==letter&&k!==cor) b.classList.add('used');
    }
  });

  if(letter===cor){
    thisBtn.classList.add('cor');
    const bfill=document.getElementById(`bfill${idx}`);
    bfill.textContent=`${letter}. ${VOPTS[letter]}`;
    bfill.classList.add('show');
    pOk();confetti();inc(1);
  }else{
    thisBtn.classList.add('wrg');
    const cb=document.getElementById(`dob${idx}_${cor}`);
    if(cb)cb.classList.add('cor');
    const bfill=document.getElementById(`bfill${idx}`);
    bfill.textContent=`✅ Đáp án đúng: ${cor}. ${VOPTS[cor]}`;
    bfill.classList.add('show');
    pErr();inc(0);
  }
  // HIỆN GIẢI THÍCH NGAY LẬP TỨC
  document.getElementById(`viiiex${idx}`).classList.add('show');
}

function revXI(i){
  if(xiDone[i])return;
  xiDone[i]=true;
  const mbox=document.getElementById(`xim${i}`);
  mbox.innerHTML=`<div class='ml'>📝 ĐÁP ÁN MẪU:</div><div style='color:#9fff5b;font-weight:800;font-size:.97rem;line-height:1.5'>${XI[i].ans}</div>`;
  mbox.classList.add('show');
  document.getElementById(`xix${i}`).classList.add('show');
  document.getElementById(`xibtn${i}`).disabled=true;
  inc(1); // Mặc định tự xem đáp án được cộng điểm (để thanh tiến độ full)
}

// ============================================================
// MODAL & RESULTS
// ============================================================
function openNov(){document.getElementById('nov').classList.add('show');document.getElementById('ni').focus();}
document.getElementById('ni').addEventListener('keydown',e=>{if(e.key==='Enter')subN();});
function subN(){
  const inp=document.getElementById('ni');const err=document.getElementById('em');
  const name=inp.value.trim();
  if(!name){inp.classList.add('ne');err.textContent='⚠️ Vui lòng nhập tên!';setTimeout(()=>inp.classList.remove('ne'),600);return;}
  err.textContent='';document.getElementById('nov').classList.remove('show');showRes(name);
}
function showRes(name){
  const pct=score/TOTAL;
  let gr,msg,gif;
  if(pct>=.9){gr='🏆';msg=`XUẤT SẮC! <b>${name}</b> giỏi quá luôn! 🎉`;gif='https://media.giphy.com/media/xT0xeJpnrWC4XWblEk/giphy.gif';}
  else if(pct>=.75){gr='🌟';msg=`Tốt lắm! <b>${name}</b> rất khá! 💪`;gif='https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif';}
  else if(pct>=.5){gr='😊';msg=`Ổn đó! <b>${name}</b> cần ôn thêm! 📚`;gif='https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif';}
  else{gr='😢';msg=`Cố gắng lên <b>${name}</b>! Đọc kỹ giải thích nhé! 🌱`;gif='https://media.giphy.com/media/ISOckXUybVfQ4/giphy.gif';}
  document.getElementById('rg').textContent=gr;
  document.getElementById('rname').textContent=name;
  document.getElementById('rmsg').innerHTML=msg;
  document.getElementById('rscore').textContent=`${score} / ${TOTAL} điểm`;
  document.getElementById('sfi').style.width=Math.round(pct*100)+'%';
  document.getElementById('rmeme').src=gif;
  document.getElementById('rov').classList.add('show');
  if(pct>=.7)confetti();
}

render();
</script>
