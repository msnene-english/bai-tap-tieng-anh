<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Philosopher:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;min-height:100vh;background:#010820;color:#e8dfc8;overflow-x:hidden}
.sky{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#010820 0%,#020c30 35%,#011428 70%,#010820 100%);z-index:-5}
.moonbeam{position:fixed;top:0;right:12%;width:180px;height:100%;background:linear-gradient(90deg,transparent 0%,rgba(255,215,0,.012) 50%,transparent 100%);z-index:-4;pointer-events:none}
.moon{position:fixed;top:4%;right:6%;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fffde7,#ffd740 55%,#f0a500);box-shadow:0 0 35px rgba(255,215,0,.65),0 0 70px rgba(255,215,0,.3),0 0 120px rgba(255,215,0,.12);z-index:0;pointer-events:none;animation:moonGl 5s ease-in-out infinite alternate}
@keyframes moonGl{from{box-shadow:0 0 35px rgba(255,215,0,.65),0 0 70px rgba(255,215,0,.3),0 0 120px rgba(255,215,0,.12)}to{box-shadow:0 0 55px rgba(255,215,0,.8),0 0 100px rgba(255,215,0,.4),0 0 160px rgba(255,215,0,.18)}}
.moon-crater{position:fixed;top:5.5%;right:8.5%;width:18px;height:18px;border-radius:50%;background:rgba(200,160,0,.3);z-index:0;pointer-events:none}
#starsCv{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-3;pointer-events:none}
.floats{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
.fobj{position:absolute;user-select:none}
@keyframes floatA{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}40%{transform:translateY(-22px) rotate(7deg) scale(1.04)}80%{transform:translateY(8px) rotate(-5deg) scale(.97)}}
@keyframes floatB{0%,100%{transform:translateY(0) rotate(0deg)}30%{transform:translateY(-16px) rotate(-6deg)}70%{transform:translateY(12px) rotate(4deg)}}
@keyframes floatC{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-28px) scale(1.08)}}
.pbar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#ffd700,#ff8c00,#ffd700);z-index:60;transition:width .55s ease;box-shadow:0 0 10px rgba(255,215,0,.7)}
.header{text-align:center;padding:12px 18px 9px;background:rgba(1,8,32,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,215,0,.12);position:sticky;top:0;z-index:40}
.header h1{font-family:'Philosopher',serif;font-size:1.08rem;font-weight:700;background:linear-gradient(90deg,#ffd700,#fff8e1,#ff8c00,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px}
.header p{font-size:.67rem;color:rgba(232,223,200,.3);margin-top:2px}
.container{max-width:880px;margin:0 auto;padding:20px 14px 150px;position:relative;z-index:1}
.sec-hdr{margin:28px 0 16px;padding:14px 20px;background:rgba(255,215,0,.04);border:1px solid rgba(255,215,0,.2);border-radius:16px;position:relative;overflow:hidden}
.sec-hdr::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#ffd700,#ff8c00,#ffd700)}
.sec-title{font-family:'Philosopher',serif;font-size:.9rem;color:#ffd700;font-weight:700;margin-bottom:4px;letter-spacing:.3px}
.sec-desc{font-size:.77rem;color:rgba(232,223,200,.5);font-style:italic}
/* ===== CARDS ===== */
.qcard{background:rgba(1,8,32,.62);backdrop-filter:blur(16px);border:1px solid rgba(255,215,0,.1);border-radius:20px;padding:20px;margin-bottom:20px;position:relative;overflow:hidden}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ffd700,#ff8c00,#ffd700)}
.qbadge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.22);color:#ffd700;font-weight:800;font-size:.72rem;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:.2px}
.qtext{font-size:.97rem;font-weight:700;color:#ddd0b0;line-height:1.65;margin-bottom:14px;padding:9px 13px;background:rgba(0,5,20,.3);border-left:3px solid #ffd700;border-radius:0 10px 10px 0}
.qtext u{text-decoration:underline;text-decoration-color:#ff8c00;color:#ffcc66;font-weight:800}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:560px){.opts-grid{grid-template-columns:1fr}}
.opt-btn{background:rgba(1,8,32,.45);border:2px solid rgba(255,215,0,.12);border-radius:14px;padding:11px 13px;color:#c8bc9a;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:left;line-height:1.5;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.opt-btn:hover:not(:disabled){transform:scale(1.03) translateY(-2px);background:rgba(255,215,0,.07);border-color:rgba(255,215,0,.35);color:#fff8e1}
.opt-btn.correct{background:rgba(0,220,100,.15)!important;border-color:#00dc64!important;color:#7dffaa!important;box-shadow:0 0 16px rgba(0,220,100,.3)!important}
.opt-btn.wrong{background:rgba(255,60,80,.12)!important;border-color:#ff3c50!important;color:#ffb3bc!important}
.opt-btn:disabled{cursor:not-allowed;opacity:.9}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.opt-btn.shake{animation:shake .45s ease}
/* ===== EXPLANATION ===== */
.expl{background:rgba(0,5,20,.3);border:1px solid rgba(255,215,0,.12);border-radius:12px;padding:14px 16px;margin-top:12px;display:none;font-size:.87rem;line-height:1.8;color:#b0a888}
.expl.show{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.etitle{font-size:.88rem;font-weight:800;color:#ffd700;margin-bottom:11px;display:flex;align-items:center;gap:6px}
.step{margin-bottom:10px;padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04)}
.slabel{display:block;font-weight:800;font-size:.73rem;color:#ff8c00;margin-bottom:5px;letter-spacing:.3px}
/* Required CSS classes */
.p-word{color:#64d8ff;font-weight:700}
.p-mean{color:#ff9a66;font-weight:600}
.p-grammar{color:#ffd700;text-decoration:underline;text-decoration-color:#ff8c00;font-weight:700}
.hl-green{color:#00ff88;font-weight:800}
.hl-red{color:#ff5577;text-decoration:line-through;font-weight:600}
.wt{display:inline-block;background:rgba(100,216,255,.1);border:1px solid rgba(100,216,255,.2);color:#80e8ff;font-size:.63rem;font-weight:700;padding:0 5px;border-radius:10px;margin-left:2px;vertical-align:middle}
.vi{display:block;background:rgba(255,200,0,.07);border-left:3px solid #ffd700;padding:6px 10px;border-radius:0 7px 7px 0;color:#ffe690;font-weight:700;margin:4px 0;font-size:.85rem}
/* ===== TYPE-IN (Section IV) ===== */
.tc{background:rgba(1,8,32,.62);backdrop-filter:blur(16px);border:1px solid rgba(255,140,0,.12);border-radius:18px;padding:18px;margin-bottom:18px;position:relative}
.tc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff8c00,#ffd700,#ff8c00);border-radius:18px 18px 0 0}
.q-sent{font-size:.93rem;font-weight:700;color:#ddd0b0;line-height:1.65;margin-bottom:8px;padding:10px 13px;background:rgba(0,5,20,.3);border-left:3px solid #ff8c00;border-radius:0 10px 10px 0}
.q-hint{font-size:.78rem;color:rgba(232,223,200,.5);font-style:italic;margin-bottom:8px}
.tinp{width:100%;background:rgba(0,5,20,.45);border:2px solid rgba(255,215,0,.15);border-radius:10px;padding:10px 13px;color:#e8dfc8;font-family:'Nunito',sans-serif;font-size:.9rem;outline:none;transition:border-color .3s}
.tinp:focus{border-color:rgba(255,215,0,.45);box-shadow:0 0 10px rgba(255,215,0,.1)}
.tinp.ok{border-color:#00dc64;background:rgba(0,220,100,.04)}
.tinp.bad{border-color:#ff3c50;background:rgba(255,60,80,.04)}
.tinp:disabled{cursor:not-allowed;opacity:.85}
.ckbtn{background:linear-gradient(135deg,#ff8c00,#ffd700);border:none;border-radius:50px;padding:8px 22px;color:#010820;font-family:'Nunito',sans-serif;font-size:.83rem;font-weight:800;cursor:pointer;margin-top:8px;transition:transform .2s;box-shadow:0 3px 12px rgba(255,140,0,.35)}
.ckbtn:hover{transform:scale(1.04)}
.ckbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.mbox-ans{display:none;margin-top:10px;padding:10px 13px;background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.18);border-radius:10px;font-size:.86rem;color:#e0cc80;line-height:1.65}
.mbox-ans.show{display:block;animation:fadeUp .3s ease}
.mbl{font-weight:800;color:#ffd700;font-size:.73rem;display:block;margin-bottom:5px;letter-spacing:.3px}
/* ===== REMINDER ===== */
.reminder{position:fixed;bottom:14px;right:12px;width:256px;z-index:100;animation:remMoon 3s ease-in-out infinite alternate}
@keyframes remMoon{from{filter:drop-shadow(0 0 8px rgba(255,215,0,.4))}to{filter:drop-shadow(0 0 22px rgba(255,140,0,.55))}}
.rem-in{background:rgba(1,8,32,.95);backdrop-filter:blur(12px);border:2px solid rgba(255,215,0,.25);border-radius:16px;padding:12px;position:relative}
.rem-icons{display:flex;gap:6px;margin-bottom:6px}
.ri{font-size:1rem;animation:bob 2.3s ease-in-out infinite}.ri:nth-child(2){animation-delay:.25s}.ri:nth-child(3){animation-delay:.5s}.ri:nth-child(4){animation-delay:.75s}.ri:nth-child(5){animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rem-title{font-family:'Philosopher',serif;font-size:.72rem;color:#ffd700;margin-bottom:5px;text-shadow:0 0 8px rgba(255,215,0,.5)}
.rem-msg{font-size:.7rem;color:rgba(232,223,200,.82);line-height:1.55;min-height:58px;transition:opacity .4s}

.rem-dots{display:flex;gap:4px;margin-top:7px;justify-content:center}
.rdot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.12);transition:background .4s}
.rdot.active{background:#ffd700}
/* ===== SUBMIT ===== */
.sub-area{text-align:center;padding:24px 14px}
.sub-btn{background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:50px;padding:14px 40px;color:#010820;font-family:'Philosopher',serif;font-size:.92rem;font-weight:700;cursor:pointer;letter-spacing:.8px;box-shadow:0 8px 28px rgba(255,215,0,.4);animation:sbMoon 3s ease-in-out infinite;transition:transform .25s}
@keyframes sbMoon{0%,100%{box-shadow:0 8px 28px rgba(255,215,0,.4)}50%{box-shadow:0 8px 45px rgba(255,140,0,.6),0 0 40px rgba(255,215,0,.25)}}
.sub-btn:hover{transform:scale(1.06) translateY(-3px)}
/* ===== MODALS ===== */
.moverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center}
.moverlay.show{display:flex}
.mboxm{background:linear-gradient(160deg,rgba(1,8,32,.97),rgba(2,12,40,.97));border:2px solid rgba(255,215,0,.3);border-radius:24px;padding:30px 26px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(255,215,0,.25);animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.mboxm h2{font-family:'Philosopher',serif;font-size:1.15rem;background:linear-gradient(90deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.mboxm p{color:rgba(232,223,200,.55);margin-bottom:14px;font-size:.86rem}
.minputm{width:100%;background:rgba(0,5,20,.5);border:2px solid rgba(255,215,0,.2);border-radius:12px;padding:11px 14px;color:#e8dfc8;font-family:'Nunito',sans-serif;font-size:.93rem;margin-bottom:7px;outline:none;transition:border-color .3s}
.minputm:focus{border-color:#ffd700}
.minputm.err{border-color:#ff3c50;animation:shake .45s ease}
.mbtnm{background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:50px;padding:11px 28px;color:#010820;font-family:'Nunito',sans-serif;font-size:.93rem;font-weight:800;cursor:pointer;transition:transform .2s;margin-top:4px}
.mbtnm:hover{transform:scale(1.04)}
.errmsgm{color:#ff3c50;font-size:.75rem;margin:-4px 0 8px;display:none}
.rgreet{font-family:'Philosopher',serif;font-size:1rem;color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.5);margin-bottom:7px;line-height:1.4}
.rscore{font-size:2.7rem;font-weight:900;background:linear-gradient(90deg,#ffd700,#ff8c00,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0 3px}
.r10{font-size:.92rem;color:#c8bc9a;margin-bottom:12px;font-weight:700}
.rgif{width:190px;height:140px;object-fit:cover;border-radius:12px;margin:7px auto 10px;display:block;border:2px solid rgba(255,215,0,.22)}
.rmsg{color:rgba(232,223,200,.62);font-size:.83rem;line-height:1.5;margin-bottom:12px}
.rbtn{background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:50px;padding:11px 28px;color:#010820;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:900;cursor:pointer;transition:transform .2s}
.rbtn:hover{transform:scale(1.04)}
</style>

<script>
// ============================================================
//  4-STEP EXPLANATION BUILDER
// ============================================================
function s4(viet,opts,corr,wrong){
  return `<div class="step"><span class="slabel">1️⃣ DỊCH CÂU:</span><span class="vi">${viet}</span></div>
<div class="step"><span class="slabel">2️⃣ PHÂN TÍCH 4 ĐÁP ÁN:</span>${opts}</div>
<div class="step"><span class="slabel">3️⃣ TẠI SAO ĐÚNG:</span>${corr}</div>
<div class="step"><span class="slabel">4️⃣ TẠI SAO SAI:</span>${wrong}</div>`;
}

// ============================================================
//  SECTION I — PRONUNCIATION
// ============================================================
const SEC1={label:'I. PRONUNCIATION — Underlined Part Sounds Differently',desc:"Choose the word whose underlined part is pronounced differently from the others.",icon:'🔤',
questions:[
  {id:1,q:'a. r<u>oa</u>d &nbsp;&nbsp; b. br<u>oa</u>d &nbsp;&nbsp; c. g<u>oa</u>l &nbsp;&nbsp; d. s<u>oa</u>p',
   opts:[{h:'a. r<u>oa</u>d',c:false},{h:'b. br<u>oa</u>d',c:true},{h:'c. g<u>oa</u>l',c:false},{h:'d. s<u>oa</u>p',c:false}],
   expl:s4('Chọn từ có phần "oa" gạch chân phát âm KHÁC với các từ còn lại.',
     `<p>• <span class="p-word">road</span> /roʊd/ → "oa" = <span class="p-mean">/oʊ/</span></p>
     <p>• <span class="p-word">broad</span> /brɔːd/ → "oa" = <span class="p-mean">/ɔː/</span> ← KHÁC</p>
     <p>• <span class="p-word">goal</span> /ɡoʊl/ → "oa" = <span class="p-mean">/oʊ/</span></p>
     <p>• <span class="p-word">soap</span> /soʊp/ → "oa" = <span class="p-mean">/oʊ/</span></p>`,
     `<p><span class="hl-green">broad</span>: "oa" đọc là <span class="p-grammar">/ɔː/</span> (âm dài, tương tự "aw" trong "law"). Ba từ còn lại: "oa" đọc là <span class="p-grammar">/oʊ/</span> (âm đôi, tương tự "o" trong "go").</p>`,
     `<p><span class="hl-red">road/goal/soap</span>: Đều có "oa" = <span class="p-grammar">/oʊ/</span>. Chỉ có "broad" mới có "oa" = /ɔː/ — ngoại lệ đặc biệt cần nhớ!</p>`)},
  {id:2,q:'a. cr<u>ow</u>n &nbsp;&nbsp; b. sh<u>ow</u> &nbsp;&nbsp; c. bl<u>ow</u> &nbsp;&nbsp; d. shad<u>ow</u>',
   opts:[{h:'a. cr<u>ow</u>n',c:true},{h:'b. sh<u>ow</u>',c:false},{h:'c. bl<u>ow</u>',c:false},{h:'d. shad<u>ow</u>',c:false}],
   expl:s4('Chọn từ có phần "ow" gạch chân phát âm KHÁC với các từ còn lại.',
     `<p>• <span class="p-word">crown</span> /kraʊn/ → "ow" = <span class="p-mean">/aʊ/</span> ← KHÁC</p>
     <p>• <span class="p-word">show</span> /ʃoʊ/ → "ow" = <span class="p-mean">/oʊ/</span></p>
     <p>• <span class="p-word">blow</span> /bloʊ/ → "ow" = <span class="p-mean">/oʊ/</span></p>
     <p>• <span class="p-word">shadow</span> /ˈʃædoʊ/ → "ow" = <span class="p-mean">/oʊ/</span></p>`,
     `<p><span class="hl-green">crown</span>: "ow" đọc là <span class="p-grammar">/aʊ/</span> (âm đôi "au"). Ba từ còn lại: "ow" đọc là <span class="p-grammar">/oʊ/</span>.</p>
     <p>💡 Quy tắc: "ow" trước phụ âm như n/l thường = /aʊ/ (town, gown, howl), nhưng cuối từ hoặc trước một số phụ âm = /oʊ/ (show, blow).</p>`,
     `<p><span class="hl-red">show/blow/shadow</span>: "ow" = /oʊ/ — giống nhau. Chỉ "crown" có "ow" = /aʊ/.</p>`)},

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function norm(s){return s.toLowerCase().trim().replace(/[.!?,;:'"]/g,'').replace(/\s+/g,' ').trim()}

function initStars(){
  const cv=document.getElementById('starsCv');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const stars=Array.from({length:180},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height*.75,
    r:Math.random()*1.4+.3,al:Math.random(),sp:Math.random()*.018+.005,dir:1,
    col:`rgba(${220+Math.floor(Math.random()*35)},${200+Math.floor(Math.random()*35)},${180+Math.floor(Math.random()*50)},`
  }));
  const draw=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    stars.forEach(s=>{s.al+=s.sp*s.dir;if(s.al>=1||s.al<=0)s.dir*=-1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=s.col+Math.abs(s.al)+')';ctx.fill()});
    requestAnimationFrame(draw);
  };draw();
  window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight});
}

// ============================================================
//  AUDIO
// ============================================================
let aCtx;
function getACtx(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();return aCtx}
function playCorrect(){try{const c=getACtx();[[523,.05],[659,.2],[784,.32],[1047,.44]].forEach(([f,t])=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.24,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.36);o.start(c.currentTime+t);o.stop(c.currentTime+t+.4)});}catch(e){}}
function playWrong(){try{const a=document.getElementById('wrongAudio');a.currentTime=0;a.play().catch(()=>{})}catch(e){}}

// ============================================================
//  CONFETTI
// ============================================================
function doConfetti(){
  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999';
  document.body.appendChild(cv);const ctx=cv.getContext('2d');cv.width=window.innerWidth;cv.height=window.innerHeight;
  const cols=['#ffd700','#ff8c00','#fff8e1','#ff6b35','#fffde7','#ffcc02'];
  const ps=Array.from({length:70},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height,w:Math.random()*10+4,h:Math.random()*5+2,c:cols[Math.floor(Math.random()*cols.length)],sp:Math.random()*3+1.5,ang:Math.random()*Math.PI*2,rot:Math.random()*.2-.1,vx:Math.random()*2-1}));
  let fr=0;const an=()=>{ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.sp;p.x+=p.vx;p.ang+=p.rot;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(++fr<145)requestAnimationFrame(an);else cv.remove()};an();
}

// ============================================================
//  PROGRESS
// ============================================================
function updatePbar(){document.getElementById('pbar').style.width=((Object.keys(answers).length/MCQ_TOTAL)*100)+'%'}

// ============================================================
//  RENDER MCQ SECTIONS
// ============================================================
function renderMCQSec(container,sec,prefix){
  const sh=document.createElement('div');sh.className='sec-hdr';
  sh.innerHTML=`<div class="sec-title">${sec.icon} ${sec.label}</div><div class="sec-desc">${sec.desc}</div>`;
  container.appendChild(sh);
  sec.questions.forEach((q,qi)=>{
    const gid=prefix+'_'+qi;
    const sOpts=shuffle(q.opts);optsMaps[gid]=sOpts;
    const card=document.createElement('div');card.className='qcard';
    card.innerHTML=`<div class="qbadge">${sec.icon} Câu ${q.id}</div>
    <div class="qtext">${q.q}</div>
    <div class="opts-grid" id="og_${gid}">${sOpts.map((o,oi)=>`<button class="opt-btn" id="ob_${gid}_${oi}" onclick="pickMCQ('${gid}',${oi})">${o.h}</button>`).join('')}</div>
    <div class="expl" id="ex_${gid}"><div class="etitle">🌕 GIẢI THÍCH CHI TIẾT (4 BƯỚC)</div>${q.expl}</div>`;
    container.appendChild(card);
  });
}

function pickMCQ(gid,oi){
  if(answers[gid]!==undefined)return;
  const ok=optsMaps[gid][oi].c;answers[gid]=ok;
  document.querySelectorAll(`[id^="ob_${gid}_"]`).forEach((b,i)=>{b.disabled=true;if(optsMaps[gid][i].c)b.classList.add('correct')});
  const btn=document.getElementById('ob_'+gid+'_'+oi);
  if(ok){doConfetti();playCorrect();}else{btn.classList.add('wrong','shake');setTimeout(()=>btn.classList.remove('shake'),460);playWrong();}
  document.getElementById('ex_'+gid).classList.add('show');
  updatePbar();
}

// ============================================================
//  RENDER SECTION IV — VERB FORMS
// ============================================================
function renderSec4(container){
  const sh=document.createElement('div');sh.className='sec-hdr';
  sh.innerHTML=`<div class="sec-title">✍️ IV. VERB FORMS — Write the correct form or tense</div>
  <div class="sec-desc">Write the correct form or tense of the verbs in brackets.</div>`;
  container.appendChild(sh);
  SEC4.forEach((q,qi)=>{
    const gid='iv_'+qi;
    const card=document.createElement('div');card.className='tc';
    card.innerHTML=`<div class="qbadge">✍️ Câu ${q.id}</div>
    <div class="q-sent">${q.sent}</div>
    <input class="tinp" id="ti_${gid}" placeholder="Gõ dạng đúng của động từ..." style="min-height:42px;padding:9px 13px">
    <button class="ckbtn" id="cb_${gid}" onclick="checkIV('${gid}',${qi})">🌕 Kiểm tra</button>
    <div class="mbox-ans" id="mb_${gid}">
      <span class="mbl">✅ ĐÁP ÁN ĐÚNG:</span>
      <span class="hl-green" style="font-weight:800">${q.model}</span>
      <div style="margin-top:8px">${q.expl}</div>
    </div>`;
    container.appendChild(card);
  });
}

function checkIV(gid,qi){
  const q=SEC4[qi];const inp=document.getElementById('ti_'+gid);const btn=document.getElementById('cb_'+gid);const mb=document.getElementById('mb_'+gid);
  if(!inp.value.trim()){inp.style.borderColor='#ff3c50';return;}
  const ok=q.ans.includes(norm(inp.value));
  inp.classList.remove('ok','bad');inp.classList.add(ok?'ok':'bad');
  inp.disabled=true;btn.disabled=true;
  if(ok){doConfetti();playCorrect();}else{inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),460);playWrong();}
  mb.classList.add('show');typeAns[gid]=ok;
}

// ============================================================
//  REMINDER
// ============================================================
const remMsgs=['🌕 <b>Đọc kỹ 4 bước giải thích</b> sau mỗi câu và <b>ghi từ vựng/ngữ pháp vào vở</b>. Làm xong không đọc giải thích = lãng phí! 🏮','⭐ Bí quyết tiến bộ thực sự: <b>Làm → Đọc giải thích → Ghi vở → Ôn lại</b>. Thiếu bước ghi chép = không nhớ được! 🦋','🌸 Mỗi cấu trúc ngữ pháp và từ vựng bạn ghi hôm nay = <b>nền tảng vững chắc cho kỳ thi sau</b>! ✨'];
let remI=0;
function initReminder(){
  const dots=document.getElementById('remDots');dots.innerHTML=remMsgs.map((_,i)=>`<div class="rdot${i===0?' active':''}" id="rd${i}"></div>`).join('');
  document.getElementById('remMsg').innerHTML=remMsgs[0];
  setInterval(()=>{document.getElementById('remMsg').style.opacity='0';setTimeout(()=>{remI=(remI+1)%remMsgs.length;document.getElementById('remMsg').innerHTML=remMsgs[remI];document.getElementById('remMsg').style.opacity='1';remMsgs.forEach((_,i)=>document.getElementById('rd'+i).classList.toggle('active',i===remI));},420);},6200);
}

// ============================================================
//  SUBMIT
// ============================================================
function openName(){document.getElementById('nameModal').classList.add('show');setTimeout(()=>document.getElementById('nameIn').focus(),100)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('nameModal').classList.contains('show'))doSubmit()});
function doSubmit(){
  const nm=document.getElementById('nameIn').value.trim();
  if(!nm){const inp=document.getElementById('nameIn');inp.classList.add('err');document.getElementById('nameErr').style.display='block';setTimeout(()=>inp.classList.remove('err'),460);return;}
  document.getElementById('nameModal').classList.remove('show');showResult(nm);
}
function showResult(nm){
  const mcqSc=Object.values(answers).filter(Boolean).length;
  const typeSc=Object.values(typeAns).filter(Boolean).length;
  const sc=mcqSc+typeSc;const tot=MCQ_TOTAL+SEC4.length;
  const pct=sc/tot;const s10=((pct)*10).toFixed(1);
  let greet,msg,gif;
  if(pct===1){greet=`🌕 ${nm} — TRĂNG RẰNG SÁNG NHẤT!`;msg='Hoàn hảo tuyệt đối! Bạn là ngôi sao sáng nhất đêm rằm này! Tiếp tục tỏa sáng nhé! 🏮';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=.8){greet=`⭐ ${nm} — XUẤT SẮC!`;msg='Kết quả rất ấn tượng! Đọc lại giải thích những câu chưa đúng và ghi chép để lần sau perfect nhé! 🌸';gif='https://media.giphy.com/media/3o7TKnCdBx5cwCqRao/giphy.gif';}
  else if(pct>=.6){greet=`🌸 ${nm} — ĐANG TIẾN BỘ!`;msg='Không tệ! Hãy đọc kỹ từng bước giải thích và ghi chép đầy đủ. Ánh trăng sẽ sáng hơn! 💫';gif='https://media.giphy.com/media/xT9IgG50Lg7russbW8/giphy.gif';}
  else{greet=`🏮 ${nm} — CỐ LÊN!`;msg='Đừng nản lòng! Đọc THẬT KỸ từng bước giải thích, ghi chép cẩn thận rồi thử lại. Bạn chắc chắn làm được! ✨';gif='https://media.giphy.com/media/26ufnwz3wDUli7GU0/giphy.gif';}
  document.getElementById('rg').innerHTML=greet;document.getElementById('rs').textContent=`${sc}/${tot}`;
  document.getElementById('r10').innerHTML=`Điểm quy đổi: <strong>${s10} / 10 điểm</strong>`;
  document.getElementById('rm').textContent=msg;document.getElementById('rgif').src=gif;
  document.getElementById('resModal').classList.add('show');
}
function replay(){
  document.getElementById('resModal').classList.remove('show');document.getElementById('nameIn').value='';document.getElementById('nameErr').style.display='none';
  answers={};optsMaps={};typeAns={};
  renderAll();window.scrollTo({top:0,behavior:'smooth'});
}

// ============================================================
//  INTRO AUDIO
// ============================================================
function tryIntro(){const a=document.getElementById('introAudio');a.play().catch(()=>{const go=()=>{a.play().catch(()=>{});document.removeEventListener('click',go);document.removeEventListener('touchstart',go)};document.addEventListener('click',go,{once:true});document.addEventListener('touchstart',go,{once:true})});}

// ============================================================
//  RENDER ALL
// ============================================================
function renderAll(){
  const main=document.getElementById('mainDiv');main.innerHTML='';updatePbar();
  renderMCQSec(main,SEC1,'s1');
  renderMCQSec(main,SEC2,'s2');
  renderMCQSec(main,SEC3,'s3');
  renderSec4(main);
}
window.addEventListener('load',()=>{initStars();initFloats();initReminder();renderAll();setTimeout(tryIntro,700)});
</script>
