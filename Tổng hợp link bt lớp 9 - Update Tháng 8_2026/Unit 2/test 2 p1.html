<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2 · City Life — TEST 2</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#ff5e6c; --amber:#f59e0b; --pur:#8b5cf6; --pink:#ff7eb3; --gold:#ffd36b;
  --green:#12b76a; --wrong:#ef4444; --blue:#2563eb; --purpleT:#6a3fd6; --terra:#b4530f; --grammar:#e11d48; --ink:#3a2233;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
  background:linear-gradient(-45deg,#ff9a56,#ff5e8a,#a86cf0,#ffd36b,#ff7e5f);
  background-size:400% 400%; animation:bgmove 20s ease infinite; overflow-x:hidden;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.sun{position:fixed;top:8%;left:50%;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,#fff3c4,#ffd36b 55%,rgba(255,158,86,0));z-index:0;pointer-events:none;opacity:.85;filter:blur(2px)}
.skyline{position:fixed;left:0;bottom:0;width:100%;height:170px;z-index:0;pointer-events:none;opacity:.92}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaties span{position:absolute;font-size:2rem;opacity:.5;animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 80px}
.head{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:#fffaf3;border:2px solid var(--coral);color:var(--coral);font-weight:800;font-size:.8rem;padding:5px 14px;border-radius:20px;box-shadow:0 4px 12px rgba(120,40,60,.2)}
.title{margin-top:12px;font-family:'Fredoka';font-weight:700;font-size:2.1rem;color:#fff;letter-spacing:1px;text-shadow:0 3px 0 #d94a6a,0 6px 16px rgba(120,20,60,.4)}
.sub{display:inline-block;margin-top:6px;background:#fffaf3;border:2px solid var(--pur);border-radius:12px;padding:3px 12px;font-weight:800;color:var(--pur)}
.progbar{height:14px;background:#fffaf3;border:2px solid var(--coral);border-radius:20px;margin:16px 0;overflow:hidden}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--gold));transition:width .4s}
.sec{margin:26px 0 12px;background:linear-gradient(135deg,#5a2a5e,#9d3f6e);color:#fff;border-radius:14px;padding:10px 16px;font-family:'Fredoka';font-weight:600;font-size:1.05rem;box-shadow:0 6px 16px rgba(90,42,94,.4)}
.card{background:#fffaf3;border:2px solid #ffd9c9;border-radius:18px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 8px 22px rgba(150,60,80,.2)}
.qnum{display:inline-block;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;font-family:'Fredoka';font-weight:700;border-radius:11px;padding:2px 10px;font-size:.85rem;margin-right:8px}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.5;display:inline}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px}
.hint{font-size:.85rem;color:#a15a2a;font-weight:800;margin-top:8px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid #ffcdb8;border-radius:14px;padding:13px 12px;font-family:'Nunito';font-size:1.08rem;font-weight:800;color:#8a3b2a;cursor:pointer;box-shadow:0 5px 0 #ffddcf;transition:transform .12s;text-align:center}
.opt:nth-child(2n){background:#f5f0ff;border-color:#d9c9f7;box-shadow:0 5px 0 #e5daf9;color:#5a3b9e}
.opt:hover:not(:disabled){transform:scale(1.04)}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green)!important;border-color:#0a8a4f!important;color:#fff!important;box-shadow:0 5px 0 #0a8a4f!important}
.opt.wrong{background:var(--wrong)!important;border-color:#b91c1c!important;color:#fff!important;box-shadow:0 5px 0 #b91c1c!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.tin{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tin input{flex:1;min-width:180px;font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:11px 14px;border-radius:12px;border:2px solid #ffcdb8;background:#fffdfb;color:var(--ink)}
.tin input:focus{outline:none;border-color:var(--coral)}
.tin input.ok{border-color:var(--green);background:#e7fff1}
.tin input.no{border-color:var(--wrong);background:#ffecee}
.btnc{background:linear-gradient(135deg,var(--pur),var(--coral));color:#fff;border:none;border-radius:12px;padding:11px 20px;font-family:'Fredoka';font-weight:600;font-size:1rem;cursor:pointer;box-shadow:0 5px 0 #6a3bb0;transition:transform .12s}
.btnc:hover:not(:disabled){transform:scale(1.05)} .btnc:disabled{opacity:.55;cursor:default}
.letters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lbtn{width:48px;height:48px;border-radius:12px;border:2px solid #ffcdb8;font-family:'Fredoka';font-weight:700;font-size:1.15rem;cursor:pointer;background:#fff3e6;color:var(--coral);box-shadow:0 4px 0 #ffddcf;transition:transform .12s}
.lbtn:hover:not(:disabled){transform:scale(1.08)}
.lbtn.sel{background:var(--gold);color:#7a5a00}
.lbtn.correct{background:var(--green);color:#fff;border-color:#0a8a4f}
.lbtn.wrong{background:var(--wrong);color:#fff;border-color:#b91c1c}
.lbtn:disabled{cursor:default}
.mark{background:#ffe9c7;border-radius:6px;padding:0 4px;font-weight:800}
.mark sup{color:var(--coral);font-family:'Fredoka';font-size:.7rem}
.exp{margin-top:14px;max-height:0;overflow:hidden;transition:max-height .5s ease;font-size:1rem}
.exp.open{max-height:1700px}
.expin{background:#fffdf8;border:2px dashed #f0c9b0;border-radius:12px;padding:14px}
.exp ol{margin:6px 0 0 20px} .exp li{margin:8px 0;line-height:1.55}
.vnt{background:#fff2e0;border-left:5px solid var(--terra);border-radius:10px;padding:8px 12px;font-weight:800;color:#7a3e00;margin-bottom:8px}
.arr{background:#fbf5ff;border:2px solid #e4d4fb;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:1.02rem;font-weight:600;line-height:1.55}
.arr .ln{margin:6px 0}
.arr b.lt{color:var(--coral)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0}
.grid2>div{line-height:1.5}
.p-word{color:var(--blue);font-weight:800}
.hl-green{color:#088a3c;font-weight:900}
.hl-red{color:var(--wrong);font-weight:900}
.wt{background:#ece3ff;color:var(--purpleT);border-radius:6px;padding:0 6px;font-size:.78rem;font-weight:800}
.p-phonetic{color:var(--purpleT);background:#f0e9ff;border-radius:6px;padding:0 6px;font-weight:700}
.p-mean{color:var(--terra);font-weight:800}
.p-grammar{border-bottom:2.5px solid var(--grammar);color:#7a1030;font-weight:800}
.keyline{background:#e7fff1;border:2px solid #a7e0bd;border-radius:10px;padding:8px 12px;font-weight:800;color:#066b34;margin-bottom:8px}
.submit{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,var(--coral),var(--pur));color:#fff;border:none;border-radius:18px;padding:18px;font-family:'Fredoka';font-weight:700;font-size:1.25rem;cursor:pointer;box-shadow:0 8px 0 #b03a52}
.submit:hover{transform:scale(1.02)}
.overlay{position:fixed;inset:0;background:rgba(60,20,40,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fffaf3;border:2px solid var(--coral);border-radius:22px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Fredoka';font-weight:700;font-size:1.4rem;color:var(--coral);margin-bottom:12px}
.modal input{width:100%;padding:14px;border-radius:12px;border:2px solid #ffcdb8;font-size:1.05rem;font-family:'Nunito';font-weight:700;margin-bottom:6px}
.modal input.err{border-color:var(--wrong);background:#ffecee}
.errmsg{color:var(--wrong);font-weight:800;font-size:.9rem;min-height:20px;margin-bottom:8px}
.modal button{background:linear-gradient(135deg,var(--coral),var(--pur));color:#fff;border:none;border-radius:12px;padding:12px 26px;font-family:'Fredoka';font-weight:700;font-size:1.1rem;cursor:pointer;box-shadow:0 5px 0 #b03a52}
.rgreet{font-family:'Fredoka';font-weight:700;font-size:1.35rem;color:var(--coral);line-height:1.35}
.rscore{font-family:'Fredoka';font-weight:700;font-size:2.3rem;color:var(--ink);margin:8px 0}
.rten{font-size:1.5rem;font-weight:900;color:var(--pur);margin-bottom:12px}
.rmeme{width:100%;max-width:280px;border-radius:14px;margin:0 auto 14px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2);min-height:120px;object-fit:cover}
.memefall{font-size:5rem}
@media(max-width:560px){.opts,.grid2{grid-template-columns:1fr}.title{font-size:1.6rem}}
</style>
</head>
<body>

<script>
(function(){
  const ico=['🌇','🏙️','🚇','🚕','🌆','🏢','🌉','🚋','🛴','🗼','🌃','🚦'];
  const f=document.getElementById('floaties');
  for(let i=0;i<15;i++){const s=document.createElement('span');
    s.textContent=ico[i%ico.length];s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(15+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(1.5+Math.random()*1.6)+'rem';f.appendChild(s);}
})();
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=i?1318:988;o.connect(g);g.connect(c.destination);
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);
  g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.4);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function confetti(){const cols=['#ff5e6c','#f59e0b','#8b5cf6','#ff7eb3','#ffd36b','#12b76a'];
  for(let i=0;i<70;i++){const d=document.createElement('div');
    d.style.cssText='position:fixed;z-index:99;width:10px;height:14px;top:-20px;pointer-events:none;border-radius:2px;';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1500+Math.random()*1500,x=(Math.random()-.5)*300;
    d.animate([{transform:d.style.transform,opacity:1},
      {transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:0}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[.,?!;:'"’\-]/g,' ').replace(/\s+/g,' ').trim();}
function matchWriting(input,answers){const ni=norm(input);if(!ni)return false;
  for(const a of answers){const na=norm(a);if(ni===na)return true;
    if(na.includes(ni)&&ni.length>=na.length*0.5)return true;if(ni.includes(na))return true;}return false;}
let TOTAL=0,correctCount=0,answered=0;
function updateProg(){document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';}

/* ============================================================
   DATA — Unit 2 · CITY LIFE · TEST 2 · A(I–VII) + C(I–III)
   ============================================================ */
const Q=[];
function sec(t){Q.push({sec:t});}
function mcq(num,q,opts,correctIdx,exp){Q.push({type:'mcq',num,q,opts,correctIdx,exp});}
function txt(num,q,ans,exp,hint){Q.push({type:'txt',num,q,ans,exp,hint});}
function cor(num,q,parts,cIdx,corr,exp){Q.push({type:'cor',num,q,parts,cIdx,corr,exp});}

/* ---------- A. I. Pronunciation ---------- */
sec("A. LANGUAGE FOCUS · I. Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại");
mcq(1,"Chọn từ có phần gạch chân được phát âm khác:",
 ["undergr<u>ou</u>nd","danger<u>ou</u>s","h<u>ou</u>r","overcr<u>ow</u>ded"],1,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "ou/ow" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>underground</span> <span class='p-phonetic'>/ˌʌndəˈɡraʊnd/</span> = <span class='p-mean'>tàu điện ngầm</span> → /aʊ/</div>
 <div><span class='hl-green'>dangerous</span> <span class='p-phonetic'>/ˈdeɪndʒərəs/</span> = <span class='p-mean'>nguy hiểm</span> → /ə/</div>
 <div><span class='p-word'>hour</span> <span class='p-phonetic'>/aʊə/</span> = <span class='p-mean'>giờ</span> → /aʊ/</div>
 <div><span class='p-word'>overcrowded</span> <span class='p-phonetic'>/ˌəʊvəˈkraʊdɪd/</span> = <span class='p-mean'>quá đông đúc</span> → /aʊ/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"dangerous" có "ou" (đuôi -ous) đọc là âm mờ /ə/. Ba từ kia đọc /aʊ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>underground, hour, overcrowded đều /aʊ/ nên giống nhau.</span></li></ol>`);
mcq(2,"Chọn từ có phần gạch chân được phát âm khác:",
 ["w<u>a</u>ste","p<u>a</u>cked","tr<u>a</u>m","c<u>a</u>feteria"],0,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "a" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>waste</span> <span class='p-phonetic'>/weɪst/</span> = <span class='p-mean'>rác thải</span> → /eɪ/</div>
 <div><span class='p-word'>packed</span> <span class='p-phonetic'>/pækt/</span> = <span class='p-mean'>chật kín</span> → /æ/</div>
 <div><span class='p-word'>tram</span> <span class='p-phonetic'>/træm/</span> = <span class='p-mean'>tàu điện</span> → /æ/</div>
 <div><span class='p-word'>cafeteria</span> <span class='p-phonetic'>/ˌkæfəˈtɪəriə/</span> = <span class='p-mean'>căng tin</span> → /æ/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"waste" có "a" đọc /eɪ/. Ba từ kia "a" đọc /æ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>packed, tram, cafeteria đều /æ/ nên giống nhau.</span></li></ol>`);
mcq(3,"Chọn từ có phần gạch chân (đuôi -ed) được phát âm khác:",
 ["congest<u>ed</u>","pollut<u>ed</u>","crowd<u>ed</u>","process<u>ed</u>"],3,
 `<div class="vnt">💬 Dịch: Tìm từ có đuôi "-ed" phát âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>congested</span> <span class='p-phonetic'>/-tɪd/</span> = <span class='p-mean'>tắc nghẽn</span> → /ɪd/</div>
 <div><span class='p-word'>polluted</span> <span class='p-phonetic'>/-tɪd/</span> = <span class='p-mean'>ô nhiễm</span> → /ɪd/</div>
 <div><span class='p-word'>crowded</span> <span class='p-phonetic'>/-dɪd/</span> = <span class='p-mean'>đông đúc</span> → /ɪd/</div>
 <div><span class='hl-green'>processed</span> <span class='p-phonetic'>/-st/</span> = <span class='p-mean'>đã xử lý</span> → /t/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"processed" có "-ed" đọc /t/ (vì đứng sau âm /s/). Ba từ kia "-ed" đọc /ɪd/ (sau /t/, /d/).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>congested, polluted, crowded đều /ɪd/ nên giống nhau.</span></li></ol>`);

/* ---------- A. II. Stress ---------- */
sec("A. LANGUAGE FOCUS · II. Chọn từ có TRỌNG ÂM khác các từ còn lại");
mcq(4,"Chọn từ có trọng âm khác:",
 ["bustling","public","condition","liveable"],2,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:

sec("A. LANGUAGE FOCUS · III. Chọn từ/cụm từ phù hợp nhất");
mcq(6,"With the high cost _____ living, it's harder to find affordable housing in big cities.",

mcq(7,"The _____ area is a great place to shop, offering everything from local shops to department stores.",
 ["downtown","underground","outskirts","suburban"],0,

 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>downtown</span> <span class='wt'>adj</span> = <span class='p-mean'>khu trung tâm</span></div>
 <div><span class='p-word'>underground</span> <span class='wt'>n</span> = <span class='p-mean'>tàu điện ngầm</span></div>
 <div><span class='p-word'>outskirts</span> <span class='wt'>n</span> = <span class='p-mean'>vùng ven</span></div>

 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>underground/outskirts/suburban không phải khu mua sắm sầm uất với nhiều loại cửa hàng.</span></li></ol>`);
mcq(8,"At Christmas, the shopping malls are _____ with people looking for holiday gifts.",
 ["reliable","bustling","polluted","liveable"],1,
 `<div class="vnt">💬 Dịch: Vào Giáng sinh, các trung tâm mua sắm nhộn nhịp người tìm mua quà lễ.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>reliable</span> <span class='wt'>adj</span> = <span class='p-mean'>đáng tin cậy</span></div>

 <div><span class='p-word'>polluted</span> <span class='wt'>adj</span> = <span class='p-mean'>ô nhiễm</span></div>

 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>reliable/polluted/liveable không mô tả sự đông đúc, nhộn nhịp.</span></li></ol>`);
mcq(9,"Using buses and subways to _____ Singapore can save both time and money for tourists.",
 ["carry out","pick up","get around","come back"],2,
 `<div class="vnt">💬 Dịch: Dùng xe buýt và tàu điện ngầm để đi lại quanh Singapore có thể giúp du khách tiết kiệm cả thời gian lẫn tiền bạc.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>carry out</span> <span class='wt'>phr v</span> = <span class='p-mean'>tiến hành</span></div>
 <div><span class='p-word'>pick up</span> <span class='wt'>phr v</span> = <span class='p-mean'>đón/nhặt</span></div>
 <div><span class='hl-green'>get around</span> <span class='wt'>phr v</span> = <span class='p-mean'>đi lại (quanh nơi)</span></div>
 <div><span class='p-word'>come back</span> <span class='wt'>phr v</span> = <span class='p-mean'>quay lại</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"get around (a place)" = đi lại/di chuyển quanh một nơi — hợp với dùng xe buýt, tàu điện.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>carry out/pick up/come back sai nghĩa với việc "đi lại quanh Singapore".</span></li></ol>`);
mcq(10,"Street racing on city roads is considered one of _____ activities in urban areas.",
 ["more dangerous","the more dangerous","the most dangerous","less dangerous"],2,
 `<div class="vnt">💬 Dịch: Đua xe trên đường phố được xem là một trong những hoạt động nguy hiểm nhất ở đô thị.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>more dangerous</span> = <span class='p-mean'>so sánh hơn</span></div>
 <div><span class='p-word'>the more dangerous</span> = <span class='p-mean'>sai cấu trúc</span></div>
 <div><span class='hl-green'>the most dangerous</span> = <span class='p-mean'>nguy hiểm nhất</span></div>
 <div><span class='p-word'>less dangerous</span> = <span class='p-mean'>ít nguy hiểm hơn</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "one of the most + adj + N(số nhiều)" = một trong những ... nhất.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Cụm "one of the..." đòi hỏi SO SÁNH NHẤT, không dùng so sánh hơn (more/less).</span></li></ol>`);
mcq(11,"If more people _____ the metro, traffic congestion will decrease significantly.",
 ["don't use","use","used","didn't use"],1,
 `<div class="vnt">💬 Dịch: Nếu nhiều người dùng tàu điện hơn, tình trạng tắc đường sẽ giảm đáng kể.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>don't use</span> = <span class='p-mean'>phủ định (sai logic)</span></div>
 <div><span class='hl-green'>use</span> = <span class='p-mean'>dùng (hiện tại đơn)</span></div>
 <div><span class='p-word'>used</span> = <span class='p-mean'>quá khứ (sai)</span></div>
 <div><span class='p-word'>didn't use</span> = <span class='p-mean'>quá khứ phủ định (sai)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: If + HIỆN TẠI ĐƠN (use), mệnh đề chính "will + V". Ý khẳng định "dùng nhiều hơn".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>don't use sai logic (giảm tắc đường phải là "dùng"); used/didn't use sai thì.</span></li></ol>`);
mcq(12,"The city has upgraded its public _____, including parks, libraries, and restrooms.",
 ["vehicles","amenities","services","features"],1,
 `<div class="vnt">💬 Dịch: Thành phố đã nâng cấp các tiện ích công cộng, bao gồm công viên, thư viện và nhà vệ sinh.</div>

 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>vehicles (phương tiện), services (dịch vụ vô hình), features (đặc điểm) không đúng nghĩa "cơ sở tiện ích".</span></li></ol>`);
mcq(13,"As our city expands, the _____ grows and replaces parks and trees with skyscrapers.",
 ["concrete jungle","construction site","green space","traffic congestion"],0,
 `<div class="vnt">💬 Dịch: Khi thành phố mở rộng, "rừng bê tông" phình to và thay thế công viên, cây xanh bằng nhà chọc trời.</div>
 <ol><li>Phân tích 4 đáp án:

 <div><span class='p-word'>green space</span> <span class='wt'>n</span> = <span class='p-mean'>không gian xanh</span></div>
 <div><span class='p-word'>traffic congestion</span> <span class='wt'>n</span> = <span class='p-mean'>tắc đường</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"thay công viên, cây xanh bằng nhà chọc trời" → "concrete jungle" (rừng bê tông) phình to.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>green space (ngược ý); construction site/traffic congestion không "thay công viên bằng nhà cao tầng".</span></li></ol>`);
mcq(14,"_____ the air becomes, _____ it is to breathe in the city.",
 ["The most polluted – the hardest","The more polluted – the more hard","The polluted – the more hard","The more polluted – the harder"],3,
 `<div class="vnt">💬 Dịch: Không khí càng ô nhiễm thì càng khó thở trong thành phố.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>The most polluted – the hardest</span> = <span class='p-mean'>so sánh nhất (sai)</span></div>
 <div><span class='p-word'>The more polluted – the more hard</span> = <span class='p-mean'>"more hard" sai</span></div>
 <div><span class='p-word'>The polluted – the more hard</span> = <span class='p-mean'>sai cả hai vế</span></div>
 <div><span class='hl-green'>The more polluted – the harder</span> = <span class='p-mean'>càng ô nhiễm – càng khó (đúng)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>So sánh kép: The + comparative..., THE + comparative... → The more polluted..., the harder... (hard → harder).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"most/hardest" là so sánh nhất; "more hard" sai (hard là tính từ ngắn → harder).</span></li></ol>`);
mcq(15,"Harry: “Are you new here? I can show you around the neighbourhood if you like.” – Mandy: “Thank you. _____”",

 `<div class="vnt">💬 Dịch: Harry: “Bạn mới đến đây à? Mình có thể dẫn bạn đi quanh khu phố nếu bạn muốn.” – Mandy: “Cảm ơn bạn. _____”</div>
 <ol><li>Phân tích 4 đáp án:

 <div><span class='p-word'>What an amazing town!</span> = <span class='p-mean'>lạc đề</span></div>
 <div><span class='hl-green'>That's so kind of you.</span> = <span class='p-mean'>Bạn thật tốt bụng.</span></div>
 <div><span class='p-word'>I hope you'll try your best.</span> = <span class='p-mean'>lạc đề</span></div>
 </div></li>

 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"It's my pleasure" là câu ĐÁP lời cảm ơn (của người giúp); B, D lạc đề.</span></li></ol>`);

sec("A. LANGUAGE FOCUS · IV. Nhìn biển báo/thông báo và chọn đáp án đúng");
mcq(16,"What does the sign say? (Biển báo nói gì?)<div style='text-align:center;margin:14px 0'><svg viewBox='0 0 240 210' width='195' style='max-width:88%'><rect x='140' y='55' width='34' height='108' rx='3' fill='#bfe3f5' stroke='#243426' stroke-width='3' opacity='.85'/><line x1='146' y1='64' x2='168' y2='96' stroke='#fff' stroke-width='3' opacity='.8'/><line x1='146' y1='92' x2='168' y2='124' stroke='#fff' stroke-width='3' opacity='.7'/><g stroke='#243426' stroke-width='7' stroke-linecap='round' fill='none'><line x1='99' y1='80' x2='120' y2='120'/><line x1='108' y1='96' x2='140' y2='80'/><line x1='120' y1='120' x2='112' y2='152'/><line x1='120' y1='120' x2='128' y2='152'/></g><circle cx='96' cy='66' r='11' fill='#243426'/><circle cx='118' cy='104' r='82' fill='none' stroke='#e11d1d' stroke-width='11'/><line x1='60' y1='46' x2='176' y2='162' stroke='#e11d1d' stroke-width='11' stroke-linecap='round'/></svg></div>",
 ["Do not touch the glass.","Do not lean on the glass.","Do not stand in front of the glass.","Do not walk near the glass."],1,

 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>Do not touch the glass.</span> = <span class='p-mean'>Đừng chạm vào kính (chỉ chạm, chưa đủ).</span></div>
 <div><span class='hl-green'>Do not lean on the glass.</span> = <span class='p-mean'>Đừng tựa/dựa vào kính.</span></div>
 <div><span class='p-word'>Do not stand in front of the glass.</span> = <span class='p-mean'>Đừng đứng trước kính (sai).</span></div>

 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hình người đang DỰA cả người vào kính → "Do not lean on the glass" (đừng tựa vào kính).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>touch (chạm), stand in front (đứng trước), walk near (đi gần) không diễn tả đúng hành động "tựa".</span></li></ol>`);
mcq(17,"What does the notice say? (Thông báo nói gì?)<div style='text-align:center;margin:14px 0'><svg viewBox='0 0 260 212' width='215' style='max-width:90%'><rect x='6' y='6' width='248' height='200' rx='14' fill='#fff' stroke='#243426' stroke-width='4'/><rect x='6' y='6' width='248' height='44' rx='12' fill='#e11d1d'/><text x='130' y='36' font-family='Arial' font-weight='900' font-size='22' fill='#fff' text-anchor='middle'>NO PETS ALLOWED</text><text x='130' y='108' font-size='50' text-anchor='middle'>♿ 🦮</text><text x='130' y='142' font-family='Arial' font-weight='800' font-size='12.5' fill='#0a7c34' text-anchor='middle'>SERVICE ANIMALS trained to aid</text><text x='130' y='160' font-family='Arial' font-weight='800' font-size='12.5' fill='#0a7c34' text-anchor='middle'>a person with a disability</text><text x='130' y='186' font-family='Arial' font-weight='900' font-size='16' fill='#0a7c34' text-anchor='middle'>ARE WELCOME ✓</text></svg></div>",
 ["Animals can't enter this area except for service animals.","People with disabilities and their pets cannot go inside.","Well-trained pets are allowed to enter this area.","Service pets must stay outside and wait for their owners."],0,

 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>Animals can't enter this area except for service animals.</span> = <span class='p-mean'>Cấm vật nuôi, TRỪ vật nuôi nghiệp vụ.</span></div>
 <div><span class='p-word'>People with disabilities and their pets cannot go inside.</span> = <span class='p-mean'>Người khuyết tật & thú cưng không được vào (sai).</span></div>
 <div><span class='p-word'>Well-trained pets are allowed to enter.</span> = <span class='p-mean'>Thú cưng được huấn luyện tốt được vào (sai — chỉ vật nuôi nghiệp vụ).</span></div>
 <div><span class='p-word'>Service pets must stay outside...</span> = <span class='p-mean'>Vật nuôi nghiệp vụ phải ở ngoài (ngược lại).</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấm thú cưng NHƯNG vật nuôi nghiệp vụ được chào đón → "Animals can't enter except for service animals."</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác cấm cả vật nuôi nghiệp vụ, hoặc cho phép thú cưng thường — đều trái với thông báo.</span></li></ol>`);

sec("C. WRITING · I. Chọn câu chủ đề & sắp xếp câu");
mcq(40,"Chọn CÂU CHỦ ĐỀ mở đầu đoạn văn phù hợp nhất:<div class='arr'><div class='ln' style='font-style:italic'>(40) ______ One way to reduce food waste is by donating extra food to local charities or food banks. (41) ... These small changes can make a big difference in how much food gets thrown away in cities.</div></div>",
 ["By doing so, each individual could contribute to the reduction of food waste.","First, food labeling plays an important role in reducing waste in general.","If everyone agrees, they should work together to make the cities cleaner.","Food waste is a growing problem in cities, but there are ways to reduce it."],3,
 `<div class="vnt">💬 Dịch đoạn: “... Một cách để giảm lãng phí thực phẩm là quyên góp đồ ăn dư cho tổ chức từ thiện hoặc ngân hàng thực phẩm... Những thay đổi nhỏ này tạo khác biệt lớn.”</div>
 <ol><li>Dịch từng đáp án:
 <div class="grid2">
 <div><span class='p-word'>A.</span> By doing so, each individual could contribute to the reduction of food waste. = <span class='p-mean'>Bằng cách đó, mỗi người có thể góp phần giảm lãng phí. (câu NỐI "By doing so" — không mở đầu được)</span></div>
 <div><span class='p-word'>B.</span> First, food labeling plays an important role in reducing waste in general. = <span class='p-mean'>Thứ nhất, việc dán nhãn thực phẩm... (lạc chủ đề — nói về dán nhãn)</span></div>
 <div><span class='p-word'>C.</span> If everyone agrees, they should work together to make the cities cleaner. = <span class='p-mean'>Nếu mọi người đồng ý, họ nên hợp tác làm sạch thành phố. (lạc chủ đề)</span></div>
 <div><span class='hl-green'>D.</span> Food waste is a growing problem in cities, but there are ways to reduce it. = <span class='p-mean'>Lãng phí thực phẩm là vấn đề ngày càng lớn ở đô thị, nhưng có nhiều cách để giảm. (câu chủ đề chuẩn)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu chủ đề phải NÊU VẤN ĐỀ CHUNG (food waste) và định hướng cả đoạn → đáp án D.</span></li></ol>`);
mcq(41,"Sắp xếp các câu (a–c) vào đúng thứ tự để hoàn thành đoạn văn (điền vào chỗ (41)):<div class='arr'><div class='ln'><b class='lt'>a.</b> Finally, businesses can help by offering smaller portion sizes or allowing customers to take home leftovers.</div><div class='ln'><b class='lt'>b.</b> Many homeless people struggle to get enough food to eat, and donating food can help them.</div><div class='ln'><b class='lt'>c.</b> Another solution is composting by turning food scraps into useful fertiliser for gardens.</div></div>",
 ["c – a – b","b – c – a","a – c – b","a – b – c"],1,
 `<div class="vnt">💬 Dịch: Sắp xếp 3 câu về các giải pháp giảm lãng phí thực phẩm.</div>
 <ol><li>Dịch & sắp xếp từng câu:
 <div class="grid2">
 <div><span class='hl-green'>(b)</span> Many homeless people struggle to get enough food..., and donating food can help them. = <span class='p-mean'>Nhiều người vô gia cư thiếu ăn, và quyên góp thực phẩm giúp được họ. (nối tiếp ý "donating" ngay trước chỗ trống)</span></div>
 <div><span class='hl-green'>(c)</span> Another solution is composting... = <span class='p-mean'>Một giải pháp KHÁC là ủ phân từ rác thực phẩm. (giải pháp 2 — "Another")</span></div>
 <div><span class='hl-green'>(a)</span> Finally, businesses can help by offering smaller portion sizes... = <span class='p-mean'>Cuối cùng, doanh nghiệp có thể giúp bằng khẩu phần nhỏ hơn... (giải pháp cuối — "Finally")</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Theo từ nối: (b) nối tiếp ý quyên góp → (c) "Another solution" → (a) "Finally". → <b>b – c – a</b>.</span></li></ol>`);

/* ---------- C. II. Best combines ---------- */
sec("C. WRITING · II. Chọn câu GỘP hai câu cho sẵn đúng nhất");
mcq(42,"The area gets more crowded. The available parking spaces are fewer.",
 ["When the area gets more crowded, the parking spaces will be more available.","The area is more crowded and available than the fewer parking spaces.","The more crowded the area gets, the fewer parking spaces are available.","Although the area gets more crowded, the parking spaces are still available."],2,
 `<div class="vnt">💬 Dịch: Khu vực càng đông đúc thì càng ít chỗ đỗ xe.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>When..., ...will be more available.</span> = <span class='p-mean'>sai nghĩa (nhiều chỗ hơn)</span></div>
 <div><span class='p-word'>...more crowded and available than...</span> = <span class='p-mean'>sai cấu trúc/nghĩa</span></div>
 <div><span class='hl-green'>The more crowded the area gets, the fewer parking spaces are available.</span> = <span class='p-mean'>đúng: so sánh kép</span></div>
 <div><span class='p-word'>Although..., ...still available.</span> = <span class='p-mean'>sai nghĩa (vẫn còn chỗ)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Quan hệ tỉ lệ thuận → so sánh kép: The + comparative..., THE + comparative... (the fewer).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác đảo ngược nghĩa (nhiều chỗ hơn / vẫn còn chỗ) hoặc sai cấu trúc.</span></li></ol>`);
mcq(43,"Cities offer many job opportunities. The competition is very tough.",
 ["Cities offer many job opportunities, but the competition is very tough.","Cities offer many job opportunities, however the competition is very though.","The competition is very tough, so cities offer many job opportunities.","The competition is very tough, therefore cities offer many job opportunities."],0,
 `<div class="vnt">💬 Dịch: Các thành phố mang lại nhiều cơ hội việc làm, nhưng sự cạnh tranh rất khốc liệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>..., but the competition is very tough.</span> = <span class='p-mean'>đúng: tương phản</span></div>
 <div><span class='p-word'>..., however the competition is very though.</span> = <span class='p-mean'>sai dấu câu + sai từ "though"</span></div>
 <div><span class='p-word'>..., so cities offer...</span> = <span class='p-mean'>sai logic nhân–quả</span></div>
 <div><span class='p-word'>..., therefore cities offer...</span> = <span class='p-mean'>sai logic</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hai ý TƯƠNG PHẢN (nhiều cơ hội ↔ cạnh tranh gắt) → nối bằng "but".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"however" phải có dấu chấm phẩy/chấm trước + viết đúng "tough"; so/therefore sai logic nhân–quả.</span></li></ol>`);
mcq(44,"I passed by the building. Some construction workers were renovating it.",
 ["As I was passing by the building, some construction workers were renovating it.","I passed by the building, and some construction workers renovated it.","While I was passing by, some construction workers renovated the building.","When I passed by, some construction workers were renovating the building."],3,
 `<div class="vnt">💬 Dịch: Khi tôi đi ngang qua tòa nhà, một số công nhân đang cải tạo nó.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>As I was passing..., ...were renovating it.</span> = <span class='p-mean'>hai hành động cùng tiếp diễn (lệch nghĩa gốc)</span></div>
 <div><span class='p-word'>...and...renovated it.</span> = <span class='p-mean'>sai thì (mất "đang")</span></div>
 <div><span class='p-word'>While I was passing..., ...renovated the building.</span> = <span class='p-mean'>đảo sai thì</span></div>
 <div><span class='hl-green'>When I passed by, some construction workers were renovating the building.</span> = <span class='p-mean'>đúng</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hành động ngắn "passed by" (QKĐ) cắt ngang hành động đang diễn ra "were renovating" (QKTD): WHEN + QKĐ, ... QKTD.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác chia sai thì hoặc làm mất ý "đang cải tạo".</span></li></ol>`);
mcq(45,"We will pick our dad up at the airport. He returns from his business trip.",
 ["We will pick our dad up at the airport, or he returns from his business trip.","We will pick our dad up at the airport when he returns from his business trip.","If my dad will return from his business trip, we will pick him up at the airport.","My dad returns from his business trip because we'll pick him up at the airport."],1,
 `<div class="vnt">💬 Dịch: Chúng tôi sẽ đón bố ở sân bay khi ông ấy trở về từ chuyến công tác.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>..., or he returns...</span> = <span class='p-mean'>sai logic ("hoặc")</span></div>
 <div><span class='hl-green'>...when he returns from his business trip.</span> = <span class='p-mean'>đúng</span></div>
 <div><span class='p-word'>If my dad will return...</span> = <span class='p-mean'>sai: sau "if" không dùng "will"</span></div>
 <div><span class='p-word'>...because we'll pick him up.</span> = <span class='p-mean'>sai logic nhân–quả</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Mệnh đề thời gian chỉ tương lai dùng HIỆN TẠI ĐƠN: "when he returns" (không dùng will sau when/if).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"or/because" sai logic; "If...will return" sai ngữ pháp (sau if không dùng will).</span></li></ol>`);

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const quiz=document.getElementById('quiz');
Q.forEach((it)=>{
  if(it.sec){const d=document.createElement('div');d.className='sec';d.textContent=it.sec;quiz.appendChild(d);return;}
  TOTAL++;
  const card=document.createElement('div');card.className='card';card.id='c'+it.num;
  card.innerHTML=`<div><span class="qnum">Câu ${it.num}</span><span class="qtext">${render(it)}</span></div>`;
  if(it.type==='mcq'){
    const wrap=document.createElement('div');wrap.className='opts';
    const arr=it.opts.map((t,i)=>({t,correct:i===it.correctIdx}));shuffle(arr);
    arr.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>pickMcq(it,card,wrap,b,o.correct);wrap.appendChild(b);});
    card.appendChild(wrap);
  }else if(it.type==='txt'){
    if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='('+it.hint+')';card.appendChild(h);}
    const box=document.createElement('div');box.className='tin';
    const inp=document.createElement('input');inp.placeholder='Gõ đáp án của em...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    const act=()=>checkTxt(it,card,inp,btn);
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    box.appendChild(inp);box.appendChild(btn);card.appendChild(box);
  }else if(it.type==='cor'){
    const letters=document.createElement('div');letters.className='letters';
    const L=['A','B','C','D'];let selIdx=-1;
    const inBox=document.createElement('div');inBox.className='tin';inBox.style.display='none';
    const inp=document.createElement('input');inp.placeholder='Gõ chữ ĐÚNG để sửa...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    inBox.appendChild(inp);inBox.appendChild(btn);
    const lbtns=[];
    L.forEach((L_,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=L_;
      b.onclick=()=>{if(card.dataset.done)return;selIdx=i;lbtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        inBox.style.display='flex';inp.focus();};
      lbtns.push(b);letters.appendChild(b);});
    const act=()=>{if(selIdx<0){inp.placeholder='Hãy chọn chữ cái A–D trước!';return;}checkCor(it,card,lbtns,selIdx,inp,btn);};
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    card.appendChild(letters);card.appendChild(inBox);
  }
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=`<div class="expin">${it.exp}</div>`;
  card.appendChild(exp);quiz.appendChild(card);
});
function render(it){
  if(it.type==='cor'){const L=['A','B','C','D'];let s=it.q;
    it.parts.forEach((p,i)=>{s=s.replace('{'+p+'}',`<span class="mark">${p}<sup>${L[i]}</sup></span>`);});return s;}
  return it.q;
}
function openExp(card){card.querySelector('.exp').classList.add('open');}
function lock(card){card.dataset.done='1';answered++;updateProg();}
function pickMcq(it,card,wrap,btn,correct){
  if(card.dataset.done)return;lock(card);
  [...wrap.children].forEach(b=>{b.disabled=true;if(b.innerHTML===it.opts[it.correctIdx])b.classList.add('correct');});
  if(correct){correctCount++;btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong','shake');buzz();}
  openExp(card);
}
function checkTxt(it,card,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;
  const ok=matchWriting(inp.value,it.ans);
  if(ok){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function checkCor(it,card,lbtns,selIdx,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;lbtns.forEach(b=>b.disabled=true);
  const letterOk=selIdx===it.cIdx, textOk=matchWriting(inp.value,it.corr);
  lbtns[it.cIdx].classList.add('correct');
  if(selIdx!==it.cIdx)lbtns[selIdx].classList.add('wrong');
  if(letterOk&&textOk){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function openName(){document.getElementById('nameOv').classList.add('show');document.getElementById('nameIn').focus();}
function showResult(){
  const n=document.getElementById('nameIn').value.trim();
  const err=document.getElementById('nameErr'),inp=document.getElementById('nameIn');
  if(!n){inp.classList.add('err');err.textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('nameOv').classList.remove('show');
  const pct=correctCount/TOTAL, ten=(correctCount/TOTAL*10).toFixed(2);
  let greet,meme;
  if(pct===1){greet='🌟 THIÊN TÀI! '+n+' xuất sắc tuyệt đối!';meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+n+' làm rất tốt, cố thêm chút nữa nhé!';meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN '+n+'! Ôn lại phần giải thích rồi làm lại nha!';meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent='✅ '+correctCount+' / '+TOTAL+' câu đúng';
  document.getElementById('rTen').textContent='📊 Điểm quy đổi: '+ten+' / 10';
  const img=document.getElementById('rMeme'),fall=document.getElementById('rFall');
  img.style.display='block';fall.style.display='none';img.src=meme;
  img.onerror=()=>{img.style.display='none';fall.style.display='block';
    fall.textContent=pct===1?'🎉🏆🎉':(pct>=0.6?'😄👍':'😭💧');};
  document.getElementById('resOv').classList.add('show');
  if(pct>=0.6){confetti();setTimeout(confetti,400);}
}
updateProg();
</script>
