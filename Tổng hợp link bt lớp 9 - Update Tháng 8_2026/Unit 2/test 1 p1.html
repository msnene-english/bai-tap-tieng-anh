<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2 · City Life — TEST 1</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#22d3ee; --pink:#f472b6; --pur:#a855f7; --neonY:#fde047;
  --green:#22e07a; --wrong:#ff5468; --blue:#2472e8; --purpleT:#6a3fd6; --terra:#c2410c; --grammar:#e11d48; --ink:#1b1233;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
  background:linear-gradient(-45deg,#1e1b4b,#4c1d95,#831843,#0f172a,#1e3a8a);
  background-size:400% 400%; animation:bgmove 22s ease infinite; overflow-x:hidden;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.skyline{position:fixed;left:0;bottom:0;width:100%;height:180px;z-index:0;pointer-events:none;opacity:.9}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaties span{position:absolute;font-size:2rem;opacity:.45;animation:float linear infinite;filter:drop-shadow(0 0 6px rgba(34,211,238,.7))}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 80px}
.head{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:rgba(15,10,40,.7);border:1px solid var(--cyan);color:#e9fbff;font-weight:800;font-size:.8rem;padding:5px 14px;border-radius:20px;box-shadow:0 0 14px rgba(34,211,238,.5)}
.title{margin-top:12px;font-family:'Orbitron';font-weight:900;font-size:2rem;color:#fff;letter-spacing:2px;
  text-shadow:0 0 8px var(--cyan),0 0 18px var(--pink),0 0 30px var(--pur)}
.sub{display:inline-block;margin-top:8px;background:rgba(15,10,40,.65);border:1px solid var(--pink);border-radius:12px;padding:3px 12px;font-weight:800;color:#ffe3f2;box-shadow:0 0 12px rgba(244,114,182,.4)}
.progbar{height:14px;background:rgba(15,10,40,.6);border:1px solid var(--pur);border-radius:20px;margin:16px 0;overflow:hidden;box-shadow:0 0 12px rgba(168,85,247,.4)}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .4s;box-shadow:0 0 12px var(--cyan)}
.sec{margin:26px 0 12px;background:rgba(15,10,40,.72);border:1px solid var(--cyan);border-radius:14px;padding:10px 16px;color:#eafcff;font-family:'Orbitron';font-weight:700;font-size:.98rem;letter-spacing:.5px;box-shadow:0 0 16px rgba(34,211,238,.35)}
.card{background:rgba(255,255,255,.96);border:2px solid rgba(168,85,247,.5);border-radius:18px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 0 0 1px rgba(34,211,238,.4),0 10px 26px rgba(120,20,120,.4)}
.qnum{display:inline-block;background:linear-gradient(135deg,var(--pur),var(--pink));color:#fff;font-family:'Orbitron';font-weight:700;border-radius:10px;padding:2px 10px;font-size:.78rem;margin-right:8px;box-shadow:0 0 10px rgba(244,114,182,.5)}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.5;display:inline}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px}
.hint{font-size:.85rem;color:#6a3fd6;font-weight:800;margin-top:8px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid #c9b8f0;border-radius:14px;padding:13px 12px;font-family:'Nunito';font-size:1.08rem;font-weight:800;color:#3a2b6b;cursor:pointer;box-shadow:0 4px 0 #d8ccf5;transition:transform .12s,box-shadow .12s;text-align:center}
.opt:nth-child(2n){border-color:#8fe6f5;box-shadow:0 4px 0 #bdeef7;color:#0e5a68}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(168,85,247,.5)}
.opt:active{transform:translateY(1px)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green)!important;border-color:#0a9c52!important;color:#06301b!important;box-shadow:0 0 16px rgba(34,224,122,.8)!important}
.opt.wrong{background:var(--wrong)!important;border-color:#b91c1c!important;color:#fff!important;box-shadow:0 0 16px rgba(255,84,104,.8)!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.tin{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tin input{flex:1;min-width:180px;font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:11px 14px;border-radius:12px;border:2px solid #c9b8f0;background:#faf8ff;color:var(--ink)}
.tin input:focus{outline:none;border-color:var(--pur);box-shadow:0 0 10px rgba(168,85,247,.4)}
.tin input.ok{border-color:var(--green);background:#e7fff1}
.tin input.no{border-color:var(--wrong);background:#ffecee}
.btnc{background:linear-gradient(135deg,var(--pur),var(--pink));color:#fff;border:none;border-radius:12px;padding:11px 20px;font-family:'Orbitron';font-weight:700;font-size:.92rem;cursor:pointer;box-shadow:0 0 14px rgba(244,114,182,.5);transition:transform .12s}
.btnc:hover:not(:disabled){transform:scale(1.05)} .btnc:disabled{opacity:.55;cursor:default}
.letters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lbtn{width:48px;height:48px;border-radius:12px;border:2px solid #8fe6f5;font-family:'Orbitron';font-weight:700;font-size:1.05rem;cursor:pointer;background:#eafcff;color:#0e5a68;box-shadow:0 0 10px rgba(34,211,238,.4);transition:transform .12s}
.lbtn:hover:not(:disabled){transform:scale(1.08)}
.lbtn.sel{background:var(--neonY);color:#5a4a00;border-color:#eab308}
.lbtn.correct{background:var(--green);color:#06301b;border-color:#0a9c52}
.lbtn.wrong{background:var(--wrong);color:#fff;border-color:#b91c1c}
.lbtn:disabled{cursor:default}
.mark{background:#fef3c7;border-radius:6px;padding:0 4px;font-weight:800}
.mark sup{color:var(--pur);font-family:'Orbitron';font-size:.68rem}
.exp{margin-top:14px;max-height:0;overflow:hidden;transition:max-height .5s ease;font-size:1rem}
.exp.open{max-height:1700px}
.expin{background:#faf9ff;border:2px dashed #c9b8f0;border-radius:12px;padding:14px}
.exp ol{margin:6px 0 0 20px} .exp li{margin:8px 0;line-height:1.55}
.vnt{background:#fff2e0;border-left:5px solid var(--terra);border-radius:10px;padding:8px 12px;font-weight:800;color:#7a3e00;margin-bottom:8px}
.arr{background:#f5f3ff;border:2px solid #ddd6fe;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:1.02rem;font-weight:600;line-height:1.55}
.arr .ln{margin:6px 0}
.arr b.lt{color:var(--pink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0}
.grid2>div{line-height:1.5}
.p-word{color:var(--blue);font-weight:800}
.hl-green{color:#088a3c;font-weight:900}
.hl-red{color:var(--wrong);font-weight:900}
.wt{background:#ece3ff;color:var(--purpleT);border-radius:6px;padding:0 6px;font-size:.78rem;font-weight:800}
.p-phonetic{color:var(--purpleT);background:#f0e9ff;border-radius:6px;padding:0 6px;font-weight:700}
.p-mean{color:var(--terra);font-weight:800}
.p-grammar{border-bottom:2.5px solid var(--grammar);color:#7a1030;font-weight:800}
.keyline{background:#e7fff1;border:2px solid #a7e0bd;border-radius:10px;padding:8px 12px;font-weight:800;color:#066b34;margin-bottom:8px}
.submit{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,var(--cyan),var(--pink));color:#0b1030;border:none;border-radius:18px;padding:18px;font-family:'Orbitron';font-weight:900;font-size:1.2rem;letter-spacing:1px;cursor:pointer;box-shadow:0 0 22px rgba(34,211,238,.6)}
.submit:hover{transform:scale(1.02)}
.overlay{position:fixed;inset:0;background:rgba(10,5,30,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border:2px solid var(--pur);border-radius:22px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 40px rgba(168,85,247,.7);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Orbitron';font-weight:700;font-size:1.3rem;color:var(--pur);margin-bottom:12px}
.modal input{width:100%;padding:14px;border-radius:12px;border:2px solid #c9b8f0;font-size:1.05rem;font-family:'Nunito';font-weight:700;margin-bottom:6px}
.modal input.err{border-color:var(--wrong);background:#ffecee}
.errmsg{color:var(--wrong);font-weight:800;font-size:.9rem;min-height:20px;margin-bottom:8px}
.modal button{background:linear-gradient(135deg,var(--cyan),var(--pink));color:#0b1030;border:none;border-radius:12px;padding:12px 26px;font-family:'Orbitron';font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 0 16px rgba(34,211,238,.6)}
.rgreet{font-family:'Orbitron';font-weight:700;font-size:1.25rem;color:var(--pur);line-height:1.4}
.rscore{font-family:'Orbitron';font-weight:900;font-size:2.2rem;color:var(--ink);margin:8px 0}
.rten{font-size:1.5rem;font-weight:900;color:var(--pink);margin-bottom:12px}
.rmeme{width:100%;max-width:280px;border-radius:14px;margin:0 auto 14px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.3);min-height:120px;object-fit:cover}
.memefall{font-size:5rem}
@media(max-width:560px){.opts,.grid2{grid-template-columns:1fr}.title{font-size:1.5rem}}
</style>
</head>

<script>
(function(){
  const ico=['🌃','🏙️','🚇','🚕','🚦','🌆','🏢','💡','🌉','🚋','🛴','🗼'];
  const f=document.getElementById('floaties');
  for(let i=0;i<15;i++){const s=document.createElement('span');
    s.textContent=ico[i%ico.length];s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(15+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(1.5+Math.random()*1.6)+'rem';f.appendChild(s);}
})();
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=i?1318:988;o.connect(g);g.connect(c.destination);
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);
  g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.4);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function confetti(){const cols=['#22d3ee','#f472b6','#a855f7','#fde047','#22e07a','#ff5468'];
  for(let i=0;i<70;i++){const d=document.createElement('div');
    d.style.cssText='position:fixed;z-index:99;width:10px;height:14px;top:-20px;pointer-events:none;border-radius:2px;';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.boxShadow='0 0 8px '+cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1500+Math.random()*1500,x=(Math.random()-.5)*300;
    d.animate([{transform:d.style.transform,opacity:1},
      {transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:0}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[.,?!;:'"’\-]/g,' ').replace(/\s+/g,' ').trim();}
function matchWriting(input,answers){const ni=norm(input);if(!ni)return false;
  for(const a of answers){const na=norm(a);if(ni===na)return true;
    if(na.includes(ni)&&ni.length>=na.length*0.5)return true;if(ni.includes(na))return true;}return false;}
let TOTAL=0,correctCount=0,answered=0;
function updateProg(){document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';}

/* ============================================================
   DATA — Unit 2 · CITY LIFE · TEST 1 · A(I–VIII) + C(I–III)
   ============================================================ */
const Q=[];
function sec(t){Q.push({sec:t});}
function mcq(num,q,opts,correctIdx,exp){Q.push({type:'mcq',num,q,opts,correctIdx,exp});}
function txt(num,q,ans,exp,hint){Q.push({type:'txt',num,q,ans,exp,hint});}
function cor(num,q,parts,cIdx,corr,exp){Q.push({type:'cor',num,q,parts,cIdx,corr,exp});}

/* ---------- A. I. Pronunciation ---------- */
sec("A. LANGUAGE FOCUS · I. Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại");
mcq(1,"Chọn từ có phần gạch chân được phát âm khác:",
 ["metr<u>o</u>","bi<u>o</u>gas","c<u>o</u>ncrete","<u>o</u>verseas"],2,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "o" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>metro</span> <span class='p-phonetic'>/ˈmetrəʊ/</span> = <span class='p-mean'>tàu điện ngầm</span> → /əʊ/</div>
 <div><span class='p-word'>biogas</span> <span class='p-phonetic'>/ˈbaɪəʊɡæs/</span> = <span class='p-mean'>khí sinh học</span> → /əʊ/</div>
 <div><span class='hl-green'>concrete</span> <span class='p-phonetic'>/ˈkɒŋkriːt/</span> = <span class='p-mean'>bê tông</span> → /ɒ/</div>
 <div><span class='p-word'>overseas</span> <span class='p-phonetic'>/ˌəʊvəˈsiːz/</span> = <span class='p-mean'>nước ngoài</span> → /əʊ/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"concrete" có "o" đọc ngắn /ɒ/. Ba từ kia "o" đọc /əʊ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>metro, biogas, overseas đều /əʊ/ nên giống nhau.</span></li></ol>`);
mcq(2,"Chọn từ có phần gạch chân được phát âm khác:",
 ["inst<u>ea</u>d","h<u>ea</u>lth","w<u>ea</u>r","pl<u>ea</u>sant"],2,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "ea" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>instead</span> <span class='p-phonetic'>/ɪnˈsted/</span> = <span class='p-mean'>thay vì</span> → /e/</div>
 <div><span class='p-word'>health</span> <span class='p-phonetic'>/helθ/</span> = <span class='p-mean'>sức khỏe</span> → /e/</div>
 <div><span class='hl-green'>wear</span> <span class='p-phonetic'>/weə/</span> = <span class='p-mean'>mặc</span> → /eə/</div>
 <div><span class='p-word'>pleasant</span> <span class='p-phonetic'>/ˈpleznt/</span> = <span class='p-mean'>dễ chịu</span> → /e/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"wear" có "ea" đọc /eə/. Ba từ kia "ea" đọc ngắn /e/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>instead, health, pleasant đều /e/ nên giống nhau.</span></li></ol>`);
mcq(3,"Chọn từ có phần gạch chân được phát âm khác:",
 ["pri<u>c</u>ey","<u>c</u>ongestion","se<u>c</u>urity","<u>c</u>afeteria"],0,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "c" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>pricey</span> <span class='p-phonetic'>/ˈpraɪsi/</span> = <span class='p-mean'>đắt đỏ</span> → /s/</div>
 <div><span class='p-word'>congestion</span> <span class='p-phonetic'>/kənˈdʒestʃən/</span> = <span class='p-mean'>tắc nghẽn</span> → /k/</div>
 <div><span class='p-word'>security</span> <span class='p-phonetic'>/sɪˈkjʊərəti/</span> = <span class='p-mean'>an ninh</span> → /k/</div>
 <div><span class='p-word'>cafeteria</span> <span class='p-phonetic'>/ˌkæfəˈtɪəriə/</span> = <span class='p-mean'>căng tin</span> → /k/</div>
 </div></li>

sec("A. LANGUAGE FOCUS · III. Chọn từ/cụm từ phù hợp nhất");

mcq(7,"Residents near the _____ site complained about the loud noise throughout the day.",

 <ol><li>Phân tích 4 đáp án:

 <div><span class='p-word'>waste</span> <span class='wt'>n</span> = <span class='p-mean'>rác thải</span></div>

mcq(8,"The higher the rent prices are, _____ it is to find affordable housing in the city.",
 ["harder","the hard","the harder","the more hard"],2,

 <div><span class='hl-green'>the harder</span> = <span class='p-mean'>càng khó hơn</span></div>

 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc so sánh kép: The + comparative..., THE + comparative... → "the harder" (hard → harder).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Vế hai phải có "the"; "hard" là tính từ ngắn nên dùng "harder", không "more hard".</span></li></ol>`);
mcq(9,"High _____ in certain areas make it dangerous for people to go out late at night.",

mcq(10,"Many people move to the city _____ it's more convenient than living in the suburbs.",

 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>so (kết quả), if (điều kiện) sai logic; "despite" đi với danh từ/V-ing, không đi với mệnh đề đủ.</span></li></ol>`);
mcq(11,"At weekends, I _____ with my friends at the entertainment centre downtown.",
 ["hang out","come up","break up","get along"],0,
 `<div class="vnt">💬 Dịch: Vào cuối tuần, tôi đi chơi cùng bạn bè ở trung tâm giải trí khu trung tâm.</div>

mcq(12,"_____ makes it almost impossible to find a taxi or book a ride via Grab.",

mcq(13,"You should check traffic conditions, then decide _____ to leave for the airport.",

mcq(19,"That Japanese restaurant in the city centre is quite <u>pricey</u>, but their food is amazing.",

sec("A. LANGUAGE FOCUS · VI. Tìm lỗi sai — Bấm chọn chữ cái (A–D) của phần SAI, rồi GÕ chữ đúng để sửa");

sec("C. WRITING · I. Sắp xếp câu thành lá thư/đoạn văn hợp lý");
mcq(44,"Sắp xếp các câu (a–d) để hoàn thành lá thư:<div class='arr'><div class='ln' style='font-style:italic'>Dear Peter,</div><div class='ln'><b class='lt'>a.</b> But thanks to the amazing sky train system, getting around is really easy.</div><div class='ln'><b class='lt'>b.</b> The city is huge and so busy. There are people everywhere, and the streets are always full of cars and buses.</div><div class='ln'><b class='lt'>c.</b> I hope you're doing well! I just wanted to share how life in the city has been so far.</div><div class='ln'><b class='lt'>d.</b> When you visit me, I'll take you to one of my favourite places, the Space Museum.</div><div class='ln' style='font-style:italic'>I miss you. Write to me soon. — Thomas</div></div>",
 ["c – d – b – a","d – c – b – a","c – b – a – d","d – b – a – c"],2,
 `<div class="vnt">💬 Dịch lá thư: “Peter thân mến, ... Mình nhớ cậu. Sớm viết thư cho mình nhé. — Thomas”</div>
 <ol><li>Dịch & sắp xếp từng câu:
 <div class="grid2">
 <div><span class='hl-green'>(c)</span> I hope you're doing well! I just wanted to share how life in the city has been so far. = <span class='p-mean'>Mình mong cậu vẫn khỏe! Mình muốn chia sẻ cuộc sống ở thành phố đến giờ ra sao. (mở đầu)</span></div>
 <div><span class='hl-green'>(b)</span> The city is huge and so busy... = <span class='p-mean'>Thành phố rất rộng và nhộn nhịp; đâu đâu cũng có người, đường phố đầy xe. (mô tả)</span></div>
 <div><span class='hl-green'>(a)</span> But thanks to the amazing sky train system, getting around is really easy. = <span class='p-mean'>Nhưng nhờ hệ thống tàu điện trên cao, việc đi lại rất dễ. (chuyển ý "But")</span></div>
 <div><span class='hl-green'>(d)</span> When you visit me, I'll take you to... the Space Museum. = <span class='p-mean'>Khi cậu đến thăm, mình sẽ dẫn cậu tới Bảo tàng Vũ trụ. (lời mời — kết)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trình tự: chào hỏi (c) → mô tả thành phố (b) → "But" nêu điểm tốt (a) → lời mời khi ghé thăm (d). → <b>c – b – a – d</b>.</span></li></ol>`);
mcq(45,"Sắp xếp các câu (a–e) thành đoạn văn hợp lý:<div class='arr'><div class='ln'><b class='lt'>a.</b> But with good planning, we can fix these problems and make life more comfortable.</div><div class='ln'><b class='lt'>b.</b> Many cities today face serious problems like air pollution and traffic congestion.</div><div class='ln'><b class='lt'>c.</b> These issues make city life stressful and less healthy for the city dwellers.</div><div class='ln'><b class='lt'>d.</b> The air is often polluted because of fumes from vehicles and factories.</div><div class='ln'><b class='lt'>e.</b> Besides, people struggle with overcrowded streets and noise from construction sites every day.</div></div>",
 ["b – c – d – e – a","a – d – e – c – b","a – c – d – e – b","b – d – e – c – a"],3,
 `<div class="vnt">💬 Dịch: Sắp xếp đoạn văn về vấn đề của đời sống đô thị.</div>
 <ol><li>Dịch & sắp xếp từng câu:
 <div class="grid2">

 <div><span class='hl-green'>(d)</span> The air is often polluted because of fumes from vehicles and factories. = <span class='p-mean'>Không khí thường ô nhiễm do khói xe cộ, nhà máy. (chi tiết 1)</span></div>
 <div><span class='hl-green'>(e)</span> Besides, people struggle with overcrowded streets and noise... = <span class='p-mean'>Bên cạnh đó, người dân vật lộn với đường đông và tiếng ồn công trường. (chi tiết 2 — "Besides")</span></div>
 <div><span class='hl-green'>(c)</span> These issues make city life stressful and less healthy... = <span class='p-mean'>Những vấn đề này khiến đời sống đô thị căng thẳng, kém lành mạnh. (hệ quả — "These issues")</span></div>
 <div><span class='hl-green'>(a)</span> But with good planning, we can fix these problems... = <span class='p-mean'>Nhưng với quy hoạch tốt, ta có thể khắc phục. (giải pháp — kết)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ đề (b) → chi tiết (d) → "Besides" (e) → "These issues" hệ quả (c) → "But" giải pháp (a). → <b>b – d – e – c – a</b>.</span></li></ol>`);

 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>so amazing that...</span> = <span class='p-mean'>sai logic (tuyệt đến mức phải cẩn thận?)</span></div>
 <div><span class='p-word'>...so you should...</span> = <span class='p-mean'>sai logic (tuyệt nên phải cẩn thận?)</span></div>
 <div><span class='hl-green'>...but you should be cautious about pickpocketing.</span> = <span class='p-mean'>đúng: tương phản</span></div>
 <div><span class='p-word'>...because...</span> = <span class='p-mean'>sai logic nhân–quả</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hai ý TƯƠNG PHẢN (tuyệt ↔ phải cẩn thận móc túi) → nối bằng "but". cautious ABOUT sth.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>so...that / so / because đều tạo quan hệ nhân–quả sai logic với ngữ cảnh.</span></li></ol>`);

/* ---------- C. III. Closest meaning ---------- */
sec("C. WRITING · III. Chọn câu ĐỒNG NGHĨA với câu gốc");
mcq(50,"The public transport system in Seoul is more advanced than that in my city.",
 ["Seoul's public transport system is the most advanced system I've ever known.","Seoul's public transport system is less advanced than that in my city.","The public transport system in my city is not so advanced as that in Seoul.","The public transport system in my city is much more advanced than that in Seoul."],2,
 `<div class="vnt">💬 Dịch: Hệ thống giao thông công cộng ở Seoul tiên tiến hơn ở thành phố của tôi.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>...the most advanced I've ever known.</span> = <span class='p-mean'>so sánh nhất (khác nghĩa)</span></div>
 <div><span class='p-word'>Seoul...less advanced than my city.</span> = <span class='p-mean'>ngược nghĩa</span></div>
 <div><span class='hl-green'>my city is not so advanced as that in Seoul.</span> = <span class='p-mean'>thành phố tôi không tiên tiến bằng Seoul (đúng)</span></div>
 <div><span class='p-word'>my city is much more advanced than Seoul.</span> = <span class='p-mean'>ngược nghĩa</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Seoul more advanced than my city" = "my city NOT SO advanced AS Seoul" (so sánh bằng phủ định).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác đảo ngược nghĩa (my city tiên tiến hơn) hoặc đổi sang so sánh nhất.</span></li></ol>`);
mcq(51,"You have to leave early; otherwise, you won't be able to get to the airport on time.",
 ["If you are able to get to the airport on time, you will have to leave early.","Although you have to leave early, you won't be able to get to the airport on time.","Unless you leave early, you won't be able to get to the airport on time.","Don't leave early because you won't be able to get to the airport on time."],2,
 `<div class="vnt">💬 Dịch: Bạn phải đi sớm; nếu không, bạn sẽ không kịp đến sân bay đúng giờ.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>If you are able to...</span> = <span class='p-mean'>sai logic</span></div>
 <div><span class='p-word'>Although...</span> = <span class='p-mean'>tương phản (sai nghĩa)</span></div>
 <div><span class='hl-green'>Unless you leave early, you won't...on time.</span> = <span class='p-mean'>Trừ khi đi sớm, bạn sẽ không kịp (đúng)</span></div>
 <div><span class='p-word'>Don't leave early because...</span> = <span class='p-mean'>ngược nghĩa</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"otherwise" (nếu không) = "unless" (trừ khi). "Unless you leave early" = nếu không đi sớm.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Although (tương phản), "Don't leave early" (ngược nghĩa) đều làm sai ý câu gốc.</span></li></ol>`);
mcq(52,"It took us more than three hours to explore the downtown area of Sydney.",
 ["We spent more than three hours exploring the downtown area of Sydney.","Our exploration of the downtown area of Sydney lasted less than three hours.","Three hours was the exact time everyone needed to explore downtown Sydney.","Exploring downtown Sydney often takes up three hours of tourists' time."],0,
 `<div class="vnt">💬 Dịch: Chúng tôi mất hơn ba tiếng để khám phá khu trung tâm Sydney.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>We spent more than three hours exploring...</span> = <span class='p-mean'>Chúng tôi đã dành hơn ba tiếng để khám phá (đúng)</span></div>
 <div><span class='p-word'>...lasted less than three hours.</span> = <span class='p-mean'>ít hơn ba tiếng (sai số liệu)</span></div>
 <div><span class='p-word'>Three hours was the exact time...</span> = <span class='p-mean'>đúng ba tiếng (sai: "more than")</span></div>
 <div><span class='p-word'>...often takes up three hours...</span> = <span class='p-mean'>nói chung (đổi nghĩa)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"It took sb + time + to V" = "S + spend + time + V-ing". → We spent more than three hours exploring.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác đổi số liệu ("less than", "exact three hours") hoặc đổi nghĩa (nói chung).</span></li></ol>`);
mcq(53,"“I don't know how I can find a quiet place to study here,” Maria said.",
 ["Maria said that she didn't know how she can find a quiet place to study there.","Maria said that she didn't know how to find a quiet place to study there.","Maria said I didn't know how to find a quiet place to study here.","Maria said I don't know how she could find a quiet place to study here."],1,
 `<div class="vnt">💬 Dịch: “Mình không biết làm sao tìm được một chỗ yên tĩnh để học ở đây,” Maria nói.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>...how she can find...there.</span> = <span class='p-mean'>sai: chưa lùi thì "can"</span></div>
 <div><span class='hl-green'>Maria said that she didn't know how to find a quiet place to study there.</span> = <span class='p-mean'>đúng</span></div>
 <div><span class='p-word'>Maria said I didn't know...here.</span> = <span class='p-mean'>sai đại từ/trạng từ</span></div>
 <div><span class='p-word'>Maria said I don't know...here.</span> = <span class='p-mean'>sai (chưa lùi thì, sai đại từ)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu tường thuật: "how + S + can V" rút gọn thành "how TO V"; đổi "here" → "there".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác chưa lùi thì (can/don't), sai đại từ (I thay vì she) hoặc giữ "here".</span></li></ol>`);

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const quiz=document.getElementById('quiz');
Q.forEach((it)=>{
  if(it.sec){const d=document.createElement('div');d.className='sec';d.textContent=it.sec;quiz.appendChild(d);return;}
  TOTAL++;
  const card=document.createElement('div');card.className='card';card.id='c'+it.num;
  card.innerHTML=`<div><span class="qnum">Câu ${it.num}</span><span class="qtext">${render(it)}</span></div>`;
  if(it.type==='mcq'){
    const wrap=document.createElement('div');wrap.className='opts';
    const arr=it.opts.map((t,i)=>({t,correct:i===it.correctIdx}));shuffle(arr);
    arr.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>pickMcq(it,card,wrap,b,o.correct);wrap.appendChild(b);});
    card.appendChild(wrap);
  }else if(it.type==='txt'){
    if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='('+it.hint+')';card.appendChild(h);}
    const box=document.createElement('div');box.className='tin';
    const inp=document.createElement('input');inp.placeholder='Gõ đáp án của em...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    const act=()=>checkTxt(it,card,inp,btn);
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    box.appendChild(inp);box.appendChild(btn);card.appendChild(box);
  }else if(it.type==='cor'){
    const letters=document.createElement('div');letters.className='letters';
    const L=['A','B','C','D'];let selIdx=-1;
    const inBox=document.createElement('div');inBox.className='tin';inBox.style.display='none';
    const inp=document.createElement('input');inp.placeholder='Gõ chữ ĐÚNG để sửa...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    inBox.appendChild(inp);inBox.appendChild(btn);
    const lbtns=[];
    L.forEach((L_,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=L_;
      b.onclick=()=>{if(card.dataset.done)return;selIdx=i;lbtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        inBox.style.display='flex';inp.focus();};
      lbtns.push(b);letters.appendChild(b);});
    const act=()=>{if(selIdx<0){inp.placeholder='Hãy chọn chữ cái A–D trước!';return;}checkCor(it,card,lbtns,selIdx,inp,btn);};
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    card.appendChild(letters);card.appendChild(inBox);
  }
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=`<div class="expin">${it.exp}</div>`;
  card.appendChild(exp);quiz.appendChild(card);
});
function render(it){
  if(it.type==='cor'){const L=['A','B','C','D'];let s=it.q;
    it.parts.forEach((p,i)=>{s=s.replace('{'+p+'}',`<span class="mark">${p}<sup>${L[i]}</sup></span>`);});return s;}
  return it.q;
}
function openExp(card){card.querySelector('.exp').classList.add('open');}
function lock(card){card.dataset.done='1';answered++;updateProg();}
function pickMcq(it,card,wrap,btn,correct){
  if(card.dataset.done)return;lock(card);
  [...wrap.children].forEach(b=>{b.disabled=true;if(b.innerHTML===it.opts[it.correctIdx])b.classList.add('correct');});
  if(correct){correctCount++;btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong','shake');buzz();}
  openExp(card);
}
function checkTxt(it,card,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;
  const ok=matchWriting(inp.value,it.ans);
  if(ok){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function checkCor(it,card,lbtns,selIdx,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;lbtns.forEach(b=>b.disabled=true);
  const letterOk=selIdx===it.cIdx, textOk=matchWriting(inp.value,it.corr);
  lbtns[it.cIdx].classList.add('correct');
  if(selIdx!==it.cIdx)lbtns[selIdx].classList.add('wrong');
  if(letterOk&&textOk){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function openName(){document.getElementById('nameOv').classList.add('show');document.getElementById('nameIn').focus();}
function showResult(){
  const n=document.getElementById('nameIn').value.trim();
  const err=document.getElementById('nameErr'),inp=document.getElementById('nameIn');
  if(!n){inp.classList.add('err');err.textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('nameOv').classList.remove('show');
  const pct=correctCount/TOTAL, ten=(correctCount/TOTAL*10).toFixed(2);
  let greet,meme;
  if(pct===1){greet='🌟 THIÊN TÀI! '+n+' xuất sắc tuyệt đối!';meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+n+' làm rất tốt, cố thêm chút nữa nhé!';meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN '+n+'! Ôn lại phần giải thích rồi làm lại nha!';meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent='✅ '+correctCount+' / '+TOTAL+' câu đúng';
  document.getElementById('rTen').textContent='📊 Điểm quy đổi: '+ten+' / 10';
  const img=document.getElementById('rMeme'),fall=document.getElementById('rFall');
  img.style.display='block';fall.style.display='none';img.src=meme;
  img.onerror=()=>{img.style.display='none';fall.style.display='block';
    fall.textContent=pct===1?'🎉🏆🎉':(pct>=0.6?'😄👍':'😭💧');};
  document.getElementById('resOv').classList.add('show');
  if(pct>=0.6){confetti();setTimeout(confetti,400);}
}
updateProg();
</script>
