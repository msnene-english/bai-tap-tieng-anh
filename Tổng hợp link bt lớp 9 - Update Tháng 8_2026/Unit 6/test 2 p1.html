<script>
(function(){const items=['🪷','🎋','🌾','🏮','🍵','🌸','🛶','🌿','🐉','🪷','🎋','🌾','🍵','🌸','🌿','🏮'];

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#10b981','#f472b6','#fbbf24','#fde047','#047857','#fcd34d','#00D26A'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Ms. Chí Nên · ULIS giải thích chi tiết";

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",

 exp:`<div class="vnt">💬 Dịch: Chọn từ có phụ âm gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",

     <div><span class='p-word'>str<u>u</u>cture</span> <span class='p-phonetic'>/ˈstrʌktʃə/</span> = <span class='p-mean'>cấu trúc</span> → âm <b>/ʌ/</b></div>
     <div><span class='hl-green'>nuclear</span> <span class='p-phonetic'>/ˈnjuːkliə/</span> = <span class='p-mean'>hạt nhân</span> → âm <b>/juː/</b></div>
     <div><span class='p-word'>d<u>u</u>sty</span> <span class='p-phonetic'>/ˈdʌsti/</span> = <span class='p-mean'>bụi bặm</span> → âm <b>/ʌ/</b></div>
     <div><span class='p-word'>constr<u>u</u>ction</span> <span class='p-phonetic'>/kənˈstrʌkʃn/</span> = <span class='p-mean'>sự xây dựng</span> → âm <b>/ʌ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"nuclear" có "u" đọc là /juː/ (dài), khác với ba từ kia có "u" đọc là /ʌ/ (ngắn).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>structure, dusty, construction đều có âm /ʌ/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:3,type:"mcq",
 q:"Choose the word whose <u>underlined</u> \"e\" is pronounced differently.",
 options:[{t:"dep<u>e</u>ndent",c:false},{t:"tr<u>e</u>nd",c:false},{t:"d<u>e</u>mocratic",c:false},{t:"<u>e</u>xtended",c:true}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "e" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>dep<u>e</u>ndent</span> <span class='p-phonetic'>/dɪˈpendənt/</span> = <span class='p-mean'>phụ thuộc</span> → âm <b>/e/</b></div>
     <div><span class='p-word'>tr<u>e</u>nd</span> <span class='p-phonetic'>/trend/</span> = <span class='p-mean'>xu hướng</span> → âm <b>/e/</b></div>
     <div><span class='p-word'>d<u>e</u>mocratic</span> <span class='p-phonetic'>/ˌdeməˈkrætɪk/</span> = <span class='p-mean'>dân chủ</span> → âm <b>/e/</b></div>
     <div><span class='hl-green'>extended</span> <span class='p-phonetic'>/ɪkˈstendɪd/</span> = <span class='p-mean'>mở rộng</span> → âm <b>/ɪ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"extended" có "e" (đầu, không nhấn) đọc là /ɪ/, khác với ba từ kia có "e" đọc là /e/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>dependent, trend, democratic đều có "e" đọc /e/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"II. Chọn từ có TRỌNG ÂM khác với các từ còn lại",n:4,type:"mcq",
 q:"Choose the word whose stress pattern is different.",
 options:[{t:"device",c:true},{t:"household",c:false},{t:"lifestyle",c:false},{t:"freedom",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi vào vị trí khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>device</span> <span class='p-phonetic'>/dɪˈvaɪs/</span> = <span class='p-mean'>thiết bị</span> → trọng âm <b>2</b></div>
     <div><span class='p-word'>household</span> <span class='p-phonetic'>/ˈhaʊshəʊld/</span> = <span class='p-mean'>hộ gia đình</span> → trọng âm <b>1</b></div>
     <div><span class='p-word'>lifestyle</span> <span class='p-phonetic'>/ˈlaɪfstaɪl/</span> = <span class='p-mean'>lối sống</span> → trọng âm <b>1</b></div>
     <div><span class='p-word'>freedom</span> <span class='p-phonetic'>/ˈfriːdəm/</span> = <span class='p-mean'>tự do</span> → trọng âm <b>1</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"device" nhấn âm tiết thứ 2 (de-VICE), khác với ba từ kia nhấn âm tiết đầu.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>household, lifestyle, freedom đều nhấn âm tiết đầu tiên.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"II. Chọn từ có TRỌNG ÂM khác với các từ còn lại",n:5,type:"mcq",
 q:"Choose the word whose stress pattern is different.",
 options:[{t:"opportunity",c:true},{t:"traditional",c:false},{t:"reliable",c:false},{t:"profession",c:false}],

 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>opportunity</span> <span class='p-phonetic'>/ˌɒpəˈtjuːnəti/</span> = <span class='p-mean'>cơ hội</span> → trọng âm <b>3</b></div>
     <div><span class='p-word'>traditional</span> <span class='p-phonetic'>/trəˈdɪʃənl/</span> = <span class='p-mean'>truyền thống</span> → trọng âm <b>2</b></div>

     <div><span class='p-word'>profession</span> <span class='p-phonetic'>/prəˈfeʃn/</span> = <span class='p-mean'>nghề nghiệp</span> → trọng âm <b>2</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"opportunity" nhấn âm tiết thứ 3 (op-por-TU-ni-ty), khác với ba từ kia nhấn âm tiết thứ 2.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>traditional, reliable, profession đều nhấn âm tiết thứ 2.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:6,type:"mcq",
 q:"Nowadays, teens are given more freedom ____ choice in choosing their hobbies.",
 options:[{t:"in",c:false},{t:"for",c:false},{t:"with",c:false},{t:"of",c:true}],

 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>trong</span></div>
     <div><span class='p-word'>for</span> <span class='wt'>prep</span> = <span class='p-mean'>cho</span></div>
     <div><span class='p-word'>with</span> <span class='wt'>prep</span> = <span class='p-mean'>với</span></div>
     <div><span class='hl-green'>of</span> <span class='wt'>prep</span> = <span class='p-mean'>(freedom OF choice)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "freedom OF choice" = quyền tự do lựa chọn.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"freedom" không đi với in/for/with theo cụm "tự do lựa chọn".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:7,type:"mcq",
 q:"A(n) ____ family typically consists of two parents and their children living together in one household.",
 options:[{t:"extended",c:false},{t:"family-oriented",c:false},{t:"nuclear",c:true},{t:"western",c:false}],
 exp:`<div class="vnt">💬 Dịch: Một gia đình hạt nhân thường gồm hai bố mẹ và con cái sống chung trong một hộ gia đình.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>extended</span> <span class='wt'>adj</span> = <span class='p-mean'>(đại gia đình, nhiều thế hệ)</span></div>
     <div><span class='p-word'>family-oriented</span> <span class='wt'>adj</span> = <span class='p-mean'>hướng về gia đình</span></div>
     <div><span class='hl-green'>nuclear</span> <span class='wt'>adj</span> = <span class='p-mean'>(gia đình hạt nhân: bố mẹ + con)</span></div>
     <div><span class='p-word'>western</span> <span class='wt'>adj</span> = <span class='p-mean'>phương Tây</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Định nghĩa "hai bố mẹ + con cái" chính là "nuclear family" (gia đình hạt nhân).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"extended family" gồm cả họ hàng nhiều thế hệ (không khớp định nghĩa); family-oriented/western không chỉ loại gia đình này.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:8,type:"mcq",
 q:"I wanted to know ____ my mum cooked that delicious dish without using any oil.",
 options:[{t:"when",c:false},{t:"how",c:true},{t:"what",c:false},{t:"who",c:false}],
 exp:`<div class="vnt">💬 Dịch: Tôi muốn biết bằng cách nào mẹ tôi nấu được món ngon đó mà không dùng chút dầu nào.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>when</span> <span class='wt'>wh-</span> = <span class='p-mean'>khi nào</span></div>
     <div><span class='hl-green'>how</span> <span class='wt'>wh-</span> = <span class='p-mean'>bằng cách nào</span></div>
     <div><span class='p-word'>what</span> <span class='wt'>wh-</span> = <span class='p-mean'>cái gì</span></div>
     <div><span class='p-word'>who</span> <span class='wt'>wh-</span> = <span class='p-mean'>ai</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hỏi về CÁCH THỨC nấu ăn (không dùng dầu) → dùng "how" (bằng cách nào).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>when (thời gian), what (vật), who (người) không hợp với việc hỏi "cách nấu".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:9,type:"mcq",
 q:"It's important for students to ____ during lessons to help remember key points.",
 options:[{t:"take breaks",c:false},{t:"make decisions",c:false},{t:"take notes",c:true},{t:"hold meetings",c:false}],
 exp:`<div class="vnt">💬 Dịch: Việc ghi chép trong giờ học rất quan trọng để giúp nhớ những điểm chính.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>take breaks</span> = <span class='p-mean'>nghỉ giải lao</span></div>
     <div><span class='p-word'>make decisions</span> = <span class='p-mean'>đưa ra quyết định</span></div>
     <div><span class='hl-green'>take notes</span> = <span class='p-mean'>ghi chép</span></div>
     <div><span class='p-word'>hold meetings</span> = <span class='p-mean'>tổ chức họp</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Để "nhớ điểm chính" trong giờ học → "take notes" (ghi chép) là hợp lí nhất.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>nghỉ giải lao, ra quyết định, tổ chức họp không giúp trực tiếp ghi nhớ bài học.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:10,type:"mcq",
 q:"When Peter was a child, he really enjoyed ____ wooden toys with his grandpa.",
 options:[{t:"to make",c:false},{t:"make",c:false},{t:"made",c:false},{t:"making",c:true}],
 exp:`<div class="vnt">💬 Dịch: Khi còn nhỏ, Peter rất thích làm đồ chơi gỗ cùng ông của cậu.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>to make</span> <span class='wt'>to-V</span> = <span class='p-mean'>(sai)</span></div>
     <div><span class='p-word'>make</span> <span class='wt'>V</span> = <span class='p-mean'>(sai)</span></div>
     <div><span class='p-word'>made</span> <span class='wt'>V2</span> = <span class='p-mean'>(sai)</span></div>
     <div><span class='hl-green'>making</span> <span class='wt'>V-ing</span> = <span class='p-mean'>việc làm</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "enjoy + V-ing" (thích làm gì) → enjoyed making.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Sau "enjoy" KHÔNG dùng to-V, V nguyên mẫu hay V2; phải là V-ing.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:11,type:"mcq",
 q:"In the past, people often ____ careers that were stable, rather than based on passion.",
 options:[{t:"pursued",c:true},{t:"replaced",c:false},{t:"promised",c:false},{t:"changed",c:false}],
 exp:`<div class="vnt">💬 Dịch: Trong quá khứ, người ta thường theo đuổi những nghề nghiệp ổn định thay vì dựa trên đam mê.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>pursued</span> <span class='wt'>v</span> = <span class='p-mean'>theo đuổi</span></div>
     <div><span class='p-word'>replaced</span> <span class='wt'>v</span> = <span class='p-mean'>thay thế</span></div>
     <div><span class='p-word'>promised</span> <span class='wt'>v</span> = <span class='p-mean'>hứa</span></div>
     <div><span class='p-word'>changed</span> <span class='wt'>v</span> = <span class='p-mean'>thay đổi</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"pursue a career" = theo đuổi một nghề nghiệp — hợp với "nghề ổn định".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>replace/promise/change không kết hợp tự nhiên với "careers" theo nghĩa "lựa chọn theo đuổi nghề".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:12,type:"mcq",
 q:"To pay her tuition fees at university, Miranda saves ____ money every month.",
 options:[{t:"a few",c:false},{t:"a little",c:true},{t:"any",c:false},{t:"many",c:false}],
 exp:`<div class="vnt">💬 Dịch: Để đóng học phí đại học, Miranda tiết kiệm một ít tiền mỗi tháng.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>a few</span> = <span class='p-mean'>một vài (đếm được)</span></div>
     <div><span class='hl-green'>a little</span> = <span class='p-mean'>một ít (không đếm được)</span></div>
     <div><span class='p-word'>any</span> = <span class='p-mean'>bất kỳ (phủ định/nghi vấn)</span></div>
     <div><span class='p-word'>many</span> = <span class='p-mean'>nhiều (đếm được)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"money" là danh từ KHÔNG đếm được → dùng "a little" (một ít). a few/many dùng cho danh từ đếm được.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>a few, many dùng cho danh từ đếm được; "any" không hợp trong câu khẳng định này.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:13,type:"mcq",
 q:"Technology has given students more ____ to access various learning resources.",
 options:[{t:"professions",c:false},{t:"changes",c:false},{t:"materials",c:false},{t:"opportunities",c:true}],
 exp:`<div class="vnt">💬 Dịch: Công nghệ đã cho học sinh nhiều cơ hội hơn để tiếp cận các nguồn học liệu đa dạng.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>professions</span> <span class='wt'>n</span> = <span class='p-mean'>nghề nghiệp</span></div>
     <div><span class='p-word'>changes</span> <span class='wt'>n</span> = <span class='p-mean'>sự thay đổi</span></div>
     <div><span class='p-word'>materials</span> <span class='wt'>n</span> = <span class='p-mean'>tài liệu, vật liệu</span></div>
     <div><span class='hl-green'>opportunities</span> <span class='wt'>n</span> = <span class='p-mean'>cơ hội</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"give sb more opportunities to do st" = cho ai nhiều cơ hội hơn để làm gì (tiếp cận học liệu).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>professions/changes/materials không hợp với cấu trúc "more ___ to access resources".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:14,type:"mcq",
 q:"Though my dad is very busy, he has ____ to spend more time with me this holiday.",
 options:[{t:"fancied",c:false},{t:"suggested",c:false},{t:"promised",c:true},{t:"avoided",c:false}],
 exp:`<div class="vnt">💬 Dịch: Mặc dù bố tôi rất bận, ông đã hứa sẽ dành nhiều thời gian hơn cho tôi trong kỳ nghỉ này.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>fancied</span> <span class='wt'>v</span> = <span class='p-mean'>thích</span></div>
     <div><span class='p-word'>suggested</span> <span class='wt'>v</span> = <span class='p-mean'>đề nghị</span></div>
     <div><span class='hl-green'>promised</span> <span class='wt'>v</span> = <span class='p-mean'>hứa</span></div>
     <div><span class='p-word'>avoided</span> <span class='wt'>v</span> = <span class='p-mean'>tránh</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"promise TO V" (hứa làm gì). Sau chỗ trống là "to spend" → "promised to spend". fancy/avoid + V-ing (không đi với to-V); suggest + V-ing/that-clause.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>fancy/avoid đi với V-ing; suggest không đi với to-V — chỉ "promise" hợp cả nghĩa lẫn cấu trúc "to V".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:15,type:"mcq",
 q:"Cindy: \"Good news! My grandma will help us with the project on classrooms in the past.\" — Dylan: \"____\"",
 options:[{t:"Do you mind helping me with that?",c:false},{t:"Great! Don't worry about it.",c:false},{t:"Awesome! Tell her I say thanks.",c:true},{t:"No problem. I appreciate it.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Cindy: "Tin vui đây! Bà mình sẽ giúp tụi mình làm dự án về lớp học ngày xưa." — Dylan: "Tuyệt quá! Nói với bà là mình cảm ơn nhé."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>Do you mind helping me with that?</span> = <span class='p-mean'>Cậu giúp mình việc đó nhé?</span></div>
     <div><span class='p-word'>Great! Don't worry about it.</span> = <span class='p-mean'>Tuyệt! Đừng lo về việc đó.</span></div>
     <div><span class='hl-green'>Awesome! Tell her I say thanks.</span> = <span class='p-mean'>Tuyệt quá! Nói với bà là mình cảm ơn nhé.</span></div>
     <div><span class='p-word'>No problem. I appreciate it.</span> = <span class='p-mean'>Không sao. Mình cảm kích lắm.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Nghe tin bà sẽ giúp → Dylan vui và nhờ chuyển lời cảm ơn tới bà: "Awesome! Tell her I say thanks."</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác là nhờ vả/đáp lời cảm ơn, không hợp với việc phản hồi "bà sẽ giúp".</span></li></ol>`},

/* IV. Closest meaning */
{sec:"A. LANGUAGE FOCUS",part:"IV. Chọn từ GẦN nghĩa nhất với từ gạch chân",n:16,type:"mcq",
 q:"In the past, farmers <u>depended on</u> animal power to plough fields and transport goods.",
 options:[{t:"took out",c:false},{t:"ran on",c:false},{t:"gave up",c:false},{t:"relied on",c:true}],
 exp:`<div class="vnt">💬 Dịch: Trong quá khứ, nông dân dựa vào sức kéo của gia súc để cày ruộng và vận chuyển hàng hóa.</div>
 <ol><li>Phân tích 4 đáp án (cụm gạch chân <span class='p-word'>depended on</span> = <span class='p-mean'>dựa vào</span>):
   <div class="grid2">
     <div><span class='p-word'>took out</span> <span class='wt'>phr.v</span> = <span class='p-mean'>lấy ra</span></div>
     <div><span class='p-word'>ran on</span> <span class='wt'>phr.v</span> = <span class='p-mean'>chạy bằng (nhiên liệu)</span></div>
     <div><span class='p-word'>gave up</span> <span class='wt'>phr.v</span> = <span class='p-mean'>từ bỏ</span></div>
     <div><span class='hl-green'>relied on</span> <span class='wt'>phr.v</span> = <span class='p-mean'>dựa vào</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"depend on" (dựa vào, phụ thuộc vào) đồng nghĩa với "rely on".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>take out (lấy ra), run on (chạy bằng), give up (từ bỏ) khác nghĩa với "dựa vào".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Chọn từ GẦN nghĩa nhất với từ gạch chân",n:17,type:"mcq",
 q:"You shouldn't share <u>private</u> information like bank details or addresses on Facebook.",
 options:[{t:"personal",c:true},{t:"extended",c:false},{t:"public",c:false},{t:"free",c:false}],
 exp:`<div class="vnt">💬 Dịch: Bạn không nên chia sẻ thông tin cá nhân như số tài khoản ngân hàng hay địa chỉ trên Facebook.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>private</span> = <span class='p-mean'>riêng tư, cá nhân</span>):
   <div class="grid2">
     <div><span class='hl-green'>personal</span> <span class='wt'>adj</span> = <span class='p-mean'>cá nhân</span></div>
     <div><span class='p-word'>extended</span> <span class='wt'>adj</span> = <span class='p-mean'>mở rộng</span></div>
     <div><span class='p-word'>public</span> <span class='wt'>adj</span> = <span class='p-mean'>công khai</span></div>
     <div><span class='p-word'>free</span> <span class='wt'>adj</span> = <span class='p-mean'>miễn phí, tự do</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"private information" (thông tin riêng tư) đồng nghĩa với "personal information" (thông tin cá nhân).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"public" là TRÁI nghĩa (công khai); extended/free không đồng nghĩa với "riêng tư".</span></li></ol>`},

/* V. Opposite meaning */
{sec:"A. LANGUAGE FOCUS",part:"V. Chọn từ TRÁI nghĩa nhất với từ gạch chân",n:18,type:"mcq",
 q:"The store sells <u>various</u> types of clothing, from casual clothing to formal outfits.",
 options:[{t:"different",c:false},{t:"same",c:true},{t:"traditional",c:false},{t:"modern",c:false}],
 exp:`<div class="vnt">💬 Dịch: Cửa hàng bán nhiều loại quần áo khác nhau, từ đồ thường ngày đến trang phục trang trọng.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>various</span> = <span class='p-mean'>đa dạng, khác nhau</span>):
   <div class="grid2">
     <div><span class='p-word'>different</span> <span class='wt'>adj</span> = <span class='p-mean'>khác nhau (đồng nghĩa)</span></div>
     <div><span class='hl-green'>same</span> <span class='wt'>adj</span> = <span class='p-mean'>giống nhau</span></div>
     <div><span class='p-word'>traditional</span> <span class='wt'>adj</span> = <span class='p-mean'>truyền thống</span></div>
     <div><span class='p-word'>modern</span> <span class='wt'>adj</span> = <span class='p-mean'>hiện đại</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"various" (đa dạng, nhiều loại khác nhau) TRÁI nghĩa với "same" (giống nhau).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"different" là ĐỒNG nghĩa (bẫy); traditional/modern không phải trái nghĩa của "đa dạng".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chọn từ TRÁI nghĩa nhất với từ gạch chân",n:19,type:"mcq",
 q:"My grandpa enjoys <u>old-fashioned</u> hobbies like woodworking, journaling, or collecting stamps.",
 options:[{t:"outdated",c:false},{t:"modern",c:true},{t:"popular",c:false},{t:"historic",c:false}],
 exp:`<div class="vnt">💬 Dịch: Ông tôi thích những thú vui kiểu cổ điển như làm mộc, viết nhật ký, hay sưu tầm tem.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>old-fashioned</span> = <span class='p-mean'>lỗi thời, cổ điển</span>):
   <div class="grid2">
     <div><span class='p-word'>outdated</span> <span class='wt'>adj</span> = <span class='p-mean'>lỗi thời (đồng nghĩa)</span></div>
     <div><span class='hl-green'>modern</span> <span class='wt'>adj</span> = <span class='p-mean'>hiện đại</span></div>
     <div><span class='p-word'>popular</span> <span class='wt'>adj</span> = <span class='p-mean'>phổ biến</span></div>
     <div><span class='p-word'>historic</span> <span class='wt'>adj</span> = <span class='p-mean'>mang tính lịch sử</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"old-fashioned" (cổ điển, kiểu cũ) TRÁI nghĩa với "modern" (hiện đại).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"outdated" là ĐỒNG nghĩa (bẫy); popular/historic không phải trái nghĩa của "cổ điển".</span></li></ol>`},

/* VI. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"VI. Tìm phần gạch chân SAI và sửa lại cho đúng",n:20,type:"error",
 q:"In <u>theirs</u> village, most people still <u>practise farming</u> and <u>live in</u> traditional houses <u>made of</u> clay and wood.",
 options:["theirs","practise farming","live in","made of"],correctIdx:0,
 accept:["their"],key:"theirs → their",
 exp:`<div class="vnt">💬 Dịch: Ở ngôi làng của họ, hầu hết mọi người vẫn làm nông và sống trong những ngôi nhà truyền thống làm từ đất sét và gỗ.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>theirs</span> → sửa thành <span class='hl-green'>their</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Trước danh từ "village" phải dùng TÍNH TỪ SỞ HỮU "their" (của họ), không dùng ĐẠI TỪ SỞ HỮU "theirs" (đứng một mình).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Tìm phần gạch chân SAI và sửa lại cho đúng",n:21,type:"error",
 q:"Everyone has <u>the right</u> to vote and <u>express</u> their opinions <u>freely</u> in a <u>democracy</u> society.",
 options:["the right","express","freely","democracy"],correctIdx:3,
 accept:["democratic"],key:"democracy → democratic",
 note:"👉 Câu cuối rồi, cố lên nhé! 💪",
 exp:`<div class="vnt">💬 Dịch: Mọi người đều có quyền bầu cử và bày tỏ ý kiến một cách tự do trong một xã hội dân chủ.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>democracy</span> → sửa thành <span class='hl-green'>democratic</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Trước danh từ "society" cần TÍNH TỪ → "a democratic society" (xã hội dân chủ). "democracy" là danh từ (nền dân chủ).</span></li></ol>`},

/* VII. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",
 q:"Brad, our play ______ (start) at 7 p.m. this Sunday. Make sure to show up early!",
 answer:["starts"],
 exp:`<div class="vnt">💬 Dịch: Brad này, vở kịch của chúng ta bắt đầu lúc 7 giờ tối Chủ nhật này. Nhớ đến sớm nhé!</div>
 <ol><li>Đáp án: <span class='hl-green'>starts</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Lịch trình/thời gian biểu cố định (giờ diễn kịch) → dùng Hiện tại đơn. Chủ ngữ "our play" (số ít) → starts.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:23,type:"fill",
 q:"Back then, families ______ (spend) more time sharing stories during meals.",
 answer:["spent"],
 exp:`<div class="vnt">💬 Dịch: Ngày xưa, các gia đình dành nhiều thời gian hơn để kể chuyện cho nhau trong bữa ăn.</div>
 <ol><li>Đáp án: <span class='hl-green'>spent</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "Back then" (ngày xưa) → Quá khứ đơn. "spend" bất quy tắc: spend → spent.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",
 q:"______ you ______ (ever/ try) living for a week without using your phone? <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["have ever tried","have you ever tried"],
 exp:`<div class="vnt">💬 Dịch: Bạn đã bao giờ thử sống một tuần mà không dùng điện thoại chưa?</div>
 <ol><li>Đáp án: <span class='hl-green'>Have</span> you <span class='hl-green'>ever tried</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hỏi TRẢI NGHIỆM với "ever" (đã bao giờ) → thì Hiện tại hoàn thành: "Have you ever tried…?". Sau "try" dùng V-ing (tried living).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:25,type:"fill",
 q:"Jim told me he ______ (memorise) some historical events for his test then.",
 answer:["was memorising","was memorizing"],
 exp:`<div class="vnt">💬 Dịch: Jim nói với tôi rằng lúc đó cậu ấy đang học thuộc một số sự kiện lịch sử cho bài kiểm tra.</div>
 <ol><li>Đáp án: <span class='hl-green'>was memorising</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu tường thuật (told) + "then" (lúc đó) diễn tả hành động đang diễn ra trong quá khứ → Quá khứ tiếp diễn "was memorising".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:26,type:"fill",
 q:"My parents always let me ______ (participate) in any after-school club I like.",
 answer:["participate"],
 exp:`<div class="vnt">💬 Dịch: Bố mẹ luôn để tôi tham gia bất kỳ câu lạc bộ ngoại khóa nào tôi thích.</div>
 <ol><li>Đáp án: <span class='hl-green'>participate</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "let sb + V(nguyên mẫu, không "to")" (để/cho ai làm gì) → let me participate.</span></li></ol>`},

/* VIII. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"We always ______ to adopt a greener lifestyle to protect our planet. <span class='hint-word'>(choice)</span>",
 answer:["choose"],
 exp:`<div class="vnt">💬 Dịch: Chúng tôi luôn <b>lựa chọn</b> một lối sống xanh hơn để bảo vệ hành tinh của mình.</div>
 <ol><li>Từ gốc: <span class='p-word'>choice</span> <span class='wt'>n</span> = <span class='p-mean'>sự lựa chọn</span> → dạng cần điền: <span class='hl-green'>choose</span> <span class='wt'>v</span> = <span class='p-mean'>chọn</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: choose</span> <span class='p-grammar'>Cần ĐỘNG TỪ làm vị ngữ (We always ___ to adopt…). Biến danh từ choice → động từ choose.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"______ clothing like jeans or T-shirts is comfortable and easy to wear. <span class='hint-word'>(west)</span>",
 answer:["western"],
 exp:`<div class="vnt">💬 Dịch: Trang phục <b>phương Tây</b> như quần jean hay áo phông thì thoải mái và dễ mặc.</div>
 <ol><li>Từ gốc: <span class='p-word'>west</span> <span class='wt'>n</span> = <span class='p-mean'>phương Tây</span> → dạng cần điền: <span class='hl-green'>Western</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc phương Tây</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: Western</span> <span class='p-grammar'>Cần TÍNH TỪ trước danh từ "clothing", viết hoa vì đầu câu → "Western clothing". west → western.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"With a supportive family, he can ______ pursue his dream job. <span class='hint-word'>(free)</span>",
 answer:["freely"],
 exp:`<div class="vnt">💬 Dịch: Với một gia đình luôn ủng hộ, anh ấy có thể <b>thoải mái</b> theo đuổi công việc mơ ước.</div>
 <ol><li>Từ gốc: <span class='p-word'>free</span> <span class='wt'>adj</span> = <span class='p-mean'>tự do</span> → dạng cần điền: <span class='hl-green'>freely</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách tự do</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: freely</span> <span class='p-grammar'>Cần TRẠNG TỪ bổ nghĩa cho động từ "pursue" (theo đuổi một cách tự do). free → freely.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:30,type:"fill",
 q:"The café has ______ decorations, which attracts many young people. <span class='hint-word'>(trend)</span>",
 answer:["trendy"],
 exp:`<div class="vnt">💬 Dịch: Quán cà phê có cách trang trí <b>hợp mốt/thời thượng</b>, thu hút rất nhiều bạn trẻ.</div>
 <ol><li>Từ gốc: <span class='p-word'>trend</span> <span class='wt'>n</span> = <span class='p-mean'>xu hướng</span> → dạng cần điền: <span class='hl-green'>trendy</span> <span class='wt'>adj</span> = <span class='p-mean'>hợp mốt, thời thượng</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: trendy</span> <span class='p-grammar'>Cần TÍNH TỪ trước danh từ "decorations" → "trendy decorations". trend → trendy.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:31,type:"fill",
 q:"There is a big ______ between learning by rote and understanding. <span class='hint-word'>(different)</span>",
 answer:["difference"],
 exp:`<div class="vnt">💬 Dịch: Có một <b>sự khác biệt</b> lớn giữa việc học vẹt và việc thấu hiểu.</div>
 <ol><li>Từ gốc: <span class='p-word'>different</span> <span class='wt'>adj</span> = <span class='p-mean'>khác nhau</span> → dạng cần điền: <span class='hl-green'>difference</span> <span class='wt'>n</span> = <span class='p-mean'>sự khác biệt</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: difference</span> <span class='p-grammar'>Sau "a big ___" cần DANH TỪ (a big difference = một sự khác biệt lớn). different → difference.</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Chọn thứ tự sắp xếp câu & câu kết hợp lí",n:44,type:"mcq",
 q:"Sắp xếp các câu (a–c) điền vào sau câu mở đầu để tạo đoạn văn hợp lí:<br><div class='dialog'><b>Mở đầu:</b> My village used to be a very quiet and simple place.<br><b>a.</b> Technology brought electricity, internet, and smartphones, changing how people communicated and worked.<br><b>b.</b> However, with time, new roads were built, and soon cars began to replace horse-drawn carts.<br><b>c.</b> Most people relied on farming, and the village was surrounded by fields and nature.</div>",
 options:[{t:"c – b – a",c:true},{t:"c – a – b",c:false},{t:"b – a – c",c:false},{t:"a – c – b",c:false}],
 exp:`<div class="vnt">💬 Chủ đề: Ngôi làng thay đổi từ yên bình sang hiện đại. Thứ tự đúng là <b>c – b – a</b>.</div>
 <ol><li>Dịch &amp; trình tự hợp lí:
   <div class="orderline"><span class="lbl">c</span> <span class="p-en">Most people relied on farming, and the village was surrounded by fields and nature.</span> — <span class="p-mean">Hầu hết mọi người làm nông, và ngôi làng được bao quanh bởi đồng ruộng và thiên nhiên.</span> <i>(tả làng xưa – nối với "quiet and simple place")</i></div>
   <div class="orderline"><span class="lbl">b</span> <span class="p-en">However, with time, new roads were built, and soon cars began to replace horse-drawn carts.</span> — <span class="p-mean">Tuy nhiên, theo thời gian, những con đường mới được xây, và ô tô dần thay thế xe ngựa.</span> <i>("However" – bắt đầu thay đổi)</i></div>
   <div class="orderline"><span class="lbl">a</span> <span class="p-en">Technology brought electricity, internet, and smartphones, changing how people communicated and worked.</span> — <span class="p-mean">Công nghệ mang đến điện, internet và điện thoại thông minh, làm thay đổi cách người ta giao tiếp và làm việc.</span> <i>(thay đổi sâu hơn – kết đoạn)</i></div>
 </li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Tả làng xưa yên bình (c) → "However" đường sá thay đổi (b) → công nghệ thay đổi sâu sắc hơn (a). Mạch: quá khứ → chuyển biến → hiện đại, nên c – b – a.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các thứ tự khác đặt "However" (b) hoặc câu công nghệ (a) lên trước câu tả làng xưa (c), làm đứt mạch thời gian.</span></li></ol>`},

{sec:"C. WRITING",part:"I. Chọn thứ tự sắp xếp câu & câu kết hợp lí",n:45,type:"mcq",
 q:"Chọn câu KẾT phù hợp nhất cho đoạn văn về ngôi làng (ở câu 44):",
 options:[{t:"Despite the changes, the village still remains a close-knit community and maintains its old traditions.",c:true},
          {t:"Once, the village was a safe place, and the fields stretched far beyond the horizon.",c:false},
          {t:"The village used to hold its charm with bustling shops and crowded streets.",c:false},
          {t:"Nowadays we can hear the sounds of birds singing and children's laughter outside.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Bất chấp mọi đổi thay, ngôi làng vẫn là một cộng đồng gắn bó và giữ gìn những truyền thống xưa cũ.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>Despite the changes, the village still remains a close-knit community and maintains its old traditions.</span> = <span class='p-mean'>Dù thay đổi, làng vẫn gắn bó và giữ truyền thống.</span></div>
     <div><span class='p-word'>Once, the village was a safe place...</span> = <span class='p-mean'>Xưa kia, làng là nơi an toàn...</span></div>
     <div><span class='p-word'>The village used to hold its charm with bustling shops...</span> = <span class='p-mean'>Làng từng có nét quyến rũ với các cửa hàng nhộn nhịp...</span></div>
     <div><span class='p-word'>Nowadays we can hear the sounds of birds...</span> = <span class='p-mean'>Ngày nay ta có thể nghe tiếng chim hót...</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đoạn văn nói về SỰ THAY ĐỔI của làng → câu kết cần TỔNG KẾT: "Despite the changes… still remains…" (dù đổi thay, làng vẫn gắn bó, giữ truyền thống). Câu A khép lại ý nghĩa cả đoạn.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B, C nói về quá khứ (không phải câu kết); D chỉ tả âm thanh, không tổng kết được sự đổi thay của làng.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu gần nghĩa nhất với câu gốc",n:46,type:"mcq",
 q:"Câu gốc: <em>This is the first time my grandpa has heard about smart homes with voice control.</em>",
 options:[{t:"My grandpa didn't use to hear about smart homes with voice control.",c:false},
          {t:"My grandpa has never heard about smart homes with voice control before.",c:true},
          {t:"My grandpa wasn't hearing about smart homes with voice control at that time.",c:false},
          {t:"My grandpa would never hear about smart homes with voice control.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Ông tôi chưa từng nghe về nhà thông minh điều khiển bằng giọng nói bao giờ.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>My grandpa has never heard about smart homes with voice control before.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"This is the first time + S + have/has V3" (lần đầu tiên) = "S + have/has never + V3 + before" (chưa từng… trước đây). Cùng thì Hiện tại hoàn thành.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"didn't use to / wasn't hearing / would never" đều sai thì hoặc sai nghĩa so với "lần đầu tiên".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu gần nghĩa nhất với câu gốc",n:47,type:"mcq",
 q:"Câu gốc: <em>Our family had an agreement not to mention work or study during dinner.</em>",
 options:[{t:"Our family agreed not mentioning work or study during dinner.",c:false},
          {t:"Our family preferred to mention work or study during dinner.",c:false},
          {t:"Our family agreed not to mention work or study during dinner.",c:true},
          {t:"Our family preferred mentioning work or study during dinner.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Gia đình tôi đã thống nhất không nhắc đến chuyện công việc hay học hành trong bữa tối.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Our family agreed not to mention work or study during dinner.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"had an agreement not to do st" (có thỏa thuận không làm gì) = "agreed not to do st" (đồng ý không làm gì). "agree TO V", phủ định "not to V".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"agreed not mentioning" sai (phải "not to mention"); "preferred to mention/mentioning" đổi nghĩa (thích nhắc đến).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu gần nghĩa nhất với câu gốc",n:48,type:"mcq",
 q:"Câu gốc: <em>\"You should protect these online accounts with unique passwords.\"</em> (Mẹ nói với tôi)",
 options:[{t:"My mum said she should protect those online accounts with unique passwords.",c:false},
          {t:"My mum said we shall protect these online accounts with unique passwords.",c:false},
          {t:"My mum advised me to protect those online accounts with unique passwords.",c:true},
          {t:"My mum advised that I protected these online accounts with unique passwords.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Mẹ khuyên tôi nên bảo vệ những tài khoản trực tuyến đó bằng mật khẩu riêng biệt.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>My mum advised me to protect those online accounts with unique passwords.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Lời khuyên "You should…" được tường thuật bằng "advise sb TO V" (khuyên ai làm gì); "these" lùi thành "those" trong câu gián tiếp.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A đổi chủ ngữ thành "she"; B dùng "shall" sai; D "advised that I protected" sai cấu trúc (advise + sb + to V).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu gần nghĩa nhất với câu gốc",n:49,type:"mcq",
 q:"Câu gốc: <em>The way we learn today is not similar to how people learnt in the past.</em>",
 options:[{t:"How people learnt in the past was not different from the way we learn today.",c:false},
          {t:"How people learnt in the past is different from the way we learn today.",c:true},
          {t:"The way we learn today is the same as how people learnt in the past.",c:false},
          {t:"There's a similarity between the way we learn today and how people learnt in the past.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Cách học của người xưa khác với cách chúng ta học ngày nay.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>How people learnt in the past is different from the way we learn today.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"not similar to" (không giống) = "different from" (khác với). Câu B giữ đúng ý "cách học xưa và nay khác nhau".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A ("not different"), C ("the same as"), D ("a similarity") đều nói GIỐNG nhau — ngược nghĩa câu gốc.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:50,type:"fill",
 q:"Gợi ý: Some people / still prefer / cook / home / to / order takeout / or / eat out. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["some people still prefer cooking at home to ordering takeout or eating out"],
 exp:`<div class="vnt">💬 Dịch: Một số người vẫn thích nấu ăn ở nhà hơn là đặt đồ mang về hay ra ngoài ăn.</div>
 <ol><li>Đáp án: <span class='hl-green'>Some people still prefer cooking at home to ordering takeout or eating out.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "prefer + V-ing + TO + V-ing" (thích cái này hơn cái kia): prefer cooking… to ordering… or eating out. "at home" (ở nhà).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:51,type:"fill",
 q:"Gợi ý: If / Matt / attend / this camp / can / learn / how / use / traditional / farming techniques. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["if matt attends this camp he can learn how to use traditional farming techniques"],
 exp:`<div class="vnt">💬 Dịch: Nếu Matt tham gia trại này, cậu ấy có thể học cách sử dụng các kỹ thuật canh tác truyền thống.</div>
 <ol><li>Đáp án: <span class='hl-green'>If Matt attends this camp, he can learn how to use traditional farming techniques.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (attends), … can + V (can learn)"; "how TO V" (cách làm gì) → how to use.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:52,type:"fill",
 q:"Gợi ý: Do you mind / tell / me / differences / a nuclear family / extended family? <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["do you mind telling me the differences between a nuclear family and an extended family"],
 exp:`<div class="vnt">💬 Dịch: Bạn có phiền nói cho mình biết sự khác nhau giữa gia đình hạt nhân và đại gia đình không?</div>
 <ol><li>Đáp án: <span class='hl-green'>Do you mind telling me the differences between a nuclear family and an extended family?</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Do you mind + V-ing?" (bạn có phiền làm gì không?) → mind telling; "differences BETWEEN A AND B" (khác nhau giữa A và B).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:53,type:"fill",
 q:"Gợi ý: I think / life today / much / comfortable / it / be / in the past. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["i think life today is much more comfortable than it was in the past"],
 exp:`<div class="vnt">💬 Dịch: Tôi nghĩ cuộc sống ngày nay thoải mái hơn nhiều so với trong quá khứ.</div>
 <ol><li>Đáp án: <span class='hl-green'>I think life today is much more comfortable than it was in the past.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>So sánh hơn với tính từ dài "comfortable" → "more comfortable than"; "much" nhấn mạnh "hơn nhiều"; vế sau "than it was in the past" (so với quá khứ).</span></li></ol>`}
];

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#05332e">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#f472b6">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 41 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🚀';memeKey='good';msg='Cố thêm chút nữa là chạm tới điều tuyệt vời luôn nè! 🪷';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='🌙';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
