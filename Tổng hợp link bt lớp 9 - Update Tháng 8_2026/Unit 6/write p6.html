<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English 9 • Use of English — Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#8854C0; --yellow:#FDCB6E; --teal:#00C9A7; --coral:#FF7AA2; --sky:#5AC8FA;
  --green:#00D26A; --red:#FF4757;
  --c-word:#1565C0; --c-mean:#B5451B; --c-grammar:#E03131; --c-phon:#7B2FBE;
  --ink:#34245c; --glass:rgba(255,255,255,.30); --glass-strong:rgba(255,255,255,.55);
  --stroke:rgba(255,255,255,.55);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  min-height:100vh; position:relative; overflow-x:hidden;
  background:linear-gradient(-45deg,#8854C0,#FF7AA2,#FDCB6E,#00C9A7,#5AC8FA,#8854C0);
  background-size:400% 400%; animation:flow 18s ease infinite;
}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media (prefers-reduced-motion:reduce){body{animation:none}.float-layer{display:none}}

.float-layer{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.float-layer span{position:absolute; opacity:.45; animation:rise linear infinite;}
@keyframes rise{0%{transform:translateY(20px) rotate(0deg); opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-115vh) rotate(40deg); opacity:0}}

.wrap{position:relative; z-index:2; max-width:860px; margin:0 auto; padding:18px 16px 120px;}

header.top{text-align:center; padding:22px 18px; margin-bottom:22px; border-radius:26px;
  background:var(--glass-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--stroke); box-shadow:0 12px 30px rgba(83,46,130,.25);}
.teacher-tag{display:inline-block; font-size:.78rem; font-weight:800; letter-spacing:.4px;
  background:linear-gradient(90deg,var(--pink),var(--coral)); color:#fff;
  padding:5px 14px; border-radius:999px; margin-bottom:10px; box-shadow:0 4px 10px rgba(136,84,192,.35);}
header.top h1{margin:4px 0 6px; font-size:1.7rem; font-weight:900; line-height:1.15;
  background:linear-gradient(90deg,#5b2a9e,#b5451b); -webkit-background-clip:text; background-clip:text; color:transparent;}
header.top p{margin:0; font-weight:700; color:#5b3d8a; font-size:.98rem;}
.lantern-row{font-size:1.5rem; margin-top:8px; letter-spacing:6px;}

.progress-bar{position:sticky; top:8px; z-index:30; margin:0 auto 20px; max-width:860px;}
.progress-shell{height:16px; border-radius:999px; background:rgba(255,255,255,.4); overflow:hidden; border:1px solid var(--stroke); box-shadow:0 4px 12px rgba(83,46,130,.2);}
.progress-fill{height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--teal),var(--green)); transition:width .4s ease;}
.progress-txt{text-align:center; font-weight:800; color:#fff; font-size:.85rem; margin-top:4px; text-shadow:0 1px 3px rgba(83,46,130,.5);}

section.ex{margin-bottom:26px; padding:18px 16px 6px; border-radius:24px;
  background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--stroke); box-shadow:0 10px 26px rgba(83,46,130,.2);}
.ex-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.ex-badge{flex:0 0 auto; font-weight:900; color:#fff; padding:8px 14px; border-radius:14px;
  background:linear-gradient(135deg,var(--pink),var(--sky)); box-shadow:0 5px 12px rgba(136,84,192,.4); font-size:.95rem;}
.ex-head h2{margin:0; font-size:1.12rem; font-weight:800; color:#4a2f86;}
.ex-instruct{font-weight:700; color:#5b3d8a; margin:2px 2px 14px; font-size:.96rem;}

.q-card{margin-bottom:16px; padding:16px; border-radius:20px;
  background:var(--glass-strong); border:1px solid var(--stroke); box-shadow:0 6px 16px rgba(83,46,130,.16);}
.q-num{display:inline-block; font-weight:900; color:#fff; background:linear-gradient(135deg,var(--coral),var(--yellow));
  width:30px; height:30px; line-height:30px; text-align:center; border-radius:10px; margin-right:8px; box-shadow:0 3px 7px rgba(0,0,0,.15);}
.q-text{font-size:1.15rem; font-weight:700; color:#3a2766; line-height:1.5; display:inline;}
.q-text u{text-decoration-color:var(--coral); text-decoration-thickness:3px; text-underline-offset:3px;}

.sign-card{display:flex; justify-content:center; margin:10px 0 14px;}
.sign-card .sign-box{background:#fff; border-radius:20px; padding:14px; box-shadow:0 8px 20px rgba(83,46,130,.25); border:1px solid var(--stroke);}
.arrange-box{font-weight:600; color:#3a2766; background:rgba(255,255,255,.55); border-left:5px solid var(--sky);
  padding:12px 14px; border-radius:12px; margin:10px 0; font-size:1rem; line-height:1.7;}
.arrange-box b{color:#5b2a9e;}

.options{display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px;}
.opt{cursor:pointer; padding:13px 16px; border-radius:16px; font-size:1.08rem; font-weight:800;
  color:#3a2766; text-align:left; border:2px solid rgba(255,255,255,.7);
  background:linear-gradient(135deg,#ffffff,#f3eaff);
  box-shadow:0 7px 0 rgba(136,84,192,.25), 0 9px 16px rgba(83,46,130,.18);
  transition:transform .15s ease, box-shadow .15s ease, background .2s ease; user-select:none;}
.opt:hover{transform:scale(1.025) translateY(-2px);}
.opt:active{transform:scale(.99);}
.opt.correct{background:linear-gradient(135deg,#7ef0b0,#00D26A); color:#073d22; border-color:#00D26A;
  box-shadow:0 7px 0 #00a352, 0 9px 18px rgba(0,210,106,.4);}
.opt.wrong{background:linear-gradient(135deg,#ffb3bb,#FF4757); color:#5a0a12; border-color:#FF4757;
  box-shadow:0 7px 0 #c5283a, 0 9px 18px rgba(255,71,87,.4);}
.opt.locked{cursor:default;}
.opt.dim{opacity:.55;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .45s ease;}

.clue-box{font-weight:800; color:#7a3a00; background:linear-gradient(135deg,#fff2d6,#ffe2b0);
  border-left:5px solid var(--yellow); padding:10px 13px; border-radius:10px; margin:10px 0; font-size:1.02rem; line-height:1.5;}
.orig-line{font-weight:700; color:#3a2766; font-size:1.08rem; line-height:1.5; margin:2px 0;}
.rewrite-line{font-size:1.08rem; font-weight:700; color:#3a2766; margin:10px 0 6px;}
.given-start{font-weight:900; color:#5b2a9e; background:rgba(136,84,192,.12); padding:2px 8px; border-radius:8px;}
.note{font-weight:700; color:#7a4ab0; font-size:.86rem; margin-top:6px; font-style:italic;}
textarea.blank-area{width:100%; font-family:'Nunito',sans-serif; font-weight:700; font-size:1.05rem; color:#3a2766;
  border:2px solid #d9c7f2; border-radius:12px; padding:10px 12px; outline:none; resize:vertical; min-height:46px;
  background:rgba(255,255,255,.7); transition:.2s; margin-top:6px;}
textarea.blank-area:focus{border-color:var(--teal); background:#fff;}
textarea.blank-area.ok{border-color:var(--green); background:linear-gradient(135deg,#e6fff0,#bff5d6); color:#073d22;}
textarea.blank-area.no{border-color:var(--red); background:linear-gradient(135deg,#fff0f1,#ffd0d5); color:#5a0a12;}

.check-btn{font-family:'Nunito'; font-weight:900; cursor:pointer; border:none; color:#fff; font-size:.92rem;
  background:linear-gradient(135deg,var(--teal),var(--sky)); padding:8px 16px; border-radius:12px; margin-top:12px;
  box-shadow:0 5px 0 rgba(0,150,130,.5); transition:transform .12s;}
.check-btn:hover{transform:translateY(-1px);}
.check-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,150,130,.5);}
.check-btn:disabled{opacity:.5; cursor:default; box-shadow:none;}

.explain{max-height:0; overflow:hidden; transition:max-height .5s ease, opacity .4s; opacity:0; margin-top:0;}
.explain.open{max-height:1600px; opacity:1; margin-top:14px;}
.explain-inner{padding:14px; border-radius:16px; background:rgba(255,255,255,.62); border:1px solid var(--stroke); font-size:1rem; line-height:1.55;}
.explain-inner ol{margin:8px 0 2px; padding-left:20px;}
.explain-inner li{margin-bottom:10px; font-weight:600;}
.correct-ans{margin-bottom:10px; font-weight:800; color:#0a8a45; background:rgba(0,210,106,.14);
  padding:8px 12px; border-radius:10px; font-size:1rem;}

.vnt{font-weight:800; color:#7a3a00; background:linear-gradient(135deg,#fff2d6,#ffe2b0);
  border-left:5px solid var(--yellow); padding:9px 13px; border-radius:10px; margin-bottom:10px; font-size:1.02rem;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin:6px 0;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}
.grid2>div{background:rgba(255,255,255,.55); padding:7px 10px; border-radius:10px; font-weight:700; font-size:.98rem;}
.p-word{color:var(--c-word); font-weight:900;}
.hl-green{color:#0a8a45; font-weight:900;}
.hl-red{color:var(--c-grammar); font-weight:900;}
.wt{display:inline-block; font-size:.78rem; font-weight:800; color:#5b3d8a; background:rgba(136,84,192,.16);
  padding:1px 7px; border-radius:6px; margin:0 2px;}
.p-phonetic{color:var(--c-phon); background:rgba(123,47,190,.12); padding:1px 6px; border-radius:6px; font-weight:700;}
.p-mean{color:var(--c-mean); font-weight:800;}
.p-grammar{text-decoration:underline; text-decoration-color:var(--c-grammar); text-decoration-thickness:2px; text-underline-offset:2px; font-weight:700; color:#3a2766;}

.submit-zone{text-align:center; margin-top:10px;}
.submit-btn{font-family:'Nunito'; font-weight:900; font-size:1.25rem; color:#fff; cursor:pointer; border:none;
  padding:18px 34px; border-radius:22px; background:linear-gradient(135deg,var(--coral),var(--pink));
  box-shadow:0 10px 0 #6a3aa0, 0 14px 26px rgba(136,84,192,.45); transition:transform .14s;}
.submit-btn:hover{transform:scale(1.05);}
.submit-btn:active{transform:translateY(5px); box-shadow:0 5px 0 #6a3aa0;}

.overlay{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
  background:rgba(60,30,110,.55); backdrop-filter:blur(6px); padding:18px;}
.overlay.show{display:flex; animation:fadein .3s;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{width:100%; max-width:440px; background:linear-gradient(160deg,#fff,#f4ecff); border-radius:26px;
  padding:26px 24px; text-align:center; box-shadow:0 20px 50px rgba(40,20,80,.5); animation:pop .35s cubic-bezier(.2,1.3,.5,1);}
@keyframes pop{from{transform:scale(.8); opacity:0}to{transform:scale(1); opacity:1}}
.modal h3{margin:0 0 14px; font-size:1.4rem; color:#5b2a9e; font-weight:900;}
.name-input{width:100%; font-family:'Nunito'; font-weight:700; font-size:1.05rem; padding:13px 15px;
  border-radius:14px; border:2px solid #d9c7f2; outline:none; text-align:center; color:#3a2766;}
.name-input.err{border-color:var(--red); background:#fff0f1; animation:shake .4s;}
.warn{color:var(--red); font-weight:800; font-size:.9rem; height:18px; margin:8px 0 4px;}
.modal-btn{font-family:'Nunito'; font-weight:900; font-size:1.05rem; color:#fff; cursor:pointer; border:none;
  padding:13px 26px; border-radius:16px; background:linear-gradient(135deg,var(--teal),var(--sky)); margin-top:10px;
  box-shadow:0 6px 0 rgba(0,150,130,.5);}
.modal-btn:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,150,130,.5);}
.greet{font-size:1.3rem; font-weight:900; margin:4px 0 10px; line-height:1.3;
  background:linear-gradient(90deg,#b5451b,#5b2a9e); -webkit-background-clip:text; background-clip:text; color:transparent;}
.score-big{font-size:2.6rem; font-weight:900; color:#5b2a9e; line-height:1;}
.score-sub{font-weight:800; color:#00a352; font-size:1.1rem; margin:6px 0 4px;}
.score-ten{font-weight:900; font-size:1.5rem; color:#b5451b; margin:2px 0 14px;}
.meme{width:100%; max-width:320px; border-radius:18px; margin:6px auto 14px; display:block; box-shadow:0 8px 20px rgba(0,0,0,.25);}
.meme-fallback{width:100%; max-width:320px; aspect-ratio:4/3; margin:6px auto 14px; border-radius:18px; display:none;
  align-items:center; justify-content:center; font-size:5rem; background:linear-gradient(135deg,#ffe2b0,#ffc9d8); box-shadow:0 8px 20px rgba(0,0,0,.2);}
.bounce{animation:bnc 1s ease infinite;}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.retry{background:linear-gradient(135deg,var(--yellow),var(--coral)); box-shadow:0 6px 0 #c47a2a;}
.confetti{position:fixed; top:-12px; z-index:200; width:11px; height:14px; border-radius:2px; pointer-events:none;}
</style>
</head>
<body>
<div class="float-layer" id="floatLayer"></div>

<div class="progress-bar">
  <div class="progress-shell"><div class="progress-fill" id="pFill"></div></div>
  <div class="progress-txt" id="pTxt">0 / 13 câu đã làm</div>
</div>

<div class="wrap">
  <header class="top">
    <span class="teacher-tag">👩‍🏫 Giáo viên tạo: Ms. Chí Nên</span>
    <h1>English 9 • Use of English</h1>
    <p>Chọn câu đồng nghĩa • Sắp xếp đoạn văn — Chọn đáp án để chấm điểm &amp; xem giải thích ngay!</p>
    <div class="lantern-row">🏮 🪷 👒 🎋 🏮</div>
  </header>

  <div id="quizRoot"></div>

  <div class="submit-zone">
    <button class="submit-btn" id="submitBtn">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>
</div>

<div class="overlay" id="nameOverlay">
  <div class="modal">
    <h3>🎮 Nhập tên của em nào!</h3>
    <input class="name-input" id="nameInput" placeholder="Ví dụ: Nguyễn Văn A...">
    <div class="warn" id="nameWarn"></div>
    <button class="modal-btn" id="nameOk">Xem kết quả ✨</button>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="modal">
    <div class="greet" id="greetText"></div>
    <div class="score-big" id="scoreBig"></div>
    <div class="score-sub" id="scoreSub"></div>
    <div class="score-ten" id="scoreTen"></div>
    <img class="meme" id="memeImg" alt="result meme">
    <div class="meme-fallback" id="memeFb"></div>
    <div><button class="modal-btn retry" id="retryBtn">🔄 Làm lại bài</button></div>
  </div>
</div>

<script>
/* ===== DATA ===== */
const QUIZ=[
{
  id:"e3", badge:"EX 3 • CHỌN CÂU ĐỒNG NGHĨA", type:"mcq",
  title:"Chọn câu gần nghĩa nhất với câu gốc",
  instruct:"Đọc câu gốc (in đậm) rồi chọn câu có nghĩa GẦN NHẤT với nó.",
  questions:[
    { qhtml:"<b>Most people start recalling their youthhood when they get old.</b>",
      options:["Most people start thinking about their youthhood when they get old.","Memories of their youthhood are important for people when they get old.","Their youthhood is the only thing people think about when they get old.","Most old people value their youthhood."],
      answer:"Most people start thinking about their youthhood when they get old.",
      explain:`<div class="vnt">💬 Dịch câu gốc: Hầu hết mọi người bắt đầu hồi tưởng về thời trẻ khi họ về già.</div>
      <ol>
        <li>Phân tích 4 đáp án:
          <div class="grid2">
            <div><span class='hl-green'>start thinking about</span> = <span class='p-mean'>bắt đầu nghĩ về (= recall)</span></div>
            <div><span class='p-word'>Memories...are important</span> = <span class='p-mean'>ký ức quan trọng (thêm ý)</span></div>
            <div><span class='p-word'>the only thing</span> = <span class='p-mean'>điều DUY NHẤT (quá tuyệt đối)</span></div>
            <div><span class='p-word'>value their youthhood</span> = <span class='p-mean'>trân trọng (đổi nghĩa)</span></div>
          </div></li>
        <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"recall" = nhớ lại ≈ "start thinking about"; giữ nguyên ý nghĩa câu gốc.</span></li>
        <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A thêm "important"; "only" quá tuyệt đối; "value" = coi trọng — đều khác nghĩa gốc.</span></li>
      </ol>` },
    { qhtml:"<b>Life in our small village used to be very simple and peaceful.</b>",
      options:["Life in our small village is now not as simple and peaceful as in the past.","Life in our small village has become very simple and peaceful.","Our small village has experienced simplicity and peace.","Life used to be different in our small village."],
      answer:"Life in our small village is now not as simple and peaceful as in the past.",
      explain:`<div class="vnt">💬 Dịch câu gốc: Cuộc sống ở ngôi làng nhỏ của chúng tôi từng rất giản dị và yên bình.</div>
      <ol>
        <li>Phân tích 4 đáp án:
          <div class="grid2">
            <div><span class='hl-green'>now not as ... as in the past</span> = <span class='p-mean'>nay không còn... như xưa</span></div>
            <div><span class='p-word'>has become very simple</span> = <span class='p-mean'>ĐÃ trở nên giản dị (ngược)</span></div>
            <div><span class='p-word'>has experienced simplicity</span> = <span class='p-mean'>đã trải qua (mơ hồ)</span></div>
            <div><span class='p-word'>used to be different</span> = <span class='p-mean'>từng khác biệt (mơ hồ)</span></div>
          </div></li>
        <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"used to be" hàm ý quá khứ vậy, hiện tại KHÔNG còn → "now not as simple as in the past".</span></li>
        <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B nói hiện tại vẫn giản dị (trái nghĩa); C, D quá mơ hồ, không giữ đúng ý.</span></li>
      </ol>` },
    { qhtml:"<b>Nowadays, more people are moving to big cities for employment.</b>",
      options:["Employment is one reason to attract more people moving to big cities.","Nowadays, employment is the only reason to make people move to big cities.","Nowadays, people are moving to live a better life.","More people are moving to big cities for higher-paid employment."],
      answer:"Employment is one reason to attract more people moving to big cities.",
      explain:`<div class="vnt">💬 Dịch câu gốc: Ngày nay, ngày càng nhiều người chuyển đến thành phố lớn để tìm việc làm.</div>
      <ol>
        <li>Phân tích 4 đáp án:
          <div class="grid2">
            <div><span class='hl-green'>one reason</span> = <span class='p-mean'>MỘT lý do (đúng mức độ)</span></div>
            <div><span class='p-word'>the only reason</span> = <span class='p-mean'>lý do DUY NHẤT (quá tuyệt đối)</span></div>
            <div><span class='p-word'>to live a better life</span> = <span class='p-mean'>sống tốt hơn (đổi lý do)</span></div>
            <div><span class='p-word'>higher-paid employment</span> = <span class='p-mean'>việc lương cao hơn (thêm ý)</span></div>
          </div></li>
        <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu gốc nêu việc làm là MỘT lý do (không khẳng định duy nhất) → "one reason".</span></li>
        <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"only" quá tuyệt đối; C đổi lý do; D thêm "higher-paid" không có trong câu gốc.</span></li>
      </ol>` },
    { qhtml:"<b>I love traditional decor with classic furnishings.</b>",
      options:["Traditional décor with classic furnishings is my interest.","Traditionally classic furnishings fancy me a lot.","I love traditional decor which focuses on furnishings.","I love classic furnishings in traditional style."],
      answer:"Traditional décor with classic furnishings is my interest.",
      explain:`<div class="vnt">💬 Dịch câu gốc: Tôi yêu thích lối trang trí truyền thống với đồ nội thất cổ điển.</div>
      <ol>
        <li>Phân tích 4 đáp án:
          <div class="grid2">
            <div><span class='hl-green'>...is my interest</span> = <span class='p-mean'>là sở thích của tôi (= I love)</span></div>
            <div><span class='p-word'>furnishings fancy me</span> = <span class='p-mean'>(sai cấu trúc/nghĩa)</span></div>
            <div><span class='p-word'>which focuses on furnishings</span> = <span class='p-mean'>tập trung vào nội thất (đổi nghĩa)</span></div>

/* ===== HELPERS ===== */
function shuffleArray(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function norm(s){return (s||"").toLowerCase().replace(/[\u2019]/g,"'").replace(/[.,;:!?"]/g,"").replace(/\s+/g," ").trim();}

/* ===== AUDIO ===== */
let actx=null;
function audio(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx; }
function playChime(){const c=audio(); if(!c) return; if(c.state==="suspended") c.resume();
  const now=c.currentTime; [660,880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(c.destination); const t=now+i*0.10;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
  o.start(t); o.stop(t+0.4);});}
function playBuzz(){const c=audio(); if(!c) return; if(c.state==="suspended") c.resume();
  const now=c.currentTime; [300,230,170].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type="square"; o.frequency.value=f; o.connect(g); g.connect(c.destination); const t=now+i*0.13;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.start(t); o.stop(t+0.2);});}

/* ===== CONFETTI ===== */
function confetti(){const colors=["#8854C0","#FDCB6E","#00C9A7","#FF7AA2","#5AC8FA","#00D26A"];
  for(let i=0;i<70;i++){const d=document.createElement("div"); d.className="confetti";
  d.style.left=Math.random()*100+"vw"; d.style.background=colors[Math.floor(Math.random()*colors.length)];
  d.style.transform="rotate("+Math.random()*360+"deg)"; const dur=2+Math.random()*1.6;
  d.style.transition="transform "+dur+"s linear, top "+dur+"s linear, opacity "+dur+"s";
  document.body.appendChild(d);
  requestAnimationFrame(()=>{ d.style.top=(100+Math.random()*15)+"vh";
    d.style.transform="translateX("+(Math.random()*200-100)+"px) rotate("+(Math.random()*720)+"deg)"; d.style.opacity="0"; });
  setTimeout(()=>d.remove(), dur*1000+200);}}

  const icons=["🏮","🪷","👒","🎋","🍚","🚲","🏯","🪕","🥢","🪁","🌾","📿"];

  s.style.animationDelay=(-Math.random()*20)+"s"; layer.appendChild(s);}})();

let counter=0;
QUIZ.forEach(sec=>{
  const sEl=document.createElement("section"); sEl.className="ex";
  sEl.innerHTML=`<div class="ex-head"><span class="ex-badge">${sec.badge}</span><h2>${sec.title}</h2></div>
                 <div class="ex-instruct">${sec.instruct}</div>`;
  sec.questions.forEach((q)=>{
    counter++; totalQuestions++;
    const qid=sec.id+"_"+counter; q._qid=qid; results[qid]=false;
    const card=document.createElement("div"); card.className="q-card";

    if(sec.type==="mcq"){
      const svgHtml=q.svg?`<div class="sign-card"><div class="sign-box">${q.svg}</div></div>`:"";
      const blockHtml=q.block?`<div class="arrange-box">${q.block}</div>`:"";
      card.innerHTML=`<div><span class="q-num">${counter}</span><span class="q-text">${q.qhtml||""}</span></div>
        ${svgHtml}${blockHtml}
        <div class="options" id="opts_${qid}"></div>
        <div class="explain" id="exp_${qid}"><div class="explain-inner">${q.explain}</div></div>`;
      sEl.appendChild(card);
      const optWrap=card.querySelector("#opts_"+qid);
      shuffleArray(q.options).forEach(opt=>{
        const o=document.createElement("div"); o.className="opt"; o.textContent=opt;
        o.addEventListener("click",()=>{
          if(card.dataset.locked) return; card.dataset.locked="1";
          const correct=norm(opt)===norm(q.answer); results[qid]=correct;
          optWrap.querySelectorAll(".opt").forEach(el=>{ el.classList.add("locked");
            if(norm(el.textContent)===norm(q.answer)) el.classList.add("correct");
            else if(el===o) el.classList.add("wrong"); else el.classList.add("dim"); });
          if(correct){ playChime(); confetti(); }
          else{ playBuzz(); o.classList.add("shake"); setTimeout(()=>o.classList.remove("shake"),500); }
          card.querySelector("#exp_"+qid).classList.add("open"); updateProgress();
        });
        optWrap.appendChild(o);
      });
    } else { // fill
      let body, correctLabel;
      if(q.clue){
        body=`<div><span class="q-num">${counter}</span><span class="q-text">Viết thành câu hoàn chỉnh:</span></div>
          <div class="clue-box">🧩 ${q.clue}</div>
          <textarea class="blank-area" id="in_${qid}" placeholder="Gõ câu hoàn chỉnh của em..."></textarea>`;
        correctLabel=q.answer;
      } else {
        body=`<div><span class="q-num">${counter}</span><span class="q-text">${q.orig}</span></div>
          <div class="rewrite-line">→ <span class="given-start">${q.given}</span> <span style="opacity:.5">______</span></div>
          <textarea class="blank-area" id="in_${qid}" placeholder="Gõ phần còn lại..."></textarea>
          <div class="note">✏️ (Chỉ gõ phần CÒN LẠI, KHÔNG gõ lại "${q.given}")</div>`;
        correctLabel=q.given+" "+q.answer;
      }
      card.innerHTML=body+`<button class="check-btn" id="btn_${qid}">✓ Kiểm tra</button>
        <div class="explain" id="exp_${qid}"><div class="explain-inner">
          <div class="correct-ans">✅ Đáp án gợi ý: ${correctLabel}</div>${q.explain}</div></div>`;
      sEl.appendChild(card);
      const inp=card.querySelector("#in_"+qid);
      const btn=card.querySelector("#btn_"+qid);
      function matches(val){
        let v=norm(val);
        if(q.given!==undefined){ const g=norm(q.given);
          if(v.startsWith(g+" ")) v=v.slice(g.length+1); else if(v===g) v=""; }
        const cands=[q.answer].concat(q.accept||[]);
        return cands.some(c=>norm(c)===v);
      }
      function check(){
        if(card.dataset.locked) return;
        if(inp.value.trim()===""){ inp.focus(); inp.classList.remove("ok"); inp.classList.add("no");
          setTimeout(()=>inp.classList.remove("no"),500); return; }
        card.dataset.locked="1";
        const correct=matches(inp.value); results[qid]=correct;
        inp.disabled=true; btn.disabled=true;
        if(correct){ inp.classList.add("ok"); playChime(); confetti(); }
        else{ inp.classList.add("no"); playBuzz(); card.classList.add("shake"); setTimeout(()=>card.classList.remove("shake"),500); }
        card.querySelector("#exp_"+qid).classList.add("open"); updateProgress();
      }
      btn.addEventListener("click",check);
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); }});
    }
  });
  root.appendChild(sEl);
});

/* ===== PROGRESS ===== */
function updateProgress(){
  const answered=document.querySelectorAll(".q-card[data-locked='1']").length;
  const pct=Math.round(answered/totalQuestions*100);
  document.getElementById("pFill").style.width=pct+"%";
  document.getElementById("pTxt").textContent=answered+" / "+totalQuestions+" câu đã làm";
}
document.getElementById("pTxt").textContent="0 / "+totalQuestions+" câu đã làm";

/* ===== SUBMIT ===== */
const nameOverlay=document.getElementById("nameOverlay");
const resultOverlay=document.getElementById("resultOverlay");
const nameInput=document.getElementById("nameInput");
const nameWarn=document.getElementById("nameWarn");

document.getElementById("submitBtn").addEventListener("click",()=>{
  audio(); nameWarn.textContent=""; nameInput.classList.remove("err");
  nameOverlay.classList.add("show"); setTimeout(()=>nameInput.focus(),150);
});
function submitName(){
  if(nameInput.value.trim()===""){ nameInput.classList.add("err"); nameWarn.textContent="⚠️ Em hãy nhập tên trước nhé!"; return; }
  nameOverlay.classList.remove("show"); showResult(nameInput.value.trim());
}
document.getElementById("nameOk").addEventListener("click",submitName);
nameInput.addEventListener("keydown",e=>{ if(e.key==="Enter") submitName(); });

const MEMES={
  perfect:"https://media.giphy.com/media/g9582DNuQppxC/giphy.gif",
  good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",
  low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"
};
function showResult(name){
  const correct=Object.values(results).filter(Boolean).length;
  const pct=correct/totalQuestions; const ten=(correct/totalQuestions*10).toFixed(2);
  let greet, key, emoji;
  if(pct===1){ greet="🌟 THIÊN TÀI! "+name+" xuất sắc tuyệt đối!"; key="perfect"; emoji="🏆"; }
  else if(pct>=0.6){ greet="🎉 GIỎI LẮM! "+name+" làm rất tốt!"; key="good"; emoji="👍"; }
  else { greet="💪 CỐ LÊN! "+name+" ơi, làm lại sẽ tiến bộ ngay!"; key="low"; emoji="😭"; }
  document.getElementById("greetText").textContent=greet;
  document.getElementById("scoreBig").textContent=correct+" / "+totalQuestions;
  document.getElementById("scoreSub").textContent="câu đúng 🎯";
  document.getElementById("scoreTen").textContent="📊 Điểm quy đổi: "+ten+" / 10";
  const img=document.getElementById("memeImg"); const fb=document.getElementById("memeFb");
  fb.style.display="none"; img.style.display="block";
  img.onerror=()=>{ img.style.display="none"; fb.style.display="flex"; fb.innerHTML='<span class="bounce">'+emoji+'</span>'; };
  img.src=MEMES[key];
  resultOverlay.classList.add("show");
  if(pct>=0.6){ confetti(); setTimeout(confetti,400); if(pct===1) setTimeout(confetti,800); }
}
document.getElementById("retryBtn").addEventListener("click",()=>{ location.reload(); });
</script>
