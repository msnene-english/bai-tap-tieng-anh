<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English 9 • Present Perfect &amp; Reading — Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mag:#FF2E97; --cyan:#00F0FF; --pur:#B14EFF; --ylw:#FFE629; --grn:#39FF14; --orange:#FF8A3D;
  --green:#39FF14; --red:#FF3B6B;
  --c-word:#00F0FF; --c-mean:#FFB066; --c-grammar:#FF3B6B; --c-phon:#C77DFF;
  --ink:#EFE6FF; --glass:rgba(24,10,52,.55); --glass-strong:rgba(30,12,66,.72);
  --stroke:rgba(177,78,255,.45);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  min-height:100vh; position:relative; overflow-x:hidden;
  background:linear-gradient(-45deg,#0a0420,#1a0b3a,#2d0b4e,#120630,#240a52,#0a0420);
  background-size:400% 400%; animation:flow 20s ease infinite;
}
body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    linear-gradient(transparent 0,transparent 96%,rgba(0,240,255,.10) 100%) 0 0/100% 38px,
    linear-gradient(90deg,transparent 0,transparent 96%,rgba(255,46,151,.10) 100%) 0 0/38px 100%;
  mask-image:linear-gradient(to bottom,transparent 40%,#000 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 40%,#000 100%);
  transform:perspective(380px) rotateX(58deg) scale(2); transform-origin:bottom; opacity:.7;}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media (prefers-reduced-motion:reduce){body{animation:none}.float-layer{display:none}body::before{display:none}}

.float-layer{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.float-layer span{position:absolute; opacity:.55; animation:rise linear infinite; filter:drop-shadow(0 0 6px rgba(0,240,255,.6));}
@keyframes rise{0%{transform:translateY(20px) rotate(0deg); opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-115vh) rotate(40deg); opacity:0}}

.wrap{position:relative; z-index:2; max-width:860px; margin:0 auto; padding:18px 16px 120px;}

header.top{text-align:center; padding:24px 18px; margin-bottom:22px; border-radius:24px;
  background:var(--glass-strong); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--stroke); box-shadow:0 0 28px rgba(177,78,255,.45), inset 0 0 22px rgba(0,240,255,.12);}
.teacher-tag{display:inline-block; font-size:.78rem; font-weight:900; letter-spacing:.6px;
  background:linear-gradient(90deg,var(--mag),var(--pur)); color:#fff;
  padding:5px 14px; border-radius:999px; margin-bottom:10px; box-shadow:0 0 14px rgba(255,46,151,.7);}
header.top h1{margin:4px 0 6px; font-size:1.8rem; font-weight:900; line-height:1.15; letter-spacing:1px;
  color:#fff; text-shadow:0 0 8px var(--cyan),0 0 18px var(--mag);}
header.top p{margin:0; font-weight:700; color:#cdb6ff; font-size:.98rem;}
.lantern-row{font-size:1.5rem; margin-top:10px; letter-spacing:8px; filter:drop-shadow(0 0 6px var(--cyan));}

.progress-bar{position:sticky; top:8px; z-index:30; margin:0 auto 20px; max-width:860px;}
.progress-shell{height:16px; border-radius:999px; background:rgba(10,4,32,.7); overflow:hidden; border:1px solid var(--stroke); box-shadow:0 0 14px rgba(177,78,255,.4);}
.progress-fill{height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--cyan),var(--mag)); box-shadow:0 0 14px var(--mag); transition:width .4s ease;}
.progress-txt{text-align:center; font-weight:800; color:#e9dcff; font-size:.85rem; margin-top:4px; text-shadow:0 0 8px rgba(177,78,255,.8);}

section.ex{margin-bottom:26px; padding:18px 16px 6px; border-radius:22px;
  background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--stroke); box-shadow:0 0 22px rgba(0,240,255,.18);}
.ex-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.ex-badge{flex:0 0 auto; font-weight:900; color:#0a0420; padding:8px 14px; border-radius:12px;
  background:linear-gradient(135deg,var(--cyan),var(--grn)); box-shadow:0 0 16px rgba(0,240,255,.7); font-size:.92rem; letter-spacing:.3px;}
.ex-head h2{margin:0; font-size:1.1rem; font-weight:800; color:#f0e6ff; text-shadow:0 0 6px rgba(177,78,255,.6);}
.ex-instruct{font-weight:700; color:#cdb6ff; margin:2px 2px 14px; font-size:.95rem;}

.q-card{margin-bottom:16px; padding:16px; border-radius:18px;
  background:var(--glass-strong); border:1px solid var(--stroke); box-shadow:0 0 16px rgba(177,78,255,.22);}
.q-num{display:inline-block; font-weight:900; color:#0a0420; background:linear-gradient(135deg,var(--ylw),var(--orange));
  width:30px; height:30px; line-height:30px; text-align:center; border-radius:9px; margin-right:8px; box-shadow:0 0 12px rgba(255,230,41,.7);}
.q-text{font-size:1.16rem; font-weight:700; color:#f3ecff; line-height:1.5; display:inline;}
.q-text u{text-decoration-color:var(--cyan); text-decoration-thickness:3px; text-underline-offset:3px;}
.q-text b{color:#fff;}

.sign-card{display:flex; justify-content:center; margin:10px 0 14px;}
.sign-card .sign-box{background:#fff; border-radius:18px; padding:14px; box-shadow:0 0 18px rgba(0,240,255,.5);}
.arrange-box{font-weight:600; color:#e9dcff; background:rgba(10,4,32,.5); border-left:4px solid var(--cyan);
  padding:12px 14px; border-radius:12px; margin:10px 0; font-size:1rem; line-height:1.7;}
.arrange-box b{color:var(--cyan);}

.options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
@media(max-width:560px){.options{grid-template-columns:1fr;}}
.opt{cursor:pointer; padding:13px 16px; border-radius:14px; font-size:1.06rem; font-weight:800;
  color:#f3ecff; text-align:left; border:2px solid rgba(0,240,255,.4);
  background:linear-gradient(135deg,rgba(40,16,82,.9),rgba(24,10,52,.9));
  box-shadow:0 0 0 rgba(0,240,255,0); transition:transform .15s ease, box-shadow .2s ease, border-color .2s; user-select:none;}
.opt:hover{transform:scale(1.03) translateY(-2px); border-color:var(--cyan); box-shadow:0 0 18px rgba(0,240,255,.55);}
.opt:active{transform:scale(.99);}
.opt.correct{background:linear-gradient(135deg,rgba(57,255,20,.25),rgba(57,255,20,.12)); color:#d6ffce; border-color:var(--grn);
  box-shadow:0 0 22px rgba(57,255,20,.7);}
.opt.wrong{background:linear-gradient(135deg,rgba(255,59,107,.28),rgba(255,59,107,.12)); color:#ffd6e0; border-color:var(--red);
  box-shadow:0 0 22px rgba(255,59,107,.7);}
.opt.locked{cursor:default;}
.opt.dim{opacity:.4;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .45s ease;}

.clue-box{font-weight:800; color:#fff; background:rgba(10,4,32,.5); border-left:5px solid var(--ylw); padding:10px 13px; border-radius:10px; margin:10px 0; font-size:1.02rem; line-height:1.5;}
.orig-line{font-weight:700; color:#f3ecff; font-size:1.08rem; line-height:1.5; margin:2px 0;}
.rewrite-line{font-size:1.08rem; font-weight:700; color:#f3ecff; margin:10px 0 6px;}
.given-start{font-weight:900; color:var(--cyan); background:rgba(0,240,255,.12); padding:2px 8px; border-radius:8px;}
.note{font-weight:700; color:#c77dff; font-size:.86rem; margin-top:6px; font-style:italic;}
textarea.blank-area{width:100%; font-family:'Nunito',sans-serif; font-weight:700; font-size:1.05rem; color:#f3ecff;
  border:2px solid rgba(177,78,255,.5); border-radius:12px; padding:10px 12px; outline:none; resize:vertical; min-height:46px;
  background:rgba(10,4,32,.5); transition:.2s; margin-top:6px;}
textarea.blank-area:focus{border-color:var(--cyan); box-shadow:0 0 12px rgba(0,240,255,.4);}
textarea.blank-area.ok{border-color:var(--grn); box-shadow:0 0 12px rgba(57,255,20,.5);}
textarea.blank-area.no{border-color:var(--red); box-shadow:0 0 12px rgba(255,59,107,.5);}

.check-btn{font-family:'Nunito'; font-weight:900; cursor:pointer; border:none; color:#0a0420; font-size:.92rem;
  background:linear-gradient(135deg,var(--cyan),var(--grn)); padding:8px 16px; border-radius:11px; margin-top:12px;
  box-shadow:0 0 14px rgba(0,240,255,.6); transition:transform .12s;}
.check-btn:hover{transform:translateY(-1px);}
.check-btn:active{transform:translateY(2px);}
.check-btn:disabled{opacity:.5; cursor:default; box-shadow:none;}

.explain{max-height:0; overflow:hidden; transition:max-height .5s ease, opacity .4s; opacity:0; margin-top:0;}
.explain.open{max-height:1600px; opacity:1; margin-top:14px;}
.explain-inner{padding:14px; border-radius:14px; background:rgba(8,3,26,.65); border:1px solid var(--stroke); font-size:1rem; line-height:1.55; color:#e9dcff;}
.explain-inner ol{margin:8px 0 2px; padding-left:20px;}
.explain-inner li{margin-bottom:10px; font-weight:600;}
.correct-ans{margin-bottom:10px; font-weight:800; color:#0a0420; background:var(--grn); padding:8px 12px; border-radius:9px; font-size:1rem; box-shadow:0 0 12px rgba(57,255,20,.5);}

.vnt{font-weight:800; color:#fff; background:rgba(177,78,255,.2); border-left:5px solid var(--ylw); padding:9px 13px; border-radius:10px; margin-bottom:10px; font-size:1.02rem;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin:6px 0;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}
.grid2>div{background:rgba(10,4,32,.5); padding:7px 10px; border-radius:9px; font-weight:700; font-size:.98rem;}
.p-word{color:var(--c-word); font-weight:900;}
.hl-green{color:var(--grn); font-weight:900; text-shadow:0 0 6px rgba(57,255,20,.6);}
.hl-red{color:var(--c-grammar); font-weight:900;}
.wt{display:inline-block; font-size:.78rem; font-weight:800; color:#0a0420; background:var(--cyan); padding:1px 7px; border-radius:6px; margin:0 2px;}
.p-phonetic{color:#fff; background:rgba(199,125,255,.45); padding:1px 6px; border-radius:6px; font-weight:800;}
.p-mean{color:var(--c-mean); font-weight:800;}
.p-grammar{text-decoration:underline; text-decoration-color:var(--c-grammar); text-decoration-thickness:2px; text-underline-offset:2px; font-weight:700; color:#f3ecff;}

.submit-zone{text-align:center; margin-top:10px;}
.submit-btn{font-family:'Nunito'; font-weight:900; font-size:1.25rem; color:#0a0420; cursor:pointer; border:none; letter-spacing:.5px;
  padding:18px 34px; border-radius:18px; background:linear-gradient(135deg,var(--mag),var(--ylw));
  box-shadow:0 0 26px rgba(255,46,151,.7); transition:transform .14s;}
.submit-btn:hover{transform:scale(1.05);}
.submit-btn:active{transform:translateY(4px);}

.overlay{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
  background:rgba(6,2,20,.7); backdrop-filter:blur(7px); padding:18px;}
.overlay.show{display:flex; animation:fadein .3s;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{width:100%; max-width:440px; background:linear-gradient(160deg,#1c0a44,#0e0530); border-radius:22px;
  padding:26px 24px; text-align:center; box-shadow:0 0 40px rgba(177,78,255,.6), inset 0 0 20px rgba(0,240,255,.12);
  border:1px solid var(--stroke); animation:pop .35s cubic-bezier(.2,1.3,.5,1);}
@keyframes pop{from{transform:scale(.8); opacity:0}to{transform:scale(1); opacity:1}}
.modal h3{margin:0 0 14px; font-size:1.4rem; color:#fff; font-weight:900; text-shadow:0 0 8px var(--cyan);}
.name-input{width:100%; font-family:'Nunito'; font-weight:700; font-size:1.05rem; padding:13px 15px;
  border-radius:13px; border:2px solid rgba(177,78,255,.5); outline:none; text-align:center; color:#f3ecff; background:rgba(10,4,32,.6);}
.name-input.err{border-color:var(--red); animation:shake .4s;}
.warn{color:var(--red); font-weight:800; font-size:.9rem; height:18px; margin:8px 0 4px;}
.modal-btn{font-family:'Nunito'; font-weight:900; font-size:1.05rem; color:#0a0420; cursor:pointer; border:none;
  padding:13px 26px; border-radius:14px; background:linear-gradient(135deg,var(--cyan),var(--grn)); margin-top:10px;
  box-shadow:0 0 16px rgba(0,240,255,.6);}
.modal-btn:active{transform:translateY(3px);}
.greet{font-size:1.3rem; font-weight:900; margin:4px 0 10px; line-height:1.3; color:#fff; text-shadow:0 0 8px var(--mag),0 0 16px var(--cyan);}
.score-big{font-size:2.6rem; font-weight:900; color:#fff; line-height:1; text-shadow:0 0 10px var(--cyan);}
.score-sub{font-weight:800; color:var(--grn); font-size:1.1rem; margin:6px 0 4px;}
.score-ten{font-weight:900; font-size:1.5rem; color:var(--ylw); margin:2px 0 14px; text-shadow:0 0 8px rgba(255,230,41,.6);}
.meme{width:100%; max-width:320px; border-radius:16px; margin:6px auto 14px; display:block; box-shadow:0 0 22px rgba(177,78,255,.5);}
.meme-fallback{width:100%; max-width:320px; aspect-ratio:4/3; margin:6px auto 14px; border-radius:16px; display:none;
  align-items:center; justify-content:center; font-size:5rem; background:linear-gradient(135deg,#2d0b4e,#1a0b3a); box-shadow:0 0 22px rgba(0,240,255,.4);}
.bounce{animation:bnc 1s ease infinite;}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.retry{background:linear-gradient(135deg,var(--ylw),var(--mag)); box-shadow:0 0 16px rgba(255,46,151,.6);}
.confetti{position:fixed; top:-12px; z-index:200; width:11px; height:14px; border-radius:2px; pointer-events:none;}
</style>
</head>
<body>
<div class="float-layer" id="floatLayer"></div>

<div class="progress-bar">
  <div class="progress-shell"><div class="progress-fill" id="pFill"></div></div>
  <div class="progress-txt" id="pTxt">0 / 26 câu đã làm</div>
</div>

<div class="wrap">
  <header class="top">
    <span class="teacher-tag">👩‍🏫 Giáo viên tạo: Ms. Chí Nên</span>
    <h1>🕹️ English 9 • Grammar &amp; Reading Arcade</h1>
    <p>Sắp xếp từ • Hiện tại hoàn thành • Đọc &amp; sắp xếp đoạn — Ghi điểm &amp; mở khóa giải thích!</p>
    <div class="lantern-row">👾 ⭐ 🎮 ⭐ 👾</div>
  </header>

  <div id="quizRoot"></div>

  <div class="submit-zone">
    <button class="submit-btn" id="submitBtn">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>
</div>

<div class="overlay" id="nameOverlay">
  <div class="modal">
    <h3>🎮 Nhập tên của em nào!</h3>
    <input class="name-input" id="nameInput" placeholder="Ví dụ: Nguyễn Văn A...">
    <div class="warn" id="nameWarn"></div>
    <button class="modal-btn" id="nameOk">Xem kết quả ✨</button>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="modal">
    <div class="greet" id="greetText"></div>
    <div class="score-big" id="scoreBig"></div>
    <div class="score-sub" id="scoreSub"></div>
    <div class="score-ten" id="scoreTen"></div>
    <img class="meme" id="memeImg" alt="result meme">
    <div class="meme-fallback" id="memeFb"></div>
    <div><button class="modal-btn retry" id="retryBtn">🔄 Làm lại bài</button></div>
  </div>
</div>

<script>
/* ===== DATA ===== */
/* ===== DATA ===== */
/* ===== DATA ===== */
const QUIZ=[
{
  id:"e17", badge:"EX 17 • SẮP XẾP TỪ", type:"fill",
  title:"Sắp xếp các từ thành câu đúng",
  instruct:"Sắp xếp các từ (cách nhau bởi /) thành câu hoàn chỉnh, đúng ngữ pháp. Gõ cả câu rồi bấm Kiểm tra.",
  questions:[
    { clue:"Vietnamese / have / eating / changed / habits / recently / in / urban / areas / significantly",
      answer:"Vietnamese eating habits have changed significantly recently in urban areas.",
      explain:`<div class="vnt">💬 Dịch: Thói quen ăn uống của người Việt đã thay đổi đáng kể gần đây ở các khu vực thành thị.</div>
      <ol><li>Điểm ngữ pháp:
        <div class="grid2">
          <div><span class='hl-green'>have changed</span> <span class='wt'>HTHT</span> = <span class='p-mean'>have + V3 (số nhiều)</span></div>
          <div><span class='hl-green'>significantly · recently</span> <span class='wt'>adv</span> = <span class='p-mean'>cách → thời gian → nơi chốn</span></div>
        </div></li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Chủ ngữ "Vietnamese eating habits" (số nhiều) + have changed; trật tự trạng từ: cách (significantly) → thời gian (recently) → nơi chốn (in urban areas).</span></li>
      </ol>` },
    { clue:"Has / traditional / lifestyle / your / changed / family's / much / the / over / past / twenty / years?",
      answer:"Has your family's traditional lifestyle changed much over the past twenty years?",
      explain:`<div class="vnt">💬 Dịch: Lối sống truyền thống của gia đình bạn có thay đổi nhiều trong hai mươi năm qua không?</div>
      <ol><li>Điểm ngữ pháp:
        <div class="grid2">
          <div><span class='hl-green'>Has + S + V3 ...?</span> <span class='wt'>HTHT</span> = <span class='p-mean'>câu hỏi hiện tại hoàn thành</span></div>
          <div><span class='hl-green'>over the past twenty years</span> <span class='wt'>time</span> = <span class='p-mean'>dấu hiệu HTHT</span></div>
        </div></li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Đảo "Has" lên đầu; cụm sở hữu "your family's traditional lifestyle".</span></li>
        <li><span class="hl-red">❌ DỄ SAI:</span> <span class='p-grammar'>Quên đảo trợ động từ, sai thứ tự cụm danh từ sở hữu, hoặc bỏ "the past".</span></li>
      </ol>` },
    { clue:"Young / people / moved / have / cities / many / to / big / better / work / for / opportunities / recently",
      answer:"Many young people have moved to big cities recently for better work opportunities.",
      explain:`<div class="vnt">💬 Dịch: Nhiều người trẻ gần đây đã chuyển đến các thành phố lớn để có cơ hội việc làm tốt hơn.</div>
      <ol><li>Điểm ngữ pháp:
        <div class="grid2">
          <div><span class='hl-green'>have moved to</span> <span class='wt'>HTHT</span> = <span class='p-mean'>đã chuyển đến (nơi chốn)</span></div>
          <div><span class='hl-green'>for ... opportunities</span> <span class='wt'>purpose</span> = <span class='p-mean'>để (chỉ mục đích)</span></div>
        </div></li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"Many young people have moved to big cities"; trạng từ "recently"; "for better work opportunities".</span></li>
        <li><span class="hl-red">❌ DỄ SAI:</span> <span class='p-grammar'>Sai vị trí "many/recently"; quên giới từ "to/for".</span></li>
      </ol>` },
    { clue:"traditional / haven't / We / our / forgotten / important / values / cultural / and / customs / yet",
      answer:"We haven't forgotten our important traditional values and cultural customs yet.",
      explain:`<div class="vnt">💬 Dịch: Chúng tôi vẫn chưa quên những giá trị truyền thống quan trọng và phong tục văn hóa của mình.</div>
      <ol><li>Điểm ngữ pháp:
        <div class="grid2">
          <div><span class='hl-green'>haven't forgotten</span> <span class='wt'>HTHT</span> = <span class='p-mean'>phủ định: haven't + V3</span></div>
          <div><span class='hl-green'>... yet</span> <span class='wt'>adv</span> = <span class='p-mean'>"yet" cuối câu phủ định</span></div>
        </div></li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"haven't forgotten ... yet"; trật tự tính từ: important traditional values / cultural customs.</span></li>
        <li><span class="hl-red">❌ DỄ SAI:</span> <span class='p-grammar'>Quên "yet" hoặc sắp sai trật tự tính từ.</span></li>
      </ol>` },
    { clue:"Have / ever / you / Tet / celebrated / peacefully / the / in / quiet / Vietnamese / countryside?",
      answer:"Have you ever celebrated Tet peacefully in the quiet Vietnamese countryside?",

/* ===== HELPERS ===== */
function shuffleArray(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function norm(s){return (s||"").toLowerCase().replace(/[\u2019]/g,"'").replace(/[.,;:!?"]/g,"").replace(/\s+/g," ").trim();}

/* ===== AUDIO ===== */
let actx=null;
function audio(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx; }
function playChime(){const c=audio(); if(!c) return; if(c.state==="suspended") c.resume();
  const now=c.currentTime; [660,880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(c.destination); const t=now+i*0.10;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
  o.start(t); o.stop(t+0.4);});}
function playBuzz(){const c=audio(); if(!c) return; if(c.state==="suspended") c.resume();
  const now=c.currentTime; [300,230,170].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type="square"; o.frequency.value=f; o.connect(g); g.connect(c.destination); const t=now+i*0.13;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.start(t); o.stop(t+0.2);});}

/* ===== CONFETTI ===== */
function confetti(){const colors=["#8854C0","#FDCB6E","#00C9A7","#FF7AA2","#5AC8FA","#00D26A"];
  for(let i=0;i<70;i++){const d=document.createElement("div"); d.className="confetti";
  d.style.left=Math.random()*100+"vw"; d.style.background=colors[Math.floor(Math.random()*colors.length)];
  d.style.transform="rotate("+Math.random()*360+"deg)"; const dur=2+Math.random()*1.6;
  d.style.transition="transform "+dur+"s linear, top "+dur+"s linear, opacity "+dur+"s";
  document.body.appendChild(d);
  requestAnimationFrame(()=>{ d.style.top=(100+Math.random()*15)+"vh";
    d.style.transform="translateX("+(Math.random()*200-100)+"px) rotate("+(Math.random()*720)+"deg)"; d.style.opacity="0"; });
  setTimeout(()=>d.remove(), dur*1000+200);}}

  const icons=["🎮","👾","🕹️","⭐","💾","🚀","✨","🛸","💫","⚡","🔮","🌌"];
  for(let i=0;i<22;i++){const s=document.createElement("span");

  s.style.left=Math.random()*100+"vw"; s.style.bottom="-60px";
  s.style.fontSize=(22+Math.random()*30)+"px"; s.style.animationDuration=(14+Math.random()*16)+"s";
  s.style.animationDelay=(-Math.random()*20)+"s"; layer.appendChild(s);}})();

/* ===== STATE ===== */
const results={};
let totalQuestions=0;

/* ===== RENDER ===== */
const root=document.getElementById("quizRoot");
let counter=0;
QUIZ.forEach(sec=>{
  const sEl=document.createElement("section"); sEl.className="ex";
  sEl.innerHTML=`<div class="ex-head"><span class="ex-badge">${sec.badge}</span><h2>${sec.title}</h2></div>
                 <div class="ex-instruct">${sec.instruct}</div>`;
  sec.questions.forEach((q)=>{
    counter++; totalQuestions++;
    const qid=sec.id+"_"+counter; q._qid=qid; results[qid]=false;
    const card=document.createElement("div"); card.className="q-card";

    if(sec.type==="mcq"){
      const svgHtml=q.svg?`<div class="sign-card"><div class="sign-box">${q.svg}</div></div>`:"";
      const blockHtml=q.block?`<div class="arrange-box">${q.block}</div>`:"";
      card.innerHTML=`<div><span class="q-num">${counter}</span><span class="q-text">${q.qhtml||""}</span></div>
        ${svgHtml}${blockHtml}
        <div class="options" id="opts_${qid}"></div>
        <div class="explain" id="exp_${qid}"><div class="explain-inner">${q.explain}</div></div>`;
      sEl.appendChild(card);
      const optWrap=card.querySelector("#opts_"+qid);
      shuffleArray(q.options).forEach(opt=>{
        const o=document.createElement("div"); o.className="opt"; o.textContent=opt;
        o.addEventListener("click",()=>{
          if(card.dataset.locked) return; card.dataset.locked="1";
          const correct=norm(opt)===norm(q.answer); results[qid]=correct;
          optWrap.querySelectorAll(".opt").forEach(el=>{ el.classList.add("locked");
            if(norm(el.textContent)===norm(q.answer)) el.classList.add("correct");
            else if(el===o) el.classList.add("wrong"); else el.classList.add("dim"); });
          if(correct){ playChime(); confetti(); }
          else{ playBuzz(); o.classList.add("shake"); setTimeout(()=>o.classList.remove("shake"),500); }
          card.querySelector("#exp_"+qid).classList.add("open"); updateProgress();
        });
        optWrap.appendChild(o);
      });
    } else { // fill
      let body, correctLabel;
      if(q.clue){
        body=`<div><span class="q-num">${counter}</span><span class="q-text">Viết thành câu hoàn chỉnh:</span></div>
          <div class="clue-box">🧩 ${q.clue}</div>
          <textarea class="blank-area" id="in_${qid}" placeholder="Gõ câu hoàn chỉnh của em..."></textarea>`;
        correctLabel=q.answer;
      } else {
        body=`<div><span class="q-num">${counter}</span><span class="q-text">${q.orig}</span></div>
          <div class="rewrite-line">→ <span class="given-start">${q.given}</span> <span style="opacity:.5">______</span></div>
          <textarea class="blank-area" id="in_${qid}" placeholder="Gõ phần còn lại..."></textarea>
          <div class="note">✏️ (Chỉ gõ phần CÒN LẠI, KHÔNG gõ lại "${q.given}")</div>`;
        correctLabel=q.given+" "+q.answer;
      }
      card.innerHTML=body+`<button class="check-btn" id="btn_${qid}">✓ Kiểm tra</button>
        <div class="explain" id="exp_${qid}"><div class="explain-inner">
          <div class="correct-ans">✅ Đáp án gợi ý: ${correctLabel}</div>${q.explain}</div></div>`;
      sEl.appendChild(card);
      const inp=card.querySelector("#in_"+qid);
      const btn=card.querySelector("#btn_"+qid);
      function matches(val){
        let v=norm(val);
        if(q.given!==undefined){ const g=norm(q.given);
          if(v.startsWith(g+" ")) v=v.slice(g.length+1); else if(v===g) v=""; }
        const cands=[q.answer].concat(q.accept||[]);
        return cands.some(c=>norm(c)===v);
      }
      function check(){
        if(card.dataset.locked) return;
        if(inp.value.trim()===""){ inp.focus(); inp.classList.remove("ok"); inp.classList.add("no");
          setTimeout(()=>inp.classList.remove("no"),500); return; }
        card.dataset.locked="1";
        const correct=matches(inp.value); results[qid]=correct;
        inp.disabled=true; btn.disabled=true;
        if(correct){ inp.classList.add("ok"); playChime(); confetti(); }
        else{ inp.classList.add("no"); playBuzz(); card.classList.add("shake"); setTimeout(()=>card.classList.remove("shake"),500); }
        card.querySelector("#exp_"+qid).classList.add("open"); updateProgress();
      }
      btn.addEventListener("click",check);
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); }});
    }
  });
  root.appendChild(sEl);
});

/* ===== PROGRESS ===== */
function updateProgress(){
  const answered=document.querySelectorAll(".q-card[data-locked='1']").length;
  const pct=Math.round(answered/totalQuestions*100);
  document.getElementById("pFill").style.width=pct+"%";
  document.getElementById("pTxt").textContent=answered+" / "+totalQuestions+" câu đã làm";
}
document.getElementById("pTxt").textContent="0 / "+totalQuestions+" câu đã làm";

const MEMES={
  perfect:"https://media.giphy.com/media/g9582DNuQppxC/giphy.gif",
  good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",
  low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"
};
function showResult(name){
  const correct=Object.values(results).filter(Boolean).length;
  const pct=correct/totalQuestions; const ten=(correct/totalQuestions*10).toFixed(2);
  let greet, key, emoji;
  if(pct===1){ greet="🌟 THIÊN TÀI! "+name+" xuất sắc tuyệt đối!"; key="perfect"; emoji="🏆"; }
  else if(pct>=0.6){ greet="🎉 GIỎI LẮM! "+name+" làm rất tốt!"; key="good"; emoji="👍"; }
  else { greet="💪 CỐ LÊN! "+name+" ơi, làm lại sẽ tiến bộ ngay!"; key="low"; emoji="😭"; }
  document.getElementById("greetText").textContent=greet;
  document.getElementById("scoreBig").textContent=correct+" / "+totalQuestions;
  document.getElementById("scoreSub").textContent="câu đúng 🎯";
  document.getElementById("scoreTen").textContent="📊 Điểm quy đổi: "+ten+" / 10";
  const img=document.getElementById("memeImg"); const fb=document.getElementById("memeFb");
  fb.style.display="none"; img.style.display="block";
  img.onerror=()=>{ img.style.display="none"; fb.style.display="flex"; fb.innerHTML='<span class="bounce">'+emoji+'</span>'; };
  img.src=MEMES[key];
  resultOverlay.classList.add("show");
  if(pct>=0.6){ confetti(); setTimeout(confetti,400); if(pct===1) setTimeout(confetti,800); }
}
document.getElementById("retryBtn").addEventListener("click",()=>{ location.reload(); });
</script>
