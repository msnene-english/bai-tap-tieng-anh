<style>

.mbox{background:#063d36;border:3px solid var(--violet);border-radius:24px;max-width:440px;width:100%;padding:26px 22px;text-align:center;box-shadow:0 0 40px rgba(16,185,129,.7);animation:pop .35s}

#nameInput{width:100%;font-family:'Nunito';font-size:1.1rem;font-weight:700;padding:13px 16px;border-radius:13px;border:3px solid var(--violet);outline:none;text-align:center;background:#fff;color:#05332e}
#nameInput:focus{border-color:var(--cyan)}
#nameInput.err{border-color:var(--redorange);background:#ffecee;animation:shake .5s}
.warn{color:#fcd34d;font-weight:800;font-size:.9rem;margin-top:8px;display:none}
.warn.show{display:block}
.mbtn{font-family:'Baloo 2',cursive;font-size:1.1rem;color:#fff;border:3px solid var(--violet);cursor:pointer;padding:12px 30px;border-radius:14px;margin-top:16px;background:linear-gradient(135deg,var(--cyan),#0891b2);box-shadow:0 0 18px rgba(251,191,36,.6);transition:transform .1s}

.score-big{font-size:2.6rem;font-weight:900;color:#fcd34d;font-family:'Baloo 2',cursive;text-shadow:0 0 14px rgba(244,114,182,.8)}
.score-10{display:inline-block;margin-top:8px;font-size:1.25rem;font-weight:900;color:#0b0620;background:linear-gradient(135deg,var(--cyan),var(--gold));padding:8px 20px;border-radius:12px;border:3px solid var(--violet);box-shadow:0 0 18px rgba(251,191,36,.6)}

footer{text-align:center;color:#a7f3d0;font-weight:800;font-size:.82rem;margin-top:24px;text-shadow:0 0 8px rgba(0,0,0,.5);opacity:.95}
</style>

<script>
(function(){const items=['🪷','🎋','🌾','🏮','🍵','🌸','🛶','🌿','🐉','🪷','🎋','🌾','🍵','🌸','🌿','🏮'];
  const layer=document.getElementById('foodlayer');
  for(let i=0;i<26;i++){const s=document.createElement('span');s.textContent=items[i%items.length];
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(1.1+Math.random()*2.2)+'rem';
    s.style.animationDelay=(Math.random()*3.5)+'s';s.style.animationDuration=(2.5+Math.random()*3)+'s';layer.appendChild(s);}})();

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#10b981','#f472b6','#fbbf24','#fde047','#047857','#fcd34d','#00D26A'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Ms. Chí Nên · ULIS giải thích chi tiết";
const TOTAL=39;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> vowel is pronounced differently.",
 options:[{t:"l<u>i</u>festyle",c:false},{t:"pr<u>i</u>vate",c:false},{t:"<u>o</u>riented",c:true},{t:"f<u>i</u>recracker",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có nguyên âm gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>l<u>i</u>festyle</span> <span class='p-phonetic'>/ˈlaɪfstaɪl/</span> = <span class='p-mean'>lối sống</span> → âm <b>/aɪ/</b></div>
     <div><span class='p-word'>pr<u>i</u>vate</span> <span class='p-phonetic'>/ˈpraɪvət/</span> = <span class='p-mean'>riêng tư</span> → âm <b>/aɪ/</b></div>
     <div><span class='hl-green'>oriented</span> <span class='p-phonetic'>/ˈɔːriəntɪd/</span> = <span class='p-mean'>hướng về</span> → âm <b>/ɔː/</b></div>
     <div><span class='p-word'>f<u>i</u>recracker</span> <span class='p-phonetic'>/ˈfaɪəkrækə/</span> = <span class='p-mean'>pháo</span> → âm <b>/aɪ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"oriented" có nguyên âm nhấn đọc /ɔː/, khác với ba từ kia có "i" đọc là /aɪ/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>lifestyle, private, firecracker đều có âm /aɪ/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"tr<u>a</u>dition",c:false},{t:"democr<u>a</u>cy",c:false},{t:"st<u>a</u>ndard",c:true},{t:"m<u>a</u>terial",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "a" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>tr<u>a</u>dition</span> <span class='p-phonetic'>/trəˈdɪʃn/</span> = <span class='p-mean'>truyền thống</span> → âm <b>/ə/</b></div>
     <div><span class='p-word'>democr<u>a</u>cy</span> <span class='p-phonetic'>/dɪˈmɒkrəsi/</span> = <span class='p-mean'>dân chủ</span> → âm <b>/ə/</b></div>
     <div><span class='hl-green'>standard</span> <span class='p-phonetic'>/ˈstændəd/</span> = <span class='p-mean'>tiêu chuẩn</span> → âm <b>/æ/</b></div>
     <div><span class='p-word'>m<u>a</u>terial</span> <span class='p-phonetic'>/məˈtɪəriəl/</span> = <span class='p-mean'>vật liệu</span> → âm <b>/ə/</b></div>

   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Có "aunts and uncles" (cô dì chú bác) → "extended family" (đại gia đình gồm nhiều thế hệ, họ hàng).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"nuclear family" chỉ gồm bố mẹ và con (không có cô dì chú bác); private/dependent sai nghĩa.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:15,type:"mcq",
 q:"Mom: \"If you pass your English exam, I'll buy you a new pair of shoes.\" — Nick: \"Awesome! ____\"",
 options:[{t:"You can't do that to me.",c:false},{t:"Please keep your promise.",c:true},{t:"That's my pleasure.",c:false},{t:"You have my word.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Mẹ: "Nếu con đỗ kỳ thi tiếng Anh, mẹ sẽ mua cho con một đôi giày mới." — Nick: "Tuyệt quá! Mẹ nhớ giữ lời hứa nhé."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>You can't do that to me.</span> = <span class='p-mean'>Mẹ không thể làm vậy với con.</span></div>
     <div><span class='hl-green'>Please keep your promise.</span> = <span class='p-mean'>Mẹ nhớ giữ lời hứa nhé.</span></div>
     <div><span class='p-word'>That's my pleasure.</span> = <span class='p-mean'>Đó là niềm vinh hạnh của con.</span></div>
     <div><span class='p-word'>You have my word.</span> = <span class='p-mean'>Con hứa với mẹ đấy.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Mẹ HỨA sẽ mua giày → Nick vui và nhắc mẹ giữ lời: "Please keep your promise." (hãy giữ lời hứa nhé).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"You have my word" là NGƯỜI HỨA tự nói (ở đây mẹ mới là người hứa); các câu khác không hợp ngữ cảnh.</span></li></ol>`},

/* IV. Sign/notice with SVG */
{sec:"A. LANGUAGE FOCUS",part:"IV. Nhìn biển báo/thông báo và chọn câu đúng",n:16,type:"mcq",
 q:`<svg viewBox="0 0 140 140" width="150" height="150" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:6px auto 12px">
   <circle cx="70" cy="70" r="60" fill="#ffffff" stroke="#e11d48" stroke-width="11"/>
   <g stroke="#1a1a1a" stroke-width="5" stroke-linecap="round">
     <line x1="55" y1="38" x2="45" y2="106"/><line x1="73" y1="38" x2="71" y2="106"/>
     <line x1="53" y1="54" x2="72" y2="54"/><line x1="50" y1="72" x2="71" y2="72"/><line x1="47" y1="90" x2="71" y2="90"/>
   </g>
   <circle cx="88" cy="44" r="9" fill="#1a1a1a"/>

   <line x1="27" y1="27" x2="113" y2="113" stroke="#e11d48" stroke-width="11" stroke-linecap="round"/>
 </svg>What does the sign say? (Biển báo này nói gì?)`,
 options:[{t:"You cannot go upstairs.",c:false},{t:"There is no ladder here.",c:false},{t:"Climbing is not allowed.",c:true},{t:"You mustn't carry a ladder.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Biển báo có hình người đang leo lên (thang/kệ) bị gạch chéo đỏ → "Cấm leo trèo".</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>You cannot go upstairs.</span> = <span class='p-mean'>Không được lên lầu.</span></div>
     <div><span class='p-word'>There is no ladder here.</span> = <span class='p-mean'>Ở đây không có thang.</span></div>
     <div><span class='hl-green'>Climbing is not allowed.</span> = <span class='p-mean'>Cấm leo trèo.</span></div>
     <div><span class='p-word'>You mustn't carry a ladder.</span> = <span class='p-mean'>Không được mang thang.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hình người leo trèo bị gạch chéo trong vòng tròn đỏ = "cấm leo trèo" → "Climbing is not allowed."</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Biển không nói về việc lên lầu, không có thang, hay mang thang — chỉ cấm hành động LEO TRÈO.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Nhìn biển báo/thông báo và chọn câu đúng",n:17,type:"mcq",
 q:`<svg viewBox="0 0 240 176" width="232" height="170" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:6px auto 12px">
   <rect x="6" y="6" width="228" height="164" rx="12" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
   <path d="M6 18 a12 12 0 0 1 12 -12 h204 a12 12 0 0 1 12 12 v30 h-228 z" fill="#1e3a8a"/>
   <text x="120" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="bold" fill="#ffffff" letter-spacing="2">NOTICE</text>
   <text x="120" y="82" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#111111">PUT ALL WEIGHTS AND</text>
   <text x="120" y="108" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#111111">EQUIPMENT AWAY</text>
   <text x="120" y="134" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#111111">AFTER EACH USE</text>
 </svg>What does the notice say? (Thông báo này nói gì?)`,
 options:[{t:"Only use the weights and equipment if you're experienced.",c:false},{t:"Throw away all weights and equipment when you finish.",c:false},{t:"Do not use more than two weights and equipment at once.",c:false},{t:"Return weights and equipment to their place after using.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Thông báo: "Hãy cất tất cả tạ và dụng cụ về chỗ cũ sau mỗi lần sử dụng." → Trả dụng cụ về đúng vị trí sau khi dùng.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>Only use... if you're experienced.</span> = <span class='p-mean'>Chỉ dùng nếu có kinh nghiệm.</span></div>
     <div><span class='p-word'>Throw away all weights...</span> = <span class='p-mean'>Vứt bỏ tất cả tạ và dụng cụ.</span></div>
     <div><span class='p-word'>Do not use more than two...</span> = <span class='p-mean'>Không dùng quá hai dụng cụ cùng lúc.</span></div>
     <div><span class='hl-green'>Return weights and equipment to their place after using.</span> = <span class='p-mean'>Trả dụng cụ về chỗ cũ sau khi dùng.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Put … away after each use" = cất về chỗ cũ sau mỗi lần dùng = "Return … to their place after using."</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Thông báo không nói về kinh nghiệm, không bảo vứt bỏ, cũng không giới hạn số lượng dụng cụ.</span></li></ol>`},

/* V. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"V. Tìm phần gạch chân SAI và sửa lại cho đúng",n:18,type:"error",
 q:"We'd like <u>travelling</u> <u>to</u> new continents and <u>experience</u> different <u>cultures</u> and traditions.",
 options:["travelling","to","experience","cultures"],correctIdx:0,
 accept:["to travel"],key:"travelling → to travel",
 exp:`<div class="vnt">💬 Dịch: Chúng tôi muốn đi du lịch đến những châu lục mới và trải nghiệm các nền văn hóa, truyền thống khác nhau.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>travelling</span> → sửa thành <span class='hl-green'>to travel</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Cấu trúc "would like TO V" (muốn làm gì) → "We'd like TO TRAVEL…", không dùng "travelling".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Tìm phần gạch chân SAI và sửa lại cho đúng",n:19,type:"error",
 q:"We were <u>surprising</u> to learn that there <u>used to be</u> a tram <u>system</u> in Ha Noi <u>back then</u>.",
 options:["surprising","used to be","system","back then"],correctIdx:0,
 accept:["surprised"],key:"surprising → surprised",
 note:"👉 Câu cuối rồi, cố lên nhé! 💪",
 exp:`<div class="vnt">💬 Dịch: Chúng tôi ngạc nhiên khi biết rằng ngày xưa từng có một hệ thống tàu điện ở Hà Nội.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>surprising</span> → sửa thành <span class='hl-green'>surprised</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Người CẢM THẤY thì dùng đuôi "-ed": "We were surprised" (chúng tôi ngạc nhiên). "-ing" chỉ dùng cho vật/việc gây ra cảm giác.</span></li></ol>`},

/* VI. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:20,type:"fill",
 q:"I cannot imagine ______ (not use) the Internet even for a day.",
 answer:["not using"],
 exp:`<div class="vnt">💬 Dịch: Tôi không thể tưởng tượng nổi việc không dùng Internet dù chỉ một ngày.</div>
 <ol><li>Đáp án: <span class='hl-green'>not using</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"imagine + V-ing" (tưởng tượng việc gì); dạng phủ định đặt "not" TRƯỚC V-ing → "not using".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:21,type:"fill",
 q:"How ______ education in Vietnam ______ (change) over the last 20 years? <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["has changed"],
 exp:`<div class="vnt">💬 Dịch: Nền giáo dục ở Việt Nam đã thay đổi như thế nào trong 20 năm qua?</div>
 <ol><li>Đáp án: <span class='hl-green'>has</span> … <span class='hl-green'>changed</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "over the last 20 years" → Hiện tại hoàn thành. Chủ ngữ "education" (số ít) → "How HAS education CHANGED…?".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",
 q:"If Anna ______ (not practise) regularly, she ______ (may, forget) the dance steps. <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["doesn't practise may forget","does not practise may forget","doesn't practice may forget"],
 exp:`<div class="vnt">💬 Dịch: Nếu Anna không luyện tập thường xuyên, cô ấy có thể sẽ quên các bước nhảy.</div>
 <ol><li>Đáp án: <span class='hl-green'>doesn't practise</span> … <span class='hl-green'>may forget</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (doesn't practise), … may + V (may forget)". "may" diễn tả khả năng có thể xảy ra.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:23,type:"fill",
 q:"They ______ (take) notes carefully while the teacher ______ (explain) the lesson. <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["were taking was explaining"],
 exp:`<div class="vnt">💬 Dịch: Các bạn ấy đang ghi chép cẩn thận trong khi cô giáo giảng bài.</div>
 <ol><li>Đáp án: <span class='hl-green'>were taking</span> … <span class='hl-green'>was explaining</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hai hành động CÙNG diễn ra song song trong quá khứ (nối bằng "while") → cả hai đều Quá khứ tiếp diễn: were taking – was explaining.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",
 q:"Using eco-friendly products can help ______ (protect) our environment.",
 answer:["to protect","protect"],
 exp:`<div class="vnt">💬 Dịch: Việc dùng các sản phẩm thân thiện với môi trường có thể giúp bảo vệ môi trường của chúng ta.</div>
 <ol><li>Đáp án: <span class='hl-green'>(to) protect</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "help + (to) V" — sau "help" có thể dùng "to protect" hoặc "protect" (bỏ "to"), cả hai đều đúng.</span></li></ol>`},

/* VII. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:25,type:"fill",
 q:"Vietnamese women today are more ______ in making life decisions. <span class='hint-word'>(depend)</span>",
 answer:["independent"],
 exp:`<div class="vnt">💬 Dịch: Phụ nữ Việt Nam ngày nay <b>độc lập</b> hơn trong việc đưa ra các quyết định cuộc sống.</div>
 <ol><li>Từ gốc: <span class='p-word'>depend</span> <span class='wt'>v</span> = <span class='p-mean'>phụ thuộc</span> → dạng cần điền: <span class='hl-green'>independent</span> <span class='wt'>adj</span> = <span class='p-mean'>độc lập</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: independent</span> <span class='p-grammar'>Sau "more" cần TÍNH TỪ (more independent). Thêm tiền tố "in-": depend → dependent → independent.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:26,type:"fill",
 q:"Protecting personal ______ is a big challenge for social media users. <span class='hint-word'>(private)</span>",
 answer:["privacy"],
 exp:`<div class="vnt">💬 Dịch: Bảo vệ <b>quyền riêng tư</b> cá nhân là một thách thức lớn với người dùng mạng xã hội.</div>
 <ol><li>Từ gốc: <span class='p-word'>private</span> <span class='wt'>adj</span> = <span class='p-mean'>riêng tư</span> → dạng cần điền: <span class='hl-green'>privacy</span> <span class='wt'>n</span> = <span class='p-mean'>quyền riêng tư</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: privacy</span> <span class='p-grammar'>Sau "personal" và làm tân ngữ cho "Protecting" cần DANH TỪ → privacy (sự riêng tư).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"______, Vietnamese families lived in extended households, with many generations under one roof. <span class='hint-word'>(tradition)</span>",
 answer:["traditionally"],
 exp:`<div class="vnt">💬 Dịch: <b>Theo truyền thống</b>, các gia đình Việt sống trong những hộ đại gia đình, nhiều thế hệ chung một mái nhà.</div>
 <ol><li>Từ gốc: <span class='p-word'>tradition</span> <span class='wt'>n</span> = <span class='p-mean'>truyền thống</span> → dạng cần điền: <span class='hl-green'>Traditionally</span> <span class='wt'>adv</span> = <span class='p-mean'>theo truyền thống</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: Traditionally</span> <span class='p-grammar'>Đầu câu, bổ nghĩa cho cả câu → cần TRẠNG TỪ, viết hoa chữ đầu. tradition → traditional → traditionally.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"The cost of living can ______ greatly between rural and urban areas. <span class='hint-word'>(various)</span>",
 answer:["vary"],
 exp:`<div class="vnt">💬 Dịch: Chi phí sinh hoạt có thể <b>khác nhau</b> rất nhiều giữa khu vực nông thôn và thành thị.</div>
 <ol><li>Từ gốc: <span class='p-word'>various</span> <span class='wt'>adj</span> = <span class='p-mean'>đa dạng</span> → dạng cần điền: <span class='hl-green'>vary</span> <span class='wt'>v</span> = <span class='p-mean'>thay đổi, khác nhau</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: vary</span> <span class='p-grammar'>Sau "can" cần ĐỘNG TỪ nguyên mẫu (can vary = có thể khác nhau). various → vary.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"A good leader keeps a ______ attitude, even in stressful times. <span class='hint-word'>(profession)</span>",
 answer:["professional"],
 exp:`<div class="vnt">💬 Dịch: Một người lãnh đạo giỏi luôn giữ thái độ <b>chuyên nghiệp</b>, ngay cả trong những lúc căng thẳng.</div>
 <ol><li>Từ gốc: <span class='p-word'>profession</span> <span class='wt'>n</span> = <span class='p-mean'>nghề nghiệp</span> → dạng cần điền: <span class='hl-green'>professional</span> <span class='wt'>adj</span> = <span class='p-mean'>chuyên nghiệp</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: professional</span> <span class='p-grammar'>Cần TÍNH TỪ đứng trước danh từ "attitude" → "a professional attitude" (thái độ chuyên nghiệp).</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Chọn thứ tự sắp xếp câu đúng để tạo đoạn hội thoại/đoạn văn hợp lí",n:42,type:"mcq",
 q:"Sắp xếp các câu (a–d) thành đoạn hội thoại hợp lí:<br><div class='dialog'><b>a.</b> Betty: Dad, can I hang out with my friends at the shopping mall after class? I'll be home by 8 p.m.<br><b>b.</b> Dad: Alright. Have fun with your friends, and remember to stay safe!<br><b>c.</b> Betty: I won't be late, I promise. I'll check the time and leave on time.<br><b>d.</b> Dad: Sounds good, make sure you stick to the time. If you return home late, we'll be very worried.</div>",
 options:[{t:"a – b – d – c",c:false},{t:"c – b – a – d",c:false},{t:"c – d – a – b",c:false},{t:"a – d – c – b",c:true}],
 exp:`<div class="vnt">💬 Chủ đề: Betty xin phép bố đi chơi với bạn. Thứ tự đúng là <b>a – d – c – b</b>.</div>
 <ol><li>Dịch &amp; trình tự hợp lí:
   <div class="orderline"><span class="lbl">a</span> <span class="p-en">Betty: Dad, can I hang out with my friends at the shopping mall after class? I'll be home by 8 p.m.</span> — <span class="p-mean">Betty: Bố ơi, sau giờ học con đi chơi với bạn ở trung tâm thương mại được không ạ? Con sẽ về nhà trước 8 giờ tối.</span> <i>(câu hỏi xin phép)</i></div>
   <div class="orderline"><span class="lbl">d</span> <span class="p-en">Dad: Sounds good, make sure you stick to the time. If you return home late, we'll be very worried.</span> — <span class="p-mean">Bố: Được đấy, nhớ đúng giờ nhé. Nếu con về muộn, bố mẹ sẽ rất lo.</span> <i>(bố đồng ý kèm điều kiện)</i></div>
   <div class="orderline"><span class="lbl">c</span> <span class="p-en">Betty: I won't be late, I promise. I'll check the time and leave on time.</span> — <span class="p-mean">Betty: Con hứa sẽ không về muộn đâu ạ. Con sẽ để ý giờ và về đúng hẹn.</span> <i>(Betty trấn an, hứa)</i></div>
   <div class="orderline"><span class="lbl">b</span> <span class="p-en">Dad: Alright. Have fun with your friends, and remember to stay safe!</span> — <span class="p-mean">Bố: Được rồi. Chơi vui với bạn nhé, và nhớ giữ an toàn!</span> <i>(câu chốt của bố)</i></div>
 </li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Betty xin phép (a) → bố đồng ý & dặn (d) → Betty hứa (c) → bố chốt lời chúc (b). Vậy a – d – c – b.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các thứ tự khác đặt lời hứa/lời chốt trước câu xin phép, phá vỡ mạch hỏi–đáp.</span></li></ol>`},

{sec:"C. WRITING",part:"I. Chọn thứ tự sắp xếp câu đúng để tạo đoạn hội thoại/đoạn văn hợp lí",n:43,type:"mcq",
 q:"Sắp xếp các câu (a–e) thành đoạn văn hợp lí:<br><div class='dialog'><b>a.</b> We used to live in a small town in the suburbs, but now we have an apartment in the city centre.<br><b>b.</b> However, at weekends, we try our best to make time for family dinners.<br><b>c.</b> No matter how things change, we always make sure to strengthen our family bonds.<br><b>d.</b> My family life has changed a lot over the years.<br><b>e.</b> Ever since we moved here, we have spent less time together due to the difference in our schedules.</div>",
 options:[{t:"d – a – e – b – c",c:true},{t:"d – e – a – c – b",c:false},{t:"a – e – d – b – c",c:false},{t:"a – b – d – c – e",c:false}],
 exp:`<div class="vnt">💬 Chủ đề: Cuộc sống gia đình thay đổi qua năm tháng. Thứ tự đúng là <b>d – a – e – b – c</b>.</div>
 <ol><li>Dịch &amp; trình tự hợp lí:
   <div class="orderline"><span class="lbl">d</span> <span class="p-en">My family life has changed a lot over the years.</span> — <span class="p-mean">Cuộc sống gia đình tôi đã thay đổi rất nhiều qua nhiều năm.</span> <i>(câu mở đầu, nêu chủ đề)</i></div>
   <div class="orderline"><span class="lbl">a</span> <span class="p-en">We used to live in a small town in the suburbs, but now we have an apartment in the city centre.</span> — <span class="p-mean">Chúng tôi từng sống ở một thị trấn nhỏ ngoại ô, nhưng giờ có căn hộ ở trung tâm thành phố.</span> <i>(thay đổi cụ thể 1)</i></div>
   <div class="orderline"><span class="lbl">e</span> <span class="p-en">Ever since we moved here, we have spent less time together due to the difference in our schedules.</span> — <span class="p-mean">Từ khi chuyển đến đây, chúng tôi dành ít thời gian bên nhau hơn vì lịch trình khác nhau.</span> <i>(hệ quả của việc chuyển nhà)</i></div>
   <div class="orderline"><span class="lbl">b</span> <span class="p-en">However, at weekends, we try our best to make time for family dinners.</span> — <span class="p-mean">Tuy nhiên, vào cuối tuần, chúng tôi cố gắng dành thời gian cho bữa cơm gia đình.</span> <i>("However" – bước ngoặt)</i></div>
   <div class="orderline"><span class="lbl">c</span> <span class="p-en">No matter how things change, we always make sure to strengthen our family bonds.</span> — <span class="p-mean">Dù mọi thứ thay đổi thế nào, chúng tôi luôn cố gắng gắn kết tình cảm gia đình.</span> <i>(câu kết, tổng kết)</i></div>
 </li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Mở bài nêu chủ đề (d) → thay đổi nơi ở (a) → hệ quả ít thời gian bên nhau (e) → "However" cố gắng bù đắp (b) → kết luận gắn kết (c). Vậy d – a – e – b – c.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các thứ tự khác đặt câu chủ đề (d) sai vị trí hoặc để "However/No matter" lệch mạch, làm đứt logic.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu đúng nhất viết từ các gợi ý",n:44,type:"mcq",
 q:"Gợi ý: <em>Young Vietnamese / recently / learn / play / traditional instruments.</em>",
 options:[{t:"Many young Vietnamese have recently learnt to play traditional instruments.",c:true},
          {t:"Many young Vietnamese are recently learning playing traditional instruments.",c:false},
          {t:"Much young Vietnamese recently learnt to play traditional instruments.",c:false},
          {t:"Much young Vietnamese will recently learn playing traditional instruments.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Nhiều người trẻ Việt Nam gần đây đã học chơi các nhạc cụ truyền thống.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Many young Vietnamese have recently learnt to play traditional instruments.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"recently" đi với Hiện tại hoàn thành (have learnt); "many" dùng cho danh từ đếm được số nhiều (young Vietnamese); "learn TO V" (học làm gì).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"Much" sai (dùng cho danh từ không đếm được); "learning playing" sai cấu trúc; "will recently" mâu thuẫn về thì.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu đúng nhất viết từ các gợi ý",n:45,type:"mcq",
 q:"Gợi ý: <em>There / differences / terms / food habits / past / present lifestyles.</em>",
 options:[{t:"There were any differences in terms food habits between past and present lifestyles.",c:false},
          {t:"There were differences in terms with food habits both past and present lifestyles.",c:false},
          {t:"There are differences in terms of food habits between past and present lifestyles.",c:true},
          {t:"There are much differences in terms food habits both past and present lifestyles.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Có những khác biệt về thói quen ăn uống giữa lối sống xưa và nay.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>There are differences in terms of food habits between past and present lifestyles.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"in terms OF" (về mặt/xét về); "between A and B" (giữa A và B); "There are + differences" (danh từ số nhiều).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"in terms food/with" thiếu "of"; "much differences" sai (differences đếm được); "both… lifestyles" sai cấu trúc so với "between".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu đúng nhất viết từ các gợi ý",n:46,type:"mcq",
 q:"Gợi ý: <em>City dwellers / wish / the city / have / cleaner air / green spaces.</em>",
 options:[{t:"City dwellers wish the city had a cleaner air and much green spaces.",c:false},
          {t:"City dwellers wish the city would have cleaner air and more green spaces.",c:true},
          {t:"City dwellers wish the city has cleaner air and more green spaces.",c:false},
          {t:"City dwellers wish the city was having a cleaner air and much green spaces.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Người dân thành phố ước gì thành phố có không khí trong lành hơn và nhiều không gian xanh hơn.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>City dwellers wish the city would have cleaner air and more green spaces.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"wish + S + would + V" diễn tả mong muốn một điều thay đổi trong tương lai; "air" là danh từ không đếm được (không "a cleaner air"); "more green spaces" (nhiều hơn).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"a cleaner air / much green spaces" sai (air không đếm được, spaces đếm được dùng "more"); "has" không dùng sau "wish".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu đúng nhất viết từ các gợi ý",n:47,type:"mcq",
 q:"Gợi ý: <em>Live / extended family / teach / treat / everyone / respect.</em>",
 options:[{t:"Living in an extended family teaches me treating everyone with respect.",c:false},
          {t:"Living with the extended family teaches me treat everyone with respect.",c:false},
          {t:"Living with the extended family teaches me to treat everyone for respect.",c:false},
          {t:"Living in an extended family teaches me to treat everyone with respect.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Sống trong một đại gia đình dạy tôi cách đối xử tôn trọng với mọi người.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Living in an extended family teaches me to treat everyone with respect.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"live IN a family" (sống trong gia đình); "teach sb TO V" (dạy ai làm gì); "treat sb WITH respect" (đối xử tôn trọng).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"teaches me treating/treat" sai (phải "to treat"); "for respect" sai giới từ (phải "with respect"); "live with" kém tự nhiên hơn "live in".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết lại câu dùng từ trong ngoặc (chỉ gõ TIẾP phần sau — chấm nhận cả câu đầy đủ)",n:48,type:"fill",
 q:"It surprised me a lot when I ran into Emma at the charity event. <span class='hint-word'>(EXPECT)</span><br><span class='hint-word'>➜ I didn't ______</span><br><span class='note-inline' style='display:inline-block;margin:6px 0 0'>(Em chỉ cần gõ TIẾP phần sau chữ \"I didn't\", KHÔNG phải gõ lại. Chấm nhận cả câu đầy đủ hoặc chỉ phần tiếp theo.)</span>",
 answer:["expect to run into emma at the charity event","i didn't expect to run into emma at the charity event","i did not expect to run into emma at the charity event"],
 exp:`<div class="vnt">💬 Dịch: Tôi khá bất ngờ khi tình cờ gặp Emma tại sự kiện từ thiện. → Tôi đã không ngờ lại gặp Emma ở sự kiện từ thiện.</div>
 <ol><li>Đáp án: <span class='hl-green'>I didn't expect to run into Emma at the charity event.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"It surprised me when…" (bất ngờ) = "I didn't expect to…" (không ngờ sẽ…). "expect TO V" (mong/ngờ sẽ làm gì); "run into sb" (tình cờ gặp).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết lại câu dùng từ trong ngoặc (chỉ gõ TIẾP phần sau — chấm nhận cả câu đầy đủ)",n:49,type:"fill",
 q:"This country forbids smoking and littering in public places. <span class='hint-word'>(ALLOWED)</span><br><span class='hint-word'>➜ People in this country ______</span><br><span class='note-inline' style='display:inline-block;margin:6px 0 0'>(Em chỉ cần gõ TIẾP phần sau chữ \"People in this country\", KHÔNG phải gõ lại. Chấm nhận cả câu đầy đủ hoặc chỉ phần tiếp theo.)</span>",
 answer:["aren't allowed to smoke or litter in public places","are not allowed to smoke or litter in public places","people in this country aren't allowed to smoke or litter in public places","people in this country are not allowed to smoke or litter in public places"],
 exp:`<div class="vnt">💬 Dịch: Đất nước này cấm hút thuốc và xả rác nơi công cộng. → Người dân ở đất nước này không được phép hút thuốc hay xả rác nơi công cộng.</div>
 <ol><li>Đáp án: <span class='hl-green'>People in this country aren't allowed to smoke or litter in public places.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"forbid sb to do st" (cấm) = "sb + be not allowed TO do st" (không được phép làm gì). "aren't allowed to smoke or litter".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết lại câu dùng từ trong ngoặc (chỉ gõ TIẾP phần sau — chấm nhận cả câu đầy đủ)",n:50,type:"fill",
 q:"The last time my extended family had a gathering was 5 months ago. <span class='hint-word'>(FOR)</span><br><span class='hint-word'>➜ My extended family ______</span><br><span class='note-inline' style='display:inline-block;margin:6px 0 0'>(Em chỉ cần gõ TIẾP phần sau chữ \"My extended family\", KHÔNG phải gõ lại. Chấm nhận cả câu đầy đủ hoặc chỉ phần tiếp theo.)</span>",
 answer:["hasn't had a gathering for 5 months","has not had a gathering for 5 months","hasn't had a gathering for five months","my extended family hasn't had a gathering for 5 months","my extended family has not had a gathering for 5 months"],
 exp:`<div class="vnt">💬 Dịch: Lần cuối đại gia đình tôi tụ họp là 5 tháng trước. → Đại gia đình tôi đã không tụ họp suốt 5 tháng nay.</div>
 <ol><li>Đáp án: <span class='hl-green'>My extended family hasn't had a gathering for 5 months.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"The last time… was … ago" = "S + haven't/hasn't + V3 + for + khoảng thời gian". Chủ ngữ số ít "family" → "hasn't had a gathering for 5 months".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết lại câu dùng từ trong ngoặc (chỉ gõ TIẾP phần sau — chấm nhận cả câu đầy đủ)",n:51,type:"fill",
 q:"We arrived at the festival and saw everyone playing a traditional game. <span class='hint-word'>(WHILE)</span><br><span class='hint-word'>➜ We arrived ______</span><br><span class='note-inline' style='display:inline-block;margin:6px 0 0'>(Em chỉ cần gõ TIẾP phần sau chữ \"We arrived\", KHÔNG phải gõ lại. Chấm nhận cả câu đầy đủ hoặc chỉ phần tiếp theo.)</span>",
 answer:["at the festival while everyone was playing a traditional game","we arrived at the festival while everyone was playing a traditional game"],
 exp:`<div class="vnt">💬 Dịch: Chúng tôi đến lễ hội và thấy mọi người đang chơi một trò chơi truyền thống. → Chúng tôi đến lễ hội trong khi mọi người đang chơi một trò chơi dân gian.</div>
 <ol><li>Đáp án: <span class='hl-green'>We arrived at the festival while everyone was playing a traditional game.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hành động ngắn "arrived" (QK đơn) xảy ra khi hành động khác đang diễn ra → "while + QK tiếp diễn (was playing)".</span></li></ol>`}
];

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#05332e">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#f472b6">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 39 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🚀';memeKey='good';msg='Cố thêm chút nữa là chạm tới điều tuyệt vời luôn nè! 🪷';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='🌙';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
</body>
</html>
