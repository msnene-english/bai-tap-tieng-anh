<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 · Local Community — TEST 1</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --red:#ff4d4d; --yellow:#ffd63d; --blue:#4d8bff; --teal:#20c9a6;
  --green:#00c853; --wrong:#ff3b47; --purple:#8a5cf6; --terra:#c0562b; --grammar:#e11d48;
  --blueT:#1d5fd6; --purpleT:#6a3fd6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Baloo 2',sans-serif; color:var(--ink); min-height:100vh;
  background:linear-gradient(-45deg,#ffd63d,#4d8bff,#ff4d4d,#20c9a6,#8a5cf6);
  background-size:400% 400%; animation:bgmove 20s ease infinite; overflow-x:hidden;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.28;
  background-image:radial-gradient(var(--ink) 1.4px,transparent 1.6px);background-size:16px 16px}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaties span{position:absolute;font-size:2.2rem;opacity:.6;animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 80px}
.head{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:#fff;border:3px solid var(--ink);color:var(--ink);font-weight:800;font-size:.8rem;
  padding:5px 14px;border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.title{margin-top:12px;font-family:'Bangers',cursive;letter-spacing:1.5px;font-size:2.6rem;color:#fff;
  -webkit-text-stroke:2.5px var(--ink);text-shadow:5px 5px 0 var(--ink)}
.sub{display:inline-block;margin-top:4px;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;
  padding:3px 12px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.progbar{height:16px;background:#fff;border:3px solid var(--ink);border-radius:20px;margin:16px 0;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.progfill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--red),var(--red) 10px,var(--yellow) 10px,var(--yellow) 20px);transition:width .4s}
.sec{margin:26px 0 12px;background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 16px;
  font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.25rem;box-shadow:5px 5px 0 rgba(0,0,0,.35)}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 16px 14px;margin-bottom:18px;box-shadow:6px 6px 0 var(--ink)}
.qnum{display:inline-block;background:var(--red);color:#fff;font-family:'Bangers',cursive;letter-spacing:1px;border:2.5px solid var(--ink);border-radius:10px;
  padding:1px 10px;font-size:.95rem;margin-right:8px;box-shadow:2px 2px 0 var(--ink)}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.5;display:inline}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px}
.hint{font-size:.85rem;color:#5a4a2a;font-weight:800;margin-top:8px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:13px 12px;
  font-family:'Baloo 2';font-size:1.08rem;font-weight:800;color:var(--ink);cursor:pointer;
  box-shadow:4px 4px 0 var(--ink);transition:transform .1s;text-align:center}
.opt:nth-child(2n){background:var(--blue);color:#fff}
.opt:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.opt:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green)!important;color:#fff}
.opt.wrong{background:var(--wrong)!important;color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.tin{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.tin input{flex:1;min-width:180px;font-family:'Baloo 2';font-size:1.05rem;font-weight:700;
  padding:11px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tin input:focus{outline:none;background:#fffbe6}
.tin input.ok{background:#d7ffe6}
.tin input.no{background:#ffe0e2}
.btnc{background:var(--purple);color:#fff;border:3px solid var(--ink);border-radius:12px;
  padding:11px 20px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.05rem;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
.btnc:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)} .btnc:disabled{opacity:.55;cursor:default}
.letters{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.lbtn{width:50px;height:50px;border-radius:12px;border:3px solid var(--ink);font-family:'Bangers',cursive;font-size:1.3rem;cursor:pointer;
  background:var(--yellow);color:var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
.lbtn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.lbtn.sel{background:var(--blue);color:#fff}
.lbtn.correct{background:var(--green);color:#fff}
.lbtn.wrong{background:var(--wrong);color:#fff}
.lbtn:disabled{cursor:default}
.mark{background:#fff3b0;border:2px solid var(--ink);border-radius:6px;padding:0 4px;font-weight:800}
.mark sup{color:var(--red);font-family:'Bangers';font-size:.72rem}
.exp{margin-top:14px;max-height:0;overflow:hidden;transition:max-height .5s ease;font-size:1rem}
.exp.open{max-height:1600px}
.expin{background:#fffdf2;border:3px dashed var(--ink);border-radius:12px;padding:14px}
.exp ol{margin:6px 0 0 20px} .exp li{margin:8px 0;line-height:1.55}
.vnt{background:#ffe9c7;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:800;color:#7a3e00;margin-bottom:8px;box-shadow:3px 3px 0 var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0}
.grid2>div{line-height:1.5}
.p-word{color:var(--blueT);font-weight:800}
.hl-green{color:#088a3c;font-weight:900}
.hl-red{color:var(--wrong);font-weight:900}
.wt{background:#ece3ff;border:2px solid var(--ink);color:var(--purpleT);border-radius:6px;padding:0 6px;font-size:.78rem;font-weight:800}
.p-phonetic{color:var(--purpleT);background:#f0e9ff;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;font-weight:700}
.p-mean{color:var(--terra);font-weight:800}
.p-grammar{border-bottom:3px solid var(--grammar);color:#7a1030;font-weight:800}
.keyline{background:#d7ffe6;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:800;color:#066b34;margin-bottom:8px;box-shadow:3px 3px 0 var(--ink)}
.submit{display:block;width:100%;margin-top:24px;background:var(--red);color:#fff;
  border:4px solid var(--ink);border-radius:16px;padding:18px;font-family:'Bangers',cursive;letter-spacing:2px;font-size:1.5rem;cursor:pointer;box-shadow:7px 7px 0 var(--ink)}
.submit:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border:4px solid var(--ink);border-radius:20px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:8px 8px 0 var(--ink);animation:pop .3s}
@keyframes pop{from{transform:scale(.8) rotate(-3deg);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.6rem;color:var(--red);margin-bottom:12px}
.modal input{width:100%;padding:14px;border-radius:12px;border:3px solid var(--ink);font-size:1.05rem;font-family:'Baloo 2';font-weight:700;margin-bottom:6px;box-shadow:3px 3px 0 var(--ink)}
.modal input.err{background:#ffe0e2}
.errmsg{color:var(--wrong);font-weight:800;font-size:.9rem;min-height:20px;margin-bottom:8px}
.modal button{background:var(--teal);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px 26px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.15rem;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.rgreet{font-family:'Bangers',cursive;letter-spacing:.5px;font-size:1.5rem;color:var(--red);line-height:1.3}
.rscore{font-family:'Bangers';font-size:2.4rem;color:var(--ink);margin:8px 0}
.rten{font-size:1.5rem;font-weight:800;color:var(--purpleT);margin-bottom:12px}
.rmeme{width:100%;max-width:280px;border-radius:14px;border:3px solid var(--ink);margin:0 auto 14px;display:block;box-shadow:5px 5px 0 var(--ink);min-height:120px;object-fit:cover}
.memefall{font-size:5rem}
@media(max-width:560px){.opts,.grid2{grid-template-columns:1fr}.title{font-size:2rem}}
</style>
</head>
<body>
<div class="floaties" id="floaties"></div>
<div class="wrap">
  <div class="head">
    <div class="badge">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên</div>
    <div class="title">LOCAL COMMUNITY</div>
    <div><span class="sub">UNIT 1 · TEST 1 — Phần A (I–VIII) &amp; C (I–III)</span></div>
    <div class="progbar"><div class="progfill" id="prog"></div></div>
  </div>
  <div id="quiz"></div>
  <button class="submit" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="overlay" id="nameOv">
  <div class="modal">
    <h2>✍️ Nhập tên của em nhé!</h2>
    <input id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
    <div class="errmsg" id="nameErr"></div>
    <button onclick="showResult()">Xem kết quả 🚀</button>
  </div>
</div>
<div class="overlay" id="resOv">
  <div class="modal">
    <div class="rgreet" id="rGreet"></div>
    <div class="rscore" id="rScore"></div>
    <div class="rten" id="rTen"></div>
    <img class="rmeme" id="rMeme" alt="result">
    <div class="memefall" id="rFall" style="display:none"></div>
    <button onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
(function(){
  const ico=['🏺','🎨','🧺','🏘️','🛠️','⭐','💥','🎭','📣','🤝','💬','🔥'];
  const f=document.getElementById('floaties');
  for(let i=0;i<16;i++){const s=document.createElement('span');
    s.textContent=ico[i%ico.length];s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(14+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(1.6+Math.random()*1.8)+'rem';f.appendChild(s);}
})();
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=i?1318:988;o.connect(g);g.connect(c.destination);
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);
  g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.4);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function confetti(){const cols=['#ff4d4d','#ffd63d','#4d8bff','#20c9a6','#00c853','#8a5cf6'];
  for(let i=0;i<70;i++){const d=document.createElement('div');
    d.style.cssText='position:fixed;z-index:99;width:11px;height:15px;top:-20px;pointer-events:none;border:2px solid #141414;';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1500+Math.random()*1500,x=(Math.random()-.5)*300;
    d.animate([{transform:d.style.transform,opacity:1},
      {transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:0}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[.,?!;:'"’\-]/g,' ').replace(/\s+/g,' ').trim();}
function matchWriting(input,answers){const ni=norm(input);if(!ni)return false;
  for(const a of answers){const na=norm(a);if(ni===na)return true;
    if(na.includes(ni)&&ni.length>=na.length*0.5)return true;if(ni.includes(na))return true;}return false;}
let TOTAL=0,correctCount=0,answered=0;
function updateProg(){document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';}

/* ============================================================
   DATA — Unit 1 · TEST 1 · A(I–VIII) + C(I–III)
   ============================================================ */
const Q=[];
function sec(t){Q.push({sec:t});}
function mcq(num,q,opts,correctIdx,exp){Q.push({type:'mcq',num,q,opts,correctIdx,exp});}
function txt(num,q,ans,exp,hint){Q.push({type:'txt',num,q,ans,exp,hint});}
function cor(num,q,parts,cIdx,corr,exp){Q.push({type:'cor',num,q,parts,cIdx,corr,exp});}

/* ---------- A. I. Pronunciation ---------- */
sec("A. LANGUAGE FOCUS · I. Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại");
mcq(1,"Chọn từ có phần gạch chân được phát âm khác:",
 ["<u>s</u>uburb","arti<u>s</u>an","fa<u>c</u>ility","<u>s</u>ouvenir"],1,
 `<div class="vnt">💬 Dịch: Tìm từ có phụ âm gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>suburb</span> <span class='p-phonetic'>/ˈsʌbɜːb/</span> = <span class='p-mean'>vùng ngoại ô</span> → /s/</div>
 <div><span class='hl-green'>artisan</span> <span class='p-phonetic'>/ˈɑːtɪzæn/</span> = <span class='p-mean'>nghệ nhân</span> → /z/</div>
 <div><span class='p-word'>facility</span> <span class='p-phonetic'>/fəˈsɪləti/</span> = <span class='p-mean'>cơ sở vật chất</span> → /s/</div>
 <div><span class='p-word'>souvenir</span> <span class='p-phonetic'>/ˌsuːvəˈnɪə/</span> = <span class='p-mean'>đồ lưu niệm</span> → /s/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"artisan" có "s" đọc là /z/. Ba từ kia đọc /s/ (kể cả "c" trong facility).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>suburb, facility, souvenir đều /s/ nên giống nhau.</span></li></ol>`);
mcq(2,"Chọn từ có phần gạch chân được phát âm khác:",
 ["h<u>a</u>ndicraft","<u>a</u>ttraction","fragr<u>a</u>nce","tr<u>a</u>dition"],0,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "a" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>handicraft</span> <span class='p-phonetic'>/ˈhændikrɑːft/</span> = <span class='p-mean'>đồ thủ công</span> → /æ/</div>
 <div><span class='p-word'>attraction</span> <span class='p-phonetic'>/əˈtrækʃn/</span> = <span class='p-mean'>điểm hấp dẫn</span> → /ə/</div>
 <div><span class='p-word'>fragrance</span> <span class='p-phonetic'>/ˈfreɪɡrəns/</span> = <span class='p-mean'>hương thơm</span> → /ə/</div>
 <div><span class='p-word'>tradition</span> <span class='p-phonetic'>/trəˈdɪʃn/</span> = <span class='p-mean'>truyền thống</span> → /ə/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"handicraft" có "a" gạch chân đọc rõ là /æ/. Ba từ kia "a" gạch chân là âm mờ, yếu /ə/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>attraction, fragrance, tradition đều có "a" gạch chân đọc /ə/ nên giống nhau.</span></li></ol>`);
mcq(3,"Chọn từ có phần gạch chân được phát âm khác:",
 ["<u>e</u>xhausted","d<u>e</u>livery","pr<u>e</u>serve","sp<u>e</u>ciality"],3,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "e" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>exhausted</span> <span class='p-phonetic'>/ɪɡˈzɔːstɪd/</span> = <span class='p-mean'>kiệt sức</span> → /ɪ/</div>
 <div><span class='p-word'>delivery</span> <span class='p-phonetic'>/dɪˈlɪvəri/</span> = <span class='p-mean'>sự giao hàng</span> → /ɪ/</div>
 <div><span class='p-word'>preserve</span> <span class='p-phonetic'>/prɪˈzɜːv/</span> = <span class='p-mean'>bảo tồn</span> → /ɪ/</div>
 <div><span class='hl-green'>speciality</span> <span class='p-phonetic'>/ˌspeʃiˈæləti/</span> = <span class='p-mean'>đặc sản</span> → /e/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"speciality" có "e" gạch chân đọc /e/. Ba từ kia "e" đọc /ɪ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>exhausted, delivery, preserve đều có "e" đọc /ɪ/ nên giống nhau.</span></li></ol>`);

/* ---------- A. II. Stress ---------- */
sec("A. LANGUAGE FOCUS · II. Chọn từ có TRỌNG ÂM khác các từ còn lại");
mcq(4,"Chọn từ có trọng âm khác:",
 ["function","pottery","remind","shorten"],2,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>FUNC-tion</span> <span class='wt'>n</span> = <span class='p-mean'>chức năng</span> → âm 1</div>
 <div><span class='p-word'>POT-tery</span> <span class='wt'>n</span> = <span class='p-mean'>đồ gốm</span> → âm 1</div>
 <div><span class='hl-green'>re-MIND</span> <span class='wt'>v</span> = <span class='p-mean'>nhắc nhở</span> → âm 2</div>
 <div><span class='p-word'>SHOR-ten</span> <span class='wt'>v</span> = <span class='p-mean'>rút ngắn</span> → âm 1</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"remind" nhấn âm tiết THỨ HAI. Ba từ kia nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>function, pottery, shorten đều nhấn âm tiết 1.</span></li></ol>`);
mcq(5,"Chọn từ có trọng âm khác:",
 ["facility","original","firefighter","community"],2,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>fa-CI-li-ty</span> <span class='wt'>n</span> = <span class='p-mean'>cơ sở vật chất</span> → âm 2</div>
 <div><span class='p-word'>o-RI-gi-nal</span> <span class='wt'>adj</span> = <span class='p-mean'>nguyên bản</span> → âm 2</div>
 <div><span class='hl-green'>FIRE-figh-ter</span> <span class='wt'>n</span> = <span class='p-mean'>lính cứu hỏa</span> → âm 1</div>

 <li><span class="hl-green">✅ SỬA ĐÚNG:</span> <span class='p-grammar'>Sau "teach + tân ngữ" dùng ĐỘNG TỪ NGUYÊN THỂ có "to": taught the volunteers to cook.</span></li></ol>`);

sec("A. LANGUAGE FOCUS · VII. Chia dạng đúng của động từ trong ngoặc (GÕ đáp án)");
txt(22,"_____ the village _____ this festival annually? <b>(organise)</b>",
 ["does organise","does the village organise"],

 <ol>

 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Thói quen lặp lại "annually" → HIỆN TẠI ĐƠN. Câu hỏi với "the village" (số ít): Does + S + V(nguyên thể)?</span></li></ol>`,"Điền 2 chỗ trống: Does ... organise");
txt(23,"Emma _____ Vietnamese specialities with her friends at present. <b>(discuss)</b>",
 ["is discussing"],

 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">is discussing</span></div>
 <ol>
 <li>Phân tích: <span class='p-word'>is discussing</span> <span class='wt'>v (present cont.)</span> = <span class='p-mean'>đang thảo luận</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "at present" → HIỆN TẠI TIẾP DIỄN. Emma (số ít) → is + V-ing.</span></li></ol>`,"Chia động từ: discuss");
txt(24,"My mom often _____ me to her workshop when I was young. <b>(take)</b>",
 ["took"],
 `<div class="vnt">💬 Dịch: Hồi tôi còn nhỏ, mẹ tôi thường đưa tôi đến xưởng làm việc của bà.</div>
 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">took</span></div>
 <ol>
 <li>Phân tích: <span class='p-word'>take → took</span> <span class='wt'>v (past)</span> = <span class='p-mean'>đã đưa/dẫn</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"when I was young" → QUÁ KHỨ ĐƠN. take (bất quy tắc) → took.</span></li></ol>`,"Chia động từ: take");
txt(25,"Everyone hopes the city _____ its public transportation system soon. <b>(expand)</b>",
 ["will expand"],
 `<div class="vnt">💬 Dịch: Mọi người hy vọng thành phố sẽ sớm mở rộng hệ thống giao thông công cộng.</div>

 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "soon" + hy vọng "hopes" → TƯƠNG LAI ĐƠN: will + V.</span></li></ol>`,"Chia động từ: expand");
txt(26,"Do you mind _____ me where the farmers' market is? <b>(show)</b>",

sec("A. LANGUAGE FOCUS · VIII. Chia dạng đúng của từ trong ngoặc (GÕ đáp án)");

 ["attraction"],

txt(28,"This arts summer camp for teens is _____ held every summer. <b>(tradition)</b>",

 <ol>

txt(29,"The community centre offers _____ classes for people of all skill levels. <b>(potter)</b>",

 `<div class="vnt">💬 Dịch: Trung tâm cộng đồng mở các lớp làm gốm cho mọi trình độ.</div>

 <ol>

 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trước danh từ "classes" cần danh từ bổ nghĩa. potter (thợ gốm) → pottery (nghề gốm). "pottery classes" = lớp làm gốm.</span></li></ol>`,"Chia dạng từ: potter");
txt(30,"The south of France is _____ for its perfume industry and cuisine. <b>(fame)</b>",
 ["famous"],
 `<div class="vnt">💬 Dịch: Miền nam nước Pháp nổi tiếng với ngành nước hoa và ẩm thực.</div>
 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">famous</span></div>
 <ol>
 <li>Phân tích: <span class='p-word'>famous</span> <span class='wt'>adj</span> = <span class='p-mean'>nổi tiếng</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau "to be" cần TÍNH TỪ. fame (n) → famous (adj). "be famous for" = nổi tiếng vì.</span></li></ol>`,"Chia dạng từ: fame");
txt(31,"They hope the new bus route will _____ the travel time for commuters. <b>(short)</b>",
 ["shorten"],
 `<div class="vnt">💬 Dịch: Họ hy vọng tuyến xe buýt mới sẽ rút ngắn thời gian di chuyển cho người đi làm.</div>

 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau "will" cần ĐỘNG TỪ. short (adj) → shorten (v) = làm cho ngắn hơn.</span></li></ol>`,"Chia dạng từ: short");

mcq(44,"Sắp xếp hội thoại: (a) Tim: That's a great idea! We could also put up signs to remind people not to litter. (b) John: Let's do it! I'll ask everyone in our group chat later. (c) Tim: Hey John, I've been thinking about ways to make our neighbourhood cleaner. (d) John: Hmm... Maybe we can organise a weekend cleanup with some of our friends.",
 ["c – a – d – b","d – a – b – c","a – d – b – c","c – d – a – b"],3,
 `<div class="vnt">💬 Dịch: Sắp xếp hội thoại về việc làm sạch khu phố cho hợp lý.</div>
 <ol><li>Trình tự hợp lý:
 <div class="grid2">
 <div><span class='hl-green'>(c)</span> Tim mở đầu: nghĩ về cách làm khu phố sạch hơn.</div>
 <div><span class='hl-green'>(d)</span> John gợi ý: tổ chức dọn dẹp cuối tuần.</div>
 <div><span class='hl-green'>(a)</span> Tim đồng tình + bổ sung: treo biển nhắc không xả rác.</div>
 <div><span class='hl-green'>(b)</span> John chốt: làm thôi, sẽ nhắn nhóm chat.</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Thứ tự đúng là c → d → a → b (mở đầu → đề xuất → hưởng ứng → chốt).</span></li></ol>`);
mcq(45,"Sắp xếp đoạn văn: (a) This helps ensure the skills and techniques are passed down to future generations. (b) Communities can also hold events like exhibits and festivals to display the crafts. (c) There are several ways to preserve and promote our traditional crafts. (d) To start with, communities can teach these crafts to kids and adults through classes and workshops. (e) Lastly, giving artisans a place to sell their work can motivate them to keep doing it.",
 ["c – d – b – a – e","c – d – a – b – e","d – a – b – e – c","d – c – b – a – e"],1,
 `<div class="vnt">💬 Dịch: Sắp xếp đoạn văn về cách gìn giữ & quảng bá làng nghề truyền thống.</div>
 <ol><li>Trình tự hợp lý:
 <div class="grid2">
 <div><span class='hl-green'>(c)</span> Câu chủ đề: có nhiều cách bảo tồn nghề truyền thống.</div>
 <div><span class='hl-green'>(d)</span> To start with: dạy nghề qua lớp học.</div>
 <div><span class='hl-green'>(a)</span> This helps: giúp truyền nghề cho thế hệ sau.</div>
 <div><span class='hl-green'>(b)</span> also: tổ chức triển lãm, lễ hội.</div>
 <div><span class='hl-green'>(e)</span> Lastly: tạo nơi bán hàng cho nghệ nhân.</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dựa vào từ nối chỉ trình tự: câu chủ đề (c) → To start with (d) → This helps (a) → also (b) → Lastly (e).</span></li></ol>`);

sec("C. WRITING · II. Chọn câu ĐỒNG NGHĨA với câu gốc");
mcq(46,"Could you tell me the phone number of our local garbage collector?",
 ["Would you like to tell me the phone number of our local garbage collector?","Do you mind telling me the phone number of our local garbage collector?","Let's tell me the phone number of our local garbage collector.","Should I tell you the phone number of our local garbage collector?"],1,
 `<div class="vnt">💬 Dịch: Bạn cho mình xin số điện thoại của người thu gom rác ở khu mình được không?</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>Would you like to tell me...?</span> = <span class='p-mean'>Bạn có muốn... (sai nghĩa)</span></div>
 <div><span class='hl-green'>Do you mind telling me...?</span> = <span class='p-mean'>Bạn có phiền cho mình...? (đúng)</span></div>
 <div><span class='p-word'>Let's tell me...</span> = <span class='p-mean'>sai ngữ pháp</span></div>
 <div><span class='p-word'>Should I tell you...?</span> = <span class='p-mean'>đổi người (sai)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Could you tell me...?" (lời đề nghị lịch sự) = "Do you mind telling me...?" (mind + V-ing).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"Would you like" = có muốn (nghĩa khác); "Let's tell me" sai; "Should I tell you" đảo người.</span></li></ol>`);
mcq(47,"“Who should I ask for advice about my future career?”",
 ["I wondered if you should ask for advice about your future career.","I wondered should I ask for advice about my future career.","I don't know who to ask for advice about my future career.","I don't know who should you ask for advice about your future career."],2,
 `<div class="vnt">💬 Dịch: “Mình nên hỏi ai để xin lời khuyên về nghề nghiệp tương lai?”</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>I wondered if you should ask...</span> = <span class='p-mean'>đổi nghĩa (you)</span></div>
 <div><span class='p-word'>I wondered should I ask...</span> = <span class='p-mean'>sai: câu gián tiếp đảo ngữ</span></div>
 <div><span class='hl-green'>I don't know who to ask...</span> = <span class='p-mean'>mình không biết nên hỏi ai</span></div>
 <div><span class='p-word'>I don't know who should you ask...</span> = <span class='p-mean'>sai: đảo ngữ + đổi người</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "who + TO + V" trong câu gián tiếp: I don't know who to ask (không biết nên hỏi ai).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Câu gián tiếp KHÔNG đảo ngữ (should I/should you); các câu kia đổi người sai.</span></li></ol>`);
mcq(48,"They discussed for hours, but they didn't find a suitable solution.",
 ["They discussed for hours; however, they didn't find a suitable solution.","They didn't find a suitable solution because they discussed for hours.","Although they didn't find a suitable solution, they discussed for hours.","They discussed for hours; therefore, they didn't find a suitable solution."],0,
 `<div class="vnt">💬 Dịch: Họ đã bàn bạc hàng giờ, nhưng không tìm được giải pháp phù hợp.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>...; however,...</span> = <span class='p-mean'>tuy nhiên (tương phản, đúng)</span></div>
 <div><span class='p-word'>...because...</span> = <span class='p-mean'>sai logic nhân–quả</span></div>
 <div><span class='p-word'>Although..., they discussed...</span> = <span class='p-mean'>đảo sai ý</span></div>
 <div><span class='p-word'>...therefore...</span> = <span class='p-mean'>sai: chỉ kết quả</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"but" (tương phản) = "however". Dùng dấu ";" trước "however,".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>because/therefore chỉ nhân–quả; "Although..." đảo sai vế ý nghĩa.</span></li></ol>`);
mcq(49,"While some volunteers were picking up trash, they saw a puppy.",
 ["Some volunteers were picking up trash, then they saw a puppy.","While some volunteers saw a puppy, they were picking up trash.","As some volunteers saw a puppy, they were picking up trash.","Some volunteers were picking up trash when they saw a puppy."],3,
 `<div class="vnt">💬 Dịch: Trong khi một số tình nguyện viên đang nhặt rác, họ nhìn thấy một chú cún con.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>...then they saw...</span> = <span class='p-mean'>mất nghĩa "trong khi"</span></div>
 <div><span class='p-word'>While some volunteers saw a puppy, they were picking up...</span> = <span class='p-mean'>đảo sai hành động</span></div>
 <div><span class='p-word'>As some volunteers saw a puppy...</span> = <span class='p-mean'>đảo sai hành động</span></div>
 <div><span class='hl-green'>...were picking up trash when they saw a puppy.</span> = <span class='p-mean'>đúng nghĩa</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hành động ĐANG diễn ra (were picking up) bị cắt ngang bởi hành động ngắn (saw): S + was/were V-ing + WHEN + S + V(quá khứ).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu kia đảo ngược hành động (đang nhặt rác ↔ nhìn thấy cún) làm sai nghĩa gốc.</span></li></ol>`);

  TOTAL++;
  const card=document.createElement('div');card.className='card';card.id='c'+it.num;
  card.innerHTML=`<div><span class="qnum">Câu ${it.num}</span><span class="qtext">${render(it)}</span></div>`;
  if(it.type==='mcq'){
    const wrap=document.createElement('div');wrap.className='opts';
    const arr=it.opts.map((t,i)=>({t,correct:i===it.correctIdx}));shuffle(arr);
    arr.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>pickMcq(it,card,wrap,b,o.correct);wrap.appendChild(b);});
    card.appendChild(wrap);
  }else if(it.type==='txt'){
    if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='('+it.hint+')';card.appendChild(h);}
    const box=document.createElement('div');box.className='tin';
    const inp=document.createElement('input');inp.placeholder='Gõ đáp án của em...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    const act=()=>checkTxt(it,card,inp,btn);
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    box.appendChild(inp);box.appendChild(btn);card.appendChild(box);
  }else if(it.type==='cor'){
    const letters=document.createElement('div');letters.className='letters';
    const L=['A','B','C','D'];let selIdx=-1;
    const inBox=document.createElement('div');inBox.className='tin';inBox.style.display='none';
    const inp=document.createElement('input');inp.placeholder='Gõ chữ ĐÚNG để sửa...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    inBox.appendChild(inp);inBox.appendChild(btn);
    const lbtns=[];
    L.forEach((L_,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=L_;
      b.onclick=()=>{if(card.dataset.done)return;selIdx=i;lbtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        inBox.style.display='flex';inp.focus();};
      lbtns.push(b);letters.appendChild(b);});
    const act=()=>{if(selIdx<0){inp.placeholder='Hãy chọn chữ cái A–D trước!';return;}checkCor(it,card,lbtns,selIdx,inp,btn);};
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    card.appendChild(letters);card.appendChild(inBox);
  }
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=`<div class="expin">${it.exp}</div>`;
  card.appendChild(exp);quiz.appendChild(card);
});
function render(it){
  if(it.type==='cor'){const L=['A','B','C','D'];let s=it.q;
    it.parts.forEach((p,i)=>{s=s.replace('{'+p+'}',`<span class="mark">${p}<sup>${L[i]}</sup></span>`);});return s;}
  return it.q;
}
function openExp(card){card.querySelector('.exp').classList.add('open');}
function lock(card){card.dataset.done='1';answered++;updateProg();}
function pickMcq(it,card,wrap,btn,correct){
  if(card.dataset.done)return;lock(card);
  [...wrap.children].forEach(b=>{b.disabled=true;if(b.innerHTML===it.opts[it.correctIdx])b.classList.add('correct');});
  if(correct){correctCount++;btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong','shake');buzz();}
  openExp(card);
}
function checkTxt(it,card,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;
  const ok=matchWriting(inp.value,it.ans);
  if(ok){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function checkCor(it,card,lbtns,selIdx,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;lbtns.forEach(b=>b.disabled=true);
  const letterOk=selIdx===it.cIdx, textOk=matchWriting(inp.value,it.corr);
  lbtns[it.cIdx].classList.add('correct');
  if(selIdx!==it.cIdx)lbtns[selIdx].classList.add('wrong');
  if(letterOk&&textOk){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function openName(){document.getElementById('nameOv').classList.add('show');document.getElementById('nameIn').focus();}
function showResult(){
  const n=document.getElementById('nameIn').value.trim();
  const err=document.getElementById('nameErr'),inp=document.getElementById('nameIn');
  if(!n){inp.classList.add('err');err.textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('nameOv').classList.remove('show');
  const pct=correctCount/TOTAL, ten=(correctCount/TOTAL*10).toFixed(2);
  let greet,meme;
  if(pct===1){greet='🌟 THIÊN TÀI! '+n+' xuất sắc tuyệt đối!';meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+n+' làm rất tốt, cố thêm chút nữa nhé!';meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN '+n+'! Ôn lại phần giải thích rồi làm lại nha!';meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent='✅ '+correctCount+' / '+TOTAL+' câu đúng';
  document.getElementById('rTen').textContent='📊 Điểm quy đổi: '+ten+' / 10';
  const img=document.getElementById('rMeme'),fall=document.getElementById('rFall');
  img.style.display='block';fall.style.display='none';img.src=meme;
  img.onerror=()=>{img.style.display='none';fall.style.display='block';
    fall.textContent=pct===1?'🎉🏆🎉':(pct>=0.6?'😄👍':'😭💧');};
  document.getElementById('resOv').classList.add('show');
  if(pct>=0.6){confetti();setTimeout(confetti,400);}
}
updateProg();
</script>
