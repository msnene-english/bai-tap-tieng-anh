<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 · Local Community — TEST 2</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#16a34a; --leaf2:#0d8a3e; --sun:#f7c948; --sky:#38bdf8; --terra:#c2410c;
  --green:#00c853; --wrong:#ef4444; --blue:#2472e8; --purple:#7c3aed; --grammar:#e11d48; --ink:#243426;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Baloo 2',sans-serif; color:var(--ink); min-height:100vh;
  background:linear-gradient(-45deg,#a7e8bd,#38bdf8,#f7c948,#16a34a,#86efac);
  background-size:400% 400%; animation:bgmove 20s ease infinite; overflow-x:hidden;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaties span{position:absolute;font-size:2.2rem;opacity:.5;animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 80px}
.head{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:#fffdf3;border:2px solid var(--leaf2);color:var(--leaf2);font-weight:800;font-size:.8rem;
  padding:5px 14px;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.title{margin-top:10px;font-family:'Nunito';font-weight:900;font-size:1.9rem;color:#fff;text-shadow:0 3px 10px rgba(20,60,30,.35)}
.sub{display:inline-block;margin-top:4px;background:#fffdf3;border:2px solid var(--leaf2);border-radius:12px;padding:3px 12px;font-weight:800;color:var(--leaf2)}
.progbar{height:14px;background:#fffdf3;border:2px solid var(--leaf2);border-radius:20px;margin:16px 0;overflow:hidden}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun));transition:width .4s;border-radius:20px}
.sec{margin:26px 0 12px;background:var(--leaf2);color:#fff;border-radius:14px;padding:10px 16px;font-family:'Nunito';font-weight:900;font-size:1.05rem;box-shadow:0 6px 16px rgba(20,60,30,.22)}
.card{background:#fffdf3;border:2px solid #cfe8d6;border-radius:18px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 8px 20px rgba(20,60,30,.16)}
.qnum{display:inline-block;background:var(--leaf);color:#fff;font-family:'Nunito';font-weight:900;border-radius:11px;padding:2px 10px;font-size:.85rem;margin-right:8px}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.5;display:inline}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px}
.hint{font-size:.85rem;color:#5a7a5f;font-weight:800;margin-top:8px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid #bfe3c9;border-radius:15px;padding:13px 12px;font-family:'Baloo 2';font-size:1.08rem;font-weight:700;color:#1f4d2e;cursor:pointer;box-shadow:0 5px 0 #cfe8d6;transition:transform .12s;text-align:center}
.opt:nth-child(2n){background:#fef7e3;border-color:#f0dca0;box-shadow:0 5px 0 #f0dca0;color:#7a5a12}
.opt:hover:not(:disabled){transform:scale(1.04)}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green)!important;border-color:#0a9c52!important;color:#fff!important;box-shadow:0 5px 0 #0a9c52!important}
.opt.wrong{background:var(--wrong)!important;border-color:#b91c1c!important;color:#fff!important;box-shadow:0 5px 0 #b91c1c!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.tin{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tin input{flex:1;min-width:180px;font-family:'Baloo 2';font-size:1.05rem;font-weight:700;padding:11px 14px;border-radius:12px;border:2px solid #bfe3c9;background:#fff;color:var(--ink)}
.tin input:focus{outline:none;border-color:var(--leaf)}
.tin input.ok{border-color:var(--green);background:#e7fff1}
.tin input.no{border-color:var(--wrong);background:#ffecee}
.btnc{background:var(--terra);color:#fff;border:none;border-radius:12px;padding:11px 20px;font-family:'Nunito';font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 5px 0 #8a2c08;transition:transform .12s}
.btnc:hover:not(:disabled){transform:scale(1.05)} .btnc:disabled{opacity:.55;cursor:default}
.letters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lbtn{width:48px;height:48px;border-radius:13px;border:2px solid #cfe8d6;font-family:'Nunito';font-weight:900;font-size:1.15rem;cursor:pointer;background:#fef7e3;color:var(--terra);box-shadow:0 4px 0 #f0dca0;transition:transform .12s}
.lbtn:hover:not(:disabled){transform:scale(1.07)}
.lbtn.sel{background:var(--sun);color:#7a5a12}
.lbtn.correct{background:var(--green);color:#fff;border-color:#0a9c52;box-shadow:0 4px 0 #0a9c52}
.lbtn.wrong{background:var(--wrong);color:#fff;border-color:#b91c1c;box-shadow:0 4px 0 #b91c1c}
.lbtn:disabled{cursor:default}
.mark{background:#fff3cf;border-radius:6px;padding:0 4px;font-weight:800}
.mark sup{color:var(--terra);font-weight:900;font-size:.7rem}
.exp{margin-top:14px;max-height:0;overflow:hidden;transition:max-height .5s ease;font-size:1rem}
.exp.open{max-height:1700px}
.expin{background:#fbfff8;border:2px dashed #a7d3b3;border-radius:12px;padding:14px}
.exp ol{margin:6px 0 0 20px} .exp li{margin:8px 0;line-height:1.55}
.vnt{background:#fff2e0;border-left:5px solid var(--terra);border-radius:10px;padding:8px 12px;font-weight:800;color:#7a3e00;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0}
.grid2>div{line-height:1.5}
.p-word{color:var(--blue);font-weight:800}
.hl-green{color:#088a3c;font-weight:900}
.hl-red{color:var(--wrong);font-weight:900}
.wt{background:#ece3ff;color:#6b3fb0;border-radius:6px;padding:0 6px;font-size:.78rem;font-weight:800}
.p-phonetic{color:var(--purple);background:#f0e9ff;border-radius:6px;padding:0 6px;font-weight:700}
.p-mean{color:var(--terra);font-weight:800}
.p-grammar{border-bottom:2.5px solid var(--grammar);color:#7a1030;font-weight:800}
.keyline{background:#e7fff1;border:2px solid #a7e0bd;border-radius:10px;padding:8px 12px;font-weight:800;color:#066b34;margin-bottom:8px}
.submit{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,var(--leaf),var(--sky));color:#fff;border:none;border-radius:18px;padding:18px;font-family:'Nunito';font-weight:900;font-size:1.25rem;cursor:pointer;box-shadow:0 8px 0 #0a6b30}
.submit:hover{transform:scale(1.02)}
.overlay{position:fixed;inset:0;background:rgba(20,50,30,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fffdf3;border:2px solid var(--leaf2);border-radius:22px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Nunito';font-weight:900;font-size:1.4rem;color:var(--leaf2);margin-bottom:12px}
.modal input{width:100%;padding:14px;border-radius:12px;border:2px solid #bfe3c9;font-size:1.05rem;font-family:'Baloo 2';font-weight:700;margin-bottom:6px}
.modal input.err{border-color:var(--wrong);background:#ffecee}
.errmsg{color:var(--wrong);font-weight:800;font-size:.9rem;min-height:20px;margin-bottom:8px}
.modal button{background:var(--terra);color:#fff;border:none;border-radius:12px;padding:12px 26px;font-family:'Nunito';font-weight:900;font-size:1.1rem;cursor:pointer;box-shadow:0 5px 0 #8a2c08}
.rgreet{font-family:'Nunito';font-weight:900;font-size:1.4rem;color:var(--leaf2);line-height:1.35}
.rscore{font-family:'Nunito';font-weight:900;font-size:2.4rem;color:var(--ink);margin:8px 0}
.rten{font-size:1.5rem;font-weight:900;color:var(--terra);margin-bottom:12px}
.rmeme{width:100%;max-width:280px;border-radius:14px;margin:0 auto 14px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2);min-height:120px;object-fit:cover}
.memefall{font-size:5rem}
@media(max-width:560px){.opts,.grid2{grid-template-columns:1fr}.title{font-size:1.5rem}}
</style>
</head>
<body>
<div class="floaties" id="floaties"></div>
<div class="wrap">
  <div class="head">
    <div class="badge">👩‍🏫 Giáo viên tạo: Ms. Chí Nên</div>
    <div class="title">🌿 Unit 1 · Local Community</div>
    <div><span class="sub">TEST 2 — Phần A (I–VII) &amp; C (I–III)</span></div>
    <div class="progbar"><div class="progfill" id="prog"></div></div>
  </div>
  <div id="quiz"></div>
  <button class="submit" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="overlay" id="nameOv">
  <div class="modal">
    <h2>✍️ Nhập tên của em nhé!</h2>
    <input id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
    <div class="errmsg" id="nameErr"></div>
    <button onclick="showResult()">Xem kết quả 🚀</button>
  </div>
</div>
<div class="overlay" id="resOv">
  <div class="modal">
    <div class="rgreet" id="rGreet"></div>
    <div class="rscore" id="rScore"></div>
    <div class="rten" id="rTen"></div>
    <img class="rmeme" id="rMeme" alt="result">
    <div class="memefall" id="rFall" style="display:none"></div>
    <button onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
(function(){
  const ico=['🌿','🏺','🎨','🧺','🍃','🏘️','♻️','🤝','🪴','🛖','🌻','🌳'];
  const f=document.getElementById('floaties');
  for(let i=0;i<16;i++){const s=document.createElement('span');
    s.textContent=ico[i%ico.length];s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(14+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(1.6+Math.random()*1.8)+'rem';f.appendChild(s);}
})();
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=i?1318:988;o.connect(g);g.connect(c.destination);
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);
  g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.4);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function confetti(){const cols=['#16a34a','#f7c948','#38bdf8','#ef4444','#00c853','#c2410c'];
  for(let i=0;i<70;i++){const d=document.createElement('div');
    d.style.cssText='position:fixed;z-index:99;width:10px;height:14px;top:-20px;pointer-events:none;border-radius:2px;';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1500+Math.random()*1500,x=(Math.random()-.5)*300;
    d.animate([{transform:d.style.transform,opacity:1},
      {transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:0}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[.,?!;:'"’\-]/g,' ').replace(/\s+/g,' ').trim();}
function matchWriting(input,answers){const ni=norm(input);if(!ni)return false;
  for(const a of answers){const na=norm(a);if(ni===na)return true;
    if(na.includes(ni)&&ni.length>=na.length*0.5)return true;if(ni.includes(na))return true;}return false;}
let TOTAL=0,correctCount=0,answered=0;
function updateProg(){document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';}

/* ============================================================
   DATA — Unit 1 · TEST 2 · A(I–VII) + C(I–III)
   ============================================================ */
const Q=[];
function sec(t){Q.push({sec:t});}
function mcq(num,q,opts,correctIdx,exp){Q.push({type:'mcq',num,q,opts,correctIdx,exp});}
function txt(num,q,ans,exp,hint){Q.push({type:'txt',num,q,ans,exp,hint});}
function cor(num,q,parts,cIdx,corr,exp){Q.push({type:'cor',num,q,parts,cIdx,corr,exp});}

/* ---------- A. I. Pronunciation ---------- */
sec("A. LANGUAGE FOCUS · I. Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại");
mcq(1,"Chọn từ có phần gạch chân được phát âm khác, gạch chân chữ g:",
 ["<u>g</u>eneration","villa<u>g</u>e","<u>g</u>arbage","ori<u>g</u>inal"],2,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "g" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>generation</span> <span class='p-phonetic'>/dʒ/</span> = <span class='p-mean'>thế hệ</span></div>
 <div><span class='p-word'>village</span> <span class='p-phonetic'>/dʒ/</span> = <span class='p-mean'>ngôi làng</span></div>
 <div><span class='hl-green'>garbage</span> <span class='p-phonetic'>/ɡ/</span> = <span class='p-mean'>rác thải</span></div>
 <div><span class='p-word'>original</span> <span class='p-phonetic'>/dʒ/</span> = <span class='p-mean'>nguyên bản</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"garbage" có "g" (đầu) đọc là /ɡ/. Ba từ kia "g" đọc /dʒ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>generation, village, original đều /dʒ/ nên giống nhau.</span></li></ol>`);
mcq(2,"Chọn từ có phần gạch chân được phát âm khác:",
 ["f<u>u</u>nction","comm<u>u</u>nity","s<u>u</u>burb","prod<u>u</u>ct"],1,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "u" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>function</span> <span class='p-phonetic'>/ˈfʌŋkʃn/</span> = <span class='p-mean'>chức năng</span> → /ʌ/</div>
 <div><span class='hl-green'>community</span> <span class='p-phonetic'>/kəˈmjuːnəti/</span> = <span class='p-mean'>cộng đồng</span> → /juː/</div>
 <div><span class='p-word'>suburb</span> <span class='p-phonetic'>/ˈsʌbɜːb/</span> = <span class='p-mean'>ngoại ô</span> → /ʌ/</div>
 <div><span class='p-word'>product</span> <span class='p-phonetic'>/ˈprɒdʌkt/</span> = <span class='p-mean'>sản phẩm</span> → /ʌ/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"community" có "u" đọc dài /juː/. Ba từ kia "u" đọc ngắn /ʌ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>function, suburb, product đều /ʌ/ nên giống nhau.</span></li></ol>`);
mcq(3,"Chọn từ có phần gạch chân được phát âm khác:",
 ["c<u>a</u>rt","m<u>a</u>chine","p<u>a</u>rticular","m<u>a</u>terial"],0,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "a" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>cart</span> <span class='p-phonetic'>/kɑːt/</span> = <span class='p-mean'>xe đẩy</span> → /ɑː/</div>
 <div><span class='p-word'>machine</span> <span class='p-phonetic'>/məˈʃiːn/</span> = <span class='p-mean'>máy móc</span> → /ə/</div>
 <div><span class='p-word'>particular</span> <span class='p-phonetic'>/pəˈtɪkjələ/</span> = <span class='p-mean'>cụ thể</span> → /ə/</div>
 <div><span class='p-word'>material</span> <span class='p-phonetic'>/məˈtɪəriəl/</span> = <span class='p-mean'>vật liệu</span> → /ə/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"cart" có "a" đọc /ɑː/. Ba từ kia "a" là âm mờ /ə/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>machine, particular, material đều có "a" đọc /ə/ nên giống nhau.</span></li></ol>`);

/* ---------- A. II. Stress ---------- */
sec("A. LANGUAGE FOCUS · II. Chọn từ có TRỌNG ÂM khác các từ còn lại");
mcq(4,"Chọn từ có trọng âm khác:",
 ["consumer","technique","police","artisan"],3,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>con-SU-mer</span> <span class='wt'>n</span> = <span class='p-mean'>người tiêu dùng</span> → âm 2</div>
 <div><span class='p-word'>tech-NIQUE</span> <span class='wt'>n</span> = <span class='p-mean'>kỹ thuật</span> → âm 2</div>
 <div><span class='p-word'>po-LICE</span> <span class='wt'>n</span> = <span class='p-mean'>cảnh sát</span> → âm 2</div>
 <div><span class='hl-green'>AR-ti-san</span> <span class='wt'>n</span> = <span class='p-mean'>nghệ nhân</span> → âm 1</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"artisan" nhấn âm tiết ĐẦU. Ba từ kia nhấn âm tiết THỨ HAI.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>consumer, technique, police đều nhấn âm tiết 2.</span></li></ol>`);
mcq(5,"Chọn từ có trọng âm khác:",
 ["origin","workshop","deliver","handicraft"],2,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>O-ri-gin</span> <span class='wt'>n</span> = <span class='p-mean'>nguồn gốc</span> → âm 1</div>
 <div><span class='p-word'>WORK-shop</span> <span class='wt'>n</span> = <span class='p-mean'>xưởng thủ công</span> → âm 1</div>
 <div><span class='hl-green'>de-LI-ver</span> <span class='wt'>v</span> = <span class='p-mean'>giao hàng</span> → âm 2</div>
 <div><span class='p-word'>HAN-di-craft</span> <span class='wt'>n</span> = <span class='p-mean'>đồ thủ công</span> → âm 1</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"deliver" nhấn âm tiết THỨ HAI. Ba từ kia nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>origin, workshop, handicraft đều nhấn âm tiết 1.</span></li></ol>`);

/* ---------- A. III. ---------- */
sec("A. LANGUAGE FOCUS · III. Chọn từ/cụm từ phù hợp nhất");
mcq(6,"The local animal shelter always works hard to take care _____ abandoned pets.",
 ["after","with","of","for"],2,
 `<div class="vnt">💬 Dịch: Trạm cứu hộ động vật địa phương luôn nỗ lực chăm sóc những thú cưng bị bỏ rơi.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>after</span> <span class='wt'>prep</span> = <span class='p-mean'>sau</span></div>
 <div><span class='p-word'>with</span> <span class='wt'>prep</span> = <span class='p-mean'>với</span></div>
 <div><span class='hl-green'>of</span> <span class='wt'>prep</span> = <span class='p-mean'>(chăm sóc) cho</span></div>
 <div><span class='p-word'>for</span> <span class='wt'>prep</span> = <span class='p-mean'>cho</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định: take care OF sb/sth = chăm sóc ai/cái gì.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"look after" mới đi với after; take care after/with/for đều sai giới từ.</span></li></ol>`);
mcq(7,"We love buying scented candles at this local shop as they have such a lovely _____.",
 ["function","technique","process","fragrance"],3,
 `<div class="vnt">💬 Dịch: Chúng tôi thích mua nến thơm ở cửa hàng địa phương này vì chúng có hương thơm rất dễ chịu.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>function</span> <span class='wt'>n</span> = <span class='p-mean'>chức năng</span></div>
 <div><span class='p-word'>technique</span> <span class='wt'>n</span> = <span class='p-mean'>kỹ thuật</span></div>
 <div><span class='p-word'>process</span> <span class='wt'>n</span> = <span class='p-mean'>quy trình</span></div>
 <div><span class='hl-green'>fragrance</span> <span class='wt'>n</span> = <span class='p-mean'>hương thơm</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"scented candles" (nến thơm) → có "fragrance" (hương thơm) dễ chịu.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>function/technique/process không mô tả mùi hương của nến.</span></li></ol>`);
mcq(8,"Let's go eat something. We have _____ time before the concert starts.",
 ["a little","a few","little","few"],0,
 `<div class="vnt">💬 Dịch: Đi ăn gì đó thôi. Chúng ta còn một chút thời gian trước khi buổi hòa nhạc bắt đầu.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>a little</span> = <span class='p-mean'>một chút (không đếm được, tích cực)</span></div>
 <div><span class='p-word'>a few</span> = <span class='p-mean'>một vài (đếm được)</span></div>
 <div><span class='p-word'>little</span> = <span class='p-mean'>rất ít (nghĩa phủ định)</span></div>
 <div><span class='p-word'>few</span> = <span class='p-mean'>rất ít (đếm được, phủ định)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"time" là danh từ KHÔNG đếm được; ý tích cực "còn một chút" → "a little time".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>a few/few dùng cho đếm được; "little" (không "a") mang nghĩa phủ định "hầu như không".</span></li></ol>`);
mcq(9,"Pad Thai, a delicious stir-fried noodle dish, is one of Bangkok's _____.",
 ["facilities","specialities","communities","souvenirs"],1,
 `<div class="vnt">💬 Dịch: Pad Thai, một món mì xào ngon, là một trong những đặc sản của Bangkok.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>facilities</span> <span class='wt'>n</span> = <span class='p-mean'>cơ sở vật chất</span></div>
 <div><span class='hl-green'>specialities</span> <span class='wt'>n</span> = <span class='p-mean'>đặc sản</span></div>
 <div><span class='p-word'>communities</span> <span class='wt'>n</span> = <span class='p-mean'>cộng đồng</span></div>
 <div><span class='p-word'>souvenirs</span> <span class='wt'>n</span> = <span class='p-mean'>đồ lưu niệm</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Pad Thai là một MÓN ĂN nổi tiếng → "speciality" (đặc sản).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>facilities/communities/souvenirs không phải là món ăn.</span></li></ol>`);
mcq(10,"This small town offers so many attractions, so it's really hard to decide _____ to do.",
 ["what","how","when","who"],0,
 `<div class="vnt">💬 Dịch: Thị trấn nhỏ này có rất nhiều điểm tham quan, nên thật khó quyết định nên làm gì.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>what</span> <span class='wt'>wh-</span> = <span class='p-mean'>cái gì</span></div>
 <div><span class='p-word'>how</span> <span class='wt'>wh-</span> = <span class='p-mean'>như thế nào</span></div>
 <div><span class='p-word'>when</span> <span class='wt'>wh-</span> = <span class='p-mean'>khi nào</span></div>
 <div><span class='p-word'>who</span> <span class='wt'>wh-</span> = <span class='p-mean'>ai</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"what to do" = làm GÌ — quyết định về hoạt động (do sth).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>how/when/who + to do không hợp nghĩa "quyết định làm gì".</span></li></ol>`);
mcq(11,"They are discussing where _____ the charity event the following month.",
 ["should they hold","to be held","they should hold","they are holding"],2,
 `<div class="vnt">💬 Dịch: Họ đang bàn về việc nên tổ chức sự kiện từ thiện ở đâu vào tháng sau.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>should they hold</span> = <span class='p-mean'>sai: câu gián tiếp không đảo ngữ</span></div>
 <div><span class='p-word'>to be held</span> = <span class='p-mean'>bị động (sai với "where")</span></div>
 <div><span class='hl-green'>they should hold</span> = <span class='p-mean'>họ nên tổ chức</span></div>
 <div><span class='p-word'>they are holding</span> = <span class='p-mean'>sai thì/nghĩa</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu hỏi gián tiếp giữ trật tự "S + V": where + they should hold (không đảo ngữ).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"should they hold" là đảo ngữ (sai với câu gián tiếp); "to be held" & "they are holding" không hợp.</span></li></ol>`);
mcq(12,"Each of us needs to _____ our natural resources by recycling and reducing waste.",
 ["shorten","remind","preserve","consume"],2,
 `<div class="vnt">💬 Dịch: Mỗi chúng ta cần bảo tồn tài nguyên thiên nhiên bằng cách tái chế và giảm rác thải.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>shorten</span> <span class='wt'>v</span> = <span class='p-mean'>rút ngắn</span></div>
 <div><span class='p-word'>remind</span> <span class='wt'>v</span> = <span class='p-mean'>nhắc nhở</span></div>
 <div><span class='hl-green'>preserve</span> <span class='wt'>v</span> = <span class='p-mean'>bảo tồn</span></div>
 <div><span class='p-word'>consume</span> <span class='wt'>v</span> = <span class='p-mean'>tiêu thụ</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"recycling and reducing waste" (tái chế, giảm rác) là cách "preserve" (bảo tồn) tài nguyên.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>consume (tiêu thụ) trái ý; shorten/remind sai nghĩa với tài nguyên.</span></li></ol>`);
mcq(13,"I think we should _____ more information about the history of this old town before visiting it.",
 ["look around","hand down","remind of","find out"],3,
 `<div class="vnt">💬 Dịch: Tôi nghĩ chúng ta nên tìm hiểu thêm thông tin về lịch sử thị trấn cổ này trước khi tham quan.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>look around</span> <span class='wt'>phr v</span> = <span class='p-mean'>nhìn quanh</span></div>
 <div><span class='p-word'>hand down</span> <span class='wt'>phr v</span> = <span class='p-mean'>truyền lại</span></div>
 <div><span class='p-word'>remind of</span> <span class='wt'>phr v</span> = <span class='p-mean'>gợi nhớ về</span></div>
 <div><span class='hl-green'>find out</span> <span class='wt'>phr v</span> = <span class='p-mean'>tìm hiểu, khám phá</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"find out information" = tìm hiểu thông tin — hợp với "before visiting".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>look around/hand down/remind of không đi với "more information" theo nghĩa tìm hiểu.</span></li></ol>`);
mcq(14,"The bakery here is known for having _____ cheesecake in the neighbourhood.",
 ["the more delicious","more delicious than","more delicious","the most delicious"],3,
 `<div class="vnt">💬 Dịch: Tiệm bánh ở đây nổi tiếng vì có bánh phô mai ngon nhất khu phố.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>the more delicious</span> = <span class='p-mean'>sai cấu trúc</span></div>
 <div><span class='p-word'>more delicious than</span> = <span class='p-mean'>so sánh hơn (thiếu vế than)</span></div>
 <div><span class='p-word'>more delicious</span> = <span class='p-mean'>so sánh hơn</span></div>
 <div><span class='hl-green'>the most delicious</span> = <span class='p-mean'>ngon nhất (so sánh nhất)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Phạm vi "in the neighbourhood" (trong khu phố) → SO SÁNH NHẤT: the most + adj dài.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>các dạng "more delicious" là so sánh hơn (cần "than"); "the more delicious" sai cấu trúc.</span></li></ol>`);
mcq(15,"Chase: “Kate, do you mind telling me more about the statue in the park?” – Kate: “_____”",
 ["Yes, I would. The town founder built it 100 years ago.","Not at all. It was built to honour the town's founder.","Yes, I can make the exact same statue.","No, I wouldn't. I don't like the statue at all."],1,
 `<div class="vnt">💬 Dịch: Chase: “Kate, cậu có phiền kể thêm cho tớ về bức tượng trong công viên không?” – Kate: “_____”</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>Yes, I would...</span> = <span class='p-mean'>Có, tớ phiền (= từ chối, mâu thuẫn vế sau)</span></div>
 <div><span class='hl-green'>Not at all. It was built to honour the town's founder.</span> = <span class='p-mean'>Không phiền chút nào + kể tiếp</span></div>
 <div><span class='p-word'>Yes, I can make the exact same statue.</span> = <span class='p-mean'>lạc đề</span></div>
 <div><span class='p-word'>No, I wouldn't. I don't like the statue.</span> = <span class='p-mean'>lạc đề/tiêu cực</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đáp "Do you mind...?" khi ĐỒNG Ý dùng "Not at all" (không phiền chút nào), rồi kể thông tin.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"Yes, I would" = tớ phiền (từ chối) nhưng lại kể tiếp → mâu thuẫn; các câu kia lạc đề.</span></li></ol>`);

/* ---------- A. IV. Sign / notice (SVG) ---------- */
sec("A. LANGUAGE FOCUS · IV. Nhìn biển báo/thông báo và chọn đáp án đúng");
mcq(16,"What does the sign say? (Biển báo nói gì?)<div style='text-align:center;margin:14px 0'><svg viewBox='0 0 220 212' width='190' style='max-width:88%'><rect x='6' y='6' width='208' height='152' rx='14' fill='#eef4ff' stroke='#243426' stroke-width='4'/><circle cx='110' cy='80' r='50' fill='#fff' stroke='#e11d1d' stroke-width='10'/><text x='110' y='104' font-family='Arial' font-weight='900' font-size='64' fill='#1d5fd6' text-anchor='middle'>P</text><line x1='74' y1='116' x2='146' y2='44' stroke='#e11d1d' stroke-width='10' stroke-linecap='round'/><rect x='22' y='164' width='176' height='42' rx='9' fill='#243426'/><text x='110' y='192' font-family='Arial' font-weight='800' font-size='19' fill='#fff' text-anchor='middle'>STAFF PARKING ONLY</text></svg></div>",
 ["Only employees or staff members are allowed to park here.","Everyone can park here except staff.","Parking is not allowed here under any circumstances.","The parking area is open to all people."],0,
 `<div class="vnt">💬 Dịch: Biển báo: "STAFF PARKING ONLY" (Chỉ dành cho nhân viên đỗ xe).</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>Only employees or staff members are allowed to park here.</span> = <span class='p-mean'>Chỉ nhân viên mới được đỗ xe ở đây.</span></div>
 <div><span class='p-word'>Everyone can park here except staff.</span> = <span class='p-mean'>Ai cũng đỗ được trừ nhân viên (ngược lại).</span></div>
 <div><span class='p-word'>Parking is not allowed here under any circumstances.</span> = <span class='p-mean'>Cấm đỗ trong mọi trường hợp (quá tuyệt đối).</span></div>
 <div><span class='p-word'>The parking area is open to all people.</span> = <span class='p-mean'>Bãi đỗ mở cho mọi người (sai).</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"STAFF PARKING ONLY" = bãi đỗ CHỈ dành cho nhân viên → chỉ nhân viên được đỗ.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các đáp án khác đảo ngược ý (trừ nhân viên / mở cho tất cả) hoặc quá tuyệt đối (cấm hoàn toàn).</span></li></ol>`);
mcq(17,"What does the notice tell you to do? (Thông báo yêu cầu bạn làm gì?)<div style='text-align:center;margin:14px 0'><svg viewBox='0 0 262 200' width='220' style='max-width:90%'><rect x='6' y='6' width='250' height='188' rx='18' fill='#e7f7ec' stroke='#0a7c34' stroke-width='4'/><text x='131' y='70' font-size='46' text-anchor='middle'>♻️</text><text x='131' y='110' font-family='Arial' font-weight='900' font-size='21' fill='#0a7c34' text-anchor='middle'>GO GREEN — Do your part</text><text x='131' y='140' font-family='Arial' font-weight='700' font-size='15' fill='#155e33' text-anchor='middle'>Recycle and help the environment.</text><text x='131' y='166' font-family='Arial' font-weight='700' font-size='14' fill='#155e33' text-anchor='middle'>Select the appropriate bin provided.</text></svg></div>",
 ["Provide appropriate rubbish bin to recycle.","Help the environment by going green.","Go green and support environmental groups.","Put your waste in the right recycling bins."],3,
 `<div class="vnt">💬 Dịch: Thông báo: "GO GREEN – Recycle... Select the appropriate bin provided" (Hãy sống xanh – Tái chế... Bỏ rác vào đúng thùng được cung cấp).</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>Provide appropriate rubbish bin to recycle.</span> = <span class='p-mean'>Cung cấp thùng rác (sai: người đọc không cung cấp thùng).</span></div>
 <div><span class='p-word'>Help the environment by going green.</span> = <span class='p-mean'>Bảo vệ môi trường (chung chung, chưa đúng hành động cụ thể).</span></div>
 <div><span class='p-word'>Go green and support environmental groups.</span> = <span class='p-mean'>Sống xanh và ủng hộ nhóm môi trường (không có trong biển).</span></div>
 <div><span class='hl-green'>Put your waste in the right recycling bins.</span> = <span class='p-mean'>Bỏ rác vào đúng thùng tái chế.</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Select the appropriate bin provided" = chọn/bỏ rác vào đúng thùng → "Put your waste in the right recycling bins".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Thông báo yêu cầu người đọc BỎ rác đúng thùng, không phải cung cấp thùng hay ủng hộ nhóm nào.</span></li></ol>`);

/* ---------- A. V. Error correction ---------- */
sec("A. LANGUAGE FOCUS · V. Tìm lỗi sai — Bấm chọn chữ cái (A–D) của phần SAI, rồi GÕ chữ đúng để sửa");
cor(18,"{When} we were young, we {often enjoyed} {to go} fishing and {flying} kites after school.",
 ["When","often enjoyed","to go","flying"],2,["going"],
 `<div class="vnt">💬 Dịch: Khi còn nhỏ, chúng tôi thường thích đi câu cá và thả diều sau giờ học.</div>
 <div class="keyline">🔑 SỬA: to go → <span class="hl-green">going</span> (often enjoyed going fishing)</div>
 <ol>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Sau "enjoy" luôn dùng V-ing, không dùng "to + V".</span></li>
 <li><span class="hl-green">✅ SỬA ĐÚNG:</span> <span class='p-grammar'>enjoy + V-ing → enjoyed going fishing (song song với "flying kites").</span></li></ol>`);
cor(19,"{Police officers} are {communal} helpers {who} ensure the neighbourhood's {safety}.",
 ["Police officers","communal","who","safety"],1,["community"],
 `<div class="vnt">💬 Dịch: Cảnh sát là những người trợ giúp CỘNG ĐỒNG, đảm bảo an toàn cho khu phố.</div>
 <div class="keyline">🔑 SỬA: communal → <span class="hl-green">community</span> (community helpers)</div>
 <ol>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"communal" (adj = chung/công cộng) không hợp; cụm chuẩn là "community helpers" (người giúp việc cộng đồng).</span></li>
 <li><span class="hl-green">✅ SỬA ĐÚNG:</span> <span class='p-grammar'>Dùng danh từ "community" làm bổ nghĩa: community helpers.</span></li></ol>`);

/* ---------- A. VI. Verb form ---------- */
sec("A. LANGUAGE FOCUS · VI. Chia dạng đúng của động từ trong ngoặc (GÕ đáp án)");
txt(20,"The other students _____ the classroom walls when we arrived. <b>(decorate)</b>",
 ["were decorating"],
 `<div class="vnt">💬 Dịch: Các bạn học sinh khác đang trang trí tường lớp học khi chúng tôi đến.</div>
 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">were decorating</span></div>
 <ol>
 <li>Phân tích: <span class='p-word'>were decorating</span> <span class='wt'>v (past cont.)</span> = <span class='p-mean'>đang trang trí</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hành động ĐANG diễn ra thì bị cắt ngang "when we arrived" → QUÁ KHỨ TIẾP DIỄN. "students" (số nhiều) → were + V-ing.</span></li></ol>`,"Chia động từ: decorate");
txt(21,"The local park _____ greener if the community plants more trees. <b>(look)</b>",
 ["will look"],
 `<div class="vnt">💬 Dịch: Công viên địa phương sẽ xanh hơn nếu cộng đồng trồng thêm nhiều cây.</div>

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const quiz=document.getElementById('quiz');
Q.forEach((it)=>{
  if(it.sec){const d=document.createElement('div');d.className='sec';d.textContent=it.sec;quiz.appendChild(d);return;}
  TOTAL++;
  const card=document.createElement('div');card.className='card';card.id='c'+it.num;
  card.innerHTML=`<div><span class="qnum">Câu ${it.num}</span><span class="qtext">${render(it)}</span></div>`;
  if(it.type==='mcq'){
    const wrap=document.createElement('div');wrap.className='opts';
    const arr=it.opts.map((t,i)=>({t,correct:i===it.correctIdx}));shuffle(arr);
    arr.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>pickMcq(it,card,wrap,b,o.correct);wrap.appendChild(b);});
    card.appendChild(wrap);
  }else if(it.type==='txt'){
    if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='('+it.hint+')';card.appendChild(h);}
    const box=document.createElement('div');box.className='tin';
    const inp=document.createElement('input');inp.placeholder='Gõ đáp án của em...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    const act=()=>checkTxt(it,card,inp,btn);
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    box.appendChild(inp);box.appendChild(btn);card.appendChild(box);
  }else if(it.type==='cor'){
    const letters=document.createElement('div');letters.className='letters';
    const L=['A','B','C','D'];let selIdx=-1;
    const inBox=document.createElement('div');inBox.className='tin';inBox.style.display='none';
    const inp=document.createElement('input');inp.placeholder='Gõ chữ ĐÚNG để sửa...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    inBox.appendChild(inp);inBox.appendChild(btn);
    const lbtns=[];
    L.forEach((L_,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=L_;
      b.onclick=()=>{if(card.dataset.done)return;selIdx=i;lbtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        inBox.style.display='flex';inp.focus();};
      lbtns.push(b);letters.appendChild(b);});
    const act=()=>{if(selIdx<0){inp.placeholder='Hãy chọn chữ cái A–D trước!';return;}checkCor(it,card,lbtns,selIdx,inp,btn);};
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    card.appendChild(letters);card.appendChild(inBox);
  }
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=`<div class="expin">${it.exp}</div>`;
  card.appendChild(exp);quiz.appendChild(card);
});
function render(it){
  if(it.type==='cor'){const L=['A','B','C','D'];let s=it.q;
    it.parts.forEach((p,i)=>{s=s.replace('{'+p+'}',`<span class="mark">${p}<sup>${L[i]}</sup></span>`);});return s;}
  return it.q;
}
function openExp(card){card.querySelector('.exp').classList.add('open');}
function lock(card){card.dataset.done='1';answered++;updateProg();}
function pickMcq(it,card,wrap,btn,correct){
  if(card.dataset.done)return;lock(card);
  [...wrap.children].forEach(b=>{b.disabled=true;if(b.innerHTML===it.opts[it.correctIdx])b.classList.add('correct');});
  if(correct){correctCount++;btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong','shake');buzz();}
  openExp(card);
}
function checkTxt(it,card,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;
  const ok=matchWriting(inp.value,it.ans);
  if(ok){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function checkCor(it,card,lbtns,selIdx,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;lbtns.forEach(b=>b.disabled=true);
  const letterOk=selIdx===it.cIdx, textOk=matchWriting(inp.value,it.corr);
  lbtns[it.cIdx].classList.add('correct');
  if(selIdx!==it.cIdx)lbtns[selIdx].classList.add('wrong');
  if(letterOk&&textOk){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function openName(){document.getElementById('nameOv').classList.add('show');document.getElementById('nameIn').focus();}
function showResult(){
  const n=document.getElementById('nameIn').value.trim();
  const err=document.getElementById('nameErr'),inp=document.getElementById('nameIn');
  if(!n){inp.classList.add('err');err.textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('nameOv').classList.remove('show');
  const pct=correctCount/TOTAL, ten=(correctCount/TOTAL*10).toFixed(2);
  let greet,meme;
  if(pct===1){greet='🌟 THIÊN TÀI! '+n+' xuất sắc tuyệt đối!';meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+n+' làm rất tốt, cố thêm chút nữa nhé!';meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN '+n+'! Ôn lại phần giải thích rồi làm lại nha!';meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent='✅ '+correctCount+' / '+TOTAL+' câu đúng';
  document.getElementById('rTen').textContent='📊 Điểm quy đổi: '+ten+' / 10';
  const img=document.getElementById('rMeme'),fall=document.getElementById('rFall');
  img.style.display='block';fall.style.display='none';img.src=meme;
  img.onerror=()=>{img.style.display='none';fall.style.display='block';
    fall.textContent=pct===1?'🎉🏆🎉':(pct>=0.6?'😄👍':'😭💧');};
  document.getElementById('resOv').classList.add('show');
  if(pct>=0.6){confetti();setTimeout(confetti,400);}
}
updateProg();
</script>
