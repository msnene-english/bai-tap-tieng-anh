<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 3 · Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#5b8def;--p4:#ff7eb3;--p5:#86e3d4;--green:#00D26A;--red:#FF4757;--ink:#334a6b;--glow:#ffd39b;--glow2:#ff7eb3}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;line-height:1.55;overflow-x:hidden;position:relative;
  background:linear-gradient(-45deg,#a1c4fd,#c3b8f5,#ffd3a5,#ff9eb5,#86e3d4);background-size:400% 400%;animation:bgmove 18s ease infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.2rem;opacity:.4;animation:floaty linear infinite;filter:drop-shadow(0 4px 6px rgba(60,80,120,.2))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0)}50%{transform:translateY(50vh) translateX(24px)}100%{transform:translateY(-15vh) translateX(-8px)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}
.topbar{text-align:center;background:rgba(255,255,255,.28);backdrop-filter:blur(12px);border:1.5px solid rgba(255,211,155,.7);border-radius:22px;padding:14px 16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(80,90,140,.2)}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(91,141,239,.65);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 2px 10px rgba(80,90,140,.35)}
.topbar p{font-size:.78rem;color:#fff;opacity:.97;margin-top:2px}
.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(90,110,160,.22);backdrop-filter:blur(10px);border-radius:30px;padding:5px;border:1.5px solid rgba(255,211,155,.5);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.45);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(80,90,140,.4)}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;font-weight:900;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 6px 14px rgba(255,126,179,.4)}
.sec h2{color:#fff;font-size:1.02rem;font-weight:800;text-shadow:0 1px 6px rgba(80,90,140,.4);flex:1}
.card{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:20px;padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(255,211,155,.5);box-shadow:0 12px 26px rgba(80,90,140,.18)}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#ffb877);color:#7a4a10;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}
.passage{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid var(--glow2);border-radius:12px;padding:10px 13px;margin:10px 0;font-weight:600;line-height:1.65;font-size:1.02rem;color:#6a4a1b}
.orderbox{margin:10px 0;display:flex;flex-direction:column;gap:9px}
.orderbox>div{background:rgba(91,141,239,.08);border:1.5px solid rgba(91,141,239,.2);border-radius:12px;padding:10px 13px;font-size:1.02rem;font-weight:600;line-height:1.55}
.orderbox b{color:var(--p1);font-size:1.08rem;margin-right:3px}
.signbox{display:flex;justify-content:center;margin:12px 0 4px}
.signbox svg{filter:drop-shadow(0 6px 12px rgba(80,90,140,.25))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:linear-gradient(135deg,#fff,#f0f6ff);border:2px solid rgba(91,141,239,.22);border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(91,141,239,.22),0 8px 14px rgba(80,90,140,.1);transition:transform .12s,box-shadow .12s;text-align:center;user-select:none}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(91,141,239,.28),0 0 18px rgba(255,211,155,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;border:2px solid rgba(91,141,239,.35);background:#fff;outline:none;flex:1;min-width:180px;color:var(--ink)}
.tin:focus{border-color:var(--glow2);box-shadow:0 0 0 4px rgba(255,126,179,.2)}
.tin.ok{border-color:var(--green);background:#eafff3}.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.05rem;font-weight:800;color:var(--p1)}
.btn-check{font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--glow2),var(--p1));padding:11px 18px;border-radius:14px;box-shadow:0 5px 0 rgba(91,141,239,.4);transition:transform .1s}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(91,141,239,.4)}
.hint{font-size:.82rem;color:#3f6ab0;font-weight:600;margin-top:7px;font-style:italic}
.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{width:46px;height:46px;border-radius:14px;border:2px solid rgba(91,141,239,.3);background:linear-gradient(135deg,#fff,#f0f6ff);font-weight:900;font-size:1.1rem;cursor:pointer;color:var(--p1);box-shadow:0 5px 0 rgba(91,141,239,.22);transition:transform .12s}
.lbtn:hover:not(.locked){transform:scale(1.08)}
.lbtn.sel{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}.corrbox.show{display:block}
.exp{max-height:0;overflow:hidden;transition:max-height .5s,margin .3s,padding .3s;background:rgba(91,141,239,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2000px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(91,141,239,.3)}
.exp ol{margin:6px 0 2px 18px}.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#eef4ff,#ffeef5);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#3f6ab0;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.p-word{color:#2563eb;font-weight:800}.hl-green{color:#0a9d54;font-weight:900}.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(91,141,239,.15);color:#3f6ab0;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}
.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--glow2),var(--p1),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(91,141,239,.4);transition:transform .1s}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(91,141,239,.4)}
.mask{position:fixed;inset:0;background:rgba(50,60,100,.55);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:#fff;border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(50,60,100,.4);border:2px solid rgba(255,211,155,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#556;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(91,141,239,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:fb 2s ease-in-out infinite}
@keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p5),var(--p1));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(91,141,239,.4)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fff;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>
<div class="wrap">
  <div class="topbar">
    <div class="tag">🎈 Giáo viên tạo: Ms MS Chí Nên</div>
    <h1>☁️ TEST 3</h1>
    <p>The First Midterm Tests · Sky English</p>
  </div>
  <div class="prog"><div class="txt" id="progtxt">0 / 28</div><div class="bar"><div class="fill" id="progfill"></div></div></div>
  <div id="quiz"></div>
  <div class="submit-wrap"><button class="btn-submit" onclick="openName()">🎈 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
  <div class="footer">✨ Made with love for young learners · Ms MS Chí Nên ✨</div>
</div>

<div class="mask" id="nameMask"><div class="modal">
  <h2>🌤️ Bé tên là gì nào?</h2><p>Nhập tên của con để xem kết quả nhé!</p>
  <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
  <div class="warn" id="nameWarn"></div>
  <button class="btn-again" style="background:linear-gradient(135deg,var(--glow2),var(--p1))" onclick="doSubmit()">Xem kết quả 🎉</button>
</div></div>

<div class="mask" id="resMask"><div class="modal">
  <h2 id="resGreet"></h2><div class="score-big" id="resScore"></div><div class="score-10" id="resScore10"></div>
  <img class="meme" id="resMeme" alt="meme" style="display:none"><div class="meme-fallback" id="resFallback"></div>
  <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
  <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
</div></div>

<script>
const DATA=[
/* I. PHONETICS */
{sec:"I",head:"Chọn từ có phần gạch chân được phát âm khác các từ còn lại.",num:1,type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["c<u>o</u>mmunity","m<u>e</u>tro","<u>o</u>riginal","p<u>o</u>lluted"],answer:"m<u>e</u>tro",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có nguyên âm "o" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>community</span> <span class='p-phonetic'>/kəˈmjuːnəti/</span> = <span class='p-mean'>cộng đồng → o đọc /ə/</span></div>
 <div><span class='hl-green'>metro</span> <span class='p-phonetic'>/ˈmetrəʊ/</span> = <span class='p-mean'>tàu điện ngầm → o đọc /əʊ/</span></div>
 <div><span class='p-word'>original</span> <span class='p-phonetic'>/əˈrɪdʒənl/</span> = <span class='p-mean'>nguyên bản → o đọc /ə/</span></div>
 <div><span class='p-word'>polluted</span> <span class='p-phonetic'>/pəˈluːtɪd/</span> = <span class='p-mean'>bị ô nhiễm → o đọc /ə/</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"metro" có "o" cuối đọc rõ là /əʊ/ (âm âu). Ba từ kia có "o" ở âm không nhấn nên đọc /ə/ (âm ơ mờ) → metro khác.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>community, original, polluted đều có "o" đọc /ə/ nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: "o" ở âm KHÔNG nhấn thường lười thành /ə/; "o" ở âm được nhấn/cuối từ mở thường đọc rõ /əʊ/.</div>`},
{sec:"I",num:2,type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["<u>h</u>andicraft","<u>h</u>ealthy","ex<u>h</u>aust","<u>h</u>omework"],answer:"ex<u>h</u>aust",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "h" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>handicraft</span> <span class='p-phonetic'>/ˈhændikrɑːft/</span> = <span class='p-mean'>đồ thủ công → h đọc /h/</span></div>
 <div><span class='p-word'>healthy</span> <span class='p-phonetic'>/ˈhelθi/</span> = <span class='p-mean'>khỏe mạnh → h đọc /h/</span></div>
 <div><span class='hl-green'>exhaust</span> <span class='p-phonetic'>/ɪɡˈzɔːst/</span> = <span class='p-mean'>khí thải → h CÂM (không đọc)</span></div>
 <div><span class='p-word'>homework</span> <span class='p-phonetic'>/ˈhəʊmwɜːk/</span> = <span class='p-mean'>bài tập về nhà → h đọc /h/</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"exhaust" có chữ "h" CÂM (không phát âm) — đọc là /ɪɡˈzɔːst/. Ba từ kia đều phát âm /h/ rõ → exhaust khác.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>handicraft, healthy, homework đều đọc /h/.</span></li></ol>
 <div class="tip">🧠 Mẹo: một số từ có "h" CÂM: exhaust, hour, honest, honour, heir.</div>`},
/* II. STRESS */
{sec:"II",head:"Chọn từ có trọng âm khác các từ còn lại.",num:3,type:"mcq",
 q:"3. Choose the word whose stress pattern is different.",
 disp:["overcome","minimise","fattening","concentrate"],answer:"overcome",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='hl-green'>overcome</span> <span class='p-phonetic'>/ˌəʊvəˈkʌm/</span> = <span class='p-mean'>vượt qua → trọng âm 3</span></div>
 <div><span class='p-word'>minimise</span> <span class='p-phonetic'>/ˈmɪnɪmaɪz/</span> = <span class='p-mean'>giảm thiểu → trọng âm 1</span></div>
 <div><span class='p-word'>fattening</span> <span class='p-phonetic'>/ˈfætnɪŋ/</span> = <span class='p-mean'>gây béo → trọng âm 1</span></div>
 <div><span class='p-word'>concentrate</span> <span class='p-phonetic'>/ˈkɒnsntreɪt/</span> = <span class='p-mean'>tập trung → trọng âm 1</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"o-ver-COME" nhấn âm tiết thứ BA, còn ba từ kia đều nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>minimise, fattening, concentrate đều nhấn âm 1.</span></li></ol>`},
{sec:"II",num:4,type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["regular","distracted","appropriate","original"],answer:"regular",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='hl-green'>regular</span> <span class='p-phonetic'>/ˈreɡjələ/</span> = <span class='p-mean'>đều đặn → trọng âm 1</span></div>
 <div><span class='p-word'>distracted</span> <span class='p-phonetic'>/dɪˈstræktɪd/</span> = <span class='p-mean'>bị phân tâm → trọng âm 2</span></div>
 <div><span class='p-word'>appropriate</span> <span class='p-phonetic'>/əˈprəʊpriət/</span> = <span class='p-mean'>phù hợp → trọng âm 2</span></div>
 <div><span class='p-word'>original</span> <span class='p-phonetic'>/əˈrɪdʒənl/</span> = <span class='p-mean'>nguyên bản → trọng âm 2</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"RE-gu-lar" nhấn âm tiết ĐẦU, còn ba từ kia đều nhấn âm tiết thứ HAI.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>distracted, appropriate, original đều nhấn âm 2.</span></li></ol>`},
/* III. MCQ */
{sec:"III",head:"Chọn từ hoặc cụm từ thích hợp nhất điền vào chỗ trống.",num:5,type:"mcq",
 q:"5. There are so many things on social media that can distract teens ______ their studies.",
 disp:["with","into","for","from"],answer:"from",
 exp:`<div class="vnt">💬 Dịch: Có quá nhiều thứ trên mạng xã hội có thể khiến thanh thiếu niên xao nhãng việc học.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>with</span> = <span class='p-mean'>với</span></div><div><span class='p-word'>into</span> = <span class='p-mean'>vào trong</span></div>
 <div><span class='p-word'>for</span> = <span class='p-mean'>cho</span></div><div><span class='hl-green'>from</span> = <span class='p-mean'>khỏi (distract from)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Cụm cố định "distract sb FROM sth" = làm ai xao nhãng khỏi việc gì → dùng "from".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>with/into/for không đi với "distract".</span></li></ol>
 <div class="tip">🧠 Nhớ: distract sb FROM sth = làm xao nhãng khỏi việc gì.</div>`},
{sec:"III",num:6,type:"mcq",
 q:"6. On weekends, I can walk my dog at the park, ______ I can relax and do nothing at home.",
 disp:["or","and","but","so"],answer:"or",
 exp:`<div class="vnt">💬 Dịch: Vào cuối tuần, tôi có thể dắt chó đi dạo ở công viên, hoặc có thể thư giãn và chẳng làm gì ở nhà.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='hl-green'>or</span> = <span class='p-mean'>hoặc (lựa chọn)</span></div><div><span class='p-word'>and</span> = <span class='p-mean'>và</span></div>
 <div><span class='p-word'>but</span> = <span class='p-mean'>nhưng</span></div><div><span class='p-word'>so</span> = <span class='p-mean'>vì vậy</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Hai vế là hai LỰA CHỌN khác nhau cho cuối tuần (đi dạo HOẶC ở nhà thư giãn) → dùng "or".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"and" (làm cả hai), "but" (tương phản), "so" (kết quả) đều không hợp với ý "chọn một trong hai".</span></li></ol>`},
{sec:"III",num:7,type:"mcq",
 q:"7. Isabelle missed the ______ for her assignment because she forgot to set a reminder.",
 disp:["delay","management","due date","outline"],answer:"due date",
 exp:`<div class="vnt">💬 Dịch: Isabelle đã lỡ hạn nộp bài vì cô ấy quên đặt lời nhắc.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>delay</span> = <span class='p-mean'>sự trì hoãn</span></div><div><span class='p-word'>management</span> = <span class='p-mean'>sự quản lý</span></div>
 <div><span class='hl-green'>due date</span> = <span class='p-mean'>hạn chót/ngày đến hạn</span></div><div><span class='p-word'>outline</span> = <span class='p-mean'>dàn ý</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"miss the due date" = lỡ hạn nộp. Quên đặt nhắc nhở → lỡ HẠN NỘP → "due date".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>delay/management/outline không phải thứ để "miss" (lỡ) khi nói về hạn nộp bài.</span></li></ol>`},
{sec:"III",num:8,type:"mcq",
 q:"8. Drivers shouldn't stop too long at the airport ______ area to avoid traffic congestion.",
 disp:["street-safe","waste-free","takeaway","drop-off"],answer:"drop-off",
 exp:`<div class="vnt">💬 Dịch: Tài xế không nên dừng quá lâu ở khu vực trả khách của sân bay để tránh ùn tắc giao thông.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>street-safe</span> = <span class='p-mean'>an toàn đường phố</span></div><div><span class='p-word'>waste-free</span> = <span class='p-mean'>không rác thải</span></div>
 <div><span class='p-word'>takeaway</span> = <span class='p-mean'>đồ ăn mang đi</span></div><div><span class='hl-green'>drop-off</span> = <span class='p-mean'>trả khách/hàng</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"drop-off area" = khu vực trả khách (thả khách xuống). Ở sân bay, tài xế dừng ngắn để trả khách → hợp nghĩa.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>street-safe, waste-free, takeaway không tạo cụm "... area" hợp ngữ cảnh trả khách ở sân bay.</span></li></ol>`},
{sec:"III",num:9,type:"mcq",
 q:"9. This world-famous artisan often spends months working in his workshop, ______?",
 disp:["does he","doesn't he","isn't he","is he"],answer:"doesn't he",
 exp:`<div class="vnt">💬 Dịch: Người nghệ nhân nổi tiếng thế giới này thường dành hàng tháng làm việc trong xưởng, phải không?</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>does he</span> = <span class='p-mean'>(khẳng định – sai)</span></div><div><span class='hl-green'>doesn't he</span> = <span class='p-mean'>phải không? (phủ định)</span></div>
 <div><span class='p-word'>isn't he</span> = <span class='p-mean'>(sai trợ động từ)</span></div><div><span class='p-word'>is he</span> = <span class='p-mean'>(sai trợ động từ)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Câu hỏi đuôi (tag question): mệnh đề chính KHẲNG ĐỊNH ("spends" – hiện tại đơn) → đuôi PHỦ ĐỊNH và dùng đúng trợ động từ "does" → "doesn't he?".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>Câu khẳng định thì đuôi phải phủ định (loại "does he"); động từ chính là "spends" nên trợ động từ là "do/does", không phải "is" → loại "isn't he/is he".</span></li></ol>
 <div class="tip">🧠 Nhớ: câu KHẲNG ĐỊNH → đuôi PHỦ ĐỊNH (và ngược lại). Hiện tại đơn (V-s) → dùng does trong đuôi.</div>`},
{sec:"III",num:10,type:"mcq",
 q:"10. The primary ______ of this handmade basket is to store small household items.",
 disp:["function","fragrance","origin","technique"],answer:"function",
 exp:`<div class="vnt">💬 Dịch: Chức năng chính của chiếc giỏ thủ công này là để đựng các vật dụng nhỏ trong nhà.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='hl-green'>function</span> = <span class='p-mean'>chức năng, công dụng</span></div><div><span class='p-word'>fragrance</span> = <span class='p-mean'>hương thơm</span></div>
 <div><span class='p-word'>origin</span> = <span class='p-mean'>nguồn gốc</span></div><div><span class='p-word'>technique</span> = <span class='p-mean'>kĩ thuật</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"to store items" (để đựng đồ) là CÔNG DỤNG của chiếc giỏ → "primary function" = chức năng chính.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>fragrance (mùi hương), origin (nguồn gốc), technique (kĩ thuật) không phải "công dụng để đựng đồ".</span></li></ol>`},
{sec:"III",num:11,type:"mcq",
 q:"11. I wanted to chat with Eliza yesterday, but she said she was busy studying ______.",
 disp:["now","the previous day","the day before","then"],answer:"then",
 exp:`<div class="vnt">💬 Dịch: Hôm qua tôi muốn trò chuyện với Eliza, nhưng cô ấy nói lúc đó cô ấy đang bận học.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>now</span> = <span class='p-mean'>bây giờ (dùng câu trực tiếp)</span></div><div><span class='p-word'>the previous day</span> = <span class='p-mean'>ngày hôm trước</span></div>
 <div><span class='p-word'>the day before</span> = <span class='p-mean'>ngày hôm trước</span></div><div><span class='hl-green'>then</span> = <span class='p-mean'>lúc đó (khi ấy)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Đây là câu tường thuật. Trong lời trực tiếp cô ấy nói "I'm busy studying NOW". Khi tường thuật, "now" đổi thành "then" (lúc đó). → "she was busy studying THEN".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"now" chỉ dùng trong lời trực tiếp; "the previous day/the day before" nghĩa "hôm trước" — nhưng cô ấy bận học NGAY LÚC nói (hôm qua), không phải hôm trước đó.</span></li></ol>
 <div class="tip">🧠 Nhớ đổi trạng từ khi tường thuật: now → then; today → that day; yesterday → the day before.</div>`},
{sec:"III",num:12,type:"mcq",
 q:"12. Because of having too much schoolwork, some students feel ______ about finishing everything on time.",
 disp:["pessimist","pessimism","pessimistic","pessimistically"],answer:"pessimistic",
 exp:`<div class="vnt">💬 Dịch: Vì có quá nhiều bài vở, một số học sinh cảm thấy bi quan về việc hoàn thành mọi thứ đúng hạn.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>pessimist</span> <span class='wt'>n</span> = <span class='p-mean'>người bi quan</span></div><div><span class='p-word'>pessimism</span> <span class='wt'>n</span> = <span class='p-mean'>sự bi quan</span></div>
 <div><span class='hl-green'>pessimistic</span> <span class='wt'>adj</span> = <span class='p-mean'>bi quan (tính từ)</span></div><div><span class='p-word'>pessimistically</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách bi quan</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Sau động từ chỉ cảm xúc "feel" cần một TÍNH TỪ → "feel pessimistic" (cảm thấy bi quan).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>pessimist/pessimism là danh từ; pessimistically là trạng từ → không đi sau "feel".</span></li></ol>
 <div class="tip">🧠 Mẹo: sau các động từ giác quan/cảm xúc (feel, look, seem, taste...) dùng TÍNH TỪ.</div>`},
{sec:"III",num:13,type:"mcq",
 q:"13. Drivers ______ pay attention to the street signs when driving through busy intersections.",
 disp:["can","might","must","would"],answer:"must",
 exp:`<div class="vnt">💬 Dịch: Tài xế phải chú ý đến biển báo đường khi lái xe qua các ngã tư đông đúc.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>can</span> = <span class='p-mean'>có thể</span></div><div><span class='p-word'>might</span> = <span class='p-mean'>có lẽ</span></div>
 <div><span class='hl-green'>must</span> = <span class='p-mean'>phải (bắt buộc)</span></div><div><span class='p-word'>would</span> = <span class='p-mean'>sẽ</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Chú ý biển báo khi qua ngã tư đông là điều BẮT BUỘC vì an toàn → "must pay attention" (phải chú ý).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>can (có thể), might (có lẽ), would (sẽ) không diễn tả sự bắt buộc về an toàn giao thông.</span></li></ol>`},
{sec:"III",num:14,type:"mcq",
 q:'14. Matthew: "Hey, remember the community event? It\'s moved to next week, on Sunday at 4 p.m." – Cathy: "______ Could you say it again?"',
 disp:["Don't mention it.","Sorry, I didn't catch that.","Right, I'm ready to go.","I hope the weather will be nice."],answer:"Sorry, I didn't catch that.",
 exp:`<div class="vnt">💬 Dịch: <strong>Sorry, I didn't catch that.</strong> (Matthew: "Này, nhớ sự kiện cộng đồng chứ? Nó dời sang tuần sau, Chủ nhật lúc 4 giờ chiều." – Cathy: "Xin lỗi, mình nghe không rõ. Cậu nói lại được không?")</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. Don't mention it.</span> = <span class='p-mean'>Không có gì. (đáp lời cảm ơn – lạc)</span></div>
 <div><span class='hl-green'>B. Sorry, I didn't catch that.</span> = <span class='p-mean'>Xin lỗi, mình nghe không rõ. ✔</span></div>
 <div><span class='p-word'>C. Right, I'm ready to go.</span> = <span class='p-mean'>Được, mình sẵn sàng rồi. (lạc)</span></div>
 <div><span class='p-word'>D. I hope the weather will be nice.</span> = <span class='p-mean'>Mình mong thời tiết đẹp. (lạc)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Sau đó Cathy nói "Could you say it again?" (nói lại được không?) → cô ấy nghe KHÔNG RÕ → "Sorry, I didn't catch that."</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>Ba câu còn lại không dẫn đến việc "nhờ nói lại".</span></li></ol>
 <div class="tip">🧠 Nhớ: "I didn't catch that" = mình nghe không rõ, nói lại nhé.</div>`},
/* IV. SIGNS */
{sec:"IV",head:"Nhìn biển báo/thông báo và chọn đáp án đúng.",num:15,type:"mcq",
 q:`15. What does the sign say?
 <div class="signbox"><svg viewBox="0 0 240 210" width="205" height="180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Biển cấm uống rượu lái xe">
   <circle cx="120" cy="105" r="86" fill="#fff" stroke="#e63946" stroke-width="15"/>
   <path d="M74 60 L106 60 L98 88 Q90 96 90 96 Q90 96 82 88 Z" fill="#8e1b2e"/>
   <path d="M83 89 L97 89 L94 78 L86 78 Z" fill="#c0392b"/>
   <rect x="87" y="96" width="6" height="34" fill="#777"/>
   <rect x="74" y="130" width="32" height="6" rx="3" fill="#777"/>
   <path d="M132 116 Q138 98 152 98 L170 98 Q180 98 186 116 Z" fill="#5dade2"/>
   <rect x="126" y="116" width="66" height="18" rx="6" fill="#3498db"/>
   <circle cx="140" cy="136" r="8" fill="#2c3e50"/><circle cx="178" cy="136" r="8" fill="#2c3e50"/>
   <circle cx="140" cy="136" r="3" fill="#bbb"/><circle cx="178" cy="136" r="3" fill="#bbb"/>
   <line x1="59" y1="44" x2="181" y2="166" stroke="#e63946" stroke-width="15" stroke-linecap="round"/>
 </svg></div>`,
 disp:["Drinking alcohol after driving is dangerous.","You can drive if you drink a glass of alcohol.","It's acceptable to drink water while driving.","You mustn't drive if you drink alcohol."],
 answer:"You mustn't drive if you drink alcohol.",
 exp:`<div class="vnt">💬 Dịch: <strong>You mustn't drive if you drink alcohol.</strong> (Biển này nghĩa là "Bạn không được lái xe nếu đã uống rượu bia.")</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. Drinking alcohol after driving is dangerous.</span> = <span class='p-mean'>Uống rượu SAU khi lái xe thì nguy hiểm. (sai thứ tự)</span></div>
 <div><span class='p-word'>B. You can drive if you drink a glass of alcohol.</span> = <span class='p-mean'>Bạn được lái xe nếu uống một ly rượu. (ngược nghĩa)</span></div>
 <div><span class='p-word'>C. It's acceptable to drink water while driving.</span> = <span class='p-mean'>Được phép uống nước khi lái xe. (lạc – biển nói về rượu)</span></div>
 <div><span class='hl-green'>D. You mustn't drive if you drink alcohol.</span> = <span class='p-mean'>Bạn không được lái xe nếu đã uống rượu. ✔</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Hình vẽ có LY RƯỢU + Ô TÔ nằm trong vòng tròn đỏ gạch chéo (ký hiệu CẤM) → "đã uống rượu thì KHÔNG được lái xe" = "You mustn't drive if you drink alcohol."</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>A đảo thứ tự (lái xe rồi mới uống); B cho phép lái xe (ngược); C nói về nước uống, không phải rượu.</span></li></ol>
 <div class="tip">🧠 Vòng tròn đỏ + gạch chéo = CẤM điều vẽ bên trong. Rượu + xe = cấm uống rượu lái xe.</div>`},
{sec:"IV",num:16,type:"mcq",
 q:`16. What does the notice say?
 <div class="signbox"><svg viewBox="0 0 240 214" width="205" height="183" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thông báo bơi phải mặc đồ bơi">

     <line x1="-19" y1="-18" x2="19" y2="20" stroke="#e63946" stroke-width="5"/>
   </g>
   <text x="120" y="196" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="11" fill="#e63946">NO SHORTS, JEANS OR CUT-OFFS</text>
 </svg></div>`,
 disp:["Only people wearing bathing suits are allowed to swim.","There is no dress code for swimmers in the pool.","If you wear shorts or jeans, you're allowed to swim here.","Swimmers can wear casual clothes when swimming here."],
 answer:"Only people wearing bathing suits are allowed to swim.",
 exp:`<div class="vnt">💬 Dịch: <strong>Only people wearing bathing suits are allowed to swim.</strong> (Thông báo nghĩa là "Chỉ những người mặc đồ bơi mới được phép bơi.")</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='hl-green'>A. Only people wearing bathing suits are allowed to swim.</span> = <span class='p-mean'>Chỉ người mặc đồ bơi mới được bơi. ✔</span></div>
 <div><span class='p-word'>B. There is no dress code for swimmers in the pool.</span> = <span class='p-mean'>Không có quy định trang phục cho người bơi. (ngược)</span></div>
 <div><span class='p-word'>C. If you wear shorts or jeans, you're allowed to swim here.</span> = <span class='p-mean'>Mặc quần short/jean thì được bơi ở đây. (ngược – biển CẤM)</span></div>
 <div><span class='p-word'>D. Swimmers can wear casual clothes when swimming here.</span> = <span class='p-mean'>Người bơi có thể mặc đồ thường. (ngược)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Thông báo ghi "SWIMMERS MUST WEAR BATHING SUITS" (phải mặc đồ bơi) và "NO SHORTS, JEANS" (cấm quần short, jean) → CHỈ người mặc đồ bơi mới được bơi.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>B, C, D đều ngược với "must wear bathing suits / no shorts, jeans".</span></li></ol>
 <div class="tip">🧠 "must wear" = phải mặc; "No ... allowed" = không cho phép. Suy ra: chỉ đồ bơi mới được.</div>`},
/* V. VERB FORM */
{sec:"V",head:"Chia động từ trong ngoặc cho đúng dạng. (Gõ đáp án vào ô)",num:17,type:"fill",
 q:"17. If the workshop ______ (run) smoothly, the artisans ______ (host) more events in the future.",
 accept:["runs will host"],
 exp:`<div class="vnt">💬 Dịch: Nếu buổi hội thảo diễn ra suôn sẻ, các nghệ nhân sẽ tổ chức thêm nhiều sự kiện trong tương lai.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>runs – will host</span></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Đây là câu điều kiện loại 1 (điều có thể xảy ra ở tương lai): <b>If</b> + S + V(hiện tại đơn), S + <b>will</b> + V. Chủ ngữ "the workshop" số ít → "runs"; vế chính → "will host".</span></li></ol>
 <div class="tip">🧠 Nhớ: If + present simple, ... will + V (điều kiện loại 1).</div>`},
{sec:"V",num:18,type:"fill",
 q:"18. We should decide who ______ (assign) the task based on their skills.",

 <ol><li>Đáp án đúng: <span class='hl-green'>to assign</span></li>

 <div class="tip">🧠 Nhớ: decide/know/wonder + wh-word + TO + V (who to ask, what to do, how to fix).</div>`},
/* VI. ARRANGE */
{sec:"VI",head:"Sắp xếp các câu để tạo thành đoạn hội thoại/đoạn văn hợp lý.",num:19,type:"mcq",
 q:`19. Sắp xếp các câu (a–d) cho hợp lý:
 <div class="orderbox">
   <div><b>a.</b> Linda: Definitely! It helps keep things organised and makes you feel less stressed.</div>
   <div><b>b.</b> Owen: Not really, I normally do whatever task I can remember. I seriously should make a to-do list!</div>
   <div><b>c.</b> Owen: Hey Linda, how do you manage your time? I always feel like there's not enough time for me.</div>
   <div><b>d.</b> Linda: Well, have you tried making a to-do list and setting time limits for each task?</div>
 </div><div style="font-weight:800;margin-top:4px">👉 Chọn thứ tự đúng:</div>`,
 disp:["c – b – d – a","d – c – a – b","d – b – a – c","c – d – b – a"],answer:"c – d – b – a",
 exp:`<div class="vnt">💬 Dịch nghĩa từng câu:</div>
 <div class="gcol">
 <div><b>a.</b> <strong>Linda: Definitely! It helps keep things organised and makes you feel less stressed.</strong> <br><span class='p-mean'>(Linda: Chắc chắn rồi! Nó giúp mọi thứ gọn gàng và khiến bạn bớt căng thẳng.)</span></div>
 <div><b>b.</b> <strong>Owen: Not really, I normally do whatever task I can remember. I seriously should make a to-do list!</strong> <br><span class='p-mean'>(Owen: Không hẳn, mình thường làm bất cứ việc gì mình nhớ ra. Mình thực sự nên lập danh sách việc cần làm!)</span></div>
 <div><b>c.</b> <strong>Owen: Hey Linda, how do you manage your time? I always feel like there's not enough time for me.</strong> <br><span class='p-mean'>(Owen: Này Linda, bạn quản lý thời gian thế nào? Mình luôn thấy không đủ thời gian.)</span></div>
 <div><b>d.</b> <strong>Linda: Well, have you tried making a to-do list and setting time limits for each task?</strong> <br><span class='p-mean'>(Linda: À, bạn đã thử lập danh sách việc cần làm và đặt giới hạn thời gian cho từng việc chưa?)</span></div></div>
 <ol><li><span class="hl-green">✅ THỨ TỰ ĐÚNG: c – d – b – a</span></li>
 <li><span class='p-grammar'>Owen HỎI (c) → Linda GỢI Ý làm to-do list (d) → Owen ĐÁP là chưa, nên làm (b) → Linda ĐỒNG TÌNH khen lợi ích (a). Hội thoại hỏi–đáp luân phiên Owen/Linda.</span></li>
 <li><span class="hl-red">❌ Vì sao khác sai?</span> <span class='p-grammar'>Phải bắt đầu bằng câu HỎI (c); các câu đáp "Not really"(b)/"Definitely!"(a) phải đứng sau câu chúng trả lời.</span></li></ol>
 <div class="tip">🧠 Mẹo hội thoại: tìm câu HỎI mở đầu, rồi ghép hỏi–đáp luân phiên hai người.</div>`},
{sec:"VI",num:20,type:"mcq",
 q:`20. Sắp xếp các câu (a–e) cho hợp lý:
 <div class="orderbox">
   <div><b>a.</b> Not only do they respond to fires, but they also provide safety education to the community.</div>
   <div><b>b.</b> Overall, I admire their dedication and the sacrifices they make to ensure our safety every day.</div>
   <div><b>c.</b> Today, I'd like to talk about my favourite community helper, the firefighters.</div>
   <div><b>d.</b> Furthermore, their bravery and quick actions save lives and protect property.</div>
   <div><b>e.</b> Firefighters play a vital role in keeping us safe from fires and other emergencies.</div>
 </div><div style="font-weight:800;margin-top:4px">👉 Chọn thứ tự đúng:</div>`,
 disp:["c – a – e – b – d","e – a – d – b – c","c – e – a – d – b","b – e – a – c – d"],answer:"c – e – a – d – b",
 exp:`<div class="vnt">💬 Dịch nghĩa từng câu:</div>
 <div class="gcol">
 <div><b>a.</b> <strong>Not only do they respond to fires, but they also provide safety education to the community.</strong> <br><span class='p-mean'>(Họ không chỉ dập lửa mà còn giáo dục an toàn cho cộng đồng.)</span></div>
 <div><b>b.</b> <strong>Overall, I admire their dedication and the sacrifices they make to ensure our safety every day.</strong> <br><span class='p-mean'>(Nhìn chung, tôi khâm phục sự tận tụy và những hy sinh họ dành để bảo vệ chúng ta mỗi ngày.)</span></div>
 <div><b>c.</b> <strong>Today, I'd like to talk about my favourite community helper, the firefighters.</strong> <br><span class='p-mean'>(Hôm nay, tôi muốn nói về người hùng cộng đồng tôi yêu thích — lính cứu hỏa.)</span></div>
 <div><b>d.</b> <strong>Furthermore, their bravery and quick actions save lives and protect property.</strong> <br><span class='p-mean'>(Hơn nữa, lòng dũng cảm và hành động nhanh nhạy của họ cứu sống người và bảo vệ tài sản.)</span></div>
 <div><b>e.</b> <strong>Firefighters play a vital role in keeping us safe from fires and other emergencies.</strong> <br><span class='p-mean'>(Lính cứu hỏa đóng vai trò quan trọng trong việc giữ chúng ta an toàn khỏi hỏa hoạn và các tình huống khẩn cấp.)</span></div></div>
 <ol><li><span class="hl-green">✅ THỨ TỰ ĐÚNG: c – e – a – d – b</span></li>
 <li><span class='p-grammar'>Giới thiệu chủ đề (c) → nêu vai trò chung (e) → dẫn chứng 1 "Not only..."(a) → dẫn chứng 2 "Furthermore..."(d) → kết luận "Overall..."(b). Bám từ nối: Not only → Furthermore → Overall.</span></li>
 <li><span class="hl-red">❌ Vì sao khác sai?</span> <span class='p-grammar'>Câu c mở đầu ("Today, I'd like to talk about..."), câu b kết ("Overall..."). Không thể mở đầu bằng b/e.</span></li></ol>
 <div class="tip">🧠 Mẹo: câu giới thiệu "I'd like to talk about..." mở đầu; "Overall/In conclusion" kết bài; "Furthermore" nối ý sau.</div>`},
/* IX. ERROR */
{sec:"IX",head:"Tìm lỗi sai. Bấm chữ cái chứa lỗi, rồi gõ từ SỬA ĐÚNG.",num:33,type:"error",
 q:"33. <u>Eating</u> fresh fruit and vegetables <u>provides</u> you <u>for</u> vitamins and minerals that <u>strengthen</u> your immune system.",
 parts:["Eating","provides","for","strengthen"],correctLetter:2,corrAccept:["with"],
 exp:`<div class="vnt">💬 Dịch: <strong>Eating fresh fruit and vegetables provides you with vitamins and minerals that strengthen your immune system.</strong> (Ăn hoa quả và rau tươi cung cấp cho bạn vitamin và khoáng chất giúp tăng cường hệ miễn dịch.)</div>
 <ol><li>Lỗi sai ở <b>C. for</b> → sửa thành <span class='hl-green'>with</span>.</li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Cấu trúc "provide sb WITH sth" = cung cấp cho ai cái gì. Vì thế "provides you FOR vitamins" sai, phải là "provides you WITH vitamins".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>Eating (danh động từ làm chủ ngữ – đúng), provides (chia với chủ ngữ số ít "Eating" – đúng), strengthen (chia với "vitamins and minerals" số nhiều – đúng). Chỉ "for" sai.</span></li></ol>

{sec:"IX",num:34,type:"error",
 q:"34. <u>Some tourists</u> asked me <u>what to buy</u> a metro <u>transportation card</u> from the <u>ticket machine</u>.",

 exp:`<div class="vnt">💬 Dịch: <strong>Some tourists asked me how to buy a metro transportation card from the ticket machine.</strong> (Một số du khách hỏi tôi làm thế nào để mua thẻ đi tàu điện từ máy bán vé.)</div>

 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Sau "what to buy" đã có tân ngữ "a metro transportation card" (đã biết MUA GÌ). Điều du khách chưa biết là CÁCH mua → phải dùng "HOW to buy" (làm thế nào để mua).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>Some tourists (chủ ngữ – đúng), transportation card & ticket machine (danh từ – đúng). Chỉ "what to buy" sai vì đã nêu rõ vật cần mua rồi.</span></li></ol>

/* X. CLOSEST MEANING */
{sec:"X",head:"Chọn câu có nghĩa gần nhất với câu gốc.",num:35,type:"mcq",
 q:"35. Jimmy returns to his hometown every year to celebrate Christmas with family.",
 disp:["Jimmy comes across his hometown every year to celebrate Christmas with family.","Jimmy gets around his hometown annually to celebrate Christmas with family.","Jimmy hangs out his hometown every year to celebrate Christmas with family.","Jimmy comes back to his hometown annually to celebrate Christmas with family."],
 answer:"Jimmy comes back to his hometown annually to celebrate Christmas with family.",
 exp:`<div class="vnt">💬 Dịch: <strong>Jimmy comes back to his hometown annually to celebrate Christmas with family.</strong> (Hằng năm Jimmy trở về quê để đón Giáng sinh cùng gia đình.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. Jimmy comes across his hometown every year to celebrate Christmas with family.</span> = <span class='p-mean'>tình cờ gặp (sai nghĩa)</span></div>
 <div><span class='p-word'>B. Jimmy gets around his hometown annually to celebrate Christmas with family.</span> = <span class='p-mean'>đi lại khắp nơi (sai)</span></div>
 <div><span class='p-word'>C. Jimmy hangs out his hometown every year to celebrate Christmas with family.</span> = <span class='p-mean'>đi chơi (sai + thiếu giới từ)</span></div>
 <div><span class='hl-green'>D. Jimmy comes back to his hometown annually to celebrate Christmas with family.</span> = <span class='p-mean'>trở về... hằng năm ✔</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"return to" = "come back to" (trở về); "every year" = "annually" (hằng năm). Câu D giữ đúng cả hai.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>come across (tình cờ gặp), get around (đi khắp), hang out (đi chơi) đều khác nghĩa "trở về".</span></li></ol>
 <div class="tip">🧠 Nhớ: return to = come back to; every year = annually.</div>`},
{sec:"X",num:36,type:"mcq",
 q:'36. "There is heavy traffic congestion in this downtown area now," said the newscaster.',
 disp:["The newscaster says there is heavy traffic congestion in that downtown area then.","The newscaster says there was heavy traffic congestion in this downtown area now.","The newscaster said there was heavy traffic congestion in that downtown area then.","The newscaster said there is heavy traffic congestion in this downtown area now."],
 answer:"The newscaster said there was heavy traffic congestion in that downtown area then.",
 exp:`<div class="vnt">💬 Dịch: <strong>The newscaster said there was heavy traffic congestion in that downtown area then.</strong> (Phát thanh viên nói rằng lúc đó có tình trạng ùn tắc giao thông nghiêm trọng ở khu trung tâm ấy.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. The newscaster says there is heavy traffic congestion in that downtown area then.</span> = <span class='p-mean'>says... this... (sai: chưa lùi thì & giữ "this/now")</span></div>
 <div><span class='p-word'>B. The newscaster says there was heavy traffic congestion in this downtown area now.</span> = <span class='p-mean'>says... was... this... now (lẫn lộn)</span></div>
 <div><span class='hl-green'>C. The newscaster said there was heavy traffic congestion in that downtown area then.</span> = <span class='p-mean'>said... was... that... then. ✔</span></div>
 <div><span class='p-word'>D. The newscaster said there is heavy traffic congestion in this downtown area now.</span> = <span class='p-mean'>said... is... this... now (không lùi thì/trạng từ)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Câu tường thuật: động từ tường thuật "said" (quá khứ) → lùi thì "is" → "was"; đổi trạng từ chỉ định: "this" → "that", "now" → "then". Câu C đổi đủ.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>A, B dùng "says" (không lùi thì); D giữ nguyên "is/this/now" (chưa chuyển tường thuật).</span></li></ol>
 <div class="tip">🧠 Nhớ khi tường thuật: is → was; this → that; now → then.</div>`},
{sec:"X",num:37,type:"mcq",
 q:"37. The students plan to have a picnic at the park after their final exams.",
 disp:["The students will have a picnic at the park prior to their final exams.","The students are going to have a picnic at the park after their final exams.","The students' plan to have a picnic at the park is cancelled due to their final exams.","Before their final exams, the students had a picnic at the park."],
 answer:"The students are going to have a picnic at the park after their final exams.",
 exp:`<div class="vnt">💬 Dịch: <strong>The students are going to have a picnic at the park after their final exams.</strong> (Các học sinh dự định đi dã ngoại ở công viên sau kỳ thi cuối kỳ.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. The students will have a picnic at the park prior to their final exams.</span> = <span class='p-mean'>...prior to (TRƯỚC kỳ thi – sai, phải là SAU)</span></div>
 <div><span class='hl-green'>B. The students are going to have a picnic at the park after their final exams.</span> = <span class='p-mean'>...are going to... after their final exams. ✔</span></div>
 <div><span class='p-word'>C. The students' plan to have a picnic at the park is cancelled due to their final exams.</span> = <span class='p-mean'>...kế hoạch bị HỦY (sai nghĩa)</span></div>
 <div><span class='p-word'>D. Before their final exams, the students had a picnic at the park.</span> = <span class='p-mean'>Trước kỳ thi... đã đi dã ngoại (sai thì & thời điểm)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"plan to do sth" (dự định làm gì) = "be going to do sth" (sẽ/định làm gì). Giữ nguyên "after their final exams" (sau kỳ thi). → câu B.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>A dùng "prior to" (trước – ngược); C nói kế hoạch bị hủy; D đổi thành quá khứ và "before" (sai thời điểm).</span></li></ol>
 <div class="tip">🧠 Nhớ: plan to = intend to = be going to (dự định làm gì).</div>`},
{sec:"X",num:38,type:"mcq",
 q:"38. The modern pottery technique is less complicated than the traditional way.",
 disp:["The traditional pottery technique is not as complicated as the modern way.","The traditional pottery technique is as complicated as the modern way.","The traditional pottery technique is the most complicated of all time.","The traditional pottery technique is more complicated than the modern way."],
 answer:"The traditional pottery technique is more complicated than the modern way.",
 exp:`<div class="vnt">💬 Dịch: <strong>The traditional pottery technique is more complicated than the modern way.</strong> (Kỹ thuật làm gốm truyền thống phức tạp hơn cách làm hiện đại.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. The traditional pottery technique is not as complicated as the modern way.</span> = <span class='p-mean'>truyền thống KHÔNG phức tạp bằng hiện đại (ngược)</span></div>
 <div><span class='p-word'>B. The traditional pottery technique is as complicated as the modern way.</span> = <span class='p-mean'>phức tạp BẰNG NHAU (sai)</span></div>
 <div><span class='p-word'>C. The traditional pottery technique is the most complicated of all time.</span> = <span class='p-mean'>phức tạp NHẤT mọi thời đại (sai nghĩa)</span></div>
 <div><span class='hl-green'>D. The traditional pottery technique is more complicated than the modern way.</span> = <span class='p-mean'>truyền thống phức tạp HƠN hiện đại. ✔</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"Hiện đại ÍT phức tạp HƠN truyền thống" ⇔ "Truyền thống phức tạp HƠN hiện đại" (less ... than ⇔ more ... than khi đảo chủ ngữ). → câu D.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>A nói truyền thống ít phức tạp hơn (ngược); B nói bằng nhau; C dùng so sánh nhất (sai nghĩa).</span></li></ol>
 <div class="tip">🧠 Quy đổi: "A less ... than B" ⇔ "B more ... than A".</div>`},
/* XI. MAKE SENTENCES */
{sec:"XI",head:"Viết câu hoàn chỉnh từ các từ gợi ý. (Gõ cả câu vào ô)",num:39,type:"rearrange",
 q:"39. If/ Chris/ want/ meet/ deadline/ tomorrow/ must/ stay/ all night.",
 accept:["If Chris wants to meet the deadline tomorrow, he must stay up all night","If Chris wants to meet the deadline tomorrow he must stay up all night"],
 exp:`<div class="vnt">💬 Dịch: <strong>If Chris wants to meet the deadline tomorrow, he must stay up all night.</strong> (Nếu Chris muốn kịp hạn chót vào ngày mai, cậu ấy phải thức trắng đêm.)</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>If Chris wants to meet the deadline tomorrow, he must stay up all night.</span></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Điều kiện loại 1: "If + S + V(hiện tại đơn), S + must + V". "want TO meet" (muốn kịp), "meet the deadline" (kịp hạn), "stay UP all night" (thức trắng đêm). Chủ ngữ "Chris" số ít → "wants".</span></li></ol>
 <div class="tip">🧠 Nhớ: meet the deadline = kịp hạn; stay up = thức khuya (đừng quên "up").</div>`},
{sec:"XI",num:40,type:"rearrange",
 q:"40. The/ green spaces/ a city/ have/ the/ healthy/ its citizens/ become.",
 accept:["The more green spaces a city has, the healthier its citizens become","The more green spaces a city has the healthier its citizens become"],
 exp:`<div class="vnt">💬 Dịch: <strong>The more green spaces a city has, the healthier its citizens become.</strong> (Một thành phố càng có nhiều không gian xanh thì người dân càng khỏe mạnh.)</div>

 <div class="tip">🧠 Nhớ: The more + N + S + V, the + comparative + S + V (càng nhiều... càng...).</div>`}

let AC;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function ding(){const c=ac(),n=c.currentTime;[880,1320,1760].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,n+i*.08);g.gain.linearRampToValueAtTime(.25,n+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.4);o.start(n+i*.08);o.stop(n+i*.08+.42)})}
function buzz(){const c=ac(),n=c.currentTime;[300,220,160].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,n+i*.13);g.gain.exponentialRampToValueAtTime(.001,n+i*.13+.12);o.start(n+i*.13);o.stop(n+i*.13+.13)})}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d'),cols=['#ffd39b','#ff7eb3','#5b8def','#00D26A','#86e3d4','#c3b8f5'],P=[];for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});let t=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);t++;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore()});if(t<130)requestAnimationFrame(loop);else cv.remove()})()}

/* ===== HELPERS ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return(s||'').toLowerCase().replace(/won['’]t/g,'will not').replace(/can['’]t/g,'can not').replace(/n['’]t/g,' not').replace(/['’]/g,'').replace(/[.,!?;:"…\/–-]/g,' ').replace(/\s+/g,' ').trim()}
const state={};let answered=0;const TOTAL=DATA.length;
function updateProg(){document.getElementById('progtxt').textContent=answered+' / '+TOTAL;document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%'}

/* ===== RENDER ===== */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){const s=document.createElement('div');s.className='sec';s.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;quiz.appendChild(s)}
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  const zone=document.createElement('div');card.appendChild(zone);
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=it.exp;card.appendChild(exp);
  quiz.appendChild(card);
  if(it.type==='mcq')renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange')renderFill(it,idx,zone,exp);
  else if(it.type==='error')renderError(it,idx,zone,exp);
});
updateProg();
function markDone(idx,ok){if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg()}}

function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div');wrap.className='opts';
  shuffle(it.disp).forEach(txt=>{
    const b=document.createElement('div');b.className='opt';b.innerHTML=txt;
    b.onclick=()=>{if(state[idx])return;const all=wrap.querySelectorAll('.opt');all.forEach(x=>x.classList.add('locked'));
      if(txt===it.answer){b.classList.add('correct');ding();confetti();markDone(idx,true)}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim')});setTimeout(()=>b.classList.remove('shake'),450)}
      exp.classList.add('open')};
    wrap.appendChild(b)});
  zone.appendChild(wrap);
}
function renderFill(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='💡 '+it.hint;zone.appendChild(h)}
  const acc=it.accept.map(norm);
  function check(){if(state[idx])return;const ok=acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderError(it,idx,zone,exp){
  const q=document.createElement('div');q.className='err-parts';let lb=it.q.replace(/^\d+\.\s*/,'');let li=0;const L=['A','B','C','D'];
  lb=lb.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);q.innerHTML=lb;zone.appendChild(q);
  const letters=document.createElement('div');letters.className='letters';
  const corr=document.createElement('div');corr.className='corrbox';const acc=it.corrAccept.map(norm);let chosen=null;
  L.forEach((lab,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=lab;
    b.onclick=()=>{if(state[idx])return;letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');chosen=i;corr.classList.add('show');corr.querySelector('input').focus()};letters.appendChild(b)});
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div><div class="hint">💡 Chọn chữ cái chứa lỗi, gõ từ đúng rồi bấm Kiểm tra.</div>`;
  zone.appendChild(corr);const inp=corr.querySelector('input'),btn=corr.querySelector('button');
  function check(){if(state[idx])return;if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return}
    const ok=(chosen===it.correctLetter)&&acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel')});letters.children[it.correctLetter].classList.add('correct');if(chosen!==it.correctLetter)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}

/* ===== SUBMIT ===== */
function openName(){document.getElementById('nameMask').classList.add('show');setTimeout(()=>document.getElementById('nameInput').focus(),100)}
function doSubmit(){const inp=document.getElementById('nameInput'),w=document.getElementById('nameWarn'),name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return}inp.classList.remove('err');w.textContent='';document.getElementById('nameMask').classList.remove('show');showResult(name)}
function showResult(name){let correct=0;for(let i=0;i<TOTAL;i++)if(state[i]==='ok')correct++;const pct=correct/TOTAL,s10=(pct*10).toFixed(2);let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con bay cao như mây! 🏆';fb='🏆🎈🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif'}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa nhé! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif'}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi làm lại nha! 🌈';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif'}
  document.getElementById('resGreet').textContent=greet;document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'),fbEl=document.getElementById('resFallback');fbEl.textContent=fb;fbEl.style.display='none';im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none'};im.onerror=()=>{im.style.display='none';fbEl.style.display='block'};im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block'}},2500);
  document.getElementById('resMask').classList.add('show');if(pct>=0.6){confetti();ding()}}

/* ===== FLOATS ===== */
(function(){const icons=['🎈','☁️','🌤️','⭐','🕊️','🌈','☀️','🎈','☁️','⭐'];const p=document.getElementById('pattern');
  for(let i=0;i<10;i++){const s=document.createElement('span');s.className='float';s.textContent=icons[i%icons.length];s.style.left=Math.random()*100+'%';s.style.animationDuration=(18+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*24)+'s';s.style.fontSize=(1.6+Math.random()*1.7)+'rem';p.appendChild(s)}})();
</script>
</body>
