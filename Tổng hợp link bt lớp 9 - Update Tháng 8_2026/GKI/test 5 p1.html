<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 5 · Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#8338ec;--p4:#ff5e78;--p5:#3a86ff;--green:#00D26A;--red:#FF4757;--ink:#2a1a4a;--glow:#ffd60a;--glow2:#ff4b5c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;line-height:1.55;overflow-x:hidden;position:relative;
  background:linear-gradient(-45deg,#ff4b5c,#ff8c42,#ffd60a,#3a86ff,#8338ec,#ff5e78);background-size:400% 400%;animation:bgmove 18s ease infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.halftone{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:radial-gradient(circle,rgba(255,255,255,.16) 2px,transparent 2.6px);background-size:22px 22px}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.2rem;opacity:.4;animation:floaty linear infinite;filter:drop-shadow(0 3px 6px rgba(40,20,60,.3))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0) rotate(0)}50%{transform:translateY(50vh) translateX(20px) rotate(180deg)}100%{transform:translateY(-15vh) translateX(-10px) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}
.topbar{text-align:center;background:rgba(255,255,255,.22);backdrop-filter:blur(14px);border:2px solid rgba(255,214,10,.7);border-radius:22px;padding:14px 16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(40,20,60,.3)}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(131,56,236,.7);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 10px var(--glow),0 3px 0 var(--glow2),0 4px 10px rgba(40,20,60,.4)}
.topbar p{font-size:.78rem;color:#fffdf0;opacity:.97;margin-top:2px}
.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(60,30,90,.28);backdrop-filter:blur(12px);border-radius:30px;padding:5px;border:2px solid rgba(255,214,10,.5);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.4);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(40,20,60,.5)}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;font-weight:900;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 16px rgba(255,75,92,.5)}
.sec h2{color:#fff;font-size:1.02rem;font-weight:800;text-shadow:0 1px 6px rgba(40,20,60,.5);flex:1}
.card{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-radius:20px;padding:16px 16px 14px;margin-bottom:16px;border:2px solid rgba(255,214,10,.5);box-shadow:0 12px 26px rgba(40,20,60,.22)}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#ffb703);color:#7a4a00;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}
.passage{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid var(--glow2);border-radius:12px;padding:10px 13px;margin:10px 0;font-weight:600;line-height:1.65;font-size:1rem;color:#6a4a1b}
.dict{background:#fbf7ff;border:1.5px solid rgba(131,56,236,.25);border-radius:12px;padding:10px 13px;margin:10px 0;font-size:.96rem;line-height:1.6}
.dict b{color:var(--p1)}.dict .hw{font-size:1.15rem;font-weight:900;color:var(--p1)}
.signbox{display:flex;justify-content:center;margin:12px 0 4px}
.signbox svg{filter:drop-shadow(0 6px 12px rgba(40,20,60,.25))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:linear-gradient(135deg,#fff,#fff6f0);border:2px solid rgba(255,75,92,.22);border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(255,75,92,.24),0 8px 14px rgba(40,20,60,.12);transition:transform .12s,box-shadow .12s;text-align:center;user-select:none}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(255,75,92,.3),0 0 18px rgba(255,214,10,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;border:2px solid rgba(255,75,92,.35);background:#fff;outline:none;flex:1;min-width:180px;color:var(--ink)}
.tin:focus{border-color:var(--glow2);box-shadow:0 0 0 4px rgba(255,75,92,.2)}
.tin.ok{border-color:var(--green);background:#eafff3}.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.05rem;font-weight:800;color:var(--p1)}
.btn-check{font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--glow2),var(--p1));padding:11px 18px;border-radius:14px;box-shadow:0 5px 0 rgba(131,56,236,.4);transition:transform .1s}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(131,56,236,.4)}
.hint{font-size:.82rem;color:#8a3fb0;font-weight:600;margin-top:7px;font-style:italic}
.exp{max-height:0;overflow:hidden;transition:max-height .5s,margin .3s,padding .3s;background:rgba(131,56,236,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2000px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(131,56,236,.3)}
.exp ol{margin:6px 0 2px 18px}.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#f3ecff,#fff0e8);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#7a3f8a;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.p-word{color:#2563eb;font-weight:800}.hl-green{color:#0a9d54;font-weight:900}.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(131,56,236,.15);color:#6b3fa0;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}
.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--glow2),var(--p1),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(131,56,236,.4);transition:transform .1s}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(131,56,236,.4)}
.mask{position:fixed;inset:0;background:rgba(40,20,60,.6);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:#fff;border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(40,20,60,.4);border:2px solid rgba(255,214,10,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#5a3a75;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(255,75,92,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:fb 2s ease-in-out infinite}
@keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p5),var(--p1));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(131,56,236,.4)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fffdf0;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="halftone"></div>
<div class="pattern" id="pattern"></div>
<div class="wrap">
  <div class="topbar">
    <div class="tag">⚡ Giáo viên tạo: Ms MS Chí Nên</div>
    <h1>💥 TEST 5</h1>
    <p>The First Midterm Tests · Super English</p>
  </div>
  <div class="prog"><div class="txt" id="progtxt">0 / 28</div><div class="bar"><div class="fill" id="progfill"></div></div></div>
  <div id="quiz"></div>
  <div class="submit-wrap"><button class="btn-submit" onclick="openName()">🦸 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
  <div class="footer">✨ Made with love for young heroes · Ms MS Chí Nên ✨</div>
</div>
<div class="mask" id="nameMask"><div class="modal">
  <h2>🦸 Siêu anh hùng nhí tên gì?</h2><p>Nhập tên của con để xem kết quả nhé!</p>
  <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
  <div class="warn" id="nameWarn"></div>
  <button class="btn-again" style="background:linear-gradient(135deg,var(--glow2),var(--p1))" onclick="doSubmit()">Xem kết quả 🎉</button>
</div></div>
<div class="mask" id="resMask"><div class="modal">
  <h2 id="resGreet"></h2><div class="score-big" id="resScore"></div><div class="score-10" id="resScore10"></div>
  <img class="meme" id="resMeme" alt="meme" style="display:none"><div class="meme-fallback" id="resFallback"></div>
  <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
  <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
</div></div>
<script>
const DATA=[
/* I */
{sec:"I",head:"Chọn từ có phần gạch chân được phát âm khác các từ còn lại.",num:1,type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["sl<u>ow</u>","shad<u>ow</u>","cr<u>ow</u>ded","gr<u>ow</u>ing"],answer:"cr<u>ow</u>ded",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có "ow" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>slow</span> <span class='p-phonetic'>/sləʊ/</span> = <span class='p-mean'>chậm → ow đọc /əʊ/</span></div>
 <div><span class='p-word'>shadow</span> <span class='p-phonetic'>/ˈʃædəʊ/</span> = <span class='p-mean'>bóng râm → ow đọc /əʊ/</span></div>
 <div><span class='hl-green'>crowded</span> <span class='p-phonetic'>/ˈkraʊdɪd/</span> = <span class='p-mean'>đông đúc → ow đọc /aʊ/</span></div>
 <div><span class='p-word'>growing</span> <span class='p-phonetic'>/ˈɡrəʊɪŋ/</span> = <span class='p-mean'>đang lớn → ow đọc /əʊ/</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"crowded" có "ow" đọc /aʊ/ (âm ao), khác hẳn ba từ kia đọc /əʊ/ (âm âu).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>slow, shadow, growing đều /əʊ/.</span></li></ol>
 <div class="tip">🧠 Mẹo: "ow" có hai cách đọc: /əʊ/ (slow, snow, grow) và /aʊ/ (now, cow, crowd, town).</div>`},
{sec:"I",num:2,type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["coun<u>s</u>ellor","<u>s</u>uburb","re<u>s</u>ident","re<u>c</u>ycle"],answer:"re<u>s</u>ident",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có âm gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>counsellor</span> <span class='p-phonetic'>/ˈkaʊnsələ/</span> = <span class='p-mean'>tư vấn viên → s đọc /s/</span></div>
 <div><span class='p-word'>suburb</span> <span class='p-phonetic'>/ˈsʌbɜːb/</span> = <span class='p-mean'>ngoại ô → s đọc /s/</span></div>
 <div><span class='hl-green'>resident</span> <span class='p-phonetic'>/ˈrezɪdənt/</span> = <span class='p-mean'>cư dân → s đọc /z/</span></div>
 <div><span class='p-word'>recycle</span> <span class='p-phonetic'>/ˌriːˈsaɪkl/</span> = <span class='p-mean'>tái chế → c đọc /s/</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Trong "resident", chữ "s" đứng giữa hai nguyên âm nên đọc là /z/ (rung). Ba từ kia đọc /s/ (không rung) → resident khác.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>counsellor /s/, suburb /s/, recycle (c) /s/ đều là /s/.</span></li></ol>
 <div class="tip">🧠 Mẹo: chữ "s" đứng giữa hai nguyên âm thường đọc /z/ (resident, music, present).</div>`},
/* II */
{sec:"II",head:"Chọn từ có trọng âm khác các từ còn lại.",num:3,type:"mcq",
 q:"3. Choose the word whose stress pattern is different.",
 disp:["vehicle","lifestyle","marketing","consumer"],answer:"consumer",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>vehicle</span> <span class='p-phonetic'>/ˈviːəkl/</span> = <span class='p-mean'>phương tiện → trọng âm 1</span></div>
 <div><span class='p-word'>lifestyle</span> <span class='p-phonetic'>/ˈlaɪfstaɪl/</span> = <span class='p-mean'>lối sống → trọng âm 1</span></div>
 <div><span class='p-word'>marketing</span> <span class='p-phonetic'>/ˈmɑːkɪtɪŋ/</span> = <span class='p-mean'>tiếp thị → trọng âm 1</span></div>
 <div><span class='hl-green'>consumer</span> <span class='p-phonetic'>/kənˈsjuːmə/</span> = <span class='p-mean'>người tiêu dùng → trọng âm 2</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"con-SU-mer" nhấn âm tiết thứ HAI, còn ba từ kia đều nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>vehicle, lifestyle, marketing đều nhấn âm 1.</span></li></ol>`},
{sec:"II",num:4,type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["optimism","popularity","generation","entertainment"],answer:"optimism",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='hl-green'>optimism</span> <span class='p-phonetic'>/ˈɒptɪmɪzəm/</span> = <span class='p-mean'>sự lạc quan → trọng âm 1</span></div>
 <div><span class='p-word'>popularity</span> <span class='p-phonetic'>/ˌpɒpjuˈlærəti/</span> = <span class='p-mean'>sự nổi tiếng → trọng âm 3</span></div>
 <div><span class='p-word'>generation</span> <span class='p-phonetic'>/ˌdʒenəˈreɪʃn/</span> = <span class='p-mean'>thế hệ → trọng âm 3</span></div>
 <div><span class='p-word'>entertainment</span> <span class='p-phonetic'>/ˌentəˈteɪnmənt/</span> = <span class='p-mean'>giải trí → trọng âm 3</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"OP-ti-mism" nhấn âm tiết ĐẦU, còn ba từ kia đều nhấn âm tiết thứ BA.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>popularity, generation, entertainment đều nhấn âm 3.</span></li></ol>`},
/* III */
{sec:"III",head:"Chọn từ hoặc cụm từ thích hợp nhất điền vào chỗ trống.",num:5,type:"mcq",
 q:"5. Maya is really ______ fashion. She likes to follow the latest trends and customise her clothes.",
 disp:["about","into","in","onto"],answer:"into",
 exp:`<div class="vnt">💬 Dịch: Maya thực sự mê thời trang. Cô ấy thích theo các xu hướng mới nhất và tự chỉnh sửa quần áo.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>about</span> = <span class='p-mean'>về</span></div><div><span class='hl-green'>into</span> = <span class='p-mean'>mê/thích thú (be into)</span></div>
 <div><span class='p-word'>in</span> = <span class='p-mean'>trong</span></div><div><span class='p-word'>onto</span> = <span class='p-mean'>lên trên</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Thành ngữ "be INTO sth" = rất thích/đam mê điều gì. "be into fashion" = mê thời trang → hợp với "thích theo xu hướng".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>about/in/onto không tạo nghĩa "đam mê" như "be into".</span></li></ol>
 <div class="tip">🧠 Nhớ: be into sth = rất thích/mê cái gì (I'm into music).</div>`},
{sec:"III",num:6,type:"mcq",
 q:"6. ______ this village is 100 years old, many of its buildings have been well-preserved.",
 disp:["Although","Since","Due to","In spite of"],answer:"Although",
 exp:`<div class="vnt">💬 Dịch: Mặc dù ngôi làng này đã 100 năm tuổi, nhiều tòa nhà của nó vẫn được bảo tồn tốt.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='hl-green'>Although</span> = <span class='p-mean'>mặc dù (+ mệnh đề)</span></div><div><span class='p-word'>Since</span> = <span class='p-mean'>vì/kể từ khi</span></div>
 <div><span class='p-word'>Due to</span> = <span class='p-mean'>do (+ danh từ)</span></div><div><span class='p-word'>In spite of</span> = <span class='p-mean'>mặc dù (+ danh từ)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Hai vế TƯƠNG PHẢN (làng cũ 100 năm nhưng nhà vẫn bảo tồn tốt). Sau chỗ trống là MỆNH ĐỀ ("this village is...") → dùng "Although + mệnh đề".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>Since (chỉ lý do – sai logic); Due to & In spite of phải đi với DANH TỪ, không đi với mệnh đề.</span></li></ol>
 <div class="tip">🧠 Nhớ: Although/Though + MỆNH ĐỀ; In spite of/Despite + DANH TỪ (cùng nghĩa "mặc dù").</div>`},
{sec:"III",num:7,type:"mcq",
 q:"7. With its elevated tracks, the ______ allows passengers to avoid the heavy traffic congestion in Bangkok.",
 disp:["underground","tram","sky train","ferry"],answer:"sky train",
 exp:`<div class="vnt">💬 Dịch: Với đường ray trên cao, tàu điện trên cao giúp hành khách tránh được tình trạng tắc đường nghiêm trọng ở Bangkok.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>underground</span> = <span class='p-mean'>tàu điện NGẦM (dưới đất)</span></div><div><span class='p-word'>tram</span> = <span class='p-mean'>xe điện (chạy trên đường)</span></div>
 <div><span class='hl-green'>sky train</span> = <span class='p-mean'>tàu điện TRÊN CAO</span></div><div><span class='p-word'>ferry</span> = <span class='p-mean'>phà (đường thủy)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"elevated tracks" (đường ray TRÊN CAO) → phương tiện chạy trên cao là "sky train" (tàu điện trên cao).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>underground chạy dưới đất; tram chạy trên mặt đường; ferry là phà — không dùng "elevated tracks".</span></li></ol>`},
{sec:"III",num:8,type:"mcq",
 q:"8. I can never meet my deadlines. Do you know ______ time management skills?",
 disp:["what to improve","what we improve","how we improve","how to improve"],answer:"how to improve",
 exp:`<div class="vnt">💬 Dịch: Mình chẳng bao giờ kịp hạn nộp. Bạn có biết làm thế nào để cải thiện kỹ năng quản lý thời gian không?</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>what to improve</span> = <span class='p-mean'>cải thiện CÁI GÌ (đã có tân ngữ rồi → sai)</span></div>
 <div><span class='p-word'>what we improve</span> = <span class='p-mean'>(mệnh đề, kém tự nhiên)</span></div>
 <div><span class='p-word'>how we improve</span> = <span class='p-mean'>(mệnh đề, kém gọn)</span></div>
 <div><span class='hl-green'>how to improve</span> = <span class='p-mean'>làm thế nào để cải thiện ✔</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Đã có tân ngữ "time management skills" (cải thiện CÁI GÌ đã rõ), điều cần biết là CÁCH → "how TO improve" (cấu trúc wh + to + V).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"what to improve" hỏi cải thiện cái gì (đã biết rồi); các mệnh đề "what/how we improve" kém gọn và không phải cấu trúc chuẩn "wh + to V".</span></li></ol>`},
{sec:"III",num:9,type:"mcq",
 q:"9. This bakery is famous because they still keep the ______ techniques passed down through generations.",
 disp:["original","modern","stylish","old-fashioned"],answer:"original",
 exp:`<div class="vnt">💬 Dịch: Tiệm bánh này nổi tiếng vì họ vẫn giữ những kỹ thuật gốc được truyền lại qua nhiều thế hệ.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='hl-green'>original</span> = <span class='p-mean'>nguyên bản, gốc</span></div><div><span class='p-word'>modern</span> = <span class='p-mean'>hiện đại</span></div>
 <div><span class='p-word'>stylish</span> = <span class='p-mean'>hợp thời trang</span></div><div><span class='p-word'>old-fashioned</span> = <span class='p-mean'>lỗi thời (nghĩa hơi tiêu cực)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"passed down through generations" (truyền qua nhiều thế hệ) → là kỹ thuật GỐC/nguyên bản được gìn giữ → "original techniques".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>modern/stylish (hiện đại) trái với "truyền qua nhiều thế hệ"; "old-fashioned" mang sắc thái chê "lỗi thời", không phù hợp lời khen tiệm bánh nổi tiếng.</span></li></ol>`},
{sec:"III",num:10,type:"mcq",
 q:"10. The authority has established workshops to ______ the traditional art of weaving.",
 disp:["shorten","preserve","process","function"],answer:"preserve",
 exp:`<div class="vnt">💬 Dịch: Chính quyền đã lập các xưởng để bảo tồn nghệ thuật dệt truyền thống.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>shorten</span> = <span class='p-mean'>làm ngắn lại</span></div><div><span class='hl-green'>preserve</span> = <span class='p-mean'>bảo tồn, gìn giữ</span></div>
 <div><span class='p-word'>process</span> = <span class='p-mean'>chế biến/xử lý</span></div><div><span class='p-word'>function</span> = <span class='p-mean'>hoạt động (động/danh từ)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Lập xưởng để giữ gìn nghề dệt truyền thống → "preserve the traditional art" (bảo tồn nghệ thuật truyền thống).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>shorten (làm ngắn), process (chế biến), function (hoạt động) không hợp nghĩa với "nghệ thuật truyền thống".</span></li></ol>`},
{sec:"III",num:11,type:"mcq",
 q:"11. The students ______ on their listening test when a loud noise ______ them.",
 disp:["focused – distracted","focused – was distracting","were focusing – distracted","were focusing – was distracting"],answer:"were focusing – distracted",
 exp:`<div class="vnt">💬 Dịch: Học sinh đang tập trung làm bài nghe thì một tiếng động lớn làm họ mất tập trung.</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>focused – distracted</span> = <span class='p-mean'>hai quá khứ đơn (sai: không diễn tả "đang...thì")</span></div>
 <div><span class='p-word'>focused – was distracting</span> = <span class='p-mean'>lẫn lộn thì</span></div>
 <div><span class='hl-green'>were focusing – distracted</span> = <span class='p-mean'>đang tập trung – bị làm gián đoạn ✔</span></div>
 <div><span class='p-word'>were focusing – was distracting</span> = <span class='p-mean'>hai tiếp diễn (sai)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Một hành động ĐANG diễn ra (quá khứ tiếp diễn "were focusing") thì bị CẮT NGANG bởi hành động ngắn (quá khứ đơn "distracted"), nối bằng "when". → were focusing ... when ... distracted.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>Cần 1 hành động dài (tiếp diễn) + 1 hành động cắt ngang (đơn). Hai đơn hoặc hai tiếp diễn đều sai công thức này.</span></li></ol>
 <div class="tip">🧠 Nhớ: was/were + V-ing + WHEN + quá khứ đơn (đang làm X thì Y xảy ra).</div>`},
{sec:"III",num:12,type:"mcq",
 q:"12. The village was bustling and lively as people were busy ______ for the festival.",
 disp:["prepare","prepared","preparing","to prepare"],answer:"preparing",
 exp:`<div class="vnt">💬 Dịch: Ngôi làng nhộn nhịp và sôi động khi mọi người bận rộn chuẩn bị cho lễ hội.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>prepare</span> = <span class='p-mean'>chuẩn bị (nguyên mẫu)</span></div><div><span class='p-word'>prepared</span> = <span class='p-mean'>(quá khứ/pp)</span></div>
 <div><span class='hl-green'>preparing</span> = <span class='p-mean'>(V-ing – busy doing)</span></div><div><span class='p-word'>to prepare</span> = <span class='p-mean'>(to-V)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Cấu trúc "be busy + V-ing" = bận rộn làm gì → "busy preparing" (bận chuẩn bị).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>Sau "busy" phải là V-ing, không dùng prepare/prepared/to prepare.</span></li></ol>
 <div class="tip">🧠 Nhớ: be busy + V-ing (busy studying, busy preparing).</div>`},
{sec:"III",num:13,type:"mcq",
 q:"13. Would you mind sharing some ______ on how to take notes during lessons?",
 disp:["priorities","tips","praises","diets"],answer:"tips",
 exp:`<div class="vnt">💬 Dịch: Bạn có phiền chia sẻ vài mẹo về cách ghi chép trong giờ học không?</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>priorities</span> = <span class='p-mean'>các ưu tiên</span></div><div><span class='hl-green'>tips</span> = <span class='p-mean'>các mẹo, lời khuyên</span></div>
 <div><span class='p-word'>praises</span> = <span class='p-mean'>lời khen</span></div><div><span class='p-word'>diets</span> = <span class='p-mean'>chế độ ăn kiêng</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"share some tips ON how to..." = chia sẻ vài MẸO về cách làm gì → "tips" hợp nghĩa "cách ghi chép".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>priorities/praises/diets không hợp với "cách ghi chép trong giờ học".</span></li></ol>`},
{sec:"III",num:14,type:"mcq",
 q:'14. Tracy: "I\'m attending a pottery workshop this weekend. Want to go together?" – Betty: "______ I\'ve always wanted to try pottery."',
 disp:["Pottery seems boring to me.","What does pottery mean?","Don't worry about it.","That sounds fun."],answer:"That sounds fun.",
 exp:`<div class="vnt">💬 Dịch: Tracy: "Cuối tuần này mình đi lớp làm gốm. Đi cùng không?" – Betty: "Nghe vui đấy. Mình luôn muốn thử làm gốm."</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>Pottery seems boring to me.</span> = <span class='p-mean'>Gốm nhàm chán với mình. (trái với "luôn muốn thử")</span></div>
 <div><span class='p-word'>What does pottery mean?</span> = <span class='p-mean'>Gốm nghĩa là gì? (lạc)</span></div>
 <div><span class='p-word'>Don't worry about it.</span> = <span class='p-mean'>Đừng lo về điều đó. (lạc)</span></div>
 <div><span class='hl-green'>That sounds fun.</span> = <span class='p-mean'>Nghe vui đấy. ✔</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Betty nói tiếp "I've always wanted to try pottery" (luôn muốn thử) → cô ấy HÀO HỨNG nhận lời → "That sounds fun." (Nghe vui đấy).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"boring" trái với việc "luôn muốn thử"; hai câu còn lại lạc chủ đề.</span></li></ol>`},
/* IV. SIGNS */
{sec:"IV",head:"Nhìn biển báo/thông báo và chọn đáp án đúng.",num:15,type:"mcq",
 q:`15. What does the sign mean?
 <div class="signbox"><svg viewBox="0 0 220 214" width="185" height="180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Biển FRAGILE cầm nhẹ tay dễ vỡ">
   <rect x="12" y="8" width="196" height="198" rx="10" fill="#fff" stroke="#1a2b4a" stroke-width="4"/>
   <text x="110" y="46" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="26" fill="#c0392b" letter-spacing="2">FRAGILE</text>
   <g transform="translate(110,116)" fill="#2c3e50">
     <path d="M-24 -40 L24 -40 L16 -6 Q0 10 0 10 Q0 10 -16 -6 Z"/>
     <rect x="-3" y="10" width="6" height="34"/>
     <ellipse cx="0" cy="48" rx="22" ry="5"/>
     <path d="M24 -40 L37 -49 L32 -33 Z"/>
   </g>
   <polyline points="104,76 112,92 106,102 113,112" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
   <text x="110" y="192" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="13" fill="#1a2b4a" letter-spacing="1">HANDLE WITH CARE</text>
 </svg></div>`,
 disp:["Handle the item gently – it breaks easily.","Keep this item in a fragile place.","Don't move this fragile item elsewhere.","Be careful when using this item for drinking."],
 answer:"Handle the item gently – it breaks easily.",
 exp:`<div class="vnt">💬 Dịch: <strong>Handle the item gently – it breaks easily.</strong> (Hãy cầm nhẹ tay – món đồ dễ vỡ.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='hl-green'>A. Handle the item gently – it breaks easily.</span> = <span class='p-mean'>Cầm nhẹ tay – nó dễ vỡ. ✔</span></div>
 <div><span class='p-word'>B. Keep this item in a fragile place.</span> = <span class='p-mean'>Để món đồ ở nơi dễ vỡ. (vô nghĩa)</span></div>
 <div><span class='p-word'>C. Don't move this fragile item elsewhere.</span> = <span class='p-mean'>Đừng di chuyển món đồ dễ vỡ này. (sai)</span></div>
 <div><span class='p-word'>D. Be careful when using this item for drinking.</span> = <span class='p-mean'>Cẩn thận khi dùng để uống. (lạc)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"FRAGILE" = dễ vỡ; "HANDLE WITH CARE" = cầm/xử lý cẩn thận. Hình ly bị nứt/vỡ → nhắc "cầm nhẹ tay vì dễ vỡ" = câu A.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>B, C, D không đúng ý "cẩn thận vì dễ vỡ".</span></li></ol>
 <div class="tip">🧠 FRAGILE = dễ vỡ; HANDLE WITH CARE = cầm/vận chuyển nhẹ nhàng, cẩn thận.</div>`},
{sec:"IV",num:16,type:"mcq",
 q:`16. What does the notice mean?
 <div class="signbox"><svg viewBox="0 0 220 214" width="185" height="180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thông báo tối đa 4 người mỗi lần trong thang máy">
   <rect x="12" y="8" width="196" height="54" rx="10" fill="#1a2b4a"/>
   <text x="110" y="32" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="17" fill="#fff">MAXIMUM 4</text>
   <text x="110" y="52" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="15" fill="#fff">PERSONS AT A TIME</text>
   <g fill="#2c3e50">
     <circle cx="44" cy="98" r="10"/><path d="M28 152 Q28 114 44 114 Q60 114 60 152 Z"/>
     <circle cx="88" cy="98" r="10"/><path d="M72 152 Q72 114 88 114 Q104 114 104 152 Z"/>
     <circle cx="132" cy="98" r="10"/><path d="M116 152 Q116 114 132 114 Q148 114 148 152 Z"/>
     <circle cx="176" cy="98" r="10"/><path d="M160 152 Q160 114 176 114 Q192 114 192 152 Z"/>
   </g>
   <text x="110" y="192" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="14" fill="#c0392b" letter-spacing="2">PERSONS MAX</text>
 </svg></div>`,
 disp:["The lift can go up to the 4th floor.","The lift is available for 4 people every day.","The maximum number of people allowed in the lift is 4.","A group of 4 people can book the lift for a day."],
 answer:"The maximum number of people allowed in the lift is 4.",
 exp:`<div class="vnt">💬 Dịch: <strong>The maximum number of people allowed in the lift is 4.</strong> (Số người tối đa được phép trong thang máy là 4.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. The lift can go up to the 4th floor.</span> = <span class='p-mean'>Thang máy lên đến tầng 4. (hiểu nhầm "4")</span></div>
 <div><span class='p-word'>B. The lift is available for 4 people every day.</span> = <span class='p-mean'>Thang dành cho 4 người mỗi ngày. (sai)</span></div>
 <div><span class='hl-green'>C. The maximum number of people allowed in the lift is 4.</span> = <span class='p-mean'>Số người tối đa trong thang là 4. ✔</span></div>
 <div><span class='p-word'>D. A group of 4 people can book the lift for a day.</span> = <span class='p-mean'>Nhóm 4 người có thể đặt thang cả ngày. (sai)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"MAXIMUM 4 PERSONS AT A TIME" (tối đa 4 người mỗi lần) + "PERSONS MAX" + hình 4 người → số người tối đa trong thang là 4.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"4" ở đây là SỐ NGƯỜI tối đa, không phải tầng 4 (A), không phải đặt thang (B, D).</span></li></ol>
 <div class="tip">🧠 maximum = tối đa; "at a time" = mỗi lần. MAXIMUM 4 PERSONS = nhiều nhất 4 người.</div>`},
/* VII. WORD FORM */
{sec:"VII",head:"Chia đúng dạng của từ trong ngoặc. (Gõ đáp án vào ô)",num:29,type:"fill",
 q:"29. Listening to instrumental music is good for tasks that require ______. (attend)",
 accept:["attention"],
 exp:`<div class="vnt">💬 Dịch: Nghe nhạc không lời tốt cho những việc đòi hỏi sự tập trung.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>attention</span> (danh từ).</li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Sau động từ "require" (đòi hỏi) cần một DANH TỪ. Động từ "attend" → danh từ "attention" (sự chú ý/tập trung). "require attention" = đòi hỏi sự tập trung.</span></li></ol>
 <div class="tip">🧠 attend (v) → attention (n) → attentive (adj).</div>`},
{sec:"VII",num:30,type:"fill",
 q:"30. It's ______ accepted that exercise plays a key role in keeping fit. (common)",
 accept:["commonly"],
 exp:`<div class="vnt">💬 Dịch: Người ta thường công nhận rằng tập thể dục đóng vai trò then chốt trong việc giữ dáng.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>commonly</span> (trạng từ).</li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Chỗ trống bổ nghĩa cho động từ "accepted" (được công nhận) → cần TRẠNG TỪ. "common" (adj) → "commonly" (adv) = một cách phổ biến. "commonly accepted" = được công nhận rộng rãi.</span></li></ol>
 <div class="tip">🧠 Mẹo: bổ nghĩa cho ĐỘNG TỪ dùng TRẠNG TỪ (đuôi -ly).</div>`},
{sec:"VII",num:31,type:"fill",
 q:"31. Artisans kept the craft alive by ______ their original techniques. (maintenance)",
 accept:["maintaining"],
 exp:`<div class="vnt">💬 Dịch: Các nghệ nhân đã giữ cho nghề này tồn tại bằng cách duy trì những kỹ thuật gốc của họ.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>maintaining</span> (V-ing).</li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Sau giới từ "by" (bằng cách) cần ĐỘNG TỪ dạng V-ing. Danh từ "maintenance" → động từ "maintain" → "maintaining". "by maintaining ... techniques" = bằng cách duy trì kỹ thuật.</span></li></ol>
 <div class="tip">🧠 Nhớ: giới từ (by, of, in, without...) + V-ing. maintenance (n) → maintain (v).</div>`},

 <div class="tip">🧠 value (n) → valuable (adj) = quý giá; đừng nhầm với "valueless" (vô giá trị).</div>`},

 <div class="tip">🧠 Nhớ: -ing tả VẬT gây cảm xúc (entertaining book); -ed tả NGƯỜI có cảm xúc (I was entertained).</div>`},

 <div class="tip">🧠 Nhớ: the majority of + N (đa số); trái nghĩa: the minority (thiểu số).</div>`},

 Mia decided to ______ by wearing a blue wedding dress instead of white.`,

 <ol><li>Đáp án đúng: <span class='hl-green'>break with tradition</span>.</li>

/* IX. REWRITE */
{sec:"IX",head:"Viết lại câu sao cho nghĩa KHÔNG đổi. (Chỉ cần gõ TIẾP phần sau gợi ý — KHÔNG phải gõ lại chữ đã cho; hoặc gõ CẢ CÂU cũng được, chấm điểm linh hoạt.)",num:37,type:"rewrite",
 q:"37. She caught the flu after attending a crowded party last weekend.",
 prefix:"She came",
 accept:["down with the flu after attending a crowded party last weekend"],
 exp:`<div class="vnt">💬 Dịch: Cô ấy bị cúm sau khi tham dự một bữa tiệc đông người vào cuối tuần trước.</div>
 <ol><li>Đáp án đúng: She came <span class='hl-green'>down with the flu after attending a crowded party last weekend.</span></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"catch the flu" = "come down with the flu" (bị/mắc cúm). Đổi "caught" thành "came down with", giữ nguyên phần còn lại.</span></li></ol>
 <div class="tip">🧠 Nhớ: come down with + bệnh = bị nhiễm/mắc bệnh nhẹ (come down with a cold/the flu).</div>`},
{sec:"IX",num:38,type:"rewrite",
 q:"38. I share an apartment with another friend because housing in the city is very pricey.",
 prefix:"Housing in the city",
 accept:["is very pricey, so I share an apartment with another friend","is very pricey so I share an apartment with another friend"],
 exp:`<div class="vnt">💬 Dịch: Nhà ở thành phố rất đắt đỏ, nên tôi ở chung căn hộ với một người bạn khác.</div>
 <ol><li>Đáp án đúng: Housing in the city <span class='hl-green'>is very pricey, so I share an apartment with another friend.</span></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Câu gốc "B because A" (B vì A) đổi thành "A, so B" (A nên B): đưa lý do "housing is very pricey" lên trước, dùng "so" nối kết quả.</span></li></ol>
 <div class="tip">🧠 Quy đổi: "B because A" ⇔ "A, so B" (đảo nguyên nhân – kết quả).</div>`},
{sec:"IX",num:39,type:"rewrite",
 q:"39. As social media gets more popular, the need for real-life connections becomes stronger.",
 prefix:"The more",
 accept:["popular social media gets, the stronger the need for real-life connections becomes","popular social media gets the stronger the need for real-life connections becomes"],
 exp:`<div class="vnt">💬 Dịch: Mạng xã hội càng phổ biến thì nhu cầu kết nối ngoài đời thực càng mạnh mẽ.</div>
 <ol><li>Đáp án đúng: The more <span class='hl-green'>popular social media gets, the stronger the need for real-life connections becomes.</span></li>

 <div class="tip">🧠 Nhớ so sánh kép: The + comparative + S + V, the + comparative + S + V (càng...càng...).</div>`},
{sec:"IX",num:40,type:"rewrite",
 q:"40. Driving a car is not so convenient as taking the metro during rush hour.",
 prefix:"Taking the metro is",

 exp:`<div class="vnt">💬 Dịch: Đi tàu điện tiện lợi hơn lái ô tô vào giờ cao điểm.</div>
 <ol><li>Đáp án đúng: Taking the metro is <span class='hl-green'>more convenient than driving a car during rush hour.</span></li>

 <div class="tip">🧠 Quy đổi: "A not so + adj + as B" ⇔ "B + more + adj + than A".</div>`}
];

/* ===== AUDIO ===== */
let AC;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function ding(){const c=ac(),n=c.currentTime;[880,1320,1760].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,n+i*.08);g.gain.linearRampToValueAtTime(.25,n+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.4);o.start(n+i*.08);o.stop(n+i*.08+.42)})}
function buzz(){const c=ac(),n=c.currentTime;[300,220,160].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,n+i*.13);g.gain.exponentialRampToValueAtTime(.001,n+i*.13+.12);o.start(n+i*.13);o.stop(n+i*.13+.13)})}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d'),cols=['#ffd60a','#ff4b5c','#3a86ff','#00D26A','#8338ec','#ff8c42'],P=[];for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});let t=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);t++;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore()});if(t<130)requestAnimationFrame(loop);else cv.remove()})()}

/* ===== HELPERS ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return(s||'').toLowerCase().replace(/won['’]t/g,'will not').replace(/can['’]t/g,'can not').replace(/n['’]t/g,' not').replace(/['’]/g,'').replace(/[.,!?;:"…\/–-]/g,' ').replace(/\s+/g,' ').trim()}
const state={};let answered=0;const TOTAL=DATA.length;
function updateProg(){document.getElementById('progtxt').textContent=answered+' / '+TOTAL;document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%'}

/* ===== RENDER ===== */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){const s=document.createElement('div');s.className='sec';s.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;quiz.appendChild(s)}
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  const zone=document.createElement('div');card.appendChild(zone);
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=it.exp;card.appendChild(exp);
  quiz.appendChild(card);
  if(it.type==='mcq')renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill')renderFill(it,idx,zone,exp);
  else if(it.type==='rewrite')renderRewrite(it,idx,zone,exp);
});
updateProg();
function markDone(idx,ok){if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg()}}
function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div');wrap.className='opts';
  shuffle(it.disp).forEach(txt=>{
    const b=document.createElement('div');b.className='opt';b.innerHTML=txt;
    b.onclick=()=>{if(state[idx])return;const all=wrap.querySelectorAll('.opt');all.forEach(x=>x.classList.add('locked'));
      if(txt===it.answer){b.classList.add('correct');ding();confetti();markDone(idx,true)}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim')});setTimeout(()=>b.classList.remove('shake'),450)}
      exp.classList.add('open')};
    wrap.appendChild(b)});
  zone.appendChild(wrap);
}
function renderFill(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='💡 '+it.hint;zone.appendChild(h)}
  const acc=it.accept.map(norm);
  function check(){if(state[idx])return;const ok=acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderRewrite(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const pre=document.createElement('span');pre.className='prefix';pre.textContent=it.prefix+' ...';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Gõ tiếp phần còn lại...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(pre);row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  const h=document.createElement('div');h.className='hint';
  h.textContent='💡 Chỉ cần gõ TIẾP phần sau "'+it.prefix+'" (không cần gõ lại chữ gợi ý). Gõ cả câu cũng được nhé!';
  zone.appendChild(h);
  const contN=it.accept.map(norm),preN=norm(it.prefix),fullN=it.accept.map(a=>norm(it.prefix+' '+a));
  function check(){if(state[idx])return;let inN=norm(inp.value),stripped=inN;
    if(inN.startsWith(preN+' '))stripped=inN.slice(preN.length).trim();else if(inN===preN)stripped='';
    const ok=contN.includes(inN)||contN.includes(stripped)||fullN.includes(inN);inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
/* ===== SUBMIT ===== */
function openName(){document.getElementById('nameMask').classList.add('show');setTimeout(()=>document.getElementById('nameInput').focus(),100)}
function doSubmit(){const inp=document.getElementById('nameInput'),w=document.getElementById('nameWarn'),name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return}inp.classList.remove('err');w.textContent='';document.getElementById('nameMask').classList.remove('show');showResult(name)}
function showResult(name){let correct=0;for(let i=0;i<TOTAL;i++)if(state[i]==='ok')correct++;const pct=correct/TOTAL,s10=(pct*10).toFixed(2);let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con là siêu anh hùng thực thụ! 🏆';fb='🏆🦸🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif'}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa nhé! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif'}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi chiến lại nha! 💥';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif'}
  document.getElementById('resGreet').textContent=greet;document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'),fbEl=document.getElementById('resFallback');fbEl.textContent=fb;fbEl.style.display='none';im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none'};im.onerror=()=>{im.style.display='none';fbEl.style.display='block'};im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block'}},2500);
  document.getElementById('resMask').classList.add('show');if(pct>=0.6){confetti();ding()}}
/* ===== FLOATS ===== */
(function(){const icons=['💥','⭐','⚡','🌟','🔥','💫','🏆','🎯','🚀','🎉','👊','✨','🦸'];const p=document.getElementById('pattern');
  for(let i=0;i<14;i++){const s=document.createElement('span');s.className='float';s.textContent=icons[i%icons.length];s.style.left=Math.random()*100+'%';s.style.animationDuration=(17+Math.random()*17)+'s';s.style.animationDelay=(-Math.random()*24)+'s';s.style.fontSize=(1.6+Math.random()*1.9)+'rem';p.appendChild(s)}})();
</script>
