<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 1 · Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#2bb673; --p3:#00c9a7; --p4:#ff9a3d; --p5:#43cea2;
  --green:#00D26A; --red:#FF4757; --ink:#1e4633;
  --glow:#a8e063; --glow2:#ff9a3d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
  line-height:1.55; overflow-x:hidden; position:relative;
  background:linear-gradient(-45deg,#2bb673,#43cea2,#a8e063,#ffd93d,#ff9a3d,#2bb673);
  background-size:400% 400%; animation:bgmove 18s ease infinite;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.4rem;opacity:.34;animation:floaty linear infinite;filter:drop-shadow(0 4px 6px rgba(20,60,30,.25))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0) rotate(0deg)}50%{transform:translateY(50vh) translateX(22px) rotate(180deg)}100%{transform:translateY(-15vh) translateX(-10px) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}

.topbar{
  text-align:center;background:rgba(255,255,255,.22);backdrop-filter:blur(14px);
  border:1.5px solid rgba(168,224,99,.6);border-radius:22px;padding:14px 16px;margin-bottom:16px;
  box-shadow:0 0 26px rgba(168,224,99,.35),0 10px 30px rgba(20,60,30,.25);
}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(43,182,115,.65);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 10px var(--glow),0 3px 10px rgba(20,60,30,.35)}
.topbar p{font-size:.78rem;color:#f3fff0;opacity:.97;margin-top:2px}

.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(20,70,40,.24);backdrop-filter:blur(12px);border-radius:30px;padding:5px;border:1.5px solid rgba(168,224,99,.45);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.4);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s ease;box-shadow:0 0 10px var(--glow)}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(20,60,30,.4)}

.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;font-weight:900;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 16px rgba(255,154,61,.5)}
.sec h2{color:#fff;font-size:1.02rem;font-weight:800;text-shadow:0 1px 6px rgba(20,60,30,.4);flex:1}

.card{
  background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:20px;
  padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(168,224,99,.5);
  box-shadow:0 0 20px rgba(168,224,99,.16),0 12px 26px rgba(20,60,30,.2);
}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#7ed957);color:#20551f;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 0 12px rgba(168,224,99,.6)}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}

.passage{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid var(--glow2);border-radius:12px;padding:10px 13px;margin:10px 0;font-weight:600;line-height:1.65;font-size:1.02rem;color:#6a4a1b}
.orderbox{margin:10px 0;display:flex;flex-direction:column;gap:9px}
.orderbox>div{background:rgba(43,182,115,.09);border:1.5px solid rgba(43,182,115,.22);border-radius:12px;padding:10px 13px;font-size:1.02rem;font-weight:600;line-height:1.55}
.orderbox b{color:var(--p1);font-size:1.08rem;margin-right:3px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{
  background:linear-gradient(135deg,#fff,#f0fff2);border:2px solid rgba(43,182,115,.25);
  border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;
  box-shadow:0 6px 0 rgba(43,182,115,.24),0 8px 14px rgba(20,60,30,.12);
  transition:transform .12s ease,box-shadow .12s ease,background .2s;text-align:center;user-select:none;
}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(43,182,115,.3),0 0 18px rgba(168,224,99,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e,0 0 18px rgba(0,210,106,.6)}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}
.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{
  font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;
  border:2px solid rgba(43,182,115,.35);background:rgba(255,255,255,.95);outline:none;flex:1;min-width:180px;color:var(--ink);
  box-shadow:inset 0 2px 5px rgba(20,60,30,.08);
}
.tin:focus{border-color:var(--glow2);box-shadow:0 0 0 4px rgba(255,154,61,.2)}
.tin.ok{border-color:var(--green);background:#eafff3}
.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.1rem;font-weight:800;color:var(--p1)}
.btn-check{
  font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--glow2),var(--p1));padding:11px 18px;border-radius:14px;
  box-shadow:0 5px 0 rgba(20,120,70,.4),0 0 14px rgba(255,154,61,.4);transition:transform .1s;
}
.btn-check:hover{transform:translateY(-2px)}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(20,120,70,.4)}
.hint{font-size:.82rem;color:#1f8a5a;font-weight:600;margin-top:7px;font-style:italic}

.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{
  width:46px;height:46px;border-radius:14px;border:2px solid rgba(43,182,115,.3);
  background:linear-gradient(135deg,#fff,#f0fff2);font-weight:900;font-size:1.1rem;cursor:pointer;color:var(--p1);
  box-shadow:0 5px 0 rgba(43,182,115,.24);transition:transform .12s;
}
.lbtn:hover:not(.locked){transform:scale(1.08);box-shadow:0 5px 0 rgba(43,182,115,.24),0 0 14px rgba(168,224,99,.6)}
.lbtn.sel{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;box-shadow:0 0 14px rgba(255,154,61,.6)}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}
.corrbox.show{display:block}

.exp{max-height:0;overflow:hidden;transition:max-height .5s ease,margin .3s,padding .3s;background:rgba(43,182,115,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2000px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(43,182,115,.3)}
.exp ol{margin:6px 0 2px 18px}
.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#eafff0,#fff6e0);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#1f7a55;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.p-word{color:#2563eb;font-weight:800}
.hl-green{color:#0a9d54;font-weight:900}
.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(43,182,115,.15);color:#1f7a55;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}
.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}

.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{
  font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--glow2),var(--p1),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;
  padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(20,120,70,.4),0 0 28px rgba(168,224,99,.5);transition:transform .1s;
}
.btn-submit:hover{transform:translateY(-3px)}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(20,120,70,.4)}

.mask{position:fixed;inset:0;background:rgba(20,50,30,.55);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:rgba(255,255,255,.97);border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px rgba(168,224,99,.4),0 20px 50px rgba(20,50,30,.4);border:2px solid rgba(168,224,99,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#3a5a48;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(43,182,115,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}
.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:floaty2 2s ease-in-out infinite}
@keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p3),var(--p5));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(0,150,140,.4)}
.btn-again:hover{transform:translateY(-2px)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#f3fff0;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>

<div class="wrap">
  <div class="topbar">
    <div class="tag">🦜 Giáo viên tạo: Ms MS Chí Nên</div>
    <h1>🌴 TEST 1</h1>
    <p>The First Midterm Tests · Jungle English</p>
  </div>

  <div class="prog">
    <div class="txt" id="progtxt">0 / 26</div>
    <div class="bar"><div class="fill" id="progfill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="submit-wrap">
    <button class="btn-submit" onclick="openName()">🐘 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>

  <div class="footer">✨ Made with love for young explorers · Ms MS Chí Nên ✨</div>
</div>

<div class="mask" id="nameMask">
  <div class="modal">
    <h2>🐵 Nhà thám hiểm tên gì nào?</h2>
    <p>Nhập tên của con để xem kết quả nhé!</p>
    <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
    <div class="warn" id="nameWarn"></div>
    <button class="btn-again" style="background:linear-gradient(135deg,var(--glow2),var(--p1));box-shadow:0 6px 0 rgba(20,120,70,.4)" onclick="doSubmit()">Xem kết quả 🎉</button>
  </div>
</div>

<div class="mask" id="resMask">
  <div class="modal">
    <h2 id="resGreet"></h2>
    <div class="score-big" id="resScore"></div>
    <div class="score-10" id="resScore10"></div>
    <img class="meme" id="resMeme" alt="meme" style="display:none">
    <div class="meme-fallback" id="resFallback"></div>
    <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
    <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
/* ================= DATA (TEST 1 - mid_9) ================= */
const DATA=[
/* ---------- I. PHONETICS ---------- */
{sec:"I", head:"Chọn từ có phần gạch chân được phát âm khác các từ còn lại.", num:1, type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["tr<u>a</u>m","g<u>a</u>rbage","biog<u>a</u>s","<u>a</u>nxiety"],
 answer:"g<u>a</u>rbage",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "a" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>tram</span> <span class='wt'>n</span> <span class='p-phonetic'>/træm/</span> = <span class='p-mean'>xe điện → a đọc /æ/</span></div>
 <div><span class='hl-green'>garbage</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈɡɑːbɪdʒ/</span> = <span class='p-mean'>rác → a đọc /ɑː/</span></div>
 <div><span class='p-word'>biogas</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈbaɪəʊɡæs/</span> = <span class='p-mean'>khí sinh học → a đọc /æ/</span></div>
 <div><span class='p-word'>anxiety</span> <span class='wt'>n</span> <span class='p-phonetic'>/æŋˈzaɪəti/</span> = <span class='p-mean'>sự lo âu → a đọc /æ/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"garbage" có "a" đọc dài /ɑː/ (âm a dài), khác hẳn ba từ kia đọc /æ/ (âm e bẹt, ngắn).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>tram, biogas, anxiety đều có "a" đọc /æ/ nên giống nhau.</span></li></ol>`},

{sec:"I", num:2, type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["pro<u>c</u>ess","con<u>c</u>rete","se<u>c</u>urity","en<u>c</u>ourage"],
 answer:"pro<u>c</u>ess",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "c" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>process</span> <span class='wt'>n/v</span> <span class='p-phonetic'>/ˈprəʊses/</span> = <span class='p-mean'>quá trình → c đọc /s/</span></div>
 <div><span class='p-word'>concrete</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈkɒŋkriːt/</span> = <span class='p-mean'>bê tông → c đọc /k/</span></div>
 <div><span class='p-word'>security</span> <span class='wt'>n</span> <span class='p-phonetic'>/sɪˈkjʊərəti/</span> = <span class='p-mean'>an ninh → c đọc /k/</span></div>
 <div><span class='p-word'>encourage</span> <span class='wt'>v</span> <span class='p-phonetic'>/ɪnˈkʌrɪdʒ/</span> = <span class='p-mean'>khích lệ → c đọc /k/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trong "process", chữ "c" đứng trước "e" nên đọc là /s/. Ba từ kia có "c" đứng trước phụ âm/nguyên âm o, u → đọc /k/ → process khác biệt.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>concrete (c + r), security (c + u), encourage (c + ou) đều đọc /k/.</span></li></ol>
 <div class="tip">🧠 Mẹo: chữ "c" đọc /s/ khi đứng trước e, i, y (city, process); đọc /k/ khi đứng trước a, o, u hoặc phụ âm (cat, cost, cut, concrete).</div>`},

/* ---------- II. STRESS ---------- */
{sec:"II", head:"Chọn từ có trọng âm khác các từ còn lại.", num:3, type:"mcq",
 q:"3. Choose the word whose stress pattern is different.",
 disp:["firefighter","hygiene","suburb","technique"],
 answer:"technique",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>firefighter</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈfaɪəfaɪtə/</span> = <span class='p-mean'>lính cứu hỏa → trọng âm 1</span></div>
 <div><span class='p-word'>hygiene</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈhaɪdʒiːn/</span> = <span class='p-mean'>vệ sinh → trọng âm 1</span></div>
 <div><span class='p-word'>suburb</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈsʌbɜːb/</span> = <span class='p-mean'>vùng ngoại ô → trọng âm 1</span></div>
 <div><span class='hl-green'>technique</span> <span class='wt'>n</span> <span class='p-phonetic'>/tekˈniːk/</span> = <span class='p-mean'>kĩ thuật → trọng âm 2</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"tech-NIQUE" nhấn âm tiết thứ HAI, còn ba từ kia đều nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>firefighter, hygiene, suburb đều nhấn âm tiết 1 nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: đuôi "-ique" luôn được nhấn (tech-NIQUE, u-NIQUE, an-TIQUE).</div>`},

{sec:"II", num:4, type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["additional","obedient","overcrowded","facility"],
 answer:"overcrowded",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>additional</span> <span class='wt'>adj</span> <span class='p-phonetic'>/əˈdɪʃənl/</span> = <span class='p-mean'>thêm vào → trọng âm 2</span></div>
 <div><span class='p-word'>obedient</span> <span class='wt'>adj</span> <span class='p-phonetic'>/əˈbiːdiənt/</span> = <span class='p-mean'>vâng lời → trọng âm 2</span></div>
 <div><span class='hl-green'>overcrowded</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˌəʊvəˈkraʊdɪd/</span> = <span class='p-mean'>quá đông đúc → trọng âm 3</span></div>
 <div><span class='p-word'>facility</span> <span class='wt'>n</span> <span class='p-phonetic'>/fəˈsɪləti/</span> = <span class='p-mean'>cơ sở vật chất → trọng âm 2</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"o-ver-CROW-ded" nhấn âm tiết thứ BA, còn ba từ kia đều nhấn âm tiết thứ HAI.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>additional, obedient, facility đều nhấn âm tiết 2 nên giống nhau.</span></li></ol>`},

/* ---------- III. MCQ ---------- */
{sec:"III", head:"Chọn từ hoặc cụm từ thích hợp nhất điền vào chỗ trống.", num:5, type:"mcq",
 q:"5. Finding the balance ______ work and personal life helps promote better health.",
 disp:["in","among","between","about"],
 answer:"between",
 exp:`<div class="vnt">💬 Dịch: <strong>Finding the balance between work and personal life helps promote better health.</strong> (Tìm được sự cân bằng giữa công việc và cuộc sống cá nhân giúp nâng cao sức khỏe.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>trong</span></div>
 <div><span class='p-word'>among</span> <span class='wt'>prep</span> = <span class='p-mean'>giữa (3+ thứ)</span></div>
 <div><span class='hl-green'>between</span> <span class='wt'>prep</span> = <span class='p-mean'>giữa (2 thứ)</span></div>
 <div><span class='p-word'>about</span> <span class='wt'>prep</span> = <span class='p-mean'>về</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm "balance BETWEEN A and B" = sự cân bằng giữa HAI thứ (work / personal life). Vì có đúng 2 đối tượng nên dùng "between".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"among" dùng cho 3 thứ trở lên; in/about không hợp với "balance".</span></li></ol>
 <div class="tip">🧠 Nhớ: between (giữa 2) ≠ among (giữa 3 trở lên). "balance between A and B".</div>`},

 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>delivery person</span> <span class='wt'>n</span> = <span class='p-mean'>người giao hàng</span></div>
 <div><span class='p-word'>police officer</span> <span class='wt'>n</span> = <span class='p-mean'>cảnh sát</span></div>
 <div><span class='p-word'>garbage collector</span> <span class='wt'>n</span> = <span class='p-mean'>người thu gom rác</span></div>

{sec:"III", num:7, type:"mcq",

 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>prior</span> <span class='wt'>adj</span> = <span class='p-mean'>trước đó</span></div>
 <div><span class='p-word'>prioritise</span> <span class='wt'>v</span> = <span class='p-mean'>ưu tiên (động từ)</span></div>

 <div><span class='p-word'>how</span> <span class='wt'>wh</span> = <span class='p-mean'>như thế nào</span></div>

{sec:"III", num:12, type:"mcq",
 q:"12. Thanks to lots of surveillance cameras, my city is ______ it used to be years ago.",
 disp:["more safer than","much safer than","much more safer","much safer"],
 answer:"much safer than",
 exp:`<div class="vnt">💬 Dịch: <strong>Thanks to lots of surveillance cameras, my city is much safer than it used to be years ago.</strong> (Nhờ có nhiều camera giám sát, thành phố của tôi an toàn hơn nhiều so với vài năm trước.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>more safer than</span> = <span class='p-mean'>sai (thừa "more" + "safer")</span></div>
 <div><span class='hl-green'>much safer than</span> = <span class='p-mean'>an toàn hơn nhiều</span></div>
 <div><span class='p-word'>much more safer</span> = <span class='p-mean'>sai (thừa "more") + thiếu "than"</span></div>
 <div><span class='p-word'>much safer</span> = <span class='p-mean'>thiếu "than"</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>So sánh hơn của "safe" (tính từ ngắn) là "safer". Muốn nhấn mạnh "hơn nhiều" thì thêm "much" trước: "much safer than". Có mệnh đề so sánh nên cần "than".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"more safer" là lỗi so sánh kép (đã "safer" thì không "more"); "much more safer" cũng sai kép và thiếu "than"; "much safer" thiếu "than" để so sánh với vế sau.</span></li></ol>
 <div class="tip">🧠 Nhớ: tính từ ngắn → "-er + than"; tăng mức độ dùng "much/far + so sánh hơn" (much safer than).</div>`},

 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>can (có thể), should (nên), may (có lẽ/được phép) không diễn tả sự bắt buộc gây căng thẳng.</span></li></ol>`},

{sec:"III", num:14, type:"mcq",
 q:'14. Student: "I don\'t understand this maths problem. Could you explain it to me, please?" – Teacher: "______ Let me walk you through it step by step."',
 disp:["That's so kind of you.","Yes, I like it.","Not at all.","Of course."],
 answer:"Of course.",
 exp:`<div class="vnt">💬 Dịch: <strong>Student: "I don't understand this maths problem. Could you explain it to me, please?" – Teacher: "Of course. Let me walk you through it step by step."</strong> (Học sinh: "Em không hiểu bài toán này. Thầy/cô giải thích giúp em được không ạ?" – Giáo viên: "Tất nhiên rồi. Để thầy/cô hướng dẫn em từng bước nhé.")</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='p-word'>That's so kind of you.</span> = <span class='p-mean'>Bạn thật tốt bụng. (đáp lời cảm ơn/khen)</span></div>
 <div><span class='p-word'>Yes, I like it.</span> = <span class='p-mean'>Vâng, tôi thích nó. (lạc đề)</span></div>
 <div><span class='p-word'>Not at all.</span> = <span class='p-mean'>Không có gì. (đáp lời cảm ơn)</span></div>
 <div><span class='hl-green'>Of course.</span> = <span class='p-mean'>Tất nhiên rồi. (đồng ý giúp)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Học sinh NHỜ giúp đỡ ("Could you explain...?"). Giáo viên đồng ý giúp → "Of course." (Tất nhiên rồi) + đề nghị hướng dẫn từng bước.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"That's so kind of you"/"Not at all" là câu đáp lời cảm ơn; "Yes, I like it" lạc chủ đề.</span></li></ol>`},

/* ---------- VI. ERROR CORRECTION ---------- */
{sec:"VI", head:"Tìm lỗi sai. Bấm chữ cái chứa lỗi, rồi gõ từ SỬA ĐÚNG.", num:27, type:"error",
 q:"27. <u>Despite of</u> having different opinions, they <u>managed to</u> get <u>on with</u> each other <u>during</u> the group discussion.",
 parts:["Despite of","managed to","on with","during"],
 correctLetter:0, corrAccept:["despite","in spite of"],
 exp:`<div class="vnt">💬 Dịch: <strong>Despite having different opinions, they managed to get on with each other during the group discussion.</strong> (Mặc dù có những ý kiến khác nhau, họ vẫn hòa thuận với nhau trong buổi thảo luận nhóm.)</div>
 <ol><li>Lỗi sai ở cụm <b>Despite of</b> → sửa thành <span class='hl-green'>Despite</span> (bỏ "of").</li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Despite" KHÔNG bao giờ đi kèm "of". Đúng phải là "Despite + N/V-ing" HOẶC "In spite of + N/V-ing". Vì thế "Despite of" là sai, phải bỏ "of" → "Despite".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>managed to (xoay xở làm được – đúng), get on with (hòa thuận với – đúng), during (trong suốt – đúng). Chỉ "Despite of" sai.</span></li></ol>
 <div class="tip">🧠 Nhớ: Despite + N (KHÔNG "of") = In spite OF + N. Đừng lẫn "Despite of" nhé!</div>`},

{sec:"VI", num:28, type:"error",
 q:"28. The <u>more fastly</u> that athlete <u>runs</u>, the <u>more chance</u> he'll get <u>to win</u> this marathon.",
 parts:["more fastly","runs","more chance","to win"],
 correctLetter:0, corrAccept:["faster","the faster"],
 exp:`<div class="vnt">💬 Dịch: <strong>The faster that athlete runs, the more chance he'll get to win this marathon.</strong> (Vận động viên đó chạy càng nhanh thì cơ hội thắng cuộc marathon này càng cao.)</div>
 <ol><li>Lỗi sai ở cụm <b>more fastly</b> → sửa thành <span class='hl-green'>faster</span>.</li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"fast" là trạng từ BẤT QUY TẮC: so sánh hơn là "faster" (KHÔNG có từ "fastly", cũng không dùng "more"). Cấu trúc so sánh kép: "The + so sánh hơn ..., the + so sánh hơn ..." → "The faster ... runs".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>runs (chạy – đúng), more chance (nhiều cơ hội hơn – đúng), to win (giành chiến thắng – đúng). Chỉ "more fastly" sai (không tồn tại "fastly", và "fast" không dùng "more").</span></li></ol>
 <div class="tip">🧠 Nhớ: fast → faster → fastest (không có "fastly", không "more fast"). Tương tự: hard → harder, early → earlier.</div>`},

{sec:"VII", head:"Sắp xếp các câu để tạo thành lá thư/đoạn văn hợp lý.", num:29, type:"mcq",

   <div><b>a.</b> It's filled with local artisans creating beautiful handmade goods, from pottery to basket weaving.</div>
   <div><b>b.</b> Those talented artisans mostly work at their own workshops, which are the perfect place to observe them.</div>
   <div><b>c.</b> I hope you're doing well! I recently visited a wonderful craft village and thought you'd love it.</div>
 </div>
 <div class="passage" style="font-style:italic">Hope you get a chance to visit soon! I'll tell you more once I'm back. — Cindy</div>
 <div style="font-weight:800;margin-top:4px">👉 Chọn thứ tự đúng:</div>`,
 disp:["c – a – b","a – b – c","b – a – c","b – c – a"],
 answer:"c – a – b",
 exp:`<div class="vnt">💬 Dịch nghĩa từng câu:</div>
 <div class="gcol">
   <div><b>a.</b> <strong>It's filled with local artisans creating beautiful handmade goods, from pottery to basket weaving.</strong> <br><span class='p-mean'>(Nơi đó đầy ắp các nghệ nhân địa phương làm ra những món đồ thủ công đẹp đẽ, từ gốm sứ đến đan lát.)</span></div>
   <div><b>b.</b> <strong>Those talented artisans mostly work at their own workshops, which are the perfect place to observe them.</strong> <br><span class='p-mean'>(Những nghệ nhân tài hoa đó phần lớn làm việc tại xưởng riêng của họ – nơi lý tưởng để quan sát họ.)</span></div>
   <div><b>c.</b> <strong>I hope you're doing well! I recently visited a wonderful craft village and thought you'd love it.</strong> <br><span class='p-mean'>(Mình mong cậu vẫn khỏe! Gần đây mình đã ghé một làng nghề tuyệt vời và nghĩ cậu sẽ thích nó.)</span></div>
 </div>
 <ol><li><span class="hl-green">✅ THỨ TỰ ĐÚNG: c – a – b</span></li>
 <li><span class='p-grammar'>Sau lời chào "Dear Benjamin," phải là câu MỞ ĐẦU thăm hỏi + giới thiệu chủ đề (c). Tiếp đến GIỚI THIỆU làng nghề đó có gì (a). Cuối cùng nói CHI TIẾT hơn về các nghệ nhân (b). Vậy: c → a → b.</span></li>

 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A, B dùng "gives" (hiện tại đơn) không hợp "at present"; A, D dùng "what to maintain" (sai nghĩa – phải là "cách duy trì" = how).</span></li></ol>`},

/* ================= AUDIO ================= */
let AC;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function ding(){
  const c=ac(); const now=c.currentTime;
  [880,1320,1760].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0,now+i*0.08);
    g.gain.linearRampToValueAtTime(0.25,now+i*0.08+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.4);
    o.start(now+i*0.08); o.stop(now+i*0.08+0.42);
  });
}
function buzz(){
  const c=ac(); const now=c.currentTime;
  [300,220,160].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='square'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.18,now+i*0.13);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.13+0.12);
    o.start(now+i*0.13); o.stop(now+i*0.13+0.13);
  });
}

/* ================= CONFETTI ================= */
function confetti(){
  const cv=document.createElement('canvas'); cv.className='confetti';
  cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); const cols=['#a8e063','#ff9a3d','#2bb673','#00D26A','#ffd93d','#43cea2'];
  const P=[]; for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height); t++;
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();});
    if(t<130)requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ================= HELPERS ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase()
  .replace(/won['’]t/g,'will not')
  .replace(/can['’]t/g,'can not')
  .replace(/n['’]t/g,' not')
  .replace(/['’]/g,'')
  .replace(/[.,!?;:"…\/]/g,' ')
  .replace(/\s+/g,' ').trim();}

const TOTAL=DATA.length;

function updateProg(){
  document.getElementById('progtxt').textContent=answered+' / '+TOTAL;
  document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%';
}

/* ================= RENDER ================= */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){
    const sec=document.createElement('div'); sec.className='sec';
    sec.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;
    quiz.appendChild(sec);
  }
  const card=document.createElement('div'); card.className='card'; card.id='c'+idx;

  body.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  card.appendChild(body);
  const zone=document.createElement('div'); card.appendChild(zone);
  const exp=document.createElement('div'); exp.className='exp'; exp.innerHTML=it.exp; card.appendChild(exp);
  quiz.appendChild(card);

  if(it.type==='mcq') renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange') renderFill(it,idx,zone,exp);
  else if(it.type==='rewrite') renderRewrite(it,idx,zone,exp);
  else if(it.type==='error') renderError(it,idx,zone,exp);
});
updateProg();

function markDone(idx,ok){ if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg();} }

function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div'); wrap.className='opts';
  const opts=shuffle(it.disp);
  opts.forEach(txt=>{
    const b=document.createElement('div'); b.className='opt'; b.innerHTML=txt;
    b.onclick=()=>{
      if(state[idx])return;
      const all=wrap.querySelectorAll('.opt'); all.forEach(x=>x.classList.add('locked'));
      const isC=(txt===it.answer);
      if(isC){b.classList.add('correct');ding();confetti();markDone(idx,true);}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);
        all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim');});
        setTimeout(()=>b.classList.remove('shake'),450);
      }
      exp.classList.add('open');
    };
    wrap.appendChild(b);
  });
  zone.appendChild(wrap);
}

function renderFill(it,idx,zone,exp){
  const row=document.createElement('div'); row.className='fillrow';
  const inp=document.createElement('input'); inp.className='tin'; inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button'); btn.className='btn-check'; btn.textContent='Kiểm tra';
  row.appendChild(inp); row.appendChild(btn); zone.appendChild(row);
  const acc=it.accept.map(norm);
  function check(){
    if(state[idx])return;
    const ok=acc.includes(norm(inp.value));
    inp.disabled=true; btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

function renderRewrite(it,idx,zone,exp){
  const row=document.createElement('div'); row.className='fillrow';
  const pre=document.createElement('span'); pre.className='prefix'; pre.textContent=it.prefix+' ...';
  const inp=document.createElement('input'); inp.className='tin'; inp.placeholder='Gõ tiếp phần còn lại...';
  const btn=document.createElement('button'); btn.className='btn-check'; btn.textContent='Kiểm tra';
  row.appendChild(pre); row.appendChild(inp); row.appendChild(btn); zone.appendChild(row);
  const contN=it.accept.map(norm);
  const preN=norm(it.prefix);
  const fullN=it.accept.map(a=>norm(it.prefix+' '+a));
  function check(){
    if(state[idx])return;
    let inN=norm(inp.value); let stripped=inN;
    if(inN.startsWith(preN+' '))stripped=inN.slice(preN.length).trim();
    else if(inN===preN)stripped='';
    const ok=contN.includes(inN)||contN.includes(stripped)||fullN.includes(inN);
    inp.disabled=true; btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

function renderError(it,idx,zone,exp){
  const q=document.createElement('div'); q.className='err-parts';
  let labeled=it.q.replace(/^\d+\.\s*/,''); let li=0; const L=['A','B','C','D'];
  labeled=labeled.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);
  q.innerHTML=labeled; zone.appendChild(q);
  const letters=document.createElement('div'); letters.className='letters';
  const corr=document.createElement('div'); corr.className='corrbox';
  const acc=it.corrAccept.map(norm);
  let chosen=null;
  L.forEach((lab,i)=>{
    const b=document.createElement('button'); b.className='lbtn'; b.textContent=lab;
    b.onclick=()=>{
      if(state[idx])return;
      letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); chosen=i;
      corr.classList.add('show'); corr.querySelector('input').focus();
    };
    letters.appendChild(b);
  });
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div>`;
  zone.appendChild(corr);
  const inp=corr.querySelector('input'); const btn=corr.querySelector('button');
  function check(){
    if(state[idx])return;
    if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return;}
    const letterOK=(chosen===it.correctLetter);
    const textOK=acc.includes(norm(inp.value));
    const ok=letterOK&&textOK;
    inp.disabled=true; btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel');});
    letters.children[it.correctLetter].classList.add('correct');
    if(!letterOK)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

/* ================= SUBMIT / RESULT ================= */
function openName(){ document.getElementById('nameMask').classList.add('show'); setTimeout(()=>document.getElementById('nameInput').focus(),100); }
function doSubmit(){
  const inp=document.getElementById('nameInput'); const w=document.getElementById('nameWarn');
  const name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err'); w.textContent='';
  document.getElementById('nameMask').classList.remove('show');
  showResult(name);
}
function showResult(name){
  let correct=0; for(let i=0;i<TOTAL;i++) if(state[i]==='ok') correct++;
  const pct=correct/TOTAL;
  const s10=(pct*10).toFixed(2);
  let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con là chúa tể rừng xanh! 🏆';fb='🏆🦁🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa nhé! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi thám hiểm lại nha! 🌴';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('resGreet').textContent=greet;
  document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';
  document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'); const fbEl=document.getElementById('resFallback');
  fbEl.textContent=fb; fbEl.style.display='none'; im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none';};
  im.onerror=()=>{im.style.display='none';fbEl.style.display='block';};
  im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block';}},2500);
  document.getElementById('resMask').classList.add('show');
  if(pct>=0.6){confetti();ding();}
}

/* ================= FLOATING PATTERN ================= */
(function(){
  const icons=['🐵','🦁','🦜','🐘','🌴','🍃','🦋','🐍','🌺','🦒','🐆','🌿','🍌'];
  const p=document.getElementById('pattern');
  for(let i=0;i<15;i++){
    const s=document.createElement('span');
    s.className='float'; s.textContent=icons[i%icons.length];
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(17+Math.random()*17)+'s';
    s.style.animationDelay=(-Math.random()*24)+'s';
    s.style.fontSize=(1.6+Math.random()*1.9)+'rem';
    p.appendChild(s);
  }
})();
