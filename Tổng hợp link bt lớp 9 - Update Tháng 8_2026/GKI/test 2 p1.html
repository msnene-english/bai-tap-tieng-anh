<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 2 · Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#8338ec; --p3:#00c9a7; --p4:#ff5e78; --p5:#3a86ff;
  --green:#00D26A; --red:#FF4757; --ink:#2a1a4a;
  --glow:#ffd60a; --glow2:#ff4b5c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
  line-height:1.55; overflow-x:hidden; position:relative;
  background:linear-gradient(-45deg,#ff4b5c,#ff8c42,#ffd60a,#3a86ff,#8338ec,#ff5e78);
  background-size:400% 400%; animation:bgmove 18s ease infinite;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.halftone{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle, rgba(255,255,255,.16) 2px, transparent 2.6px);
  background-size:22px 22px;}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.4rem;opacity:.4;animation:floaty linear infinite;filter:drop-shadow(0 3px 6px rgba(40,20,60,.3))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0) rotate(0deg)}50%{transform:translateY(50vh) translateX(20px) rotate(180deg)}100%{transform:translateY(-15vh) translateX(-10px) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}

.topbar{
  text-align:center;background:rgba(255,255,255,.22);backdrop-filter:blur(14px);
  border:2px solid rgba(255,214,10,.7);border-radius:22px;padding:14px 16px;margin-bottom:16px;
  box-shadow:0 0 26px rgba(255,214,10,.35),0 10px 30px rgba(40,20,60,.3);
}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(131,56,236,.7);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 10px var(--glow),0 3px 0 var(--glow2),0 4px 10px rgba(40,20,60,.4)}
.topbar p{font-size:.78rem;color:#fffdf0;opacity:.97;margin-top:2px}

.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(60,30,90,.28);backdrop-filter:blur(12px);border-radius:30px;padding:5px;border:2px solid rgba(255,214,10,.5);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.4);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s ease;box-shadow:0 0 10px var(--glow)}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(40,20,60,.5)}

.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;font-weight:900;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 16px rgba(255,75,92,.5)}
.sec h2{color:#fff;font-size:1.02rem;font-weight:800;text-shadow:0 1px 6px rgba(40,20,60,.5);flex:1}

.card{
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-radius:20px;
  padding:16px 16px 14px;margin-bottom:16px;border:2px solid rgba(255,214,10,.5);
  box-shadow:0 0 20px rgba(255,214,10,.16),0 12px 26px rgba(40,20,60,.22);
}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#ffb703);color:#7a4a00;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 0 12px rgba(255,214,10,.6)}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}

.passage{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid var(--glow2);border-radius:12px;padding:10px 13px;margin:10px 0;font-weight:600;line-height:1.65;font-size:1.02rem;color:#6a4a1b}
.orderbox{margin:10px 0;display:flex;flex-direction:column;gap:9px}
.orderbox>div{background:rgba(131,56,236,.08);border:1.5px solid rgba(131,56,236,.2);border-radius:12px;padding:10px 13px;font-size:1.02rem;font-weight:600;line-height:1.55}
.orderbox b{color:var(--p1);font-size:1.08rem;margin-right:3px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{
  background:linear-gradient(135deg,#fff,#fff6f0);border:2px solid rgba(255,75,92,.22);
  border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;
  box-shadow:0 6px 0 rgba(255,75,92,.24),0 8px 14px rgba(40,20,60,.12);
  transition:transform .12s ease,box-shadow .12s ease,background .2s;text-align:center;user-select:none;
}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(255,75,92,.3),0 0 18px rgba(255,214,10,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e,0 0 18px rgba(0,210,106,.6)}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}
.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.exp{max-height:0;overflow:hidden;transition:max-height .5s ease,margin .3s,padding .3s;background:rgba(131,56,236,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2000px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(131,56,236,.3)}
.exp ol{margin:6px 0 2px 18px}
.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#f3ecff,#fff0e8);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#7a3f8a;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.p-word{color:#2563eb;font-weight:800}
.hl-green{color:#0a9d54;font-weight:900}
.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(131,56,236,.15);color:#6b3fa0;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}
.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}

.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{
  font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--glow2),var(--p1),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;
  padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(131,56,236,.4),0 0 28px rgba(255,214,10,.5);transition:transform .1s;
}
.btn-submit:hover{transform:translateY(-3px)}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(131,56,236,.4)}

.mask{position:fixed;inset:0;background:rgba(40,20,60,.6);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:rgba(255,255,255,.97);border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px rgba(255,214,10,.4),0 20px 50px rgba(40,20,60,.4);border:2px solid rgba(255,214,10,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#5a3a75;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(255,75,92,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}
.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:floaty2 2s ease-in-out infinite}
@keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p5),var(--p1));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(131,56,236,.4)}
.btn-again:hover{transform:translateY(-2px)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fffdf0;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="halftone"></div>
<div class="pattern" id="pattern"></div>

<div class="wrap">
  <div class="topbar">
    <div class="tag">⚡ Giáo viên tạo: Ms MS Chí Nên</div>
    <h1>💥 TEST 2</h1>
    <p>The First Midterm Tests · Super English</p>
  </div>

  <div class="prog">
    <div class="txt" id="progtxt">0 / 28</div>
    <div class="bar"><div class="fill" id="progfill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="submit-wrap">
    <button class="btn-submit" onclick="openName()">🦸 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>

  <div class="footer">✨ Made with love for young heroes · Ms MS Chí Nên ✨</div>
</div>

<div class="mask" id="nameMask">
  <div class="modal">
    <h2>🦸 Siêu anh hùng nhí tên gì?</h2>
    <p>Nhập tên của con để xem kết quả nhé!</p>
    <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
    <div class="warn" id="nameWarn"></div>
    <button class="btn-again" style="background:linear-gradient(135deg,var(--glow2),var(--p1));box-shadow:0 6px 0 rgba(131,56,236,.4)" onclick="doSubmit()">Xem kết quả 🎉</button>
  </div>
</div>

<div class="mask" id="resMask">
  <div class="modal">
    <h2 id="resGreet"></h2>
    <div class="score-big" id="resScore"></div>
    <div class="score-10" id="resScore10"></div>
    <img class="meme" id="resMeme" alt="meme" style="display:none">
    <div class="meme-fallback" id="resFallback"></div>
    <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
    <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
/* ================= DATA (TEST 2 - mid_9) ================= */
const DATA=[
/* ---------- I. PHONETICS ---------- */
{sec:"I", head:"Chọn từ có phần gạch chân được phát âm khác các từ còn lại.", num:1, type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["d<u>ea</u>dline","proc<u>e</u>ss","pr<u>e</u>serve","l<u>e</u>ftover"],
 answer:"pr<u>e</u>serve",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có nguyên âm "e" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>deadline</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈdedlaɪn/</span> = <span class='p-mean'>hạn chót → ea đọc /e/</span></div>
 <div><span class='p-word'>process</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈprəʊses/</span> = <span class='p-mean'>quá trình → e đọc /e/</span></div>
 <div><span class='hl-green'>preserve</span> <span class='wt'>v</span> <span class='p-phonetic'>/prɪˈzɜːv/</span> = <span class='p-mean'>bảo tồn → e đọc /ɪ/</span></div>
 <div><span class='p-word'>leftover</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈleftəʊvə/</span> = <span class='p-mean'>đồ ăn thừa → e đọc /e/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trong "preserve", "e" ở tiền tố "pre-" không mang trọng âm nên đọc nhẹ thành /ɪ/. Ba từ kia có "e/ea" ở âm được nhấn nên đọc /e/ (âm e rõ) → preserve khác biệt.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>deadline, process, leftover đều có "e" đọc /e/ nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: tiền tố "pre-/re-/de-" khi không mang trọng âm thường đọc /prɪ/, /rɪ/, /dɪ/ (preserve, reserve, decide).</div>`},

{sec:"I", num:2, type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["<u>g</u>eneration","con<u>g</u>estion","ori<u>g</u>inal","re<u>g</u>ularly"],
 answer:"re<u>g</u>ularly",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "g" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>generation</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˌdʒenəˈreɪʃn/</span> = <span class='p-mean'>thế hệ → g đọc /dʒ/</span></div>
 <div><span class='p-word'>congestion</span> <span class='wt'>n</span> <span class='p-phonetic'>/kənˈdʒestʃən/</span> = <span class='p-mean'>tắc nghẽn → g đọc /dʒ/</span></div>
 <div><span class='p-word'>original</span> <span class='wt'>adj</span> <span class='p-phonetic'>/əˈrɪdʒənl/</span> = <span class='p-mean'>nguyên bản → g đọc /dʒ/</span></div>
 <div><span class='hl-green'>regularly</span> <span class='wt'>adv</span> <span class='p-phonetic'>/ˈreɡjələli/</span> = <span class='p-mean'>thường xuyên → g đọc /ɡ/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trong "regularly", "g" đứng trước "u" nên đọc là /ɡ/ (âm g cứng). Ba từ kia có "g" trước e, i → đọc /dʒ/ → regularly khác biệt.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>generation (g+e), congestion (g+e), original (g+i) đều đọc /dʒ/.</span></li></ol>
 <div class="tip">🧠 Mẹo: chữ "g" đọc /dʒ/ khi trước e, i, y (gem, giant, gym); đọc /ɡ/ khi trước a, o, u hoặc phụ âm (garden, go, regular).</div>`},

/* ---------- II. STRESS ---------- */
{sec:"II", head:"Chọn từ có trọng âm khác các từ còn lại.", num:3, type:"mcq",
 q:"3. Choose the word whose stress pattern is different.",
 disp:["police","helper","collector","consumer"],
 answer:"helper",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>police</span> <span class='wt'>n</span> <span class='p-phonetic'>/pəˈliːs/</span> = <span class='p-mean'>cảnh sát → trọng âm 2</span></div>
 <div><span class='hl-green'>helper</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈhelpə/</span> = <span class='p-mean'>người giúp việc → trọng âm 1</span></div>
 <div><span class='p-word'>collector</span> <span class='wt'>n</span> <span class='p-phonetic'>/kəˈlektə/</span> = <span class='p-mean'>người thu gom → trọng âm 2</span></div>
 <div><span class='p-word'>consumer</span> <span class='wt'>n</span> <span class='p-phonetic'>/kənˈsjuːmə/</span> = <span class='p-mean'>người tiêu dùng → trọng âm 2</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"HELP-er" nhấn âm tiết ĐẦU, còn ba từ kia đều nhấn âm tiết thứ HAI.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>police, collector, consumer đều nhấn âm tiết 2 nên giống nhau.</span></li></ol>`},

{sec:"II", num:4, type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["reliable","liveable","anxious","physical"],
 answer:"reliable",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>reliable</span> <span class='wt'>adj</span> <span class='p-phonetic'>/rɪˈlaɪəbl/</span> = <span class='p-mean'>đáng tin cậy → trọng âm 2</span></div>
 <div><span class='p-word'>liveable</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈlɪvəbl/</span> = <span class='p-mean'>đáng sống → trọng âm 1</span></div>
 <div><span class='p-word'>anxious</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈæŋkʃəs/</span> = <span class='p-mean'>lo lắng → trọng âm 1</span></div>
 <div><span class='p-word'>physical</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈfɪzɪkl/</span> = <span class='p-mean'>thuộc thể chất → trọng âm 1</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"re-LI-a-ble" nhấn âm tiết thứ HAI, còn ba từ kia đều nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>liveable, anxious, physical đều nhấn âm tiết 1 nên giống nhau.</span></li></ol>`},

/* ---------- III. MCQ ---------- */
{sec:"III", head:"Chọn từ hoặc cụm từ thích hợp nhất điền vào chỗ trống.", num:5, type:"mcq",
 q:"5. You should let your group know ______ advance if you can't attend the group meeting.",
 disp:["with","in","for","on"],
 answer:"in",
 exp:`<div class="vnt">💬 Dịch: <strong>You should let your group know in advance if you can't attend the group meeting.</strong> (Bạn nên báo cho nhóm biết trước nếu không thể tham dự buổi họp nhóm.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>with</span> <span class='wt'>prep</span> = <span class='p-mean'>với</span></div>
 <div><span class='hl-green'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>trong (in advance)</span></div>
 <div><span class='p-word'>for</span> <span class='wt'>prep</span> = <span class='p-mean'>cho</span></div>
 <div><span class='p-word'>on</span> <span class='wt'>prep</span> = <span class='p-mean'>trên</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Thành ngữ "in advance" = trước, báo trước. "let sb know in advance" = báo cho ai biết trước.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"advance" chỉ đi với "in" trong cụm này; with/for/on không đúng.</span></li></ol>
 <div class="tip">🧠 Nhớ: in advance = trước (VD: book tickets in advance = đặt vé trước).</div>`},

{sec:"III", num:6, type:"mcq",
 q:"6. To lose weight, it's important to ______ processed foods, unhealthy snacks, and sugary drinks.",
 disp:["cut down on","run out of","keep up with","pass down to"],
 answer:"cut down on",
 exp:`<div class="vnt">💬 Dịch: <strong>To lose weight, it's important to cut down on processed foods, unhealthy snacks, and sugary drinks.</strong> (Để giảm cân, điều quan trọng là phải cắt giảm đồ ăn chế biến sẵn, đồ ăn vặt không lành mạnh và đồ uống có đường.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>cut down on</span> = <span class='p-mean'>cắt giảm</span></div>
 <div><span class='p-word'>run out of</span> = <span class='p-mean'>hết (sạch)</span></div>
 <div><span class='p-word'>keep up with</span> = <span class='p-mean'>theo kịp</span></div>
 <div><span class='p-word'>pass down to</span> = <span class='p-mean'>truyền lại cho</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"cut down ON sth" = cắt giảm việc tiêu thụ cái gì. Muốn giảm cân thì cắt giảm đồ ăn không lành mạnh → hợp nghĩa.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>run out of (hết), keep up with (theo kịp), pass down to (truyền lại) đều không hợp ngữ cảnh giảm cân.</span></li></ol>`},

{sec:"III", num:7, type:"mcq",
 q:"7. Mandy usually packs the ______ for lunch the next day to avoid wasting food.",
 disp:["amenities","facilities","cafeterias","leftovers"],
 answer:"leftovers",
 exp:`<div class="vnt">💬 Dịch: <strong>Mandy usually packs the leftovers for lunch the next day to avoid wasting food.</strong> (Mandy thường gói đồ ăn thừa để làm bữa trưa hôm sau nhằm tránh lãng phí thức ăn.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>amenities</span> <span class='wt'>n</span> = <span class='p-mean'>tiện ích</span></div>
 <div><span class='p-word'>facilities</span> <span class='wt'>n</span> = <span class='p-mean'>cơ sở vật chất</span></div>
 <div><span class='p-word'>cafeterias</span> <span class='wt'>n</span> = <span class='p-mean'>căng tin</span></div>
 <div><span class='hl-green'>leftovers</span> <span class='wt'>n</span> = <span class='p-mean'>đồ ăn thừa</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"to avoid wasting food" (tránh lãng phí thức ăn) → thứ được gói lại chính là "leftovers" (đồ ăn thừa).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>amenities/facilities/cafeterias không phải "đồ ăn" để gói cho bữa trưa.</span></li></ol>`},

{sec:"III", num:8, type:"mcq",
 q:"8. Drinking more water is an ______ step toward maintaining a healthy lifestyle.",
 disp:["add","addition","additional","additionally"],
 answer:"additional",
 exp:`<div class="vnt">💬 Dịch: <strong>Drinking more water is an additional step toward maintaining a healthy lifestyle.</strong> (Uống nhiều nước hơn là một bước bổ sung để duy trì lối sống lành mạnh.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>add</span> <span class='wt'>v</span> = <span class='p-mean'>thêm (động từ)</span></div>
 <div><span class='p-word'>addition</span> <span class='wt'>n</span> = <span class='p-mean'>sự thêm vào (danh từ)</span></div>
 <div><span class='hl-green'>additional</span> <span class='wt'>adj</span> = <span class='p-mean'>thêm/bổ sung (tính từ)</span></div>
 <div><span class='p-word'>additionally</span> <span class='wt'>adv</span> = <span class='p-mean'>ngoài ra (trạng từ)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chỗ trống đứng giữa mạo từ "an" và danh từ "step" → cần TÍNH TỪ bổ nghĩa cho "step". "additional step" = một bước bổ sung.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>add (động từ), addition (danh từ), additionally (trạng từ) đều không bổ nghĩa được cho danh từ "step".</span></li></ol>
 <div class="tip">🧠 Mẹo: giữa "a/an" và DANH TỪ thường là chỗ của TÍNH TỪ (an additional step).</div>`},

{sec:"III", num:9, type:"mcq",
 q:"9. If you ______ today's lesson, you ______ your teacher or your friends for help.",
 disp:["understand – mustn't ask","understand – can't ask","don't understand – should ask","don't understand – would ask"],
 answer:"don't understand – should ask",
 exp:`<div class="vnt">💬 Dịch: <strong>If you don't understand today's lesson, you should ask your teacher or your friends for help.</strong> (Nếu con không hiểu bài học hôm nay, con nên hỏi thầy cô hoặc bạn bè để được giúp đỡ.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>understand – mustn't ask</span> = <span class='p-mean'>hiểu – không được hỏi (vô lý)</span></div>
 <div><span class='p-word'>understand – can't ask</span> = <span class='p-mean'>hiểu – không thể hỏi (vô lý)</span></div>
 <div><span class='hl-green'>don't understand – should ask</span> = <span class='p-mean'>không hiểu – nên hỏi ✔</span></div>
 <div><span class='p-word'>don't understand – would ask</span> = <span class='p-mean'>không hiểu – sẽ hỏi (kém tự nhiên)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Về logic: "Nếu KHÔNG hiểu bài → NÊN hỏi thầy cô/bạn bè". Câu điều kiện loại 1 khuyên bảo → "don't understand ... should ask".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"hiểu bài" mà lại "không được/không thể hỏi" là vô lý; "would ask" (sẽ hỏi) không diễn tả lời khuyên như "should".</span></li></ol>`},

{sec:"III", num:10, type:"mcq",
 q:"10. Tourists can find ______ cafes and restaurants with live music on almost every corner in the downtown area.",
 disp:["lively","peaceful","polluted","reliable"],
 answer:"lively",
 exp:`<div class="vnt">💬 Dịch: <strong>Tourists can find lively cafes and restaurants with live music on almost every corner in the downtown area.</strong> (Du khách có thể tìm thấy những quán cà phê và nhà hàng sôi động với nhạc sống ở hầu như mọi góc phố khu trung tâm.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>lively</span> <span class='wt'>adj</span> = <span class='p-mean'>sôi động, náo nhiệt</span></div>
 <div><span class='p-word'>peaceful</span> <span class='wt'>adj</span> = <span class='p-mean'>yên bình</span></div>
 <div><span class='p-word'>polluted</span> <span class='wt'>adj</span> = <span class='p-mean'>bị ô nhiễm</span></div>
 <div><span class='p-word'>reliable</span> <span class='wt'>adj</span> = <span class='p-mean'>đáng tin cậy</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Quán có "live music" (nhạc sống) ở khu trung tâm → không khí "lively" (sôi động) là hợp nhất.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>peaceful (yên bình) trái với "có nhạc sống"; polluted (ô nhiễm) và reliable (đáng tin) không tả bầu không khí quán.</span></li></ol>`},

{sec:"III", num:11, type:"mcq",
 q:"11. Local governments are investing in systems to ______ waste into biogas for cleaner energy.",
 disp:["assign","process","manage","shorten"],
 answer:"process",
 exp:`<div class="vnt">💬 Dịch: <strong>Local governments are investing in systems to process waste into biogas for cleaner energy.</strong> (Chính quyền địa phương đang đầu tư vào các hệ thống để chế biến rác thải thành khí sinh học cho nguồn năng lượng sạch hơn.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>assign</span> <span class='wt'>v</span> = <span class='p-mean'>giao/phân công</span></div>
 <div><span class='hl-green'>process</span> <span class='wt'>v</span> = <span class='p-mean'>chế biến, xử lý</span></div>
 <div><span class='p-word'>manage</span> <span class='wt'>v</span> = <span class='p-mean'>quản lý</span></div>
 <div><span class='p-word'>shorten</span> <span class='wt'>v</span> = <span class='p-mean'>làm ngắn lại</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "process A into B" = chế biến/xử lý A thành B. "process waste INTO biogas" = biến rác thành khí sinh học → hợp nghĩa.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>assign/manage/shorten không đi với cấu trúc "... into biogas" theo nghĩa biến đổi vật chất.</span></li></ol>`},

{sec:"III", num:12, type:"mcq",
 q:"12. Many teenagers wondered how ______ with stress caused by pressure from schoolwork.",
 disp:["should deal","dealing","to deal","should they deal"],
 answer:"to deal",
 exp:`<div class="vnt">💬 Dịch: <strong>Many teenagers wondered how to deal with stress caused by pressure from schoolwork.</strong> (Nhiều thanh thiếu niên tự hỏi làm thế nào để đối phó với căng thẳng do áp lực bài vở gây ra.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>should deal</span> = <span class='p-mean'>sai cấu trúc</span></div>
 <div><span class='p-word'>dealing</span> = <span class='p-mean'>sai cấu trúc</span></div>
 <div><span class='hl-green'>to deal</span> = <span class='p-mean'>how to deal with (cách đối phó)</span></div>
 <div><span class='p-word'>should they deal</span> = <span class='p-mean'>đảo câu hỏi (sai – đây là câu tường thuật)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "how + TO + V" = làm thế nào để làm gì → "how to deal with stress" (làm sao để đối phó với căng thẳng).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Sau "wondered how" là câu tường thuật (không đảo), nên "should they deal" sai; "should deal"/"dealing" đều không tạo cụm "how to V".</span></li></ol>
 <div class="tip">🧠 Nhớ: wh-word + TO + V (what to do, how to deal, where to go).</div>`},

{sec:"III", num:13, type:"mcq",
 q:"13. Singapore is one of ______ cities in the world. You can get a fine up to $5,000 for littering.",
 disp:["the most cleanest","the cleaner","cleaner than","the cleanest"],
 answer:"the cleanest",
 exp:`<div class="vnt">💬 Dịch: <strong>Singapore is one of the cleanest cities in the world. You can get a fine up to $5,000 for littering.</strong> (Singapore là một trong những thành phố sạch nhất thế giới. Bạn có thể bị phạt tới 5.000 đô la nếu xả rác.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>the most cleanest</span> = <span class='p-mean'>sai (so sánh nhất kép)</span></div>
 <div><span class='p-word'>the cleaner</span> = <span class='p-mean'>so sánh hơn (sai)</span></div>
 <div><span class='p-word'>cleaner than</span> = <span class='p-mean'>so sánh hơn (sai)</span></div>
 <div><span class='hl-green'>the cleanest</span> = <span class='p-mean'>sạch nhất (so sánh nhất)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "one of the + so sánh NHẤT + danh từ số nhiều" = một trong những ... nhất. "clean" là tính từ ngắn → nhất là "the cleanest".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"the most cleanest" là lỗi kép (đã "cleanest" thì không "most"); "the cleaner/cleaner than" là so sánh HƠN, không dùng với "one of the...".</span></li></ol>
 <div class="tip">🧠 Nhớ: one of the + SUPERLATIVE + Ns (one of the cleanest cities).</div>`},

{sec:"III", num:14, type:"mcq",
 q:'14. Ethan: "The suitcase looks heavy. Would you like me to carry it for you?" – Mrs Smith: "Yes, please. ______"',
 disp:["I'd be happy to help you.","I didn't catch what you said.","Do you mind helping me?","That's really kind of you."],
 answer:"That's really kind of you.",
 exp:`<div class="vnt">💬 Dịch: <strong>Ethan: "The suitcase looks heavy. Would you like me to carry it for you?" – Mrs Smith: "Yes, please. That's really kind of you."</strong> (Ethan: "Chiếc vali trông nặng đấy. Bác có muốn cháu xách giúp không ạ?" – Bà Smith: "Có chứ, cảm ơn cháu. Cháu thật tốt bụng.")</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='p-word'>A. I'd be happy to help you.</span> = <span class='p-mean'>Tôi rất sẵn lòng giúp. (dùng khi MÌNH giúp người khác)</span></div>
 <div><span class='p-word'>B. I didn't catch what you said.</span> = <span class='p-mean'>Tôi không nghe rõ. (lạc đề)</span></div>
 <div><span class='p-word'>C. Do you mind helping me?</span> = <span class='p-mean'>Phiền bạn giúp được không? (nhờ vả – lạc)</span></div>
 <div><span class='hl-green'>D. That's really kind of you.</span> = <span class='p-mean'>Cháu thật tốt bụng. (nhận lời + cảm ơn)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Ethan ĐỀ NGHỊ giúp đỡ. Bà Smith nhận lời ("Yes, please.") và cảm ơn lòng tốt → "That's really kind of you." (Cháu thật tốt bụng).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"I'd be happy to help you" là câu người GIÚP nói; "Do you mind helping me?" là lời nhờ vả; "I didn't catch..." lạc chủ đề.</span></li></ol>`},

/* ---------- IV. CLOSEST MEANING ---------- */
{sec:"IV", head:"Chọn từ/cụm từ có nghĩa GẦN NHẤT (đồng nghĩa) với phần gạch chân.", num:15, type:"mcq",
 q:"15. The city authority plans to extend the roads to reduce heavy traffic <u>congestion</u>.",
 disp:["lights","jams","islands","cones"],
 answer:"jams",
 exp:`<div class="vnt">💬 Dịch: <strong>The city authority plans to extend the roads to reduce heavy traffic jams.</strong> (Chính quyền thành phố dự định mở rộng đường để giảm tình trạng tắc nghẽn giao thông nghiêm trọng.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>lights</span> <span class='wt'>n</span> = <span class='p-mean'>đèn (traffic lights: đèn giao thông)</span></div>
 <div><span class='hl-green'>jams</span> <span class='wt'>n</span> = <span class='p-mean'>sự tắc nghẽn (traffic jams)</span></div>
 <div><span class='p-word'>islands</span> <span class='wt'>n</span> = <span class='p-mean'>đảo (traffic islands: đảo giao thông)</span></div>
 <div><span class='p-word'>cones</span> <span class='wt'>n</span> = <span class='p-mean'>cọc tiêu hình nón</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"traffic congestion" = "traffic jams" = tắc nghẽn/kẹt xe. Đồng nghĩa gần nhất với "congestion" là "jams".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>lights (đèn), islands (đảo), cones (cọc nón) đều liên quan giao thông nhưng KHÔNG mang nghĩa "tắc nghẽn".</span></li></ol>`},

{sec:"IV", num:16, type:"mcq",
 q:"16. The concert hall was <u>packed with</u> excited fans waiting for the performance to begin.",
 disp:["empty of","lack of","full of","complete with"],
 answer:"full of",
 exp:`<div class="vnt">💬 Dịch: <strong>The concert hall was full of excited fans waiting for the performance to begin.</strong> (Khán phòng chật kín người hâm mộ đang phấn khích chờ buổi biểu diễn bắt đầu.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>empty of</span> = <span class='p-mean'>trống rỗng (trái nghĩa)</span></div>
 <div><span class='p-word'>lack of</span> = <span class='p-mean'>thiếu (trái nghĩa)</span></div>
 <div><span class='hl-green'>full of</span> = <span class='p-mean'>đầy ắp</span></div>
 <div><span class='p-word'>complete with</span> = <span class='p-mean'>được trang bị đầy đủ (khác nghĩa)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"packed with" = chật kín/đầy ắp → đồng nghĩa gần nhất là "full of" (đầy).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>empty of (trống) và lack of (thiếu) là TRÁI NGHĨA; "complete with" nghĩa "kèm theo/được trang bị", không phải "đông đầy người".</span></li></ol>`},

/* ---------- V. OPPOSITE MEANING ---------- */
{sec:"V", head:"Chọn từ có nghĩa TRÁI NGƯỢC (trái nghĩa) với phần gạch chân.", num:17, type:"mcq",
 q:"17. Some common warning signs of <u>mental</u> health issues include changes in mood, sleep problems, and anxiety.",
 disp:["physical","social","spiritual","overall"],
 answer:"physical",
 exp:`<div class="vnt">💬 Dịch: <strong>Some common warning signs of physical health issues include changes in mood, sleep problems, and anxiety.</strong> (Một số dấu hiệu cảnh báo thường gặp của các vấn đề sức khỏe tinh thần gồm thay đổi tâm trạng, khó ngủ và lo âu.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>physical</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc thể chất (trái nghĩa)</span></div>
 <div><span class='p-word'>social</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc xã hội</span></div>
 <div><span class='p-word'>spiritual</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc tâm linh</span></div>
 <div><span class='p-word'>overall</span> <span class='wt'>adj</span> = <span class='p-mean'>tổng thể</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"mental" (thuộc tinh thần/trí óc) có nghĩa TRÁI NGƯỢC với "physical" (thuộc thể chất/cơ thể).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>social, spiritual, overall không phải trái nghĩa của "tinh thần".</span></li></ol>
 <div class="tip">🧠 Nhớ cặp: mental (tinh thần) ⇄ physical (thể chất).</div>`},

{sec:"V", num:18, type:"mcq",
 q:"18. Finally, she's <u>accomplished</u> her plan of losing weight before the summer holiday.",
 disp:["processed","achieved","failed","abandoned"],
 answer:"failed",
 exp:`<div class="vnt">💬 Dịch: <strong>Finally, she's failed her plan of losing weight before the summer holiday.</strong> (Cuối cùng, cô ấy đã hoàn thành kế hoạch giảm cân trước kỳ nghỉ hè.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>processed</span> <span class='wt'>v</span> = <span class='p-mean'>đã xử lý</span></div>
 <div><span class='p-word'>achieved</span> <span class='wt'>v</span> = <span class='p-mean'>đạt được (ĐỒNG nghĩa)</span></div>
 <div><span class='hl-red'>failed</span> <span class='wt'>v</span> = <span class='p-mean'>thất bại (TRÁI nghĩa) ✔</span></div>
 <div><span class='p-word'>abandoned</span> <span class='wt'>v</span> = <span class='p-mean'>từ bỏ</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đề hỏi TRÁI NGHĨA. "accomplish" (hoàn thành, đạt được) có nghĩa trái ngược với "fail" (thất bại, không đạt được).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"achieved" (đạt được) là ĐỒNG nghĩa (bẫy!); processed/abandoned không phải trái nghĩa trực tiếp của "hoàn thành".</span></li></ol>
 <div class="tip">🧠 Lưu ý: đề hỏi TRÁI NGHĨA thì đáp án "achieved" (đồng nghĩa) là BẪY — phải chọn "failed".</div>`},

/* ---------- VI. ARRANGE + ENDING ---------- */
{sec:"VI", head:"Sắp xếp câu & chọn câu kết cho đoạn văn.", num:19, type:"mcq",
 q:`19. Sắp xếp các câu (a–c) cho hợp lý:
 <div class="passage">Cyberbullying is any bullying behaviour that takes place electronically. ______</div>
 <div class="orderbox">
   <div><b>a.</b> If you're facing cyberbullying, the first step is to block the bullies so they can't contact you.</div>
   <div><b>b.</b> Also, you should talk to a trusted adult, like a parent or school counsellor, for guidance and support.</div>
   <div><b>c.</b> Make sure to save all of their harmful messages or screenshots as evidence, which can help if you need to report the bullying.</div>
 </div>
 <div style="font-weight:800;margin-top:4px">👉 Chọn thứ tự đúng:</div>`,
 disp:["c – b – a","b – a – c","a – c – b","b – c – a"],
 answer:"a – c – b",
 exp:`<div class="vnt">💬 Dịch nghĩa từng câu:</div>
 <div class="gcol">
   <div><b>a.</b> <strong>If you're facing cyberbullying, the first step is to block the bullies so they can't contact you.</strong> <br><span class='p-mean'>(Nếu bạn đang bị bắt nạt trên mạng, bước đầu tiên là chặn kẻ bắt nạt để chúng không liên lạc được với bạn.)</span></div>
   <div><b>b.</b> <strong>Also, you should talk to a trusted adult, like a parent or school counsellor, for guidance and support.</strong> <br><span class='p-mean'>(Ngoài ra, bạn nên nói chuyện với một người lớn đáng tin cậy, như cha mẹ hoặc chuyên viên tư vấn ở trường, để được hướng dẫn và hỗ trợ.)</span></div>
   <div><b>c.</b> <strong>Make sure to save all of their harmful messages or screenshots as evidence, which can help if you need to report the bullying.</strong> <br><span class='p-mean'>(Hãy chắc chắn lưu lại tất cả tin nhắn hoặc ảnh chụp màn hình gây hại làm bằng chứng, điều này giúp ích nếu bạn cần tố cáo.)</span></div>
 </div>
 <ol><li><span class="hl-green">✅ THỨ TỰ ĐÚNG: a – c – b</span></li>
 <li><span class='p-grammar'>Bước 1: "the first step" là chặn kẻ bắt nạt (a). Bước 2: lưu bằng chứng (c). Bước 3: "Also" — nói với người lớn (b). Bám từ nối: first step → (rồi) → Also.</span></li>
 <li><span class="hl-red">❌ Vì sao đáp án khác sai?</span> <span class='p-grammar'>Câu a có "the first step" nên phải đứng ĐẦU; "Also" (b) là ý bổ sung nên phải đứng SAU, không thể mở đầu.</span></li></ol>
 <div class="tip">🧠 Mẹo: "the first step" luôn mở đầu; "Also/Besides" là ý thêm vào nên đứng sau.</div>`},

{sec:"VI", num:20, type:"mcq",
 q:"20. Chọn câu KẾT THÚC đoạn văn ở câu 19 phù hợp nhất.",
 disp:["Always remember that you don't have to face cyberbullying alone; there are people who care and want to help.","There are a few advisable steps for teens to fight against cyberbullying if they're the victims.","By supporting each other and promoting kindness, every can help make the environment better.","If teens don't follow these steps, they can get more stressed and affect their mental health."],
 answer:"Always remember that you don't have to face cyberbullying alone; there are people who care and want to help.",
 exp:`<div class="vnt">💬 Dịch: <strong>Always remember that you don't have to face cyberbullying alone; there are people who care and want to help.</strong> (Hãy luôn nhớ rằng bạn không phải một mình đối mặt với bắt nạt mạng; có những người quan tâm và muốn giúp bạn.)</div>
 <div class="gcol">
   <div><span class='hl-green'>A. Always remember that you don't have to face cyberbullying alone; there are people who care and want to help.</span> = <span class='p-mean'>Luôn nhớ bạn không đơn độc; có người quan tâm và muốn giúp. (câu kết động viên ✔)</span></div>
   <div><span class='p-word'>B. There are a few advisable steps for teens to fight against cyberbullying if they're the victims.</span> = <span class='p-mean'>Có vài bước nên làm để chống bắt nạt mạng... (giống câu MỞ ĐẦU, không phải câu kết)</span></div>
   <div><span class='p-word'>C. By supporting each other and promoting kindness, every can help make the environment better.</span> = <span class='p-mean'>Bằng cách hỗ trợ nhau... (sai ngữ pháp "every can help")</span></div>
   <div><span class='p-word'>D. If teens don't follow these steps, they can get more stressed and affect their mental health.</span> = <span class='p-mean'>Nếu không làm theo các bước này, sẽ căng thẳng hơn... (mang giọng tiêu cực, không hợp câu kết)</span></div>
 </div>
 <ol><li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đoạn văn hướng dẫn cách xử lý bắt nạt mạng → câu kết nên ĐỘNG VIÊN, khép lại tích cực: "bạn không đơn độc, có người sẵn sàng giúp".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B giống câu giới thiệu (mở đầu); C sai ngữ pháp ("every can help"); D mang giọng đe dọa/tiêu cực, không phù hợp làm câu kết khích lệ.</span></li></ol>`},

/* ---------- IX. CLOSEST MEANING ---------- */
{sec:"IX", head:"Chọn câu có nghĩa gần nhất với câu gốc.", num:33, type:"mcq",
 q:'33. "I don\'t know when I must submit the assignment and how to upload it," said Josh.',
 disp:["Josh didn't know when to submit the assignment and how to upload it.","Josh didn't know when to submit the assignment and upload it.","Josh didn't know when submit the assignment and how upload it.","Josh didn't know when and how to submit the assignment and upload."],
 answer:"Josh didn't know when to submit the assignment and how to upload it.",
 exp:`<div class="vnt">💬 Dịch: <strong>Josh didn't know when to submit the assignment and how to upload it.</strong> (Josh không biết khi nào phải nộp bài tập và cách tải nó lên.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='hl-green'>A. Josh didn't know when to submit the assignment and how to upload it.</span> = <span class='p-mean'>...when to submit... and how to upload it. ✔</span></div>
 <div><span class='p-word'>B. Josh didn't know when to submit the assignment and upload it.</span> = <span class='p-mean'>...when to submit... and upload it. (mất "how to")</span></div>
 <div><span class='p-word'>C. Josh didn't know when submit the assignment and how upload it.</span> = <span class='p-mean'>...when submit... how upload... (thiếu "to")</span></div>
 <div><span class='p-word'>D. Josh didn't know when and how to submit the assignment and upload.</span> = <span class='p-mean'>...when and how to submit... and upload. (gộp sai nghĩa)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu tường thuật rút gọn dùng "wh-word + TO + V": "when TO submit" (khi nào nộp) và "how TO upload" (cách tải lên). Giữ đủ cả hai cụm → câu A.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B bỏ mất "how to"; C thiếu "to"; D gộp "when and how" làm sai nghĩa (câu gốc: when → submit, how → upload riêng biệt).</span></li></ol>`},

{sec:"IX", num:34, type:"mcq",
 q:"34. Practice a bit more regularly! Maybe you will win the competition.",
 disp:["If you practice a bit more regularly, you might win the competition.","If you practice a bit more regularly, you must win the competition.","Unless you practice a bit more regularly, you shouldn't win the competition.","Unless you practice a bit more regularly, you don't have to win the competition."],
 answer:"If you practice a bit more regularly, you might win the competition.",
 exp:`<div class="vnt">💬 Dịch: <strong>If you practice a bit more regularly, you might win the competition.</strong> (Nếu bạn luyện tập đều đặn hơn một chút, bạn có thể sẽ thắng cuộc thi.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='hl-green'>A. If you practice a bit more regularly, you might win the competition.</span> = <span class='p-mean'>Nếu luyện tập đều hơn, bạn CÓ THỂ thắng. ✔</span></div>
 <div><span class='p-word'>B. If you practice a bit more regularly, you must win the competition.</span> = <span class='p-mean'>...bạn CHẮC CHẮN thắng (must – quá mạnh, sai)</span></div>
 <div><span class='p-word'>C. Unless you practice a bit more regularly, you shouldn't win the competition.</span> = <span class='p-mean'>Trừ khi... bạn không nên thắng (sai nghĩa)</span></div>
 <div><span class='p-word'>D. Unless you practice a bit more regularly, you don't have to win the competition.</span> = <span class='p-mean'>Trừ khi... bạn không phải thắng (sai nghĩa)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu mệnh lệnh + "Maybe you will win" chuyển thành câu điều kiện loại 1: "If + hiện tại đơn, ... might/will V". "Maybe" (có lẽ) → "might" (có thể). → câu A.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"must win" (chắc chắn thắng) quá mạnh so với "maybe"; C và D dùng "Unless" (trừ khi) làm đảo ngược/sai nghĩa hoàn toàn.</span></li></ol>
 <div class="tip">🧠 Quy đổi: "Do X! Maybe you will Y" ⇔ "If you do X, you might Y."</div>`},

{sec:"IX", num:35, type:"mcq",
 q:"35. We called the technician because the photocopier was broken.",
 disp:["Although the photocopier broke up, we called the technician.","The photocopier broke down, so we called the technician.","The photocopier broke down when we called the technician.","The photocopier broke up; therefore, we called the technician."],
 answer:"The photocopier broke down, so we called the technician.",
 exp:`<div class="vnt">💬 Dịch: <strong>The photocopier broke down, so we called the technician.</strong> (Máy photocopy bị hỏng nên chúng tôi đã gọi thợ sửa.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='p-word'>A. Although the photocopier broke up, we called the technician.</span> = <span class='p-mean'>Mặc dù... (although – sai logic) + "broke up" sai</span></div>
 <div><span class='hl-green'>B. The photocopier broke down, so we called the technician.</span> = <span class='p-mean'>Máy hỏng, NÊN chúng tôi gọi thợ. ✔</span></div>
 <div><span class='p-word'>C. The photocopier broke down when we called the technician.</span> = <span class='p-mean'>Máy hỏng KHI chúng tôi gọi thợ (sai nghĩa thời gian)</span></div>
 <div><span class='p-word'>D. The photocopier broke up; therefore, we called the technician.</span> = <span class='p-mean'>"broke up" sai (phải "broke down")</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"because A, B" (vì A nên B) = "A, so B". Máy hỏng (nguyên nhân) → gọi thợ (kết quả). Máy móc hỏng dùng "break DOWN" (không phải "break up"). → câu B.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A dùng "although" (mặc dù – sai logic); A, D dùng "broke up" (chia tay/tan rã – sai với máy móc); C đổi "because" thành "when" làm sai nghĩa nhân–quả.</span></li></ol>
 <div class="tip">🧠 Nhớ: máy móc hỏng → break DOWN (không "break up"). "because A, B" ⇔ "A, so B".</div>`},

{sec:"IX", num:36, type:"mcq",
 q:"36. The river flowing through my hometown is not so polluted as the one in the city.",
 disp:["The river in the city is the most polluted river in my hometown.","The river in the city is more polluted than the one flowing through my hometown.","The river in the city is one of the most polluted rivers in my hometown.","The river in the city is less polluted than the one flowing through my hometown."],
 answer:"The river in the city is more polluted than the one flowing through my hometown.",
 exp:`<div class="vnt">💬 Dịch: <strong>The river in the city is more polluted than the one flowing through my hometown.</strong> (Con sông trong thành phố ô nhiễm hơn con sông chảy qua quê tôi.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='p-word'>A. The river in the city is the most polluted river in my hometown.</span> = <span class='p-mean'>...ô nhiễm NHẤT ở quê tôi (sai nghĩa)</span></div>
 <div><span class='hl-green'>B. The river in the city is more polluted than the one flowing through my hometown.</span> = <span class='p-mean'>Sông trong thành phố ô nhiễm HƠN sông ở quê tôi. ✔</span></div>
 <div><span class='p-word'>C. The river in the city is one of the most polluted rivers in my hometown.</span> = <span class='p-mean'>...một trong những sông ô nhiễm nhất (sai nghĩa)</span></div>
 <div><span class='p-word'>D. The river in the city is less polluted than the one flowing through my hometown.</span> = <span class='p-mean'>...sông thành phố ÍT ô nhiễm hơn (ngược nghĩa)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Sông ở quê KHÔNG ô nhiễm BẰNG sông thành phố" ⇔ "Sông thành phố ô nhiễm HƠN sông ở quê". "not so ... as" chuyển thành "more ... than" (đảo chủ ngữ). → câu B.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A, C dùng so sánh nhất (sai nghĩa); D nói sông thành phố ÍT ô nhiễm hơn → ngược hẳn câu gốc.</span></li></ol>
 <div class="tip">🧠 Quy đổi: "A không + adj + bằng B" (not so...as) ⇔ "B + more + adj + than + A".</div>`},

/* ---------- X. BEST SENTENCE ---------- */
{sec:"X", head:"Chọn câu đúng nhất được tạo từ các từ gợi ý cho sẵn.", num:37, type:"mcq",
 q:"37. Many teenagers/ spend/ time/ surf/ the net/ instead/ do/ sports.",
 disp:["Many teenagers spend many time to surf the net instead of doing sports.","Many teenagers spend a lot time to surf the net instead doing sports.","Many teenagers spend lots of time surfing the net instead of doing sports.","Many teenagers spend few time surfing the net instead doing sports."],
 answer:"Many teenagers spend lots of time surfing the net instead of doing sports.",
 exp:`<div class="vnt">💬 Dịch: <strong>Many teenagers spend lots of time surfing the net instead of doing sports.</strong> (Nhiều thanh thiếu niên dành nhiều thời gian lướt mạng thay vì chơi thể thao.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='p-word'>A. Many teenagers spend many time to surf the net instead of doing sports.</span> = <span class='p-mean'>...many time to surf... (sai: "many" + danh từ không đếm được "time" & "to surf")</span></div>
 <div><span class='p-word'>B. Many teenagers spend a lot time to surf the net instead doing sports.</span> = <span class='p-mean'>...a lot time to surf... instead doing (thiếu "of" hai chỗ)</span></div>
 <div><span class='hl-green'>C. Many teenagers spend lots of time surfing the net instead of doing sports.</span> = <span class='p-mean'>...lots of time surfing... instead of doing sports. ✔</span></div>
 <div><span class='p-word'>D. Many teenagers spend few time surfing the net instead doing sports.</span> = <span class='p-mean'>...few time... instead doing (sai: "few" + "time" & thiếu "of")</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"time" là danh từ KHÔNG đếm được → dùng "lots of time" (nhiều thời gian). Cấu trúc "spend time V-ing" → "surfing". "instead OF + V-ing" (thay vì) → "instead of doing sports".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A dùng "many/few time" (sai, time không đếm được) và "to surf"; B, D thiếu "of" trong "a lot OF" và "instead OF".</span></li></ol>
 <div class="tip">🧠 Nhớ: spend time DOING sth; instead OF + V-ing; "time" không đếm được → lots of/much time (không "many/few time").</div>`},

{sec:"X", num:38, type:"mcq",
 q:"38. This famous restaurant/ packed/ customers/ wait/ a table/ present.",
 disp:["This famous restaurant was packed with customers to wait for a table at present.","This famous restaurant was packed for customers waiting a table in present.","This famous restaurant is packed for customers waiting a table in present.","This famous restaurant is packed with customers waiting for a table at present."],
 answer:"This famous restaurant is packed with customers waiting for a table at present.",
 exp:`<div class="vnt">💬 Dịch: <strong>This famous restaurant is packed with customers waiting for a table at present.</strong> (Nhà hàng nổi tiếng này hiện đang chật kín khách đang chờ bàn.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='p-word'>A. This famous restaurant was packed with customers to wait for a table at present.</span> = <span class='p-mean'>was packed... at present (sai thì: "was" + "at present")</span></div>
 <div><span class='p-word'>B. This famous restaurant was packed for customers waiting a table in present.</span> = <span class='p-mean'>was packed FOR... in present (sai thì + "for" + "in present")</span></div>
 <div><span class='p-word'>C. This famous restaurant is packed for customers waiting a table in present.</span> = <span class='p-mean'>is packed FOR... in present (sai "for" + "in present")</span></div>
 <div><span class='hl-green'>D. This famous restaurant is packed with customers waiting for a table at present.</span> = <span class='p-mean'>is packed WITH customers waiting FOR a table AT present. ✔</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"at present" (hiện nay) → thì hiện tại "is". "be packed WITH sb" = chật kín ai. "wait FOR a table" = chờ bàn. Cụm rút gọn "customers waiting for a table". → câu D.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A, B dùng "was" (quá khứ) không hợp "at present"; B, C dùng "packed FOR" (sai, phải "packed with") và "in present" (sai, phải "at present").</span></li></ol>
 <div class="tip">🧠 Nhớ: be packed WITH (chật kín); wait FOR (chờ đợi); "at present" = hiện nay (đi với hiện tại).</div>`},

{sec:"X", num:39, type:"mcq",
 q:"39. More and more/ people/ suffer/ respiratory diseases/ due/ air pollution.",
 disp:["More and more people are suffering from respiratory diseases due to air pollution.","More and more of people suffered from respiratory diseases due to air pollution.","More and more people were suffering from respiratory diseases due of air pollution.","More and more of people suffer from respiratory diseases due of air pollution."],
 answer:"More and more people are suffering from respiratory diseases due to air pollution.",
 exp:`<div class="vnt">💬 Dịch: <strong>More and more people are suffering from respiratory diseases due to air pollution.</strong> (Ngày càng nhiều người mắc các bệnh về đường hô hấp do ô nhiễm không khí.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='hl-green'>A. More and more people are suffering from respiratory diseases due to air pollution.</span> = <span class='p-mean'>...are suffering from... due to air pollution. ✔</span></div>
 <div><span class='p-word'>B. More and more of people suffered from respiratory diseases due to air pollution.</span> = <span class='p-mean'>more and more OF people... (thừa "of")</span></div>
 <div><span class='p-word'>C. More and more people were suffering from respiratory diseases due of air pollution.</span> = <span class='p-mean'>...due OF air pollution (sai: phải "due to")</span></div>
 <div><span class='p-word'>D. More and more of people suffer from respiratory diseases due of air pollution.</span> = <span class='p-mean'>more and more OF... due OF... (sai kép)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"more and more + danh từ" (KHÔNG "of"). "suffer FROM + bệnh" = mắc/chịu đựng bệnh. "due TO + nguyên nhân" = do/bởi vì. Xu hướng đang diễn ra → hiện tại tiếp diễn "are suffering". → câu A.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B, D thừa "of" sau "more and more"; C, D dùng "due OF" (sai, phải "due TO").</span></li></ol>
 <div class="tip">🧠 Nhớ: suffer FROM (mắc bệnh); due TO + N (do/bởi); "more and more" + N (không "of").</div>`},

/* ================= AUDIO ================= */
let AC;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function ding(){
  const c=ac(); const now=c.currentTime;
  [880,1320,1760].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0,now+i*0.08);
    g.gain.linearRampToValueAtTime(0.25,now+i*0.08+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.4);
    o.start(now+i*0.08); o.stop(now+i*0.08+0.42);
  });
}
function buzz(){
  const c=ac(); const now=c.currentTime;
  [300,220,160].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='square'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.18,now+i*0.13);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.13+0.12);
    o.start(now+i*0.13); o.stop(now+i*0.13+0.13);
  });
}

/* ================= CONFETTI ================= */
function confetti(){
  const cv=document.createElement('canvas'); cv.className='confetti';
  cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); const cols=['#ffd60a','#ff4b5c','#3a86ff','#00D26A','#8338ec','#ff8c42'];
  const P=[]; for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height); t++;
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();});
    if(t<130)requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ================= HELPERS ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const state={};
let answered=0;
const TOTAL=DATA.length;

function updateProg(){
  document.getElementById('progtxt').textContent=answered+' / '+TOTAL;
  document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%';
}

/* ================= RENDER ================= */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){
    const sec=document.createElement('div'); sec.className='sec';
    sec.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;
    quiz.appendChild(sec);
  }
  const card=document.createElement('div'); card.className='card'; card.id='c'+idx;
  const body=document.createElement('div');
  body.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  card.appendChild(body);
  const zone=document.createElement('div'); card.appendChild(zone);
  const exp=document.createElement('div'); exp.className='exp'; exp.innerHTML=it.exp; card.appendChild(exp);
  quiz.appendChild(card);
  renderMCQ(it,idx,zone,exp);
});
updateProg();

function markDone(idx,ok){ if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg();} }

function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div'); wrap.className='opts';
  const opts=shuffle(it.disp);
  opts.forEach(txt=>{
    const b=document.createElement('div'); b.className='opt'; b.innerHTML=txt;
    b.onclick=()=>{
      if(state[idx])return;
      const all=wrap.querySelectorAll('.opt'); all.forEach(x=>x.classList.add('locked'));
      const isC=(txt===it.answer);
      if(isC){b.classList.add('correct');ding();confetti();markDone(idx,true);}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);
        all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim');});
        setTimeout(()=>b.classList.remove('shake'),450);
      }
      exp.classList.add('open');
    };
    wrap.appendChild(b);
  });
  zone.appendChild(wrap);
}

/* ================= SUBMIT / RESULT ================= */
function openName(){ document.getElementById('nameMask').classList.add('show'); setTimeout(()=>document.getElementById('nameInput').focus(),100); }
function doSubmit(){
  const inp=document.getElementById('nameInput'); const w=document.getElementById('nameWarn');
  const name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err'); w.textContent='';
  document.getElementById('nameMask').classList.remove('show');
  showResult(name);
}
function showResult(name){
  let correct=0; for(let i=0;i<TOTAL;i++) if(state[i]==='ok') correct++;
  const pct=correct/TOTAL;
  const s10=(pct*10).toFixed(2);
  let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con là siêu anh hùng thực thụ! 🏆';fb='🏆🦸🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa nhé! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi chiến lại nha! 💥';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('resGreet').textContent=greet;
  document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';
  document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'); const fbEl=document.getElementById('resFallback');
  fbEl.textContent=fb; fbEl.style.display='none'; im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none';};
  im.onerror=()=>{im.style.display='none';fbEl.style.display='block';};
  im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block';}},2500);
  document.getElementById('resMask').classList.add('show');
  if(pct>=0.6){confetti();ding();}
}

/* ================= FLOATING PATTERN ================= */
(function(){
  const icons=['💥','⭐','⚡','🌟','🔥','💫','🏆','🎯','🚀','🎉','👊','✨','🦸'];
  const p=document.getElementById('pattern');
  for(let i=0;i<15;i++){
    const s=document.createElement('span');
    s.className='float'; s.textContent=icons[i%icons.length];
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(17+Math.random()*17)+'s';
    s.style.animationDelay=(-Math.random()*24)+'s';
    s.style.fontSize=(1.6+Math.random()*1.9)+'rem';
    p.appendChild(s);
  }
})();
