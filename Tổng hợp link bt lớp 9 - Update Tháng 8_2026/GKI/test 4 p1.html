<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 4 · Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#d2691e;--p4:#e07a5f;--p5:#f4a261;--green:#00D26A;--red:#FF4757;--ink:#5a3418;--glow:#ffcf4d;--glow2:#e76f51}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;line-height:1.55;overflow-x:hidden;position:relative;
  background:linear-gradient(-45deg,#ff9a56,#ffb347,#ff7e5f,#d4763a,#ffcf7a);background-size:400% 400%;animation:bgmove 18s ease infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.2rem;opacity:.4;animation:floaty linear infinite;filter:drop-shadow(0 4px 6px rgba(90,50,20,.25))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0) rotate(0)}50%{transform:translateY(50vh) translateX(24px) rotate(180deg)}100%{transform:translateY(-15vh) translateX(-8px) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}
.topbar{text-align:center;background:rgba(255,255,255,.26);backdrop-filter:blur(12px);border:1.5px solid rgba(255,207,77,.7);border-radius:22px;padding:14px 16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(120,70,20,.22)}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(210,105,30,.7);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 2px 10px rgba(120,60,10,.35)}
.topbar p{font-size:.78rem;color:#fff;opacity:.97;margin-top:2px}
.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(140,80,30,.25);backdrop-filter:blur(10px);border-radius:30px;padding:5px;border:1.5px solid rgba(255,207,77,.5);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.45);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(120,60,10,.4)}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;font-weight:900;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 6px 14px rgba(231,111,81,.4)}
.sec h2{color:#fff;font-size:1.02rem;font-weight:800;text-shadow:0 1px 6px rgba(120,60,10,.4);flex:1}
.card{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:20px;padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(255,207,77,.5);box-shadow:0 12px 26px rgba(120,70,20,.18)}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#ffb03a);color:#7a4a00;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}
.passage{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid var(--glow2);border-radius:12px;padding:10px 13px;margin:10px 0;font-weight:600;line-height:1.65;font-size:1.02rem;color:#6a4a1b}
.orderbox{margin:10px 0;display:flex;flex-direction:column;gap:9px}
.orderbox>div{background:rgba(210,105,30,.08);border:1.5px solid rgba(210,105,30,.2);border-radius:12px;padding:10px 13px;font-size:1.02rem;font-weight:600;line-height:1.55}
.orderbox b{color:var(--p1);font-size:1.08rem;margin-right:3px}
.signbox{display:flex;justify-content:center;margin:12px 0 4px}
.signbox svg{filter:drop-shadow(0 6px 12px rgba(120,70,20,.25))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:linear-gradient(135deg,#fff,#fff6ec);border:2px solid rgba(210,105,30,.22);border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(210,105,30,.22),0 8px 14px rgba(120,70,20,.1);transition:transform .12s,box-shadow .12s;text-align:center;user-select:none}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(210,105,30,.28),0 0 18px rgba(255,207,77,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#2bb673);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.exp{max-height:0;overflow:hidden;transition:max-height .5s,margin .3s,padding .3s;background:rgba(210,105,30,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2000px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(210,105,30,.3)}
.exp ol{margin:6px 0 2px 18px}.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#fff2e0,#ffe9dc);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#a0532c;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.p-word{color:#2563eb;font-weight:800}.hl-green{color:#0a9d54;font-weight:900}.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(210,105,30,.15);color:#a0532c;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}
.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--glow2),var(--p1),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(210,105,30,.4);transition:transform .1s}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(210,105,30,.4)}
.mask{position:fixed;inset:0;background:rgba(90,52,24,.6);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:#fff;border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(90,52,24,.4);border:2px solid rgba(255,207,77,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#775;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(210,105,30,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:fb 2s ease-in-out infinite}
@keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p5),var(--p1));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(210,105,30,.4)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fff;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>
<div class="wrap">
  <div class="topbar">
    <div class="tag">🍁 Giáo viên tạo: Ms MS Chí Nên</div>
    <h1>🍂 TEST 4</h1>
    <p>The First Midterm Tests · Autumn English</p>
  </div>
  <div class="prog"><div class="txt" id="progtxt">0 / 24</div><div class="bar"><div class="fill" id="progfill"></div></div></div>
  <div id="quiz"></div>
  <div class="submit-wrap"><button class="btn-submit" onclick="openName()">🍂 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
  <div class="footer">✨ Made with love for young learners · Ms MS Chí Nên ✨</div>
</div>
<div class="mask" id="nameMask"><div class="modal">
  <h2>🌰 Bé tên là gì nào?</h2><p>Nhập tên của con để xem kết quả nhé!</p>
  <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
  <div class="warn" id="nameWarn"></div>
  <button class="btn-again" style="background:linear-gradient(135deg,var(--glow2),var(--p1))" onclick="doSubmit()">Xem kết quả 🎉</button>
</div></div>
<div class="mask" id="resMask"><div class="modal">
  <h2 id="resGreet"></h2><div class="score-big" id="resScore"></div><div class="score-10" id="resScore10"></div>
  <img class="meme" id="resMeme" alt="meme" style="display:none"><div class="meme-fallback" id="resFallback"></div>
  <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
  <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
</div></div>
<script>
const DATA=[
/* I */
{sec:"I",head:"Chọn từ có phần gạch chân được phát âm khác các từ còn lại.",num:1,type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["sh<u>are</u>","p<u>eer</u>","rep<u>air</u>","p<u>ear</u>"],answer:"p<u>eer</u>",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có phần gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>share</span> <span class='p-phonetic'>/ʃeə/</span> = <span class='p-mean'>chia sẻ → /eə/</span></div>
 <div><span class='hl-green'>peer</span> <span class='p-phonetic'>/pɪə/</span> = <span class='p-mean'>bạn đồng trang lứa → /ɪə/</span></div>
 <div><span class='p-word'>repair</span> <span class='p-phonetic'>/rɪˈpeə/</span> = <span class='p-mean'>sửa chữa → /eə/</span></div>
 <div><span class='p-word'>pear</span> <span class='p-phonetic'>/peə/</span> = <span class='p-mean'>quả lê → /eə/</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"peer" đọc là /ɪə/ (âm i-ơ), khác hẳn ba từ kia đọc /eə/ (âm e-ơ).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>share, repair, pear đều là /eə/ nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: -eer thường đọc /ɪə/ (peer, deer); -are/-air/-ear (quả lê) đọc /eə/.</div>`},
{sec:"I",num:2,type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["toge<u>th</u>er","au<u>th</u>ority","heal<u>th</u>y","<u>th</u>rough"],answer:"toge<u>th</u>er",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có "th" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='hl-green'>together</span> <span class='p-phonetic'>/təˈɡeðə/</span> = <span class='p-mean'>cùng nhau → th đọc /ð/ (hữu thanh)</span></div>
 <div><span class='p-word'>authority</span> <span class='p-phonetic'>/ɔːˈθɒrəti/</span> = <span class='p-mean'>chính quyền → th đọc /θ/</span></div>
 <div><span class='p-word'>healthy</span> <span class='p-phonetic'>/ˈhelθi/</span> = <span class='p-mean'>khỏe mạnh → th đọc /θ/</span></div>
 <div><span class='p-word'>through</span> <span class='p-phonetic'>/θruː/</span> = <span class='p-mean'>xuyên qua → th đọc /θ/</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"together" có "th" đọc /ð/ (âm th rung – hữu thanh). Ba từ kia đọc /θ/ (âm th không rung) → together khác.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>authority, healthy, through đều /θ/.</span></li></ol>
 <div class="tip">🧠 Mẹo: /ð/ (rung) hay gặp ở the, this, they, together, mother; /θ/ (không rung) ở think, healthy, through.</div>`},
/* II */
{sec:"II",head:"Chọn từ có trọng âm khác các từ còn lại.",num:3,type:"mcq",
 q:"3. Choose the word whose stress pattern is different.",
 disp:["service","traffic","lively","advance"],answer:"advance",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>service</span> <span class='p-phonetic'>/ˈsɜːvɪs/</span> = <span class='p-mean'>dịch vụ → trọng âm 1</span></div>
 <div><span class='p-word'>traffic</span> <span class='p-phonetic'>/ˈtræfɪk/</span> = <span class='p-mean'>giao thông → trọng âm 1</span></div>
 <div><span class='p-word'>lively</span> <span class='p-phonetic'>/ˈlaɪvli/</span> = <span class='p-mean'>sôi động → trọng âm 1</span></div>
 <div><span class='hl-green'>advance</span> <span class='p-phonetic'>/ədˈvɑːns/</span> = <span class='p-mean'>tiến bộ/trước → trọng âm 2</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"ad-VANCE" nhấn âm tiết thứ HAI, còn ba từ kia đều nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>service, traffic, lively đều nhấn âm 1.</span></li></ol>`},
{sec:"II",num:4,type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["security","construction","underground","reliable"],answer:"underground",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>security</span> <span class='p-phonetic'>/sɪˈkjʊərəti/</span> = <span class='p-mean'>an ninh → trọng âm 2</span></div>
 <div><span class='p-word'>construction</span> <span class='p-phonetic'>/kənˈstrʌkʃn/</span> = <span class='p-mean'>xây dựng → trọng âm 2</span></div>
 <div><span class='hl-green'>underground</span> <span class='p-phonetic'>/ˈʌndəɡraʊnd/</span> = <span class='p-mean'>tàu điện ngầm → trọng âm 1</span></div>
 <div><span class='p-word'>reliable</span> <span class='p-phonetic'>/rɪˈlaɪəbl/</span> = <span class='p-mean'>đáng tin cậy → trọng âm 2</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"UN-der-ground" nhấn âm tiết ĐẦU, còn ba từ kia đều nhấn âm tiết thứ HAI.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>security, construction, reliable đều nhấn âm 2.</span></li></ol>`},
/* III */
{sec:"III",head:"Chọn từ hoặc cụm từ thích hợp nhất điền vào chỗ trống.",num:5,type:"mcq",
 q:"5. One of the disadvantages of city life is getting stuck ______ a traffic jam at rush hour.",
 disp:["on","in","at","between"],answer:"in",
 exp:`<div class="vnt">💬 Dịch: Một trong những bất lợi của cuộc sống thành thị là bị kẹt trong đám tắc đường vào giờ cao điểm.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>on</span> = <span class='p-mean'>trên</span></div><div><span class='hl-green'>in</span> = <span class='p-mean'>trong (stuck in a jam)</span></div>
 <div><span class='p-word'>at</span> = <span class='p-mean'>tại</span></div><div><span class='p-word'>between</span> = <span class='p-mean'>giữa</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Cụm cố định "get stuck IN a traffic jam" = bị kẹt trong đám tắc đường → dùng "in".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>on/at/between không đi với "stuck ... a traffic jam".</span></li></ol>
 <div class="tip">🧠 Nhớ: stuck IN a traffic jam (kẹt trong tắc đường).</div>`},
{sec:"III",num:6,type:"mcq",
 q:"6. Our ______ usually arrives early in the morning to collect trash in the neighbourhood.",
 disp:["delivery person","police officer","garbage collector","electrician"],answer:"garbage collector",
 exp:`<div class="vnt">💬 Dịch: Người thu gom rác của chúng tôi thường đến sớm vào buổi sáng để thu gom rác trong khu phố.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>delivery person</span> = <span class='p-mean'>người giao hàng</span></div><div><span class='p-word'>police officer</span> = <span class='p-mean'>cảnh sát</span></div>
 <div><span class='hl-green'>garbage collector</span> = <span class='p-mean'>người thu gom rác</span></div><div><span class='p-word'>electrician</span> = <span class='p-mean'>thợ điện</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"to collect trash" (thu gom rác) chính là việc của "garbage collector".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>delivery person/police officer/electrician không làm việc thu gom rác.</span></li></ol>`},
{sec:"III",num:7,type:"mcq",
 q:"7. Many people in the city prefer taking public transport ______ it's cheaper and more convenient.",
 disp:["because","although","if","when"],answer:"because",
 exp:`<div class="vnt">💬 Dịch: Nhiều người ở thành phố thích dùng phương tiện công cộng vì nó rẻ hơn và tiện lợi hơn.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='hl-green'>because</span> = <span class='p-mean'>vì (nêu lý do)</span></div><div><span class='p-word'>although</span> = <span class='p-mean'>mặc dù</span></div>
 <div><span class='p-word'>if</span> = <span class='p-mean'>nếu</span></div><div><span class='p-word'>when</span> = <span class='p-mean'>khi</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"rẻ hơn và tiện hơn" là LÝ DO khiến người ta thích phương tiện công cộng → dùng "because" (vì).</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>although (tương phản), if (điều kiện), when (thời gian) đều sai logic nhân–quả.</span></li></ol>`},
{sec:"III",num:8,type:"mcq",
 q:"8. To live a stress-free life, teenagers need to ______ between schoolwork and relaxation.",
 disp:["prioritise","maintain","balance","accomplish"],answer:"balance",
 exp:`<div class="vnt">💬 Dịch: Để sống một cuộc sống không căng thẳng, thanh thiếu niên cần cân bằng giữa việc học và thư giãn.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>prioritise</span> = <span class='p-mean'>ưu tiên</span></div><div><span class='p-word'>maintain</span> = <span class='p-mean'>du duy trì</span></div>
 <div><span class='hl-green'>balance</span> = <span class='p-mean'>cân bằng</span></div><div><span class='p-word'>accomplish</span> = <span class='p-mean'>hoàn thành</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Cấu trúc "balance BETWEEN A and B" = cân bằng giữa hai thứ → "balance between schoolwork and relaxation".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>prioritise/maintain/accomplish không đi với "between ... and ..." theo nghĩa cân bằng.</span></li></ol>`},
{sec:"III",num:9,type:"mcq",
 q:"9. The tradition of storytelling has been ______ for centuries, preserving the history of the village.",
 disp:["cut down","passed down","carried out","taken away"],answer:"passed down",
 exp:`<div class="vnt">💬 Dịch: Truyền thống kể chuyện đã được truyền lại qua nhiều thế kỷ, gìn giữ lịch sử của ngôi làng.</div>
 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>cut down</span> = <span class='p-mean'>chặt/cắt giảm</span></div><div><span class='hl-green'>passed down</span> = <span class='p-mean'>truyền lại (qua các thế hệ)</span></div>
 <div><span class='p-word'>carried out</span> = <span class='p-mean'>thực hiện</span></div><div><span class='p-word'>taken away</span> = <span class='p-mean'>lấy đi</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"pass down" = truyền lại (từ đời này sang đời khác). Truyền thống được truyền qua nhiều thế kỷ → "passed down".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>cut down (cắt giảm), carried out (thực hiện), taken away (lấy đi) không hợp với "truyền thống".</span></li></ol>
 <div class="tip">🧠 Nhớ: pass down/pass on = truyền lại (truyền thống, kỹ năng) qua các thế hệ.</div>`},
{sec:"III",num:10,type:"mcq",
 q:"10. When they first moved to their new house, they ______ anyone in the neighbourhood.",
 disp:["don't know","didn't know","knew","know"],answer:"didn't know",

 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>don't know</span> = <span class='p-mean'>hiện tại (sai)</span></div><div><span class='hl-green'>didn't know</span> = <span class='p-mean'>không quen (quá khứ phủ định)</span></div>
 <div><span class='p-word'>knew</span> = <span class='p-mean'>đã quen (quá khứ khẳng định)</span></div><div><span class='p-word'>know</span> = <span class='p-mean'>hiện tại (sai)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"When they first moved" (mới chuyển đến – QUÁ KHỨ). Mới đến nên CHƯA quen ai → quá khứ phủ định "didn't know".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>don't know/know là hiện tại (sai thì); "knew" (đã quen) trái logic "mới chuyển đến".</span></li></ol>`},
{sec:"III",num:11,type:"mcq",
 q:"11. ______ he feels before the presentation, ______ he will forget important details.",
 disp:["More anxious – more likely","More anxious – likelier","The more anxious – the more likelier","The more anxious – the more likely"],answer:"The more anxious – the more likely",
 exp:`<div class="vnt">💬 Dịch: Anh ấy càng lo lắng trước bài thuyết trình thì càng có khả năng quên mất các chi tiết quan trọng.</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. More anxious – more likely</span> = <span class='p-mean'>thiếu "The" ở đầu mỗi vế</span></div>
 <div><span class='p-word'>B. More anxious – likelier</span> = <span class='p-mean'>thiếu "The"</span></div>
 <div><span class='p-word'>C. The more anxious – the more likelier</span> = <span class='p-mean'>sai kép "more likelier"</span></div>
 <div><span class='hl-green'>D. The more anxious – the more likely</span> = <span class='p-mean'>đúng ✔</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>So sánh kép "càng...càng...": <b>The more</b> + adj + S + V, <b>the more</b> + adj + S + V. Cả hai vế đều phải có "The"; "likely" là tính từ dài → "the more likely".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>A, B thiếu "The" ở đầu; C dùng "more likelier" (sai kép: đã "likelier" thì không "more").</span></li></ol>
 <div class="tip">🧠 Nhớ: The + comparative..., the + comparative... (mỗi vế đều có "The").</div>`},
{sec:"III",num:12,type:"mcq",
 q:'12. Chase: "Do you need a hand with your history project?" – Annie: "______ I really don\'t know where to start."',
 disp:["I can help you with that.","I'll do it for you.","Sure. I'm happy to help.","That would be awesome, thank you!"],answer:"That would be awesome, thank you!",
 exp:`<div class="vnt">💬 Dịch: Chase: "Bạn có cần giúp một tay với bài dự án lịch sử không?" – Annie: "Thế thì tuyệt quá, cảm ơn cậu! Mình thực sự không biết bắt đầu từ đâu."</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. I can help you with that.</span> = <span class='p-mean'>Mình có thể giúp bạn. (người GIÚP nói – sai)</span></div>
 <div><span class='p-word'>B. I'll do it for you.</span> = <span class='p-mean'>Mình sẽ làm cho bạn. (người giúp nói – sai)</span></div>
 <div><span class='p-word'>C. Sure. I'm happy to help.</span> = <span class='p-mean'>Được, mình sẵn lòng giúp. (người giúp nói – sai)</span></div>
 <div><span class='hl-green'>D. That would be awesome, thank you!</span> = <span class='p-mean'>Thế thì tuyệt quá, cảm ơn! (nhận sự giúp đỡ) ✔</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Chase ĐỀ NGHỊ giúp Annie. Annie là người ĐƯỢC giúp và "không biết bắt đầu từ đâu" → cô ấy NHẬN lời: "That would be awesome, thank you!"</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>A, B, C đều là câu của NGƯỜI ĐI GIÚP — không hợp với Annie (người cần được giúp).</span></li></ol>`},

{sec:"IV",head:"Đọc thông báo lớp Yoga cộng đồng & chọn từ đúng cho mỗi chỗ trống.",num:13,type:"mcq",

 disp:["Take part","Hang out","Look forward","Cut down"],answer:"Take part",
 exp:`<div class="vnt">💬 Dịch: Hãy tham gia lớp yoga cộng đồng hằng tuần của chúng tôi, nơi bạn có thể tăng cường sức mạnh, sự dẻo dai và sự bình an trong tâm hồn.</div>

 <div><span class='p-word'>Look forward</span> = <span class='p-mean'>mong chờ</span></div><div><span class='p-word'>Cut down</span> = <span class='p-mean'>cắt giảm</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Đây là lời mời tham gia lớp học → "Take part IN + lớp học" = tham gia lớp học.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>hang out (đi chơi), look forward (mong chờ), cut down (cắt giảm) không hợp lời mời tham gia lớp học.</span></li></ol>

 disp:["flexible","flexibly","flexibility","flexing"],answer:"flexibility",

 <ol><li>Phân tích 4 đáp án:<div class="grid2">
 <div><span class='p-word'>flexible</span> <span class='wt'>adj</span> = <span class='p-mean'>dẻo dai (tính từ)</span></div><div><span class='p-word'>flexibly</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách dẻo dai</span></div>
 <div><span class='hl-green'>flexibility</span> <span class='wt'>n</span> = <span class='p-mean'>sự dẻo dai (danh từ)</span></div><div><span class='p-word'>flexing</span> = <span class='p-mean'>(V-ing)</span></div></div></li>

{sec:"IV",num:15,type:"mcq",

 <div><span class='p-word'>regularly</span> = <span class='p-mean'>một cách đều đặn</span></div><div><span class='p-word'>physically</span> = <span class='p-mean'>về mặt thể chất</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Tập yoga cần ăn mặc THOẢI MÁI để dễ vận động → "dress comfortably" (trạng từ bổ nghĩa cho động từ "dress").</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>additionally/regularly/physically không hợp nghĩa với việc "ăn mặc" khi tập yoga.</span></li></ol>`},
{sec:"IV",num:16,type:"mcq",

 <div><span class='p-word'>accomplished</span> = <span class='p-mean'>được hoàn thành</span></div><div><span class='p-word'>managed</span> = <span class='p-mean'>được quản lý</span></div>
 <div><span class='p-word'>suggested</span> = <span class='p-mean'>được gợi ý</span></div><div><span class='hl-green'>provided</span> = <span class='p-mean'>được cung cấp</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"Mats will be provided" = thảm tập sẽ được CUNG CẤP sẵn (học viên không cần mang theo).</span></li>

{sec:"V",head:"Đọc đoạn văn ngắn về tàu điện & trả lời.",num:17,type:"mcq",
 q:`17. Chọn câu chủ đề (topic sentence) MỞ ĐẦU đoạn văn phù hợp nhất:
 <div class="passage">______ Since they run on electricity, they produce much less air pollution than cars or motorbikes. [...] For a greener future, every city should invest in a metro system.</div>`,
 disp:["The metro system is a great way to make cities more environmentally friendly.","That's why having a metro system is important for any modern city in the world.","In growing cities, we need to use metro in order to avoid traffic congestion.","As cities expand, authorities need to build more metro lines downtown."],
 answer:"The metro system is a great way to make cities more environmentally friendly.",
 exp:`<div class="vnt">💬 Dịch: <strong>The metro system is a great way to make cities more environmentally friendly.</strong> (Hệ thống tàu điện là một cách tuyệt vời để khiến các thành phố thân thiện với môi trường hơn.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='hl-green'>A. The metro system is a great way to make cities more environmentally friendly.</span> = <span class='p-mean'>Tàu điện là cách tuyệt vời giúp thành phố thân thiện môi trường hơn. (câu chủ đề ✔)</span></div>
 <div><span class='p-word'>B. That's why having a metro system is important for any modern city in the world.</span> = <span class='p-mean'>"That's why..." → là câu KẾT, không mở đầu.</span></div>
 <div><span class='p-word'>C. In growing cities, we need to use metro in order to avoid traffic congestion.</span> = <span class='p-mean'>Nói về tránh tắc đường, lệch ý "ít ô nhiễm" ở sau.</span></div>
 <div><span class='p-word'>D. As cities expand, authorities need to build more metro lines downtown.</span> = <span class='p-mean'>Nói về xây thêm tuyến, lệch ý môi trường.</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Cả đoạn nói tàu điện "ít gây ô nhiễm không khí" và "vì tương lai xanh". Câu chủ đề phải NÊU Ý CHÍNH đó → câu A về "thân thiện với môi trường".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>B bắt đầu bằng "That's why" (câu kết luận); C, D nói về tắc đường/xây tuyến — lệch ý chính "môi trường".</span></li></ol>
 <div class="tip">🧠 Mẹo: câu chủ đề nêu Ý CHÍNH của cả đoạn và không bắt đầu bằng từ nối kết luận (That's why, So...).</div>`},
{sec:"V",num:18,type:"mcq",
 q:`18. Sắp xếp các câu (a–c) cho hợp lý:
 <div class="orderbox">
   <div><b>a.</b> As a result, the air becomes cleaner and the city becomes a healthier place to live.</div>
   <div><b>b.</b> When more people choose to use the metro, it helps reduce the number of private vehicles on the road.</div>
   <div><b>c.</b> This leads to less traffic congestion and a significant decrease in carbon emissions.</div>
 </div><div style="font-weight:800;margin-top:4px">👉 Chọn thứ tự đúng:</div>`,
 disp:["c – b – a","b – c – a","c – a – b","a – b – c"],answer:"b – c – a",
 exp:`<div class="vnt">💬 Dịch nghĩa từng câu:</div>
 <div class="gcol">
 <div><b>a.</b> <span class='p-mean'>Kết quả là, không khí trở nên sạch hơn và thành phố trở thành nơi sống khỏe mạnh hơn.</span></div>
 <div><b>b.</b> <span class='p-mean'>Khi nhiều người chọn đi tàu điện, nó giúp giảm số lượng xe cá nhân trên đường.</span></div>
 <div><b>c.</b> <span class='p-mean'>Điều này dẫn đến ít tắc đường hơn và giảm đáng kể khí thải carbon.</span></div></div>
 <ol><li><span class="hl-green">✅ THỨ TỰ ĐÚNG: b – c – a</span></li>
 <li><span class='p-grammar'>Chuỗi nhân–quả: nhiều người đi tàu → giảm xe cá nhân (b) → "This leads to" ít tắc & khí thải (c) → "As a result" không khí sạch hơn (a). Bám từ nối: This leads to → As a result.</span></li>
 <li><span class="hl-red">❌ Vì sao khác sai?</span> <span class='p-grammar'>Câu b nêu nguyên nhân gốc nên đứng đầu; "This leads to"(c) và "As a result"(a) là hệ quả nên đứng sau.</span></li></ol>
 <div class="tip">🧠 Mẹo: bám từ nối chỉ hệ quả — "This leads to..." rồi "As a result..." đứng sau nguyên nhân.</div>`},
/* VII */
{sec:"VII",head:"Nhìn biển báo/thông báo và chọn đáp án đúng.",num:25,type:"mcq",
 q:`25. What does the sign mean?
 <div class="signbox"><svg viewBox="0 0 220 204" width="195" height="181" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Biển tam giác cảnh báo có đèn tín hiệu phía trước">
   <path d="M110 16 L202 182 L18 182 Z" fill="#ffcf33" stroke="#c0392b" stroke-width="11" stroke-linejoin="round"/>
   <rect x="90" y="74" width="40" height="86" rx="9" fill="#2c3e50"/>
   <circle cx="110" cy="94" r="12" fill="#e74c3c"/>
   <circle cx="110" cy="118" r="12" fill="#f1c40f"/>
   <circle cx="110" cy="142" r="12" fill="#2ecc71"/>
 </svg></div>`,
 disp:["There are traffic signals ahead.","There are no traffic signals in this area.","The traffic signals ahead are under maintenance.","Vehicles mustn't stop at the traffic signals."],
 answer:"There are traffic signals ahead.",
 exp:`<div class="vnt">💬 Dịch: <strong>There are traffic signals ahead.</strong> (Biển này nghĩa là "Phía trước có đèn tín hiệu giao thông.")</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='hl-green'>A. There are traffic signals ahead.</span> = <span class='p-mean'>Phía trước có đèn tín hiệu giao thông. ✔</span></div>
 <div><span class='p-word'>B. There are no traffic signals in this area.</span> = <span class='p-mean'>Khu vực này không có đèn tín hiệu. (ngược)</span></div>
 <div><span class='p-word'>C. The traffic signals ahead are under maintenance.</span> = <span class='p-mean'>Đèn tín hiệu phía trước đang bảo trì. (không có thông tin này)</span></div>
 <div><span class='p-word'>D. Vehicles mustn't stop at the traffic signals.</span> = <span class='p-mean'>Xe không được dừng ở đèn tín hiệu. (sai)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Biển hình TAM GIÁC màu vàng viền đỏ là biển CẢNH BÁO. Bên trong vẽ cột đèn tín hiệu (3 đèn đỏ–vàng–xanh) → cảnh báo "phía trước có đèn tín hiệu".</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>Biển cảnh báo báo hiệu CÓ đèn phía trước, không phải "không có", "đang bảo trì" hay "cấm dừng".</span></li></ol>
 <div class="tip">🧠 Biển TAM GIÁC vàng viền đỏ = CẢNH BÁO điều vẽ bên trong sắp xuất hiện phía trước.</div>`},
{sec:"VII",num:26,type:"mcq",
 q:`26. What does the notice mean?
 <div class="signbox"><svg viewBox="0 0 240 214" width="205" height="183" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thông báo cấm mang đồ ăn thức uống bên ngoài vào phòng gym">

 </svg></div>`,
 disp:["Do not bring any food or drinks into the gym at any time.","You can eat or drink in the gym at certain hours.","Eating and drinking are allowed in some areas of the gym.","Food and drinks cannot be brought outside of the gym."],
 answer:"Do not bring any food or drinks into the gym at any time.",
 exp:`<div class="vnt">💬 Dịch: <strong>Do not bring any food or drinks into the gym at any time.</strong> (Thông báo nghĩa là "Không được mang bất kỳ đồ ăn hay thức uống nào vào phòng gym vào bất cứ lúc nào.")</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='hl-green'>A. Do not bring any food or drinks into the gym at any time.</span> = <span class='p-mean'>Không được mang đồ ăn/uống vào phòng gym bất cứ lúc nào. ✔</span></div>
 <div><span class='p-word'>B. You can eat or drink in the gym at certain hours.</span> = <span class='p-mean'>Được ăn uống trong gym vào một số giờ. (sai)</span></div>
 <div><span class='p-word'>C. Eating and drinking are allowed in some areas of the gym.</span> = <span class='p-mean'>Được ăn uống ở một số khu vực. (sai)</span></div>
 <div><span class='p-word'>D. Food and drinks cannot be brought outside of the gym.</span> = <span class='p-mean'>Không được mang đồ ăn RA NGOÀI gym. (hiểu ngược)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Bảng ghi "NO OUTSIDE FOOD OR DRINKS ALLOWED IN THE GYM" (cấm mang đồ ăn/uống từ bên ngoài vào gym) kèm hình cốc + burger bị gạch chéo đỏ → "Không được mang đồ ăn thức uống vào gym."</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>B, C cho phép ăn uống (ngược); D hiểu "outside" là mang RA ngoài (sai — "outside food" nghĩa là đồ ăn từ bên ngoài mang vào).</span></li></ol>
 <div class="tip">🧠 "outside food" = đồ ăn từ bên ngoài (mang vào). "No ... allowed" = không được phép.</div>`},
/* X */
{sec:"X",head:"Chọn câu có nghĩa gần nhất với câu gốc.",num:37,type:"mcq",
 q:"37. Don't stand on the edge of the swimming pool. You'll slip and fall.",
 disp:["Unless you stand on the edge of the swimming pool, you mustn't slip and fall.","Because you stand on the edge of the swimming pool, you'll slip and fall.","If you stand on the edge of the swimming pool, you may slip and fall.","Although you stand on the edge of the swimming pool, you can't slip and fall."],
 answer:"If you stand on the edge of the swimming pool, you may slip and fall.",
 exp:`<div class="vnt">💬 Dịch: <strong>If you stand on the edge of the swimming pool, you may slip and fall.</strong> (Nếu con đứng ở mép hồ bơi, con có thể bị trượt ngã.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. Unless you stand on the edge of the swimming pool, you mustn't slip and fall.</span> = <span class='p-mean'>Trừ khi... con không được trượt ngã (vô lý)</span></div>
 <div><span class='p-word'>B. Because you stand on the edge of the swimming pool, you'll slip and fall.</span> = <span class='p-mean'>Vì con đứng ở mép hồ nên con SẼ trượt ngã (nói như chắc chắn)</span></div>
 <div><span class='hl-green'>C. If you stand on the edge of the swimming pool, you may slip and fall.</span> = <span class='p-mean'>Nếu con đứng ở mép hồ, con CÓ THỂ trượt ngã. ✔</span></div>
 <div><span class='p-word'>D. Although you stand on the edge of the swimming pool, you can't slip and fall.</span> = <span class='p-mean'>Mặc dù... con không thể trượt ngã (ngược nghĩa)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"Don't do X. You'll Y" (đừng làm X kẻo Y) = "If you do X, you may Y" (nếu làm X thì có thể Y). "may" diễn tả khả năng/cảnh báo → câu C.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>A dùng "Unless" (trừ khi) sai; B dùng "Because ... will" (khẳng định chắc chắn – quá mạnh); D "Although ... can't" ngược nghĩa.</span></li></ol>
 <div class="tip">🧠 Quy đổi: "Don't do X. You'll Y." ⇔ "If you do X, you may Y."</div>`},
{sec:"X",num:38,type:"mcq",
 q:"38. It's not easy for teenagers to concentrate on schoolwork while using phones.",
 disp:["Teenagers face difficulty to concentrate on schoolwork while using phones.","Teenagers face difficult concentrating on schoolwork while using phones.","Teenagers find it difficulty concentrating on schoolwork while using phones.","Teenagers find it difficult to concentrate on schoolwork while using phones."],
 answer:"Teenagers find it difficult to concentrate on schoolwork while using phones.",
 exp:`<div class="vnt">💬 Dịch: <strong>Teenagers find it difficult to concentrate on schoolwork while using phones.</strong> (Thanh thiếu niên thấy khó tập trung vào việc học khi vừa dùng điện thoại.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. Teenagers face difficulty to concentrate on schoolwork while using phones.</span> = <span class='p-mean'>face difficulty TO concentrate (sai: difficulty + to-V)</span></div>
 <div><span class='p-word'>B. Teenagers face difficult concentrating on schoolwork while using phones.</span> = <span class='p-mean'>face DIFFICULT concentrating (sai: tính từ + V-ing)</span></div>
 <div><span class='p-word'>C. Teenagers find it difficulty concentrating on schoolwork while using phones.</span> = <span class='p-mean'>find it DIFFICULTY concentrating (sai: find it + DANH TỪ)</span></div>
 <div><span class='hl-green'>D. Teenagers find it difficult to concentrate on schoolwork while using phones.</span> = <span class='p-mean'>find it DIFFICULT to concentrate. ✔</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"It's not easy for sb to do sth" = "sb find it difficult TO do sth". Cấu trúc: find + it + TÍNH TỪ (difficult) + TO + V. → câu D.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>A dùng "difficulty to" sai; B dùng "difficult concentrating" sai; C dùng "find it difficulty" (phải là tính từ "difficult").</span></li></ol>
 <div class="tip">🧠 Nhớ: find/think + it + ADJ + to V (find it difficult to do sth = thấy khó làm gì).</div>`},
/* XI */
{sec:"XI",head:"Chọn câu đúng nhất được tạo từ các từ gợi ý cho sẵn.",num:39,type:"mcq",
 q:"39. The Millers/ look/ a small apartment/ downtown LA/ present.",
 disp:["The Millers are looking for a small apartment in downtown LA at present.","The Millers are looking up a small apartment at downtown LA for present.","The Millers look for a small apartment in downtown LA for present.","The Millers look up a small apartment at downtown LA at present."],
 answer:"The Millers are looking for a small apartment in downtown LA at present.",
 exp:`<div class="vnt">💬 Dịch: <strong>The Millers are looking for a small apartment in downtown LA at present.</strong> (Gia đình Miller hiện đang tìm một căn hộ nhỏ ở khu trung tâm Los Angeles.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='hl-green'>A. The Millers are looking for a small apartment in downtown LA at present.</span> = <span class='p-mean'>are looking FOR... in downtown LA at present. ✔</span></div>
 <div><span class='p-word'>B. The Millers are looking up a small apartment at downtown LA for present.</span> = <span class='p-mean'>looking UP... at downtown... for present (sai cụm & giới từ)</span></div>
 <div><span class='p-word'>C. The Millers look for a small apartment in downtown LA for present.</span> = <span class='p-mean'>look for... for present (sai thì & "for present")</span></div>
 <div><span class='p-word'>D. The Millers look up a small apartment at downtown LA at present.</span> = <span class='p-mean'>look UP... at downtown (sai thì & "look up")</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"at present" (hiện nay) → hiện tại tiếp diễn "are looking". "look FOR" = tìm kiếm; "IN downtown LA" (đúng giới từ). → câu A.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"look up" = tra cứu (sai nghĩa); "at downtown" sai (phải "in downtown"); "for present" sai (phải "at present"); C, D dùng hiện tại đơn không hợp "at present".</span></li></ol>
 <div class="tip">🧠 Nhớ: look FOR = tìm; at present → hiện tại tiếp diễn (are looking); in downtown.</div>`},
{sec:"XI",num:40,type:"mcq",
 q:"40. Visitors/ make pottery/ they/ attend/ exhibits/ the museum.",
 disp:["Visitors can make pottery, but they can attend exhibits in the museum.","Visitors can make pottery, or they can attend exhibits at the museum.","Visitors may make pottery, so they may attend exhibits in the museum.","Visitors must make pottery, for they must attend exhibits at the museum."],
 answer:"Visitors can make pottery, or they can attend exhibits at the museum.",
 exp:`<div class="vnt">💬 Dịch: <strong>Visitors can make pottery, or they can attend exhibits at the museum.</strong> (Khách tham quan có thể làm gốm, hoặc họ có thể tham dự các buổi triển lãm tại bảo tàng.)</div>
 <ol><li>Phân tích 4 đáp án:<div class="gcol">
 <div><span class='p-word'>A. Visitors can make pottery, but they can attend exhibits in the museum.</span> = <span class='p-mean'>...BUT they can attend... (sai: "but" – tương phản)</span></div>
 <div><span class='hl-green'>B. Visitors can make pottery, or they can attend exhibits at the museum.</span> = <span class='p-mean'>...OR they can attend exhibits AT the museum. ✔</span></div>
 <div><span class='p-word'>C. Visitors may make pottery, so they may attend exhibits in the museum.</span> = <span class='p-mean'>...SO they may attend... (sai: "so" – kết quả)</span></div>
 <div><span class='p-word'>D. Visitors must make pottery, for they must attend exhibits at the museum.</span> = <span class='p-mean'>must... FOR they must... (sai: "must/for" – ép buộc)</span></div></div></li>
 <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>Đây là hai LỰA CHỌN hoạt động ở bảo tàng (làm gốm HOẶC xem triển lãm) → dùng "or". "can" (có thể) + "at the museum" (đúng giới từ). → câu B.</span></li>
 <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"but" (tương phản), "so" (kết quả), "must...for" (ép buộc) đều sai logic "hai lựa chọn"; "in the museum" kém tự nhiên hơn "at the museum".</span></li></ol>
 <div class="tip">🧠 Nhớ: "or" nối hai LỰA CHỌN; attend exhibits AT the museum.</div>`}
];

/* ===== AUDIO ===== */
let AC;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function ding(){const c=ac(),n=c.currentTime;[880,1320,1760].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,n+i*.08);g.gain.linearRampToValueAtTime(.25,n+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.4);o.start(n+i*.08);o.stop(n+i*.08+.42)})}
function buzz(){const c=ac(),n=c.currentTime;[300,220,160].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,n+i*.13);g.gain.exponentialRampToValueAtTime(.001,n+i*.13+.12);o.start(n+i*.13);o.stop(n+i*.13+.13)})}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d'),cols=['#ffcf4d','#e76f51','#d2691e','#00D26A','#f4a261','#ff9a56'],P=[];for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});let t=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);t++;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore()});if(t<130)requestAnimationFrame(loop);else cv.remove()})()}

/* ===== HELPERS ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const state={};let answered=0;const TOTAL=DATA.length;
function updateProg(){document.getElementById('progtxt').textContent=answered+' / '+TOTAL;document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%'}

/* ===== RENDER ===== */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){const s=document.createElement('div');s.className='sec';s.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;quiz.appendChild(s)}
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  const zone=document.createElement('div');card.appendChild(zone);
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=it.exp;card.appendChild(exp);
  quiz.appendChild(card);
  renderMCQ(it,idx,zone,exp);
});
updateProg();
function markDone(idx,ok){if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg()}}
function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div');wrap.className='opts';
  shuffle(it.disp).forEach(txt=>{
    const b=document.createElement('div');b.className='opt';b.innerHTML=txt;
    b.onclick=()=>{if(state[idx])return;const all=wrap.querySelectorAll('.opt');all.forEach(x=>x.classList.add('locked'));
      if(txt===it.answer){b.classList.add('correct');ding();confetti();markDone(idx,true)}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim')});setTimeout(()=>b.classList.remove('shake'),450)}
      exp.classList.add('open')};
    wrap.appendChild(b)});
  zone.appendChild(wrap);
}
/* ===== SUBMIT ===== */
function openName(){document.getElementById('nameMask').classList.add('show');setTimeout(()=>document.getElementById('nameInput').focus(),100)}
function doSubmit(){const inp=document.getElementById('nameInput'),w=document.getElementById('nameWarn'),name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return}inp.classList.remove('err');w.textContent='';document.getElementById('nameMask').classList.remove('show');showResult(name)}
function showResult(name){let correct=0;for(let i=0;i<TOTAL;i++)if(state[i]==='ok')correct++;const pct=correct/TOTAL,s10=(pct*10).toFixed(2);let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con rực rỡ như lá thu! 🏆';fb='🏆🍁🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif'}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa nhé! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif'}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi làm lại nha! 🍂';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif'}
  document.getElementById('resGreet').textContent=greet;document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'),fbEl=document.getElementById('resFallback');fbEl.textContent=fb;fbEl.style.display='none';im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none'};im.onerror=()=>{im.style.display='none';fbEl.style.display='block'};im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block'}},2500);
  document.getElementById('resMask').classList.add('show');if(pct>=0.6){confetti();ding()}}
/* ===== FLOATS ===== */
(function(){const icons=['🍂','🍁','🌰','🐿️','🍄','🦔','🌾','🍎','🍂','🍁'];const p=document.getElementById('pattern');
  for(let i=0;i<10;i++){const s=document.createElement('span');s.className='float';s.textContent=icons[i%icons.length];s.style.left=Math.random()*100+'%';s.style.animationDuration=(18+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*24)+'s';s.style.fontSize=(1.6+Math.random()*1.7)+'rem';p.appendChild(s)}})();
</script>
