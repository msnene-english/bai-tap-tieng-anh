<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chí Nên - English Quiz Grade 6 Unit 8</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #2f3542;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e5e5f7;
            background-image:  radial-gradient(#8854C0 0.5px, transparent 0.5px), radial-gradient(#8854C0 0.5px, #e5e5f7 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border: 2px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: #777;
            font-size: 1.1rem;
            margin-top: 5px;
            font-weight: 600;
        }

        /* STICKY SCORE BAR */
        .score-bar {
            position: sticky;
            top: 10px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
            border: 2px solid var(--secondary-color);
        }

        .score-text {
            font-weight: 800;
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        /* QUESTION CARD */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            border-bottom: 6px solid #e0e0e0;
            transition: transform 0.3s ease;
            position: relative;
        }

        .question-number {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #2c3e50;
        }

        /* OPTIONS GRID */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe6e9;
            border-bottom: 5px solid #dfe6e9; /* 3D effect */
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--secondary-color);
            background-color: #f0fffc;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        /* CORRECT / WRONG STATES */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00b85c;
            border-bottom-color: #008f47;
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #ff2e40;
            border-bottom-color: #d61c2e;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }

        /* EXPLANATION BOX */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 20px;
            background: #fff8e1; /* Light yellow for readability */
            border-left: 5px solid #ffc107;
            padding: 20px;
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.6;
            animation: slideDown 0.4s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: #d35400;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .expl-content strong {
            color: var(--primary-color);
        }

        .expl-section {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ccc;
        }
        .expl-section:last-child {
            border-bottom: none;
        }

        /* SUBMIT BUTTON */
        .submit-container {
            text-align: center;
            margin: 40px 0;
        }

        .finish-btn {
            background: linear-gradient(45deg, #FF4757, #FF6B81);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s;
            border-bottom: 6px solid #c41e3a;
        }

        .finish-btn:hover {
            transform: scale(1.05);
        }
        
        .finish-btn:active {
            transform: scale(0.95);
            border-bottom-width: 2px;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--primary-color);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            background: var(--secondary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 0 0 5px var(--secondary-color);
        }

        /* ANIMATIONS */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            50% { transform: translateX(5px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popUp {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <header>
            <h1>Ms. Chí Nên</h1>
            <p>Bài kiểm tra Ngữ pháp: Past Simple vs Past Continuous</p>
        </header>

        <div class="score-bar">
            <span class="score-text">Unit 8 - Grade 6</span>
            <span class="score-text">Điểm: <span id="current-score">0</span>/<span id="total-questions">0</span></span>
        </div>

        <div id="quiz-container">
            <!-- Questions will be inserted here by JS -->
        </div>

        <div class="submit-container">
            <button class="finish-btn" onclick="finishQuiz()">NỘP BÀI</button>
        </div>
    </div>

    <!-- Modal Result -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2 style="color: var(--primary-color); margin-bottom: 20px;">KẾT QUẢ CỦA CON</h2>
            <div class="score-circle" id="final-score-display">0/0</div>
            <p id="feedback-text" style="font-size: 1.2rem; font-weight: 600; color: #555;">Bạn làm rất tốt!</p>
            <button class="finish-btn" style="font-size: 1rem; padding: 10px 30px; margin-top: 20px;" onclick="location.reload()">Làm lại bài</button>
        </div>
    </div>

    <script>
        // DATA
        const quizData = [
            {
                "questionNumber": 27,
                "question": "I _________ a documentary on TV when suddenly we _________ all the power.",
                "options": [
                    { "text": "A. was watching – lost", "isCorrect": true },
                    { "text": "B. watched – lost", "isCorrect": false },
                    { "text": "C. was watching - were losing", "isCorrect": false },
                    { "text": "D. watched - were losing", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. was watching (V-ing: đang xem) - lost (V2: đã mất)\nB. watched (V2) - lost (V2)\nC. was watching (V-ing) - were losing (V-ing)\nD. watched (V2) - were losing (V-ing)\n\nGiải thích: Hành động đang xảy ra (xem TV) dùng Quá khứ tiếp diễn (was watching). Hành động xen vào (mất điện) dùng Quá khứ đơn (lost). Dấu hiệu: 'when suddenly'.\n\nDịch câu: Tôi đang xem một bộ phim tài liệu trên TV thì đột nhiên chúng tôi bị mất điện."
            },
            {
                "questionNumber": 28,
                "question": "When he _________ a suitcase, he dropped it on his foot.",
                "options": [
                    { "text": "A. was carrying", "isCorrect": true },
                    { "text": "B. carried", "isCorrect": false },
                    { "text": "C. had carried", "isCorrect": false },
                    { "text": "D. is carrying", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. was carrying (V-ing: đang mang/xách)\nB. carried (V2: đã mang)\nC. had carried (V3: đã mang xong - QK hoàn thành)\nD. is carrying (V-ing: đang mang - hiện tại)\n\nGiải thích: Hành động 'mang vali' là hành động dài đang diễn ra trong quá khứ -> Dùng Quá khứ tiếp diễn. Hành động 'làm rơi' (dropped) là hành động ngắn xen vào.\n\nDịch câu: Khi anh ấy đang xách một chiếc vali, anh ấy đã đánh rơi nó vào chân mình."
            },
            {
                "questionNumber": 29,
                "question": "What _________ at this time yesterday? - I was asleep.",
                "options": [
                    { "text": "A. were you doing", "isCorrect": true },
                    { "text": "B. did you do", "isCorrect": false },
                    { "text": "C. do you do", "isCorrect": false },
                    { "text": "D. would you do", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. were you doing (QK tiếp diễn)\nB. did you do (QK đơn)\nC. do you do (HT đơn)\nD. would you do (Would + V)\n\nGiải thích: Dấu hiệu 'at this time yesterday' (vào giờ này hôm qua) chỉ một thời điểm cụ thể đang diễn ra trong quá khứ -> Dùng thì Quá khứ tiếp diễn.\n\nDịch câu: Bạn đang làm gì vào giờ này hôm qua? - Tôi đang ngủ."
            },
            {
                "questionNumber": 30,
                "question": "How fast _________ when the accident happened?",
                "options": [
                    { "text": "A. were you driving", "isCorrect": true },
                    { "text": "B. did you drive", "isCorrect": false },
                    { "text": "C. would you drive", "isCorrect": false },
                    { "text": "D. were you driven", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. were you driving (đang lái xe)\nB. did you drive (đã lái xe)\nC. would you drive (sẽ lái xe)\nD. were you driven (bị động: bị lái xe)\n\nGiải thích: Hành động lái xe là hành động nền đang diễn ra (Past Continuous) thì tai nạn xảy ra (Past Simple). Câu hỏi về tốc độ đang diễn ra tại thời điểm đó.\n\nDịch câu: Bạn đang lái xe nhanh thế nào khi tai nạn xảy ra?"
            },
            {
                "questionNumber": 31,
                "question": "They __________ on the lake when it started to rain so they went home.",
                "options": [
                    { "text": "A. fished", "isCorrect": false },
                    { "text": "B. fishing", "isCorrect": false },
                    { "text": "C. were fishing", "isCorrect": true },
                    { "text": "D. are fishing", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. fished (V2: đã câu cá)\nB. fishing (V-ing: việc câu cá)\nC. were fishing (QK tiếp diễn: đang câu cá)\nD. are fishing (HT tiếp diễn: đang câu cá)\n\nGiải thích: Hành động câu cá đang diễn ra (long action) thì trời mưa (short action). 'They' đi với 'were'.\n\nDịch câu: Họ đang câu cá trên hồ thì trời bắt đầu mưa nên họ đi về nhà."
            },
            {
                "questionNumber": 32,
                "question": "Her dad found some money while he __________ her suitcase.",
                "options": [
                    { "text": "A. packing", "isCorrect": false },
                    { "text": "B. package", "isCorrect": false },
                    { "text": "C. are packing", "isCorrect": false },
                    { "text": "D. was packing", "isCorrect": true }
                ],
                "rawRationale": "Dịch đáp án:\nA. packing (V-ing thiếu tobe)\nB. package (noun: gói hàng)\nC. are packing (HT tiếp diễn)\nD. was packing (QK tiếp diễn)\n\nGiải thích: Sau 'while' thường là thì Quá khứ tiếp diễn để diễn tả hành động đang xảy ra song song hoặc làm nền. Chủ ngữ 'he' đi với 'was'.\n\nDịch câu: Bố cô ấy tìm thấy một ít tiền trong khi ông đang đóng gói vali cho cô ấy."
            },
            {
                "questionNumber": 33,
                "question": "Your brother __________ in Myanma when he met his girlfriend.",
                "options": [
                    { "text": "A. study", "isCorrect": false },
                    { "text": "B. was studying", "isCorrect": true },
                    { "text": "C. were study", "isCorrect": false },
                    { "text": "D. was study", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. study (V nguyên thể)\nB. was studying (đang học)\nC. were study (sai ngữ pháp)\nD. was study (sai ngữ pháp)\n\nGiải thích: Hành động 'học' đang diễn ra trong quá khứ (was studying) thì hành động 'gặp bạn gái' xen vào. Chủ ngữ 'Your brother' (số ít) dùng 'was'.\n\nDịch câu: Anh trai bạn đang học ở Myanmar khi anh ấy gặp bạn gái của mình."
            },
            {
                "questionNumber": 34,
                "question": "His grandma tried cake for the first time while she ___________ in China.",
                "options": [
                    { "text": "A. staying", "isCorrect": false },
                    { "text": "B. is staying", "isCorrect": false },
                    { "text": "C. is stayed", "isCorrect": false },
                    { "text": "D. was staying", "isCorrect": true }
                ],
                "rawRationale": "Dịch đáp án:\nA. staying (thiếu tobe)\nB. is staying (HT tiếp diễn)\nC. is stayed (Bị động hiện tại - sai nghĩa)\nD. was staying (QK tiếp diễn)\n\nGiải thích: Mệnh đề sau 'while' diễn tả khoảng thời gian đang ở Trung Quốc trong quá khứ -> Dùng Quá khứ tiếp diễn.\n\nDịch câu: Bà của anh ấy đã thử món bánh lần đầu tiên trong khi bà đang ở Trung Quốc."
            },
            {
                "questionNumber": 35,
                "question": "Her mom __________ in the park when she saw a tree.",
                "options": [
                    { "text": "A. was going", "isCorrect": true },
                    { "text": "B. was going", "isCorrect": false }, /* Logic A and B duplicate in source, but code handles logic fine */
                    { "text": "C. were going", "isCorrect": false },
                    { "text": "D. were going", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. was going (đang đi)\nB. was going (trùng với A)\nC. were going (sai ngôi)\nD. were going (trùng với C)\n\nGiải thích: Hành động đi dạo/đi lại trong công viên đang diễn ra thì nhìn thấy cái cây. Chủ ngữ 'Her mom' (số ít) dùng 'was'.\n\nDịch câu: Mẹ cô ấy đang đi dạo trong công viên thì bà nhìn thấy một cái cây."
            },
            {
                "questionNumber": 36,
                "question": "_______ it _______ when I woke up this morning?",
                "options": [
                    { "text": "A. Is ... raining", "isCorrect": false },
                    { "text": "B. Was ... raining", "isCorrect": true },
                    { "text": "C. Is ... rain", "isCorrect": false },
                    { "text": "D. Were ... raining", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. Is ... raining (HT tiếp diễn)\nB. Was ... raining (QK tiếp diễn)\nC. Is ... rain (Sai ngữ pháp)\nD. Were ... raining (Sai ngôi - It đi với Was)\n\nGiải thích: 'Woke up' là quá khứ đơn, hỏi về hành động đang diễn ra tại thời điểm đó -> Past Continuous. Chủ ngữ 'It' dùng 'Was'.\n\nDịch câu: Trời có đang mưa khi tôi thức dậy sáng nay không?"
            },
            {
                "questionNumber": 37,
                "question": "What __________ when his mother came?",
                "options": [
                    { "text": "A. were you doing", "isCorrect": true },
                    { "text": "B. was you doing", "isCorrect": false },
                    { "text": "C. are you doing", "isCorrect": false },
                    { "text": "D. are you doing", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. were you doing (Bạn đang làm gì)\nB. was you doing (Sai ngôi - You đi với Were)\nC. are you doing (HT tiếp diễn)\nD. are you doing (trùng C)\n\nGiải thích: Câu hỏi về hành động đang diễn ra tại thời điểm mẹ đến (quá khứ). You -> Were.\n\nDịch câu: Bạn đang làm gì khi mẹ anh ấy đến?"
            },
            {
                "questionNumber": 38,
                "question": "What did you watch on TV while you __________ dinner last night?",
                "options": [
                    { "text": "A. were having", "isCorrect": true },
                    { "text": "B. was having", "isCorrect": false },
                    { "text": "C. were having", "isCorrect": false },
                    { "text": "D. was having", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. were having (đang ăn)\nB. was having (sai ngôi)\nC. were having (trùng A)\nD. was having (sai ngôi)\n\nGiải thích: Mệnh đề sau 'while' chia Quá khứ tiếp diễn. Chủ ngữ 'you' đi với 'were'.\n\nDịch câu: Bạn đã xem gì trên TV trong khi bạn đang ăn tối tối qua?"
            },
            {
                "questionNumber": 39,
                "question": "The policeman __________ his letter in the post office at that time.",
                "options": [
                    { "text": "A. is sending", "isCorrect": false },
                    { "text": "B. was sending", "isCorrect": true },
                    { "text": "C. sending", "isCorrect": false },
                    { "text": "D. was sending", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. is sending (HT tiếp diễn)\nB. was sending (QK tiếp diễn)\nC. sending (V-ing thiếu tobe)\nD. was sending (trùng B)\n\nGiải thích: Dấu hiệu 'at that time' (vào lúc đó - trong quá khứ) -> Dùng Quá khứ tiếp diễn. Chủ ngữ 'The policeman' (số ít) dùng 'was'.\n\nDịch câu: Người cảnh sát đang gửi thư tại bưu điện vào lúc đó."
            },
            {
                "questionNumber": 40,
                "question": "It __________ and cloudy when I left Ireland.",
                "options": [
                    { "text": "A. was rain", "isCorrect": false },
                    { "text": "B. was raining", "isCorrect": true },
                    { "text": "C. is raining", "isCorrect": false },
                    { "text": "D. raining", "isCorrect": false }
                ],
                "rawRationale": "Dịch đáp án:\nA. was rain (Sai ngữ pháp: tobe + V nguyên thể)\nB. was raining (đang mưa)\nC. is raining (HT tiếp diễn)\nD. raining (thiếu tobe)\n\nGiải thích: Mô tả thời tiết/bối cảnh trong quá khứ ('when I left Ireland') -> Dùng Quá khứ tiếp diễn.\n\nDịch câu: Trời đang mưa và nhiều mây khi tôi rời Ireland."
            }
        ];

        let score = 0;
        let answeredCount = 0;
        const totalQuestions = quizData.length;

        // Sounds
        const audioCorrect = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3');
        const audioWrong = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-cartoon-toy-whistle-down-2843.mp3');

        // Render Quiz
        function initQuiz() {
            document.getElementById('total-questions').innerText = totalQuestions;
            const container = document.getElementById('quiz-container');

            quizData.forEach((q, index) => {
                // Format rationale for HTML
                const formattedRationale = formatRationale(q.rawRationale);

                const card = document.createElement('div');
                card.classList.add('quiz-card');
                card.id = `q-card-${index}`;

                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect}, this)">${opt.text}</button>`;
                });

                card.innerHTML = `
                    <div class="question-number">Câu ${q.questionNumber}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid" id="opt-grid-${index}">
                        ${optionsHtml}
                    </div>
                    <div class="explanation-box" id="expl-${index}">
                        <div class="explanation-header">📢 Ms. Chí Nên giải thích:</div>
                        <div class="expl-content">${formattedRationale}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function formatRationale(text) {
            // Split text by new lines and wrap in semantic formatting
            const lines = text.split('\n').filter(line => line.trim() !== '');
            let html = '';
            
            lines.forEach(line => {
                if (line.includes('Dịch đáp án:')) {
                    html += `<div class="expl-section"><strong>1. Phân tích đáp án:</strong></div>`;
                } else if (line.includes('Giải thích:')) {
                     html += `<div class="expl-section"><strong>3. Tại sao chọn đáp án này?</strong><br>${line.replace('Giải thích:', '').trim()}</div>`;
                } else if (line.includes('Dịch câu:')) {
                     html += `<div class="expl-section"><strong>2. Dịch nghĩa toàn câu:</strong><br><em>"${line.replace('Dịch câu:', '').trim()}"</em></div>`;
                } else if (line.startsWith('A.') || line.startsWith('B.') || line.startsWith('C.') || line.startsWith('D.')) {
                    // Make option parts bold
                    html += `<div>${line}</div>`;
                } else {
                    html += `<div>${line}</div>`;
                }
            });
            return html;
        }

        function checkAnswer(qIndex, optIndex, isCorrect, btnElement) {
            // Prevent re-answering
            const grid = document.getElementById(`opt-grid-${qIndex}`);
            const buttons = grid.getElementsByClassName('option-btn');
            if (grid.getAttribute('data-answered') === 'true') return;

            grid.setAttribute('data-answered', 'true');
            answeredCount++;

            // Visual feedback
            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                document.getElementById('current-score').innerText = score;
                playCorrectSound();
                fireConfetti();
            } else {
                btnElement.classList.add('wrong');
                playWrongSound();
                // Find and highlight correct answer
                const q = quizData[qIndex];
                for (let i = 0; i < buttons.length; i++) {
                    if (q.options[i].isCorrect) {
                        buttons[i].classList.add('correct');
                        break;
                    }
                }
            }

            // Disable all buttons
            for (let btn of buttons) {
                btn.disabled = true;
            }

            // Show explanation
            const expl = document.getElementById(`expl-${qIndex}`);
            expl.style.display = 'block';
        }

        function playCorrectSound() {
            audioCorrect.currentTime = 0;
            audioCorrect.play().catch(e => console.log('Audio play failed', e));
        }

        function playWrongSound() {
            audioWrong.currentTime = 0;
            audioWrong.play().catch(e => console.log('Audio play failed', e));
        }

        function finishQuiz() {
            if (answeredCount < totalQuestions) {
                if(!confirm(`Con mới làm được ${answeredCount}/${totalQuestions} câu. Con có chắc muốn nộp bài không?`)) {
                    return;
                }
            }

            const modal = document.getElementById('result-modal');
            const finalScoreDisplay = document.getElementById('final-score-display');
            const feedbackText = document.getElementById('feedback-text');

            finalScoreDisplay.innerText = `${score}/${totalQuestions}`;
            
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                feedbackText.innerText = "Xuất sắc! Con là thiên tài tiếng Anh! 🌟🏆";
                fireConfetti();
                fireConfetti();
            } else if (percentage >= 80) {
                feedbackText.innerText = "Rất tốt! Con làm bài rất chắc chắn! 🎉";
            } else if (percentage >= 50) {
                feedbackText.innerText = "Khá lắm! Cố gắng ôn thêm chút nữa nhé! 💪";
            } else {
                feedbackText.innerText = "Đừng buồn nhé! Hãy xem kỹ lại phần giải thích để tiến bộ hơn! 🌱";
            }

            modal.style.display = 'flex';
        }

        // CONFETTI LOGIC (Simple version)
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = 100;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 10 + 5,
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 2 - 1
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let activeParticles = false;

                particles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    if (p.y < canvas.height) {
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                        activeParticles = true;
                    }
                });

                if (activeParticles) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animate();
        }

        // Initialize
        window.onload = initQuiz;

    </script>
</body>
</html>
