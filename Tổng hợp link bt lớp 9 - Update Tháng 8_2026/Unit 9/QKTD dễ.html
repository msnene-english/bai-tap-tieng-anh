<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tập Thì Quá Khứ Tiếp Diễn - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh Ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #F0F4F8;
            --text-color: #2F3542;
            --card-bg: #FFFFFF;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --btn-shadow: rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e3f2fd;
            background-image: radial-gradient(#8854C0 1px, transparent 1px), radial-gradient(#00C9A7 1px, transparent 1px);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* Header */
        header {
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 0 rgba(136, 84, 192, 0.2);
            margin-bottom: 40px;
            border: 3px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            color: var(--primary-color);
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            margin: 0;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: #747d8c;
            font-weight: 600;
            margin-top: 10px;
        }

        .score-board {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-weight: 800;
            color: var(--secondary-color);
            z-index: 1000;
            border: 2px solid var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }

        /* Quiz Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05);
            border: 2px solid #f1f2f6;
            transition: transform 0.3s ease;
            position: relative;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
        }

        .question-number {
            display: inline-block;
            background: var(--primary-color);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #2f3542;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.5rem;
            }
        }

        .option-btn {
            background: #fff;
            border: 2px solid #e1e1e1;
            padding: 15px 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            box-shadow: 0 4px 0 #e1e1e1;
            outline: none;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f7f1ff;
            border-color: var(--primary-color);
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: #fff;
            border-color: #00b85c;
            box-shadow: 0 4px 0 #00b85c;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: #fff;
            border-color: #ff2e40;
            box-shadow: 0 4px 0 #ff2e40;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation {
            margin-top: 25px;
            padding: 20px;
            background-color: #f0fff4;
            border: 2px solid var(--correct-color);
            border-radius: 15px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation.visible {
            display: block;
        }

        .explanation h4 {
            margin: 0 0 10px 0;
            color: var(--correct-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            white-space: pre-wrap; /* Preserves newlines */
        }

        .explanation-content strong {
            color: var(--primary-color);
        }
        
        /* Hint Button */
        .hint-btn {
            background: none;
            border: none;
            color: #ffa502;
            cursor: pointer;
            font-weight: 700;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }
        
        .hint-text {
            display: none;
            color: #ffa502;
            font-style: italic;
            margin-top: 5px;
            font-size: 0.9rem;
        }

        /* Submit Section */
        .submit-section {
            text-align: center;
            margin: 50px 0;
        }

        .submit-btn {
            background: var(--secondary-color);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #00a388;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #fff;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--primary-color);
        }

        .final-score {
            font-size: 4rem;
            color: var(--primary-color);
            font-weight: 900;
            margin: 10px 0;
        }

        .modal-message {
            font-size: 1.2rem;
            color: #57606f;
            margin-bottom: 20px;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="score-board">
        <span>⭐</span> <span id="current-score">0</span>
    </div>

    <div class="container">
        <header>
            <h1>Luyện tập Thì Quá Khứ Tiếp Diễn</h1>
            <p>Giáo viên: Ms. Chí Nên (ULIS)</p>
            <p style="font-size: 0.9rem; color: #a4b0be;">Hãy chọn đáp án đúng nhất để xem giải thích chi tiết nhé!</p>
        </header>

        <div id="quiz-container">
            <!-- Questions will be rendered here via JavaScript -->
        </div>

        <div class="submit-section">
            <button class="submit-btn" onclick="finishQuiz()">NỘP BÀI 🚀</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2>Kết Quả Của Bạn</h2>
            <div class="final-score" id="final-score-display">0/30</div>
            <p class="modal-message" id="modal-message">Bạn làm tốt lắm!</p>
            <button class="submit-btn" onclick="location.reload()" style="font-size: 1.2rem; padding: 10px 30px;">Làm lại bài thi 🔄</button>
        </div>
    </div>

    <!-- Audio Elements -->
    <!-- Using reliable short sounds -->
    <audio id="sound-correct" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>

    let score = 0;
    let correctCount = 0;

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        
        quizData.questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `card-${index}`;

            // Tìm correct rationale để hiển thị nếu user chọn sai
            const correctOption = q.answerOptions.find(opt => opt.isCorrect);
            const correctRationale = correctOption ? correctOption.rationale : "Giải thích đang cập nhật...";

            // Create buttons HTML
            let optionsHtml = '';
            q.answerOptions.forEach((opt, optIndex) => {
                optionsHtml += `
                    <button class="option-btn" 
                            id="btn-${index}-${optIndex}"
                            onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect})">
                        ${String.fromCharCode(65 + optIndex)}. ${opt.text}
                    </button>
                `;
            });

            // Store rationales in data attributes to load dynamically
            const rationaleData = JSON.stringify(q.answerOptions.map(o => o.rationale || correctRationale));

            card.innerHTML = `
                <div class="question-number">Câu ${q.questionNumber}</div>
                <div class="question-text">${q.question}</div>
                <div class="options-grid">
                    ${optionsHtml}
                </div>
                
                <button class="hint-btn" onclick="toggleHint(${index})">
                    💡 Xem gợi ý
                </button>
                <div id="hint-${index}" class="hint-text">${q.hint}</div>

                <div class="explanation" id="expl-${index}">
                    <h4><span id="expl-icon-${index}"></span> Ms. Chí Nên giải thích:</h4>
                    <div class="explanation-content" id="expl-content-${index}"></div>
                </div>
                <input type="hidden" id="rationales-${index}" value='${rationaleData.replace(/'/g, "&#39;")}'>
            `;
            container.appendChild(card);
        });
    }

    function toggleHint(index) {
        const hintDiv = document.getElementById(`hint-${index}`);
        if (hintDiv.style.display === 'block') {
            hintDiv.style.display = 'none';
        } else {
            hintDiv.style.display = 'block';
        }
    }

    function checkAnswer(questionIndex, optionIndex, isCorrect) {
        const card = document.getElementById(`card-${questionIndex}`);
        const btns = card.querySelectorAll('.option-btn');
        const selectedBtn = document.getElementById(`btn-${questionIndex}-${optionIndex}`);
        const explBox = document.getElementById(`expl-${questionIndex}`);
        const explContent = document.getElementById(`expl-content-${questionIndex}`);
        const explIcon = document.getElementById(`expl-icon-${questionIndex}`);

        // Prevent multiple clicks
        if (card.classList.contains('answered')) return;
        card.classList.add('answered');

        // Disable all buttons
        btns.forEach(btn => btn.disabled = true);

        // Get rationales
        const rationales = JSON.parse(document.getElementById(`rationales-${questionIndex}`).value);
        let rationaleText = rationales[optionIndex];
        
        // Format newlines
        if (rationaleText === "...") {
             // Fallback if specific wrong rationale isn't provided in JSON (using correct one instead)
             const correctOptIndex = quizData.questions[questionIndex].answerOptions.findIndex(o => o.isCorrect);
             rationaleText = rationales[correctOptIndex];
        }
        
        explContent.innerHTML = rationaleText.replace(/\n/g, '<br>');

        if (isCorrect) {
            // Correct Logic
            selectedBtn.classList.add('correct');
            document.getElementById('sound-correct').play();
            explIcon.innerText = "✅";
            score += 10;
            correctCount++;
            document.getElementById('current-score').innerText = score;
            
            // Confetti
            const rect = selectedBtn.getBoundingClientRect();
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { 
                    x: (rect.left + rect.width / 2) / window.innerWidth, 
                    y: (rect.top + rect.height / 2) / window.innerHeight 
                }
            });

        } else {
            // Wrong Logic
            selectedBtn.classList.add('wrong');
            document.getElementById('sound-wrong').play();
            explIcon.innerText = "❌";
            
            // Highlight the correct answer
            quizData.questions[questionIndex].answerOptions.forEach((opt, idx) => {
                if (opt.isCorrect) {
                    document.getElementById(`btn-${questionIndex}-${idx}`).classList.add('correct');
                }
            });
        }

        // Show Explanation
        explBox.classList.add('visible');
    }

    function finishQuiz() {
        const total = quizData.questions.length;
        const modal = document.getElementById('result-modal');
        const scoreDisplay = document.getElementById('final-score-display');
        const messageDisplay = document.getElementById('modal-message');

        scoreDisplay.innerText = `${correctCount}/${total}`;

        if (correctCount === total) {
            messageDisplay.innerText = "Xuất sắc! Em là thiên tài ngữ pháp! 🏆";
            confetti({ particleCount: 500, spread: 100, origin: { y: 0.6 } });
        } else if (correctCount >= total * 0.8) {
            messageDisplay.innerText = "Rất giỏi! Chỉ sai một chút xíu thôi! 🌟";
        } else if (correctCount >= total * 0.5) {
            messageDisplay.innerText = "Cố gắng thêm nhé! Xem lại các câu sai để học tốt hơn. 💪";
        } else {
            messageDisplay.innerText = "Đừng buồn nhé! Hãy ôn tập lại lý thuyết và thử lại nào. 📚";
        }

        modal.style.display = 'flex';
    }

    // Initialize
    renderQuiz();
