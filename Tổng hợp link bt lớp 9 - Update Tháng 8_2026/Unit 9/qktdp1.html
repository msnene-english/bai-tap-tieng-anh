<html lang="vi">
<head>

    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh Ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #F0F3F8;
            --card-bg: #FFFFFF;
            --text-color: #2F3542;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --btn-shadow: 0px 4px 0px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1d8e0 15%, transparent 16%), radial-gradient(#d1d8e0 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 40px;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px var(--shadow-color);
            border-bottom: 5px solid var(--primary-color);
        }

        h1 {
            color: var(--primary-color);
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #747d8c;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* Quiz Card Styles */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px var(--shadow-color);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .question-number {
            background: var(--secondary-color);
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 3px 0 #009e82;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #2f3542;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #fff;
            border: 2px solid #dfe4ea;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: var(--btn-shadow) #dfe4ea;
            text-align: left;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            box-shadow: var(--btn-shadow) var(--primary-color);
            color: var(--primary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0px 0px 0px;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color);
            border-color: #00b85b;
            color: white;
            box-shadow: var(--btn-shadow) #00b85b;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            border-color: #e03b4b;
            color: white;
            box-shadow: var(--btn-shadow) #e03b4b;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #fff9c4; /* Vàng nhạt */
            border-left: 5px solid #fbc531;
            padding: 20px;
            border-radius: 10px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: #e1b12c;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            white-space: pre-line; /* Preserves line breaks */
            color: #333;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Footer */
        .footer-controls {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 60px;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #6c429c;
            transition: transform 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #6c429c;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0;
        }

        /* Modal Score */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 40px;
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 5px solid var(--primary-color);
            position: relative;
            animation: pop 0.4s ease-out;
        }

        .score-number {
            font-size: 4rem;
            font-weight: 900;
            color: var(--secondary-color);
            margin: 20px 0;
        }

        .close-btn {
            background: var(--wrong-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 0 #c43542;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>

                // Wrong sound (Low pitch sawtooth)
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- RENDER LOGIC ---
        let correctCount = 0;
        let answeredCount = 0;

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            quizData.questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `q-card-${index}`;

                // Question Header
                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.textContent = `Câu ${q.questionNumber}`;
                
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.textContent = q.question.replace(/_____/g, "_______"); // Make blanks standardized

                // Options Grid
                const grid = document.createElement('div');
                grid.className = 'options-grid';

                q.answerOptions.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `${String.fromCharCode(65 + optIndex)}. ${opt.text}`;
                    btn.onclick = () => checkAnswer(index, optIndex, opt.isCorrect, btn);
                    grid.appendChild(btn);
                });

                // Explanation Box
                const expl = document.createElement('div');
                expl.className = 'explanation-box';
                expl.id = `expl-${index}`;
                
                // Get the rationale (usually attached to the correct answer in this dataset)
                const rationaleText = q.answerOptions.find(o => o.isCorrect)?.rationale || "Đang cập nhật giải thích...";
                
                expl.innerHTML = `
                    <div class="explanation-header">
                        <span>💡</span> Ms MS Chí Nên giải thích:
                    </div>
                    <div class="explanation-content">${rationaleText}</div>
                `;

                card.appendChild(qNum);
                card.appendChild(qText);
                card.appendChild(grid);
                card.appendChild(expl);
                container.appendChild(card);
            });
            
            document.getElementById('final-score').textContent = `0/${quizData.questions.length}`;
        }

        // --- INTERACTION LOGIC ---
        function checkAnswer(qIndex, optIndex, isCorrect, btnElement) {
            const card = document.getElementById(`q-card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const explBox = document.getElementById(`expl-${qIndex}`);

            // Prevent re-answering
            if (card.dataset.answered) return;
            card.dataset.answered = "true";
            answeredCount++;

            // Highlight Logic
            if (isCorrect) {
                btnElement.classList.add('correct');
                playSound('correct');
                correctCount++;
                triggerConfetti(btnElement);
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                // Highlight the correct one automatically
                buttons.forEach(b => {
                    // Find the button that corresponds to the correct answer
                    // We need to match the text or index. 
                    // Since we passed optIndex, we can find the correct data index.
                    const qData = quizData.questions[qIndex];
                    const btnText = b.innerText.substring(3); // Remove "A. "
                    const correctOptText = qData.answerOptions.find(o => o.isCorrect).text;
                    if(btnText === correctOptText) {
                        b.classList.add('correct');
                    }
                });
            }

            // Disable all buttons in this card
            buttons.forEach(b => b.disabled = true);

            // Show explanation
            explBox.style.display = 'block';
        }

        // --- MODAL & SCORE ---
        function showFinalScore() {
            const modal = document.getElementById('scoreModal');
            const scoreText = document.getElementById('final-score');
            const praiseText = document.getElementById('praise-text');
            const total = quizData.questions.length;

            scoreText.textContent = `${correctCount}/${total}`;

            const percentage = (correctCount / total) * 100;
            if (percentage === 100) {
                praiseText.textContent = "Xuất sắc! Em là thiên tài ngữ pháp! 🌟";
                fullScreenConfetti();
            } else if (percentage >= 80) {
                praiseText.textContent = "Giỏi lắm! Em nắm rất chắc bài! 🎉";
                fullScreenConfetti();
            } else if (percentage >= 50) {
                praiseText.textContent = "Khá tốt! Cố gắng luyện thêm một chút nữa nhé! 💪";
            } else {
                praiseText.textContent = "Đừng buồn nhé! Hãy xem lại phần giải thích để tiến bộ hơn! ❤️";
            }

            modal.style.display = 'block';
        }

        function closeModal() {
            // Reload page to reset or just close modal
             location.reload();
        }

        // --- CONFETTI EFFECTS (Simplified) ---
        // Mini confetti burst on button
        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            const center = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
            createParticles(center.x, center.y);
        }

        // Canvas Confetti Logic
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];

        function createParticles(x, y) {
            const colors = ['#ff4757', '#2ed573', '#ffa502', '#3742fa', '#8854C0'];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 100,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 5 + 2
                });
            }
        }

        function fullScreenConfetti() {
            createParticles(window.innerWidth / 2, window.innerHeight / 2);
            setInterval(() => {
                createParticles(Math.random() * window.innerWidth, Math.random() * window.innerHeight / 2);
            }, 200);
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life--;
                p.size *= 0.95; // Shrink

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateConfetti);
        }
        
        // Start animation loop
        animateConfetti();

        // Handle resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initialize
        renderQuiz();

    </script>
</body>
