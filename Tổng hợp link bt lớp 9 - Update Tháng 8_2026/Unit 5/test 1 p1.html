<script>
(function(){const items=['🌌','🪐','🌠','✨','🌟','💫','🌙','🔭','⭐','🛸','☄️','🌑','✨','🪐','⭐','🌟'];
  const layer=document.getElementById('foodlayer');

    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(1.1+Math.random()*2.2)+'rem';
    s.style.animationDelay=(Math.random()*3.5)+'s';s.style.animationDuration=(2.5+Math.random()*3)+'s';layer.appendChild(s);}})();

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#a855f7','#ec4899','#22d3ee','#fde047','#7c3aed','#f9a8d4','#00D26A'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Cô MS Chí Nên · ULIS giải thích chi tiết";
const TOTAL=39;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",

 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "y" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:

     <div><span class='p-word'><u>y</u>ogurt</span> <span class='p-phonetic'>/ˈjɒɡət/</span> = <span class='p-mean'>sữa chua</span> → âm <b>/j/</b></div>
     <div><span class='p-word'><u>y</u>ourself</span> <span class='p-phonetic'>/jɔːˈself/</span> = <span class='p-mean'>chính bạn</span> → âm <b>/j/</b></div>
     <div><span class='hl-green'>gym</span> <span class='p-phonetic'>/dʒɪm/</span> = <span class='p-mean'>phòng gym</span> → âm <b>/ɪ/</b></div>
     <div><span class='p-word'>be<u>y</u>ond</span> <span class='p-phonetic'>/bɪˈjɒnd/</span> = <span class='p-mean'>vượt ra ngoài</span> → âm <b>/j/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"gym" có "y" là NGUYÊN ÂM đọc /ɪ/, khác với ba từ kia có "y" là PHỤ ÂM đọc /j/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>yogurt, yourself, beyond đều có "y" đọc /j/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",

     <div><span class='p-word'>t<u>ea</u>m</span> <span class='p-phonetic'>/tiːm/</span> = <span class='p-mean'>đội</span> → âm <b>/iː/</b></div>

   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Động từ chính "wondered" ở quá khứ → mệnh đề sau lùi thì, "can" → "could" (liệu có thể học được không).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"may" không lùi thì; "shouldn't/wouldn't" sai nghĩa (không nên/sẽ không).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:15,type:"mcq",
 q:"Nick: \"I'm sorry I didn't return your book on time. I haven't finished reading it.\" — Liam: \"____ Just let me know when you're done.\"",
 options:[{t:"That's okay, no rush.",c:true},{t:"That's very rude of you.",c:false},{t:"What an awful book!",c:false},{t:"Please give it to me now.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Nick: "Xin lỗi vì tớ chưa trả sách đúng hạn. Tớ chưa đọc xong." — Liam: "Không sao đâu, cứ từ từ. Đọc xong thì báo tớ nhé."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>That's okay, no rush.</span> = <span class='p-mean'>Không sao, cứ từ từ.</span></div>
     <div><span class='p-word'>That's very rude of you.</span> = <span class='p-mean'>Cậu thật bất lịch sự.</span></div>
     <div><span class='p-word'>What an awful book!</span> = <span class='p-mean'>Cuốn sách tệ ghê!</span></div>
     <div><span class='p-word'>Please give it to me now.</span> = <span class='p-mean'>Trả tớ ngay đi.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu sau "Just let me know when you're done" (đọc xong rồi báo) thể hiện thái độ THÔNG CẢM → "That's okay, no rush." (không sao, cứ từ từ).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu còn lại đều tỏ thái độ trách móc/khó chịu, mâu thuẫn với "cứ từ từ khi nào xong thì báo".</span></li></ol>`},

/* IV. Dictionary entry — điền 2-3 từ */
{sec:"A. LANGUAGE FOCUS",part:"IV. Dựa vào mục từ điển của 'interest', điền 2–3 từ vào chỗ trống",n:16,type:"fill",
 q:"📖 <b>interest</b> (n) — the feeling that you want to know or learn more. VD: <i>take an interest in</i>, <i>have no interest in</i>, <i>with interest</i>, <i>out of interest</i>, <i>caught my interest</i>.<br>He ______ in hiking. He prefers indoor activities like reading or watching movies.",
 answer:["has no interest"],
 exp:`<div class="vnt">💬 Dịch: Anh ấy không có hứng thú với việc đi bộ đường dài. Anh ấy thích các hoạt động trong nhà như đọc sách hay xem phim.</div>
 <ol><li>Đáp án: <span class='hl-green'>has no interest</span> (in hiking)</li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu sau cho biết anh ấy thích hoạt động khác → anh KHÔNG hứng thú với hiking. Dùng mẫu từ điển "have no interest IN" (chia ngôi He → has no interest).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Dựa vào mục từ điển của 'interest', điền 2–3 từ vào chỗ trống",n:17,type:"fill",
 q:"📖 Dùng mẫu trong từ điển 'interest'.<br>This novel about the missing treasure really ______, and I couldn't stop reading.",
 answer:["caught my interest"],
 exp:`<div class="vnt">💬 Dịch: Cuốn tiểu thuyết về kho báu mất tích thực sự đã thu hút sự chú ý của tôi, và tôi không thể ngừng đọc.</div>
 <ol><li>Đáp án: <span class='hl-green'>caught my interest</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu sau "couldn't stop reading" (không dừng đọc được) → cuốn sách rất cuốn hút. Dùng mẫu từ điển "caught my interest" (thu hút sự chú ý của tôi).</span></li></ol>`},

/* V. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"V. Tìm phần gạch chân SAI và sửa lại cho đúng",n:18,type:"error",
 q:"<u>Losing</u> your passport can make you feel <u>helpless</u>, especially when <u>you're about to</u> travel <u>international</u>.",
 options:["Losing","helpless","you're about to","international"],correctIdx:3,
 accept:["internationally"],key:"international → internationally",
 exp:`<div class="vnt">💬 Dịch: Việc làm mất hộ chiếu có thể khiến bạn cảm thấy bất lực, nhất là khi bạn sắp đi du lịch nước ngoài.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>international</span> → sửa thành <span class='hl-green'>internationally</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"travel" là động từ, cần TRẠNG TỪ bổ nghĩa → "travel internationally" (đi du lịch quốc tế), không dùng tính từ "international".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Tìm phần gạch chân SAI và sửa lại cho đúng",n:19,type:"error",
 q:"<u>Due to</u> nervousness, my mind <u>turned</u> completely <u>blank</u> during <u>the</u> presentation.",
 options:["Due to","turned","blank","the"],correctIdx:1,
 accept:["went"],key:"turned → went (go blank)",
 note:"👉 Câu cuối rồi, cố lên nhé! 💪",
 exp:`<div class="vnt">💬 Dịch: Vì quá lo lắng, đầu óc tôi hoàn toàn trống rỗng trong suốt buổi thuyết trình.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>turned</span> → sửa thành <span class='hl-green'>went</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Collocation chuẩn là "one's mind GOES blank" (đầu óc trống rỗng). Vì ở quá khứ nên dùng "went blank", không dùng "turned".</span></li></ol>`},

/* VI. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:20,type:"fill",
 q:"We ______ (see) a tribal dance show at the festival, and it was awesome.",
 answer:["saw"],
 exp:`<div class="vnt">💬 Dịch: Chúng tôi đã xem một buổi biểu diễn múa của bộ tộc tại lễ hội, và nó thật tuyệt vời.</div>
 <ol><li>Đáp án: <span class='hl-green'>saw</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Vế sau "it was awesome" ở quá khứ → hành động đã xảy ra → Quá khứ đơn. "see" bất quy tắc: see → saw.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:21,type:"fill",
 q:"If the weather is enjoyable, Owen ______ (go) on a picnic with his friends.",
 answer:["will go"],
 exp:`<div class="vnt">💬 Dịch: Nếu thời tiết dễ chịu, Owen sẽ đi dã ngoại với bạn bè.</div>
 <ol><li>Đáp án: <span class='hl-green'>will go</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (is), … will + V (will go)".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",
 q:"The crime series ______ (be) interesting so far, with lots of unexpected twists.",
 answer:["has been"],
 exp:`<div class="vnt">💬 Dịch: Bộ phim hình sự cho đến giờ vẫn rất hấp dẫn, với nhiều tình tiết bất ngờ.</div>
 <ol><li>Đáp án: <span class='hl-green'>has been</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "so far" (cho đến nay) → thì Hiện tại hoàn thành. Chủ ngữ "The crime series" (số ít) → has been.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:23,type:"fill",
 q:"When I arrived at the village, some foreigners ______ (dance) with the local people.",
 answer:["were dancing"],
 exp:`<div class="vnt">💬 Dịch: Khi tôi đến ngôi làng, một số người nước ngoài đang nhảy múa cùng người dân địa phương.</div>
 <ol><li>Đáp án: <span class='hl-green'>were dancing</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hành động "arrived" (QK đơn) xảy ra khi hành động khác đang diễn ra → Quá khứ tiếp diễn: "were + V-ing" = were dancing.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",
 q:"David did the experiment carefully and tried ______ (not make) any mistakes.",
 answer:["not to make"],
 exp:`<div class="vnt">💬 Dịch: David làm thí nghiệm một cách cẩn thận và cố gắng không mắc bất kỳ lỗi nào.</div>
 <ol><li>Đáp án: <span class='hl-green'>not to make</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"try TO V" (cố làm gì); phủ định của to-V đặt "not" TRƯỚC "to" → "not to make".</span></li></ol>`},

/* VII. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:25,type:"fill",
 q:"Space ______ has led to our deeper understanding of the universe. <span class='hint-word'>(explore)</span>",
 answer:["exploration"],
 exp:`<div class="vnt">💬 Dịch: Việc <b>thám hiểm</b> không gian đã dẫn đến hiểu biết sâu sắc hơn của chúng ta về vũ trụ.</div>
 <ol><li>Từ gốc: <span class='p-word'>explore</span> <span class='wt'>v</span> = <span class='p-mean'>khám phá</span> → dạng cần điền: <span class='hl-green'>exploration</span> <span class='wt'>n</span> = <span class='p-mean'>sự thám hiểm</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: exploration</span> <span class='p-grammar'>"Space ______" làm CHỦ NGỮ nên cần DANH TỪ. explore → exploration.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:26,type:"fill",
 q:"I looked ______ on the outside, but I felt really nervous inside. <span class='hint-word'>(confidence)</span>",
 answer:["confident"],
 exp:`<div class="vnt">💬 Dịch: Bề ngoài tôi trông <b>tự tin</b>, nhưng bên trong tôi thực sự rất lo lắng.</div>
 <ol><li>Từ gốc: <span class='p-word'>confidence</span> <span class='wt'>n</span> = <span class='p-mean'>sự tự tin</span> → dạng cần điền: <span class='hl-green'>confident</span> <span class='wt'>adj</span> = <span class='p-mean'>tự tin</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: confident</span> <span class='p-grammar'>Sau "look" (trông có vẻ) cần TÍNH TỪ (look + adj) → confident.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"We spent hours trying to ______ all the presidents of the United States. <span class='hint-word'>(memory)</span>",
 answer:["memorise","memorize"],
 exp:`<div class="vnt">💬 Dịch: Chúng tôi đã dành hàng giờ để cố <b>ghi nhớ</b> tất cả các tổng thống của Hoa Kỳ.</div>
 <ol><li>Từ gốc: <span class='p-word'>memory</span> <span class='wt'>n</span> = <span class='p-mean'>trí nhớ</span> → dạng cần điền: <span class='hl-green'>memorise</span> <span class='wt'>v</span> = <span class='p-mean'>học thuộc, ghi nhớ</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: memorise</span> <span class='p-grammar'>Sau "to" cần ĐỘNG TỪ nguyên mẫu (trying TO ___). memory → memorise (Anh-Anh)/memorize (Anh-Mỹ).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"My weekend passed ______ with games, movies, and delicious food. <span class='hint-word'>(enjoy)</span>",
 answer:["enjoyably"],
 exp:`<div class="vnt">💬 Dịch: Cuối tuần của tôi trôi qua một cách <b>thú vị</b> với các trò chơi, phim ảnh và đồ ăn ngon.</div>
 <ol><li>Từ gốc: <span class='p-word'>enjoy</span> <span class='wt'>v</span> = <span class='p-mean'>tận hưởng</span> → dạng cần điền: <span class='hl-green'>enjoyably</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách thú vị</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: enjoyably</span> <span class='p-grammar'>Cần TRẠNG TỪ bổ nghĩa cho động từ "passed" (trôi qua một cách thú vị). enjoy → enjoyable → enjoyably.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"Anna won an art ______ and got a scholarship from an art college. <span class='hint-word'>(compete)</span>",
 answer:["competition"],
 exp:`<div class="vnt">💬 Dịch: Anna đã thắng một <b>cuộc thi</b> nghệ thuật và giành được học bổng từ một trường cao đẳng mỹ thuật.</div>
 <ol><li>Từ gốc: <span class='p-word'>compete</span> <span class='wt'>v</span> = <span class='p-mean'>cạnh tranh</span> → dạng cần điền: <span class='hl-green'>competition</span> <span class='wt'>n</span> = <span class='p-mean'>cuộc thi</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: competition</span> <span class='p-grammar'>Sau "an art ___" cần DANH TỪ (won a competition = thắng một cuộc thi). compete → competition.</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Chọn thứ tự sắp xếp câu đúng để tạo đoạn văn/hội thoại hợp lí",n:42,type:"mcq",
 q:"Sắp xếp các câu (a–d) thành đoạn văn hợp lí:<br><div class='dialog'><b>a.</b> At first, I was a little scared because the sand dunes were very high.<br><b>b.</b> Last summer, my friend and I visited Mui Ne sand dunes, and we decided to go on a jeep tour.<br><b>c.</b> But my friend persuaded me to give it a try, and the jeep ride was one of the most exciting moments of my life.<br><b>d.</b> By the end of the ride, I didn't want to stop. I'm glad that I went on this fun trip.</div>",
 options:[{t:"a – c – d – b",c:false},{t:"b – a – c – d",c:true},{t:"a – b – c – d",c:false},{t:"b – d – a – c",c:false}],
 exp:`<div class="vnt">💬 Chủ đề: Chuyến đi tour xe jeep ở đồi cát Mũi Né. Thứ tự đúng là <b>b – a – c – d</b>.</div>
 <ol><li>Dịch &amp; trình tự hợp lí:
   <div class="orderline"><span class="lbl">b</span> <span class="p-en">Last summer, my friend and I visited Mui Ne sand dunes, and we decided to go on a jeep tour.</span> — <span class="p-mean">Hè năm ngoái, tôi và bạn đến đồi cát Mũi Né và quyết định đi tour xe jeep.</span> <i>(câu mở đầu, giới thiệu bối cảnh)</i></div>
   <div class="orderline"><span class="lbl">a</span> <span class="p-en">At first, I was a little scared because the sand dunes were very high.</span> — <span class="p-mean">Lúc đầu, tôi hơi sợ vì các đồi cát rất cao.</span> <i>(At first – cảm xúc ban đầu)</i></div>
   <div class="orderline"><span class="lbl">c</span> <span class="p-en">But my friend persuaded me to give it a try, and the jeep ride was one of the most exciting moments of my life.</span> — <span class="p-mean">Nhưng bạn tôi thuyết phục tôi thử, và chuyến xe jeep là một trong những khoảnh khắc thú vị nhất đời tôi.</span> <i>(But – bước ngoặt)</i></div>
   <div class="orderline"><span class="lbl">d</span> <span class="p-en">By the end of the ride, I didn't want to stop. I'm glad that I went on this fun trip.</span> — <span class="p-mean">Đến cuối chuyến đi, tôi không muốn dừng lại. Tôi vui vì đã tham gia chuyến đi thú vị này.</span> <i>(By the end – câu kết)</i></div>
 </li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Mạch thời gian – cảm xúc: giới thiệu (b) → sợ lúc đầu "At first" (a) → bước ngoặt "But" (c) → kết thúc "By the end" (d). Vậy b – a – c – d.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các thứ tự khác đặt "At first/By the end" sai vị trí hoặc đưa câu giới thiệu (b) ra giữa, làm mất mạch kể chuyện.</span></li></ol>`},

{sec:"C. WRITING",part:"I. Chọn thứ tự sắp xếp câu đúng để tạo đoạn văn/hội thoại hợp lí",n:43,type:"mcq",
 q:"Sắp xếp các câu (a–e) thành đoạn hội thoại hợp lí:<br><div class='dialog'><b>a.</b> Kevin: Me too. I really felt for the main character when she was struggling with all those new emotions.<br><b>b.</b> Kevin: Yes, I did. The film was amazing! I didn't expect it to be so emotional.<br><b>c.</b> Maya: I know, right? I loved how the film-makers explored the emotional changes during our teenage years.<br><b>d.</b> Maya: Kevin, did you see <i>Inside Out 2</i> with Chris last weekend?<br><b>e.</b> Maya: Exactly! I think this film might be even better than the first one.</div>",
 options:[{t:"d – e – c – a – b",c:false},{t:"d – b – c – a – e",c:true},{t:"c – e – a – d – b",c:false},{t:"c – b – d – e – a",c:false}],
 exp:`<div class="vnt">💬 Chủ đề: Maya và Kevin bàn về phim <i>Inside Out 2</i>. Thứ tự đúng là <b>d – b – c – a – e</b>.</div>
 <ol><li>Dịch &amp; trình tự hợp lí:
   <div class="orderline"><span class="lbl">d</span> <span class="p-en">Maya: Kevin, did you see Inside Out 2 with Chris last weekend?</span> — <span class="p-mean">Maya: Kevin, cuối tuần trước cậu xem Inside Out 2 với Chris à?</span> <i>(câu hỏi mở đầu)</i></div>
   <div class="orderline"><span class="lbl">b</span> <span class="p-en">Kevin: Yes, I did. The film was amazing! I didn't expect it to be so emotional.</span> — <span class="p-mean">Kevin: Ừ, có. Phim tuyệt lắm! Tớ không ngờ nó lại xúc động đến vậy.</span> <i>(Kevin đáp câu d)</i></div>
   <div class="orderline"><span class="lbl">c</span> <span class="p-en">Maya: I know, right? I loved how the film-makers explored the emotional changes during our teenage years.</span> — <span class="p-mean">Maya: Đúng không! Tớ thích cách nhà làm phim khắc họa những thay đổi cảm xúc tuổi mới lớn.</span> <i>(Maya tiếp lời)</i></div>
   <div class="orderline"><span class="lbl">a</span> <span class="p-en">Kevin: Me too. I really felt for the main character when she was struggling with all those new emotions.</span> — <span class="p-mean">Kevin: Tớ cũng vậy. Tớ thực sự đồng cảm với nhân vật chính khi cô ấy vật lộn với những cảm xúc mới.</span> <i>("Me too" – đồng tình với c)</i></div>
   <div class="orderline"><span class="lbl">e</span> <span class="p-en">Maya: Exactly! I think this film might be even better than the first one.</span> — <span class="p-mean">Maya: Chính xác! Tớ nghĩ phim này còn hay hơn cả phần đầu.</span> <i>(câu kết)</i></div>
 </li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hỏi–đáp theo cặp: Maya hỏi (d) → Kevin đáp (b) → Maya bình luận (c) → Kevin "Me too" đồng tình (a) → Maya chốt "Exactly" (e). Vậy d – b – c – a – e.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các thứ tự khác đặt câu trả lời trước câu hỏi, hoặc "Me too/Exactly" không nối đúng câu trước đó.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:44,type:"fill",
 q:"Gợi ý: Trip / in front / everyone / was / most / embarrassing experience / I / ever / have. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["tripping in front of everyone was the most embarrassing experience i've ever had","tripping in front of everyone was the most embarrassing experience i have ever had"],
 exp:`<div class="vnt">💬 Dịch: Vấp ngã trước mặt mọi người là trải nghiệm xấu hổ nhất mà tôi từng trải qua.</div>
 <ol><li>Đáp án: <span class='hl-green'>Tripping in front of everyone was the most embarrassing experience I've ever had.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ ngữ là danh động từ "Tripping" (việc vấp ngã); so sánh nhất "the most embarrassing"; mệnh đề quan hệ "(that) I've ever had" (mà tôi từng có) — dùng hiện tại hoàn thành với "ever".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:45,type:"fill",
 q:"Gợi ý: If / we / take / eco-tour / can / explore / wildlife / without / harm / environment. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["if we take an eco-tour we can explore wildlife without harming the environment","if we take an eco tour we can explore wildlife without harming the environment"],
 exp:`<div class="vnt">💬 Dịch: Nếu chúng ta tham gia một tour du lịch sinh thái, chúng ta có thể khám phá thiên nhiên hoang dã mà không gây hại cho môi trường.</div>
 <ol><li>Đáp án: <span class='hl-green'>If we take an eco-tour, we can explore wildlife without harming the environment.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (take), … can + V (can explore)"; "without + V-ing" (mà không làm gì) → without harming.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:46,type:"fill",
 q:"Gợi ý: The campers / put / tents / when / it / suddenly / start / rain / heavily. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["the campers were putting up the tents when it suddenly started raining heavily","the campers were putting up tents when it suddenly started raining heavily","the campers were putting up the tents when it suddenly started to rain heavily","the campers were putting up tents when it suddenly started to rain heavily"],
 exp:`<div class="vnt">💬 Dịch: Những người cắm trại đang dựng lều thì trời đột nhiên đổ mưa to.</div>
 <ol><li>Đáp án: <span class='hl-green'>The campers were putting up (the) tents when it suddenly started raining/ to rain heavily.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hành động đang diễn ra (were putting up – QK tiếp diễn) bị hành động khác xen vào (started – QK đơn); "start" đi được cả "V-ing" và "to V" (started raining / to rain).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:47,type:"fill",
 q:"Gợi ý: Last week / Melinda / come / a cold / because / she / not dress / warmly / enough. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["last week melinda came down with a cold because she didn't dress warmly enough","last week melinda came down with a cold because she did not dress warmly enough"],
 exp:`<div class="vnt">💬 Dịch: Tuần trước, Melinda bị cảm lạnh vì cô ấy không mặc đủ ấm.</div>
 <ol><li>Đáp án: <span class='hl-green'>Last week, Melinda came down with a cold because she didn't dress warmly enough.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"come down with a cold" (bị cảm lạnh) chia QK đơn = came down; "because" nối lý do; "warmly enough" (đủ ấm — enough đứng sau trạng từ).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết lại câu (chỉ gõ TIẾP phần sau — chấm nhận cả câu đầy đủ)",n:48,type:"fill",
 q:"The last time they climbed a mountain together was in 2022.<br><span class='hint-word'>➜ They ______</span><br><span class='note-inline' style='display:inline-block;margin:6px 0 0'>(Em chỉ cần gõ TIẾP phần sau chữ \"They\", KHÔNG phải gõ lại. Chấm nhận cả câu đầy đủ hoặc chỉ phần tiếp theo.)</span>",
 answer:["haven't climbed a mountain together since 2022","have not climbed a mountain together since 2022","they haven't climbed a mountain together since 2022","they have not climbed a mountain together since 2022"],
 exp:`<div class="vnt">💬 Dịch: Lần cuối cùng họ cùng nhau leo núi là vào năm 2022. → Họ đã không leo núi cùng nhau kể từ năm 2022.</div>
 <ol><li>Đáp án: <span class='hl-green'>They haven't climbed a mountain together since 2022.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"The last time + S + V(QK) was in…" = "S + haven't/hasn't + V3 + since…". Dùng hiện tại hoàn thành phủ định với "since 2022": haven't climbed … since 2022.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết lại câu (chỉ gõ TIẾP phần sau — chấm nhận cả câu đầy đủ)",n:49,type:"fill",
 q:"It's such a shame that it's snowing heavily right now at the ski resort.<br><span class='hint-word'>➜ We wish ______</span><br><span class='note-inline' style='display:inline-block;margin:6px 0 0'>(Em chỉ cần gõ TIẾP phần sau chữ \"We wish\", KHÔNG phải gõ lại. Chấm nhận cả câu đầy đủ hoặc chỉ phần tiếp theo.)</span>",
 answer:["it wasn't snowing heavily right now at the ski resort","it weren't snowing heavily right now at the ski resort","it was not snowing heavily right now at the ski resort","we wish it wasn't snowing heavily right now at the ski resort","we wish it weren't snowing heavily right now at the ski resort"],
 exp:`<div class="vnt">💬 Dịch: Thật đáng tiếc là ngay lúc này tuyết đang rơi dày ở khu trượt tuyết. → Chúng tôi ước gì lúc này tuyết không rơi dày ở đó.</div>
 <ol><li>Đáp án: <span class='hl-green'>We wish it wasn't snowing heavily right now at the ski resort.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"It's a shame that + (hiện tại)" = "wish + (lùi thì)". Đang diễn ra (is snowing) → lùi thành quá khứ tiếp diễn phủ định "wasn't/weren't snowing".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết lại câu (chỉ gõ TIẾP phần sau — chấm nhận cả câu đầy đủ)",n:50,type:"fill",
 q:"The children were very excited when going to the space museum.<br><span class='hint-word'>➜ The children found going ______</span><br><span class='note-inline' style='display:inline-block;margin:6px 0 0'>(Em chỉ cần gõ TIẾP phần sau chữ \"The children found going\", KHÔNG phải gõ lại. Chấm nhận cả câu đầy đủ hoặc chỉ phần tiếp theo.)</span>",
 answer:["to the space museum very exciting","the children found going to the space museum very exciting"],
 exp:`<div class="vnt">💬 Dịch: Bọn trẻ rất phấn khích khi đến bảo tàng vũ trụ. → Bọn trẻ thấy việc đến bảo tàng vũ trụ rất thú vị.</div>
 <ol><li>Đáp án: <span class='hl-green'>The children found going to the space museum very exciting.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "find + V-ing + adj" (thấy việc gì đó thế nào): found going … very exciting. Vì nói về sự việc gây phấn khích nên dùng "exciting" (-ing).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Viết lại câu (chỉ gõ TIẾP phần sau — chấm nhận cả câu đầy đủ)",n:51,type:"fill",
 q:"We enjoy going kayaking every weekend because it makes us feel relaxed.<br><span class='hint-word'>➜ Kayaking makes ______</span><br><span class='note-inline' style='display:inline-block;margin:6px 0 0'>(Em chỉ cần gõ TIẾP phần sau chữ \"Kayaking makes\", KHÔNG phải gõ lại. Chấm nhận cả câu đầy đủ hoặc chỉ phần tiếp theo.)</span>",
 answer:["us feel relaxed so we enjoy going kayaking every weekend","kayaking makes us feel relaxed so we enjoy going kayaking every weekend"],
 exp:`<div class="vnt">💬 Dịch: Chúng tôi thích đi chèo thuyền kayak mỗi cuối tuần vì nó khiến chúng tôi thấy thư giãn. → Chèo thuyền kayak khiến chúng tôi thấy thư giãn, nên chúng tôi thích đi mỗi cuối tuần.</div>
 <ol><li>Đáp án: <span class='hl-green'>Kayaking makes us feel relaxed, so we enjoy going kayaking every weekend.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"make sb feel + adj" (khiến ai cảm thấy…): makes us feel relaxed; đảo nguyên nhân lên trước rồi dùng "so" (nên) nối với kết quả (we enjoy…).</span></li></ol>`}
];

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#1a1440">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#ec4899">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 39 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🚀';memeKey='good';msg='Cố thêm chút nữa là chạm tới các vì sao luôn nè! 💫';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='🌙';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
