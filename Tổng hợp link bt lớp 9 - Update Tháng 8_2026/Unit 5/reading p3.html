<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice | Ms. Chí Nên</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

        :root {
            --primary: #ff9a9e;
            --secondary: #fecfef;
            --accent: #a18cd1;
            --text-main: #2d3436;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --correct: #00b894;
            --incorrect: #ff7675;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Pattern SVG */
        .svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, rgba(255,255,255,0.2) 100%);
        }

        /* Layout */
        .header-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }
        .header-top h2 {
            font-size: 14px;
            font-weight: 800;
            color: rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .split-container {
            display: flex;
            height: 100vh;
            padding: 40px 20px 20px 20px;
            gap: 20px;
        }

        .pane {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            border-radius: 24px;
            padding: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .pane::-webkit-scrollbar {
            width: 8px;
        }
        .pane::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        /* Reading Pane Elements */
        .passage-card {
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid white;
        }
        .passage-card h3 {
            font-size: 20px;
            color: #6c5ce7;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .paragraph {
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 15px;
            text-align: justify;
        }
        .btn-translate {
            background: rgba(255,255,255,0.7);
            border: 1px solid white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #0984e3;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-translate:hover {
            background: white;
            transform: scale(1.05);
        }
        .translation-text {
            display: none;
            font-size: 15px;
            color: #2d3436;
            background: rgba(116, 185, 255, 0.15);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #74b9ff;
            font-style: italic;
        }

        /* Glossary */
        .glossary {
            margin-top: 20px;
            border-collapse: collapse;
            width: 100%;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            overflow: hidden;
        }
        .glossary th {
            background: rgba(162, 155, 254, 0.5);
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        .glossary td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 14px;
        }
        .glossary tr:last-child td { border-bottom: none; }
        .g-pos { color: #d63031; font-weight: 600; font-size: 12px; }

        /* Quiz Pane Elements */
        .question-card {
            background: rgba(255,255,255,0.6);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .question-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #e84393;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .btn-option {
            background: white;
            border: 2px solid transparent;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #2d3436;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #74b9ff;
            background: #f1f8ff;
        }
        .btn-option.correct {
            background: var(--correct) !important;
            color: white !important;
            border-color: #00997a !important;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
        }
        .btn-option.incorrect {
            background: var(--incorrect) !important;
            color: white !important;
            border-color: #d63031 !important;
            animation: shake 0.4s;
        }
        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Explanations */
        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.8);
            border-radius: 12px;
            border-left: 5px solid #0984e3;
            font-size: 15px;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .explanation-box h4 { color: #2d3436; margin-bottom: 8px; font-size: 16px;}
        .explanation-box ul { margin-left: 20px; margin-bottom: 10px; }
        .explanation-box li { margin-bottom: 5px; }
        .opt-list { list-style-type: disc; margin-bottom: 10px; }
        .opt-list li { margin-bottom: 3px; }
        
        /* Explanation Highlights */
        .p-word { font-weight: 800; color: #0984e3; background: rgba(9, 132, 227, 0.1); padding: 0 4px; border-radius: 4px; }
        .p-phonetic { color: #6c5ce7; font-family: "Courier New", Courier, monospace; }
        .p-mean { color: #d63031; font-weight: 600; }
        .p-grammar { background: rgba(253, 203, 110, 0.3); color: #e17055; padding: 2px 5px; border-radius: 4px; font-weight: 700; font-family: monospace; border: 1px dashed #e17055;}
        .hl-green { color: #00b894; font-weight: 800; display: inline-block; margin-top: 5px; text-transform: uppercase;}
        .hl-red { color: #d63031; font-weight: 800; display: inline-block; margin-top: 5px; text-transform: uppercase;}

        /* Submit Button & Popup */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: 900;
            color: white;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
            transition: 0.3s;
            margin-top: 30px;
        }
        .btn-submit:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(108, 92, 231, 0.4);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .popup {
            background: white;
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup input {
            width: 100%;
            padding: 12px 15px;
            margin: 15px 0;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .popup input:focus { border-color: #74b9ff; }
        .popup button {
            background: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* Scorecard */
        .scorecard { display: none; }
        .score-number { font-size: 40px; font-weight: 900; color: #e84393; margin: 10px 0; }
        .score-converted { font-size: 24px; font-weight: 800; color: #6c5ce7; margin-bottom: 15px;}
        .meme-gif { width: 100%; max-width: 250px; border-radius: 15px; margin: 15px 0; }
        .teacher-comment { font-size: 16px; font-style: italic; color: #636e72; }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999;
        }
    </style>
</head>
<body>

    <svg class="svg-bg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <text x="10%" y="20%" font-size="60" opacity="0.3" class="float">🎡</text>
        <text x="80%" y="30%" font-size="70" opacity="0.3" class="float">🇸🇬</text>
        <text x="20%" y="80%" font-size="65" opacity="0.3" class="float">🚌</text>
        <text x="85%" y="85%" font-size="80" opacity="0.3" class="float">🎤</text>
        <text x="50%" y="50%" font-size="90" opacity="0.2" class="float">🗣️</text>
        <text x="60%" y="10%" font-size="50" opacity="0.3" class="float">🌟</text>
        <style>
            .float { animation: floatAnim 10s ease-in-out infinite alternate; }
            @keyframes floatAnim { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(30px) rotate(15deg); } }
        </style>
    </svg>

    <div class="header-top">
        <h2>Giáo viên tạo: Ms. Chí Nên</h2>
    </div>

    <div class="split-container" id="main-container">
        <div class="pane" id="reading-pane"></div>

        <div class="pane" id="quiz-pane"></div>
    </div>

    <div class="overlay" id="name-overlay">
        <div class="popup" id="name-popup">
            <h3 style="color: #2d3436; margin-bottom: 10px;">🌟 Bạn đã sẵn sàng nộp bài?</h3>
            <p style="font-size: 14px; color: #636e72;">Hãy nhập tên của con để Ms. Chí Nên chấm điểm nhé!</p>
            <input type="text" id="student-name" placeholder="Ví dụ: Tuệ Minh..." onkeypress="if(event.key === 'Enter') submitQuiz()">
            <button onclick="submitQuiz()">Nộp Bài Ngay!</button>
        </div>
        
        <div class="popup scorecard" id="scorecard-popup">
            <h3 style="color: #6c5ce7;" id="sc-name">Tên học sinh</h3>
            <div class="score-number" id="sc-score">0/20</div>
            <div class="score-converted" id="sc-converted">0.00/10</div>
            <img class="meme-gif" id="sc-gif" src="" alt="Meme">
            <div class="teacher-comment" id="sc-comment">Lời phê</div>
            <button style="margin-top: 15px; background: #e84393;" onclick="closePopup()">Đóng lại xem điểm</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

<script>
// --- DỮ LIỆU BÀI HỌC VÀ CÂU HỎI ---
const examData = [
    {
        title: "Passage 1: A Day Trip to London 🎡",
        paragraphs: [
            { eng: "For the last few months, I have spent every Saturday in my flat and have done nothing more exciting than working at home, reading the newspapers and watching television.", vie: "Trong vài tháng qua, tôi đã dành mỗi ngày thứ Bảy trong căn hộ của mình và không làm gì thú vị hơn ngoài việc làm việc ở nhà, đọc báo và xem truyền hình." },
            { eng: "I had begun feeling bored with this and so, last weekend I thought I would do something different. I rang up several of my friends and we decided to go to London for the day. I was really excited as I hadn't been to London since I was ten.", vie: "Tôi đã bắt đầu cảm thấy nhàm chán với điều này và vì vậy, cuối tuần trước, tôi nghĩ mình sẽ làm điều gì đó khác biệt. Tôi đã gọi điện cho một vài người bạn của mình và chúng tôi quyết định đi London trong một ngày. Tôi thực sự rất hào hứng vì tôi đã không đến London kể từ khi tôi mười tuổi." },
            { eng: "We decided to go by coach as this was by far the cheapest means of transport that was available even though it meant that we needed to get up very early.", vie: "Chúng tôi quyết định đi bằng xe khách vì đây cho đến nay là phương tiện giao thông rẻ nhất hiện có mặc dù điều đó có nghĩa là chúng tôi cần phải thức dậy rất sớm." },
            { eng: "Once in London, we decided to take a sightseeing tour as we wanted to see some of the famous buildings. After the tour, we bought some sandwiches and ate them in a small park. In the afternoon, two of us went shopping and the others went to the theater.", vie: "Khi đến London, chúng tôi quyết định tham gia một chuyến tham quan ngắm cảnh vì chúng tôi muốn xem một số tòa nhà nổi tiếng. Sau chuyến tham quan, chúng tôi mua một ít bánh mì sandwich và ăn chúng trong một công viên nhỏ. Vào buổi chiều, hai người trong chúng tôi đi mua sắm và những người khác đi xem kịch." },
            { eng: "We met up again at 6:30 p.m. and went to a small restaurant in Soho. The meal was really good but, unfortunately, it took much longer than we had expected. We had to get a taxi back to the coach station. Luckily, we got there just two minutes before our coach left.", vie: "Chúng tôi gặp lại nhau lúc 6:30 chiều và đến một nhà hàng nhỏ ở Soho. Bữa ăn thực sự rất ngon nhưng, không may là, nó kéo dài hơn nhiều so với dự kiến của chúng tôi. Chúng tôi phải bắt taxi quay lại bến xe khách. May mắn thay, chúng tôi đến đó chỉ hai phút trước khi xe khách của chúng tôi rời đi." }
        ],
        glossary: [
            { word: "flat", pos: "n", mean: "căn hộ (tiếng Anh-Anh)" },
            { word: "coach", pos: "n", mean: "xe khách đường dài" },
            { word: "available", pos: "adj", mean: "có sẵn, có thể sử dụng" },
            { word: "means of transport", pos: "n", mean: "phương tiện giao thông" },
            { word: "sightseeing", pos: "n", mean: "sự ngắm cảnh, tham quan" },
            { word: "expect", pos: "v", mean: "mong đợi, dự tính" },
            { word: "unfortunately", pos: "adv", mean: "thật không may" },
            { word: "station", pos: "n", mean: "bến xe, nhà ga" },
            { word: "ring up", pos: "phr.v", mean: "gọi điện thoại" },
            { word: "decide", pos: "v", mean: "quyết định" }
        ],
        questions: [
            {
                qText: "According to the passage, the writer...",
                qVie: "Theo đoạn văn, người viết...",
                options: [
                    { text: "spent his last weekend at home.", vie: "đã dành kỳ nghỉ cuối tuần trước ở nhà.", isCorrect: false },
                    { text: "went to London with some of his friends.", vie: "đã đến London cùng với một vài người bạn của mình.", isCorrect: true },
                    { text: "has lived in London for ten years.", vie: "đã sống ở London được mười năm.", isCorrect: false },
                    { text: "feels bored with his life.", vie: "cảm thấy nhàm chán với cuộc sống của mình.", isCorrect: false }
                ],
                expl: { right: "Đáp án đúng là **went to London with some of his friends.** Dẫn chứng ở đoạn 2: <span class='p-word'>I rang up several of my friends and we decided to go to London...</span> <span class='p-mean'>(Tôi đã gọi điện cho vài người bạn và chúng tôi quyết định đi London...)</span>.", wrong: "Tuần trước người viết đi London, không phải ở nhà (chỉ có vài tháng qua mới ở nhà). Người viết chưa từng đến London từ năm 10 tuổi (không phải sống ở đó 10 năm). Người viết <span class='p-word'>had begun feeling bored</span> (đã bắt đầu cảm thấy chán) nhưng nay đã tìm được việc thú vị, không phải chán nản toàn bộ cuộc sống hiện tại." }
            },
            {
                qText: "He felt so excited about going to London because...",
                qVie: "Anh ấy cảm thấy rất hào hứng khi đến London vì...",
                options: [
                    { text: "He hadn't been there before.", vie: "Anh ấy chưa từng đến đó trước đây.", isCorrect: false },
                    { text: "He hadn't been there for ten years.", vie: "Anh ấy đã không đến đó trong 10 năm.", isCorrect: false },
                    { text: "He went there ten years ago.", vie: "Anh ấy đã đến đó vào 10 năm trước.", isCorrect: false },
                    { text: "He hadn't been there for a long time.", vie: "Anh ấy đã không đến đó trong một khoảng thời gian dài.", isCorrect: true }
                ],
                expl: { right: "Đáp án đúng là **He hadn't been there for a long time.** Dẫn chứng: <span class='p-word'>I hadn't been to London since I was ten.</span> <span class='p-mean'>(Tôi chưa tới London kể từ năm tôi 10 tuổi)</span>. Điều này có nghĩa là đã một khoảng thời gian rất dài anh ấy không tới đây.", wrong: "Anh ấy đã từng tới lúc 10 tuổi nên không thể nói là 'chưa từng đến' (hadn't been there before). Anh ấy đến từ NĂM 10 TUỔI (since I was ten), chứ không phải cách đây 10 năm (ten years ago) hay trong suốt 10 năm (for 10 years)." }
            },
            {
                qText: "Why did they decide to go by coach?",
                qVie: "Tại sao họ quyết định đi bằng xe khách?",
                options: [
                    { text: "Because it was available.", vie: "Vì nó có sẵn.", isCorrect: false },
                    { text: "Because they wanted to start early.", vie: "Vì họ muốn xuất phát sớm.", isCorrect: false },
                    { text: "Because other means of transport were more expensive.", vie: "Vì các phương tiện giao thông khác thì đắt đỏ hơn.", isCorrect: true },
                    { text: "Because it was one of the most efficient means of transport.", vie: "Vì nó là một trong những phương tiện hiệu quả nhất.", isCorrect: false }
                ],
                expl: { right: "Đáp án đúng là **Because other means of transport were more expensive.** Dẫn chứng đoạn 3: <span class='p-word'>We decided to go by coach as this was by far the cheapest means of transport...</span> <span class='p-mean'>(...vì đây là phương tiện giao thông rẻ nhất...)</span>. Điều này có nghĩa các phương tiện khác đắt hơn.", wrong: "Việc 'có sẵn' (available) chỉ là yếu tố phụ, nguyên nhân chính là vì nó RẺ NHẤT. Họ phải đi sớm VÌ đi xe khách, chứ không phải họ chọn xe khách để được đi sớm. Không có chi tiết nào nói đây là phương tiện hiệu quả nhất (efficient)." }
            },
            {
                qText: "Which of the following is true?",
                qVie: "Khẳng định nào sau đây là đúng?",
                options: [
                    { text: "They all went shopping before going to the theater.", vie: "Tất cả họ đều đi mua sắm trước khi đi xem kịch.", isCorrect: false },
                    { text: "They took a sightseeing tour of London and then had lunch.", vie: "Họ tham gia một chuyến tham quan ngắm cảnh London và sau đó ăn trưa.", isCorrect: true },
                    { text: "They had lunch in a small restaurant.", vie: "Họ đã ăn trưa trong một nhà hàng nhỏ.", isCorrect: false },

            }
        ]
    }
];

// --- HỆ THỐNG ÂM THANH (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playDing() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

function playBuzzer() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
    
    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

// --- RENDER GIAO DIỆN ---
let globalQuestionCounter = 0;
let userAnswers = {}; 
let score = 0;

function renderApp() {
    const readingPane = document.getElementById('reading-pane');
    const quizPane = document.getElementById('quiz-pane');
    
    // Nút Submit để dưới cùng
    let submitBtnHTML = `<button class="btn-submit" onclick="showPopup()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>`;
    quizPane.innerHTML = '';
    readingPane.innerHTML = '';

    examData.forEach((passage, pIndex) => {
        // --- 1. RENDER BÀI ĐỌC ---
        let pHTML = `<div class="passage-card">
                        <h3>${passage.title}</h3>`;
        
        passage.paragraphs.forEach((para, i) => {
            let pId = `para-${pIndex}-${i}`;
            pHTML += `<div class="paragraph">${para.eng}</div>
                      <button class="btn-translate" onclick="toggleTranslation('${pId}')">🌟 Mở dịch đoạn này</button>
                      <div class="translation-text" id="${pId}">${para.vie}</div>`;
        });

        // Glossary
        pHTML += `<table class="glossary">
                    <tr><th>Academic Word</th><th>Part of Speech</th><th>Meaning</th></tr>`;
        passage.glossary.forEach(word => {
            pHTML += `<tr>
                        <td style="font-weight: 800; color: #0984e3;">${word.word}</td>
                        <td class="g-pos">${word.pos}</td>
                        <td>${word.mean}</td>
                      </tr>`;
        });
        pHTML += `</table></div>`;
        readingPane.innerHTML += pHTML;

        // --- 2. RENDER CÂU HỎI ---
        passage.questions.forEach((q, qIndex) => {
            globalQuestionCounter++;
            let qId = `q-${globalQuestionCounter}`;
            
            // Xáo trộn đáp án để không bị cố định vị trí
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            
            let qHTML = `<div class="question-card" id="card-${qId}">
                            <div class="question-title">${q.qText}</div>`;
            
            let optionsHTML = `<div class="options-grid">`;
            shuffledOptions.forEach((opt, oIndex) => {
                let safeOpt = JSON.stringify(opt).replace(/'/g, "&apos;");
                // GIẤU NHẸM PHẦN DỊCH, CHỈ HIỆN 100% TIẾNG ANH LÊN NÚT BẤM (không A,B,C,D)
                optionsHTML += `<button class="btn-option" id="btn-${qId}-${oIndex}" onclick='selectAnswer("${qId}", ${oIndex}, ${safeOpt})'>
                                    <b>${opt.text}</b>
                                </button>`;
            });
            optionsHTML += `</div>`;
            
            // Khung Giải thích (Feedback tức thì, có dịch từng đáp án)
            let explHTML = `<div class="explanation-box" id="expl-${qId}">
                                <h4>📚 Giải thích chi tiết:</h4>
                                <ul>
                                    <li><b>Dịch câu hỏi:</b> <span class="p-mean">${q.qVie}</span></li>
                                    <li><b>Các đáp án:</b>
                                        <ul class="opt-list">`;
            
            q.options.forEach(o => {
                explHTML += `<li><b>${o.text}</b> ➔ Dịch: <span class='p-mean'>${o.vie}</span></li>`;
            });
            
            explHTML += `               </ul>
                                    </li>
                                    <li><span class="hl-green">Tại sao đúng:</span> ${q.expl.right}</li>
                                    <li><span class="hl-red">Tại sao sai:</span> ${q.expl.wrong}</li>
                                </ul>
                            </div>`;
            
            qHTML += optionsHTML + explHTML + `</div>`;
            quizPane.insertAdjacentHTML('beforeend', qHTML);
        });
    });

    // Thêm lại nút Submit vào cuối Pane
    quizPane.insertAdjacentHTML('beforeend', submitBtnHTML);
}

function toggleTranslation(id) {
    let el = document.getElementById(id);
    let btn = el.previousElementSibling;
    if(el.style.display === 'block') {
        el.style.display = 'none';
        btn.innerHTML = '🌟 Mở dịch đoạn này';
    } else {
        el.style.display = 'block';
        btn.innerHTML = '🙈 Ẩn bản dịch';
    }
}

function selectAnswer(qId, oIndex, optObj) {
    if(userAnswers[qId]) return; // Không cho click lại
    
    userAnswers[qId] = optObj;
    let clickedBtn = document.getElementById(`btn-${qId}-${oIndex}`);
    let parentCard = document.getElementById(`card-${qId}`);
    let allBtns = parentCard.querySelectorAll('.btn-option');

    // Khóa tất cả nút trong câu
    allBtns.forEach(btn => btn.disabled = true);

    if(optObj.isCorrect) {
        clickedBtn.classList.add('correct');
        playDing();
        shootConfetti(clickedBtn);
        score++;
    } else {
        clickedBtn.classList.add('incorrect');
        playBuzzer();
        // Highlight câu đúng
        allBtns.forEach(btn => {
            if(btn.innerHTML.includes(`<b>${getCorrectText(qId)}</b>`)) {
                btn.style.border = "3px solid #00b894";
                btn.style.background = "#e6fff7";
            }
        });
    }

    // Hiển thị ngay lập tức khung giải thích chi tiết của câu đó
    document.getElementById("expl-" + qId).style.display = "block";
}

function getCorrectText(qId) {
    let index = parseInt(qId.split('-')[1]) - 1;
    let pIdx = 0;
    while(index >= examData[pIdx].questions.length) {
        index -= examData[pIdx].questions.length;
        pIdx++;
    }
    return examData[pIdx].questions[index].options.find(o => o.isCorrect).text;
}

// --- POPUP & TÍNH ĐIỂM ---
function showPopup() {
    let answeredCount = Object.keys(userAnswers).length;
    if(answeredCount < globalQuestionCounter) {
        alert(`Con mới làm ${answeredCount}/${globalQuestionCounter} câu thôi. Làm hết rồi hãy nộp bài nhé!`);
        return;
    }
    document.getElementById('name-overlay').style.display = 'flex';
    document.getElementById('name-popup').style.display = 'block';
    document.getElementById('scorecard-popup').style.display = 'none';
    document.getElementById('student-name').focus();
}

function submitQuiz() {
    let name = document.getElementById('student-name').value.trim();
    if(name === "") {
        alert("Con phải nhập tên thì Ms. Chí Nên mới chấm điểm được nha!");
        return;
    }
    
    // Tính điểm hệ 10
    let scale10 = ((score / globalQuestionCounter) * 10).toFixed(2);
    let percentage = score / globalQuestionCounter;

    // Cập nhật giao diện điểm
    document.getElementById('sc-name').innerText = `Học sinh: ${name}`;
    document.getElementById('sc-score').innerText = `${score} / ${globalQuestionCounter}`;
    document.getElementById('sc-converted').innerText = `Quy đổi: ${scale10} / 10 điểm`;
    
    let gifEl = document.getElementById('sc-gif');
    let cmtEl = document.getElementById('sc-comment');

    if(percentage === 1) {
        gifEl.src = "https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif";
        cmtEl.innerText = "Ms. Chí Nên phê: Quá đỉnh! Con là thiên tài ngoại ngữ! 🌟🏆";
    } else if(percentage >= 0.6) {
        gifEl.src = "https://media.giphy.com/media/3o72FcJmLzIdYJiyRO/giphy.gif";
        cmtEl.innerText = "Ms. Chí Nên phê: Rất tốt! Cố gắng chút nữa là đạt điểm tuyệt đối nhé! 👍✨";
    } else {
        gifEl.src = "https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif";
        cmtEl.innerText = "Ms. Chí Nên phê: Ui chà, phải xem lại lý thuyết kỹ hơn rồi. Cố lên nhé con! 💪📚";
    }

    document.getElementById('name-popup').style.display = 'none';
    document.getElementById('scorecard-popup').style.display = 'block';
}

function closePopup() {
    document.getElementById('name-overlay').style.display = 'none';
}

// --- HIỆU ỨNG PHÁO HOA ĐƠN GIẢN ---
function shootConfetti(element) {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const rect = element.getBoundingClientRect();
    const startX = rect.left + rect.width / 2;
    const startY = rect.top;

    let particles = [];
    const colors = ['#0984e3', '#00b894', '#fdcb6e', '#e84393', '#6c5ce7'];
    
    for(let i=0; i<30; i++) {
        particles.push({
            x: startX, y: startY,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 1) * 10 - 5,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3; // gravity
            if(p.y < canvas.height) {
                active = true;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
        });
        if(active) requestAnimationFrame(draw);
        else ctx.clearRect(0,0, canvas.width, canvas.height);
    }
    draw();
}

// Khởi chạy trực tiếp khi tải trang (Đã gỡ bỏ check pass)
window.onload = renderApp;
