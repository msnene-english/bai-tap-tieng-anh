<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;min-height:100vh;background:#0e0500;color:#fff5e0;overflow-x:hidden}
.bg{position:fixed;inset:0;background:linear-gradient(180deg,#0e0500 0%,#1f0c00 45%,#0e0500 100%);z-index:-5}
#cvLeaf{position:fixed;inset:0;z-index:-3;pointer-events:none}
.floats{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fobj{position:absolute;user-select:none;filter:drop-shadow(0 0 6px rgba(232,160,0,.35))}
@keyframes leafSway{0%,100%{transform:translateY(0) rotate(0deg)}40%{transform:translateY(-22px) rotate(8deg)}80%{transform:translateY(12px) rotate(-5deg)}}
@keyframes leafDrift{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.06)}}
.pbar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#e8a000,#ffd700,#cd7f32,#ff9a00,#e8a000);background-size:200%;z-index:61;transition:width .5s;animation:pbS 4s linear infinite;box-shadow:0 0 10px rgba(232,160,0,.6)}
@keyframes pbS{from{background-position:0%}to{background-position:200%}}
.header{text-align:center;padding:10px 16px 8px;background:rgba(14,5,0,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,160,0,.12);position:fixed;top:0;left:0;right:0;z-index:60}
.header h1{font-family:'Playfair Display',serif;font-size:.92rem;font-weight:700;background:linear-gradient(90deg,#e8a000,#ffd700,#cd7f32,#ff9a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.3px}
.header p{font-size:.63rem;color:rgba(255,245,224,.3);margin-top:1px}
.sticky-remind{position:fixed;top:49px;left:0;right:0;z-index:59;background:rgba(14,5,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid rgba(232,160,0,.18);padding:4px 14px;display:flex;align-items:center;gap:8px}
.sr-dot{width:6px;height:6px;border-radius:50%;background:#e8a000;flex-shrink:0;box-shadow:0 0 6px #e8a000;animation:dotB 1.5s ease-in-out infinite}
@keyframes dotB{0%,100%{opacity:1}50%{opacity:.2}}
.sr-text{font-size:.67rem;color:rgba(255,210,130,.8);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s;font-weight:600}
.container{max-width:880px;margin:0 auto;padding:104px 14px 150px;position:relative;z-index:1}
.sec-hdr{margin:26px 0 14px;padding:13px 18px;background:rgba(25,8,0,.5);border:1px solid rgba(232,160,0,.2);border-radius:15px;position:relative;overflow:hidden}
.sec-hdr::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#e8a000,#ffd700,#cd7f32)}
.sec-title{font-family:'Playfair Display',serif;font-size:.82rem;color:#e8a000;font-weight:700;margin-bottom:3px}
.sec-desc{font-size:.74rem;color:rgba(255,245,224,.45);font-style:italic}
/* CARDS */
.qcard{background:rgba(22,7,0,.65);backdrop-filter:blur(14px);border:1px solid rgba(232,160,0,.1);border-radius:18px;padding:17px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(232,160,0,.06)}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#e8a020,#ffd700,#cd7f32)}
.qbadge{display:inline-flex;align-items:center;background:rgba(232,160,0,.08);border:1px solid rgba(232,160,0,.22);color:#e8a000;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:20px;margin-bottom:9px}
.qtext{font-size:.93rem;font-weight:700;color:#e8d8b0;line-height:1.65;margin-bottom:12px;padding:8px 12px;background:rgba(0,0,5,.3);border-left:3px solid #e8a000;border-radius:0 10px 10px 0}
/* MCQ OPTS */
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
@media(max-width:560px){.opts-grid{grid-template-columns:1fr}}
.opt-btn{background:rgba(22,7,0,.45);border:2px solid rgba(232,160,0,.12);border-radius:13px;padding:10px 12px;color:#d4b880;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:left;line-height:1.55}
.opt-btn:hover:not(:disabled){transform:scale(1.03) translateY(-2px);background:rgba(232,160,0,.08);border-color:rgba(232,160,0,.38);color:#ffe8a0}
.opt-btn.correct{background:rgba(0,220,100,.15)!important;border-color:#00dc64!important;color:#7dffaa!important;box-shadow:0 0 12px rgba(0,220,100,.25)!important}
.opt-btn.wrong{background:rgba(255,60,80,.12)!important;border-color:#ff3c50!important;color:#ffb3bc!important}
.opt-btn:disabled{cursor:not-allowed;opacity:.9}
.opts-full{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.opt-btn-f{background:rgba(22,7,0,.45);border:2px solid rgba(232,160,0,.12);border-radius:13px;padding:10px 14px;color:#d4b880;font-family:'Nunito',sans-serif;font-size:.87rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:left;line-height:1.5}
.opt-btn-f:hover:not(:disabled){transform:translateX(4px);background:rgba(232,160,0,.08);border-color:rgba(232,160,0,.38);color:#ffe8a0}
.opt-btn-f.correct{background:rgba(0,220,100,.15)!important;border-color:#00dc64!important;color:#7dffaa!important}
.opt-btn-f.wrong{background:rgba(255,60,80,.12)!important;border-color:#ff3c50!important;color:#ffb3bc!important}
.opt-btn-f:disabled{cursor:not-allowed;opacity:.9}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .45s ease!important}
/* EXPLAIN */
.expl-block{display:none;margin-top:11px;border-radius:12px;overflow:hidden;border:1px solid rgba(232,160,0,.14)}
.expl-block.show{display:block;animation:slideD .35s ease}
@keyframes slideD{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.expl-hdr{background:rgba(232,160,0,.07);padding:8px 13px;font-size:.82rem;font-weight:800;color:#e8a000;border-bottom:1px solid rgba(232,160,0,.1)}
.expl-body{padding:11px 13px;background:rgba(5,2,0,.4);font-size:.84rem;line-height:1.85;color:#c8a870}
.step{margin-bottom:8px;padding:7px 11px;border-radius:9px;background:rgba(232,160,0,.04);border:1px solid rgba(232,160,0,.08)}
.slabel{display:block;font-weight:800;font-size:.7rem;color:#e8a000;margin-bottom:3px;letter-spacing:.3px}
.vi{display:block;background:rgba(232,160,0,.07);border-left:3px solid #ffd700;padding:5px 9px;border-radius:0 7px 7px 0;color:#ffe690;font-weight:700;margin:3px 0;font-size:.83rem}
.vnt{background:rgba(232,160,0,.06);border-left:3px solid #e8a000;padding:6px 11px;border-radius:0 8px 8px 0;color:#e8c880;font-style:italic;margin-bottom:9px;font-size:.84rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(232,160,0,.04);border:1px solid rgba(232,160,0,.1);border-radius:7px;padding:5px 9px;font-size:.82rem;line-height:1.65}
.p-word{color:#64d8ff;font-weight:700}
.p-mean{color:#ff9a66;font-weight:600}
.p-grammar{color:#ff6699;text-decoration:underline;text-decoration-color:#ff2244;font-weight:600}
.hl-green{color:#00ff88;font-weight:800}
.hl-red{color:#ff4466;font-weight:800}
.wt{display:inline-block;background:rgba(100,216,255,.1);border:1px solid rgba(100,216,255,.2);color:#80eeff;font-size:.62rem;font-weight:700;padding:0 5px;border-radius:9px;margin-left:2px;vertical-align:middle}
/* EX VI SPECIAL */
.e6-sent{font-size:.93rem;font-weight:700;color:#e8d8b0;line-height:2;margin-bottom:12px;padding:8px 12px;background:rgba(0,0,5,.3);border-left:3px solid #e8a000;border-radius:0 10px 10px 0}
.e6-ul{text-decoration:underline;text-decoration-color:#ffd700;position:relative;cursor:default}
.e6-lbl{font-size:.68rem;font-weight:900;color:#e8a000;vertical-align:sub;margin-left:1px;font-style:italic}
.e6-letters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.e6-lbtn{width:38px;height:38px;border-radius:50%;background:rgba(232,160,0,.08);border:2px solid rgba(232,160,0,.22);color:#e8a000;font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.e6-lbtn:hover:not(:disabled){background:rgba(232,160,0,.18);transform:scale(1.1)}
.e6-lbtn.selected{background:rgba(232,160,0,.2)!important;border-color:#e8a000!important;box-shadow:0 0 10px rgba(232,160,0,.3)}
.e6-lbtn.e6-correct{background:rgba(0,220,100,.2)!important;border-color:#00dc64!important;color:#7dffaa!important}
.e6-lbtn.e6-wrong{background:rgba(255,60,80,.15)!important;border-color:#ff3c50!important;color:#ffb3bc!important}
.e6-lbtn:disabled{cursor:not-allowed;opacity:.7}
.e6-input-row{display:none;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.e6-input-row.show{display:flex}
.e6-inp{background:rgba(255,255,255,.06);border:2px solid rgba(232,160,0,.2);border-radius:10px;padding:8px 12px;color:#fff5e0;font-family:'Nunito',sans-serif;font-size:.9rem;outline:none;transition:all .3s;flex:1;min-width:160px}
.e6-inp:focus{border-color:rgba(232,160,0,.5);box-shadow:0 0 8px rgba(232,160,0,.1)}
.e6-inp.ok{border-color:#00dc64!important;background:rgba(0,220,100,.06)!important}
.e6-inp.bad{border-color:#ff3c50!important;background:rgba(255,60,80,.04)!important}
.e6-inp:disabled{cursor:not-allowed;opacity:.85}
.e6-feedback{font-size:.82rem;font-weight:700;margin-top:4px;min-height:20px}
.ckbtn{background:linear-gradient(135deg,#e8a020,#ffd700);border:none;border-radius:50px;padding:8px 20px;color:#0e0500;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;transition:transform .2s;box-shadow:0 3px 10px rgba(232,160,0,.3)}
.ckbtn:hover{transform:scale(1.04)}
.ckbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* VII box */
.options-box{background:rgba(22,7,0,.45);border:1px solid rgba(232,160,0,.15);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:480px){.options-box{grid-template-columns:1fr}}
.opt-box-item{font-size:.82rem;color:#c8a870;padding:3px 0}
.opt-box-item span{color:#e8a000;font-weight:800}
/* XI starter */
.notice-box{background:rgba(232,160,0,.08);border:2px solid rgba(232,160,0,.2);border-radius:12px;padding:9px 14px;margin-bottom:12px;font-size:.81rem;color:#ffca70;font-weight:600}
.xi-original{font-size:.87rem;color:#c8a060;margin-bottom:9px;padding:7px 12px;background:rgba(232,160,0,.05);border-left:3px solid rgba(232,160,0,.4);border-radius:0 10px 10px 0;font-style:italic}
.xi-row{display:flex;align-items:stretch;margin-bottom:8px;border-radius:13px;overflow:hidden;border:2px solid rgba(232,160,0,.22)}
.xi-starter-bg{background:linear-gradient(135deg,#7a3000,#c45a00);padding:10px 14px;flex-shrink:0;display:flex;align-items:center}
.xi-starter-white{color:white;font-weight:800;font-size:.92rem;white-space:nowrap;font-family:'Nunito',sans-serif}
.tinp-comp{flex:1;background:rgba(255,255,255,.06);border:none;outline:none;padding:10px 12px;color:#fff5e0;font-family:'Nunito',sans-serif;font-size:.9rem;min-width:130px;transition:background .3s}
.tinp-comp:focus{background:rgba(232,160,0,.06)}
.tinp-comp.ok{background:rgba(0,220,100,.06)!important}
.tinp-comp.bad{background:rgba(255,60,80,.04)!important}
.tinp-comp:disabled{cursor:not-allowed;opacity:.85}
/* SUBMIT */
.sub-area{text-align:center;padding:20px 14px}
.sub-btn{background:linear-gradient(135deg,#e8a020,#ffd700,#cd7f32);background-size:200%;border:none;border-radius:50px;padding:13px 38px;color:#0e0500;font-family:'Playfair Display',serif;font-size:.85rem;font-weight:700;cursor:pointer;letter-spacing:.4px;box-shadow:0 8px 25px rgba(232,160,0,.35);animation:sbP 3s ease-in-out infinite;transition:transform .25s}
@keyframes sbP{0%,100%{box-shadow:0 8px 25px rgba(232,160,0,.35)}50%{box-shadow:0 8px 40px rgba(255,215,0,.5)}}
.sub-btn:hover{transform:scale(1.05) translateY(-2px)}
/* MODAL */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center}
.moverlay.show{display:flex}
.mbox{background:linear-gradient(160deg,rgba(14,5,0,.97),rgba(25,8,0,.97));border:2px solid rgba(232,160,0,.3);border-radius:22px;padding:26px 22px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 55px rgba(232,160,0,.22);animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.mbox h2{font-family:'Playfair Display',serif;font-size:.96rem;background:linear-gradient(90deg,#e8a000,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:9px}
.mbox p{color:rgba(255,245,224,.5);margin-bottom:13px;font-size:.84rem}
.minput{width:100%;background:rgba(0,0,5,.5);border:2px solid rgba(232,160,0,.2);border-radius:11px;padding:10px 13px;color:#fff5e0;font-family:'Nunito',sans-serif;font-size:.9rem;margin-bottom:6px;outline:none;transition:border-color .3s}
.minput:focus{border-color:#e8a000}
.minput.err{border-color:#ff3c50;animation:shake .45s ease}
.mbtn{background:linear-gradient(135deg,#e8a020,#ffd700);border:none;border-radius:50px;padding:10px 26px;color:#0e0500;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:800;cursor:pointer;transition:transform .2s;margin-top:3px}
.mbtn:hover{transform:scale(1.04)}
.errmsg{color:#ff3c50;font-size:.74rem;margin:-3px 0 7px;display:none}
.rgreet{font-family:'Playfair Display',serif;font-size:.88rem;color:#e8a000;margin-bottom:7px;line-height:1.4}
.rscore{font-size:2.6rem;font-weight:900;background:linear-gradient(90deg,#e8a000,#ffd700,#cd7f32);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:7px 0 3px}
.r10{font-size:.88rem;color:#c4a060;margin-bottom:11px;font-weight:700}
.rgif{width:180px;height:135px;object-fit:cover;border-radius:11px;margin:6px auto 9px;display:block;border:2px solid rgba(232,160,0,.22)}
.rmsg{color:rgba(255,245,224,.6);font-size:.82rem;line-height:1.5;margin-bottom:11px}
.rbtn{background:linear-gradient(135deg,#e8a020,#ffd700);border:none;border-radius:50px;padding:10px 26px;color:#0e0500;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:900;cursor:pointer;transition:transform .2s}
.rbtn:hover{transform:scale(1.04)}
</style>

<body>
<div class="bg"></div>
<canvas id="cvLeaf"></canvas>
<div class="floats" id="floatDiv"></div>
<div class="pbar" id="pbar" style="width:0%"></div>
<div class="header">
  <h1>🍂 Exercises VI · VII · VIII · XI — Our Experiences</h1>
  <p>👩‍🏫 Ms. Chí Nên &nbsp;|&nbsp; Grade 9 Unit 5 — Error Correction · Communication · Rewriting</p>
</div>
<div class="sticky-remind" id="stickyRemind">
  <span class="sr-dot"></span>
  <span class="sr-text" id="srText">🍂 Tra từ mới bằng Google Dịch/ChatGPT/Gemini. Không được đoán bừa nhé!</span>
</div>
<div class="container" id="mainDiv"></div>
<div class="sub-area"><button class="sub-btn" onclick="openName()">🍁 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
<div class="moverlay" id="nameModal">
  <div class="mbox">
    <h2>🍂 Nộp Bài</h2>
    <p>Nhập tên của bạn nhé! ✨</p>
    <input class="minput" id="nameIn" placeholder="Ví dụ: Trần Hà My..." maxlength="50">
    <div class="errmsg" id="nameErr">⚠️ Vui lòng nhập tên!</div>
    <button class="mbtn" onclick="doSubmit()">✅ Xem Kết Quả</button>
  </div>
</div>
<div class="moverlay" id="resModal">
  <div class="mbox">
    <div class="rgreet" id="rg"></div>
    <div class="rscore" id="rs"></div>
    <div class="r10" id="r10"></div>
    <img class="rgif" id="rgif" src="" alt="">
    <div class="rmsg" id="rm"></div>
    <button class="rbtn" onclick="replay()">🔄 Làm Lại Từ Đầu</button>
  </div>
</div>
<audio id="introAudio" src="https://hoctienganhcungcoMSChíNên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/super_mario_bros.mp3" preload="auto"></audio>
<audio id="wrongAudio" src="https://hoctienganhcungcoMSChíNên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/oi-ban-oi.mp3" preload="auto"></audio>
<script>
const pw=t=>`<span class='p-word'>${t}</span>`,pm=t=>`<span class='p-mean'>${t}</span>`,pg=t=>`<span class='p-grammar'>${t}</span>`,hg=t=>`<span class='hl-green'>${t}</span>`,hr=t=>`<span class='hl-red'>${t}</span>`,wt=t=>`<span class='wt'>${t}</span>`;
function s4(vi,an2,why,wn){return`<div class="step"><span class="slabel">1️⃣ DỊCH CÂU:</span><span class="vi">${vi}</span></div><div class="step"><span class="slabel">2️⃣ PHÂN TÍCH LỖI SAI:</span>${an2}</div><div class="step"><span class="slabel">3️⃣ TẠI SAO SAI:</span>${why}</div><div class="step"><span class="slabel">4️⃣ CÁCH SỬA ĐÚNG:</span>${wn}</div>`}
function s4x(vi,an2,why,wn){return`<div class="step"><span class="slabel">1️⃣ DỊCH CÂU GỐC:</span><span class="vi">${vi}</span></div><div class="step"><span class="slabel">2️⃣ PHÂN TÍCH BIẾN ĐỔI:</span>${an2}</div><div class="step"><span class="slabel">3️⃣ TẠI SAO ĐÚNG:</span>${why}</div><div class="step"><span class="slabel">4️⃣ LƯU Ý NGỮ PHÁP:</span>${wn}</div>`}
function mEx(vi,g2,why,whynot){return`<div class="vnt">💬 Dịch: ${vi}</div><ol><li>Phân tích 4 đáp án:<div class="grid2">${g2}</div></li><li>${hg('✅ TẠI SAO ĐÚNG?')} <span class='p-grammar'>${why}</span></li><li>${hr('❌ TẠI SAO SAI?')} <span class='p-grammar'>${whynot}</span></li></ol>`}

// ══ EX VI: ERROR DETECTION ═══════════════════════════════
const EX6=[
  {id:1,
   q:`I had <u class="e6-ul">a pleasant</u><span class="e6-lbl">A</span> time at secondary school <u class="e6-ul">because</u><span class="e6-lbl">B</span> I had to deal with <u class="e6-ul">many</u><span class="e6-lbl">C</span> <u class="e6-ul">bullies</u><span class="e6-lbl">D</span>.`,
   parts:{A:'a pleasant',B:'because',C:'many',D:'bullies'},
   cl:'A', ct:'an unpleasant',
   expl:s4('"Tôi đã có một khoảng thời gian <u>dễ chịu</u> ở trường trung học vì phải đối phó với nhiều kẻ bắt nạt."',
     `<p>${hr('A: "a pleasant"')} = dễ chịu ← ${hg('ĐÂY LÀ LỖI')} — mâu thuẫn với "dealing with bullies"</p><p>B: "because" ✓ — C: "many" ✓ — D: "bullies" ✓</p>`,
     `${hr('"a pleasant"')} mâu thuẫn với ngữ cảnh. "Had to deal with bullies" (phải đối phó với kẻ bắt nạt) → trải nghiệm này rõ ràng là ${pg('UNPLEASANT')} (khó chịu), không phải pleasant.`,
     `Sửa: ${hg('"an unpleasant"')} = không dễ chịu. Thêm ${pg('tiền tố "un-"')} và đổi "a" thành "an" vì "unpleasant" bắt đầu bằng nguyên âm /ʌ/. ${pg('a/an + adj: a happy time | an unpleasant experience!')}`)},
  {id:2,
   q:`The student <u class="e6-ul">learned</u><span class="e6-lbl">A</span> everything <u class="e6-ul">with heart</u><span class="e6-lbl">B</span>, <u class="e6-ul">so</u><span class="e6-lbl">C</span> he <u class="e6-ul">couldn't answer</u><span class="e6-lbl">D</span> a different question.`,
   parts:{A:'learned',B:'with heart',C:'so',D:"couldn't answer"},
   cl:'B', ct:'by heart',

     `${pg('"The last time...was [X] ago" ↔ "has not + V-pp + for [X]"')}. "ago" → "for". "gave" → "given" (past participle). ${pg('Present Perfect Negative: has/have + not + V-pp + for + duration. "has not given" = have never given in that period!')}`)}
];

// ══ STATE ════════════════════════════════════════════════
let mcqAns={},optsMaps={},typeAns={};
const e6State=Array(10).fill(null).map(()=>({selLetter:null,solved:false,done:false}));
const TOTAL=EX6.length+EX7.length+EX8.length+EX11.length;
function norm(s){return s.toLowerCase().trim().replace(/[.!?,;:'"]/g,'').replace(/\s+/g,' ').trim()}
function isOk(i,a){return a.some(x=>norm(x)===norm(i))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function updatePbar(){const done=Object.keys(mcqAns).length+Object.values(typeAns).filter(Boolean).length+e6State.filter(s=>s.done).length;document.getElementById('pbar').style.width=((done/TOTAL)*100)+'%'}

function initCanvas(){
  const cv=document.getElementById('cvLeaf');cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['rgba(232,160,0,','rgba(255,215,0,','rgba(205,127,50,','rgba(255,120,30,'];
  const particles=Array.from({length:45},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height,
    vx:(Math.random()-.5)*.6,vy:Math.random()*.5+.2,
    r:Math.random()*4+2,ang:Math.random()*Math.PI*2,angV:(Math.random()-.5)*.04,
    alpha:Math.random()*.22+.05,col:cols[Math.floor(Math.random()*cols.length)]
  }));
  const draw=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    particles.forEach(p=>{
      p.y+=p.vy;p.x+=p.vx;p.ang+=p.angV;
      if(p.y>cv.height+10)p.y=-10;if(p.x<-10)p.x=cv.width+10;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);
      ctx.beginPath();ctx.ellipse(0,0,p.r*1.6,p.r,0,0,Math.PI*2);
      ctx.fillStyle=p.col+p.alpha+')';ctx.fill();ctx.restore();
    });requestAnimationFrame(draw);
  };draw();
  window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight});
}

// ══ AUDIO ═════════════════════════════════════════════════
let aCtx;
function getACtx(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();return aCtx}
function playOK(){try{const c=getACtx();[[523,.05],[659,.2],[784,.32],[1047,.44]].forEach(([f,t])=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.22,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.34);o.start(c.currentTime+t);o.stop(c.currentTime+t+.38)});}catch(e){}}
function playBad(){try{const a=document.getElementById('wrongAudio');a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
function doConfetti(){
  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:999';
  document.body.appendChild(cv);const ctx=cv.getContext('2d');cv.width=window.innerWidth;cv.height=window.innerHeight;
  const cols=['#e8a000','#ffd700','#cd7f32','#ff9a00','#fff5e0','#ff7700'];
  const ps=Array.from({length:65},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height,w:Math.random()*10+4,h:Math.random()*5+2,c:cols[Math.floor(Math.random()*cols.length)],sp:Math.random()*3+1.5,ang:Math.random()*Math.PI*2,rot:Math.random()*.2-.1,vx:Math.random()*2-1}));
  let fr=0;const an=()=>{ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.sp;p.x+=p.vx;p.ang+=p.rot;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(++fr<145)requestAnimationFrame(an);else cv.remove()};an();
}

// ══ RENDER EX VI (error detection) ═══════════════════════
function renderEX6(main){
  const sh=document.createElement('div');sh.className='sec-hdr';
  sh.innerHTML=`<div class="sec-title">🔍 VI. Mark the letter A, B, C or D — indicate the underlined part that needs correction.</div><div class="sec-desc">Nhấn chữ cái (A/B/C/D) → Gõ dạng đúng của phần lỗi → Kiểm tra. Phải đúng CẢ HAI: chữ cái VÀ nội dung sửa!</div>`;
  main.appendChild(sh);
  EX6.forEach((q,qi)=>{
    const gid='e6_'+qi;
    const card=document.createElement('div');card.className='qcard';
    card.innerHTML=`<span class="qbadge">🔍 Câu ${q.id}</span>
    <div class="e6-sent">${q.q}</div>
    <div class="e6-letters" id="e6ltrs_${qi}">
      ${['A','B','C','D'].map(l=>`<button class="e6-lbtn" id="e6btn_${qi}_${l}" onclick="e6ClickLetter(${qi},'${l}')">${l}</button>`).join('')}
    </div>
    <div class="e6-input-row" id="e6inprow_${qi}">
      <input class="e6-inp" id="e6inp_${qi}" placeholder="Gõ dạng đúng của phần cần sửa..." autocomplete="off">
      <button class="ckbtn" id="e6ckbtn_${qi}" onclick="e6Check(${qi})">🍁 Kiểm tra</button>
    </div>
    <div class="e6-feedback" id="e6fb_${qi}"></div>
    <div class="expl-block" id="ex_${gid}"><div class="expl-hdr">🍂 GIẢI THÍCH CHI TIẾT</div><div class="expl-body">${q.expl}</div></div>`;
    main.appendChild(card);
    // Enter key
    setTimeout(()=>{
      const inp=document.getElementById('e6inp_'+qi);
      if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')e6Check(qi)});
    },100);
  });
}
function e6ClickLetter(qi,ltr){
  const st=e6State[qi];if(st.done)return;
  // Deselect previous
  ['A','B','C','D'].forEach(l=>{
    const b=document.getElementById('e6btn_'+qi+'_'+l);
    if(b)b.classList.remove('selected');
  });
  st.selLetter=ltr;
  document.getElementById('e6btn_'+qi+'_'+ltr).classList.add('selected');
  const row=document.getElementById('e6inprow_'+qi);
  row.classList.add('show');
  setTimeout(()=>document.getElementById('e6inp_'+qi).focus(),50);
}
function e6Check(qi){
  const st=e6State[qi];
  if(st.done)return;
  const fb=document.getElementById('e6fb_'+qi);
  if(!st.selLetter){fb.textContent='⚠️ Hãy nhấn chọn một chữ cái (A/B/C/D) trước!';fb.style.color='#ffaa00';return;}
  const q=EX6[qi];
  const inp=document.getElementById('e6inp_'+qi);
  const typedText=inp.value.trim();
  if(!typedText){inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),460);fb.textContent='⚠️ Hãy gõ dạng đúng của phần cần sửa trước khi kiểm tra!';fb.style.color='#ffaa00';return;}
  const ltrOK=(st.selLetter===q.cl);
  const txtOK=norm(typedText)===norm(q.ct);
  // Khóa câu hỏi sau khi nộp (1 lần) — và LUÔN hiện key chi tiết để học sinh đọc
  st.done=true;
  inp.disabled=true;
  document.getElementById('e6ckbtn_'+qi).disabled=true;
  ['A','B','C','D'].forEach(l=>{const b=document.getElementById('e6btn_'+qi+'_'+l);if(b){b.disabled=true;b.classList.remove('selected');}});
  // Luôn tô xanh chữ cái ĐÚNG
  document.getElementById('e6btn_'+qi+'_'+q.cl).classList.add('e6-correct');
  if(ltrOK&&txtOK){
    st.solved=true;
    inp.classList.add('ok');
    fb.innerHTML='✅ Hoàn hảo! Đúng cả chữ cái và nội dung sửa! Đọc kỹ giải thích bên dưới và ghi vào vở nhé!';fb.style.color='#00ff88';
    doConfetti();playOK();
  }else{
    inp.classList.add('bad');
    if(!ltrOK){const wb=document.getElementById('e6btn_'+qi+'_'+st.selLetter);if(wb)wb.classList.add('e6-wrong');}
    let msg;
    if(!ltrOK&&!txtOK)msg=`❌ Chưa đúng. Đáp án đúng là <strong>${q.cl}</strong> → sửa thành <strong>"${q.ct}"</strong>. Đọc kỹ giải thích chi tiết bên dưới nhé!`;
    else if(!ltrOK)msg=`❌ Sai chữ cái — phần lỗi nằm ở <strong>${q.cl}</strong>, sửa thành <strong>"${q.ct}"</strong>. Đọc giải thích bên dưới!`;
    else msg=`⚠️ Đúng chữ cái rồi! Nhưng nội dung sửa chưa chính xác — đáp án đúng là <strong>"${q.ct}"</strong>. Đọc giải thích bên dưới!`;
    fb.innerHTML=msg;fb.style.color='#ff8a5b';
    playBad();
  }
  document.getElementById('ex_e6_'+qi).classList.add('show');
  updatePbar();
}
