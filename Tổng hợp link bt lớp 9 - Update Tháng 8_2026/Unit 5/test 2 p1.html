function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#06b6d4','#f97316','#67e8f9','#fde047','#0e7490','#fdba74','#00D26A'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",

     <div><span class='p-word'>perf<u>or</u>mance</span> <span class='p-phonetic'>/pəˈfɔːməns/</span> = <span class='p-mean'>màn trình diễn</span> → âm <b>/ɔː/</b></div>
     <div><span class='hl-green'>world</span> <span class='p-phonetic'>/wɜːld/</span> = <span class='p-mean'>thế giới</span> → âm <b>/ɜː/</b></div>
     <div><span class='p-word'>fl<u>or</u>a</span> <span class='p-phonetic'>/ˈflɔːrə/</span> = <span class='p-mean'>hệ thực vật</span> → âm <b>/ɔː/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"world" có "or" đọc là /ɜː/, khác với ba từ kia có "or" đọc là /ɔː/.</span></li>

   <div class="grid2">

     <div><span class='hl-green'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>(experience IN doing st)</span></div>

   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"experience" không đi với as/about/of trong ngữ cảnh "kinh nghiệm làm việc gì".</span></li></ol>`},

     <div><span class='hl-green'>by rote</span> = <span class='p-mean'>học vẹt (thuộc lòng máy móc)</span></div>

     <div><span class='hl-green'>embarrassed</span> <span class='wt'>adj</span> = <span class='p-mean'>cảm thấy xấu hổ (người)</span></div>
     <div><span class='p-word'>thrilling</span> <span class='wt'>adj</span> = <span class='p-mean'>gây hồi hộp</span></div>

   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>enjoyment, helplessness, interest không phải điều bị "thiếu" do sợ thất bại/tự trọng thấp.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:14,type:"mcq",
 q:"____ these passengers have to wait at the airport, ____ they feel towards the staff.",

 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">

     <div><span class='p-word'>The longer – the more angry</span> = <span class='p-mean'>(sai vế 2)</span></div>
     <div><span class='hl-green'>The longer – the angrier</span> = <span class='p-mean'>càng lâu – càng tức</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc so sánh kép "The + so sánh hơn…, the + so sánh hơn…". Tính từ ngắn "long/angry" → "longer/angrier" (không dùng "more long/more angry").</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"more long/more angry" sai vì đây là tính từ ngắn, phải thêm "-er": longer, angrier.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:15,type:"mcq",
 q:"Ryan: \"I apologise for the mistakes I made in our presentation. It was totally my fault.\" — Cindy: \"____\"",
 options:[{t:"That's alright. Just be more careful next time.",c:true},{t:"I'm fine. Don't worry about me.",c:false},{t:"Sorry. I will make sure that it won't happen again.",c:false},{t:"Thanks. Let's do the presentation together.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Ryan: "Tớ xin lỗi vì những lỗi tớ gây ra trong bài thuyết trình. Đó hoàn toàn là lỗi của tớ." — Cindy: "Không sao đâu. Lần sau cẩn thận hơn là được."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>That's alright. Just be more careful next time.</span> = <span class='p-mean'>Không sao. Lần sau cẩn thận hơn nhé.</span></div>
     <div><span class='p-word'>I'm fine. Don't worry about me.</span> = <span class='p-mean'>Tớ ổn. Đừng lo cho tớ.</span></div>
     <div><span class='p-word'>Sorry. I will make sure it won't happen again.</span> = <span class='p-mean'>Xin lỗi. Tớ sẽ đảm bảo không tái diễn.</span></div>
     <div><span class='p-word'>Thanks. Let's do the presentation together.</span> = <span class='p-mean'>Cảm ơn. Cùng làm bài thuyết trình nhé.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Ryan XIN LỖI → Cindy đáp lời chấp nhận lời xin lỗi: "That's alright. Just be more careful next time." (không sao, lần sau cẩn thận hơn).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác là lời tự xin lỗi/không hợp ngữ cảnh đáp lại một lời xin lỗi.</span></li></ol>`},

/* IV. Closest meaning */
{sec:"A. LANGUAGE FOCUS",part:"IV. Chọn từ GẦN nghĩa nhất với từ gạch chân",n:16,type:"mcq",
 q:"They cancelled the fundraiser due to a <u>lack</u> of volunteers willing to help organise it.",
 options:[{t:"need",c:false},{t:"addition",c:false},{t:"shortage",c:true},{t:"space",c:false}],
 exp:`<div class="vnt">💬 Dịch: Họ hủy sự kiện gây quỹ vì thiếu tình nguyện viên sẵn lòng giúp tổ chức.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>lack</span> = <span class='p-mean'>sự thiếu hụt</span>):
   <div class="grid2">
     <div><span class='p-word'>need</span> <span class='wt'>n</span> = <span class='p-mean'>nhu cầu</span></div>
     <div><span class='p-word'>addition</span> <span class='wt'>n</span> = <span class='p-mean'>sự thêm vào</span></div>
     <div><span class='hl-green'>shortage</span> <span class='wt'>n</span> = <span class='p-mean'>sự thiếu hụt</span></div>
     <div><span class='p-word'>space</span> <span class='wt'>n</span> = <span class='p-mean'>không gian</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"lack" (sự thiếu) đồng nghĩa với "shortage" (sự thiếu hụt).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>need (nhu cầu), addition (thêm vào), space (không gian) không đồng nghĩa với "thiếu hụt".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Chọn từ GẦN nghĩa nhất với từ gạch chân",n:17,type:"mcq",
 q:"The <u>touching</u> scene of the family reunion after years of separation made me cry a lot.",
 options:[{t:"thrilling",c:false},{t:"moving",c:true},{t:"embarrassing",c:false},{t:"exhilarating",c:false}],
 exp:`<div class="vnt">💬 Dịch: Cảnh đoàn tụ cảm động của gia đình sau nhiều năm xa cách khiến tôi khóc rất nhiều.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>touching</span> = <span class='p-mean'>cảm động</span>):
   <div class="grid2">
     <div><span class='p-word'>thrilling</span> <span class='wt'>adj</span> = <span class='p-mean'>hồi hộp</span></div>
     <div><span class='hl-green'>moving</span> <span class='wt'>adj</span> = <span class='p-mean'>cảm động, lay động</span></div>
     <div><span class='p-word'>embarrassing</span> <span class='wt'>adj</span> = <span class='p-mean'>xấu hổ</span></div>
     <div><span class='p-word'>exhilarating</span> <span class='wt'>adj</span> = <span class='p-mean'>phấn khích</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"touching" (cảm động) đồng nghĩa với "moving" (lay động cảm xúc). Hợp với "made me cry".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>thrilling, exhilarating (hồi hộp/phấn khích), embarrassing (xấu hổ) không mang nghĩa "cảm động".</span></li></ol>`},

/* V. Opposite meaning */
{sec:"A. LANGUAGE FOCUS",part:"V. Chọn từ TRÁI nghĩa nhất với từ gạch chân",n:18,type:"mcq",
 q:"If you <u>fail</u> an exam, review your mistakes and work harder for the next one.",
 options:[{t:"take",c:false},{t:"pass",c:true},{t:"achieve",c:false},{t:"miss",c:false}],
 exp:`<div class="vnt">💬 Dịch: Nếu bạn trượt một kỳ thi, hãy xem lại lỗi sai và cố gắng hơn cho lần sau.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>fail</span> = <span class='p-mean'>trượt, thất bại</span>):
   <div class="grid2">
     <div><span class='p-word'>take</span> <span class='wt'>v</span> = <span class='p-mean'>làm (bài thi)</span></div>
     <div><span class='hl-green'>pass</span> <span class='wt'>v</span> = <span class='p-mean'>đỗ, vượt qua</span></div>
     <div><span class='p-word'>achieve</span> <span class='wt'>v</span> = <span class='p-mean'>đạt được</span></div>
     <div><span class='p-word'>miss</span> <span class='wt'>v</span> = <span class='p-mean'>bỏ lỡ</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"fail an exam" (trượt) TRÁI nghĩa với "pass an exam" (đỗ).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>take (làm bài), achieve (đạt được), miss (bỏ lỡ) không phải từ trái nghĩa của "trượt thi".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chọn từ TRÁI nghĩa nhất với từ gạch chân",n:19,type:"mcq",
 q:"This novel started off <u>boring</u>, but it got better and better as the story developed.",
 options:[{t:"exciting",c:true},{t:"relaxing",c:false},{t:"unpleasant",c:false},{t:"memorable",c:false}],
 exp:`<div class="vnt">💬 Dịch: Cuốn tiểu thuyết mở đầu khá nhàm chán, nhưng càng về sau càng hay hơn khi cốt truyện phát triển.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>boring</span> = <span class='p-mean'>nhàm chán</span>):
   <div class="grid2">
     <div><span class='hl-green'>exciting</span> <span class='wt'>adj</span> = <span class='p-mean'>thú vị, hấp dẫn</span></div>
     <div><span class='p-word'>relaxing</span> <span class='wt'>adj</span> = <span class='p-mean'>thư giãn</span></div>
     <div><span class='p-word'>unpleasant</span> <span class='wt'>adj</span> = <span class='p-mean'>khó chịu</span></div>
     <div><span class='p-word'>memorable</span> <span class='wt'>adj</span> = <span class='p-mean'>đáng nhớ</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"boring" (nhàm chán) TRÁI nghĩa với "exciting" (thú vị, hấp dẫn).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>relaxing, unpleasant, memorable không phải từ trái nghĩa trực tiếp của "nhàm chán".</span></li></ol>`},

/* VI. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"VI. Tìm phần gạch chân SAI và sửa lại cho đúng",n:20,type:"error",
 q:"<u>Seeing</u> a tribal dance show is <u>one of</u> the most wonderful <u>experiences</u> I <u>have</u> in my life.",
 options:["Seeing","one of","experiences","have"],correctIdx:3,
 accept:["have ever had","have had","'ve ever had","'ve had"],key:"have → have (ever) had",
 exp:`<div class="vnt">💬 Dịch: Xem một buổi biểu diễn múa của bộ tộc là một trong những trải nghiệm tuyệt vời nhất mà tôi từng có trong đời.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>have</span> → sửa thành <span class='hl-green'>have (ever) had</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Sau cấu trúc "one of the most + adj + N" nói về trải nghiệm tính đến hiện tại → dùng HIỆN TẠI HOÀN THÀNH: "experiences I have (ever) had", không phải "have".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Tìm phần gạch chân SAI và sửa lại cho đúng",n:21,type:"error",
 q:"<u>At the</u> camp, teens can <u>take part in</u> activities such as <u>putting out</u> the tents or <u>building</u> a campfire.",
 options:["At the","take part in","putting out","building"],correctIdx:2,
 accept:["putting up"],key:"putting out → putting up",
 note:"👉 Câu cuối rồi, cố lên nhé! 💪",
 exp:`<div class="vnt">💬 Dịch: Tại trại, thanh thiếu niên có thể tham gia các hoạt động như dựng lều hoặc nhóm lửa trại.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>putting out</span> → sửa thành <span class='hl-green'>putting up</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"put up a tent" = DỰNG lều; còn "put out" nghĩa là DẬP TẮT (lửa). Ở đây phải là "putting up the tents" (dựng lều).</span></li></ol>`},

/* VII. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",
 q:"During the test, my mind ______ (go) blank, and I forgot everything I studied.",
 answer:["went"],
 exp:`<div class="vnt">💬 Dịch: Trong lúc làm bài kiểm tra, đầu óc tôi trống rỗng, và tôi quên hết những gì đã học.</div>
 <ol><li>Đáp án: <span class='hl-green'>went</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sự việc đã xảy ra trong quá khứ (đi kèm "forgot") → Quá khứ đơn. "go" bất quy tắc: go → went (go blank = trở nên trống rỗng).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:23,type:"fill",
 q:"How often ______ they ______ (hold) team-building activities? <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["do hold"],
 exp:`<div class="vnt">💬 Dịch: Họ tổ chức các hoạt động gắn kết đội nhóm bao lâu một lần?</div>
 <ol><li>Đáp án: <span class='hl-green'>do</span> … <span class='hl-green'>hold</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu hỏi tần suất "How often" ở Hiện tại đơn, chủ ngữ "they" → mượn trợ động từ "do" + động từ nguyên mẫu "hold": "How often DO they HOLD…?".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",
 q:"He ______ (not pass) the course unless he submits his work before the due date.",
 answer:["won't pass","will not pass"],
 exp:`<div class="vnt">💬 Dịch: Anh ấy sẽ không qua môn trừ khi nộp bài trước hạn chót.</div>
 <ol><li>Đáp án: <span class='hl-green'>won't pass</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1 với "unless" (= if…not): mệnh đề chính dùng "will + V". Ý phủ định → "won't pass".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:25,type:"fill",
 q:"My health ______ (improve) since I ______ (start) exercising regularly. <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["has improved started"],
 exp:`<div class="vnt">💬 Dịch: Sức khỏe của tôi đã cải thiện kể từ khi tôi bắt đầu tập thể dục đều đặn.</div>
 <ol><li>Đáp án: <span class='hl-green'>has improved</span> … <span class='hl-green'>started</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "S + hiện tại hoàn thành (has improved) + SINCE + S + quá khứ đơn (started)". Mốc bắt đầu chia QK đơn, kết quả kéo dài chia HTHT.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:26,type:"fill",
 q:"Most children dislike ______ (watch) horror films because they're very scary.",
 answer:["watching"],
 exp:`<div class="vnt">💬 Dịch: Hầu hết trẻ em không thích xem phim kinh dị vì chúng rất đáng sợ.</div>
 <ol><li>Đáp án: <span class='hl-green'>watching</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "dislike + V-ing" (không thích làm gì) → watching.</span></li></ol>`},

/* VIII. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"Brad was filled with ______ after being pickpocketed in Europe. <span class='hint-word'>(helpless)</span>",
 answer:["helplessness"],
 exp:`<div class="vnt">💬 Dịch: Brad tràn ngập cảm giác <b>bất lực</b> sau khi bị móc túi ở châu Âu.</div>
 <ol><li>Từ gốc: <span class='p-word'>helpless</span> <span class='wt'>adj</span> = <span class='p-mean'>bất lực</span> → dạng cần điền: <span class='hl-green'>helplessness</span> <span class='wt'>n</span> = <span class='p-mean'>sự bất lực</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: helplessness</span> <span class='p-grammar'>Sau "filled with" cần DANH TỪ (tràn ngập cảm giác gì). helpless → helplessness (thêm "-ness").</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"We had a ______ evening watching the golden sunset together. <span class='hint-word'>(memory)</span>",
 answer:["memorable"],
 exp:`<div class="vnt">💬 Dịch: Chúng tôi đã có một buổi tối <b>đáng nhớ</b> khi cùng nhau ngắm hoàng hôn vàng rực.</div>
 <ol><li>Từ gốc: <span class='p-word'>memory</span> <span class='wt'>n</span> = <span class='p-mean'>ký ức</span> → dạng cần điền: <span class='hl-green'>memorable</span> <span class='wt'>adj</span> = <span class='p-mean'>đáng nhớ</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: memorable</span> <span class='p-grammar'>Cần TÍNH TỪ đứng trước danh từ "evening" → "a memorable evening" (buổi tối đáng nhớ).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"You can't ______ everybody, so make choices that feel right to you. <span class='hint-word'>(pleasant)</span>",
 answer:["please"],
 exp:`<div class="vnt">💬 Dịch: Bạn không thể <b>làm hài lòng</b> tất cả mọi người, nên hãy lựa chọn điều mà bạn thấy đúng.</div>
 <ol><li>Từ gốc: <span class='p-word'>pleasant</span> <span class='wt'>adj</span> = <span class='p-mean'>dễ chịu</span> → dạng cần điền: <span class='hl-green'>please</span> <span class='wt'>v</span> = <span class='p-mean'>làm hài lòng</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: please</span> <span class='p-grammar'>Sau "can't" cần ĐỘNG TỪ nguyên mẫu (can't please everybody = không thể làm hài lòng mọi người). pleasant → please.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:30,type:"fill",
 q:"My best friend and I had a small ______, but then we laughed it off. <span class='hint-word'>(argue)</span>",
 answer:["argument"],
 exp:`<div class="vnt">💬 Dịch: Tôi và bạn thân có một <b>cuộc tranh cãi</b> nhỏ, nhưng rồi chúng tôi cười xòa cho qua.</div>
 <ol><li>Từ gốc: <span class='p-word'>argue</span> <span class='wt'>v</span> = <span class='p-mean'>tranh cãi</span> → dạng cần điền: <span class='hl-green'>argument</span> <span class='wt'>n</span> = <span class='p-mean'>cuộc tranh cãi</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: argument</span> <span class='p-grammar'>Sau "a small ___" cần DANH TỪ (had an argument = có cuộc tranh cãi). argue → argument.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:31,type:"fill",
 q:"______, the young singer hit all the high notes without missing a beat. <span class='hint-word'>(amazing)</span>",
 answer:["amazingly"],
 exp:`<div class="vnt">💬 Dịch: Thật <b>đáng kinh ngạc</b>, cô ca sĩ trẻ đã hát trọn vẹn tất cả các nốt cao mà không lỡ nhịp nào.</div>
 <ol><li>Từ gốc: <span class='p-word'>amazing</span> <span class='wt'>adj</span> = <span class='p-mean'>đáng kinh ngạc</span> → dạng cần điền: <span class='hl-green'>Amazingly</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách đáng kinh ngạc</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: Amazingly</span> <span class='p-grammar'>Đầu câu, bổ nghĩa cho cả câu → cần TRẠNG TỪ, viết hoa chữ đầu. amazing → amazingly.</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Chọn câu chủ đề & thứ tự sắp xếp câu hợp lí",n:44,type:"mcq",
 q:"Chọn CÂU CHỦ ĐỀ mở đầu phù hợp nhất cho đoạn văn:<br><div class='dialog'>(____) We were very excited to perform a K-Pop dance cover. At first, everything went smoothly, and we could hear the crowd cheering...</div>",
 options:[{t:"Last year, I entered my school's talent show with my classmates.",c:true},
          {t:"I have been interested in dancing since I joined a dance club in grade 6.",c:false},
          {t:"I always feel sad and disappointed whenever I think about my past mistakes.",c:false},
          {t:"I had a terrible argument with my friends after last year's competition.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn câu mở đầu (câu chủ đề) hợp nhất cho đoạn kể về màn trình diễn nhảy K-Pop tại cuộc thi tài năng.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>Last year, I entered my school's talent show with my classmates.</span> = <span class='p-mean'>Năm ngoái, tôi tham gia cuộc thi tài năng của trường cùng các bạn.</span></div>
     <div><span class='p-word'>I have been interested in dancing since grade 6.</span> = <span class='p-mean'>Tôi thích nhảy từ lớp 6.</span></div>
     <div><span class='p-word'>I always feel sad... past mistakes.</span> = <span class='p-mean'>Tôi luôn buồn khi nghĩ về lỗi lầm cũ.</span></div>
     <div><span class='p-word'>I had a terrible argument with my friends...</span> = <span class='p-mean'>Tôi cãi nhau to với bạn bè...</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đoạn văn kể về việc "biểu diễn nhảy tại cuộc thi tài năng" → câu chủ đề phải GIỚI THIỆU bối cảnh đó: "Last year, I entered my school's talent show..." (câu A).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B (sở thích nhảy), C (buồn về lỗi cũ), D (cãi nhau) lệch chủ đề, không dẫn vào câu tiếp theo "We were excited to perform".</span></li></ol>`},

{sec:"C. WRITING",part:"I. Chọn câu chủ đề & thứ tự sắp xếp câu hợp lí",n:45,type:"mcq",
 q:"Sắp xếp các câu (a–c) điền vào chỗ trống thứ hai để tạo đoạn văn hợp lí:<br><div class='dialog'>...we could hear the crowd cheering. (____) That was the most memorable part of the night...<br><b>a.</b> The crowd started clapping to encourage us, so we picked up the pace and finished the dance with even more energy.<br><b>b.</b> However, I accidentally tripped during the hardest part of the dance, which made my group lose their balance.<br><b>c.</b> All of us froze for a second, but then we looked at each other and started laughing.</div>",
 options:[{t:"a – b – c",c:false},{t:"b – c – a",c:true},{t:"a – c – b",c:false},{t:"b – a – c",c:false}],
 exp:`<div class="vnt">💬 Chủ đề: Diễn biến khi đang nhảy thì gặp sự cố. Thứ tự đúng là <b>b – c – a</b>.</div>
 <ol><li>Dịch &amp; trình tự hợp lí:
   <div class="orderline"><span class="lbl">b</span> <span class="p-en">However, I accidentally tripped during the hardest part of the dance, which made my group lose their balance.</span> — <span class="p-mean">Tuy nhiên, tôi vô tình vấp ngã ở đoạn khó nhất, khiến cả nhóm mất thăng bằng.</span> <i>("However" – sự cố xảy ra trước)</i></div>
   <div class="orderline"><span class="lbl">c</span> <span class="p-en">All of us froze for a second, but then we looked at each other and started laughing.</span> — <span class="p-mean">Tất cả sững lại một giây, rồi chúng tôi nhìn nhau và bật cười.</span> <i>(phản ứng ngay sau sự cố)</i></div>
   <div class="orderline"><span class="lbl">a</span> <span class="p-en">The crowd started clapping to encourage us, so we picked up the pace and finished the dance with even more energy.</span> — <span class="p-mean">Khán giả vỗ tay cổ vũ, nên chúng tôi tăng tốc và hoàn thành bài nhảy với nhiều năng lượng hơn.</span> <i>(kết quả tích cực, dẫn tới câu "most memorable part")</i></div>
 </li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Mạch diễn biến: sự cố "However" vấp ngã (b) → phản ứng sững lại rồi cười (c) → khán giả cổ vũ, kết thúc trọn vẹn (a). Vậy b – c – a, nối mượt với "That was the most memorable part".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các thứ tự khác đặt câu "However" (sự cố) sai vị trí hoặc để phản ứng (c) trước sự cố (b), làm đứt mạch kể.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu nối đúng nhất từ hai câu cho sẵn",n:46,type:"mcq",
 q:"Nối câu: <em>John started a travel blog. Since then, he has visited many countries all over the world.</em>",
 options:[{t:"John has visited many countries all over the world before he started his travel blog.",c:false},
          {t:"John has visited many countries all over the world since he started his travel blog.",c:true},
          {t:"When John started a travel blog, he has visited many countries all over the world.",c:false},
          {t:"Though John started a travel blog, he has visited many countries all over the world.",c:false}],
 exp:`<div class="vnt">💬 Dịch: John đã đến thăm nhiều quốc gia khắp thế giới kể từ khi anh ấy bắt đầu viết blog du lịch.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>John has visited many countries all over the world since he started his travel blog.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Since then" (kể từ đó) → dùng "since + mốc quá khứ (he started)" đi với hiện tại hoàn thành (has visited).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"before" (trước khi) đảo ngược thời gian; "When/Though" sai quan hệ logic so với "since then".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu nối đúng nhất từ hai câu cho sẵn",n:47,type:"mcq",
 q:"Nối câu: <em>My school is near my home. I go to school on foot every day.</em>",
 options:[{t:"I go to school on foot every day so that my school is near my home.",c:false},
          {t:"My school is near my home, yet I go to school on foot every day.",c:false},
          {t:"My school is near my home, or I go to school on foot every day.",c:false},
          {t:"I go to school on foot every day because my school is near my home.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Tôi đi bộ đến trường mỗi ngày vì trường gần nhà.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>I go to school on foot every day because my school is near my home.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Quan hệ NGUYÊN NHÂN – KẾT QUẢ: trường gần nhà (nguyên nhân) → đi bộ (kết quả). Dùng "because" nối kết quả với nguyên nhân.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"so that" (để mà), "yet" (nhưng), "or" (hoặc) đều sai quan hệ logic giữa hai câu.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu nối đúng nhất từ hai câu cho sẵn",n:48,type:"mcq",
 q:"Nối câu: <em>Everyone was busy setting up the tents. A big deer appeared out of nowhere.</em>",
 options:[{t:"A big deer appeared out of nowhere while everyone was busy setting up the tents.",c:true},
          {t:"A big deer appeared out of nowhere, and everyone was busy setting up the tents.",c:false},
          {t:"Everyone was busy setting up the tents, yet a big deer appeared out of nowhere.",c:false},
          {t:"Everyone was busy setting up the tents while a big deer appeared out of nowhere.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Một con hươu lớn xuất hiện bất ngờ trong khi mọi người đang bận dựng lều.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>A big deer appeared out of nowhere while everyone was busy setting up the tents.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hành động ngắn "appeared" (QK đơn) xen vào hành động đang diễn ra "was busy setting up" (QK tiếp diễn) → nối bằng "while + QK tiếp diễn".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"and/yet" không thể hiện quan hệ thời gian; câu D đặt "while" trước hành động ngắn (appeared) là sai logic thì.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu nối đúng nhất từ hai câu cho sẵn",n:49,type:"mcq",
 q:"Nối câu: <em>More people move to big cities. The healthcare system is better.</em> (so sánh kép)",
 options:[{t:"The healthcare system is better because more people move to big cities.",c:false},
          {t:"Unless more people move to big cities, the healthcare system will be better.",c:false},
          {t:"The better the healthcare system is, the more people move to big cities.",c:true},
          {t:"More people move to big cities, but the healthcare system is better.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Hệ thống y tế càng tốt thì càng có nhiều người chuyển đến các thành phố lớn.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>The better the healthcare system is, the more people move to big cities.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc so sánh kép "The + so sánh hơn…, the + so sánh hơn…" (càng… càng…): The better…, the more people move…</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>because/unless/but không diễn tả quan hệ "càng… càng…" giữa hai vế.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:50,type:"mcq",
 q:"Câu gốc: <em>These tourists have never gone snorkelling in the Great Barrier Reef before.</em>",
 options:[{t:"That was the last time these tourists went snorkelling in the Great Barrier Reef.",c:false},
          {t:"These tourists have gone snorkelling in the Great Barrier Reef a few times.",c:false},
          {t:"This is the first time these tourists have gone snorkelling in the Great Barrier Reef.",c:true},
          {t:"These tourists have just gone snorkelling in the Great Barrier Reef.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Đây là lần đầu tiên những du khách này đi lặn ống thở ở rạn san hô Great Barrier.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>This is the first time these tourists have gone snorkelling in the Great Barrier Reef.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"have never done st before" (chưa từng làm gì) = "This is the first time + S + have done st" (đây là lần đầu). Cùng dùng hiện tại hoàn thành.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A (lần cuối), B (đã vài lần), D (vừa mới) đều mâu thuẫn với "chưa từng… trước đây".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:51,type:"mcq",
 q:"Câu gốc: <em>The hikers decided to go exploring the forest again as it was so thrilling.</em>",
 options:[{t:"Exploring the forest was so thrilling, but the hikers decided not to go again.",c:false},
          {t:"Although exploring the forest was so thrilling, the hikers haven't tried it.",c:false},
          {t:"If exploring the forest is thrilling, the hikers will decide to go again.",c:false},
          {t:"Exploring the forest was so thrilling that the hikers decided to go again.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Việc khám phá khu rừng thú vị đến mức những người leo núi quyết định đi lần nữa.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Exploring the forest was so thrilling that the hikers decided to go again.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"decided to… AS it was so thrilling" (vì quá thú vị) = "so thrilling THAT they decided to…" (thú vị đến nỗi…). Cấu trúc "so + adj + that + kết quả".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A, B nói "không đi/chưa thử" (ngược nghĩa); C biến thành câu điều kiện (sai).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:52,type:"mcq",
 q:"Câu gốc: <em>It's a pity Sarah can't visit Jeju Island with us because she has an exam that week.</em>",
 options:[{t:"We wish Sarah didn't have an exam that week so she could visit Jeju Island with us.",c:true},
          {t:"Sarah can visit Jeju Island with us unless she has an exam that week.",c:false},
          {t:"Despite her exam that week, Sarah still visits Jeju Island with us.",c:false},
          {t:"Sarah has never visited Jeju Island with us because of her exam that week.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chúng tôi ước gì Sarah không có kỳ thi tuần đó để cô ấy có thể đến đảo Jeju cùng chúng tôi.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>We wish Sarah didn't have an exam that week so she could visit Jeju Island with us.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"It's a pity + (hiện tại)" = "wish + (lùi thì)". Ước điều trái thực tế → "wish Sarah didn't have an exam… so she could visit".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B (unless), C (despite – vẫn đi được), D (chưa từng đến) đều làm sai nghĩa câu gốc.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:53,type:"mcq",
 q:"Câu gốc: <em>Seeing a gong show was more interesting than other activities in our trip.</em>",
 options:[{t:"Other activities in our trip are less boring than seeing a gong show.",c:false},
          {t:"No other activities in our trip are more boring than seeing a gong show.",c:false},
          {t:"Seeing a gong show was as interesting as other activities in our trip.",c:false},
          {t:"Seeing a gong show was the most interesting activity in our trip.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Xem biểu diễn cồng chiêng là hoạt động thú vị nhất trong chuyến đi của chúng tôi.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Seeing a gong show was the most interesting activity in our trip.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"more interesting than (all) other activities" (thú vị hơn TẤT CẢ hoạt động khác) = "the most interesting activity" (thú vị NHẤT). So sánh hơn với "other" = so sánh nhất.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A, B dùng "boring" (nhàm chán) làm sai nghĩa; C "as… as" (bằng nhau) trái với "more… than".</span></li></ol>`}
];

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#06283d">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#f97316">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 41 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🚀';memeKey='good';msg='Cố thêm chút nữa là lướt tới đỉnh sóng luôn nè! 🌊';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='🌙';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
</body>
</html>
