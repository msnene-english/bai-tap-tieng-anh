<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice | Ms. Chí Nên</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

        :root {
            --primary: #ff9a9e;
            --secondary: #fecfef;
            --accent: #a18cd1;
            --text-main: #2d3436;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --correct: #00b894;
            --incorrect: #ff7675;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Pattern SVG */
        .svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, rgba(255,255,255,0.2) 100%);
        }

        /* Layout */
        .header-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }
        .header-top h2 {
            font-size: 14px;
            font-weight: 800;
            color: rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .split-container {
            display: flex;
            height: 100vh;
            padding: 40px 20px 20px 20px;
            gap: 20px;
        }

        .pane {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            border-radius: 24px;
            padding: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .pane::-webkit-scrollbar {
            width: 8px;
        }
        .pane::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        /* Reading Pane Elements */
        .passage-card {
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid white;
        }
        .passage-card h3 {
            font-size: 20px;
            color: #6c5ce7;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .paragraph {
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 15px;
            text-align: justify;
        }
        .btn-translate {
            background: rgba(255,255,255,0.7);
            border: 1px solid white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #0984e3;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-translate:hover {
            background: white;
            transform: scale(1.05);
        }
        .translation-text {
            display: none;
            font-size: 15px;
            color: #2d3436;
            background: rgba(116, 185, 255, 0.15);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #74b9ff;
            font-style: italic;
        }

        /* Glossary */
        .glossary {
            margin-top: 20px;
            border-collapse: collapse;
            width: 100%;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            overflow: hidden;
        }
        .glossary th {
            background: rgba(162, 155, 254, 0.5);
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        .glossary td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 14px;
        }
        .glossary tr:last-child td { border-bottom: none; }
        .g-pos { color: #d63031; font-weight: 600; font-size: 12px; }

        /* Quiz Pane Elements */
        .question-card {
            background: rgba(255,255,255,0.6);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .question-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #e84393;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .btn-option {
            background: white;
            border: 2px solid transparent;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #2d3436;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #74b9ff;
            background: #f1f8ff;
        }
        .btn-option.correct {
            background: var(--correct) !important;
            color: white !important;
            border-color: #00997a !important;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
        }
        .btn-option.incorrect {
            background: var(--incorrect) !important;
            color: white !important;
            border-color: #d63031 !important;
            animation: shake 0.4s;
        }
        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Explanations */
        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.8);
            border-radius: 12px;
            border-left: 5px solid #0984e3;
            font-size: 15px;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .explanation-box h4 { color: #2d3436; margin-bottom: 8px; font-size: 16px;}
        .explanation-box ul { margin-left: 20px; margin-bottom: 10px; }
        .explanation-box li { margin-bottom: 5px; }
        .opt-list { list-style-type: disc; margin-bottom: 10px; }
        .opt-list li { margin-bottom: 3px; }
        
        /* Explanation Highlights */
        .p-word { font-weight: 800; color: #0984e3; background: rgba(9, 132, 227, 0.1); padding: 0 4px; border-radius: 4px; }
        .p-phonetic { color: #6c5ce7; font-family: "Courier New", Courier, monospace; }
        .p-mean { color: #d63031; font-weight: 600; }
        .p-grammar { background: rgba(253, 203, 110, 0.3); color: #e17055; padding: 2px 5px; border-radius: 4px; font-weight: 700; font-family: monospace; border: 1px dashed #e17055;}
        .hl-green { color: #00b894; font-weight: 800; display: inline-block; margin-top: 5px; text-transform: uppercase;}
        .hl-red { color: #d63031; font-weight: 800; display: inline-block; margin-top: 5px; text-transform: uppercase;}

        /* Submit Button & Popup */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: 900;
            color: white;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
            transition: 0.3s;
            margin-top: 30px;
        }
        .btn-submit:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(108, 92, 231, 0.4);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .popup {
            background: white;
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup input {
            width: 100%;
            padding: 12px 15px;
            margin: 15px 0;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .popup input:focus { border-color: #74b9ff; }
        .popup button {
            background: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* Scorecard */
        .scorecard { display: none; }
        .score-number { font-size: 40px; font-weight: 900; color: #e84393; margin: 10px 0; }
        .score-converted { font-size: 24px; font-weight: 800; color: #6c5ce7; margin-bottom: 15px;}
        .meme-gif { width: 100%; max-width: 250px; border-radius: 15px; margin: 15px 0; }
        .teacher-comment { font-size: 16px; font-style: italic; color: #636e72; }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999;
        }
    </style>
</head>
<body>

    <svg class="svg-bg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <text x="10%" y="20%" font-size="60" opacity="0.3" class="float">🏞️</text>
        <text x="80%" y="30%" font-size="70" opacity="0.3" class="float">🎤</text>
        <text x="20%" y="80%" font-size="65" opacity="0.3" class="float">🏕️</text>
        <text x="85%" y="85%" font-size="80" opacity="0.3" class="float">✨</text>
        <text x="50%" y="50%" font-size="90" opacity="0.2" class="float">📚</text>
        <text x="60%" y="10%" font-size="50" opacity="0.3" class="float">⛰️</text>
        <style>
            .float { animation: floatAnim 10s ease-in-out infinite alternate; }
            @keyframes floatAnim { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(30px) rotate(15deg); } }
        </style>
    </svg>

    <div class="header-top">
        <h2>Giáo viên tạo: Ms. Chí Nên</h2>
    </div>

    <div class="split-container" id="main-container">
        <div class="pane" id="reading-pane"></div>

        <div class="pane" id="quiz-pane">
            <button class="btn-submit" onclick="showPopup()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>
        </div>
    </div>

    <div class="overlay" id="name-overlay">
        <div class="popup" id="name-popup">
            <h3 style="color: #2d3436; margin-bottom: 10px;">🌟 Bạn đã sẵn sàng nộp bài?</h3>
            <p style="font-size: 14px; color: #636e72;">Hãy nhập tên của con để Ms. Chí Nên chấm điểm nhé!</p>
            <input type="text" id="student-name" placeholder="Ví dụ: Tuệ Minh..." onkeypress="if(event.key === 'Enter') submitQuiz()">
            <button onclick="submitQuiz()">Nộp Bài Ngay!</button>
        </div>
        
        <div class="popup scorecard" id="scorecard-popup">
            <h3 style="color: #6c5ce7;" id="sc-name">Tên học sinh</h3>
            <div class="score-number" id="sc-score">0/20</div>
            <div class="score-converted" id="sc-converted">0.00/10</div>
            <img class="meme-gif" id="sc-gif" src="" alt="Meme">
            <div class="teacher-comment" id="sc-comment">Lời phê</div>
            <button style="margin-top: 15px; background: #e84393;" onclick="closePopup()">Đóng lại xem điểm</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

<script>
// --- DỮ LIỆU BÀI HỌC VÀ CÂU HỎI ---
const examData = [
    {
        title: "Passage 1: A Trip to the Countryside 🏞️",
        paragraphs: [
            { eng: "Last summer, I embarked (1) a memorable trip to the beautiful countryside. It was an escape from the hustle and bustle of the city, and a journey filled with breathtaking natural beauty.", vie: "Mùa hè năm ngoái, tôi đã dấn thân vào (1) một chuyến đi đáng nhớ đến vùng nông thôn xinh đẹp. Đó là một sự trốn chạy khỏi sự hối hả và nhộn nhịp của thành phố, và là một hành trình tràn ngập vẻ đẹp thiên nhiên ngoạn mục." },
            { eng: "The (2) began with a long drive through winding roads that led us deeper into the heart of nature. We arrived at a charming little village with traditional cottages, surrounded by lush green hills and picturesque landscapes.", vie: "Chuyến (2) bắt đầu bằng một chuyến lái xe dài qua những con đường quanh co dẫn chúng tôi tiến sâu hơn vào trung tâm của thiên nhiên. Chúng tôi đến một ngôi làng nhỏ quyến rũ với những ngôi nhà tranh truyền thống, được bao quanh bởi những ngọn đồi xanh tốt và phong cảnh đẹp như tranh vẽ." },
            { eng: "The air was crisp and clean, a refreshing change from the pollution of the city. We (3) the countryside by taking long walks through the meadows and hiking up the hills to catch panoramic views of the valley.", vie: "Không khí trong lành và sạch sẽ, một sự thay đổi sảng khoái so với sự ô nhiễm của thành phố. Chúng tôi đã (3) vùng nông thôn bằng cách đi bộ dài qua các đồng cỏ và leo lên những ngọn đồi để thu trọn tầm nhìn toàn cảnh của thung lũng." },
            { eng: "We visited a pristine lake (4) we had a chance to swim and bask in the sun. It was a surreal experience as I felt (5) close to nature.", vie: "Chúng tôi đã đến thăm một hồ nước hoang sơ (4) chúng tôi có cơ hội bơi lội và đắm mình dưới ánh mặt trời. Đó là một trải nghiệm siêu thực vì tôi cảm thấy (5) gần gũi với thiên nhiên." },
            { eng: "One of the highlights of the trip was the local food. We enjoyed traditional dishes prepared by the villagers, which included freshly harvested vegetables and fruits. The flavors were authentic and delicious, a true taste of the countryside.", vie: "Một trong những điểm nhấn của chuyến đi là thức ăn địa phương. Chúng tôi đã thưởng thức các món ăn truyền thống do dân làng chuẩn bị, bao gồm cả rau và trái cây mới thu hoạch. Hương vị rất chân thực và thơm ngon, một hương vị đích thực của nông thôn." },
            { eng: "The evenings were magical as we sat around a bonfire, (6) stories and enjoying the starry night sky. It was a perfect way to end each day of exploration.", vie: "Những buổi tối thật kỳ diệu khi chúng tôi ngồi quanh đống lửa trại, (6) những câu chuyện và tận hưởng bầu trời đêm đầy sao. Đó là một cách hoàn hảo để kết thúc mỗi ngày khám phá." },
            { eng: "This trip was not just a getaway; it was a soul-refreshing experience that reminded me for the beauty and serenity of nature. I left with a heart full of cherished memories and a desire to return to this peaceful paradise.", vie: "Chuyến đi này không chỉ là một kỳ nghỉ; nó là một trải nghiệm sảng khoái tâm hồn nhắc nhở tôi về vẻ đẹp và sự thanh bình của thiên nhiên. Tôi rời đi với một trái tim tràn đầy những kỷ niệm đáng trân trọng và mong muốn trở lại thiên đường yên bình này." }
        ],
        glossary: [
            { word: "embark on", pos: "phr.v", mean: "bắt tay vào, dấn thân vào" },
            { word: "hustle and bustle", pos: "idiom", mean: "sự hối hả và nhộn nhịp" },
            { word: "breathtaking", pos: "adj", mean: "đẹp ngoạn mục, hấp dẫn" },
            { word: "winding", pos: "adj", mean: "quanh co, uốn khúc" },
            { word: "picturesque", pos: "adj", mean: "đẹp như tranh vẽ" },
            { word: "panoramic", pos: "adj", mean: "toàn cảnh" },
            { word: "pristine", pos: "adj", mean: "nguyên sơ, tinh khôi" },
            { word: "surreal", pos: "adj", mean: "siêu thực, kỳ ảo" },
            { word: "authentic", pos: "adj", mean: "đích thực, chính gốc" },
            { word: "serenity", pos: "n", mean: "sự thanh bình, tĩnh lặng" }
        ],
        questions: [
            {
                qText: "Câu 1: Select the best answer",
                qVie: "Chọn đáp án đúng nhất điền vào chỗ trống (1).",
                options: [
                    { text: "on", vie: "trên / tiếp tục (Giới từ)", isCorrect: true },
                    { text: "in", vie: "trong (Giới từ)", isCorrect: false },
                    { text: "at", vie: "tại (Giới từ)", isCorrect: false },
                    { text: "for", vie: "cho / vì (Giới từ)", isCorrect: false }
                ],
                expl: { right: "Đáp án đúng là <span class='p-word'>on</span>. <span class='p-grammar'>Cấu trúc:</span> <span class='p-word'>embark on/upon something</span> <span class='p-mean'>bắt tay vào, dấn thân vào (một chuyến đi, dự án)</span>. Ngữ cảnh câu là dấn thân vào một chuyến đi đáng nhớ.", wrong: "Các giới từ <span class='p-word'>in</span>, <span class='p-word'>at</span>, và <span class='p-word'>for</span> không kết hợp được với động từ 'embark' để tạo thành cụm động từ có nghĩa trong trường hợp này." }
            },
            {
                qText: "Câu 2: Select the best answer",
                qVie: "Chọn đáp án đúng nhất điền vào chỗ trống (2).",
                options: [
                    { text: "excursion", vie: "cuộc đi tham quan, du ngoạn (Danh từ)", isCorrect: false },
                    { text: "voyage", vie: "chuyến đi dài trên biển/không gian (Danh từ)", isCorrect: false },
                    { text: "cruise", vie: "chuyến du thuyền trên biển (Danh từ)", isCorrect: false },
                    { text: "journey", vie: "cuộc hành trình, chuyến đi dài (Danh từ)", isCorrect: true }
                ],
                expl: { right: "Đáp án đúng là <span class='p-word'>journey</span>. Trong đoạn 1, tác giả đã nhắc đến từ khóa <span class='p-word'>a journey filled with...</span>, nên câu này đang dùng từ nối tiếp để ám chỉ <span class='p-mean'>cuộc hành trình đó bắt đầu bằng một chuyến lái xe...</span>.", wrong: "<span class='p-word'>voyage</span> và <span class='p-word'>cruise</span> dùng cho di chuyển bằng đường thủy/tàu biển (sai ngữ cảnh lái xe). <span class='p-word'>excursion</span> thường là chuyến tham quan ngắn hạn, không phù hợp bằng từ 'journey' đã được thiết lập từ đầu bài." }
            },
            {
                qText: "Câu 3: Select the best answer",
                qVie: "Chọn đáp án đúng nhất điền vào chỗ trống (3).",
                options: [
                    { text: "looked into", vie: "đã điều tra, xem xét (Cụm động từ)", isCorrect: false },
                    { text: "explored", vie: "đã khám phá (Động từ)", isCorrect: true },
                    { text: "found", vie: "đã tìm thấy (Động từ)", isCorrect: false },
                    { text: "discovered", vie: "đã phát hiện ra (Động từ)", isCorrect: false }
                ],
                expl: { right: "Đáp án đúng là <span class='p-word'>explored</span>. <span class='p-grammar'>Collocation:</span> <span class='p-word'>explore the countryside</span> <span class='p-mean'>khám phá vùng nông thôn</span>. Bằng cách đi dạo và leo đồi, họ đang trải nghiệm và khám phá vùng đất này.", wrong: "<span class='p-word'>looked into</span> mang nghĩa điều tra sự việc (sai). <span class='p-word'>found</span> (tìm thấy) và <span class='p-word'>discovered</span> (phát hiện ra điều gì mới lạ chưa ai biết) không phù hợp vì vùng nông thôn này đã có sẵn dân làng sinh sống." }
            },
            {

// --- HỆ THỐNG ÂM THANH (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playDing() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

function playBuzzer() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
    
    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

// --- RENDER GIAO DIỆN ---
let globalQuestionCounter = 0;
let userAnswers = {}; 
let score = 0;

function renderApp() {
    const readingPane = document.getElementById('reading-pane');
    const quizPane = document.getElementById('quiz-pane');
    
    // Cần select nút Submit ra riêng để không bị đè mất
    let submitBtnHTML = `<button class="btn-submit" onclick="showPopup()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>`;
    quizPane.innerHTML = '';

    examData.forEach((passage, pIndex) => {
        // --- 1. RENDER BÀI ĐỌC ---
        let pHTML = `<div class="passage-card">
                        <h3>${passage.title}</h3>`;
        
        passage.paragraphs.forEach((para, i) => {
            let pId = `para-${pIndex}-${i}`;
            pHTML += `<div class="paragraph">${para.eng}</div>
                      <button class="btn-translate" onclick="toggleTranslation('${pId}')">🌟 Mở dịch đoạn này</button>
                      <div class="translation-text" id="${pId}">${para.vie}</div>`;
        });

        // Glossary
        pHTML += `<table class="glossary">
                    <tr><th>Academic Word</th><th>Part of Speech</th><th>Meaning</th></tr>`;
        passage.glossary.forEach(word => {
            pHTML += `<tr>
                        <td style="font-weight: 800; color: #0984e3;">${word.word}</td>
                        <td class="g-pos">${word.pos}</td>
                        <td>${word.mean}</td>
                      </tr>`;
        });
        pHTML += `</table></div>`;
        readingPane.innerHTML += pHTML;

        // --- 2. RENDER CÂU HỎI ---
        passage.questions.forEach((q, qIndex) => {
            globalQuestionCounter++;
            let qId = `q-${globalQuestionCounter}`;
            
            // Xáo trộn đáp án
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            
            let qHTML = `<div class="question-card" id="card-${qId}">
                            <div class="question-title">${q.qText}</div>`;
            
            let optionsHTML = `<div class="options-grid">`;
            shuffledOptions.forEach((opt, oIndex) => {
                let safeOpt = JSON.stringify(opt).replace(/'/g, "&apos;");
                // GIẤU NHẸM PHẦN DỊCH, CHỈ HIỆN 100% TIẾNG ANH LÊN NÚT BẤM
                optionsHTML += `<button class="btn-option" id="btn-${qId}-${oIndex}" onclick='selectAnswer("${qId}", ${oIndex}, ${safeOpt})'>
                                    <b>${opt.text}</b>
                                </button>`;
            });
            optionsHTML += `</div>`;
            
            // Khung Giải thích (Feedback tức thì, có dịch từng đáp án)
            let explHTML = `<div class="explanation-box" id="expl-${qId}">
                                <h4>📚 Giải thích chi tiết:</h4>
                                <ul>
                                    <li><b>Dịch câu hỏi:</b> <span class="p-mean">${q.qVie}</span></li>
                                    <li><b>Các đáp án:</b>
                                        <ul class="opt-list">`;
            
            q.options.forEach(o => {
                explHTML += `<li><b>${o.text}</b> ➔ Dịch: <span class='p-mean'>${o.vie}</span></li>`;
            });
            
            explHTML += `               </ul>
                                    </li>
                                    <li><span class="hl-green">Tại sao đúng:</span> ${q.expl.right}</li>
                                    <li><span class="hl-red">Tại sao sai:</span> ${q.expl.wrong}</li>
                                </ul>
                            </div>`;
            
            qHTML += optionsHTML + explHTML + `</div>`;
            quizPane.insertAdjacentHTML('beforeend', qHTML);
        });
    });

    // Thêm lại nút Submit vào cuối Pane
    quizPane.insertAdjacentHTML('beforeend', submitBtnHTML);
}

function toggleTranslation(id) {
    let el = document.getElementById(id);
    let btn = el.previousElementSibling;
    if(el.style.display === 'block') {
        el.style.display = 'none';
        btn.innerHTML = '🌟 Mở dịch đoạn này';
    } else {
        el.style.display = 'block';
        btn.innerHTML = '🙈 Ẩn bản dịch';
    }
}

function selectAnswer(qId, oIndex, optObj) {
    if(userAnswers[qId]) return; // Không cho click lại
    
    userAnswers[qId] = optObj;
    let clickedBtn = document.getElementById(`btn-${qId}-${oIndex}`);
    let parentCard = document.getElementById(`card-${qId}`);
    let allBtns = parentCard.querySelectorAll('.btn-option');

    // Khóa tất cả nút trong câu
    allBtns.forEach(btn => btn.disabled = true);

    if(optObj.isCorrect) {
        clickedBtn.classList.add('correct');
        playDing();
        shootConfetti(clickedBtn);
        score++;
    } else {
        clickedBtn.classList.add('incorrect');
        playBuzzer();
        // Highlight câu đúng
        allBtns.forEach(btn => {
            if(btn.innerHTML.includes(`<b>${getCorrectText(qId)}</b>`)) {
                btn.style.border = "3px solid #00b894";
                btn.style.background = "#e6fff7";
            }
        });
    }

    // Hiển thị ngay lập tức khung giải thích chi tiết của câu đó
    document.getElementById("expl-" + qId).style.display = "block";
}

function getCorrectText(qId) {
    let index = parseInt(qId.split('-')[1]) - 1;
    let pIdx = 0;
    while(index >= examData[pIdx].questions.length) {
        index -= examData[pIdx].questions.length;
        pIdx++;
    }
    return examData[pIdx].questions[index].options.find(o => o.isCorrect).text;
}

// --- POPUP & TÍNH ĐIỂM ---
function showPopup() {
    let answeredCount = Object.keys(userAnswers).length;
    if(answeredCount < globalQuestionCounter) {
        alert(`Con mới làm ${answeredCount}/${globalQuestionCounter} câu thôi. Làm hết rồi hãy nộp bài nhé!`);
        return;
    }
    document.getElementById('name-overlay').style.display = 'flex';
    document.getElementById('name-popup').style.display = 'block';
    document.getElementById('scorecard-popup').style.display = 'none';
    document.getElementById('student-name').focus();
}

function submitQuiz() {
    let name = document.getElementById('student-name').value.trim();
    if(name === "") {
        alert("Con phải nhập tên thì Ms. Chí Nên mới chấm điểm được nha!");
        return;
    }
    
    // Tính điểm hệ 10
    let scale10 = ((score / globalQuestionCounter) * 10).toFixed(2);
    let percentage = score / globalQuestionCounter;

    // Cập nhật giao diện điểm
    document.getElementById('sc-name').innerText = `Học sinh: ${name}`;
    document.getElementById('sc-score').innerText = `${score} / ${globalQuestionCounter}`;
    document.getElementById('sc-converted').innerText = `Quy đổi: ${scale10} / 10 điểm`;
    
    let gifEl = document.getElementById('sc-gif');
    let cmtEl = document.getElementById('sc-comment');

    if(percentage === 1) {
        gifEl.src = "https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif";
        cmtEl.innerText = "Ms. Chí Nên phê: Quá đỉnh! Con là thiên tài ngoại ngữ! 🌟🏆";
    } else if(percentage >= 0.6) {
        gifEl.src = "https://media.giphy.com/media/3o72FcJmLzIdYJiyRO/giphy.gif";
        cmtEl.innerText = "Ms. Chí Nên phê: Rất tốt! Cố gắng chút nữa là đạt điểm tuyệt đối nhé! 👍✨";
    } else {
        gifEl.src = "https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif";
        cmtEl.innerText = "Ms. Chí Nên phê: Ui chà, phải xem lại lý thuyết kỹ hơn rồi. Cố lên nhé con! 💪📚";
    }

    document.getElementById('name-popup').style.display = 'none';
    document.getElementById('scorecard-popup').style.display = 'block';
}

function closePopup() {
    document.getElementById('name-overlay').style.display = 'none';
}

// --- HIỆU ỨNG PHÁO HOA ĐƠN GIẢN ---
function shootConfetti(element) {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const rect = element.getBoundingClientRect();
    const startX = rect.left + rect.width / 2;
    const startY = rect.top;

    let particles = [];
    const colors = ['#0984e3', '#00b894', '#fdcb6e', '#e84393', '#6c5ce7'];
    
    for(let i=0; i<30; i++) {
        particles.push({
            x: startX, y: startY,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 1) * 10 - 5,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3; // gravity
            if(p.y < canvas.height) {
                active = true;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
        });
        if(active) requestAnimationFrame(draw);
        else ctx.clearRect(0,0, canvas.width, canvas.height);
    }
    draw();
}
