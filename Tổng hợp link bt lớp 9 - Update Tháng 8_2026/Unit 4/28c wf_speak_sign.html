<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 Exercises 9–12 | Word Forms · Communication · Signs | Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;min-height:100vh;background:#08001a;color:#e0d8ff;overflow-x:hidden}
.bg{position:fixed;inset:0;background:linear-gradient(180deg,#08001a 0%,#110030 45%,#08001a 100%);z-index:-5}
#cvGalaxy{position:fixed;inset:0;z-index:-3;pointer-events:none}
.floats{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fobj{position:absolute;user-select:none;filter:drop-shadow(0 0 8px rgba(136,85,255,.4))}
@keyframes gFloat{0%,100%{transform:translateY(0) rotate(0deg)}40%{transform:translateY(-24px) rotate(8deg)}80%{transform:translateY(12px) rotate(-5deg)}}
@keyframes gSpin{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.06)}}
.pbar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#8855ff,#ff44aa,#00ddcc,#8855ff);background-size:200%;z-index:61;transition:width .5s ease;animation:pbS 4s linear infinite;box-shadow:0 0 10px rgba(136,85,255,.7)}
@keyframes pbS{from{background-position:0%}to{background-position:200%}}
.header{text-align:center;padding:10px 16px 8px;background:rgba(8,0,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(136,85,255,.12);position:fixed;top:0;left:0;right:0;z-index:60}
.header h1{font-family:'Orbitron',sans-serif;font-size:.84rem;font-weight:700;background:linear-gradient(90deg,#8855ff,#ff44aa,#00ddcc,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.3px}
.header p{font-size:.63rem;color:rgba(224,216,255,.3);margin-top:1px}
.sticky-remind{position:fixed;top:49px;left:0;right:0;z-index:59;background:rgba(15,0,40,.88);backdrop-filter:blur(10px);border-bottom:1px solid rgba(136,85,255,.18);padding:4px 14px;display:flex;align-items:center;gap:8px}
.sr-dot{width:6px;height:6px;border-radius:50%;background:#8855ff;flex-shrink:0;box-shadow:0 0 6px #8855ff;animation:dotBlink 1.5s ease-in-out infinite}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.2}}
.sr-text{font-size:.67rem;color:rgba(200,170,255,.8);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.container{max-width:880px;margin:0 auto;padding:104px 14px 150px;position:relative;z-index:1}
.sec-hdr{margin:26px 0 14px;padding:13px 18px;background:rgba(18,0,45,.5);border:1px solid rgba(136,85,255,.2);border-radius:15px;position:relative;overflow:hidden}
.sec-hdr::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#8855ff,#ff44aa,#00ddcc)}
.sec-title{font-family:'Orbitron',sans-serif;font-size:.76rem;color:#8855ff;font-weight:700;margin-bottom:3px}
.sec-desc{font-size:.74rem;color:rgba(224,216,255,.45);font-style:italic}
/* TYPE-IN CARD */
.tc{background:rgba(18,0,45,.62);backdrop-filter:blur(14px);border:1px solid rgba(136,85,255,.1);border-radius:18px;padding:17px;margin-bottom:16px;position:relative;overflow:hidden}
.tc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#8855ff,#ff44aa,#00ddcc)}
.qbadge{display:inline-flex;align-items:center;background:rgba(136,85,255,.08);border:1px solid rgba(136,85,255,.22);color:#8855ff;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:20px;margin-bottom:9px}
.qsent{font-size:.93rem;font-weight:700;color:#ccc0f0;line-height:1.75;margin-bottom:9px;padding:8px 12px;background:rgba(0,0,20,.3);border-left:3px solid #8855ff;border-radius:0 10px 10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.qhint{font-size:.76rem;color:rgba(224,216,255,.45);font-style:italic;margin-bottom:8px}
.tinp{background:rgba(0,0,20,.45);border:2px solid rgba(136,85,255,.16);border-radius:8px;padding:7px 11px;color:#e0d8ff;font-family:'Nunito',sans-serif;font-size:.88rem;outline:none;transition:all .3s;min-width:110px;flex-shrink:0}
.tinp:focus{border-color:rgba(136,85,255,.5);box-shadow:0 0 8px rgba(136,85,255,.1)}
.tinp.ok{border-color:#00dc64!important;background:rgba(0,220,100,.05)!important}
.tinp.bad{border-color:#ff3c50!important;background:rgba(255,60,80,.04)!important}
.tinp:disabled{cursor:not-allowed;opacity:.85}
.ckbtn{background:linear-gradient(135deg,#8855ff,#ff44aa);border:none;border-radius:50px;padding:8px 20px;color:white;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;margin-top:7px;transition:transform .2s;box-shadow:0 3px 10px rgba(136,85,255,.3)}
.ckbtn:hover{transform:scale(1.04)}
.ckbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* MCQ CARD */
.qcard{background:rgba(18,0,45,.62);backdrop-filter:blur(14px);border:1px solid rgba(255,68,170,.1);border-radius:18px;padding:17px;margin-bottom:16px;position:relative;overflow:hidden}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff44aa,#8855ff,#00ddcc)}
.qtext{font-size:.93rem;font-weight:700;color:#ccc0f0;line-height:1.65;margin-bottom:12px;padding:8px 12px;background:rgba(0,0,20,.3);border-left:3px solid #ff44aa;border-radius:0 10px 10px 0}
.qtext u{text-decoration:underline;text-decoration-color:#00ddcc;color:#88f8f0;font-weight:800}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
@media(max-width:560px){.opts-grid{grid-template-columns:1fr}}
.opt-btn{background:rgba(18,0,45,.45);border:2px solid rgba(136,85,255,.12);border-radius:13px;padding:10px 12px;color:#c0a8e8;font-family:'Nunito',sans-serif;font-size:.87rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:left;line-height:1.5}
.opt-btn:hover:not(:disabled){transform:scale(1.03) translateY(-2px);background:rgba(136,85,255,.08);border-color:rgba(136,85,255,.38);color:#f0e8ff}
.opt-btn.correct{background:rgba(0,220,100,.15)!important;border-color:#00dc64!important;color:#7dffaa!important;box-shadow:0 0 12px rgba(0,220,100,.25)!important}
.opt-btn.wrong{background:rgba(255,60,80,.12)!important;border-color:#ff3c50!important;color:#ffb3bc!important}
.opt-btn:disabled{cursor:not-allowed;opacity:.9}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.opt-btn.shake{animation:shake .45s ease}
/* INLINE EXPLANATION */
.expl-block{display:none;margin-top:11px;border-radius:12px;overflow:hidden;border:1px solid rgba(136,85,255,.14)}
.expl-block.show{display:block;animation:slideDown .35s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.expl-hdr{background:rgba(136,85,255,.07);padding:8px 13px;font-size:.82rem;font-weight:800;color:#8855ff;border-bottom:1px solid rgba(136,85,255,.1)}
.expl-body{padding:11px 13px;background:rgba(5,0,20,.4);font-size:.84rem;line-height:1.8;color:#a898c8}
.step{margin-bottom:8px;padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.04)}
.slabel{display:block;font-weight:800;font-size:.7rem;color:#00ddcc;margin-bottom:3px;letter-spacing:.3px}
.vi{display:block;background:rgba(255,215,0,.07);border-left:3px solid #ffd700;padding:5px 9px;border-radius:0 7px 7px 0;color:#ffe690;font-weight:700;margin:3px 0;font-size:.83rem}
.vnt{background:rgba(136,85,255,.06);border-left:3px solid #8855ff;padding:6px 11px;border-radius:0 8px 8px 0;color:#c0a8f0;font-style:italic;margin-bottom:9px;font-size:.84rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(136,85,255,.04);border:1px solid rgba(136,85,255,.1);border-radius:7px;padding:5px 9px;font-size:.82rem;line-height:1.6}
.p-word{color:#64d8ff;font-weight:700}
.p-mean{color:#ff9a66;font-weight:600}
.p-grammar{color:#ff6699;text-decoration:underline;text-decoration-color:#ff2244;font-weight:600}
.hl-green{color:#00ff88;font-weight:800}
.hl-red{color:#ff4466;font-weight:800}
.wt{display:inline-block;background:rgba(100,216,255,.1);border:1px solid rgba(100,216,255,.2);color:#80eeff;font-size:.62rem;font-weight:700;padding:0 5px;border-radius:9px;margin-left:2px;vertical-align:middle}
.p-phonetic{color:#cc88ff;background:rgba(204,136,255,.08);padding:1px 5px;border-radius:4px;font-size:.84em}
.sign-box{background:rgba(255,255,255,.06);border:2px solid rgba(136,85,255,.2);border-radius:11px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.sign-icon{font-size:2.2rem}
.sign-desc{font-size:.82rem;color:rgba(224,216,255,.6);font-style:italic}
/* SUBMIT */
.sub-area{text-align:center;padding:20px 14px}
.sub-btn{background:linear-gradient(135deg,#8855ff,#ff44aa,#00ddcc);background-size:200%;border:none;border-radius:50px;padding:13px 38px;color:white;font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;letter-spacing:.4px;box-shadow:0 8px 25px rgba(136,85,255,.35);animation:sbP 3s ease-in-out infinite;transition:transform .25s}
@keyframes sbP{0%,100%{box-shadow:0 8px 25px rgba(136,85,255,.35)}50%{box-shadow:0 8px 40px rgba(255,68,170,.5),0 0 35px rgba(136,85,255,.2)}}
.sub-btn:hover{transform:scale(1.05) translateY(-2px)}
/* MODALS */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center}
.moverlay.show{display:flex}
.mbox{background:linear-gradient(160deg,rgba(8,0,26,.97),rgba(18,0,45,.97));border:2px solid rgba(136,85,255,.3);border-radius:22px;padding:26px 22px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 55px rgba(136,85,255,.25);animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.mbox h2{font-family:'Orbitron',sans-serif;font-size:.92rem;background:linear-gradient(90deg,#8855ff,#ff44aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:9px}
.mbox p{color:rgba(224,216,255,.5);margin-bottom:13px;font-size:.84rem}
.minput{width:100%;background:rgba(0,0,20,.5);border:2px solid rgba(136,85,255,.2);border-radius:11px;padding:10px 13px;color:#e0d8ff;font-family:'Nunito',sans-serif;font-size:.9rem;margin-bottom:6px;outline:none;transition:border-color .3s}
.minput:focus{border-color:#8855ff}
.minput.err{border-color:#ff3c50;animation:shake .45s ease}
.mbtn{background:linear-gradient(135deg,#8855ff,#ff44aa);border:none;border-radius:50px;padding:10px 26px;color:white;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:800;cursor:pointer;transition:transform .2s;margin-top:3px}
.mbtn:hover{transform:scale(1.04)}
.errmsg{color:#ff3c50;font-size:.74rem;margin:-3px 0 7px;display:none}
.rgreet{font-family:'Orbitron',sans-serif;font-size:.82rem;color:#8855ff;text-shadow:0 0 12px rgba(136,85,255,.5);margin-bottom:7px;line-height:1.4}
.rscore{font-size:2.6rem;font-weight:900;background:linear-gradient(90deg,#8855ff,#ff44aa,#00ddcc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:7px 0 3px}
.r10{font-size:.88rem;color:#b0a0d0;margin-bottom:11px;font-weight:700}
.rgif{width:180px;height:135px;object-fit:cover;border-radius:11px;margin:6px auto 9px;display:block;border:2px solid rgba(136,85,255,.22)}
.rmsg{color:rgba(224,216,255,.6);font-size:.82rem;line-height:1.5;margin-bottom:11px}
.rbtn{background:linear-gradient(135deg,#8855ff,#ff44aa);border:none;border-radius:50px;padding:10px 26px;color:white;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:900;cursor:pointer;transition:transform .2s}
.rbtn:hover{transform:scale(1.04)}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="cvGalaxy"></canvas>
<div class="floats" id="floatDiv"></div>
<div class="pbar" id="pbar" style="width:0%"></div>
<div class="header">
  <h1>🔮 Exercises 9–12 | Word Forms · Communication · Signs</h1>
  <p>👩‍🏫 Ms. Chí Nên &nbsp;|&nbsp; Grade 8 — Word Forms · Communication · Reading</p>
</div>
<div class="sticky-remind" id="stickyRemind">
  <span class="sr-dot"></span>
  <span class="sr-text" id="srText">🔍 Tra từ mới bằng Google Dịch/ChatGPT/Gemini. Không được đoán bừa!</span>
</div>
<div class="container" id="mainDiv"></div>
<div class="sub-area"><button class="sub-btn" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
<div class="moverlay" id="nameModal">
  <div class="mbox">
    <h2>🔮 Nộp Bài</h2>
    <p>Nhập tên của bạn nhé! ✨</p>
    <input class="minput" id="nameIn" placeholder="Ví dụ: Nguyễn Bảo Châu..." maxlength="50">
    <div class="errmsg" id="nameErr">⚠️ Vui lòng nhập tên!</div>
    <button class="mbtn" onclick="doSubmit()">✅ Xem Kết Quả</button>
  </div>
</div>
<div class="moverlay" id="resModal">
  <div class="mbox">
    <div class="rgreet" id="rg"></div>
    <div class="rscore" id="rs"></div>
    <div class="r10" id="r10"></div>
    <img class="rgif" id="rgif" src="" alt="">
    <div class="rmsg" id="rm"></div>
    <button class="rbtn" onclick="replay()">🔄 Làm Lại Từ Đầu</button>
  </div>
</div>
<audio id="introAudio" src="https://hoctienganhcungcoMSChíNên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/super_mario_bros.mp3" preload="auto"></audio>
<audio id="wrongAudio" src="https://hoctienganhcungcoMSChíNên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/oi-ban-oi.mp3" preload="auto"></audio>
<script>
// ── HELPERS ─────────────────────────────────────────────────
const pw=t=>`<span class='p-word'>${t}</span>`,pm=t=>`<span class='p-mean'>${t}</span>`,pg=t=>`<span class='p-grammar'>${t}</span>`,hg=t=>`<span class='hl-green'>${t}</span>`,hr=t=>`<span class='hl-red'>${t}</span>`,wt=t=>`<span class='wt'>${t}</span>`;
function mkExpl(viet,g2,why,whynot){return`<div class="vnt">💬 Dịch: ${viet}</div><ol><li>Phân tích 4 đáp án:<div class="grid2">${g2}</div></li><li>${hg('✅ TẠI SAO ĐÚNG?')} <span class='p-grammar'>${why}</span></li><li>${hr('❌ TẠI SAO SAI?')} <span class='p-grammar'>${whynot}</span></li></ol>`}
function s4(vi,an2,why,whynot){return`<div class="step"><span class="slabel">1️⃣ DỊCH:</span><span class="vi">${vi}</span></div><div class="step"><span class="slabel">2️⃣ PHÂN TÍCH:</span>${an2}</div><div class="step"><span class="slabel">3️⃣ TẠI SAO ĐÚNG:</span>${why}</div><div class="step"><span class="slabel">4️⃣ LƯU Ý:</span>${whynot}</div>`}

// ── EX9: WORD FORMS ────────────────────────────────────────
const EX9=[
  {id:1,parts:[{b:0,h:"(Tradition)",ok:["traditionally"]},", we used to cook five-colour sticky rice on the first day of the lunar month."],
   expl:s4('"Theo truyền thống, chúng tôi thường nấu xôi ngũ sắc vào ngày đầu tiên của tháng âm lịch."',
     `<p>${pw('tradition')} (n) → ${pw('traditional')} (adj) → ${hg('traditionally')} (adv)</p><p>Cần TRẠNG TỪ đứng đầu câu (bổ nghĩa cho cả câu)</p>`,
     `Đứng đầu câu, bổ nghĩa cho cả mệnh đề → cần ${hg('trạng từ (adverb)')}. tradition (n) → traditional (adj) → ${hg('traditionally')} (adv, thêm -ally). "Traditionally = theo truyền thống."`,
     `${hr('Traditional')} SAI — adj không đứng đầu câu như vậy mà không có danh từ. ${pg('-ally suffix')}: traditional→traditionally, usual→usually, traditional→traditionally!`)},
  {id:2,parts:["Tom says he can't put up with Mary's ",{b:0,h:"(behave)",ok:["behaviour","behavior"]}," any longer."],
   expl:s4('"Tom nói anh ấy không thể chịu đựng hành vi của Mary thêm nữa."',
     `<p>${pw('behave')} (v) = cư xử → ${hg('behaviour')} (n) = hành vi, cách cư xử</p><p>Sau sở hữu cách "Mary's" cần DANH TỪ</p>`,
     `Sau "Mary's" (possessive) cần ${hg('danh từ')}. behave (v) → ${hg('behaviour')} (n, British) / behavior (American). "put up with someone's behaviour" = chịu đựng hành vi của ai.`,
     `${hr('behave')} SAI — verb không đứng sau possessive. ${pg('behave → behaviour (-iour suffix): behave, favour, colour → behaviour, favour, colour')}!`)},
  {id:3,parts:["Those ",{b:0,h:"(attend)",ok:["attendants"]}," over there are friends of both the bride and groom."],
   expl:s4('"Những <u>người phục vụ/dự tiệc</u> kia là bạn bè của cả cô dâu và chú rể."',
     `<p>${pw('attend')} (v) = tham dự, phục vụ → ${hg('attendant')} (n) = người phục vụ → ${hg('attendants')} (n-pl)</p><p>Chủ ngữ số nhiều sau "Those"</p>`,
     `"Those _____ over there" = số nhiều → cần danh từ số nhiều. attend (v) → ${hg('attendant')} (n, -ant suffix) → ${hg('attendants')} (plural). "attendants" = những người phục vụ/tiếp đón.`,
     `${hr('attenders')} ít phổ biến hơn. ${hr('attending')} = V-ing, không làm chủ ngữ kiểu này. ${pg('-ant suffix: attend→attendant, assist→assistant, attend→attendant')}!`)},
  {id:4,parts:["The photo brought back many happy memories of my ",{b:0,h:"(child)",ok:["childhood"]},"."],
   expl:s4('"Bức ảnh mang lại nhiều ký ức hạnh phúc về thời <u>thơ ấu</u> của tôi."',
     `<p>${pw('child')} (n) = đứa trẻ → ${hg('childhood')} (n) = thời thơ ấu</p><p>Sau "my" cần DANH TỪ</p>`,
     `"my ______" = sau sở hữu cách cần danh từ. child (n) → ${hg('childhood')} (n, -hood suffix). "childhood" = the period of being a child = thời thơ ấu. "happy memories of my childhood."`,
     `${hr('"child"')} (số ít) SAI ngữ nghĩa — cần danh từ chỉ THỜI GIAN. ${pg('-hood suffix: child→childhood, neighbour→neighbourhood, false→falsehood')}!`)},
  {id:5,parts:["I think riding a bicycle is ",{b:0,h:"(convenience)",ok:["inconvenient"]}," especially when it rains."],
   expl:s4('"Tôi nghĩ đi xe đạp <u>bất tiện</u>, đặc biệt khi trời mưa."',
     `<p>${pw('convenience')} (n) = sự tiện lợi → ${pw('convenient')} (adj) → ${hg('inconvenient')} (adj, tiền tố in-)</p><p>Cần TÍNH TỪ sau "is"; "especially when it rains" gợi ý bất tiện</p>`,
     `Ngữ cảnh: "khi trời mưa" → BẤT TIỆN → cần tính từ phủ định. convenience (n) → convenient (adj) → ${hg('inconvenient')} (adj, in- prefix = not). "is inconvenient" = là bất tiện.`,
     `${hr('convenient')} SAI nghĩa (tiện lợi, không phù hợp với "especially when it rains"). ${pg('in- = not: convenient→inconvenient, correct→incorrect, possible→impossible')}!`)},
  {id:6,parts:["She said that in her village, ",{b:0,h:"(marry)",ok:["marriages"]}," used to be arranged by parents."],
   expl:s4('"Cô ấy nói rằng ở làng của cô, <u>các cuộc hôn nhân</u> thường được sắp xếp bởi cha mẹ."',
     `<p>${pw('marry')} (v) = kết hôn → ${pw('marriage')} (n, singular) → ${hg('marriages')} (n-pl)</p><p>Chủ ngữ cần danh từ số nhiều (used to be arranged)</p>`,
     `"_____ used to be arranged" cần danh từ làm chủ ngữ. marry (v) → ${hg('marriage')} (n) → ${hg('marriages')} (plural). "arranged marriages" = hôn nhân sắp xếp.`,

let mcqAns={},optsMaps={},typeAns={};
// Cập nhật biến tổng số câu để chỉ đếm từ bài 9 đến 12
let total_questions = EX9.length + EX10.length + EX11.length + EX12.length;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function norm(s){return s.toLowerCase().trim().replace(/[.!?,;:'"]/g,'').replace(/\s+/g,' ').trim()}
function isOk(i,a){return a.some(x=>norm(x)===norm(i))}
function updatePbar(){
  if(total_questions === 0) return;
  const done=Object.keys(mcqAns).length+Object.keys(typeAns).length;
  document.getElementById('pbar').style.width=((done/total_questions)*100)+'%';
}

// ── CANVAS ───────────────────────────────────────────────────
function initCanvas(){
  const cv=document.getElementById('cvGalaxy');cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const stars=Array.from({length:200},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.3,al:Math.random(),sp:Math.random()*.014+.004,dir:1,col:Math.floor(Math.random()*3)}));
  const nebula=Array.from({length:8},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height*.6,r:Math.random()*60+30,col:[Math.floor(Math.random()*2)]}));
  const scols=['rgba(136,85,255,','rgba(255,68,170,','rgba(0,221,204,'];
  const draw=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    nebula.forEach(n=>{const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);g.addColorStop(0,scols[n.col[0]]+'0.04)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height)});
    stars.forEach(s=>{s.al+=s.sp*s.dir;if(s.al>=1||s.al<=0)s.dir*=-1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=scols[s.col]+Math.abs(s.al)*.85+')';ctx.fill()});
    requestAnimationFrame(draw);
  };draw();
  window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight});
}

let aCtx;
function getACtx(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();return aCtx}
function playOK(){try{const c=getACtx();[[523,.05],[659,.2],[784,.32],[1047,.44]].forEach(([f,t])=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.22,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.34);o.start(c.currentTime+t);o.stop(c.currentTime+t+.38)});}catch(e){}}
function playBad(){try{const a=document.getElementById('wrongAudio');a.currentTime=0;a.play().catch(()=>{})}catch(e){}}

// ── CONFETTI ─────────────────────────────────────────────────
function doConfetti(){
  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:999';
  document.body.appendChild(cv);const ctx=cv.getContext('2d');cv.width=window.innerWidth;cv.height=window.innerHeight;
  const cols=['#8855ff','#ff44aa','#00ddcc','#ffd700','#cc88ff','#ff88dd'];
  const ps=Array.from({length:65},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height,w:Math.random()*10+4,h:Math.random()*5+2,c:cols[Math.floor(Math.random()*cols.length)],sp:Math.random()*3+1.5,ang:Math.random()*Math.PI*2,rot:Math.random()*.2-.1,vx:Math.random()*2-1}));
  let fr=0;const an=()=>{ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.sp;p.x+=p.vx;p.ang+=p.rot;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(++fr<145)requestAnimationFrame(an);else cv.remove()};an();
}

// ── RENDER FILL-IN (multi-blank) ─────────────────────────────
function renderFillIn(main, exercises, prefix, secLabel, secDesc){
  if(!exercises || exercises.length === 0) return;
  const sh=document.createElement('div');sh.className='sec-hdr';
  sh.innerHTML=`<div class="sec-title">✏️ ${secLabel}</div><div class="sec-desc">${secDesc}</div>`;
  main.appendChild(sh);
  exercises.forEach((q,qi)=>{
    const gid=prefix+'_'+qi;
    const card=document.createElement('div');card.className='tc';
    let sentHTML='';let blankCount=0;
    q.parts.forEach(p=>{
      if(typeof p==='string'){sentHTML+=`<span>${p}</span>`;}
      else{
        const bid=gid+'_b'+blankCount;
        const wd=Math.max(90,p.ok[0].length*10+20);
        sentHTML+=`<input class="tinp" id="${bid}" style="width:${wd}px" placeholder="(${p.h})" data-hint="${p.h}" data-ok='${JSON.stringify(p.ok)}'>`;
        blankCount++;
      }
    });
    card.innerHTML=`<span class="qbadge">✏️ ${q.label||('Câu '+q.id)}</span>
    <div class="qsent">${sentHTML}</div>
    <button class="ckbtn" id="cb_${gid}" onclick="checkFill('${gid}',${qi},'${prefix}')">🔮 Kiểm tra</button>
    <div class="expl-block" id="ex_${gid}"><div class="expl-hdr">🔮 GIẢI THÍCH CHI TIẾT</div><div class="expl-body">${q.expl}</div></div>`;
    main.appendChild(card);
  });
}

function checkFill(gid,qi,prefix){
  let exercises;
  if(prefix==='e9') exercises=EX9;
  else return;
  
  const q=exercises[qi];
  let allOk=true;let anyChecked=false;
  let bi=0;
  q.parts.forEach(p=>{
    if(typeof p==='string')return;
    const bid=gid+'_b'+bi;const inp=document.getElementById(bid);
    if(!inp)return;bi++;anyChecked=true;
    const ok=isOk(inp.value,p.ok);
    inp.classList.remove('ok','bad');inp.classList.add(ok?'ok':'bad');inp.disabled=true;
    if(!ok)allOk=false;
  });
  if(!anyChecked)return;
  document.getElementById('cb_'+gid).disabled=true;
  if(allOk){doConfetti();playOK();}else{playBad();}
  document.getElementById('ex_'+gid).classList.add('show');
  typeAns[gid]=allOk;updatePbar();
}

// ── RENDER MCQ ───────────────────────────────────────────────
function renderMCQSec(main, exercises, prefix, secLabel, secDesc, icon){
  if(!exercises || exercises.length === 0) return;
  const sh=document.createElement('div');sh.className='sec-hdr';
  sh.innerHTML=`<div class="sec-title">${icon} ${secLabel}</div><div class="sec-desc">${secDesc}</div>`;
  main.appendChild(sh);
  exercises.forEach((q,qi)=>{
    const gid=prefix+'_'+qi;const sOpts=shuffle(q.opts.map(o=>({...o})));optsMaps[gid]=sOpts;
    const card=document.createElement('div');card.className='qcard';
    let qContent=q.q||'';
    if(q.sents){
      qContent='<div style="font-size:.82rem;line-height:1.75">';
      Object.entries(q.sents).forEach(([k,v])=>{qContent+=`<div><strong style="color:#8855ff">${k}.</strong> <span style="color:#ccc0f0">${v}</span></div>`});
      qContent+='</div>';
    } else if(q.sign){
      qContent=`<div class="sign-box"><span class="sign-icon">${q.sign.icon}</span><div class="sign-desc">${q.sign.desc}</div></div>`;
    }
    card.innerHTML=`<span class="qbadge">${icon} Câu ${q.id}</span>
    <div class="qtext">${qContent}</div>
    <div class="opts-grid">${sOpts.map((o,oi)=>`<button class="opt-btn" id="ob_${gid}_${oi}" onclick="pickMCQ('${gid}',${oi})">${o.h}</button>`).join('')}</div>
    <div class="expl-block" id="ex_${gid}"><div class="expl-hdr">🔮 GIẢI THÍCH CHI TIẾT</div><div class="expl-body">${q.expl}</div></div>`;
    main.appendChild(card);
  });
}

function pickMCQ(gid,oi){
  if(mcqAns[gid]!==undefined)return;
  const ok=optsMaps[gid][oi].c;mcqAns[gid]=ok;
  document.querySelectorAll(`[id^="ob_${gid}_"]`).forEach((b,i)=>{b.disabled=true;if(optsMaps[gid][i].c)b.classList.add('correct')});
  const btn=document.getElementById('ob_'+gid+'_'+oi);
  if(ok){doConfetti();playOK();}else{btn.classList.add('wrong','shake');setTimeout(()=>btn.classList.remove('shake'),460);playBad();}
  document.getElementById('ex_'+gid).classList.add('show');
  updatePbar();
}

  document.getElementById('resModal').classList.remove('show');document.getElementById('nameIn').value='';document.getElementById('nameErr').style.display='none';
  mcqAns={};optsMaps={};typeAns={};renderAll();window.scrollTo({top:0,behavior:'smooth'});
}
function tryIntro(){const a=document.getElementById('introAudio');a.play().catch(()=>{const go=()=>{a.play().catch(()=>{});document.removeEventListener('click',go);document.removeEventListener('touchstart',go)};document.addEventListener('click',go,{once:true});document.addEventListener('touchstart',go,{once:true})});}

function renderAll(){
  const m=document.getElementById('mainDiv');m.innerHTML='';updatePbar();
  
  renderFillIn(m,EX9,'e9','Exercise 9: Give the correct form of the word in CAPITALS','Viết dạng đúng của từ in hoa trong ngoặc.');

}
