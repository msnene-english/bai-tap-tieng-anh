<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;min-height:100vh;background:#0e0500;color:#fff5e0;overflow-x:hidden}

.fobj{position:absolute;user-select:none;filter:drop-shadow(0 0 6px rgba(232,160,0,.35))}
@keyframes leafSway{0%,100%{transform:translateY(0) rotate(0deg)}40%{transform:translateY(-22px) rotate(8deg)}80%{transform:translateY(10px) rotate(-5deg)}}
@keyframes leafDrift{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.06)}}
.pbar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#e8a000,#ffd700,#cd7f32,#ff9a00,#e8a000);background-size:200%;z-index:61;transition:width .5s ease;animation:pbShift 4s linear infinite;box-shadow:0 0 10px rgba(232,160,0,.6)}
@keyframes pbShift{from{background-position:0%}to{background-position:200%}}
.header{text-align:center;padding:10px 16px 8px;background:rgba(14,5,0,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,160,0,.12);position:fixed;top:0;left:0;right:0;z-index:60}
.header h1{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;background:linear-gradient(90deg,#e8a000,#ffd700,#cd7f32,#ff9a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.3px}
.header p{font-size:.63rem;color:rgba(255,245,224,.3);margin-top:1px}
.sticky-remind{position:fixed;top:49px;left:0;right:0;z-index:59;background:rgba(20,8,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid rgba(232,160,0,.18);padding:4px 14px;display:flex;align-items:center;gap:8px}
.sr-dot{width:6px;height:6px;border-radius:50%;background:#e8a000;flex-shrink:0;box-shadow:0 0 6px #e8a000;animation:dotBlink 1.5s ease-in-out infinite}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.2}}
.sr-text{font-size:.67rem;color:rgba(255,210,130,.8);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.container{max-width:880px;margin:0 auto;padding:104px 14px 150px;position:relative;z-index:1}
.sec-hdr{margin:26px 0 14px;padding:13px 18px;background:rgba(25,8,0,.5);border:1px solid rgba(232,160,0,.2);border-radius:15px;position:relative;overflow:hidden}
.sec-hdr::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#e8a000,#ffd700,#cd7f32)}
.sec-title{font-family:'Playfair Display',serif;font-size:.84rem;color:#e8a000;font-weight:700;margin-bottom:3px}
.sec-desc{font-size:.74rem;color:rgba(255,245,224,.42);font-style:italic}
.qcard{background:rgba(22,7,0,.65);backdrop-filter:blur(14px);border:1px solid rgba(232,160,0,.1);border-radius:18px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.qcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#e8a020,#ffd700,#cd7f32)}
.qbadge{display:inline-flex;align-items:center;background:rgba(232,160,0,.08);border:1px solid rgba(232,160,0,.22);color:#e8a000;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:20px;margin-bottom:9px}
.qtext{font-size:.93rem;font-weight:700;color:#e8d8b0;line-height:1.65;margin-bottom:12px;padding:8px 12px;background:rgba(0,0,5,.3);border-left:3px solid #e8a000;border-radius:0 10px 10px 0}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
@media(max-width:560px){.opts-grid{grid-template-columns:1fr}}
.opt-btn{background:rgba(22,7,0,.45);border:2px solid rgba(232,160,0,.12);border-radius:13px;padding:10px 12px;color:#d4b880;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:left;line-height:1.55}
.opt-btn:hover:not(:disabled){transform:scale(1.03) translateY(-2px);background:rgba(232,160,0,.08);border-color:rgba(232,160,0,.38);color:#ffe8a0}
.opt-btn.correct{background:rgba(0,220,100,.15)!important;border-color:#00dc64!important;color:#7dffaa!important;box-shadow:0 0 12px rgba(0,220,100,.25)!important}
.opt-btn.wrong{background:rgba(255,60,80,.12)!important;border-color:#ff3c50!important;color:#ffb3bc!important}
.opt-btn:disabled{cursor:not-allowed;opacity:.9}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.opt-btn.shake{animation:shake .45s ease}
.expl-block{display:none;margin-top:11px;border-radius:12px;overflow:hidden;border:1px solid rgba(232,160,0,.14)}
.expl-block.show{display:block;animation:slideDown .35s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.expl-hdr{background:rgba(232,160,0,.07);padding:8px 13px;font-size:.82rem;font-weight:800;color:#e8a000;border-bottom:1px solid rgba(232,160,0,.1)}
.expl-body{padding:11px 13px;background:rgba(5,2,0,.4);font-size:.84rem;line-height:1.85;color:#c8a870}
.step{margin-bottom:8px;padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.04)}
.slabel{display:block;font-weight:800;font-size:.7rem;color:#e8a000;margin-bottom:3px;letter-spacing:.3px}
.vi{display:block;background:rgba(232,160,0,.07);border-left:3px solid #ffd700;padding:5px 9px;border-radius:0 7px 7px 0;color:#ffe690;font-weight:700;margin:3px 0;font-size:.83rem}
.vnt{background:rgba(232,160,0,.06);border-left:3px solid #e8a000;padding:6px 11px;border-radius:0 8px 8px 0;color:#e8c880;font-style:italic;margin-bottom:9px;font-size:.84rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(232,160,0,.04);border:1px solid rgba(232,160,0,.1);border-radius:7px;padding:5px 9px;font-size:.82rem;line-height:1.65}
.p-word{color:#64d8ff;font-weight:700}
.p-mean{color:#ff9a66;font-weight:600}
.p-grammar{color:#ff6699;text-decoration:underline;text-decoration-color:#ff2244;font-weight:600}
.hl-green{color:#00ff88;font-weight:800}
.hl-red{color:#ff4466;font-weight:800}
.wt{display:inline-block;background:rgba(100,216,255,.1);border:1px solid rgba(100,216,255,.2);color:#80eeff;font-size:.62rem;font-weight:700;padding:0 5px;border-radius:9px;margin-left:2px;vertical-align:middle}
.p-phonetic{color:#cc88ff;background:rgba(204,136,255,.08);padding:1px 5px;border-radius:4px;font-size:.84em;font-style:italic}
.tc{background:rgba(22,7,0,.65);backdrop-filter:blur(14px);border:1px solid rgba(255,215,0,.12);border-radius:18px;padding:17px;margin-bottom:16px;position:relative;overflow:hidden}
.tc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ffd700,#e8a020,#cd7f32)}
.qhint{font-size:.76rem;color:rgba(255,245,224,.42);font-style:italic;margin-bottom:7px}
.qsent{font-size:.93rem;font-weight:700;color:#e8d8b0;line-height:1.75;margin-bottom:9px;padding:8px 12px;background:rgba(0,0,5,.3);border-left:3px solid #ffd700;border-radius:0 10px 10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.tinp{background:rgba(0,0,5,.45);border:2px solid rgba(255,215,0,.16);border-radius:8px;padding:7px 11px;color:#fff5e0;font-family:'Nunito',sans-serif;font-size:.88rem;outline:none;transition:all .3s;min-width:110px;flex-shrink:0}
.tinp-full{width:100%;background:rgba(0,0,5,.45);border:2px solid rgba(255,215,0,.16);border-radius:8px;padding:8px 12px;color:#fff5e0;font-family:'Nunito',sans-serif;font-size:.88rem;outline:none;transition:all .3s;display:block;margin-bottom:6px}
.tinp:focus,.tinp-full:focus{border-color:rgba(255,215,0,.5);box-shadow:0 0 8px rgba(255,215,0,.1)}
.tinp.ok,.tinp-full.ok{border-color:#00dc64!important;background:rgba(0,220,100,.05)!important}
.tinp.bad,.tinp-full.bad{border-color:#ff3c50!important;background:rgba(255,60,80,.04)!important}
.tinp:disabled,.tinp-full:disabled{cursor:not-allowed;opacity:.85}
.ckbtn{background:linear-gradient(135deg,#e8a020,#ffd700);border:none;border-radius:50px;padding:8px 20px;color:#0e0500;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;margin-top:7px;transition:transform .2s;box-shadow:0 3px 10px rgba(232,160,0,.3)}
.ckbtn:hover{transform:scale(1.04)}
.ckbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.sub-area{text-align:center;padding:20px 14px}
.sub-btn{background:linear-gradient(135deg,#e8a020,#ffd700,#cd7f32);background-size:200%;border:none;border-radius:50px;padding:13px 38px;color:#0e0500;font-family:'Playfair Display',serif;font-size:.88rem;font-weight:700;cursor:pointer;letter-spacing:.5px;box-shadow:0 8px 25px rgba(232,160,0,.35);animation:sbP 3s ease-in-out infinite;transition:transform .25s}
@keyframes sbP{0%,100%{box-shadow:0 8px 25px rgba(232,160,0,.35)}50%{box-shadow:0 8px 40px rgba(255,215,0,.5),0 0 35px rgba(232,160,0,.2)}}
.sub-btn:hover{transform:scale(1.05) translateY(-2px)}
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center}
.moverlay.show{display:flex}
.mbox{background:linear-gradient(160deg,rgba(14,5,0,.97),rgba(25,8,0,.97));border:2px solid rgba(232,160,0,.3);border-radius:22px;padding:26px 22px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 55px rgba(232,160,0,.22);animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.mbox h2{font-family:'Playfair Display',serif;font-size:1rem;background:linear-gradient(90deg,#e8a000,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:9px}
.mbox p{color:rgba(255,245,224,.5);margin-bottom:13px;font-size:.84rem}
.minput{width:100%;background:rgba(0,0,5,.5);border:2px solid rgba(232,160,0,.2);border-radius:11px;padding:10px 13px;color:#fff5e0;font-family:'Nunito',sans-serif;font-size:.9rem;margin-bottom:6px;outline:none;transition:border-color .3s}
.minput:focus{border-color:#e8a000}
.minput.err{border-color:#ff3c50;animation:shake .45s ease}
.mbtn{background:linear-gradient(135deg,#e8a020,#ffd700);border:none;border-radius:50px;padding:10px 26px;color:#0e0500;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:800;cursor:pointer;transition:transform .2s;margin-top:3px}
.mbtn:hover{transform:scale(1.04)}
.errmsg{color:#ff3c50;font-size:.74rem;margin:-3px 0 7px;display:none}
.rgreet{font-family:'Playfair Display',serif;font-size:.88rem;color:#e8a000;text-shadow:0 0 12px rgba(232,160,0,.5);margin-bottom:7px;line-height:1.4}
.rscore{font-size:2.6rem;font-weight:900;background:linear-gradient(90deg,#e8a000,#ffd700,#cd7f32);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:7px 0 3px}
.r10{font-size:.88rem;color:#c4a060;margin-bottom:11px;font-weight:700}
.rgif{width:180px;height:135px;object-fit:cover;border-radius:11px;margin:6px auto 9px;display:block;border:2px solid rgba(232,160,0,.22)}
.rmsg{color:rgba(255,245,224,.6);font-size:.82rem;line-height:1.5;margin-bottom:11px}
.rbtn{background:linear-gradient(135deg,#e8a020,#ffd700);border:none;border-radius:50px;padding:10px 26px;color:#0e0500;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:900;cursor:pointer;transition:transform .2s}
.rbtn:hover{transform:scale(1.04)}
</style>

<body>
<div class="bg"></div>
<canvas id="cvLeaves"></canvas>
<div class="floats" id="floatDiv"></div>
<div class="pbar" id="pbar" style="width:0%"></div>
<div class="header">
  <h1>🍂 Test For Unit 4 — Remembering The Past</h1>
  <p>👩‍🏫 Ms MS Chí Nên &nbsp;|&nbsp; Grade 8 — Pronunciation · Stress · Grammar · Verb Forms · Word Forms</p>
</div>
<div class="sticky-remind" id="stickyRemind">
  <span class="sr-dot"></span>
  <span class="sr-text" id="srText">🔍 Tra từ mới bằng Google Dịch/ChatGPT/Gemini. Không được lười suy nghĩ, đoán bừa!</span>
</div>
<div class="container" id="mainDiv"></div>
<div class="sub-area"><button class="sub-btn" onclick="openName()">🍁 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
<div class="moverlay" id="nameModal">
  <div class="mbox">
    <h2>🍂 Nộp Bài</h2>
    <p>Nhập tên của bạn nhé! ✨</p>
    <input class="minput" id="nameIn" placeholder="Ví dụ: Nguyễn Hà Linh..." maxlength="50">
    <div class="errmsg" id="nameErr">⚠️ Vui lòng nhập tên!</div>
    <button class="mbtn" onclick="doSubmit()">✅ Xem Kết Quả</button>
  </div>
</div>
<div class="moverlay" id="resModal">
  <div class="mbox">
    <div class="rgreet" id="rg"></div>
    <div class="rscore" id="rs"></div>
    <div class="r10" id="r10"></div>
    <img class="rgif" id="rgif" src="" alt="">
    <div class="rmsg" id="rm"></div>
    <button class="rbtn" onclick="replay()">🔄 Làm Lại Từ Đầu</button>
  </div>
</div>
<audio id="introAudio" src="https://hoctienganhcungcoMSChíNên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/super_mario_bros.mp3" preload="auto"></audio>
<audio id="wrongAudio" src="https://hoctienganhcungcoMSChíNên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/oi-ban-oi.mp3" preload="auto"></audio>
<audio id="wrongAudio2" src="https://hoctienganhcungcoMSChíNên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/mission_impossible.mp3" preload="auto"></audio>
<script>
const pw=t=>`<span class='p-word'>${t}</span>`,pm=t=>`<span class='p-mean'>${t}</span>`,pg=t=>`<span class='p-grammar'>${t}</span>`,hg=t=>`<span class='hl-green'>${t}</span>`,hr=t=>`<span class='hl-red'>${t}</span>`,wt=t=>`<span class='wt'>${t}</span>`,ph=t=>`<span class='p-phonetic'>${t}</span>`;
function mkExpl(viet,g2,why,whynot){return`<div class="vnt">💬 Dịch: ${viet}</div><ol><li>Phân tích 4 đáp án:<div class="grid2">${g2}</div></li><li>${hg('✅ TẠI SAO ĐÚNG?')} <span class='p-grammar'>${why}</span></li><li>${hr('❌ TẠI SAO SAI?')} <span class='p-grammar'>${whynot}</span></li></ol>`}
function s4(vi,an2,why,wn){return`<div class="step"><span class="slabel">1️⃣ DỊCH CÂU:</span><span class="vi">${vi}</span></div><div class="step"><span class="slabel">2️⃣ PHÂN TÍCH DẠNG CẦN ĐIỀN:</span>${an2}</div><div class="step"><span class="slabel">3️⃣ TẠI SAO ĐÚNG:</span>${why}</div><div class="step"><span class="slabel">4️⃣ LƯU Ý / QUY TẮC:</span>${wn}</div>`}

// ════════════════════════════════════════════
// SECTION I — PRONUNCIATION
// ════════════════════════════════════════════
const SEC1=[
  {id:1,q:'Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với ba từ còn lại.',
   opts:[{h:'<u>e</u>motion',c:false},{h:'ind<u>e</u>cisive',c:false},{h:'ob<u>e</u>sity',c:true},{h:'b<u>e</u>lievable',c:false}],
   expl:mkExpl('"Chọn từ có phần gạch chân phát âm khác với ba từ còn lại. (phần gạch chân: chữ <b>e</b>)"',
     `<div>${pw('<u>e</u>motion')} ${ph('/ɪˈmoʊʃn/')} = ${pm('cảm xúc — "e" = /ɪ/ ngắn')}</div>
      <div>${pw('ind<u>e</u>cisive')} ${ph('/ˌɪndɪˈsaɪsɪv/')} = ${pm('thiếu quyết đoán — "e" = /ɪ/ ngắn')}</div>
      <div>${hg('ob<u>e</u>sity')} ${ph('/oʊˈbiːsɪti/')} = ${pm('béo phì — "e" = /iː/ DÀI ← KHÁC!')}</div>
      <div>${pw('b<u>e</u>lievable')} ${ph('/bɪˈliːvəbl/')} = ${pm('có thể tin được — "e" = /ɪ/ ngắn')}</div>`,
     `Trong ${hg('obesity')} ${ph('/oʊˈbiːsɪti/')}, chữ "e" được phát âm là ${ph('/iː/')} (nguyên âm DÀI). Nhấn vào âm tiết thứ hai: o-BEE-si-ty. Âm "ee" dài, rõ ràng.`,
     `${pw('emotion')} ${ph('/ɪ/')} — nguyên âm ngắn. ${pw('indecisive')} "de" = /dɪ/ — "e" ngắn. ${pw('believable')} — chữ "e" đầu: /bɪ-/ ngắn. Tất cả ba từ kia đều có "e" ngắn /ɪ/, chỉ obesity có /iː/ dài!`)},
  {id:2,q:'Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với ba từ còn lại.',
   opts:[{h:'ha<u>ng</u>ing',c:false},{h:'belo<u>ng</u>',c:false},{h:'si<u>ng</u>er',c:false},{h:'a<u>ng</u>er',c:true}],
   expl:mkExpl('"Chọn từ có phần gạch chân phát âm khác với ba từ còn lại. (phần gạch chân: <b>ng</b>)"',
     `<div>${pw('ha<u>ng</u>ing')} ${ph('/ˈhæŋɪŋ/')} = ${pm('đang treo — "ng" = /ŋ/ (không có âm /g/)')}</div>
      <div>${pw('belo<u>ng</u>')} ${ph('/bɪˈlɒŋ/')} = ${pm('thuộc về — "ng" = /ŋ/ (không có âm /g/)')}</div>
      <div>${pw('si<u>ng</u>er')} ${ph('/ˈsɪŋər/')} = ${pm('ca sĩ — "ng" = /ŋ/ (không có âm /g/)')}</div>
      <div>${hg('a<u>ng</u>er')} ${ph('/ˈæŋɡər/')} = ${pm('tức giận — "ng" = /ŋɡ/ CÓ âm /g/ thêm ← KHÁC!')}</div>`,
     `${hg('anger')} ${ph('/ˈæŋɡər/')} — tổ hợp "-ng-" trong "anger" được phát âm là /ŋg/ (hai âm). Đây là quy tắc: gốc từ không phải "-ing" suffix thì "-ng-" + vowel = /ŋɡ/.`,
     `${pw('singer')} = gốc là "sing" + suffix "-er" → ng chỉ là /ŋ/. ${pw('hanging')} = "hang" + "-ing" → /ŋ/. ${pw('belong')} → /ŋ/ cuối. Bẫy thường gặp: "singer" /ˈsɪŋər/ ≠ "anger" /ˈæŋɡər/ — phân biệt kỹ nhé!`)},
  {id:3,q:'Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với ba từ còn lại.',
   opts:[{h:'behav<u>ed</u>',c:false},{h:'pass<u>ed</u>',c:true},{h:'entertain<u>ed</u>',c:false},{h:'chang<u>ed</u>',c:false}],
   expl:mkExpl('"Chọn từ có phần gạch chân phát âm khác với ba từ còn lại. (phần gạch chân: đuôi <b>-ed</b>)"',
     `<div>${pw('behav<u>ed</u>')} ${ph('/bɪˈheɪvd/')} = ${pm('đã cư xử — "-ed" = /d/ (sau âm hữu thanh /v/)')}</div>
      <div>${hg('pass<u>ed</u>')} ${ph('/pɑːst/')} = ${pm('đã vượt qua — "-ed" = /t/ (sau âm vô thanh /s/) ← KHÁC!')}</div>
      <div>${pw('entertain<u>ed</u>')} ${ph('/ˌentərˈteɪnd/')} = ${pm('đã giải trí — "-ed" = /d/ (sau âm hữu thanh /n/)')}</div>
      <div>${pw('chang<u>ed</u>')} ${ph('/tʃeɪndʒd/')} = ${pm('đã thay đổi — "-ed" = /d/ (sau âm hữu thanh /dʒ/)')}</div>`,

     `"He _____ just lied on the couch" = cần adverb. basic (adj) → ${hg('basically')} (adv, +-ally). "basically" = về cơ bản, chủ yếu là. ${pg('basic + ally = basically')}.`,
     `${hr('"basic"')} (adj) SAI — adj không bổ nghĩa cho động từ. ${pg('-ally suffix: basic→basically, typical→typically, dramatic→dramatically, economic→economically')}!`)},
  {id:7,parts:["This approach can help identify common ",[{b:0,h:"(behave)",ok:["behaviors","behaviours","behavior","behaviour"]}]," and their causes."],

     `${hr('"behave"')} SAI — verb không làm object. ${hr('"behavioral"')} (adj) SAI — cần noun. ${pg('behave (v) → behavior/behaviour (n) → behaviors/behaviours (plural)')}. Cả hai cách viết đều được chấp nhận!`)},
  {id:8,parts:["She appears to actually like the man, which I find ",[{b:0,h:"(credible)",ok:["incredible"]}],"."],
   expl:s4('"Cô ấy có vẻ thực sự thích người đàn ông đó, điều mà tôi thấy thật không thể tin được."',

     `"I find it _____" = thấy điều đó... "which I find incredible" = điều mà tôi thấy không thể tin. credible = đáng tin → ${hg('in-')}credible = không thể tin được, kinh ngạc. ${pg('in- (prefix) = not: credible→incredible')}.`,
     `${hr('"credible"')} = đáng tin cậy — ý nghĩa ngược ngữ cảnh. ${hr('"uncredible"')} không tồn tại. ${pg('in- prefix: incredible, impossible, incorrect, independent, inconvenient, informal')}. Không phải "un-credible"!`)},
  {id:9,parts:["The British ",[{b:0,h:"(proud)",ok:["pride"]}]," themselves on their long history and social etiquette."],

     `${hr('"proud themselves"')} SAI — proud là adj, không dùng như verb. ${hr('"be proud of"')} là cách khác nhưng không phù hợp cú pháp câu này. ${pg('to pride oneself on = to be proud of = tự hào về')}!`)},
  {id:10,parts:["I found the ending of the novel a bit ",[{b:0,h:"(believe)",ok:["unbelievable"]}],"."],
   expl:s4('"Tôi thấy phần kết của cuốn tiểu thuyết này hơi khó tin."',
     `<p>Ngữ cảnh: "a bit" + adj tiêu cực = hơi khó tin. Cần adj phủ định.</p><p>${pw('believe')} → ${pw('believable')} → ${hg('unbelievable')} (un- + -able).</p>`,
     `believe (v) → believable (adj, +-able) → ${hg('unbelievable')} (un- + believable). "un-" = tiền tố phủ định. "a bit unbelievable" = hơi không thể tin được. ${pg('believe → un+believ+able = unbelievable')}.`,
     `${hr('"believable"')} = đáng tin, câu sẽ có nghĩa tích cực (không phù hợp tâm lý người đọc). ${hr('"unbelieve"')} không tồn tại. ${pg('-able suffix + un- prefix: believable→unbelievable, reliable→unreliable, acceptable→unacceptable')}!`)}

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════
let mcqAns={},optsMaps={},typeAns={};
const TOTAL = SEC1.length+SEC2.length+SEC3.length+SEC4.length+SEC5.length;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function norm(s){return s.toLowerCase().trim().replace(/[.!?,;:'"]/g,'').replace(/\s+/g,' ').trim()}
function isOk(i,a){return a.some(x=>norm(x)===norm(i))}
function updatePbar(){const done=Object.keys(mcqAns).length+Object.keys(typeAns).length;document.getElementById('pbar').style.width=((done/TOTAL)*100)+'%'}

// ════════════════════════════════════════════
// CANVAS — AUTUMN LEAVES
// ════════════════════════════════════════════
function initCanvas(){
  const cv=document.getElementById('cvLeaves');cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['rgba(232,160,0,','rgba(255,215,0,','rgba(205,127,50,','rgba(255,120,30,','rgba(200,80,20,'];
  const particles=Array.from({length:50},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height,
    vx:(Math.random()-.5)*.6,vy:Math.random()*.8+.2,
    r:Math.random()*3.5+1.5,alpha:Math.random()*.35+.05,
    col:cols[Math.floor(Math.random()*cols.length)],
    rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.03
  }));
  const glow=Array.from({length:6},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*70+30,col:cols[Math.floor(Math.random()*2)]}));
  const draw=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    glow.forEach(g=>{const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);gr.addColorStop(0,g.col+'0.035)');gr.addColorStop(1,'transparent');ctx.fillStyle=gr;ctx.fillRect(0,0,cv.width,cv.height)});
    particles.forEach(p=>{
      p.y+=p.vy;p.x+=p.vx;p.rot+=p.rotV;
      if(p.y>cv.height+10)p.y=-10;if(p.x<-10)p.x=cv.width+10;if(p.x>cv.width+10)p.x=-10;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.beginPath();ctx.ellipse(0,0,p.r*1.6,p.r,0,0,Math.PI*2);
      ctx.fillStyle=p.col+p.alpha+')';ctx.fill();ctx.restore();
    });requestAnimationFrame(draw);
  };draw();
  window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight});
}

// AUDIO
// ════════════════════════════════════════════
let aCtx;
function getACtx(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();return aCtx}
function playOK(){try{const c=getACtx();[[523,.05],[659,.2],[784,.32],[1047,.44]].forEach(([f,t])=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.22,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.34);o.start(c.currentTime+t);o.stop(c.currentTime+t+.38)});}catch(e){}}
function playBad(){const id=Math.random()<.5?'wrongAudio':'wrongAudio2';try{const a=document.getElementById(id);a.currentTime=0;a.play().catch(()=>{})}catch(e){}}

// ════════════════════════════════════════════
// CONFETTI
// ════════════════════════════════════════════
function doConfetti(){
  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:999';
  document.body.appendChild(cv);const ctx=cv.getContext('2d');cv.width=window.innerWidth;cv.height=window.innerHeight;
  const cols=['#e8a000','#ffd700','#cd7f32','#ff9a00','#fff5e0','#ff7700'];
  const ps=Array.from({length:65},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height,w:Math.random()*10+4,h:Math.random()*5+2,c:cols[Math.floor(Math.random()*cols.length)],sp:Math.random()*3+1.5,ang:Math.random()*Math.PI*2,rot:Math.random()*.2-.1,vx:Math.random()*2-1}));
  let fr=0;const an=()=>{ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.sp;p.x+=p.vx;p.ang+=p.rot;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(++fr<145)requestAnimationFrame(an);else cv.remove()};an();
}

// ════════════════════════════════════════════
// RENDER MCQ
// ════════════════════════════════════════════
function renderMCQSec(main,data,prefix,label,desc){
  const sh=document.createElement('div');sh.className='sec-hdr';
  sh.innerHTML=`<div class="sec-title">${label}</div><div class="sec-desc">${desc}</div>`;
  main.appendChild(sh);
  data.forEach((q,qi)=>{
    const gid=prefix+'_'+qi;
    const sOpts=shuffle(q.opts.map(o=>({...o})));optsMaps[gid]=sOpts;
    const card=document.createElement('div');card.className='qcard';
    card.innerHTML=`<span class="qbadge">📝 Câu ${q.id}</span>
    <div class="qtext">${q.q}</div>
    <div class="opts-grid">${sOpts.map((o,oi)=>`<button class="opt-btn" id="ob_${gid}_${oi}" onclick="pickMCQ('${gid}',${oi})">${o.h}</button>`).join('')}</div>
    <div class="expl-block" id="ex_${gid}"><div class="expl-hdr">🍂 GIẢI THÍCH CHI TIẾT</div><div class="expl-body">${q.expl}</div></div>`;
    main.appendChild(card);
  });
}
function pickMCQ(gid,oi){
  if(mcqAns[gid]!==undefined)return;
  const ok=optsMaps[gid][oi].c;mcqAns[gid]=ok;
  document.querySelectorAll(`[id^="ob_${gid}_"]`).forEach((b,i)=>{b.disabled=true;if(optsMaps[gid][i].c)b.classList.add('correct')});
  const btn=document.getElementById('ob_'+gid+'_'+oi);
  if(ok){doConfetti();playOK();}else{btn.classList.add('wrong','shake');setTimeout(()=>btn.classList.remove('shake'),460);playBad();}
  document.getElementById('ex_'+gid).classList.add('show');
  updatePbar();
}

// ════════════════════════════════════════════
// RENDER FILL-IN (multi-blank support)
// ════════════════════════════════════════════
function renderFillSec(main,data,prefix,label,desc){
  const sh=document.createElement('div');sh.className='sec-hdr';
  sh.innerHTML=`<div class="sec-title">${label}</div><div class="sec-desc">${desc}</div>`;
  main.appendChild(sh);
  data.forEach((q,qi)=>{
    const gid=prefix+'_'+qi;
    const card=document.createElement('div');card.className='tc';
    // Build sentence
    let sentHTML='';let bIdx=0;
    const parts=Array.isArray(q.parts[0])?null:q.parts;
    if(parts){
      parts.forEach(p=>{
        if(typeof p==='string'){sentHTML+=`<span>${p}</span>`;
        }else if(Array.isArray(p)){
          p.forEach(bl=>{
            if(bl.b!==undefined){
              const wd=Math.max(100,bl.ok[0].length*9+24);
              sentHTML+=`<input class="tinp" id="${gid}_b${bIdx}" style="width:${wd}px" placeholder="${bl.h}" data-ok='${JSON.stringify(bl.ok)}'>`;
              bIdx++;
            }
          });
        }
      });
    }
    card.innerHTML=`<span class="qbadge">✏️ Câu ${q.id}</span>
    <div class="qsent">${sentHTML}</div>
    <button class="ckbtn" id="cb_${gid}" onclick="checkFill('${gid}',${qi},'${prefix}')">🍁 Kiểm tra</button>
    <div class="expl-block" id="ex_${gid}"><div class="expl-hdr">🍂 GIẢI THÍCH CHI TIẾT</div><div class="expl-body">${q.expl}</div></div>`;
    main.appendChild(card);
  });
}
function checkFill(gid,qi,prefix){
  const dataset=prefix==='s4'?SEC4:SEC5;
  const q=dataset[qi];let allOk=true;let bi=0;let anyInput=false;
  // Find all blank inputs for this question
  let inp;
  while((inp=document.getElementById(gid+'_b'+bi))!==null){
    anyInput=true;
    const ok=isOk(inp.value,JSON.parse(inp.dataset.ok));
    inp.classList.remove('ok','bad');inp.classList.add(ok?'ok':'bad');inp.disabled=true;
    if(!ok)allOk=false;bi++;
  }
  if(!anyInput)return;
  document.getElementById('cb_'+gid).disabled=true;
  if(allOk){doConfetti();playOK();}else{playBad();}
  document.getElementById('ex_'+gid).classList.add('show');
  typeAns[gid]=allOk;updatePbar();
}

// SUBMIT
// ════════════════════════════════════════════
function openName(){document.getElementById('nameModal').classList.add('show');setTimeout(()=>document.getElementById('nameIn').focus(),100)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('nameModal').classList.contains('show'))doSubmit()});
function doSubmit(){
  const nm=document.getElementById('nameIn').value.trim();
  if(!nm){const i=document.getElementById('nameIn');i.classList.add('err');document.getElementById('nameErr').style.display='block';setTimeout(()=>i.classList.remove('err'),460);return;}
  document.getElementById('nameModal').classList.remove('show');showResult(nm);
}
function showResult(nm){
  const sc=Object.values(mcqAns).filter(Boolean).length+Object.values(typeAns).filter(Boolean).length;
  const pct=sc/TOTAL;const s10=((pct)*10).toFixed(1);
  let greet,msg,gif;
  if(pct===1){greet=`🍂 ${nm} — HOÀN HẢO TUYỆT VỜI!`;msg='Tất cả 40 câu đều đúng! Bạn thực sự xuất sắc. Tiếp tục học và ghi chép nhé! ✨';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=.8){greet=`🍁 ${nm} — XUẤT SẮC!`;msg='Kết quả rất đáng khen! Đọc lại giải thích các câu chưa đúng và ghi chép để lần sau hoàn hảo! 🌟';gif='https://media.giphy.com/media/3o7TKnCdBx5cwCqRao/giphy.gif';}
  else if(pct>=.6){greet=`⭐ ${nm} — KHÁ!`;msg='Đang tiến bộ! Đọc kỹ giải thích, ghi chép từ vựng và cấu trúc vào vở. Cố lên! 🍂';gif='https://media.giphy.com/media/xT9IgG50Lg7russbW8/giphy.gif';}
  else{greet=`📚 ${nm} — CỐ LÊN!`;msg='Hãy đọc THẬT KỸ từng bước giải thích, ghi chép đầy đủ rồi thử lại. Bạn sẽ làm được! 🍁';gif='https://media.giphy.com/media/26ufnwz3wDUli7GU0/giphy.gif';}
  document.getElementById('rg').innerHTML=greet;document.getElementById('rs').textContent=`${sc}/${TOTAL}`;
  document.getElementById('r10').innerHTML=`Điểm quy đổi: <strong>${s10}/10</strong>`;
  document.getElementById('rm').textContent=msg;document.getElementById('rgif').src=gif;
  document.getElementById('resModal').classList.add('show');
}
function replay(){
  document.getElementById('resModal').classList.remove('show');document.getElementById('nameIn').value='';document.getElementById('nameErr').style.display='none';
  mcqAns={};optsMaps={};typeAns={};renderAll();window.scrollTo({top:0,behavior:'smooth'});
}
function tryIntro(){const a=document.getElementById('introAudio');a.play().catch(()=>{const go=()=>{a.play().catch(()=>{});document.removeEventListener('click',go);document.removeEventListener('touchstart',go)};document.addEventListener('click',go,{once:true});document.addEventListener('touchstart',go,{once:true})});}

function renderAll(){
  const m=document.getElementById('mainDiv');m.innerHTML='';updatePbar();

  renderMCQSec(m,SEC2,'s2','II. Choose the word that has the main stress placed differently from the others.','Chọn từ có trọng âm chính đặt KHÁC với ba từ còn lại. Đếm âm tiết cẩn thận!');
  renderMCQSec(m,SEC3,'s3','III. Choose the best answer (a, b, c or d) to complete the sentence.','Chọn đáp án đúng nhất (a, b, c, hoặc d) để hoàn thành câu. Đọc kỹ từng từ!');
  renderFillSec(m,SEC4,'s4','IV. Write the correct form or tense of the verbs in brackets.','Viết dạng/thì đúng của động từ trong ngoặc. Chú ý signal words!');
  renderFillSec(m,SEC5,'s5','V. Write the correct form of the words in brackets.','Viết dạng đúng của từ trong ngoặc. Chú ý loại từ cần thiết trong ngữ cảnh!');
}
window.addEventListener('load',()=>{initCanvas();initFloats();initReminder();renderAll();setTimeout(tryIntro,700)});
