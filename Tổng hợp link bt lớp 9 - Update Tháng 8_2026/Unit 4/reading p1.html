<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tiếng Anh - Ms. Chí Nên</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

        :root {
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --correct-color: #4cd137;
            --incorrect-color: #e84118;
            --text-color: #2f3640;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            height: 100vh;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* SVG Floating Background */
        .svg-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }

        header {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        header .author {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a4a4a;
            background: rgba(255,255,255,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.8); border-radius: 10px; }

        .glass-box {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--glass-shadow);
        }

        /* Reading Side */
        .passage-title {
            font-size: 1.8rem;
            color: #d63031;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 900;
            text-shadow: 1px 1px 2px #fff;
        }

        .paragraph-container { margin-bottom: 20px; }
        .eng-text { font-size: 1.15rem; line-height: 1.6; font-weight: 600; color: #2d3436; }
        .vi-text { 
            display: none; 
            font-size: 1.05rem; 
            line-height: 1.5; 
            color: #0984e3; 
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
            border-left: 4px solid #0984e3;
        }
        
        .btn-translate {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-translate:hover { transform: scale(1.05); }

        /* Glossary */
        .glossary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(255,255,255,0.6);
            border-radius: 10px;
            overflow: hidden;
        }
        .glossary-table th, .glossary-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .glossary-table th { background: rgba(255,255,255,0.8); color: #6c5ce7; font-weight: 800; }

        /* Questions Side */
        .question-card {
            background: rgba(255,255,255,0.5);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .q-number { font-size: 1.2rem; font-weight: 800; color: #6c5ce7; margin-bottom: 10px; }
        .q-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #a29bfe;
            border-radius: 12px;
            padding: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #2d3436;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-option:hover { background: #e0e7ff; transform: translateY(-2px); }
        .btn-option.correct { background: var(--correct-color); color: white; border-color: #44bd32; }
        .btn-option.incorrect { background: var(--incorrect-color); color: white; border-color: #c23616; }
        .btn-option:disabled { cursor: not-allowed; opacity: 0.8; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }

        /* Explanation Box */
        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.7);
            border-radius: 12px;
            border-left: 5px solid #fdcb6e;
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Tags for Explanation (Strict Requirement) */
        .p-word { color: #d63031; font-weight: bold; background: #ff767533; padding: 2px 6px; border-radius: 4px; }
        .p-phonetic { color: #6c5ce7; font-style: italic; }
        .p-mean { color: #0984e3; font-weight: bold; }
        .p-grammar { color: #e17055; font-weight: bold; text-decoration: underline; }
        .hl-green { color: #009432; font-weight: bold; background: #badc5855; padding: 2px 6px; border-radius: 4px; }
        .hl-red { color: #c23616; font-weight: bold; background: #ff797955; padding: 2px 6px; border-radius: 4px; }

        /* Submit Button */
        .btn-submit {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            font-size: 1.3rem;
            font-weight: 900;
            padding: 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.3);
            transition: all 0.3s;
            margin-top: 30px;
        }
        .btn-submit:hover { transform: scale(1.02); box-shadow: 0 12px 20px rgba(108, 92, 231, 0.5); }

        /* Popup */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            display: none; justify-content: center; align-items: center; z-index: 100;
            backdrop-filter: blur(5px);
        }
        .popup-content {
            background: white; border-radius: 20px; padding: 30px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .popup-content h2 { color: #6c5ce7; margin-bottom: 15px; }
        .popup-content input {
            width: 100%; padding: 12px; border: 2px solid #a29bfe; border-radius: 10px;
            font-size: 1.1rem; margin-bottom: 20px; outline: none;
        }
        .popup-content button {
            background: #00b894; color: white; padding: 10px 20px; border: none;
            border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }
        .result-gif { width: 100%; max-width: 250px; border-radius: 15px; margin: 15px 0; }
        
        .score-display { font-size: 2rem; font-weight: 900; color: #d63031; }
        .score-10 { font-size: 1.3rem; font-weight: bold; color: #0984e3; margin-bottom: 10px; }

        /* Confetti Canvas */
        #confetti { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>

    <!-- Floating Background -->
    <svg class="svg-bg" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                <stop offset="0%" style="stop-color:rgba(255,255,255,0.4);stop-opacity:1" />
                <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
            </radialGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#grad)" />
        <text x="10%" y="20%" font-size="60" opacity="0.3" transform="rotate(-15)">🏫</text>
        <text x="80%" y="30%" font-size="80" opacity="0.3" transform="rotate(20)">🗼</text>
        <text x="50%" y="80%" font-size="70" opacity="0.3" transform="rotate(-10)">⏳</text>
        <text x="20%" y="85%" font-size="60" opacity="0.3" transform="rotate(15)">🌾</text>
        <text x="85%" y="75%" font-size="65" opacity="0.3" transform="rotate(25)">📚</text>
    </svg>

    <canvas id="confetti"></canvas>

    <header>
        <h1>🌟 Super English Challenge 🌟</h1>
        <div class="author">Giáo viên tạo: Ms. Chí Nên</div>
    </header>

    <div class="container">
        <!-- Panel Trái: Bài Đọc -->
        <div class="pane" id="reading-pane"></div>

        <!-- Panel Phải: Câu Hỏi -->
        <div class="pane" id="question-pane">
            <div id="questions-container"></div>
            <button class="btn-submit" onclick="showSubmitPopup()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>
        </div>
    </div>

    <!-- Popup Nhập Tên -->
    <div class="popup-overlay" id="name-popup">
        <div class="popup-content">
            <h2>🎉 Nhập tên của con nhé!</h2>
            <input type="text" id="student-name" placeholder="Ví dụ: Lisa đáng yêu...">
            <button onclick="processSubmission()">Nộp bài ngay!</button>
        </div>
    </div>

    <!-- Popup Kết Quả -->
    <div class="popup-overlay" id="result-popup">
        <div class="popup-content">
            <h2 id="r-name">Tên học sinh</h2>
            <div class="score-display" id="r-score">0/20</div>
            <div class="score-10" id="r-score-10">Điểm quy đổi: 0/10 điểm</div>
            <img class="result-gif" id="r-gif" src="" alt="Meme">
            <h3 id="r-comment" style="color:#2d3436; margin-top: 10px;">Lời phê</h3>
            <button onclick="closeResult()" style="margin-top:20px; background:#e17055;">Xem lại giải thích</button>
        </div>
    </div>

<script>
// ==========================================
// DỮ LIỆU BÀI HỌC VÀ CÂU HỎI (HOÀN CHỈNH 100%)
// ==========================================
const database = [
    {
        title: "Passage 1: Notice: School Closure",
        emoji: "🏫",
        paragraphs: [
            {
                en: "Dear Parents,",
                vi: "Kính gửi quý phụ huynh,"
            },
            {
                en: "We are writing to inform you that (1) ___ our school will be temporarily closed due to a recent increase in COVID-19 cases. We understand that this is sudden, but the health and safety of our students and staff is our top (2) ___.",
                vi: "Chúng tôi viết thư này để thông báo với quý vị rằng trường học của chúng ta sẽ tạm thời đóng cửa do sự gia tăng gần đây của các ca mắc COVID-19. Chúng tôi hiểu rằng điều này là đột ngột, nhưng sức khỏe và sự an toàn của học sinh cũng như nhân viên là ưu tiên hàng đầu của chúng tôi."
            },
            {

                vi: "Các lớp học trực tuyến sẽ bắt đầu vào ngày 24 tháng 5 năm 2025. Vui lòng đảm bảo rằng con em quý vị đã sẵn sàng cho việc học trực tuyến."
            },
            {
                en: "We will continue to monitor the situation and will provide updates on when we can safely reopen the school. In the meantime, please encourage your child to follow health guidelines such as washing hands frequently and wearing a mask.",
                vi: "Chúng tôi sẽ tiếp tục theo dõi tình hình và sẽ cung cấp thông tin cập nhật về thời điểm chúng ta có thể mở cửa lại trường học một cách an toàn. Trong thời gian chờ đợi, xin vui lòng khuyến khích con em quý vị tuân thủ các hướng dẫn về sức khỏe như rửa tay thường xuyên và đeo khẩu trang."
            },
            {
                en: "Thank you for your understanding and (4) ___ during this challenging time.<br>Sincerely,<br>School Administration",
                vi: "Cảm ơn sự thấu hiểu và hợp tác của quý vị trong khoảng thời gian đầy thử thách này.<br>Trân trọng,<br>Ban giám hiệu nhà trường"
            }
        ],
        glossary: [
            { word: "inform", type: "v", mean: "thông báo" },
            { word: "temporarily", type: "adv", mean: "một cách tạm thời" },
            { word: "sudden", type: "adj", mean: "đột ngột, bất ngờ" },
            { word: "priority", type: "n", mean: "sự ưu tiên" },
            { word: "monitor", type: "v", mean: "theo dõi, giám sát" },
            { word: "situation", type: "n", mean: "tình huống, tình hình" },
            { word: "guideline", type: "n", mean: "hướng dẫn, nguyên tắc chỉ đạo" },
            { word: "frequently", type: "adv", mean: "một cách thường xuyên" },
            { word: "administration", type: "n", mean: "ban quản trị, ban giám hiệu" },
            { word: "challenging", type: "adj", mean: "đầy thử thách, khó khăn" }
        ],
        questions: [
            {
                id: 1, text: "Câu 1: Select the best answer",
                options: [
                    { text: "a", correct: false, vi: "mạo từ không xác định (danh từ số ít bắt đầu bằng phụ âm)" },
                    { text: "the", correct: false, vi: "mạo từ xác định" },
                    { text: "an", correct: false, vi: "mạo từ không xác định (danh từ số ít bắt đầu bằng nguyên âm)" },
                    { text: "no article", correct: true, vi: "không dùng mạo từ" }
                ],
                explanation: `
                <b>Đề bài:</b> Select the best answer<br>
                <b>Dịch đề bài:</b> Chọn đáp án đúng nhất.<br>
                <b>Các đáp án:</b><br>
                * a ➔ Dịch: <span class='p-mean'>mạo từ không xác định</span><br>
                * the ➔ Dịch: <span class='p-mean'>mạo từ xác định</span><br>
                * an ➔ Dịch: <span class='p-mean'>mạo từ không xác định</span><br>
                * no article ➔ Dịch: <span class='p-mean'>không dùng mạo từ</span><br>
                <b>Giải thích chi tiết:</b><br>
                * <span class='hl-green'>Tại sao đúng:</span> Đáp án đúng là <b>no article</b>. Chú ý <span class='p-grammar'>Ngữ pháp cơ bản</span>: Trước danh từ <span class='p-word'>school</span> (trường học) đã có sẵn tính từ sở hữu <span class='p-word'>our</span> (của chúng ta). Do đó, ta KHÔNG sử dụng thêm bất kỳ mạo từ nào nữa.<br>
                * <span class='hl-red'>Tại sao sai:</span> Các mạo từ <span class='p-word'>a/an/the</span> không bao giờ được đứng liền kề với tính từ sở hữu trong cụm danh từ tiếng Anh.`
            },
            {
                id: 2, text: "Câu 2: Select the best answer",
                options: [
                    { text: "anniversary", correct: false, vi: "n: lễ kỷ niệm" },
                    { text: "priority", correct: true, vi: "n: sự ưu tiên" },
                    { text: "castle", correct: false, vi: "n: lâu đài" },
                    { text: "ingredient", correct: false, vi: "n: thành phần, nguyên liệu" }
                ],
                explanation: `
                <b>Đề bài:</b> Select the best answer<br>
                <b>Dịch đề bài:</b> Chọn đáp án đúng nhất.<br>
                <b>Các đáp án:</b><br>
                * anniversary ➔ Dịch: <span class='p-mean'>n: lễ kỷ niệm</span><br>
                * priority ➔ Dịch: <span class='p-mean'>n: sự ưu tiên</span><br>

                <b>Giải thích chi tiết:</b><br>
                * <span class='hl-green'>Tại sao đúng:</span> Đáp án đúng là <b>priority</b>. Ta có cụm collocation (cụm từ cố định) <span class='p-grammar'>top priority</span> mang nghĩa là "ưu tiên hàng đầu". Ngữ cảnh câu là: "Sức khỏe và sự an toàn của học sinh là ưu tiên hàng đầu của chúng tôi".<br>

            {
                id: 3, text: "Câu 3: Select the best answer",

                    { text: "make", correct: true, vi: "v: làm, tạo ra" },
                    { text: "take", correct: false, vi: "v: lấy, cầm, nắm" },
                    { text: "look", correct: false, vi: "v: nhìn" },
                    { text: "catch", correct: false, vi: "v: bắt lấy" }
                ],
                explanation: `
                <b>Đề bài:</b> Select the best answer<br>
                <b>Dịch đề bài:</b> Chọn đáp án đúng nhất.<br>
                <b>Các đáp án:</b><br>
                * make ➔ Dịch: <span class='p-mean'>v: làm, tạo ra</span><br>
                * take ➔ Dịch: <span class='p-mean'>v: lấy, cầm, nắm</span><br>
                * look ➔ Dịch: <span class='p-mean'>v: nhìn</span><br>
                * catch ➔ Dịch: <span class='p-mean'>v: bắt lấy</span><br>
                <b>Giải thích chi tiết:</b><br>
                * <span class='hl-green'>Tại sao đúng:</span> Đáp án đúng là <b>make</b>. Đây là dạng Collocation. Ta bắt buộc phải dùng cụm <span class='p-grammar'>make sure (that) + mệnh đề</span> với nghĩa là "đảm bảo rằng, chắc chắn rằng".<br>
                * <span class='hl-red'>Tại sao sai:</span> Các động từ <span class='p-word'>take</span>, <span class='p-word'>look</span>, <span class='p-word'>catch</span> không thể đi kèm với tính từ "sure" để tạo thành cụm từ có nghĩa.`
            },
            {
                id: 4, text: "Câu 4: Select the best answer",
                options: [
                    { text: "cooperative", correct: false, vi: "adj: có tính hợp tác" },
                    { text: "cooperatively", correct: false, vi: "adv: một cách hợp tác" },
                    { text: "cooperation", correct: true, vi: "n: sự hợp tác" },
                    { text: "cooperate", correct: false, vi: "v: hợp tác" }
                ],
                explanation: `
                <b>Đề bài:</b> Select the best answer<br>
                <b>Dịch đề bài:</b> Chọn đáp án đúng nhất.<br>
                <b>Các đáp án:</b><br>
                * cooperative ➔ Dịch: <span class='p-mean'>adj: có tính hợp tác</span><br>
                * cooperatively ➔ Dịch: <span class='p-mean'>adv: một cách hợp tác</span><br>

                * cooperate ➔ Dịch: <span class='p-mean'>v: hợp tác</span><br>

                * on ➔ Dịch: <span class='p-mean'>prep: trên</span><br>
                <b>Giải thích chi tiết:</b><br>
                * <span class='hl-green'>Tại sao đúng:</span> Đáp án đúng là <b>to</b>. Đây là cụm động từ cố định: <span class='p-grammar'>lead to + Noun</span> có nghĩa là "dẫn đến (kết quả gì)". Câu này dịch là: "nó dẫn đến nhiều vấn đề sức khỏe".<br>
                * <span class='hl-red'>Tại sao sai:</span> Động từ "lead" (dẫn dắt) khi đi kèm giới từ để chỉ kết quả bắt buộc dùng "to", các giới từ <span class='p-word'>for, of, on</span> không được ghép với từ này.`
            }
        ]
    }
];

// ==========================================
// ENGINE GAMIFICATION & LOGIC
// ==========================================

let studentScore = 0;
let answeredQuestions = 0;
const totalQuestions = 20;

// Audio Context (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playTone(freq, type, duration, vol) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playDing() {
    playTone(600, 'sine', 0.1, 0.5);
    setTimeout(() => playTone(800, 'sine', 0.3, 0.5), 100);
}

function playTing() {
    playTone(300, 'sawtooth', 0.1, 0.3);
    setTimeout(() => playTone(200, 'sawtooth', 0.3, 0.3), 100);
}

// Hàm Trộn (Shuffle) Mảng
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// Hàm Xử lý Hiệu ứng Pháo hoa (Confetti)
function fireConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    let particles = [];
    for(let i=0; i<100; i++) {
        particles.push({
            x: canvas.width / 2, y: canvas.height / 2,
            r: Math.random() * 6 + 2,
            dx: Math.random() * 10 - 5, dy: Math.random() * -10 - 5,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`
        });
    }

    function animate() {
        ctx.clearRect(0,0, canvas.width, canvas.height);
        particles.forEach((p, index) => {
            p.x += p.dx; p.y += p.dy; p.dy += 0.2; // Gravity
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.fill();
            if(p.y > canvas.height) particles.splice(index, 1);
        });
        if(particles.length > 0) requestAnimationFrame(animate);
        else ctx.clearRect(0,0, canvas.width, canvas.height);
    }
    animate();
}

// Render Giao Diện
function renderApp() {
    const rPane = document.getElementById('reading-pane');
    const qPane = document.getElementById('questions-container');

    database.forEach((passage, pIndex) => {
        // --- RENDER BÀI ĐỌC ---
        let passageHtml = `<div class="glass-box"><h2 class="passage-title">${passage.emoji} ${passage.title}</h2>`;
        
        passage.paragraphs.forEach((para, index) => {
            passageHtml += `
            <div class="paragraph-container">
                <div class="eng-text">${para.en}</div>
                <div class="vi-text" id="vi-${pIndex}-${index}">${para.vi}</div>
                <button class="btn-translate" onclick="toggleTranslate('${pIndex}-${index}')">Mở dịch đoạn này 🌟</button>
            </div>`;
        });

        // Glossary
        passageHtml += `<h3 style="color:#6c5ce7; margin-top:20px;">📚 Bảng Từ Vựng (Glossary)</h3>
        <table class="glossary-table"><tr><th>Từ Vựng</th><th>Loại Từ</th><th>Nghĩa Tiếng Việt</th></tr>`;
        passage.glossary.forEach(g => {
            passageHtml += `<tr><td><strong>${g.word}</strong></td><td><i>${g.type}</i></td><td>${g.mean}</td></tr>`;
        });
        passageHtml += `</table></div>`;
        rPane.innerHTML += passageHtml;

        // --- RENDER CÂU HỎI ---
        passage.questions.forEach(q => {
            let qHtml = `<div class="question-card" id="qcard-${q.id}">
                <div class="q-number">${q.text}</div>
                <div class="options-grid" id="opts-${q.id}">`;
            
            // Shuffle Đáp án BẮT BUỘC trước khi hiển thị
            let shuffledOptions = shuffleArray([...q.options]);
            
            shuffledOptions.forEach((opt, oIndex) => {
                qHtml += `<button class="btn-option" onclick="checkAnswer(${q.id}, ${opt.correct}, this, '${q.id}')">${opt.text}</button>`;
            });

            qHtml += `</div>
                <div class="explanation-box" id="exp-${q.id}">${q.explanation}</div>
            </div>`;
            qPane.innerHTML += qHtml;
        });
    });
}

function toggleTranslate(id) {
    const el = document.getElementById(`vi-${id}`);
    if (el.style.display === 'block') {
        el.style.display = 'none';
        event.target.innerText = 'Mở dịch đoạn này 🌟';
    } else {
        el.style.display = 'block';
        event.target.innerText = 'Ẩn dịch ❌';
    }
}

function checkAnswer(qId, isCorrect, btnEl, cardId) {
    const card = document.getElementById(`qcard-${cardId}`);
    const btns = document.getElementById(`opts-${qId}`).querySelectorAll('.btn-option');
    const exp = document.getElementById(`exp-${qId}`);

    // Disable tất cả nút trong câu này
    btns.forEach(b => b.disabled = true);
    answeredQuestions++;

    if (isCorrect) {
        btnEl.classList.add('correct');
        studentScore++;
        playDing();
        fireConfetti();
        card.style.borderColor = "var(--correct-color)";
    } else {
        btnEl.classList.add('incorrect');
        btnEl.classList.add('shake');
        playTing();
        card.style.borderColor = "var(--incorrect-color)";
        
        // Auto highlight correct answer
        const originalData = database.flatMap(p => p.questions).find(q => q.id === qId);
        const correctText = originalData.options.find(o => o.correct).text;
        btns.forEach(b => {
            if(b.innerText === correctText) b.classList.add('correct');
        });
    }

    // Hiển thị giải thích chi tiết
    exp.style.display = 'block';
}

// Xử lý nộp bài
function showSubmitPopup() {
    if (answeredQuestions < totalQuestions) {
        alert("Con hãy làm hết 100% các câu hỏi (20 câu) rồi mới nộp bài nhé! Cố lên!");
        return;
    }
    document.getElementById('name-popup').style.display = 'flex';
}

function processSubmission() {
    const name = document.getElementById('student-name').value.trim();
    if (!name) {
        alert("Nhập tên vào thì cô mới biết ai mà chấm điểm chứ!");
        return;
    }

    document.getElementById('name-popup').style.display = 'none';
    
    // Tính toán kết quả
    const percentage = (studentScore / totalQuestions) * 100;
    const score10 = (studentScore / totalQuestions) * 10;
    
    document.getElementById('r-name').innerText = `Học sinh: ${name}`;
    document.getElementById('r-score').innerText = `Điểm: ${studentScore}/${totalQuestions}`;
    document.getElementById('r-score-10').innerText = `Quy đổi: ${score10.toFixed(1)}/10 điểm`;

    const gif = document.getElementById('r-gif');
    const comment = document.getElementById('r-comment');

    if (percentage === 100) {
        gif.src = "https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"; // Thiên tài meme
        comment.innerText = "Ms. Chí Nên: XUẤT SẮC! Con đúng là thiên tài tiếng Anh! 🏆💖";
    } else if (percentage >= 60) {
        gif.src = "https://media.giphy.com/media/l41YmQjOz9qg2Ecow/giphy.gif"; // High five meme
        comment.innerText = "Ms. Chí Nên: Rất tốt! Cố gắng chút nữa là đạt đỉnh nha! 🌟👍";
    } else {
        gif.src = "https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif"; // Khóc meme
        comment.innerText = "Ms. Chí Nên: Úi chà, sai hơi nhiều rồi. Nhớ đọc kỹ phần giải thích bên dưới nhé, cố lên con! 💪🥺";
    }

    document.getElementById('result-popup').style.display = 'flex';
}

function closeResult() {
    document.getElementById('result-popup').style.display = 'none';
}

// Khởi chạy app
window.onload = renderApp;

</script>
