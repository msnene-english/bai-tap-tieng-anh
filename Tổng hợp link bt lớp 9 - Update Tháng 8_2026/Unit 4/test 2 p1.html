<script>
(function(){const items=['🌌','🪐','🌠','✨','🌟','💫','🌙','🔭','⭐','🛸','☄️','🌑','✨','🪐','⭐','🌟'];
  const layer=document.getElementById('foodlayer');

    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(1.1+Math.random()*2.2)+'rem';
    s.style.animationDelay=(Math.random()*3.5)+'s';s.style.animationDuration=(2.5+Math.random()*3)+'s';layer.appendChild(s);}})();

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#a855f7','#ec4899','#22d3ee','#fde047','#7c3aed','#f9a8d4','#00D26A'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Ms. Chí Nên · ULIS giải thích chi tiết";
const TOTAL=39;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",

 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "o" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>occupied</span> <span class='p-phonetic'>/ˈɒkjupaɪd/</span> = <span class='p-mean'>bị chiếm giữ</span> → âm <b>/ɒ/</b></div>
     <div><span class='p-word'><u>o</u>bserve</span> <span class='p-phonetic'>/əbˈzɜːv/</span> = <span class='p-mean'>quan sát</span> → âm <b>/ə/</b></div>
     <div><span class='p-word'>pr<u>o</u>mote</span> <span class='p-phonetic'>/prəˈməʊt/</span> = <span class='p-mean'>thúc đẩy</span> → âm <b>/ə/</b></div>
     <div><span class='p-word'>devel<u>o</u>p</span> <span class='p-phonetic'>/dɪˈveləp/</span> = <span class='p-mean'>phát triển</span> → âm <b>/ə/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"occupied" có "o" (được nhấn) đọc là /ɒ/, khác với ba từ kia có "o" (không nhấn) đọc là /ə/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>observe, promote, develop đều có "o" đọc /ə/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",

 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>va<u>l</u>ue</span> <span class='p-phonetic'>/ˈvæljuː/</span> = <span class='p-mean'>giá trị</span> → âm <b>/l/</b></div>
     <div><span class='p-word'>festiva<u>l</u></span> <span class='p-phonetic'>/ˈfestɪvl/</span> = <span class='p-mean'>lễ hội</span> → âm <b>/l/</b></div>
     <div><span class='hl-green'>folk</span> <span class='p-phonetic'>/fəʊk/</span> = <span class='p-mean'>dân gian</span> → <b>l câm</b></div>
     <div><span class='p-word'>cast<u>l</u>e</span> <span class='p-phonetic'>/ˈkɑːsl/</span> = <span class='p-mean'>lâu đài</span> → âm <b>/l/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"folk" có "l" CÂM (đọc là /fəʊk/), khác với ba từ kia đọc rõ âm /l/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>value, festival, castle đều đọc rõ âm /l/ (castle câm "t" chứ không câm "l").</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:3,type:"mcq",

   <div class="grid2">
     <div><span class='p-word'>compl<u>e</u>x</span> <span class='p-phonetic'>/ˈkɒmpleks/</span> = <span class='p-mean'>quần thể</span> → âm <b>/e/</b></div>
     <div><span class='p-word'>h<u>e</u>ritage</span> <span class='p-phonetic'>/ˈherɪtɪdʒ/</span> = <span class='p-mean'>di sản</span> → âm <b>/e/</b></div>
     <div><span class='p-word'>r<u>e</u>lic</span> <span class='p-phonetic'>/ˈrelɪk/</span> = <span class='p-mean'>di vật</span> → âm <b>/e/</b></div>
     <div><span class='hl-green'>religious</span> <span class='p-phonetic'>/rɪˈlɪdʒəs/</span> = <span class='p-mean'>thuộc tôn giáo</span> → âm <b>/ɪ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"religious" có "e" đọc là /ɪ/, khác với ba từ kia có "e" đọc là /e/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>complex, heritage, relic đều có âm /e/.</span></li></ol>`},

     <div><span class='hl-green'>preservation</span> <span class='p-phonetic'>/ˌprezəˈveɪʃn/</span> = <span class='p-mean'>sự bảo tồn</span> → trọng âm <b>3</b></div>
     <div><span class='p-word'>religion</span> <span class='p-phonetic'>/rɪˈlɪdʒən/</span> = <span class='p-mean'>tôn giáo</span> → trọng âm <b>2</b></div>

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:6,type:"mcq",

 options:[{t:"of",c:true},{t:"to",c:false},{t:"for",c:false},{t:"in",c:false}],
 exp:`<div class="vnt">💬 Dịch: Người Việt rất tự hào về di sản văn hóa phong phú của mình, trong đó có áo dài.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>of</span> <span class='wt'>prep</span> = <span class='p-mean'>(proud OF)</span></div>
     <div><span class='p-word'>to</span> <span class='wt'>prep</span> = <span class='p-mean'>đến</span></div>
     <div><span class='p-word'>for</span> <span class='wt'>prep</span> = <span class='p-mean'>cho</span></div>
     <div><span class='p-word'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>trong</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "be proud OF st" (tự hào về điều gì) → proud of their heritage.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"proud" không đi với to/for/in theo nghĩa này.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:7,type:"mcq",
 q:"This ____ was built to honour the heroes who fought for the nation's independence.",
 options:[{t:"church",c:false},{t:"monument",c:true},{t:"castle",c:false},{t:"complex",c:false}],
 exp:`<div class="vnt">💬 Dịch: Đài tưởng niệm này được xây dựng để tôn vinh những người anh hùng đã chiến đấu cho nền độc lập của dân tộc.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>church</span> <span class='wt'>n</span> = <span class='p-mean'>nhà thờ</span></div>
     <div><span class='hl-green'>monument</span> <span class='wt'>n</span> = <span class='p-mean'>đài tưởng niệm</span></div>
     <div><span class='p-word'>castle</span> <span class='wt'>n</span> = <span class='p-mean'>lâu đài</span></div>
     <div><span class='p-word'>complex</span> <span class='wt'>n</span> = <span class='p-mean'>quần thể</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Công trình "built to honour the heroes" (xây để tôn vinh anh hùng) chính là "monument" (đài tưởng niệm).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>church (nhà thờ), castle (lâu đài), complex (quần thể) không dùng để "tưởng niệm anh hùng".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:8,type:"mcq",
 q:"Jenny hates the cold weather in Norway. She wishes it ____ warm all year round.",
 options:[{t:"was",c:true},{t:"is",c:false},{t:"would be",c:false},{t:"will be",c:false}],
 exp:`<div class="vnt">💬 Dịch: Jenny ghét thời tiết lạnh ở Na Uy. Cô ấy ước gì nơi đó ấm áp quanh năm.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>was</span> = <span class='p-mean'>(wish + quá khứ)</span></div>
     <div><span class='p-word'>is</span> = <span class='p-mean'>(hiện tại — sai)</span></div>
     <div><span class='p-word'>would be</span> = <span class='p-mean'>(sai ngữ cảnh)</span></div>
     <div><span class='p-word'>will be</span> = <span class='p-mean'>(tương lai — sai)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"wish + S + V(quá khứ)" diễn tả điều ước trái với hiện tại → "wishes it was warm" (ước nó ấm áp — nhưng thực tế đang lạnh).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Sau "wish" (ước ở hiện tại) không dùng "is/will be"; "would be" không hợp khi ước về trạng thái thời tiết cố định.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:9,type:"mcq",
 q:"In ancient times, people ____ various gods to seek protection, health, and prosperity.",

   <div class="grid2">
     <div><span class='p-word'>contributed</span> <span class='wt'>v</span> = <span class='p-mean'>đóng góp</span></div>
     <div><span class='p-word'>recognised</span> <span class='wt'>v</span> = <span class='p-mean'>công nhận</span></div>
     <div><span class='p-word'>promoted</span> <span class='wt'>v</span> = <span class='p-mean'>thúc đẩy</span></div>
     <div><span class='hl-green'>worshipped</span> <span class='wt'>v</span> = <span class='p-mean'>thờ phụng</span></div>

   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>contribute, recognise, promote không mang nghĩa "thờ phụng" thần thánh.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:10,type:"mcq",
 q:"The scientists were amazed by the ____ dinosaur skeleton found deep in the desert.",
 options:[{t:"deep-rooted",c:false},{t:"well-preserved",c:true},{t:"barefoot",c:false},{t:"occupied",c:false}],
 exp:`<div class="vnt">💬 Dịch: Các nhà khoa học kinh ngạc trước bộ xương khủng long được bảo quản tốt tìm thấy sâu trong sa mạc.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">

     <div><span class='hl-green'>well-preserved</span> <span class='wt'>adj</span> = <span class='p-mean'>được bảo quản tốt</span></div>
     <div><span class='p-word'>barefoot</span> <span class='wt'>adj</span> = <span class='p-mean'>chân trần</span></div>
     <div><span class='p-word'>occupied</span> <span class='wt'>adj</span> = <span class='p-mean'>bị chiếm giữ</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Bộ xương khủng long còn nguyên vẹn → "well-preserved" (được bảo quản/gìn giữ tốt).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>deep-rooted, barefoot, occupied không mô tả trạng thái nguyên vẹn của một hiện vật.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:11,type:"mcq",
 q:"At the festival, many people ____ happily while others ____ traditional dishes.",
 options:[{t:"were dancing – ate",c:false},{t:"danced – were eating",c:false},{t:"were dancing – were eating",c:true},{t:"danced – ate",c:false}],
 exp:`<div class="vnt">💬 Dịch: Tại lễ hội, nhiều người đang nhảy múa vui vẻ trong khi những người khác đang thưởng thức các món ăn truyền thống.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>were dancing – ate</span> = <span class='p-mean'>(lệch thì)</span></div>
     <div><span class='p-word'>danced – were eating</span> = <span class='p-mean'>(lệch thì)</span></div>
     <div><span class='hl-green'>were dancing – were eating</span> = <span class='p-mean'>(hai hành động song song)</span></div>
     <div><span class='p-word'>danced – ate</span> = <span class='p-mean'>(quá khứ đơn — sai)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hai hành động CÙNG diễn ra song song trong quá khứ (nối bằng "while") → cả hai đều Quá khứ tiếp diễn: were dancing – were eating.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Dùng quá khứ đơn cho hành động đang diễn ra kéo dài là không phù hợp; hai vế "while" song song phải cùng dạng tiếp diễn.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:12,type:"mcq",
 q:"The elders keep tradition ____ by teaching young people the art of weaving.",
 options:[{t:"lively",c:false},{t:"liveable",c:false},{t:"alive",c:true},{t:"living",c:false}],
 exp:`<div class="vnt">💬 Dịch: Những người lớn tuổi giữ cho truyền thống sống mãi bằng cách dạy người trẻ nghệ thuật dệt vải.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>lively</span> <span class='wt'>adj</span> = <span class='p-mean'>sôi nổi</span></div>
     <div><span class='p-word'>liveable</span> <span class='wt'>adj</span> = <span class='p-mean'>(đáng sống)</span></div>
     <div><span class='hl-green'>alive</span> <span class='wt'>adj</span> = <span class='p-mean'>sống, tồn tại</span></div>
     <div><span class='p-word'>living</span> <span class='wt'>adj</span> = <span class='p-mean'>(đang sống)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm "keep st alive" = giữ cho điều gì còn sống/tồn tại. "keep tradition alive" = giữ gìn truyền thống.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>lively (sôi nổi), liveable, living không dùng trong cụm "keep … alive".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:13,type:"mcq",
 q:"____ our tour guide, we got to taste authentic fish and chips at a restaurant in London.",
 options:[{t:"In spite of",c:false},{t:"Besides",c:false},{t:"For",c:false},{t:"Thanks to",c:true}],
 exp:`<div class="vnt">💬 Dịch: Nhờ có hướng dẫn viên, chúng tôi được thưởng thức món cá và khoai tây chiên chính hiệu tại một nhà hàng ở London.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>In spite of</span> = <span class='p-mean'>mặc dù</span></div>
     <div><span class='p-word'>Besides</span> = <span class='p-mean'>ngoài ra</span></div>
     <div><span class='p-word'>For</span> = <span class='p-mean'>cho, vì</span></div>
     <div><span class='hl-green'>Thanks to</span> = <span class='p-mean'>nhờ có</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Thanks to + danh từ" = nhờ có (điều gì mang lại kết quả TỐT). Nhờ hướng dẫn viên nên được ăn ngon.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>In spite of (nhượng bộ), Besides (bổ sung), For không diễn tả "nhờ có… nên có kết quả tốt".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:14,type:"mcq",
 q:"After spending years studying its structure, they finally ____ the secrets of the temple complex.",
 options:[{t:"passed down",c:false},{t:"looked around",c:false},{t:"found out",c:true},{t:"got along",c:false}],
 exp:`<div class="vnt">💬 Dịch: Sau nhiều năm nghiên cứu cấu trúc của nó, cuối cùng họ đã khám phá ra những bí mật của quần thể đền.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>passed down</span> <span class='wt'>phr.v</span> = <span class='p-mean'>truyền lại</span></div>
     <div><span class='p-word'>looked around</span> <span class='wt'>phr.v</span> = <span class='p-mean'>nhìn quanh</span></div>
     <div><span class='hl-green'>found out</span> <span class='wt'>phr.v</span> = <span class='p-mean'>khám phá ra</span></div>
     <div><span class='p-word'>got along</span> <span class='wt'>phr.v</span> = <span class='p-mean'>hòa hợp</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"find out the secrets" = khám phá/tìm ra những bí mật (sau khi nghiên cứu lâu).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>pass down (truyền lại), look around (nhìn quanh), get along (hòa hợp) không hợp nghĩa "tìm ra bí mật".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:15,type:"mcq",
 q:"Ken: \"____ What a lovely ancient town!\" — Giang: \"You're very welcome! I'm glad you enjoyed it.\"",
 options:[{t:"Could you tell me where Hoi An is?",c:false},{t:"Thank you so much for showing me around Hoi An.",c:true},{t:"Do you mind going with me around Hoi An?",c:false},{t:"Let's explore Hoi An on our summer vacation.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Ken: "Cảm ơn cậu rất nhiều vì đã dẫn tớ đi tham quan Hội An. Một phố cổ đáng yêu làm sao!" — Giang: "Không có gì! Tớ vui vì cậu thích nó."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>Could you tell me where Hoi An is?</span> = <span class='p-mean'>Cậu chỉ tớ Hội An ở đâu được không?</span></div>
     <div><span class='hl-green'>Thank you so much for showing me around Hoi An.</span> = <span class='p-mean'>Cảm ơn cậu đã dẫn tớ đi tham quan Hội An.</span></div>
     <div><span class='p-word'>Do you mind going with me around Hoi An?</span> = <span class='p-mean'>Cậu đi cùng tớ quanh Hội An nhé?</span></div>
     <div><span class='p-word'>Let's explore Hoi An on our summer vacation.</span> = <span class='p-mean'>Hè này mình đi khám phá Hội An nhé.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Giang đáp "You're very welcome!" (Không có gì!) → câu trước phải là lời CẢM ƠN: "Thank you so much for showing me around Hoi An."</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác là câu hỏi/lời rủ, không khớp với lời đáp "You're welcome".</span></li></ol>`},

/* IV. Sign/notice */
{sec:"A. LANGUAGE FOCUS",part:"IV. Đọc biển báo/thông báo và chọn câu đúng",n:16,type:"mcq",
 q:"🚫📸 Biển báo: hình chiếc máy ảnh có tia flash bị GẠCH CHÉO. — What does the sign say?",
 options:[{t:"Taking photos with flash is prohibited here.",c:true},{t:"Using the camera isn't allowed here.",c:false},{t:"Using flash is not prohibited in this area.",c:false},{t:"People must turn on the flash on their cameras.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Biển báo có hình máy ảnh với đèn flash bị gạch chéo → nghĩa là "Cấm chụp ảnh có dùng đèn flash tại đây."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>Taking photos with flash is prohibited here.</span> = <span class='p-mean'>Cấm chụp ảnh có dùng flash ở đây.</span></div>
     <div><span class='p-word'>Using the camera isn't allowed here.</span> = <span class='p-mean'>Không được dùng máy ảnh ở đây.</span></div>
     <div><span class='p-word'>Using flash is not prohibited in this area.</span> = <span class='p-mean'>Không cấm dùng flash ở khu này.</span></div>
     <div><span class='p-word'>People must turn on the flash...</span> = <span class='p-mean'>Mọi người phải bật flash.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hình "flash bị gạch chéo" = cấm dùng ĐÈN FLASH khi chụp (vẫn được chụp, chỉ không được bật flash) → đáp án A.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B cấm cả máy ảnh (sai); C và D nói ngược lại (không cấm/phải bật flash).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Đọc biển báo/thông báo và chọn câu đúng",n:17,type:"mcq",
 q:"⚠️🥜 Thông báo: \"FOOD ALLERGY — Our food may contain peanuts or tree nuts.\" — What does the notice say?",
 options:[{t:"All customers must avoid eating nut products here.",c:false},{t:"Some food here may contain nuts that cause allergic reactions.",c:true},{t:"This place makes sure their products are nut-free.",c:false},{t:"The main ingredients at this place are peanuts or tree nuts.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Thông báo cảnh báo dị ứng: "Thức ăn ở đây có thể chứa đậu phộng hoặc các loại hạt cây." → Một số món có thể chứa hạt gây dị ứng.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>All customers must avoid eating nut products.</span> = <span class='p-mean'>Mọi khách phải tránh ăn đồ có hạt.</span></div>
     <div><span class='hl-green'>Some food here may contain nuts that cause allergic reactions.</span> = <span class='p-mean'>Một số món có thể chứa hạt gây dị ứng.</span></div>
     <div><span class='p-word'>This place makes sure their products are nut-free.</span> = <span class='p-mean'>Nơi này đảm bảo không có hạt.</span></div>
     <div><span class='p-word'>The main ingredients are peanuts or tree nuts.</span> = <span class='p-mean'>Nguyên liệu chính là các loại hạt.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Thông báo chỉ CẢNH BÁO "may contain nuts" (có thể chứa hạt gây dị ứng) → đáp án B, đúng ý cảnh báo.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A ("phải tránh") quá mạnh; C nói "không có hạt" (ngược); D nói hạt là nguyên liệu chính (sai).</span></li></ol>`},

/* V. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"V. Tìm phần gạch chân SAI và sửa lại cho đúng",n:18,type:"error",
 q:"<u>Takingaway</u> tacos are <u>a</u> quick and delicious way <u>to enjoy</u> Mexican cuisine <u>without leaving</u> home.",
 options:["Takingaway","a","to enjoy","without leaving"],correctIdx:0,
 accept:["takeaway","take away"],key:"Takingaway → Takeaway",
 exp:`<div class="vnt">💬 Dịch: Tacos mua mang về là một cách nhanh gọn và ngon miệng để thưởng thức ẩm thực Mexico mà không cần ra khỏi nhà.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>Takingaway</span> → sửa thành <span class='hl-green'>Takeaway</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"takeaway" (đồ ăn mang về) là một danh từ/tính từ ghép cố định, KHÔNG chia thành "Takingaway". Viết đúng là "Takeaway tacos".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Tìm phần gạch chân SAI và sửa lại cho đúng",n:19,type:"error",
 q:"In keeping <u>up</u> tradition, the players <u>sing</u> the national anthem <u>before</u> every <u>match</u>.",
 options:["up","sing","before","match"],correctIdx:0,
 accept:["with"],key:"keeping up → keeping with (in keeping with tradition)",
 note:"👉 Câu cuối rồi, cố lên nhé! 💪",
 exp:`<div class="vnt">💬 Dịch: Theo đúng truyền thống, các cầu thủ hát quốc ca trước mỗi trận đấu.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>keeping up</span> → sửa thành <span class='hl-green'>keeping with</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Cụm cố định "in keeping WITH tradition" = theo đúng/phù hợp với truyền thống. Ở đây phải dùng "with", không phải "up".</span></li></ol>`},

/* VI. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:20,type:"fill",
 q:"Every year, the charity event ______ (raise) funds to support local orphanages.",
 answer:["raises"],
 exp:`<div class="vnt">💬 Dịch: Mỗi năm, sự kiện từ thiện gây quỹ để hỗ trợ các trại trẻ mồ côi địa phương.</div>
 <ol><li>Đáp án: <span class='hl-green'>raises</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Every year" (việc lặp lại) → Hiện tại đơn. Chủ ngữ "the charity event" (số ít) → thêm "-s": raises.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:21,type:"fill",
 q:"A shooting star appeared while Olivia ______ (observe) the night sky.",
 answer:["was observing"],
 exp:`<div class="vnt">💬 Dịch: Một ngôi sao băng xuất hiện trong khi Olivia đang quan sát bầu trời đêm.</div>
 <ol><li>Đáp án: <span class='hl-green'>was observing</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Một hành động đang diễn ra (observe) thì hành động khác xen vào (appeared). Hành động đang diễn ra dùng Quá khứ tiếp diễn: "was + V-ing" = was observing.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",
 q:"I can't hang out with you. I ______ (meet) my classmates later.",
 answer:["am meeting","'m meeting"],
 exp:`<div class="vnt">💬 Dịch: Tớ không đi chơi với cậu được. Lát nữa tớ có hẹn gặp các bạn cùng lớp.</div>
 <ol><li>Đáp án: <span class='hl-green'>am meeting</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Kế hoạch/lịch hẹn đã sắp xếp cho tương lai gần ("later") → Hiện tại tiếp diễn chỉ dự định: "am + V-ing" = am meeting.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:23,type:"fill",
 q:"Our maths teacher said we ______ (not have) any test the following Monday.",
 answer:["wouldn't have","would not have"],
 exp:`<div class="vnt">💬 Dịch: Thầy dạy Toán nói rằng thứ Hai tuần sau chúng tôi sẽ không có bài kiểm tra nào.</div>
 <ol><li>Đáp án: <span class='hl-green'>wouldn't have</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu tường thuật (said) → lùi thì: "won't have" (tương lai) lùi thành "wouldn't have".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",
 q:"Since the old bridge was no longer safe, they decided ______ (rebuild) it.",
 answer:["to rebuild"],
 exp:`<div class="vnt">💬 Dịch: Vì cây cầu cũ không còn an toàn nữa, họ đã quyết định xây lại nó.</div>
 <ol><li>Đáp án: <span class='hl-green'>to rebuild</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "decide TO V" (quyết định làm gì) → to rebuild.</span></li></ol>`},

/* VII. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:25,type:"fill",
 q:"The effects of climate change are now ______ all over the world. <span class='hint-word'>(observe)</span>",
 answer:["observable"],
 exp:`<div class="vnt">💬 Dịch: Tác động của biến đổi khí hậu giờ đây có thể <b>quan sát thấy</b> ở khắp nơi trên thế giới.</div>
 <ol><li>Từ gốc: <span class='p-word'>observe</span> <span class='wt'>v</span> = <span class='p-mean'>quan sát</span> → dạng cần điền: <span class='hl-green'>observable</span> <span class='wt'>adj</span> = <span class='p-mean'>có thể quan sát được</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: observable</span> <span class='p-grammar'>Sau "are now" cần TÍNH TỪ (are + adj). Thêm hậu tố "-able" (có thể…): observe → observable.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:26,type:"fill",
 q:"Many ______ believe these words were carved in the 2nd century. <span class='hint-word'>(history)</span>",
 answer:["historians"],
 exp:`<div class="vnt">💬 Dịch: Nhiều <b>nhà sử học</b> tin rằng những chữ này được khắc vào thế kỷ thứ 2.</div>
 <ol><li>Từ gốc: <span class='p-word'>history</span> <span class='wt'>n</span> = <span class='p-mean'>lịch sử</span> → dạng cần điền: <span class='hl-green'>historians</span> <span class='wt'>n</span> = <span class='p-mean'>các nhà sử học</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: historians</span> <span class='p-grammar'>Sau "Many" cần DANH TỪ chỉ NGƯỜI số nhiều làm chủ ngữ (many historians believe). history → historian(s).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"______ speaking, respect for elders is crucial in Asian countries. <span class='hint-word'>(culture)</span>",
 answer:["culturally"],
 exp:`<div class="vnt">💬 Dịch: Xét về mặt <b>văn hóa</b>, việc kính trọng người lớn tuổi là điều rất quan trọng ở các nước châu Á.</div>
 <ol><li>Từ gốc: <span class='p-word'>culture</span> <span class='wt'>n</span> = <span class='p-mean'>văn hóa</span> → dạng cần điền: <span class='hl-green'>Culturally</span> <span class='wt'>adv</span> = <span class='p-mean'>về mặt văn hóa</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: Culturally</span> <span class='p-grammar'>Cụm mở đầu câu "____ speaking" (xét về mặt…) cần TRẠNG TỪ, viết hoa chữ đầu. culture → cultural → culturally.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"Festivals and celebrations help ______ local culture and traditions. <span class='hint-word'>(promotion)</span>",
 answer:["promote"],
 exp:`<div class="vnt">💬 Dịch: Các lễ hội và dịp kỷ niệm giúp <b>quảng bá</b> văn hóa và truyền thống địa phương.</div>
 <ol><li>Từ gốc: <span class='p-word'>promotion</span> <span class='wt'>n</span> = <span class='p-mean'>sự quảng bá</span> → dạng cần điền: <span class='hl-green'>promote</span> <span class='wt'>v</span> = <span class='p-mean'>quảng bá, thúc đẩy</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: promote</span> <span class='p-grammar'>Sau "help" dùng ĐỘNG TỪ nguyên mẫu (help (to) do st). Biến danh từ promotion → động từ promote.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"That artist gained ______ after the city gallery displayed his work. <span class='hint-word'>(recognise)</span>",
 answer:["recognition"],
 exp:`<div class="vnt">💬 Dịch: Nghệ sĩ đó nhận được <b>sự công nhận</b> sau khi phòng trưng bày của thành phố trưng bày tác phẩm của anh.</div>
 <ol><li>Từ gốc: <span class='p-word'>recognise</span> <span class='wt'>v</span> = <span class='p-mean'>công nhận</span> → dạng cần điền: <span class='hl-green'>recognition</span> <span class='wt'>n</span> = <span class='p-mean'>sự công nhận</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: recognition</span> <span class='p-grammar'>Sau động từ "gained" cần DANH TỪ làm tân ngữ (gained recognition = nhận được sự công nhận). recognise → recognition.</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Chọn thứ tự sắp xếp câu đúng để tạo đoạn văn hợp lí",n:42,type:"mcq",
 q:"Sắp xếp các câu (a–c) điền vào sau câu mở đầu để tạo đoạn văn hợp lí:<br><div class='dialog'><b>Mở đầu:</b> Many cities like Rome or Cairo now offer virtual tours of their ancient landmarks and historical sites.<br><b>a.</b> There are also information boxes and audio guides to explain the history of each site.<br><b>b.</b> These experiences allow people to visit famous places without leaving their homes.<br><b>c.</b> At home, they can choose a site online, then explore it via 3D images, videos, and interactive maps.</div>",
 options:[{t:"a – b – c",c:false},{t:"b – c – a",c:true},{t:"a – c – b",c:false},{t:"c – b – a",c:false}],
 exp:`<div class="vnt">💬 Chủ đề: Các thành phố như Rome hay Cairo cung cấp tour tham quan ảo. Thứ tự đúng là <b>b – c – a</b>.</div>
 <ol><li>Dịch &amp; trình tự hợp lí:
   <div class="orderline"><span class="lbl">b</span> <span class="p-en">These experiences allow people to visit famous places without leaving their homes.</span> — <span class="p-mean">Những trải nghiệm này cho phép mọi người tham quan các địa danh nổi tiếng mà không cần rời khỏi nhà.</span> <i>("These experiences" nối ngay với "virtual tours" ở câu mở đầu → đứng đầu)</i></div>
   <div class="orderline"><span class="lbl">c</span> <span class="p-en">At home, they can choose a site online, then explore it via 3D images, videos, and interactive maps.</span> — <span class="p-mean">Ở nhà, họ có thể chọn một địa điểm trên mạng, rồi khám phá nó qua hình ảnh 3D, video và bản đồ tương tác.</span> <i>(giải thích cách làm "at home")</i></div>
   <div class="orderline"><span class="lbl">a</span> <span class="p-en">There are also information boxes and audio guides to explain the history of each site.</span> — <span class="p-mean">Ngoài ra còn có các ô thông tin và hướng dẫn bằng âm thanh để giải thích lịch sử của từng địa điểm.</span> <i>("also" – bổ sung thêm tính năng → đứng cuối)</i></div>
 </li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>(b) giới thiệu lợi ích chung của tour ảo → (c) mô tả cách trải nghiệm tại nhà → (a) dùng "also" bổ sung tính năng. Mạch ý: khái quát → cụ thể → bổ sung, nên thứ tự b – c – a.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các thứ tự khác đặt câu "also" (a) hoặc câu chi tiết (c) lên trước câu khái quát (b), làm đứt mạch logic.</span></li></ol>`},

{sec:"C. WRITING",part:"I. Chọn câu kết thúc đoạn văn phù hợp nhất",n:43,type:"mcq",
 q:"Chọn câu KẾT phù hợp nhất cho đoạn văn về tour tham quan ảo (ở câu 42):",
 options:[{t:"Overall, we can avoid crowded places by choosing these tours during high season.",c:false},
          {t:"Rome lets visitors walk through the Colosseum and Roman Forum online.",c:false},
          {t:"The virtual tour begins with an introduction to the history of the ancient ruin.",c:false},
          {t:"These virtual tours help connect with the past in an affordable and exciting way.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Những tour tham quan ảo này giúp kết nối với quá khứ theo một cách vừa tiết kiệm vừa thú vị.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>Overall, we can avoid crowded places...</span> = <span class='p-mean'>Nhìn chung, ta tránh được nơi đông đúc...</span></div>
     <div><span class='p-word'>Rome lets visitors walk through the Colosseum...</span> = <span class='p-mean'>Rome cho khách đi qua Colosseum trực tuyến.</span></div>
     <div><span class='p-word'>The virtual tour begins with an introduction...</span> = <span class='p-mean'>Tour ảo bắt đầu bằng phần giới thiệu...</span></div>
     <div><span class='hl-green'>These virtual tours help connect with the past in an affordable and exciting way.</span> = <span class='p-mean'>Những tour ảo này giúp kết nối với quá khứ một cách tiết kiệm và thú vị.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu kết cần TỔNG KẾT lợi ích chung của tour ảo → câu D khái quát ý nghĩa ("giúp kết nối với quá khứ") — phù hợp làm câu chốt.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A nói về chủ đề mới (mùa cao điểm); B, C là chi tiết cụ thể/mở đầu, không mang tính tổng kết nên không hợp làm câu kết.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu đúng nhất viết từ các gợi ý",n:44,type:"mcq",
 q:"Gợi ý: <em>8 p.m. yesterday / she / prepare / history presentation / the Ly Dynasty.</em>",
 options:[{t:"At 8 p.m. yesterday, she was preparing a history presentation on the Ly Dynasty.",c:true},
          {t:"At 8 p.m. yesterday, she would prepare a history presentation on Ly Dynasty.",c:false},
          {t:"8 p.m. yesterday, she prepared a history presentation for the Ly Dynasty.",c:false},
          {t:"8 p.m. yesterday, she could prepare a history presentation for Ly Dynasty.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Vào 8 giờ tối hôm qua, cô ấy đang chuẩn bị một bài thuyết trình lịch sử về triều đại nhà Lý.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>At 8 p.m. yesterday, she was preparing a history presentation on the Ly Dynasty.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"At 8 p.m. yesterday" (mốc thời gian quá khứ) → Quá khứ tiếp diễn "was preparing"; "presentation ON + chủ đề" (bài về…); "the Ly Dynasty" (có "the").</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>would/could prepare, prepared (quá khứ đơn) không diễn tả hành động đang diễn ra tại mốc đó; thiếu "At" hoặc thiếu "the".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu đúng nhất viết từ các gợi ý",n:45,type:"mcq",
 q:"Gợi ý: <em>If / I / have / chance / visit / Italy / I / definitely / try / original / pasta and pizza.</em>",
 options:[{t:"If I have a chance to visit Italy, I will definitely try the original pasta and pizza.",c:true},
          {t:"If I have a chance visiting Italy, I definitely try original pasta and pizza.",c:false},
          {t:"If I will have a chance to visit Italy, I will definitely try the original pasta and pizza.",c:false},
          {t:"If I will have a chance visiting Italy, I definitely try original pasta and pizza.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Nếu tôi có cơ hội đến thăm nước Ý, tôi chắc chắn sẽ thử món pasta và pizza chính gốc.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>If I have a chance to visit Italy, I will definitely try the original pasta and pizza.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (have), … will + V (will try)"; "a chance TO V" (cơ hội làm gì).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Vế "If" KHÔNG dùng "will" (loại C, D sai); "chance visiting" sai (phải "to visit"); thiếu "will" ở mệnh đề chính.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu đúng nhất viết từ các gợi ý",n:46,type:"mcq",
 q:"Gợi ý: <em>Who / you / trust / most / you / need / ask / advice?</em>",
 options:[{t:"Who do you trust most when you need asking some advice?",c:false},
          {t:"Who do you trust the most when you need to ask for some advice?",c:true},
          {t:"Who do you trust most because you need to ask for an advice?",c:false},
          {t:"Who do you trust the most because you need asking an advice?",c:false}],
 exp:`<div class="vnt">💬 Dịch: Bạn tin tưởng ai nhất khi bạn cần xin lời khuyên?</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Who do you trust the most when you need to ask for some advice?</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>So sánh nhất "the most"; "when" (khi) hợp logic; "need TO V" (need to ask); "ask FOR advice" (xin lời khuyên); "advice" là danh từ không đếm được (không "an advice").</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"need asking" sai (phải "need to ask"); "because" sai logic; "an advice" sai vì advice không đếm được.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu đúng nhất viết từ các gợi ý",n:47,type:"mcq",
 q:"Gợi ý: <em>The Colosseum / one / most well-preserved / structure / Rome.</em>",
 options:[{t:"The Colosseum is one in the most well-preserved structure of Rome.",c:false},
          {t:"The Colosseum is one of most well-preserved structures in Rome.",c:false},
          {t:"The Colosseum is one the most well-preserved structure of Rome.",c:false},
          {t:"The Colosseum is one of the most well-preserved structures in Rome.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Đấu trường Colosseum là một trong những công trình được bảo tồn tốt nhất ở Rome.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>The Colosseum is one of the most well-preserved structures in Rome.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "one of the + so sánh nhất + danh từ SỐ NHIỀU": one of the most well-preserved structures; "in Rome" (ở Rome).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"one in / one of most / one the" đều sai cấu trúc; sau "one of the … most" phải là danh từ số nhiều "structures".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:48,type:"mcq",
 q:"Câu gốc: <em>The locals want the tourists to stop drawing on the walls of the castle.</em>",
 options:[{t:"It's a rule here that tourists mustn't draw on the walls of the castle.",c:false},
          {t:"When the locals noticed, the tourists were drawing on the walls of the castle.",c:false},
          {t:"The locals wish that the tourists stopped drawing on the walls of the castle.",c:true},
          {t:"The locals make it difficult for tourists to draw on the walls of the castle.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Người dân địa phương ước gì du khách ngừng vẽ bậy lên tường của lâu đài.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>The locals wish that the tourists stopped drawing on the walls of the castle.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"want sb to stop doing st" (muốn ai ngừng làm gì) ≈ "wish that sb stopped doing st" (ước ai ngừng làm gì — điều mong ở hiện tại nên lùi thì "stopped").</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A là nội quy (mustn't); B kể một sự việc quá khứ; D nói "gây khó" — đều đổi nghĩa so với câu gốc.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:49,type:"mcq",
 q:"Câu gốc: <em>Students at Harvard University are very proud of the school's traditions.</em>",
 options:[{t:"Students at Harvard University has great pride about the school's traditions.",c:false},
          {t:"Harvard University's traditions have a great sense of pride in its students.",c:false},
          {t:"Students at Harvard University take great pride in the school's traditions.",c:true},
          {t:"Harvard University's traditions look at its students with great pride.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Sinh viên Đại học Harvard rất tự hào về những truyền thống của trường.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Students at Harvard University take great pride in the school's traditions.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"be proud OF st" (tự hào về) = "take (great) pride IN st" (rất tự hào về). Chủ ngữ số nhiều "Students … take".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A dùng "has" (sai số nhiều) và "pride about" (sai giới từ); B, D đảo chủ ngữ thành "traditions" làm sai nghĩa.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:50,type:"mcq",
 q:"Câu gốc: <em>My father used to go to work on foot since he couldn't afford a motorbike.</em>",
 options:[{t:"My father couldn't afford a motorbike, so he used to go to work on foot.",c:true},
          {t:"Now my father can afford a motorbike, but he still goes to work on foot.",c:false},
          {t:"Despite not having enough money to get a motorbike, my father went to work on foot.",c:false},
          {t:"If my father has enough money to get a motorbike, he won't go to work on foot.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Bố tôi không đủ tiền mua xe máy, nên trước đây ông thường đi bộ đi làm.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>My father couldn't afford a motorbike, so he used to go to work on foot.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"…on foot SINCE he couldn't afford…" (vì – nguyên nhân) = "couldn't afford…, SO he used to go on foot" (nên – kết quả). Giữ nguyên "used to" (thói quen quá khứ).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B, D nói về hiện tại/điều kiện (khác nghĩa); C dùng "Despite" (mặc dù) làm sai quan hệ nguyên nhân–kết quả.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:51,type:"mcq",
 q:"Câu gốc: <em>Many people were waiting at the nearby bus stop at the time of the accident.</em>",
 options:[{t:"Many people were waiting at the nearby bus stop while the accident was happening.",c:false},
          {t:"When the accident happened, many people were waiting at the nearby bus stop.",c:true},
          {t:"The accident happened, then many people waited at the nearby bus stop.",c:false},
          {t:"Many people waited at the nearby bus stop while the accident was happening.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Khi vụ tai nạn xảy ra, nhiều người đang đợi ở trạm xe buýt gần đó.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>When the accident happened, many people were waiting at the nearby bus stop.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Một hành động ngắn xảy ra (the accident happened – QK đơn) xen vào hành động đang kéo dài (were waiting – QK tiếp diễn) → dùng "When + QK đơn, … QK tiếp diễn".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"while the accident was happening" biến tai nạn thành hành động kéo dài (sai); C đảo trình tự (tai nạn xong mới đợi) sai nghĩa; D dùng "waited" (QK đơn) làm mất ý "đang đợi".</span></li></ol>`}
];

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#1a1440">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#ec4899">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 39 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🚀';memeKey='good';msg='Cố thêm chút nữa là chạm tới các vì sao luôn nè! 💫';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='🌙';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
