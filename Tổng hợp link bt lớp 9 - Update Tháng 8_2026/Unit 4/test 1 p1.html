<script>
(function(){const items=['🌌','🪐','🌠','✨','🌟','💫','🌙','🔭','⭐','🛸','☄️','🌑','✨','🪐','⭐','🌟'];
  const layer=document.getElementById('foodlayer');

    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(1.1+Math.random()*2.2)+'rem';
    s.style.animationDelay=(Math.random()*3.5)+'s';s.style.animationDuration=(2.5+Math.random()*3)+'s';layer.appendChild(s);}})();

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#a855f7','#ec4899','#22d3ee','#fde047','#7c3aed','#f9a8d4','#00D26A'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Cô MS Chí Nên · ULIS giải thích chi tiết";
const TOTAL=41;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",

 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "u" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">

     <div><span class='p-word'>c<u>u</u>stom</span> <span class='p-phonetic'>/ˈkʌstəm/</span> = <span class='p-mean'>phong tục</span> → âm <b>/ʌ/</b></div>
     <div><span class='hl-green'>occupy</span> <span class='p-phonetic'>/ˈɒkjupaɪ/</span> = <span class='p-mean'>chiếm giữ</span> → âm <b>/ju/</b></div>

   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>structure, custom, culture đều có âm /ʌ/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",

     <div><span class='p-word'>served</span> <span class='p-phonetic'>/sɜːvd/</span> = <span class='p-mean'>đã phục vụ</span> → đuôi <b>/d/</b></div>
     <div><span class='hl-green'>founded</span> <span class='p-phonetic'>/ˈfaʊndɪd/</span> = <span class='p-mean'>đã thành lập</span> → đuôi <b>/ɪd/</b></div>
     <div><span class='p-word'>recognised</span> <span class='p-phonetic'>/ˈrekəɡnaɪzd/</span> = <span class='p-mean'>đã công nhận</span> → đuôi <b>/d/</b></div>
     <div><span class='p-word'>appeared</span> <span class='p-phonetic'>/əˈpɪəd/</span> = <span class='p-mean'>đã xuất hiện</span> → đuôi <b>/d/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"found" tận cùng bằng âm /d/ nên "founded" có đuôi -ed đọc là /ɪd/, khác với ba từ kia đọc /d/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>served, recognised, appeared kết thúc bằng âm hữu thanh nên -ed đọc /d/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:3,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"<u>a</u>ncestor",c:true},{t:"b<u>a</u>sic",c:false},{t:"gener<u>a</u>tion",c:false},{t:"s<u>a</u>feguard",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "a" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>ancestor</span> <span class='p-phonetic'>/ˈænsestə/</span> = <span class='p-mean'>tổ tiên</span> → âm <b>/æ/</b></div>
     <div><span class='p-word'>b<u>a</u>sic</span> <span class='p-phonetic'>/ˈbeɪsɪk/</span> = <span class='p-mean'>cơ bản</span> → âm <b>/eɪ/</b></div>
     <div><span class='p-word'>gener<u>a</u>tion</span> <span class='p-phonetic'>/ˌdʒenəˈreɪʃn/</span> = <span class='p-mean'>thế hệ</span> → âm <b>/eɪ/</b></div>
     <div><span class='p-word'>s<u>a</u>feguard</span> <span class='p-phonetic'>/ˈseɪfɡɑːd/</span> = <span class='p-mean'>bảo vệ</span> → âm <b>/eɪ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"ancestor" có "a" đọc là /æ/ (ngắn), khác với ba từ kia có "a" đọc là /eɪ/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>basic, generation, safeguard đều có âm /eɪ/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"II. Chọn từ có TRỌNG ÂM khác với các từ còn lại",n:4,type:"mcq",
 q:"Choose the word whose stress pattern is different.",
 options:[{t:"monument",c:false},{t:"magnificent",c:true},{t:"heritage",c:false},{t:"recognise",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi vào vị trí khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>monument</span> <span class='p-phonetic'>/ˈmɒnjumənt/</span> = <span class='p-mean'>đài tưởng niệm</span> → trọng âm <b>1</b></div>
     <div><span class='hl-green'>magnificent</span> <span class='p-phonetic'>/mæɡˈnɪfɪsnt/</span> = <span class='p-mean'>tráng lệ</span> → trọng âm <b>2</b></div>
     <div><span class='p-word'>heritage</span> <span class='p-phonetic'>/ˈherɪtɪdʒ/</span> = <span class='p-mean'>di sản</span> → trọng âm <b>1</b></div>
     <div><span class='p-word'>recognise</span> <span class='p-phonetic'>/ˈrekəɡnaɪz/</span> = <span class='p-mean'>công nhận</span> → trọng âm <b>1</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"magnificent" nhấn âm tiết thứ 2 (mag-NI-fi-cent), khác với ba từ kia nhấn âm tiết đầu.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>monument, heritage, recognise đều nhấn âm tiết đầu tiên.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"II. Chọn từ có TRỌNG ÂM khác với các từ còn lại",n:5,type:"mcq",
 q:"Choose the word whose stress pattern is different.",
 options:[{t:"observe",c:false},{t:"promote",c:false},{t:"historic",c:false},{t:"barefoot",c:true}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi vào vị trí khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>observe</span> <span class='p-phonetic'>/əbˈzɜːv/</span> = <span class='p-mean'>quan sát</span> → trọng âm <b>2</b></div>
     <div><span class='p-word'>promote</span> <span class='p-phonetic'>/prəˈməʊt/</span> = <span class='p-mean'>thúc đẩy</span> → trọng âm <b>2</b></div>
     <div><span class='p-word'>historic</span> <span class='p-phonetic'>/hɪˈstɒrɪk/</span> = <span class='p-mean'>mang tính lịch sử</span> → trọng âm <b>2</b></div>
     <div><span class='hl-green'>barefoot</span> <span class='p-phonetic'>/ˈbeəfʊt/</span> = <span class='p-mean'>chân trần</span> → trọng âm <b>1</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"barefoot" nhấn âm tiết đầu (BARE-foot), khác với ba từ kia nhấn âm tiết thứ 2.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>observe, promote, historic đều nhấn âm tiết thứ 2.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:6,type:"mcq",
 q:"The Japanese take great pride ____ their traditional arts, like flower arranging and pottery.",
 options:[{t:"on",c:false},{t:"with",c:false},{t:"of",c:false},{t:"in",c:true}],
 exp:`<div class="vnt">💬 Dịch: Người Nhật rất tự hào về các loại hình nghệ thuật truyền thống của họ, như cắm hoa và làm gốm.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>on</span> <span class='wt'>prep</span> = <span class='p-mean'>trên</span></div>
     <div><span class='p-word'>with</span> <span class='wt'>prep</span> = <span class='p-mean'>với</span></div>
     <div><span class='p-word'>of</span> <span class='wt'>prep</span> = <span class='p-mean'>của</span></div>
     <div><span class='hl-green'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>(take pride IN)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "take pride IN st" (tự hào về điều gì) → take great pride in their traditional arts.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"take pride" không đi với on/with/of; giới từ chuẩn là "in".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:7,type:"mcq",
 q:"This castle was once ____ by a noble family, but now it serves as a history museum.",
 options:[{t:"founded",c:false},{t:"occupied",c:true},{t:"observed",c:false},{t:"recognised",c:false}],
 exp:`<div class="vnt">💬 Dịch: Tòa lâu đài này từng được một gia đình quý tộc sinh sống, nhưng nay nó là một bảo tàng lịch sử.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>founded</span> <span class='wt'>v</span> = <span class='p-mean'>thành lập</span></div>
     <div><span class='hl-green'>occupied</span> <span class='wt'>v</span> = <span class='p-mean'>ở, chiếm giữ</span></div>
     <div><span class='p-word'>observed</span> <span class='wt'>v</span> = <span class='p-mean'>quan sát</span></div>
     <div><span class='p-word'>recognised</span> <span class='wt'>v</span> = <span class='p-mean'>công nhận</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"be occupied by sb" = được ai đó ở/sinh sống. Lâu đài từng do một gia đình quý tộc ở → occupied.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>founded (thành lập tổ chức), observed (quan sát), recognised (công nhận) không hợp nghĩa "sinh sống trong lâu đài".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:8,type:"mcq",
 q:"Our village has a historic church built in the 1700s. It's known as ____ building in town.",
 options:[{t:"the oldest",c:true},{t:"older than",c:false},{t:"the eldest",c:false},{t:"elder than",c:false}],
 exp:`<div class="vnt">💬 Dịch: Làng chúng tôi có một nhà thờ cổ xây từ những năm 1700. Nó được biết đến là tòa nhà lâu đời nhất trong thị trấn.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>the oldest</span> = <span class='p-mean'>lâu đời/cũ nhất</span></div>
     <div><span class='p-word'>older than</span> = <span class='p-mean'>(so sánh hơn)</span></div>
     <div><span class='p-word'>the eldest</span> = <span class='p-mean'>lớn tuổi nhất (chỉ người)</span></div>
     <div><span class='p-word'>elder than</span> = <span class='p-mean'>(sai)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>So sánh nhất "the oldest" (cũ/lâu đời nhất). "eldest" chỉ dùng cho NGƯỜI trong gia đình, không dùng cho tòa nhà.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"older/elder than" là so sánh hơn (cần vế so sánh); "eldest" chỉ dùng cho người.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:9,type:"mcq",
 q:"Gathering for Sunday meals has become a ____ tradition in my family.",
 options:[{t:"communal",c:false},{t:"barefoot",c:false},{t:"deep-rooted",c:true},{t:"national",c:false}],
 exp:`<div class="vnt">💬 Dịch: Việc quây quần ăn cơm ngày Chủ nhật đã trở thành một truyền thống ăn sâu bén rễ trong gia đình tôi.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>communal</span> <span class='wt'>adj</span> = <span class='p-mean'>chung, cộng đồng</span></div>
     <div><span class='p-word'>barefoot</span> <span class='wt'>adj</span> = <span class='p-mean'>chân trần</span></div>
     <div><span class='hl-green'>deep-rooted</span> <span class='wt'>adj</span> = <span class='p-mean'>ăn sâu, bén rễ</span></div>
     <div><span class='p-word'>national</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc quốc gia</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"a deep-rooted tradition" = truyền thống ăn sâu bén rễ (tồn tại lâu, gắn bó chặt) — hợp với truyền thống gia đình.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>communal, barefoot, national không mô tả đúng một truyền thống lâu đời trong gia đình.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:10,type:"mcq",
 q:"When Dylan was 6 years old, he ____ play the guitar like a professional musician.",
 options:[{t:"would",c:false},{t:"might",c:false},{t:"must",c:false},{t:"could",c:true}],
 exp:`<div class="vnt">💬 Dịch: Khi Dylan 6 tuổi, cậu ấy đã có thể chơi đàn ghi-ta như một nhạc công chuyên nghiệp.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>would</span> <span class='wt'>modal</span> = <span class='p-mean'>đã hay (thói quen QK)</span></div>
     <div><span class='p-word'>might</span> <span class='wt'>modal</span> = <span class='p-mean'>có lẽ</span></div>
     <div><span class='p-word'>must</span> <span class='wt'>modal</span> = <span class='p-mean'>phải</span></div>
     <div><span class='hl-green'>could</span> <span class='wt'>modal</span> = <span class='p-mean'>đã có thể (khả năng QK)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Diễn tả KHẢ NĂNG trong quá khứ (biết chơi đàn giỏi lúc 6 tuổi) → "could".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"would" là thói quen quá khứ (không phải khả năng); might (khả năng thấp), must (bắt buộc) sai nghĩa.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:11,type:"mcq",
 q:"It's crucial to ____ local languages, as they reflect the identity of communities.",
 options:[{t:"contribute",c:false},{t:"preserve",c:true},{t:"appear",c:false},{t:"associate",c:false}],
 exp:`<div class="vnt">💬 Dịch: Việc bảo tồn các ngôn ngữ địa phương là rất quan trọng, vì chúng phản ánh bản sắc của các cộng đồng.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>contribute</span> <span class='wt'>v</span> = <span class='p-mean'>đóng góp</span></div>
     <div><span class='hl-green'>preserve</span> <span class='wt'>v</span> = <span class='p-mean'>bảo tồn</span></div>
     <div><span class='p-word'>appear</span> <span class='wt'>v</span> = <span class='p-mean'>xuất hiện</span></div>
     <div><span class='p-word'>associate</span> <span class='wt'>v</span> = <span class='p-mean'>liên kết</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"preserve local languages" = bảo tồn ngôn ngữ địa phương — hợp với việc giữ gìn bản sắc.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>contribute, appear, associate không mang nghĩa "giữ gìn/bảo tồn" ngôn ngữ.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:12,type:"mcq",
 q:"I wanted to cook a Thai dish – <em>tom yum</em>, so I asked Vicky ____ the ingredients were.",
 options:[{t:"how",c:false},{t:"whether",c:false},{t:"what",c:true},{t:"where",c:false}],
 exp:`<div class="vnt">💬 Dịch: Tôi muốn nấu một món Thái – tom yum, nên tôi đã hỏi Vicky nguyên liệu là những gì.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>how</span> <span class='wt'>wh-</span> = <span class='p-mean'>như thế nào</span></div>
     <div><span class='p-word'>whether</span> <span class='wt'>conj</span> = <span class='p-mean'>liệu có… không</span></div>
     <div><span class='hl-green'>what</span> <span class='wt'>wh-</span> = <span class='p-mean'>cái gì</span></div>
     <div><span class='p-word'>where</span> <span class='wt'>wh-</span> = <span class='p-mean'>ở đâu</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu tường thuật hỏi về "nguyên liệu là GÌ" → dùng "what": asked what the ingredients were.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>how (cách thức), whether (có/không), where (nơi chốn) không hợp với việc hỏi "cái gì".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:13,type:"mcq",
 q:"The structure of the ancient temple was remarkable; ____, much of it has collapsed over time.",
 options:[{t:"however",c:true},{t:"therefore",c:false},{t:"moreover",c:false},{t:"otherwise",c:false}],
 exp:`<div class="vnt">💬 Dịch: Cấu trúc của ngôi đền cổ rất đáng chú ý; tuy nhiên, phần lớn nó đã sụp đổ theo thời gian.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>however</span> <span class='wt'>adv</span> = <span class='p-mean'>tuy nhiên</span></div>
     <div><span class='p-word'>therefore</span> <span class='wt'>adv</span> = <span class='p-mean'>vì vậy</span></div>
     <div><span class='p-word'>moreover</span> <span class='wt'>adv</span> = <span class='p-mean'>hơn nữa</span></div>
     <div><span class='p-word'>otherwise</span> <span class='wt'>adv</span> = <span class='p-mean'>nếu không thì</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hai vế TRÁI NGƯỢC (đền đẹp ↔ đã sụp đổ) → dùng "however" (tuy nhiên) để chỉ sự tương phản.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>therefore (kết quả), moreover (bổ sung), otherwise (nếu không) không diễn tả sự tương phản.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:14,type:"mcq",
 q:"Ella wishes her sister ____ to turn off the air conditioner before leaving the house.",
 options:[{t:"couldn't forget",c:false},{t:"won't forget",c:false},{t:"doesn't forget",c:false},{t:"didn't forget",c:true}],
 exp:`<div class="vnt">💬 Dịch: Ella ước gì chị/em gái mình không quên tắt máy lạnh trước khi ra khỏi nhà.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>couldn't forget</span> = <span class='p-mean'>(sai)</span></div>
     <div><span class='p-word'>won't forget</span> = <span class='p-mean'>(sai — tương lai)</span></div>
     <div><span class='p-word'>doesn't forget</span> = <span class='p-mean'>(sai — hiện tại)</span></div>
     <div><span class='hl-green'>didn't forget</span> = <span class='p-mean'>không quên (giả định)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"wish + S + V(quá khứ)" diễn tả điều mong ước trái với hiện tại → "didn't forget" (ước cô ấy không quên).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Sau "wish" (ước ở hiện tại) không dùng "won't/doesn't"; "couldn't forget" sai nghĩa.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:15,type:"mcq",
 q:"Fiona: \"I really appreciate you lending me your notes for the test.\" — Samuel: \"____ I'm happy to help out.\"",
 options:[{t:"Thank you for doing that for me.",c:false},{t:"Don't worry about me.",c:false},{t:"No problem at all!",c:true},{t:"What an interesting thing to say!",c:false}],
 exp:`<div class="vnt">💬 Dịch: Fiona: "Mình thực sự cảm ơn cậu đã cho mình mượn vở để ôn thi." — Samuel: "Không có gì đâu! Mình rất vui được giúp."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>Thank you for doing that for me.</span> = <span class='p-mean'>Cảm ơn cậu đã làm vậy.</span></div>
     <div><span class='p-word'>Don't worry about me.</span> = <span class='p-mean'>Đừng lo cho mình.</span></div>
     <div><span class='hl-green'>No problem at all!</span> = <span class='p-mean'>Không có gì đâu!</span></div>
     <div><span class='p-word'>What an interesting thing to say!</span> = <span class='p-mean'>Nói vậy nghe thú vị ghê!</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đáp lại lời CẢM ƠN → "No problem at all!" (không có gì đâu), hợp với "I'm happy to help".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác không phải cách đáp lại lời cảm ơn (một câu lại đi cảm ơn ngược).</span></li></ol>`},

/* IV. Closest meaning */
{sec:"A. LANGUAGE FOCUS",part:"IV. Chọn từ GẦN nghĩa nhất với từ gạch chân",n:16,type:"mcq",
 q:"Harvard University, the oldest institution of higher education in the US, was <u>founded</u> in 1636.",
 options:[{t:"recognised",c:false},{t:"promoted",c:false},{t:"established",c:true},{t:"preserved",c:false}],
 exp:`<div class="vnt">💬 Dịch: Đại học Harvard, cơ sở giáo dục đại học lâu đời nhất ở Mỹ, được thành lập năm 1636.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>founded</span> = <span class='p-mean'>được thành lập</span>):
   <div class="grid2">
     <div><span class='p-word'>recognised</span> <span class='wt'>v</span> = <span class='p-mean'>công nhận</span></div>
     <div><span class='p-word'>promoted</span> <span class='wt'>v</span> = <span class='p-mean'>thúc đẩy</span></div>
     <div><span class='hl-green'>established</span> <span class='wt'>v</span> = <span class='p-mean'>thành lập</span></div>
     <div><span class='p-word'>preserved</span> <span class='wt'>v</span> = <span class='p-mean'>bảo tồn</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"founded" (thành lập) đồng nghĩa với "established" (thành lập, lập ra).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>recognised, promoted, preserved đều khác nghĩa với "thành lập".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Chọn từ GẦN nghĩa nhất với từ gạch chân",n:17,type:"mcq",
 q:"From the top of the fortress, visitors can enjoy a <u>magnificent</u> view of the coastline.",
 options:[{t:"impressive",c:true},{t:"religious",c:false},{t:"historic",c:false},{t:"basic",c:false}],
 exp:`<div class="vnt">💬 Dịch: Từ đỉnh pháo đài, du khách có thể chiêm ngưỡng khung cảnh tráng lệ của bờ biển.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>magnificent</span> = <span class='p-mean'>tráng lệ, hùng vĩ</span>):
   <div class="grid2">
     <div><span class='hl-green'>impressive</span> <span class='wt'>adj</span> = <span class='p-mean'>ấn tượng</span></div>
     <div><span class='p-word'>religious</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc tôn giáo</span></div>
     <div><span class='p-word'>historic</span> <span class='wt'>adj</span> = <span class='p-mean'>mang tính lịch sử</span></div>
     <div><span class='p-word'>basic</span> <span class='wt'>adj</span> = <span class='p-mean'>cơ bản</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"magnificent" (tráng lệ, tuyệt đẹp) gần nghĩa nhất với "impressive" (ấn tượng, gây choáng ngợp).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>religious, historic, basic không diễn tả sự "tráng lệ, đẹp ấn tượng".</span></li></ol>`},

/* V. Opposite meaning */
{sec:"A. LANGUAGE FOCUS",part:"V. Chọn từ TRÁI nghĩa nhất với từ gạch chân",n:18,type:"mcq",

 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>ancient</span> = <span class='p-mean'>cổ xưa</span>):

     <div><span class='p-word'>historical</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc lịch sử</span></div>
     <div><span class='hl-green'>modern</span> <span class='wt'>adj</span> = <span class='p-mean'>hiện đại</span></div>
     <div><span class='p-word'>well-preserved</span> <span class='wt'>adj</span> = <span class='p-mean'>được bảo tồn tốt</span></div>

   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>historical, well-preserved, cultural không phải từ trái nghĩa của "cổ xưa".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chọn từ TRÁI nghĩa nhất với từ gạch chân",n:19,type:"mcq",
 q:"Meryl Streep is a <u>popular</u> actress known for her incredible acting in many movies.",
 options:[{t:"dedicated",c:false},{t:"famous",c:false},{t:"professional",c:false},{t:"unknown",c:true}],
 exp:`<div class="vnt">💬 Dịch: Meryl Streep là một nữ diễn viên nổi tiếng, được biết đến với diễn xuất tuyệt vời trong nhiều bộ phim.</div>
 <ol><li>Phân tích 4 đáp án (từ gạch chân <span class='p-word'>popular</span> = <span class='p-mean'>nổi tiếng, được yêu thích</span>):
   <div class="grid2">
     <div><span class='p-word'>dedicated</span> <span class='wt'>adj</span> = <span class='p-mean'>tận tâm</span></div>
     <div><span class='p-word'>famous</span> <span class='wt'>adj</span> = <span class='p-mean'>nổi tiếng</span></div>
     <div><span class='p-word'>professional</span> <span class='wt'>adj</span> = <span class='p-mean'>chuyên nghiệp</span></div>
     <div><span class='hl-green'>unknown</span> <span class='wt'>adj</span> = <span class='p-mean'>vô danh, không ai biết</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"popular" (nổi tiếng, được biết đến nhiều) TRÁI nghĩa với "unknown" (vô danh).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"famous" là ĐỒNG nghĩa (bẫy); dedicated, professional không trái nghĩa với "popular".</span></li></ol>`},

/* VI. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"VI. Tìm phần gạch chân SAI và sửa lại cho đúng",n:20,type:"error",
 q:"I really enjoy <u>walking</u> <u>barefootedly</u> along the beach, <u>feeling</u> the sand <u>between</u> my toes.",
 options:["walking","barefootedly","feeling","between"],correctIdx:1,
 accept:["barefoot"],key:"barefootedly → barefoot",
 exp:`<div class="vnt">💬 Dịch: Tôi thực sự thích đi chân trần dọc bãi biển, cảm nhận cát len giữa các ngón chân.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>barefootedly</span> → sửa thành <span class='hl-green'>barefoot</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"barefoot" vừa là tính từ vừa là TRẠNG TỪ (đi chân trần) — KHÔNG thêm "-ly". Viết "barefootedly" là sai.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Tìm phần gạch chân SAI và sửa lại cho đúng",n:21,type:"error",
 q:"Chris <u>wishes</u> that he <u>has</u> money <u>to travel</u> around the world <u>and explore</u> new cultures.",
 options:["wishes","has","to travel","and explore"],correctIdx:1,
 accept:["had"],key:"has → had",
 note:"👉 Câu cuối rồi, cố lên nhé! 💪",
 exp:`<div class="vnt">💬 Dịch: Chris ước gì cậu ấy có tiền để đi du lịch vòng quanh thế giới và khám phá những nền văn hóa mới.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>has</span> → sửa thành <span class='hl-green'>had</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Sau "wish" (ước điều trái với hiện tại) phải lùi thì về QUÁ KHỨ: "wishes that he HAD money" (chứ không phải "has").</span></li></ol>`},

/* VII. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",
 q:"At 9 a.m. last Monday, the students ______ (do) a test about castles in Europe.",
 answer:["were doing"],
 exp:`<div class="vnt">💬 Dịch: Vào 9 giờ sáng thứ Hai tuần trước, các học sinh đang làm một bài kiểm tra về các lâu đài ở châu Âu.</div>
 <ol><li>Đáp án: <span class='hl-green'>were doing</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"At 9 a.m. last Monday" là một MỐC thời gian trong quá khứ → Quá khứ tiếp diễn: "were + V-ing" = were doing.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:23,type:"fill",
 q:"If he ______ (promote) his products well, more people ______ (buy) them. <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["promotes will buy"],
 exp:`<div class="vnt">💬 Dịch: Nếu anh ấy quảng bá sản phẩm tốt, nhiều người sẽ mua chúng hơn.</div>
 <ol><li>Đáp án: <span class='hl-green'>promotes</span> … <span class='hl-green'>will buy</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (he promotes – thêm "s"), … will + V (will buy)".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",
 q:"The students ______ (not play) on the schoolyard now because of the rain.",
 answer:["aren't playing","are not playing"],
 exp:`<div class="vnt">💬 Dịch: Các học sinh không chơi ở sân trường lúc này vì trời mưa.</div>
 <ol><li>Đáp án: <span class='hl-green'>aren't playing</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "now" → Hiện tại tiếp diễn, dạng phủ định: "aren't + V-ing" = aren't playing.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:25,type:"fill",
 q:"The restaurant is full at the moment. They wish they ______ (come) sooner.",
 answer:["came","had come"],
 exp:`<div class="vnt">💬 Dịch: Nhà hàng hiện đang kín chỗ. Họ ước gì mình đã đến sớm hơn.</div>
 <ol><li>Đáp án: <span class='hl-green'>came</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau "wish" diễn tả điều tiếc nuối → lùi thì. Theo đáp án sách dùng "came" (wish + quá khứ đơn).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VII. Chia dạng đúng của động từ trong ngoặc",n:26,type:"fill",
 q:"Hey Betty, do you fancy ______ (try) the new milk tea shop near our school?",
 answer:["trying"],
 exp:`<div class="vnt">💬 Dịch: Này Betty, cậu có muốn thử quán trà sữa mới gần trường mình không?</div>
 <ol><li>Đáp án: <span class='hl-green'>trying</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "fancy + V-ing" (thích/muốn làm gì) → trying.</span></li></ol>`},

/* VIII. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"The party's menu was ______ the same as last year, with very few changes. <span class='hint-word'>(basic)</span>",
 answer:["basically"],
 exp:`<div class="vnt">💬 Dịch: Thực đơn bữa tiệc <b>về cơ bản</b> giống như năm ngoái, với rất ít thay đổi.</div>

   <li><span class="tag hl-green">✅ ĐÁP ÁN: basically</span> <span class='p-grammar'>Cần TRẠNG TỪ bổ nghĩa cho cả câu ("về cơ bản là giống"). Thêm "-ally": basic → basically.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"Her ______ to preserving traditional music was remarkable. <span class='hint-word'>(contribute)</span>",
 answer:["contribution"],
 exp:`<div class="vnt">💬 Dịch: <b>Đóng góp</b> của cô ấy cho việc bảo tồn âm nhạc truyền thống thật đáng chú ý.</div>
 <ol><li>Từ gốc: <span class='p-word'>contribute</span> <span class='wt'>v</span> = <span class='p-mean'>đóng góp</span> → dạng cần điền: <span class='hl-green'>contribution</span> <span class='wt'>n</span> = <span class='p-mean'>sự đóng góp</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: contribution</span> <span class='p-grammar'>Sau "Her" cần DANH TỪ làm chủ ngữ. Thêm "-ion": contribute → contribution.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"Harry loves to ______ the stars through his telescope at night. <span class='hint-word'>(observation)</span>",
 answer:["observe"],
 exp:`<div class="vnt">💬 Dịch: Harry thích <b>quan sát</b> các vì sao qua kính viễn vọng vào ban đêm.</div>
 <ol><li>Từ gốc: <span class='p-word'>observation</span> <span class='wt'>n</span> = <span class='p-mean'>sự quan sát</span> → dạng cần điền: <span class='hl-green'>observe</span> <span class='wt'>v</span> = <span class='p-mean'>quan sát</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: observe</span> <span class='p-grammar'>Sau "to" cần ĐỘNG TỪ nguyên mẫu (loves TO ___). Biến danh từ observation → động từ observe.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:30,type:"fill",
 q:"Angkor Wat, a massive ______ monument, is a symbol of Cambodia's cultural heritage. <span class='hint-word'>(religion)</span>",
 answer:["religious"],
 exp:`<div class="vnt">💬 Dịch: Angkor Wat, một công trình <b>tôn giáo</b> đồ sộ, là biểu tượng của di sản văn hóa Campuchia.</div>
 <ol><li>Từ gốc: <span class='p-word'>religion</span> <span class='wt'>n</span> = <span class='p-mean'>tôn giáo</span> → dạng cần điền: <span class='hl-green'>religious</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc tôn giáo</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: religious</span> <span class='p-grammar'>Cần TÍNH TỪ đứng trước danh từ "monument" → "religious monument" (công trình tôn giáo). Thêm "-ous".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VIII. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:31,type:"fill",
 q:"A ______ of curry often includes tender chicken, vegetables, and spices mixed together. <span class='hint-word'>(serve)</span>",
 answer:["serving"],
 exp:`<div class="vnt">💬 Dịch: Một <b>khẩu phần</b> cà ri thường gồm thịt gà mềm, rau củ và các loại gia vị trộn lẫn với nhau.</div>
 <ol><li>Từ gốc: <span class='p-word'>serve</span> <span class='wt'>v</span> = <span class='p-mean'>phục vụ</span> → dạng cần điền: <span class='hl-green'>serving</span> <span class='wt'>n</span> = <span class='p-mean'>khẩu phần (một suất)</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: serving</span> <span class='p-grammar'>Sau "A" cần DANH TỪ đếm được. "a serving of curry" = một khẩu phần/suất cà ri.</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Chọn thứ tự sắp xếp câu đúng để tạo đoạn văn/hội thoại hợp lí",n:44,type:"mcq",
 q:"Sắp xếp các câu (a–d) thành đoạn văn hợp lí:<br><div class='dialog'><b>a.</b> Firstly, experts use special techniques to prevent further damage from water, weather, and tourism.<br><b>b.</b> In addition, the government manages the flow of tourists to avoid overcrowding, which could harm the site.<br><b>c.</b> Today, I'd like to discuss how Cambodia preserves its ancient temple complex Angkor Wat.<br><b>d.</b> Lastly, they work with other organisations to monitor the site's condition, making sure it remains a treasure for future generations.</div>",
 options:[{t:"a – b – d – c",c:false},{t:"c – a – b – d",c:true},{t:"b – c – a – d",c:false},{t:"d – c – a – b",c:false}],
 exp:`<div class="vnt">💬 Chủ đề: Cách Campuchia bảo tồn quần thể đền cổ Angkor Wat. Thứ tự đúng là <b>c – a – b – d</b>.</div>
 <ol><li>Dịch &amp; trình tự hợp lí:
   <div class="orderline"><span class="lbl">c</span> <span class="p-en">Today, I'd like to discuss how Cambodia preserves its ancient temple complex Angkor Wat.</span> — <span class="p-mean">Hôm nay, tôi muốn bàn về cách Campuchia bảo tồn quần thể đền cổ Angkor Wat.</span> <i>(câu mở đầu, giới thiệu chủ đề)</i></div>
   <div class="orderline"><span class="lbl">a</span> <span class="p-en">Firstly, experts use special techniques to prevent further damage...</span> — <span class="p-mean">Đầu tiên, các chuyên gia dùng kỹ thuật đặc biệt để ngăn hư hại thêm từ nước, thời tiết và du lịch.</span> <i>(Firstly – ý thứ nhất)</i></div>
   <div class="orderline"><span class="lbl">b</span> <span class="p-en">In addition, the government manages the flow of tourists...</span> — <span class="p-mean">Ngoài ra, chính phủ quản lý lượng khách du lịch để tránh quá tải gây hại cho di tích.</span> <i>(In addition – bổ sung ý)</i></div>
   <div class="orderline"><span class="lbl">d</span> <span class="p-en">Lastly, they work with other organisations to monitor the site's condition...</span> — <span class="p-mean">Cuối cùng, họ hợp tác với các tổ chức khác để giám sát tình trạng di tích, đảm bảo nó là báu vật cho thế hệ sau.</span> <i>(Lastly – ý kết)</i></div>
 </li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu (c) nêu chủ đề mở bài; sau đó các từ nối chỉ trình tự "Firstly (a) → In addition (b) → Lastly (d)" sắp xếp các biện pháp theo thứ tự → c – a – b – d.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các thứ tự khác đặt "Firstly/Lastly" lên đầu hoặc đưa câu giới thiệu (c) ra giữa/cuối, làm mất mạch logic mở – thân – kết.</span></li></ol>`},

{sec:"C. WRITING",part:"I. Chọn thứ tự sắp xếp câu đúng để tạo đoạn văn/hội thoại hợp lí",n:45,type:"mcq",
 q:"Sắp xếp các câu (a–e) thành đoạn hội thoại hợp lí:<br><div class='dialog'><b>a.</b> Dad: Because there weren't any phones, we played simple games like tag or soccer, or we just talked with friends.<br><b>b.</b> Conor: Dad, what was your classroom like when you were in school?<br><b>c.</b> Dad: Well, it was very different. We used chalkboards and textbooks instead of smartboards and tablets.<br><b>d.</b> Conor: How about entertainment? What did you do for fun during breaks?<br><b>e.</b> Conor: That sounded so fun. Nowadays we just spend a lot of time on our phones.</div>",
 options:[{t:"d – a – b – c – e",c:false},{t:"b – c – d – a – e",c:true},{t:"c – b – a – d – e",c:false},{t:"a – d – c – b – e",c:false}],
 exp:`<div class="vnt">💬 Chủ đề: Conor hỏi bố về lớp học và giải trí thời xưa. Thứ tự đúng là <b>b – c – d – a – e</b>.</div>
 <ol><li>Dịch &amp; trình tự hợp lí:
   <div class="orderline"><span class="lbl">b</span> <span class="p-en">Conor: Dad, what was your classroom like when you were in school?</span> — <span class="p-mean">Conor: Bố ơi, lớp học của bố hồi đi học trông thế nào ạ?</span> <i>(câu hỏi mở đầu)</i></div>
   <div class="orderline"><span class="lbl">c</span> <span class="p-en">Dad: Well, it was very different. We used chalkboards and textbooks...</span> — <span class="p-mean">Bố: À, nó rất khác. Bố dùng bảng phấn và sách giáo khoa thay vì bảng thông minh và máy tính bảng.</span> <i>(bố trả lời câu b)</i></div>
   <div class="orderline"><span class="lbl">d</span> <span class="p-en">Conor: How about entertainment? What did you do for fun during breaks?</span> — <span class="p-mean">Conor: Thế còn giải trí thì sao ạ? Giờ ra chơi bố làm gì cho vui?</span> <i>(hỏi tiếp chủ đề mới)</i></div>
   <div class="orderline"><span class="lbl">a</span> <span class="p-en">Dad: Because there weren't any phones, we played simple games like tag or soccer...</span> — <span class="p-mean">Bố: Vì hồi đó không có điện thoại, bố chơi những trò đơn giản như đuổi bắt hay đá bóng, hoặc chỉ trò chuyện với bạn bè.</span> <i>(bố trả lời câu d)</i></div>
   <div class="orderline"><span class="lbl">e</span> <span class="p-en">Conor: That sounded so fun. Nowadays we just spend a lot of time on our phones.</span> — <span class="p-mean">Conor: Nghe vui thật đấy ạ. Ngày nay tụi con chỉ dành nhiều thời gian cho điện thoại thôi.</span> <i>(câu kết, so sánh với hiện tại)</i></div>
 </li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hội thoại theo cặp hỏi–đáp: Conor hỏi (b) → bố đáp (c) → Conor hỏi tiếp (d) → bố đáp (a) → Conor kết luận (e). Vậy thứ tự b – c – d – a – e.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các thứ tự khác làm câu trả lời của bố đứng trước câu hỏi, hoặc kết thúc (e) không nằm cuối — phá vỡ mạch hỏi–đáp.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu gần nghĩa nhất với câu gốc",n:46,type:"mcq",
 q:"Câu gốc: <em>It's a pity we don't know how Isabelle is doing in her new school.</em>",
 options:[{t:"I wish we know how Isabelle is doing in her new school.",c:false},
          {t:"Knowing how Isabelle is doing in her new school is such a pity.",c:false},
          {t:"I wish we knew how Isabelle was doing in her new school.",c:true},
          {t:"If I know how Isabelle is doing in her new school, it'll be a pity.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Thật tiếc là chúng tôi không biết Isabelle học hành thế nào ở trường mới.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>I wish we knew how Isabelle was doing in her new school.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"It's a pity + (that) S + V" (thật tiếc là…) = "I wish + S + V(lùi thì)". Ước ở hiện tại → lùi về quá khứ: "wish we knew … was doing".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Câu A dùng "know" (không lùi thì) sau wish là sai; B, D thay đổi cấu trúc và nghĩa.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu gần nghĩa nhất với câu gốc",n:47,type:"mcq",
 q:"Câu gốc: <em>My brother was studying for an exam, so I didn't want to distract him.</em>",
 options:[{t:"I didn't want to distract my brother because he was studying for an exam.",c:true},
          {t:"After my brother was studying for an exam, I didn't want to distract him.",c:false},
          {t:"I didn't want to distract my brother, but he was studying for an exam.",c:false},
          {t:"When I didn't want to distract my brother, he was studying for an exam.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Anh trai tôi đang ôn thi, nên tôi không muốn làm phiền anh ấy.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>I didn't want to distract my brother because he was studying for an exam.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"nguyên nhân, so kết quả" = "kết quả because nguyên nhân". "so" (nên) đổi thành "because" (bởi vì) khi đảo trật tự vế.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"After/When" sai quan hệ thời gian; "but" sai quan hệ logic (không phải tương phản).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu gần nghĩa nhất với câu gốc",n:48,type:"mcq",
 q:"Câu gốc: <em>The teacher won't approve the project unless the students submit it on time.</em>",
 options:[{t:"Although the teacher doesn't approve the project, the students submit it on time.",c:false},
          {t:"The students submit the project on time because the teacher doesn't approve it.",c:false},
          {t:"The students submit the project on time, so the teacher might approve it.",c:false},
          {t:"If the students don't submit the project on time, the teacher won't approve it.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Giáo viên sẽ không duyệt dự án trừ khi học sinh nộp đúng hạn.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>If the students don't submit the project on time, the teacher won't approve it.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"unless + S + V" (trừ khi) = "if + S + don't + V" (nếu … không). "unless the students submit" = "if the students don't submit".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Although/because/so đều làm sai quan hệ điều kiện của câu gốc.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Chọn câu gần nghĩa nhất với câu gốc",n:49,type:"mcq",
 q:"Câu gốc: <em>No other occupied castles in the world are so large as Windsor Castle.</em>",
 options:[{t:"Winsor Castle is not too large, compared to other occupied castles in the world.",c:false},
          {t:"Windsor Castle is the largest occupied castle in the world.",c:true},
          {t:"Other occupied castles in the world are larger than Windsor Castle.",c:false},
          {t:"Windsor Castle is one of the largest occupied castles in the world.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Không có tòa lâu đài có người ở nào khác trên thế giới lớn bằng Lâu đài Windsor.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Windsor Castle is the largest occupied castle in the world.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"No other + N + so … as X" (không cái nào bằng X) = "X is the + so sánh nhất". Không lâu đài nào lớn bằng Windsor → Windsor là lớn NHẤT.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Câu C nói ngược (cái khác lớn hơn); "one of the largest" (một trong những) yếu hơn nghĩa "lớn nhất"; câu A sai nghĩa.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:50,type:"fill",
 q:"fish and chip shop / during / London / The earliest / the 1860s / opened / in. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",

 exp:`<div class="vnt">💬 Dịch: Cửa hàng cá và khoai tây chiên đầu tiên mở tại London vào những năm 1860.</div>
 <ol><li>Đáp án: <span class='hl-green'>The earliest fish and chip shop opened in London during the 1860s.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ ngữ (The earliest fish and chip shop) + động từ (opened) + "in London" (nơi chốn) + "during the 1860s" (khoảng thời gian).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:51,type:"fill",
 q:"celebrating / associated / People / the past / festivals / keep themselves / by / with. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",

 exp:`<div class="vnt">💬 Dịch: Con người gắn kết bản thân với quá khứ bằng cách tổ chức các lễ hội.</div>
 <ol><li>Đáp án: <span class='hl-green'>People keep themselves associated with the past by celebrating festivals.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"keep sb associated WITH st" (gắn ai với cái gì); "by + V-ing" chỉ cách thức (by celebrating festivals).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:52,type:"fill",
 q:"when / were playing / suddenly went out / the smartboard / They / the power / with. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",

 <ol><li>Đáp án: <span class='hl-green'>They were playing with the smartboard when the power suddenly went out.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hành động đang diễn ra (were playing – QK tiếp diễn) thì có hành động khác xen vào (when the power went out – QK đơn).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:53,type:"fill",

   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"serve AS a place" (đóng vai trò là một nơi); "for important meetings and ceremonies" (dành cho các cuộc họp và nghi lễ quan trọng).</span></li></ol>`}
];

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#1a1440">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#ec4899">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 41 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🚀';memeKey='good';msg='Cố thêm chút nữa là chạm tới các vì sao luôn nè! 💫';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='🌙';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
</body>
</html>
