<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Môi trường - Ms MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh Ngọc */
            --correct-color: #00D26A; /* Xanh Lá Gamification */
            --wrong-color: #FF4757; /* Đỏ Cam */
            --bg-color: #F0F3F8;
            --card-bg: #FFFFFF;
            --text-color: #2F3542;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --btn-shadow: 0px 4px 0px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#8854c0 1.5px, transparent 1.5px), radial-gradient(#00c9a7 1.5px, #f0f3f8 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 16px var(--shadow-color);
            border: 3px solid var(--primary-color);
            z-index: 10;
        }

        h1 {
            color: var(--primary-color);
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1rem;
            color: #57606f;
            font-weight: 600;
        }

        /* Quiz Container */
        .quiz-container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.2);
            border-bottom: 6px solid #e1e1e1;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .question-badge {
            background: var(--secondary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            color: #2f3542;
            margin-bottom: 25px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .question-text {
                font-size: 1.1rem;
            }
        }

        /* Option Button Styles (Gamification 3D) */
        .option-btn {
            background: white;
            border: 2px solid #dfe4ea;
            border-bottom: 5px solid #dfe4ea; /* 3D effect */
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #57606f;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            color: var(--primary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .option-label {
            width: 30px;
            height: 30px;
            background: #f1f2f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: 800;
            font-size: 0.9rem;
            color: #a4b0be;
            flex-shrink: 0;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background: #d1fae5;
            border-color: var(--correct-color);
            border-bottom-color: #00b85c;
            color: #065f46;
        }
        .option-btn.correct .option-label {
            background: var(--correct-color);
            color: white;
        }

        .option-btn.wrong {
            background: #fee2e2;
            border-color: var(--wrong-color);
            border-bottom-color: #e63e4d;
            color: #991b1b;
            animation: shake 0.5s;
        }
        .option-btn.wrong .option-label {
            background: var(--wrong-color);
            color: white;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            background: #f8f9fa;
            border-left: 5px solid var(--primary-color);
            border-radius: 10px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .exp-header img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        .exp-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2f3542;
            white-space: pre-line; /* Respect newlines from JSON */
        }
        
        .exp-content strong {
            color: #2f3542;
            background: #ecccff;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Submit Button */
        #submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-bottom: 5px solid #6c4299;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            margin: 40px auto;
            display: block;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.4);
        }

        #submit-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        #submit-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 5px solid var(--secondary-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            background: var(--secondary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 auto 20px;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,201,167,0.4);
        }

        .modal-msg {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .modal-desc {
            margin-bottom: 30px;
            color: #7f8c8d;
        }
        
        .close-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Canvas for Confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #a4b0be;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ms MS Chí Nên</h1>
        <div class="subtitle">Trắc nghiệm Môi trường (Giải thích Siêu chi tiết)</div>
    </header>

    <div class="quiz-container" id="quiz-container">
        <!-- Questions will be injected here via JS -->
    </div>

    <button id="submit-btn" onclick="showResult()">NỘP BÀI & XEM ĐIỂM</button>

    <div class="footer">
        Designed with ❤️ for Students
    </div>

    <!-- Modal Result -->
    <div class="modal-overlay" id="result-modal">

            <div class="score-circle" id="final-score">0/0</div>
            <div class="modal-msg" id="modal-msg">Tuyệt vời!</div>
            <p class="modal-desc" id="modal-desc">Em đã hoàn thành xuất sắc bài kiểm tra.</p>
            <button class="close-btn" onclick="closeModal()">Xem lại bài làm</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

        let score = 0;
        const totalQuestions = quizData.length;
        let answeredCount = 0;

        // --- SOUND EFFECTS (Base64) ---
        // Short Ding Sound
        const sndCorrect = new Audio("data:audio/wav;base64,UklGRi4AAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAACAgICAQEBAYEAAYAAAAAA"); 
        // Note: Real mp3s are too long for data URI in this context, using simulated beep logic below for reliability
        
        function playSound(type) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        }

        // --- RENDER QUIZ ---
        const container = document.getElementById('quiz-container');

        // Helper to format rationale text
        function formatRationale(text) {
            if (!text) return "Chưa có giải thích.";
            // Highlight specific keywords
            let formatted = text
                .replace(/\n/g, '<br>')
                .replace(/Phân tích:/g, '<strong>Phân tích:</strong>')
                .replace(/Dịch câu:/g, '<br><strong>Dịch câu:</strong>')
                .replace(/Giải thích:/g, '<br><strong>Giải thích:</strong>')
                .replace(/Sai\./g, '<strong>Sai.</strong>')
                .replace(/Đúng\./g, '<strong>Đúng.</strong>');
            return formatted;
        }

        function renderQuiz() {
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                // Question Header
                const badge = document.createElement('div');
                badge.className = 'question-badge';
                badge.innerText = `Câu hỏi ${item.questionNumber}`;
                card.appendChild(badge);

                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                // Replace "______" with a styled blank if needed, or leave as is
                qText.innerText = item.question;
                card.appendChild(qText);

                // Options Grid
                const grid = document.createElement('div');
                grid.className = 'options-grid';

                item.answerOptions.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.id = `btn-${index}-${optIndex}`;
                    btn.onclick = () => checkAnswer(index, optIndex, opt.isCorrect, opt.rationale);
                    
                    const label = document.createElement('div');
                    label.className = 'option-label';
                    label.innerText = String.fromCharCode(65 + optIndex); // A, B, C, D
                    
                    const textSpan = document.createElement('span');
                    textSpan.innerText = opt.text;

                    btn.appendChild(label);
                    btn.appendChild(textSpan);
                    grid.appendChild(btn);
                });
                card.appendChild(grid);

                // Explanation Box (Hidden initially)
                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp-${index}`;
                expBox.innerHTML = `
                    <div class="exp-header">
                        <span>👩‍🏫 Giải thích chi tiết từ Ms MS Chí Nên:</span>
                    </div>
                    <div class="exp-content" id="exp-text-${index}"></div>
                `;
                card.appendChild(expBox);

                container.appendChild(card);
            });
        }

        function checkAnswer(qIndex, optIndex, isCorrect, rationale) {
            const btns = document.querySelectorAll(`#q-card-${qIndex} .option-btn`);
            const selectedBtn = document.getElementById(`btn-${qIndex}-${optIndex}`);
            
            // Prevent re-clicking
            if (selectedBtn.disabled) return;

            // Disable all buttons in this card
            btns.forEach(btn => btn.disabled = true);

            const expBox = document.getElementById(`exp-${qIndex}`);
            const expText = document.getElementById(`exp-text-${qIndex}`);
            
            // Format rationale properly
            // Find the rationale of the SELECTED option + general rationale if needed
            // But the design requires showing the rationale for why the selected is right/wrong
            // The JSON has 'rationale' attached to each option. 
            // If the user selects a wrong answer, we should show WHY that is wrong, AND also show the Correct answer rationale.
            // Let's combine them for maximum learning value.
            
            let combinedRationale = "";
            const correctOption = quizData[qIndex].answerOptions.find(o => o.isCorrect);

            if (isCorrect) {
                // User is correct
                selectedBtn.classList.add('correct');
                playSound('correct');
                fireConfetti();
                score++;
                combinedRationale = rationale; // The rationale from the correct option is usually the full explanation
            } else {
                // User is wrong
                selectedBtn.classList.add('wrong');
                playSound('wrong');
                
                // Highlight the correct answer automatically
                const correctBtnIndex = quizData[qIndex].answerOptions.findIndex(o => o.isCorrect);
                document.getElementById(`btn-${qIndex}-${correctBtnIndex}`).classList.add('correct');

                combinedRationale = `<strong>Bạn chọn: ${quizData[qIndex].answerOptions[optIndex].text}</strong> - ${rationale}<hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;"><strong>Đáp án đúng: ${correctOption.text}</strong> - ${correctOption.rationale}`;
            }

            // Show explanation
            expText.innerHTML = formatRationale(combinedRationale);
            expBox.style.display = 'block';

            answeredCount++;
        }

        function showResult() {
            if (answeredCount < totalQuestions) {
                if(!confirm(`Em mới làm ${answeredCount}/${totalQuestions} câu. Em có chắc chắn muốn nộp bài không?`)) return;
            }

            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('final-score');
            const msgDisplay = document.getElementById('modal-msg');
            const descDisplay = document.getElementById('modal-desc');

            scoreDisplay.innerText = `${score}/${totalQuestions}`;
            modal.style.display = 'flex';

            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                msgDisplay.innerText = "Xuất sắc! 🌟";
                descDisplay.innerText = "Em là bậc thầy về môi trường! Cô MS Chí Nên rất tự hào.";
                fireConfetti();
            } else if (percentage >= 80) {
                msgDisplay.innerText = "Làm tốt lắm! 🎉";
                descDisplay.innerText = "Kiến thức của em rất vững. Cố gắng thêm chút nữa nhé!";
            } else if (percentage >= 50) {
                msgDisplay.innerText = "Cố gắng lên! 💪";
                descDisplay.innerText = "Em hãy xem lại phần giải thích chi tiết để hiểu rõ hơn nhé.";
            } else {
                msgDisplay.innerText = "Đừng nản chí! 🌱";
                descDisplay.innerText = "Học tập là một quá trình. Hãy ôn lại từ vựng và làm lại bài nhé.";
            }
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // --- CONFETTI LOGIC ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = 100;
            const colors = ['#8854C0', '#00C9A7', '#FF4757', '#F1C40F'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    vx: Math.random() * 4 - 2,
                    vy: Math.random() * 4 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4
                });
            }

            let animationId;
            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let activeParticles = 0;
                
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.y < canvas.height) {
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                        activeParticles++;
                    }
                });

                if (activeParticles > 0) {
                    animationId = requestAnimationFrame(update);
                }
            }
            update();
        }

        // Initialize
        renderQuiz();

    </script>
