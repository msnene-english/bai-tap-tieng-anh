    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f4f8;
            background-image: radial-gradient(#8854C0 1px, transparent 1px), radial-gradient(#00C9A7 1px, transparent 1px);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
        }

        /* 3D Button Styles */
        .btn-option {
            transition: all 0.1s;
            border-bottom: 5px solid #d1d5db; /* Default shadow color */
            transform: translateY(0);
        }

        .btn-option:active {
            transform: translateY(4px);
            border-bottom: 1px solid #d1d5db;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(105%);
        }

        /* Correct State */
        .btn-correct {
            background-color: #00D26A !important;
            border-color: #00B359 !important; /* Darker green border */
            color: white !important;
            border-bottom: 5px solid #009e4f !important;
        }

        /* Wrong State */
        .btn-wrong {
            background-color: #FF4757 !important;
            border-color: #FF2E40 !important;
            color: white !important;
            border-bottom: 5px solid #cc3946 !important;
        }

        /* Shake Animation */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            50% { transform: translateX(5px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #8854C0; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6c429c; 
        }

        /* Explanation Box */
        .explanation-box {
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .glossary-table th, .glossary-table td {
            border: 1px solid #e2e8f0;
            padding: 8px;
        }
    </style>
</head>

        // === LOGIC XỬ LÝ ===
        let score = 0;
        const totalQuestions = quizData.length;
        const soundCorrect = document.getElementById("sound-correct");
        const soundWrong = document.getElementById("sound-wrong");

        // Hàm render câu hỏi
        function renderQuiz() {
            const container = document.getElementById("quiz-container");
            container.innerHTML = ""; // Clear existing

            quizData.forEach((q, index) => {
                // Tạo thẻ Card
                const card = document.createElement("div");
                card.className = "bg-white rounded-3xl shadow-[0_8px_0_rgba(0,0,0,0.1)] p-6 md:p-8 border-2 border-gray-100 relative overflow-hidden";
                card.id = `card-${index}`;

                // Số thứ tự câu hỏi
                const questionNumber = document.createElement("div");
                questionNumber.className = "absolute top-0 left-0 bg-[#8854C0] text-white font-bold py-1 px-4 rounded-br-2xl text-sm";
                questionNumber.innerText = `Câu ${q.id}`;
                card.appendChild(questionNumber);

                // Nội dung câu hỏi
                const questionText = document.createElement("h3");
                questionText.className = "text-xl font-bold text-gray-800 mt-4 mb-6 leading-relaxed";
                questionText.innerText = q.question;
                card.appendChild(questionText);

                // Grid đáp án
                const optionsGrid = document.createElement("div");
                optionsGrid.className = "grid grid-cols-1 md:grid-cols-2 gap-4";

                q.options.forEach((opt, optIndex) => {
                    const btn = document.createElement("button");
                    btn.className = "btn-option w-full bg-white border-2 border-gray-200 rounded-xl p-4 text-left font-semibold text-gray-700 hover:bg-gray-50 focus:outline-none";
                    btn.innerText = opt.text;
                    btn.onclick = () => checkAnswer(index, optIndex, btn, q.options);
                    btn.id = `q${index}-opt${optIndex}`;
                    optionsGrid.appendChild(btn);
                });
                card.appendChild(optionsGrid);

                // Khu vực giải thích (ẩn ban đầu)
                const explanationDiv = document.createElement("div");
                explanationDiv.id = `explanation-${index}`;
                explanationDiv.className = "explanation-box mt-6 bg-[#f0f9ff] border-l-4 border-[#00C9A7] p-5 rounded-r-xl";
                
                // Lấy rationale từ đáp án đúng
                const correctOption = q.options.find(o => o.isCorrect);
                let explanationContent = correctOption ? correctOption.rationale : "Chưa có giải thích.";
                
                // Format lại nội dung giải thích cho đẹp
                explanationContent = explanationContent
                    .replace(/Dịch nghĩa:/g, '<div class="font-bold text-[#8854C0] mb-1"><i class="fa-solid fa-language mr-2"></i>Dịch câu hỏi:</div>')
                    .replace(/Phân tích:/g, '<div class="font-bold text-[#8854C0] mt-3 mb-1"><i class="fa-solid fa-magnifying-glass mr-2"></i>Phân tích đáp án:</div>')
                    .replace(/Giải thích:/g, '<div class="font-bold text-[#8854C0] mt-3 mb-1"><i class="fa-solid fa-check-circle mr-2"></i>Tại sao chọn đáp án này?</div>')
                    .replace(/\n/g, '<br>');

                explanationDiv.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="mt-1 min-w-[30px]">
                            <img src="https://cdn-icons-png.flaticon.com/512/3429/3429402.png" alt="Teacher" class="w-8 h-8 rounded-full border border-[#8854C0]">
                        </div>
                        <div class="text-gray-700 text-base leading-relaxed">
                            <h4 class="font-bold text-[#00C9A7] mb-2 uppercase text-sm tracking-wide">Ms MS Chí Nên giải thích chi tiết:</h4>
                            ${explanationContent}
                        </div>
                    </div>
                `;
                card.appendChild(explanationDiv);

                container.appendChild(card);
            });
        }

        // Hàm kiểm tra đáp án
        function checkAnswer(questionIndex, selectedOptIndex, btnElement, options) {
            // Ngăn chặn chọn lại nếu đã trả lời
            if (btnElement.parentElement.getAttribute("data-answered") === "true") return;
            
            // Đánh dấu đã trả lời
            btnElement.parentElement.setAttribute("data-answered", "true");

            const isCorrect = options[selectedOptIndex].isCorrect;
            
            if (isCorrect) {
                // Xử lý ĐÚNG
                btnElement.classList.add("btn-correct");
                btnElement.innerHTML += ' <i class="fa-solid fa-check ml-2"></i>';
                
                // Âm thanh & Hiệu ứng
                soundCorrect.currentTime = 0;
                soundCorrect.play();
                triggerConfetti(btnElement);
                
                score++;
                updateScoreDisplay();
            } else {
                // Xử lý SAI
                btnElement.classList.add("btn-wrong", "shake-animation");
                btnElement.innerHTML += ' <i class="fa-solid fa-xmark ml-2"></i>';
                
                // Âm thanh
                soundWrong.currentTime = 0;
                soundWrong.play();

                // Highlight đáp án đúng
                const correctIndex = options.findIndex(o => o.isCorrect);
                const correctBtn = document.getElementById(`q${questionIndex}-opt${correctIndex}`);
                if (correctBtn) {
                    correctBtn.classList.add("ring-4", "ring-[#00D26A]", "ring-opacity-50");
                }
            }

            // Disable tất cả các nút trong câu này
            const allBtns = btnElement.parentElement.querySelectorAll("button");
            allBtns.forEach(btn => {
                btn.disabled = true;
                btn.classList.add("opacity-70", "cursor-not-allowed");
                // Giữ opacity 100 cho nút được chọn và nút đúng
                if (btn === btnElement || (isCorrect === false && options[Array.from(allBtns).indexOf(btn)].isCorrect)) {
                    btn.classList.remove("opacity-70");
                }
            });

            // Hiện giải thích
            const expBox = document.getElementById(`explanation-${questionIndex}`);
            expBox.style.display = "block";
        }

        function updateScoreDisplay() {
            document.getElementById("score-display").innerText = `${score}/${totalQuestions}`;
        }

        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            // Confetti bắn từ vị trí nút bấm
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { 
                    y: (rect.top + rect.height / 2) / window.innerHeight,
                    x: (rect.left + rect.width / 2) / window.innerWidth
                },
                colors: ['#8854C0', '#00C9A7', '#FFD700']
            });
        }

        function showFinalResult() {
            const modal = document.getElementById("result-modal");
            const finalScoreEl = document.getElementById("final-score");
            const finalMsgEl = document.getElementById("final-message");
            
            finalScoreEl.innerText = score;
            
            // Lời nhắn dựa trên điểm số
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                finalMsgEl.innerText = "Tuyệt vời! Bạn là thiên tài ngữ pháp! 🌟";
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
            } else if (percentage >= 80) {
                finalMsgEl.innerText = "Làm rất tốt! Chỉ sai một chút xíu thôi. 💪";
            } else if (percentage >= 50) {
                finalMsgEl.innerText = "Cố gắng lên! Hãy xem kỹ phần giải thích nhé. 📚";
            } else {
                finalMsgEl.innerText = "Đừng nản lòng! Làm lại để giỏi hơn nào. 🔥";
            }

            modal.classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("result-modal").classList.add("hidden");
            // Cuộn lên đầu trang
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Khởi chạy khi load trang
        window.onload = renderQuiz;

    </script>
</body>
</html>
