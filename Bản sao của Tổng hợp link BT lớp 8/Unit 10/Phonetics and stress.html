<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --success-green: #00D26A;
            --error-red: #FF4757;
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E0EAFC;
            background-image: repeating-linear-gradient(45deg, #E0EAFC 0px, #E0EAFC 20px, #CFDEF3 20px, #CFDEF3 40px);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 4px solid var(--primary-purple);
            max-width: 800px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        .header-title {
            color: var(--primary-purple);
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-top: 5px;
            font-weight: 700;
        }

        .teacher-badge {
            display: inline-block;
            background: var(--primary-teal);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Quiz Container */
        .quiz-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            position: relative;
            transition: transform 0.3s ease;
            border: 2px solid transparent;
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }

        .q-number {
            background: var(--primary-purple);
            color: white;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            flex-shrink: 0;
            box-shadow: 0 4px 0 #6a3da1;
        }

        .q-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            color: #34495e;
        }

        .q-text u {
            text-decoration: none;
            border-bottom: 3px solid var(--primary-purple);
            padding-bottom: 2px;
            color: var(--primary-purple);
            font-weight: 800;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 3px solid #e0e0e0;
            padding: 15px 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #555;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 0 #d0d0d0;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-purple);
            color: var(--primary-purple);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 0 0 #d0d0d0;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background: var(--success-green);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 5px 0 #008f47;
        }

        .option-btn.wrong {
            background: var(--error-red);
            color: white;
            border-color: #e03e4d;
            box-shadow: 0 5px 0 #c23642;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            background: #f0fdf4;
            border: 2px solid var(--success-green);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.wrong-bg {
            background: #fff5f5;
            border-color: var(--error-red);
        }

        .exp-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .exp-header.correct-text { color: var(--success-green); }
        .exp-header.wrong-text { color: var(--error-red); }

        .exp-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #444;
            white-space: pre-wrap; /* Preserve newlines from JSON */
        }
        
        .exp-content b, .exp-content strong {
            color: var(--primary-purple);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer / Submit */
        .footer-controls {
            margin-top: 40px;
            text-align: center;
            padding-bottom: 50px;
            width: 100%;
        }

        .btn-submit {
            background: var(--primary-teal);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #009e82;
            transition: all 0.2s;
            font-family: 'Quicksand', sans-serif;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            transform: scale(1.05);
            background: #00dcb7;
        }

        .btn-submit:active {
            transform: scale(0.95) translateY(8px);
            box-shadow: 0 0 0;
        }
        
        /* Score Popup */
        .score-popup {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .score-popup.active {
            visibility: visible;
            opacity: 1;
        }
        
        .score-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 8px solid var(--primary-purple);
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .score-big {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary-purple);
            margin: 10px 0;
        }
        
        .score-msg {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .q-text { font-size: 1.1rem; }
            .header-title { font-size: 1.5rem; }
            .option-btn { font-size: 1rem; padding: 12px 15px; }
        }
    </style>
</head>

    // LOGIC
    let score = 0;
    const totalQuestions = quizData.questions.length;
    let questionsAnswered = 0;

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        
        quizData.questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${index}`;

            // Determine A, B, C, D text for display
            const labels = ['A', 'B', 'C', 'D'];
            
            // Format Explanation Text
            // Note: In the source data, the correct answer option holds the rationale text.
            const correctOption = q.answerOptions.find(opt => opt.isCorrect);
            const explanationText = correctOption ? correctOption.rationale : "Giải thích đang được cập nhật.";

            // Options HTML
            let optionsHTML = '<div class="options-grid">';
            q.answerOptions.forEach((opt, optIndex) => {
                // Ensure specific options match A, B, C, D order as per question text if possible, 
                // but here data is unstructured list. We map roughly. 
                // Wait, the data has options list. We should just display them.
                // However, the question text says "A. language B. cultural...". 
                // The answerOptions array contains objects with 'text'. 
                // We need to match the text to the label.
                
                // Let's rely on the text content to match visuals or just list them.
                // The provided JSON separates options cleanly.
                
                optionsHTML += `
                    <button class="option-btn" 
                        onclick="checkAnswer(${index}, ${optIndex}, this, ${opt.isCorrect})">
                        ${labels[optIndex]}. ${opt.text}
                    </button>
                `;
            });
            optionsHTML += '</div>';

            card.innerHTML = `
                <div class="question-header">
                    <div class="q-number">${q.questionNumber}</div>
                    <div class="q-text">${q.question}</div>
                </div>
                ${optionsHTML}
                <div class="explanation-box" id="exp-${index}">
                    <div class="exp-header" id="exp-header-${index}">
                        <!-- Icon and Text injected via JS -->
                    </div>
                    <div class="exp-content">
                        ${explanationText}
                    </div>
                </div>
            `;
            
            container.appendChild(card);
        });
    }

    function checkAnswer(qIndex, optIndex, btnElement, isCorrect) {
        // Prevent re-answering
        const card = document.getElementById(`q-card-${qIndex}`);
        if (card.classList.contains('answered')) return;
        
        card.classList.add('answered');
        questionsAnswered++;
        
        const allBtns = card.querySelectorAll('.option-btn');
        const expBox = document.getElementById(`exp-${qIndex}`);
        const expHeader = document.getElementById(`exp-header-${qIndex}`);
        
        // Disable all buttons
        allBtns.forEach(btn => btn.disabled = true);

        if (isCorrect) {
            score++;
            btnElement.classList.add('correct');
            playSound('correct');
            triggerConfetti(btnElement);
            
            expHeader.className = "exp-header correct-text";
            expHeader.innerHTML = "🎉 Chính xác! Cô MS Chí Nên giải thích chi tiết:";
            expBox.classList.remove('wrong-bg');
        } else {
            btnElement.classList.add('wrong');
            playSound('wrong');
            
            // Highlight the correct one
            // We need to find which button was actually correct.
            // In init, we attached isCorrect to the onclick. We can check the data again or attribute.
            // Let's loop buttons and find the one that corresponds to correct answer in data
            // Or easier: pass index to this function.
            
            // Find correct index from data
            const correctOptIndex = quizData.questions[qIndex].answerOptions.findIndex(o => o.isCorrect);
            allBtns[correctOptIndex].classList.add('correct');

            expHeader.className = "exp-header wrong-text";
            expHeader.innerHTML = "⚠️ Tiếc quá! Xem cô MS Chí Nên giải thích nhé:";
            expBox.classList.add('wrong-bg');
        }

        // Show Explanation
        expBox.style.display = 'block';
    }

    function playSound(type) {
        const soundMap = {
            'correct': 'sound-correct',
            'wrong': 'sound-wrong',
            'finish': 'sound-finish'
        };
        const audio = document.getElementById(soundMap[type]);
        if(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio play blocked (needs user interaction first)"));
        }
    }

    function triggerConfetti(element) {
        const rect = element.getBoundingClientRect();
        // Normalize coordinates to 0-1 range for canvas-confetti
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        confetti({
            particleCount: 60,
            spread: 70,
            origin: { x: x, y: y },
            colors: ['#8854C0', '#00C9A7', '#FF4757', '#F1C40F']
        });
    }

    function finishQuiz() {
        if (questionsAnswered < totalQuestions) {
            if(!confirm(`Bạn mới làm ${questionsAnswered}/${totalQuestions} câu. Bạn có chắc chắn muốn nộp bài không?`)) {
                return;
            }
        }
        
        playSound('finish');
        confetti({
            particleCount: 150,
            spread: 100,
            origin: { y: 0.6 }
        });

        const scorePopup = document.getElementById('score-popup');
        const finalScoreEl = document.getElementById('final-score');
        const msgEl = document.getElementById('score-message');

        finalScoreEl.innerText = `${score}/${totalQuestions}`;
        
        const percentage = (score / totalQuestions) * 100;
        if (percentage === 100) msgEl.innerText = "Xuất sắc! Bạn là thiên tài Ngữ âm! 🏆";
        else if (percentage >= 80) msgEl.innerText = "Giỏi lắm! Cố gắng thêm chút nữa là hoàn hảo! 🌟";
        else if (percentage >= 50) msgEl.innerText = "Khá tốt! Hãy xem lại phần giải thích để hiểu rõ hơn nhé. 💪";
        else msgEl.innerText = "Đừng buồn! Hãy ôn tập kỹ phần giải thích của cô MS Chí Nên nhé. 📚";

        scorePopup.classList.add('active');
    }

    function closePopup() {
        document.getElementById('score-popup').classList.remove('active');
        // Optional: Scroll to top or review mode
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Start
    window.onload = initQuiz;

</script>
