<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Thiên tai (Disasters) - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Tím */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --background: #f0f3f5;
            --card-bg: #ffffff;
            --text-main: #2f3542;
            --text-light: #57606f;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--background);
            background-image: radial-gradient(#dcdde1 15%, transparent 16%), radial-gradient(#dcdde1 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        h1 {
            color: var(--primary);
            font-weight: 800;
            font-size: 2.2rem;
            margin: 0;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.1);
        }

        h3 {
            color: var(--text-light);
            font-weight: 600;
            margin-top: 5px;
            font-size: 1.1rem;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Card Style */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #eee;
            position: relative;
            transition: transform 0.3s;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px dashed #f1f2f6;
            padding-bottom: 10px;
        }

        .q-tag {
            background: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e4e8;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            box-shadow: 0 5px 0 #d1d8e0;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:active {
            box-shadow: 0 2px 0 #d1d8e0;
            transform: translateY(3px);
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f7f9fa;
            transform: scale(1.02);
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 5px 0 #008f47;
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: #ff2e40;
            box-shadow: 0 5px 0 #d61e30;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
            transform: none !important;
        }

        /* Explanation Box */
        .explanation-box {
            display: none;
            margin-top: 20px;
            background-color: #f8f0fc;
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            animation: slideDown 0.5s ease;
        }

        .explanation-header {
            color: var(--primary);
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #4b4b4b;
            white-space: pre-wrap; /* Preserve line breaks from JSON */
        }

        /* Footer / Submit */
        .footer-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 30px;
            box-shadow: 0 6px 0 #5f2a9e;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .submit-btn:active {
            box-shadow: 0 3px 0 #5f2a9e;
            transform: translateY(3px);
        }

        .score-display {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Result Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: popIn 0.5s;
            border: 5px solid var(--secondary);
        }

        .final-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .feedback-text {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 30px;
        }

    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="header-container">
        <h1>BÀI KIỂM TRA THIÊN TAI (DISASTERS)</h1>
        <h3>Giáo viên tạo: Ms. Chí Nên</h3>
    </div>

    <div class="quiz-container" id="quiz-area">
        <!-- Questions will be injected here via JS -->
    </div>

    <div class="footer-controls">
        <div class="score-display">Đã làm: <span id="progress-text">0</span>/<span id="total-text">0</span></div>
        <button class="submit-btn" onclick="finishQuiz()">NỘP BÀI</button>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2 style="color: var(--secondary); font-weight: 800;">TỔNG KẾT</h2>
            <div class="final-score" id="final-score-display">0/0</div>
            <p class="feedback-text" id="feedback-msg">Bạn đã làm rất tốt!</p>
            <button class="submit-btn" onclick="location.reload()">LÀM LẠI</button>
        </div>
    </div>

    <script>
        // --- DATA SOURCE (Embed from input) ---
        const quizData = [
            {
                "questionNumber": 1,
                "question": "Exercise 2 - Q1: The _______ blew lava and ash into the sky.",
                "answerOptions": [
                    { "text": "volcanic eruption", "rationale": "Dịch đáp án:\nA. volcanic eruption (noun phrase): sự phun trào núi lửa\nB. earthquake (noun): động đất\nC. tornado (noun): lốc xoáy\nD. tsunami (noun): sóng thần\n\nGiải thích: Từ khóa 'lava and ash' (dung nham và tro bụi) là đặc điểm của núi lửa phun trào.\n\nDịch câu: Vụ phun trào núi lửa đã thổi dung nham và tro bụi lên bầu trời.", "isCorrect": true },
                    { "text": "earthquake", "isCorrect": false, "rationale": "Sai. Động đất gây rung lắc, không phun dung nham." },
                    { "text": "tornado", "isCorrect": false, "rationale": "Sai. Lốc xoáy là gió, không có dung nham." },
                    { "text": "tsunami", "isCorrect": false, "rationale": "Sai. Sóng thần liên quan đến nước." }
                ]
            },
            {
                "questionNumber": 2,
                "question": "Exercise 2 - Q2: The _______ with strong winds darkened the sky and rattled the windows.",
                "answerOptions": [
                    { "text": "storm", "rationale": "Dịch đáp án:\nA. wildfire (noun): cháy rừng\nB. storm (noun): cơn bão\nC. flood (noun): lũ lụt\nD. drought (noun): hạn hán\n\nGiải thích: Từ khóa 'strong winds' (gió mạnh), 'darkened the sky' (làm tối bầu trời) và 'rattled the windows' (làm rung cửa sổ) miêu tả một cơn bão.\n\nDịch câu: Cơn bão với gió mạnh làm tối sầm bầu trời và làm rung chuyển các cửa sổ.", "isCorrect": true },
                    { "text": "wildfire", "isCorrect": false, "rationale": "Sai. Cháy rừng gây khói lửa, không đặc trưng bởi gió làm tối trời theo cách này." },
                    { "text": "flood", "isCorrect": false, "rationale": "Sai. Lũ lụt là nước dâng." },
                    { "text": "drought", "isCorrect": false, "rationale": "Sai. Hạn hán là thiếu nước." }
                ]
            },
            {
                "questionNumber": 3,
                "question": "Exercise 2 - Q3: The sudden _______ caused the buildings to shake and people to run for cover.",
                "answerOptions": [
                    { "text": "earthquake", "rationale": "Dịch đáp án:\nA. earthquake (noun): động đất\nB. landslide (noun): sạt lở đất\nC. tsunami (noun): sóng thần\nD. flood (noun): lũ lụt\n\nGiải thích: Từ khóa 'buildings to shake' (các tòa nhà rung lắc) là dấu hiệu rõ nhất của động đất.\n\nDịch câu: Trận động đất bất ngờ khiến các tòa nhà rung chuyển và mọi người chạy đi tìm chỗ trú ẩn.", "isCorrect": true },
                    { "text": "landslide", "isCorrect": false, "rationale": "Sai. Sạt lở đất là đất đá rơi xuống, thường không làm rung chuyển cả tòa nhà ở vùng bằng phẳng." },
                    { "text": "tsunami", "isCorrect": false, "rationale": "Sai. Sóng thần là nước biển dâng cao." },
                    { "text": "flood", "isCorrect": false, "rationale": "Sai." }

            {

                    { "text": "typhoon", "isCorrect": false, "rationale": "Sai. Typhoon là bão diện rộng, không có hình dạng cái phễu (funnel)." },
                    { "text": "flood", "isCorrect": false, "rationale": "Sai." },
                    { "text": "drought", "isCorrect": false, "rationale": "Sai." }

            {

                    { "text": "landslide", "rationale": "Dịch đáp án:\nA. landslide (noun): sạt lở đất\nB. drought (noun): hạn hán\nC. volcanic eruption (noun phrase): phun trào núi lửa\nD. storm (noun): cơn bão\n\nGiải thích: Từ khóa 'rocks and soil falling down the hillside' (đá và đất rơi xuống sườn đồi) miêu tả sạt lở đất.\n\nDịch câu: Mưa lớn gây ra một vụ sạt lở đất, khiến đá và đất rơi xuống sườn đồi.", "isCorrect": true },
                    { "text": "drought", "isCorrect": false, "rationale": "Sai. Hạn hán là do thiếu mưa." },

                    { "text": "burst", "isCorrect": false, "rationale": "Sai ngữ cảnh." },
                    { "text": "discharge", "isCorrect": false, "rationale": "Sai ngữ cảnh." }

            {
                "questionNumber": 8,

        // Better Sound synthesis using Web Audio API for consistency without external files
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // High pitch Ding
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                // Low pitch Buzz
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function initQuiz() {
            const quizArea = document.getElementById('quiz-area');
            document.getElementById('total-text').innerText = totalQuestions;

            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${index}`;

                // Header
                let qNumber = `Câu ${index + 1}`;
                if(item.question.includes("Exercise 2")) qNumber = `Bài 2 - Câu ${item.questionNumber}`;
                if(item.question.includes("Exercise 3")) qNumber = `Bài 3 - Câu ${item.questionNumber}`;
                
                // Question Text (Handling placeholders)
                const displayText = item.question.replace("Exercise 2 - Q" + item.questionNumber + ": ", "").replace("Exercise 3 - Q" + item.questionNumber + ": ", "");

                // Options HTML
                // Find correct answer index
                const correctIndex = item.answerOptions.findIndex(opt => opt.isCorrect);

                let optionsHtml = '';
                item.answerOptions.forEach((opt, optIndex) => {
                    // Create a composite value to check: isCorrect
                    optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect})">${String.fromCharCode(65+optIndex)}. ${opt.text}</button>`;
                });

                // Explanation text
                const rationale = item.answerOptions.find(opt => opt.isCorrect)?.rationale || "Đang cập nhật...";

                card.innerHTML = `
                    <div class="question-header">
                        <span class="q-tag">${qNumber}</span>
                    </div>
                    <div class="question-text">${displayText}</div>
                    <div class="options-grid" id="options-${index}">

        function checkAnswer(cardIndex, btnIndex, isCorrect) {
            const optionsContainer = document.getElementById(`options-${cardIndex}`);
            const buttons = optionsContainer.getElementsByClassName('option-btn');
            
            // If already answered, do nothing
            if(optionsContainer.dataset.answered === "true") return;

            optionsContainer.dataset.answered = "true";
            answeredCount++;
            document.getElementById('progress-text').innerText = answeredCount;

            const selectedBtn = buttons[btnIndex];

            if (isCorrect) {
                // Correct
                selectedBtn.classList.add('correct');
                playSound('correct');
                triggerConfetti();
                score++;
            } else {
                // Wrong
                selectedBtn.classList.add('wrong');
                playSound('wrong');
                
                // Highlight the correct answer automatically
                const dataItem = quizData[cardIndex];
                const correctBtnIndex = dataItem.answerOptions.findIndex(o => o.isCorrect);
                if(correctBtnIndex !== -1) {
                    buttons[correctBtnIndex].classList.add('correct');
                }
            }

            // Disable all buttons
            for (let btn of buttons) {
                btn.disabled = true;
            }

            // Show explanation
            document.getElementById(`explain-${cardIndex}`).style.display = 'block';
        }

        function finishQuiz() {
            if(answeredCount < totalQuestions) {
                const confirmMsg = confirm(`Bạn mới làm ${answeredCount}/${totalQuestions} câu. Bạn có chắc chắn muốn nộp bài không?`);
                if(!confirmMsg) return;
            }

            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('final-score-display');
            const feedback = document.getElementById('feedback-msg');

            scoreDisplay.innerText = `${score}/${totalQuestions}`;

            const percentage = (score / totalQuestions) * 100;
            if(percentage === 100) {
                feedback.innerText = "Xuất sắc! Bạn là thiên tài ngữ pháp! 🌟";
                triggerConfetti();
            } else if (percentage >= 80) {
                feedback.innerText = "Làm tốt lắm! Chỉ một chút nữa là hoàn hảo! 🔥";
            } else if (percentage >= 50) {
                feedback.innerText = "Khá tốt, nhưng hãy xem lại phần giải thích kỹ hơn nhé! 📚";
            } else {
                feedback.innerText = "Đừng buồn, hãy ôn tập lại từ vựng và thử lại nhé! 💪";
            }

            modal.style.display = 'flex';
        }

        // --- Simple Confetti Logic ---
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD700', '#00D26A'];

            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    vx: Math.random() * 4 - 2,
                    vy: Math.random() * 5 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4
                });
            }

            let animationId;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.y < canvas.height) active = true;
                    
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });

                if (active) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animate();
            
            // Stop after 2 seconds to save resources
            setTimeout(() => cancelAnimationFrame(animationId), 2000);
        }

        // Initialize
        window.onload = initQuiz;

    </script>
</body>
</html>
