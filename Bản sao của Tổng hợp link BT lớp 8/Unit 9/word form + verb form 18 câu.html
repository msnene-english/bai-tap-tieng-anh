<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms MS Chí Nên - Disasters Word Form Challenge</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #8854C0; /* Tím hồng */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #f0f3f8;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1ccc0 1px, transparent 1px), radial-gradient(#d1ccc0 1px, transparent 1px);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(136, 84, 192, 0.4);
            color: white;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            margin: 10px 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Quiz Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px var(--shadow-color);
            border-bottom: 6px solid #e1e1e1;
            transition: transform 0.3s ease;
            position: relative;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-badge {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #f1f2f6;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 0 #d1d8e0;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: white;
            border-color: var(--secondary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #d1d8e0;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 4px 0 #009e4f;
            animation: pulse 0.5s;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #ff3f34;
            box-shadow: 0 4px 0 #d63031;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
            transform: none !important;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            background-color: #f0fcf6;
            border: 2px solid var(--secondary-color);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-header::before {
            content: '👩‍🏫';
            font-size: 1.5rem;
        }

        .explanation-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
            white-space: pre-wrap; /* Keeps formatting */
        }

        /* Formatting within explanation */
        .explanation-content strong {
            color: #2f3542;
            background: #dfe6e9;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Submit Button */
        .submit-container {
            text-align: center;
            margin-top: 30px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff9f43, #ee5253);
            color: white;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b33939;
            transition: transform 0.2s;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #b33939;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-2deg); }
            50% { transform: translateX(8px) rotate(2deg); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal Score */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top: 10px solid var(--secondary-color);
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .feedback-text {
            font-size: 1.2rem;
            color: #57606f;
            margin-bottom: 20px;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Ms MS Chí Nên</h1>
            <p>Bài tập Tiếng Anh: Word Form & Verb Form (Chủ đề Disasters)</p>
        </header>

        <div id="quiz-container">
            <!-- Questions will be injected here via JavaScript -->
        </div>

        <div class="submit-container">
            <button class="submit-btn" onclick="finishQuiz()">Nộp Bài & Xem Điểm</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2>Kết Quả Của Bạn</h2>
            <div class="score-display" id="final-score">0/0</div>
            <p class="feedback-text" id="feedback-msg">Bạn làm tốt lắm!</p>
            <button class="submit-btn" onclick="closeModal()" style="font-size: 1rem; padding: 10px 30px;">Làm Lại</button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

    <script>
        // DATA SOURCE (From User Input)
        const quizData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "Exercise 5 - Q1: They made an accurate _______________ about the path of the storm. (predict)",
              "answerOptions": [
                {
                  "text": "prediction",
                  "rationale": "Dịch đáp án:\nA. prediction (noun): sự dự đoán\nB. predict (verb): dự đoán\nC. predictable (adj): có thể dự đoán được\nD. predictably (adv): một cách có thể dự đoán\n\nGiải thích: Sau tính từ 'accurate' (chính xác), ta cần một Danh từ để tạo thành cụm danh từ làm tân ngữ cho động từ 'made'.\n\nDịch câu: Họ đã đưa ra một dự đoán chính xác về đường đi của cơn bão.",
                  "isCorrect": true
                },
                { "text": "predict", "isCorrect": false, "rationale": "Sai từ loại (Động từ)." },
                { "text": "predictable", "isCorrect": false, "rationale": "Sai từ loại (Tính từ)." },
                { "text": "predictably", "isCorrect": false, "rationale": "Sai từ loại (Trạng từ)." }
              ]
            },
            {
              "questionNumber": 2,
              "question": "Exercise 5 - Q2: We were having dinner when our building started _______________. (tremble)",
              "answerOptions": [
                {
                  "text": "to tremble",
                  "rationale": "Dịch đáp án:\nA. to tremble (to-infinitive): rung lắc\nB. tremble (verb): rung lắc\nC. trembled (verb-ed): đã rung lắc\nD. trembling (gerund): việc rung lắc\n\nGiải thích: Sau động từ 'start', ta có thể dùng 'to V' hoặc 'V-ing'. Tuy nhiên, trong ngữ cảnh tòa nhà bắt đầu rung chuyển (hành động cụ thể), 'to tremble' hoặc 'trembling' đều được. Trong trắc nghiệm nếu có cả 2 thì thường chọn V-ing cho hành động đang diễn ra hoặc to-V cho sự khởi đầu. Ở đây ưu tiên cấu trúc 'start to V' hoặc 'start V-ing'. (Lưu ý: Nếu đáp án có 'trembling' cũng đúng, nhưng ở đây tôi để 'to tremble' là đáp án tối ưu nhất trong các lựa chọn đưa ra).\n\nDịch câu: Chúng tôi đang ăn tối thì tòa nhà của chúng tôi bắt đầu rung chuyển.",
                  "isCorrect": true
                },
                { "text": "tremble", "isCorrect": false, "rationale": "Sai ngữ pháp (Start không đi trực tiếp với V nguyên thể)." },
                { "text": "trembled", "isCorrect": false, "rationale": "Sai thì." },
                { "text": "trembles", "isCorrect": false, "rationale": "Sai thì." }
              ]
            },
            {
              "questionNumber": 3,
              "question": "Exercise 5 - Q3: An earthquake _______________ the area of Sumatra in Indonesia in 2005. (destroy)",
              "answerOptions": [
                {
                  "text": "destroyed",
                  "rationale": "Dịch đáp án:\nA. destroyed (verb - past): đã phá hủy\nB. destruction (noun): sự phá hủy\nC. destructive (adj): có tính phá hủy\nD. destroys (verb - present): phá hủy\n\nGiải thích: Dấu hiệu thời gian 'in 2005' (quá khứ) -> Cần động từ chia ở thì Quá khứ đơn.\n\nDịch câu: Một trận động đất đã phá hủy khu vực Sumatra ở Indonesia vào năm 2005.",
                  "isCorrect": true
                },
                { "text": "destruction", "isCorrect": false, "rationale": "Sai từ loại (Danh từ)." },
                { "text": "destructive", "isCorrect": false, "rationale": "Sai từ loại (Tính từ)." },
                { "text": "destroys", "isCorrect": false, "rationale": "Sai thì (Hiện tại đơn)." }
              ]
            },
            {
              "questionNumber": 4,
              "question": "Exercise 5 - Q4: The rescue _______________ set up a camp to provide shelter for the flood victims. (work)",
              "answerOptions": [
                {
                  "text": "workers",
                  "rationale": "Dịch đáp án:\nA. workers (noun): những người công nhân/nhân viên\nB. working (verb-ing/adj): đang làm việc\nC. work (verb/noun): làm việc/công việc\nD. worked (verb-ed): đã làm việc\n\nGiải thích: Cụm từ 'rescue workers' (nhân viên cứu hộ). Cần danh từ chỉ người số nhiều (để phù hợp với động từ 'set up' - dù quá khứ hay hiện tại thì 'workers' là chủ ngữ hợp lý nhất cho hành động lập trại).\n\nDịch câu: Các nhân viên cứu hộ đã dựng trại để cung cấp chỗ trú ẩn cho các nạn nhân lũ lụt.",
                  "isCorrect": true
                },
                { "text": "working", "isCorrect": false, "rationale": "Sai từ loại." },
                { "text": "work", "isCorrect": false, "rationale": "Sai nghĩa (công việc cứu hộ không tự dựng trại được, phải là người)." },
                { "text": "worked", "isCorrect": false, "rationale": "Sai từ loại." }
              ]
            },
            {
              "questionNumber": 5,
              "question": "Exercise 5 - Q5: Some _______________ disasters, such as landslides, usually happen in mountainous areas. (nature)",
              "answerOptions": [
                {
                  "text": "natural",
                  "rationale": "Dịch đáp án:\nA. natural (adj): thuộc về tự nhiên\nB. nature (noun): thiên nhiên\nC. naturally (adv): một cách tự nhiên\nD. naturalize (verb): tự nhiên hóa\n\nGiải thích: Trước danh từ 'disasters' (thảm họa), cần một Tính từ để bổ nghĩa. 'Natural disasters' = Thảm họa thiên nhiên.\n\nDịch câu: Một số thảm họa thiên nhiên, chẳng hạn như sạt lở đất, thường xảy ra ở các vùng núi.",
                  "isCorrect": true
                },
                { "text": "nature", "isCorrect": false, "rationale": "Sai từ loại (Danh từ)." },
                { "text": "naturally", "isCorrect": false, "rationale": "Sai từ loại (Trạng từ)." },
                { "text": "naturalize", "isCorrect": false, "rationale": "Sai từ loại (Động từ)." }
              ]
            },
            {
              "questionNumber": 6,
              "question": "Exercise 5 - Q6: A _______________ eruption happens when there is an earthquake beneath the earth’s crust. (volcano)",
              "answerOptions": [
                {
                  "text": "volcanic",
                  "rationale": "Dịch đáp án:\nA. volcanic (adj): thuộc núi lửa\nB. volcano (noun): núi lửa\nC. volcanically (adv): một cách liên quan đến núi lửa\nD. volcanoes (noun plural): những ngọn núi lửa\n\nGiải thích: Trước danh từ 'eruption' (sự phun trào), cần một Tính từ bổ nghĩa. 'Volcanic eruption' = Sự phun trào núi lửa.\n\nDịch câu: Một vụ phun trào núi lửa xảy ra khi có động đất bên dưới lớp vỏ trái đất.",
                  "isCorrect": true
                },
                { "text": "volcano", "isCorrect": false, "rationale": "Sai từ loại (Danh từ - dù tiếng Việt hay gọi tắt là phun trào núi lửa nhưng tiếng Anh dùng tính từ)." },
                { "text": "volcanically", "isCorrect": false, "rationale": "Sai từ loại (Trạng từ)." },
                { "text": "volcanoes", "isCorrect": false, "rationale": "Sai từ loại." }
              ]
            },
            {
              "questionNumber": 7,
              "question": "Exercise 5 - Q7: Today _______________ can predict when a tidal wave will hit land. (science)",
              "answerOptions": [
                {
                  "text": "scientists",
                  "rationale": "Dịch đáp án:\nA. scientists (noun): các nhà khoa học\nB. science (noun): khoa học\nC. scientific (adj): thuộc khoa học\nD. scientifically (adv): về mặt khoa học\n\nGiải thích: Cần một danh từ chỉ người làm chủ ngữ cho động từ 'predict' (dự đoán). 'Scientists' (các nhà khoa học) là đáp án hợp lý nhất.\n\nDịch câu: Ngày nay, các nhà khoa học có thể dự đoán khi nào sóng thần sẽ ập vào đất liền.",
                  "isCorrect": true
                },
                { "text": "science", "isCorrect": false, "rationale": "Sai nghĩa (Khoa học là lĩnh vực, không phải chủ thể thực hiện hành động dự đoán cụ thể như con người)." },
                { "text": "scientific", "isCorrect": false, "rationale": "Sai từ loại (Tính từ)." },
                { "text": "scientifically", "isCorrect": false, "rationale": "Sai từ loại (Trạng từ)." }
              ]
            },
            {
              "questionNumber": 8,
              "question": "Exercise 5 - Q8: That tsunami was the most _______________ of the year 2004. (disaster)",
              "answerOptions": [
                {
                  "text": "disastrous",
                  "rationale": "Dịch đáp án:\nA. disastrous (adj): tai hại, thảm khốc\nB. disaster (noun): thảm họa\nC. disasters (noun): các thảm họa\nD. disasterous (spelling error): sai chính tả\n\nGiải thích: Cấu trúc so sánh nhất 'the most + adj'. Cần tính từ của 'disaster' là 'disastrous'.\n\nDịch câu: Trận sóng thần đó là thảm khốc nhất trong năm 2004.",
                  "isCorrect": true
                },
                { "text": "disaster", "isCorrect": false, "rationale": "Sai từ loại (Danh từ)." },
                { "text": "disasters", "isCorrect": false, "rationale": "Sai từ loại." },
                { "text": "disasterous", "isCorrect": false, "rationale": "Sai chính tả (đúng là disastrous)." }
              ]
            },
            {
              "questionNumber": 9,
              "question": "Exercise 5 - Q9: We had left the city _______________ before tidal waves came. (safety)",
              "answerOptions": [
                {
                  "text": "safely",
                  "rationale": "Dịch đáp án:\nA. safely (adv): một cách an toàn\nB. safe (adj): an toàn\nC. safety (noun): sự an toàn\nD. save (verb): cứu/tiết kiệm\n\nGiải thích: Cần một Trạng từ (Adverb) để bổ nghĩa cho động từ 'left' (rời đi). Rời đi như thế nào? -> Rời đi một cách an toàn.\n\nDịch câu: Chúng tôi đã rời thành phố an toàn trước khi sóng thần ập đến.",
                  "isCorrect": true
                },
                { "text": "safe", "isCorrect": false, "rationale": "Sai từ loại (Tính từ - trừ trường hợp keep safe, stay safe)." },
                { "text": "safety", "isCorrect": false, "rationale": "Sai từ loại (Danh từ)." },
                { "text": "save", "isCorrect": false, "rationale": "Sai từ loại (Động từ)." }
              ]
            },
            {
              "questionNumber": 10,
              "question": "Exercise 5 - Q10: Thousands of people have been made _______________ by the flooding. (home)",
              "answerOptions": [
                {
                  "text": "homeless",
                  "rationale": "Dịch đáp án:\nA. homeless (adj): vô gia cư\nB. home (noun): nhà\nC. homely (adj): giản dị/ấm cúng\nD. homesick (adj): nhớ nhà\n\nGiải thích: Cấu trúc 'make somebody + adj' (khiến ai trở nên như thế nào). Lũ lụt khiến người ta mất nhà -> homeless.\n\nDịch câu: Hàng ngàn người đã bị mất nhà cửa (trở thành vô gia cư) do lũ lụt.",
                  "isCorrect": true
                },
                { "text": "home", "isCorrect": false, "rationale": "Sai từ loại." },
                { "text": "homely", "isCorrect": false, "rationale": "Sai nghĩa." },
                { "text": "homesick", "isCorrect": false, "rationale": "Sai nghĩa (nhớ nhà)." }
              ]
            },
            {
              "questionNumber": 11,
              "question": "Exercise 5 - Q11: Thunder makes me _______________. (terrify)",
              "answerOptions": [

        // DOM Elements
        const quizContainer = document.getElementById('quiz-container');
        const correctSound = document.getElementById('sound-correct');
        const wrongSound = document.getElementById('sound-wrong');
        let userScore = 0;

        // Initialize Quiz
        function initQuiz() {
            quizData.questions.forEach((q, index) => {
                const card = createCard(q, index);
                quizContainer.appendChild(card);
            });
        }

        function createCard(q, index) {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `q-${index}`;

            // Header of Card
            const header = document.createElement('div');
            header.className = 'question-header';
            header.innerHTML = `<span class="question-badge">Câu ${index + 1}</span>`;
            
            // Question Text
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.textContent = q.question;

            // Options Container
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options-grid';

            // Loop through options
            q.answerOptions.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<strong>${String.fromCharCode(65 + i)}.</strong> ${opt.text}`;
                
                // Click Event
                btn.onclick = () => handleAnswer(btn, opt, q, index, optionsDiv);
                
                optionsDiv.appendChild(btn);
            });

            // Explanation Box (Hidden initially)
            const explBox = document.createElement('div');
            explBox.className = 'explanation-box';
            explBox.id = `expl-${index}`;

            // Process rationale for HTML display
            const rationaleHTML = processRationale(q.answerOptions.find(o => o.isCorrect).rationale);

            explBox.innerHTML = `
                <div class="explanation-header">Cô MS Chí Nên giải thích:</div>
                <div class="explanation-content">${rationaleHTML}</div>
            `;

            // Assemble Card
            card.appendChild(header);
            card.appendChild(qText);
            card.appendChild(optionsDiv);
            card.appendChild(explBox);

            return card;
        }

        // Logic to handle user selection
        function handleAnswer(btn, option, questionData, qIndex, container) {
            // Disable all buttons in this card
            const buttons = container.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            const explanationBox = document.getElementById(`expl-${qIndex}`);

            if (option.isCorrect) {
                // Correct logic
                btn.classList.add('correct');
                playSound('correct');
                fireConfetti();
                userScore++;
            } else {
                // Wrong logic
                btn.classList.add('wrong');
                playSound('wrong');
                
                // Highlight the correct one
                questionData.answerOptions.forEach((opt, idx) => {
                    if (opt.isCorrect) {
                        buttons[idx].classList.add('correct');
                    }
                });
            }

            // Show explanation
            explanationBox.style.display = 'block';
        }

        // Helper to format the explanation text
        function processRationale(text) {
            if (!text) return "Chưa có giải thích.";
            // Bold key terms
            let formatted = text
                .replace(/Dịch đáp án:/g, '<strong>Dịch đáp án:</strong>')
                .replace(/Giải thích:/g, '<strong>Giải thích:</strong>')
                .replace(/Dịch câu:/g, '<strong>Dịch câu:</strong>')
                // New lines to breaks
                .replace(/\n/g, '<br>');
            return formatted;
        }

        // Sound Player
        function playSound(type) {
            if (type === 'correct') {
                correctSound.currentTime = 0;
                correctSound.play().catch(e => console.log("Audio play failed interaction required"));
            } else {
                wrongSound.currentTime = 0;
                wrongSound.play().catch(e => console.log("Audio play failed interaction required"));
            }
        }

        // Confetti Effect
        function fireConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#ff9f43']
            });
        }

        // Finish Quiz & Show Modal
        function finishQuiz() {
            const modal = document.getElementById('resultModal');
            const scoreDisplay = document.getElementById('final-score');
            const feedback = document.getElementById('feedback-msg');
            const total = quizData.questions.length;

            scoreDisplay.textContent = `${userScore}/${total}`;

            // Feedback logic
            const percentage = userScore / total;
            if (percentage === 1) {
                feedback.textContent = "Xuất sắc! Bạn đúng là thiên tài tiếng Anh! 🌟";
                fireConfetti();
            } else if (percentage >= 0.8) {
                feedback.textContent = "Giỏi lắm! Chỉ sai một chút xíu thôi. 💪";
            } else if (percentage >= 0.5) {
                feedback.textContent = "Khá tốt! Cố gắng đọc kỹ giải thích nhé. 📚";
            } else {
                feedback.textContent = "Đừng buồn! Hãy xem lại giải thích để học thêm nhé. 🌱";
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            location.reload(); // Simple reload to restart
        }

        // Run
        initQuiz();

    </script>
