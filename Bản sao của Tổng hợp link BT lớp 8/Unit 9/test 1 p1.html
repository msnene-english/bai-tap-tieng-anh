<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cy:#22E3D8;--vi:#A78BFA;--pk:#FF6EC7;--ye:#FFD166;--good:#00D26A;--bad:#FF4757;
  --ink:#16213E;--gl:rgba(255,255,255,.13);--gb:rgba(255,255,255,.30)}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;position:relative;
  background:linear-gradient(-45deg,#141C3A,#3B1E6E,#0B5C7C,#6A1B7A,#12324F,#1B1440);
  background-size:400% 400%;animation:bg 20s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
/* lớp hoạ tiết SVG lơ lửng độc lập */
.pat{position:fixed;inset:-60px;z-index:0;pointer-events:none;opacity:.5;animation:pan 26s linear infinite}
@keyframes pan{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(-120px,120px,0)}}
/* tia sét loé sáng */
.flash{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 70% 12%,rgba(255,255,255,.85),transparent 45%);
  opacity:0;animation:fl 11s ease-in-out infinite}
@keyframes fl{0%,88%,100%{opacity:0}89%{opacity:.55}90.5%{opacity:.05}92%{opacity:.4}93.5%{opacity:0}}
.drift{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.drift span{position:absolute;font-size:26px;opacity:.30;animation:dr linear infinite;filter:drop-shadow(0 0 8px rgba(34,227,216,.5))}
@keyframes dr{0%{transform:translateY(-18vh) rotate(-8deg)}100%{transform:translateY(115vh) rotate(12deg)}}
.wrap{position:relative;z-index:3;max-width:900px;margin:0 auto;padding:22px 16px 90px}
/* ── HEADER ── */
.hd{background:var(--gl);backdrop-filter:blur(16px);border:1.5px solid var(--gb);border-radius:26px;
  padding:22px 22px 18px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);margin-bottom:20px}
.hd::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(34,227,216,.22),transparent 45%,rgba(255,110,199,.22))}
.radar{position:absolute;top:-30px;right:-30px;width:170px;height:170px;border-radius:50%;
  border:2px solid rgba(34,227,216,.35);background:repeating-radial-gradient(circle,rgba(34,227,216,.12) 0 1px,transparent 1px 22px)}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(34,227,216,.55),transparent 28%);animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.hd h1{position:relative;font-family:'Righteous',cursive;font-size:clamp(24px,5.4vw,40px);line-height:1.15;
  background:linear-gradient(90deg,var(--cy),var(--ye),var(--pk));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;max-width:74%;text-shadow:0 0 26px rgba(34,227,216,.25)}
.hd .sb2{position:relative;font-weight:800;font-size:.86rem;color:#D7E6FF;margin-top:9px;max-width:74%;line-height:1.7}
.tag{position:relative;display:inline-block;margin-top:11px;font-family:'Righteous',cursive;font-size:.92rem;
  color:#0B1026;background:linear-gradient(90deg,var(--cy),var(--ye));border-radius:999px;padding:5px 17px;
  box-shadow:0 8px 20px rgba(34,227,216,.35)}
/* ── SCORE BAR ── */
.sc{position:sticky;top:12px;z-index:30;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:18px;
  border-radius:999px;background:rgba(12,18,40,.72);backdrop-filter:blur(14px);border:1.5px solid var(--gb);
  box-shadow:0 10px 26px rgba(0,0,0,.35)}
.sc b{font-family:'Righteous',cursive;font-size:1rem;color:var(--cy)}
.tr{flex:1;height:10px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
.fl2{height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--ye),var(--pk));transition:width .45s}
/* ── SECTION ── */
.sec{background:var(--gl);backdrop-filter:blur(15px);border:1.5px solid var(--gb);border-radius:22px;
  padding:18px 16px 20px;margin-bottom:20px;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:6px}
.pill{color:#0B1026;border-radius:999px;padding:4px 15px;font-size:.8rem;font-family:'Righteous',cursive}
.st h2{font-family:'Righteous',cursive;font-size:1.22rem;color:#fff}
.si{font-size:.86rem;font-weight:700;color:#C9DAF5;font-style:italic;margin:4px 0 14px;line-height:1.7}
.dv{border:none;border-top:1.5px dashed rgba(255,255,255,.28);margin:10px 0 14px}
/* ── QUESTION ── */
.q{background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.22);border-radius:16px;
  padding:13px 14px 15px;margin-bottom:13px}
.q.shk{animation:shk .42s ease}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.qn{display:inline-flex;align-items:center;justify-content:center;min-width:29px;height:26px;padding:0 8px;
  border-radius:999px;font-family:'Righteous',cursive;font-size:.78rem;color:#0B1026;margin-right:8px;
  background:linear-gradient(90deg,var(--cy),var(--vi))}
.qt{font-size:1.15rem;font-weight:700;color:#fff;line-height:1.9}
.bl{color:var(--ye);letter-spacing:1px;font-weight:900;text-shadow:0 0 12px rgba(255,209,102,.5)}
.hint{display:block;font-size:.85rem;font-weight:700;color:var(--cy);font-style:italic;margin-top:6px;line-height:1.6}
.pre,.suf{font-weight:800;font-size:1rem;color:var(--ye);line-height:1.6}
.pre{white-space:nowrap}
/* options */
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:700px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.og{grid-template-columns:1fr}}
.ob{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:18px;padding:11px 13px;
  color:#fff;font-family:'Nunito';font-size:1.08rem;font-weight:800;cursor:pointer;text-align:center;
  transition:all .17s ease;line-height:1.5;word-break:break-word;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.ob:hover:not(.dn){transform:translateY(-3px) scale(1.04);border-color:var(--cy);box-shadow:0 10px 22px rgba(34,227,216,.35)}
.ob.ok{background:rgba(0,210,106,.28);border-color:var(--good);color:#C8FFE2}
.ob.no{background:rgba(255,71,87,.3);border-color:var(--bad);color:#FFD8DB}
.ob.dim{opacity:.42}
/* letter cards (tìm lỗi sai) */
.lt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:560px){.lt{grid-template-columns:repeat(2,1fr)}}
.lb{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:18px;padding:9px 7px;
  cursor:pointer;font-family:'Righteous',cursive;font-size:1.3rem;color:var(--ye);transition:all .17s ease;
  box-shadow:0 6px 0 rgba(0,0,0,.22)}
.lb small{display:block;font-family:'Nunito';font-size:.82rem;font-weight:800;color:#E6EEFF;margin-top:3px;
  line-height:1.4;word-break:break-word}
.lb:hover:not(:disabled){transform:translateY(-3px) scale(1.04);border-color:var(--cy)}
.lb.sel{background:rgba(34,227,216,.25);border-color:var(--cy)}
.lb.ok{background:rgba(0,210,106,.3);border-color:var(--good);color:#C8FFE2}
.lb.no{background:rgba(255,71,87,.32);border-color:var(--bad);color:#FFD8DB}
.fx{display:none}.fx.on{display:flex}
/* input */
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ti{flex:1;min-width:190px;padding:10px 14px;border:2px solid rgba(255,255,255,.3);border-radius:14px;
  font-family:'Nunito';font-size:.98rem;font-weight:800;outline:none;background:rgba(255,255,255,.14);color:#fff}
.ti::placeholder{color:rgba(255,255,255,.55)}
.ti:focus{border-color:var(--cy);box-shadow:0 0 0 4px rgba(34,227,216,.18)}
.ti.ok{border-color:var(--good);background:rgba(0,210,106,.22)}
.ti.no{border-color:var(--bad);background:rgba(255,71,87,.24)}
.ck{background:linear-gradient(90deg,var(--pk),var(--vi));color:#fff;border:none;border-radius:999px;
  font-family:'Righteous',cursive;font-size:.84rem;letter-spacing:.6px;padding:11px 24px;cursor:pointer;
  transition:all .2s;white-space:nowrap;box-shadow:0 8px 20px rgba(255,110,199,.35)}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.4;cursor:default}
/* explanation */
.ex{display:none;background:rgba(255,255,255,.96);color:#16213E;border-radius:16px;padding:14px;margin-top:13px;
  font-size:1rem;line-height:1.85;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.ex.show{display:block;animation:sd .3s ease}
@keyframes sd{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.kb{background:#E4FBEC;border:1px solid var(--good);border-radius:10px;padding:7px 11px;margin-bottom:9px;
  font-weight:900;color:#0B7A44;line-height:1.7}
.vnt{background:#FFF3D9;border:1.5px solid #E9A21B;border-left:5px solid #E9A21B;border-radius:10px;
  padding:8px 12px;margin:0 0 10px;font-weight:800;color:#8A5A04;line-height:1.75}
.ex ol{margin:0 0 0 21px}
.ex ol>li{margin-bottom:9px;font-weight:700;color:#33415C;line-height:1.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:8px 0 4px}
.grid2.wide{grid-template-columns:1fr}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#F4F7FC;border:1px solid #DCE5F2;border-radius:10px;padding:6px 10px;font-size:.97rem;
  font-weight:700;line-height:1.7}
.p-word{color:#1565C0;font-weight:800}
.hl-green{color:#0B8A3D;font-weight:900}
.hl-red{color:#D32F2F;font-weight:900}
.wt{background:#E2E8F0;color:#475569;border-radius:6px;padding:0 6px;font-size:.8rem;font-weight:800;font-style:italic}
.p-phonetic{color:#7B1FA2;background:#F3E5F5;border-radius:5px;padding:0 5px;font-size:.92rem;font-weight:700}
.p-mean{color:#BF5B04;font-weight:700}
.p-grammar{color:#C62828;font-weight:700;text-decoration:underline;text-decoration-color:#EF9A9A;text-underline-offset:3px}
.ex u{background:#FDECC8;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800;color:#8A5A00}
.ob u,.qt u{background:rgba(255,209,102,.3);border-radius:4px;padding:0 3px;text-decoration:none;color:var(--ye)}
/* submit & modal */
.sub{text-align:center;padding:26px 10px}
.sbtn{background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));color:#0B1026;border:none;border-radius:999px;
  font-family:'Righteous',cursive;font-size:1rem;letter-spacing:.6px;padding:16px 42px;cursor:pointer;
  box-shadow:0 14px 32px rgba(167,139,250,.45);transition:all .25s}
.sbtn:hover{transform:translateY(-3px) scale(1.02)}
.ov{position:fixed;inset:0;background:rgba(6,10,26,.78);z-index:1000;display:none;align-items:center;
  justify-content:center;backdrop-filter:blur(6px);padding:16px;overflow-y:auto}
.ov.on{display:flex}
.mb{background:rgba(20,28,58,.96);border:1.5px solid var(--gb);border-radius:24px;padding:28px 24px;max-width:440px;
  width:94%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto}
.mb h2{font-family:'Righteous',cursive;font-size:1.35rem;color:var(--cy);margin-bottom:14px}
.mb input{width:100%;background:rgba(255,255,255,.14);border:2px solid var(--gb);border-radius:14px;padding:12px 15px;
  color:#fff;font-family:'Nunito';font-size:.98rem;font-weight:800;text-align:center;margin-bottom:12px;outline:none}
.mb input.er{border-color:var(--bad);animation:shk .42s ease}
.mb .em{color:#FF9AA2;font-size:.83rem;margin-bottom:10px;display:none;font-weight:800}
.mb .gr{font-family:'Righteous',cursive;font-size:1.18rem;color:var(--ye);margin-bottom:8px;line-height:1.5}
.mb .rs{font-family:'Righteous',cursive;font-size:2.3rem;color:#fff;margin:10px 0 4px}
.mb .rt{font-size:1rem;font-weight:900;color:var(--cy);margin:4px 0 8px}
.mb .rm{font-size:.92rem;font-weight:700;color:#D7E6FF;line-height:1.75;margin-bottom:12px}
.mb img{width:100%;max-width:250px;border-radius:16px;margin:12px auto;display:block;border:2px solid var(--gb)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:1100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>

<script>
(function(){const W=['⛈️','🌪️','💧','⚡','🌊','🌧️','🧭','📡'],D=document.getElementById('drift');
 for(let i=0;i<15;i++){const s=document.createElement('span');s.textContent=W[i%W.length];
  s.style.left=(Math.random()*96)+'%';s.style.fontSize=(17+Math.random()*20).toFixed(0)+'px';
  s.style.animationDuration=(13+Math.random()*14).toFixed(1)+'s';
  s.style.animationDelay=(-Math.random()*26).toFixed(1)+'s';D.appendChild(s)}})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#22E3D8','#A78BFA','#FF6EC7','#FFD166','#00D26A'];
 for(let i=0;i<32;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}

<script>
/* ══ DỮ LIỆU ══ */
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fil(sec,num,q,pre,ans,accept,ex){Q.push({t:'fill',sec,num,q,pre:pre||'',correct:ans,accept,ex})}

 '<div class="vnt">💬 Dịch: '+vn+'</div><ol>'+

/* ═════ S1 — NGỮ ÂM (5 câu) ═════ */
mcq('S1',1,'Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại:',
 'tr<u>e</u>mble',['<u>e</u>rupt','pr<u>e</u>tty','for<u>e</u>st','tr<u>e</u>mble'],
 EX('tr<u>e</u>mble — “e” đọc /e/',
 'Chọn từ có phần gạch chân phát âm khác ba từ còn lại. (phun trào / xinh xắn / rừng / rung lắc)',
 [A('<u>e</u>rupt','v','phun trào (núi lửa)','/ɪˈrʌpt/'),A('pr<u>e</u>tty','adj','xinh xắn; khá','/ˈprɪti/'),
  A('for<u>e</u>st','n','rừng','/ˈfɒrɪst/'),A('tr<u>e</u>mble','v','rung lắc, run rẩy','/ˈtrembl/',1)],

 [A('When we had dinner, the rain was pouring heavily.','','Gần đúng nhưng “when + QK đơn” làm mất ý hai việc CÙNG diễn ra'),
  A('It was raining heavily while we were having dinner.','','Trời đang mưa to trong khi chúng tôi đang ăn tối',0,1),
  A('We had dinner before the heavy rain started.','','Sai trình tự: ăn xong rồi mới mưa'),
  A('The heavy rain didn’t stop until we started…','','Sai nghĩa: mưa tạnh khi bắt đầu ăn')],
 '<b>during + danh từ</b> (during our dinner) được chuyển thành <b>while + mệnh đề QUÁ KHỨ TIẾP DIỄN</b> (while we were having dinner) — cả hai việc cùng kéo dài song song.',
 'Phương án A dùng “had dinner” (quá khứ đơn) nên yếu hơn về ý “đang diễn ra”; C và D thay đổi hẳn trình tự thời gian so với câu gốc.',true),'c1');

/* ══ DỰNG TRANG ══ */
const TOTAL=Q.length;let answered=0,score=0;const done={},maps={};
function bump(){document.getElementById('fb').style.width=(answered/TOTAL*100)+'%';
 document.getElementById('s0').textContent=score;
 const p=answered?score/answered:1;
 document.getElementById('md').textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){const d=document.createElement('div');d.className='sec';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+'</span><h2>'+title+'</h2></div>'+
  '<div class="si">'+ins+'</div><hr class="dv">';APP.appendChild(d);CUR=d}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

sec('linear-gradient(90deg,#22E3D8,#A78BFA)','I &amp; II','🔤 Ngữ âm',
 'Chọn từ có phần gạch chân phát âm khác / trọng âm khác với các từ còn lại. (5 câu)');
render('S1');
sec('linear-gradient(90deg,#FF6EC7,#FFD166)','III','📚 Từ vựng &amp; Ngữ pháp',
 'Chọn từ/cụm từ thích hợp nhất để hoàn thành câu. (12 câu)');
render('S2');
sec('linear-gradient(90deg,#FFD166,#00D26A)','IV','🔍 Tìm lỗi sai &amp; SỬA LẠI',
 'Bấm vào chữ cái (A, B, C, D) chứa lỗi ➔ ô nhập sẽ hiện ra ➔ gõ đúng từ/cụm từ ĐÃ SỬA rồi bấm KIỂM TRA. Phải chọn đúng chữ cái VÀ gõ đúng từ mới được điểm. (3 câu)');
render('S3');
sec('linear-gradient(90deg,#00D26A,#22E3D8)','V','🧩 Từ loại',
 'Chia đúng dạng của từ cho sẵn trong ngoặc. Không phân biệt hoa/thường. (5 câu)');
render('S4');
sec('linear-gradient(90deg,#A78BFA,#FF6EC7)','VI','⏳ Chia động từ',
 'Chia đúng dạng của động từ cho sẵn trong ngoặc. Câu có 2 chỗ trống thì gõ 2 đáp án, cách nhau bằng dấu gạch ngang. (5 câu)');
render('S5');
sec('linear-gradient(90deg,#22E3D8,#FFD166)','WRITING I','✂️ Sắp xếp câu',
 'Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh. Gõ cả câu, không phân biệt hoa/thường. (2 câu)');
render('S6');
sec('linear-gradient(90deg,#FF6EC7,#A78BFA)','WRITING II','🖋️ Viết câu từ gợi ý',
 'Dùng đúng các từ gợi ý để viết thành câu hoàn chỉnh (thêm mạo từ, giới từ, chia động từ nếu cần). (4 câu)');
render('S7');
sec('linear-gradient(90deg,#FFD166,#22E3D8)','WRITING III','🔁 Câu đồng nghĩa',
 'Chọn câu có nghĩa gần nhất với câu đã cho. (4 câu)');
render('S8');
document.getElementById('tt').textContent=TOTAL;bump();

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 const shake=()=>{c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)};
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='err'){
  c.innerHTML='<div class="qt">'+h+m.q+'<span class="hint">👉 Bấm chọn chữ cái có lỗi, rồi gõ lại cho ĐÚNG phần đó.</span></div>'+
   '<div class="lt" id="l_'+gid+'">'+m.parts.map((p,i)=>
     '<button class="lb" data-i="'+i+'">'+'ABCD'[i]+'<small>'+p+'</small></button>').join('')+'</div>'+
   '<div class="fr fx" id="f_'+gid+'"><span class="pre">✏️ Sửa lại thành:</span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="...gõ từ/cụm từ đúng..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const L=c.querySelector('#l_'+gid),F=c.querySelector('#f_'+gid),
        inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid),ex=c.querySelector('#e_'+gid);
  let sel=-1;
  L.querySelectorAll('.lb').forEach(b=>{b.onclick=()=>{if(done[gid])return;sel=+b.dataset.i;
   L.querySelectorAll('.lb').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
   F.classList.add('on');inp.focus()}});
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(sel<0||!v){inp.classList.add('no');shake();setTimeout(()=>inp.classList.remove('no'),460);return}
   done[gid]=true;answered++;
   const ok=(sel===m.ci)&&m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   const LB=[...L.querySelectorAll('.lb')];
   LB.forEach((x,j)=>{x.disabled=true;x.classList.remove('sel');if(j===sel)x.classList.add(ok?'ok':'no')});
   const reveal=()=>{LB[m.ci].classList.add('ok');ex.classList.add('show')};
   if(ok){score++;ding();confetti();reveal()}else{buzz();shake();setTimeout(reveal,700)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr">'+(m.pre?'<span class="pre">'+m.pre+'</span>':'')+
   '<input class="ti" id="i_'+gid+'" placeholder="...gõ câu trả lời..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid),ex=c.querySelector('#e_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');shake();setTimeout(()=>inp.classList.remove('no'),460);return}
   done[gid]=true;answered++;
   /* chấm linh hoạt: gõ tiếp phần còn thiếu HOẶC gõ lại cả câu kèm phần cho sẵn */
   const acc=m.accept.map(norm).concat(m.pre?m.accept.map(a=>norm(m.pre+' '+a)):[]);
   const ok=acc.indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   if(ok){score++;ding();confetti();ex.classList.add('show')}
   else{buzz();shake();setTimeout(()=>ex.classList.add('show'),700)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid),
       ex=document.getElementById('e_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(j===i)el.classList.add(ok?'ok':'no');else el.classList.add('dim')});
 const reveal=()=>{[...b.children].forEach((el,j)=>{if(maps[gid][j]===m.correct){
   el.classList.remove('dim');el.classList.add('ok')}});ex.classList.add('show')};
 if(ok){score++;ding();confetti();reveal()}
 else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);setTimeout(reveal,700)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🌟 THIÊN TÀI! '+nm+' xuất sắc tuyệt đối!';
  msg='Đúng TOÀN BỘ '+TOTAL+' câu — nhà truy bão số 1 của lớp! ⛈️🏆';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='⚡ GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi! Đọc lại phần giải thích rồi luyện thêm nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn nhé! Đọc kỹ phần giải thích rồi làm lại bài nào!';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL+' câu đúng';
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
