<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--lava:#FF7B00;--amber:#FFC93C;--rose:#FF4D6D;--plum:#B14AED;--mint:#2BE8A5;
  --good:#2BE8A5;--bad:#FF5470;--gl:rgba(255,255,255,.12);--gb:rgba(255,201,60,.38)}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;position:relative;
  background:linear-gradient(-50deg,#2A0A3C,#5E1250,#A8215B,#E2571C,#F0A02A,#7A1550,#330C46);
  background-size:420% 420%;animation:bg 22s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
/* lớp hoạ tiết SVG lơ lửng độc lập */
.pat{position:fixed;inset:-70px;z-index:0;pointer-events:none;opacity:.55;animation:pan 30s linear infinite}
@keyframes pan{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(90px,-70px,0) scale(1.06)}
 100%{transform:translate3d(0,0,0) scale(1)}}
/* ánh lửa phập phồng */
.glow{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 115%,rgba(255,123,0,.55),transparent 55%);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.85}}
.drift{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.drift span{position:absolute;bottom:-40px;font-size:24px;opacity:.32;animation:up linear infinite;
  filter:drop-shadow(0 0 9px rgba(255,123,0,.6))}
@keyframes up{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-118vh) rotate(24deg)}}
/* đường địa chấn chạy dưới chân trang */
.seis{position:fixed;left:0;right:0;bottom:0;height:76px;z-index:2;pointer-events:none;opacity:.75}
.seis path{fill:none;stroke:var(--mint);stroke-width:2.5;stroke-linecap:round;
  filter:drop-shadow(0 0 6px rgba(43,232,165,.8));stroke-dasharray:1400;animation:draw 5s linear infinite}
@keyframes draw{0%{stroke-dashoffset:1400}100%{stroke-dashoffset:0}}
.wrap{position:relative;z-index:3;max-width:900px;margin:0 auto;padding:22px 16px 100px}
/* ── HEADER ── */
.hd{background:rgba(30,8,44,.55);backdrop-filter:blur(16px);border:2px solid var(--gb);border-radius:8px 28px 8px 28px;
  padding:22px 22px 18px;position:relative;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.45);margin-bottom:20px}
.hd::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,123,0,.28),transparent 50%,rgba(177,74,237,.28))}
.volc{position:absolute;right:-14px;bottom:-18px;width:190px;height:130px;opacity:.5}
.hd h1{position:relative;font-family:'Bungee',cursive;font-size:clamp(22px,5vw,38px);line-height:1.2;
  background:linear-gradient(90deg,var(--amber),var(--lava),var(--rose));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;max-width:72%}
.hd .sb2{position:relative;font-weight:800;font-size:.86rem;color:#FFE9C7;margin-top:9px;max-width:72%;line-height:1.7}
.tag{position:relative;display:inline-block;margin-top:11px;font-family:'Bungee',cursive;font-size:.78rem;
  color:#2A0A3C;background:linear-gradient(90deg,var(--amber),var(--mint));border-radius:999px;padding:6px 18px;
  box-shadow:0 8px 22px rgba(255,201,60,.4)}
/* ── SCORE BAR ── */
.sc{position:sticky;top:12px;z-index:30;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:18px;
  border-radius:999px;background:rgba(34,8,46,.8);backdrop-filter:blur(14px);border:2px solid var(--gb);
  box-shadow:0 10px 28px rgba(0,0,0,.4)}
.sc b{font-family:'Bungee',cursive;font-size:.95rem;color:var(--amber)}
.tr{flex:1;height:10px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
.fl2{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--lava),var(--rose));transition:width .45s}

.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:6px}
.pill{color:#2A0A3C;border-radius:999px;padding:4px 15px;font-size:.74rem;font-family:'Bungee',cursive}

.si{font-size:.86rem;font-weight:700;color:#FFD9A8;font-style:italic;margin:5px 0 14px;line-height:1.7}
.dv{border:none;border-top:2px dashed rgba(255,201,60,.35);margin:10px 0 14px}

  padding:13px 14px 15px;margin-bottom:13px}

 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.qn{display:inline-flex;align-items:center;justify-content:center;min-width:29px;height:26px;padding:0 8px;

  background:linear-gradient(90deg,var(--amber),var(--lava))}
.qt{font-size:1.15rem;font-weight:700;color:#FFF6E6;line-height:1.9}
.bl{color:var(--mint);letter-spacing:1px;font-weight:900;text-shadow:0 0 12px rgba(43,232,165,.5)}
.hint{display:block;font-size:.85rem;font-weight:700;color:var(--amber);font-style:italic;margin-top:6px;line-height:1.6}
.pre,.suf{font-weight:800;font-size:1rem;color:var(--amber);line-height:1.6}
.pre{white-space:nowrap}

.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:700px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.og{grid-template-columns:1fr}}

  transition:all .17s ease;line-height:1.5;word-break:break-word;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.ob:hover:not(.dn){transform:translateY(-3px) scale(1.04);border-color:var(--amber);
  box-shadow:0 10px 24px rgba(255,201,60,.35)}
.ob.ok{background:rgba(43,232,165,.26);border-color:var(--good);color:#D6FFF1}
.ob.no{background:rgba(255,84,112,.3);border-color:var(--bad);color:#FFDCE3}
.ob.dim{opacity:.42}
/* letter cards */
.lt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:560px){.lt{grid-template-columns:repeat(2,1fr)}}
.lb{background:rgba(255,255,255,.14);border:2px solid rgba(255,201,60,.35);border-radius:18px;padding:9px 7px;

  box-shadow:0 6px 0 rgba(0,0,0,.3)}

.lb.no{background:rgba(255,84,112,.32);border-color:var(--bad);color:#FFDCE3}
.fx{display:none}.fx.on{display:flex}
/* input */
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ti{flex:1;min-width:190px;padding:10px 14px;border:2px solid rgba(255,201,60,.35);border-radius:14px;

.ti::placeholder{color:rgba(255,241,220,.55)}

.ti.no{border-color:var(--bad);background:rgba(255,84,112,.24)}

.grid2.wide{grid-template-columns:1fr}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#FDF6EC;border:1px solid #EEDFC8;border-radius:10px;padding:6px 10px;font-size:.97rem;
  font-weight:700;line-height:1.7}
.p-word{color:#1565C0;font-weight:800}
.hl-green{color:#0B8A3D;font-weight:900}
.hl-red{color:#D32F2F;font-weight:900}
.wt{background:#EFE3D2;color:#6B533A;border-radius:6px;padding:0 6px;font-size:.8rem;font-weight:800;font-style:italic}
.p-phonetic{color:#7B1FA2;background:#F3E5F5;border-radius:5px;padding:0 5px;font-size:.92rem;font-weight:700}
.p-mean{color:#BF5B04;font-weight:700}
.p-grammar{color:#C62828;font-weight:700;text-decoration:underline;text-decoration-color:#EF9A9A;text-underline-offset:3px}
.ex u{background:#FDECC8;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800;color:#8A5A00}
.ob u,.qt u{background:rgba(255,201,60,.28);border-radius:4px;padding:0 3px;text-decoration:none;color:var(--amber)}
/* submit & modal */
.sub{text-align:center;padding:26px 10px}
.sbtn{background:linear-gradient(90deg,var(--amber),var(--lava),var(--rose));color:#2A0A3C;border:none;
  border-radius:999px;font-family:'Bungee',cursive;font-size:.86rem;letter-spacing:.6px;padding:17px 40px;
  cursor:pointer;box-shadow:0 14px 34px rgba(255,123,0,.45);transition:all .25s}
.sbtn:hover{transform:translateY(-3px) scale(1.02)}
.ov{position:fixed;inset:0;background:rgba(20,4,30,.8);z-index:1000;display:none;align-items:center;
  justify-content:center;backdrop-filter:blur(6px);padding:16px;overflow-y:auto}
.ov.on{display:flex}
.mb{background:rgba(38,10,52,.97);border:2px solid var(--gb);border-radius:24px;padding:28px 24px;max-width:440px;
  width:94%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.55);max-height:90vh;overflow-y:auto}
.mb h2{font-family:'Bungee',cursive;font-size:1.05rem;color:var(--amber);margin-bottom:14px;line-height:1.5}
.mb input{width:100%;background:rgba(255,255,255,.13);border:2px solid var(--gb);border-radius:14px;padding:12px 15px;
  color:#fff;font-family:'Nunito';font-size:.98rem;font-weight:800;text-align:center;margin-bottom:12px;outline:none}
.mb input.er{border-color:var(--bad);animation:shk .42s ease}
.mb .em{color:#FFB3BF;font-size:.83rem;margin-bottom:10px;display:none;font-weight:800}
.mb .gr{font-family:'Bungee',cursive;font-size:.98rem;color:var(--mint);margin-bottom:8px;line-height:1.6}
.mb .rs{font-family:'Bungee',cursive;font-size:1.9rem;color:#fff;margin:10px 0 4px}
.mb .rt{font-size:1rem;font-weight:900;color:var(--amber);margin:4px 0 8px}
.mb .rm{font-size:.92rem;font-weight:700;color:#FFE9C7;line-height:1.75;margin-bottom:12px}
.mb img{width:100%;max-width:250px;border-radius:16px;margin:12px auto;display:block;border:2px solid var(--gb)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:1100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>

(function(){const W=['🌋','🔥','💥','🪨','🌊','⚠️','📈','🧭'],D=document.getElementById('drift');
 for(let i=0;i<15;i++){const s=document.createElement('span');s.textContent=W[i%W.length];
  s.style.left=(Math.random()*96)+'%';s.style.fontSize=(16+Math.random()*20).toFixed(0)+'px';

let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}

  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}

/* ══ DỰNG TRANG ══ */
const TOTAL=Q.length;let answered=0,score=0;const done={},maps={};
function bump(){document.getElementById('fb').style.width=(answered/TOTAL*100)+'%';
 document.getElementById('s0').textContent=score;
 const p=answered?score/answered:1;
 document.getElementById('md').textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){const d=document.createElement('div');d.className='sec';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+'</span><h2>'+title+'</h2></div>'+
  '<div class="si">'+ins+'</div><hr class="dv">';APP.appendChild(d);CUR=d}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

render('S1');

render('S2');
sec('linear-gradient(90deg,#FF4D6D,#B14AED)','IV','🔍 Tìm lỗi sai &amp; SỬA LẠI',

render('S3');
sec('linear-gradient(90deg,#2BE8A5,#FFC93C)','V','🧩 Từ loại',
 'Chia đúng dạng của từ cho sẵn trong ngoặc. Không phân biệt hoa/thường. (5 câu)');
render('S4');
sec('linear-gradient(90deg,#B14AED,#2BE8A5)','VI','⏳ Chia động từ',

render('S5');
sec('linear-gradient(90deg,#FFC93C,#2BE8A5)','WRITING I','✂️ Sắp xếp câu',

render('S6');
sec('linear-gradient(90deg,#FF4D6D,#FFC93C)','WRITING II','🔗 Nối câu',
 'Dùng từ nối cho sẵn để nối hai câu thành một câu. ✍️ Phần đầu câu đã cho sẵn — con CHỈ CẦN GÕ TIẾP phần còn lại (gõ cả câu vẫn được chấp nhận). (4 câu)');
render('S7');
sec('linear-gradient(90deg,#B14AED,#FF7B00)','WRITING III','🔁 Câu từ gợi ý',

render('S8');
document.getElementById('tt').textContent=TOTAL;bump();

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 const shake=()=>{c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)};
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='err'){
  c.innerHTML='<div class="qt">'+h+m.q+'<span class="hint">👉 Bấm chọn chữ cái có lỗi, rồi gõ lại cho ĐÚNG phần đó.</span></div>'+
   '<div class="lt" id="l_'+gid+'">'+m.parts.map((p,i)=>
     '<button class="lb" data-i="'+i+'">'+'ABCD'[i]+'<small>'+p+'</small></button>').join('')+'</div>'+
   '<div class="fr fx" id="f_'+gid+'"><span class="pre">✏️ Sửa lại thành:</span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="...gõ từ/cụm từ đúng..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const L=c.querySelector('#l_'+gid),F=c.querySelector('#f_'+gid),
        inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid),ex=c.querySelector('#e_'+gid);
  let sel=-1;
  L.querySelectorAll('.lb').forEach(b=>{b.onclick=()=>{if(done[gid])return;sel=+b.dataset.i;
   L.querySelectorAll('.lb').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
   F.classList.add('on');inp.focus()}});
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(sel<0||!v){inp.classList.add('no');shake();setTimeout(()=>inp.classList.remove('no'),460);return}
   done[gid]=true;answered++;
   const ok=(sel===m.ci)&&m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   const LB=[...L.querySelectorAll('.lb')];
   LB.forEach((x,j)=>{x.disabled=true;x.classList.remove('sel');if(j===sel)x.classList.add(ok?'ok':'no')});
   const reveal=()=>{LB[m.ci].classList.add('ok');ex.classList.add('show')};
   if(ok){score++;ding();confetti();reveal()}else{buzz();shake();setTimeout(reveal,700)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr">'+(m.pre?'<span class="pre">'+m.pre+'</span>':'')+
   '<input class="ti" id="i_'+gid+'" placeholder="...gõ câu trả lời..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid),ex=c.querySelector('#e_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');shake();setTimeout(()=>inp.classList.remove('no'),460);return}
   done[gid]=true;answered++;
   /* chấm linh hoạt: gõ tiếp phần còn thiếu HOẶC gõ lại cả câu kèm phần cho sẵn */
   const acc=m.accept.map(norm).concat(m.pre?m.accept.map(a=>norm(m.pre+' '+a)):[]);
   const ok=acc.indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   if(ok){score++;ding();confetti();ex.classList.add('show')}
   else{buzz();shake();setTimeout(()=>ex.classList.add('show'),700)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid),
       ex=document.getElementById('e_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(j===i)el.classList.add(ok?'ok':'no');else el.classList.add('dim')});
 const reveal=()=>{[...b.children].forEach((el,j)=>{if(maps[gid][j]===m.correct){
   el.classList.remove('dim');el.classList.add('ok')}});ex.classList.add('show')};
 if(ok){score++;ding();confetti();reveal()}
 else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);setTimeout(reveal,700)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🌟 THIÊN TÀI! '+nm+' xuất sắc tuyệt đối!';
  msg='Đúng TOÀN BỘ '+TOTAL+' câu — nhà địa chấn học đỉnh nhất phòng lab! 🌋🏆';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🔥 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi! Đọc lại phần giải thích rồi luyện thêm nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn nhé! Đọc kỹ phần giải thích rồi làm lại bài nào!';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL+' câu đúng';
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
