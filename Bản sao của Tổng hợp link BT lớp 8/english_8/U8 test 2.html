<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 8. Shopping - Test 01 | Ms MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #8854C0; /* Tím hồng */
            --primary-dark: #6c429c;
            --secondary: #00C9A7; /* Xanh ngọc */
            --secondary-dark: #009e82;
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-color: #2D3436;
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --warning: #FFA502;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1d8e0 2px, transparent 2px);
            background-size: 20px 20px;
            color: var(--text-color);
            margin: 0;
            padding-bottom: 100px; /* Space for sticky footer */
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.3);
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .sub-header {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 5px;
            font-weight: 600;
        }

        /* CONTAINER */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* CARDS */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05), 0 15px 20px rgba(0,0,0,0.05);
            border: 2px solid #fff;
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .question-number {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 var(--primary-dark);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .reading-passage, .sign-box {
            background: #fffbeb;
            border: 2px dashed #ffeaa7;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-family: 'Quicksand', sans-serif;
            line-height: 1.6;
            color: #4b4b4b;
        }
        
        /* Stylized Signs for Q29-30 */
        .sign-caution {
            background-color: #ffde00;
            color: black;
            border: 5px solid black;
            padding: 15px;
            font-weight: bold;
            text-align: center;
            width: 200px;
            margin: 10px auto;
            border-radius: 5px;
        }
        .sign-caution h3 { margin: 0; font-size: 2rem; background: black; color: #ffde00; }
        .sign-caution p { margin: 10px 0 0 0; font-size: 1.2rem; }

        .sign-notice {
            border: 2px solid #0056b3;
            background: white;
            padding: 15px;
            color: #d63031;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
            max-width: 400px;
            margin: 10px auto;
        }

        /* OPTIONS */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .btn-option {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.1s ease;
            position: relative;
            box-shadow: 0 5px 0 #e0e0e0;
            color: var(--text-color);
            outline: none;
        }

        .btn-option:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .btn-option:hover {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        /* CHECK BUTTON */
        .check-btn-container {
            margin-top: 20px;
            text-align: right;
        }
        
        .btn-check {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--secondary-dark);
            transition: transform 0.1s;
        }
        
        .btn-check:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* FEEDBACK STATES */
        .btn-option.selected {
            background: #e8f0fe;
            border-color: #4a90e2;
            box-shadow: 0 5px 0 #4a90e2;
        }

        .btn-option.correct {
            background: #d1fae5 !important;
            border-color: var(--correct) !important;
            box-shadow: 0 5px 0 #059669 !important;
            color: #064e3b !important;
        }

        .btn-option.wrong {
            background: #fee2e2 !important;
            border-color: var(--wrong) !important;
            box-shadow: 0 5px 0 #b91c1c !important;
            color: #7f1d1d !important;
            animation: shake 0.5s;
        }

        .btn-option.correct-answer-highlight {
            border: 2px dashed var(--correct);
            background: #f0fdf4;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        /* EXPLANATION BOX */
        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-left: 5px solid var(--primary);
            border-radius: 10px;
            display: none; /* Hidden by default */
            font-size: 0.95rem;
        }
        
        .explanation.visible {
            display: block;
            animation: fadeIn 0.5s;
        }

        .exp-title {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-detail p {
            margin: 5px 0;
        }
        
        .translation {
            color: #636e72;
            font-style: italic;
            margin-bottom: 10px;
            display: block;
        }

        /* GLOSSARY TABLE */
        .glossary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .glossary-table th {
            background: var(--primary);
            color: white;
            padding: 10px;
            text-align: left;
        }
        
        .glossary-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        
        .tag-type {
            font-size: 0.75rem;
            background: #dfe6e9;
            padding: 2px 6px;
            border-radius: 4px;
            color: #2d3436;
            font-weight: bold;
        }

        /* STICKY FOOTER */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 20px;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: all 0.2s;
        }

        .btn-submit:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        
        .score-display {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Unanswered Warning */
        .card.warning {
            border: 2px solid var(--warning);
            animation: shake 0.5s;
        }

    </style>
</head>
<body>

    <header>
        <h1>Unit 8. SHOPPING - TEST 01</h1>
        <div class="sub-header">Giáo viên: Ms MS Chí Nên | Master English Teacher</div>
    </header>

    <div class="container" id="quiz-container">
        </div>

    <div class="sticky-footer">
        <div id="score-area" class="score-display" style="display:none;"></div>
        <button class="btn-submit" onclick="submitQuiz()">NỘP BÀI</button>
    </div>

    <script>
        // --- DỮ LIỆU ĐỀ BÀI VÀ GIẢI THÍCH CHI TIẾT ---
        const quizData = [
            // PRONUNCIATION
            {
                id: 1,
                type: "phonetics",
                question: "Choose the word whose underlined part differs from the other three in pronunciation.",
                options: ["br<u>a</u>nd", "r<u>a</u>nge", "s<u>a</u>le", "b<u>a</u>ke"],
                correct: 0,
                explanation: `
                    <span class="translation">Câu hỏi: Chọn từ có phần gạch chân phát âm khác các từ còn lại.</span><br>
                    <b>A. brand /brænd/ (n):</b> Nhãn hiệu (Âm /æ/)<br>
                    <b>B. range /reɪndʒ/ (n):</b> Phạm vi (Âm /eɪ/)<br>
                    <b>C. sale /seɪl/ (n):</b> Giảm giá/Việc bán hàng (Âm /eɪ/)<br>
                    <b>D. bake /beɪk/ (v):</b> Nướng (Âm /eɪ/)<br>
                    <br>👉 <b>Đáp án A</b> phát âm là /æ/, các đáp án còn lại là /eɪ/.
                `
            },
            {
                id: 2,
                type: "phonetics",
                question: "Choose the word whose underlined part differs from the other three in pronunciation.",
                options: ["stadium", "often", "castle", "whistle"],
                correct: 0, 
                // Note: In 'often' t can be silent or not, but in castle/whistle it is definitely silent. Stadium t is pronounced.
                // Let's analyze carefully:
                // A. stadium /ˈsteɪ.di.əm/ (t pronounced)
                // B. often /ˈɒf.ən/ or /ˈɒf.tən/ (t usually silent in standard RP but can be pronounced)
                // C. castle /ˈkɑː.sl̩/ (t is silent)
                // D. whistle /ˈwɪs.l̩/ (t is silent)
                // The intended answer is A because in C & D the 't' is silent. In 'often' it's widely silent too.
                explanation: `
                    <span class="translation">Câu hỏi: Chọn từ có phần gạch chân (âm 't' được ẩn ý) phát âm khác.</span><br>
                    <b>A. stadium /ˈsteɪ.di.əm/:</b> Sân vận động (Âm /t/ được phát âm rõ).<br>
                    <b>B. often /ˈɒf.ən/:</b> Thường xuyên (Âm /t/ thường là âm câm).<br>
                    <b>C. castle /ˈkɑː.sl̩/:</b> Lâu đài (Âm /t/ là âm câm).<br>
                    <b>D. whistle /ˈwɪs.l̩/:</b> Cái còi (Âm /t/ là âm câm).<br>
                    <br>👉 <b>Đáp án A</b>. Từ 'stadium' phát âm chữ 't', các từ còn lại 't' là âm câm (silent letter).
                `
            },
            // STRESS
            {
                id: 3,
                type: "stress",
                question: "Choose the word that differs from the other three in the position of primary stress.",
                options: ["episode", "addicted", "excitement", "assistant"],
                correct: 0,
                explanation: `
                    <b>A. episode /ˈep.ɪ.səʊd/:</b> Tập phim (Trọng âm 1)<br>
                    <b>B. addicted /əˈdɪk.tɪd/:</b> Nghiện (Trọng âm 2)<br>
                    <b>C. excitement /ɪkˈsaɪt.mənt/:</b> Sự phấn khích (Trọng âm 2)<br>
                    <b>D. assistant /əˈsɪs.tənt/:</b> Trợ lý (Trọng âm 2)<br>
                    <br>👉 <b>Đáp án A</b> nhấn âm 1, còn lại nhấn âm 2.
                `
            },
            {
                id: 4,
                type: "stress",
                question: "Choose the word that differs from the other three in the position of primary stress.",
                options: ["receive", "repeat", "private", "provide"],
                correct: 2,
                explanation: `
                    <b>A. receive /rɪˈsiːv/:</b> Nhận (Trọng âm 2)<br>
                    <b>B. repeat /rɪˈpiːt/:</b> Lặp lại (Trọng âm 2)<br>
                    <b>C. private /ˈpraɪ.vət/:</b> Riêng tư (Trọng âm 1)<br>
                    <b>D. provide /prəˈvaɪd/:</b> Cung cấp (Trọng âm 2)<br>
                    <br>👉 <b>Đáp án C</b> nhấn âm 1, còn lại nhấn âm 2.
                `
            },
            // GRAMMAR & VOCAB
            {
                id: 5,
                type: "mcq",
                question: "The responsibility of a _____ is to provide customers with help and sell goods.",
                options: ["shop assistant", "dealer", "customer service", "cashier"],
                correct: 0,
                explanation: `
                    <span class="translation">Dịch: Trách nhiệm của một _____ là giúp đỡ khách hàng và bán hàng hóa.</span><br>
                    <b>A. shop assistant:</b> Nhân viên bán hàng (Người trực tiếp tư vấn và bán hàng).<br>
                    <b>B. dealer:</b> Đại lý/Người buôn bán (thường quy mô lớn hơn hoặc xe cộ).<br>
                    <b>C. customer service:</b> Dịch vụ chăm sóc khách hàng (Bộ phận, không phải danh từ chỉ người cụ thể trong ngữ cảnh bán tại quầy).<br>
                    <b>D. cashier:</b> Thu ngân (Chỉ chịu trách nhiệm tính tiền).<br>
                    <br>👉 <b>Đáp án A</b> đúng nghĩa nhất với "provide help and sell goods".
                `
            },
            {
                id: 6,
                type: "mcq",
                question: "I don’t know how to ______ for lower prices so I shop in supermarkets as they have fixed prices.",
                options: ["bargain", "negotiate", "discuss", "beg"],
                correct: 0,
                explanation: `
                    <span class="translation">Dịch: Tôi không biết cách _____ để có giá thấp hơn nên tôi mua ở siêu thị vì họ có giá niêm yết.</span><br>
                    <b>A. bargain (v):</b> Mặc cả/Trả giá.<br>
                    <b>B. negotiate (v):</b> Đàm phán (thường dùng trong kinh doanh, hợp đồng lớn).<br>
                    <b>C. discuss (v):</b> Thảo luận.<br>
                    <b>D. beg (v):</b> Cầu xin.<br>
                    <br>👉 <b>Đáp án A</b>. Cụm từ "bargain for lower prices" là collocation phổ biến về việc mặc cả khi mua sắm.
                `
            },
            {
                id: 7,
                type: "mcq",
                question: "The factory outlets ______ a special offer for all items next week as planned.",
                options: ["will give", "give", "are giving", "are going to give"],
                correct: 2, // "As planned" thường dùng Hiện tại tiếp diễn cho kế hoạch cố định (arrangements) hoặc be going to. Nhưng trong trắc nghiệm, HTTD mang tính chắc chắn cao hơn (fixed arrangement). Tuy nhiên, "next week" + "as planned" thì C (Present Continuous) hoặc D (Be going to) đều khả thi. Đáp án chuẩn SGK thường ưu tiên HTTD cho "fixed plan".
                explanation: `
                    <span class="translation">Dịch: Các cửa hàng xả kho _____ đợt ưu đãi đặc biệt cho tất cả mặt hàng vào tuần tới như đã lên kế hoạch.</span><br>
                    <b>Dấu hiệu:</b> "next week" (tương lai) và "as planned" (như đã lên kế hoạch/lịch trình).<br>
                    - Khi nói về một kế hoạch đã được sắp xếp cố định, chắc chắn xảy ra trong tương lai, ta dùng <b>Hiện tại tiếp diễn</b> (Present Continuous).<br>
                    <b>A. will give:</b> Tương lai đơn (Quyết định tức thời).<br>
                    <b>D. are going to give:</b> Tương lai gần (Dự định).<br>
                    <br>👉 <b>Đáp án C (are giving)</b> là chính xác nhất để diễn tả "fixed arrangement". (Đáp án D cũng chấp nhận được nhưng C hay hơn trong ngữ cảnh lịch trình cửa hàng).
                `
            },
            {
                id: 8,
                type: "mcq",
                question: "The Community Fair _______ this Spring, and we have all decided to attend it.",
                options: ["is held", "will be held", "will take place", "is taking place"],
                correct: 3, 
                // "This Spring" + "we have all decided". Ngữ cảnh tương lai gần/kế hoạch.
                // "take place" (diễn ra) tốt hơn "be held" (được tổ chức) ở dạng chủ động.
                // Đáp án D (HTTD) diễn tả kế hoạch.
                explanation: `
                    <span class="translation">Dịch: Hội chợ Cộng đồng _____ vào mùa Xuân này, và chúng tôi đều đã quyết định tham gia.</span><br>
                    - Sự kiện đã lên lịch: Dùng Hiện tại tiếp diễn.<br>
                    <b>C. will take place:</b> Sẽ diễn ra (Tương lai đơn - kém chắc chắn hơn).<br>
                    <b>D. is taking place:</b> Đang/Sẽ diễn ra (Kế hoạch cố định).<br>
                    - Lưu ý: <i>take place</i> không dùng thể bị động (không dùng is held take place).<br>
                    <br>👉 <b>Đáp án D</b>. Dùng thì Hiện tại tiếp diễn để chỉ kế hoạch tương lai (Future arrangement).
                `
            },
            {
                id: 9,
                type: "mcq",
                question: "________ they took their laptops to the shop, they asked for their receipts.",
                options: ["If", "When", "Since", "Because"],
                correct: 1,
                explanation: `
                    <span class="translation">Dịch: _____ họ mang laptop đến cửa hàng, họ đã yêu cầu hóa đơn.</span><br>
                    <b>A. If:</b> Nếu (Câu điều kiện - sai nghĩa).<br>
                    <b>B. When:</b> Khi (Chỉ thời gian).<br>
                    <b>C. Since:</b> Kể từ khi / Bởi vì.<br>
                    <b>D. Because:</b> Bởi vì.<br>
                    <br>👉 <b>Đáp án B</b>. "When" hợp lý nhất về mặt ngữ cảnh tường thuật trình tự hành động: Khi mang đến thì hỏi hóa đơn.
                `
            },
            {
                id: 10,
                type: "mcq",
                question: "Tom: 'Do you ever drink coffee?' – Lan: 'Yes, but only _____, not often. Just a few times a week.'",
                options: ["usually", "sometimes", "rarely", "never"],
                correct: 1,
                explanation: `
                    <span class="translation">Dịch: Lan: 'Có, nhưng chỉ ____ thôi, không thường xuyên. Chỉ vài lần một tuần.'</span><br>
                    <b>A. Usually:</b> Thường xuyên (Mâu thuẫn với "not often").<br>

        let userAnswers = {};

        // --- RENDER HÀM ---
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            let html = '';

            quizData.forEach((q, index) => {
                // Check if we need to display a reading passage first
                if (q.passageContent && !q.type.includes('linked')) {
                    html += `<div class="reading-passage">
                        ${q.passageTitle ? `<h3 style="color:var(--primary); margin-top:0;">${q.passageTitle}</h3>` : ''}
                        ${q.passageContent}
                    </div>`;
                }

                // Card Start
                html += `<div class="card" id="card-${index}">`;
                
                // Question Number
                html += `<div class="question-number">Question ${q.id}</div>`;

                // Question Text
                html += `<div class="question-text">${q.question}</div>`;

                // Sign Image (Simulated)
                if (q.signHTML) {
                    html += `<div class="sign-box">${q.signHTML}</div>`;
                }

                // Options
                html += `<div class="options-grid">`;
                q.options.forEach((opt, optIndex) => {
                    html += `
                        <button class="btn-option" 
                            id="btn-${index}-${optIndex}" 
                            onclick="selectOption(${index}, ${optIndex})">
                            ${String.fromCharCode(65 + optIndex)}. ${opt}
                        </button>
                    `;
                });
                html += `</div>`;

                // Check Button
                html += `
                    <div class="check-btn-container">
                        <button class="btn-check" onclick="checkIndividualAnswer(${index})">Kiểm tra</button>
                    </div>
                `;

                // Explanation
                html += `
                    <div class="explanation" id="exp-${index}">
                        <div class="exp-title">💡 Giải thích chi tiết:</div>
                        <div class="exp-detail">${q.explanation}</div>
                    </div>
                `;

                html += `</div>`; // Card End
            });

            container.innerHTML = html;
        }

        function selectOption(qIndex, optIndex) {
            // Save answer
            userAnswers[qIndex] = optIndex;

            // Update UI
            // Remove 'selected' from all options in this question
            const buttons = document.querySelectorAll(`#card-${qIndex} .btn-option`);
            buttons.forEach(btn => btn.classList.remove('selected'));

            // Add 'selected' to clicked
            const selectedBtn = document.getElementById(`btn-${qIndex}-${optIndex}`);
            selectedBtn.classList.add('selected');
            
            // Remove warning if exists
            document.getElementById(`card-${qIndex}`).classList.remove('warning');
        }

        function checkIndividualAnswer(qIndex) {
            const answer = userAnswers[qIndex];
            const qData = quizData[qIndex];
            const expBox = document.getElementById(`exp-${qIndex}`);
            
            if (answer === undefined) {
                // Shake card if no answer
                const card = document.getElementById(`card-${qIndex}`);
                card.classList.add('warning');
                setTimeout(() => card.classList.remove('warning'), 500);
                return;
            }

            const btns = document.querySelectorAll(`#card-${qIndex} .btn-option`);
            
            // Disable buttons
            btns.forEach(btn => btn.disabled = true);

            // Show correct/wrong
            if (answer === qData.correct) {
                document.getElementById(`btn-${qIndex}-${answer}`).classList.add('correct');
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.6 },
                    colors: ['#00D26A', '#8854C0']
                });
            } else {
                document.getElementById(`btn-${qIndex}-${answer}`).classList.add('wrong');
                document.getElementById(`btn-${qIndex}-${qData.correct}`).classList.add('correct-answer-highlight');
            }

            // Show explanation
            expBox.classList.add('visible');
            
            // Hide check button after checking
            const checkBtn = document.querySelector(`#card-${qIndex} .btn-check`);
            checkBtn.style.display = 'none';
        }

        function submitQuiz() {
            let score = 0;
            let total = quizData.length;
            let unanswered = [];

            quizData.forEach((q, index) => {
                // Auto check all
                if (userAnswers[index] === undefined) {
                    unanswered.push(index + 1);
                    // Mark unanswered visually
                    document.getElementById(`card-${index}`).classList.add('warning');
                    // Show correct answer for unanswered
                     document.getElementById(`btn-${index}-${q.correct}`).classList.add('correct-answer-highlight');
                     document.getElementById(`exp-${index}`).classList.add('visible');
                } else {
                    if (userAnswers[index] === q.correct) {
                        score++;
                    }
                    // Trigger visual check for all
                    checkIndividualAnswer(index);
                }
            });

            const scoreArea = document.getElementById('score-area');
            scoreArea.style.display = 'block';
            scoreArea.innerHTML = `Kết quả: ${score}/${total}`;

            // Confetti shower if score is high
            if (score > total * 0.7) {
                let duration = 3 * 1000;
                let animationEnd = Date.now() + duration;
                let defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                let random = function(min, max) { return Math.random() * (max - min) + min; };

                let interval = setInterval(function() {
                    let timeLeft = animationEnd - Date.now();

                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }

                    let particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }

            alert(`Bạn đã hoàn thành bài thi!\nĐiểm số: ${score}/${total}\n${score === total ? "Xuất sắc! Bạn là thiên tài!" : "Hãy xem lại lời giải chi tiết bên dưới nhé!"}`);
        }

        // Initialize
        renderQuiz();

    </script>
