<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Vocabulary & Grammar Quiz - Ms. Chí Nên</title>
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Import Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-color: #8854C0; /* Tím hồng nhạt */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --background-pattern: #f0f3f8;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--background-pattern);
            background-image: radial-gradient(#e6e6e6 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: #fff;
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #eee;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px #eee;
        }

        h3 {
            color: #57606f;
            margin-top: 5px;
            font-weight: 600;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 3px solid #f1f2f6;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-number {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2f3542;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .hint-text {
            font-size: 0.9rem;
            color: #747d8c;
            font-style: italic;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hint-text::before {
            content: "💡";
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            padding: 15px 10px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: #57606f;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 0 #d1d1d1;
            position: relative;
            text-align: left;
            padding-left: 20px;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #d1d1d1;
        }

        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 5px 0 #009e4f;
            animation: pop 0.4s ease;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #ff2e43;
            box-shadow: 0 5px 0 #d61c30;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .explanation-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 6px solid var(--primary-color);
            border-radius: 10px;
            display: none; /* Hidden initially */
            animation: slideDown 0.5s ease-out;
            font-size: 1rem;
            line-height: 1.6;
            color: #2f3542;
            white-space: pre-line; /* Preserves newlines in text */
        }
        
        .explanation-header {
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px dashed #ddd;
            padding-bottom: 5px;
            display: block;
        }

        /* Animations */
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-controls {
            margin-top: 40px;
            text-align: center;
            width: 100%;
        }

        .submit-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            border-radius: 50px;
            box-shadow: 0 8px 0 #009e82;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-4px);
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #009e82;
        }

        /* Modal Score */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 5px solid var(--primary-color);
            animation: pop 0.5s ease;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--secondary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 0 auto 20px;
            box-shadow: 0 10px 0 #009e82;
        }

        .modal-text {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        
        .teacher-badge {
            display: inline-block;
            background: #ffec99;
            color: #e67e22;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 5px;
            transform: rotate(-2deg);
        }

    </style>
</head>
<body>

    <header>
        <h1>Shopping Grammar Quiz (Part 2)</h1>
        <div class="teacher-badge">Giáo viên: Ms. Chí Nên</div>
        <h3>Luyện tập Từ vựng mua sắm & Trạng từ chỉ tần suất</h3>
    </header>

    <div class="quiz-container" id="quizContainer">
        <!-- Javascript will inject questions here -->
    </div>

    <div class="footer-controls">
        <button class="submit-btn" onclick="finishQuiz()">NỘP BÀI & XEM ĐIỂM</button>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2 style="color: var(--primary-color);">Kết Quả Bài Làm</h2>
            <div class="score-circle" id="scoreDisplay">0/0</div>
            <p class="modal-text" id="feedbackMessage">Bạn làm rất tốt!</p>
            <button class="submit-btn" onclick="closeModal()">Xem lại bài</button>
        </div>
    </div>

    <script>
        // DATA SOURCE
        const quizData = [
            {
                id: 31,
                question: "Some people go to shopping centres to ____________ the heat or cold outside.",
                hint: "Hành động này có nghĩa là trốn tránh/tránh xa thời tiết khắc nghiệt.",
                options: [
                    { text: "keep", explanation: "❌ Sai. \"Keep\" (v): giữ.", isCorrect: false },
                    { text: "stop", explanation: "❌ Sai. \"Stop\" (v): dừng lại.", isCorrect: false },
                    { text: "get", explanation: "❌ Sai. \"Get\" (v): lấy/nhận.", isCorrect: false },
                    { text: "avoid", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. keep (v): giữ\n- B. stop (v): dừng\n- C. get (v): lấy/nhận\n- D. avoid (v): tránh\n\n2. Giải thích: Mọi người vào trung tâm thương mại (có điều hòa) để \"tránh\" cái nóng hoặc lạnh bên ngoài.\n\n3. Dịch câu: Một số người đến các trung tâm thương mại để tránh cái nóng hoặc lạnh bên ngoài.", isCorrect: true }
                ]
            },
            {
                id: 32,
                question: "Do you like ____________ products?",
                hint: "Tính từ ghép chỉ cây cối được trồng tại nhà.",
                options: [
                    { text: "home-growing", explanation: "❌ Sai dạng từ.", isCorrect: false },
                    { text: "home-grew", explanation: "❌ Sai dạng từ (đây là quá khứ đơn).", isCorrect: false },
                    { text: "home-grown", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. home-growing (V-ing): đang trồng tại nhà\n- B. home-grew (V-ed): đã trồng (quá khứ)\n- C. home-grown (adj/V3): nhà trồng (được trồng tại nhà)\n- D. home-grow (V): trồng tại nhà\n\n2. Giải thích: Cần một tính từ ghép (compound adjective) để bổ nghĩa cho \"products\". \"Home-grown\" là từ đúng.\n\n3. Dịch câu: Bạn có thích các sản phẩm nhà trồng không?", isCorrect: true },
                    { text: "home-grow", explanation: "❌ Sai dạng từ.", isCorrect: false }
                ]
            },
            {
                id: 33,
                question: "The weather ____________ shopping at an open-air market.",
                hint: "Động từ 'ảnh hưởng', chú ý chia động từ theo chủ ngữ số ít.",
                options: [
                    { text: "effect", explanation: "❌ Sai. \"Effect\" (n) là danh từ (ảnh hưởng/hiệu ứng). Ở đây cần động từ.", isCorrect: false },
                    { text: "effect", explanation: "❌ Sai (lặp lại đáp án A).", isCorrect: false },
                    { text: "affects", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A/B. effect (n): sự ảnh hưởng/hiệu quả\n- C. affects (v): ảnh hưởng (chia số ít)\n- D. affect (v): ảnh hưởng (nguyên thể/số nhiều)\n\n2. Giải thích: Cần động từ. Chủ ngữ \"The weather\" là số ít -> động từ thêm \"s\" -> affects.\n\n3. Dịch câu: Thời tiết ảnh hưởng đến việc mua sắm tại chợ ngoài trời.", isCorrect: true },
                    { text: "affect", explanation: "❌ Sai ngữ pháp. Chủ ngữ số ít (weather) thì động từ phải thêm s.", isCorrect: false }
                ]
            },
            {
                id: 34,
                question: "Let's go to ____________ shops to buy something as presents for our relatives after the trip.",
                hint: "Cửa hàng bán đồ đặc sản địa phương.",
                options: [
                    { text: "specialise", explanation: "❌ Sai. Đây là động từ (chuyên về).", isCorrect: false },
                    { text: "speciality", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. specialise (v): chuyên về\n- B. speciality (n/adj): đặc sản/chuyên doanh\n- C. special (adj): đặc biệt\n- D. specially (adv): một cách đặc biệt\n\n2. Giải thích: Cụm từ \"speciality shops\" nghĩa là cửa hàng bán đồ đặc sản/đồ chuyên dụng (thường mua làm quà).\n\n3. Dịch câu: Hãy đến các cửa hàng đặc sản để mua chút quà cho họ hàng sau chuyến đi nhé.", isCorrect: true },
                    { text: "special", explanation: "❌ Chưa chính xác. \"Special shops\" nghĩa là cửa hàng đặc biệt, nhưng mua quà lưu niệm/đặc sản thì dùng \"speciality shops\" đúng thuật ngữ hơn.", isCorrect: false },
                    { text: "specially", explanation: "❌ Sai. Đây là trạng từ.", isCorrect: false }
                ]
            },
            {
                id: 35,
                question: "We can find many products ____________ lower prices in a discount shop.",
                hint: "Giới từ đi với 'price' (giá cả).",
                options: [
                    { text: "at", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. at (prep): tại\n- B. by (prep): bởi\n- C. with (prep): với\n- D. on (prep): trên\n\n2. Giải thích: Cấu trúc \"at a price\" (ở mức giá nào đó). Ví dụ: at a low price, at a high price.\n\n3. Dịch câu: Chúng ta có thể tìm thấy nhiều sản phẩm ở mức giá thấp hơn trong một cửa hàng giảm giá.", isCorrect: true },
                    { text: "by", explanation: "❌ Sai.", isCorrect: false },
                    { text: "with", explanation: "❌ Sai.", isCorrect: false },
                    { text: "on", explanation: "❌ Sai.", isCorrect: false }
                ]
            },
            {
                id: 36,
                question: "I don't like this store. The staff are rude and the ____________ service is really bad, too.",
                hint: "Dịch vụ chăm sóc... (người mua hàng).",
                options: [
                    { text: "costume", explanation: "❌ Sai. Nghĩa là trang phục hóa trang.", isCorrect: false },
                    { text: "customer", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. costume (n): trang phục\n- B. customer (n): khách hàng\n- C. customers (n): các khách hàng\n- D. custom (n): phong tục\n\n2. Giải thích: Cụm danh từ \"customer service\" (dịch vụ khách hàng/chăm sóc khách hàng).\n\n3. Dịch câu: Tôi không thích cửa hàng này. Nhân viên thì thô lỗ và dịch vụ khách hàng cũng thực sự rất tệ.", isCorrect: true },
                    { text: "customers", explanation: "❌ Sai. Trong danh từ ghép, danh từ đứng trước thường để số ít (customer service).", isCorrect: false },
                    { text: "custom", explanation: "❌ Sai nghĩa.", isCorrect: false }
                ]
            },
            {
                id: 37,
                question: "He wants to ____________ about the package he has just got.",
                hint: "Sau 'want to' là động từ nguyên thể.",
                options: [
                    { text: "complained", explanation: "❌ Sai thì (quá khứ).", isCorrect: false },
                    { text: "complaining", explanation: "❌ Sai dạng (V-ing).", isCorrect: false },
                    { text: "complain", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. complained (V-ed): đã phàn nàn\n- B. complaining (V-ing): đang phàn nàn\n- C. complain (V-inf): phàn nàn\n- D. complains (V-s): phàn nàn (chia số ít)\n\n2. Giải thích: Cấu trúc \"want to + V-inf\" (muốn làm gì).\n\n3. Dịch câu: Anh ấy muốn khiếu nại/phàn nàn về gói hàng anh ấy vừa nhận được.", isCorrect: true },
                    { text: "complains", explanation: "❌ Sai dạng. Sau \"to\" là động từ nguyên thể.", isCorrect: false }
                ]
            },
            {
                id: 38,
                question: "Never buy things you don't need just because they are on ____________.",
                hint: "Cụm từ chỉ việc hàng hóa đang được bán rẻ hơn bình thường.",
                options: [
                    { text: "sale", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. sale (n): sự giảm giá\n- B. sell (v): bán\n- C. selling (v-ing): đang bán\n- D. sold (v-ed): đã bán\n\n2. Giải thích: Cụm từ \"on sale\" nghĩa là đang được giảm giá.\n\n3. Dịch câu: Đừng bao giờ mua những thứ bạn không cần chỉ vì chúng đang được giảm giá.", isCorrect: true },
                    { text: "sell", explanation: "❌ Sai. Đây là động từ.", isCorrect: false },
                    { text: "selling", explanation: "❌ Sai.", isCorrect: false },
                    { text: "sold", explanation: "❌ Sai.", isCorrect: false }
                ]
            },
            {
                id: 39,
                question: "Can you wave over a sales ____________? I have a question about this jacket.",
                hint: "Danh từ chỉ người nhân viên bán hàng.",
                options: [
                    { text: "assistant", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. assistant (n): trợ lý/người hỗ trợ\n- B. assistance (n): sự hỗ trợ\n- C. assist (v): hỗ trợ\n- D. assisting (v-ing): đang hỗ trợ\n\n2. Giải thích: \"Sales assistant\" là nhân viên bán hàng (người).\n\n3. Dịch câu: Bạn có thể gọi một nhân viên bán hàng lại đây không? Tôi có câu hỏi về chiếc áo khoác này.", isCorrect: true },
                    { text: "assistance", explanation: "❌ Sai. Đây là danh từ chỉ hành động/sự việc, không phải người.", isCorrect: false },
                    { text: "assist", explanation: "❌ Sai. Động từ.", isCorrect: false },
                    { text: "assisting", explanation: "❌ Sai.", isCorrect: false }
                ]
            },
            {
                id: 40,
                question: "____________ online is more convenient than other kinds of shopping.",
                hint: "Hành động (V-ing) đứng đầu câu làm chủ ngữ.",
                options: [
                    { text: "Shops", explanation: "❌ Sai.", isCorrect: false },
                    { text: "Shopper", explanation: "❌ Sai.", isCorrect: false },
                    { text: "Shopping", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. Shops (n/v): cửa hàng\n- B. Shopper (n): người mua\n- C. Shopping (Gerund): việc mua sắm\n- D. Shop (n/v): cửa hàng\n\n2. Giải thích: Cần một Danh động từ (V-ing) đứng đầu câu làm chủ ngữ chỉ hành động. \"Shopping online\" (Việc mua sắm trực tuyến).\n\n3. Dịch câu: Mua sắm trực tuyến thì tiện lợi hơn các kiểu mua sắm khác.", isCorrect: true },
                    { text: "Shop", explanation: "❌ Sai. Động từ nguyên thể không đứng làm chủ ngữ theo cách này.", isCorrect: false }
                ]
            },
            {
                id: 41,
                question: "He lives next door but I ___________ him.",
                hint: "Quy tắc: Trạng từ đứng TRƯỚC động từ thường.",
                options: [
                    { text: "rarely see", explanation: "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. rarely see (adv + V)\n- B/C/D. sai trật tự hoặc ngữ pháp\n\n2. Giải thích: \n- Trạng từ chỉ tần suất (rarely) đứng TRƯỚC động từ thường (see).\n- Chủ ngữ \"I\" đi với động từ nguyên thể \"see\".\n\n3. Dịch câu: Anh ấy sống ngay nhà bên cạnh nhưng tôi hiếm khi gặp anh ấy.", isCorrect: true },
                    { text: "sees rarely", explanation: "❌ Sai trật tự và chia động từ (I không đi với sees).", isCorrect: false },
                    { text: "see rarely", explanation: "❌ Sai trật tự từ.", isCorrect: false },
                    { text: "rarely sees", explanation: "❌ Sai chia động từ (I không đi với sees).", isCorrect: false }
                ]
            },
            {
                id: 42,
                question: "She ___________ at home on Sunday.",
                hint: "Quy tắc: Trạng từ đứng SAU động từ To Be.",
                options: [
                    { text: "are always", explanation: "❌ Sai động từ (She không đi với are).", isCorrect: false },

        let score = 0;
        let totalQuestions = quizData.length;
        let answeredCount = 0;

        // Sound Effects (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding! (High pitch sine wave)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                // Buzz / "Téo tèo tèo" (Sawtooth descending)
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${index}`;

                // HTML Structure
                card.innerHTML = `
                    <div class="question-header">
                        <span class="question-number">Câu ${item.id}</span>
                    </div>
                    <div class="question-text">${item.question}</div>
                    <div class="hint-text">${item.hint}</div>
                    <div class="options-grid" id="options-${index}">
                        <!-- Options generated below -->
                    </div>
                    <div class="explanation-box" id="explain-${index}">
                        <span class="explanation-header">Ms. Chí Nên giải thích chi tiết:</span>
                        <div id="explain-text-${index}"></div>
                    </div>
                `;

                // Add card to container
                container.appendChild(card);

                // Add Options buttons
                const optionsGrid = card.querySelector(`#options-${index}`);
                item.options.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = `${String.fromCharCode(65 + optIndex)}. ${opt.text}`;
                    btn.onclick = () => checkAnswer(index, optIndex, opt.isCorrect, btn);
                    optionsGrid.appendChild(btn);
                });
            });
        }

        function checkAnswer(questionIndex, optionIndex, isCorrect, btnElement) {
            // Prevent re-clicking
            const card = document.getElementById(`card-${questionIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            
            // If already answered, do nothing
            if (card.getAttribute('data-answered') === 'true') return;

            // Resume Audio Context if needed
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            card.setAttribute('data-answered', 'true');
            answeredCount++;

            // Explanation Display Logic (UPDATED)
            const explainBox = document.getElementById(`explain-${questionIndex}`);
            const explainText = document.getElementById(`explain-text-${questionIndex}`);
            
            // Get question data
            const questionData = quizData[questionIndex];
            
            // Tìm đáp án ĐÚNG để lấy nội dung giải thích đầy đủ
            const correctOptionData = questionData.options.find(opt => opt.isCorrect);
            
            explainBox.style.display = 'block';
            
            // Luôn sử dụng nội dung giải thích CHI TIẾT từ đáp án đúng
            let detailedExplanation = correctOptionData.explanation;
            
            // Nếu chọn sai, đổi dòng đầu tiên "✅ Chính xác!" thành thông báo sai để hợp lý hơn
            if (!isCorrect) {
                 detailedExplanation = detailedExplanation.replace("✅ Chính xác!", "❌ Chưa chính xác. Đây là giải thích chi tiết:");
            }

            explainText.innerHTML = detailedExplanation.replace(/\n/g, '<br>');

            // Styles & Effects
            if (isCorrect) {
                btnElement.classList.add('correct');
                playSound('correct');
                score++;
                
                // Confetti centered on the button
                const rect = btnElement.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;
                
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { x: x, y: y },
                    colors: ['#00D26A', '#ffffff']
                });

            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                
                // Highlight the correct answer automatically
                const correctBtnIndex = questionData.options.findIndex(opt => opt.isCorrect);
                buttons[correctBtnIndex].classList.add('correct');
            }

            // Disable all buttons in this card
            buttons.forEach(btn => btn.disabled = true);
        }

        function finishQuiz() {
            const modal = document.getElementById('resultModal');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const feedback = document.getElementById('feedbackMessage');
            
            scoreDisplay.textContent = `${score}/${totalQuestions}`;
            
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                feedback.textContent = "Xuất sắc! Ms. Chí Nên rất tự hào về em! 🌟";
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
            } else if (percentage >= 80) {
                feedback.textContent = "Làm tốt lắm! Em rất chăm chỉ! 💪";
            } else if (percentage >= 50) {
                feedback.textContent = "Cố gắng thêm một chút nữa nhé! Em làm được mà! 😊";
            } else {
                feedback.textContent = "Đừng buồn nhé, xem kỹ lại giải thích để tiến bộ hơn nào! ❤️";
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        // Initialize
        window.onload = renderQuiz;

    </script>
