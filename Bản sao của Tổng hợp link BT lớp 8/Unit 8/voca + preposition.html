    <style>
        body {

            border: 4px solid #fff;
        }

        /* 3D Button Styles */
        .btn-option {
            transition: all 0.1s ease;
            position: relative;
            top: 0;
            cursor: pointer;
            border-bottom: 6px solid rgba(0,0,0,0.15);
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(105%);
        }

            transform: translateY(4px);
            border-bottom-width: 0px;
            box-shadow: none;
        }

            color: white !important;
            border-color: #00B25A !important;
            border-bottom-color: #008f48 !important;

            background-color: #FF4757 !important;
            color: white !important;
            border-color: #FF2E40 !important;
            border-bottom-color: #d6303e !important;
        }

            opacity: 0.6;
            cursor: not-allowed !important;

            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }

    <!-- Audio Scripts (Web Audio API for simple sounds) -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playCorrectSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function playWrongSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.4);
        }
    </script>

              "hint": "Cụm từ chỉ vật đang được rao bán (đặc biệt là nhà đất)."
            },
            {
              "questionNumber": 12,
              "question": "Everything goes ______________ sale as soon as the doors open. Today is Black Friday.",
              "answerOptions": [
                { "text": "on", "rationale": "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. on (prep): trên\n- B. for (prep): cho\n- C. in (prep): trong\n- D. at (prep): tại\n\n2. Giải thích: Ngữ cảnh 'Black Friday' (giảm giá), nên dùng 'go on sale' (được bán giảm giá/được tung ra bán).\n\n3. Dịch câu: Mọi thứ được giảm giá ngay khi cửa mở. Hôm nay là Black Friday.", "isCorrect": true },
                { "text": "for", "rationale": "❌ 'Go for sale' không phải là cụm từ thông dụng trong ngữ cảnh này.", "isCorrect": false },

                { "text": "at", "rationale": "❌ Sai giới từ.", "isCorrect": false }

              "hint": "Cụm từ chỉ việc hàng hóa được giảm giá."
            },
            {
              "questionNumber": 13,
              "question": "He spent a lot of time listening to DVDs and just hanging out ______________ friends.",
              "answerOptions": [
                { "text": "with", "rationale": "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. with (prep): với\n- B. to (prep): tới\n- C. for (prep): cho\n- D. about (prep): về\n\n2. Giải thích: Cụm 'hang out with someone' (tụ tập với ai).\n\n3. Dịch câu: Anh ấy dành nhiều thời gian nghe đĩa DVD và chỉ tụ tập với bạn bè.", "isCorrect": true },
                { "text": "to", "rationale": "❌ Sai giới từ.", "isCorrect": false },
                { "text": "for", "rationale": "❌ Sai giới từ.", "isCorrect": false },
                { "text": "about", "rationale": "❌ Sai giới từ.", "isCorrect": false }
              ],
              "hint": "Đi chơi VỚI ai đó."
            },
            {
              "questionNumber": 14,
              "question": "Would you prefer to pay ______________ cash, cheque or credit card?",
              "answerOptions": [
                { "text": "in", "rationale": "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. in (prep): trong\n- B. on (prep): trên\n- C. at (prep): tại\n- D. for (prep): cho\n\n2. Giải thích: \n- Pay IN cash (trả bằng tiền mặt).\n- Pay BY cheque/credit card (trả bằng séc/thẻ).\nLưu ý: Một số tài liệu cũ dùng 'by cash' nhưng chuẩn ngữ pháp là 'in cash'.\n\n3. Dịch câu: Bạn muốn trả bằng tiền mặt, séc hay thẻ tín dụng?", "isCorrect": true },
                { "text": "on", "rationale": "❌ Sai giới từ.", "isCorrect": false },
                { "text": "at", "rationale": "❌ Sai giới từ.", "isCorrect": false },
                { "text": "for", "rationale": "❌ 'Pay for' là trả tiền cho món hàng, không phải phương thức thanh toán.", "isCorrect": false }
              ],
              "hint": "Cụm từ: pay ... cash (trả bằng tiền mặt)."
            },
            {
              "questionNumber": 15,
              "question": "He chose a shirt ______________ the many in the shop.",
              "answerOptions": [
                { "text": "from", "rationale": "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. from (prep): từ\n- B. of (prep): của\n- C. in (prep): trong\n- D. on (prep): trên\n\n2. Giải thích: 'Choose from' (lựa chọn từ trong số...).\n\n3. Dịch câu: Anh ấy đã chọn một chiếc áo sơ mi từ rất nhiều chiếc trong cửa hàng.", "isCorrect": true },
                { "text": "of", "rationale": "❌ Sai giới từ.", "isCorrect": false },
                { "text": "in", "rationale": "❌ Sai giới từ.", "isCorrect": false },
                { "text": "on", "rationale": "❌ Sai giới từ.", "isCorrect": false }
              ],
              "hint": "Chọn một cái TỪ trong số nhiều cái."
            },
            {
              "questionNumber": 16,
              "question": "I tried ______________ six pairs of trousers before I found a pair that fitted.",
              "answerOptions": [
                { "text": "on", "rationale": "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. on (prep): trên\n- B. in (prep): trong\n- C. at (prep): tại\n- D. out (prep): ngoài\n\n2. Giải thích: Cụm động từ 'try on' (mặc thử).\n\n3. Dịch câu: Tôi đã thử sáu chiếc quần dài trước khi tìm được một chiếc vừa vặn.", "isCorrect": true },
                { "text": "in", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "at", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "out", "rationale": "❌ 'Try out' nghĩa là thử nghiệm máy móc/phương pháp, không dùng cho quần áo.", "isCorrect": false }
              ],
              "hint": "Cụm động từ: Try ... (thử đồ)."
            },
            {
              "questionNumber": 17,
              "question": "Everything went according ______________ the schedule.",
              "answerOptions": [
                { "text": "to", "rationale": "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. to (prep): tới\n- B. with (prep): với\n- C. by (prep): bởi\n- D. of (prep): của\n\n2. Giải thích: Cụm từ cố định 'according to' (theo như).\n\n3. Dịch câu: Mọi thứ đã diễn ra theo đúng lịch trình.", "isCorrect": true },
                { "text": "with", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "by", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "of", "rationale": "❌ Sai.", "isCorrect": false }
              ],
              "hint": "Cụm từ: According ... (theo như)."
            },
            {
              "questionNumber": 18,
              "question": "______________ reasons of security, the door is always kept locked.",
              "answerOptions": [
                { "text": "For", "rationale": "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. For (prep): Cho/Vì\n- B. From (prep): Từ\n- C. With (prep): Với\n- D. Because (conj): Bởi vì\n\n2. Giải thích: 'For reasons of...' (Vì lý do...). Lưu ý 'Because' phải cộng với mệnh đề, ở đây là cụm danh từ nên dùng giới từ 'For'.\n\n3. Dịch câu: Vì lý do an ninh, cửa luôn được khóa.", "isCorrect": true },
                { "text": "From", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "With", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "Because", "rationale": "❌ Sai ngữ pháp. 'Because' không đi trực tiếp với danh từ nếu không có 'of'. (Phải là 'Because of').", "isCorrect": false }
              ],
              "hint": "Giới từ chỉ mục đích/nguyên nhân: ... reasons of."
            },
            {
              "questionNumber": 19,
              "question": "The restaurant charges high prices ______________ its food.",
              "answerOptions": [
                { "text": "for", "rationale": "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. for (prep): cho\n- B. to (prep): tới\n- C. on (prep): trên\n- D. with (prep): với\n\n2. Giải thích: 'Charge a price FOR something' (Tính giá cho cái gì).\n\n3. Dịch câu: Nhà hàng tính giá cao cho các món ăn của mình.", "isCorrect": true },
                { "text": "to", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "on", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "with", "rationale": "❌ Sai.", "isCorrect": false }
              ],
              "hint": "Tính tiền CHO cái gì."
            },
            {
              "questionNumber": 20,
              "question": "We wandered ______________ the beautifully decorated rooms of the Palace.",
              "answerOptions": [
                { "text": "through", "rationale": "✅ Chính xác!\n\n1. Phân tích từ vựng:\n- A. through (prep): xuyên qua/đi qua\n- B. on (prep): trên\n- C. at (prep): tại\n- D. with (prep): với\n\n2. Giải thích: 'Wander through' (đi lang thang qua/khắp) các căn phòng.\n\n3. Dịch câu: Chúng tôi đi dạo qua những căn phòng được trang trí lộng lẫy của Cung điện.", "isCorrect": true },
                { "text": "on", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "at", "rationale": "❌ Sai.", "isCorrect": false },
                { "text": "with", "rationale": "❌ Sai.", "isCorrect": false }
              ],
              "hint": "Giới từ chỉ sự chuyển động qua không gian kín."
            }
          ]
        };

        const container = document.getElementById('quiz-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        let correctCount = 0;
        let wrongCount = 0;
        let answeredCount = 0;
        const totalQuestions = quizData.questions.length;

        // Render Questions
        function renderQuiz() {
            quizData.questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = "card-container p-6 md:p-8 flex flex-col gap-6 relative shadow-card transition-all duration-300";
                card.id = `card-${index}`;

                // Question Header
                const headerHtml = `
                    <div class="flex justify-between items-start">
                        <span class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-bold shadow-sm">
                            Câu ${q.questionNumber}
                        </span>
                        <div class="text-xs font-semibold text-gray-400 cursor-help" title="Gợi ý">💡 Hint</div>
                    </div>
                    <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-snug">
                        ${q.question}
                    </h3>
                `;

                // Options Grid
                let optionsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
                q.answerOptions.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <button 
                            onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect})" 
                            class="btn-option bg-white border-2 border-gray-200 text-gray-700 text-lg font-bold py-4 px-6 rounded-2xl w-full text-left"
                            id="btn-${index}-${optIndex}">
                            ${String.fromCharCode(65 + optIndex)}. ${opt.text}
                        </button>
                    `;
                });
                optionsHtml += '</div>';

                // Explanation Box (Hidden)
                // Note: Formatting rationale text to be HTML safe and styled
                const explanationText = q.answerOptions.find(o => o.isCorrect).rationale
                    .replace(/\n/g, '<br>')
                    .replace(/✅/g, '<span class="text-green-500 text-xl mr-2">✅</span>')
                    .replace(/❌/g, '<span class="text-red-500 text-xl mr-2">❌</span>');

                const explanationHtml = `
                    <div id="explanation-${index}" class="explanation-box mt-4 bg-purple-50 rounded-2xl p-6 border-l-8 border-purple-400 shadow-inner">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="bg-purple-500 text-white rounded-full p-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                                </svg>
                            </span>
                            <h4 class="font-bold text-purple-700 uppercase tracking-wide">Giải thích chi tiết (Ms. Chí Nên)</h4>
                        </div>
                        <div class="text-gray-700 leading-relaxed text-sm md:text-base font-medium">
                            ${explanationText}
                        </div>
                    </div>
                `;

                card.innerHTML = headerHtml + optionsHtml + explanationHtml;
                container.appendChild(card);
            });

            // Add Final Submit Button area (though interaction is immediate, this triggers the modal)
            const finishBtnArea = document.createElement('div');
            finishBtnArea.className = "text-center mt-8 pb-12";
            finishBtnArea.innerHTML = `
                <button onclick="showSummary()" class="bg-secondary text-white font-extrabold text-2xl py-4 px-12 rounded-full shadow-3d hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all uppercase tracking-widest border-4 border-white">
                    Nộp Bài & Xem Điểm
                </button>
            `;
            container.appendChild(finishBtnArea);
        }

        // Check Answer Logic
        window.checkAnswer = function(questionIndex, optionIndex, isCorrect) {
            const currentCard = document.getElementById(`card-${questionIndex}`);
            
            // Prevent re-answering
            if(currentCard.getAttribute('data-answered') === 'true') return;
            currentCard.setAttribute('data-answered', 'true');

            answeredCount++;
            updateProgress();

            const selectedBtn = document.getElementById(`btn-${questionIndex}-${optionIndex}`);
            const allBtns = currentCard.querySelectorAll('button');

            // Disable all buttons in this card
            allBtns.forEach(btn => {
                btn.classList.add('status-disabled');
                btn.disabled = true;
            });

            // Show explanation
            document.getElementById(`explanation-${questionIndex}`).style.display = 'block';

            if (isCorrect) {
                // Correct styling
                selectedBtn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
                selectedBtn.classList.add('status-correct');
                selectedBtn.classList.remove('status-disabled'); // Keep opacity full for selected
                
                playCorrectSound();
                triggerConfetti(selectedBtn);
                correctCount++;
            } else {
                // Wrong styling
                selectedBtn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
                selectedBtn.classList.add('status-wrong');
                selectedBtn.classList.add('shake-element');
                selectedBtn.classList.remove('status-disabled');

                // Highlight correct answer automatically
                const data = quizData.questions[questionIndex];
                const correctOptIndex = data.answerOptions.findIndex(o => o.isCorrect);
                const correctBtn = document.getElementById(`btn-${questionIndex}-${correctOptIndex}`);
                correctBtn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
                correctBtn.classList.add('status-correct');
                
                playWrongSound();
                wrongCount++;
            }
        };

        function updateProgress() {
            const percent = (answeredCount / totalQuestions) * 100;
            progressBar.style.width = `${percent}%`;
            progressText.innerText = `${answeredCount}/${totalQuestions} Câu`;
        }

        // Confetti Effect
        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            // Normalized coordinates (0 to 1)
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { x: x, y: y },
                colors: ['#00C9A7', '#8854C0', '#FFD700', '#FF4757'],
                disableForReducedMotion: true
            });
        }

        // Summary Modal
        window.showSummary = function() {
            if (answeredCount < totalQuestions) {
                if(!confirm(`Bạn mới làm ${answeredCount}/${totalQuestions} câu. Bạn có chắc muốn nộp bài không?`)) return;
            }

            document.getElementById('final-score').innerText = correctCount;
            document.getElementById('final-wrong').innerText = wrongCount;
            
            const percentage = (correctCount / totalQuestions) * 100;
            let message = "";
            if (percentage === 100) message = "Tuyệt vời! Em là thiên tài ngữ pháp! 🌟";
            else if (percentage >= 80) message = "Làm tốt lắm! Em rất nắm chắc kiến thức! 👏";
            else if (percentage >= 50) message = "Cố gắng lên! Em đang tiến bộ từng ngày! 💪";
            else message = "Đừng nản chí! Hãy xem kỹ phần giải thích nhé! 📚";

            document.getElementById('feedback-message').innerText = message;
            document.getElementById('summary-modal').classList.remove('hidden');
            
            // Big Confetti
            if (percentage >= 50) {
                const duration = 3000;
                const end = Date.now() + duration;

                (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#00C9A7', '#8854C0']
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#00C9A7', '#8854C0']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
                }());
            }
        };

        // Initialize
        renderQuiz();

    </script>
</body>
</html>
