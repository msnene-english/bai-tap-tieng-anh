<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--rose:#D98C93;--sage:#8FA998;--gold:#C9A227;--ink:#3A3230;--paper:#FFFBF3;--bg:#F3E7DA;
  --good:#2F8F5B;--bad:#D1495B;--dim:#8a7c72}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;position:relative;
  background:var(--bg);
  background-image:radial-gradient(rgba(180,150,120,.10) 1px,transparent 1.3px);background-size:15px 15px}
.drift{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.drift span{position:absolute;font-size:24px;opacity:.2;animation:fl linear infinite}
@keyframes fl{0%{transform:translateY(110vh) rotate(-8deg)}100%{transform:translateY(-15vh) rotate(10deg)}}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:22px 14px 90px}
/* ── RECEIPT HEADER ── */
.pc{background:var(--paper);border-radius:4px;padding:22px 22px 20px;position:relative;margin-bottom:22px;
  box-shadow:0 10px 26px rgba(80,50,30,.18);
  clip-path:polygon(0 0,100% 0,100% 97%,97% 100%,94% 97%,91% 100%,88% 97%,85% 100%,82% 97%,79% 100%,76% 97%,
   73% 100%,70% 97%,67% 100%,64% 97%,61% 100%,58% 97%,55% 100%,52% 97%,49% 100%,46% 97%,43% 100%,40% 97%,
   37% 100%,34% 97%,31% 100%,28% 97%,25% 100%,22% 97%,19% 100%,16% 97%,13% 100%,10% 97%,7% 100%,4% 97%,0 100%)}
.pc h1{font-family:'Courier Prime',monospace;font-weight:700;font-size:clamp(20px,4.4vw,30px);color:var(--rose);
  letter-spacing:.5px}
.pc .sub{font-family:'Baloo 2',cursive;font-weight:700;font-size:.86rem;color:var(--dim);margin-top:8px;line-height:1.7}
.tag{position:absolute;top:16px;right:18px;background:var(--gold);color:#fff;border-radius:6px;padding:6px 12px;
  font-family:'Baloo 2',cursive;font-weight:700;font-size:.85rem;transform:rotate(4deg);box-shadow:2px 3px 6px rgba(0,0,0,.2)}
.teacher-tag{display:inline-block;margin-top:10px;font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;
  color:#fff;background:var(--sage);border-radius:999px;padding:4px 16px}
/* ── SCORE BAR ── */
.sb{position:sticky;top:16px;z-index:20;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:20px;
  border-radius:999px;background:var(--paper);border:2.5px solid var(--rose);box-shadow:0 6px 16px rgba(80,50,30,.15)}
.sb b{font-family:'Baloo 2',cursive;font-size:1rem;color:var(--rose)}
.tr{flex:1;height:10px;background:rgba(217,140,147,.15);border-radius:999px;overflow:hidden}
.fl2{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .45s}
/* ── SECTION ── */
.sec{background:var(--paper);border-radius:16px;padding:18px 16px 20px;margin-bottom:22px;position:relative;
  box-shadow:0 8px 20px rgba(80,50,30,.12);border:2px dashed rgba(217,140,147,.4)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:2px 0 6px}
.pill{color:#fff;border-radius:999px;padding:3px 15px;font-size:.82rem;font-family:'Baloo 2',cursive;font-weight:700}
.st h2{font-family:'Baloo 2',cursive;font-size:1.18rem;color:var(--ink)}
.si{font-size:.87rem;font-weight:600;color:var(--dim);font-style:italic;margin:3px 0 15px;line-height:1.7}
.divider{border:none;border-top:1.5px dashed rgba(217,140,147,.4);margin:10px 0 14px}
/* ── QUESTION ── */
.q{background:#fff;border:2px solid #f1e4d6;border-radius:12px;padding:13px 14px 14px;margin-bottom:13px}
.q.shk{animation:shk .42s ease}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.qn{display:inline-flex;align-items:center;justify-content:center;background:var(--rose);color:#fff;min-width:28px;
  height:25px;padding:0 7px;border-radius:50%;font-size:.76rem;font-weight:800;margin-right:8px;
  font-family:'Baloo 2',cursive}
.qt{font-size:1rem;font-weight:700;color:var(--ink);line-height:1.85}
.qt b{color:var(--rose)}
.pre,.suf{font-weight:800;font-size:1rem;color:var(--ink);line-height:1.6}
.pre{white-space:nowrap}.suf{white-space:normal}
.og{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:680px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.og{grid-template-columns:1fr}}
.ob{background:#fdfaf6;border:2px solid #f1e4d6;border-radius:11px;padding:10px 13px;color:var(--ink);
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;text-align:center;
  transition:all .16s ease;line-height:1.5;word-break:break-word}
.ob:hover:not(.dn){transform:translateY(-2px);border-color:var(--rose);box-shadow:0 5px 12px rgba(217,140,147,.22)}
.ob.ok{background:#e6f6ec;border-color:var(--good);color:var(--good)}
.ob.no{background:#fbe2e5;border-color:var(--bad);color:var(--bad)}
.ob.dim{opacity:.4}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
.ti{flex:1;min-width:190px;padding:9px 13px;border:2px solid #f1e4d6;border-radius:10px;
  font-family:'Nunito';font-size:.96rem;font-weight:800;outline:none;background:#fffdf9;color:var(--ink)}
.ti:focus{border-color:var(--rose)}
.ti.ok{border-color:var(--good);background:#e6f6ec;color:var(--good)}
.ti.no{border-color:var(--bad);background:#fbe2e5;color:var(--bad)}
.ck{background:var(--rose);color:#fff;border:none;border-radius:999px;font-family:'Baloo 2',cursive;
  font-weight:700;font-size:.86rem;padding:11px 22px;cursor:pointer;transition:all .2s;white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(217,140,147,.4)}
.ck:disabled{opacity:.4;cursor:default}
.ck.small{padding:8px 16px;font-size:.82rem}
/* ── TÌM & SỬA LỖI ── */
.efline{font-weight:700;font-size:1.03rem;line-height:2.3;margin-top:8px}
.ul{display:inline-block;position:relative;cursor:pointer;font-weight:800;padding:0 3px;
  border-bottom:3px solid var(--sage);transition:background .15s;border-radius:4px 4px 0 0}
.ul:hover:not(.dn){background:#eef5f0}
.ul .tg{font-family:'Baloo 2',cursive;font-size:.68rem;color:#fff;background:var(--sage);border-radius:5px;
  padding:0 4px;margin-left:2px;vertical-align:super}
.ul.sel{background:#fdf0d6;border-bottom-color:var(--gold)}.ul.sel .tg{background:var(--gold)}
.ul.ok{background:#e6f6ec;border-bottom-color:var(--good)}.ul.ok .tg{background:var(--good)}
.ul.no{background:#fbe2e5;border-bottom-color:var(--bad)}.ul.no .tg{background:var(--bad)}
.ul.dn{cursor:default}.ul.dimx{opacity:.45}
.effix{margin-top:11px;display:none;flex-wrap:wrap;gap:8px;align-items:center;background:#faf2e8;
  border:2px dashed var(--gold);border-radius:12px;padding:10px}
.effix.show{display:flex}
.effix .lb{font-weight:800;color:var(--gold);font-size:.9rem;width:100%}
.qt .hint{display:block;margin-top:6px;font-size:.86rem;font-style:italic;font-weight:700}
.hint{margin-top:9px;background:#faf2e8;border:2px dashed var(--gold);border-radius:10px;padding:7px 11px;
  font-size:.88rem;font-weight:700;line-height:1.7;color:var(--dim)}
/* ── GIẢI THÍCH ── */
.ex{display:none;background:#fdfaf6;border:1.5px solid var(--rose);border-radius:12px;padding:14px;margin-top:12px;
  font-size:.92rem;line-height:1.85;animation:sd .3s ease}
.ex.show{display:block}
@keyframes sd{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.vnt{background:#fdf0d6;border-left:3px solid var(--gold);border-radius:0 9px 9px 0;padding:7px 12px;
  color:#7a5c04;margin-bottom:10px;font-weight:700;line-height:1.75}
.kb{background:#e6f6ec;border:1px solid var(--good);border-radius:9px;padding:7px 11px;margin-bottom:9px;
  font-weight:900;color:#1c6b40;line-height:1.7}
ol{padding-left:18px;margin:0}
ol li{margin-bottom:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:7px 0}
.grid2.wide{grid-template-columns:1fr}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#f8f4ee;border:1px solid #e9dcc9;border-radius:9px;padding:7px 11px;line-height:1.65;
  font-size:.93rem}
.p-word{color:#2563eb;font-weight:800}
.hl-green{color:var(--good);font-weight:900}
.hl-red{color:var(--bad);font-weight:900}
.wt{background:#e2e8f0;color:#475569;padding:1px 6px;border-radius:4px;font-size:.8em;font-weight:800;margin:0 4px}
.p-phonetic{background:#f0e6fa;color:#7c3aed;padding:1px 6px;border-radius:4px;font-size:.83em;font-weight:700}
.p-mean{color:#b5541f;font-weight:700}
.p-grammar{text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2px;
  color:var(--ink);font-weight:600}
.wy{color:#4a3b22;font-weight:600;line-height:1.8}
u{text-decoration:underline;text-decoration-color:var(--rose);text-decoration-thickness:2.5px}
.sub{text-align:center;padding:26px 10px}
.sbtn{background:var(--rose);color:#fff;border:none;border-radius:999px;font-family:'Baloo 2',cursive;
  font-weight:700;font-size:.98rem;padding:15px 40px;cursor:pointer;box-shadow:0 10px 24px rgba(217,140,147,.4);
  transition:all .25s}
.sbtn:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(217,140,147,.5)}
.ov{position:fixed;inset:0;background:rgba(60,40,30,.6);z-index:1000;display:none;align-items:center;
  justify-content:center;backdrop-filter:blur(4px);padding:16px;overflow-y:auto}
.ov.on{display:flex}
.mb{background:var(--paper);border-radius:20px;padding:28px 24px;max-width:440px;width:94%;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto;border:2px solid #fff}
.mb h2{font-family:'Baloo 2',cursive;font-size:1.3rem;color:var(--rose);margin-bottom:14px}
.mb input{width:100%;background:#fff;border:2px solid var(--rose);border-radius:11px;padding:12px 15px;
  color:var(--ink);font-family:'Nunito';font-size:.98rem;font-weight:700;text-align:center;margin-bottom:12px;outline:none}
.mb input.er{border-color:var(--bad);animation:shk .42s ease}
.mb .em{color:var(--bad);font-size:.82rem;margin-bottom:10px;display:none;font-weight:700}
.mb .gr{font-family:'Baloo 2',cursive;font-size:1.2rem;color:var(--sage);margin-bottom:8px}
.mb .rs{font-family:'Courier Prime',monospace;font-size:2.4rem;font-weight:700;color:var(--rose);margin:10px 0 4px}
.mb .rt{font-size:1rem;font-weight:800;color:var(--gold);margin:4px 0 8px}
.mb .rm{font-size:.92rem;font-weight:600;color:#4a3b22;line-height:1.75;margin-bottom:12px}
.mb img{width:100%;max-width:250px;border-radius:12px;margin:12px auto;display:block;border:2px solid #fff;
  box-shadow:0 6px 16px rgba(0,0,0,.2)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:1100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>

<div class="drift" id="drift"></div>

<script>
(function(){
 const W=['🛍️','🧾','🏷️','💳','👜','🛒','✨','💐'];
 const D=document.getElementById('drift');
 for(let i=0;i<14;i++){
  const s=document.createElement('span');s.textContent=W[i%W.length];
  s.style.left=(Math.random()*96)+'%';s.style.fontSize=(18+Math.random()*20).toFixed(0)+'px';
  s.style.animationDuration=(16+Math.random()*16).toFixed(1)+'s';
  s.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  D.appendChild(s);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#D98C93','#8FA998','#C9A227','#2F8F5B','#FFFBF3'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
/* ══ DỮ LIỆU ══ */
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fil(sec,num,q,pre,suf,ans,accept,ex){Q.push({t:'fill',sec,num,q,pre:pre||'',suf:suf||'.',correct:ans,accept,ex})}
function fx(sec,num,parts,letter,accept,ex){Q.push({t:'fix',sec,num,parts,letter,accept,ex})}
function O(w,wt,ipa,mean,ok){return {w,wt,ipa,mean,ok}}
function G4(arr,wide){return '<div class="grid2'+(wide?' wide':'')+'">'+arr.map(o=>'<div><span class="'+
 (o.ok?'hl-green':'p-word')+'">'+o.w+'</span>'+(o.wt?' <span class="wt">'+o.wt+'</span>':'')+
 (o.ipa?' <span class="p-phonetic">'+o.ipa+'</span>':'')+' = <span class="p-mean">'+o.mean+'</span></div>').join('')+'</div>'}
function EX2(vn,arr,right,wrong,wide){
 return '<div class="vnt">💬 Dịch: '+vn+'</div><ol><li>Phân tích 4 đáp án:'+G4(arr,wide)+'</li>'+
  '<li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class="p-grammar">'+right+'</span></li>'+
  '<li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class="p-grammar">'+wrong+'</span></li></ol>'}
function EX1(vn,correct,why){return '<div class="vnt">💬 Dịch: '+vn+'</div><div class="kb">✅ '+correct+'</div>'+
 '<div class="wy"><span class="p-grammar">'+why+'</span></div>'}

/* ═════ SECTION 1 — NGỮ ÂM (5 câu) ═════ */
/* EXK = khung giải thích 4 bước có ô KEY; EX2 tự lấy KEY từ đáp án đúng trong bảng phân tích */
function EXK(key,vn,arr,right,wrong,wide){return (key?'<div class="kb">🔑 ĐÁP ÁN: '+key+'</div>':'')+
 '<div class="vnt">💬 Dịch: '+vn+'</div><ol><li>Phân tích các đáp án:'+G4(arr,wide)+'</li>'+
 '<li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class="p-grammar">'+right+'</span></li>'+
 '<li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class="p-grammar">'+wrong+'</span></li></ol>'}
function EX2(vn,arr,right,wrong,wide){const k=arr.find(x=>x.ok);return EXK(k?k.w:'',vn,arr,right,wrong,wide)}

mcq('S1',1,'Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại:',
 'r<u>a</u>nge',['t<u>a</u>g','r<u>a</u>nge','br<u>a</u>nd','f<u>a</u>shion'],
 EX2('Chọn từ có phần gạch chân phát âm khác ba từ còn lại. (nhãn giá / khoảng giá / nhãn hàng / thời trang)',
 [O('t<u>a</u>g','n','/tæɡ/','nhãn, thẻ giá'),O('r<u>a</u>nge','n','/reɪndʒ/','khoảng, dải sản phẩm',true),
  O('br<u>a</u>nd','n','/brænd/','nhãn hàng, thương hiệu'),O('f<u>a</u>shion','n','/ˈfæʃən/','thời trang')],
 'Trong <b>range</b>, chữ “a” đi liền “-nge” (a + phụ âm + e) nên đọc thành nguyên âm đôi <b>/eɪ/</b>.',
 'tag, brand, fashion đều có “a” nằm trong âm tiết ĐÓNG (a + phụ âm, không có “e” cuối) nên chỉ đọc /æ/ ngắn. Đây là bẫy “cùng mặt chữ, khác âm đọc”.'),'c4');
mcq('S1',2,'Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại:',
 'enc<u>ou</u>rage',['disc<u>ou</u>nt','v<u>ou</u>cher','ann<u>ou</u>nce','enc<u>ou</u>rage'],
 EX2('Chọn từ có phần gạch chân phát âm khác ba từ còn lại. (giảm giá / phiếu quà tặng / thông báo / khuyến khích)',
 [O('disc<u>ou</u>nt','n','/ˈdɪskaʊnt/','sự giảm giá'),O('v<u>ou</u>cher','n','/ˈvaʊtʃə(r)/','phiếu quà tặng'),
  O('ann<u>ou</u>nce','v','/əˈnaʊns/','thông báo'),O('enc<u>ou</u>rage','v','/ɪnˈkʌrɪdʒ/','khuyến khích, động viên',true)],

 'B và C thay lý do “giá cao” bằng cảm xúc chủ quan “không thích”, không đúng với câu gốc chỉ nêu SỰ THẬT về giá; D ngược nghĩa hoàn toàn.','wide'),'c1');

/* ══ DỰNG TRANG ══ */
const TOTAL=Q.length;let answered=0,score=0;const done={},maps={},selSel={};
function bump(){document.getElementById('fb').style.width=(answered/TOTAL*100)+'%';
 document.getElementById('sc').textContent=score;
 const p=answered?score/answered:1;
 document.getElementById('md').textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){
 const d=document.createElement('div');d.className='sec';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+
  '</span><h2>'+title+'</h2></div><div class="si">'+ins+'</div><hr class="divider">';
 APP.appendChild(d);CUR=d}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

sec('var(--rose)','I &amp; II','🔤 Ngữ âm',
 'Chọn từ có phần gạch chân phát âm khác / trọng âm khác với các từ còn lại. (5 câu)');

document.getElementById('tt').textContent=TOTAL;bump();

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="qt">'+h+'Tìm phần chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="efline" id="sg_'+gid+'">'+
   m.parts.map(p=>'<span class="ul" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     p[1]+'<span class="tg">'+p[0]+'</span></span>').join(' ')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 Bấm vào phần con cho là SAI.</div>'+
   '<div class="effix" id="fz_'+gid+'"><span class="lb" id="fl_'+gid+'"></span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="ck small" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const bt=c.querySelector('#b_'+gid),inp=c.querySelector('#i_'+gid);
  bt.onclick=()=>chkf(gid);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr">'+(m.pre?'<span class="pre">'+m.pre+'</span>':'')+
   '<input class="ti" id="i_'+gid+'" placeholder="...gõ câu trả lời..." autocomplete="off" spellcheck="false">'+
   (m.suf&&m.suf!=='.'?'<span class="suf">'+m.suf+'</span>':'')+'</div>'+
   '<div class="fr"><button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const acc=m.accept.map(norm).concat(m.pre?m.accept.map(a=>norm(m.pre+' '+a)):[]);
   const ok=acc.indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   const ex=document.getElementById('e_'+gid);
   if(ok){score++;ding();confetti();ex.classList.add('show')}
   else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);setTimeout(()=>ex.classList.add('show'),700)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,l){
 if(done[gid])return;selSel[gid]=l;
 const wrap=document.getElementById('sg_'+gid);
 [...wrap.children].forEach(el=>el.classList.toggle('sel',el.dataset.l===l));
 document.getElementById('fz_'+gid).classList.add('show');
 document.getElementById('fl_'+gid).textContent='Ô '+l+' cần sửa thành:';
 document.getElementById('hn_'+gid).style.display='none';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],l=selSel[gid],inp=document.getElementById('i_'+gid),c=document.getElementById('c_'+gid);
 if(!l)return;
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');c.classList.add('shk');
  setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
 done[gid]=true;answered++;
 const ok=(l===m.letter)&&(m.accept.map(norm).indexOf(v)>-1);
 const wrap=document.getElementById('sg_'+gid);
 [...wrap.children].forEach(el=>{el.classList.add('dn');el.onclick=null;
  if(el.dataset.l===l)el.classList.add(ok?'ok':'no');else el.classList.add('dimx')});
 inp.disabled=true;document.getElementById('b_'+gid).disabled=true;inp.classList.add(ok?'ok':'no');
 const ex=document.getElementById('e_'+gid);
 const reveal=()=>{[...wrap.children].forEach(el=>{if(el.dataset.l===m.letter){el.classList.remove('dimx');el.classList.add('ok')}});ex.classList.add('show')};
 if(ok){score++;ding();confetti();reveal()}
 else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);setTimeout(reveal,700)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(j===i)el.classList.add(ok?'ok':'no');else el.classList.add('dim')});
 const ex=document.getElementById('e_'+gid);
 const reveal=()=>{[...b.children].forEach((el,j)=>{if(maps[gid][j]===m.correct){el.classList.remove('dim');el.classList.add('ok')}});ex.classList.add('show')};
 if(ok){score++;ding();confetti();reveal()}
 else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);setTimeout(reveal,700)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — hoá đơn điểm 10, không đổi trả! 🧾✨';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi! Xem lại phần giải thích rồi luyện thêm nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn nhé! Đọc kỹ phần giải thích rồi làm lại bài nào!';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
