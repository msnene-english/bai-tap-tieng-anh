<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Ngữ pháp 8, 9, 10 - Ms MS Chí Nên</title>
    <!-- Import Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1d8e0 20%, transparent 20%),
                              radial-gradient(#d1d8e0 20%, transparent 20%);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-badge {
            background: linear-gradient(135deg, var(--primary-purple), #a29bfe);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(136, 84, 192, 0.4);
            margin-bottom: 20px;
            border: 2px solid white;
            font-family: 'Quicksand', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .exercise-title {
            text-align: center;
            color: var(--primary-purple);
            font-size: 1.8rem;
            font-weight: 800;
            margin: 30px 0 15px;
            text-shadow: 2px 2px 0px white;
            background: white;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 0 #dfe6e9;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05), 0 15px 20px rgba(0,0,0,0.05);
            border: 2px solid #fff;
            position: relative;
            transition: transform 0.3s ease;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .question-number {
            display: inline-block;
            background: var(--primary-teal);
            color: white;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 800;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #636e72;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 4px 0 #dfe6e9;
            text-align: left;
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-2px) scale(1.02);
            border-color: var(--primary-purple);
            color: var(--primary-purple);
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #dfe6e9;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-green) !important;
            color: white !important;
            border-color: var(--correct-green) !important;
            box-shadow: 0 4px 0 #00b85c !important;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            color: white !important;
            border-color: var(--wrong-red) !important;
            box-shadow: 0 4px 0 #e63e4c !important;
            animation: shake 0.5s;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #fff8e1; /* Light yellow for note */
            border: 2px dashed #ffeaa7;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: #fdcb6e;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation-content {
            font-size: 1rem;
            color: #2d3436;
            line-height: 1.6;
            white-space: pre-line; /* Respect line breaks */
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Submit Button */
        .submit-section {
            text-align: center;
            margin: 40px 0 60px;
        }

        .submit-btn {
            background: linear-gradient(to bottom, #00C9A7, #00b899);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #008c74, 0 15px 20px rgba(0,201,167,0.4);
            transition: transform 0.1s;
            font-family: 'Quicksand', sans-serif;
        }

        .submit-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #008c74;
        }

        /* Score Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .score-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid var(--primary-purple);
        }

        .score-number {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary-purple);
            margin: 10px 0;
        }

        .score-msg {
            font-size: 1.2rem;
            color: #636e72;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #d63031;
        }
        
        .close-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .hint-text {
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <div class="header-badge">
        🎓 Giáo viên tạo: Ms MS Chí Nên
    </div>

    <div class="container" id="quiz-container">
        <!-- Content will be injected by JavaScript -->
    </div>

    <div class="submit-section">
        <button class="submit-btn" onclick="submitQuiz()">Nộp bài 📝</button>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="score-card">
            <h2>Kết quả của bạn</h2>
            <div class="score-number" id="finalScore">0/0</div>
            <p class="score-msg" id="finalMsg">Bạn làm tốt lắm!</p>
            <button class="close-btn" onclick="closeModal()">Làm lại</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const quizData = [
            // Exercise 8
            {
                number: 1,
                exercise: "Exercise 8: Position of Adverbs",
                question: "She lives next door but we ______________ her.",
                hint: "Trạng từ đứng trước động từ thường.",
                options: [
                    { text: "rarely see", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- rarely (adv): hiếm khi\n- see (v): gặp/thấy\n\n2. Giải thích: Trạng từ chỉ tần suất đứng TRƯỚC động từ thường.\n\n3. Dịch câu: Cô ấy sống ngay nhà bên nhưng chúng tôi hiếm khi gặp cô ấy." },
                    { text: "see rarely", correct: false, rationale: "❌ Sai trật tự từ." },
                    { text: "rarely sees", correct: false, rationale: "❌ Sai chia động từ (We không đi với sees)." },
                    { text: "sees rarely", correct: false, rationale: "❌ Sai trật tự và chia động từ." }
                ]
            },
            {
                number: 2,
                exercise: "Exercise 8: Position of Adverbs",
                question: "Her husband ______________ to the bar in the evening.",
                hint: "Husband là số ít. Trạng từ đứng trước động từ.",
                options: [
                    { text: "goes sometimes", correct: false, rationale: "❌ Sai trật tự từ." },
                    { text: "sometimes goes", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- sometimes (adv): thỉnh thoảng\n- goes (v): đi (chia số ít)\n\n2. Giải thích: Trạng từ tần suất đứng TRƯỚC động từ thường.\n\n3. Dịch câu: Chồng cô ấy thỉnh thoảng đi quán bar vào buổi tối." },
                    { text: "go sometimes", correct: false, rationale: "❌ Sai chia động từ (Husband số ít)." },
                    { text: "sometimes go", correct: false, rationale: "❌ Sai chia động từ." }
                ]
            },
            {
                number: 3,
                exercise: "Exercise 8: Position of Adverbs",
                question: "We ______________ at home on holidays.",
                hint: "Trạng từ đứng sau To Be.",
                options: [
                    { text: "always are", correct: false, rationale: "❌ Sai trật tự từ." },
                    { text: "are always", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- always (adv): luôn luôn\n- are (be): thì/là/ở\n\n2. Giải thích: Trạng từ tần suất đứng SAU động từ To Be.\n\n3. Dịch câu: Chúng tôi luôn ở nhà vào các ngày lễ." },
                    { text: "always is", correct: false, rationale: "❌ Sai động từ (We không dùng is)." },
                    { text: "is always", correct: false, rationale: "❌ Sai động từ." }
                ]
            },
            {
                number: 4,
                exercise: "Exercise 8: Position of Adverbs",
                question: "Lan ______________ basketball.",
                hint: "Vị trí: Doesn't + adv + V.",
                options: [
                    { text: "frequently doesn’t play", correct: false, rationale: "❌ Vị trí này không tự nhiên." },
                    { text: "doesn't frequently play", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- doesn't (aux): trợ từ phủ định\n- frequently (adv): thường xuyên\n- play (v): chơi\n\n2. Giải thích: Trong câu phủ định, trạng từ thường đứng giữa trợ động từ (doesn't) và động từ chính (play).\n\n3. Dịch câu: Lan không thường xuyên chơi bóng rổ." },
                    { text: "doesn't play frequently", correct: false, rationale: "⚠️ Có thể chấp nhận được nhưng đáp án B chuẩn mực hơn về vị trí nhấn mạnh." },
                    { text: "don't frequently play", correct: false, rationale: "❌ Sai trợ động từ (Lan số ít)." }
                ]
            },
            {
                number: 5,
                exercise: "Exercise 8: Position of Adverbs",
                question: "They ______________ swimming.",
                hint: "Cụm 'hardly ever' đi liền nhau và đứng trước động từ.",
                options: [
                    { text: "hardly ever go", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- hardly ever (adv phrase): hầu như không bao giờ\n- go (v): đi\n\n2. Giải thích: Trạng từ đứng trước động từ thường.\n\n3. Dịch câu: Họ hầu như không bao giờ đi bơi." },
                    { text: "go hardly ever", correct: false, rationale: "❌ Sai trật tự." },
                    { text: "hardly go ever", correct: false, rationale: "❌ Sai cấu trúc cụm từ." },
                    { text: "ever go hardly", correct: false, rationale: "❌ Sai hoàn toàn." }
                ]
            },
            {
                number: 6,
                exercise: "Exercise 8: Position of Adverbs",
                question: "My personal doctor checks my health ______________.",
                hint: "Trạng từ chỉ sự đều đặn.",
                options: [
                    { text: "hardly", correct: false, rationale: "❌ Sai nghĩa. 'Hardly' nghĩa là 'hầu như không'." },
                    { text: "regularly", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- regularly (adv): một cách đều đặn/thường xuyên\n- hardly (adv): hầu như không\n\n2. Giải thích: Bác sĩ riêng thì sẽ kiểm tra sức khỏe 'đều đặn'.\n\n3. Dịch câu: Bác sĩ riêng kiểm tra sức khỏe của tôi một cách đều đặn." },
                    { text: "rare", correct: false, rationale: "❌ Sai loại từ (tính từ)." },
                    { text: "regular", correct: false, rationale: "❌ Sai loại từ (tính từ)." }
                ]
            },
            {
                number: 7,
                exercise: "Exercise 8: Position of Adverbs",
                question: "My friend and I take vacations together quite ______________.",
                hint: "Đi với 'quite' (khá là...).",
                options: [
                    { text: "never", correct: false, rationale: "❌ Không ai nói 'quite never'." },
                    { text: "frequently", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- frequently (adv): thường xuyên\n- never (adv): không bao giờ\n\n2. Giải thích: Cụm từ 'quite frequently' (khá thường xuyên) rất phổ biến.\n\n3. Dịch câu: Bạn tôi và tôi đi nghỉ cùng nhau khá thường xuyên." },
                    { text: "frequent", correct: false, rationale: "❌ Sai loại từ (tính từ)." },
                    { text: "rare", correct: false, rationale: "❌ Sai loại từ." }
                ]
            },
            {
                number: 8,
                exercise: "Exercise 8: Position of Adverbs",
                question: "What does Mai ______________ at break time?",
                hint: "Trạng từ đứng trước động từ chính trong câu hỏi.",
                options: [
                    { text: "often do", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- often (adv): thường\n- do (v): làm\n\n2. Giải thích: Cấu trúc câu hỏi: Wh-word + does + S + adv + V?\n\n3. Dịch câu: Mai thường làm gì vào giờ ra chơi?" },
                    { text: "do often", correct: false, rationale: "❌ Sai trật tự." },
                    { text: "often does", correct: false, rationale: "❌ Sai ngữ pháp (đã có trợ từ does thì động từ chính về nguyên thể)." },
                    { text: "does often", correct: false, rationale: "❌ Sai." }
                ]
            },
            {
                number: 9,
                exercise: "Exercise 8: Position of Adverbs",
                question: "______________ online?",
                hint: "Do + Chủ ngữ + Trạng từ + Động từ?",
                options: [
                    { text: "Do often you shop", correct: false, rationale: "❌ Sai trật tự." },
                    { text: "Do you often shop", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- Do (aux): trợ từ\n- you (S): bạn\n- often (adv): thường\n- shop (v): mua sắm\n\n2. Giải thích: Cấu trúc: Do + S + adv + V?\n\n3. Dịch câu: Bạn có thường mua sắm trực tuyến không?" },
                    { text: "You do often shop", correct: false, rationale: "❌ Sai cấu trúc câu hỏi." },
                    { text: "Do you shop often", correct: false, rationale: "⚠️ Đúng văn nói nhưng kém chuẩn về vị trí trạng từ." }
                ]
            },
            {
                number: 10,
                exercise: "Exercise 8: Position of Adverbs",
                question: "______________ his grandmother?",
                hint: "Câu hỏi với Does, động từ chính trở về nguyên thể.",
                options: [
                    { text: "Does occasionally Tom visits", correct: false, rationale: "❌ Sai trật tự và chia động từ." },
                    { text: "Does Tom occasionally visit", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- Does (aux): Trợ từ số ít\n- Tom (S): Tom\n- occasionally (adv): thỉnh thoảng\n- visit (v): thăm (nguyên thể)\n\n2. Giải thích: Cấu trúc: Does + S + adv + V-inf?\n\n3. Dịch câu: Tom có thỉnh thoảng đi thăm bà của cậu ấy không?" },
                    { text: "Does Tom occasionally visits", correct: false, rationale: "❌ Sai chia động từ (đã có Does thì visit không thêm s)." },
                    { text: "Does visit Tom occasionally", correct: false, rationale: "❌ Sai trật tự." }
                ]
            },
            // Exercise 9
            {
                number: 11,
                exercise: "Exercise 9: Present Simple vs Future Simple",
                question: "The convenience store in my neighbourhood ______________ 24/7.",
                hint: "Sự thật hiển nhiên/lịch trình cố định.",
                options: [
                    { text: "opens", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- opens (Present Simple): mở cửa\n- will open (Future Simple): sẽ mở cửa\n\n2. Giải thích: Việc cửa hàng mở 24/7 là một sự thật hiển nhiên/lịch trình cố định -> Dùng Hiện tại đơn.\n\n3. Dịch câu: Cửa hàng tiện lợi trong khu phố của tôi mở cửa 24/7." },
                    { text: "will open", correct: false, rationale: "❌ Không dùng Tương lai đơn cho lịch trình/sự thật hiển nhiên." },
                    { text: "opening", correct: false, rationale: "❌ Sai ngữ pháp (thiếu to be)." },
                    { text: "open", correct: false, rationale: "❌ Sai chia động từ (Store số ít)." }
                ]
            },
            {
                number: 12,
                exercise: "Exercise 9: Present Simple vs Future Simple",
                question: "Mom, I ______________ a shopping list for you to give to the shop assistant of the bakery.",
                hint: "Quyết định ngay tại thời điểm nói (lời hứa/đề nghị).",
                options: [
                    { text: "make", correct: false, rationale: "❌ 'I make' nghe như một thói quen, không hợp ngữ cảnh." },
                    { text: "will make", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- make (Present Simple): làm\n- will make (Future Simple): sẽ làm\n\n2. Giải thích: Quyết định làm gì ngay tại thời điểm nói (đề nghị giúp mẹ) -> Dùng Tương lai đơn (Will).\n\n3. Dịch câu: Mẹ ơi, con sẽ lập danh sách mua sắm cho mẹ..." },
                    { text: "am making", correct: false, rationale: "❌ Không phải đáp án tối ưu trong ngữ cảnh này." },
                    { text: "made", correct: false, rationale: "❌ Quá khứ." }
                ]
            },
            {
                number: 13,
                exercise: "Exercise 9: Present Simple vs Future Simple",
                question: "We ______________ on a holiday this summer vacation.",
                hint: "Dự định trong tương lai (kỳ nghỉ hè này).",
                options: [
                    { text: "don't go", correct: false, rationale: "❌ Hiện tại đơn chỉ thói quen." },
                    { text: "won't go", correct: true, rationale: "✅ Chính xác!\n\n1. Phân tích:\n- don't go (Present Simple)\n- won't go (Future Simple)\n\n2. Giải thích: Dự đoán hoặc kế hoạch cho một thời điểm cụ thể trong tương lai -> Dùng Won't go.\n\n3. Dịch câu: Chúng tôi sẽ không đi nghỉ vào kỳ nghỉ hè này." },
                    { text: "not go", correct: false, rationale: "❌ Sai ngữ pháp." },
                    { text: "didn't go", correct: false, rationale: "❌ Quá khứ." }
                ]
            },
            {
                number: 14,
                exercise: "Exercise 9: Present Simple vs Future Simple",
                question: "The bus schedule says that there ______________ a bus to Hoan Kiem Lake at 9:00.",

        // --- AUDIO ENGINE ---
        // Simple synth to avoid external dependencies
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                // High pitch Ding
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
                
                // Confetti
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00D26A', '#00C9A7', '#8854C0']
                });

            } else {
                // Low pitch Buzz
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- RENDER LOGIC ---
        let currentScore = 0;
        let answeredCount = 0;

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            let currentExerciseTitle = "";

            quizData.forEach((item, index) => {
                // Insert Exercise Title if changed
                if (item.exercise !== currentExerciseTitle) {
                    currentExerciseTitle = item.exercise;
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'exercise-title';
                    titleDiv.innerText = currentExerciseTitle;
                    container.appendChild(titleDiv);
                }

                // Card
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-${index}`;

                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `<span class="question-number">Q${item.number}</span> ${item.question}`;
                
                // Options Grid
                const grid = document.createElement('div');
                grid.className = 'options-grid';

                item.options.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.text; // A, B, C... labels could be added but text is sufficient
                    btn.onclick = () => checkAnswer(index, optIndex, btn);
                    grid.appendChild(btn);
                });

                // Hint (Hidden by default or shown?) - Let's keep it clean, show in rationale
                
                // Explanation Box
                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp-${index}`;
                expBox.innerHTML = `
                    <div class="explanation-header">💡 Giải thích chi tiết của Ms MS Chí Nên:</div>
                    <div class="explanation-content">${item.hint ? `<i>(Gợi ý: ${item.hint})</i><br><br>` : ''}${item.options.find(o => o.correct).rationale}</div>
                `;

                card.appendChild(qText);
                card.appendChild(grid);
                card.appendChild(expBox);
                container.appendChild(card);
            });
        }

        function checkAnswer(qIndex, optIndex, btnElement) {
            const card = document.getElementById(`q-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const explanation = document.getElementById(`exp-${qIndex}`);
            const data = quizData[qIndex];
            const selectedOpt = data.options[optIndex];

            // Prevent re-answering
            if (card.dataset.answered) return;
            card.dataset.answered = "true";
            answeredCount++;

            // Visual Feedback
            if (selectedOpt.correct) {
                btnElement.classList.add('correct');
                playSound('correct');
                currentScore++;
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                // Highlight correct answer automatically
                data.options.forEach((opt, idx) => {
                    if (opt.correct) buttons[idx].classList.add('correct');
                });
            }

            // Disable all buttons
            buttons.forEach(btn => btn.classList.add('disabled'));

            // Show Explanation
            explanation.style.display = 'block';
            
            // If user clicked wrong answer, we can append the specific rationale of the wrong answer too if needed, 
            // but the 'correct' rationale usually contains the full analysis. 
            // The JSON data 'correct' rationale already analyzes all options? 
            // Let's check: Yes, the JSON 'rationale' for the correct answer usually has a full analysis.
            // HOWEVER, the prompt asked to explain why the *chosen* answer is wrong.
            // My current code shows the rationale of the CORRECT answer (which usually explains everything).
            // Let's tweak: If the specific wrong option has a unique rationale explanation in JSON, append it?
            // The JSON has rationales for WRONG answers too!
            
            if (!selectedOpt.correct) {
                // Append the specific reason why THIS choice was wrong to the top of explanation
                const specificError = `<div style="color: #d63031; margin-bottom: 10px; font-weight:bold;">${selectedOpt.rationale}</div>`;
                const contentDiv = explanation.querySelector('.explanation-content');
                contentDiv.innerHTML = specificError + contentDiv.innerHTML;
            }
        }

        function submitQuiz() {
            const modal = document.getElementById('scoreModal');
            const scoreDisplay = document.getElementById('finalScore');
            const msgDisplay = document.getElementById('finalMsg');
            
            scoreDisplay.innerText = `${currentScore}/${quizData.length}`;
            
            const percentage = (currentScore / quizData.length) * 100;
            if (percentage === 100) msgDisplay.innerText = "Xuất sắc! Bạn là thiên tài ngữ pháp! 🌟";
            else if (percentage >= 80) msgDisplay.innerText = "Làm tốt lắm! Chỉ sai một chút thôi. 💪";
            else if (percentage >= 50) msgDisplay.innerText = "Khá tốt, nhưng cần ôn lại bài kỹ hơn nhé! 📚";
            else msgDisplay.innerText = "Cố gắng lên! Hãy xem kỹ lại phần giải thích nhé. 🔥";

            modal.style.display = 'flex';
            
            // Celebration confetti if high score
            if (percentage >= 80) {
                 var duration = 3 * 1000;
                var animationEnd = Date.now() + duration;
                var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 2000 };

                var random = function(min, max) { return Math.random() * (max - min) + min; }

                var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }
        }

        function closeModal() {
            document.getElementById('scoreModal').style.display = 'none';
            // Optional: reset quiz? For now just close so they can review.
            // location.reload(); // Uncomment to reload
        }

        renderQuiz();
