<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>30 Câu Luyện Thi Tiếng Anh - Ms. Chí Nên</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        :root {

            --primary: #8854C0;

            --primary-dark: #6c429c;

            --secondary: #00C9A7;

            --correct: #00D26A;

            --wrong: #FF4757;

            --bg: #f4f7f6;

            --text: #2d3436;

        }



        body {

            font-family: 'Quicksand', sans-serif;

            background-color: var(--bg);

            background-image: 

                radial-gradient(circle at 10% 20%, rgba(136, 84, 192, 0.1) 0%, transparent 20%),

                radial-gradient(circle at 90% 80%, rgba(0, 201, 167, 0.1) 0%, transparent 20%);

            margin: 0;

            padding: 20px;

            color: var(--text);

            min-height: 100vh;

            display: flex;

            justify-content: center;

        }



        .container {

            width: 100%;

            max-width: 900px;

            background: white;

            border-radius: 20px;

            box-shadow: 0 15px 35px rgba(0,0,0,0.1);

            padding: 30px;

            position: relative;

            border-top: 8px solid var(--primary);

        }



        /* Header */

        header {

            text-align: center;

            margin-bottom: 30px;

            border-bottom: 2px dashed #eee;

            padding-bottom: 20px;

        }



        h1 {

            color: var(--primary);

            margin: 0;

            font-size: 2rem;

            text-transform: uppercase;

            letter-spacing: 1px;

        }



        .teacher-name {

            background: var(--secondary);

            color: white;

            padding: 5px 15px;

            border-radius: 20px;

            font-size: 0.9rem;

            font-weight: bold;

            display: inline-block;

            margin-top: 10px;

            box-shadow: 0 3px 0 #009e82;

        }



        /* Progress */

        .progress-wrapper {

            background: #eee;

            height: 12px;

            border-radius: 10px;

            margin-bottom: 25px;

            overflow: hidden;

        }



        .progress-bar {

            height: 100%;

            background: linear-gradient(90deg, var(--secondary), var(--primary));

            width: 0%;

            transition: width 0.4s ease;

        }



        /* Question Card */

        .q-card {

            animation: fadeIn 0.5s;

        }



        .q-header {

            background: #f8f9fa;

            padding: 20px;

            border-radius: 15px;

            border-left: 6px solid var(--primary);

            margin-bottom: 20px;

        }



        .q-number {

            font-weight: 800;

            color: var(--primary);

            font-size: 1.1rem;

            margin-bottom: 8px;

            display: block;

        }



        .q-text {

            font-size: 1.25rem;

            font-weight: 700;

            color: #2d3436;

        }



        /* Options */

        .options-list {

            display: grid;

            gap: 15px;

        }



        .option-item {

            background: white;

            border: 2px solid #e0e0e0;

            padding: 18px 25px;

            border-radius: 16px;

            font-size: 1.05rem;

            cursor: pointer;

            transition: all 0.2s;

            position: relative;

            box-shadow: 0 4px 0 #e0e0e0;

            font-weight: 600;

        }



        .option-item:hover:not(.disabled) {

            transform: translateY(-3px);

            border-color: var(--primary);

            box-shadow: 0 7px 0 #e0e0e0;

        }



        .option-item:active:not(.disabled) {

            transform: translateY(2px);

            box-shadow: 0 2px 0 #e0e0e0;

        }



        .option-item.correct {

            background: #d1fae5;

            border-color: var(--correct);

            color: #065f46;

            box-shadow: 0 4px 0 #059669;

        }



        .option-item.wrong {

            background: #fee2e2;

            border-color: var(--wrong);

            color: #991b1b;

            box-shadow: 0 4px 0 #b91c1c;

            animation: shake 0.5s;

        }



        .disabled {

            pointer-events: none;

        }



        /* Explanation */

        .explanation {

            display: none;

            margin-top: 25px;

            background: #fff;

            border: 2px solid var(--primary);

            border-radius: 16px;

            overflow: hidden;

            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.1);

        }



        .exp-title {

            background: var(--primary);

            color: white;

            padding: 10px 20px;

            font-weight: bold;

            display: flex;

            align-items: center;

            gap: 10px;

        }



        .exp-body {

            padding: 20px;

        }



        .exp-row {

            margin-bottom: 12px;

            line-height: 1.6;

        }



        .tag {

            display: inline-block;

            padding: 2px 8px;

            border-radius: 6px;

            font-size: 0.85rem;

            font-weight: bold;

            margin-right: 8px;

        }



        .tag-vocab { background: #e0f2fe; color: #0284c7; }

        .tag-grammar { background: #f3e8ff; color: #9333ea; }

        .tag-trap { background: #fee2e2; color: #dc2626; }



        /* Controls */

        .controls {

            margin-top: 30px;

            text-align: right;

        }



        .btn-next {

            background: var(--primary);

            color: white;

            border: none;

            padding: 15px 40px;

            font-size: 1.1rem;

            border-radius: 50px;

            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 6px 0 var(--primary-dark);

            transition: all 0.2s;

            display: none;

        }



        .btn-next:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 0 var(--primary-dark);

        }



        .btn-next:active {

            transform: translateY(2px);

            box-shadow: 0 2px 0 var(--primary-dark);

        }



        /* Overlay */

        .overlay {

            position: fixed;

            top: 0; left: 0; width: 100%; height: 100%;

            background: rgba(0,0,0,0.85);

            z-index: 1000;

            display: none;

            justify-content: center;

            align-items: center;

        }



        .result-box {

            background: white;

            padding: 40px;

            border-radius: 25px;

            text-align: center;

            max-width: 400px;

            width: 90%;

            animation: zoomIn 0.4s;

        }



        .score-big {

            font-size: 4rem;

            font-weight: 800;

            color: var(--secondary);

            margin: 10px 0;

            text-shadow: 2px 2px 0 #009e82;

        }



        /* Animations */

        @keyframes shake {

            0%, 100% { transform: translateX(0); }

            25% { transform: translateX(-8px); }

            75% { transform: translateX(8px); }

        }



        @keyframes fadeIn {

            from { opacity: 0; transform: translateY(20px); }

            to { opacity: 1; transform: translateY(0); }

        }



        @keyframes zoomIn {

            from { transform: scale(0.8); opacity: 0; }

            to { transform: scale(1); opacity: 1; }

        }



        #confetti { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 999; }

    </style>

</head>

<body>



<canvas id="confetti"></canvas>



<div class="container">

    <header>

        <h1>Bài Tập Tiếng Anh Tương Tác</h1>

        <div class="teacher-name">Giáo viên tạo: Ms. Chí Nên</div>

    </header>



    <div class="progress-wrapper">

        <div class="progress-bar" id="progressBar"></div>

    </div>



    <div id="quizContainer">

        </div>



    <div class="controls">

        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Câu tiếp theo ➜</button>

    </div>

</div>



<div class="overlay" id="resultOverlay">

    <div class="result-box">

        <h2 style="color:var(--primary)">KẾT QUẢ CHUNG CUỘC</h2>

        <div class="score-big" id="finalScore">0/30</div>

        <p id="finalMsg" style="font-size: 1.1rem; line-height: 1.5; color: #555;"></p>

        <button class="btn-next" style="display:inline-block; margin-top:15px" onclick="location.reload()">Làm lại bài thi</button>

    </div>

</div>



<script>

    // --- DỮ LIỆU CÂU HỎI (30 CÂU) ---

    // Cấu trúc: Question + Correct Answer + 3 Distractors (Sai)

    // Hệ thống sẽ tự động trộn vị trí đáp án để KHÔNG PHẢI LÚC NÀO CŨNG LÀ A.

    const rawData = [

        // --- EXERCISE 10 (10 câu) ---

        {

            type: "Sắp xếp câu (Reorder)",

            q: "call / I / will / you / I / arrive / as soon as the /airport/ at /",

            correct: "I will call you as soon as I arrive at the airport.",

            wrong: [

                "I will call you as soon as I at the airport arrive.",

                "As soon as I arrive at the airport I will call you.", 

                "I will you call as soon as I arrive at the airport."

            ],

            explain: {

                trans: "Tôi sẽ gọi cho bạn ngay khi tôi đến sân bay.",

                vocab: "As soon as (Ngay khi), Arrive at (Đến địa điểm nhỏ)",

                why: "Cấu trúc: Tương lai đơn + as soon as + Hiện tại đơn. 'I will call you' là mệnh đề chính.",

                wrong: "Các câu sai do đặt sai vị trí trạng ngữ chỉ nơi chốn (at the airport) hoặc đảo sai trật tự động từ."

            }

        },

        {

            type: "Sắp xếp câu",

            q: "them / should / You / they / help / if / need /.",

            correct: "You should help them if they need.",

            wrong: [

                "If you need them, they should help.",

                "You should help if they need them.",

                "They should help you if need them."

            ],

            explain: {

                trans: "Bạn nên giúp họ nếu họ cần.",

                vocab: "Should (Nên), If (Nếu)",

                why: "Mệnh đề chính khuyên bảo: S + should + V. Mệnh đề điều kiện: if + S + V.",

                wrong: "Các câu sai làm thay đổi hoàn toàn nghĩa gốc (ai giúp ai) hoặc thiếu chủ ngữ."

            }

        },

        {

            type: "Sắp xếp câu",

            q: "will / We/frozen/be/ you / temperature / unless / increase / the /.",

            correct: "We will be frozen unless you increase the temperature.",

            wrong: [

                "Unless you increase the temperature we will be frozen.", 

                "We will frozen be unless the temperature increase you.",

                "You increase the temperature unless we will be frozen."

            ],

            explain: {

                trans: "Chúng ta sẽ bị đóng băng trừ khi bạn tăng nhiệt độ lên.",

                vocab: "Frozen (Đóng băng), Unless (Trừ khi = If not)",

                why: "Mệnh đề chính (Tương lai bị động): We will be frozen. Mệnh đề điều kiện: unless + S + V.",

                wrong: "Câu bắt đầu bằng Unless cần dấu phẩy (trong bài không cho). Các câu khác sai trật tự từ nghiêm trọng."

            }

        },

        {

            type: "Sắp xếp câu",

            q: "after / The / the /shop/ closed / had left / last customer/.",

            correct: "The shop closed after the last customer had left.",

            wrong: [

                "After the shop closed the last customer had left.",

                "The last customer had left after the shop closed.",

                "The shop had left after the last customer closed."

            ],

            explain: {

                trans: "Cửa hàng đóng cửa sau khi vị khách cuối cùng đã rời đi.",

                vocab: "Last customer (Khách cuối), Had left (Đã rời - QKHT)",

                why: "Hành động xảy ra trước (khách đi) dùng Quá khứ hoàn thành. Hành động sau (đóng cửa) dùng Quá khứ đơn.",

                wrong: "Sai về sự phối thì (Sequence of tenses) hoặc sai logic thực tế (cửa hàng không thể 'rời đi')."

            }

        },

        {

            type: "Sắp xếp câu",

            q: "must/You / stop / when / the /turn / red / traffic lights/.",

            correct: "You must stop when the traffic lights turn red.",

            wrong: [

                "When you stop the traffic lights must turn red.",

                "The traffic lights must stop when you turn red.",

                "You must turn red when the traffic lights stop."

            ],

            explain: {

                trans: "Bạn phải dừng lại khi đèn giao thông chuyển đỏ.",

                vocab: "Traffic lights (Đèn giao thông), Turn red (Chuyển đỏ)",

                why: "Cấu trúc mệnh đề thời gian với 'When'. Chủ ngữ là người (You) thực hiện hành động dừng (stop).",

                wrong: "Các câu sai mang nghĩa vô lý (Bạn biến thành màu đỏ, hoặc đèn dừng lại)."

            }

        },

        {

            type: "Sắp xếp câu",

            q: "always makes / My / breakfast / mother/ for / me / before / goes / to / she / work/.",

            correct: "My mother always makes breakfast for me before she goes to work.",

            wrong: [

                "Before my mother goes to work she always makes breakfast for me.",

                "My mother goes to work before she always makes breakfast for me.",

                "She always makes breakfast for me before my mother goes to work."

            ],

            explain: {

                trans: "Mẹ tôi luôn làm bữa sáng cho tôi trước khi bà đi làm.",

                vocab: "Make breakfast (Làm bữa sáng), Go to work (Đi làm)",

                why: "Trạng từ tần suất 'always' đứng trước động từ thường 'makes'. Mệnh đề 'before' chia hiện tại đơn.",

                wrong: "Câu bắt đầu bằng Before cần dấu phẩy. Câu C sai tham chiếu (dùng She trước My mother nghe không thuận)."

            }

        },

        {

            type: "Sắp xếp câu",

            q: "is / her / doing / Mai / homework / Nga / while / to / music / is / listening /.",

            correct: "Mai is doing her homework while Nga is listening to music.",

            wrong: [

                "Nga is doing her homework while Mai is listening to music.",

                "Mai is listening to music while Nga is doing her homework.",

                "While Mai is doing her homework Nga is listening to music."

            ],

            explain: {

                trans: "Mai đang làm bài tập trong khi Nga đang nghe nhạc.",

                vocab: "Do homework (Làm BTVN), Listen to music (Nghe nhạc)",

                why: "Hai hành động song song ở hiện tại tiếp diễn dùng 'While'. Lưu ý: Đề bài viết hoa Mai -> Mai đứng đầu.",

                wrong: "Sai chủ ngữ so với từ viết hoa gợi ý, hoặc thiếu dấu phẩy nếu đảo While lên đầu."

            }

        },

        {

            type: "Sắp xếp câu",

            q: "come/to/ She / decided/ even though/to/ didn't/like/the/ party / she / it /.",

            correct: "She decided to come to the party even though she didn't like it.",

            wrong: [

                "Even though she didn't like it she decided to come to the party.",

                "She decided not to come to the party even though she liked it.",

                "She didn't like the party even though she decided to come to it."

            ],

            explain: {

                trans: "Cô ấy quyết định đến bữa tiệc dù cô ấy không thích nó.",

                vocab: "Decide to V (Quyết định làm gì), Even though (Mặc dù)",

                why: "Mệnh đề nhượng bộ: Mệnh đề chính + even though + Mệnh đề phụ.",

                wrong: "Đảo Even though lên đầu thiếu dấu phẩy. Các câu khác sắp xếp lộn xộn từ 'decided' và 'didn't'."

            }

        },

        {

            type: "Sắp xếp câu",

            q: "Can / help / me / you / the / the dishes / wash / while / cleaning / I'm/ floor/?",

            correct: "Can you help me wash the dishes while I'm cleaning the floor?",

            wrong: [

                "Can you help me cleaning the floor while I'm wash the dishes?",

                "While I'm cleaning the floor can you help me wash the dishes?",

                "Can you help me clean the floor while I'm washing the dishes?"

            ],

            explain: {

                trans: "Bạn có thể giúp tôi rửa bát trong khi tôi lau nhà không?",

                vocab: "Wash dishes (Rửa bát), Clean floor (Lau sàn)",

                why: "Help sb (to) V (help me wash). While + Tiếp diễn (I'm cleaning).",

                wrong: "Sai cấu trúc Help + Ving, hoặc dùng từ không có trong đề (washing - đề chỉ cho wash)."

            }

        },

        {

            type: "Sắp xếp câu",

            q: "lots of / She /eat/ fried food / not good / shouldn't / as /for/your/it/is/ health /.",

            correct: "She shouldn't eat lots of fried food as it is not good for your health.", // Note: 'your' in source implies general advice context mixing

            wrong: [

                "As it is not good for your health she shouldn't eat lots of fried food.",

                "She shouldn't eat fried food as it is lots of not good for your health.",

                "She eat shouldn't lots of fried food as it is not good for your health."

            ],

            explain: {

                trans: "Cô ấy không nên ăn nhiều đồ chiên rán vì nó không tốt cho sức khỏe.",

                vocab: "Fried food (Đồ chiên), As (= Because: Vì)",

                why: "Shouldn't + V nguyên thể. As + mệnh đề giải thích nguyên nhân.",

                wrong: "Sai trật tự 'eat shouldn't' hoặc đặt mệnh đề As lên đầu thiếu dấu phẩy."

            }

        },



        // --- EXERCISE 11 (20 câu đầu) ---

        {

            type: "Nối câu (Combine)",

            q: "A serious road accident happened. We were waiting for the bus yesterday. (while)",

            correct: "A serious road accident happened while we were waiting for the bus yesterday.",

            wrong: [

                "While a serious road accident happened, we were waiting for the bus yesterday.",

                "A serious road accident happened while we waited for the bus yesterday.",

                "We were waiting for the bus yesterday while a serious road accident happened."

            ],

            explain: {

                trans: "Một vụ tai nạn nghiêm trọng xảy ra khi chúng tôi đang đợi xe buýt.",

                vocab: "Accident (Tai nạn), Wait for (Đợi)",

                why: "Hành động ngắn (happened) xen vào hành động dài (were waiting). While đi với hành động dài.",

                wrong: "Dùng While với hành động ngắn (happened) là không tự nhiên trong bối cảnh này."

            }

        },

        {

            type: "Nối câu",

            q: "I had to get the mop. I spilled my juice. (since)",

            correct: "I had to get the mop since I spilled my juice.",

            wrong: [

                "Since I had to get the mop, I spilled my juice.",

                "I spilled my juice since I had to get the mop.",

                "I had to get the mop since I spill my juice."

            ],

            explain: {

                trans: "Tôi phải đi lấy cây lau nhà vì tôi làm đổ nước ép.",

                vocab: "Since (= Because), Mop (Cây lau nhà), Spill (Làm đổ)",

                why: "Since + Nguyên nhân (làm đổ nước). Mệnh đề kết quả (lấy cây lau nhà) đứng trước hoặc sau.",

                wrong: "Đảo lộn nhân quả (Làm đổ nước VÌ phải đi lấy cây lau nhà -> Vô lý)."

            }

        },

        {

            type: "Nối câu",

            q: "He fell down the ladder. His leg was broken. (and)",

            correct: "He fell down the ladder and his leg was broken.",

            wrong: [

                "His leg was broken and he fell down the ladder.",

                "He fell down the ladder and break his leg.",

                "He fell down the ladder and his leg is broken."

            ],

            explain: {

                trans: "Anh ấy ngã thang và chân bị gãy.",

                vocab: "Ladder (Cái thang), Broken (Bị gãy)",

                why: "Dùng AND nối chuỗi sự kiện theo thời gian: Ngã trước -> Gãy chân sau.",

                wrong: "Sai trình tự thời gian hoặc dùng sai thì (is broken/break) so với quá khứ."

            }

        },

        {

            type: "Nối câu",

            q: "We had picked up trash. We left the campsite. (before)",

            correct: "We had picked up trash before we left the campsite.",

            wrong: [

                "Before we had picked up trash, we left the campsite.",

                "We left the campsite before we had picked up trash.",

                "We had picked up trash before we leave the campsite."

            ],

            explain: {

                trans: "Chúng tôi đã nhặt rác trước khi rời khu cắm trại.",

                vocab: "Pick up trash (Nhặt rác), Campsite (Khu trại)",

                why: "Hành động xảy ra trước (QKHT): had picked up. Hành động sau (QKĐ): left. Before + hành động sau.",

                wrong: "Sai về nghĩa (Rời đi trước khi nhặt rác) hoặc sai thì."

            }

        },

        {

            type: "Nối câu",

            q: "It started raining. They were putting up the tent. (when)",

            correct: "It started raining when they were putting up the tent.",

            wrong: [

                "When it started raining, they put up the tent.",

                "They were putting up the tent when it start raining.",

                "It started raining when they put up the tent."

            ],

            explain: {

                trans: "Trời bắt đầu mưa khi họ đang dựng lều.",

                vocab: "Put up tent (Dựng lều)",

                why: "When + mệnh đề đang diễn ra (hoặc mệnh đề cắt ngang). Ở đây mưa xen vào lúc đang dựng lều.",

                wrong: "Thay đổi thì của hành động đang diễn ra (were putting -> put) làm mất ý nghĩa tiếp diễn."

            }

        },

        {

            type: "Nối câu",

            q: "I get my parents' permission. I will go out with my friends. (after)",

            correct: "I will go out with my friends after I get my parents' permission.",

            wrong: [

                "After I will go out with my friends, I get my parents' permission.",

                "I get my parents' permission after I will go out with my friends.",

                "I went out with my friends after I got my parents' permission."

            ],

            explain: {

                trans: "Tôi sẽ đi chơi sau khi xin phép bố mẹ.",

                vocab: "Permission (Sự cho phép)",

                why: "Mệnh đề thời gian tương lai: After + Hiện tại đơn, Tương lai đơn.",

                wrong: "Sai logic (Đi chơi rồi mới xin phép) hoặc dùng sai thì (Will không đứng sau After)."

            }

        },

        {

            type: "Nối câu",

            q: "The weather was bad. We were on holiday last month. (when)",

            correct: "The weather was bad when we were on holiday last month.",

            wrong: [

                "We were on holiday last month when the weather is bad.",

                "When the weather was bad, we are on holiday last month.",

                "The weather is bad when we were on holiday last month."

            ],

            explain: {

                trans: "Thời tiết rất tệ khi chúng tôi đi nghỉ tháng trước.",

                vocab: "Holiday (Kỳ nghỉ), Last month (Tháng trước)",

                why: "Cả 2 vế đều ở Quá khứ đơn (was/were) diễn tả sự kiện đã qua.",

                wrong: "Trộn lẫn thì hiện tại (is/are) vào câu kể quá khứ."

            }

        },

        {

            type: "Nối câu",

            q: "I will call my mom. I get the result. (as soon as)",

            correct: "I will call my mom as soon as I get the result.",

            wrong: [

                "As soon as I will call my mom, I get the result.",

                "I call my mom as soon as I will get the result.",

                "I will call my mom as soon as I got the result."

            ],

            explain: {

                trans: "Tôi sẽ gọi mẹ ngay khi có kết quả.",

                vocab: "Result (Kết quả)",

                why: "As soon as + Hiện tại đơn (get), Tương lai đơn (will call).",

                wrong: "Will không đứng trong mệnh đề chỉ thời gian (sau as soon as)."

            }

        },

        {

            type: "Nối câu",

            q: "It rains. My father usually drives me to school. (when)",

            correct: "When it rains, my father usually drives me to school.",

            wrong: [

                "My father usually drives me to school when it rained.",

                "When my father usually drives me to school, it rains.",

                "It rains when my father usually drove me to school."

            ],

            explain: {

                trans: "Khi trời mưa, bố thường chở tôi đi học.",

                vocab: "Usually (Thường xuyên), Drive (Lái xe)",

                why: "Câu chỉ thói quen hiện tại -> Dùng hiện tại đơn cả 2 vế.",

                wrong: "Ngược logic nhân quả (Bố chở đi thì trời mới mưa) hoặc sai thì (rained)."

            }

        },

        {

            type: "Nối câu",

            q: "Jack can't play games. He finishes his homework. (before)",

            correct: "Jack can't play games before he finishes his homework.",

            wrong: [

                "Before Jack can't play games, he finishes his homework.",

                "Jack finishes his homework before he can't play games.",

                "Jack couldn't play games before he finishes his homework."

            ],

            explain: {

                trans: "Jack không thể chơi game trước khi làm xong bài tập.",

                vocab: "Finish (Hoàn thành)",

                why: "Điều kiện thời gian ở hiện tại. Before + V(s/es).",

                wrong: "Nghĩa vô lý hoặc sai thì."

            }

        },

        {

            type: "Nối câu",

            q: "You are in Ha Noi again. You must come and see us then. (when)",

            correct: "When you are in Ha Noi again, you must come and see us.",

            wrong: [

                "You must come and see us when you will be in Ha Noi again.",

                "When you must come and see us, you are in Ha Noi again.",

                "You are in Ha Noi again when you must come and see us."

            ],

            explain: {

                trans: "Khi nào bạn ở Hà Nội lần nữa, bạn phải đến thăm chúng tôi.",

                vocab: "Come and see (Đến thăm)",

                why: "Mệnh đề thời gian dùng hiện tại đơn (are) để chỉ tương lai.",

                wrong: "Dùng 'will be' sau When là sai ngữ pháp trong mệnh đề thời gian."

            }

        },

        {

            type: "Nối câu",

            q: "He finds somewhere to live. Then he'll give his parents the address. (when)",

            correct: "When he finds somewhere to live, he'll give his parents the address.",

            wrong: [

                "He'll give his parents the address when he will find somewhere to live.",

                "When he'll give his parents the address, he finds somewhere to live.",

                "He finds somewhere to live when he'll give his parents the address."

            ],

            explain: {

                trans: "Khi anh ấy tìm được nơi ở, anh ấy sẽ đưa địa chỉ cho bố mẹ.",

                vocab: "Address (Địa chỉ), Find (Tìm)",

                why: "Trình tự: Tìm nhà trước (Mệnh đề When - Hiện tại đơn) -> Đưa địa chỉ sau (Tương lai đơn).",

                wrong: "Lỗi phổ biến: Dùng thì tương lai 'will' ngay sau 'When'."

            }

        },

        {

            type: "Nối câu",

            q: "I do the shopping. Then I will come back home. (after)",

            correct: "After I do the shopping, I will come back home.",

            wrong: [

                "I do the shopping after I will come back home.",

                "After I will come back home, I do the shopping.",

                "I will come back home after I will do the shopping."

            ],

            explain: {

                trans: "Sau khi tôi đi mua sắm, tôi sẽ về nhà.",

                vocab: "Do shopping (Mua sắm)",

                why: "After + hành động xảy ra trước (chia Hiện tại đơn/hoàn thành). Mệnh đề chính Tương lai đơn.",

                wrong: "Sai trình tự (Về nhà rồi mới đi mua sắm) hoặc sai ngữ pháp (will do)."

            }

        },

        {

            type: "Nối câu",

            q: "It starts raining. Let's go home before that. (before)",

            correct: "Let's go home before it starts raining.",

            wrong: [

                "Before let's go home, it starts raining.",

                "It starts raining before let's go home.",

                "Let's go home before it will start raining."

            ],

            explain: {

                trans: "Hãy về nhà trước khi trời mưa.",

                vocab: "Let's (Hãy - rủ rê)",

                why: "Before + Mệnh đề thời gian (Hiện tại đơn).",

                wrong: "Cấu trúc Let's không đứng sau Before. Không dùng 'will start'."

            }

        },

        {

            type: "Nối câu",

            q: "She must apologize to him first. He won't speak to her until then. (until)",

            correct: "He won't speak to her until she apologizes to him.",

            wrong: [

                "Until he won't speak to her, she apologizes to him.",

                "She must apologize to him until he won't speak to her.",

                "He won't speak to her until she will apologize to him."

            ],

            explain: {

                trans: "Anh ấy sẽ không nói chuyện cho tới khi cô ấy xin lỗi.",

                vocab: "Apologize (Xin lỗi), Until (Cho tới khi)",

                why: "Until nối hành động chờ đợi. Until + Hiện tại đơn (apologizes).",

                wrong: "Lưu ý 'apologizes' phải thêm 's' với chủ ngữ She. Không dùng 'will apologize'."

            }

        },

        {

            type: "Nối câu",

            q: "You leave. I will make you a cup of tea. (before)",

            correct: "I will make you a cup of tea before you leave.",

            wrong: [

                "Before I will make you a cup of tea, you leave.",

                "You leave before I will make you a cup of tea.",

                "I make you a cup of tea before you will leave."

            ],

            explain: {

                trans: "Tôi sẽ pha trà cho bạn trước khi bạn đi.",

                vocab: "Make tea (Pha trà)",

                why: "Hành động pha trà xảy ra trước lúc đi. Mệnh đề chính (Will make) + before + Hiện tại đơn (leave).",

                wrong: "Đảo lộn trật tự logic (Bạn đi rồi mới pha trà??) hoặc sai ngữ pháp."

            }

        },

        {

            type: "Nối câu",

            q: "She will stay at her aunt's house. She is in London. (while)",

            correct: "She will stay at her aunt's house while she is in London.",

            wrong: [

                "While she will stay at her aunt's house, she is in London.",

                "She is in London while she will stay at her aunt's house.",

                "She will stay at her aunt's house while she will be in London."

            ],

            explain: {

                trans: "Cô ấy sẽ ở nhà dì trong khi cô ấy ở London.",

                vocab: "Aunt (Dì/Cô)",

                why: "While + Mệnh đề trạng thái/kéo dài (is in London).",

                wrong: "Không dùng 'will be' sau While trong mệnh đề thời gian."

            }

        },

        {

            type: "Nối câu",

            q: "He has read the newspaper. I will borrow it from him. (as soon as)",

            correct: "I will borrow the newspaper from him as soon as he has read it.",

            wrong: [

                "As soon as I will borrow the newspaper, he has read it.",

                "He has read the newspaper as soon as I will borrow it.",

                "I borrow the newspaper from him as soon as he had read it."

            ],

            explain: {

                trans: "Tôi sẽ mượn báo ngay khi anh ấy đọc xong.",

                vocab: "Borrow (Mượn)",

                why: "Nhấn mạnh việc hoàn tất dùng Hiện tại hoàn thành (has read) sau As soon as. Mệnh đề chính Tương lai đơn.",

                wrong: "Logic sai (Mượn rồi mới đọc xong) hoặc sai thì."

            }

        },

        {

            type: "Nối câu",

            q: "I have decided the issue. I will let you know. (when)",

            correct: "When I have decided the issue, I will let you know.",

            wrong: [

                "I will let you know when I will decide the issue.",

                "When I let you know, I have decided the issue.",

                "I have decided the issue when I will let you know."

            ],

            explain: {

                trans: "Khi tôi quyết định xong vấn đề, tôi sẽ cho bạn biết.",

                vocab: "Issue (Vấn đề), Let know (Thông báo)",

                why: "Dùng thì HTHT (have decided) sau When để nhấn mạnh việc 'quyết định' phải xong xuôi rồi mới báo.",

                wrong: "Sai logic hành động."

            }

        },

        {

            type: "Nối câu",

            q: "They have built a new road. The traffic will be better. (when)",

            correct: "The traffic will be better when they have built a new road.", // Or 'when they build' but source implies completion first

            wrong: [

                "When the traffic will be better, they have built a new road.",

                "They have built a new road when the traffic will be better.",

                "The traffic is better when they had built a new road."

            ],

            explain: {

                trans: "Giao thông sẽ tốt hơn khi họ làm xong con đường mới.",

                vocab: "Traffic (Giao thông)",

                why: "Điều kiện - Kết quả. Kết quả (Tương lai) xảy ra sau khi Điều kiện (HTHT - làm xong) hoàn tất.",

                wrong: "Ngược logic (Giao thông tốt rồi mới làm đường)."

            }

        }

    ];



    // --- GAME LOGIC ---

    let shuffledQuestions = [];

    let currentIdx = 0;

    let score = 0;

    let canAnswer = true;



    // Âm thanh

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(type) {

        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();

        const gain = audioCtx.createGain();

        osc.connect(gain);

        gain.connect(audioCtx.destination);

        

        const now = audioCtx.currentTime;

        if(type === 'correct') {

            osc.type = 'sine';

            osc.frequency.setValueAtTime(600, now);

            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);

            gain.gain.setValueAtTime(0.3, now);

            gain.gain.linearRampToValueAtTime(0, now + 0.4);

            osc.start(now);

            osc.stop(now + 0.4);

        } else {

            osc.type = 'sawtooth';

            osc.frequency.setValueAtTime(150, now);

            osc.frequency.linearRampToValueAtTime(100, now + 0.3);

            gain.gain.setValueAtTime(0.3, now);

            gain.gain.linearRampToValueAtTime(0, now + 0.4);

            osc.start(now);

            osc.stop(now + 0.4);

        }

    }



    // Hiệu ứng pháo giấy

    const confettiCanvas = document.getElementById('confetti');

    const ctx = confettiCanvas.getContext('2d');

    confettiCanvas.width = window.innerWidth;

    confettiCanvas.height = window.innerHeight;

    let particles = [];



    function fireConfetti() {

        for(let i=0; i<60; i++) {

            particles.push({

                x: window.innerWidth/2, y: window.innerHeight/2,

                vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,

                color: `hsl(${Math.random()*360}, 100%, 50%)`,

                life: 100

            });

        }

    }



    function animateConfetti() {

        ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);

        particles.forEach((p,i) => {

            p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life--;

            ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 8, 8);

            if(p.life <= 0) particles.splice(i,1);

        });

        requestAnimationFrame(animateConfetti);

    }

    animateConfetti();



    // Init Logic

    function init() {

        // Trộn câu hỏi (nếu muốn) - Ở đây giữ thứ tự để dễ theo dõi bài 10 -> 11

        // Nhưng quan trọng nhất là TRỘN ĐÁP ÁN

        shuffledQuestions = rawData.map((item, index) => {

            // Tạo mảng đáp án gồm: 1 đúng + các câu sai

            let allOpts = [

                { text: item.correct, isCorrect: true },

                ...item.wrong.map(w => ({ text: w, isCorrect: false }))

            ];

            // Shuffle đáp án

            for (let i = allOpts.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [allOpts[i], allOpts[j]] = [allOpts[j], allOpts[i]];

            }

            return { ...item, opts: allOpts, id: index };

        });

        

        loadQuestion();

    }



    function loadQuestion() {

        canAnswer = true;

        const q = shuffledQuestions[currentIdx];

        const percent = ((currentIdx)/rawData.length)*100;

        document.getElementById('progressBar').style.width = percent + '%';

        document.getElementById('nextBtn').style.display = 'none';



        const container = document.getElementById('quizContainer');

        container.innerHTML = `

            <div class="q-card">

                <div class="q-header">

                    <span class="q-number">Câu ${currentIdx + 1}/30 (${q.type})</span>

                    <div class="q-text">${q.q}</div>

                </div>

                <div class="options-list">

                    ${q.opts.map((opt, i) => `

                        <div class="option-item" onclick="check(${i}, ${opt.isCorrect})">

                            <span style="font-weight:800; color:var(--primary)">${String.fromCharCode(65+i)}.</span> ${opt.text}

                        </div>

                    `).join('')}

                </div>

                <div class="explanation" id="expBox">

                    <div class="exp-title">📝 GIẢI THÍCH CHI TIẾT Cô Chí Nên</div>

                    <div class="exp-body">

                        <div class="exp-row"><strong>🇻🇳 Dịch câu:</strong> ${q.explain.trans}</div>

                        <div class="exp-row"><span class="tag tag-vocab">Từ vựng</span> ${q.explain.vocab}</div>

                        <div class="exp-row"><span class="tag tag-grammar">Ngữ pháp</span> ${q.explain.why}</div>

                        <div class="exp-row" style="background:#fff5f5; padding:10px; border-radius:8px; border:1px dashed #fab1a0">

                            <span class="tag tag-trap">Tại sao câu kia sai?</span> ${q.explain.wrong}

                        </div>

                    </div>

                </div>

            </div>

        `;

    }



    function check(index, isCorrect) {

        if (!canAnswer) return;

        canAnswer = false;



        const opts = document.querySelectorAll('.option-item');

        opts[index].classList.add(isCorrect ? 'correct' : 'wrong');

        

        // Hiện đáp án đúng nếu chọn sai

        opts.forEach((opt, i) => {

            opt.classList.add('disabled');

            if(shuffledQuestions[currentIdx].opts[i].isCorrect) {

                opt.classList.add('correct');

            }

        });



        if (isCorrect) {

            score++;

            playTone('correct');

            fireConfetti();

        } else {

            playTone('wrong');

        }



        document.getElementById('expBox').style.display = 'block';

        document.getElementById('expBox').scrollIntoView({behavior: "smooth", block: "nearest"});

        document.getElementById('nextBtn').style.display = 'inline-block';

    }



    function nextQuestion() {

        if (currentIdx < rawData.length - 1) {

            currentIdx++;

            loadQuestion();

            window.scrollTo(0,0);

        } else {

            document.getElementById('finalScore').innerText = `${score}/30`;

            let msg = score >= 25 ? "Xuất sắc! Ms. Chí Nên rất tự hào về em! 🌟" : 

                      score >= 15 ? "Khá tốt, nhưng cần ôn lại các câu sai nhé! 📚" : 

                      "Cố lên! Hãy làm lại để nắm chắc kiến thức hơn nhé! 💪";

            document.getElementById('finalMsg').innerText = msg;

            document.getElementById('resultOverlay').style.display = 'flex';

            if(score >= 15) fireConfetti();

        }

    }



    // Start

    init();



</script>
