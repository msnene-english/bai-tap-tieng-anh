<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chí Nên - Trắc nghiệm Môi trường & Ngữ pháp (26-45)</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Tím Pastel */
            --secondary: #00C9A7; /* Xanh ngọc */
            --accent: #FF9F43; /* Cam */
            --correct: #00D26A; /* Xanh lá chuẩn */
            --wrong: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f3f8;
            --text-main: #2f3542;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #E0EAFC;
            background-image: linear-gradient(135deg, #E0EAFC 0%, #CFDEF3 100%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Background Pattern Decoration */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#8854c0 10%, transparent 10%), radial-gradient(#00c9a7 10%, transparent 10%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            opacity: 0.1;
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 40px;
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.2);
            border: 3px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 2.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            color: #747d8c;
            font-size: 1.1em;
            margin-top: 10px;
            font-weight: 600;
        }

        .badge-teacher {
            background: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            display: inline-block;
            margin-top: 5px;
            box-shadow: 0 4px 0 #009e82;
        }

        /* Question Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-bottom: 6px solid #dfe4ea;
            transition: transform 0.3s ease;
            position: relative;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
        }

        .question-number {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 15px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 #6c429c;
        }

        .question-text {
            font-size: 1.3em;
            font-weight: 700;
            color: #2f3542;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Answer Grid */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .answers-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: white;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1.1em;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            color: #57606f;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #d1d1d1;
            position: relative;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 6px 0 #d1d1d1;
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #d1d1d1;
        }

        /* Answer States */
        .btn-option.correct {
            background-color: var(--correct);
            color: white;
            border-color: var(--correct);
            box-shadow: 0 4px 0 #00b85c;
        }

        .btn-option.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: var(--wrong);
            box-shadow: 0 4px 0 #d63031;
            animation: shake 0.5s;
        }

        .btn-option.dimmed {
            opacity: 0.6;
            cursor: not-allowed;
            background: #f1f2f6;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            background: #f0fdf4; /* Xanh lá cực nhạt */
            border: 2px dashed var(--correct);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden initially */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.show {
            display: block;
        }

        .teacher-avatar {
            font-size: 2em;
            margin-right: 10px;
            vertical-align: middle;
        }

        .exp-header {
            color: var(--correct);
            font-weight: 800;
            font-size: 1.1em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .exp-content {
            font-size: 1em;
            line-height: 1.6;
            color: #333;
            white-space: pre-line; /* Keeps line breaks from JSON */
        }

        .exp-content b {
            color: var(--primary);
        }

        /* Submit Button */
        .submit-container {
            text-align: center;
            margin-top: 40px;
        }

        .btn-submit {
            background: linear-gradient(to bottom, #FF9F43, #EE5A24);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5em;
            border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #bf360c;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            transform: scale(1.05);
        }
        
        .btn-submit:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #bf360c;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 5px solid var(--primary);
            animation: pop 0.5s ease;
        }

        .score-display {
            font-size: 4em;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
            text-shadow: 3px 3px 0px #eee;
        }

        .feedback-text {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #555;
        }

        .btn-close {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 0 #009e82;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Bài Thi Thử Môi Trường</h1>
        <div class="badge-teacher">Giáo viên: Ms. Chí Nên</div>
        <p>Thử thách Ngữ pháp & Từ vựng (Câu 26-45)</p>
    </header>

    <div id="quiz-area">

    </div>

    <div class="submit-container">
        <button class="btn-submit" onclick="showFinalResult()">NỘP BÀI & XEM ĐIỂM</button>

</div>

<div class="modal-overlay" id="resultModal">
    <div class="modal-content">
        <h2>🎉 KẾT QUẢ CỦA BẠN 🎉</h2>
        <div class="score-display" id="finalScore">0/20</div>
        <p class="feedback-text" id="feedbackMsg">Hãy cố gắng hơn nhé!</p>
        <button class="btn-close" onclick="closeModal()">Xem lại bài làm</button>
    </div>
</div>

<script>
    // --- AUDIO SYSTEM (Synthesized for reliability) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // Ding sound (High pitch sine wave)
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        } else {
            // Buzz sound (Low pitch sawtooth)
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    // --- DATA ---
    const quizData = [
        {
            "questionNumber": 26,

        },
        {
            "questionNumber": 27,
            "question": "We hope more people join our ______ programme.",
            "answerOptions": [
                { "text": "environment", "isCorrect": false },
                { "text": "environmental", "isCorrect": true },
                { "text": "environmentalist", "isCorrect": false },
                { "text": "environmentally", "isCorrect": false }
            ],
            "rationale": "Phân tích:\n- A. environment (n): môi trường.\n- B. environmental (adj): thuộc về môi trường.\n- C. environmentalist (n): nhà môi trường học.\n- D. environmentally (adv): về phương diện môi trường.\n\nDịch câu: Chúng tôi hy vọng có nhiều người tham gia chương trình môi trường của chúng tôi.\n\nGiải thích: Trước danh từ 'programme', ta cần một tính từ (adj) để bổ nghĩa."
        },
        {
            "questionNumber": 28,
            "question": "Harmful gases like nitrogen oxides and sulphur oxides are ______ into the atmosphere during the burning of fossil fuels.",
            "answerOptions": [
                { "text": "releases", "isCorrect": false },
                { "text": "released", "isCorrect": true },
                { "text": "release", "isCorrect": false },
                { "text": "releasing", "isCorrect": false }
            ],
            "rationale": "Phân tích:\n- A. releases (v-s).\n- B. released (v-ed/v3).\n- C. release (v-inf).\n- D. releasing (v-ing).\n\nDịch câu: Các khí độc hại... được thải vào khí quyển trong quá trình đốt nhiên liệu hóa thạch.\n\nGiải thích: Câu bị động (Passive Voice) với cấu trúc 'be + V3/ed'. Ở đây là 'are released'."
        },
        {
            "questionNumber": 29,
            "question": "The ______ of air pollution are alarming.",
            "answerOptions": [
                { "text": "effective", "isCorrect": false },
                { "text": "affect", "isCorrect": false },
                { "text": "effect", "isCorrect": false },
                { "text": "effects", "isCorrect": true }
            ],
            "rationale": "Phân tích:\n- A. effective (adj): hiệu quả.\n- B. affect (v): tác động/ảnh hưởng.\n- C. effect (n): hậu quả/tác động (số ít).\n- D. effects (n): các hậu quả (số nhiều).\n\nDịch câu: Những hậu quả của ô nhiễm không khí thật đáng báo động.\n\nGiải thích: Sau 'The' cần danh từ. Động từ 'are' chia số nhiều => chọn 'effects'."

        {

            "question": "You should drive carefully ______ the road is slippery.",

                { "text": "while", "isCorrect": false },

        },
        {
            "questionNumber": 31,
            "question": "I will sleep with the window open ______ it's cold.",
            "answerOptions": [
                { "text": "if", "isCorrect": false },

            "rationale": "Phân tích:\n- A. if (conj): nếu.\n- B. unless (conj): trừ khi (= if not).\n- C. as (conj): khi/vì.\n- D. before (conj): trước khi.\n\nDịch câu: Tôi sẽ ngủ mở cửa sổ trừ khi trời lạnh.\n\nGiải thích: Hợp lý nhất về nghĩa. Bình thường sẽ mở, nhưng nếu lạnh thì không."
        },
        {

            ],
            "rationale": "Phân tích:\n- A. while (conj): trong khi.\n- B. though (conj): mặc dù.\n- C. since (conj): từ khi/bởi vì.\n- D. as soon as (conj phrase): ngay khi.\n\nDịch câu: Chúng tôi sẽ dọn dẹp bãi biển ngay khi trời tạnh mưa.\n\nGiải thích: Dùng để diễn tả hành động sẽ xảy ra ngay lập tức sau hành động khác trong tương lai."

        {

            "question": "Mary plays with the boy ______ he is naughty.",
            "answerOptions": [

                { "text": "until", "isCorrect": false },
                { "text": "when", "isCorrect": false },
                { "text": "because", "isCorrect": false }
            ],
            "rationale": "Phân tích:\n- A. although (conj): mặc dù.\n- B. until (conj): cho đến khi.\n- C. when (conj): khi.\n- D. because (conj): bởi vì.\n\nDịch câu: Mary chơi với cậu bé mặc dù cậu ấy nghịch ngợm.\n\nGiải thích: Hai vế đối lập: 'chơi cùng' (tích cực) >< 'nghịch ngợm' (tiêu cực)."
        },
        {
            "questionNumber": 34,
            "question": "He won't get paid for time off ______ he hasn't got a doctor's note.",
            "answerOptions": [
                { "text": "unless", "isCorrect": false },
                { "text": "till", "isCorrect": false },
                { "text": "because", "isCorrect": false },
                { "text": "if", "isCorrect": true }
            ],
            "rationale": "Phân tích:\n- A. unless (conj): trừ khi.\n- B. till (conj): đến khi.\n- C. because (conj): bởi vì.\n- D. if (conj): nếu.\n\nDịch câu: Anh ấy sẽ không được trả lương cho thời gian nghỉ nếu anh ấy không có giấy xác nhận của bác sĩ.\n\nGiải thích: Đây là câu điều kiện loại 1 (Condition)."
        },
        {
            "questionNumber": 35,
            "question": "She went to the gym ______ she had finished her work.",

                { "text": "after", "isCorrect": true },
                { "text": "before", "isCorrect": false },

    let userScore = 0;
    const totalQuestions = quizData.length;

    // --- RENDER LOGIC ---
    function renderQuiz() {
        const quizArea = document.getElementById('quiz-area');
        quizArea.innerHTML = '';

        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `q-card-${index}`;

            // 1. Question Header
            const qNum = document.createElement('div');
            qNum.className = 'question-number';
            qNum.innerText = `Câu ${item.questionNumber}`;
            card.appendChild(qNum);

            // 2. Question Text
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = item.question.replace(/______/g, "<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>");
            card.appendChild(qText);

            // 3. Answer Grid
            const grid = document.createElement('div');
            grid.className = 'answers-grid';

            item.answerOptions.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                // Prefix ABC...
                const prefix = String.fromCharCode(65 + optIndex);
                btn.innerHTML = `<strong>${prefix}.</strong>&nbsp; ${opt.text}`;
                
                // Add click event
                btn.onclick = () => checkAnswer(index, optIndex, btn, item.rationale);
                grid.appendChild(btn);
            });
            card.appendChild(grid);

            // 4. Explanation Box (Initially Hidden)
            const expBox = document.createElement('div');
            expBox.className = 'explanation-box';
            expBox.id = `exp-${index}`;
            expBox.innerHTML = `
                <div class="exp-header">
                    <span class="teacher-avatar">👩‍🏫</span> Lời giải chi tiết của Ms. Chí Nên:
                </div>
                <div class="exp-content">${item.rationale.replace(/\n/g, '<br>')}</div>
            `;
            card.appendChild(expBox);

            quizArea.appendChild(card);
        });
    }

    // --- CHECK ANSWER LOGIC ---
    function checkAnswer(qIndex, optIndex, btnElement, rationale) {
        const currentData = quizData[qIndex];
        const card = document.getElementById(`q-card-${qIndex}`);
        const allButtons = card.querySelectorAll('.btn-option');
        const expBox = document.getElementById(`exp-${qIndex}`);

        // Prevent re-clicking
        if (card.getAttribute('data-answered') === 'true') return;
        card.setAttribute('data-answered', 'true');

        const isCorrect = currentData.answerOptions[optIndex].isCorrect;

        if (isCorrect) {
            btnElement.classList.add('correct');
            playSound('correct');
            confetti.start(1000); // 1 second burst
            userScore++;
        } else {
            btnElement.classList.add('wrong');
            playSound('wrong');
            // Highlight the correct answer automatically
            currentData.answerOptions.forEach((opt, idx) => {
                if (opt.isCorrect) {
                    allButtons[idx].classList.add('correct');
                }
            });
        }

        // Dim other buttons
        allButtons.forEach(btn => {
            if (btn !== btnElement && !btn.classList.contains('correct')) {
                btn.classList.add('dimmed');
            }
            btn.disabled = true;
        });

        // Show Explanation immediately
        expBox.classList.add('show');
    }

    // --- FINISH & MODAL LOGIC ---
    function showFinalResult() {
        const modal = document.getElementById('resultModal');
        const scoreEl = document.getElementById('finalScore');
        const feedbackEl = document.getElementById('feedbackMsg');

        // Check how many questions attempted
        const answeredCount = document.querySelectorAll('.quiz-card[data-answered="true"]').length;
        
        scoreEl.innerText = `${userScore}/${totalQuestions}`;

        if (userScore === totalQuestions) {
            feedbackEl.innerText = "Tuyệt vời! Em là một thiên tài ngữ pháp! 🌟";
            playSound('correct');
            confetti.start(3000);
        } else if (userScore >= totalQuestions * 0.8) {
            feedbackEl.innerText = "Làm rất tốt! Em nắm kiến thức rất chắc chắn. 💪";
        } else if (userScore >= totalQuestions * 0.5) {
            feedbackEl.innerText = "Khá lắm! Cố gắng ôn lại các câu sai nhé. 😊";
        } else {
            feedbackEl.innerText = "Đừng buồn nhé! Hãy xem kỹ lời giải chi tiết của cô để tiến bộ hơn. 🍀";
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('resultModal').style.display = 'none';
        confetti.stop();
    }

    // Init
    renderQuiz();

</script>
