<html lang="vi">

<head>

    <style>

        :root {

            --primary-pink: #8854C0;

            --primary-teal: #00C9A7;

            --correct-green: #00D26A;

            --wrong-red: #FF4757;

            --bg-color: #F0F4F8;

            --card-bg: #FFFFFF;

            --text-main: #2D3436;

        }



        body {

            font-family: 'Nunito', sans-serif;

            background-color: var(--primary-pink);

            background-image: radial-gradient(var(--primary-teal) 15%, transparent 16%),

            radial-gradient(var(--primary-teal) 15%, transparent 16%);

            background-size: 60px 60px;

            background-position: 0 0, 30px 30px;

            margin: 0;

            padding: 20px;

            color: var(--text-main);

        }



        .container {

            max-width: 800px;

            margin: 0 auto;

        }



        /* HEADER */

        header {

            text-align: center;

            background: white;

            padding: 15px;

            border-radius: 20px;

            box-shadow: 0 8px 0 rgba(0,0,0,0.1);

            margin-bottom: 30px;

            position: relative;

            border: 4px solid var(--primary-teal);

        }



        h1 {

            font-size: 1.5rem;

            color: var(--primary-pink);

            margin: 0;

            font-weight: 900;

            text-transform: uppercase;

        }



        .score-board {

            margin-top: 10px;

            font-size: 1.2rem;

            font-weight: bold;

            color: var(--primary-teal);

        }



        /* CARD STYLE */

        .card {

            background: var(--card-bg);

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 30px;

            box-shadow: 0 10px 0 rgba(0,0,0,0.1);

            transition: transform 0.3s ease;

            position: relative;

            border: 2px solid #eee;

        }



        .question-title {

            font-size: 1.1rem;

            color: #636e72;

            margin-bottom: 10px;

            font-weight: 700;

            text-transform: uppercase;

            border-bottom: 2px dashed #dfe6e9;

            padding-bottom: 5px;

        }



        .question-text {

            font-size: 1.3rem;

            font-weight: 700;

            margin-bottom: 20px;

            line-height: 1.5;

        }



        .question-text u {

            color: var(--primary-pink);

            text-decoration-thickness: 3px;

            text-underline-offset: 4px;

        }



        /* OPTIONS GRID */

        .options-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

        }



        @media (max-width: 600px) {

            .options-grid {

                grid-template-columns: 1fr;

            }

        }



        .option-btn {

            background: white;

            border: 2px solid #dfe6e9;

            border-radius: 15px;

            padding: 15px 20px;

            font-size: 1.1rem;

            font-family: 'Nunito', sans-serif;

            font-weight: 700;

            color: var(--text-main);

            cursor: pointer;

            transition: all 0.2s;

            box-shadow: 0 4px 0 #dfe6e9;

            text-align: left;

            position: relative;

        }



        .option-btn:hover:not(.disabled) {

            transform: scale(1.02);

            border-color: var(--primary-teal);

        }



        .option-btn:active:not(.disabled) {

            transform: translateY(4px);

            box-shadow: none;

        }



        /* STATES */

        .option-btn.correct {

            background-color: var(--correct-green);

            color: white;

            border-color: #00b85c;

            box-shadow: 0 4px 0 #00b85c;

        }



        .option-btn.wrong {

            background-color: var(--wrong-red);

            color: white;

            border-color: #ff3344;

            box-shadow: 0 4px 0 #ff3344;

            animation: shake 0.5s;

        }



        .option-btn.disabled {

            cursor: default;

            opacity: 0.7;

            pointer-events: none;

        }



        /* EXPLANATION BOX */

        .explanation {

            display: none;

            margin-top: 20px;

            background: #f1faff;

            border: 2px solid var(--primary-teal);

            border-radius: 15px;

            padding: 20px;

            animation: slideDown 0.4s ease-out;

        }



        .exp-header {

            font-weight: 900;

            color: var(--primary-pink);

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 15px;

            font-size: 1.1rem;

        }



        .exp-content p {

            margin: 8px 0;

            line-height: 1.6;

        }



        .exp-translation {

            color: #2d3436;

            font-style: italic;

            background: #fff;

            padding: 10px;

            border-radius: 10px;

            border-left: 4px solid var(--primary-teal);

            margin-bottom: 15px;

        }



        .vocab-list {

            list-style: none;

            padding: 0;

            margin: 10px 0;

        }



        .vocab-item {

            background: white;

            padding: 8px 12px;

            margin-bottom: 5px;

            border-radius: 8px;

            border: 1px solid #eee;

            font-size: 0.95rem;

        }



        .vocab-word {

            font-weight: 800;

            color: var(--primary-pink);

        }



        .why-correct {

            color: var(--correct-green);

            font-weight: bold;

        }



        .why-wrong {

            color: var(--wrong-red);

            font-size: 0.9rem;

        }



        /* SUBMIT BUTTON */

        .submit-section {

            text-align: center;

            margin-top: 40px;

            padding-bottom: 50px;

        }



        .btn-submit {

            background: var(--primary-pink);

            color: white;

            font-size: 1.5rem;

            padding: 15px 50px;

            border: none;

            border-radius: 50px;

            font-family: 'Nunito', sans-serif;

            font-weight: 900;

            cursor: pointer;

            box-shadow: 0 8px 0 #6c429c;

            transition: all 0.2s;

        }



        .btn-submit:hover {

            transform: scale(1.05);

        }



        .btn-submit:active {

            transform: translateY(8px);

            box-shadow: none;

        }



        /* ANIMATIONS */

        @keyframes shake {

            0% { transform: translateX(0); }

            25% { transform: translateX(-10px); }

            50% { transform: translateX(10px); }

            75% { transform: translateX(-10px); }

            100% { transform: translateX(0); }

        }



        @keyframes slideDown {

            from { opacity: 0; transform: translateY(-10px); }

            to { opacity: 1; transform: translateY(0); }

        }



    </style>

</head>

    let currentScore = 0;

                    <button class="option-btn" onclick="checkAnswer(${index}, '${opt.id}', this)">

                    </button>

                `).join('')}

            </div>



            <div class="explanation" id="exp-${index}">

                                <i>(${opt.type || 'word'})</i>: ${opt.meaning}

                        `).join('')}

                    <p class="why-correct">✅ Tại sao chọn ${q.correct}? <br> ${q.explanation}</p>

                </div>

            </div>

    // --- AUDIO SYSTEM (Web Audio API - No External Files) ---

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();



    function playSound(type) {

        const osc = audioCtx.createOscillator();

        const gainNode = audioCtx.createGain();

        osc.connect(gainNode);

        gainNode.connect(audioCtx.destination);



        if (type === 'correct') {

            // Ding sound (High pitch, fast decay)

            osc.type = 'sine';

            osc.frequency.setValueAtTime(600, audioCtx.currentTime);

            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.start();

            osc.stop(audioCtx.currentTime + 0.5);

        } else {

            // Buzz sound (Low saw, wobble)

            osc.type = 'sawtooth';

            osc.frequency.setValueAtTime(150, audioCtx.currentTime);

            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            osc.start();

            osc.stop(audioCtx.currentTime + 0.3);

        }

    }



    // --- LOGIC CHECK ANSWER ---

    function checkAnswer(questionIndex, selectedId, btnElement) {

        const question = quizData[questionIndex];

        const optionsDiv = document.getElementById(`options-${questionIndex}`);

        const allButtons = optionsDiv.querySelectorAll('.option-btn');

        const expDiv = document.getElementById(`exp-${questionIndex}`);



        // Prevent re-clicking

        if (btnElement.classList.contains('disabled')) return;



        // Disable all buttons in this question

        allButtons.forEach(btn => btn.classList.add('disabled'));



        if (selectedId === question.correct) {

            // CORRECT

            btnElement.classList.add('correct');

            playSound('correct');

            currentScore++;

            document.getElementById('currentScore').innerText = currentScore;

            

            // Confetti Effect

            confetti({

                particleCount: 100,

                spread: 70,

                origin: { y: 0.6 },

                colors: ['#00D26A', '#8854C0', '#00C9A7']

            });

        } else {

            // WRONG

            btnElement.classList.add('wrong');

            playSound('wrong');

            

            // Highlight correct answer

            allButtons.forEach(btn => {

                if (btn.innerText.startsWith(question.correct)) {

                    btn.classList.add('correct');

                }

            });

        }



        // Show Explanation

        expDiv.style.display = 'block';

    }



    // --- FINISH QUIZ ---

    function finishQuiz() {

        let message = "";

        const percentage = (currentScore / totalQuestions) * 100;



        if (percentage === 100) message = "🎉 Xuất sắc! Em là thiên tài tiếng Anh!";

        else if (percentage >= 80) message = "🌟 Giỏi lắm! Cố gắng thêm một chút nữa là hoàn hảo!";

        else if (percentage >= 50) message = "📚 Khá tốt! Em nhớ xem lại phần giải thích nhé!";

        else message = "💪 Đừng buồn! Hãy xem kỹ giải thích để làm tốt hơn lần sau nhé!";



        alert(`KẾT QUẢ CỦA BẠN:\n\nSố câu đúng: ${currentScore} / ${totalQuestions}\n\n${message}`);

    }
