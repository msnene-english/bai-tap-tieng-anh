<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Giới Từ (Part 2) - Ms MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* GIỮ NGUYÊN GIAO DIỆN CŨ - KHÔNG ĐỔI */
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f3fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--primary-purple) 1px, transparent 1px), radial-gradient(var(--primary-teal) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--primary-purple);
        }

        h1 {
            color: var(--primary-purple);
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            text-transform: uppercase;
        }

        .sub-header {
            font-size: 1rem;
            color: #777;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Question Card Style */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 6px 0 #e0e0e0, 0 10px 10px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.3s ease;
            border: 2px solid #eee;
        }

        .question-number {
            display: inline-block;
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            box-shadow: 0 4px 0 #ccc;
            color: var(--text-color);
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: var(--primary-teal);
            background-color: #f0fffa;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ccc;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background-color: var(--correct-green) !important;
            color: white !important;
            border-color: var(--correct-green) !important;
            box-shadow: 0 4px 0 #008f48 !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            color: white !important;
            border-color: var(--wrong-red) !important;
            box-shadow: 0 4px 0 #b3202d !important;
            animation: shake 0.5s;
        }

        /* Explanation Section */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 20px;
            background: #fff9e6;
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.visible {
            display: block;
        }

        .exp-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: #d35400;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .exp-content {
            font-size: 1rem;
            line-height: 1.6;
        }

        .exp-step {
            margin-bottom: 10px;
        }

        .exp-label {
            font-weight: 700;
            color: var(--primary-purple);
            text-decoration: underline;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Submit Button */
        #submit-btn {
            display: block;
            width: 100%;
            background: var(--primary-teal);
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 20px;
            box-shadow: 0 6px 0 #00917c;
            cursor: pointer;
            margin-top: 40px;
            transition: all 0.2s;
            font-family: 'Quicksand', sans-serif;
            text-transform: uppercase;
        }

        #submit-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        #submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #00917c;
        }

        /* Result Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 5px solid var(--primary-purple);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-display {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-teal);
            margin: 20px 0;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
         /* Phonetics Underline */
        u {
            text-decoration: none;
            border-bottom: 2px solid var(--primary-purple);
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="sub-header">Giáo viên tạo: Ms MS Chí Nên</div>
            <h1>BÀI TẬP GIỚI TỪ (PART 2)</h1>
            <div style="font-size: 0.9rem; color: #555; margin-top:5px;">Chủ đề: Công nghệ, Sự kiện & Các vị trí đặc biệt</div>
        </header>

        <div id="quiz-container">
            </div>

        <button id="submit-btn" onclick="submitQuiz()">NỘP BÀI 🚀</button>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2>KẾT QUẢ CỦA CON</h2>
            <div class="score-display" id="final-score">0/30</div>
            <p id="feedback-text" style="font-size: 1.2rem; color: #555;">...</p>
            <button class="option-btn" style="background: var(--primary-purple); color: white; border-color: #6c429c; margin-top: 20px; width: 100%; text-align: center;" onclick="location.reload()">Làm lại bài</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

<script>
    // --- DATABASE: 30 NEW Questions (Different Contexts) ---
    const quizData = [
        // GROUP 1: MEDIA & TECHNOLOGY (Công nghệ & Truyền thông)
        {
            question: "I found this interesting article _____ the Internet.",
            options: [
                { text: "A. in", type: "prep", meaning: "trong" },
                { text: "B. at", type: "prep", meaning: "tại" },
                { text: "C. on", type: "prep", meaning: "trên" },
                { text: "D. to", type: "prep", meaning: "tới" }
            ],
            correct: 2, // C
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Tôi tìm thấy bài báo thú vị này trên mạng Internet.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong>
                    <br>A. in: trong.
                    <br>B. at: tại.
                    <br>C. on: trên (bề mặt/nền tảng).
                    <br>D. to: tới.
                </div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Với Internet, Website, TV, Radio, Mạng xã hội (Facebook, Youtube), ta luôn dùng giới từ <strong>"on"</strong>. Đây là nền tảng kỹ thuật số.</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "In the Internet" là lỗi sai rất phổ biến của người Việt (dịch word-by-word 'trong mạng'), nhưng tiếng Anh chuẩn phải là "on".</div>
            `
        },
        {
            question: "Click on the icon _____ the top of the screen.",
            options: [
                { text: "A. on", type: "prep", meaning: "trên" },
                { text: "B. at", type: "prep", meaning: "tại" },
                { text: "C. in", type: "prep", meaning: "trong" },
                { text: "D. above", type: "prep", meaning: "phía trên" }
            ],
            correct: 1, // B
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Hãy nhấp vào biểu tượng ở phía trên cùng của màn hình.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong> "The top" (đỉnh/phần trên cùng).</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (B):</strong> Cấu trúc cố định: <strong>at the top of</strong> (ở trên cùng), <strong>at the bottom of</strong> (ở dưới cùng). Nó chỉ một điểm vị trí cụ thể.</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "On the top" thường dùng cho nghĩa đen là đặt vật gì lên đỉnh vật khác (Put a star on the top of the tree). Còn vị trí trên trang giấy/màn hình dùng "at".</div>
            `
        },
        {
            question: "There is too much sugar _____ the ingredients list.",
            options: [
                { text: "A. at", type: "prep", meaning: "tại" },
                { text: "B. on", type: "prep", meaning: "trên" },
                { text: "C. in", type: "prep", meaning: "trong" },
                { text: "D. with", type: "prep", meaning: "với" }
            ],
            correct: 2, // C (Wait, "in the list" or "on the list"? Usually "on the list".)
            // Correction: "Sugar in the ingredients" is correct, but "on the list". Context: "There is sugar ON the list".
            // Let's refine the question to be clear. "Is your name _____ the list?" -> ON.
            // Let's change question to: "Is your name _____ the list?" for clarity.
        },
        { // REPLACING QUESTION 3 for clarity
            question: "I checked the guest list but your name wasn't _____ it.",
            options: [
                { text: "A. in", type: "prep", meaning: "trong" },
                { text: "B. at", type: "prep", meaning: "tại" },
                { text: "C. on", type: "prep", meaning: "trên" },
                { text: "D. to", type: "prep", meaning: "tới" }
            ],
            correct: 2, // C
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Tôi đã kiểm tra danh sách khách mời nhưng tên bạn không có trong (trên) đó.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong> "The list" (danh sách), "The menu" (thực đơn).</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Ta dùng <strong>"on a list"</strong>, <strong>"on a menu"</strong>. Hãy tưởng tượng danh sách là một bề mặt chứa các dòng chữ.</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> Người Việt hay nói "trong danh sách" nên dễ chọn "in". Đây là bẫy! Tiếng Anh dùng "on".</div>
            `
        },
        {
            question: "Look at the woman _____ the picture.",
            options: [
                { text: "A. on", type: "prep", meaning: "trên" },
                { text: "B. at", type: "prep", meaning: "tại" },
                { text: "C. in", type: "prep", meaning: "trong" },
                { text: "D. with", type: "prep", meaning: "với" }
            ],
            correct: 2, // C
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Hãy nhìn người phụ nữ trong bức tranh.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong> Picture/Photo (Tranh/Ảnh) là một không gian hình ảnh 2D.</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Quy tắc: <strong>In a picture/In a photo</strong>. Người/vật nằm bên trong khung cảnh của bức tranh.</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "On the picture" nghĩa là có vết bẩn hoặc vật gì đè lên bề mặt tờ giấy tranh.</div>
            `
        },
        {
            question: "I saw my face _____ the mirror.",
            options: [
                { text: "A. on", type: "prep", meaning: "trên" },
                { text: "B. in", type: "prep", meaning: "trong" },
                { text: "C. at", type: "prep", meaning: "tại" },
                { text: "D. opposite", type: "prep", meaning: "đối diện" }
            ],
            correct: 1, // B
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Tôi nhìn thấy khuôn mặt mình trong gương.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong> Mirror (Gương). Hình ảnh phản chiếu nằm "sâu" bên trong mặt gương.</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (B):</strong> Quy tắc: <strong>In the mirror</strong>.</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "On the mirror" là khi có con ruồi đậu trên mặt kính của gương.</div>
            `
        },

        // GROUP 2: SPECIFIC POSITIONS (Vị trí cụ thể)
        {
            question: "Please sign your name _____ the bottom of the page.",
            options: [
                { text: "A. in", type: "prep", meaning: "trong" },
                { text: "B. on", type: "prep", meaning: "trên" },
                { text: "C. at", type: "prep", meaning: "tại" },
                { text: "D. under", type: "prep", meaning: "dưới" }
            ],
            correct: 2, // C
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Vui lòng ký tên ở cuối trang.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong> "The bottom" (phần đáy/cuối).</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Cấu trúc: <strong>At the bottom of...</strong> (Tại điểm cuối cùng). Tương tự "At the top of".</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "On the bottom" thường dùng cho đáy của vật thể 3D (đáy chai, đáy nồi). Với trang giấy dùng "at".</div>
            `
        },
        {
            question: "Turn left _____ the traffic lights.",
            options: [
                { text: "A. in", type: "prep", meaning: "trong" },
                { text: "B. on", type: "prep", meaning: "trên" },
                { text: "C. by", type: "prep", meaning: "bởi" },
                { text: "D. at", type: "prep", meaning: "tại" }
            ],
            correct: 3, // D
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Rẽ trái tại đèn giao thông.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong> Traffic lights (đèn giao thông) là một cột mốc/điểm mốc trên đường.</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (D):</strong> Với các điểm mốc trên hành trình (traffic lights, roundabout, junction), ta dùng <strong>"at"</strong>.</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> Không ai nói "on the traffic lights" (trừ khi con chim đậu trên đó).</div>
            `
        },
        {
            question: "My shop is _____ the end of the street.",
            options: [
                { text: "A. in", type: "prep", meaning: "trong" },
                { text: "B. at", type: "prep", meaning: "tại" },
                { text: "C. on", type: "prep", meaning: "trên" },
                { text: "D. to", type: "prep", meaning: "tới" }
            ],
            correct: 1, // B
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Cửa hàng của tôi ở cuối đường.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong> "The end" (điểm kết thúc).</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (B):</strong> Cụm cố định: <strong>At the end of...</strong> (Tại điểm cuối của cái gì đó).</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "In the end" là cụm từ chỉ thời gian (Cuối cùng thì...), không chỉ vị trí.</div>
            `
        },
        {
            question: "The children are playing _____ the corner of the room.",
            options: [
                { text: "A. on", type: "prep", meaning: "trên" },
                { text: "B. at", type: "prep", meaning: "tại" },
                { text: "C. in", type: "prep", meaning: "trong" },
                { text: "D. to", type: "prep", meaning: "tới" }
            ],
            correct: 2, // C
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Lũ trẻ đang chơi ở trong góc phòng.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong> Góc phòng (góc trong - inside corner).</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Với góc nhà, góc phòng (khép kín), ta dùng <strong>"in the corner"</strong>.</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> Nếu là góc đường (bên ngoài), ta dùng "at/on the corner of the street". Nhưng trong phòng phải là "in".</div>
            `
        },
        {
            question: "Let's meet _____ the corner of Pho Hue Street.",
            options: [
                { text: "A. in", type: "prep", meaning: "trong" },
                { text: "B. at", type: "prep", meaning: "tại" },
                { text: "C. inside", type: "prep", meaning: "bên trong" },
                { text: "D. through", type: "prep", meaning: "xuyên qua" }
            ],
            correct: 1, // B
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu:</strong> Hãy gặp nhau ở góc đường Phố Huế nhé.</div>
                <div class="exp-step"><strong>2. Phân tích:</strong> Góc phố (góc ngoài - outside corner).</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (B):</strong> Với góc phố/ngã rẽ ngoài đường, ta dùng <strong>"at the corner"</strong> (hoặc "on the corner" trong Anh-Mỹ). "At" phổ biến hơn khi coi nó là điểm hẹn.</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "In the corner" dùng cho góc phòng (xem câu trên).</div>
            `
        },

        // GROUP 3: EVENTS & SOCIAL (Sự kiện xã hội)
        {
            question: "I met my old teacher _____ a wedding last week.",

                <div class="exp-step"><strong>2. Phân tích:</strong> Grass (bãi cỏ) là bề mặt.</div>
                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Ngồi trên bề mặt -> Dùng <strong>"on"</strong>.</div>
                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "In the grass" thường dùng cho côn trùng hoặc vật nhỏ lẩn khuất trong bụi cỏ cao. Người ngồi thì dùng "on".</div>
            `
        }
    ];

    // --- GAME LOGIC (Keep exactly the same) ---

    let currentScore = 0;
    const totalQuestions = quizData.length;
    let answeredCount = 0;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        } else {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        shuffleArray(quizData);

        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${index}`;

            let optionIndices = [0, 1, 2, 3];
            shuffleArray(optionIndices);
            let mappedCorrectIndex = optionIndices.indexOf(item.correct);
            
            let optionsHtml = '';
            optionIndices.forEach((originalIndex, displayIndex) => {
                const opt = item.options[originalIndex];
                optionsHtml += `
                    <button class="option-btn" onclick="checkAnswer(${index}, ${displayIndex}, ${mappedCorrectIndex}, this)">
                        ${opt.text} <br> <span style="font-size:0.8rem; color:#666; font-weight:normal;">(${opt.type} - ${opt.meaning})</span>
                    </button>
                `;
            });

            card.innerHTML = `
                <div class="question-number">Câu ${index + 1}</div>
                <div class="question-text">${item.question}</div>
                <div class="options-grid">
                    ${optionsHtml}
                </div>
                <div class="explanation-box" id="exp-${index}">
                    <div class="exp-header">
                        <span>💡 GIẢI THÍCH CHI TIẾT (Cô MS Chí Nên)</span>
                    </div>
                    <div class="exp-content">
                        ${item.explanation}
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.checkAnswer = function(qIndex, selectedIndex, correctIndex, btnElement) {
        const card = document.getElementById(`q-${qIndex}`);
        const buttons = card.querySelectorAll('.option-btn');
        if (card.getAttribute('data-answered') === 'true') return;

        card.setAttribute('data-answered', 'true');
        answeredCount++;

        document.getElementById(`exp-${qIndex}`).classList.add('visible');

        if (selectedIndex === correctIndex) {
            btnElement.classList.add('correct');
            currentScore++;
            playSound('correct');
            triggerConfetti(btnElement);
        } else {
            btnElement.classList.add('wrong');
            buttons[correctIndex].classList.add('correct');
            playSound('wrong');
        }
        buttons.forEach(btn => btn.disabled = true);
    };

    window.submitQuiz = function() {
        const modal = document.getElementById('result-modal');
        const scoreText = document.getElementById('final-score');
        const feedback = document.getElementById('feedback-text');

        modal.style.display = 'flex';
        scoreText.innerText = `${currentScore}/${totalQuestions}`;

        if (currentScore === totalQuestions) {
            feedback.innerText = "🌟 Xuất sắc! Con đã làm chủ mọi ngữ cảnh khó nhất!";
            startConfettiLoop();
        } else if (currentScore >= totalQuestions * 0.8) {
            feedback.innerText = "👏 Rất tốt! Chỉ một vài lỗi nhỏ xíu thôi.";
        } else if (currentScore >= totalQuestions * 0.5) {
            feedback.innerText = "💪 Tạm ổn, nhưng cần chú ý kỹ hơn các trường hợp ngoại lệ nhé.";
        } else {
            feedback.innerText = "📚 Con hãy xem lại phần giải thích thật kỹ nhé!";
        }
    };

    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD700', '#00D26A'];

    function triggerConfetti(element) {
        const rect = element.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;

        for (let i = 0; i < 30; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10 - 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: Math.random() * 8 + 4,
                life: 100
            });
        }
        requestAnimationFrame(updateConfetti);
    }

    function startConfettiLoop() {
        setInterval(() => {
            const x = Math.random() * canvas.width;
            const y = -10;
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: Math.random() * 5 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    life: 200
                });
            }
        }, 100);
        updateConfetti();
    }

    function updateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--; p.size *= 0.98;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            if (p.life <= 0) { particles.splice(i, 1); i--; }
        }
        if (particles.length > 0) requestAnimationFrame(updateConfetti);
    }

    window.onload = renderQuiz;
</script>
</body>
</html>
