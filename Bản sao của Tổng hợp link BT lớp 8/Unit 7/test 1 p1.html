<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ POSTCARD FROM EARTH · TEST 1 — Unit 7 — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--kraft:#EDE0C3;--kraft2:#E3D3AC;--red:#C0392B;--navy:#1F3A5F;--ink:#3A2E1F;--string:#A9895C;
  --good:#1E8449;--bad:#C0392B;--gold:#B8860B;--paper:#FBF4E2}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;position:relative;
  background:
   radial-gradient(circle at 15% 20%,rgba(160,120,60,.08) 0,transparent 45%),
   radial-gradient(circle at 85% 75%,rgba(160,120,60,.08) 0,transparent 45%),
   linear-gradient(var(--kraft),var(--kraft))}
body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
  background-image:radial-gradient(rgba(120,90,50,.12) 1px,transparent 1.3px);background-size:14px 14px}
.stripe{position:fixed;top:0;left:0;right:0;height:10px;z-index:5;
  background:repeating-linear-gradient(135deg,var(--red) 0 18px,#fff 18px 36px,var(--navy) 36px 54px,#fff 54px 72px)}
.stripe.bot{top:auto;bottom:0}
.drift{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.drift span{position:absolute;font-size:26px;opacity:.22;animation:fl linear infinite}
@keyframes fl{0%{transform:translateY(110vh) rotate(-8deg)}100%{transform:translateY(-15vh) rotate(10deg)}}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:24px 16px 90px}
/* ── HEADER: POSTCARD FRONT ── */
.pc{background:var(--paper);border:3px solid var(--ink);border-radius:6px;padding:20px 20px 16px;position:relative;
  box-shadow:0 10px 0 -4px rgba(0,0,0,.08),6px 10px 18px rgba(60,40,10,.25);margin-bottom:22px}
.pc::after{content:"";position:absolute;inset:8px;border:1.5px dashed var(--string);border-radius:3px;pointer-events:none}
.stamp{position:absolute;top:14px;right:16px;width:78px;height:96px;background:#fff;
  border:2.5px dashed var(--navy);border-radius:4px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;transform:rotate(4deg);box-shadow:2px 3px 6px rgba(0,0,0,.2)}
.stamp .globe{font-size:34px}
.stamp b{font-family:'Special Elite',monospace;font-size:.56rem;color:var(--navy);letter-spacing:.5px;margin-top:2px}
.postmark{position:absolute;top:24px;right:104px;width:74px;height:74px;border-radius:50%;
  border:2.5px solid rgba(31,58,95,.55);display:flex;align-items:center;justify-content:center;
  transform:rotate(-12deg);opacity:.75}
.postmark::before{content:"";position:absolute;inset:6px;border:1.5px solid rgba(31,58,95,.5);border-radius:50%}
.postmark b{font-family:'Special Elite',monospace;font-size:.6rem;color:var(--navy);text-align:center;line-height:1.3}
.pc h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(28px,6vw,44px);color:var(--red);line-height:1.05;
  max-width:75%}
.pc .sub{font-family:'Special Elite',monospace;font-size:.8rem;color:var(--navy);margin-top:8px;letter-spacing:.5px;
  max-width:75%;line-height:1.7}
.teacher-tag{display:inline-block;margin-top:10px;font-family:'Caveat',cursive;font-weight:700;font-size:1.05rem;
  color:#fff;background:var(--navy);border-radius:999px;padding:3px 16px;transform:rotate(-1.5deg)}
/* ── SCORE BAR ── */
.sb{position:sticky;top:16px;z-index:20;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:20px;
  border-radius:999px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:3px 4px 0 rgba(0,0,0,.15)}
.sb b{font-family:'Special Elite',monospace;font-size:.98rem;color:var(--navy)}
.tr{flex:1;height:10px;background:rgba(31,58,95,.12);border-radius:999px;overflow:hidden;border:1px solid rgba(31,58,95,.3)}
.fl2{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .45s}
/* ── SECTION ── */
.sec{background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;padding:18px 16px 20px;margin-bottom:22px;
  position:relative;box-shadow:4px 6px 0 rgba(60,40,10,.12)}
.tape{position:absolute;top:-11px;width:64px;height:22px;background:rgba(184,134,11,.35);
  border:1px solid rgba(184,134,11,.5);transform:rotate(-3deg)}
.tape.r{right:26px;transform:rotate(3deg)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:2px 0 6px}
.pill{color:#fff;border-radius:999px;padding:3px 15px;font-size:.82rem;font-family:'Special Elite',monospace;
  letter-spacing:.6px;box-shadow:1px 2px 0 rgba(0,0,0,.2)}
.st h2{font-family:'Caveat',cursive;font-weight:700;font-size:1.4rem;color:var(--ink)}
.si{font-size:.87rem;font-weight:600;color:#6b5a3d;font-style:italic;margin:3px 0 15px;line-height:1.7}
.divider{border:none;border-top:1.5px dashed var(--string);margin:10px 0 14px}
/* ── QUESTION ── */
.q{background:#fff;border:2px dashed #d8c79a;border-radius:11px;padding:13px 14px 14px;margin-bottom:13px;
  transition:border-color .25s}
.q.shk{animation:shk .42s ease}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.qn{display:inline-flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;min-width:28px;
  height:25px;padding:0 7px;border-radius:50%;font-size:.76rem;font-weight:800;margin-right:8px;
  font-family:'Special Elite',monospace}
.qt{font-size:1.15rem;font-weight:700;color:var(--ink);line-height:1.85}
.qt b{color:var(--red)}
.hint{display:block;font-size:.85rem;font-weight:700;color:#8a6a2f;font-style:italic;margin-top:5px;line-height:1.6}
.src{background:var(--kraft2);border-left:4px solid var(--navy);border-radius:0 9px 9px 0;padding:8px 12px;
  margin-top:8px;font-weight:800;font-size:.98rem;line-height:1.8;color:var(--ink)}
.pre,.suf{font-weight:800;font-size:1rem;color:var(--ink);line-height:1.6}
.pre{white-space:nowrap}
.suf{white-space:normal}
/* options */
.og{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:680px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.og{grid-template-columns:1fr}}
.ob{background:#fff;border:2px solid #d8c79a;border-radius:16px;padding:11px 13px;color:var(--ink);
  font-family:'Nunito',sans-serif;font-size:1.08rem;font-weight:700;cursor:pointer;text-align:center;
  transition:all .16s ease;line-height:1.5;word-break:break-word;box-shadow:0 5px 0 rgba(60,40,10,.16)}
.ob:hover:not(.dn){transform:translateY(-2px) scale(1.03);border-color:var(--navy);box-shadow:0 8px 14px rgba(31,58,95,.22)}
.ob.ok{background:#e5f6ea;border-color:var(--good);color:var(--good)}
.ob.no{background:#fbe4e1;border-color:var(--bad);color:var(--bad)}
.ob.dim{opacity:.4}
/* ── FIND-THE-ERROR: letter cards ── */
.lt{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}
@media(max-width:560px){.lt{grid-template-columns:repeat(2,1fr)}}
.lb{background:#fff;border:2px solid #d8c79a;border-radius:16px;padding:9px 7px;cursor:pointer;
  font-family:'Special Elite',monospace;font-size:1.3rem;font-weight:900;color:var(--navy);
  transition:all .16s ease;box-shadow:0 5px 0 rgba(60,40,10,.16)}
.lb small{display:block;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;color:#6b5a3d;
  margin-top:3px;line-height:1.4;word-break:break-word}
.lb:hover:not(:disabled){transform:translateY(-2px) scale(1.03);border-color:var(--navy)}
.lb.sel{background:#e8f0fb;border-color:var(--navy);box-shadow:0 5px 0 rgba(31,58,95,.35)}
.lb.ok{background:#e5f6ea;border-color:var(--good);color:var(--good)}
.lb.ok small{color:#12652f}
.lb.no{background:#fbe4e1;border-color:var(--bad);color:var(--bad)}
.lb.no small{color:#8e2b20}
.fx{display:none}
.fx.on{display:flex}
/* fill */
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
.ti,.ti2{flex:1;min-width:190px;padding:9px 13px;border:2px solid #d8c79a;border-radius:10px;
  font-family:'Nunito';font-size:.96rem;font-weight:800;outline:none;background:#fffdf8;color:var(--ink)}
.ti2{min-width:110px;flex:none;width:150px;text-align:center}
.ti:focus,.ti2:focus{border-color:var(--navy)}
.ti.ok,.ti2.ok{border-color:var(--good);background:#e5f6ea;color:var(--good)}
.ti.no,.ti2.no{border-color:var(--bad);background:#fbe4e1;color:var(--bad)}
.ck{background:var(--navy);color:#fff;border:none;border-radius:999px;font-family:'Special Elite',monospace;
  font-size:.78rem;letter-spacing:.8px;padding:11px 22px;cursor:pointer;transition:all .2s;white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,58,95,.35)}
.ck:disabled{opacity:.4;cursor:default}
/* explanation */
.ex{display:none;background:#fff;border:1.5px solid var(--navy);border-radius:12px;padding:14px;margin-top:12px;
  font-size:1rem;line-height:1.85}
.ex.show{display:block;animation:sd .3s ease}
@keyframes sd{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.kb{background:#e5f6ea;border:1px solid var(--good);border-radius:9px;padding:7px 11px;margin-bottom:9px;
  font-weight:900;color:#12652f;line-height:1.7}
.vnt{background:#FFF1DC;border:1.5px solid #E9A21B;border-left:5px solid #E9A21B;border-radius:10px;
  padding:8px 12px;margin:0 0 10px;font-weight:800;color:#8A5A04;line-height:1.75;font-size:1rem}
.ex ol{margin:0 0 0 21px}
.ex ol>li{margin-bottom:9px;font-weight:700;color:#4a3b22;line-height:1.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:8px 0 4px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#FBF7EC;border:1px solid #E4D7BA;border-radius:10px;padding:6px 10px;
  font-size:.97rem;font-weight:700;line-height:1.7}
.p-word{color:#1565C0;font-weight:800}
.hl-green{color:#0B8A3D;font-weight:900}
.hl-red{color:#D32F2F;font-weight:900}
.wt{background:rgba(58,46,31,.1);border-radius:6px;padding:0 6px;font-size:.8rem;font-weight:800;
  color:#5a4a30;font-style:italic}
.p-phonetic{color:#7B1FA2;background:#F3E5F5;border-radius:5px;padding:0 5px;font-size:.92rem;font-weight:700}
.p-mean{color:#BF5B04;font-weight:700}
.p-grammar{color:#C62828;font-weight:700;text-decoration:underline;text-decoration-color:#EF9A9A;
  text-underline-offset:3px}
u{background:#fdecc8;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800;color:#8a5a00}
/* ── SUBMIT & MODAL ── */
.sub{text-align:center;padding:26px 10px}
.sbtn{background:var(--red);color:#fff;border:none;border-radius:999px;font-family:'Special Elite',monospace;
  font-size:.92rem;letter-spacing:1px;padding:15px 40px;cursor:pointer;box-shadow:0 8px 20px rgba(192,57,43,.4);
  transition:all .25s}
.sbtn:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(192,57,43,.5)}
.ov{position:fixed;inset:0;background:rgba(30,20,10,.7);z-index:1000;display:none;align-items:center;
  justify-content:center;backdrop-filter:blur(4px);padding:16px;overflow-y:auto}
.ov.on{display:flex}
.mb{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:28px 24px;max-width:440px;
  width:94%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:90vh;overflow-y:auto}
.mb h2{font-family:'Caveat',cursive;font-size:1.7rem;color:var(--red);margin-bottom:14px}
.mb input{width:100%;background:#fff;border:2px solid var(--navy);border-radius:11px;padding:12px 15px;
  color:var(--ink);font-family:'Nunito';font-size:.98rem;font-weight:700;text-align:center;margin-bottom:12px;outline:none}
.mb input.er{border-color:var(--bad);animation:shk .42s ease}
.mb .em{color:var(--bad);font-size:.82rem;margin-bottom:10px;display:none;font-weight:700}
.mb .gr{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--navy);margin-bottom:8px}
.mb .rs{font-family:'Special Elite',monospace;font-size:2.5rem;font-weight:900;color:var(--red);margin:10px 0 4px}
.mb .rt{font-size:1rem;font-weight:800;color:var(--gold);margin:4px 0 8px}
.mb .rm{font-size:.92rem;font-weight:600;color:#4a3b22;line-height:1.75;margin-bottom:12px}
.mb img{width:100%;max-width:250px;border-radius:12px;margin:12px auto;display:block;border:2px solid var(--ink)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:1100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>

<script>
(function(){
 const W=['✈️','🌍','📮','💌','🗺️','🧳','🌿','♻️'];
 const D=document.getElementById('drift');
 for(let i=0;i<14;i++){
  const s=document.createElement('span');s.textContent=W[i%W.length];
  s.style.left=(Math.random()*96)+'%';s.style.fontSize=(18+Math.random()*20).toFixed(0)+'px';
  s.style.animationDuration=(16+Math.random()*16).toFixed(1)+'s';
  s.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  D.appendChild(s);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#C0392B','#1F3A5F','#B8860B','#1E8449','#EDE0C3'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
/* ══ DỮ LIỆU ══ */
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fil(sec,num,q,pre,suf,ans,accept,ex){Q.push({t:'fill',sec,num,q,pre:pre||'',suf:suf||'.',correct:ans,accept,ex})}
function fil2(sec,num,q,ans1,ans2,acc1,acc2,ex){Q.push({t:'fill2',sec,num,q,ans1,ans2,acc1,acc2,ex})}
function err(sec,num,q,parts,ci,fix,accept,ex){Q.push({t:'err',sec,num,q,parts,ci,fix,accept,ex})}
/* A = 1 dòng phân tích đáp án: từ · từ loại · phiên âm · nghĩa */
function A(w,t,m,p,ok){return '<span class="'+(ok?'hl-green':'p-word')+'">'+w+'</span>'+
 (t?' <span class="wt">'+t+'</span>':'')+(p?' <span class="p-phonetic">'+p+'</span>':'')+
 ' = <span class="p-mean">'+m+'</span>'}
/* EX = khung giải thích 4 bước */
function EX(key,vn,arr,why,wrong){return '<div class="kb">🔑 ĐÁP ÁN: '+key+'</div>'+
 '<div class="vnt">💬 Dịch: '+vn+'</div><ol>'+
 (arr&&arr.length?'<li>Phân tích các đáp án:<div class="grid2">'+arr.map(x=>'<div>'+x+'</div>').join('')+'</div></li>':'')+
 '<li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class="p-grammar">'+why+'</span></li>'+
 (wrong?'<li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class="p-grammar">'+wrong+'</span></li>':'')+'</ol>'}

/* ═════ SECTION 1 — NGỮ ÂM (5 câu) ═════ */
mcq('S1',1,'Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại:',
 'campf<u>i</u>re',['campf<u>i</u>re','m<u>i</u>ssion','ext<u>i</u>nct','l<u>i</u>tter'],
 EX('campf<u>i</u>re — “i” đọc /aɪ/',
 'Chọn từ có phần gạch chân được phát âm khác ba từ còn lại. (lửa trại / nhiệm vụ / tuyệt chủng / rác)',
 [A('campf<u>i</u>re','n','lửa trại','/ˈkæmpfaɪə(r)/',1),
  A('m<u>i</u>ssion','n','nhiệm vụ, sứ mệnh','/ˈmɪʃn/'),
  A('ext<u>i</u>nct','adj','đã tuyệt chủng','/ɪkˈstɪŋkt/'),
  A('l<u>i</u>tter','n','rác vứt bừa bãi','/ˈlɪtə(r)/')],
 'campfire là từ ghép camp + fire. Trong “fire”, chữ “i” đi cùng “re” nên đọc thành nguyên âm đôi /aɪ/.',

document.getElementById('tt').textContent=TOTAL;bump();

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 const shake=()=>{c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)};
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='err'){
  c.innerHTML='<div class="qt">'+h+m.q+
   '<span class="hint">👉 Bấm chọn chữ cái có lỗi, rồi gõ lại cho ĐÚNG phần đó.</span></div>'+
   '<div class="lt" id="l_'+gid+'">'+m.parts.map((p,i)=>
     '<button class="lb" data-i="'+i+'">'+'ABCD'[i]+'<small>'+p+'</small></button>').join('')+'</div>'+
   '<div class="fr fx" id="f_'+gid+'"><span class="pre">✏️ Sửa lại thành:</span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="...gõ từ/cụm từ đúng..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const L=c.querySelector('#l_'+gid),F=c.querySelector('#f_'+gid),
        inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  let sel=-1;
  L.querySelectorAll('.lb').forEach(b=>{b.onclick=()=>{
   if(done[gid])return;sel=+b.dataset.i;
   L.querySelectorAll('.lb').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
   F.classList.add('on');inp.focus()}});
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(sel<0||!v){inp.classList.add('no');shake();setTimeout(()=>inp.classList.remove('no'),460);return}
   done[gid]=true;answered++;
   const ok=(sel===m.ci)&&m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   L.querySelectorAll('.lb').forEach((x,j)=>{x.disabled=true;x.classList.remove('sel');
    if(j===m.ci)x.classList.add('ok');else if(j===sel)x.classList.add('no')});
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();shake()}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 } else if(m.t==='fill2'){
  const qh=m.q.replace('{{1}}','<input class="ti2" id="i1_'+gid+'" autocomplete="off" spellcheck="false">')
              .replace('{{2}}','<input class="ti2" id="i2_'+gid+'" autocomplete="off" spellcheck="false">');
  c.innerHTML='<div class="qt">'+h+qh+'</div>'+
   '<div class="fr"><button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const i1=c.querySelector('#i1_'+gid),i2=c.querySelector('#i2_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v1=norm(i1.value),v2=norm(i2.value);
   if(!v1||!v2){[i1,i2].forEach(x=>x.classList.add('no'));shake();
    setTimeout(()=>[i1,i2].forEach(x=>x.classList.remove('no')),460);return}
   done[gid]=true;answered++;
   const ok1=m.acc1.map(norm).indexOf(v1)>-1,ok2=m.acc2.map(norm).indexOf(v2)>-1,ok=ok1&&ok2;
   i1.disabled=true;i2.disabled=true;bt.disabled=true;
   i1.classList.add(ok1?'ok':'no');i2.classList.add(ok2?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();shake()}
   bump();
  };
  bt.onclick=go;[i1,i2].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr">'+(m.pre?'<span class="pre">'+m.pre+'</span>':'')+
   '<input class="ti" id="i_'+gid+'" placeholder="...gõ câu trả lời..." autocomplete="off" spellcheck="false">'+
   (m.suf&&m.suf!=='.'?'<span class="suf">'+m.suf+'</span>':'')+'</div>'+
   '<div class="fr"><button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');shake();setTimeout(()=>inp.classList.remove('no'),460);return}
   done[gid]=true;answered++;
   /* chấm linh hoạt: chấp nhận gõ phần còn thiếu HOẶC gõ lại cả câu (kèm phần đã cho sẵn) */
   const acc=m.accept.map(norm).concat(m.pre?m.accept.map(a=>norm(m.pre+' '+a)):[]);
   const ok=acc.indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();shake()}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🌟 THIÊN TÀI! '+nm+' xuất sắc tuyệt đối!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — tấm bưu thiếp điểm 10 gửi đi khắp thế giới! 🌍✈️';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi! Xem lại phần giải thích rồi luyện thêm nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn nhé! Đọc kỹ phần giải thích rồi làm lại bài nào!';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL+' câu đúng';
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
