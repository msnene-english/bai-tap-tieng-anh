<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài Tập Tiếng Anh - Ms. Chí Nên</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>

        :root {

            --primary-pink: #8854C0;

            --primary-teal: #00C9A7;

            --success: #00D26A;

            --error: #FF4757;

            --bg-pattern: #f0f4f8;

            --card-bg: #ffffff;

            --text-color: #2d3436;

        }



        body {

            font-family: 'Nunito', sans-serif;

            background-color: #E0EAFC;

            background-image: radial-gradient(#8854C0 0.8px, transparent 0.8px), radial-gradient(#00C9A7 0.8px, #E0EAFC 0.8px);

            background-size: 20px 20px;

            background-position: 0 0, 10px 10px;

            margin: 0;

            padding: 20px;

            color: var(--text-color);

        }



        /* --- Header --- */

        header {

            text-align: center;

            margin-bottom: 30px;

            background: white;

            padding: 15px;

            border-radius: 20px;

            box-shadow: 0 8px 0 rgba(0,0,0,0.1);

            max-width: 800px;

            margin-left: auto;

            margin-right: auto;

        }



        h1 {

            font-family: 'Quicksand', sans-serif;

            color: var(--primary-pink);

            font-size: 1.5rem;

            margin: 0;

            text-transform: uppercase;

            letter-spacing: 1px;

        }



        .teacher-tag {

            font-size: 0.9rem;

            color: #636e72;

            font-weight: 600;

        }



        /* --- Containers --- */

        .container {

            max-width: 800px;

            margin: 0 auto;

        }



        .section-title {

            background: var(--primary-pink);

            color: white;

            padding: 10px 20px;

            border-radius: 15px;

            display: inline-block;

            margin-bottom: 15px;

            margin-top: 30px;

            box-shadow: 0 4px 0 #5e3a8a;

            font-weight: 800;

        }



        .card {

            background: var(--card-bg);

            border-radius: 20px;

            padding: 20px;

            margin-bottom: 25px;

            box-shadow: 0 10px 20px rgba(0,0,0,0.05);

            border: 2px solid #f1f2f6;

            position: relative;

            transition: transform 0.2s;

        }



        .card:hover {

            transform: translateY(-2px);

        }



        .question-text {

            font-size: 1.2rem;

            font-weight: 700;

            margin-bottom: 15px;

            line-height: 1.6;

        }



        /* --- Buttons & Inputs --- */

        .options-grid {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }



        .btn-option {

            background: white;

            border: 2px solid #dfe6e9;

            border-radius: 15px;

            padding: 10px 15px;

            font-family: 'Nunito', sans-serif;

            font-weight: 700;

            font-size: 1rem;

            cursor: pointer;

            transition: all 0.2s;

            box-shadow: 0 4px 0 #dfe6e9;

            flex-grow: 1;

            text-align: center;

        }



        .btn-option:hover {

            transform: scale(1.05);

            border-color: var(--primary-teal);

        }



        .btn-option:active {

            transform: translateY(4px);

            box-shadow: none;

        }



        .btn-option.correct {

            background-color: var(--success);

            color: white;

            border-color: #00b85c;

            box-shadow: 0 4px 0 #00b85c;

        }



        .btn-option.wrong {

            background-color: var(--error);

            color: white;

            border-color: #d63031;

            box-shadow: 0 4px 0 #d63031;

            animation: shake 0.5s;

        }



        /* --- Gap Fill Styling --- */

        .gap-fill-text {

            line-height: 2.2;

            font-size: 1.1rem;

        }



        .gap-input {

            display: inline-block;

            min-width: 80px;

            padding: 5px 10px;

            border: 2px dashed var(--primary-pink);

            border-radius: 10px;

            background: #fff0f6;

            color: var(--primary-pink);

            font-weight: bold;

            text-align: center;

            cursor: pointer;

            margin: 0 5px;

            position: relative;

            top: 2px;

        }

        

        .gap-input.filled-correct {

            background: var(--success);

            color: white;

            border-style: solid;

        }

        

        .gap-input.filled-wrong {

            background: var(--error);

            color: white;

            border-style: solid;

            animation: shake 0.5s;

        }



        /* --- Explanation Box --- */

        .explanation-box {

            margin-top: 15px;

            background: #f1f2f6;

            border-left: 5px solid var(--primary-teal);

            padding: 15px;

            border-radius: 0 10px 10px 0;

            display: none; /* Hidden by default */

            animation: slideDown 0.3s ease-out;

        }



        .explanation-box.show {

            display: block;

        }



        .exp-header {

            font-weight: 800;

            color: var(--primary-teal);

            margin-bottom: 5px;

            display: flex;

            align-items: center;

            gap: 5px;

        }



        .exp-content p {

            margin: 5px 0;

            font-size: 0.95rem;

        }



        .exp-label {

            font-weight: 700;

            color: #636e72;

        }



        /* --- Modal for Gap Fill --- */

        .modal-overlay {

            position: fixed;

            top: 0; left: 0; right: 0; bottom: 0;

            background: rgba(0,0,0,0.5);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 1000;

            backdrop-filter: blur(3px);

        }



        .modal-content {

            background: white;

            padding: 25px;

            border-radius: 20px;

            width: 90%;

            max-width: 400px;

            box-shadow: 0 15px 30px rgba(0,0,0,0.2);

            text-align: center;

            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        }



        .modal-title {

            font-size: 1.2rem;

            color: var(--primary-pink);

            margin-bottom: 15px;

            font-weight: 800;

        }



        .modal-options {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }



        /* --- Animations --- */

        @keyframes shake {

            0% { transform: translateX(0); }

            25% { transform: translateX(-5px); }

            50% { transform: translateX(5px); }

            75% { transform: translateX(-5px); }

            100% { transform: translateX(0); }

        }



        @keyframes slideDown {

            from { opacity: 0; transform: translateY(-10px); }

            to { opacity: 1; transform: translateY(0); }

        }



        @keyframes popIn {

            from { transform: scale(0.5); opacity: 0; }

            to { transform: scale(1); opacity: 1; }

        }



        /* --- Footer & Score --- */

        .submit-btn {

            display: block;

            width: 100%;

            padding: 20px;

            background: var(--primary-pink);

            color: white;

            font-size: 1.5rem;

            font-weight: 800;

            border: none;

            border-radius: 20px;

            margin-top: 40px;

            margin-bottom: 60px;

            cursor: pointer;

            box-shadow: 0 8px 0 #5e3a8a;

            transition: transform 0.1s;

        }



        .submit-btn:active {

            transform: translateY(8px);

            box-shadow: none;

        }

        

        /* Phonetic specific */

        .phonetic u {

            text-decoration: none;

            border-bottom: 3px solid var(--primary-pink);

            padding-bottom: 2px;

        }



        /* Confetti Canvas */

        #confetti-canvas {

            position: fixed;

            top: 0; left: 0;

            width: 100%; height: 100%;

            pointer-events: none;

            z-index: 999;

        }



    </style>

</head>

<body>



    <header>

        <h1>Bài Tập Ngữ Pháp Tương Tác</h1>

        <div class="teacher-tag">Biên soạn bởi: Ms. Chí Nên</div>

    </header>



    <div class="container" id="quiz-container">

        </div>



    <div class="container">

        <button class="submit-btn" onclick="finishQuiz()">NỘP BÀI & XEM ĐIỂM</button>

    </div>



    <div class="modal-overlay" id="selectionModal">

        <div class="modal-content">

            <div class="modal-title">Chọn từ đúng</div>

            <div class="modal-options" id="modalOptionsContainer">

                </div>

        </div>

    </div>



    <canvas id="confetti-canvas"></canvas>



<script>

    // --- DỮ LIỆU ĐỀ BÀI VÀ GIẢI THÍCH CHI TIẾT ---

    const quizData = [

        {

            type: "part-title",

            title: "PHẦN 1: PAST CONTINUOUS VS PAST SIMPLE (TRẮC NGHIỆM)"

        },

        {

            id: 1,

            type: "choice",

            question: "I ________ my homework when you ________ me.",

            options: [

                "was doing / phoned",

                "did / were phoning",

                "were doing / was phoning",

                "did / phoned"

            ],

            correctIndex: 0,

            explanation: {

                trans: "Tôi đang làm bài tập về nhà thì bạn gọi điện.",

                whyCorrect: "Hành động 'làm bài tập' đang diễn ra (Past Continuous: was/were + V-ing) thì hành động 'gọi điện' xen vào (Past Simple: V2/ed). Chủ ngữ 'I' đi với 'was'.",

                whyWrong: "'did / were phoning' ngược trật tự. 'were doing' sai chủ ngữ 'I'. 'did / phoned' chỉ 2 hành động liên tiếp, không diễn tả sự xen ngang."

            }

        },

        {

            id: 2,

            type: "choice",

            question: "We ________ tennis when it ________ to rain.",

            options: [

                "played / was starting",

                "were playing / started",

                "was playing / were starting",

                "played / started"

            ],

            correctIndex: 1,

            explanation: {

                trans: "Chúng tôi đang chơi quần vợt thì trời bắt đầu mưa.",

                whyCorrect: "Hành động đang chơi (kéo dài) -> Past Cont (We were playing). Hành động mưa ập đến (ngắn, xen ngang) -> Past Simple (started).",

                whyWrong: "Cấu trúc chuẩn: Past Cont (đang xảy ra) + when + Past Simple (xen vào)."

            }

        },

        {

            id: 3,

            type: "choice",

            question: "When Bob ________ his car accident, he ________ at his mobile phone.",

            options: [

                "was having / looked",

                "had / was looking",

                "were having / were looking",

                "had / looked"

            ],

            correctIndex: 1,

            explanation: {

                trans: "Khi Bob gặp tai nạn ô tô, anh ấy đang nhìn vào điện thoại.",

                whyCorrect: "Hành động 'nhìn điện thoại' đang diễn ra (was looking) thì tai nạn xảy ra (had - hành động tức thời).",

                whyWrong: "'have an accident' thường là hành động dứt điểm (Past Simple), không dùng tiếp diễn cho nghĩa này trong ngữ cảnh này."

            }

        },

        {

            id: 4,

            type: "choice",

            question: "Emma ________ when she ________ her leg.",

            options: [

                "skied / was breaking",

                "were skiing / broke",

                "was skiing / broke",

                "was skiing / were breaking"

            ],

            correctIndex: 2,

            explanation: {

                trans: "Emma đang trượt tuyết thì cô ấy bị gãy chân.",

                whyCorrect: "Hành động trượt tuyết làm nền (was skiing) bị hành động gãy chân ngắt quãng (broke). Chủ ngữ Emma (số ít) dùng 'was'.",

                whyWrong: "'Break a leg' là hành động tức thì, không dùng tiếp diễn (was breaking). 'were skiing' sai vì Emma là số ít."

            }

        },

        {

            id: 5,

            type: "choice",

            question: "When I last ________ Bob’s children, they ________ in their garden.",

            options: [

                "saw / were playing",

                "was seeing / was playing",

                "were seeing / played",

                "saw / played"

            ],

            correctIndex: 0,

            explanation: {

                trans: "Lần cuối tôi nhìn thấy các con của Bob, chúng đang chơi trong vườn.",

                whyCorrect: "Động từ 'see' (nhìn thấy) là động từ chỉ tri giác, thường dùng Past Simple (saw). Lúc nhìn thấy thì bọn trẻ 'đang chơi' (were playing).",

                whyWrong: "Không dùng 'was seeing' với nghĩa 'nhìn thấy' (chỉ dùng khi nghĩa là gặp gỡ/hẹn hò). 'They' số nhiều đi với 'were'."

            }

        },

        {

            id: 6,

            type: "choice",

            question: "Mr Johnson ________ in the ocean when a shark ________ him.",

            options: [

                "swam / was attacking",

                "was swimming / attacked",

                "were swimming / were attacking",

                "swam / attacked"

            ],

            correctIndex: 1,

            explanation: {

                trans: "Ông Johnson đang bơi trên biển thì một con cá mập tấn công ông ấy.",

                whyCorrect: "Hành động bơi đang diễn ra (was swimming). Hành động tấn công xen vào bất ngờ (attacked).",

                whyWrong: "'attack' là hành động tức thời xen ngang."

            }

        },

        {

            id: 7,

            type: "choice",

            question: "My mobile phone ________ while I ________ a bath.",

            options: [

                "was ringing / had",

                "rang / was having",

                "were ringing / were having",

                "rang / had"

            ],

            correctIndex: 1,

            explanation: {

                trans: "Điện thoại của tôi reo trong khi tôi đang tắm.",

                whyCorrect: "Dùng 'While' cho hành động đang diễn ra (was having a bath). Hành động reo (rang) xen vào.",

                whyWrong: "'Ring' (reo) là hành động ngắn. 'Have a bath' là quá trình dài."

            }

        },

        {

            id: 8,

            type: "choice",

            question: "They ________ the street when the lights ________ red.",

            options: [

                "were crossing / turned",

                "was crossing / was turning",

                "crossed / were turning",

                "were crossing / was turning"

            ],

            correctIndex: 0,

            explanation: {

                trans: "Họ đang băng qua đường thì đèn chuyển sang màu đỏ.",

                whyCorrect: "Họ đang đi (were crossing - They số nhiều). Đèn chuyển màu (turned - dứt điểm).",

                whyWrong: "'Lights' số nhiều không dùng 'was'. Hành động chuyển màu đèn thường diễn ra nhanh (Simple)."

            }

        },

        {

            id: 9,

            type: "choice",

            question: "When my mother ________ in the room, my father ________ on his bed.",

            options: [

                "was coming / jumped",

                "came / was jumping",

                "were coming / were jumping",

                "came / jumped"

            ],

            correctIndex: 1,

            explanation: {

                trans: "Khi mẹ tôi bước vào phòng, bố tôi đang nhảy trên giường.",

                whyCorrect: "Mẹ bước vào (came - hành động ngắn). Bố đang nhảy (was jumping - hành động đang diễn ra).",

                whyWrong: "'Come' vào phòng là hành động cắt ngang khoảnh khắc đó."

            }

        },

        {

            id: 10,

            type: "choice",

            question: "I ________ my teacher in the street while I ________ shopping.",

            options: [

                "was meeting / did",

                "met / was doing",

                "were meeting / were doing",

                "met / did"

            ],

            correctIndex: 1,

            explanation: {

                trans: "Tôi gặp giáo viên trên phố trong khi tôi đang đi mua sắm.",

                whyCorrect: "'Gặp' là tình cờ, ngắn (met). 'Mua sắm' là quá trình đang diễn ra (was doing).",

                whyWrong: "'Meet' (gặp) hiếm khi dùng tiếp diễn trong ngữ cảnh này."

            }

        },



        // --- PART 2 ---

        {

            type: "part-title",

            title: "PHẦN 2: CHIA ĐỘNG TỪ (GAP FILL)"

        },

        {

            id: 11,

            type: "gap-fill",

            sentenceParts: ["Yoshi ", " (sit) in a café when Palm ", " (call)."],

            answers: ["was sitting", "called"],

            options: [

                ["sat", "was sitting", "were sitting"],

                ["was calling", "called", "call"]

            ],

            explanation: {

                trans: "Yoshi đang ngồi trong quán cà phê thì Palm gọi.",

                whyCorrect: "Vế 1: Đang ngồi (hành động dài) -> was sitting. Vế 2: Gọi (xen vào) -> called.",

                whyWrong: "'sat' là quá khứ đơn, không diễn tả trạng thái đang tiếp diễn lúc đó."

            }

        },

        {

            id: 12,

            type: "gap-fill",

            sentenceParts: ["When you ", " (arrive) at the party, who ", " (be) there?"],

            answers: ["arrived", "was"],

            options: [

                ["arrived", "was arriving"],

                ["was", "were", "was being"]

            ],

            explanation: {

                trans: "Khi bạn đến bữa tiệc, ai đã ở đó?",

                whyCorrect: "'Arrive' là hành động ngắn (đến nơi) -> arrived. Động từ 'to be' KHÔNG dùng ở tiếp diễn -> who was there.",

                whyWrong: "Không dùng 'was being' trừ khi nói về hành vi cư xử."

            }

        },

        {

            id: 13,

            type: "gap-fill",

            sentenceParts: ["Cash ", " (watch) a film when she ", " (hear) the noise."],

            answers: ["was watching", "heard"],

            options: [

                ["watched", "was watching"],

                ["heard", "was hearing"]

            ],

            explanation: {

                trans: "Cash đang xem phim thì cô ấy nghe thấy tiếng ồn.",

                whyCorrect: "Đang xem phim (was watching). Nghe thấy (heard - động từ tri giác không dùng tiếp diễn).",

                whyWrong: "'was hearing' là sai ngữ pháp với nghĩa 'nghe thấy'."

            }

        },

        {

            id: 14,

            type: "gap-fill",

            sentenceParts: ["We ", " (play) tennis when Aon ", " (hurt) his ankle."],

            answers: ["were playing", "hurt"],

            options: [

                ["played", "were playing"],

                ["hurt", "was hurting"]

            ],

            explanation: {

                trans: "Chúng tôi đang chơi tennis thì Aon bị đau mắt cá chân.",

                whyCorrect: "Đang chơi (were playing). Bị thương (hurt - xảy ra bất ngờ).",

                whyWrong: "'hurt' V2 vẫn là 'hurt'."

            }

        },

        {

            id: 15,

            type: "gap-fill",

            sentenceParts: ["When I ", " (walk) into the room, everyone ", " (work)."],

            answers: ["walked", "was working"],

            options: [

                ["walked", "was walking"],

                ["worked", "was working"]

            ],

            explanation: {

                trans: "Khi tôi bước vào phòng, mọi người đang làm việc.",

                whyCorrect: "Bước vào (walked - ngắn). Mọi người đang làm việc lúc đó (was working - Everyone là đại từ bất định số ít, nhưng nếu hiểu theo số đông có thể dùng 'were working' trong văn nói, tuy nhiên ngữ pháp chuẩn 'Everyone' đi với động từ số ít 'was'). *Lưu ý: Nếu đáp án chọn 'were working' cũng chấp nhận được trong văn cảnh không trang trọng, nhưng chuẩn nhất là 'was'. Ở đây hệ thống ưu tiên 'was working' hoặc 'were working' tùy theo đáp án bạn chọn, tôi sẽ cài 'was working'.*",

                // Điều chỉnh: Everyone đi với số ít (was).

                whyWrong: "Hành động làm việc đang diễn ra khi tôi bước vào."

            }

        },

        {

            id: 16,

            type: "gap-fill",

            sentenceParts: ["Aimee ", " (take) a shower when the phone ", " (ring)."],

            answers: ["was taking", "rang"],

            options: [

                ["took", "was taking"],

                ["rang", "was ringing"]

            ],

            explanation: {

                trans: "Aimee đang tắm thì điện thoại reo.",

                whyCorrect: "Đang tắm (was taking). Reo (rang).",

                whyWrong: "Cấu trúc kinh điển: Past Cont + When + Past Simple."

            }

        },

        {

            id: 17,

            type: "gap-fill",

            sentenceParts: ["He ", " (live) in Bangkok when he ", " (meet) his wife."],

            answers: ["was living", "met"],

            options: [

                ["lived", "was living"],

                ["met", "was meeting"]

            ],

            explanation: {

                trans: "Anh ấy đang sống ở Bangkok thì gặp vợ mình.",

                whyCorrect: "Sống ở đâu (trong khoảng thời gian đó) dùng tiếp diễn để nhấn mạnh bối cảnh (was living). Gặp (met).",

                whyWrong: "'lived' cũng đúng nhưng 'was living' nhấn mạnh tính thời điểm hơn."

            }

        },

        {

            id: 18,

            type: "gap-fill",

            sentenceParts: ["When I ", " (leave) the house, it ", " (snow)."],

            answers: ["left", "was snowing"],

            options: [

                ["left", "was leaving"],

                ["snowed", "was snowing"]

            ],

            explanation: {

                trans: "Khi tôi rời khỏi nhà, trời đang có tuyết rơi.",

                whyCorrect: "Rời nhà (left - xong rồi). Trời đang mưa tuyết (was snowing - bối cảnh).",

                whyWrong: "Tuyết rơi là nền cảnh cho hành động rời nhà."

            }

        },

        {

            id: 19,

            type: "gap-fill",

            sentenceParts: ["What ", " (you/do) when I ", " (call) you last night?"],

            answers: ["were you doing", "called"],

            options: [

                ["did you do", "were you doing"],

                ["called", "was calling"]

            ],

            explanation: {

                trans: "Bạn đang làm gì khi tôi gọi bạn tối qua?",

                whyCorrect: "Hỏi về hành động đang diễn ra tại 1 thời điểm cụ thể -> Were you doing. Gọi -> called.",

                whyWrong: "Did you do hỏi về hành động đã hoàn tất."

            }

        },

        {

            id: 20,

            type: "gap-fill",

            sentenceParts: ["When the train ", " (get) to the station, we ", " (wait) on the platform."],

    // --- LOGIC TRÒ CHƠI ---

    let score = 0;

    const totalQuestions = quizData.filter(q => q.type !== 'part-title').length; // Estimate logic needs refinement for gap fill

    

    // Helper: Tính tổng điểm max (mỗi gap tính là 1 điểm, mỗi câu choice tính 1 điểm)

    let maxScore = 0;

    quizData.forEach(q => {

        if(q.type === 'choice') maxScore++;

        if(q.type === 'gap-fill') maxScore += q.answers.length;

    });



    const quizContainer = document.getElementById('quiz-container');



    // --- SOUNDS (Base64 để chạy Single File) ---

    // Short beep for Correct

    const sndCorrect = new Audio("data:audio/wav;base64,UklGRi4AAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="); // Placeholder, using SpeechSynthesis better for interactions or simple logic.

    // Actually, let's use a real trick: AudioContext Oscillator for pure code sounds.

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();



    function playSound(type) {

        if (audioCtx.state === 'suspended') audioCtx.resume();

        const oscillator = audioCtx.createOscillator();

        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);

        gainNode.connect(audioCtx.destination);



        if (type === 'correct') {

            // Ding: High pitch, fading

            oscillator.type = 'sine';

            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);

            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            oscillator.start();

            oscillator.stop(audioCtx.currentTime + 0.5);

        } else {

            // Buzz: Sawtooth, low pitch

            oscillator.type = 'sawtooth';

            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);

            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            oscillator.start();

            oscillator.stop(audioCtx.currentTime + 0.3);

        }

    }



    function playConfetti() {

        const canvas = document.getElementById('confetti-canvas');

        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;

        canvas.height = window.innerHeight;



        const pieces = [];

        const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD700'];



        for(let i=0; i<100; i++) {

            pieces.push({

                x: Math.random() * canvas.width,

                y: Math.random() * canvas.height - canvas.height,

                w: 10 + Math.random() * 10,

                h: 5 + Math.random() * 5,

                color: colors[Math.floor(Math.random() * colors.length)],

                speed: 2 + Math.random() * 3,

                angle: Math.random() * 6.2

            });

        }



        function draw() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let active = false;

            pieces.forEach(p => {

                p.y += p.speed;

                p.angle += 0.1;

                ctx.save();

                ctx.translate(p.x, p.y);

                ctx.rotate(p.angle);

                ctx.fillStyle = p.color;

                ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);

                ctx.restore();

                if(p.y < canvas.height) active = true;

            });

            if(active) requestAnimationFrame(draw);

            else ctx.clearRect(0,0, canvas.width, canvas.height);

        }

        draw();

    }



    // --- RENDER QUIZ ---

    function renderQuiz() {

        quizData.forEach((item, index) => {

            if (item.type === 'part-title') {

                const title = document.createElement('div');

                title.style.textAlign = 'center';

                title.innerHTML = `<div class="section-title">${item.title}</div>`;

                quizContainer.appendChild(title);

                return;

            }



            const card = document.createElement('div');

            card.className = 'card';

            card.id = `q-card-${item.id}`;



            // Explanation Block (Prepared)

            const explanationHTML = `

                <div class="explanation-box" id="exp-${item.id}">

                    <div class="exp-header">

                        <span>👩‍🏫 Ms. Chí Nên giải thích:</span>

                    </div>

                    <div class="exp-content">

                        <p><span class="exp-label">Dịch:</span> ${item.explanation.trans}</p>

                        <p><span class="exp-label" style="color:var(--success)">Tại sao ĐÚNG:</span> ${item.explanation.whyCorrect}</p>

                        <p><span class="exp-label" style="color:var(--error)">Tại sao SAI:</span> ${item.explanation.whyWrong}</p>

                    </div>

                </div>

            `;



            if (item.type === 'choice') {

                let optionsHTML = '';

                item.options.forEach((opt, idx) => {

                    optionsHTML += `<div class="btn-option" onclick="checkChoice(${item.id}, ${idx}, ${item.correctIndex}, this)">${opt}</div>`;

                });



                card.innerHTML = `

                    <div class="question-text"><strong>Q${item.id}:</strong> ${item.question.replace('________', '<u>.....</u>').replace('________', '<u>.....</u>')}</div>

                    <div class="options-grid">${optionsHTML}</div>

                    ${explanationHTML}

                `;

            } else if (item.type === 'gap-fill') {

                let sentenceHTML = `<div class="question-text gap-fill-text"><strong>Q${item.id}:</strong> `;

                

                item.sentenceParts.forEach((part, idx) => {

                    sentenceHTML += part;

                    if (idx < item.answers.length) {

                        sentenceHTML += `<span class="gap-input" id="gap-${item.id}-${idx}" onclick="openGapModal(${item.id}, ${idx})">?</span>`;

                    }

                });

                sentenceHTML += `</div>`;



                card.innerHTML = `

                    ${sentenceHTML}

                    ${explanationHTML}

                `;

            }



            quizContainer.appendChild(card);

        });

    }



    // --- LOGIC CHECKING ---



    // 1. Multiple Choice Logic

    window.checkChoice = function(qId, selectedIdx, correctIdx, btnElement) {

        const card = document.getElementById(`q-card-${qId}`);

        // Disable all buttons in this card

        const buttons = card.querySelectorAll('.btn-option');

        if(card.getAttribute('data-answered') === 'true') return; // Prevent re-answering

        card.setAttribute('data-answered', 'true');



        if (selectedIdx === correctIdx) {

            btnElement.classList.add('correct');

            playSound('correct');

            playConfetti();

            score++;

        } else {

            btnElement.classList.add('wrong');

            playSound('wrong');

            // Highlight correct one

            buttons[correctIdx].classList.add('correct');

        }



        // Show Explanation

        document.getElementById(`exp-${qId}`).classList.add('show');

    };



    // 2. Gap Fill Modal Logic

    let currentGap = { qId: null, gapIdx: null };



    window.openGapModal = function(qId, gapIdx) {

        const gapEl = document.getElementById(`gap-${qId}-${gapIdx}`);

        if(gapEl.classList.contains('filled-correct') || gapEl.classList.contains('filled-wrong')) return;



        currentGap = { qId, gapIdx };

        const qData = quizData.find(q => q.id === qId);

        const options = qData.options[gapIdx]; // Array of words for this specific gap



        const modalOpts = document.getElementById('modalOptionsContainer');

        modalOpts.innerHTML = '';

        

        options.forEach(opt => {

            const btn = document.createElement('div');

            btn.className = 'btn-option';

            btn.innerText = opt;

            btn.onclick = () => selectGapAnswer(opt);

            modalOpts.appendChild(btn);

        });



        document.getElementById('selectionModal').style.display = 'flex';

    };



    window.selectGapAnswer = function(selectedWord) {

        document.getElementById('selectionModal').style.display = 'none';

        const { qId, gapIdx } = currentGap;

        const qData = quizData.find(q => q.id === qId);

        const correctWord = qData.answers[gapIdx];

        const gapEl = document.getElementById(`gap-${qId}-${gapIdx}`);



        gapEl.innerText = selectedWord;



        if (selectedWord.toLowerCase() === correctWord.toLowerCase()) {

            gapEl.classList.add('filled-correct');

            playSound('correct');

            score++;

            playConfetti();

        } else {

            gapEl.classList.add('filled-wrong');

            playSound('wrong');

            // Append correct answer text small

            gapEl.innerHTML = `<strike>${selectedWord}</strike> <br><span style="font-size:0.8em">${correctWord}</span>`;

        }



        // Check if all gaps in this sentence are filled to show explanation

        let allFilled = true;

        for(let i=0; i<qData.answers.length; i++) {

            const g = document.getElementById(`gap-${qId}-${i}`);

            if(!g.classList.contains('filled-correct') && !g.classList.contains('filled-wrong')) {

                allFilled = false;

            }

        }



        if(allFilled) {

            document.getElementById(`exp-${qId}`).classList.add('show');

        }

    };



    // Close modal if clicking outside

    document.getElementById('selectionModal').onclick = function(e) {

        if(e.target === this) this.style.display = 'none';

    }



    // --- FINISH ---

    window.finishQuiz = function() {

        let percent = Math.round((score / maxScore) * 100);

        let msg = "";

        if(percent === 100) msg = "Xuất sắc! Bạn là thiên tài ngữ pháp! 🌟";

        else if(percent >= 80) msg = "Rất tốt! Ms. Chí Nên tự hào về bạn! 🎉";

        else if(percent >= 50) msg = "Cố gắng lên! Ôn lại bài một chút là ổn. 💪";

        else msg = "Đừng buồn nhé, làm lại để giỏi hơn nào! 📚";



        alert(`TỔNG KẾT:\n\nĐiểm của bạn: ${score} / ${maxScore}\n(${percent}%)\n\n${msg}`);

    };



    // Initialize

    renderQuiz();
