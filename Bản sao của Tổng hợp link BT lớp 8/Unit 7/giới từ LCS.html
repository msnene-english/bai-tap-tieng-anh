<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8: Prepositions (Giới từ) - Môi trường | Ms. Chí Nên</title>
    <!-- Google Fonts: Nunito & Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #8854C0; /* Tím Pastel */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --bg-pattern: #f3f4f6;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E0E7FF;
            background-image: radial-gradient(#8854C0 0.5px, transparent 0.5px), radial-gradient(#8854C0 0.5px, #E0E7FF 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #2d3748;
            overflow-x: hidden;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            margin-bottom: 2rem;
            border: 2px solid #e2e8f0;
        }

        .question-text {
            font-family: 'Quicksand', sans-serif;
            color: #2d3748;
        }

        /* 3D Button Styles */
        .option-btn {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-bottom-width: 6px;
            border-radius: 15px;
            transition: all 0.1s;
            position: relative;
            font-weight: 700;
            color: #475569;
        }

        .option-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background-color: #f1f5f9;
        }

        /* Correct State */
        .option-btn.correct {
            background-color: var(--correct);
            border-color: #00a653;
            color: white;
            border-bottom-width: 6px;
        }
        
        /* Wrong State */
        .option-btn.wrong {
            background-color: var(--wrong);
            border-color: #d6303e;
            color: white;
            border-bottom-width: 6px;
            animation: shake 0.5s;
        }

        /* Explanations */
        .explanation-box {
            background-color: #F0FDF4; /* Xanh lá nhạt */
            border-left: 5px solid var(--secondary);
            border-radius: 0 12px 12px 0;
            animation: slideDown 0.4s ease-out;
            display: none; /* Hidden by default */
        }

        .explanation-box.visible {
            display: block;
        }

        .vocab-tag {
            background: #EDE9FE;
            color: #8854C0;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 700;
            margin-right: 5px;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Modal */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
        }
        
        .modal-content {
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        u {
            text-decoration: none;
            border-bottom: 3px solid #8854C0;
            padding-bottom: 1px;
        }
    </style>
</head>
<body class="pb-20">

                    MA

    <script>
        // --- DATA SOURCE ---
        const quizData = [
            {
                "questionNumber": 1,
                "question": "Coal power stations release sulfur dioxide ________________ the atmosphere.",
                "answerOptions": [
                    { "text": "into", "isCorrect": true },
                    { "text": "on", "isCorrect": false },
                    { "text": "at", "isCorrect": false },
                    { "text": "of", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Các nhà máy điện dùng than thải khí lưu huỳnh đioxit vào bầu khí quyển.",
                    "analysis": "<b>A. into:</b> vào trong (chỉ sự di chuyển)<br><b>B. on:</b> trên<br><b>C. at:</b> tại<br><b>D. of:</b> của",
                    "reason": "Cấu trúc <b>release sth into sth</b>: thải chất gì vào đâu. Ở đây chỉ sự di chuyển của khí thải 'vào bên trong' bầu khí quyển.",
                    "wrong": "Các giới từ 'on', 'at', 'of' không kết hợp với 'release' để chỉ hành động xả thải vào không khí."
                }
            },
            {
                "questionNumber": 2,
                "question": "National parks play a key role ________________ saving the environment.",
                "answerOptions": [
                    { "text": "in", "isCorrect": true },
                    { "text": "on", "isCorrect": false },
                    { "text": "for", "isCorrect": false },
                    { "text": "at", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Các vườn quốc gia đóng vai trò then chốt trong việc bảo vệ môi trường.",
                    "analysis": "<b>A. in:</b> trong<br><b>B. on:</b> trên<br><b>C. for:</b> cho<br><b>D. at:</b> tại",
                    "reason": "Collocation (Cụm từ cố định): <b>play a role in + V-ing/Noun</b> = đóng vai trò trong việc gì.",
                    "wrong": "Các giới từ khác không đi với cụm 'play a role' theo nghĩa này."
                }
            },
            {
                "questionNumber": 3,
                "question": "What type of effect does water pollution have ________________ our life?",
                "answerOptions": [
                    { "text": "in", "isCorrect": false },
                    { "text": "at", "isCorrect": false },
                    { "text": "on", "isCorrect": true },
                    { "text": "with", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Ô nhiễm nước có ảnh hưởng như thế nào lên cuộc sống của chúng ta?",
                    "analysis": "<b>A. in:</b> trong<br><b>B. at:</b> tại<br><b>C. on:</b> trên/lên<br><b>D. with:</b> với",
                    "reason": "Cấu trúc: <b>have an effect/impact/influence ON sth/sb</b> (có ảnh hưởng lên cái gì/ai).",
                    "wrong": "Không dùng 'effect in', 'effect at' hay 'effect with' trong cấu trúc chỉ sự tác động này."
                }
            },
            {
                "questionNumber": 4,
                "question": "Forests provide a habitat ________________ hundreds of species ________________ plants and animals.",
                "answerOptions": [
                    { "text": "for / of", "isCorrect": true },
                    { "text": "to / in", "isCorrect": false },
                    { "text": "with / on", "isCorrect": false },
                    { "text": "of / for", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Rừng cung cấp môi trường sống cho hàng trăm loài thực vật và động vật.",
                    "analysis": "<b>A. for / of:</b> cho / của<br><b>B. to / in:</b> tới / trong<br><b>C. with / on:</b> với / trên<br><b>D. of / for:</b> của / cho",
                    "reason": "1. <b>habitat FOR</b>: môi trường sống CHO ai/con gì.<br>2. <b>species OF</b>: loài CỦA (loài gì).",
                    "wrong": "Các cặp giới từ khác ghép vào không đúng ngữ pháp và ý nghĩa của câu."
                }
            },
            {
                "questionNumber": 5,
                "question": "Technology is already playing a key role ________________ environmental protection.",
                "answerOptions": [
                    { "text": "on", "isCorrect": false },
                    { "text": "in", "isCorrect": true },
                    { "text": "at", "isCorrect": false },
                    { "text": "for", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Công nghệ đang đóng một vai trò then chốt trong việc bảo vệ môi trường.",
                    "analysis": "<b>A. on:</b> trên<br><b>B. in:</b> trong<br><b>C. at:</b> tại<br><b>D. for:</b> cho",
                    "reason": "Lặp lại cấu trúc câu 2: <b>play a role IN sth</b> (đóng vai trò trong việc gì).",
                    "wrong": "Sai collocation."
                }
            },
            {
                "questionNumber": 6,
                "question": "There is a nice play area ________________ the children.",
                "answerOptions": [
                    { "text": "to", "isCorrect": false },
                    { "text": "with", "isCorrect": false },
                    { "text": "of", "isCorrect": false },
                    { "text": "for", "isCorrect": true }
                ],
                "explanation": {
                    "translate": "Có một khu vui chơi đẹp dành cho trẻ em.",
                    "analysis": "<b>A. to:</b> tới<br><b>B. with:</b> với<br><b>C. of:</b> của<br><b>D. for:</b> cho, dành cho",
                    "reason": "Dùng giới từ <b>FOR</b> để chỉ mục đích hoặc đối tượng thụ hưởng (area FOR children = khu vực DÀNH CHO trẻ em).",
                    "wrong": "'Of' chỉ sở hữu, 'to' chỉ hướng, 'with' chỉ sự đồng hành, không hợp lý ở đây."
                }
            },
            {
                "questionNumber": 7,
                "question": "The regions are home ________________ bears and mountain lions.",
                "answerOptions": [
                    { "text": "for", "isCorrect": false },
                    { "text": "to", "isCorrect": true },
                    { "text": "with", "isCorrect": false },
                    { "text": "of", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Những vùng này là nơi sinh sống (nhà) của gấu và sư tử núi.",
                    "analysis": "<b>A. for:</b> cho<br><b>B. to:</b> tới<br><b>C. with:</b> với<br><b>D. of:</b> của",
                    "reason": "Thành ngữ (Idiom): <b>be home TO sth</b> = là nơi cư trú/sinh sống của loài nào.",
                    "wrong": "Nhiều bạn hay nhầm là 'home of', nhưng cụm cố định chính xác phải là 'home TO'."
                }
            },
            {
                "questionNumber": 8,
                "question": "I'd like to emphasize the importance ________________ protecting endangered species.",

                    { "text": "of", "isCorrect": true },
                    { "text": "in", "isCorrect": false },
                    { "text": "on", "isCorrect": false },
                    { "text": "with", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Tôi muốn nhấn mạnh tầm quan trọng của việc bảo vệ các loài có nguy cơ tuyệt chủng.",
                    "analysis": "<b>A. of:</b> của<br><b>B. in:</b> trong<br><b>C. on:</b> trên<br><b>D. with:</b> với",
                    "reason": "Danh từ <b>Importance</b> thường đi với giới từ <b>OF</b> (The importance OF sth/V-ing).",
                    "wrong": "Các giới từ khác không đi sau danh từ 'importance' để chỉ nội dung của sự quan trọng."
                }
            },
            {
                "questionNumber": 9,
                "question": "Avoid dumping waste ________________ lakes and rivers!",
                "answerOptions": [
                    { "text": "on", "isCorrect": false },
                    { "text": "into", "isCorrect": true },
                    { "text": "at", "isCorrect": false },
                    { "text": "of", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Tránh đổ rác thải vào hồ và sông!",
                    "analysis": "<b>A. on:</b> trên bề mặt<br><b>B. into:</b> vào bên trong<br><b>C. at:</b> tại<br><b>D. of:</b> của",
                    "reason": "Động từ <b>dump (đổ/xả)</b> kết hợp với <b>INTO</b> để chỉ hành động đưa rác thải vào bên trong nguồn nước.",
                    "wrong": "'On' chỉ là để lên trên bề mặt, trong khi xả thải thường hòa tan hoặc chìm vào trong nước (into)."
                }
            },
            {
                "questionNumber": 10,
                "question": "Remember to turn ________________ devices when you are not using them.",

                    { "text": "on", "isCorrect": false },
                    { "text": "off", "isCorrect": true },
                    { "text": "up", "isCorrect": false },
                    { "text": "down", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Nhớ tắt các thiết bị khi bạn không sử dụng chúng.",
                    "analysis": "<b>A. turn on:</b> bật<br><b>B. turn off:</b> tắt<br><b>C. turn up:</b> vặn to<br><b>D. turn down:</b> vặn nhỏ",
                    "reason": "Dựa vào ngữ cảnh <b>'not using them'</b> (không dùng) -> phải <b>turn OFF</b> (tắt).",
                    "wrong": "Turn on (bật) sai nghĩa. Turn up/down thường dùng cho âm lượng/nhiệt độ."

            },
            {
                "questionNumber": 11,
                "question": "Toxic chemicals continue to be dumped ________________ the river.",

                    { "text": "into", "isCorrect": true },

                    { "text": "from", "isCorrect": false },
                    { "text": "over", "isCorrect": false }

                "explanation": {

                    "reason": "Tương tự câu 9, <b>dumped INTO</b> the river (đổ vào sông).",
                    "wrong": "Các giới từ khác không diễn tả đúng hướng di chuyển của chất thải vào lòng sông."
                }
            },
            {
                "questionNumber": 12,
                "question": "Orange juice is rich ________________ vitamin C.",

                    { "text": "at", "isCorrect": false },

                "explanation": {

            {
                "questionNumber": 13,
                "question": "The pools provide a rich habitat ________________ water plants.",

            {

            {
                "questionNumber": 16,

                "answerOptions": [
                    { "text": "of", "isCorrect": true },
                    { "text": "about", "isCorrect": false },
                    { "text": "with", "isCorrect": false },
                    { "text": "for", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Mọi người đang ngày càng nhận thức rõ hơn về các vấn đề môi trường.",
                    "analysis": "<b>A. of:</b> về<br><b>B. about:</b> về<br><b>C. with:</b> với<br><b>D. for:</b> cho",
                    "reason": "Tính từ <b>Aware</b> luôn đi với giới từ <b>OF</b> (be aware of sth = nhận thức về cái gì).",
                    "wrong": "Mặc dù 'about' cũng có nghĩa là 'về', nhưng cấu trúc chuẩn phải là 'aware OF'."
                }
            },
            {
                "questionNumber": 17,
                "question": "The new road will cause a loss ________________ the beauty of the landscape.",
                "answerOptions": [
                    { "text": "of", "isCorrect": true },
                    { "text": "in", "isCorrect": false },
                    { "text": "for", "isCorrect": false },
                    { "text": "to", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Con đường mới sẽ gây ra sự mất mát vẻ đẹp của cảnh quan.",
                    "analysis": "<b>A. of:</b> của<br><b>B. in:</b> trong<br><b>C. for:</b> cho<br><b>D. to:</b> tới",
                    "reason": "Danh từ <b>Loss</b> đi với <b>OF</b> (A loss OF something = sự mất mát cái gì).",
                    "wrong": "Sai giới từ đi kèm danh từ."
                }
            },
            {
                "questionNumber": 18,
                "question": "Endangered animals in the wild are facing a high risk ________________ extinction.",
                "answerOptions": [
                    { "text": "of", "isCorrect": true },
                    { "text": "with", "isCorrect": false },
                    { "text": "at", "isCorrect": false },
                    { "text": "in", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Các loài động vật nguy cấp trong tự nhiên đang đối mặt với nguy cơ tuyệt chủng cao.",
                    "analysis": "<b>A. of:</b> của<br><b>B. with:</b> với<br><b>C. at:</b> tại<br><b>D. in:</b> trong",
                    "reason": "Cụm danh từ: <b>Risk OF something/V-ing</b> = Nguy cơ bị làm sao.",
                    "wrong": "Risk with/at/in không dùng trong ngữ cảnh chỉ nguy cơ của một kết quả tiêu cực."
                }
            },
            {
                "questionNumber": 19,
                "question": "After cleaning ________________ everything ________________ the campsite, we left.",
                "answerOptions": [
                    { "text": "up / at", "isCorrect": true },
                    { "text": "out / in", "isCorrect": false },
                    { "text": "on / on", "isCorrect": false },
                    { "text": "off / to", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Sau khi dọn dẹp sạch sẽ mọi thứ tại khu cắm trại, chúng tôi rời đi.",
                    "analysis": "<b>A. up / at:</b> dọn sạch / tại<br><b>B. out / in:</b> dọn ra / trong<br><b>...</b>",
                    "reason": "1. <b>Clean UP</b>: dọn dẹp sạch sẽ hoàn toàn.<br>2. <b>AT the campsite</b>: tại địa điểm cắm trại (dùng At cho địa điểm cụ thể/nhỏ).",
                    "wrong": "Clean out thường là dọn sạch bên trong cái gì đó (ngăn kéo), Clean on/off không phổ biến. Campsite dùng At chuẩn hơn In."
                }
            },
            {
                "questionNumber": 20,
                "question": "We shouldn't cut ________________ too many trees.",
                "answerOptions": [
                    { "text": "down", "isCorrect": true },
                    { "text": "off", "isCorrect": false },
                    { "text": "up", "isCorrect": false },
                    { "text": "away", "isCorrect": false }
                ],
                "explanation": {
                    "translate": "Chúng ta không nên chặt hạ quá nhiều cây xanh.",
                    "analysis": "<b>A. cut down:</b> chặt hạ, đốn ngã<br><b>B. cut off:</b> cắt lìa, ngắt (điện/nước)<br><b>C. cut up:</b> cắt nhỏ ra<br><b>D. cut away:</b> cắt bỏ phần thừa",
                    "reason": "Cụm động từ <b>Cut DOWN</b> chuyên dùng cho hành động đốn hạ cây cối.",
                    "wrong": "Cut off thường dùng cho cắt đứt liên lạc/nguồn cung cấp; Cut up là thái nhỏ."
                }
            }
        ];

        let score = 0;
        let answeredCount = 0;

        // --- AUDIO SYSTEM (No external files) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // High pitch Ding
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Low pitch Buzz
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- RENDER LOGIC ---
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card p-6 md:p-8 relative';
                card.id = `question-${index}`;

                // Header of the card
                const headerHtml = `
                    <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                        <span class="bg-purple-100 text-purple-700 font-bold px-4 py-1 rounded-full text-sm">Question ${item.questionNumber}</span>
                        <i class="fa-solid fa-leaf text-green-400 text-xl"></i>
                    </div>
                `;

                // Question Text
                const questionHtml = `
                    <h3 class="question-text text-xl md:text-2xl font-bold mb-8 leading-relaxed">${item.question}</h3>
                `;

                // Options Grid
                let optionsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">`;
                item.answerOptions.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <button onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect})" 
                                class="option-btn w-full p-4 text-left text-lg flex items-center group" 
                                id="btn-${index}-${optIndex}">
                            <div class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center mr-3 group-hover:border-purple-400 bg-white font-bold text-gray-400 group-hover:text-purple-500 transition-colors">
                                ${String.fromCharCode(65 + optIndex)}
                            </div>
                            <span>${opt.text}</span>
                        </button>
                    `;
                });
                optionsHtml += `</div>`;

                // Explanation Box (Hidden initially)
                const explanationHtml = `
                    <div id="explain-${index}" class="explanation-box p-6 mt-4">
                        <div class="flex items-center gap-2 mb-3">
                            <i class="fa-solid fa-chalkboard-user text-purple-600 text-xl"></i>
                            <h4 class="font-bold text-purple-700">Giải thích của Ms. Chí Nên:</h4>
                        </div>
                        
                        <div class="space-y-3 text-gray-700">
                            <!-- Translation -->
                            <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                                <span class="vocab-tag"><i class="fa-solid fa-language"></i> Dịch câu</span>
                                <p class="italic mt-1 text-gray-800">"${item.explanation.translate}"</p>
                            </div>

                            <!-- Analysis -->
                            <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                                <span class="vocab-tag"><i class="fa-solid fa-magnifying-glass"></i> Phân tích đáp án</span>
                                <div class="mt-2 text-sm md:text-base pl-2 border-l-2 border-purple-200">
                                    ${item.explanation.analysis}
                                </div>
                            </div>

                            <!-- Reasoning -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div class="bg-green-50 p-3 rounded-lg border border-green-200">
                                    <span class="text-green-700 font-bold text-sm block mb-1"><i class="fa-solid fa-check-circle"></i> Tại sao ĐÚNG?</span>
                                    <p class="text-sm">${item.explanation.reason}</p>
                                </div>
                                <div class="bg-red-50 p-3 rounded-lg border border-red-200">
                                    <span class="text-red-700 font-bold text-sm block mb-1"><i class="fa-solid fa-times-circle"></i> Tại sao SAI?</span>
                                    <p class="text-sm">${item.explanation.wrong}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                card.innerHTML = headerHtml + questionHtml + optionsHtml + explanationHtml;
                container.appendChild(card);
            });
        }

        // --- CHECK ANSWER LOGIC ---
        function checkAnswer(questionIndex, optIndex, isCorrect) {
            const card = document.getElementById(`question-${questionIndex}`);
            // Prevent re-answering
            if (card.classList.contains('answered')) return;
            card.classList.add('answered');
            answeredCount++;

            const selectedBtn = document.getElementById(`btn-${questionIndex}-${optIndex}`);
            const explainBox = document.getElementById(`explain-${questionIndex}`);

            // Disable all buttons in this card
            const allBtns = card.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            });
            selectedBtn.classList.remove('opacity-70');

            if (isCorrect) {
                // Correct Logic
                selectedBtn.classList.add('correct');
                // Replace A/B/C/D with Checkmark
                selectedBtn.querySelector('div').innerHTML = '<i class="fa-solid fa-check text-green-600"></i>';
                selectedBtn.querySelector('div').classList.add('border-green-500');
                
                playSound('correct');
                score++;
                document.getElementById('current-score').innerText = score;
                document.getElementById('current-score').classList.add('scale-125');
                setTimeout(() => document.getElementById('current-score').classList.remove('scale-125'), 200);

                // Mini Confetti for correct answer
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.7 },
                    colors: ['#00D26A', '#8854C0']
                });

            } else {
                // Wrong Logic
                selectedBtn.classList.add('wrong');
                selectedBtn.querySelector('div').innerHTML = '<i class="fa-solid fa-xmark text-red-600"></i>';
                selectedBtn.querySelector('div').classList.add('border-red-500');
                playSound('wrong');

                // Highlight the correct one
                const correctOptionIndex = quizData[questionIndex].answerOptions.findIndex(o => o.isCorrect);
                const correctBtn = document.getElementById(`btn-${questionIndex}-${correctOptionIndex}`);
                correctBtn.classList.add('correct', 'ring-2', 'ring-green-400', 'ring-offset-2');
                correctBtn.classList.remove('opacity-70');
            }

            // Show Explanation immediately
            explainBox.classList.add('visible');
            
            // Auto scroll slightly if needed
            explainBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // --- SUBMIT & RESULTS ---
        function submitQuiz() {
            if (answeredCount < quizData.length) {
                const confirmSubmit = confirm(`Bạn mới làm ${answeredCount}/${quizData.length} câu. Bạn có chắc muốn nộp bài không?`);
                if (!confirmSubmit) return;
            }

            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('final-score');
            const message = document.getElementById('modal-message');

            scoreDisplay.innerText = `${score} / ${quizData.length}`;
            
            // Percentage
            const percentage = (score / quizData.length) * 100;
            
            if (percentage === 100) {
                message.innerText = "Tuyệt vời! Bạn là thiên tài ngữ pháp! 🌟";
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
                playSound('correct');
            } else if (percentage >= 80) {
                message.innerText = "Giỏi lắm! Chỉ sai một chút xíu thôi! 💪";
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                playSound('correct');
            } else if (percentage >= 50) {
                message.innerText = "Khá tốt! Hãy xem lại phần giải thích để hiểu rõ hơn nhé! 📚";
                playSound('correct');
            } else {
                message.innerText = "Đừng buồn! Hãy ôn lại bài và thử lại nhé! 🔥";
                playSound('wrong');
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
        }

        // Initialize
        renderQuiz();

    </script>
</body>
</html>
