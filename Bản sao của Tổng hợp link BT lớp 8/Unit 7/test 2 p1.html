<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--sea:#06AED5;--sea2:#0C7C92;--coral:#FF6F59;--sand:#FFE7B3;--palm:#2E933C;--sun:#FFD166;
  --ink:#0E3B43;--good:#1E8449;--bad:#E4572E;--paper:#FFFCF4}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;position:relative;
  background:linear-gradient(180deg,#8FE3F0 0%,#BFEFE0 40%,var(--sand) 100%)}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(circle at 88% 6%,rgba(255,209,102,.9) 0 60px,transparent 62px)}
.wave{position:fixed;left:0;right:0;bottom:0;height:90px;z-index:-1;pointer-events:none}
.wave svg{width:100%;height:100%}
.drift{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.drift span{position:absolute;font-size:26px;opacity:.28;animation:fl linear infinite}
@keyframes fl{0%{transform:translateY(110vh) rotate(-8deg)}100%{transform:translateY(-15vh) rotate(10deg)}}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:24px 16px 90px}
/* ── HEADER ── */
.pc{background:var(--paper);border-radius:22px;padding:22px 22px 18px;position:relative;

.stamp{position:absolute;top:16px;right:18px;width:76px;height:92px;background:#fff;border-radius:8px;

.pc h1{font-family:'Pacifico',cursive;font-size:clamp(26px,5.6vw,42px);color:var(--coral);line-height:1.15;

.tr{flex:1;height:10px;background:rgba(6,174,213,.15);border-radius:999px;overflow:hidden}
.fl2{height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--sun));transition:width .45s}

.sec{background:var(--paper);border-radius:20px;padding:18px 16px 20px;margin-bottom:22px;position:relative;

.leaf{position:absolute;top:-16px;font-size:30px;transform:rotate(-12deg)}
.leaf.r{right:20px;left:auto;transform:rotate(14deg)}
.leaf{left:20px}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:2px 0 6px}
.pill{color:#fff;border-radius:999px;padding:3px 15px;font-size:.82rem;font-family:'Baloo 2',cursive;font-weight:700}

.si{font-size:.87rem;font-weight:600;color:#3d6b72;font-style:italic;margin:3px 0 15px;line-height:1.7}
.divider{border:none;border-top:2px dashed rgba(6,174,213,.35);margin:10px 0 14px}

.q{background:#fff;border:2px solid #d9f0f2;border-radius:14px;padding:13px 14px 14px;margin-bottom:13px}
.q.shk{animation:shk .42s ease}

 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.qn{display:inline-flex;align-items:center;justify-content:center;background:var(--sea);color:#fff;min-width:28px;

.src{background:#eafaf6;border-left:4px solid var(--palm);border-radius:0 9px 9px 0;padding:8px 12px;

.pre,.suf{font-weight:800;font-size:1rem;color:var(--ink);line-height:1.6}

.suf{white-space:normal}
.og{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}

.ob{background:#f4fdfd;border:2px solid #cdeff0;border-radius:16px;padding:11px 13px;color:var(--ink);
  font-family:'Nunito',sans-serif;font-size:1.08rem;font-weight:700;cursor:pointer;text-align:center;
  transition:all .16s ease;line-height:1.5;word-break:break-word;box-shadow:0 5px 0 rgba(6,120,140,.18)}
.ob:hover:not(.dn){transform:translateY(-2px) scale(1.03);border-color:var(--sea);box-shadow:0 8px 16px rgba(6,174,213,.28)}

.ob.no{background:#fde3dc;border-color:var(--bad);color:var(--bad)}

/* ── FIND-THE-ERROR: letter cards ── */
.lt{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}
@media(max-width:560px){.lt{grid-template-columns:repeat(2,1fr)}}

.lb.ok{background:#e5f6ea;border-color:var(--good);color:var(--good)}

.lb.no{background:#fde3dc;border-color:var(--bad);color:var(--bad)}

.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
.ti{flex:1;min-width:190px;padding:9px 13px;border:2px solid #cdeff0;border-radius:12px;

.ti:focus{border-color:var(--sea)}
.ti.ok{border-color:var(--good);background:#e5f6ea;color:var(--good)}
.ti.no{border-color:var(--bad);background:#fde3dc;color:var(--bad)}

/* explanation */
.ex{display:none;background:#fbfffe;border:1.5px solid var(--sea);border-radius:14px;padding:14px;margin-top:12px;

.ex.show{display:block;animation:sd .3s ease}

.vnt{background:#FFF1DC;border:1.5px solid #E9A21B;border-left:5px solid #E9A21B;border-radius:10px;

.ex ol{margin:0 0 0 21px}
.ex ol>li{margin-bottom:9px;font-weight:700;color:#2c4d52;line-height:1.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:8px 0 4px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#F2FBFC;border:1px solid #CDE9EE;border-radius:10px;padding:6px 10px;
  font-size:.97rem;font-weight:700;line-height:1.7}
.p-word{color:#1565C0;font-weight:800}
.hl-green{color:#0B8A3D;font-weight:900}
.hl-red{color:#D32F2F;font-weight:900}
.wt{background:rgba(14,59,67,.1);border-radius:6px;padding:0 6px;font-size:.8rem;font-weight:800;
  color:#2c4d52;font-style:italic}
.p-phonetic{color:#7B1FA2;background:#F3E5F5;border-radius:5px;padding:0 5px;font-size:.92rem;font-weight:700}
.p-mean{color:#BF5B04;font-weight:700}
.p-grammar{color:#C62828;font-weight:700;text-decoration:underline;text-decoration-color:#EF9A9A;
  text-underline-offset:3px}
u{background:#ffe9c9;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800;color:#8a5a00}
.sub{text-align:center;padding:26px 10px}
.sbtn{background:var(--coral);color:#fff;border:none;border-radius:999px;font-family:'Baloo 2',cursive;
  font-weight:700;font-size:.98rem;padding:15px 40px;cursor:pointer;box-shadow:0 10px 24px rgba(255,111,89,.4);
  transition:all .25s}
.sbtn:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(255,111,89,.5)}
.ov{position:fixed;inset:0;background:rgba(10,50,60,.65);z-index:1000;display:none;align-items:center;
  justify-content:center;backdrop-filter:blur(4px);padding:16px;overflow-y:auto}
.ov.on{display:flex}
.mb{background:var(--paper);border-radius:22px;padding:28px 24px;max-width:440px;width:94%;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto;border:3px solid #fff}
.mb h2{font-family:'Pacifico',cursive;font-size:1.5rem;color:var(--coral);margin-bottom:14px}
.mb input{width:100%;background:#fff;border:2px solid var(--sea);border-radius:12px;padding:12px 15px;
  color:var(--ink);font-family:'Nunito';font-size:.98rem;font-weight:700;text-align:center;margin-bottom:12px;outline:none}
.mb input.er{border-color:var(--bad);animation:shk .42s ease}
.mb .em{color:var(--bad);font-size:.82rem;margin-bottom:10px;display:none;font-weight:700}
.mb .gr{font-family:'Pacifico',cursive;font-size:1.3rem;color:var(--sea2);margin-bottom:8px}
.mb .rs{font-family:'Baloo 2',cursive;font-size:2.5rem;font-weight:800;color:var(--coral);margin:10px 0 4px}
.mb .rt{font-size:1rem;font-weight:800;color:#c98a00;margin:4px 0 8px}
.mb .rm{font-size:.92rem;font-weight:600;color:#2c4d52;line-height:1.75;margin-bottom:12px}
.mb img{width:100%;max-width:250px;border-radius:14px;margin:12px auto;display:block;border:2px solid #fff;
  box-shadow:0 6px 16px rgba(0,0,0,.2)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:1100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>

<script>
(function(){
 const W=['🌴','🌊','🐚','☀️','⛱️','🌺','🐢','♻️'];
 const D=document.getElementById('drift');
 for(let i=0;i<14;i++){
  const s=document.createElement('span');s.textContent=W[i%W.length];
  s.style.left=(Math.random()*96)+'%';s.style.fontSize=(18+Math.random()*20).toFixed(0)+'px';
  s.style.animationDuration=(16+Math.random()*16).toFixed(1)+'s';
  s.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  D.appendChild(s);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#06AED5','#FF6F59','#FFD166','#2E933C','#FFE7B3'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}

<script>
/* ══ DỮ LIỆU ══ */
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fil(sec,num,q,pre,suf,ans,accept,ex){Q.push({t:'fill',sec,num,q,pre:pre||'',suf:suf||'.',correct:ans,accept,ex})}
function err(sec,num,q,parts,ci,fix,accept,ex){Q.push({t:'err',sec,num,q,parts,ci,fix,accept,ex})}
/* A = 1 dòng phân tích đáp án: từ · từ loại · phiên âm · nghĩa */
function A(w,t,m,p,ok){return '<span class="'+(ok?'hl-green':'p-word')+'">'+w+'</span>'+
 (t?' <span class="wt">'+t+'</span>':'')+(p?' <span class="p-phonetic">'+p+'</span>':'')+
 ' = <span class="p-mean">'+m+'</span>'}
/* EX = khung giải thích 4 bước */
function EX(key,vn,arr,why,wrong){return '<div class="kb">🔑 ĐÁP ÁN: '+key+'</div>'+
 '<div class="vnt">💬 Dịch: '+vn+'</div><ol>'+
 (arr&&arr.length?'<li>Phân tích các đáp án:<div class="grid2">'+arr.map(x=>'<div>'+x+'</div>').join('')+'</div></li>':'')+
 '<li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class="p-grammar">'+why+'</span></li>'+
 (wrong?'<li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class="p-grammar">'+wrong+'</span></li>':'')+'</ol>'}

/* ═════ SECTION 1 — NGỮ ÂM (5 câu) ═════ */
mcq('S1',1,'Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại:',
 'oc<u>ea</u>n',['tr<u>ea</u>t','rel<u>ea</u>se','b<u>ea</u>ch','oc<u>ea</u>n'],
 EX('oc<u>ea</u>n — “ea” đọc /ə/',
 'Chọn từ có phần gạch chân được phát âm khác ba từ còn lại. (đối xử / thả ra / bãi biển / đại dương)',
 [A('tr<u>ea</u>t','v','đối xử; điều trị','/triːt/'),
  A('rel<u>ea</u>se','v','thả ra; thải ra','/rɪˈliːs/'),
  A('b<u>ea</u>ch','n','bãi biển','/biːtʃ/'),
  A('oc<u>ea</u>n','n','đại dương','/ˈəʊʃn/',1)],
 'Trong ocean, “ea” thuộc âm tiết KHÔNG mang trọng âm “-cean” nên bị đọc nhẹ thành /ə/ (âm ơ mờ).',
 'treat, release, beach đều có “ea” mang trọng âm và đọc thành nguyên âm dài /iː/.'),'c4');
mcq('S1',2,'Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại:',
 'prod<u>u</u>ct',['cons<u>u</u>me','prod<u>u</u>ct','red<u>u</u>ce','<u>u</u>sually'],
 EX('prod<u>u</u>ct — “u” đọc /ʌ/',
 'Chọn từ có phần gạch chân được phát âm khác ba từ còn lại. (tiêu thụ / sản phẩm / giảm / thường thường)',
 [A('cons<u>u</u>me','v','tiêu thụ','/kənˈsjuːm/'),

  A('red<u>u</u>ce','v','giảm bớt','/rɪˈdjuːs/'),
  A('<u>u</u>sually','adv','thường thường','/ˈjuːʒuəli/')],
 'Trong product, “u” nằm ở âm tiết đóng “-duct” nên đọc thành nguyên âm ngắn /ʌ/.',
 'consume, reduce, usually đều có “u” đọc thành nguyên âm dài /uː/ hoặc /juː/.'),'c4');
mcq('S1',3,'Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại:',

document.getElementById('tt').textContent=TOTAL;bump();

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 const shake=()=>{c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)};
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='err'){
  c.innerHTML='<div class="qt">'+h+m.q+
   '<span class="hint">👉 Bấm chọn chữ cái có lỗi, rồi gõ lại cho ĐÚNG phần đó.</span></div>'+
   '<div class="lt" id="l_'+gid+'">'+m.parts.map((p,i)=>
     '<button class="lb" data-i="'+i+'">'+'ABCD'[i]+'<small>'+p+'</small></button>').join('')+'</div>'+
   '<div class="fr fx" id="f_'+gid+'"><span class="pre">✏️ Sửa lại thành:</span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="...gõ từ/cụm từ đúng..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const L=c.querySelector('#l_'+gid),F=c.querySelector('#f_'+gid),
        inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  let sel=-1;
  L.querySelectorAll('.lb').forEach(b=>{b.onclick=()=>{
   if(done[gid])return;sel=+b.dataset.i;
   L.querySelectorAll('.lb').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
   F.classList.add('on');inp.focus()}});
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(sel<0||!v){inp.classList.add('no');shake();setTimeout(()=>inp.classList.remove('no'),460);return}
   done[gid]=true;answered++;
   const ok=(sel===m.ci)&&m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   L.querySelectorAll('.lb').forEach((x,j)=>{x.disabled=true;x.classList.remove('sel');
    if(j===m.ci)x.classList.add('ok');else if(j===sel)x.classList.add('no')});
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();shake()}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr">'+(m.pre?'<span class="pre">'+m.pre+'</span>':'')+
   '<input class="ti" id="i_'+gid+'" placeholder="...gõ câu trả lời..." autocomplete="off" spellcheck="false">'+
   (m.suf&&m.suf!=='.'?'<span class="suf">'+m.suf+'</span>':'')+'</div>'+
   '<div class="fr"><button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');shake();setTimeout(()=>inp.classList.remove('no'),460);return}
   done[gid]=true;answered++;
   /* chấm linh hoạt: chấp nhận gõ tiếp phần còn thiếu HOẶC gõ lại cả câu (kèm phần đã cho sẵn) */
   const acc=m.accept.map(norm).concat(m.pre?m.accept.map(a=>norm(m.pre+' '+a)):[]);
   const ok=acc.indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();shake()}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🌟 THIÊN TÀI! '+nm+' xuất sắc tuyệt đối!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — bãi biển xanh sạch đẹp nhờ có con! 🌴🌊';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi! Xem lại phần giải thích rồi luyện thêm nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn nhé! Đọc kỹ phần giải thích rồi làm lại bài nào!';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL+' câu đúng';
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
