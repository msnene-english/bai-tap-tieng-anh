<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 8: Sports and Games - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #8854C0; /* Hồng tím pastel */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --accent-color: #FF9F43; /* Cam */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ */
            --bg-color: #f0f3f5;
            --text-color: #2d3436;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0e0e0 10%, transparent 10%), radial-gradient(#e0e0e0 10%, transparent 10%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-color);
            margin: 0;
            padding-bottom: 80px; /* Space for footer */
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-color), #a29bfe);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.3);
            position: relative;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-weight: 800;
            font-size: 1.8rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 5px;
            font-weight: 700;
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #eee;
            position: relative;
            transition: transform 0.3s;
        }

        .question-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.5;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Button Styles */
        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #e0e0e0;
            position: relative;
        }

        .option-btn:hover:not(.disabled) {
            transform: scale(1.02);
            border-color: var(--secondary-color);
            background-color: #f0fffc;
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Status Colors */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 4px 0 #00b85c;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #ff2e40;
            box-shadow: 0 4px 0 #ff2e40;
            animation: shake 0.5s;
        }

        .option-btn.correct-answer {
            background-color: var(--correct-color); /* Highlight correct if user picked wrong */
            color: white;
            opacity: 0.8;
        }

        /* Explanation Box */
        .explanation {
            display: none;
            margin-top: 20px;
            background-color: #f8f9fa;
            border-left: 5px solid var(--secondary-color);
            padding: 15px;
            border-radius: 10px;
            animation: fadeIn 0.5s;
        }
        
        .explanation.visible {
            display: block;
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-content p {
            margin: 5px 0;
            font-size: 0.95rem;
        }

        .exp-label {
            font-weight: 700;
            color: #555;
            text-decoration: underline;
        }

        /* Reading Passage Box */
        .reading-box {
            background-color: #fff4e6;
            border: 2px dashed var(--accent-color);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-family: 'Quicksand', sans-serif;
            line-height: 1.6;
        }

        /* Glossary Table */
        .glossary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .glossary-table th {
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            text-align: left;
        }
        
        .glossary-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        /* Special layouts for Q37-40 (Gap Fill) */
        .gap-fill-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .options-pool {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #2196f3;
        }
        .pool-item {
            margin-bottom: 5px;
            font-weight: bold;
            color: #1565c0;
        }
        .text-content-gap {
            background: #fff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            line-height: 1.8;
        }

        /* Sign CSS Art */
        .sign-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .sign-circle {
            width: 120px;
            height: 120px;
            border: 12px solid #FF0000;
            border-radius: 50%;
            position: relative;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .sign-diagonal {
            position: absolute;
            width: 12px;
            height: 140px;
            background: #FF0000;
            transform: rotate(-45deg);
            z-index: 5;
        }
        .sign-icon svg {
            width: 70px;
            height: 70px;
            fill: black;
        }

        /* Sticky Footer */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .score-display {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-left: 20px;
        }

        .submit-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #009e82;
            margin-right: 20px;
            transition: transform 0.2s;
        }

        .submit-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Result Popup */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        
        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            animation: fadeIn 0.5s;
        }
        
        .result-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-color);
            margin: 20px 0;
        }

        u {
            text-decoration: underline;
            text-decoration-thickness: 3px;
            text-decoration-color: var(--primary-color);
        }

    </style>
</head>
<body>

<header>
    <h1>UNIT 8: SPORTS AND GAMES</h1>
    <div class="subtitle">Giáo viên tạo: Ms. Chí Nên  - TEST 01</div>
</header>

<div class="container" id="quiz-container">
    </div>

<div class="sticky-footer">
    <div class="score-display" id="live-score">Câu đúng: 0/40</div>
    <button class="submit-btn" onclick="submitQuiz()">NỘP BÀI</button>
</div>

<div class="modal-overlay" id="result-modal">
    <div class="result-card">
        <h2>KẾT QUẢ BÀI LÀM</h2>
        <div class="result-score" id="final-score">0/40</div>
        <p id="feedback-text">Cố gắng lên nhé!</p>
        <button class="submit-btn" onclick="closeModal()">Xem lại bài</button>
    </div>
</div>

<script>
    // Data Questions
    const quizData = [
        // --- PRONUNCIATION ---
        {
            id: 1,
            type: "phonetics",
            question: "Choose the word whose underlined part differs from the other three in pronunciation:",
            text: "A. c<u>a</u>ptain &nbsp;&nbsp; B. b<u>a</u>dminton &nbsp;&nbsp; C. <u>a</u>ctive &nbsp;&nbsp; D. b<u>a</u>seball",
            options: ["A", "B", "C", "D"],
            answer: 3, // Index 3 = D
            explanation: {
                translate_q: "Chọn từ có phần gạch chân phát âm khác các từ còn lại.",
                options: [
                    "A. Captain /ˈkæptɪn/: Đội trưởng (âm /æ/)",
                    "B. Badminton /ˈbædmɪntən/: Cầu lông (âm /æ/)",
                    "C. Active /ˈæktɪv/: Năng động (âm /æ/)",
                    "D. Baseball /ˈbeɪsbɔːl/: Bóng chày (âm /eɪ/)"
                ],
                correct: "Đáp án D phát âm là /eɪ/ (như trong 'day').",
                wrong: "Các đáp án A, B, C đều phát âm là /æ/ (miệng mở rộng, lai giữa a và e)."
            }
        },
        {
            id: 2,
            type: "phonetics",
            question: "Choose the word whose underlined part differs from the other three in pronunciation:",
            text: "A. m<u>e</u>mber &nbsp;&nbsp; B. karat<u>e</u> &nbsp;&nbsp; C. m<u>e</u>dal &nbsp;&nbsp; D. int<u>e</u>lligent",
            options: ["A", "B", "C", "D"],
            answer: 1, // B
            explanation: {
                translate_q: "Chọn từ có phần gạch chân phát âm khác các từ còn lại.",
                options: [
                    "A. Member /ˈmembər/: Thành viên (âm /e/)",
                    "B. Karate /kəˈrɑːti/: Võ Karate (âm /i/ ở cuối)",
                    "C. Medal /ˈmedl/: Huy chương (âm /e/)",
                    "D. Intelligent /ɪnˈtelɪdʒənt/: Thông minh (âm /e/)"
                ],
                correct: "Đáp án B (chữ 'e' cuối) phát âm là /i/.",
                wrong: "Các đáp án còn lại chữ 'e' đều được phát âm là /e/ ngắn."
            }
        },
        // --- STRESS ---
        {
            id: 3,
            type: "stress",
            question: "Choose the word that differs from the other three in the position of primary stress:",
            text: "A. equipment &nbsp;&nbsp; B. fantastic &nbsp;&nbsp; C. karate &nbsp;&nbsp; D. marathon",
            options: ["A", "B", "C", "D"],
            answer: 3, // D
            explanation: {
                translate_q: "Chọn từ có trọng âm chính khác với các từ còn lại.",
                options: [
                    "A. e'quipment (âm 2)",
                    "B. fan'tastic (âm 2)",
                    "C. ka'rate (âm 2)",
                    "D. 'marathon (âm 1)"
                ],
                correct: "Đáp án D trọng âm rơi vào âm tiết thứ nhất.",
                wrong: "Các từ còn lại trọng âm đều rơi vào âm tiết thứ hai."
            }
        },
        {
            id: 4,
            type: "stress",
            question: "Choose the word that differs from the other three in the position of primary stress:",
            text: "A. racket &nbsp;&nbsp; B. sporty &nbsp;&nbsp; C. goggles &nbsp;&nbsp; D. career",
            options: ["A", "B", "C", "D"],
            answer: 3, // D
            explanation: {
                translate_q: "Chọn từ có trọng âm chính khác với các từ còn lại.",
                options: [
                    "A. 'racket (âm 1)",
                    "B. 'sporty (âm 1)",
                    "C. 'goggles (âm 1)",
                    "D. ca'reer (âm 2)"
                ],
                correct: "Đáp án D (Sự nghiệp) trọng âm rơi vào âm tiết thứ 2.",
                wrong: "Các từ còn lại trọng âm đều rơi vào âm tiết thứ nhất."
            }
        },
        // --- GRAMMAR & VOCAB ---
        {
            id: 5,
            type: "grammar",
            question: "I _______ born on the first of May.",
            options: ["A. Were", "B. was", "C. are", "D. is"],
            answer: 1, // B
            explanation: {
                translate_q: "Tôi được sinh ra vào ngày 1 tháng 5.",
                options: ["A. Were (quá khứ, số nhiều)", "B. was (quá khứ, số ít)", "C. are (hiện tại)", "D. is (hiện tại)"],
                correct: "Cấu trúc 'to be born' (được sinh ra) luôn ở quá khứ. Chủ ngữ 'I' đi với 'was'.",
                wrong: "'Were' dùng cho You/We/They. 'Are/Is' sai thì."
            }
        },
        {
            id: 6,
            type: "grammar",
            question: "The enemy __________ last night.",
            options: ["A. Attack", "B. attacks", "C. attacked", "D. did attack"],
            answer: 2, // C
            explanation: {
                translate_q: "Kẻ thù đã tấn công tối qua.",
                options: ["A. Attack (V-inf)", "B. attacks (V-s)", "C. attacked (V-ed)", "D. did attack (Nhấn mạnh)"],
                correct: "Dấu hiệu 'last night' (tối qua) -> Chia thì Quá khứ đơn (V-ed).",
                wrong: "A và B là hiện tại. D dùng để nhấn mạnh nhưng ít dùng trong câu khẳng định thường, C tự nhiên nhất."
            }
        },
        {
            id: 7,
            type: "grammar",
            question: "______ in this class!",
            options: ["A. Not smoke", "B. Don’t smoke", "C. Smoke", "D. Doesn’t smoke"],
            answer: 1, // B
            explanation: {
                translate_q: "Đừng hút thuốc trong lớp học này!",
                options: ["A. Sai cấu trúc", "B. Đừng hút thuốc", "C. Hãy hút thuốc", "D. Sai cấu trúc"],
                correct: "Câu mệnh lệnh phủ định bắt đầu bằng 'Don't + V-inf'.",
                wrong: "'Smoke' sai nghĩa (xúi giục). A và D sai ngữ pháp mệnh lệnh."
            }
        },
        {
            id: 8,
            type: "grammar",
            question: "______carefully to avoid accidents!",
            options: ["A. Drives", "B. Drove", "C. Drive", "D. Driving"],
            answer: 2, // C
            explanation: {
                translate_q: "Hãy lái xe cẩn thận để tránh tai nạn!",
                options: ["A. Drives (V-s)", "B. Drove (V-ed)", "C. Drive (V-nguyên thể)", "D. Driving (V-ing)"],
                correct: "Câu mệnh lệnh khẳng định bắt đầu bằng Động từ nguyên thể (V-inf).",
                wrong: "Không chia thì (s/es/ed) trong câu mệnh lệnh."
            }
        },
        {
            id: 9,
            type: "grammar",
            question: "_____up or you’ll miss the show!",
            options: ["A. Step", "B. Hurry", "C. Jump", "D. Listen"],
            answer: 1, // B
            explanation: {
                translate_q: "Nhanh lên nếu không bạn sẽ lỡ buổi biểu diễn!",
                options: ["A. Bước", "B. Nhanh lên (Hurry up)", "C. Nhảy", "D. Nghe"],
                correct: "Cụm động từ 'Hurry up' nghĩa là nhanh lên/khẩn trương.",
                wrong: "Các động từ khác không đi với 'up' để tạo nghĩa phù hợp ngữ cảnh vội vã."
            }
        },
        {
            id: 10,
            type: "grammar",
            question: "Daisy _______ swimming with her friends last weekend.",
            options: ["A. went", "B. go", "C. is going", "D. goes"],
            answer: 0, // A
            explanation: {
                translate_q: "Daisy đã đi bơi với bạn vào cuối tuần trước.",
                options: ["A. went (quá khứ)", "B. go (nguyên thể)", "C. is going (hiện tại tiếp diễn)", "D. goes (hiện tại đơn)"],
                correct: "Dấu hiệu 'last weekend' -> Quá khứ đơn. 'Go swimming' -> 'Went swimming'.",
                wrong: "Sai thì."
            }
        },
        {
            id: 11,
            type: "vocab",
            question: "At the weekend we can play a ______ of badminton or join in a football match.",
            options: ["A. sport", "B. game", "C. match", "D. ball"],
            answer: 1, // B
            explanation: {
                translate_q: "Cuối tuần chúng ta có thể chơi một ván cầu lông...",

                correct: "Collocation: 'play a game of badminton/tennis'.",
                wrong: "'Match' thường dùng cho bóng đá (football match). 'Sport' quá chung chung."
            }
        },
        {
            id: 12,
            type: "comm",
            question: "Tom: “Did you have a good trip?” – “__________”",
            options: ["A. Thank you", "B. Yes, it was fun", "C. Yes, it was delicious", "D. It’s my pleasure"],
            answer: 1, // B
            explanation: {
                translate_q: "Tom: 'Bạn có chuyến đi vui không?'",
                options: ["A. Cảm ơn", "B. Có, vui lắm", "C. Có, ngon lắm (dùng cho đồ ăn)", "D. Đó là niềm vinh hạnh của tôi"],
                correct: "Trả lời trực tiếp cho câu hỏi về trải nghiệm chuyến đi.",
                wrong: "C sai ngữ nghĩa (delicious). A và D không khớp hội thoại."
            }
        },
        // --- CLOZE 1 (Sports Event) ---
        {
            id: 13,
            type: "cloze",
            question: "<b>NEW SPORTS EVENT!</b><br>This event (13) ______ place at Greenfield Stadium next Saturday.",
            options: ["A. take", "B. takes", "C. taking", "D. taken"],
            answer: 1, // B
            explanation: {
                translate_q: "Sự kiện này diễn ra tại Sân vận động Greenfield vào thứ 7 tới.",
                options: ["A. take", "B. takes", "C. taking", "D. taken"],
                correct: "Chủ ngữ 'This event' (số ít) + Lịch trình cố định (Schedule) -> Dùng Hiện tại đơn 'takes place'.",
                wrong: "Sai ngữ pháp (chia động từ)."
            }
        },
        {
            id: 14,
            type: "cloze",
            question: "Athletes from different schools will (14) _____ in various sports...",
            options: ["A. compete", "B. complete", "C. compare", "D. compass"],

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        let html = '';

        quizData.forEach((item, index) => {
            if (item.type === 'gap-fill-group') {
                // Special render for Q37-40
                html += renderGapFillGroup(item);
            } else if (item.type === 'reading' || item.type === 'reading-child') {
                if (item.type === 'reading') {
                     html += `<div class="reading-box">
                        <h3 style="color:var(--primary-color); margin-top:0;">${item.passageTitle}</h3>
                        <p>${item.passage}</p>
                        ${renderGlossary(item.glossary)}
                     </div>`;
                }
                html += renderStandardQuestion(item);
            } else {
                html += renderStandardQuestion(item);
            }
        });

        container.innerHTML = html;
    }

    function renderGlossary(list) {
        if(!list) return '';
        let rows = list.map(i => `<tr><td><b>${i.word}</b></td><td>${i.type}</td><td>${i.meaning}</td></tr>`).join('');
        return `<table class="glossary-table">
            <thead><tr><th>Word</th><th>Type</th><th>Meaning</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
    }

        let imageHTML = '';
        if (item.image === 'fishing') {
            imageHTML = `<div class="sign-container"><div class="sign-circle"><div class="sign-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C13.1 2 14 2.9 14 4V13.8C14 15.6 13.1 16.6 12 16.6C10.9 16.6 10 15.6 10 13.8V11H8V13.8C8 16.5 9.8 18.6 12 18.6C14.2 18.6 16 16.5 16 13.8V4C16 1.8 14.2 0 12 0C11.4 0 11 0.4 11 1H13C13 1.6 12.6 2 12 2ZM6 22H18V20H6V22Z"/></svg>
            </div><div class="sign-diagonal"></div></div></div>`;
        } else if (item.image === 'swimming') {
            imageHTML = `<div class="sign-container"><div class="sign-circle"><div class="sign-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C10.3 2 9 3.3 9 5C9 6.7 10.3 8 12 8C13.7 8 15 6.7 15 5C15 3.3 13.7 2 12 2ZM21 16L18.5 13.5L16.5 15.5L18 17C18 17 14 20 10 18C7 16.5 6 12 6 12L2 14C2 14 4 21 10 22C14 22.8 18.5 20.5 21 16ZM22 13C22 13 20 10 15 10C12 10 10 11.5 10 11.5L12 13.5C12 13.5 14 12 15.5 12.5C17 13 19 14.5 19 14.5L22 13Z"/></svg>
            </div><div class="sign-diagonal"></div></div></div>`;
        }

        let optionsHTML = item.options.map((opt, idx) => 
            `<button class="option-btn" id="btn-${item.id}-${idx}" onclick="checkAnswer(${item.id}, ${idx}, ${item.answer})">${opt}</button>`
        ).join('');

        // Explanation HTML
        let exp = item.explanation;
        let expHTML = `<div class="explanation" id="exp-${item.id}">
            <div class="exp-header">🌈 Ms. Chí Nên giải thích:</div>
            <div class="exp-content">
                <p><span class="exp-label">Dịch câu hỏi:</span> ${exp.translate_q}</p>
                <p><span class="exp-label">Đáp án đúng:</span> <span style="color:var(--correct-color); font-weight:bold;">${exp.correct}</span></p>
                <p><span class="exp-label">Tại sao sai:</span> ${exp.wrong}</p>
            </div>
        </div>`;

        return `<div class="card" id="card-${item.id}">
            <div class="question-title">Question ${item.id}</div>
            <div class="question-text">${item.question} <br> ${item.text || ''}</div>
            ${imageHTML}
            <div class="options-grid">
                ${optionsHTML}
            </div>
            ${expHTML}
        </div>`;
    }

    function renderGapFillGroup(item) {
        let poolHTML = item.pool.map(p => `<div class="pool-item">${p}</div>`).join('');
        
        let questionsHTML = item.subQuestions.map(sub => {
            let options = ["A", "B", "C", "D"];
            let btns = options.map((opt, idx) => 
                `<button class="option-btn" id="btn-${sub.id}-${idx}" onclick="checkAnswer(${sub.id}, ${idx}, ${sub.ans}, 'gap')">${opt}</button>`
            ).join('');
            
            let expHTML = `<div class="explanation" id="exp-${sub.id}">
                <div class="exp-header">🌈 Giải thích:</div>
                <div class="exp-content">
                    <p>${sub.explain}</p>
                </div>
            </div>`;

            return `<div class="card" id="card-${sub.id}">
                <div class="question-title">Question ${sub.id}</div>
                <div class="question-text">${sub.q}</div>
                <div class="options-grid" style="grid-template-columns: repeat(4, 1fr);">
                    ${btns}
                </div>
                ${expHTML}
            </div>`;
        }).join('');

        return `<div class="card" style="border-color: #2196f3; background:#f0f8ff;">
            <h3>Read and Fill (Q37-40)</h3>
            <div class="gap-fill-container">
                <div class="options-pool"><b>Options:</b><br>${poolHTML}</div>
                <div class="text-content-gap">${item.passage}</div>
            </div>
        </div>
        ${questionsHTML}`;
    }

    // Checking Logic
    let userScore = 0;
    let answeredCount = 0;
    const totalQuestions = 40;
    let answeredMap = {};

    function checkAnswer(questionId, selectedIdx, correctIdx, type) {
        if (answeredMap[questionId]) return; // Prevent re-answering
        answeredMap[questionId] = true;
        answeredCount++;

        const btnSelected = document.getElementById(`btn-${questionId}-${selectedIdx}`);
        const btnCorrect = document.getElementById(`btn-${questionId}-${correctIdx}`);
        const expBox = document.getElementById(`exp-${questionId}`);

        if (selectedIdx === correctIdx) {
            // Correct
            userScore++;
            btnSelected.classList.add('correct');
            // Confetti effect (simulated via alert or just visual)
            btnSelected.innerHTML += ' 🎉';
        } else {
            // Wrong
            btnSelected.classList.add('wrong');
            btnCorrect.classList.add('correct-answer'); // Show correct one
        }

        // Show explanation
        expBox.classList.add('visible');
        
        // Update live score
        document.getElementById('live-score').innerText = `Câu đúng: ${userScore}/${totalQuestions}`;
    }

    function submitQuiz() {
        const modal = document.getElementById('result-modal');
        const scoreText = document.getElementById('final-score');
        const feedback = document.getElementById('feedback-text');

        scoreText.innerText = `${userScore}/${totalQuestions}`;
        
        if (userScore >= 35) {
            feedback.innerText = "Xuất sắc! Ms. Chí Nên rất tự hào về con! 🌟";
        } else if (userScore >= 25) {
            feedback.innerText = "Làm tốt lắm! Cố gắng ôn thêm từ vựng nhé! 💪";
        } else {
            feedback.innerText = "Đừng buồn nhé! Hãy xem lại phần giải thích để tiến bộ hơn! 📚";
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
        // Scroll to top or review mode
    }

    // Initialize
    window.onload = renderQuiz;

</script>

</body>
</html>
