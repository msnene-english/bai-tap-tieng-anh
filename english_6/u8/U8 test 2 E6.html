<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIT 8: SPORTS AND GAMES - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Hồng tím pastel */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f2f5;
            --text-main: #2f3542;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Chống copy trộm để học sinh tập trung */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#d1d8e0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            padding-bottom: 80px; /* Chừa chỗ cho footer */
        }

        .header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
        }

        .header h3 {
            margin: 5px 0 0;
            font-weight: 400;
            opacity: 0.9;
            font-size: 1rem;
        }

        /* Container */
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Section Title */
        .section-title {
            background: var(--secondary);
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            margin: 30px 0 15px;
            display: inline-block;
            font-weight: 800;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Reading Passage Box */
        .reading-passage {
            background: #fff3cd;
            border: 2px dashed #ffc107;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-family: 'Quicksand', sans-serif;
            line-height: 1.6;
        }

        /* Glossary Table */
        .glossary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .glossary-table th {
            background: var(--primary);
            color: white;
            padding: 8px;
            text-align: left;
        }

        .glossary-table td {
            border-bottom: 1px solid #eee;
            padding: 8px;
            font-size: 0.9rem;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .question-text u {
            text-decoration: underline;
            text-decoration-color: var(--primary);
            text-decoration-thickness: 3px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Option Button */
        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            padding: 12px 15px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 4px 0 #e1e1e1;
            top: 0;
        }

        .option-btn:hover {
            transform: scale(1.02);
            border-color: var(--primary);
        }

        .option-btn:active {
            top: 4px;
            box-shadow: 0 0 0 #e1e1e1;
        }

        /* States */
        .option-btn.correct {
            background: var(--correct);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 4px 0 #00b85c;
        }

        .option-btn.wrong {
            background: var(--wrong);
            color: white;
            border-color: #e03b4b;
            box-shadow: 0 4px 0 #e03b4b;
            animation: shake 0.5s;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation {
            display: none; /* Hidden by default */
            margin-top: 20px;
            background: #f8f9fa;
            border-left: 5px solid var(--primary);
            padding: 15px;
            border-radius: 0 10px 10px 0;
            animation: slideDown 0.3s ease-out;
        }

        .explanation.show {
            display: block;
        }

        .expl-header {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .expl-content p {
            margin: 5px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .expl-label {
            font-weight: 700;
            color: #57606f;
        }

        /* Sticky Footer */
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .submit-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 30px;
            box-shadow: 0 6px 0 #00a388;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #00a388;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Visuals for Q29, Q30 */
        .visual-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        /* Danger Sign */
        .sign-danger {
            width: 120px;
            height: 105px;
            background: yellow;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            border: 2px solid black; /* Fake border via pseudo handled below */
        }
        .sign-danger-wrapper {
            width: 130px;
            height: 150px;
            background: white;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .sign-triangle {
            width: 0; 
            height: 0; 
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 86px solid black; /* Outer triangle */
            position: relative;
            display: flex;
            justify-content: center;
        }
        .sign-triangle::after {
            content: '';
            position: absolute;
            top: 6px;
            left: -40px;
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 70px solid #ffeb3b;
        }
        .bolt {
            position: absolute;
            top: 25px;
            font-size: 40px;
            color: black;
            font-weight: bold;
            z-index: 2;
        }
        .sign-text {
            background: yellow;
            font-weight: bold;
            font-size: 12px;
            padding: 2px 5px;
            margin-top: 5px;
            text-align: center;
            border: 1px solid black;
            width: 100%;
        }

        /* No Phone Sign */
        .sign-nophone {
            width: 100px;
            height: 120px;
            border: 3px solid #c0392b;
            border-radius: 5px;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sign-nophone-header {
            background: #c0392b;
            color: white;
            width: 100%;
            font-size: 9px;
            text-align: center;
            padding: 3px;
            font-weight: bold;
        }
        .circle-ban {
            width: 60px;
            height: 60px;
            border: 6px solid #c0392b;
            border-radius: 50%;
            margin-top: 5px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .circle-ban::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 58px;
            background: #c0392b;
            transform: rotate(-45deg);
        }
        .phone-icon {
            font-size: 30px;
            color: black;
        }

        /* Gap Fill Layout (Q37-40) */
        .gap-fill-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .options-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #2196f3;
        }
        .option-item {
            margin-bottom: 5px;
            font-weight: 600;
        }

        /* Popup */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .popup {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: bounceIn 0.5s;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Giáo Viên: Ms. Chí Nên </h1>
        <h3>UNIT 8 – SPORTS AND GAMES (TEST 02)</h3>
    </div>

    <div class="quiz-container" id="quiz-content">
        </div>

    <div class="footer-bar">
        <div id="progress-text" style="font-weight: bold; color: var(--primary);">0/40 Hoàn thành</div>
        <button class="submit-btn" onclick="submitQuiz()">NỘP BÀI</button>
    </div>

    <div class="overlay" id="result-overlay">
        <div class="popup">
            <h2>Kết Quả Của Con</h2>
            <div class="score-display" id="final-score">0/40</div>
            <p id="teacher-comment">Cố gắng lên nhé!</p>
            <button class="submit-btn" onclick="closePopup()">Xem lại bài</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // DATA
        const quizData = [
            // PHONETICS
            {
                id: 1,
                type: 'phonetics',
                question: "Choose the word whose underlined part differs in pronunciation:",
                options: [
                    { id: 'A', text: "h<u>a</u>te" },
                    { id: 'B', text: "<u>ai</u>r" },
                    { id: 'C', text: "ch<u>ai</u>r" },
                    { id: 'D', text: "h<u>ai</u>r" }
                ],
                correct: 'A',
                explanation: {
                    vi: "Chọn từ có phần gạch chân phát âm khác các từ còn lại.",
                    options: "A. hate /heɪt/ (v): Ghét<br>B. air /eə(r)/ (n): Không khí<br>C. chair /tʃeə(r)/ (n): Cái ghế<br>D. hair /heə(r)/ (n): Tóc",
                    whyCorrect: "Đáp án A phát âm là /ei/. Các đáp án còn lại phát âm là /eə/.",
                    whyWrong: "B, C, D đều có âm /eə/."
                }
            },
            {
                id: 2,
                type: 'phonetics',
                question: "Choose the word whose underlined part differs in pronunciation:",
                options: [
                    { id: 'A', text: "prep<u>a</u>re" },
                    { id: 'B', text: "c<u>a</u>rry" },
                    { id: 'C', text: "sh<u>a</u>re" },
                    { id: 'D', text: "f<u>ai</u>r" }
                ],
                correct: 'B',
                explanation: {
                    vi: "Chọn từ có phần gạch chân phát âm khác các từ còn lại.",
                    options: "A. prepare /prɪˈpeə(r)/ (v): Chuẩn bị<br>B. carry /ˈkæri/ (v): Mang, vác<br>C. share /ʃeə(r)/ (v): Chia sẻ<br>D. fair /feə(r)/ (adj): Công bằng",
                    whyCorrect: "Đáp án B phát âm là /æ/ (bẹt). Các đáp án còn lại phát âm là /eə/.",
                    whyWrong: "A, C, D đều có âm /eə/."
                }
            },
            // STRESS
            {
                id: 3,
                type: 'stress',
                question: "Choose the word with different primary stress:",
                options: [
                    { id: 'A', text: "jealous" },
                    { id: 'B', text: "result" },
                    { id: 'C', text: "measure" },
                    { id: 'D', text: "pleasure" }
                ],
                correct: 'B',
                explanation: {
                    vi: "Chọn từ có trọng âm chính khác với các từ còn lại.",
                    options: "A. jealous /ˈdʒeləs/ (adj): Ghen tị (trọng âm 1)<br>B. result /rɪˈzʌlt/ (n): Kết quả (trọng âm 2)<br>C. measure /ˈmeʒə(r)/ (v): Đo lường (trọng âm 1)<br>D. pleasure /ˈpleʒə(r)/ (n): Niềm vui (trọng âm 1)",
                    whyCorrect: "Đáp án B trọng âm rơi vào âm tiết thứ 2. Các từ còn lại rơi vào âm tiết thứ 1.",
                    whyWrong: "A, C, D trọng âm 1."
                }
            },
            {
                id: 4,
                type: 'stress',
                question: "Choose the word with different primary stress:",
                options: [
                    { id: 'A', text: "football" },
                    { id: 'B', text: "fixture" },
                    { id: 'C', text: "defeat" },
                    { id: 'D', text: "racetrack" }
                ],
                correct: 'C',
                explanation: {
                    vi: "Chọn từ có trọng âm chính khác với các từ còn lại.",
                    options: "A. football /ˈfʊtbɔːl/ (n): Bóng đá (trọng âm 1)<br>B. fixture /ˈfɪkstʃə(r)/ (n): Cuộc thi đấu (trọng âm 1)<br>C. defeat /dɪˈfiːt/ (v/n): Đánh bại (trọng âm 2)<br>D. racetrack /ˈreɪstræk/ (n): Đường đua (trọng âm 1)",
                    whyCorrect: "Đáp án C trọng âm rơi vào âm tiết thứ 2. Các từ còn lại rơi vào âm tiết thứ 1.",
                    whyWrong: "A, B, D trọng âm 1."
                }
            },
            // MULTIPLE CHOICE (GRAMMAR/VOCAB)
            {
                id: 5,
                type: 'grammar',
                question: "Kien is not very ______. He never plays games.",
                options: [
                    { id: 'A', text: "Sport" },
                    { id: 'B', text: "sporting" },
                    { id: 'C', text: "sporty" },
                    { id: 'D', text: "badly" }
                ],
                correct: 'C',
                explanation: {
                    vi: "Kiên không ______ lắm. Cậu ấy không bao giờ chơi trò chơi.",
                    options: "A. Sport (n): Thể thao<br>B. Sporting (adj): Thuộc thể thao/thượng võ<br>C. Sporty (adj): Dáng thể thao, đam mê thể thao<br>D. Badly (adv): Một cách tồi tệ",
                    whyCorrect: "Cần một tính từ chỉ tính cách/con người. 'Sporty' dùng để mô tả người thích thể thao.",
                    whyWrong: "A là danh từ. B thường dùng trong cụm 'sporting event'. D là trạng từ không hợp nghĩa."
                }
            },
            {
                id: 6,
                type: 'grammar',
                question: "Thanh likes ________ weather because he can go swimming in the river.",
                options: [
                    { id: 'A', text: "Hot" },
                    { id: 'B', text: "cold" },
                    { id: 'C', text: "rainy" },
                    { id: 'D', text: "raining" }
                ],
                correct: 'A',
                explanation: {
                    vi: "Thành thích thời tiết ______ vì cậu ấy có thể đi bơi ở sông.",
                    options: "A. Hot (adj): Nóng<br>B. Cold (adj): Lạnh<br>C. Rainy (adj): Có mưa<br>D. Raining (v): Đang mưa",
                    whyCorrect: "Theo ngữ cảnh, đi bơi (go swimming) thì thời tiết phải nóng (Hot).",
                    whyWrong: "Lạnh hoặc mưa thì không đi bơi sông được."
                }
            },
            {
                id: 7,
                type: 'grammar',
                question: "Vietnamese students play different sports and games _______ break time.",
                options: [
                    { id: 'A', text: "In" },
                    { id: 'B', text: "on" },
                    { id: 'C', text: "during" },
                    { id: 'D', text: "while" }
                ],
                correct: 'C',
                explanation: {
                    vi: "Học sinh Việt Nam chơi nhiều môn thể thao và trò chơi ______ giờ ra chơi.",
                    options: "A. In: Trong (không gian/tháng/năm)<br>B. On: Trên (ngày/bề mặt)<br>C. During: Trong suốt (khoảng thời gian)<br>D. While: Trong khi (cộng mệnh đề)",
                    whyCorrect: "Cụm 'during break time' (trong giờ ra chơi). Ngoài ra 'at break time' cũng đúng nhưng không có trong đáp án.",
                    whyWrong: "'While' cần đi với mệnh đề (S + V). 'In/On' không đi với break time theo cách dùng này."
                }
            },
            {
                id: 8,
                type: 'grammar',
                question: "Many girls and women _______ aerobics to keep fit.",
                options: [
                    { id: 'A', text: "Play" },
                    { id: 'B', text: "go" },
                    { id: 'C', text: "do" },
                    { id: 'D', text: "have" }
                ],
                correct: 'C',
                explanation: {
                    vi: "Nhiều cô gái và phụ nữ ______ thể dục nhịp điệu để giữ dáng.",
                    options: "A. Play: Chơi (môn đồng đội/dùng bóng)<br>B. Go: Đi (môn có -ing)<br>C. Do: Làm/tập (môn cá nhân/tại chỗ)<br>D. Have: Có",
                    whyCorrect: "Collocation: 'Do aerobics' (Tập thể dục nhịp điệu).",
                    whyWrong: "Play football, Go swimming... không dùng với aerobics."
                }
            },
            {
                id: 9,
                type: 'grammar',
                question: "Mathew _______ the answer to this question.",
                options: [
                    { id: 'A', text: "Didn’t knew" },
                    { id: 'B', text: "did knew" },
                    { id: 'C', text: "didn’t knowed" },
                    { id: 'D', text: "didn’t know" }
                ],
                correct: 'D',
                explanation: {
                    vi: "Mathew ______ câu trả lời cho câu hỏi này.",
                    options: "Các đáp án chia thì Quá khứ đơn.",
                    whyCorrect: "Cấu trúc phủ định Quá khứ đơn: S + didn't + V_nguyên_thể. -> 'didn't know'.",
                    whyWrong: "A sai vì 'knew' (V2). B sai ngữ pháp. C sai vì 'knowed' không tồn tại (know là bất quy tắc)."
                }
            },
            {
                id: 10,
                type: 'grammar',

        // RENDER FUNCTION
        const quizContainer = document.getElementById('quiz-content');

        function renderQuiz() {
            quizData.forEach(item => {
                if (item.type === 'reading-start' || item.type === 'passage1' || item.type === 'passage2' || item.type === 'passage3') {
                    // Render Reading Passage
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <div class="section-title">READING PASSAGE: ${item.title}</div>
                        <div class="reading-passage">
                            ${item.content}
                            ${renderGlossary(item.glossary)}
                        </div>
                    `;
                    quizContainer.appendChild(div);
                } else if (item.type === 'gap-fill-layout') {
                    // Render Special Gap Fill Layout
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <div class="section-title">${item.title}</div>
                        <div class="gap-fill-layout">
                            <div class="options-box">
                                <div style="color:var(--primary); font-weight:800; margin-bottom:10px;">OPTIONS BOX:</div>
                                ${item.optionsList.map(opt => `<div class="option-item">${opt}</div>`).join('')}
                            </div>
                            <div class="reading-passage">
                                <div style="color:var(--primary); font-weight:800; margin-bottom:10px;">TEXT BOX:</div>
                                ${item.content}
                                ${renderGlossary(item.glossary)}
                            </div>
                        </div>
                    `;
                    quizContainer.appendChild(div);
                } else {
                    // Render Question Card
                    const card = document.createElement('div');
                    card.className = 'question-card';
                    card.id = `q-card-${item.id}`;

                    let visualHTML = '';
                    if (item.type === 'visual') {
                        visualHTML = `<div class="visual-container">${item.visualContent}</div>`;
                    }
                    
                    let subtextHTML = '';
                    if (item.subtext) {
                        subtextHTML = `<div style="background:#f1f2f6; padding:10px; border-radius:10px; margin-bottom:15px; font-style:italic;">${item.subtext}</div>`;
                    }

                    const optionsHTML = item.options.map(opt => `
                        <button class="option-btn" onclick="checkAnswer(${item.id}, '${opt.id}', '${item.correct}', this)">
                            <span style="font-weight:800; color:var(--primary)">${opt.id}.</span> ${opt.text}
                        </button>
                    `).join('');

                    card.innerHTML = `
                        <div class="question-text">${item.question}</div>
                        ${visualHTML}
                        ${subtextHTML}
                        <div class="options-grid" id="opts-${item.id}">
                            ${optionsHTML}
                        </div>
                        <div class="explanation" id="expl-${item.id}">
                            <div class="expl-header">📝 Ms. Chí Nên giải thích:</div>
                            <div class="expl-content">
                                <p><span class="expl-label">Dịch/Phân tích:</span> ${item.explanation.vi}</p>
                                ${item.explanation.options ? `<p><span class="expl-label">Từ vựng/Lựa chọn:</span><br>${item.explanation.options}</p>` : ''}
                                <p><span style="color:var(--correct); font-weight:bold">✔ Tại sao đúng:</span> ${item.explanation.whyCorrect}</p>
                                <p><span style="color:var(--wrong); font-weight:bold">✖ Tại sao sai:</span> ${item.explanation.whyWrong}</p>
                            </div>
                        </div>
                    `;
                    quizContainer.appendChild(card);
                }
            });
        }

        function renderGlossary(list) {
            if (!list) return '';
            const rows = list.map(w => `<tr><td><b>${w.word}</b></td><td><i>${w.type}</i></td><td>${w.mean}</td></tr>`).join('');
            return `
                <table class="glossary-table">
                    <thead><tr><th colspan="3">📚 VOCABULARY GLOSSARY</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        // LOGIC
        let score = 0;
        let answeredCount = 0;
        const totalQuestions = 40;
        const userAnswers = {};

        function checkAnswer(qId, selectedId, correctId, btnElement) {
            if (userAnswers[qId]) return; // Prevent re-answering
            
            userAnswers[qId] = selectedId;
            answeredCount++;
            document.getElementById('progress-text').innerText = `${answeredCount}/${totalQuestions} Hoàn thành`;

            const optionsDiv = document.getElementById(`opts-${qId}`);
            const buttons = optionsDiv.getElementsByClassName('option-btn');
            
            // Disable all buttons
            for (let btn of buttons) {
                btn.classList.add('disabled');
                if (btn.innerText.startsWith(correctId + '.')) {
                    btn.classList.add('correct'); // Always highlight correct
                }
            }

            if (selectedId === correctId) {
                score++;
                triggerConfetti();
                // Play sound logic here if needed
            } else {
                btnElement.classList.add('wrong');
            }

            // Show explanation
            const explDiv = document.getElementById(`expl-${qId}`);
            explDiv.classList.add('show');
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#ffeb3b']
            });
        }

        function submitQuiz() {
            if (answeredCount < totalQuestions) {
                if (!confirm(`Con mới làm ${answeredCount}/${totalQuestions} câu. Con có chắc muốn nộp bài không?`)) {
                    return;
                }
            }
            
            // Show Popup
            document.getElementById('final-score').innerText = `${score}/${totalQuestions}`;
            const comment = document.getElementById('teacher-comment');
            if (score === totalQuestions) comment.innerText = "Tuyệt vời! Con là thiên tài! 🏆";
            else if (score >= 30) comment.innerText = "Giỏi lắm! Cố gắng thêm chút nữa là hoàn hảo! 🌟";
            else if (score >= 20) comment.innerText = "Khá tốt! Con nhớ xem kỹ lại phần giải thích nhé! 💪";
            else comment.innerText = "Đừng buồn nhé! Hãy xem lại lời giải thích để tiến bộ hơn! ❤";

            document.getElementById('result-overlay').style.display = 'flex';
            triggerConfetti();
        }

        function closePopup() {
            document.getElementById('result-overlay').style.display = 'none';
        }

        // Init
        renderQuiz();

    </script>
