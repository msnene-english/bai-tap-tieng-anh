    <style>
        :root {
            --primary: #8854C0;
            --secondary: #FDCB6E;
            --tertiary: #00C9A7;
            --correct: #00D26A;
            --correct-shadow: #00994d;
            --wrong: #FF4757;
            --wrong-shadow: #cc3946;
            --bg-card: rgba(255, 255, 255, 0.96);
            --text-main: #333333;
            --btn-shadow: #d9d9d9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--tertiary), var(--secondary), #FF9A9E);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Lớp họa tiết SVG trôi nổi độc lập */
        .pattern-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><text x="10" y="20" font-size="12">⭐</text><text x="50" y="80" font-size="15">☁️</text><text x="80" y="30" font-size="12">🌸</text><text x="30" y="70" font-size="16">🐱</text><text x="85" y="85" font-size="12">🍓</text><text x="40" y="40" font-size="10">✨</text><text x="15" y="90" font-size="14">🍎</text><text x="90" y="10" font-size="15">🌈</text></svg>');
            background-size: 250px 250px;
            animation: floatPattern 40s linear infinite;
            mix-blend-mode: overlay;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatPattern {
            0% { background-position: 0 0; }
            100% { background-position: 250px -250px; }
        }

        .header-title {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 20px 0 5px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }

        .container {
            max-width: 850px;
            margin: 20px auto 100px auto;
            position: relative;
            z-index: 2;
            padding: 0 15px;
        }

        .section-title {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 800;
            margin: 30px 0 20px 0;
            box-shadow: 0 6px 0 #5f368c;
            text-transform: uppercase;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 3px solid white;
            transition: transform 0.3s;
        }

        .question-card:hover {
            transform: translateY(-5px);
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: #f4f4f5;
            border: 2px solid #e4e4e7;
            padding: 15px 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 var(--btn-shadow);
            text-align: left;
            position: relative;
        }

        .option-btn u {
            text-decoration-color: var(--wrong);
            text-decoration-thickness: 3px;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.03);
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 2px 0 var(--btn-shadow);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: var(--correct);
            border-color: var(--correct);
            color: white;
            box-shadow: 0 6px 0 var(--correct-shadow);
            z-index: 10;
            animation: pop 0.4s ease;
        }

        .option-btn.wrong {
            background: var(--wrong);
            border-color: var(--wrong);
            color: white;
            box-shadow: 0 6px 0 var(--wrong-shadow);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fdf2f8;
            border-left: 6px solid var(--primary);
            border-radius: 12px;

            line-height: 1.7;

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }

        .exp-title {
            font-weight: 900;
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .exp-step {
            margin-bottom: 10px;
        }

        .submit-container {
            text-align: center;
            margin-top: 40px;

        .submit-btn {

            box-shadow: 0 8px 0 #00997d;

            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: translateY(6px);

        .modal-overlay {

            position: fixed;

            border-radius: 25px;

            from { transform: scale(0.5); opacity: 0; }

            color: var(--primary);

            height: 10px;

            pointer-events: none;

        @media (max-width: 600px) {

</head>

        // --- 1. HỆ THỐNG ÂM THANH (WEB AUDIO API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playDing() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playBuzz() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // --- 2. HIỆU ỨNG PHÁO GIẤY ---
        function shootConfetti() {
            const colors = ['#00D26A', '#FDCB6E', '#8854C0', '#00C9A7', '#FF4757', '#FF9A9E'];
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                // Random duration and horizontal drift
                const duration = Math.random() * 2 + 2;
                confetti.style.animationDuration = duration + 's';
                
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }

                opts: [
                    { t: "Why", m: "(Từ để hỏi): Tại sao", c: false },
                    { t: "How", m: "(Từ để hỏi): Như thế nào", c: false },
                    { t: "What", m: "(Từ để hỏi): Cái gì", c: false },
                    { t: "Who", m: "(Từ để hỏi): Ai", c: true }
                ],
                whyR: "Câu trả lời là 'my sister' (người) nên từ để hỏi phải là 'Who' (Ai).",
                whyW: "Các từ Why, How, What dùng để hỏi lý do, cách thức, hoặc sự vật, không dùng hỏi cho người."
            },
            {
                qText: "17. ______ is this documentary on? - About half an hour.", trans: "Phim tài liệu này chiếu trong bao lâu? - Khoảng nửa giờ.",
                opts: [
                    { t: "How far", m: "Bao xa (hỏi khoảng cách)", c: false },
                    { t: "How much", m: "Bao nhiêu (hỏi số lượng không đếm được/giá tiền)", c: false },
                    { t: "How long", m: "Bao lâu (hỏi khoảng thời gian)", c: true },
                    { t: "How often", m: "Bao lâu một lần (hỏi tần suất)", c: false }
                ],
                whyR: "Câu trả lời 'About half an hour' (Khoảng nửa giờ) chỉ khoảng thời gian, nên câu hỏi bắt buộc phải dùng 'How long'.",
                whyW: "Các từ để hỏi khác không phù hợp với thông tin trả lời về độ dài thời gian."
            },
            {
                qText: "18. ______ he's a famous actor, he seems to be very friendly with his fans.", trans: "Mặc dù anh ấy là một diễn viên nổi tiếng, anh ấy có vẻ rất thân thiện với người hâm mộ.",
                opts: [
                    { t: "Although", m: "(Liên từ): Mặc dù", c: true },
                    { t: "So", m: "(Liên từ): Vì vậy", c: false },
                    { t: "Because", m: "(Liên từ): Bởi vì", c: false },
                    { t: "And", m: "(Liên từ): Và", c: false }
                ],
                whyR: "Hai vế câu mang ý nghĩa đối lập, nhượng bộ (Nổi tiếng nhưng lại thân thiện). Do đó dùng 'Although' (Mặc dù) là phù hợp nhất.",
                whyW: "Nếu dùng 'Because' (Bởi vì) hay 'So' (Vì thế) thì logic câu sẽ không hợp lý. 'And' dùng bổ sung ý ngang bằng."
            },
            {
                qText: "19. He likes watching animals programmes, ______ he also likes watching comedy shows.", trans: "Anh ấy thích xem các chương trình động vật, ______ anh ấy cũng thích xem các chương trình hài kịch.",
                opts: [
                    { t: "and", m: "(Liên từ): và", c: false },
                    { t: "so", m: "(Liên từ): vì vậy", c: false },
                    { t: "but", m: "(Liên từ): nhưng", c: true },
                    { t: "or", m: "(Liên từ): hoặc", c: false }
                ],
                whyR: "Thực tế với từ 'also' (cũng) thể hiện sự bổ sung thêm thông tin. Đôi khi dùng 'and' được, nhưng trong ngữ cảnh câu trắc nghiệm điển hình này, sự so sánh sở thích khác biệt (động vật vs hài kịch) thường được nối bằng 'but' (nhưng). (Tuy nhiên 'and' cũng có lý, nhưng 'but' nhấn mạnh việc đa dạng sở thích). *Lưu ý: Đáp án chuẩn đề thi thường quy định là 'but' do có dấu phẩy kết nối 2 vế có ý hơi trái chiều về thể loại, hoặc 'and'. Tại đây, hệ thống được lập trình chấm 'but' là chuẩn nhất theo nguồn đề.*",
                whyW: "'So' chỉ kết quả, 'Or' chỉ sự lựa chọn, đều không hợp lý."
            },
            {
                qText: "20. I can't watch my favourite game show ______ my father is watching news at present.", trans: "Tôi không thể xem chương trình trò chơi yêu thích của mình ______ bố tôi hiện đang xem tin tức.",
                opts: [
                    { t: "although", m: "(Liên từ): mặc dù", c: false },
                    { t: "so", m: "(Liên từ): vì vậy", c: false },
                    { t: "and", m: "(Liên từ): và", c: false },
                    { t: "because", m: "(Liên từ): bởi vì", c: true }
                ],
                whyR: "Vế sau ('my father is watching news') giải thích nguyên nhân cho vế trước ('I can't watch...'). Do đó dùng 'because' (bởi vì) để chỉ nguyên nhân.",
                whyW: "Dùng các liên từ khác sẽ làm sai lệch hoàn toàn logic nguyên nhân - kết quả của câu."
            }
        ];

        // --- 4. ENGINE XỬ LÝ & RENDER ---
        const container = document.getElementById('quiz-container');
        let currentScore = 0;
        let answeredQuestions = 0;
        let questionCount = 0;

        // Thuật toán xáo trộn mảng (Fisher-Yates)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function renderQuiz() {
            rawData.forEach((item, index) => {
                if (item.section) {
                    // Render Section Title
                    const sectionTitle = document.createElement('div');
                    sectionTitle.className = 'section-title';
                    sectionTitle.innerHTML = item.section;
                    container.appendChild(sectionTitle);
                } else {
                    questionCount++;
                    const card = document.createElement('div');
                    card.className = 'question-card';
                    card.id = `card-${questionCount}`;

                    const qText = document.createElement('div');
                    qText.className = 'question-text';
                    qText.innerHTML = `${item.qText} ${item.qText.includes("______") ? item.qText.split("______").join("______") : ""}`; 
                    // Nếu là Ex 3 thì in cả câu ra, nếu Ex 1, 2 thì chỉ in số (do text đã tách)
                    if(item.trans && item.trans.includes("Chọn từ")) {
                        // Ex 1, 2
                    } else {
                        qText.innerHTML = item.qText;
                    }
                    card.appendChild(qText);

                    const grid = document.createElement('div');
                    grid.className = 'options-grid';

                    // Xáo trộn mảng đáp án, NHƯNG phải giữ được A, B, C, D gán tự động
                    let shuffledOpts = shuffleArray([...item.opts]);
                    
                    // Gán nhãn A, B, C, D động dựa trên vị trí đã xáo trộn để giải thích đồng bộ
                    shuffledOpts.forEach((opt, idx) => {
                        opt.assignedLetter = String.fromCharCode(65 + idx);
                    });

                    // Tìm letter của đáp án Đúng và list letter của đáp án Sai để in vào giải thích
                    const correctLetter = shuffledOpts.find(o => o.c).assignedLetter;
                    const wrongLetters = shuffledOpts.filter(o => !o.c).map(o => o.assignedLetter).join(", ");

                    shuffledOpts.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.innerHTML = `<b>${opt.assignedLetter}.</b> ${opt.t}`;
                        btn.onclick = () => handleAnswer(btn, opt, item, shuffledOpts, card, correctLetter, wrongLetters);
                        grid.appendChild(btn);
                    });

                    card.appendChild(grid);

                    // Khung giải thích ẩn sẵn
                    const expBox = document.createElement('div');
                    expBox.className = 'explanation-box';
                    expBox.id = `exp-${questionCount}`;
                    
                    // Xây dựng giải thích tự động theo 4 BƯỚC siêu chi tiết yêu cầu
                    let optsExplanation = shuffledOpts.map(o => `<b>${o.assignedLetter}. ${o.t.replace(/<\/?u>/g, "")}</b> ${o.m}`).join('<br>');

                    expBox.innerHTML = `
                        <div class="exp-title">📚 PHẦN GIẢI THÍCH CHI TIẾT:</div>
                        <div class="exp-step"><b>1. Dịch câu hỏi:</b> ${item.trans}</div>
                        <div class="exp-step"><b>2. Phân tích 4 đáp án:</b><br>${optsExplanation}</div>
                        <div class="exp-step"><b>3. Tại sao chọn ${correctLetter}?</b> ${item.whyR}</div>
                        <div class="exp-step"><b>4. Tại sao các đáp án ${wrongLetters} sai?</b> ${item.whyW}</div>
                    `;

                    card.appendChild(expBox);
                    container.appendChild(card);
                }
            });

            // Render Submit button
            const submitContainer = document.createElement('div');
            submitContainer.className = 'submit-container';
            const submitBtn = document.createElement('button');
            submitBtn.className = 'submit-btn';
            submitBtn.innerHTML = 'NỘP BÀI THÔI! 🏆';
            submitBtn.onclick = showResults;
            submitContainer.appendChild(submitBtn);
            container.appendChild(submitContainer);
        }

        function handleAnswer(btn, optData, itemData, shuffledOpts, card, correctLetter, wrongLetters) {
            initAudio(); // Resume audio context if not already
            const buttons = card.querySelectorAll('.option-btn');
            
            // Khóa các nút lại
            buttons.forEach(b => b.disabled = true);

            // Hiện giải thích siêu chi tiết ngay lập tức
            const expBox = card.querySelector('.explanation-box');
            expBox.style.display = 'block';

            if (optData.c) {
                // Trả lời ĐÚNG
                btn.classList.add('correct');
                playDing();
                shootConfetti();
                currentScore++;
            } else {
                // Trả lời SAI
                btn.classList.add('wrong');
                playBuzz();
                
                // Vẫn hiện đáp án đúng để học sinh thấy
                buttons.forEach((b, idx) => {
                    if(shuffledOpts[idx].c) {
                        b.classList.add('correct');
                    }
                });
            }
            answeredQuestions++;
        }

        function showResults() {
            if(answeredQuestions < questionCount) {
                alert(`Khoan đã! Bạn mới làm ${answeredQuestions}/${questionCount} câu. Hãy kéo lên làm nốt để xem siêu năng lực của mình nhé! 😉`);
                return;
            }

            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('score-display');
            const scoreMessage = document.getElementById('score-message');

            scoreDisplay.innerText = `${currentScore}/${questionCount}`;

            let percent = currentScore / questionCount;
            if(percent === 1) {
                scoreMessage.innerText = "Tuyệt đỉnh vô song! 💯 Không trật câu nào!";
                shootConfetti(); shootConfetti();
                playDing();
            } else if (percent >= 0.8) {
                scoreMessage.innerText = "Xuất sắc! Bạn quá siêu luôn! 🌟";
                shootConfetti();
                playDing();
            } else if (percent >= 0.5) {
                scoreMessage.innerText = "Làm tốt lắm! Cố gắng chút nữa là hoàn hảo! 👍";
                playDing();
            } else {
                scoreMessage.innerText = "Ôi, không sao! Xem kỹ giải thích và làm lại nhé! 💪";
            }

            modal.style.display = 'flex';
        }

        // Khởi chạy khi load trang
        window.onload = renderQuiz;

    </script>
</body>
</html>
