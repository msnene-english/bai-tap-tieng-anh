<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #FDCB6E;
            --accent: #00C9A7;
            --correct: #00D26A;
            --correct-shadow: #00a051;
            --wrong: #FF4757;
            --wrong-shadow: #cc3945;
            --btn-bg: #ffffff;
            --btn-shadow: #d1d8e0;
            --text-dark: #2d3436;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text-dark);
            background: linear-gradient(45deg, #8854C0, #FDCB6E, #00C9A7, #ff9ff3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Floating Pattern */
        .pattern-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5l5.5 16.5h17.5l-14 10.5 5.5 16.5-14.5-11-14.5 11 5.5-16.5-14-10.5h17.5z' fill='%23ffffff' fill-rule='evenodd'/%3E%3C/svg%3E");
            animation: floatPattern 60s linear infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatPattern {
            0% { background-position: 0 0; }
            100% { background-position: 1000px 1000px; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-title {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-size: 1.5rem;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            left: 50%;
            transform: translateX(-50%);
            position: relative;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media(max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .btn-option {
            background: var(--btn-bg);
            border: 2px solid #ecf0f1;
            border-radius: 15px;
            padding: 15px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 6px 0 var(--btn-shadow);
            transition: all 0.1s ease;
            text-align: left;
            position: relative;
            word-wrap: break-word;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--btn-shadow);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-shadow);
        }

        .btn-option.correct {
            background: var(--correct);
            color: white;
            border-color: var(--correct);
            box-shadow: 0 6px 0 var(--correct-shadow);
        }

        .btn-option.wrong {
            background: var(--wrong);
            color: white;
            border-color: var(--wrong);
            box-shadow: 0 6px 0 var(--wrong-shadow);
        }

        .btn-option:disabled { cursor: not-allowed; }

        .explanation {
            display: none;
            margin-top: 20px;
            background: #f1f2f6;
            border-left: 5px solid var(--accent);
            padding: 15px;
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.6;
            animation: slideDown 0.4s ease forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation h4 {
            margin-top: 0;
            color: var(--primary);
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Error Correction Styles */
        .error-word {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: var(--primary);
            text-decoration-thickness: 3px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .error-word:hover { background: rgba(136, 84, 192, 0.2); }
        .correction-box { display: none; margin-top: 15px; display: flex; gap: 10px; }
        .input-text { flex: 1; padding: 10px 15px; border: 2px solid var(--primary); border-radius: 15px; font-family: 'Nunito', sans-serif; font-size: 1.1rem; }
        .btn-check { padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 15px; font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 0 #00a085; }
        .btn-check:active { transform: translateY(2px); box-shadow: 0 2px 0 #00a085; }

        .submit-container { text-align: center; margin: 40px 0; }
        .btn-submit {
            background: linear-gradient(45deg, #FF9F43, #FF6B6B);
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 8px 0 #d9534f;
            transition: all 0.2s;
        }
        .btn-submit:active { transform: translateY(5px); box-shadow: 0 3px 0 #d9534f; }

        /* Confetti Canvas */
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
        
        .section-title { color: white; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 10px; display: inline-block; margin-bottom: 15px; font-size: 1.2rem;}
    </style>
</head>
<body>

    <div class="pattern-overlay"></div>
    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <div class="header-title">✨ Ms. Chí Nên  ✨</div>
        <div id="quiz-container"></div>
        <div class="submit-container">
            <button class="btn-submit" onclick="finishQuiz()">NỘP BÀI!</button>
        </div>
    </div>

    <script>
        // WEB AUDIO API cho âm thanh Gamification (Không cần file ngoài)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // Tiếng "Ding" vui tai
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); // A5
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else {
                // Tiếng "Buzz" (Téo tèo tèo)
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // DỮ LIỆU BÀI TẬP & GIẢI THÍCH SIÊU CHI TIẾT
        const quizData = [
            {
                section: "Ex 6: Choose the best answer.",
                id: 37,
                question: "“What is your favorite TV program?” - “________.”",
                options: ["A. I like Chelsea best", "B. I like Doraemon best", "C. I like Portugal best", "D. I like The Voice best"],
                correctIndex: 3,
                explain: `<b>Bước 1:</b> Dịch câu hỏi: "Chương trình truyền hình yêu thích của bạn là gì?"<br>
                <b>Bước 2:</b> Dịch đáp án:<br>
                - A. Tôi thích đội Chelsea nhất.<br>
                - B. Tôi thích Doraemon nhất.<br>
                - C. Tôi thích Bồ Đào Nha nhất.<br>
                - D. Tôi thích The Voice nhất.<br>
                <b>Bước 3:</b> Chọn D vì "The Voice" là tên một chương trình truyền hình thực tế âm nhạc (TV program).<br>
                <b>Bước 4:</b> Loại A (Chelsea - đội bóng), C (Portugal - quốc gia), B (Doraemon - phim hoạt hình/truyện tranh, không đại diện sát nghĩa cho 'TV program' bằng một show truyền hình cụ thể).`
            },
            {
                section: "",
                id: 38,
                question: "“What sports are you best at?” - “________.”",
                options: ["A. Volleyball, I think", "B. I love playing with my school team", "C. I play soccer 3 times a week", "D. I think MU is the best football team in the world."],
                correctIndex: 0,
                explain: `<b>Bước 1:</b> Dịch câu hỏi: "Môn thể thao nào bạn giỏi nhất?" (Hỏi về TÊN môn thể thao).<br>
                <b>Bước 2:</b> Dịch đáp án:<br>
                - A. Bóng chuyền, tôi nghĩ vậy.<br>
                - B. Tôi thích chơi với đội tuyển của trường.<br>
                - C. Tôi chơi bóng đá 3 lần 1 tuần.<br>
                - D. Tôi nghĩ MU là đội bóng vĩ đại nhất thế giới.<br>
                <b>Bước 3:</b> Chọn A vì câu hỏi "What sports..." cần câu trả lời trực tiếp là tên một môn thể thao (Volleyball).<br>
                <b>Bước 4:</b> B sai vì trả lời sai trọng tâm. C sai vì trả lời cho câu hỏi "How often..." (Tần suất). D sai vì trả lời cho câu hỏi quan điểm về đội bóng.`
            },
            {
                section: "",
                id: 39,
                question: "“Did you visit any famous places?” - “________.”",
                options: ["A. Yes, thanks. This holiday isn’t long enough!", "B. Yes, we visited the Natural History Museum. It’s the best museum in London!", "C. Yes, you’re right. It is a very beautiful city. I like it very much.", "D. I heard it is a very big city, isn’t it?"],
                correctIndex: 1,
                explain: `<b>Bước 1:</b> Dịch câu hỏi: "Bạn có đến thăm địa điểm nổi tiếng nào không?" (Câu hỏi Yes/No ở quá khứ).<br>
                <b>Bước 2:</b> Dịch đáp án:<br>
                - A. Có, cảm ơn. Kỳ nghỉ này không đủ dài!<br>
                - B. Có, chúng tôi đã thăm Bảo tàng Lịch sử Tự nhiên. Đó là bảo tàng tốt nhất ở London!<br>
                - C. Vâng, bạn nói đúng. Nó là một thành phố rất đẹp...<br>
                - D. Tôi nghe nói đó là một thành phố rất lớn, phải không?<br>
                <b>Bước 3:</b> Chọn B vì trả lời đúng trọng tâm câu hỏi Yes/No và cung cấp thêm thông tin về địa điểm đã thăm (Natural History Museum).<br>
                <b>Bước 4:</b> A sai vì "thanks" không hợp ngữ cảnh. C sai vì "you're right" dùng để đồng tình, không phải trả lời câu hỏi "Did you...". D sai vì lại đi hỏi ngược lại người ta.`
            },
            {
                section: "V. FINDING ERRORS - Ex 7: Find and correct the mistakes.",
                type: "error_correction",
                id: 40,
                question: "People watch races or football matches <u>on</u> sport programs.",
                options: ["People", "watch", "on", "sport programs"],
                correctTarget: "on",
                correctAnswer: "in",
                explain: `<b>Bước 1:</b> Dịch câu: "Mọi người xem các cuộc đua hoặc các trận bóng đá trong các chương trình thể thao."<br>
                <b>Bước 2 & 3:</b> Lỗi sai ở "on". Ta phải dùng giới từ <b>in</b> cho các chương trình/phim ảnh (in a program/in a movie).<br>
                <b>Bước 4:</b> Các từ còn lại hoàn toàn đúng ngữ pháp (People watch - số nhiều; sport programs - danh từ đếm được số nhiều).`
            },
            {
                section: "",
                type: "error_correction",
                id: 41,
                question: "<u>When</u> did she move to New York City? – Because she studied Arts there.",
                options: ["When", "move", "to", "Because"],
                correctTarget: "When",
                correctAnswer: "Why",
                explain: `<b>Bước 1:</b> Dịch câu: "Tại sao cô ấy lại chuyển đến thành phố New York? - Bởi vì cô ấy học Nghệ thuật ở đó."<br>
                <b>Bước 2 & 3:</b> Lỗi sai ở "When" (Khi nào). Vì câu trả lời bắt đầu bằng "Because" (Bởi vì - chỉ lý do), nên từ để hỏi phải là <b>Why</b> (Tại sao).<br>
                <b>Bước 4:</b> Các thành phần "move", "to", "Because" đều sử dụng chính xác cấu trúc ngữ pháp.`
            },
            {
                section: "",
                type: "error_correction",
                id: 42,
                question: "Do you <u>play</u> yoga at home or in a club?",
                options: ["Do", "play", "at", "or"],
                correctTarget: "play",
                correctAnswer: "do",
                explain: `<b>Bước 1:</b> Dịch câu: "Bạn tập yoga ở nhà hay ở câu lạc bộ?"<br>
                <b>Bước 2 & 3:</b> Lỗi sai ở "play". Collocation (Sự kết hợp từ) bắt buộc với Yoga là <b>do yoga</b> (tập yoga), không dùng "play". ("Play" thường dùng cho các môn có bóng và đối kháng).<br>
                <b>Bước 4:</b> Trợ động từ "Do you", giới từ "at home", liên từ "or" đều chuẩn xác.`
            },
            {
                section: "",
                type: "error_correction",
                id: 43,
                question: "<u>Does</u> she take part in the marathon last Saturday?",
                options: ["Does", "take part", "in", "last Saturday"],
                correctTarget: "Does",
                correctAnswer: "Did",
                explain: `<b>Bước 1:</b> Dịch câu: "Cô ấy có tham gia cuộc đua marathon vào thứ Bảy tuần trước không?"<br>
                <b>Bước 2 & 3:</b> Lỗi sai ở "Does". Dấu hiệu nhận biết thì Quá khứ đơn là "last Saturday" (thứ Bảy tuần trước), do đó mượn trợ động từ phải là <b>Did</b>.<br>
                <b>Bước 4:</b> "take part in" (tham gia) ở dạng nguyên thể do đã mượn trợ động từ là đúng. Dấu hiệu "last Saturday" là chuẩn.`
            },
            {
                section: "",
                type: "error_correction",
                id: 44,
                question: "<u>They</u> dog is so friendly. It never barks.",
                options: ["They", "is", "friendly", "never"],
                correctTarget: "They",
                correctAnswer: "Their",
                explain: `<b>Bước 1:</b> Dịch câu: "Con chó CỦA HỌ rất thân thiện. Nó không bao giờ sủa."<br>
                <b>Bước 2 & 3:</b> Lỗi sai ở "They". Ở đây ta cần một Tính từ sở hữu đứng trước danh từ "dog", nên "They" (chủ ngữ) phải đổi thành <b>Their</b> (của họ).<br>
                <b>Bước 4:</b> "is", "friendly", "never" đều đóng đúng vai trò ngữ pháp trong câu.`
            },
            {
                section: "",
                type: "error_correction",
                id: 45,
                question: "He loves cartoons. <u>Her</u> favorite cartoon is “Sailor Moon”.",
                options: ["loves", "Her", "favorite", "is"],
                correctTarget: "Her",
                correctAnswer: "His",
                explain: `<b>Bước 1:</b> Dịch câu: "Anh ấy yêu phim hoạt hình. Phim hoạt hình yêu thích CỦA ANH ẤY là Thủy thủ Mặt trăng."<br>
                <b>Bước 2 & 3:</b> Lỗi sai ở "Her". Chủ ngữ ở câu trước là "He" (Anh ấy - con trai), nên tính từ sở hữu ở câu sau phải là <b>His</b> (của anh ấy) thay vì "Her" (của cô ấy).<br>
                <b>Bước 4:</b> Động từ "loves", tính từ "favorite", to be "is" chia đúng ngôi và thì.`
            },
            {
                section: "VI. WRITING - Ex 12: Write the second sentence.",
                type: "writing",
                id: 61,
                question: "What’s your favorite program? (Viết lại dùng từ: <b>best</b>)",
                correctAnswer: "What program do you like best?",
                explain: `<b>Bước 1:</b> Dịch câu gốc: "Chương trình yêu thích của bạn là gì?"<br>
                <b>Bước 2 & 3:</b> Cấu trúc tương đương: <b>What is your favorite + N? = What + N + do you like best?</b> (Bạn thích cái gì nhất).<br>
                <b>Bước 4:</b> Đáp án chuẩn: What program do you like best?`
            },
            {
                section: "",
                type: "writing",
                id: 62,
                question: "Jim likes to watch Animal programs because he loves animals. (Viết lại dùng từ: <b>so</b>)",
                correctAnswer: "Jim loves animals, so he likes to watch Animal programs.",
                explain: `<b>Bước 1:</b> Dịch câu gốc: "Jim thích xem chương trình Động vật vì anh ấy yêu động vật."<br>
                <b>Bước 2 & 3:</b> Chuyển đổi từ "Because" (Bởi vì - chỉ nguyên nhân) sang "So" (Vì vậy - chỉ kết quả). Đảo mệnh đề nguyên nhân lên trước: Jim loves animals, vì vậy (so) anh ấy thích xem chương trình Động vật.<br>
                <b>Bước 4:</b> Đáp án: Jim loves animals, so he likes to watch Animal programs. (Lưu ý dấu phẩy trước so).`
            },
            {
                section: "",
                type: "writing",
                id: 63,
                question: "Don’t forget to switch off the TV before you go to bed. (Viết lại dùng từ: <b>remember</b>)",
                correctAnswer: "Remember to switch off the TV before you go to bed.",
                explain: `<b>Bước 1:</b> Dịch câu gốc: "Đừng quên tắt TV trước khi đi ngủ."<br>
                <b>Bước 2 & 3:</b> Cấu trúc đồng nghĩa: <b>Don't forget to V = Remember to V</b> (Đừng quên làm gì = Hãy nhớ làm gì).<br>
                <b>Bước 4:</b> Chỉ cần thay "Don't forget to" bằng "Remember to", giữ nguyên phần sau.`
            },
            {
                section: "",
                type: "writing",
                id: 64,

                explain: `<b>Bước 1:</b> Dịch ngữ cảnh: "Hùng đang gác chân lên ghế đá. Bạn nói..."<br>

                <b>Bước 4:</b> A là mệnh lệnh khẳng định (hãy gác chân). C sai vì mệnh lệnh không dùng "Doesn't". D sai vì thừa chữ "to" (Don't to put).`

            {
                section: "",
                id: 71,
                question: "It/ not/ easy/ find/ your way/ a strange city.",
                options: [

                    "B. It is not easy to find your way in a strange city.",
                    "C. Its is not easy to find your way in a strange city.",
                    "D. Its’s is not easy to find your way in a strange city."
                ],
                correctIndex: 1,
                explain: `<b>Bước 1:</b> Cấu trúc cần nhớ: <b>It is (not) + adj + to V</b> (Thật (không) dễ/khó để làm gì...).<br>
                <b>Bước 2 & 3:</b> Áp dụng cấu trúc: It is not easy to find... (Không dễ để tìm đường ở một thành phố lạ). -> Chọn B.<br>

                options: [

                    "B. She got up early every day, so she can’t go to school late.",
                    "C. She gets up early every day, or she can’t go to school late.",
                    "D. She gets up early every day, so she can’t go to school late."
                ],
                correctIndex: 3,
                explain: `<b>Bước 1:</b> Dấu hiệu "everyday" -> Thì Hiện tại đơn. Chủ ngữ "She" -> động từ "get" phải thêm "s" (gets).<br>
                <b>Bước 2 & 3:</b> Nối 2 vế bằng liên từ chỉ kết quả "so" (Cô ấy dậy sớm mỗi ngày, VÌ VẬY cô ấy không bị đi học muộn). -> Chọn D.<br>
                <b>Bước 4:</b> A sai vì "get" không chia. B sai vì "got" chia ở quá khứ. C sai vì dùng liên từ "or" (hoặc) không hợp nghĩa.`
            }
        ];

        let score = 0;
        let answeredQuestions = 0;

        // Shuffle Options Function
        function shuffleOptions(options, correctIndex) {
            let arr = options.map((opt, i) => ({ text: opt, isCorrect: i === correctIndex }));
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderQuiz() {
            const container = document.getElementById("quiz-container");
            let html = "";
            
            quizData.forEach((q, index) => {
                if(q.section) {
                    html += `<div class="section-title">${q.section}</div>`;
                }

                html += `<div class="card" id="card-${index}">
                    <div class="question-text">Câu ${q.id}: ${q.question}</div>`;

                // Render Trắc Nghiệm ABCD
                if (!q.type) {
                    const shuffled = shuffleOptions(q.options, q.correctIndex);
                    html += `<div class="options-grid">`;
                    shuffled.forEach(opt => {
                        html += `<button class="btn-option" onclick="checkMC(${index}, this, ${opt.isCorrect})">${opt.text}</button>`;
                    });
                    html += `</div>`;
                } 
                // Render Tìm Lỗi Sai (Error Correction)
                else if (q.type === "error_correction") {
                    html += `<div>Nhấp vào từ bị sai dưới đây để sửa: <br><br>`;
                    q.options.forEach(word => {
                        let isTarget = (word === q.correctTarget);
                        html += `<span class="error-word" onclick="selectError(${index}, this, ${isTarget}, '${q.correctAnswer}')">${word}</span> `;
                    });
                    html += `</div>
                        <div class="correction-box" id="corr-box-${index}">
                            <input type="text" class="input-text" id="input-${index}" placeholder="Sửa thành gì ta...?">
                            <button class="btn-check" onclick="checkErrorCorrection(${index}, '${q.correctAnswer}')">Kiểm Tra!</button>
                        </div>`;
                }
                // Render Viết Lại Câu (Writing)
                else if (q.type === "writing") {
                    html += `<div class="correction-box" style="display:flex;">
                            <input type="text" class="input-text" id="write-${index}" placeholder="Gõ câu của bạn vào đây...">
                            <button class="btn-check" onclick="checkWriting(${index})">Kiểm Tra!</button>
                        </div>`;
                }

                html += `<div class="explanation" id="exp-${index}">
                            <h4>🌟 Ms. Chí Nên giải thích nè:</h4>
                            ${q.explain}
                        </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // Logic Chấm Điểm Trắc Nghiệm
        function checkMC(index, btn, isCorrect) {
            const card = document.getElementById(`card-${index}`);
            const buttons = card.querySelectorAll(".btn-option");
            
            buttons.forEach(b => b.disabled = true);
            
            if (isCorrect) {
                btn.classList.add("correct");
                playSound('correct');
                fireConfetti();
                score++;
            } else {
                btn.classList.add("wrong");
                card.classList.add("shake");
                playSound('wrong');
                // Highlight the correct one
                buttons.forEach(b => {
                    if (quizData[index].options[quizData[index].correctIndex] === b.innerText || b.getAttribute('onclick').includes('true')) {
                        b.style.border = "3px solid var(--correct)";
                    }
                });
            }
            
            document.getElementById(`exp-${index}`).style.display = "block";
            answeredQuestions++;
        }

        // Logic Tìm Lỗi Sai
        function selectError(index, span, isTarget, correctAns) {
            const card = document.getElementById(`card-${index}`);
            if(card.classList.contains("done")) return;

            if(isTarget) {
                span.style.background = "var(--secondary)";
                document.getElementById(`corr-box-${index}`).style.display = "flex";
            } else {
                card.classList.remove("shake");
                void card.offsetWidth; // trigger reflow
                card.classList.add("shake");
                playSound('wrong');
                span.style.color = "var(--wrong)";
            }
        }

        function checkErrorCorrection(index, correctAns) {
            const input = document.getElementById(`input-${index}`);
            const card = document.getElementById(`card-${index}`);
            let userVal = input.value.trim().toLowerCase();
            
            if(userVal === correctAns.toLowerCase()) {
                input.style.borderColor = "var(--correct)";
                input.style.background = "#e8f8f5";
                playSound('correct');
                fireConfetti();
                score++;
            } else {
                input.style.borderColor = "var(--wrong)";
                input.style.background = "#ffeaea";
                playSound('wrong');
                card.classList.add("shake");
            }
            input.disabled = true;
            card.querySelector(".btn-check").disabled = true;
            card.classList.add("done");
            document.getElementById(`exp-${index}`).style.display = "block";
            answeredQuestions++;
        }

        // Logic Viết Lại Câu
        function checkWriting(index) {
            const input = document.getElementById(`write-${index}`);
            const card = document.getElementById(`card-${index}`);
            const correctAns = quizData[index].correctAnswer;
            
            // Hàm dọn dẹp chuỗi để chấm (bỏ khoảng trắng thừa, bỏ dấu câu)
            let cleanUser = input.value.trim().toLowerCase().replace(/[.,]/g, "").replace(/\s+/g, " ");
            let cleanCorrect = correctAns.toLowerCase().replace(/[.,]/g, "").replace(/\s+/g, " ");

            if(cleanUser === cleanCorrect) {
                input.style.borderColor = "var(--correct)";
                input.style.background = "#e8f8f5";
                playSound('correct');
                fireConfetti();
                score++;
            } else {
                input.style.borderColor = "var(--wrong)";
                input.style.background = "#ffeaea";
                playSound('wrong');
                card.classList.add("shake");
            }
            input.disabled = true;
            card.querySelector(".btn-check").disabled = true;
            document.getElementById(`exp-${index}`).style.display = "block";
            answeredQuestions++;
        }

        function finishQuiz() {
            let total = quizData.length;
            let percent = Math.round((score / total) * 100);
            let praise = percent > 80 ? "XUẤT SẮC! 🎉 Em là thiên tài tiếng Anh!" : 
                         percent > 50 ? "KHÁ LẮM! 👍 Cố gắng thêm chút nữa nhé!" : 
                         "ĐỪNG BUỒN! 💪 Học tài thi phận, hãy xem kỹ phần giải thích nhé!";
            
            alert(`TỔNG KẾT ĐIỂM SỐ\n\n🎯 Số câu đúng: ${score}/${total}\n✨ Đạt: ${percent}%\n\nLời phê: ${praise}`);
        }

        // --- HỆ THỐNG PHÁO GIẤY (CONFETTI) ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let confettis = [];
        const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d'];

        function fireConfetti() {
            for(let i=0; i<50; i++) {
                confettis.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height/2 - canvas.height/2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vy: Math.random() * 5 + 2,
                    vx: Math.random() * 4 - 2,
                    rot: Math.random() * 360,
                    rotSpeed: Math.random() * 10 - 5
                });
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<confettis.length; i++) {
                let p = confettis[i];
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                ctx.restore();
                
                p.y += p.vy;
                p.x += p.vx;
                p.rot += p.rotSpeed;
            }
            confettis = confettis.filter(p => p.y < canvas.height);
            requestAnimationFrame(animateConfetti);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Khởi chạy
        renderQuiz();
        animateConfetti();

    </script>
</body>
</html>
