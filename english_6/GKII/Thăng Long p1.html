    <style>
        :root {
            --primary: #8854C0;
            --secondary: #FDCB6E;
            --tertiary: #00C9A7;
            --correct: #00D26A;
            --correct-shadow: #00994d;
            --wrong: #FF4757;
            --wrong-shadow: #cc3946;
            --bg-card: rgba(255, 255, 255, 0.96);
            --text-main: #333333;
            --btn-shadow: #d9d9d9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--tertiary), var(--secondary), #FF9A9E);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Lớp họa tiết SVG trôi nổi độc lập */
        .pattern-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;

            animation: floatPattern 40s linear infinite;
            mix-blend-mode: overlay;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatPattern {
            0% { background-position: 0 0; }
            100% { background-position: 250px -250px; }
        }

        .header-title {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 20px 0 5px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }

        .container {
            max-width: 850px;
            margin: 20px auto 100px auto;
            position: relative;
            z-index: 2;
            padding: 0 15px;
        }

        .section-title {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 800;
            margin: 30px 0 20px 0;
            box-shadow: 0 6px 0 #5f368c;
            text-transform: uppercase;
        }

            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 3px solid white;
            transition: transform 0.3s;
        }

        }

            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
            line-height: 1.5;
        }

            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        }

            border: 2px solid #e4e4e7;
            padding: 15px 20px;
            border-radius: 15px;

            font-size: 1.1rem;
            font-weight: 700;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 var(--btn-shadow);
            text-align: left;
            position: relative;
        }

        .option-btn u {
            text-decoration-color: var(--wrong);
            text-decoration-thickness: 3px;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.03);
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 2px 0 var(--btn-shadow);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: var(--correct);
            border-color: var(--correct);
            color: white;
            box-shadow: 0 6px 0 var(--correct-shadow);
            z-index: 10;
            animation: pop 0.4s ease;
        }

            background: var(--wrong);
            border-color: var(--wrong);
            color: white;
            box-shadow: 0 6px 0 var(--wrong-shadow);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .explanation-box {
            display: none;

        // --- 1. HỆ THỐNG ÂM THANH ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playDing() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function playBuzz() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function shootConfetti() {
            const colors = ['#00D26A', '#FDCB6E', '#8854C0', '#00C9A7', '#FF4757', '#FF9A9E'];
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                const duration = Math.random() * 2 + 2;
                confetti.style.animationDuration = duration + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }

                whyR: "'Palace' là cung điện (nơi ở của hoàng gia). Trong các đáp án, 'castle' (lâu đài) là từ có nét nghĩa gần gũi nhất miêu tả một công trình kiến trúc hoàng gia rộng lớn.",
                whyW: "Cung điện không thể đồng nghĩa với thủ đô, quầy hàng hay chợ nổi."
            },

            { section: "Ex 5: Mark the letter A. B, C, or D to indicate the word(s) OPPOSITE in meaning to the underlined word(s)." },
            {
                qText: "34. The most <u>interesting</u> channel for children is Disney channel.", trans: "Tìm từ <b>TRÁI NGHĨA</b> với từ gạch chân: Kênh truyền hình <u>thú vị</u> nhất dành cho trẻ em là kênh Disney.",
                opts: [
                    { t: "famous", m: "(adj): nổi tiếng", c: false },
                    { t: "live", m: "(adj): trực tiếp", c: false },
                    { t: "boring", m: "(adj): nhàm chán", c: true },
                    { t: "cute", m: "(adj): dễ thương", c: false }
                ],
                whyR: "Từ 'interesting' mang nghĩa là thú vị, hấp dẫn. Từ TRÁI NGHĨA trực tiếp với nó là 'boring' (nhàm chán).",
                whyW: "Famous hay Cute đều là những tính từ mang tính tích cực, không phải là từ trái nghĩa của thú vị."
            },
            {
                qText: "35. At the age of 15, Pele’ <u>won</u> his first World Cup.", trans: "Tìm từ <b>TRÁI NGHĨA</b> với từ gạch chân: Ở tuổi 15, Pele đã <u>giành chiến thắng</u> (vô địch) kỳ World Cup đầu tiên của mình.",
                opts: [
                    { t: "lost", m: "(v-quá khứ): đã thua, đánh mất", c: true },
                    { t: "did", m: "(v-quá khứ): đã làm", c: false },
                    { t: "played", m: "(v-quá khứ): đã chơi", c: false },
                    { t: "scored", m: "(v-quá khứ): đã ghi bàn", c: false }
                ],
                whyR: "Động từ 'won' (quá khứ của win) nghĩa là chiến thắng. Trái nghĩa hoàn toàn với chiến thắng là thất bại/thua cuộc 'lost' (quá khứ của lose).",
                whyW: "Played hay Scored là những hành động trong thể thao nhưng không mang nghĩa đối lập với chiến thắng."
            },
            {
                qText: "36. I love the <u>old</u> buildings in Edinburgh. I feel that they can tell stories.", trans: "Tìm từ <b>TRÁI NGHĨA</b> với từ gạch chân: Tôi yêu những tòa nhà <u>cổ kính</u> ở Edinburgh. Tôi cảm thấy rằng chúng có thể kể những câu chuyện.",
                opts: [
                    { t: "modern", m: "(adj): hiện đại", c: true },
                    { t: "delicious", m: "(adj): ngon miệng", c: false },
                    { t: "helpful", m: "(adj): hữu ích", c: false },
                    { t: "friendly", m: "(adj): thân thiện", c: false }
                ],
                whyR: "Từ 'old' trong ngữ cảnh các tòa nhà mang nghĩa là cũ, cổ kính. Trái nghĩa với đồ cũ/kiến trúc cổ kính chính là 'modern' (mới mẻ, hiện đại).",
                whyW: "Các tính từ khác miêu tả hương vị (ngon) hoặc tính cách con người, không áp dụng làm từ trái nghĩa cho kiến trúc."
            }
        ];

        // --- 3. ENGINE XỬ LÝ & RENDER ---
        const container = document.getElementById('quiz-container');
        let currentScore = 0;
        let answeredQuestions = 0;
        let questionCount = 0;

        function shuffleArray(array) {
            let arr = [...array];
            let currentIndex = arr.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [arr[currentIndex], arr[randomIndex]] = [arr[randomIndex], arr[currentIndex]];
            }
            return arr;
        }

        function renderQuiz() {
            rawData.forEach((item) => {
                if (item.section) {
                    const sectionTitle = document.createElement('div');
                    sectionTitle.className = 'section-title';
                    sectionTitle.innerHTML = item.section;
                    container.appendChild(sectionTitle);
                } else {
                    questionCount++;
                    const card = document.createElement('div');
                    card.className = 'question-card';
                    card.id = `card-${questionCount}`;

                    const qText = document.createElement('div');
                    qText.className = 'question-text';
                    qText.innerHTML = item.qText; 
                    card.appendChild(qText);

                    const grid = document.createElement('div');
                    grid.className = 'options-grid';

                    let shuffledOpts = shuffleArray(item.opts);
                    shuffledOpts.forEach((opt, idx) => {
                        opt.assignedLetter = String.fromCharCode(65 + idx);
                    });

                    const correctLetter = shuffledOpts.find(o => o.c).assignedLetter;
                    const wrongLetters = shuffledOpts.filter(o => !o.c).map(o => o.assignedLetter).join(", ");

                    shuffledOpts.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        // Keep HTML tags (like <u>) but add assigned letters
                        btn.innerHTML = `<b>${opt.assignedLetter}.</b> ${opt.t}`;
                        btn.onclick = () => handleMCAnswer(btn, opt, item, shuffledOpts, card, correctLetter, wrongLetters);
                        grid.appendChild(btn);
                    });

                    card.appendChild(grid);

                    const expBox = document.createElement('div');
                    expBox.className = 'explanation-box';
                    expBox.id = `exp-${questionCount}`;
                    
                    let optsExplanation = shuffledOpts.map(o => `<b>${o.assignedLetter}. ${o.t.replace(/<\/?u>/g, "")}</b>: ${o.m}`).join('<br>');

                    expBox.innerHTML = `
                        <div class="exp-title">📚 PHẦN GIẢI THÍCH CHI TIẾT:</div>
                        <div class="exp-step"><b>1. Dịch/Nhiệm vụ:</b> ${item.trans}</div>
                        <div class="exp-step"><b>2. Phân tích 4 đáp án:</b><br>${optsExplanation}</div>
                        <div class="exp-step"><b>3. Tại sao chọn ${correctLetter}?</b> ${item.whyR}</div>
                        <div class="exp-step"><b>4. Tại sao các đáp án ${wrongLetters} sai?</b> ${item.whyW}</div>
                    `;

                    card.appendChild(expBox);
                    container.appendChild(card);
                }
            });

            const submitContainer = document.createElement('div');
            submitContainer.className = 'submit-container';
            const submitBtn = document.createElement('button');
            submitBtn.className = 'submit-btn';
            submitBtn.innerHTML = 'NỘP BÀI THÔI! 🏆';
            submitBtn.onclick = showResults;
            submitContainer.appendChild(submitBtn);
            container.appendChild(submitContainer);
        }

        // --- MULTIPLE CHOICE LOGIC ---
        function handleMCAnswer(btn, optData, itemData, shuffledOpts, card, correctLetter, wrongLetters) {
            initAudio(); 
            const buttons = card.querySelectorAll('.option-btn');
            
            buttons.forEach(b => b.disabled = true);
            card.querySelector('.explanation-box').style.display = 'block';

            if (optData.c) {
                btn.classList.add('correct');
                playDing(); shootConfetti(); currentScore++;
            } else {
                btn.classList.add('wrong');
                playBuzz();
                buttons.forEach((b, idx) => { if(shuffledOpts[idx].c) b.classList.add('correct'); });
            }
            answeredQuestions++;
        }

        // --- RESULTS LOGIC ---
        function showResults() {
            if(answeredQuestions < questionCount) {
                alert(`Khoan đã! Bạn mới làm ${answeredQuestions}/${questionCount} câu. Hãy kéo lên làm nốt để xem siêu năng lực của mình nhé! 😉`);
                return;
            }
            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('score-display');
            const scoreMessage = document.getElementById('score-message');

            scoreDisplay.innerText = `${currentScore}/${questionCount}`;
            let percent = currentScore / questionCount;
            if(percent === 1) { scoreMessage.innerText = "Tuyệt đỉnh vô song! 💯 Không trật câu nào!"; shootConfetti(); shootConfetti(); playDing(); } 
            else if (percent >= 0.8) { scoreMessage.innerText = "Xuất sắc! Bạn quá siêu luôn! 🌟"; shootConfetti(); playDing(); } 
            else if (percent >= 0.5) { scoreMessage.innerText = "Làm tốt lắm! Cố gắng chút nữa là hoàn hảo! 👍"; playDing(); } 
            else { scoreMessage.innerText = "Ôi, không sao! Xem kỹ giải thích và làm lại nhé! 💪"; }
            modal.style.display = 'flex';
        }

        window.onload = renderQuiz;
    </script>
