<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color-1: #8854C0;
            --bg-color-2: #FDCB6E;
            --bg-color-3: #00C9A7;
            --correct: #00D26A;
            --wrong: #FF4757;
            --white: #ffffff;
            --text-main: #2d3436;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Họa tiết SVG vui nhộn lơ lửng */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 10 L55 40 L85 45 L55 50 L50 80 L45 50 L15 45 L45 40 Z' fill='rgba(255,255,255,0.2)'/%3E%3Ccircle cx='80' cy='80' r='8' fill='rgba(255,255,255,0.15)'/%3E%3Ccircle cx='20' cy='20' r='5' fill='rgba(255,255,255,0.15)'/%3E%3C/svg%3E");
            z-index: 0;
            pointer-events: none;
            animation: floatPattern 30s linear infinite;
        }

        @keyframes floatPattern {
            from { background-position: 0 0; }
            to { background-position: 500px 500px; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--bg-color-1);
        }

        .header h3 {
            margin: 5px 0 0 0;
            color: #636e72;
            font-size: 1rem;
        }

        .section-title {
            background: var(--white);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: 800;
            color: var(--bg-color-1);
            margin: 20px 0;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: #f1f2f6;
            border: 2px solid #dfe4ea;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #dfe4ea;
            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #dfe4ea;
            border-color: var(--bg-color-2);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #dfe4ea;
        }

        .option-btn.correct {
            background: var(--correct);
            border-color: var(--correct);
            color: white;
            box-shadow: 0 5px 0 #00A855;
        }

        .option-btn.wrong {
            background: var(--wrong);
            border-color: var(--wrong);
            color: white;
            box-shadow: 0 5px 0 #D0303E;
            animation: shake 0.4s;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fff9c4;
            border-left: 5px solid var(--bg-color-2);
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .explanation-box h4 {
            margin-top: 0;
            color: #d35400;
        }

        /* Dạng bài Reorder & Rewrite */
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            min-height: 50px;
            padding: 10px;
            background: #f1f2f6;
            border-radius: 10px;
        }

        .word-block {
            background: var(--white);
            border: 2px solid #dfe4ea;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #dfe4ea;
            user-select: none;
        }

        .word-block:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #dfe4ea;
        }

        .drop-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 60px;
            border: 2px dashed #a4b0be;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .text-input {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #dfe4ea;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            margin-bottom: 15px;
        }

        .check-btn {
            background: var(--bg-color-3);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #00997B;
            transition: all 0.2s;
        }
        
        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #00997B;
        }
        
        .check-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #00997B;
        }

        .submit-container {
            text-align: center;
            margin: 40px 0;
        }

        .submit-btn {
            background: var(--correct);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 #00A855;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 0 #00A855;
        }

        /* Popup Score */
        #score-popup {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-content h2 { font-size: 2.5rem; color: var(--bg-color-1); margin-top:0; }
        .popup-content p { font-size: 1.5rem; color: var(--text-main); font-weight: bold; }
        .btn-close-popup {
            background: var(--bg-color-2);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 0 #e1b154;
        }

        /* CSS for Q29/Q30 to mimic Gamification images */
        .decor-sign {
            display: inline-block;
            background: #ffeb3b;
            border: 3px dashed #f44336;
            padding: 10px 20px;
            border-radius: 10px;
            transform: rotate(-3deg);
            margin: 10px 0;
            font-weight: bold;
            color: #d32f2f;
        }
        .decor-phone {
            display: inline-block;
            background: #e3f2fd;
            border: 4px solid #1976d2;
            border-radius: 20px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            color: #0d47a1;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container" id="app">
        <div class="header">
            <h1>Giáo viên tạo: Ms. Chí Nên </h1>
            <h3>Bài Kiểm Tra Tiếng Anh Tương Tác</h3>
        </div>
        <div id="quiz-container"></div>
        <div class="submit-container">
            <button class="submit-btn" onclick="showFinalScore()">NỘP BÀI 🎉</button>
        </div>
    </div>

    <div id="score-popup">
        <div class="popup-content">
            <h2>Kết Quả Của Bạn!</h2>
            <p id="score-text">Đúng: 0 / 40</p>
            <p id="praise-text" style="color: var(--correct);"></p>
            <button class="btn-close-popup" onclick="document.getElementById('score-popup').style.display='none'">Xem Lại Giải Thích</button>
        </div>
    </div>

    <script>
        // --- WEB AUDIO API CHO ÂM THANH GAMIFICATION ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playDing() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playBuzz() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // --- HỆ THỐNG PHÁO GIẤY (CONFETTI) KHÔNG DÙNG THƯ VIỆN NGOÀI ---
        function shootConfetti() {
            const colors = ['#00D26A', '#FDCB6E', '#8854C0', '#FF4757', '#00C9A7'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.zIndex = 1000;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.pointerEvents = 'none';
                document.body.appendChild(confetti);

                const animationDuration = Math.random() * 2 + 1;
                confetti.animate([
                    { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*200 - 100}px, 100vh, 0) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], {
                    duration: animationDuration * 1000,
                    easing: 'cubic-bezier(.37,0,.63,1)'
                });

                setTimeout(() => confetti.remove(), animationDuration * 1000);
            }
        }

        // --- DATA BÀI TẬP VÀ GIẢI THÍCH SIÊU CHI TIẾT ---
        const rawData = [
            { section: "A. Multiple choice - Phát âm (Pronunciation)" },
            {
                q: "1. Circle the letter A, B, C or D to indicate the word whose underlined part differs from the other three in pronunciation.",
                opts: ["A. <u>th</u>eatre", "B. every<u>th</u>ing", "C. wea<u>th</u>er", "D. ba<u>th</u>room"],
                ans: "C. wea<u>th</u>er",
                exp: "<b>1. Phân tích từ vựng 4 đáp án:</b><br>A. theatre (n): rạp hát. Âm 'th' phát âm là /θ/ (âm vô thanh).<br>B. everything (pron): mọi thứ. Âm 'th' phát âm là /θ/.<br>C. weather (n): thời tiết. Âm 'th' phát âm là /ð/ (âm hữu thanh).<br>D. bathroom (n): phòng tắm. Âm 'th' phát âm là /θ/.<br><b>2. Dịch nghĩa câu hỏi:</b> Chọn từ có phần gạch chân phát âm khác với ba từ còn lại.<br><b>3. Tại sao chọn C?</b> Vì phần gạch chân của đáp án C được phát âm là /ð/ (khi phát âm dây thanh quản rung), trong khi các đáp án A, B, D đều được phát âm là /θ/ (không rung dây thanh quản).<br><b>4. Tại sao các đáp án khác sai?</b> Vì chúng có cùng cách phát âm /θ/."
            },
            {
                q: "2. Circle the letter A, B, C or D to indicate the word whose underlined part differs from the other three in pronunciation.",
                opts: ["A. t<u>ow</u>er", "B. sn<u>ow</u>y", "C. narr<u>ow</u>", "D. kn<u>ow</u>"],
                ans: "A. t<u>ow</u>er",
                exp: "<b>1. Phân tích từ vựng 4 đáp án:</b><br>A. tower (n): tòa tháp. Âm 'ow' phát âm là /aʊ/.<br>B. snowy (adj): có tuyết. Âm 'ow' phát âm là /oʊ/.<br>C. narrow (adj): chật hẹp. Âm 'ow' phát âm là /oʊ/.<br>D. know (v): biết. Âm 'ow' phát âm là /oʊ/.<br><b>2. Dịch nghĩa câu hỏi:</b> Chọn từ có phần gạch chân phát âm khác với ba từ còn lại.<br><b>3. Tại sao chọn A?</b> Vì 'ow' trong từ 'tower' được phát âm là /aʊ/ (giống âm 'ao' trong tiếng Việt), trong khi các từ còn lại phát âm là /oʊ/ (giống âm 'âu').<br><b>4. Tại sao các đáp án khác sai?</b> Vì chúng đều chung âm /oʊ/."
            },
            {
                q: "3. Circle the letter A, B, C or D to indicate the word whose underlined part differs from the other three in pronunciation.",
                opts: ["A. ch<u>a</u>mpion", "B. ch<u>a</u>nnel", "C. S<u>a</u>turday", "D. t<u>a</u>ble"],
                ans: "D. t<u>a</u>ble",
                exp: "<b>1. Phân tích từ vựng 4 đáp án:</b><br>A. champion (n): nhà vô địch. Âm 'a' phát âm là /æ/.<br>B. channel (n): kênh truyền hình. Âm 'a' phát âm là /æ/.<br>C. Saturday (n): thứ Bảy. Âm 'a' phát âm là /æ/.<br>D. table (n): cái bàn. Âm 'a' phát âm là /eɪ/.<br><b>2. Dịch nghĩa câu hỏi:</b> Chọn từ có phần gạch chân phát âm khác với ba từ còn lại.<br><b>3. Tại sao chọn D?</b> 'a' trong 'table' phát âm là /eɪ/ (âm a dài), các đáp án còn lại phát âm là /æ/ (âm a bẹt).<br><b>4. Tại sao các đáp án khác sai?</b> A, B, C cùng nhóm âm /æ/."
            },
            {
                q: "4. Circle the letter A, B, C or D to indicate the word whose underlined part differs from the other three in pronunciation.",
                opts: ["A. h<u>e</u>lpful", "B. rack<u>e</u>t", "C. ch<u>e</u>ss", "D. y<u>e</u>sterday"],
                ans: "B. rack<u>e</u>t",
                exp: "<b>1. Phân tích từ vựng 4 đáp án:</b><br>A. helpful (adj): hữu ích. Âm 'e' phát âm là /e/.<br>B. racket (n): cái vợt. Âm 'e' phát âm là /ɪ/ (hoặc /ə/ tùy vùng, nhưng khác /e/).<br>C. chess (n): cờ vua. Âm 'e' phát âm là /e/.<br>D. yesterday (adv): ngày hôm qua. Âm 'e' đầu phát âm là /e/.<br><b>2. Dịch nghĩa câu hỏi:</b> Chọn từ có phần gạch chân phát âm khác với ba từ còn lại.<br><b>3. Tại sao chọn B?</b> 'e' trong 'racket' thường được phát âm nhẹ thành /ɪ/, trong khi các từ còn lại là âm /e/ rõ ràng.<br><b>4. Tại sao các đáp án khác sai?</b> Vì A, C, D đều phát âm là /e/."
            },
            {
                q: "5. Circle the letter A, B, C or D to indicate the word whose underlined part differs from the other three in pronunciation.",
                opts: ["A. playgr<u>ou</u>nd", "B. cr<u>ow</u>ded", "C. b<u>oa</u>t", "D. <u>ou</u>tdoor"],
                ans: "C. b<u>oa</u>t",
                exp: "<b>1. Phân tích từ vựng 4 đáp án:</b><br>A. playground (n): sân chơi. Chứa âm /aʊ/.<br>B. crowded (adj): đông đúc. Chứa âm /aʊ/.<br>C. boat (n): con thuyền. Chứa âm /oʊ/.<br>D. outdoor (adj): ngoài trời. Chứa âm /aʊ/.<br><b>2. Dịch nghĩa câu hỏi:</b> Chọn từ có phần nguyên âm chứa cách phát âm khác.<br><b>3. Tại sao chọn C?</b> 'oa' trong 'boat' phát âm là /oʊ/ (âm 'âu'), còn lại đều mang âm /aʊ/ (âm 'ao').<br><b>4. Tại sao các đáp án khác sai?</b> Vì chúng cùng chung âm /aʊ/."
            },
            { section: "Trọng âm (Word Stress)" },
            {
                q: "6. Circle the letter A, B, C or D to indicate the word whose underlined part differs from the other three in the position of primary stress.",
                opts: ["A. fantastic", "B. equipment", "C. karate", "D. popular"],
                ans: "D. popular",
                exp: "<b>1. Phân tích trọng âm 4 đáp án:</b><br>A. fan'tastic (adj): tuyệt vời (Trọng âm rơi vào âm tiết 2).<br>B. e'quipment (n): trang thiết bị (Trọng âm 2).<br>C. ka'rate (n): võ karate (Trọng âm 2).<br>D. 'popular (adj): phổ biến (Trọng âm 1).<br><b>2. Dịch nghĩa câu hỏi:</b> Tìm từ có vị trí trọng âm chính khác biệt.<br><b>3. Tại sao chọn D?</b> Trọng âm của từ 'popular' rơi vào âm tiết thứ nhất, 3 từ còn lại rơi vào âm tiết thứ hai.<br><b>4. Tại sao các đáp án khác sai?</b> Cùng chung quy luật nhấn âm 2."
            },
            {
                q: "7. Circle the letter A, B, C or D to indicate the word whose underlined part differs from the other three in the position of primary stress.",

        function shuffle(array) {
            let currentIndex = array.length,  randomIndex;

                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

            el.setAttribute('onclick', `moveWord(this, '${newType}', '${actualTargetId}')`);
        };

        window.checkReorder = function(index, targetSentence) {
            if(isAnswered[`ro_${index}`]) return;
            isAnswered[`ro_${index}`] = true;

            const dropZone = document.getElementById(`drop_${index}`);
            const words = Array.from(dropZone.children).map(w => w.innerText).join(' ');
            
            // Normalize string (xóa khoảng trắng thừa)
            let userAns = words.replace(/\s+/g, ' ').trim();
            let rightAns = targetSentence.replace(/\s+/g, ' ').trim();

            // Nếu nối chuỗi mà dấu phẩy, chấm bị cách ra thì fix lại tí
            userAns = userAns.replace(/ \./g, '.').replace(/ \?/g, '?');

            const exp = document.getElementById(`exp_ro_${index}`);
            const checkBtn = document.querySelector(`#card_ro_${index} .check-btn`);
            checkBtn.style.display = 'none'; // Ẩn nút check

            if(userAns.toLowerCase() === rightAns.toLowerCase()) {
                dropZone.style.backgroundColor = '#d1ffd6';
                dropZone.style.borderColor = 'var(--correct)';
                playDing();
                shootConfetti();
                score++;
            } else {
                dropZone.style.backgroundColor = '#ffd1d1';
                dropZone.style.borderColor = 'var(--wrong)';
                dropZone.style.animation = 'shake 0.4s';
                playBuzz();
                exp.innerHTML = `<p style="color:var(--wrong)"><b>Câu bạn xếp:</b> ${userAns}</p><p style="color:var(--correct)"><b>Câu đúng phải là:</b> ${rightAns}</p>` + exp.innerHTML;
            }
            exp.style.display = 'block';
        };

        // Logic Rewrite
        window.checkRewrite = function(index, targetSentence) {
            if(isAnswered[`rw_${index}`]) return;
            isAnswered[`rw_${index}`] = true;

            const input = document.getElementById(`input_rw_${index}`);
            const userText = input.value.trim();
            const clue = rewriteData[index].clue;
            let fullUserSentence = (clue + userText).replace(/\s+/g, ' ').trim();
            let rightAns = targetSentence.replace(/\s+/g, ' ').trim();

            const exp = document.getElementById(`exp_rw_${index}`);
            const checkBtn = document.querySelector(`#card_rw_${index} .check-btn`);
            checkBtn.style.display = 'none';

            // Xóa dấu câu ở cuối để so sánh cho bao dung
            let compareUser = fullUserSentence.replace(/[.?!]/g, '').toLowerCase();
            let compareRight = rightAns.replace(/[.?!]/g, '').toLowerCase();

            input.disabled = true;

            if(compareUser === compareRight) {
                input.style.backgroundColor = '#d1ffd6';
                input.style.borderColor = 'var(--correct)';
                playDing();
                shootConfetti();
                score++;
            } else {
                input.style.backgroundColor = '#ffd1d1';
                input.style.borderColor = 'var(--wrong)';
                input.style.animation = 'shake 0.4s';
                playBuzz();
            }
            exp.style.display = 'block';
        };

        function showFinalScore() {
            const popup = document.getElementById('score-popup');
            const scoreText = document.getElementById('score-text');
            const praiseText = document.getElementById('praise-text');
            
            scoreText.innerText = `Đúng: ${score} / ${totalQuestions}`;
            
            let percentage = score / totalQuestions;
            if (percentage === 1) praiseText.innerText = "Wow! Tuyệt vời quá! Master Tiếng Anh là đây! 🏆";
            else if (percentage >= 0.8) praiseText.innerText = "Xuất sắc! Bạn làm rất tốt! 🌟";
            else if (percentage >= 0.5) praiseText.innerText = "Khá lắm! Cố gắng thêm chút nữa nha! 👍";
            else praiseText.innerText = "Đừng buồn, hãy xem kỹ phần giải thích và thử lại nhé! 💪";

            popup.style.display = 'flex';
            if(percentage >= 0.5) shootConfetti();
            else playBuzz();
        }

        // Initialize App
        window.onload = function() {
            renderMCQ();
            renderReorder();
            renderRewrite();
        };
    </script>
</body>
</html>
