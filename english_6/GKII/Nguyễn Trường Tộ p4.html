<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chí Nên  - English Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #FDCB6E;
            --accent: #00C9A7;
            --correct: #00D26A;
            --wrong: #FF4757;
            --text-color: #2D3436;
        }

        * { box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(-45deg, #8854C0, #FDCB6E, #00C9A7, #e84393);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Họa tiết lơ lửng */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2v-4h4v-2h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2v-4h4v-2H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 { color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); margin-bottom: 5px; }
        h4 { color: white; margin-top: 0; font-weight: 400; }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .exercise-title {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question-card {
            background: white;
            border: 3px solid #f0f0f0;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            transition: transform 0.3s;
            position: relative;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2d3436;
        }

        /* ABCD Buttons style */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 3px solid #e0e0e0;
            border-bottom-width: 6px;
            padding: 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover {
            transform: translateY(-2px);
            border-color: var(--secondary);
        }

        .option-btn.correct {
            background-color: var(--correct) !important;
            border-color: #00a352 !important;
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong) !important;
            border-color: #d63031 !important;
            color: white;
            animation: shake 0.4s;
        }

        /* Gap Fill Style */
        .gap-fill {
            display: inline-block;
            min-width: 120px;
            border-bottom: 3px dashed var(--primary);
            padding: 0 10px;
            cursor: pointer;
            color: var(--primary);
            font-weight: bold;
            text-align: center;
        }

        /* Explanation Box */
        .explanation {
            margin-top: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-left: 5px solid var(--accent);
            border-radius: 10px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.5s;
        }

        .explanation b { color: var(--primary); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .submit-area {
            text-align: center;
            margin-top: 30px;
        }

        .btn-submit {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #00a88b;
            transition: all 0.2s;
        }

        .btn-submit:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #00a88b;
        }

        /* Popup */
        #popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 0 100px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #popup.show { transform: translate(-50%, -50%) scale(1); }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        u { text-decoration: underline; font-weight: bold; color: #d63031; }
    </style>
</head>
<body>

    <h4>Giáo viên tạo: Ms. Chí Nên </h4>
    <h1>CHINH PHỤC TIẾNG ANH 6</h1>

    <div class="container" id="quiz-container">
        </div>

    <div class="submit-area">
        <button class="btn-submit" onclick="showFinalResult()">NỘP BÀI TẬP</button>
    </div>

    <div class="overlay" id="overlay"></div>
    <div id="popup">
        <h2 id="score-text"></h2>
        <p id="feedback-text"></p>
        <button class="btn-submit" onclick="location.reload()">LÀM LẠI</button>
    </div>

    <script>
        const quizData = [
            // Exercise 12
            {
                type: "abcd",
                exercise: "Exercise 12: Make up sentences",
                question: "1. Who / you / play rugby / with / yesterday / ?",
                options: [
                    "Who did you play rugby with yesterday?",
                    "Who you played rugby with yesterday?",
                    "Who do you play rugby with yesterday?",
                    "Who did you played rugby with yesterday?"
                ],
                correct: 0,
                explanation: "<b>1. Dịch câu:</b> Bạn đã chơi bóng bầu dục với ai vào ngày hôm qua?<br><b>2. Phân tích:</b><br>A. Đúng cấu trúc câu hỏi thì quá khứ đơn (Wh- + did + S + V-inf).<br>B. Sai vì thiếu trợ động từ 'did'.<br>C. Sai vì dùng 'do' cho quá khứ (yesterday).<br>D. Sai vì sau 'did' động từ phải giữ nguyên mẫu (play), không chia 'played'."
            },
            {
                type: "abcd",
                exercise: "Exercise 12",
                question: "2. Hoi An / famous / old houses and buildings / traditional crafts / .",
                options: [
                    "Hoi An is famous for its old houses and buildings and traditional crafts.",
                    "Hoi An famous for its old houses and buildings and traditional crafts.",
                    "Hoi An is famous with its old houses and buildings and traditional crafts.",
                    "Hoi An are famous for its old houses and buildings and traditional crafts."
                ],
                correct: 0,
                explanation: "<b>1. Dịch câu:</b> Hội An nổi tiếng với những ngôi nhà, tòa nhà cổ và các nghề thủ công truyền thống.<br><b>2. Cấu trúc:</b> To be famous FOR something (Nổi tiếng về cái gì).<br><b>3. Phân tích:</b><br>A. Đúng (Hoi An là số ít dùng 'is' + famous for).<br>B. Thiếu động từ 'is'.<br>C. Sai giới từ 'with'.<br>D. Sai vì 'Hoi An' không đi với 'are'."
            },
            {
                type: "abcd",
                exercise: "Exercise 12",
                question: "3. My mom / tired / she / not / watch / her / favorite / film / last night / .",
                options: [
                    "My mom was tired, so she didn't watch her favorite film last night.",
                    "My mom is tired, so she doesn't watch her favorite film last night.",
                    "My mom was tired, but she didn't watch her favorite film last night.",
                    "My mom was tired, so she not watched her favorite film last night."
                ],
                correct: 0,
                explanation: "<b>1. Dịch câu:</b> Mẹ tôi đã mệt, vì vậy bà ấy không xem bộ phim yêu thích vào tối qua.<br><b>2. Phân tích:</b> Dấu hiệu 'last night' -> dùng thì quá khứ đơn.<br>A. Đúng (vế đầu dùng was, vế sau dùng liên từ 'so' chỉ kết quả và phủ định 'didn't watch').<br>B. Sai thì (is/doesn't).<br>C. Sai liên từ ('but' là nhưng).<br>D. Sai cấu trúc phủ định (phải là didn't watch)."
            },
            {
                type: "abcd",
                exercise: "Exercise 12",
                question: "4. I / like / watch / programme / about / history / .",
                options: [
                    "I like watching programmes about history.",
                    "I like watch programme about history.",
                    "I like watching programme with history.",
                    "I likes watching programmes about history."
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Tôi thích xem những chương trình về lịch sử.<br><b>2. Cấu trúc:</b> Like + V-ing (sở thích).<br><b>3. Phân tích:</b><br>A. Đúng.<br>B. Sai vì sau like phải là V-ing hoặc To-V.<br>C. Sai giới từ 'with'.<br>D. Sai chia động từ (chủ ngữ 'I' không thêm 's' vào like)."
            },
            {
                type: "abcd",
                exercise: "Exercise 12",
                question: "5. not / watch / TV / until / midnight / !",
                options: [
                    "Don't watch TV until midnight!",
                    "Not watch TV until midnight!",
                    "You not watch TV until midnight!",
                    "Do watch TV until midnight!"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Đừng xem TV cho đến tận nửa đêm!<br><b>2. Cấu trúc:</b> Câu mệnh lệnh phủ định: Don't + V-inf!<br><b>3. Phân tích:</b> Chỉ có A đúng cấu trúc mệnh lệnh."
            },
            {
                type: "abcd",
                exercise: "Exercise 12",
                question: "6. What / channel / Wildlife / on / ?",
                options: [
                    "What channel is Wildlife on?",
                    "What channel Wildlife on?",
                    "What channel does Wildlife on?",
                    "What channel is Wildlife in?"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Chương trình Thế giới động vật chiếu trên kênh nào?<br><b>2. Phấu tích:</b> Khi nói chương trình chiếu trên kênh nào ta dùng 'be on channel'.<br>A. Đúng.<br>B. Thiếu động từ to be 'is'.<br>C. Sai vì 'on' không phải động từ thường để dùng 'does'.<br>D. Sai giới từ 'in'."
            },
            {
                type: "abcd",
                exercise: "Exercise 12",
                question: "7. How many / player / there / football match / ?",
                options: [
                    "How many players are there in a football match?",
                    "How many player are there in a football match?",
                    "How many players there are in a football match?",
                    "How many players is there in a football match?"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Có bao nhiêu cầu thủ trong một trận bóng đá?<br><b>2. Cấu trúc:</b> How many + N(số nhiều) + are there...?.<br><b>3. Phân tích:</b><br>A. Đúng.<br>B. Sai vì 'player' thiếu 's'.<br>C. Sai thứ tự từ trong câu hỏi (phải là are there).<br>D. Sai vì 'players' là số nhiều phải dùng 'are'."
            },
            {
                type: "abcd",
                exercise: "Exercise 12",
                question: "8. We / very tired / so / we / stop / walk / .",
                options: [
                    "We were very tired, so we stopped walking.",
                    "We were very tired, so we stopped to walk.",
                    "We very tired, so we stopped walking.",
                    "We are very tired, so we stop walk."
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Chúng tôi đã rất mệt, vì vậy chúng tôi đã dừng việc đi bộ lại.<br><b>2. Cấu trúc:</b> Stop + V-ing (dừng hẳn việc gì).<br><b>3. Phân tích:</b><br>A. Đúng (chia quá khứ đồng nhất).<br>B. Sai nghĩa (stop to walk = dừng lại để đi bộ).<br>C. Thiếu 'were'.<br>D. Sai cấu trúc 'stop walk'."
            },
            // Exercise 13
            {
                type: "abcd",
                exercise: "Exercise 13: Rewrite sentences",
                question: "1. The coat belongs to me. → It is ______.",
                options: [
                    "mine",
                    "my",
                    "me",
                    "I"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Cái áo khoác thuộc về tôi. -> Nó là của tôi.<br><b>2. Phân tích:</b><br>A. mine (đại từ sở hữu): thay thế cho 'my coat' - Đúng.<br>B. my (tính từ sở hữu): phải có danh từ theo sau.<br>C. me: tân ngữ.<br>D. I: chủ ngữ."
            },
            {
                type: "abcd",
                exercise: "Exercise 13",
                question: "2. The teacher wants her students to open their Maths books. → Teacher says: '______'",
                options: [
                    "Open your Maths books, please.",
                    "To open your Maths books.",
                    "You open your Maths books.",
                    "Opening your Maths books."
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Giáo viên muốn học sinh mở sách Toán. -> Giáo viên nói: 'Các em hãy mở sách Toán ra'.<br><b>2. Cấu trúc:</b> Câu mệnh lệnh bắt đầu bằng V-inf.<br><b>3. Phân tích:</b> A là câu mệnh lệnh lịch sự nhất và đúng ngữ pháp."
            },
            {
                type: "abcd",
                exercise: "Exercise 13",
                question: "3. This motorbike belongs to you. → This motorbike is ______.",
                options: [
                    "yours",
                    "your",
                    "you",
                    "yours motor"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Chiếc xe máy này của bạn. -> Chiếc xe máy này là của bạn.<br><b>2. Phân tích:</b> Tương tự câu 1, ta cần dùng đại từ sở hữu 'yours' để thay thế cho 'your motorbike'."
            },
            {
                type: "abcd",
                exercise: "Exercise 13",
                question: "4. When do you usually wake up in the morning? → What ______?",
                options: [
                    "time do you usually wake up in the morning",
                    "is the time you wake up",
                    "does the time you wake up",
                    "time are you usually wake up"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Bạn thường thức dậy lúc mấy giờ?<br><b>2. Phân tích:</b> 'When' có thể thay thế bằng 'What time' (mấy giờ). Cấu trúc: What time + do/does + S + V-inf?"
            },
            {
                type: "abcd",
                exercise: "Exercise 13",
                question: "5. It’s not good for children to spend too much time watching TV. → Children ______.",
                options: [
                    "shouldn't spend too much time watching television",
                    "must spend too much time watching television",
                    "don't should spend too much time watching television",
                    "shouldn't spending too much time watching television"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Trẻ em không nên dành quá nhiều thời gian xem TV.<br><b>2. Cấu trúc:</b> 'It's not good' tương đương với lời khuyên phủ định 'shouldn't + V-inf'.<br><b>3. Phân tích:</b> A đúng. D sai vì dùng V-ing sau shouldn't."
            },
            {
                type: "abcd",
                exercise: "Exercise 13",
                question: "6. You mustn’t use a mobile phone in class. → Do ______.",
                options: [
                    "not use a mobile phone in class",
                    "no use a mobile phone in class",
                    "not using a mobile phone in class",
                    "don't use a mobile phone in class"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Bạn không được dùng điện thoại trong lớp. -> Đừng dùng điện thoại trong lớp.<br><b>2. Phân tích:</b> Do not + V-inf là dạng đầy đủ của Don't + V-inf."
            },
            {
                type: "abcd",
                exercise: "Exercise 13",
                question: "7. Although he seemed a friendly person, I didn’t like him. → He seemed ______.",
                options: [
                    "a friendly person, but I didn't like him",
                    "a friendly person, so I didn't like him",
                    "a friendly person, and I didn't like him",
                    "friendly but I like him"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Mặc dù anh ấy có vẻ thân thiện, tôi vẫn không thích anh ấy.<br><b>2. Phân tích:</b> 'Although' (Mặc dù) có thể thay bằng liên từ 'but' (nhưng) ở giữa hai vế."
            },
            {
                type: "abcd",
                exercise: "Exercise 13",
                question: "8. Jim loves animals, so he likes to watch Animal programme. → Jim likes to watch Animal programme ______.",
                options: [
                    "because he loves animals",
                    "but he loves animals",
                    "so he loves animals",
                    "although he loves animals"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Jim thích xem chương trình động vật vì anh ấy yêu động vật.<br><b>2. Phân tích:</b> Vế 'Jim loves animals' là nguyên nhân, nên dùng 'because' (bởi vì)."
            },
             // Exercise 14
             {
                type: "abcd",
                exercise: "Exercise 14: Make questions for underlined part",
                question: "1. They didn't have a TV set <u>because it was too expensive</u>.",
                options: [
                    "Why didn't they have a TV set?",
                    "How didn't they have a TV set?",
                    "What didn't they have a TV set?",
                    "Why they didn't have a TV set?"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Tại sao họ không có TV?<br><b>2. Phân tích:</b> Cụm gạch chân bắt đầu bằng 'because' chỉ lý do -> Dùng từ hỏi 'Why'.<br><b>3. Cấu trúc:</b> Why + trợ động từ + S + V-inf?"
            },
            {
                type: "abcd",
                exercise: "Exercise 14",
                question: "2. The news programme often finishes <u>at eight o’clock</u>.",
                options: [
                    "What time does the news programme often finish?",
                    "What time the news programme often finishes?",
                    "When does the news programme often finishes?",
                    "What time often finishes the news programme?"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Chương trình tin tức thường kết thúc lúc mấy giờ?<br><b>2. Phân tích:</b> 'at eight o’clock' chỉ thời gian -> Dùng 'What time' hoặc 'When'.<br><b>3. Lưu ý:</b> Mượn trợ động từ 'does', động từ chính 'finish' bỏ 'es'."
            },
            {
                type: "abcd",
                exercise: "Exercise 14",
                question: "3. My family <u>usually</u> watches TV in the evening.",
                options: [
                    "How often does your family watch TV in the evening?",
                    "How usually does your family watch TV?",
                    "What does your family usually do?",
                    "How many times your family watches TV?"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Gia đình bạn có thường xuyên xem TV vào buổi tối không?<br><b>2. Phân tích:</b> 'usually' chỉ tần suất -> Dùng từ hỏi 'How often'."
            },
            {
                type: "abcd",
                exercise: "Exercise 14",
                question: "4. That newsreader usually gets to work <u>by bus</u>.",
                options: [
                    "How does that newsreader usually get to work?",
                    "What does that newsreader usually get to work?",
                    "By what does that newsreader usually get to work?",
                    "How that newsreader usually gets to work?"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Người dẫn chương trình đó thường đi làm bằng cách nào?<br><b>2. Phân tích:</b> 'by bus' chỉ phương tiện/cách thức -> Dùng từ hỏi 'How'."
            },
            {
                type: "abcd",
                exercise: "Exercise 14",
                question: "5. I went to <u>Nha Trang</u> last summer vacation.",
                options: [
                    "Where did you go last summer vacation?",
                    "When did you go to Nha Trang?",
                    "Where you went last summer vacation?",
                    "Where do you go last summer vacation?"
                ],
                correct: 0,
                explanation: "<b>1. Dịch:</b> Bạn đã đi đâu vào kỳ nghỉ hè năm ngoái?<br><b>2. Phân tích:</b> 'Nha Trang' là địa điểm -> Dùng 'Where'. Quá khứ 'went' mượn trợ động từ 'did'."
            },
            // Exercise 15
            {
                type: "abcd",
                exercise: "Exercise 15: Combine sentences",
                question: "1. Your arguments are strong. They don’t convince me. (but)",
                options: [
                    "Your arguments are strong, but they don’t convince me.",
                    "Your arguments are strong but don’t convince me.",
                    "Both A and B are correct.",
                    "Your arguments are strong, and they don’t convince me."
                ],
                correct: 2,
                explanation: "<b>1. Dịch:</b> Lý lẽ của bạn rất mạnh mẽ, nhưng chúng không thuyết phục được tôi.<br><b>2. Phân tích:</b> 'But' nối hai vế đối lập. Ta có thể giữ lại chủ ngữ hoặc lược bỏ nếu cùng chủ ngữ (ở đây 'they' thay cho 'arguments'). Cả A và B đều đúng."
            },
            {
                type: "abcd",
                exercise: "Exercise 15",
                question: "2. I work in a restaurant. She works in the same restaurant. (and)",
                options: [
                    "I and she work in the same restaurant.",
                    "She and I work in the same restaurant.",
                    "I work in a restaurant and she works in the same restaurant.",
                    "All are correct."
                ],
                correct: 3,
                explanation: "<b>1. Dịch:</b> Tôi và cô ấy làm việc trong cùng một nhà hàng.<br><b>2. Phân tích:</b> 'And' dùng để nối hai thông tin tương đồng. Các cách viết trên đều đúng ngữ pháp và truyền đạt đủ ý."
            }
        ];

        let currentScore = 0;
        const quizContainer = document.getElementById('quiz-container');

        // Âm thanh
        function playSound(type) {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            const gain = context.createGain();
            osc.connect(gain);
            gain.connect(context.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, context.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, context.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.3);
                osc.start();
                osc.stop(context.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, context.currentTime);
                gain.gain.setValueAtTime(0.5, context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.3);
                osc.start();
                osc.stop(context.currentTime + 0.3);
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function renderQuiz() {
            let currentExercise = "";
            quizData.forEach((q, index) => {
                if (q.exercise !== currentExercise) {
                    currentExercise = q.exercise;
                    const exHeader = document.createElement('div');
                    exHeader.className = 'exercise-title';
                    exHeader.innerText = currentExercise;
                    quizContainer.appendChild(exHeader);
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-${index}`;

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = q.question;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                // Lưu index đáp án đúng sau khi shuffle
                const options = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
                shuffle(options);

                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.text;
                    btn.onclick = () => checkAnswer(index, opt.isCorrect, btn);
                    optionsGrid.appendChild(btn);
                });

                card.appendChild(optionsGrid);

                const expl = document.createElement('div');
                expl.className = 'explanation';
                expl.id = `expl-${index}`;
                expl.innerHTML = q.explanation;
                card.appendChild(expl);

                quizContainer.appendChild(card);
            });
        }

        function checkAnswer(qIdx, isCorrect, btn) {
            const card = document.getElementById(`q-${qIdx}`);
            const buttons = card.querySelectorAll('.option-btn');
            const expl = document.getElementById(`expl-${qIdx}`);

            // Ngăn chọn lại
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                playSound('correct');
                confetti({
                    particleCount: 50,
                    spread: 70,
                    origin: { y: 0.6 }
                });
                currentScore++;
            } else {
                btn.classList.add('wrong');
                playSound('wrong');
                // Hiện đáp án đúng
                buttons.forEach(b => {
                    // Trong logic này ta so sánh text để tìm đáp án đúng gốc
                    const originalCorrectText = quizData[qIdx].options[quizData[qIdx].correct];
                    if (b.innerText === originalCorrectText) {
                        b.classList.add('correct');
                    }
                });
            }

            expl.style.display = 'block';
        }

        function showFinalResult() {
            const popup = document.getElementById('popup');
            const overlay = document.getElementById('overlay');
            const scoreText = document.getElementById('score-text');
            const feedbackText = document.getElementById('feedback-text');

            overlay.style.display = 'block';
            popup.classList.add('show');
            
            scoreText.innerText = `Điểm của em: ${currentScore}/${quizData.length}`;
            
            if (currentScore === quizData.length) {
                feedbackText.innerText = "Xuất sắc! Em là một thiên tài tiếng Anh! 🌟";
            } else if (currentScore > quizData.length / 2) {
                feedbackText.innerText = "Làm tốt lắm! Cố gắng phát huy em nhé! 👍";
            } else {
                feedbackText.innerText = "Đừng buồn nhé, xem kỹ phần giải thích và thử lại nào! 💪";
            }
        }

        renderQuiz();
    </script>
</body>
</html>
