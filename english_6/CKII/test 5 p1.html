<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đề 05 – Tiếng Anh HK2 – Global Success 6</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --teal1:   #8bdeda;
  --teal2:   #43add0;
  --purple:  #998ee0;
  --pink:    #e17dc2;
  --coral:   #ef9393;
  --correct: #00D26A;
  --wrong:   #FF4757;
  --dark:    rgba(8,22,30,0.68);
  --dark2:   rgba(6,14,24,0.90);
  --border:  rgba(255,255,255,0.22);
  --radius:  18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  background: #050f18;
  position: relative;
}

/* ── Animated gradient ── */
.bg-gradient {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(130deg,
    #8bdeda, #43add0, #998ee0,
    #e17dc2, #ef9393, #8bdeda, #43add0, #998ee0);
  background-size: 500% 500%;
  animation: bgFlow 14s ease infinite;
}
@keyframes bgFlow {
  0%   { background-position: 0% 60%; }
  50%  { background-position: 100% 40%; }
  100% { background-position: 0% 60%; }
}

/* ── Sea Animals SVG layer (Bottom to Top) ── */
.nature-layer {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none; overflow: hidden;
}
.floating-item {
  position: absolute;
  bottom: -120px; /* Bắt đầu từ dưới đáy */
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(0) rotate(-15deg) scale(0.8); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-120vh) rotate(20deg) scale(1.1); opacity: 0; }
}

/* ── Wrapper ── */
.wrapper {
  position: relative; z-index: 2;
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 16px 60px;
}

/* ── Header ── */
.header {
  text-align: center;
  padding: 14px 20px 12px;
  background: var(--dark);
  backdrop-filter: blur(20px);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
}
.header .creator {
  font-size: .78rem; color: var(--teal1);
  font-weight: 700; letter-spacing: .6px;
}
.header h1 {
  font-size: 1.25rem; font-weight: 900;
  color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.5);
  line-height: 1.3; margin-top: 2px;
}
.header h2 {
  font-size: .9rem; color: rgba(255,255,255,.8);
  font-weight: 600; margin-top: 3px;
}

/* ── Progress ── */
.progress-bar-wrap {
  background: rgba(255,255,255,.18);
  border-radius: 20px; height: 10px;
  margin-bottom: 18px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 20px;
  background: linear-gradient(90deg, var(--teal1), var(--purple));
  transition: width .4s ease;
}

/* ── Section title ── */
.section-title {
  font-size: .88rem; font-weight: 800;
  color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5);
  background: rgba(0,0,0,.28);
  backdrop-filter: blur(8px);
  border-radius: 10px;
  padding: 6px 14px;
  margin: 20px 0 10px;
  border-left: 4px solid var(--teal1);
}

/* ── Question card ── */
.q-card {
  background: var(--dark);
  backdrop-filter: blur(18px);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 18px 14px;
  margin-bottom: 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
.q-label {
  font-size: .78rem; font-weight: 800;
  color: var(--teal1); text-transform: uppercase;
  letter-spacing: .6px; margin-bottom: 6px;
}
.q-text {
  font-size: 1.15rem; font-weight: 700;
  color: #fff; margin-bottom: 14px;
  line-height: 1.55;
  text-shadow: 0 1px 5px rgba(0,0,0,.55);
}
.q-text u { text-underline-offset: 3px; }

/* sign/notice box */
.sign-box {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 14px; flex-wrap: wrap;
}
/* EXIT sign */
.sign-exit {
  background: #1a7a1a; border: 3px solid #fff;
  border-radius: 8px; padding: 12px 18px;
  display: flex; align-items: center; gap: 10px;
  min-width: 160px;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
}
.sign-exit-text {
  display: flex; flex-direction: column;
  align-items: flex-start;
}
.sign-exit-icon { font-size: 2.2rem; }
.sign-exit-arrow { font-size: 1.8rem; color: #fff; font-weight: 900; }
/* WET PAINT sign */
.sign-wetpaint {
  background: #fff; border: 3px solid #1a6eb5;
  border-radius: 12px; padding: 10px 16px;
  min-width: 150px; text-align: center;
  box-shadow: 0 4px 14px rgba(0,0,0,.3);
  font-family: 'Nunito', sans-serif;
}
.sign-wetpaint .wp-title {
  background: #1a6eb5; color: #fff;
  font-size: 1.1rem; font-weight: 900;
  padding: 4px 10px; border-radius: 6px;
  letter-spacing: 1px; margin-bottom: 8px;
}
.sign-wetpaint .wp-bottom {
  display: flex; align-items: center; gap: 8px; justify-content: center;
}
.sign-wetpaint .wp-no {
  width: 38px; height: 38px;
  border: 3px solid #e00; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; position: relative;
}
.sign-wetpaint .wp-no::after {
  content: ''; position: absolute;
  width: 42px; height: 3px;
  background: #e00;
  transform: rotate(-45deg);
}
.sign-wetpaint .wp-word { font-size: 1rem; font-weight: 900; color: #111; }

/* ── Sentence list box ── */
.sentences-box {
  background: rgba(255,255,255,.09);
  border-radius: 12px; padding: 12px 16px;
  margin-bottom: 14px;
  border: 1px solid rgba(255,255,255,.15);
}
.sentences-box p {
  font-size: .97rem; color: rgba(255,255,255,.93);
  margin-bottom: 6px; font-weight: 600;
  line-height: 1.5;
}

/* ── Answer buttons ── */
.answers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media(max-width:520px){ .answers-grid { grid-template-columns: 1fr; } }

.ans-btn {
  background: rgba(255,255,255,.92);
  border: none; border-radius: 16px;
  padding: 12px 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.05rem; font-weight: 700;
  color: #1a1a2e; cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,.22), 0 2px 14px rgba(0,0,0,.14);
  transition: transform .15s, box-shadow .15s;
  text-align: left; line-height: 1.45;
}
.ans-btn:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 10px 0 rgba(0,0,0,.18), 0 4px 20px rgba(0,0,0,.15);
}
.ans-btn:disabled { cursor: default; }
.ans-btn.correct {
  background: var(--correct) !important; color: #fff !important;
  box-shadow: 0 6px 0 #00974a, 0 2px 18px rgba(0,210,106,.55) !important;
}
.ans-btn.wrong {
  background: var(--wrong) !important; color: #fff !important;
  box-shadow: 0 6px 0 #b5002d, 0 2px 18px rgba(255,71,87,.4) !important;
  animation: shake .4s ease;
}
.ans-btn.reveal-correct {
  background: rgba(0,210,106,.25) !important; color: #fff !important;
  border: 2px solid var(--correct);
}
@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%{ transform: translateX(-7px); }
  40%{ transform: translateX(7px); }
  60%{ transform: translateX(-4px); }
  80%{ transform: translateX(4px); }
}

/* ── Explanation ── */
.explanation {
  margin-top: 12px;
  background: var(--dark2);
  backdrop-filter: blur(18px);
  border-radius: 14px;
  padding: 16px 18px;
  font-size: 1rem;
  color: #eef4ff;
  line-height: 1.88;
  border-left: 4px solid var(--teal1);
  box-shadow: 0 4px 22px rgba(0,0,0,.45);
  display: none;
}
.explanation.show { display: block; animation: fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:none} }

.explanation b { color: #8bdeda; font-weight: 800; }
.vi-translation {
  background: rgba(225,125,194,.15);
  border-left: 4px solid var(--pink);
  border-radius: 8px;
  padding: 8px 14px;
  margin: 10px 0;
  font-weight: 700;
  color: #f7cfe8;
  font-size: 1rem;
  line-height: 1.6;
}

/* color helpers */
.p-word     { color: #7de8e8; font-weight: 800; }
.p-phonetic { background: rgba(153,142,224,.28); color: #d8d0ff; border-radius: 4px; padding: 1px 6px; font-weight: 700; }
.p-mean     { color: #ffd0a0; font-weight: 800; }
.p-grammar  { text-decoration: underline; text-decoration-color: #ef9393; color: #ffc6c6; font-weight: 800; }
.hl-green   { color: #4dffb0; font-weight: 900; }
.hl-red     { color: #ff8fa0; text-decoration: line-through; font-weight: 800; }

/* ── Submit ── */
.submit-wrap { text-align: center; margin: 30px 0 10px; }
.submit-btn {
  background: linear-gradient(135deg, var(--teal2), var(--purple));
  color: #fff; font-family: 'Nunito', sans-serif;
  font-size: 1.15rem; font-weight: 900;
  border: none; border-radius: 50px;
  padding: 16px 44px; cursor: pointer;
  box-shadow: 0 8px 0 rgba(30,60,100,.3), 0 4px 28px rgba(67,173,208,.5);
  transition: transform .15s, box-shadow .15s;
  letter-spacing: .4px;
}
.submit-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 0 rgba(30,60,100,.25), 0 6px 32px rgba(67,173,208,.55); }

/* ── Modals (Password, Name, Result) ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-box {
  background: linear-gradient(145deg, rgba(8,22,40,.92), rgba(20,10,40,.88));
  backdrop-filter: blur(28px);
  border: 2px solid rgba(139,222,218,.35);
  border-radius: 24px;
  padding: 30px 28px;
  max-width: 440px; width: 100%;
  text-align: center;
  box-shadow: 0 24px 64px rgba(0,0,0,.5);
}
.modal-box h3, .modal-box .pw-title { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 900; color: var(--teal1); margin-bottom: 10px; letter-spacing: 1px;}
.modal-box p { color: rgba(255,255,255,.8); font-size: 1rem; margin-bottom: 16px; font-weight: 600;}
.modal-input {
  width: 100%; border: 2.5px solid rgba(139,222,218,.45);
  border-radius: 14px; padding: 12px 16px;
  font-size: 1.1rem; font-family: 'Nunito', sans-serif; font-weight: 700;
  background: rgba(255,255,255,.1); color: #fff;
  outline: none; margin-bottom: 14px;
  transition: border-color .2s; text-align: center; letter-spacing: 2px;
}
.modal-input::placeholder { color: rgba(255,255,255,.4); letter-spacing: 1px; font-weight: 500;}
.modal-input:focus { border-color: var(--teal1); box-shadow: 0 0 0 4px rgba(139,222,218,0.2); }
.modal-input.error { border-color: var(--wrong); box-shadow: 0 0 0 4px rgba(255,71,87,0.25); animation: shake .4s ease; }
.modal-confirm {
  background: linear-gradient(135deg, var(--teal1), var(--teal2));
  color: #0a1a22; font-family: 'Nunito', sans-serif;
  font-size: 1.05rem; font-weight: 900;
  border: none; border-radius: 14px;
  padding: 13px 32px; cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,.25);
  width: 100%; transition: transform 0.1s;
}
.modal-confirm:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

.result-score {
  font-size: 3rem; font-weight: 900;
  background: linear-gradient(135deg, var(--teal1), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin: 10px 0;
}
.result-msg { font-size: 1.2rem; font-weight: 800; color: #fff; margin-bottom: 10px; }
.result-gif {
  border-radius: 16px; max-width: 220px;
  box-shadow: 0 8px 28px rgba(0,0,0,.4);
  margin: 10px auto; display: block;
}
.retry-btn {
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: #fff; font-family: 'Nunito', sans-serif;
  font-size: 1rem; font-weight: 900;
  border: none; border-radius: 14px;
  padding: 12px 30px; cursor: pointer;
  margin-top: 14px; box-shadow: 0 5px 0 rgba(0,0,0,.25);
}

#confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
.hidden { display: none !important; }
</style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>



<div class="bg-gradient"></div>
<div class="nature-layer" id="natureLayer"></div>
<canvas id="confetti-canvas"></canvas>

<div class="wrapper hidden" id="mainContent">
  <div class="header">
    <div class="creator">🐠 Giáo viên tạo: Ms. Chí Nên · ☎️ 0852639652 🐠</div>
    <h1>ĐỀ 05 – ĐỀ THI CUỐI KỲ HỌC KỲ 2</h1>
    <h2>Global Success 6 · Môn Tiếng Anh</h2>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>

  <div id="questionsContainer"></div>

  <div class="submit-wrap">
    <button class="submit-btn" onclick="openNameModal()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>
</div>

<div class="modal-overlay hidden" id="nameModal">
  <div class="modal-box">
    <h3>📝 Nhập tên của con</h3>
    <p>Điền tên để nhận kết quả cá nhân hoá nhé!</p>
    <input class="modal-input" id="nameInput" type="text" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50">
    <div id="nameError" style="color:var(--wrong);font-size:.9rem;margin:-8px 0 10px;display:none;font-weight:700;">⚠️ Con chưa nhập tên kìa!</div>
    <button class="modal-confirm" onclick="submitQuiz()">🚀 XEM KẾT QUẢ!</button>
  </div>
</div>

<div class="modal-overlay hidden" id="resultModal">
  <div class="modal-box">
    <div id="resultGreet" class="result-msg"></div>
    <div class="result-score" id="resultScore"></div>
    <div id="resultEmoji" style="font-size:2.5rem;margin:6px 0;"></div>
    <img id="resultGif" class="result-gif" src="" alt="result gif">
    <br>
    <button class="retry-btn" onclick="retryQuiz()">🔄 LÀM LẠI BÀI</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  BẢO MẬT & ÂM THANH
// ══════════════════════════════════════════════
const introSound = new Audio('https:
const wrongSound = new Audio('https:

const _k  = [99,111,109,97,105,97,110,117,108,105,115]; 
const _pw = _k.map(c => String.fromCharCode(c)).join('');

function checkPassword() {
  const inp = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');
  if (inp.value === _pw) {
    document.getElementById('passwordModal').style.display = 'none';
    document.getElementById('mainContent').classList.remove('hidden');
    introSound.play().catch(e => console.log(e));
  } else {
    inp.classList.add('error');
    err.style.display = 'block';
    setTimeout(() => inp.classList.remove('error'), 400);
  }
}

document.getElementById('pwInput').addEventListener('keydown', e => { 
  if (e.key === 'Enter') checkPassword(); 
});

// ══════════════════════════════════════════════
//  SEA ANIMALS FLOATING (Bottom to top)
// ══════════════════════════════════════════════
(function(){
  const layer = document.getElementById('natureLayer');
  const animals = [
    // fish
    `<svg width="60" height="40" viewBox="0 0 60 40"><ellipse cx="28" cy="20" rx="22" ry="12" fill="#8bdeda" opacity=".8"/><polygon points="50,20 62,8 62,32" fill="#998ee0" opacity=".8"/><circle cx="14" cy="16" r="3" fill="#fff" opacity=".9"/><circle cx="13" cy="16" r="1.2" fill="#333"/><path d="M28 8 Q36 4 44 8" stroke="#e17dc2" stroke-width="2" fill="none"/><path d="M28 32 Q36 36 44 32" stroke="#e17dc2" stroke-width="2" fill="none"/></svg>`,
    // crab
    `<svg width="55" height="45" viewBox="0 0 55 45"><ellipse cx="27" cy="26" rx="18" ry="12" fill="#ef9393" opacity=".9"/><circle cx="19" cy="18" r="5" fill="#e17dc2" opacity=".9"/><circle cx="35" cy="18" r="5" fill="#e17dc2" opacity=".9"/><line x1="9" y1="26" x2="0" y2="18" stroke="#ef9393" stroke-width="3" stroke-linecap="round"/><line x1="45" y1="26" x2="54" y2="18" stroke="#ef9393" stroke-width="3" stroke-linecap="round"/><circle cx="22" cy="17" r="2" fill="#fff"/><circle cx="22" cy="17" r="1" fill="#333"/><circle cx="32" cy="17" r="2" fill="#fff"/><circle cx="32" cy="17" r="1" fill="#333"/></svg>`,
    // jellyfish
    `<svg width="50" height="65" viewBox="0 0 50 65"><ellipse cx="25" cy="22" rx="22" ry="18" fill="#998ee0" opacity=".8"/><line x1="15" y1="40" x2="10" y2="65" stroke="#998ee0" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity=".6"/><line x1="22" y1="40" x2="20" y2="65" stroke="#8bdeda" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity=".6"/><line x1="28" y1="40" x2="30" y2="65" stroke="#998ee0" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity=".6"/><line x1="35" y1="40" x2="40" y2="65" stroke="#8bdeda" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity=".6"/><circle cx="18" cy="18" r="3" fill="rgba(255,255,255,.5)"/></svg>`,
    // starfish
    `<svg width="56" height="56" viewBox="0 0 56 56"><polygon points="28,2 33,20 52,20 38,31 43,50 28,39 13,50 18,31 4,20 23,20" fill="#e17dc2" opacity=".8"/><circle cx="28" cy="28" r="8" fill="#ef9393" opacity=".9"/></svg>`,
    // seahorse
    `<svg width="38" height="60" viewBox="0 0 38 60"><path d="M19 5 Q30 8 28 18 Q34 22 30 30 Q28 42 18 48 Q10 54 12 60" stroke="#43add0" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="19" cy="5" r="7" fill="#8bdeda" opacity=".9"/><circle cx="17" cy="3" r="2" fill="#fff"/><circle cx="17" cy="3" r="1" fill="#333"/></svg>`,
    // bubble
    `<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/><circle cx="10" cy="10" r="3" fill="rgba(255,255,255,.4)"/></svg>`
  ];

  for(let i=0; i<15; i++) {
    let el = document.createElement('div');
    el.className = 'floating-item';
    el.innerHTML = animals[Math.floor(Math.random() * animals.length)];
    el.style.left = Math.random() * 95 + 'vw';
    el.style.animationDuration = (Math.random() * 10 + 10) + 's';
    el.style.animationDelay = (Math.random() * 15) + 's';
    layer.appendChild(el);
  }
})();

// ══════════════════════════════════════════════
//  QUIZ DATA (Loại bỏ hoàn toàn A, B, C, D)
// ══════════════════════════════════════════════
const questions = [
  // ── SECTION 1 ──
  {
    section: "PHẦN 1: PHONETICS – Phát âm khác nhau",
    id: 1,
    text: "Chọn từ có phần gạch chân phát âm KHÁC với 3 từ còn lại:<br>cr<u>ow</u>d &nbsp;&bull;&nbsp; c<u>ow</u> &nbsp;&bull;&nbsp; sn<u>ow</u> &nbsp;&bull;&nbsp; sh<u>ow</u>er",
    answers: [
      { text: "cr<u>ow</u>d", correct: false },
      { text: "c<u>ow</u>", correct: false },
      { text: "sn<u>ow</u> ✓", correct: true },
      { text: "sh<u>ow</u>er", correct: false },
    ],
    explanation: `<b>🔤 Phân tích phát âm "ow":</b><br>
<div class="vi-translation">Dịch đề: Từ nào có phần gạch chân phát âm KHÁC với 3 từ còn lại?</div>
• cr<span class='p-word'>ow</span>d → <span class='p-phonetic'>/aʊ/</span> – <span class='p-mean'>đám đông</span><br>
• c<span class='p-word'>ow</span> → <span class='p-phonetic'>/aʊ/</span> – <span class='p-mean'>con bò</span><br>

<span class='p-grammar'>If + S + V(htđ), S + will + V</span><br>
• <span class='hl-red'>"won't go skiing"</span> – phủ định, ngược nghĩa gốc<br>

<br><span class='hl-green'>✅ Lưu ý:</span> Mệnh đề <span class='p-word'>if</span> dùng <b>hiện tại đơn</b>, KHÔNG dùng "will/won't" dù nói về tương lai!`

<div class="vi-translation">Dịch: "Sue và các bạn đang tập yoga tại phòng gym lúc này."</div>
Dấu hiệu: <span class='p-word'>now</span> → dùng <span class='p-grammar'>hiện tại tiếp diễn: S + am/is/are + V-ing</span><br>
"the gym" = địa điểm (at the gym), không phải hoạt động thứ 2<br>
• <span class='hl-red'>do yoga and go to the gym</span> – hiện tại đơn, sai thì<br>

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let answered = {}, scores = {};

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function renderQuiz() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  let curSection = '';

  questions.forEach(q => {
    if (q.section && q.section !== curSection) {
      curSection = q.section;
      const st = document.createElement('div');
      st.className = 'section-title';
      st.textContent = '📌 ' + q.section;
      container.appendChild(st);
    }

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'qcard-' + q.id;

    const label = document.createElement('div');
    label.className = 'q-label';
    label.textContent = 'Câu ' + q.id;
    card.appendChild(label);

    if (q.text) {
      const qt = document.createElement('div');
      qt.className = 'q-text';
      qt.innerHTML = q.text;
      card.appendChild(qt);
    }

    if (q.customHTML) {
      const cd = document.createElement('div');
      cd.innerHTML = q.customHTML;
      card.appendChild(cd);
    }

    const shuffled = shuffleArray(q.answers.map(a => ({ ...a })));
    const grid = document.createElement('div');
    grid.className = 'answers-grid';

    shuffled.forEach(ans => {
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn._isCorrect = ans.correct;
      btn.innerHTML = ans.text.replace(' ✓', ''); // Xóa dấu tích nếu có
      btn.onclick = () => handleAnswer(q.id, ans.correct, btn, grid);
      grid.appendChild(btn);
    });
    card.appendChild(grid);

    const expl = document.createElement('div');
    expl.className = 'explanation';
    expl.id = 'expl-' + q.id;
    expl.innerHTML = q.explanation;
    card.appendChild(expl);

    container.appendChild(card);
  });

  updateProgress();
}

function handleAnswer(qid, isCorrect, btn, grid) {
  if (answered[qid]) return;
  answered[qid] = true;
  scores[qid] = isCorrect;

  Array.from(grid.querySelectorAll('.ans-btn')).forEach(b => {
    b.disabled = true;
    if (b === btn) {
      b.classList.add(isCorrect ? 'correct' : 'wrong');
    } else if (b._isCorrect) {
      b.classList.add('reveal-correct');
    }
  });

  isCorrect ? (playSound('correct'), launchConfetti()) : playSound('wrong');

  const expl = document.getElementById('expl-' + qid);
  expl.classList.add('show');
  updateProgress();
  setTimeout(() => expl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);
}

function updateProgress() {
  document.getElementById('progressBar').style.width =
    (Object.keys(answered).length / questions.length * 100) + '%';
}

// ══════════════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════════════
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if (type === 'wrong') {
    wrongSound.currentTime = 0;
    wrongSound.play().catch(e => console.log(e));
  } else {
    try {
      const osc = AC.createOscillator();
      const gain = AC.createGain();
      osc.connect(gain); gain.connect(AC.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, AC.currentTime);
      osc.frequency.setValueAtTime(554, AC.currentTime + 0.1);
      osc.frequency.setValueAtTime(659, AC.currentTime + 0.2);
      osc.frequency.setValueAtTime(880, AC.currentTime + 0.3);
      gain.gain.setValueAtTime(0.28, AC.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.55);
      osc.start(); osc.stop(AC.currentTime + 0.55);
    } catch(e) {}
  }
}

// ══════════════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════════════
const cc = document.getElementById('confetti-canvas');
const cx = cc.getContext('2d');
let cParts = [], cAnim = null;
const cColors = ['#8bdeda','#43add0','#998ee0','#e17dc2','#ef9393','#fff9a0'];

function launchConfetti() {
  cc.width = window.innerWidth; cc.height = window.innerHeight;
  for (let i = 0; i < 70; i++) {
    cParts.push({
      x: Math.random() * cc.width, y: -10,
      r: Math.random() * 7 + 3,
      color: cColors[Math.floor(Math.random() * cColors.length)],
      vx: Math.random() * 3 - 1.5, vy: Math.random() * 4 + 2,
      rot: Math.random() * 360, rotV: Math.random() * 6 - 3,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }
  if (!cAnim) animConf();
}

function animConf() {
  cx.clearRect(0, 0, cc.width, cc.height);
  cParts.forEach(p => {
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot * Math.PI / 180);
    cx.fillStyle = p.color;
    if (p.shape === 'rect') cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
    else { cx.beginPath(); cx.arc(0, 0, p.r, 0, Math.PI * 2); cx.fill(); }
    cx.restore();
    p.x += p.vx; p.y += p.vy; p.rot += p.rotV; p.vy += 0.06;
  });
  cParts = cParts.filter(p => p.y < cc.height + 20);
  cAnim = cParts.length > 0 ? requestAnimationFrame(animConf) : null;
  if (!cAnim) cx.clearRect(0, 0, cc.width, cc.height);
}

// ══════════════════════════════════════════════
//  MODAL / SUBMIT
// ══════════════════════════════════════════════
function openNameModal() {
  document.getElementById('nameModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('nameInput').focus(), 100);
}

function submitQuiz() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) {
    input.classList.add('error');
    document.getElementById('nameError').style.display = 'block';
    return;
  }
  input.classList.remove('error');
  document.getElementById('nameError').style.display = 'none';

  const correct = Object.values(scores).filter(Boolean).length;
  const total = questions.length;
  const pct = correct / total;

  let greet, emoji, gifSrc;
  if (pct === 1) {
    greet = `🌺 TUYỆT VỜI! ${name} đạt điểm tối đa! 🏆`;
    emoji = '🥳🎉🌟'; gifSrc = 'https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';
  } else if (pct >= 0.6) {
    greet = `🌿 Khá lắm! ${name} làm tốt rồi!`;
    emoji = '👍✨🌸'; gifSrc = 'https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif';
  } else {
    greet = `🌱 Cố lên nhé, ${name}! Ôn thêm một chút nữa thôi!`;
    emoji = '💪😅🌱'; gifSrc = 'https://media.giphy.com/media/26FLdmIp6wJr91JAI/giphy.gif';
  }

  document.getElementById('nameModal').classList.add('hidden');
  document.getElementById('resultGreet').textContent = greet;
  document.getElementById('resultScore').textContent = correct + ' / ' + total;
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultGif').src = gifSrc;
  document.getElementById('resultModal').classList.remove('hidden');
  if (pct === 1) [0, 700, 1400].forEach(d => setTimeout(launchConfetti, d));
}

function retryQuiz() {
  answered = {}; scores = {};
  document.getElementById('resultModal').classList.add('hidden');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── INIT ──
renderQuiz();
</script>
