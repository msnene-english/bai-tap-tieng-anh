    <style>
        /* CSS VARIABLES & THEME */
        :root {
            --pastel-pink: #FFD1DC;
            --pastel-blue: #AEC6CF;
            --pastel-mint: #98FF98;
            --pastel-yellow: #FDFD96;
            --pastel-purple: #C3B1E1;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-dark: #2C3E50;
            --word-color: #0984e3;
            --mean-color: #d35400;
            --grammar-color: #e74c3c;
            --correct-color: #27ae60;
            --incorrect-color: #c0392b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(45deg, var(--pastel-pink), var(--pastel-blue), var(--pastel-purple), var(--pastel-mint));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* FLOATING BACKGROUND EMOJIS */
        .floating-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        .float-emoji {
            position: absolute; font-size: 3rem; opacity: 0.4;
            animation: floatUp 20s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* GLASSMORPHISM UTILITIES */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        /* HEADER */
        header {
            text-align: center; padding: 10px;
            position: fixed; top: 0; width: 100%; height: 60px;
            z-index: 10; display: flex; justify-content: center; align-items: center;
        }
        header h2 { font-size: 1.2rem; font-weight: 800; color: #fff; text-shadow: 1px 1px 4px rgba(0,0,0,0.2); }
        .author { font-size: 0.9rem; background: rgba(255,255,255,0.7); padding: 4px 12px; border-radius: 12px; margin-left: 10px; color: var(--text-dark); }

        /* SPLIT SCREEN LAYOUT */
        .container {
            display: flex; height: calc(100vh - 60px); margin-top: 60px; padding: 15px; gap: 15px;
        }
        .left-pane, .right-pane {
            flex: 1; overflow-y: auto; padding: 20px;
            border-radius: 24px;
        }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.8); border-radius: 10px; }

        /* READING PASSAGE STYLES */
        .passage { margin-bottom: 30px; padding: 20px; background: rgba(255,255,255,0.5); border-radius: 16px; }
        .passage-title { font-weight: 900; font-size: 1.5rem; text-align: center; margin-bottom: 15px; color: #8e44ad; }
        .passage-content { font-size: 1.2rem; line-height: 1.8; margin-bottom: 15px; }
        
        .btn-translate {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            border: none; padding: 8px 16px; border-radius: 20px; color: white;
            font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s;
            margin-bottom: 10px;
        }
        .btn-translate:hover { transform: translateY(-2px); }
        .translation-box {
            display: none; background: rgba(255,255,255,0.8); padding: 15px;
            border-left: 4px solid #a18cd1; border-radius: 8px; font-style: italic;
            margin-bottom: 15px;
        }

        /* GLOSSARY */
        .glossary { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 1rem; background: rgba(255,255,255,0.6); border-radius: 12px; overflow: hidden; }
        .glossary th, .glossary td { padding: 10px; border: 1px solid rgba(255,255,255,0.9); text-align: left; }
        .glossary th { background: #fdcb6e; color: #2d3436; }
        .glossary tr:nth-child(even) { background: rgba(255,255,255,0.4); }

        /* QUIZ STYLES */
        .question-card { margin-bottom: 20px; padding: 20px; background: rgba(255,255,255,0.6); border-radius: 16px; }
        .question-text { font-size: 1.25rem; font-weight: 800; margin-bottom: 15px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-option {
            background: rgba(255,255,255,0.9); border: 2px solid transparent;
            padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; font-family: 'Nunito', sans-serif;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            color: var(--text-dark); text-align: center;
        }
        .btn-option:hover { transform: scale(1.02); background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-option.correct { background: var(--pastel-mint); border-color: #2ecc71; color: #16a085; }
        .btn-option.incorrect { background: #ff9ff3; border-color: #ff4757; color: #c0392b; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* MASTER EXPLANATION STYLES */
        .explanation-box {
            display: none; margin-top: 15px; padding: 15px;
            background: rgba(255,255,255,0.9); border-radius: 12px;
            border: 2px dashed #a29bfe; font-size: 1.1rem; line-height: 1.6;
        }
        .p-word { color: var(--word-color); font-weight: 800; }
        .p-mean { color: var(--mean-color); font-weight: bold; }
        .p-grammar { color: var(--grammar-color); text-decoration: underline; font-weight: bold; }
        .hl-green { color: var(--correct-color); font-weight: 900; }
        .hl-red { color: var(--incorrect-color); text-decoration: line-through; font-weight: bold; }

        /* SUBMIT BUTTON & SCORECARD */
        .submit-area { text-align: center; margin-top: 30px; padding-bottom: 40px; }
        .btn-submit {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            border: none; padding: 15px 40px; border-radius: 30px;
            color: white; font-size: 1.3rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: transform 0.2s;
        }
        .btn-submit:hover { transform: scale(1.05); }

        #scoreModal, #nameModal {
            position: fixed; inset: 0; z-index: 10000; display: none;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
        }
        .modal-content {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            padding: 40px; border-radius: 24px; text-align: center; width: 90%; max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .modal-content h2 { color: #8e44ad; font-size: 2rem; margin-bottom: 20px; }
        .modal-content input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #a29bfe;
            font-size: 1.2rem; font-family: 'Nunito', sans-serif; outline: none; text-align: center;
            margin-bottom: 20px;
        }
        .gif-container img { width: 100%; max-width: 300px; border-radius: 12px; margin: 15px 0; }

        /* PASSWORD MODAL - PASTEL THEME ADAPTATION */
        #passwordModal {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 209, 220, 0.4); backdrop-filter: blur(25px);
        }
        .pw-card {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 24px; padding: 48px 40px 40px; 
            max-width: 440px; width: 93%; text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .pw-crest { font-size: 4rem; margin-bottom: 8px; display: block; }
        .pw-title { font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 900; color: #8e44ad; margin-bottom: 6px; letter-spacing: 1px; }
        .pw-sub   { font-size: 1rem; color: #2c3e50; margin-bottom: 24px; font-weight: bold; }
        .pw-input {
            width: 100%; padding: 15px 20px; border-radius: 12px;
            border: 2px solid #a29bfe; background: rgba(255,255,255,0.9);
            color: #2c3e50; font-size: 1.2rem; font-family: 'Nunito', sans-serif;
            outline: none; letter-spacing: 3px; text-align: center; transition: all .3s;
        }
        .pw-input:focus { border-color: #6c5ce7; box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.2); }
        .pw-input.error { border-color: #ff4757; box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.2); animation: shake .4s ease; }
        .pw-btn {
            width: 100%; padding: 15px; margin-top: 20px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: #fff; font-size: 1.2rem; font-weight: 900; font-family: 'Nunito', sans-serif;
            cursor: pointer; transition: transform .2s; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .pw-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(161, 140, 209, 0.4); }
        .pw-err { color: #e74c3c; font-size: 1rem; margin-top: 10px; display: none; font-weight: 800; }
    </style>

    <script>
        function shootConfetti() {
            const colors = ['#ff9a9e', '#fecfef', '#a18cd1', '#fbc2eb', '#8fd3f4', '#84fab0'];
            for(let i=0; i<50; i++){
                let conf = document.createElement('div');
                conf.style.position = 'fixed'; conf.style.width = '10px'; conf.style.height = '10px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.top = '50%'; conf.style.left = '50%'; conf.style.zIndex = '9999';
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                conf.style.pointerEvents = 'none';
                document.body.appendChild(conf);

                let angle = Math.random() * Math.PI * 2;
                let velocity = 10 + Math.random() * 20;
                let dx = Math.cos(angle) * velocity;
                let dy = Math.sin(angle) * velocity;
                
                let x = 0, y = 0, rot = 0;
                let frames = 0;
                function animate() {
                    frames++;
                    x += dx; y += dy; dy += 0.5; rot += 10;
                    conf.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
                    if(frames < 60) requestAnimationFrame(animate);
                    else conf.remove();
                }
                requestAnimationFrame(animate);
            }
        }
    </script>

    <script>

        const _k  = [99,111,109,97,105,97,110,117,108,105,115];

        function generateEmojis() {

            }

                <p>C. Tháp xây bằng dầm sắt và bu lông. -> Đúng (using iron beams and bolts).</p>
                <p>D. Mọi người có thể đi thang máy lên đỉnh. -> Đúng (people can take an elevator...).</p>
                <p>🔍 Dẫn chứng sự sai lầm của câu B: "When the structure first started to take shape, the people of France did not like it."</p>
                <p>👉 Dịch: "Khi công trình mới bắt đầu thành hình, người dân Pháp <span class='hl-green'>không hề thích nó</span>."</p>`
            },
            {
                q: "Question 35. Why did France want to build the Eiffel Tower?",
                options: [
                    "To use it as a place for people to live.",
                    "To celebrate Alexandre Eiffel’s birthday.",
                    "To be the tallest tower in the world.",
                    "To be a special attraction at a fair."
                ], ans: "To be a special attraction at a fair.",
                exp: `<p>Dịch: Tại sao nước Pháp muốn xây Tháp Eiffel?</p>
                <p>A. Làm nơi ở. <span class='hl-red'>❌ Sai</span>.</p>
                <p>B. Mừng sinh nhật A. Eiffel. <span class='hl-red'>❌ Sai</span>.</p>
                <p>C. Để làm tháp cao nhất TG. <span class='hl-red'>❌ Sai</span>.</p>
                <p>D. Để làm điểm thu hút đặc biệt tại một hội chợ. <span class='hl-green'>✅ Đúng</span>.</p>
                <p>🔍 Dẫn chứng: "Alexandre Eiffel was asked to build the tower when France decided to have a big fair... The tower was to be located in the middle of the fair as a special attraction."</p>
                <p>👉 Dịch: "...Pháp quyết định tổ chức một hội chợ lớn... Tòa tháp sẽ được đặt ở giữa hội chợ như một <span class='hl-green'>điểm thu hút đặc biệt</span>."</p>`
            },
            {
                q: "Question 36. Why is it very windy at the top of the tower?",
                options: [
                    "The tower is very tall and has no walls.",
                    "The tower is built in a windy part of France.",
                    "The top of the tower moves in the wind.",
                    "The wind gets trapped inside the tower."
                ], ans: "The tower is very tall and has no walls.",
                exp: `<p>Dịch: Tại sao trên đỉnh tháp lại rất nhiều gió?</p>
                <p>A. Tháp rất cao và không có tường chắn. <span class='hl-green'>✅ Đúng</span>.</p>
                <p>B, C, D đều đưa ra những lý do không có trong bài <span class='hl-red'>❌ Sai</span>.</p>
                <p>🔍 Dẫn chứng: "It is very windy at the top of the tower... There are no walls to keep the wind out."</p>
                <p>👉 Dịch: "Trên đỉnh tháp gió thổi rất mạnh... <span class='hl-green'>Không có những bức tường</span> để chắn gió."</p>`
            },
            // PASSAGE 4
            {
                q: "Question 37. There’s a lot of good stuff on TV, (37) ______.",
                options: [
                    "so I watch something most days of the week",
                    "Sometimes the people are celebrities",
                    "and I’m also a big fan of reality shows like Big Brother.",
                    "I love that!"
                ], ans: "so I watch something most days of the week",
                exp: `<p>Dịch: Có rất nhiều thứ hay ho trên TV, (37) ____.</p>
                <p>Vì vế trước khen TV có nhiều cái hay, vế sau sẽ chỉ kết quả là tác giả xem nó rất nhiều.</p>
                <p>A. <span class='p-word'>so I watch something most days of the week</span> <span class='p-mean'>(nên tôi xem chương trình nào đó hầu hết các ngày trong tuần)</span> <span class='hl-green'>✅ Đúng logic</span>.</p>
                <p>Các đáp án khác không khớp mạch văn. <span class='hl-red'>❌ Sai</span>.</p>
                <p>🔍 Dẫn chứng: "There’s a lot of good stuff on TV, (37) so I watch something most days of the week. It’s the easiest thing to do when I get home..."</p>
                <p>👉 Dịch: "Có rất nhiều thứ hay ho trên TV, <span class='hl-green'>vì vậy tôi xem chúng hầu hết các ngày</span>. Đó là điều dễ làm nhất khi về nhà..."</p>`
            },
            {
                q: "Question 38. I watch quite a lot of documentaries and the news because I like to know what’s happening in the world, (38) ______.",
                options: [
                    "so I watch something most days of the week",
                    "Sometimes the people are celebrities",
                    "and I’m also a big fan of reality shows like Big Brother.",
                    "I love that!"
                ], ans: "and I’m also a big fan of reality shows like Big Brother.",
                exp: `<p>Dịch: Tôi xem khá nhiều phim tài liệu và tin tức vì thích biết chuyện gì đang xảy ra trên thế giới, (38) ____.</p>
                <p>Sau dấu phẩy cần một mệnh đề bổ sung thêm sở thích xem TV của tác giả (để dẫn dắt sang đoạn 2 nói về Big Brother).</p>
                <p>C. <span class='p-word'>and I’m also a big fan of reality shows like Big Brother.</span> <span class='p-mean'>(và tôi cũng là một người hâm mộ lớn của các chương trình thực tế như Big Brother)</span> <span class='hl-green'>✅ Đúng tuyệt đối</span>.</p>
                <p>🔍 Dẫn chứng: "...what’s happening in the world, and I’m also a big fan of reality shows like Big Brother. In Big Brother they get real people together..."</p>
                <p>👉 Dịch: "...chuyện gì đang xảy ra trên thế giới, <span class='hl-green'>và tôi cũng là fan của show thực tế như Big Brother</span>."</p>`
            },
            {
                q: "Question 39. In Big Brother they get real people together... (39) _______.",
                options: [
                    "so I watch something most days of the week",
                    "Sometimes the people are celebrities",
                    "and I’m also a big fan of reality shows like Big Brother.",
                    "I love that!"
                ], ans: "Sometimes the people are celebrities",
                exp: `<p>Dịch: Trong Big Brother, họ tập hợp những con người đời thực lại với nhau... (39) ____.</p>
                <p>Vì câu trước đang nói về "người tham gia" (people) trong chương trình, nên câu tiếp theo bổ sung thông tin về những người này là hợp lý nhất.</p>
                <p>B. <span class='p-word'>Sometimes the people are celebrities</span> <span class='p-mean'>(Đôi khi những người đó là người nổi tiếng)</span> <span class='hl-green'>✅ Đúng</span>.</p>
                <p>🔍 Dẫn chứng: "...because the house is full of cameras you can watch how they behave. Sometimes the people are celebrities."</p>
                <p>👉 Dịch: "...bạn có thể quan sát cách họ cư xử. <span class='hl-green'>Đôi khi những người đó là người nổi tiếng</span>."</p>`
            },
            {
                q: "Question 40. As a viewer you can decide which of the people you don’t like and then vote to evict them from the house – (40)_____",
                options: [
                    "so I watch something most days of the week",
                    "Sometimes the people are celebrities",
                    "and I’m also a big fan of reality shows like Big Brother.",
                    "I love that!"
                ], ans: "I love that!",
                exp: `<p>Dịch: Là khán giả, bạn có thể quyết định mình không thích ai và bỏ phiếu đuổi họ khỏi nhà – (40)____.</p>
                <p>Đây là cảm xúc chốt lại sự thích thú của tác giả đối với format chương trình này.</p>
                <p>D. <span class='p-word'>I love that!</span> <span class='p-mean'>(Tôi yêu điều đó!)</span> <span class='hl-green'>✅ Đúng</span>.</p>
                <p>🔍 Dẫn chứng: "...vote to evict them from the house – I love that!"</p>
                <p>👉 Dịch: "...bỏ phiếu để đuổi họ ra khỏi nhà – <span class='hl-green'>Tôi yêu điều đó!</span>"</p>`
            }
        ];

        let score = 0;
        let answeredQuestions = 0;
        const totalQuestions = questions.length;

        // Shuffle function
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Render UI
        function renderApp() {
            // Render Readings
            const readingPane = document.getElementById('readingPane');
            readings.forEach(r => {
                let html = `<div class="passage">
                    <div class="passage-title">${r.title}</div>`;
                r.paragraphs.forEach((p, idx) => {
                    let pId = `trans_${r.id}_${idx}`;
                    html += `<div class="passage-content">${p.en}</div>
                             <button class="btn-translate" onclick="toggleTranslation('${pId}')">Mở dịch đoạn này 🌟</button>
                             <div class="translation-box" id="${pId}">${p.vi}</div>`;
                });
                // Glossary
                html += `<table class="glossary"><tr><th>English Word</th><th>Type</th><th>Vietnamese Meaning</th></tr>`;
                r.glossary.forEach(g => {
                    html += `<tr><td><strong>${g.word}</strong></td><td>${g.type}</td><td>${g.mean}</td></tr>`;
                });
                html += `</table></div><hr style="border: 0; border-top: 2px dashed #a18cd1; margin: 30px 0;">`;
                readingPane.innerHTML += html;
            });

            // Render Quizzes
            const quizContainer = document.getElementById('quizContainer');
            questions.forEach((q, qIndex) => {
                let shuffledOptions = shuffle([...q.options]);
                let html = `<div class="question-card" id="qcard_${qIndex}">
                    <div class="question-text">${q.q}</div>
                    <div class="options-grid">`;
                
                shuffledOptions.forEach((opt, optIndex) => {
                    let isCorrect = (opt === q.ans);
                    html += `<button class="btn-option" id="btn_${qIndex}_${optIndex}" 
                             onclick="checkAnswer(${qIndex}, ${optIndex}, ${isCorrect}, this)">
                             ${opt}
                             </button>`;
                });
                
                html += `</div>
                         <div class="explanation-box" id="exp_${qIndex}">
                            <h3 style="color:#8e44ad; margin-bottom:10px;">🌟 LỜI GIẢI CHI TIẾT TỪ Ms. Chí Nên · ☎️ 0852639652:</h3>
                            ${q.exp}
                         </div>
                         </div>`;
                quizContainer.innerHTML += html;
            });
        }

        function toggleTranslation(id) {
            const el = document.getElementById(id);
            if(el.style.display === 'block') { el.style.display = 'none'; }
            else { el.style.display = 'block'; }
        }

        function checkAnswer(qIndex, optIndex, isCorrect, btnEl) {
            // Prevent multiple clicks
            const card = document.getElementById(`qcard_${qIndex}`);
            if(card.classList.contains('answered')) return;
            card.classList.add('answered');
            answeredQuestions++;

            // Disable all buttons in this question
            const buttons = card.querySelectorAll('.btn-option');
            buttons.forEach(b => b.style.pointerEvents = 'none');

            if(isCorrect) {
                btnEl.classList.add('correct');
                score++;
                document.getElementById('snd-ding').play().catch(e=>{});
                shootConfetti();
            } else {
                btnEl.classList.add('incorrect');
                document.getElementById('snd-wrong').play().catch(e=>{});
                // Highlight correct
                buttons.forEach(b => {
                    if(b.innerText.trim() === questions[qIndex].ans) {
                        b.classList.add('correct');
                    }
                });
            }

            // Show explanation
            document.getElementById(`exp_${qIndex}`).style.display = 'block';
            
            // Scroll to explanation smoothly
            setTimeout(() => {
                document.getElementById(`exp_${qIndex}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 300);
        }

        function showNameModal() {
            if(answeredQuestions < totalQuestions) {
                alert(`Em mới làm ${answeredQuestions}/${totalQuestions} câu thôi. Làm hết rồi mới nộp bài nha!`);
                return;
            }
            document.getElementById('nameModal').style.display = 'flex';
        }

        function submitTest() {
            const nameInput = document.getElementById('studentName').value.trim();
            if(!nameInput) {
                alert("Em quên nhập tên rồi kìa!");
                document.getElementById('studentName').focus();
                return;
            }
            
            document.getElementById('nameModal').style.display = 'none';
            document.getElementById('scoreModal').style.display = 'flex';
            
            document.getElementById('scoreName').innerText = `Học sinh: ${nameInput}`;
            document.getElementById('scorePoints').innerText = `${score} / ${totalQuestions}`;
            
            let percentage = score / totalQuestions;
            let fb = document.getElementById('scoreFeedback');
            let gif = document.getElementById('scoreGif');
            
            if(percentage === 1) {
                fb.innerText = "Tuyệt vời! Em chính là một thiên tài tiếng Anh thực thụ! Ms. Chí Nên · ☎️ 0852639652siêu tự hào về em! 🏆🌟";
                fb.style.color = "#27ae60";
                gif.innerHTML = `<img src="https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif" alt="Genius">`;
            } else if(percentage >= 0.6) {
                fb.innerText = "Rất tốt! Em đã cố gắng hết sức. High-five nhé! Lần sau cố gắng đạt 100% nha! ✋✨";
                fb.style.color = "#e67e22";
                gif.innerHTML = `<img src="https://media.giphy.com/media/l41lZxzroU33typuU/giphy.gif" alt="Good job">`;
            } else {
                fb.innerText = "Ôi dồi ôi! Điểm số này làm Ms. Chí Nên · ☎️ 0852639652khóc thét mất thôi 😭. Phải xem kỹ lại phần LỜI GIẢI CHI TIẾT nhé! Cố lên!";
                fb.style.color = "#c0392b";
                gif.innerHTML = `<img src="https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif" alt="Crying">`;
            }
            shootConfetti(); shootConfetti(); shootConfetti(); // Extra celebration
        }

        // Initialize App
        window.onload = () => {
            renderApp();
        };
    </script>
