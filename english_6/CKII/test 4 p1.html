<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đề 04 – Tiếng Anh HK2 – Global Success 6</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --pink:    #ff75c3;
  --orange:  #ffa647;
  --yellow:  #ffe83f;
  --green:   #9fff5b;
  --blue:    #70e2ff;
  --purple:  #cd93ff;
  --correct: #00D26A;
  --wrong:   #FF4757;
  --glass:   rgba(10,10,40,0.62);
  --glass-border: rgba(255,255,255,0.28);
  --radius:  18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  background: #0a0a2e;
  position: relative;
}

/* ── Animated gradient background ── */
.bg-gradient {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(135deg,
    #ff75c3, #ffa647, #ffe83f, #9fff5b,
    #70e2ff, #cd93ff, #ff75c3, #ffa647);
  background-size: 400% 400%;
  animation: bgMove 12s ease infinite;
}
@keyframes bgMove {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ── SVG floating sea animals ── */
.sea-layer {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none; overflow: hidden;
}
.sea-layer svg { position: absolute; }

/* ── Content wrapper ── */
.wrapper {
  position: relative; z-index: 2;
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 16px 60px;
}

/* ── Header ── */
.header {
  text-align: center;
  padding: 14px 18px 10px;
  background: rgba(10,10,40,0.72);
  backdrop-filter: blur(18px);
  border: 1.5px solid rgba(255,255,255,0.22);
  border-radius: var(--radius);
  margin-bottom: 18px;
}
.header .creator {
  font-size: .78rem; color: rgba(255,255,255,.85);
  font-weight: 600; letter-spacing: .5px;
}
.header h1 {
  font-size: 1.25rem; font-weight: 900;
  color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.35);
  line-height: 1.3;
}
.header h2 {
  font-size: .92rem; color: rgba(255,255,255,.9);
  font-weight: 600; margin-top: 2px;
}

/* ── Progress bar ── */
.progress-bar-wrap {
  background: rgba(255,255,255,.25);
  border-radius: 20px; height: 10px;
  margin-bottom: 18px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 20px;
  background: linear-gradient(90deg, var(--green), var(--blue));
  transition: width .4s ease;
}

/* ── Section title ── */
.section-title {
  font-size: .88rem; font-weight: 800;
  color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.4);
  background: rgba(0,0,0,.2);
  backdrop-filter: blur(8px);
  border-radius: 10px;
  padding: 6px 14px;
  margin: 18px 0 10px;
  border-left: 4px solid var(--yellow);
}

/* ── Question card ── */
.q-card {
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 18px 18px 14px;
  margin-bottom: 14px;
}
.q-label {
  font-size: .8rem; font-weight: 800;
  color: var(--yellow); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 6px;
}
.q-text {
  font-size: 1.15rem; font-weight: 700;
  color: #fff; margin-bottom: 14px;
  line-height: 1.5;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}
.q-text u { text-decoration: underline; text-underline-offset: 3px; }

/* sign/notice box */
.sign-box {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 14px;
}
.sign-emoji { font-size: 3.5rem; }
.sign-graphic {
  background: #2e7d32; color: #fff;
  border: 4px solid #fff; border-radius: 10px;
  padding: 10px 16px; text-align: center;
  font-weight: 900; line-height: 1.3;
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
  min-width: 140px;
}
.sign-graphic .sign-top { font-size: 1rem; font-style: italic; }
.sign-graphic .sign-main { font-size: 1.1rem; }
.sign-graphic .sign-big { font-size: 1.4rem; letter-spacing: 1px; }

/* order-sentences box */
.sentences-box {
  background: rgba(255,255,255,.12);
  border-radius: 12px; padding: 12px 16px;
  margin-bottom: 14px;
}
.sentences-box p {
  font-size: .97rem; color: rgba(255,255,255,.93);
  margin-bottom: 6px; font-weight: 600;
}

/* ── Answer buttons (cards) ── */
.answers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media(max-width:520px){ .answers-grid { grid-template-columns: 1fr; } }

.ans-btn {
  background: rgba(255,255,255,.88);
  border: none; border-radius: 16px;
  padding: 12px 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.05rem; font-weight: 700;
  color: #333; cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 2px 12px rgba(0,0,0,.12);
  transition: transform .15s, box-shadow .15s;
  text-align: left; line-height: 1.4;
}
.ans-btn:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 9px 0 rgba(0,0,0,.15), 0 4px 18px rgba(0,0,0,.15);
}
.ans-btn:disabled { cursor: default; }
.ans-btn.correct {
  background: var(--correct) !important;
  color: #fff !important;
  box-shadow: 0 6px 0 #009e4f, 0 2px 16px rgba(0,210,106,.5) !important;
}
.ans-btn.wrong {
  background: var(--wrong) !important;
  color: #fff !important;
  box-shadow: 0 6px 0 #b5002d, 0 2px 16px rgba(255,71,87,.4) !important;
  animation: shake .4s ease;
}
.ans-btn.reveal-correct {
  background: rgba(0,210,106,.3) !important;
  color: #fff !important;
  border: 2px solid var(--correct);
}

/* ── Explanation box ── */
.explanation {
  margin-top: 12px;
  background: rgba(8,8,32,0.88);
  backdrop-filter: blur(16px);
  border-radius: 14px;
  padding: 16px 18px;
  font-size: 1rem;
  color: #f0f0ff;
  line-height: 1.85;
  border-left: 4px solid var(--yellow);
  box-shadow: 0 4px 20px rgba(0,0,0,.4);
  display: none;
}
.explanation.show { display: block; animation: fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

.explanation b { color: #ffe83f; font-weight: 800; }
.vi-translation {
  background: rgba(255,140,20,.18);
  border-left: 4px solid var(--orange);
  border-radius: 8px;
  padding: 8px 14px;
  margin: 10px 0;
  font-weight: 700;
  color: #ffd699;
  font-size: 1rem;
}

/* color helpers – brightened for dark bg */
.p-word     { color: #6fd9ff; font-weight: 800; }
.p-phonetic { background: rgba(180,120,255,.3); color: #e0c0ff; border-radius: 4px; padding: 1px 6px; font-weight: 700; }
.p-mean     { color: #ffcc70; font-weight: 800; }
.p-grammar  { text-decoration: underline; text-decoration-color: #ff6b7a; color: #ffb3ba; font-weight: 800; }
.hl-green   { color: #44ffaa; font-weight: 900; }
.hl-red     { color: #ff7a8a; text-decoration: line-through; font-weight: 800; }

/* ── Submit / Result ── */
.submit-wrap { text-align: center; margin: 28px 0 10px; }
.submit-btn {
  background: linear-gradient(135deg, #ff75c3, #cd93ff);
  color: #fff; font-family: 'Nunito', sans-serif;
  font-size: 1.15rem; font-weight: 900;
  border: none; border-radius: 50px;
  padding: 16px 40px; cursor: pointer;
  box-shadow: 0 8px 0 rgba(180,0,100,.3), 0 4px 24px rgba(255,117,195,.45);
  transition: transform .15s, box-shadow .15s;
  letter-spacing: .5px;
}
.submit-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 0 rgba(180,0,100,.25), 0 6px 28px rgba(255,117,195,.5); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-box {
  background: linear-gradient(135deg, rgba(255,255,255,.25), rgba(255,255,255,.1));
  backdrop-filter: blur(24px);
  border: 2px solid rgba(255,255,255,.4);
  border-radius: 24px;
  padding: 30px 28px;
  max-width: 440px; width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.modal-box h3 { font-size: 1.4rem; font-weight: 900; color: #fff; margin-bottom: 10px; }
.modal-box p { color: rgba(255,255,255,.85); font-size: 1rem; margin-bottom: 16px; }
.modal-input {
  width: 100%; border: 2.5px solid rgba(255,255,255,.5);
  border-radius: 14px; padding: 12px 16px;
  font-size: 1.05rem; font-family: 'Nunito', sans-serif;
  background: rgba(255,255,255,.15); color: #fff;
  outline: none; margin-bottom: 14px;
  transition: border-color .2s;
}
.modal-input::placeholder { color: rgba(255,255,255,.5); }
.modal-input.error { border-color: var(--wrong); }
.modal-confirm {
  background: linear-gradient(135deg, var(--green), var(--blue));
  color: #333; font-family: 'Nunito', sans-serif;
  font-size: 1.05rem; font-weight: 900;
  border: none; border-radius: 14px;
  padding: 13px 32px; cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,.2);
  width: 100%;
}

/* result modal */
.result-score {
  font-size: 3rem; font-weight: 900;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin: 10px 0;
}
.result-msg { font-size: 1.2rem; font-weight: 800; color: #fff; margin-bottom: 12px; }
.result-gif {
  border-radius: 16px; max-width: 220px;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
  margin: 10px auto; display: block;
}
.retry-btn {
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: #fff; font-family: 'Nunito', sans-serif;
  font-size: 1rem; font-weight: 900;
  border: none; border-radius: 14px;
  padding: 12px 28px; cursor: pointer;
  margin-top: 14px; box-shadow: 0 5px 0 rgba(0,0,0,.2);
}

/* confetti canvas */
#confetti-canvas {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 999;
}

/* hidden */
.hidden { display: none !important; }

/* ── GIAO DIỆN MÀN HÌNH KHÓA (Tông Xuyệt Tông) ── */
#passwordModal {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5,2,15,0.85); backdrop-filter: blur(20px);
}
.pw-card {
  background: var(--glass);
  backdrop-filter: blur(16px);
  border: 1.5px solid var(--glass-border); 
  border-radius: 24px; padding: 48px 40px 40px; 
  max-width: 440px; width: 93%; text-align: center; position: relative; overflow: hidden;
  box-shadow: 0 0 60px rgba(112,226,255,0.15), 0 0 120px rgba(255,117,195,0.1), inset 0 1px 0 rgba(255,255,255,0.15);
}
.pw-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--pink), var(--yellow), var(--blue));
}
.pw-crest { font-size: 4rem; margin-bottom: 8px; display: block; }
.pw-title { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: var(--yellow); margin-bottom: 6px; letter-spacing: 1px; }
.pw-sub   { font-size: .95rem; color: rgba(255,255,255,0.85); font-weight: 600; margin-bottom: 24px; }
.pw-input {
  width: 100%; padding: 13px 20px; border-radius: 12px;
  border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1);
  color: #fff; font-size: 1.1rem; font-family: 'Nunito', sans-serif; font-weight: 700;
  outline: none; letter-spacing: 3px; text-align: center; transition: all .3s;
}
.pw-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(112, 226, 255, 0.2); }
.pw-input.error { border-color: var(--wrong); box-shadow: 0 0 0 4px rgba(255,71,87,0.25); animation: shake .4s ease; }
.pw-input::placeholder { color: rgba(255,255,255,0.6); letter-spacing: 1px; font-weight: 500; }
.pw-btn {
  width: 100%; padding: 14px; margin-top: 16px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
  color: #111; font-size: 1.05rem; font-weight: 900; font-family: 'Nunito', sans-serif;
  cursor: pointer; letter-spacing: .5px; transition: transform .2s; box-shadow: 0 6px 16px rgba(0,0,0,0.2);
}
.pw-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(205,147,255,0.4); }
.pw-err { color: var(--wrong); font-size: .9rem; margin-top: 12px; display: none; font-weight: 800; }
@keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-6px)} 30%,60%,90%{transform:translateX(6px)} }
</style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>



<div class="bg-gradient"></div>

<div class="sea-layer" id="seaLayer"></div>

<canvas id="confetti-canvas"></canvas>

<div class="wrapper" id="mainContent" style="display: block;">

  <div class="header">
    <div class="creator">🐠 Giáo viên tạo: Ms. Chí Nên · ☎️ 0852639652 🐠</div>
    <h1>ĐỀ 04 – ĐỀ THI CUỐI KỲ HỌC KỲ 2</h1>
    <h2>Global Success 6 · Môn Tiếng Anh</h2>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>

  <div id="questionsContainer"></div>

  <div class="submit-wrap">
    <button class="submit-btn" onclick="openNameModal()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>
</div>

<div class="modal-overlay hidden" id="nameModal">
  <div class="modal-box">
    <h3>📝 Nhập tên của bạn</h3>
    <p>Điền tên để nhận kết quả cá nhân hoá nhé!</p>
    <input class="modal-input" id="nameInput" type="text" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50">
    <div id="nameError" style="color:var(--wrong);font-size:.9rem;margin:-8px 0 10px;display:none;">⚠️ Bạn chưa nhập tên!</div>
    <button class="modal-confirm" onclick="submitQuiz()">🚀 Xem kết quả!</button>
  </div>
</div>

<div class="modal-overlay hidden" id="resultModal">
  <div class="modal-box">
    <div id="resultGreet" class="result-msg"></div>
    <div class="result-score" id="resultScore"></div>
    <div id="resultEmoji" style="font-size:2.5rem;margin:6px 0;"></div>
    <img id="resultGif" class="result-gif" src="" alt="result gif">
    <br>
    <button class="retry-btn" onclick="retryQuiz()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  ÂM THANH VÀ BẢO MẬT
// ══════════════════════════════════════════════
const introSound = new Audio('https:
const wrongSound = new Audio('https:

const _k  = [99,111,109,97,105,97,110,117,108,105,115]; 
const _pw = _k.map(c => String.fromCharCode(c)).join('');

function checkPassword() {
  const inp = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');
  if (inp.value === _pw) {
    document.getElementById('passwordModal').style.display = 'none';
    const main = document.getElementById('mainContent');
    if(main) main.style.display = 'block';
    
    // Phát âm thanh khích lệ học sinh
    introSound.play().catch(e => console.log("Audio block by browser", e));
    
  } else {
    inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
    err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('pwInput');
  if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});

// ══════════════════════════════════════════════
//  SEA ANIMAL SVG BACKGROUND
// ══════════════════════════════════════════════
(function(){
  const layer = document.getElementById('seaLayer');
  const animals = [
    // fish
    `<svg width="60" height="40" viewBox="0 0 60 40"><ellipse cx="28" cy="20" rx="22" ry="12" fill="#70e2ff" opacity=".7"/>
     <polygon points="50,20 62,8 62,32" fill="#cd93ff" opacity=".7"/>
     <circle cx="14" cy="16" r="3" fill="#fff" opacity=".9"/><circle cx="13" cy="16" r="1.2" fill="#333"/>
     <path d="M28 8 Q36 4 44 8" stroke="#9fff5b" stroke-width="2" fill="none"/>
     <path d="M28 32 Q36 36 44 32" stroke="#9fff5b" stroke-width="2" fill="none"/></svg>`,
    // crab
    `<svg width="55" height="45" viewBox="0 0 55 45"><ellipse cx="27" cy="26" rx="18" ry="12" fill="#ff75c3" opacity=".8"/>
     <circle cx="19" cy="18" r="5" fill="#ffa647" opacity=".85"/>
     <circle cx="35" cy="18" r="5" fill="#ffa647" opacity=".85"/>
     <line x1="9" y1="26" x2="0" y2="18" stroke="#ff75c3" stroke-width="3" stroke-linecap="round"/>
     <line x1="45" y1="26" x2="54" y2="18" stroke="#ff75c3" stroke-width="3" stroke-linecap="round"/>
     <line x1="12" y1="30" x2="4" y2="36" stroke="#ff75c3" stroke-width="2.5" stroke-linecap="round"/>
     <line x1="42" y1="30" x2="50" y2="36" stroke="#ff75c3" stroke-width="2.5" stroke-linecap="round"/>
     <circle cx="22" cy="17" r="2" fill="#fff"/><circle cx="22" cy="17" r="1" fill="#333"/>
     <circle cx="32" cy="17" r="2" fill="#fff"/><circle cx="32" cy="17" r="1" fill="#333"/></svg>`,
    // jellyfish
    `<svg width="50" height="65" viewBox="0 0 50 65"><ellipse cx="25" cy="22" rx="22" ry="18" fill="#cd93ff" opacity=".7"/>
     <line x1="15" y1="40" x2="10" y2="65" stroke="#cd93ff" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity=".6"/>
     <line x1="22" y1="40" x2="20" y2="65" stroke="#ff75c3" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity=".6"/>
     <line x1="28" y1="40" x2="30" y2="65" stroke="#cd93ff" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity=".6"/>
     <line x1="35" y1="40" x2="40" y2="65" stroke="#ff75c3" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity=".6"/>
     <circle cx="18" cy="18" r="3" fill="rgba(255,255,255,.5)"/><circle cx="30" cy="14" r="4" fill="rgba(255,255,255,.4)"/></svg>`,
    // starfish
    `<svg width="56" height="56" viewBox="0 0 56 56"><polygon points="28,2 33,20 52,20 38,31 43,50 28,39 13,50 18,31 4,20 23,20" fill="#ffe83f" opacity=".8"/>
     <circle cx="28" cy="28" r="8" fill="#ffa647" opacity=".9"/></svg>`,
    // seahorse
    `<svg width="38" height="60" viewBox="0 0 38 60"><path d="M19 5 Q30 8 28 18 Q34 22 30 30 Q28 42 18 48 Q10 54 12 60" stroke="#9fff5b" stroke-width="5" fill="none" stroke-linecap="round"/>
     <circle cx="19" cy="5" r="7" fill="#70e2ff" opacity=".85"/>
     <circle cx="17" cy="3" r="2" fill="#fff"/><circle cx="17" cy="3" r="1" fill="#333"/>
     <path d="M22 8 Q32 5 28 0" stroke="#9fff5b" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`,
    // bubble
    `<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
     <circle cx="10" cy="10" r="3" fill="rgba(255,255,255,.3)"/></svg>`,
  ];
  const positions = [
    [5,8],[15,3],[80,6],[92,15],[3,40],[88,38],
    [10,70],[75,72],[50,90],[25,85],[60,15],[42,55],
    [70,45],[18,55],[85,60]
  ];
  const anims = [
    'float1 8s ease-in-out infinite',
    'float2 11s ease-in-out infinite',
    'float3 14s ease-in-out infinite',
    'float1 9s ease-in-out infinite 2s',
    'float2 13s ease-in-out infinite 1s',
  ];
  const style = document.createElement('style');
  style.textContent = `
    @keyframes float1{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-18px) rotate(8deg)}}
    @keyframes float2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(16px) rotate(-7deg)}}
    @keyframes float3{0%,100%{transform:translateX(0) translateY(0)}33%{transform:translateX(12px) translateY(-10px)}66%{transform:translateX(-8px) translateY(8px)}}
  `;
  document.head.appendChild(style);
  positions.forEach(([x,y], i) => {
    const a = animals[i % animals.length];
    const div = document.createElement('div');

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let answered = {};
let scores = {};

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function renderQuiz() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  let currentSection = '';
  questions.forEach((q) => {
    if (q.section && q.section !== currentSection) {
      currentSection = q.section;
      const st = document.createElement('div');
      st.className = 'section-title';
      st.textContent = '📌 ' + q.section;
      container.appendChild(st);
    }

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'qcard-' + q.id;

    const label = document.createElement('div');
    label.className = 'q-label';
    label.textContent = 'Câu ' + q.id;
    card.appendChild(label);

    if (q.customHTML) {
      const customDiv = document.createElement('div');
      customDiv.innerHTML = q.customHTML;
      card.appendChild(customDiv);
    }

    if (q.text) {
      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.innerHTML = q.text;
      card.appendChild(qText);
    }

    // Shuffle answers (đã shuffle mặc định do system info)
    const shuffled = shuffleArray(q.answers.map((a, i) => ({ ...a, origIdx: i })));

    const grid = document.createElement('div');
    grid.className = 'answers-grid';
    shuffled.forEach((ans) => {
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn._isCorrect = ans.correct; // store for reveal logic
      // Strip any ✓ marker so correct answer is never revealed visually
      btn.innerHTML = ans.text.replace(/\s*✓/g, '');
      btn.onclick = () => handleAnswer(q.id, ans.correct, btn, grid, q);
      grid.appendChild(btn);
    });
    card.appendChild(grid);

    const expl = document.createElement('div');
    expl.className = 'explanation';
    expl.id = 'expl-' + q.id;
    expl.innerHTML = q.explanation;
    card.appendChild(expl);

    container.appendChild(card);
  });

  updateProgress();
}

function handleAnswer(qid, isCorrect, btn, grid, q) {
  if (answered[qid]) return;
  answered[qid] = true;
  scores[qid] = isCorrect;

  // Disable all buttons, reveal correct one
  const allBtns = Array.from(grid.querySelectorAll('.ans-btn'));
  allBtns.forEach((b) => {
    b.disabled = true;
    if (b === btn) {
      b.classList.add(isCorrect ? 'correct' : 'wrong');
    } else if (b._isCorrect) {
      b.classList.add('reveal-correct');
    }
  });

  if (isCorrect) {
    playSound('correct');
    launchConfetti();
  } else {
    playSound('wrong');
  }

  // Show explanation
  const expl = document.getElementById('expl-' + qid);
  expl.classList.add('show');

  updateProgress();

  // Scroll to explanation
  setTimeout(() => expl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

function updateProgress() {
  const total = questions.length;
  const done = Object.keys(answered).length;
  document.getElementById('progressBar').style.width = (done / total * 100) + '%';
}

// ══════════════════════════════════════════════
//  AUDIO ENGINE
// ══════════════════════════════════════════════
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if (type === 'wrong') {
    // Sử dụng file âm thanh "HUH" được yêu cầu khi sai
    wrongSound.currentTime = 0;
    wrongSound.play().catch(e => console.log("Audio block by browser", e));
  } else {
    // Giữ lại âm thanh beep tít tít tự tạo cho đáp án đúng
    try {
      const osc = AC.createOscillator();
      const gain = AC.createGain();
      osc.connect(gain); gain.connect(AC.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, AC.currentTime);
      osc.frequency.setValueAtTime(659, AC.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, AC.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, AC.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.5);
      osc.start(); osc.stop(AC.currentTime + 0.5);
    } catch(e) {}
  }
}

// ══════════════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════════════
const confCanvas = document.getElementById('confetti-canvas');
const confCtx = confCanvas.getContext('2d');
let confParticles = [];
let confAnimId = null;

function launchConfetti() {
  confCanvas.width = window.innerWidth;
  confCanvas.height = window.innerHeight;
  const colors = ['#ff75c3','#ffa647','#ffe83f','#9fff5b','#70e2ff','#cd93ff'];
  for (let i = 0; i < 80; i++) {
    confParticles.push({
      x: Math.random() * confCanvas.width,
      y: Math.random() * confCanvas.height * 0.5 - 50,
      r: Math.random() * 8 + 4,
      d: Math.random() * 80 + 30,
      color: colors[Math.floor(Math.random() * colors.length)],
      tilt: Math.random() * 10 - 10,
      tiltAngle: 0,
      tiltAngleInc: Math.random() * .07 + .05,
      vx: Math.random() * 2 - 1,
      vy: Math.random() * 3 + 2,
    });
  }
  if (!confAnimId) animateConfetti();
}

function animateConfetti() {
  confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  confParticles.forEach(p => {
    confCtx.beginPath();
    confCtx.fillStyle = p.color;
    confCtx.moveTo(p.x, p.y);
    confCtx.lineTo(p.x + p.tilt + p.r, p.y + p.tilt);
    confCtx.lineTo(p.x + p.tilt + p.r * 2, p.y);
    confCtx.lineTo(p.x + p.tilt, p.y - p.r * 2);
    confCtx.closePath(); confCtx.fill();
    p.tiltAngle += p.tiltAngleInc;
    p.y += p.vy; p.x += p.vx;
    p.tilt = Math.sin(p.tiltAngle) * 12;
  });
  confParticles = confParticles.filter(p => p.y < confCanvas.height + 20);
  if (confParticles.length > 0) {
    confAnimId = requestAnimationFrame(animateConfetti);
  } else {
    confAnimId = null;
    confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  }
}

// ══════════════════════════════════════════════
//  SUBMIT / RESULT
// ══════════════════════════════════════════════
function openNameModal() {
  document.getElementById('nameModal').classList.remove('hidden');
  document.getElementById('nameInput').focus();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('nameModal').classList.contains('hidden')) {
    submitQuiz();
  }
});

function submitQuiz() {
  const nameInput = document.getElementById('nameInput');
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.classList.add('error');
    document.getElementById('nameError').style.display = 'block';
    return;
  }
  nameInput.classList.remove('error');
  document.getElementById('nameError').style.display = 'none';

  const correct = Object.values(scores).filter(Boolean).length;
  const total = questions.length;
  const pct = correct / total;

  let greet, emoji, gifSrc;
  if (pct === 1) {
    greet = `🌟 THIÊN TÀI! ${name} xuất sắc tuyệt đối! 🌟`;
    emoji = '🏆🎉🥳';
    gifSrc = 'https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';
  } else if (pct >= 0.6) {
    greet = `👍 Tốt lắm! ${name} làm bài rất ổn!`;
    emoji = '🎊😊✨';
    gifSrc = 'https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif';
  } else {
    greet = `😢 Cố lên nhé, ${name}! Lần sau sẽ tốt hơn!`;
    emoji = '😭💪🔥';
    gifSrc = 'https://media.giphy.com/media/26FLdmIp6wJr91JAI/giphy.gif';
  }

  document.getElementById('nameModal').classList.add('hidden');
  document.getElementById('resultGreet').textContent = greet;
  document.getElementById('resultScore').textContent = `${correct} / ${total}`;
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultGif').src = gifSrc;
  document.getElementById('resultModal').classList.remove('hidden');

  if (pct === 1) {
    for (let i = 0; i < 3; i++) setTimeout(launchConfetti, i * 600);
  }
}

function retryQuiz() {
  answered = {}; scores = {};
  document.getElementById('resultModal').classList.add('hidden');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
renderQuiz();
