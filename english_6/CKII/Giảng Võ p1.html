<html lang="vi">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CẤU HÌNH BIẾN MÀU SẮC ================= */
        :root {
            --text-dark: #2C3E50;
            --correct-green: #00D26A;
            --incorrect-red: #FF4757;
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 12px 32px 0 rgba(31, 38, 135, 0.15);
            --card-radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* ================= BACKGROUND GRADIENT ANIMATION ================= */
        body {
            font-family: 'Nunito', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(-45deg, #8854C0, #FDCB6E, #00C9A7, #FF9A9E);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= FLOATING SVG PATTERN ================= */
        #pattern-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            overflow: hidden;
        }
        .floating-icon {
            position: absolute;
            bottom: -10%;
            fill: rgba(255, 255, 255, 0.3);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* ================= LAYOUT & UI COMPONENT ================= */
        .container {
            max-width: 900px; margin: 0 auto; padding: 20px;
            position: relative; z-index: 1;
        }

        .header {
            text-align: center; margin-bottom: 30px;
            padding: 10px; border-radius: 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            display: inline-block;
            transform: translateX(-50%);
            position: relative; left: 50%;
        }
        .header h3 {
            font-size: 1rem; font-weight: 800; color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }

        /* Thẻ câu hỏi (Glassmorphism) */
        .question-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 35px 30px; margin-bottom: 40px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease;
        }

        .question-text {
            font-size: 1.15rem; font-weight: 800; margin-bottom: 25px; line-height: 1.6;
        }

        .options-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;
        }

        /* Thẻ đáp án (Blooket Style) */
        .option-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 20px 25px;
            font-size: 1.08rem; font-weight: 800; color: var(--text-dark);
            cursor: pointer; text-align: center;
            display: flex; align-items: center; justify-content: center;
            min-height: 70px;
            box-shadow: 0 8px 0 #D1D8E0; 
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-user-select: none; user-select: none;
        }
        .option-card:hover { 
            transform: scale(1.05) translateY(-4px); 
            box-shadow: 0 12px 0 #BDC3C7; 
            background: #ffffff;
        }
        .option-card:active { 
            transform: scale(0.98) translateY(6px); 
            box-shadow: 0 2px 0 #D1D8E0; 
        }

        /* Trạng thái đáp án */
        .option-card.correct {
            background-color: var(--correct-green) !important; color: white !important;
            box-shadow: 0 8px 0 #00A352 !important;
        }
        .option-card.incorrect {
            background-color: var(--incorrect-red) !important; color: white !important;
            box-shadow: 0 8px 0 #C82333 !important;
        }
        .option-card.disabled { pointer-events: none; opacity: 0.7; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        /* ================= KHUNG GIẢI THÍCH SIÊU CHI TIẾT ================= */
        .explanation-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 25px; margin-top: 30px;
            font-size: 1rem; line-height: 1.7;
            border-left: 8px solid #8854C0;
            display: none; 
            animation: slideDown 0.4s ease-out;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

        /* FORMAT MÀU CHỮ GIẢI THÍCH CHUẨN SƯ PHẠM */
        .vn-translate {
            background: #FFF3CD; color: #D35400; padding: 12px 18px; border-radius: 12px;
            font-weight: 800; margin-bottom: 20px; border: 2px dashed #FDCB6E;
            font-size: 1.05rem;
        }
        .exp-step { margin-bottom: 12px; color: #34495E; font-weight: 500; }
        .p-word { color: #2980B9; font-weight: 900; }
        .p-phonetic { background: #F4ECF7; color: #8E44AD; padding: 3px 8px; border-radius: 6px; font-family: monospace; font-weight: bold;}
        .p-mean { color: #D35400; font-style: italic; font-weight: 800; }
        .p-grammar { color: #C0392B; text-decoration: underline; text-decoration-style: wavy; font-weight: 900; }
        .hl-green { color: #27AE60; font-weight: 900; font-size: 1.05rem; }
        .hl-red { color: #C0392B; font-weight: 900; text-decoration: line-through; }

        /* ================= BIỂN BÁO CSS ================= */
        .css-sign { display: block; margin: 20px auto; }
        .sign-no-parking { border: 4px solid #d63031; width: 160px; padding: 15px; border-radius: 15px; background: white; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1);}
        .sign-circle-slash { width: 100px; height: 100px; border: 12px solid #d63031; border-radius: 50%; position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .sign-p { font-size: 65px; font-weight: 900; color: #2d3436; font-family: sans-serif; line-height: 1; }
        .sign-slash { position: absolute; width: 100%; height: 12px; background: #d63031; transform: rotate(45deg); }
        .sign-text-bot { margin-top: 10px; color: #d63031; font-weight: 900; font-size: 16px; text-align: center; }

        .sign-no-grass { width: 160px; height: 160px; border: 14px solid #d63031; border-radius: 50%; position: relative; background: white; overflow: hidden; margin: 10px auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .sg-grass { position: absolute; bottom: -5px; width: 100%; height: 50px; background: #00b894; clip-path: polygon(0% 100%, 0% 50%, 10% 20%, 20% 60%, 30% 10%, 40% 55%, 50% 15%, 60% 65%, 70% 5%, 80% 50%, 90% 20%, 100% 60%, 100% 100%); }
        .sg-shoe { position: absolute; bottom: 35px; left: 30px; width: 80px; height: 40px; background: #2d3436; border-radius: 15px 40px 10px 5px; transform: rotate(-10deg); }
        .sg-slash { position: absolute; width: 150%; height: 14px; background: #d63031; transform: rotate(-45deg); top: 70px; left: -20px; z-index: 2; }

        /* ================= MODAL & NÚT NỘP BÀI ================= */
        .submit-container { text-align: center; margin: 50px 0 40px; }
        .submit-btn {
            background: linear-gradient(135deg, #00C9A7, #00A352); color: white;
            font-size: 1.3rem; font-weight: 900; padding: 20px 50px;
            border: none; border-radius: 20px; cursor: pointer;
            box-shadow: 0 8px 0 #007A3D; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 1px; font-family: 'Nunito';
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 11px 0 #007A3D; }
        .submit-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #007A3D; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 40px; border-radius: 30px; text-align: center;
            width: 90%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .modal-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 25px; color: #2C3E50;}
        .name-input {
            width: 100%; padding: 18px; border: 3px solid #E5E5E5; border-radius: 15px;
            font-size: 1.2rem; font-family: 'Nunito'; margin-bottom: 25px; font-weight: 700; text-align: center;
        }
        .name-input:focus { outline: none; border-color: #8854C0; }
        .name-input.error { border-color: #FF4757; animation: shake 0.4s; }

        .score-text { font-size: 3.5rem; font-weight: 900; color: #00D26A; margin: 15px 0; text-shadow: 3px 3px 0px rgba(0,210,106,0.2); }
        .result-gif { width: 100%; border-radius: 20px; margin-bottom: 20px; border: 4px solid #f1f1f1; }
        
        /* Hiệu ứng pháo giấy */
        .confetti { position: fixed; width: 12px; height: 12px; z-index: 9999; pointer-events: none; border-radius: 3px; }
    </style>

        // ================= HỆ THỐNG AUDIO TIÊN TIẾN =================
        let audioCtx; 
        
        // Khởi tạo context khi user tương tác lần đầu
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        // Âm thanh khi làm ĐÚNG (Web Audio API - Tiếng Ting Ting trong trẻo)
        function playDing() {
            initAudio(); 
            const osc = audioCtx.createOscillator(); 
            const gain = audioCtx.createGain(); 
            osc.connect(gain); gain.connect(audioCtx.destination); 
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(900, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); 
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.4);
        }

        // Âm thanh Huh meme khi làm SAI (Dùng MP3 theo yêu cầu, fallback Web Audio nếu lỗi mạng)
        const huhSound = new Audio('https:
        function playHuh() {
            huhSound.currentTime = 0;
            huhSound.play().catch(() => {
                initAudio();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); 
                osc.connect(gain); gain.connect(audioCtx.destination); 
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2); 
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); 
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2);
            });
        }

        // ================= HIỆU ỨNG THỊ GIÁC =================
        function playConfetti(x, y) {
            playDing();
            for(let i=0; i<45; i++) {
                let conf = document.createElement('div'); 
                conf.className = 'confetti';
                conf.style.left = x + 'px'; conf.style.top = y + 'px'; 
                conf.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 55%)`; 
                document.body.appendChild(conf);
                
                let angle = Math.random() * Math.PI * 2; 
                let velocity = Math.random() * 12 + 6; 
                let vx = Math.cos(angle) * velocity; 
                let vy = Math.sin(angle) * velocity - 12;
                
                let animate = setInterval(() => { 
                    let curX = parseFloat(conf.style.left); 
                    let curY = parseFloat(conf.style.top); 
                    vy += 0.6; // Trọng lực
                    conf.style.left = curX + vx + 'px'; 
                    conf.style.top = curY + vy + 'px'; 
                    conf.style.transform = `rotate(${curX*2}deg)`; 
                    if(curY > window.innerHeight) { clearInterval(animate); conf.remove(); } 
                }, 20);
            }
        }

        // Tạo Background Pattern nổi
        function generateFloatingSVGs() {
            const patternBg = document.getElementById('pattern-container');
            const svgs = [
                `<svg viewBox="0 0 24 24" width="30"><path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z"/></svg>`, // Ngôi sao
                `<svg viewBox="0 0 24 24" width="30"><path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/></svg>`, // Mũ tốt nghiệp
                `<svg viewBox="0 0 24 24" width="25"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,19.93C7.05,19.43 4,16.05 4,12C4,7.95 7.05,4.57 11,4.07V19.93M13,4.07C16.95,4.57 20,7.95 20,12C20,16.05 16.95,19.43 13,19.93V4.07Z"/></svg>` // Hình bán nguyệt
            ];
            
            for (let i = 0; i < 25; i++) {
                const icon = document.createElement('div');
                icon.className = 'floating-icon';
                icon.innerHTML = svgs[Math.floor(Math.random() * svgs.length)];
                icon.style.left = Math.random() * 100 + 'vw';
                icon.style.animationDuration = (Math.random() * 8 + 10) + 's';
                icon.style.animationDelay = Math.random() * 10 + 's';
                patternBg.appendChild(icon);
            }
        }

        // Hàm xáo trộn mảng thuật toán Fisher-Yates (Theo yêu cầu)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) { 
                const j = Math.floor(Math.random() * (i + 1)); 
                [array[i], array[j]] = [array[j], array[i]]; 
            } 
            return array;
        }

        // ================= RENDER BÀI KIỂM TRA =================
        let score = 0;
        let answeredQuestions = 0;
        const totalQuestions = quizData.length;

        function renderQuiz() {
            const container = document.getElementById('quiz-container');

            quizData.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q${index}`;

                // Header Instruction
                const instDiv = document.createElement('div');
                instDiv.className = 'question-text';
                instDiv.innerHTML = `<span style="display:block; font-size: 1.05rem; color: #8854C0; font-weight:900; text-transform:uppercase; margin-bottom: 15px;">${data.instruction}</span>` + data.question;
                card.appendChild(instDiv);

                // Biển báo nếu có
                if(data.signHtml) {
                    card.querySelector('.question-text').innerHTML += data.signHtml;
                }

                const grid = document.createElement('div');
                grid.className = 'options-grid';

                // Trích xuất & Xáo trộn Đáp án ngẫu nhiên
                const optionsWithState = data.options.map((opt, optIndex) => {
                    let text = opt;
                    if(data.markText) {
                        text = opt.replace(new RegExp(data.markText.replace(/<\/?u>/g, ''), 'g'), data.markText);
                    }
                    return { text: text, originalIndex: optIndex, isCorrect: optIndex === data.correct };
                });
                
                shuffleArray(optionsWithState); // Thực thi xáo trộn

                // Vẽ các nút đáp án (Không hiển thị A, B, C, D)
                optionsWithState.forEach(optData => {
                    const optionBtn = document.createElement('div');
                    optionBtn.className = 'option-card';
                    optionBtn.innerHTML = optData.text; 
                    optionBtn.onclick = (e) => handleSelectAnswer(index, optData, optionBtn, e);
                    grid.appendChild(optionBtn);
                });

                card.appendChild(grid);

                // Khung giải thích siêu chi tiết
                const expDiv = document.createElement('div');
                expDiv.className = 'explanation-box';
                expDiv.id = `explanation-${index}`;
                expDiv.innerHTML = data.explanation;
                card.appendChild(expDiv);

                container.appendChild(card);
            });
        }

        // ================= XỬ LÝ SỰ KIỆN CHỌN ĐÁP ÁN =================
        function handleSelectAnswer(qIndex, optData, clickedBtn, event) {
            initAudio(); 
            const card = document.getElementById(`q${qIndex}`);
            const optionsDivs = card.querySelectorAll('.option-card');

            // Khóa toàn bộ các nút trong câu này lại
            optionsDivs.forEach(div => div.classList.add('disabled'));

            if (optData.isCorrect) {
                clickedBtn.classList.add('correct');
                playConfetti(event.clientX, event.clientY);
                score++;
            } else {
                clickedBtn.classList.add('incorrect');
                clickedBtn.classList.add('shake-anim');
                playHuh(); // Kích hoạt âm thanh HUH meme!
                
                // Hiển thị nút Đúng để học sinh biết
                optionsDivs.forEach(div => {
                    if(div.innerHTML === getOptionText(qIndex, quizData[qIndex].correct)) {
                        div.classList.add('correct');
                    }
                });
            }

            // Tự động mở khung giải thích chi tiết ngay lập tức
            const expDiv = document.getElementById(`explanation-${qIndex}`);
            expDiv.style.display = 'block';
            
            answeredQuestions++;
        }

        function getOptionText(qIndex, originalIndex) {
            const data = quizData[qIndex];
            const opt = data.options[originalIndex];
            if(data.markText) {
                return opt.replace(new RegExp(data.markText.replace(/<\/?u>/g, ''), 'g'), data.markText);
            }
            return opt;
        }

        // ================= LOGIC NỘP BÀI & KẾT QUẢ =================
        function openNameModal() {
            if(answeredQuestions < totalQuestions) {
                if(!confirm(`Úi! Bạn mới trả lời ${answeredQuestions}/${totalQuestions} câu hỏi. Bạn có chắc chắn muốn nộp bài sớm không?`)) return;
            }
            document.getElementById('nameModal').style.display = 'flex';
            setTimeout(() => document.getElementById('studentName').focus(), 100);
        }

        function handleNameEnter(e) { if(e.key === 'Enter') submitQuiz(); }

        function submitQuiz() {
            const name = document.getElementById('studentName').value.trim();
            const nameInput = document.getElementById('studentName');

            if (!name) {
                nameInput.classList.add('error');
                nameInput.placeholder = "Ủa, nhập tên vào đây mới xem điểm được nè...";
                setTimeout(() => nameInput.classList.remove('error'), 500);
                return;
            }

            document.getElementById('nameModal').style.display = 'none';
            showResult(name);
        }

        function showResult(studentName) {
            initAudio(); 
            document.getElementById('resultModal').style.display = 'flex';
            
            let percent = (score / totalQuestions) * 100;
            const greetingH2 = document.getElementById('resultGreeting');
            const scoreDiv = document.getElementById('finalScore');
            const gifImg = document.getElementById('resultGif');

            // Cấu hình linh hoạt thông điệp & GIF meme
            if (percent === 100) {
                greetingH2.innerHTML = `🌟 THIÊN TÀI! ${studentName} xuất sắc tuyệt đối!`;
                gifImg.src = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; 
                setTimeout(playDing, 0); setTimeout(playDing, 300); setTimeout(playDing, 600);
            } else if (percent >= 60) {
                greetingH2.innerHTML = `🔥 Rất Tuyệt Vời! ${studentName} làm tốt lắm!`;
                gifImg.src = "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif"; 
                playDing();
            } else {
                greetingH2.innerHTML = `💪 Cố gắng lên nhé! ${studentName} ôn lại bài kỹ hơn xíu nha!`;
                gifImg.src = "https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"; 
                playHuh();
            }

            scoreDiv.innerText = `${score} / ${totalQuestions}`;
        }

        // ================= INITIALIZE KHỞI CHẠY =================
        window.onload = () => {
            generateFloatingSVGs();
            renderQuiz();
        };

    </script>
