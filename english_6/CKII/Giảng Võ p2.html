    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');

        :root {
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --text-main: #333;
            --pastel-pink: #ff9a9e;
            --pastel-cyan: #a1c4fd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

        body {
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #f6d365, #fda085, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow: hidden; /* Prevent body scroll, use split screen scroll */
            height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Emojis Background */
        .floating-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .emoji { position: absolute; font-size: 3rem; opacity: 0.3; animation: floatUp 20s linear infinite; }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* MÀN HÌNH KHÓA - PASTEL GLASSMORPHISM */
        #passwordModal {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        .pw-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 40px 30px; 
            max-width: 400px; width: 90%; text-align: center;
            box-shadow: var(--glass-shadow);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pw-crest { font-size: 4rem; margin-bottom: 10px; display: block; animation: floatIcon 3s ease-in-out infinite alternate; }
        @keyframes floatIcon { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
        .pw-title { font-size: 1.8rem; font-weight: 800; color: #ff6b6b; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .pw-sub { font-size: 1rem; color: #555; margin-bottom: 20px; font-weight: 600; }
        .pw-input {
            width: 100%; padding: 15px; border-radius: 15px;
            border: 2px solid #a1c4fd; background: rgba(255, 255, 255, 0.8);
            color: #333; font-size: 1.1rem; font-weight: bold;
            outline: none; text-align: center; transition: 0.3s;
            margin-bottom: 15px; font-family: 'Nunito', sans-serif; letter-spacing: 2px;
        }
        .pw-input:focus { border-color: #ff9a9e; box-shadow: 0 0 10px rgba(255, 154, 158, 0.3); }
        .pw-input.error { border-color: #dc3545; animation: shake 0.4s ease; }
        .pw-btn {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            background: linear-gradient(45deg, #00b09b, #96c93d);
            color: #fff; font-size: 1.2rem; font-weight: 800;
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0, 176, 155, 0.3);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .pw-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 176, 155, 0.4); }
        .pw-err { color: #dc3545; font-size: 0.95rem; margin-top: 10px; display: none; font-weight: 800; }

        /* Main Content Container (Hidden until unlocked) */
        #mainContent { display: block; }

        /* Header */
        header {
            position: fixed; top: 0; width: 100%; height: 50px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; z-index: 100; border-bottom: 1px solid var(--glass-border);
        }
        .header-title { font-weight: 800; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .header-author { font-size: 0.9rem; font-weight: 600; color: #fff; background: rgba(0,0,0,0.1); padding: 5px 15px; border-radius: 20px; }

        /* Split Screen Layout */
        .container { display: flex; height: calc(100vh - 50px); margin-top: 50px; }
        .pane { width: 50%; padding: 20px; overflow-y: auto; scroll-behavior: smooth; }
        .pane::-webkit-scrollbar { width: 8px; }
        .pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.8); border-radius: 10px; }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: var(--glass-shadow); padding: 25px; margin-bottom: 25px;
        }

        /* Reading Section */
        .passage-title { font-size: 1.5rem; font-weight: 800; color: #ff6b6b; margin-bottom: 15px; text-align: center;}
        .paragraph { font-size: 1.1rem; line-height: 1.8; margin-bottom: 15px; text-align: justify; }
        .translate-btn {
            background: rgba(255,255,255,0.6); border: none; padding: 8px 15px;
            border-radius: 15px; cursor: pointer; font-weight: 600; color: #0056b3;
            transition: 0.3s; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 5px;
        }
        .translate-btn:hover { background: #fff; transform: scale(1.05); }
        .translation { display: none; background: rgba(255, 235, 153, 0.5); padding: 10px; border-radius: 10px; font-style: italic; margin-bottom: 15px;}

        /* Glossary */
        .glossary-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(255,255,255,0.5); border-radius: 15px; overflow: hidden; }
        .glossary-table th, .glossary-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .glossary-table th { background: rgba(255, 255, 255, 0.7); font-weight: 800; color: #e84393; }

        /* Exercises Section */
        .question-card { transition: 0.3s; }
        .q-text { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .option-btn {
            background: rgba(255,255,255,0.7); border: 2px solid transparent; padding: 15px;
            border-radius: 15px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            text-align: left; transition: all 0.2s; word-wrap: break-word; line-height: 1.4;
        }
        .option-btn:hover:not(:disabled) { background: #fff; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .option-btn.correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .option-btn.incorrect { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; animation: shake 0.4s; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }

        @keyframes shake {
            0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-6px)} 30%,60%,90%{transform:translateX(6px)}
        }

        /* Detailed Explanation Styles (Master Level) */
        .explanation-box {
            display: none; margin-top: 20px; padding: 20px;
            background: #fff; border-radius: 15px; border-left: 5px solid #00cba9;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); font-size: 1.05rem; line-height: 1.6;
        }
        .exp-title { font-weight: 800; color: #00cba9; margin-bottom: 10px; }
        .p-word { color: #0056b3; font-weight: bold; background: rgba(0,86,179,0.1); padding: 0 4px; border-radius: 4px; }
        .p-mean { color: #cc4e00; font-style: italic; }
        .p-grammar { text-decoration: underline; text-decoration-color: red; text-decoration-thickness: 2px; font-weight: bold; }
        .hl-green { color: #28a745; font-weight: bold; }
        .hl-red { color: #dc3545; text-decoration: line-through; font-weight: bold; }
        ul.exp-list { margin-left: 20px; margin-bottom: 10px; }
        ul.exp-list li { margin-bottom: 8px; }

        /* Submit Button & Modal */
        .submit-btn {
            width: 100%; padding: 20px; background: linear-gradient(45deg, #00b09b, #96c93d);
            color: white; font-size: 1.5rem; font-weight: 800; border: none; border-radius: 20px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0, 176, 155, 0.3); margin-top: 20px;
        }
        .submit-btn:hover { transform: scale(1.02); box-shadow: 0 15px 25px rgba(0, 176, 155, 0.5); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; padding: 40px; border-radius: 30px; text-align: center;
            max-width: 500px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.2); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-input { width: 100%; padding: 15px; font-size: 1.2rem; border: 2px solid #ddd; border-radius: 15px; margin: 20px 0; outline: none; transition: 0.3s;}
        .modal-input:focus { border-color: #a1c4fd; }
        .gif-result { width: 100%; max-height: 250px; object-fit: cover; border-radius: 15px; margin-top: 20px; }

        /* Confetti */
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 999; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>

<script>
// --- LOGIC MÀN HÌNH KHÓA ---
// Mật khẩu đã được ẩn dưới dạng mã ASCII 
const _k  = [99, 111, 103, 97, 110, 103, 100, 97, 116, 100, 105, 101, 109, 99, 97, 111]; 
const _pw = _k.map(c => String.fromCharCode(c)).join('');

function checkPassword() {
  const inp = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');
  if (inp.value === _pw) {
    document.getElementById('passwordModal').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    
    // Kích hoạt âm thanh thành công khi vào bài
    if(audioCtx.state === 'suspended') audioCtx.resume();
    playSound('correct'); 
  } else {
    inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
    err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('pwInput');
  if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});

// --- AUDIO CONTEXT (Feedback Sounds) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    if(type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        createConfetti();
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
}

function createConfetti() {
    const colors = ['#ff9a9e', '#fecfef', '#f6d365', '#a1c4fd', '#00cba9'];
    for(let i=0; i<30; i++) {
        let conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.top = '-10px';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDuration = (Math.random() * 2 + 1) + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 3000);
    }
}

// --- DATA STRUCTURE (ĐÃ XÓA 100% NHÃN A, B, C, D) ---
const quizData = [
    {
        id: "p1",
        title: "Passage 1: SMART ROBOTS FOR YOUR HOME!",
        paragraphs: [
            {
                en: "Do you want to make your life easier? A smart robot (13) ____ help you clean your house, cook food, and even talk to you! Many people now use robots to (14) ____ their time and do other important things. These robots are not only helpful but also very (15) ____. In the future, robots (16) ____ in every home!",
                vi: "Bạn có muốn cuộc sống của mình dễ dàng hơn không? Một robot thông minh (13) ____ giúp bạn dọn nhà, nấu ăn và thậm chí trò chuyện với bạn! Nhiều người hiện nay sử dụng robot để (14) ____ thời gian của họ và làm những việc quan trọng khác. Những robot này không chỉ hữu ích mà còn rất (15) ____. Trong tương lai, robot (16) ____ trong mọi gia đình!"
            }
        ],
        glossary: [
            {word: "Smart", pos: "adj", mean: "Thông minh, có lập trình"},
            {word: "Easier", pos: "adj", mean: "Dễ dàng hơn (so sánh hơn)"},
            {word: "Important", pos: "adj", mean: "Quan trọng, thiết yếu"},
            {word: "Helpful", pos: "adj", mean: "Hữu ích, hay giúp đỡ"},
            {word: "Friendly", pos: "adj", mean: "Thân thiện"},
            {word: "Future", pos: "n", mean: "Tương lai"},
            {word: "Waste", pos: "v", mean: "Lãng phí"},
            {word: "Spend", pos: "v", mean: "Dành, tiêu tốn"},
            {word: "Save", pos: "v", mean: "Tiết kiệm, cứu"},
            {word: "Expensive", pos: "adj", mean: "Đắt đỏ"}
        ],
        questions: [
            {
                id: 13,
                qText: "Question 13. A smart robot (13) ____ help you clean your house...",
                options: [
                    {text: "can", correct: true, exp: "<span class='hl-green'>✅ Đúng</span> vì <span class='p-word'>can</span> chỉ <span class='p-grammar'>khả năng thực hiện hành động</span> ở hiện tại."},
                    {text: "must", correct: false, exp: "<span class='hl-red'>❌ Sai</span> vì <span class='p-word'>must</span> mang nghĩa bắt buộc, không hợp ngữ cảnh."},
                    {text: "have", correct: false, exp: "<span class='hl-red'>❌ Sai</span> <span class='p-grammar'>ngữ pháp</span> vì cần cấu trúc <span class='p-grammar'>have to + V</span>."},
                    {text: "need", correct: false, exp: "<span class='hl-red'>❌ Sai</span> <span class='p-grammar'>ngữ pháp</span> vì cần cấu trúc <span class='p-grammar'>need to + V</span>."}
                ],
                qTrans: "Một robot thông minh (13) ____ giúp bạn dọn dẹp nhà cửa...",
                quote: "A smart robot can help you clean your house...",
                quoteTrans: "Một robot thông minh <strong style='color:red'>có thể</strong> giúp bạn dọn dẹp nhà cửa..."
            },
            {
                id: 14,
                qText: "Question 14. Many people now use robots to (14) ____ their time...",
                options: [
                    {text: "waste", correct: false, exp: "<span class='hl-red'>❌ Sai</span> vì <span class='p-word'>waste</span> nghĩa là <span class='p-mean'>lãng phí</span>, không hợp logic."},
                    {text: "spend", correct: false, exp: "<span class='hl-red'>❌ Sai</span> vì <span class='p-word'>spend time</span> là <span class='p-mean'>tiêu tốn thời gian</span> (không mang ý nghĩa giải phóng thời gian)."},
                    {text: "save", correct: true, exp: "<span class='hl-green'>✅ Đúng</span> vì <span class='p-word'>save time</span> nghĩa là <span class='p-mean'>tiết kiệm thời gian</span>, hợp lý để rảnh tay làm việc khác."},
                    {text: "take", correct: false, exp: "<span class='hl-red'>❌ Sai</span> vì <span class='p-word'>take time</span> nghĩa là <span class='p-mean'>mất thời gian</span>."}
                ],
                qTrans: "Nhiều người hiện nay sử dụng robot để (14) ____ thời gian của họ...",
                quote: "...use robots to save their time and do other important things.",
                quoteTrans: "...sử dụng robot để <strong style='color:red'>tiết kiệm</strong> thời gian của họ và làm việc quan trọng khác."
            },
            {
                id: 15,
                qText: "Question 15. These robots are not only helpful but also very (15) ____.",
                options: [
                    {text: "cheap", correct: false, exp: "<span class='hl-red'>❌ Sai</span> vì đoạn văn không đề cập đến giá cả."},
                    {text: "friendly", correct: true, exp: "<span class='hl-green'>✅ Đúng</span> vì trước đó nói robot có thể 'talk to you' (trò chuyện), thể hiện sự <span class='p-mean'>thân thiện</span>."},

                ],
                qTrans: "Những robot này không chỉ hữu ích mà còn rất (15) ____.",
                quote: "...and even talk to you! These robots are not only helpful but also very friendly.",
                quoteTrans: "...và thậm chí trò chuyện với bạn! Những robot này không chỉ hữu ích mà còn rất <strong style='color:red'>thân thiện</strong>."
            },
            {
                id: 16,
                qText: "Question 16. In the future, robots (16) ____ in every home!",
                options: [
                    {text: "is", correct: false, exp: "<span class='hl-red'>❌ Sai</span> vì động từ to be chia ở hiện tại, sai thì và sai số nhiều của chủ ngữ 'robots'."},
                    {text: "are", correct: false, exp: "<span class='hl-red'>❌ Sai</span> vì đây là thì hiện tại đơn."},
                    {text: "was", correct: false, exp: "<span class='hl-red'>❌ Sai</span> vì đây là thì quá khứ đơn."},
                    {text: "will be", correct: true, exp: "<span class='hl-green'>✅ Đúng</span> vì có dấu hiệu <span class='p-word'>In the future</span> (<span class='p-mean'>Trong tương lai</span>) nên phải dùng thì <span class='p-grammar'>Tương lai đơn (will + V-inf)</span>."}
                ],
                qTrans: "Trong tương lai, robot (16) ____ trong mọi gia đình!",
                quote: "In the future, robots will be in every home!",

    },
    {
        id: "p2",
        title: "Passage 2: INTERNATIONAL ROBOT SHOW",
        paragraphs: [
            {
                en: "Many people (19) ______attending the international robot show in Ho Chi Minh City today. Young people are very interested (20) ______ home robots. These robots can cook, (21) ______coffee and tea, make bed, do the washing up clean the floors and toilets and do the gardening.",
                vi: "Nhiều người (19) ______ đang tham dự triển lãm robot quốc tế tại TP.HCM hôm nay. Giới trẻ rất quan tâm (20) ______ robot gia đình. Những robot này có thể nấu ăn, (21) ______ cà phê và trà, dọn giường, rửa bát dọn sàn và nhà vệ sinh, và làm vườn."

// --- LOGIC RENDER ---
let currentScore = 0;
let totalQuestions = 0;
let answeredQuestions = new Set();

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function initApp() {
    const readingPane = document.getElementById('readingPane');
    const exercisePane = document.getElementById('exercisePane');
    
    // Background Emojis Setup
    const bg = document.getElementById('floatingBg');
    const emojis = ['🤖', '🌍', '♻️', '🌊', '🐬', '📚', '🚀', '💡'];
    for(let i=0; i<15; i++) {
        let e = document.createElement('div');
        e.className = 'emoji';
        e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        e.style.left = Math.random() * 100 + 'vw';
        e.style.animationDuration = (Math.random() * 15 + 10) + 's';
        e.style.animationDelay = (Math.random() * 10) + 's';
        bg.appendChild(e);
    }

    // Render Data
    quizData.forEach((passage, pIndex) => {
        let pHTML = `<div class="glass-panel">
            <h2 class="passage-title">${passage.title}</h2>`;
        
        passage.paragraphs.forEach((para, i) => {
            pHTML += `
                <div class="paragraph">${para.en}</div>
                <button class="translate-btn" onclick="toggleTranslation('trans_${pIndex}_${i}')">Mở dịch đoạn này 🌟</button>
                <div class="translation" id="trans_${pIndex}_${i}">${para.vi}</div>
            `;
        });

        pHTML += `<table class="glossary-table">
            <tr><th>Word</th><th>POS</th><th>Meaning</th></tr>`;
        passage.glossary.forEach(item => {
            pHTML += `<tr>
                <td style="font-weight: bold; color: #0056b3;">${item.word}</td>
                <td style="font-style: italic; color: #888;">${item.pos}</td>
                <td>${item.mean}</td>
            </tr>`;
        });
        pHTML += `</table></div>`;
        readingPane.innerHTML += pHTML;

        passage.questions.forEach(q => {
            totalQuestions++;
            let qHTML = `<div class="glass-panel question-card" id="qCard_${q.id}">
                <div class="q-text">${q.qText}</div>
                <div class="options-grid">`;
            
            let shuffledOptions = shuffleArray([...q.options]);
            
            shuffledOptions.forEach((opt, oIndex) => {
                qHTML += `<button class="option-btn" id="btn_${q.id}_${oIndex}" onclick="checkAnswer(${q.id}, ${oIndex}, ${opt.correct})">
                    ${opt.text}
                </button>`;
            });

            let expDetails = shuffledOptions.map(opt => `<li><strong>${opt.text}:</strong> ${opt.exp}</li>`).join('');
            qHTML += `</div>
                <div class="explanation-box" id="exp_${q.id}">
                    <div class="exp-title">👩‍🏫 Ms. Chí Nên · ☎️ 0852639652giải thích chi tiết:</div>
                    <p><strong>Dịch câu hỏi:</strong> ${q.qTrans}</p>
                    <ul class="exp-list">${expDetails}</ul>
                    <p><strong>🔍 Dẫn chứng:</strong> <em>"${q.quote}"</em></p>
                    <p>👉 <strong>Dịch dẫn chứng:</strong> ${q.quoteTrans}</p>
                </div>
            </div>`;
            
            exercisePane.innerHTML += qHTML;
        });
    });
}

function toggleTranslation(id) {
    const el = document.getElementById(id);
    if(el.style.display === 'block') {
        el.style.display = 'none';
    } else {
        el.style.display = 'block';
    }
}

window.checkAnswer = function(qId, oIndex, isCorrect) {
    if(answeredQuestions.has(qId)) return;
    answeredQuestions.add(qId);

    const btn = document.getElementById(`btn_${qId}_${oIndex}`);
    const qCard = document.getElementById(`qCard_${qId}`);
    const expBox = document.getElementById(`exp_${qId}`);
    
    const buttons = qCard.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    if(isCorrect) {
        btn.classList.add('correct');
        playSound('correct');
        currentScore++;
    } else {
        btn.classList.add('incorrect');
        playSound('incorrect');
        buttons.forEach(b => {
            if(b.getAttribute('onclick').includes('true')) {
                b.classList.add('correct');
                b.style.border = '2px dashed #28a745';
            }
        });
    }

    expBox.style.display = 'block';
    expBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

window.openSubmitModal = function() {
    if(answeredQuestions.size < totalQuestions) {
        alert("Ối! Con chưa làm hết bài kìa. Hãy kiểm tra lại nhé! 🧐");
        return;
    }
    document.getElementById('resultModal').style.display = 'flex';
}

window.calculateScore = function() {
    const name = document.getElementById('studentName').value.trim();
    if(!name) {
        alert("Con quên nhập tên rồi kìa! 😅");
        return;
    }

    const percentage = (currentScore / totalQuestions) * 100;
    let gifUrl = "";
    let comment = "";

    if(percentage === 100) {
        gifUrl = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; 
        comment = `Quá xuất sắc!! Ms. Chí Nên · ☎️ 0852639652tự hào về ${name} lắm! Điểm tuyệt đối luôn! 🏆✨`;
    } else if(percentage >= 60) {
        gifUrl = "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif"; 
        comment = `Rất tốt ${name} ơi! Cố gắng chút nữa là hoàn hảo rồi! 👏🔥`;
    } else {
        gifUrl = "https://media.giphy.com/media/OPU6wzx8ktijs/giphy.gif"; 
        comment = `Ôi không, ${name} cần đọc kỹ giải thích của cô để rút kinh nghiệm nhé! Cố lên nào! 💪❤️`;
    }

    const modalContent = document.getElementById('modalContentModal');
    modalContent.innerHTML = `
        <h1 style="color: #00cba9; font-size: 2.5rem; margin-bottom: 10px;">BẢNG ĐIỂM</h1>
        <h2 style="color: #ff6b6b; margin-bottom: 20px;">Học sinh: ${name}</h2>
        <div style="font-size: 4rem; font-weight: 800; color: #ff9a9e; text-shadow: 2px 2px 5px rgba(0,0,0,0.1);">${currentScore} / ${totalQuestions}</div>
        <p style="font-size: 1.2rem; font-weight: bold; margin: 20px 0;">${comment}</p>
        <img src="${gifUrl}" class="gif-result" alt="Result GIF">
        <button class="submit-btn" onclick="location.reload()">Làm lại bài 🔄</button>
    `;
    
    if(percentage === 100) {
        let count = 0;
        let interval = setInterval(() => {
            createConfetti(); count++;
            if(count > 5) clearInterval(interval);
        }, 800);
    }
}

// Run init
initApp();
</script>
