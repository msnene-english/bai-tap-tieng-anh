<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Môn Tiếng Anh - Global Success 6</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #74b9ff;
            --secondary: #f8ffae;
            --accent: #ff7675;
            --correct: #00D26A;
            --incorrect: #FF4757;
            --text: #2d3436;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            /* New Bright Pastel Gradient Background */
            background: linear-gradient(-45deg, #a8edea, #fed6e3, #f8ffae, #e0c3fc, #8ec5fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Falling Leaves Container */
        #leaves-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }

        .leaf {
            position: absolute; top: -50px;
            animation: fall linear infinite, sway ease-in-out infinite alternate;
            opacity: 0.8;
        }

        @keyframes fall { to { top: 110vh; } }
        @keyframes sway {
            from { transform: translateX(-20px) rotate(0deg); }
            to { transform: translateX(20px) rotate(45deg); }
        }

        /* Confetti */
        #confetti-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1000;
        }

        /* ----------------------------------------------------
           GIAO DIỆN MÀN HÌNH KHÓA (TONE-ON-TONE SÁNG SỦA)
           ---------------------------------------------------- */
        #passwordModal {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        .pw-card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 24px; 
            padding: 40px 30px; max-width: 400px; width: 90%; 
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }
        .pw-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, #74b9ff, #f8ffae, #ff7675);
        }
        .pw-crest { font-size: 3.5rem; margin-bottom: 10px; display: block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .pw-title { font-family: 'Nunito', sans-serif; font-size: 1.5rem; font-weight: 800; color: #2d3436; margin-bottom: 5px; }
        .pw-sub   { font-size: 0.95rem; color: #636e72; margin-bottom: 25px; font-weight: 600; }
        .pw-input {
            width: 100%; padding: 15px 20px; border-radius: 15px;
            border: 2px solid #dfe6e9; background: #ffffff;
            color: #2d3436; font-size: 1.1rem; font-family: 'Nunito', sans-serif; font-weight: bold;
            outline: none; letter-spacing: 2px; text-align: center; transition: all .3s;
        }
        .pw-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(116, 185, 255, 0.2); }
        .pw-input.error { border-color: var(--incorrect); box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.2); animation: shake .4s ease; }
        .pw-input::placeholder { color: #b2bec3; letter-spacing: 1px; font-weight: normal; }
        .pw-btn {
            width: 100%; padding: 15px; margin-top: 15px; border-radius: 15px; border: none;
            background: linear-gradient(135deg, #74b9ff 0%, #a29bfe 100%);
            color: #fff; font-size: 1.1rem; font-weight: 800; font-family: 'Quicksand', sans-serif;
            cursor: pointer; transition: all .2s; box-shadow: 0 6px 15px rgba(116, 185, 255, 0.4);
        }
        .pw-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(116, 185, 255, 0.6); }
        .pw-btn:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(116, 185, 255, 0.4); }
        .pw-err { color: var(--incorrect); font-size: 0.9rem; margin-top: 12px; display: none; font-weight: 700; }
        
        @keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-6px)} 30%,60%,90%{transform:translateX(6px)} }

        /* Main Layout */
        header {
            position: relative; z-index: 10; text-align: center; padding: 15px;
            color: #2d3436; text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            font-size: 1rem; font-weight: 800;
        }

        .container { max-width: 800px; margin: 0 auto 50px auto; padding: 20px; position: relative; z-index: 10; }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--glass-border); border-radius: 20px; padding: 25px; margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .question-text { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; line-height: 1.5; color: #1e272e; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

        .option-btn {
            background: #ffffff; border: 2px solid #dfe6e9; border-radius: 18px; padding: 15px 20px;
            font-size: 1.08rem; font-weight: 600; color: #34495e; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 #cbd5e1; text-align: center; outline: none;
        }
        .option-btn:hover:not(:disabled) { transform: scale(1.03) translateY(-2px); box-shadow: 0 8px 0 #cbd5e1; border-color: var(--primary); }
        .option-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #cbd5e1; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.85; }

        .option-btn.correct { background-color: var(--correct); border-color: #00b058; color: white; box-shadow: 0 6px 0 #00994c; }
        .option-btn.incorrect { background-color: var(--incorrect); border-color: #e84118; color: white; box-shadow: 0 6px 0 #c23616; }

        /* Explanation Box */
        .explanation {
            display: none; margin-top: 20px; padding: 20px;
            background: rgba(255, 255, 255, 0.8); border-radius: 15px;
            font-size: 1rem; line-height: 1.6; animation: slideDown 0.3s ease-out forwards;
            border-left: 5px solid var(--accent);
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .vn-trans {
            background-color: #fff3cd; color: #856404; padding: 12px 15px; border-radius: 10px;
            font-weight: 700; margin-bottom: 15px; border-left: 4px solid #ffc107; display: block;
        }
        .p-word { color: #0984e3; font-weight: 700; }
        .p-phonetic { background-color: #e0b0ff; color: #4a0072; padding: 2px 6px; border-radius: 6px; font-family: monospace; font-weight: bold;}
        .p-mean { color: #d35400; font-style: italic; }
        .p-grammar { text-decoration: underline; text-decoration-color: #e74c3c; text-decoration-thickness: 2px; font-weight: bold; }
        .hl-green { color: var(--correct); font-weight: 800; }
        .hl-red { color: #c0392b; font-weight: bold; text-decoration: line-through; }
        
        .explanation h4 { color: #2c3e50; margin-top: 10px; margin-bottom: 5px; font-size: 1.05rem;}
        .explanation ul { padding-left: 20px; margin-bottom: 10px; }
        .explanation li { margin-bottom: 5px; }

        /* Submit Button */
        .submit-container { text-align: center; margin-top: 30px; }
        .btn-submit {
            background: linear-gradient(135deg, #ff7675, #d63031); color: white; border: none;
            padding: 15px 40px; font-size: 1.3rem; font-weight: 800; border-radius: 30px; cursor: pointer;
            box-shadow: 0 8px 0 #b33939, 0 15px 20px rgba(0,0,0,0.2); transition: all 0.2s; text-transform: uppercase;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #b33939, 0 20px 25px rgba(0,0,0,0.2); }
        .btn-submit:active { transform: translateY(6px); box-shadow: 0 2px 0 #b33939; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: white; border-radius: 25px; padding: 40px; text-align: center;
            max-width: 450px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .name-input {
            width: 100%; padding: 15px; border: 3px solid #dfe6e9; border-radius: 15px;
            font-size: 1.1rem; margin: 20px 0; outline: none; transition: 0.3s;
            font-family: 'Quicksand', sans-serif; font-weight: 600; text-align: center;
        }
        .name-input:focus { border-color: var(--primary); }
        
        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 12px 30px;
            font-size: 1.1rem; font-weight: 700; border-radius: 15px; cursor: pointer;
            box-shadow: 0 5px 0 #0984e3; transition: 0.2s;
        }
        .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #0984e3; }
        
        .result-gif { width: 100%; max-width: 250px; border-radius: 15px; margin: 20px 0; }
        .score-text { font-size: 2.5rem; font-weight: 800; color: #2d3436; margin-bottom: 10px; }
        .greeting-text { font-size: 1.3rem; font-weight: 700; color: #d63031; }

        /* Custom drawn images */
        .custom-img-box {
            background: #74b9ff; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px;
            border: 4px dashed #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .cloud-shape {
            background: white; border-radius: 50%; padding: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.1);
            display: inline-block; position: relative;
        }
        .cloud-shape::before, .cloud-shape::after { content: ''; position: absolute; background: white; border-radius: 50%; }
        .cloud-shape::before { width: 50px; height: 50px; top: -20px; left: 20px; }
        .cloud-shape::after { width: 70px; height: 70px; top: -30px; right: 20px; }
        .cloud-text { position: relative; z-index: 2; font-weight: 900; }
        
        .sign-box {
            background: white; border: 5px solid black; border-radius: 10px; width: 150px; height: 180px;
            margin: 0 auto 20px auto; position: relative; display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .sign-circle {
            width: 100px; height: 100px; border: 8px solid red; border-radius: 50%; position: relative;
            display: flex; justify-content: center; align-items: center; font-size: 40px; overflow: hidden;
        }
        .sign-line { position: absolute; width: 110%; height: 8px; background: red; transform: rotate(45deg); z-index: 2; }
        .sign-text { font-weight: 900; font-size: 1.1rem; margin-top: 10px; font-family: sans-serif; }

    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>

    

    <div id="mainContent" style="display: block;">
        <div id="leaves-container"></div>
        <div id="confetti-container"></div>

        <header>Giáo viên tạo: Ms. Chí Nên · ☎️ 0852639652</header>

        <div class="container" id="quiz-container">
            </div>

        <div class="submit-container">
            <button class="btn-submit" onclick="openNameModal()">🎯 NỘP BÀI & XEM KẾT QUẢ</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-name">
        <div class="modal-content">
            <h2 style="color: #2d3436; margin-bottom: 10px;">Bạn tên là gì nhỉ? 🤔</h2>
            <p style="color: #636e72;">Hãy nhập tên để xem kết quả siêu xịn nhé!</p>
            <input type="text" id="student-name" class="name-input" placeholder="Ví dụ: Nguyễn Văn A...">
            <button class="btn-primary" onclick="submitName()">Xem Kết Quả 🚀</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-result">
        <div class="modal-content">
            <div class="greeting-text" id="result-greeting"></div>
            <div class="score-text" id="result-score"></div>
            <img src="" id="result-gif" class="result-gif" alt="Result GIF">
            <p style="color: #636e72; font-weight: 600;">Cảm ơn em đã hoàn thành bài kiểm tra!</p>
            <button class="btn-primary" style="margin-top: 15px;" onclick="location.reload()">Làm lại bài 🔄</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           0. XỬ LÝ MẬT KHẨU & MỞ KHÓA BÀI THI
           ========================================================================== */
        const _k  = [99, 111, 103, 97, 110, 103, 100, 97, 116, 100, 105, 101, 109, 99, 97, 111]; 
        const _pw = _k.map(c => String.fromCharCode(c)).join('');

        function checkPassword() {
            const inp = document.getElementById('pwInput');
            const err = document.getElementById('pwErr');
            
            if (inp.value === _pw) {
                // 1. Ẩn màn hình khóa và hiện nội dung bài
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                // 2. TẠO HOA LÁ & RENDER ĐỀ
                createLeaves();
                renderQuiz();

                // 3. PHÁT FILE ÂM THANH NHẮC NHỞ KHÍCH LỆ
                const encouragAudio = new Audio('https:
                encouragAudio.play().catch(e => console.log("Lỗi phát âm thanh: ", e));
                
            } else {
                inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
                err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const pwInput = document.getElementById('pwInput');
            if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
        });

        /* ==========================================================================
           1. CORE DATA (DỮ LIỆU ĐỀ BÀI & GIẢI THÍCH CHI TIẾT)
           ========================================================================== */
           const quizData = [
            {
                id: 1,
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word whose underlined part differs from the other three in pronunciation.",
                text: "Question 1. A. ear<u>th</u> B. <u>th</u>ank C. fea<u>th</u>er D. <u>th</u>eater",
                options: [
                    { text: "earth", correct: false },
                    { text: "thank", correct: false },
                    { text: "feather", correct: true },
                    { text: "theater", correct: false }
                ],
                explanation: `
                    <div class='vn-trans'>Dịch câu hỏi: Chọn từ có phần gạch chân phát âm khác với các từ còn lại.</div>
                    <h4>1. Phân tích 4 đáp án:</h4>
                    <ul>
                        <li><span class='p-word'>earth</span> <span class='p-phonetic'>/ɜːθ/</span> - <span class='p-mean'>trái đất</span>. Chữ "th" phát âm là /θ/.</li>
                        <li><span class='p-word'>thank</span> <span class='p-phonetic'>/θæŋk/</span> - <span class='p-mean'>cảm ơn</span>. Chữ "th" phát âm là /θ/.</li>
                        <li><span class='p-word'>feather</span> <span class='p-phonetic'>/ˈfeð.ər/</span> - <span class='p-mean'>lông vũ</span>. Chữ "th" phát âm là /ð/.</li>
                        <li><span class='p-word'>theater</span> <span class='p-phonetic'>/ˈθɪə.tər/</span> - <span class='p-mean'>nhà hát</span>. Chữ "th" phát âm là /θ/.</li>
                    </ul>
                    <h4>2. Tại sao chọn feather?</h4>
                    <p>Trong từ "feather", phần gạch chân được phát âm là <span class='p-grammar'>âm hữu thanh /ð/</span>, trong khi các đáp án còn lại đều phát âm là <span class='p-grammar'>âm vô thanh /θ/</span>.</p>
                    <p>=> <span class='hl-green'>Đúng: feather</span>. <span class='hl-red'>Sai: earth, thank, theater</span>.</p>
                `
            },
            {
                id: 2,
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word whose underlined part differs from the other three in pronunciation.",
                text: "Question 2. A. spe<u>c</u>ial B. skys<u>c</u>raper C. <u>c</u>astle D. automati<u>c</u>",
                options: [
                    { text: "special", correct: true },
                    { text: "skyscraper", correct: false },
                    { text: "castle", correct: false },
                    { text: "automatic", correct: false }
                ],
                explanation: `
                    <div class='vn-trans'>Dịch câu hỏi: Chọn từ có phần gạch chân (chữ 'c') phát âm khác với các từ còn lại.</div>
                    <h4>1. Phân tích 4 đáp án:</h4>
                    <ul>
                        <li><span class='p-word'>special</span> <span class='p-phonetic'>/ˈspeʃ.əl/</span> - <span class='p-mean'>đặc biệt</span>. Chữ "c" phát âm là /ʃ/.</li>
                        <li><span class='p-word'>skyscraper</span> <span class='p-phonetic'>/ˈskaɪˌskreɪ.pər/</span> - <span class='p-mean'>tòa nhà chọc trời</span>. Chữ "c" phát âm là /k/.</li>
                        <li><span class='p-word'>castle</span> <span class='p-phonetic'>/ˈkɑː.səl/</span> - <span class='p-mean'>lâu đài</span>. Chữ "c" phát âm là /k/ (kết hợp 'ca').</li>
                        <li><span class='p-word'>automatic</span> <span class='p-phonetic'>/ˌɔː.təˈmæt.ɪk/</span> - <span class='p-mean'>tự động</span>. Chữ "c" cuối phát âm là /k/.</li>
                    </ul>
                    <h4>2. Tại sao chọn special?</h4>
                    <p>Phụ âm "c" trong từ "special" được phát âm là <span class='p-grammar'>/ʃ/ (sờ nặng)</span>, trong khi các từ còn lại chữ "c" đều được phát âm là <span class='p-grammar'>/k/</span>.</p>
                    <p>=> <span class='hl-green'>Đúng: special</span>. <span class='hl-red'>Sai: skyscraper, castle, automatic</span>.</p>
                `
            },
            {
                id: 3,
                instruction: "Mark the letter A, B, C or D to indicate the word that differs from the other three in the position of primary stress.",
                text: "Question 3. A. series B. cartoon C. country D. nation",
                options: [
                    { text: "series", correct: false },
                    { text: "cartoon", correct: true },
                    { text: "country", correct: false },
                    { text: "nation", correct: false }
                ],
                explanation: `
                    <div class='vn-trans'>Dịch câu hỏi: Chọn từ có vị trí trọng âm chính khác với các từ còn lại.</div>
                    <h4>1. Phân tích 4 đáp án:</h4>
                    <ul>
                        <li><span class='p-word'>series</span> <span class='p-phonetic'>/ˈsɪə.riːz/</span> - <span class='p-mean'>chuỗi, phim bộ</span>. Trọng âm rơi vào âm tiết thứ 1.</li>
                        <li><span class='p-word'>cartoon</span> <span class='p-phonetic'>/kɑːˈtuːn/</span> - <span class='p-mean'>phim hoạt hình</span>. Trọng âm rơi vào âm tiết thứ 2.</li>
                        <li><span class='p-word'>country</span> <span class='p-phonetic'>/ˈkʌn.tri/</span> - <span class='p-mean'>đất nước</span>. Trọng âm rơi vào âm tiết thứ 1.</li>
                        <li><span class='p-word'>nation</span> <span class='p-phonetic'>/ˈneɪ.ʃən/</span> - <span class='p-mean'>quốc gia</span>. Trọng âm rơi vào âm tiết thứ 1.</li>
                    </ul>
                    <h4>2. Tại sao chọn cartoon?</h4>
                    <p>Từ "cartoon" có trọng âm rơi vào âm tiết thứ hai. Quy tắc: <span class='p-grammar'>Các từ có tận cùng là -oon thường nhận trọng âm vào chính nó</span>. Các đáp án còn lại có trọng âm ở âm tiết thứ nhất.</p>
                    <p>=> <span class='hl-green'>Đúng: cartoon</span>. <span class='hl-red'>Sai: series, country, nation</span>.</p>
                `
            },
            {
                id: 4,
                instruction: "Mark the letter A, B, C or D to indicate the word that differs from the other three in the position of primary stress.",
                text: "Question 4. A. recycle B. recognize C. national D. marathon",
                options: [
                    { text: "recycle", correct: true },
                    { text: "recognize", correct: false },
                    { text: "national", correct: false },
                    { text: "marathon", correct: false }
                ],
                explanation: `
                    <div class='vn-trans'>Dịch câu hỏi: Chọn từ có vị trí trọng âm chính khác với các từ còn lại.</div>
                    <h4>1. Phân tích 4 đáp án:</h4>
                    <ul>

                        <li><span class='p-word'>B. but (nhưng)</span>: <span class='p-mean'>Chỉ sự tương phản. Chị tôi bơi giỏi NHƯNG không biết chơi cầu lông. (Hợp lý).</span></li>
                        <li><span class='p-word'>C. both...and (cả hai)</span>: <span class='p-mean'>Sai cấu trúc khi vế sau ở dạng phủ định (can't).</span></li>
                        <li><span class='p-word'>D. and (và)</span>: <span class='p-mean'>Làm mất đi chữ "can't" (không thể) của câu gốc, sai hoàn toàn nghĩa gốc.</span></li>
                    </ul>
                    <h4>2. Tại sao chọn B?</h4>
                    <p>Hai câu đơn mang ý nghĩa trái ngược nhau (một bên khẳng định khả năng có thể làm - "can", một bên phủ định - "can't"). Do đó, ta dùng liên từ chỉ sự tương phản <span class='p-grammar'>but (nhưng)</span> để nối hai câu lại.</p>
                    <p>=> <span class='hl-green'>Đúng: Đáp án B</span>.</p>
                `
            },
            {
                id: 26,
                instruction: "Mark the letter A, B, C or D to indicate the sentence that closest in meaning to the original sentence.",
                text: "Question 26. Mai didn’t understand the lesson. She couldn’t do the homework.",
                options: [
                    { text: "Mai didn’t understand the lesson but she couldn’t do the homework.", correct: false },
                    { text: "Mai didn’t understand the lesson because she couldn’t do the homework.", correct: false },
                    { text: "Mai didn’t understand the lesson so she couldn’t do the homework", correct: true },
                    { text: "Mai didn’t understand the lesson and she couldn’t do the homework.", correct: false }
                ],
                explanation: `
                    <div class='vn-trans'>Dịch câu gốc: Mai không hiểu bài. Cô ấy không thể làm bài tập về nhà.</div>
                    <h4>1. Phân tích 4 đáp án (Từ nối):</h4>
                    <ul>
                        <li><span class='p-word'>A. but (nhưng)</span>: <span class='p-mean'>Chỉ sự tương phản (Sai logic vì đây là quan hệ nhân-quả).</span></li>
                        <li><span class='p-word'>B. because (bởi vì)</span>: <span class='p-mean'>Mai không hiểu bài BỞI VÌ cô ấy không làm được bài tập. (Sai logic ngược).</span></li>
                        <li><span class='p-word'>C. so (vì vậy)</span>: <span class='p-mean'>Mai không hiểu bài VÌ VẬY cô ấy không thể làm bài tập. (Logic Nguyên nhân -> Kết quả chuẩn xác).</span></li>
                        <li><span class='p-word'>D. and (và)</span>: <span class='p-mean'>Chỉ bổ sung thông tin (chưa thể hiện rõ mối quan hệ).</span></li>
                    </ul>
                    <h4>2. Tại sao chọn C?</h4>
                    <p>Câu 1 là nguyên nhân (không hiểu bài), câu 2 là hậu quả (không làm được bài tập). Ta dùng liên từ <span class='p-grammar'>so (vì vậy / cho nên)</span> để nối.</p>
                    <p>=> <span class='hl-green'>Đúng: Đáp án C</span>.</p>
                `
            },
            {
                id: 27,
                instruction: "Mark the letter A, B, C or D to indicate the sentence that is made from the given cues.",
                text: "Question 27. Temple of Literature/ one/ Ha Noi’s/ famous/ landmarks.",
                options: [
                    { text: "Temple of Literature is one of Ha Noi’s most famous landmarks", correct: true },
                    { text: "Temple of Literature is one Ha Noi’s most famous landmarks", correct: false },
                    { text: "Temple of Literature is one in Ha Noi’s most famous landmarks.", correct: false },
                    { text: "Temple of Literature one is Ha Noi’s most famous landmark.", correct: false }
                ],
                explanation: `
                    <div class='vn-trans'>Dịch câu cần dựng: Văn Miếu là một trong những danh thắng nổi tiếng nhất của Hà Nội.</div>
                    <h4>1. Phân tích 4 đáp án:</h4>
                    <ul>
                        <li><span class='p-word'>A. is one of... landmarks</span>: <span class='p-mean'>Cấu trúc "one of + Noun(số nhiều)" cực kì chuẩn xác.</span></li>
                        <li><span class='p-word'>B. is one Ha Noi's...</span>: <span class='p-mean'>Thiếu giới từ "of" sau "one".</span></li>
                        <li><span class='p-word'>C. is one in Ha Noi's...</span>: <span class='p-mean'>Dùng sai giới từ (in thay vì of).</span></li>
                        <li><span class='p-word'>D. one is Ha Noi's... landmark</span>: <span class='p-mean'>Sai trật tự từ, và từ "landmark" thiếu 's' số nhiều.</span></li>
                    </ul>
                    <h4>2. Tại sao chọn A?</h4>
                    <p>Ta áp dụng cấu trúc ngữ pháp quan trọng: <span class='p-grammar'>S + be + one of + the/Tính từ sở hữu + Noun (số nhiều)</span> - (một trong những...). Danh từ "landmarks" bắt buộc phải thêm 's'.</p>
                    <p>=> <span class='hl-green'>Đúng: Đáp án A</span>.</p>
                `
            },
            {
                id: 28,
                instruction: "Mark the letter A, B, C or D to indicate the sentence that is made from the given cues.",
                text: "Question 28. Hoi An/ famous/ old houses and buildings/ traditional crafts.",
                options: [
                    { text: "Hoi An is famous old houses and buildings and traditional crafts.", correct: false },
                    { text: "Hoi An is famous for houses and buildings and traditional crafts.", correct: true },
                    { text: "Hoi An is famous of old houses and buildings and traditional crafts.", correct: false },
                    { text: "Hoi An is famous by old houses and buildings and traditional crafts.", correct: false }
                ],
                explanation: `
                    <div class='vn-trans'>Dịch câu cần dựng: Hội An nổi tiếng vì những ngôi nhà và tòa nhà cổ và các nghề thủ công truyền thống.</div>
                    <h4>1. Phân tích 4 đáp án (Giới từ đi kèm famous):</h4>
                    <ul>
                        <li><span class='p-word'>A. famous old houses...</span>: <span class='p-mean'>Thiếu giới từ sau famous.</span></li>
                        <li><span class='p-word'>B. famous for houses...</span>: <span class='p-mean'>Dùng đúng giới từ "for".</span></li>
                        <li><span class='p-word'>C. famous of</span>: <span class='p-mean'>Sai giới từ.</span></li>
                        <li><span class='p-word'>D. famous by</span>: <span class='p-mean'>Sai giới từ.</span></li>
                    </ul>
                    <h4>2. Tại sao chọn B?</h4>
                    <p>Cấu trúc cố định (Collocation): <span class='p-grammar'>be famous for + Noun/V-ing</span> (Nổi tiếng vì cái gì). Các giới từ "of", "by" đều sai ngữ pháp.</p>
                    <p>=> <span class='hl-green'>Đúng: Đáp án B</span>.</p>
                `
            },
            {
                id: 29,
                instruction: "What does the notice say?",
                text: `
                    Question 29. Biển báo dưới đây nói gì?
                    <div class="custom-img-box">
                        <div class="cloud-shape">
                            <div class="cloud-text">
                                <p style="color: #ff9f43; font-size: 0.9rem;">READY FROM THIS THURSDAY</p>
                                <p style="color: #f1c40f; font-size: 1.2rem; text-shadow: 1px 1px 0 #000;">FLORIDA</p>
                                <p style="color: #ee5253; font-size: 2rem; font-weight: 900; margin: 5px 0;">SWIMMING</p>
                                <p style="color: #ff9f43; font-size: 0.8rem;">FREE TICKET FOR UNDER 5 YEARS OLD</p>
                            </div>
                        </div>
                    </div>
                `,
                options: [
                    { text: "From this Thursday, people can go swimming", correct: false },
                    { text: "Children under 5 years ago don't need to pay", correct: true },
                    { text: "Only children under 5 can swim", correct: false },
                    { text: "Free tickets for everyone", correct: false }
                ],
                explanation: `
                    <div class='vn-trans'>Dịch nội dung biển báo: "Sẵn sàng từ Thứ Năm tuần này - FLORIDA SWIMMING - Vé miễn phí cho trẻ dưới 5 tuổi".</div>
                    <h4>1. Phân tích 4 đáp án:</h4>
                    <ul>
                        <li><span class='p-word'>A. From this Thursday, people can go swimming</span> <span class='p-mean'>Từ thứ 5 này, mọi người có thể đi bơi. (Đúng 1 nửa, thiếu ý chính về khuyến mãi).</span></li>
                        <li><span class='p-word'>B. Children under 5 years ago don't need to pay</span> <span class='p-mean'>Trẻ em dưới 5 tuổi không cần phải trả tiền. (Trùng khớp ý nghĩa "Free ticket for under 5").</span></li>
                        <li><span class='p-word'>C. Only children under 5 can swim</span> <span class='p-mean'>CHỈ trẻ dưới 5 tuổi mới được bơi. (Sai sự thật, biển không cấm người lớn).</span></li>
                        <li><span class='p-word'>D. Free tickets for everyone</span> <span class='p-mean'>Vé miễn phí cho TẤT CẢ mọi người. (Sai sự thật).</span></li>
                    </ul>
                    <h4>2. Tại sao chọn B?</h4>
                    <p>Cụm từ trên bảng <span class='p-grammar'>"Free ticket" (Vé miễn phí)</span> đồng nghĩa với việc <span class='p-grammar'>"don't need to pay" (không cần trả tiền)</span> dành cho đối tượng "under 5 years old" (dưới 5 tuổi).</p>
                    <p>=> <span class='hl-green'>Đúng: Đáp án B</span>.</p>
                `
            },
            {
                id: 30,
                instruction: "Question 30. What does the sign mean?",
                text: `
                    <div class="sign-box">
                        <div class="sign-circle">
                            <span style="z-index: 1;">🏊‍♂️</span>
                            <div class="sign-line"></div>
                        </div>
                        <div class="sign-text">NO SWIMMING</div>
                    </div>
                `,
                options: [
                    { text: "You can not swim here.", correct: true },
                    { text: "You can go swimming here", correct: false },
                    { text: "You can not swim alone", correct: false },
                    { text: "You can go fishing here", correct: false }
                ],
                explanation: `
                    <div class='vn-trans'>Dịch biển báo: Cấm Bơi (Có gạch chéo đỏ).</div>
                    <h4>1. Phân tích 4 đáp án:</h4>
                    <ul>
                        <li><span class='p-word'>A. You can not swim here.</span> <span class='p-mean'>Bạn KHÔNG THỂ bơi ở đây. (Phù hợp ý nghĩa Cấm bơi).</span></li>
                        <li><span class='p-word'>B. You can go swimming here</span> <span class='p-mean'>Bạn CÓ THỂ bơi ở đây. (Trái ngược hoàn toàn biển báo).</span></li>
                        <li><span class='p-word'>C. You can not swim alone</span> <span class='p-mean'>Bạn không thể bơi MỘT MÌNH.</span></li>
                        <li><span class='p-word'>D. You can go fishing here</span> <span class='p-mean'>Bạn có thể ĐI CÂU CÁ ở đây. (Lạc đề).</span></li>
                    </ul>
                    <h4>2. Tại sao chọn A?</h4>
                    <p>Biển báo có viền đỏ gạch chéo chèn lên hình người đang bơi kèm dòng chữ "NO SWIMMING" là biển báo cấm. Từ ngữ pháp tương đương thể hiện sự cấm đoán là <span class='p-grammar'>can not (không thể / không được phép)</span>.</p>
                    <p>=> <span class='hl-green'>Đúng: Đáp án A</span>.</p>
                `
            }
        ];

        let score = 0;
        let answeredQuestions = 0;

        /* ==========================================================================
           2. AUDIO: ĐÚNG TỰ SINH (WEB API), SAI LẤY LINK NGOÀI THEO YÊU CẦU
           ========================================================================== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playCorrectSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); // C6
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playIncorrectSound() {
            // Sử dụng file audio "Huh" theo yêu cầu
            const huhSound = new Audio('https:
            huhSound.play().catch(e => console.log("Lỗi phát âm thanh sai: ", e));
        }

        /* ==========================================================================
           3. VISUAL EFFECTS (CONFETTI & LEAVES)
           ========================================================================== */
        function createLeaves() {
            const container = document.getElementById('leaves-container');
            const leafColors = ['#00D26A', '#f8ffae', '#ff7675', '#74b9ff'];
            for(let i=0; i<15; i++) {
                let leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.style.left = Math.random() * 100 + 'vw';
                leaf.style.animationDuration = (Math.random() * 5 + 5) + 's, ' + (Math.random() * 3 + 2) + 's';
                leaf.style.animationDelay = (Math.random() * 5) + 's, 0s';
                leaf.innerHTML = `<svg width="25" height="25" viewBox="0 0 24 24" fill="${leafColors[Math.floor(Math.random()*leafColors.length)]}"><path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 7,14 7,14C7,14 14,8 17,8Z"/></svg>`;
                container.appendChild(leaf);
            }
        }

        function shootConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#f1c40f', '#e74c3c', '#9b59b6', '#3498db', '#2ecc71'];
            for(let i=0; i<50; i++) {
                let confetti = document.createElement('div');
                confetti.style.position = 'absolute';
                confetti.style.width = '10px'; confetti.style.height = '10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = '50%'; confetti.style.top = '50%';
                confetti.style.transform = 'translate(-50%, -50%)';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                
                let velocity = { x: (Math.random() - 0.5) * 20, y: (Math.random() - 1) * 20 };
                container.appendChild(confetti);
                let top = window.innerHeight / 2, left = window.innerWidth / 2, opacity = 1;
                
                function animate() {
                    top += velocity.y; left += velocity.x; velocity.y += 0.5; opacity -= 0.02;
                    confetti.style.top = top + 'px'; confetti.style.left = left + 'px'; confetti.style.opacity = opacity;
                    if(opacity > 0) { requestAnimationFrame(animate); } else { confetti.remove(); }
                }
                requestAnimationFrame(animate);
            }
        }

        /* ==========================================================================
           4. QUIZ LOGIC (RENDER & SHUFFLE)
           ========================================================================== */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            quizData.forEach((q) => {
                let panel = document.createElement('div');
                panel.className = 'glass-panel';
                let instHtml = q.instruction ? `<p style="font-style: italic; color: #636e72; margin-bottom: 10px; font-size: 0.95rem;">${q.instruction}</p>` : '';
                
                let html = `
                    ${instHtml}
                    <div class="question-text">${q.text}</div>
                    <div class="options-grid" id="options-${q.id}"></div>
                    <div class="explanation" id="exp-${q.id}">${q.explanation}</div>
                `;
                panel.innerHTML = html;
                container.appendChild(panel);

                let optionsGrid = document.getElementById(`options-${q.id}`);
                let shuffledOptions = shuffleArray([...q.options]);
                
                shuffledOptions.forEach((opt) => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = opt.text;
                    btn.onclick = () => handleAnswer(btn, q.id, opt.correct, optionsGrid);
                    optionsGrid.appendChild(btn);
                });
            });
        }

        function handleAnswer(btn, questionId, isCorrect, grid) {
            let buttons = grid.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
            document.getElementById(`exp-${questionId}`).style.display = 'block';

            if(isCorrect) {
                btn.classList.add('correct');
                playCorrectSound(); shootConfetti(); score++;
            } else {
                btn.classList.add('incorrect'); btn.classList.add('shake');
                playIncorrectSound();
                buttons.forEach(b => {
                    let originalOpt = quizData.find(q => q.id === questionId).options.find(o => o.text === b.innerHTML);
                    if(originalOpt && originalOpt.correct) {
                        b.style.border = '3px solid var(--correct)'; b.style.color = 'var(--correct)';
                    }
                });
            }
            answeredQuestions++;
        }

        /* ==========================================================================
           5. SUBMIT & RESULTS LOGIC
           ========================================================================== */
        function openNameModal() {
            if(answeredQuestions < quizData.length) {
                alert(`Em mới làm ${answeredQuestions}/${quizData.length} câu thôi kìa. Làm hết đi rồi mới nộp nhé! 😉`);
                return;
            }
            document.getElementById('modal-name').style.display = 'flex';
            document.getElementById('student-name').focus();
        }

        function submitName() {
            const input = document.getElementById('student-name');
            const name = input.value.trim();
            if(name === '') {
                input.classList.add('error'); setTimeout(() => input.classList.remove('error'), 400); return;
            }
            document.getElementById('modal-name').style.display = 'none';
            showResults(name);
        }

        document.getElementById('student-name').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitName();
        });

        function showResults(name) {
            const modal = document.getElementById('modal-result');
            const percentage = (score / quizData.length) * 100;
            
            document.getElementById('result-score').innerText = `${score} / ${quizData.length}`;
            
            if(percentage === 100) {
                document.getElementById('result-greeting').innerText = `🌟 THIÊN TÀI! ${name} xuất sắc tuyệt đối!`;
                document.getElementById('result-gif').src = "https://media.giphy.com/media/l41YkxvU8c7J7Bba0/giphy.gif"; 
                shootConfetti(); setTimeout(shootConfetti, 500);
            } else if(percentage >= 60) {
                document.getElementById('result-greeting').innerText = `🔥 RẤT ĐỈNH! ${name} làm tốt lắm!`;
                document.getElementById('result-gif').src = "https://media.giphy.com/media/11ISwbgCxEzMyY/giphy.gif"; 
            } else {
                document.getElementById('result-greeting').innerText = `😅 CỐ LÊN NHÉ ${name}! Lần sau sẽ tốt hơn!`;
                document.getElementById('result-gif').src = "https://media.giphy.com/media/3o6wrvdHFbwBrUFenu/giphy.gif";
            }
            modal.style.display = 'flex';
        }
    </script>

</html>
