<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh Thú Vị</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #8854C0;
            --success: #00D26A;
            --error: #FF4757;
            --pastel-white: rgba(255, 255, 255, 0.85);
            --text-color: #2C3A47;
            --sign-red: #C0392B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #e7bef8, #f8f6be, #beedf8, #cdbdfb);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            min-height: 100vh;
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
            padding: 10px;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🦄 Unicorn bay bay hiệu ứng background */
        .bg-unicorns {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-unicorn {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(110vh) translateX(0); }
            100% { transform: translateY(-10vh) translateX(100px); }
        }

        /* Container & Glassmorphism */
        .container {
            max-width: 850px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            padding: 25px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            position: relative;
            z-index: 1;
            margin-bottom: 100px;
        }

        .header { text-align: right; margin-bottom: 15px; }

        .teacher-tag {
            font-size: 0.9rem;
            color: #6d419e;
            font-weight: 700;
            background: rgba(255,255,255,0.7);
            padding: 5px 15px;
            border-radius: 20px;
        }

        h1.main-title {
            text-align: center;
            color: #fff;
            background: var(--primary);
            padding: 15px;
            border-radius: 15px;
            font-size: 2rem;
            margin-bottom: 25px;
            box-shadow: 0 5px 0 #6d419e;
        }

        /* Questions Section */
        .section-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            background: #f1a7b9;
            padding: 8px 15px;
            border-radius: 10px;
            margin-top: 25px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .question-block {
            background: var(--pastel-white);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid white;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .question-text u {
            text-decoration: underline;
            text-decoration-color: var(--primary);
            text-decoration-thickness: 3px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .option-card {
            background: white;
            border-radius: 18px;
            padding: 15px 20px;
            cursor: pointer;
            position: relative;
            border: 2px solid #EAEAEA;
            box-shadow: 0 6px 0 #EAEAEA;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .option-card:hover:not(.locked) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 0 #DCDCDC;
            border-color: #DCDCDC;
        }

        .option-card:active:not(.locked) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #DCDCDC;
        }

        .option-text {
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--text-color);
        }

        /* Visual Feedback States */
        .option-card.correct { background-color: var(--success) !important; border-color: #00A855 !important; box-shadow: 0 6px 0 #00A855 !important; }
        .option-card.correct .option-text { color: white !important; }

        .option-card.incorrect { background-color: var(--error) !important; border-color: #D63031 !important; box-shadow: 0 6px 0 #D63031 !important; animation: shake 0.5s ease-in-out; }
        .option-card.incorrect .option-text { color: white !important; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .option-card.locked { cursor: default; opacity: 0.8; }

        /* Explanation Box */
        .explanation-container {
            display: none;
            margin-top: 20px;
            border-radius: 15px;
            border-left: 5px solid var(--primary);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95);
            animation: slideInDown 0.4s ease-out;
        }

        @keyframes slideInDown {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .explanation-content { padding: 20px; font-size: 1rem; line-height: 1.7; }

        .vietnamese-translation {
            background: #FFE0B2; color: #D35400; padding: 10px 15px; border-radius: 10px;
            font-weight: bold; margin-bottom: 15px; border: 1px dashed #E67E22;
        }

        .p-word { color: #0984E3; font-weight: bold; }
        .p-phonetic { background: #E8E8FF; color: #6C5CE7; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .p-mean { color: #D35400; font-style: italic; }
        .p-grammar { text-decoration: underline; text-decoration-color: red; font-weight: bold; }
        .hl-green { color: #00B894; font-weight: 900; }
        .hl-red { color: #D63031; text-decoration: line-through; font-weight: bold; }

        /* --- SIGNS UI REDESIGN --- */
        
        /* Câu 29: Biển báo No Cell Phone Use vẽ lại chuẩn ảnh */
        .sign-no-cell {
            border: 3px solid var(--sign-red);
            border-radius: 8px;
            width: 140px;
            margin: 10px auto;
            background: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .sign-no-cell-header {
            background: var(--sign-red);
            color: white;
            font-weight: 900;
            font-size: 0.9rem;
            padding: 10px 5px;
            text-align: center;
            font-family: 'Arial', sans-serif;
            line-height: 1.1;
        }
        .sign-no-cell-body {
            padding: 15px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }
        .sign-no-cell-circle {
            position: relative;
            width: 80px;
            height: 80px;
            border: 8px solid var(--sign-red);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sign-no-cell-circle::after {
            content: '';
            position: absolute;
            width: 90px;
            height: 8px;
            background: var(--sign-red);
            transform: rotate(-45deg);
            z-index: 2; /* Nằm đè lên cái điện thoại */
        }
        .sign-no-cell-icon {
            position: relative;
            z-index: 1; /* Nằm dưới đường gạch chéo */
        }

        /* Câu 30 */
        .emergency-exit-sign {
            background: var(--sign-red); color: white; border: 8px solid white;
            border-radius: 5px; font-weight: 900; padding: 15px;
            font-size: 1.5rem; text-align: center; display: inline-block;
            box-shadow: 0 0 0 4px var(--sign-red);
            font-family: 'Arial', sans-serif; letter-spacing: 1px;
        }

        /* Submit Button */
        .submit-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px);
            padding: 15px; text-align: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); z-index: 100;
        }

        .submit-final-btn {
            background: linear-gradient(135deg, #FF6B81, #FF4757); color: white;
            border: none; border-radius: 50px; padding: 15px 40px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 6px 0 #BD3645; transition: all 0.2s;
        }
        .submit-final-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 9px 0 #BD3645; }
        .submit-final-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #BD3645; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none;
            justify-content: center; align-items: center;
            z-index: 200; backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white; border-radius: 25px; padding: 30px;
            width: 90%; max-width: 500px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .name-input {
            width: 100%; padding: 15px; border-radius: 12px;
            border: 2px solid #EAEAEA; font-size: 1.1rem;
            margin-bottom: 10px; font-weight: 700; text-align: center;
        }
        .name-input:focus { outline: none; border-color: var(--primary); }
        .error-msg { color: var(--error); font-weight: bold; display: none; margin-bottom: 15px; }

        .confirm-btn {
            background: var(--success); color: white; border: none;
            border-radius: 50px; padding: 12px 30px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #00A855; width: 100%;
        }

        #finalScore { font-size: 4rem; font-weight: 900; color: var(--primary); margin: 15px 0; }
        #memeImage { max-width: 100%; height: auto; border-radius: 15px; margin: 15px auto; display: block; max-height: 250px; }


        /* =========================================
           GIAO DIỆN MÀN HÌNH KHÓA (Tông xuyệt tông)
           ========================================= */
        #passwordModal {
            position:fixed; inset:0; z-index:9999;
            display:flex; align-items:center; justify-content:center;
            background:rgba(255, 255, 255, 0.4); backdrop-filter:blur(15px);
        }
        .pw-card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid white; border-radius: 24px; padding: 40px; 
            max-width: 420px; width: 90%; text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 15px 35px rgba(136, 84, 192, 0.2);
        }
        .pw-crest { font-size:4rem; margin-bottom:8px; display:block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .pw-title { font-family:'Quicksand', sans-serif; font-size:1.6rem; font-weight:900; color:var(--primary); margin-bottom:6px; }
        .pw-sub   { font-size:.95rem; color:#555; margin-bottom:24px; font-weight: 500; }
        .pw-input {
            width:100%; padding:15px; border-radius:12px;
            border:2px solid #EAEAEA; background: white;
            color:var(--text-color); font-size:1.1rem; font-family:'Nunito', sans-serif;
            outline:none; text-align:center; transition:all .3s; font-weight: bold;
        }
        .pw-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(136, 84, 192, 0.2); }
        .pw-input.error { border-color:var(--error); box-shadow:0 0 0 3px rgba(255,71,87,0.25); animation:shake .4s ease; background: #FFF0F0;}
        .pw-btn {
            width:100%; padding:15px; margin-top:15px; border-radius:12px; border:none;
            background:linear-gradient(135deg, #6C5CE7, #A29BFE);
            color:#fff; font-size:1.1rem; font-weight:900; font-family:'Quicksand', sans-serif;
            cursor:pointer; transition:transform .2s; box-shadow: 0 6px 0 #4834D4;
        }
        .pw-btn:hover { transform:translateY(-2px); box-shadow: 0 8px 0 #4834D4; }
        .pw-btn:active { transform:translateY(4px); box-shadow: 0 2px 0 #4834D4; }
        .pw-err { color:var(--error); font-size:.9rem; margin-top:12px; display:none; font-weight:700; }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>



<div id="mainContent" style="display: block;">
    <div class="bg-unicorns" id="unicornBg"></div>

    <div class="container">
        <div class="header">
            <span class="teacher-tag">✨ Giáo viên tạo: Ms. Chí Nên · ☎️ 0852639652</span>
        </div>
        
        <h1 class="main-title">🦄 Thử Thách Tiếng Anh Siêu Cấp</h1>

        <div id="quizContent"></div>
    </div>

    <div class="submit-bar">
        <button class="submit-final-btn" onclick="requestName()">🎯 NỘP BÀI & XEM KẾT QUẢ</button>
    </div>
</div>

<div class="modal-overlay" id="nameModal">
    <div class="modal-content">
        <h2 style="color: var(--primary); font-size: 1.8rem; margin-bottom: 15px;">Chào Bạn Nhỏ! 🦄</h2>
        <p style="margin-bottom: 15px; font-weight: 500;">Hãy nhập tên của mình vào đây để nhận kết quả nhé!</p>
        <input type="text" id="playerName" class="name-input" placeholder="Ví dụ: Nguyễn Văn A..." onkeypress="if(event.key==='Enter') showResults()">
        <div class="error-msg" id="nameError">Oops! Bạn quên nhập tên mất rồi 😢</div>
        <button class="confirm-btn" onclick="showResults()">Xác Nhận</button>
    </div>
</div>

<div class="modal-overlay" id="resultModal">
    <div class="modal-content">
        <h2 style="color: var(--primary); margin-bottom: 10px;">Bảng Điểm Danh Dự</h2>
        <div id="resultGreeting" style="font-size: 1.5rem; color: #f39c12; font-weight: bold;"></div>
        <div id="finalScore"></div>
        <img src="" id="memeImage" alt="Result Meme">
        <button class="confirm-btn" style="background: var(--primary); box-shadow: 0 5px 0 #6d419e; margin-top: 15px;" onclick="location.reload()">Làm Lại Lần Nữa!</button>
    </div>
</div>

<audio id="wrongSound" preload="auto">
    <source src="https:
</audio>
<audio id="reminderAudio" preload="auto">
    <source src="https:
</audio>

<script>
    /* =========================================
       LOGIC MỞ KHÓA MẬT KHẨU & AUTO-PLAY AUDIO
       ========================================= */
    const _k  = [99, 111, 103, 97, 110, 103, 100, 97, 116, 100, 105, 101, 109, 99, 97, 111]; 
    const _pw = _k.map(c => String.fromCharCode(c)).join('');

    function checkPassword() {
        const inp = document.getElementById('pwInput');
        const err = document.getElementById('pwErr');
        
        // Chuyển về viết thường để học sinh dễ nhập
        if (inp.value.toLowerCase() === _pw) {
            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            
            // Phát âm thanh dặn dò của giáo viên
            const reminderAudio = document.getElementById('reminderAudio');
            if (reminderAudio) {
                reminderAudio.play().catch(e => console.log("Trình duyệt chặn autoplay audio", e));
            }
            
            // Render giao diện khi đã mở khóa
            initQuiz();
            createUnicorns();
        } else {
            inp.classList.remove('error'); 
            void inp.offsetWidth; 
            inp.classList.add('error');
            err.style.display = 'block'; 
            setTimeout(() => inp.classList.remove('error'), 500);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const pwInput = document.getElementById('pwInput');
        if(pwInput) {
            pwInput.addEventListener('keydown', e => { 
                if (e.key === 'Enter') checkPassword(); 
            });
        }
    });

    /* =========================================
       DỮ LIỆU CÂU HỎI BÀI TẬP
       ========================================= */
    const quizData = [
        {
            type: "phonetics",
            question: "Chọn từ có phần gạch chân phát âm khác.",
            questionHtml: "A. <u>Th</u>ailand &nbsp; B. <u>th</u>ank &nbsp; C. six<u>th</u> &nbsp; D. <u>th</u>ough",
            options: ["Thailand", "thank", "sixth", "though"],
            correct: "though",
            explanation: {
                trans: "Chọn từ có phần gạch chân phát âm khác với các từ còn lại.",
                optTrans: ["Tên nước Thái Lan", "cảm ơn", "số thứ 6", "mặc dù"],
                why: "Phần gạch chân ở <span class='p-word'>though</span> phát âm là <span class='p-phonetic'>/ð/</span> (âm thè rung).",
                whyNot: "Theo key đáp án, <span class='p-word'>though</span> là điểm nhấn phân biệt với nhóm phụ âm <span class='p-phonetic'>/θ/</span> vô thanh trong thank và sixth."
            }
        },
        {
            type: "phonetics",
            question: "Chọn từ có phần gạch chân phát âm khác.",
            questionHtml: "A. p<u>e</u>nthouse &nbsp; B. basem<u>e</u>nt &nbsp; C. t<u>e</u>levision &nbsp; D. <u>e</u>nergy",
            options: ["penthouse", "basement", "television", "energy"],
            correct: "basement",
            explanation: {
                trans: "Chọn từ có phần gạch chân phát âm khác với các từ còn lại.",
                optTrans: ["căn hộ áp mái", "tầng hầm", "tivi", "năng lượng"],
                why: "Phần gạch chân ở <span class='p-word'>basement</span> phát âm là <span class='p-phonetic'>/ə/</span> (âm ơ ngắn) do nằm ở âm tiết không nhận trọng âm.",
                whyNot: "Các từ còn lại đều phát âm là <span class='p-phonetic'>/e/</span>."
            }
        },
        {
            type: "stress",
            question: "Chọn từ có trọng âm chính rơi vào vị trí khác.",
            questionHtml: "A. cartoon &nbsp; B. funny &nbsp; C. little &nbsp; D. channel",
            options: ["cartoon", "funny", "little", "channel"],
            correct: "cartoon",
            explanation: {
                trans: "Chọn từ có vị trí trọng âm chính khác với các từ còn lại.",
                optTrans: ["phim hoạt hình", "vui nhộn", "nhỏ bé", "kênh truyền hình"],
                why: "<span class='p-word'>cartoon</span> có trọng âm rơi vào âm tiết thứ <span class='p-grammar'>2</span> <span class='p-phonetic'>/kɑːˈtuːn/</span>.",
                whyNot: "Các từ còn lại là danh từ/tính từ 2 âm tiết, trọng âm rơi vào âm tiết 1."
            }
        },
        {
            type: "stress",
            question: "Chọn từ có trọng âm chính rơi vào vị trí khác.",
            questionHtml: "A. leadership &nbsp; B. animated &nbsp; C. comedy &nbsp; D. invader",
            options: ["leadership", "animated", "comedy", "invader"],
            correct: "invader",
            explanation: {
                trans: "Chọn từ có vị trí trọng âm chính khác với các từ còn lại.",
                optTrans: ["khả năng lãnh đạo", "hoạt hình", "hài kịch", "kẻ xâm lược"],
                why: "<span class='p-word'>invader</span> có trọng âm rơi vào âm tiết thứ <span class='p-grammar'>2</span> <span class='p-phonetic'>/ɪnˈveɪdə/</span>.",
                whyNot: "Các từ còn lại có trọng âm rơi vào âm tiết 1."
            }
        },
        {
            type: "grammar",
            question: "Disney Channel is one of the most _______ channels _______ children.",
            options: ["Good – for", "exciting – of", "popular – in", "popular – for"],
            correct: "popular – for",
            explanation: {
                trans: "Kênh Disney là một trong những kênh phổ biến nhất dành cho trẻ em.",
                optTrans: ["Tốt - cho", "Thú vị - của", "Phổ biến - trong", "Phổ biến - dành cho"],
                why: "Cấu trúc so sánh nhất <span class='p-grammar'>one of the most + adjective (dài)</span> -> <span class='hl-green'>popular</span>. Giới từ <span class='hl-green'>for</span> chỉ mục đích hướng tới đối tượng trẻ em.",
                whyNot: "'Good' là tính từ ngắn, phải dùng 'the best'. Các giới từ of, in không hợp nghĩa."
            }
        },
        {
            type: "grammar",
            question: "I like watching science channels because I can _______ a lot of interesting things about my life.",
            options: ["Discover", "test", "instruct", "compete"],
            correct: "Discover",
            explanation: {
                trans: "Tôi thích xem các kênh khoa học vì tôi có thể khám phá ra nhiều điều thú vị về cuộc sống.",
                optTrans: ["Khám phá", "kiểm tra", "hướng dẫn", "cạnh tranh"],
                why: "Xem kênh khoa học giúp chúng ta <span class='hl-green'>khám phá</span> (<span class='p-word'>discover</span>) kiến thức mới.",
                whyNot: "Các động từ còn lại không đi chung được với tân ngữ 'a lot of interesting things'."
            }
        },
        {

    let currentScore = 0;
    let answeredCount = 0;

    function initQuiz() {
        const quizContent = document.getElementById('quizContent');
        quizContent.innerHTML = '';
        
        quizData.forEach((data, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = 'question-block';

            let sectionHeader = '';
            if(data.type === "sign" && quizData[index-1]?.type !== "sign") { sectionHeader = '<div class="section-title">🛑 ĐỌC BIỂN BÁO</div>'; }
            if(data.type === "phonetics" && index === 0) { sectionHeader = '<div class="section-title">🎧 PHÁT ÂM</div>'; }
            if(data.type === "grammar" && quizData[index-1]?.type === "stress") { sectionHeader = '<div class="section-title">✍️ NGỮ PHÁP & TỪ VỰNG</div>'; }
            if(data.type === "stress" && quizData[index-1]?.type === "phonetics") { sectionHeader = '<div class="section-title">🗣️ TRỌNG ÂM</div>'; }

            const shuffledOptions = [...data.options];
            for (let i = shuffledOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
            }

            qBlock.innerHTML = `
                ${sectionHeader}
                <div class="question-text">
                    <strong>Câu ${index + 1}:</strong> ${data.question}
                    ${data.questionHtml ? '<div style="margin-top:15px;">' + data.questionHtml + '</div>' : ''}
                </div>
                <div class="options-grid" id="options-${index}">
                    ${shuffledOptions.map(opt => `
                        <div class="option-card" onclick="checkAnswer(this, ${index}, '${opt.replace(/'/g, "\\'")}')">
                            <span class="option-text">${opt}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="explanation-container" id="explanation-${index}">
                    <div class="explanation-content">
                        <div class="vietnamese-translation">Dịch: ${data.explanation.trans}</div>
                        <p style="margin-bottom:8px;"><strong>1. Dịch 4 đáp án:</strong></p>
                        <ul style="margin-left: 20px; margin-bottom: 15px; line-height:1.6;">
                            ${data.options.map((opt, oIdx) => `
                                <li><span class="${opt === data.correct ? 'p-word' : ''}">${opt}</span>: ${data.explanation.optTrans[oIdx]}</li>
                            `).join('')}
                        </ul>
                        <p style="margin-bottom:8px;"><strong>2. Tại sao chọn?</strong> ${data.explanation.why}</p>
                        <p><strong>3. Tại sao sai?</strong> ${data.explanation.whyNot}</p>
                    </div>
                </div>
            `;
            quizContent.appendChild(qBlock);
        });
    }

    function playDing() {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = context.createOscillator();
        const gainNode = context.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(660, context.currentTime);
        oscillator.frequency.setValueAtTime(880, context.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.5, context.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.4);
        oscillator.connect(gainNode);
        gainNode.connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.4);
    }

    function checkAnswer(cardElement, qIndex, selectedOpt) {
        if (cardElement.classList.contains('locked')) return;

        const allCards = document.getElementById(`options-${qIndex}`).querySelectorAll('.option-card');
        const correctOpt = quizData[qIndex].correct;
        const wrongSound = document.getElementById('wrongSound');

        allCards.forEach(card => card.classList.add('locked'));
        answeredCount++;

        if (selectedOpt === correctOpt) {
            cardElement.classList.add('correct');
            currentScore++;
            playDing();
            confetti({ particleCount: 60, spread: 80, origin: { y: (cardElement.getBoundingClientRect().top / window.innerHeight) } });
        } else {
            cardElement.classList.add('incorrect');
            wrongSound.play().catch(e => console.log("Sound error:", e));
            allCards.forEach(card => {
                if (card.querySelector('.option-text').innerText === correctOpt) card.classList.add('correct');
            });
        }
        document.getElementById(`explanation-${qIndex}`).style.display = 'block';
    }

    function requestName() {
        if (answeredCount < quizData.length) {
            alert(`Bạn ơi, vẫn còn ${quizData.length - answeredCount} câu chưa làm nè! Hoàn thành nốt nha 🦄`);
            return;
        }
        document.getElementById('nameModal').style.display = 'flex';
    }

    function showResults() {
        const nameInput = document.getElementById('playerName');
        const name = nameInput.value.trim();
        const nameError = document.getElementById('nameError');

        if (!name) {
            nameError.style.display = 'block';
            nameInput.style.borderColor = "red";
            return;
        }

        document.getElementById('nameModal').style.display = 'none';
        
        const percentage = (currentScore / quizData.length) * 100;
        document.getElementById('finalScore').innerText = `${currentScore} / ${quizData.length}`;
        
        const greeting = document.getElementById('resultGreeting');
        const memeImg = document.getElementById('memeImage');
        
        if (percentage === 100) {
            greeting.innerText = `XUẤT SẮC TUYỆT ĐỐI ${name.toUpperCase()} ƠI! 🌟`;
            memeImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExajVtdDlybXYxYm4zaXB5Zm00dzR4dmN1dTR5YWlxbnV3ZWZiaXpxeiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0HUCsS8Yp4l441tC/giphy.gif";
            confetti({ particleCount: 300, spread: 180, origin: { y: 0.5 } });
        } else if (percentage >= 60) {
            greeting.innerText = `GIỎI QUÁ ${name.toUpperCase()} NHÉ! 👍`;
            memeImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDdxcHV1czU4OHVtdmRnMXNreHJ6MHNreTN5anBjcTNtZnRxcHFwZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ckeHl52mNtoq87veET/giphy.gif";
        } else {
            greeting.innerText = `CỐ GẮNG HƠN NÀO ${name.toUpperCase()}! 💪`;
            memeImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHgzMG95cXoxODFkMnkxdGtudWJidWlyNnRrMXQzdHptajM0bXJwaCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/BEob5qwFkSJ7G/giphy.gif";
        }

        document.getElementById('resultModal').style.display = 'flex';
    }

    function createUnicorns() {
        const bg = document.getElementById('unicornBg');
        bg.innerHTML = '';
        const icons = ['🦄', '✨', '🌈', '🍭', '🎀'];
        for (let i = 0; i < 20; i++) {
            const el = document.createElement('div');
            el.className = 'floating-unicorn';
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 90 + 'vw';
            el.style.animationDuration = (Math.random() * 15 + 10) + 's';
            el.style.animationDelay = (Math.random() * 5) + 's';
            el.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            bg.appendChild(el);
        }
    }
