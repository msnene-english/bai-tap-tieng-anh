<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #FDCB6E;
            --accent: #00C9A7;
            --correct: #00D26A;
            --incorrect: #FF4757;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-dark: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #8854C0, #00C9A7, #FDCB6E);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating SVGs/Patterns */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            opacity: 0.4;
            animation: float 10s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        header {
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* Glassmorphism Card */
        .question-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 15px;
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.03) translateY(-4px);
            box-shadow: 0 8px 0px rgba(0,0,0,0.1), 0 15px 25px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.98) translateY(2px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.1);
        }

        .option-btn.correct {
            background: var(--correct);
            color: white;
            border-color: #00A355;
            box-shadow: 0 6px 0px #00A355;
        }

        .option-btn.wrong {
            background: var(--incorrect);
            color: white;
            border-color: #D63031;
            box-shadow: 0 6px 0px #D63031;
        }
        
        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.4s; }

        /* Explanation Box */
        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            border-left: 6px solid var(--accent);
            font-size: 1rem;
            line-height: 1.6;
            animation: slideDown 0.4s ease forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Specific text highlight classes */
        .translated-question { background: #FFEAA7; font-weight: bold; padding: 10px; border-radius: 10px; border-left: 5px solid #FDCB6E; margin-bottom: 12px; }
        .p-word { color: #2D98DA; font-weight: bold; }
        .p-phonetic { background: #E8E2F7; color: #8854C0; padding: 2px 6px; border-radius: 6px; font-family: monospace; font-weight: bold; }
        .p-mean { color: #D35400; font-style: italic; }
        .p-grammar { text-decoration: underline; text-decoration-color: #E74C3C; text-decoration-thickness: 3px; font-weight: bold; }
        .hl-green { color: #00D26A; font-weight: 900; }
        .hl-red { color: #FF4757; text-decoration: line-through; font-weight: 700; }

        .explanation-box ul { margin-left: 20px; margin-bottom: 10px; }
        .explanation-box p { margin-bottom: 8px; }

        /* Submit Button */
        .submit-container { text-align: center; margin: 40px 0; }
        .submit-btn {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            font-size: 1.3rem;
            font-weight: 900;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0px #D63031, 0 15px 30px rgba(0,0,0,0.2);
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 11px 0px #D63031, 0 20px 40px rgba(0,0,0,0.3); }
        .submit-btn:active { transform: translateY(5px); box-shadow: 0 3px 0px #D63031; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center;
            z-index: 100;
        }
        .modal {
            background: white; border-radius: 25px; padding: 30px;
            width: 90%; max-width: 450px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transform: scale(0.8); opacity: 0; transition: all 0.3s;
        }
        .modal.active { transform: scale(1); opacity: 1; }
        
        .modal input {
            width: 100%; padding: 15px; font-size: 1.1rem;
            border: 2px solid #ccc; border-radius: 15px;
            margin: 20px 0; outline: none; font-family: 'Nunito';
        }
        .modal input:focus { border-color: var(--primary); }
        .modal input.error { border-color: var(--incorrect); background: #ffeaea; }

        .modal-btn {
            background: var(--primary); color: white; border: none;
            padding: 12px 30px; font-size: 1.1rem; font-weight: bold;
            border-radius: 15px; cursor: pointer; box-shadow: 0 5px 0px #6A3A9E;
        }
        .modal-btn:active { transform: translateY(3px); box-shadow: 0 2px 0px #6A3A9E; }

        .result-gif { width: 100%; border-radius: 15px; margin: 15px 0; }
        .score-text { font-size: 2.5rem; font-weight: 900; color: var(--primary); margin: 10px 0; }

        /* Confetti Canvas */
        #confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

        /* Custom Sign Designs */
        .sign-restroom { border: 4px solid #E74C3C; background: #fff; max-width: 220px; margin: 10px auto; border-radius: 8px; overflow: hidden; text-align: center; }
        .sign-restroom .header { background: #E74C3C; color: white; font-weight: 900; font-size: 1.2rem; padding: 5px; }
        .sign-restroom .icon { font-size: 3rem; margin: 5px 0; }
        .sign-restroom .text { font-weight: 900; font-size: 1.1rem; padding: 5px; color: #2d3436; }

        .sign-nofood { border: 2px solid #bdc3c7; background: #ecf0f1; max-width: 250px; margin: 10px auto; padding: 15px; text-align: center; font-weight: 900; color: #E74C3C; font-size: 1.2rem; }

        .sign-noswim { border: 3px solid #2d3436; background: #fff; max-width: 200px; margin: 10px auto; border-radius: 8px; padding: 10px; text-align: center; }
        .sign-noswim .icon { position: relative; font-size: 4rem; display: inline-block; }
        .sign-noswim .cross { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: #E74C3C; font-size: 5rem; transform: rotate(0deg); opacity: 0.8;}
        .sign-noswim .text { font-weight: 900; font-size: 1.2rem; margin-top: 5px; }

        /* GIAO DIỆN MÀN HÌNH KHÓA ĐÃ ĐƯỢC ĐỒNG BỘ THEME TÔNG XUYỆT TÔNG */
        #passwordModal {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }
        .pw-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid var(--glass-border); 
            border-radius: 24px; padding: 48px 40px 40px; 
            max-width: 440px; width: 93%; text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        .pw-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
        }
        .pw-crest { font-size: 4rem; margin-bottom: 8px; display: block; animation: float 3s ease-in-out infinite; }
        .pw-title { font-size: 1.6rem; font-weight: 900; color: var(--primary); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
        .pw-sub   { font-size: 1rem; color: var(--text-dark); margin-bottom: 24px; font-weight: 700; opacity: 0.8;}
        .pw-input {
            width: 100%; padding: 15px 20px; border-radius: 15px;
            border: 2px solid rgba(136, 84, 192, 0.3); background: rgba(255,255,255,0.9);
            color: var(--primary); font-size: 1.1rem; font-family: 'Nunito', sans-serif;
            outline: none; text-align: center; transition: all .3s; font-weight: 800;
        }
        .pw-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(136, 84, 192, 0.15); }
        .pw-input.error { border-color: var(--incorrect); box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.25); animation: shake .4s ease; color: var(--incorrect); }
        .pw-input::placeholder { color: #a4b0be; font-weight: 600; letter-spacing: normal; }
        .pw-btn {
            width: 100%; padding: 15px; margin-top: 20px; border-radius: 15px; border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff; font-size: 1.1rem; font-weight: 900; text-transform: uppercase;
            cursor: pointer; letter-spacing: 1px; transition: transform .2s, box-shadow .2s;
            box-shadow: 0 6px 15px rgba(0, 201, 167, 0.3);
        }
        .pw-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 201, 167, 0.5); }
        .pw-btn:active { transform: translateY(1px); }
        .pw-err { color: var(--incorrect); font-size: 0.95rem; margin-top: 15px; display: none; font-weight: 800; }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>

    <div class="bg-pattern" id="bgPattern"></div>
    <canvas id="confetti"></canvas>

    

    <div id="mainContent" style="display: block;">
        <header>Giáo viên tạo: Ms. Chí Nên · ☎️ 0852639652</header>

        <main id="quiz-container">
            </main>

        <div class="submit-container">
            <button class="submit-btn" onclick="openNameModal()">🎯 Nộp Bài & Xem Kết Quả</button>
        </div>
    </div>

    <div class="modal-overlay" id="nameModal">
        <div class="modal" id="nameModalContent">
            <h2>Nhập tên của bạn nhé! 🚀</h2>
            <input type="text" id="playerName" placeholder="Ví dụ: Nguyễn Văn A..." onkeyup="if(event.key === 'Enter') submitQuiz()">
            <button class="modal-btn" onclick="submitQuiz()">Hoàn Thành</button>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal" id="resultModalContent">
            <h2 id="greeting">🌟 THIÊN TÀI!</h2>
            <div class="score-text" id="scoreDisplay">0/0</div>
            <p id="motivationalMsg" style="font-weight:bold; margin-bottom: 10px;"></p>
            <img id="resultGif" class="result-gif" src="" alt="Result Meme">
            <button class="modal-btn" onclick="location.reload()">Làm Lại Lần Nữa!</button>
        </div>
    </div>

<script>
    // Audio Context (Web Audio API)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // Âm thanh đúng: Dùng Web Audio API
    function playDing() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    // Âm thanh sai: Dùng file MP3 từ link yêu cầu (Huh effect)
    function playBuzz() {
        const wrongAudio = new Audio('https:
        wrongAudio.play().catch(e => console.log("Lỗi phát âm thanh sai: ", e));
    }

    // Confetti System
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];

    function fireConfetti() {
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: window.innerWidth / 2,
                y: window.innerHeight / 2 + 100,
                r: Math.random() * 6 + 2,
                dx: Math.random() * 20 - 10,
                dy: Math.random() * -20 - 5,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                tilt: Math.random() * 10 - 5
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach((p, index) => {
            p.dy += 0.5; // gravity
            p.x += p.dx;
            p.y += p.dy;
            p.tilt += 0.1;
            ctx.beginPath();
            ctx.lineWidth = p.r;
            ctx.strokeStyle = p.color;
            ctx.moveTo(p.x + p.tilt, p.y);
            ctx.lineTo(p.x, p.y + p.tilt);
            ctx.stroke();
            if (p.y < canvas.height) active = true;
        });
        if (active) requestAnimationFrame(animateConfetti);
        else particles = [];
    }

    // Background floating elements
    const shapes = ['🌟', '📚', '✏️', '🚀', '💡', '🎯', '🔥', '🏆'];
    const bgContainer = document.getElementById('bgPattern');
    for(let i=0; i<20; i++) {
        let el = document.createElement('div');
        el.className = 'shape';
        el.innerText = shapes[Math.floor(Math.random() * shapes.length)];
        el.style.left = `${Math.random() * 100}vw`;
        el.style.fontSize = `${Math.random() * 30 + 20}px`;
        el.style.animationDuration = `${Math.random() * 10 + 10}s`;
        el.style.animationDelay = `${Math.random() * 5}s`;
        bgContainer.appendChild(el);
    }

    // LOGIC KIỂM TRA MẬT KHẨU
    const _k  = [99, 111, 103, 97, 110, 103, 100, 97, 116, 100, 105, 101, 109, 99, 97, 111]; 
    const _pw = _k.map(c => String.fromCharCode(c)).join('');

    function checkPassword() {
        const inp = document.getElementById('pwInput');
        const err = document.getElementById('pwErr');
        
        if (inp.value === _pw) {
            // 1. Ẩn màn hình khóa và hiện nội dung bài
            document.getElementById('passwordModal').style.display = 'none';
            const main = document.getElementById('mainContent');
            if(main) {
                main.style.display = 'block';
                // Khởi tạo render bài tập khi đã mở khóa
                renderQuiz();
            }
            
            // 2. PHÁT FILE ÂM THANH NHẮC NHỞ KHÍCH LỆ
            const encouragAudio = new Audio('https:
            encouragAudio.play().catch(e => console.log("Lỗi phát âm thanh: ", e));
            
            // 3. Kích hoạt hiệu ứng Confetti chúc mừng mở khóa thành công
            fireConfetti();
            
        } else {
            // Xử lý sai mật khẩu
            inp.classList.remove('error'); 
            void inp.offsetWidth; // Trigger reflow để animation hoạt động lại
            inp.classList.add('error');
            err.style.display = 'block'; 
            setTimeout(() => inp.classList.remove('error'), 500);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const pwInput = document.getElementById('pwInput');
        if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
    });


    // Quiz Data
    const quizData = [
        {
            q: "Mark the letter... to indicate the word whose underlined part differs: <br> A. noodle<u>s</u> &nbsp; B. shoulder<u>s</u> &nbsp; C. packet<u>s</u> &nbsp; D. tomato<u>es</u>",
            opts: [
                { t: "noodles", c: false }, { t: "shoulders", c: false },
                { t: "packets", c: true }, { t: "tomatoes", c: false }
            ],
            expl: `
                <div class="translated-question">Dịch: Chọn từ có phần gạch chân phát âm khác với các từ còn lại.</div>
                <p><b>1. Phân tích từ vựng:</b></p>
                <ul>
                    <li>A. <span class="p-word">noodles</span> <span class="p-phonetic">/ˈnuːdlz/</span>: <span class="p-mean">mì sợi</span></li>
                    <li>B. <span class="p-word">shoulders</span> <span class="p-phonetic">/ˈʃəʊldərz/</span>: <span class="p-mean">đôi vai</span></li>
                    <li>C. <span class="p-word">packets</span> <span class="p-phonetic">/ˈpækɪts/</span>: <span class="p-mean">những gói nhỏ</span></li>
                    <li>D. <span class="p-word">tomatoes</span> <span class="p-phonetic">/təˈmɑːtəʊz/</span>: <span class="p-mean">cà chua</span></li>
                </ul>
                <p><b>2. Tại sao chọn đáp án này?</b></p>
                <p><span class="hl-green">packets</span> có tận cùng là âm vô thanh /t/ nên đuôi 's' được phát âm là /s/. Đây là <span class="p-grammar">quy tắc phát âm đuôi -s/-es</span> cơ bản.</p>
                <p><b>3. Tại sao các đáp án còn lại sai?</b></p>
                <p>Các từ <span class="hl-red">noodles, shoulders, tomatoes</span> đều kết thúc bằng nguyên âm hoặc phụ âm hữu thanh, nên đuôi 's/es' phát âm là /z/.</p>
            `
        },
        {
            q: "Mark the letter... to indicate the word whose underlined part differs: <br> A. i<u>r</u>on &nbsp; B. <u>r</u>ock &nbsp; C. <u>r</u>ight &nbsp; D. <u>r</u>ing",
            opts: [
                { t: "iron", c: true }, { t: "rock", c: false },
                { t: "right", c: false }, { t: "ring", c: false }
            ],
            expl: `
                <div class="translated-question">Dịch: Chọn từ có phần gạch chân phát âm khác với các từ còn lại.</div>
                <p><b>1. Phân tích từ vựng:</b></p>
                <ul>
                    <li>A. <span class="p-word">iron</span> <span class="p-phonetic">/ˈaɪ.ən/</span>: <span class="p-mean">sắt, bàn là</span></li>
                    <li>B. <span class="p-word">rock</span> <span class="p-phonetic">/rɒk/</span>: <span class="p-mean">đá, hòn đá</span></li>
                    <li>C. <span class="p-word">right</span> <span class="p-phonetic">/raɪt/</span>: <span class="p-mean">bên phải, đúng</span></li>
                    <li>D. <span class="p-word">ring</span> <span class="p-phonetic">/rɪŋ/</span>: <span class="p-mean">nhẫn, reo chuông</span></li>
                </ul>
                <p><b>2. Tại sao chọn đáp án này?</b></p>
                <p>Trong từ <span class="hl-green">iron</span>, chữ 'r' bị câm (không được phát âm). <span class="p-grammar">Quy tắc âm câm (Silent Letters)</span>.</p>
                <p><b>3. Tại sao các đáp án còn lại sai?</b></p>
                <p>Trong <span class="hl-red">rock, right, ring</span>, chữ 'r' đều được phát âm rõ ràng là /r/.</p>
            `

                    <li>D. <span class="p-mean">Tuy nhiên, thợ lặn có thể kiếm được lượng tiền lớn nhờ công việc nguy hiểm này.</span></li>
                </ul>
                <p><b>2. Tại sao chọn đáp án này?</b></p>
                <p>Câu cuối cùng của đoạn văn trước đang nói về chiếc đèn trên đầu ("wear a strong light"). Để tạo sự liên kết mạch lạc (cohesion), câu tiếp theo nên tiếp tục ý về chiếc đèn này. Việc đèn hỏng giải thích lý do tại sao trò này lại "nguy hiểm" như câu chủ đề đã nêu. Do đó <span class="hl-green">A</span> là phù hợp nhất.</p>
                <p><b>3. Tại sao các đáp án còn lại sai?</b></p>
                <p>Các câu <span class="hl-red">B, C, D</span> đưa ra ý tưởng mới hoàn toàn đột ngột hoặc dùng sai từ nối (như "First" ở cuối bài là vô lý).</p>
            `
        },
        {
            q: "Closest in meaning: <b>It is a boring story.</b>",
            opts: [
                { t: "What a boring story!", c: true },
                { t: "What is the story about?", c: false },
                { t: "What do they tell about the boring story?", c: false },
                { t: "What is a boring story!", c: false }
            ],
            expl: `
                <div class="translated-question">Dịch: Chọn câu có nghĩa gần nhất: "Đó là một câu chuyện tẻ nhạt."</div>
                <p><b>1. Phân tích các đáp án:</b></p>
                <ul>
                    <li>A. <span class="p-mean">Thật là một câu chuyện tẻ nhạt!</span> (Câu cảm thán)</li>
                    <li>B. <span class="p-mean">Câu chuyện kể về cái gì?</span> (Câu hỏi)</li>
                    <li>C. <span class="p-mean">Họ kể gì về câu chuyện tẻ nhạt đó?</span> (Câu hỏi)</li>
                    <li>D. Sai cấu trúc.</li>
                </ul>
                <p><b>2. Tại sao chọn đáp án này?</b></p>
                <p>Để viết lại câu miêu tả thành câu cảm thán, ta dùng <span class="p-grammar">Cấu trúc câu cảm thán với "What"</span>: <b>What + (a/an) + Adj + Noun!</b>. Do đó <span class="hl-green">What a boring story!</span> là chính xác tuyệt đối.</p>
                <p><b>3. Tại sao các đáp án còn lại sai?</b></p>
                <p>Câu gốc là câu trần thuật, không phải câu hỏi nên <span class="hl-red">B, C</span> loại. <span class="hl-red">D</span> sai vì thừa động từ "is" sau What.</p>
            `
        },
        {
            q: "Closest in meaning: <b>He should leave soon, or he’ll miss the bus.</b>",
            opts: [
                { t: "If he doesn’t leave soon, he will miss the bus.", c: true },
                { t: "If he leaves soon, he will miss the bus.", c: false },
                { t: "If he left soon, he would miss the bus.", c: false },
                { t: "If he not leave soon, he will miss the bus.", c: false }
            ],
            expl: `
                <div class="translated-question">Dịch: Chọn câu có nghĩa gần nhất: "Anh ấy nên rời đi sớm, hoặc anh ấy sẽ lỡ xe buýt."</div>
                <p><b>1. Phân tích các đáp án:</b></p>
                <ul>
                    <li>A. <span class="p-mean">Nếu anh ấy không rời đi sớm, anh ấy sẽ lỡ xe buýt.</span></li>
                    <li>B. <span class="p-mean">Nếu anh ấy rời đi sớm, anh ấy sẽ lỡ xe buýt.</span> (Ngược nghĩa)</li>
                    <li>C. Câu điều kiện loại 2 (Trái với hiện tại).</li>
                    <li>D. Sai cấu trúc ngữ pháp (not leave).</li>
                </ul>
                <p><b>2. Tại sao chọn đáp án này?</b></p>
                <p>Câu gốc chỉ một sự việc có thể xảy ra ở hiện tại/tương lai (nếu không đi -> sẽ lỡ chuyến). Ta dùng <span class="p-grammar">Câu điều kiện loại 1 (If + Hiện tại đơn, Tương lai đơn)</span>. Câu <span class="hl-green">If he doesn't leave soon...</span> diễn đạt đúng điều kiện phủ định của từ "or".</p>
                <p><b>3. Tại sao các đáp án còn lại sai?</b></p>
                <p><span class="hl-red">B</span> sai hoàn toàn về nghĩa. <span class="hl-red">C</span> dùng sai loại câu điều kiện. <span class="hl-red">D</span> sai ngữ pháp cơ bản (phủ định động từ thường phải mượn trợ động từ "doesn't").</p>
            `
        },
        {
            q: "Made from the given cues: <b>Play / volleyball / interesting.</b>",
            opts: [
                { t: "Playing volleyball interesting.", c: false },
                { t: "Play volleyball is interesting.", c: false },
                { t: "Playing volleyball is interesting.", c: true },
                { t: "Play volleyball are interesting.", c: false }
            ],
            expl: `
                <div class="translated-question">Dịch: Tạo thành câu hoàn chỉnh từ các từ gợi ý: "Chơi / bóng chuyền / thú vị".</div>
                <p><b>1. Phân tích ngữ pháp:</b></p>
                <p>Để biến một động từ (Play) thành Chủ ngữ của câu, ta phải chuyển nó thành Danh động từ (V-ing) là <span class="p-grammar">Playing</span>. Sau chủ ngữ V-ing, động từ to-be chia ở số ít (is).</p>
                <p><b>2. Tại sao chọn đáp án này?</b></p>
                <p><span class="hl-green">Playing volleyball is interesting.</span> (Việc chơi bóng chuyền thì thú vị) thỏa mãn đúng cấu trúc <b>V-ing + Object + is + Adjective</b>.</p>
                <p><b>3. Tại sao các đáp án còn lại sai?</b></p>
                <p><span class="hl-red">Play volleyball is...</span> sai vì động từ nguyên mẫu không thể làm chủ ngữ. <span class="hl-red">Playing volleyball interesting</span> thiếu động từ to-be "is".</p>
            `
        },
        {
            q: "Made from the given cues: <b>I / more / interested / football / than / table tennis.</b>",
            opts: [
                { t: "I am more interested in football than table tennis.", c: true },
                { t: "I do more interested in football than table tennis.", c: false },
                { t: "I am more interested at football than table tennis.", c: false },
                { t: "I am more interested about football than table tennis.", c: false }
            ],
            expl: `
                <div class="translated-question">Dịch: Tạo thành câu hoàn chỉnh: "Tôi / hơn / quan tâm / bóng đá / hơn / bóng bàn".</div>
                <p><b>1. Tại sao chọn đáp án này?</b></p>
                <p>Cấu trúc cố định: <span class="p-grammar">be interested IN + Noun</span> (Quan tâm, thích thú với cái gì). Kết hợp với cấu trúc so sánh hơn, ta có câu chuẩn: <span class="hl-green">I am more interested IN football than table tennis.</span></p>
                <p><b>2. Tại sao các đáp án còn lại sai?</b></p>
                <p>Các giới từ đi kèm "interested" ở các câu khác đều sai bẫy: <span class="hl-red">at, about</span> là sai hoàn toàn. Đáp án dùng trợ động từ <span class="hl-red">do</span> cũng sai vì tính từ cần đi với động từ to-be (am).</p>
            `
        },
        {
            q: `<div class="sign-restroom"><div class="header">SORRY</div><div class="icon">🚽🚫</div><div class="text">RESTROOM<br>OUT OF ORDER</div></div><br>What does the notice say?`,
            opts: [
                { t: "The restroom is available for everyone to use.", c: false },
                { t: "The restroom is open and ready in the evening.", c: false },
                { t: "You have to sorry to use the restroom.", c: false },
                { t: "We can’t use the restroom now.", c: true }
            ],
            expl: `
                <div class="translated-question">Dịch: Biển báo trên (XIN LỖI - NHÀ VỆ SINH ĐANG HỎNG) có nghĩa là gì?</div>
                <p><b>1. Phân tích từ vựng biển báo:</b></p>
                <p>Cụm từ <span class="p-word">out of order</span> là một <span class="p-grammar">Thành ngữ (Idiom)</span> có nghĩa là: <span class="p-mean">Bị hỏng, không hoạt động được</span>.</p>
                <p><b>2. Tại sao chọn đáp án này?</b></p>
                <p>Vì nhà vệ sinh đang hỏng, nên ý nghĩa của nó là "Chúng ta không thể sử dụng nhà vệ sinh bây giờ": <span class="hl-green">We can’t use the restroom now.</span></p>
                <p><b>3. Tại sao các đáp án còn lại sai?</b></p>
                <p><span class="hl-red">available</span> (có sẵn), <span class="hl-red">open and ready</span> (mở và sẵn sàng) đều trái ngược nghĩa gốc. Đáp án "You have to sorry..." là bẫy dịch word-by-word ngớ ngẩn.</p>
            `
        },
        {
            q: `<div class="sign-nofood">NO FOOD IS ALLOWED IN THIS AREA</div><br>What does the notice say?`,
            opts: [
                { t: "Only food is not allowed, drinks are fine", c: false },
                { t: "Do not bring food inside.", c: true },
                { t: "Should buy food inside", c: false },
                { t: "No foods are available inside", c: false }
            ],
            expl: `
                <div class="translated-question">Dịch: Biển báo (KHÔNG CHO PHÉP ĐỒ ĂN TRONG KHU VỰC NÀY) có nghĩa là gì?</div>
                <p><b>1. Phân tích từ vựng biển báo:</b></p>
                <p><span class="p-word">allowed</span> (Phân từ 2 của allow): <span class="p-mean">được phép</span>. Câu mang nghĩa bị động: Đồ ăn không được phép mang vào.</p>
                <p><b>2. Tại sao chọn đáp án này?</b></p>
                <p>Nghĩa tương đương là: Xin đừng mang đồ ăn vào trong - <span class="hl-green">Do not bring food inside.</span> (Dùng câu mệnh lệnh phủ định).</p>
                <p><b>3. Tại sao các đáp án còn lại sai?</b></p>
                <p>Biển không đề cập đến đồ uống (<span class="hl-red">drinks are fine</span> là suy diễn). Không bảo "Nên mua đồ ăn bên trong" hay "Không có thức ăn bán bên trong".</p>
            `
        },
        {
            q: `<div class="sign-noswim"><div class="icon">🏊<div class="cross">⃠</div></div><div class="text">NO SWIMMING</div></div><br>What does the notice say?`,
            opts: [
                { t: "You can not swim here.", c: true },
                { t: "You can go swimming here.", c: false },
                { t: "You can not swim alone.", c: false },
                { t: "You can go fishing here.", c: false }
            ],
            expl: `
                <div class="translated-question">Dịch: Biển báo (CẤM BƠI LỘI) có nghĩa là gì?</div>
                <p><b>1. Phân tích từ vựng biển báo:</b></p>
                <p>Cấu trúc <span class="p-grammar">NO + V-ing</span> thường thấy trên các biển báo mang nghĩa Cấm làm một hành động nào đó. Ở đây là "Cấm bơi".</p>
                <p><b>2. Tại sao chọn đáp án này?</b></p>
                <p>Câu tương đương miêu tả sự ngăn cấm là dùng modal verb (động từ khuyết thiếu) "cannot" (không thể/không được phép): <span class="hl-green">You can not swim here.</span></p>
                <p><b>3. Tại sao các đáp án còn lại sai?</b></p>
                <p>Sai nghĩa hoàn toàn với các đáp án <span class="hl-red">can go swimming</span> (được bơi) hoặc <span class="hl-red">fishing</span> (đi câu cá). Bẫy <span class="hl-red">swim alone</span> (bơi một mình) không có cơ sở trên biển báo.</p>
            `
        }
    ];

    const quizContainer = document.getElementById('quiz-container');
    let answeredQuestions = 0;
    let score = 0;
    const totalQuestions = quizData.length;

    // Shuffle array function
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Render Quiz (Được gọi sau khi nhập đúng mật khẩu)
    function renderQuiz() {
        if(quizContainer.innerHTML.trim() !== '') return; // Tránh render 2 lần

        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            
            // Question Text
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `Question ${index + 1}: ${item.q}`;
            card.appendChild(qText);

            // Options Container
            const optGrid = document.createElement('div');
            optGrid.className = 'options-grid';
            
            // Shuffle options
            const shuffledOpts = shuffleArray([...item.opts]);

            shuffledOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.t;
                btn.onclick = () => handleAnswer(btn, opt.c, optGrid, card, item.expl);
                optGrid.appendChild(btn);
            });

            card.appendChild(optGrid);

            // Explanation Box
            const explBox = document.createElement('div');
            explBox.className = 'explanation-box';
            explBox.innerHTML = item.expl;
            card.appendChild(explBox);

            quizContainer.appendChild(card);
        });
    }

    // Handle Answer Click
    function handleAnswer(btn, isCorrect, grid, card, explHtml) {
        // Init Audio on first interaction
        initAudio();

        // Disable all buttons in this grid
        const buttons = grid.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        // Visual Audio Feedback
        if (isCorrect) {
            btn.classList.add('correct');
            playDing();
            fireConfetti();
            score++;
        } else {
            btn.classList.add('wrong');
            btn.classList.add('shake');
            playBuzz(); // <--- Đã sử dụng hàm phát âm thanh Huh mới ở đây
            // Highlight the correct one
            buttons.forEach(b => {
                const text = b.innerText;
                const origOpt = quizData.find(q => q.expl === explHtml).opts.find(o => o.t === text);
                if(origOpt.c) {
                    b.classList.add('correct');
                    b.style.opacity = '0.5';
                }
            });
        }

        // Show Explanation
        const explBox = card.querySelector('.explanation-box');
        explBox.style.display = 'block';

        answeredQuestions++;
    }

    // Modals Handling
    function openNameModal() {
        if(answeredQuestions < totalQuestions) {
            alert("Hãy hoàn thành tất cả các câu hỏi trước khi nộp bài nhé! 🥺");
            return;
        }
        document.getElementById('nameModal').style.display = 'flex';
        setTimeout(() => document.getElementById('nameModalContent').classList.add('active'), 10);
    }

    function submitQuiz() {
        const input = document.getElementById('playerName');
        const name = input.value.trim();
        
        if(!name) {
            input.classList.add('error');
            input.placeholder = "Nhập tên vào đi nè bạn ơi! 😠";
            return;
        }

        document.getElementById('nameModalContent').classList.remove('active');
        setTimeout(() => {
            document.getElementById('nameModal').style.display = 'none';
            showResult(name);
        }, 300);
    }

    function showResult(name) {
        const modal = document.getElementById('resultModal');
        const content = document.getElementById('resultModalContent');
        const greeting = document.getElementById('greeting');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const gif = document.getElementById('resultGif');
        const msg = document.getElementById('motivationalMsg');

        greeting.innerText = `🌟 XUẤT SẮC, ${name.toUpperCase()}!`;
        scoreDisplay.innerText = `${score} / ${totalQuestions}`;

        let percentage = score / totalQuestions;
        
        if (percentage === 1) {
            gif.src = "https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif"; // Awesome
            msg.innerText = "Tuyệt đối! Không trật một câu nào! Điểm 10 chất lượng! 🎉";
            msg.style.color = "#00D26A";
        } else if (percentage >= 0.6) {
            gif.src = "https://media.giphy.com/media/3o7abGQa0aRJUurpII/giphy.gif"; // Nod
            msg.innerText = "Giỏi lắm! Bạn đã làm rất tốt. Hãy cố gắng xíu nữa là hoàn hảo! 👍";
            msg.style.color = "#E67E22";
        } else {
            gif.src = "https://media.giphy.com/media/2rtQMJvhzHehlZ02k/giphy.gif"; // Crying
            msg.innerText = "Ồ không! Cố gắng luyện tập thêm phần giải thích bên dưới nhé. Đừng nản chí! 💪";
            msg.style.color = "#FF4757";
        }

        modal.style.display = 'flex';
        setTimeout(() => {
            content.classList.add('active');
            if(percentage === 1) fireConfetti();
        }, 10);
    }

</script>
