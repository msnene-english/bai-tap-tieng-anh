<html lang="vi">
<head>
<meta charset="UTF-8">

<style>
:root{
  --moss:#bfeff5; --leaf:#0e7490; --sky:#a7f3d0; --sun:#5eead4; --clay:#2563eb; --cream:#f3fdff;
  --ink:#0c4a6e;
  --p-word:#c1121f; --p-phon:#5a189a; --p-mean:#1d6fb8; --p-gram:#6a4c93;
  --green:#2a9d8f; --red:#e5383b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:20px}
html,body{margin:0;height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#bfeff5,#a7f3d0,#5eead4,#38bdf8,#2563eb);background-size:400% 400%;animation:bg 18s ease infinite;}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:repeating-radial-gradient(circle at 50% 130%,rgba(255,255,255,.32) 0 4px,transparent 4px 34px),radial-gradient(rgba(255,255,255,.45) 3px,transparent 3.2px);background-size:200px 100px,50px 50px;}
.float{position:absolute;font-size:50px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(13px,1.9vw,20px);margin:0;letter-spacing:1.5px;
  background:linear-gradient(90deg,#fff,#d6f5ff,#fff);-webkit-background-clip:text;background-clip:text;color:#fff;
  -webkit-text-stroke:1.8px var(--ink);text-shadow:2px 2px 0 var(--clay),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:700;font-size:13.5px;margin-top:1px;display:inline-block;background:rgba(255,255,255,.7);border:1.5px solid var(--ink);border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(247,244,234,.45);border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(12,74,110,.25)}
.pane::-webkit-scrollbar{width:10px}.pane::-webkit-scrollbar-thumb{background:var(--leaf);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Press Start 2P',cursive;font-size:13px;letter-spacing:1px;position:sticky;top:0;z-index:2;margin:0 -10px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--clay),var(--leaf));border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Press Start 2P',cursive;font-size:12px;letter-spacing:1px;margin:16px 0 8px;color:var(--ink);background:var(--sun);display:inline-block;padding:2px 14px;border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.rd{background:rgba(255,255,255,.6);border:2.5px solid var(--ink);border-radius:16px;padding:13px 15px;margin:10px 0;box-shadow:3px 3px 0 rgba(12,74,110,.2)}
.rd p{margin:9px 0;line-height:1.95;font-size:18.5px}
.gap{font-family:'Press Start 2P',cursive;background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:2px 8px;margin:0 3px;font-size:12px}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--leaf);color:#fff;font-weight:800;font-size:15px;border-radius:20px;padding:3px 12px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#e8fbff;border-left:5px solid var(--leaf);border-radius:8px;padding:10px 12px;font-size:17.5px;line-height:1.85;color:#0c4a6e}
.trans.show{display:block;animation:fd .25s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.gw{background:rgba(255,255,255,.62);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;margin-top:10px;box-shadow:3px 3px 0 rgba(12,74,110,.2)}
.gw .gh{font-family:'Press Start 2P',cursive;font-size:12px;letter-spacing:.5px;margin-bottom:8px;display:block}
.gtb{width:100%;border-collapse:collapse;font-size:15.5px}
.gtb th{background:var(--clay);color:#fff;border:2px solid var(--ink);padding:4px 7px;text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.gtb td{border:2px solid var(--ink);padding:5px 7px;background:rgba(255,255,255,.85)}
.gtb td:first-child{font-weight:800;color:var(--p-word)}
.gtb td:nth-child(2){font-style:italic;color:var(--p-gram);white-space:nowrap}
.q{background:rgba(255,255,255,.62);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;margin:14px 0;box-shadow:5px 5px 0 rgba(12,74,110,.2)}
.q .qtxt{font-weight:800;font-size:19px;margin-bottom:14px;display:flex;gap:8px;line-height:1.5}
.q .badge{font-family:'Press Start 2P',cursive;background:var(--clay);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:38px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;box-shadow:2px 2px 0 var(--ink);flex:none;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:2px 2px 0 var(--ink)}50%{box-shadow:2px 2px 0 var(--ink),0 0 14px 2px rgba(94,234,212,.7)}}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:18px;line-height:1.5;background:rgba(255,255,255,.92);border:2.5px solid var(--ink);border-radius:14px;padding:11px 15px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf7;border:2.5px dashed var(--ink);border-radius:14px;padding:16px;font-size:17px;line-height:1.9}
.exp h4{margin:0 0 9px;font-family:'Press Start 2P',cursive;letter-spacing:.5px;font-size:12px;color:var(--leaf)}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:5px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-phonetic{color:var(--p-phon);font-weight:700}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#efe4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(247,244,234,.55);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:15px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sky),var(--clay));transition:width .3s}
.progtxt{font-family:'Press Start 2P',cursive;font-size:11px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Press Start 2P',cursive;font-size:11px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#f4a261,#74c69d);border:2.5px solid var(--ink);border-radius:14px;padding:5px 15px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:rgba(12,74,110,.55);backdrop-filter:blur(4px);padding:16px}
.overlay.open{display:flex}
.modal{background:linear-gradient(160deg,#fff,#f7f4ea);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(12,74,110,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Press Start 2P',cursive;font-size:15px;line-height:1.6;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Baloo 2';font-weight:700;font-size:17px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Press Start 2P',cursive;font-size:11px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Press Start 2P',cursive;font-size:22px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Press Start 2P',cursive;font-size:15px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sun);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--sky);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){body{overflow:auto}.wrap{height:auto;min-height:100%}.split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}.float{font-size:36px}footer{position:sticky;bottom:0}}
</style>

<script>
function opt(en){return {en}}
const PARTS = [
{
 title:"🇬🇧 IX. Gap Filling — Visit London (Câu 1–6)",
 left:`
 <div class="rd"><p>Are you planning your next trip? Then why not visit London? London is one of the most exciting cities in the world.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Bấm vào đây để đọc bản dịch</button>
 <div class="trans">Bạn đang lên kế hoạch cho chuyến đi tiếp theo? Vậy sao không đến London? London là một trong những thành phố thú vị nhất thế giới.</div></div>

 <div class="rd"><p><b>Sights and attractions</b><br>There are lots of things to see and do in London. Walk around the centre and see famous <span class="gap">1</span> like Big Ben and Westminster Abbey. Visit the Tower of London where England's kings and queens lived. Go to Buckingham Palace at 11:30 and <span class="gap">2</span> the famous 'Changing of the Guard' ceremony. And don't miss London's art galleries and museums – <span class="gap">3</span> are free to get into!</p>
 <button class="tbtn" onclick="tg(this)">🌟 Bấm vào đây để đọc bản dịch</button>
 <div class="trans"><b>Cảnh đẹp và điểm tham quan</b><br>Có rất nhiều thứ để xem và làm ở London. Đi dạo quanh trung tâm và ngắm các địa danh nổi tiếng như Big Ben và Tu viện Westminster. Ghé thăm Tháp London, nơi các vị vua và hoàng hậu nước Anh từng sống. Đến Cung điện Buckingham lúc 11:30 để xem nghi lễ Đổi Gác nổi tiếng. Và đừng bỏ lỡ các phòng tranh nghệ thuật và bảo tàng của London – hầu hết đều miễn phí vào cửa!</div></div>

 <div class="rd"><p><b>Shopping</b><br>There are over 40,000 shops in London. Oxford Street is Europe's <span class="gap">4</span> high street with over 300 shops.<br><br>
 <b>Eating</b><br>With over 270 nationalities in London, you can try food from just about <span class="gap">5</span> in the world. Make sure you try the UK's most famous dish – fish and chips!</p>
 <button class="tbtn" onclick="tg(this)">🌟 Bấm vào đây để đọc bản dịch</button>
 <div class="trans"><b>Mua sắm</b><br>Có hơn 40.000 cửa hàng ở London. Phố Oxford là con phố mua sắm sầm uất nhất châu Âu với hơn 300 cửa hàng.<br><br>
 <b>Ăn uống</b><br>Với hơn 270 quốc tịch sinh sống ở London, bạn có thể thử món ăn từ hầu như mọi quốc gia trên thế giới. Nhớ thử món ăn nổi tiếng nhất nước Anh – cá và khoai tây chiên!</div></div>

 <div class="rd"><p><b>Getting around</b><br>London has a quick underground train system (the 'tube' as the locals call it). <span class="gap">6</span> are also the famous red 'double-decker' buses. The tube is quicker, but you will see more of London from a bus!</p>
 <button class="tbtn" onclick="tg(this)">🌟 Bấm vào đây để đọc bản dịch</button>
 <div class="trans"><b>Di chuyển quanh thành phố</b><br>London có hệ thống tàu điện ngầm nhanh chóng (người dân địa phương gọi là "tube"). Ngoài ra còn có những chiếc xe buýt hai tầng màu đỏ nổi tiếng. Tàu điện ngầm thì nhanh hơn, nhưng đi xe buýt bạn sẽ được ngắm nhiều cảnh London hơn!</div></div>

 <div class="gw"><span class="gh">📚 Từ vựng</span>
 <table class="gtb">
 <tr><th>Word</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td>sight</td><td>n</td><td>cảnh đẹp</td></tr>
 <tr><td>landmark</td><td>n</td><td>địa danh, công trình biểu tượng</td></tr>
 <tr><td>ceremony</td><td>n</td><td>nghi lễ</td></tr>
 <tr><td>high street</td><td>n</td><td>phố mua sắm chính</td></tr>
 <tr><td>nationality</td><td>n</td><td>quốc tịch</td></tr>
 <tr><td>double-decker bus</td><td>n</td><td>xe buýt hai tầng</td></tr>
 </table></div>`,
 qs:[
  {n:"1",q:"Walk around the centre and see famous ______ like Big Ben and Westminster Abbey.",
   opts:[opt("sights"),opt("landscapes"),opt("landmarks"),opt("facts")],a:"landmarks",
   exp:`<h4>🧠 Câu 1</h4>
   <b>Bước 1 — Dịch câu hỏi:</b> "Đi dạo quanh trung tâm và ngắm các ______ nổi tiếng như Big Ben và Tu viện Westminster."<br>
   <b>Bước 2 — Các đáp án &amp; nghĩa:</b>
   <ul><li><span class="p-word">sights</span> ➔ <span class="p-mean">cảnh đẹp (n)</span></li>
   <li><span class="p-word">landscapes</span> ➔ <span class="p-mean">phong cảnh thiên nhiên (n)</span></li>
   <li><span class="p-word">landmarks</span> ➔ <span class="p-mean">địa danh, công trình mang tính biểu tượng (n)</span></li>
   <li><span class="p-word">facts</span> ➔ <span class="p-mean">sự thật, dữ kiện (n)</span></li></ul>
   <b>Bước 3 — <span class="hl-green">Tại sao đúng:</span></b> Đáp án đúng là <span class="p-word">landmarks</span>. Big Ben và Westminster Abbey là những CÔNG TRÌNH nổi tiếng mang tính biểu tượng của thành phố — đúng nghĩa "landmark", không phải "cảnh thiên nhiên" hay "dữ kiện".<br>
   <b>Bước 4 — <span class="hl-red">Tại sao các đáp án khác sai:</span></b>
   <ul><li><span class="p-word">sights</span> — nghĩa chung chung "cảnh đẹp", không nhấn mạnh tính CÔNG TRÌNH KIẾN TRÚC biểu tượng như "landmarks".</li>
   <li><span class="p-word">landscapes</span> — chỉ PHONG CẢNH THIÊN NHIÊN (núi, sông...), không phù hợp với các công trình như Big Ben.</li>
   <li><span class="p-word">facts</span> — nghĩa "sự thật/dữ kiện", hoàn toàn sai vì Big Ben không phải là một "fact".</li></ul>
   🔍 <b>Dẫn chứng trong bài:</b> <span class="p-word">Walk around the centre and see famous landmarks like Big Ben and Westminster Abbey.</span> 👉 <span class="p-mean">"Đi dạo quanh trung tâm và ngắm các địa danh nổi tiếng như Big Ben và Tu viện Westminster."</span>`},
  {n:"2",q:"Go to Buckingham Palace at 11:30 and ______ the famous 'Changing of the Guard' ceremony.",
   opts:[opt("notice"),opt("see"),opt("realise"),opt("take")],a:"see",
   exp:`<h4>🧠 Câu 2</h4>
   <b>Bước 1 — Dịch câu hỏi:</b> "Đến Cung điện Buckingham lúc 11:30 và ______ nghi lễ Đổi Gác nổi tiếng."<br>
   <b>Bước 2 — Các đáp án &amp; nghĩa:</b>
   <ul><li><span class="p-word">notice</span> ➔ <span class="p-mean">để ý, nhận ra (v)</span></li>
   <li><span class="p-word">see</span> ➔ <span class="p-mean">xem, nhìn thấy (v)</span></li>
   <li><span class="p-word">realise</span> ➔ <span class="p-mean">nhận ra, nhận thức được (v)</span></li>
   <li><span class="p-word">take</span> ➔ <span class="p-mean">lấy, mang (v)</span></li></ul>
   <b>Bước 3 — <span class="hl-green">Tại sao đúng:</span></b> Đáp án đúng là <span class="p-word">see</span>. Cụm cố định <span class="p-grammar">see a ceremony</span> nghĩa "xem một nghi lễ/buổi trình diễn" — đúng collocation khi nói về việc đến xem một sự kiện đang diễn ra.<br>
   <b>Bước 4 — <span class="hl-red">Tại sao các đáp án khác sai:</span></b>
   <ul><li><span class="p-word">notice</span> — nghĩa "vô tình để ý thấy", không phù hợp khi CHỦ ĐỘNG đến xem một nghi lễ đã lên kế hoạch trước.</li>
   <li><span class="p-word">realise</span> — nghĩa "nhận thức/hiểu ra điều gì", không dùng để nói về việc xem một sự kiện trực tiếp.</li>
   <li><span class="p-word">take</span> — không tạo thành cụm có nghĩa với "ceremony" theo cách này ("take a ceremony" không tồn tại).</li></ul>

 <div class="rd"><p><b>SEOUL</b><br>Seoul is South Korea's capital. It is located in the northern part of South Korea. It has a population of nearly 10 million people. In this city you can find many tall buildings and skyscrapers. Seoul is known around the world as a technology capital. It has a large subway system.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Bấm vào đây để đọc bản dịch</button>
 <div class="trans">Seoul là thủ đô của Hàn Quốc. Nó nằm ở phía bắc Hàn Quốc. Thành phố có dân số gần 10 triệu người. Ở thành phố này bạn có thể thấy rất nhiều tòa nhà cao tầng và nhà chọc trời. Seoul được biết đến trên toàn thế giới như một thủ đô công nghệ. Nó có một hệ thống tàu điện ngầm lớn.</div></div>

 <div class="rd"><p>Incheon International Airport is a forty minute train ride from Seoul. Gangnam, Itaewon and Hongdae are popular neighbourhoods in Seoul. Here you can find bustling downtown districts, social life, shopping and great dining. The War Memorial of Korea and Namsan Seoul Tower are popular tourist destinations in Seoul.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Bấm vào đây để đọc bản dịch</button>
 <div class="trans">Sân bay Quốc tế Incheon cách Seoul 40 phút đi tàu. Gangnam, Itaewon và Hongdae là những khu phố nổi tiếng ở Seoul. Ở đây bạn có thể tìm thấy các khu trung tâm nhộn nhịp, đời sống xã hội sôi động, mua sắm và ẩm thực tuyệt vời. Đài Tưởng niệm Chiến tranh Hàn Quốc và Tháp Namsan Seoul là những điểm đến du lịch nổi tiếng ở Seoul.</div></div>

   <li><span class="p-word">20 minutes.</span> — con số không khớp với "forty minute" (40 phút) trong bài.</li></ul>
   🔍 <b>Dẫn chứng trong bài:</b> <span class="p-word">Incheon International Airport is a forty minute train ride from Seoul.</span> 👉 <span class="p-mean">"Sân bay Quốc tế Incheon cách Seoul 40 phút đi tàu."</span>`},
  {n:"11",q:"Which are popular neighbourhoods in Seoul?",
   opts:[opt("Gangnam, Itaewon, Hongdae."),opt("Gangnam and Busan."),opt("Jeju and Itaewon."),opt("Hongdae only.")],a:"Gangnam, Itaewon, Hongdae.",
   exp:`<h4>🧠 Câu 11</h4>

   <li><span class="p-word">Gangnam and Busan.</span> ➔ <span class="p-mean">Gangnam và Busan.</span></li>
   <li><span class="p-word">Jeju and Itaewon.</span> ➔ <span class="p-mean">Jeju và Itaewon.</span></li>
   <li><span class="p-word">Hongdae only.</span> ➔ <span class="p-mean">Chỉ Hongdae.</span></li></ul>
   <b>Bước 3 — <span class="hl-green">Tại sao đúng:</span></b> Đáp án đúng là <span class="p-word">Gangnam, Itaewon, Hongdae.</span> Bài đọc liệt kê chính xác đúng ba khu phố này.<br>

   <li><span class="p-word">Jeju and Itaewon.</span> — "Jeju" là một HÒN ĐẢO du lịch nổi tiếng khác, không liên quan đến Seoul, không xuất hiện trong bài.</li>
   <li><span class="p-word">Hongdae only.</span> — bài liệt kê CẢ BA khu phố, không chỉ riêng một mình Hongdae.</li></ul>
   🔍 <b>Dẫn chứng trong bài:</b> <span class="p-word">Gangnam, Itaewon and Hongdae are popular neighbourhoods in Seoul.</span> 👉 <span class="p-mean">"Gangnam, Itaewon và Hongdae là những khu phố nổi tiếng ở Seoul."</span>`},
  {n:"12",q:"What are popular tourist destinations in Seoul?",
   opts:[opt("Royal Palace."),opt("War Memorial of Korea and Namsan Tower."),opt("Airport only."),opt("Big Ben.")],a:"War Memorial of Korea and Namsan Tower.",
   exp:`<h4>🧠 Câu 12</h4>

   <li><span class="p-word">Airport only.</span> — sân bay Incheon chỉ được nhắc như PHƯƠNG TIỆN di chuyển, không phải điểm đến du lịch của Seoul.</li>
   <li><span class="p-word">Big Ben.</span> — đây là biểu tượng của LONDON (bài đọc IX), hoàn toàn không liên quan đến Seoul.</li></ul>
   🔍 <b>Dẫn chứng trong bài:</b> <span class="p-word">The War Memorial of Korea and Namsan Seoul Tower are popular tourist destinations in Seoul.</span> 👉 <span class="p-mean">"Đài Tưởng niệm Chiến tranh Hàn Quốc và Tháp Namsan Seoul là những điểm đến du lịch nổi tiếng ở Seoul."</span>`}
 ]

let TOTAL=0;const answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    TOTAL++;
    const box=document.createElement('div'); box.className='opts';
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.textContent=o.en; b.dataset.val=o.en; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
    });
    card.appendChild(box);
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#bfeff5','#a7f3d0','#5eead4','#38bdf8','#2563eb','#f3fdff'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.classList.contains('show');t.classList.toggle('show');btn.textContent=open?'🌟 Bấm vào đây để đọc bản dịch':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').classList.add('open');document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').classList.remove('open');
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Tuyệt vời! Đúng trọn '+TOTAL+' câu — con đọc rất kỹ cả hai bài về London và Seoul! Ms. Chí Nên tự hào về con lắm! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — đọc lại phần giải thích 4 bước để hiểu hơn nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại bài rồi làm lại. Ms tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms. Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').classList.add('open');
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
<script>/*devclean*/(function(){
var ZW=/[\u00AD\u034F\u061C\u115F\u1160\u17B4\u17B5\u180E\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g,
    SP=/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\t]/g,
    AP=/[\u2018\u2019\u201A\u201B\u2032\u2035\u02B9\u02BB\u02BC\u02BD\u02C8\u0060\u00B4\uFF07]/g,
    DQ=/[\u201C\u201D\u201E\u201F\u2033\u2036\u00AB\u00BB\uFF02]/g,
    DS=/[\u2010\u2011\u2012\u2212\uFE63\uFF0D]/g;
function clean(v){if(!v)return v;var s=String(v);try{s=s.normalize('NFKC')}catch(e){}
  return s.replace(ZW,'').replace(SP,' ').replace(AP,"'").replace(DQ,'"').replace(DS,'-').replace(/[\u0300-\u036f]/g,'').replace(/ {2,}/g,' ');}
window.__devclean=clean;
function fix(skip){var L=document.querySelectorAll('input:not([type]),input[type=text],input[type=search],textarea');
  for(var i=0;i<L.length;i++){var el=L[i];if(el===skip||el.readOnly||el.disabled)continue;var v=el.value,c=clean(v);if(c!==v)el.value=c;}}
['pointerdown','mousedown','touchstart','click','change','focusout'].forEach(function(t){document.addEventListener(t,function(e){fix(t==='focusout'||t==='change'?null:e.target)},true)});
document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13)fix(null)},true);
})();</script>
