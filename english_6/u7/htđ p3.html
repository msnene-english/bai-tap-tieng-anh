    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f4f8;
            background-image: radial-gradient(#8854C0 0.5px, transparent 0.5px), radial-gradient(#8854C0 0.5px, #f0f4f8 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            max-width: 650px;
            width: 95%;
            margin: 20px auto;
            padding: 24px;
            position: relative;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            background: white;
            box-shadow: 0 5px 0 #e2e8f0;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            transform: translateY(-2px);
            border-color: #8854C0;
            box-shadow: 0 7px 0 #8854C0;
        }

        .option-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #8854C0;
        }

        .option-btn.correct {
            background-color: #00D26A !important;
            color: white !important;
            border-color: #00a854 !important;
            box-shadow: 0 5px 0 #00a854 !important;
        }

        .option-btn.wrong {
            background-color: #FF4757 !important;
            color: white !important;
            border-color: #d63031 !important;
            box-shadow: 0 5px 0 #d63031 !important;
        }

        .explanation-box {
            background-color: #f8f0ff;
            border-left: 5px solid #8854C0;
            border-radius: 12px;
            margin-top: 15px;
            padding: 15px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .teacher-badge {
            background: #8854C0;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
            width: 100%;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00C9A7, #8854C0);
            width: 0%;
            transition: width 0.5s ease;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 0 rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: #00C9A7;
            color: white;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 5px 0 #00a88b;
            cursor: pointer;
            border: none;
            margin-top: 20px;
        }

        .glossary-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .glossary-table th, .glossary-table td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        .glossary-table th { background-color: #f8f0ff; color: #8854C0; }

        #question-area { width: 100%; display: flex; flex-direction: column; align-items: center; }
    </style>

                    translation: "Khi nào chúng ta có môn Vật lý?",
                    logic: "We dùng trợ động từ do.",
                    whyNot: "B sai trợ động từ; C chia động từ chính sai; D sai thì."
                }
            },
            {
                q: "My aunt ______ in a flat in Hanoi.",
                options: ["don't live", "doesn't live", "doesn't lives", "not live"],
                correct: 1,
                explanation: {
                    analysis: ["don't live", "doesn't live: không sống", "doesn't lives", "not live"],
                    translation: "Dì của tôi không sống ở căn hộ tại Hà Nội.",
                    logic: "Aunt là số ít -> dùng doesn't.",
                    whyNot: "A sai ngôi; C chia động từ chính; D thiếu trợ động từ."
                }
            },
            {
                q: "She never ______ school late.",
                options: ["go to", "goes to", "going to", "is go to"],
                correct: 1,
                explanation: {
                    analysis: ["go to", "goes to: đi đến", "going to", "is go to"],
                    translation: "Cô ấy không bao giờ đi học muộn.",
                    logic: "She -> go thêm es thành 'goes'. Trạng từ 'never' không làm thay đổi việc chia động từ.",
                    whyNot: "A sai ngôi; C, D sai thì/cấu trúc."
                }
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let canAnswer = true;

        function updateStats() {
            const progress = (currentQuestion / quizData.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('stats').innerText = `Câu ${currentQuestion + 1}/${quizData.length} • Điểm: ${score}`;
        }

        function renderQuestion() {
            canAnswer = true;
            const data = quizData[currentQuestion];
            const area = document.getElementById('question-area');
            
            area.innerHTML = `
                <div class="game-card" id="card-${currentQuestion}">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6">${data.q}</h3>
                    <div id="options-container">
                        ${data.options.map((opt, i) => `
                            <button class="option-btn" onclick="checkAnswer(${i})">
                                <span class="bg-gray-100 px-3 py-1 rounded-lg mr-4 text-[#8854C0]">${String.fromCharCode(65 + i)}</span>
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div id="explanation" class="explanation-box">
                        <div class="font-bold text-[#8854C0] mb-2">💡 Ms. Chí Nên giải thích:</div>
                        <div class="text-gray-700 text-sm space-y-2">
                            <p><strong>Dịch câu:</strong> ${data.explanation.translation}</p>
                            <p><strong>Phân tích 4 đáp án:</strong></p>
                            <ul class="list-disc ml-5">
                                ${data.explanation.analysis.map(a => `<li>${a}</li>`).join('')}
                            </ul>
                            <p><strong>Tại sao đúng?</strong> ${data.explanation.logic}</p>
                            <p><strong>Tại sao loại đáp án khác?</strong> ${data.explanation.whyNot}</p>
                        </div>
                        <button class="btn-primary w-full mt-4" onclick="nextQuestion()">TIẾP THEO ➜</button>
                    </div>
                </div>
            `;
            updateStats();
        }

        function checkAnswer(index) {
            if (!canAnswer) return;
            canAnswer = false;

            const data = quizData[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            const expBox = document.getElementById('explanation');
            const card = document.getElementById(`card-${currentQuestion}`);

            if (index === data.correct) {
                buttons[index].classList.add('correct');
                score++;
                document.getElementById('snd-correct').play();
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#8854C0', '#00C9A7', '#FFD700']
                });
            } else {
                buttons[index].classList.add('wrong');
                buttons[data.correct].classList.add('correct');
                card.classList.add('shake');
                document.getElementById('snd-wrong').play();
            }

            expBox.style.display = 'block';
            updateStats();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                renderQuestion();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            const modal = document.getElementById('final-modal');
            const scoreText = document.getElementById('final-score');
            const commentText = document.getElementById('final-comment');
            
            modal.style.display = 'flex';
            scoreText.innerText = `${score}/${quizData.length}`;
            
            let comment = "";
            const percent = (score / quizData.length) * 100;
            if (percent === 100) comment = "Xuất sắc! Em là thiên tài ngữ pháp!";
            else if (percent >= 80) comment = "Giỏi quá! Cố gắng phát huy nhé!";
            else if (percent >= 50) comment = "Khá tốt, nhưng cần ôn tập kỹ hơn một chút!";
            else comment = "Đừng buồn, hãy làm lại để nhớ kiến thức nhé!";
            
            commentText.innerText = comment;
        }

        // Khởi tạo
        window.onload = renderQuestion;
    </script>
</body>
</html>
