<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếng Anh Ms. Chí Nên - Conjunctions & Wh- Questions</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #00C9A7;
            --correct: #00D26A;
            --incorrect: #FF4757;
            --bg-pattern: #f0f4f8;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2d3436;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .header-small {
            font-size: 0.9rem;
            color: #636e72;
            text-align: center;
            margin-top: 5px;
        }

        .quiz-container {
            max-width: 800px;
            width: 95%;
            margin: 20px auto;
            perspective: 1000px;
        }

        .card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 0 rgba(0,0,0,0.05);
            padding: 30px;
            border: 3px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 18px;
            border: 3px solid #e2e8f0;
            background: white;
            box-shadow: 0 6px 0 #e2e8f0;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.1s ease;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #cbd5e1;
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #cbd5e1;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--correct) !important;
            box-shadow: 0 6px 0 #16a34a !important;
            color: #166534 !important;
        }

        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--incorrect) !important;
            box-shadow: 0 6px 0 #dc2626 !important;
            color: #991b1b !important;
        }

        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 20px;
            background: #fdf4ff;
            border-left: 8px solid var(--primary);
            display: none;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .shake { animation: shake 0.3s ease-in-out; }

        .progress-bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.5s ease;
        }

        .badge-teacher {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 10px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 5px solid var(--secondary);
        }

        .letter-tag {
            background: #f1f5f9;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin-right: 15px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="py-6 px-4">
        <h1 class="text-3xl font-extrabold text-center text-[#8854C0]">BÀI KIỂM TRA: CONJUNCTIONS & WH- QUESTIONS</h1>
        <p class="header-small">Giáo viên tạo: <span class="font-bold">Ms. Chí Nên </span> (M.A in TESOL)</p>
    </header>

    <main class="quiz-container">
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        
        <div id="quizCard" class="card">
            <div id="questionArea">
                <span class="badge-teacher">Ms. Chí Nên gọi tên câu hỏi: <span id="qNumber">1</span></span>
                <h2 id="questionText" class="text-xl font-bold mb-6 text-gray-800">Đang tải câu hỏi...</h2>
                
                <div id="optionsList" class="space-y-3">
                    <!-- Options will be injected here -->
                </div>

                <div id="explanationArea" class="explanation-box">
                    <h3 class="font-extrabold text-[#8854C0] mb-2">💡 Ms. Chí Nên giải thích:</h3>
                    <div id="explanationContent" class="text-sm space-y-3 leading-relaxed">
                        <!-- Content injected -->
                    </div>
                </div>

                <div class="mt-8 flex justify-between items-center">
                    <button id="nextBtn" class="hidden bg-[#00C9A7] hover:bg-[#00b395] text-white font-extrabold py-3 px-8 rounded-2xl shadow-[0_6px_0_#008f76] transition-all active:translate-y-1 active:shadow-none">
                        CÂU TIẾP THEO ➜
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Kết thúc -->
    <div id="resultModal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="text-4xl font-black mb-4 text-[#8854C0]">XUẤT SẮC! 🎉</h2>
            <div class="text-6xl mb-4">🏆</div>
            <p class="text-xl mb-2">Bạn đã hoàn thành bài thi của Ms. Chí Nên</p>
            <p id="scoreText" class="text-3xl font-bold text-[#00C9A7] mb-6">Điểm: 0/0</p>
            <p id="feedbackText" class="italic text-gray-600 mb-8">"Lời khen ngẫu nhiên"</p>
            <button onclick="location.reload()" class="bg-[#8854C0] text-white font-bold py-3 px-10 rounded-2xl shadow-[0_6px_0_#6a3da1]">
                LÀM LẠI BÀI THI
            </button>
        </div>
    </div>

    <!-- Âm thanh -->
    <audio id="audioCorrect" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="audioIncorrect" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <script>
        const quizData = [
            {
                q: "My brother likes football, _________he watches sports programmes every Sunday.",
                options: ["and", "but", "so", "or"],
                correct: 2,
                explanation: {
                    translation: "Anh trai tôi thích bóng đá, vì vậy anh ấy xem các chương trình thể thao vào mỗi Chủ nhật.",
                    analysis: [
                        "A. and (conj): và (bổ sung thông tin)",
                        "B. but (conj): nhưng (diễn tả sự đối lập)",
                        "C. so (conj): vì vậy, cho nên (diễn tả kết quả)",
                        "D. or (conj): hoặc (đưa ra sự lựa chọn)"
                    ],
                    why: "Mệnh đề sau là kết quả logic của mệnh đề trước (thích bóng đá -> hệ quả là xem thể thao), nên ta dùng 'so'.",
                    error: "Loại A, B, D vì không hợp ngữ nghĩa chỉ kết quả trong ngữ cảnh này."
                }
            },
            {
                q: "I have a lot of homework, _________I don't watch TV on weekdays.",
                options: ["but", "so", "and", "or"],
                correct: 1,
                explanation: {
                    translation: "Tôi có rất nhiều bài tập về nhà, vì vậy tôi không xem TV vào các ngày trong tuần.",
                    analysis: [
                        "A. but (conj): nhưng",
                        "B. so (conj): vì vậy",
                        "C. and (conj): và",
                        "D. or (conj): hoặc"
                    ],
                    why: "Việc 'không xem TV' là hệ quả trực tiếp của việc 'có nhiều bài tập'. Dùng 'so' để nối nguyên nhân - kết quả.",
                    error: "Cấu trúc không mang tính đối lập hay lựa chọn nên loại A, D."
                }
            },
            {
                q: "I usually watch the news, _________I watch wildlife programmes, too.",
                options: ["so", "and", "but", "because"],
                correct: 1,
                explanation: {
                    translation: "Tôi thường xem tin tức, và tôi cũng xem các chương trình thế giới động vật nữa.",
                    analysis: [
                        "A. so (conj): vì vậy",
                        "B. and (conj): và",
                        "C. but (conj): nhưng",
                        "D. because (conj): bởi vì"
                    ],
                    why: "Từ 'too' (cũng vậy) ở cuối câu là dấu hiệu mạnh mẽ của việc bổ sung thông tin tương đồng, ta dùng 'and'.",
                    error: "Không có quan hệ nguyên nhân (so/because) hay đối lập (but) ở đây."
                }
            },
            {
                q: "My classmate is interested in films, _________he never watches films on TV.",
                options: ["so", "and", "or", "but"],
                correct: 3,
                explanation: {
                    translation: "Bạn cùng lớp của tôi thích phim ảnh, nhưng cậu ấy không bao giờ xem phim trên TV.",
                    analysis: [
                        "A. so (conj): vì vậy",
                        "B. and (conj): và",
                        "C. or (conj): hoặc",
                        "D. but (conj): nhưng"
                    ],
                    why: "Hai vế mang ý nghĩa trái ngược nhau hoàn toàn: Thích phim >< Không bao giờ xem trên TV. Dùng 'but' để chỉ sự tương phản.",
                    error: "Dùng 'so' ở đây sẽ vô lý về mặt logic."
                }
            },
            {
                q: "My father usually comes home at six o'clock, _________then he watches TV for an hour.",
                options: ["and", "but", "so", "or"],
                correct: 0,
                explanation: {
                    translation: "Bố tôi thường về nhà lúc 6 giờ, và sau đó ông ấy xem TV khoảng một tiếng.",
                    analysis: [
                        "A. and (conj): và",
                        "B. but (conj): nhưng",
                        "C. so (conj): vì vậy",
                        "D. or (conj): hoặc"
                    ],
                    why: "Diễn tả một chuỗi hành động liên tiếp theo thời gian (về nhà -> sau đó làm gì đó). Dùng 'and' là tự nhiên nhất.",
                    error: "Các liên từ khác khiến câu trở nên rời rạc hoặc sai logic hành động."
                }
            },
            {
                q: "The characters of the film are very nice, _________the music doesn't sound very modern.",
                options: ["and", "so", "but", "or"],
                correct: 2,
                explanation: {
                    translation: "Các nhân vật trong phim rất tuyệt, nhưng âm nhạc nghe không hiện đại lắm.",
                    analysis: [
                        "A. and (conj): và",
                        "B. so (conj): vì vậy",
                        "C. but (conj): nhưng",
                        "D. or (conj): hoặc"
                    ],
                    why: "Câu này có sự đối lập về đánh giá: Nhân vật (khen - nice) >< Âm nhạc (chê - not modern). Ta dùng 'but'.",
                    error: "Nếu dùng 'and' sẽ không làm nổi bật được sự khác biệt giữa hai nhận xét này."
                }
            },
            {
                q: "Mr. Wealthy is very rich, _________he never feels happy.",
                options: ["so", "but", "and", "or"],
                correct: 1,
                explanation: {
                    translation: "Ông Wealthy rất giàu, nhưng ông ấy không bao giờ cảm thấy hạnh phúc.",
                    analysis: [
                        "A. so (conj): vì vậy",
                        "B. but (conj): nhưng",
                        "C. and (conj): và",
                        "D. or (conj): hoặc"
                    ],
                    why: "Thông thường giàu sẽ đi đôi với hạnh phúc/thoải mái, nhưng ở đây lại không. Sự tương phản này cần 'but'.",
                    error: "Giàu không phải nguyên nhân của việc không hạnh phúc nên không dùng 'so'."
                }
            },
            {
                q: "Minh studies very hard, _________he always gets good grades.",
                options: ["but", "or", "so", "because"],
                correct: 2,
                explanation: {
                    translation: "Minh học rất chăm chỉ, vì vậy cậu ấy luôn đạt điểm cao.",
                    analysis: [
                        "A. but (conj): nhưng",
                        "B. or (conj): hoặc",
                        "C. so (conj): vì vậy",
                        "D. because (conj): bởi vì"
                    ],
                    why: "Điểm cao là kết quả tất yếu của việc học tập chăm chỉ. Ta dùng 'so' để nối vế kết quả.",
                    error: "Lưu ý: Nếu dùng 'because' thì phải đứng trước vế nguyên nhân (Minh gets good grades because he studies hard)."
                }
            },
            {
                q: "________________is the new weather’s man name?",
                options: ["What", "Who", "Where", "How"],
                correct: 0,
                explanation: {
                    translation: "Tên của người dẫn chương trình thời tiết mới là gì?",
                    analysis: [
                        "A. What: Cái gì",
                        "B. Who: Ai",
                        "C. Where: Ở đâu",
                        "D. How: Như thế nào"
                    ],
                    why: "Mặc dù hỏi về người, nhưng danh từ chính ở đây là 'name' (tên). Khi hỏi tên, cấu trúc luôn là 'What is... name?'.",
                    error: "Không dùng 'Who' để hỏi cho danh từ 'name'."
                }
            },
            {
                q: "________________of these channels do you like most?",
                options: ["Which", "What", "Who", "Where"],
                correct: 0,
                explanation: {
                    translation: "Bạn thích kênh nào nhất trong số các kênh này?",
                    analysis: [
                        "A. Which: Cái nào (trong một nhóm cụ thể)",
                        "B. What: Cái gì (chung chung)",
                        "C. Who: Ai",
                        "D. Where: Ở đâu"
                    ],
                    why: "Cụm 'of these channels' xác định một nhóm đối tượng cụ thể. Để hỏi sự lựa chọn trong một nhóm có giới hạn, ta dùng 'Which'.",
                    error: "Dùng 'What' khi không có danh sách lựa chọn rõ ràng trước mặt."
                }
            },
            {
                q: "________________did you leave before the programme ended?",
                options: ["What", "Why", "Where", "Who"],
                correct: 1,
                explanation: {
                    translation: "Tại sao bạn lại về trước khi chương trình kết thúc?",
                    analysis: [
                        "A. What: Cái gì",
                        "B. Why: Tại sao",
                        "C. Where: Ở đâu",
                        "D. Who: Ai"
                    ],
                    why: "Câu hỏi yêu cầu giải thích nguyên nhân cho hành động 'rời đi sớm', nên dùng 'Why'.",
                    error: "Các từ khác không phù hợp để hỏi lý do."
                }
            },
            {
                q: "________________does the game show begin? – At 6p.m. I think.",
                options: ["Where", "What time", "How", "Who"],
                correct: 1,
                explanation: {
                    translation: "Trò chơi truyền hình bắt đầu lúc mấy giờ? – Tôi nghĩ là 6 giờ tối.",
                    analysis: [
                        "A. Where: Ở đâu",
                        "B. What time: Mấy giờ",
                        "C. How: Như thế nào",
                        "D. Who: Ai"
                    ],
                    why: "Câu trả lời là 'At 6p.m' (vào lúc 6 giờ tối) - chỉ mốc thời gian cụ thể, nên dùng 'What time'.",
                    error: "Where hỏi địa điểm, How hỏi cách thức đều sai."
                }
            },
            {
                q: "________________your father watch TV? – Twice a day.",
                options: ["How often", "How long", "When", "What"],
                correct: 0,
                explanation: {
                    translation: "Bố của bạn xem TV thường xuyên như thế nào? – Hai lần một ngày.",
                    analysis: [
                        "A. How often: Bao lâu một lần (tần suất)",
                        "B. How long: Bao lâu (khoảng thời gian)",
                        "C. When: Khi nào (mốc thời gian)",
                        "D. What: Cái gì"
                    ],
                    why: "Câu trả lời 'Twice a day' (2 lần/ngày) chỉ tần suất thực hiện hành động, ta dùng 'How often'.",
                    error: "'How long' hỏi độ dài (ví dụ: 2 tiếng), không hỏi số lần."
                }
            },
            {
                q: "________________is your favorite MC?",
                options: ["What", "Which", "Who", "Where"],
                correct: 2,
                explanation: {
                    translation: "Ai là người dẫn chương trình yêu thích của bạn?",
                    analysis: [
                        "A. What: Cái gì",
                        "B. Which: Cái nào",
                        "C. Who: Ai",
                        "D. Where: Ở đâu"
                    ],
                    why: "MC (Master of Ceremonies) là danh từ chỉ người, ta dùng 'Who' để hỏi.",
                    error: "Không dùng What cho người trong ngữ cảnh hỏi định danh này."
                }
            },
            {
                q: "________________does the animal programme last? – About 90 minutes.",
                options: ["How often", "How many", "How long", "When"],
                correct: 2,
                explanation: {
                    translation: "Chương trình thế giới động vật kéo dài bao lâu? – Khoảng 90 phút.",
                    analysis: [
                        "A. How often: Tần suất",
                        "B. How many: Số lượng",
                        "C. How long: Bao lâu (thời lượng)",
                        "D. When: Khi nào"
                    ],
                    why: "Động từ 'last' (kéo dài) kết hợp với câu trả lời '90 minutes' cho thấy đây là câu hỏi về thời lượng, ta dùng 'How long'.",
                    error: "'When' chỉ hỏi lúc bắt đầu hoặc kết thúc, không hỏi cả quá trình dài bao nhiêu."
                }
            },
            {
                q: "________________should we place the new TV? – In the kitchen.",
                options: ["When", "Where", "Why", "How"],
                correct: 1,
                explanation: {
                    translation: "Chúng ta nên đặt chiếc TV mới ở đâu? – Trong nhà bếp.",
                    analysis: [
                        "A. When: Khi nào",
                        "B. Where: Ở đâu",
                        "C. Why: Tại sao",
                        "D. How: Như thế nào"
                    ],
                    why: "Câu trả lời 'In the kitchen' (trong bếp) là một cụm từ chỉ vị trí, ta dùng 'Where'.",
                    error: "Các từ khác không dùng để hỏi nơi chốn."
                }
            },
            {
                q: "________________programmes does the local television have?",
                options: ["How many", "How much", "How long", "How often"],
                correct: 0,
                explanation: {
                    translation: "Đài truyền hình địa phương có bao nhiêu chương trình?",
                    analysis: [
                        "A. How many: Bao nhiêu (cho danh từ đếm được số nhiều)",
                        "B. How much: Bao nhiêu (cho danh từ không đếm được)",
                        "C. How long: Bao lâu",
                        "D. How often: Tần suất"
                    ],
                    why: "'Programmes' là danh từ đếm được số nhiều (có đuôi -s), nên dùng 'How many' để hỏi số lượng.",
                    error: "'How much' dùng cho tiền bạc hoặc các danh từ như water, sugar..."
                }
            },
            {
                q: "________________does cable TV cost per month?",
                options: ["How many", "How much", "What", "Which"],
                correct: 1,
                explanation: {
                    translation: "Truyền hình cáp tốn bao nhiêu tiền mỗi tháng?",
                    analysis: [
                        "A. How many: Bao nhiêu (đếm được)",
                        "B. How much: Bao nhiêu (giá cả/không đếm được)",
                        "C. What: Cái gì",
                        "D. Which: Cái nào"
                    ],
                    why: "Động từ 'cost' (có giá là) dùng để hỏi về số tiền, cấu trúc chuẩn là 'How much does it cost?'.",
                    error: "Tiền là danh từ không đếm được nên phải dùng much."
                }
            },
            {
                q: "________________do you prefer – The Lion King or Tom and Jerry?",
                options: ["What", "Which", "Who", "Where"],
                correct: 1,
                explanation: {
                    translation: "Bạn thích phim nào hơn – Vua Sư Tử hay Tom và Jerry?",
                    analysis: [
                        "A. What: Cái gì",
                        "B. Which: Cái nào (trong số các lựa chọn có sẵn)",
                        "C. Who: Ai",
                        "D. Where: Ở đâu"
                    ],
                    why: "Khi câu hỏi đưa ra các lựa chọn cụ thể phía sau (A or B), ta dùng 'Which' để hỏi sự ưu tiên.",
                    error: "'What' mang tính chất quá rộng, không nhấn mạnh vào sự lựa chọn đối tượng có sẵn."
                }
            },
            {
                q: "________________does this programme finish?",
                options: ["Who", "What time", "Where", "How many"],
                correct: 1,
                explanation: {
                    translation: "Chương trình này kết thúc lúc mấy giờ?",
                    analysis: [
                        "A. Who: Ai",
                        "B. What time: Mấy giờ",
                        "C. Where: Ở đâu",
                        "D. How many: Bao nhiêu"
                    ],
                    why: "Hỏi về thời điểm kết thúc của một lịch trình, ta dùng 'What time' (hoặc When).",
                    error: "Các phương án khác hoàn toàn sai về mặt ngữ nghĩa."
                }
            },
            {
                q: "________________is the best actor in your country?",
                options: ["What", "Where", "Who", "When"],
                correct: 2,
                explanation: {
                    translation: "Ai là diễn viên xuất sắc nhất ở đất nước bạn?",
                    analysis: [
                        "A. What: Cái gì",
                        "B. Where: Ở đâu",
                        "C. Who: Ai",
                        "D. When: Khi nào"
                    ],
                    why: "'Actor' (diễn viên) là người, từ để hỏi tương ứng duy nhất là 'Who'.",
                    error: "Không dùng What để hỏi về danh tính một con người cụ thể."
                }
            },
            {
                q: "________________was the weather like last Sunday?",
                options: ["How", "What", "Which", "Where"],
                correct: 1,
                explanation: {
                    translation: "Thời tiết Chủ nhật tuần trước như thế nào?",
                    analysis: [
                        "A. How: Như thế nào (không đi với like)",
                        "B. What: Cái gì/Như thế nào (khi đi với like)",
                        "C. Which: Cái nào",
                        "D. Where: Ở đâu"
                    ],
                    why: "Cấu trúc hỏi tính chất: 'What + be + S + like?'. Nếu dùng 'How' thì không được có 'like' ở cuối.",
                    error: "Lỗi phổ biến là dùng 'How was it like?' -> Sai."
                }
            },
            {
                q: "________________don’t you like this comedy?",
                options: ["Why", "What", "Where", "Who"],
                correct: 0,
                explanation: {
                    translation: "Tại sao bạn không thích phim hài này?",
                    analysis: [
                        "A. Why: Tại sao",
                        "B. What: Cái gì",
                        "C. Where: Ở đâu",
                        "D. Who: Ai"
                    ],
                    why: "Cần một lý do để giải thích cho cảm xúc 'không thích', dùng 'Why'.",
                    error: "Đây là câu hỏi mở đầu cho một lời giải thích lý do."
                }
            }
        ];

        let currentQ = 0;
        let score = 0;
        let answered = false;

        const qNumberSpan = document.getElementById('qNumber');
        const questionText = document.getElementById('questionText');
        const optionsList = document.getElementById('optionsList');
        const nextBtn = document.getElementById('nextBtn');
        const explanationArea = document.getElementById('explanationArea');
        const explanationContent = document.getElementById('explanationContent');
        const progressFill = document.getElementById('progressFill');
        const resultModal = document.getElementById('resultModal');
        const scoreText = document.getElementById('scoreText');
        const feedbackText = document.getElementById('feedbackText');
        const audioCorrect = document.getElementById('audioCorrect');
        const audioIncorrect = document.getElementById('audioIncorrect');

        const feedbacks = [
            "Tuyệt vời! Bạn là một ngôi sao sáng! ⭐",
            "Làm tốt lắm! Kiến thức của bạn rất chắc chắn. 🚀",
            "Ms. Chí Nên rất tự hào về nỗ lực của bạn! 💖",
            "Tiếp tục phát huy nhé, bạn đang đi đúng hướng rồi! 🌈"
        ];

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            const data = quizData[currentQ];
            qNumberSpan.innerText = currentQ + 1;
            questionText.innerText = data.q;
            optionsList.innerHTML = '';
            explanationArea.style.display = 'none';
            nextBtn.classList.add('hidden');
            
            // Cập nhật Progress
            const progress = ((currentQ) / quizData.length) * 100;
            progressFill.style.width = `${progress}%`;

            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="letter-tag">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsList.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;
            
            const data = quizData[currentQ];
            const allButtons = optionsList.querySelectorAll('.option-btn');
            
            // Khóa các nút
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === data.correct) {
                // ĐÚNG
                score++;
                btnElement.classList.add('correct');
                audioCorrect.play();
                triggerConfetti();
            } else {
                // SAI
                btnElement.classList.add('incorrect');
                document.getElementById('quizCard').classList.add('shake');
                setTimeout(() => document.getElementById('quizCard').classList.remove('shake'), 500);
                
                // Hiện đáp án đúng
                allButtons[data.correct].classList.add('correct');
                audioIncorrect.play();
            }

            showExplanation(data.explanation);
            nextBtn.classList.remove('hidden');
            
            if (currentQ === quizData.length - 1) {
                nextBtn.innerText = "XEM KẾT QUẢ TỔNG KẾT 🏁";
            }
        }

        function showExplanation(exp) {
            explanationArea.style.display = 'block';
            explanationContent.innerHTML = `
                <p><strong>1. Phân tích 4 đáp án:</strong></p>
                <ul class="list-disc ml-5 mb-2">
                    ${exp.analysis.map(item => `<li>${item}</li>`).join('')}
                </ul>
                <p><strong>2. Dịch toàn câu:</strong> <em>"${exp.translation}"</em></p>
                <p><strong>3. Tại sao chọn?</strong> ${exp.why}</p>
                <p class="text-red-500"><strong>⚠️ Lưu ý:</strong> ${exp.error}</p>
            `;
            // Scroll xuống chỗ giải thích nếu trên mobile
            explanationArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#FFD700']
            });
        }

        nextBtn.onclick = () => {
            if (currentQ < quizData.length - 1) {
                currentQ++;
                renderQuestion();
            } else {
                showFinalResult();
            }
        };

        function showFinalResult() {
            progressFill.style.width = `100%`;
            scoreText.innerText = `Điểm của bạn: ${score} / ${quizData.length}`;
            const randomFeedback = feedbacks[Math.floor(Math.random() * feedbacks.length)];
            feedbackText.innerText = `"${randomFeedback}"`;
            resultModal.style.display = 'flex';
            triggerConfetti();
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
