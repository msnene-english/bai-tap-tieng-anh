<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quiz Gamification - Part 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS VARIABLES & RESET */
        :root {
            --bg-color-1: #4facfe;
            --bg-color-2: #00f2fe;
            --bg-color-3: #a18cd1;
            --bg-color-4: #fbc2eb;
            --correct-color: #00D26A;
            --correct-shadow: #00A352;
            --wrong-color: #FF4757;
            --wrong-shadow: #D63031;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        /* ANIMATED GRADIENT BACKGROUND - NEW COLORS */
        body {
            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3), var(--bg-color-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* FLOATING PATTERNS */
        .pattern-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            /* SVG Pattern: Clouds and small birds/stars */
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 40 Q40 20 50 40 Q65 35 60 55 L20 55 Q10 45 30 40 Z' fill='rgba(255,255,255,0.2)' /%3E%3Cpolygon points='80,80 85,90 95,90 87,95 90,105 80,98 70,105 73,95 65,90 75,90' fill='rgba(255,255,255,0.15)' /%3E%3C/svg%3E");
            background-size: 200px 200px;
            animation: floatPattern 50s linear infinite;
        }

        @keyframes floatPattern {
            0% { background-position: 0px 0px; }
            100% { background-position: -400px -400px; }
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 35px 20px 20px;
            position: relative;
            z-index: 10;
        }
        .teacher-name {
            font-size: 1.2rem;
            color: #fff;
            background: rgba(0,0,0,0.25);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 25px;
            margin-bottom: 15px;
            backdrop-filter: blur(8px);
            font-weight: 700;
        }
        h1 {
            color: white;
            font-size: 2.8rem;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.15);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* CONTAINER */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 50px;
            position: relative;
            z-index: 10;
        }

        /* QUESTION CARD */
        .question-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-bottom: 8px solid rgba(0,0,0,0.06);
            transition: transform 0.3s;
        }
        .question-card:hover {
            transform: translateY(-6px);
        }

        .question-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #0984e3;
            margin-bottom: 15px;
            border-bottom: 3px dotted #dfe6e9;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .instruction {
            font-size: 1.05rem;
            font-style: italic;
            color: #636e72;
            margin-bottom: 18px;
            background: #f1f2f6;
            padding: 10px 15px;
            border-radius: 10px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* OPTIONS GRID */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        @media(max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: #fff;
            border: 3px solid #dfe6e9;
            border-radius: 18px;
            padding: 16px 20px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            box-shadow: 0 6px 0 #b2bec3;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.03) translateY(-4px);
            box-shadow: 0 10px 0 #b2bec3;
            border-color: #74b9ff;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b2bec3;
        }

        .option-btn.correct {
            background: var(--correct-color);
            color: white;
            border-color: var(--correct-shadow);
            box-shadow: 0 6px 0 var(--correct-shadow);
        }

        .option-btn.wrong {
            background: var(--wrong-color);
            color: white;
            border-color: var(--wrong-shadow);
            box-shadow: 0 6px 0 var(--wrong-shadow);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* EXPLANATION BOX */
        .explanation-box {
            display: none;
            margin-top: 25px;
            background: #f8fbff;
            border-left: 8px solid #00cec9;
            padding: 22px;
            border-radius: 12px;
            animation: slideDown 0.4s ease forwards;
            font-size: 1.1rem;
            line-height: 1.7;
            color: #2d3436;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-box h4 {
            color: #0984e3;
            margin-bottom: 12px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }
        
        .exp-step { margin-bottom: 12px; }
        .exp-step strong { color: #d63031; }
        .exp-options-list { margin-left: 20px; margin-bottom: 12px;}
        .exp-options-list li { margin-bottom: 6px; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CSS RECREATION FOR IMAGES (Q29 & Q30) --- */
        /* Q29 Note Card */
        .css-q29-note {
            background-color: #fcf4e8;
            border: 2px solid #e3cbb4;
            color: #7b4c2b;
            padding: 25px 30px;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 480px;
            margin: 20px auto;
            box-shadow: 3px 4px 10px rgba(0,0,0,0.1);
        }
        /* Pins in corners */
        .css-q29-note::before, .css-q29-note::after {
            content: ''; position: absolute; top: 10px; width: 14px; height: 14px;
            background: #903a22; border-radius: 50%; box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        .css-q29-note::before { left: 10px; }
        .css-q29-note::after { right: 10px; }
        
        /* Folded bottom right corner */
        .css-fold {
            position: absolute; bottom: -2px; right: -2px;
            border-width: 25px 25px 0 0; border-style: solid;
            border-color: #e3cbb4 #fff #fff #e3cbb4;
            box-shadow: -2px 2px 2px rgba(0,0,0,0.1);
        }

        .css-q29-books { font-size: 4rem; flex-shrink: 0; line-height: 1;}
        .css-q29-text { font-size: 1.15rem; font-weight: 700; line-height: 1.4; font-family: 'Comic Sans MS', cursive, sans-serif;}

        /* Q30 Email Window */
        .css-q30-email {
            border: 3px solid #b2bec3;
            border-radius: 8px;
            background: #fff;
            max-width: 500px;
            margin: 20px auto;
            text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .css-q30-header {
            background: #dfe6e9;
            padding: 12px;
            border-bottom: 3px solid #b2bec3;
            border-radius: 5px 5px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .css-q30-dots { display: flex; gap: 6px; }
        .css-q30-dots span {
            width: 14px; height: 14px; border-radius: 50%; background: #636e72;
        }
        .css-q30-actions { font-weight: 800; color: #2d3436; font-size: 1.05rem;}
        .css-q30-actions span { text-decoration: underline; margin-left: 15px; cursor: pointer;}
        .css-q30-meta {
            padding: 15px 15px 5px;
            font-size: 1.2rem;
            font-weight: 800;
            border-bottom: 1px solid #eee;
        }
        .css-q30-body {
            padding: 15px;
            font-size: 1.1rem;
            font-family: 'Times New Roman', Times, serif;
            line-height: 1.5;
            color: #000;
        }

        /* SUBMIT BUTTON & MODAL */
        .submit-container { text-align: center; margin-top: 40px; }
        .submit-btn {
            background: #6c5ce7;
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 18px 50px;
            border: none;
            border-radius: 35px;
            box-shadow: 0 10px 0 #4834d4;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .submit-btn:hover { transform: translateY(-4px); box-shadow: 0 14px 0 #4834d4; background: #7c68ea;}
        .submit-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 #4834d4; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: white; border-radius: 30px; padding: 45px;
            text-align: center; max-width: 450px; width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp {
            from { transform: scale(0.4) translateY(50px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-score { font-size: 3.5rem; font-weight: 900; color: #00cec9; margin: 20px 0; text-shadow: 2px 2px 0 #eee;}
        .modal-message { font-size: 1.4rem; font-weight: 700; color: #636e72; margin-bottom: 30px; }
        .modal-btn {
            background: #fdcb6e; color: #2d3436; border: none; padding: 15px 35px;
            font-size: 1.3rem; font-weight: 900; border-radius: 25px;
            box-shadow: 0 6px 0 #e1b12c; cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #e1b12c; }

        /* CONFETTI */
        .confetti {
            position: fixed; top: -10px; width: 15px; height: 15px; z-index: 50;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(1080deg); }
        }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>

    <div class="pattern-overlay"></div>

    <header>
        <div class="teacher-name">👩‍🏫 Giáo viên tạo: Ms. Chí Nên · ☎️ 0852639652 🚀</div>
        <h1>Thử Thách Tiếng Anh</h1>
    </header>

    <div class="container" id="quiz-container">
        </div>

    <div class="container submit-container">
        <button class="submit-btn" onclick="submitQuiz()">Nộp Bài Xem Điểm</button>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2 style="color: #6c5ce7; font-size: 2.2rem;">KẾT QUẢ CỦA BẠN</h2>
            <div class="modal-score" id="score-text">0/0</div>
            <div class="modal-message" id="score-message">Làm tốt lắm!</div>
            <button class="modal-btn" onclick="closeModal()">Xem Lại Bài 🔍</button>
        </div>
    </div>

<script>
    // --- WEB AUDIO API CHO HIỆU ỨNG ÂM THANH ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Note A5
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.15); // Slide to A6
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.25);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // --- HIỆU ỨNG PHÁO GIẤY ---
    function shootConfetti() {
        const colors = ['#00cec9', '#fdcb6e', '#ff7675', '#a29bfe', '#55efc4'];
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            // Random shape (Square or Circle)
            if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3500);
        }
    }

    // --- DỮ LIỆU ĐỀ BÀI (100% Gốc, thêm giải thích siêu chi tiết) ---
    const quizData = [
        {
            instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word whose underlined part differs from the other three in pronunciation in each of the following questions.",
            id: "Question 1",
            text: "A. re<u>s</u>ort &nbsp;&nbsp; B. <u>s</u>easide &nbsp;&nbsp; C. <u>s</u>afari &nbsp;&nbsp; D. <u>s</u>ightseeing",
            options: [
                { text: "A. resort", isCorrect: true },
                { text: "B. seaside", isCorrect: false },
                { text: "C. safari", isCorrect: false },
                { text: "D. sightseeing", isCorrect: false }
            ],
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu hỏi:</strong> Chọn từ có phần gạch chân phát âm khác với các từ còn lại.</div>
                <div class="exp-step"><strong>2. Phân tích từ vựng:</strong>
                    <ul class="exp-options-list">
                        <li>A. re<strong>s</strong>ort /rɪˈ<strong>z</strong>ɔːt/ (n): khu nghỉ dưỡng.</li>
                        <li>B. <strong>s</strong>easide /ˈ<strong>s</strong>iː.saɪd/ (n): bờ biển.</li>
                        <li>C. <strong>s</strong>afari /<strong>s</strong>əˈfɑː.ri/ (n): chuyến đi săn/khám phá hoang dã.</li>
                        <li>D. <strong>s</strong>ightseeing /ˈ<strong>s</strong>aɪtˌsiː.ɪŋ/ (n): sự tham quan.</li>
                    </ul>
                </div>
                <div class="exp-step"><strong>3. Tại sao chọn A?</strong> Vì chữ "s" trong "resort" được phát âm là âm hữu thanh /z/.</div>
                <div class="exp-step"><strong>4. Tại sao các đáp án khác sai?</strong> Vì chữ "s" ở 3 đáp án B, C, D đều được phát âm là âm vô thanh /s/.</div>
            `
        },
        {
            instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word whose underlined part differs from the other three in pronunciation in each of the following questions.",
            id: "Question 2",
            text: "A. c<u>ou</u>ntry &nbsp;&nbsp; B. en<u>ou</u>gh &nbsp;&nbsp; C. t<u>ou</u>rist &nbsp;&nbsp; D. t<u>ou</u>chdown",
            options: [
                { text: "A. country", isCorrect: false },
                { text: "B. enough", isCorrect: false },
                { text: "C. tourist", isCorrect: true },
                { text: "D. touchdown", isCorrect: false }
            ],
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu hỏi:</strong> Chọn từ có phần gạch chân (âm 'ou') phát âm khác với các từ còn lại.</div>
                <div class="exp-step"><strong>2. Phân tích từ vựng:</strong>
                    <ul class="exp-options-list">
                        <li>A. c<strong>ou</strong>ntry /ˈk<strong>ʌ</strong>n.tri/ (n): quốc gia, nông thôn.</li>
                        <li>B. en<strong>ou</strong>gh /ɪˈn<strong>ʌ</strong>f/ (adv/det/pron): đủ.</li>
                        <li>C. t<strong>ou</strong>rist /ˈt<strong>ʊə</strong>.rɪst/ hoặc /ˈt<strong>ɔː</strong>.rɪst/ (n): du khách.</li>
                        <li>D. t<strong>ou</strong>chdown /ˈt<strong>ʌ</strong>tʃ.daʊn/ (n): sự hạ cánh.</li>
                    </ul>
                </div>
                <div class="exp-step"><strong>3. Tại sao chọn C?</strong> Chữ "ou" trong "tourist" được phát âm là âm /ʊə/ (hoặc /ɔː/ theo Anh-Mỹ).</div>
                <div class="exp-step"><strong>4. Tại sao các đáp án khác sai?</strong> Chữ "ou" trong A, B, D đều được phát âm là âm ngắn /ʌ/ (giống chữ 'á' ngắn trong tiếng Việt).</div>
            `
        },
        {
            instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word that differs from the other three in the position of primary stress in each of the following questions.",
            id: "Question 3",
            text: "A. unique &nbsp;&nbsp; B. famous &nbsp;&nbsp; C. local &nbsp;&nbsp; D. basic",
            options: [
                { text: "A. unique", isCorrect: true },
                { text: "B. famous", isCorrect: false },
                { text: "C. local", isCorrect: false },
                { text: "D. basic", isCorrect: false }
            ],
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu hỏi:</strong> Chọn từ có trọng âm chính rơi vào vị trí khác.</div>
                <div class="exp-step"><strong>2. Phân tích từ vựng:</strong>
                    <ul class="exp-options-list">
                        <li>A. u<strong>'nique</strong> (adj): độc đáo, duy nhất (Trọng âm 2).</li>
                        <li>B. <strong>'fa</strong>mous (adj): nổi tiếng (Trọng âm 1).</li>
                        <li>C. <strong>'lo</strong>cal (adj): thuộc địa phương (Trọng âm 1).</li>
                        <li>D. <strong>'ba</strong>sic (adj): cơ bản (Trọng âm 1).</li>
                    </ul>
                </div>
                <div class="exp-step"><strong>3. Tại sao chọn A?</strong> "unique" kết thúc bằng đuôi "-ique", theo quy tắc thì trọng âm sẽ rơi vào chính âm tiết chứa đuôi đó (âm 2).</div>

    // --- THUẬT TOÁN XÁO TRỘN ĐÁP ÁN (SHUFFLE) ---
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // --- RENDER GIAO DIỆN CÂU HỎI ---
    let state = {
        score: 0,
        answered: new Set()
    };

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        quizData.forEach((q, index) => {
            const shuffledOptions = shuffleArray([...q.options]);

            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="instruction">${q.instruction}</div>
                <div class="question-title"><span style="font-size:1.6rem">🎯</span> ${q.id}</div>
                <div class="question-text">${q.text}</div>
                <div class="options-grid" id="options-${index}">
                    ${shuffledOptions.map((opt, optIdx) => `
                        <button class="option-btn" 
                                onclick="handleSelect(${index}, ${optIdx}, ${opt.isCorrect})"
                                id="btn-${index}-${optIdx}">
                            ${opt.text}
                        </button>
                    `).join('')}
                </div>
                <div class="explanation-box" id="exp-${index}">
                    <h4><span style="font-size:1.6rem">🔍</span> Giải Thích Siêu Chi Tiết:</h4>
                    ${q.explanation}
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- LOGIC XỬ LÝ KHI CLICK ĐÁP ÁN ---
    function handleSelect(qIndex, optIdx, isCorrect) {
        if (state.answered.has(qIndex)) return;
        state.answered.add(qIndex);

        const btn = document.getElementById(`btn-${qIndex}-${optIdx}`);
        const expBox = document.getElementById(`exp-${qIndex}`);
        const allBtns = document.querySelectorAll(`#options-${qIndex} .option-btn`);

        allBtns.forEach(b => b.disabled = true);

        if (isCorrect) {
            btn.classList.add('correct');
            playSound('correct');
            shootConfetti();
            state.score++;
        } else {
            btn.classList.add('wrong');
            playSound('wrong');
            
            // Tìm và bôi xanh đáp án đúng
            const correctOptIdx = quizData[qIndex].options.findIndex(o => o.isCorrect);
            const correctText = quizData[qIndex].options[correctOptIdx].text;
            allBtns.forEach(b => {
                if(b.innerText.includes(correctText)) b.classList.add('correct');
            });
        }

        // Hiện giải thích chi tiết
        expBox.classList.add('show');
    }

    // --- NỘP BÀI VÀ TỔNG KẾT ---
    function submitQuiz() {
        const total = quizData.length;
        const modal = document.getElementById('result-modal');
        const scoreText = document.getElementById('score-text');
        const scoreMsg = document.getElementById('score-message');

        scoreText.innerText = `${state.score} / ${total}`;
        
        let msg = "";
        const percentage = state.score / total;
        if (percentage === 1) msg = "Tuyệt đỉnh! Trí tuệ của bạn thật đáng gờm! 🏆";
        else if (percentage >= 0.7) msg = "Quá xuất sắc! Bạn gần chạm tới sự hoàn hảo rồi! ✨";
        else if (percentage >= 0.5) msg = "Khá lắm! Cố gắng đọc kỹ phần giải thích nhé! 🚀";
        else msg = "Thất bại là mẹ thành công! Hãy học kỹ các phần giải thích siêu chi tiết nha! 💪";

        scoreMsg.innerText = msg;
        modal.style.display = 'flex';
        
        if(percentage >= 0.5) {
            playSound('correct');
            shootConfetti();
            setTimeout(shootConfetti, 400);
        } else {
            playSound('wrong');
        }
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
    }

    // Khởi tạo ngay khi tải trang
    window.onload = renderQuiz;

</script>
