<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quiz - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ================= BẢNG MÀU & BACKGROUND ================= */
        :root {
            --primary: #8854C0;
            --secondary: #FDCB6E;
            --tertiary: #00C9A7;
            --correct: #00D26A;
            --correct-shadow: #00A352;
            --wrong: #FF4757;
            --wrong-shadow: #D63031;
            --btn-bg: #FFFFFF;
            --btn-shadow: #E2E8F0;
            --text-dark: #2D3436;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
            background: linear-gradient(-45deg, #8854C0, #FDCB6E, #00C9A7, #FF9A9E);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Họa tiết lơ lửng */
        .pattern-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 200%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M30 0l2.5 7.5h8l-6.5 5 2.5 8-7-5.5-7 5.5 2.5-8-6.5-5h8zM10 30l2.5 7.5h8l-6.5 5 2.5 8-7-5.5-7 5.5 2.5-8-6.5-5h8zM50 30l2.5 7.5h8l-6.5 5 2.5 8-7-5.5-7 5.5 2.5-8-6.5-5h8z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            animation: floatUp 30s linear infinite;
        }

        @keyframes floatUp {
            from { transform: translateY(0); }
            to { transform: translateY(-50%); }
        }

        /* ================= BỐ CỤC CHUNG ================= */
        .container {
            max-width: 800px;
            margin: 40px auto;
            position: relative;
            z-index: 1;
            padding: 0 20px;
        }

        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: inline-block;
            left: 50%;
            position: relative;
            transform: translateX(-50%);
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary);
            font-weight: 900;
        }

        /* ================= CARD CÂU HỎI ================= */
        .question-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .instruction {
            font-style: italic;
            color: #636e72;
            margin-bottom: 15px;
            font-size: 0.95rem;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: var(--btn-bg);
            border: 3px solid #dfe6e9;
            border-radius: 16px;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            text-align: left;
            box-shadow: 0 6px 0 #dfe6e9;
            transition: all 0.1s ease;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 8px 0 #dfe6e9;
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.98) translateY(6px);
            box-shadow: 0 0px 0 #dfe6e9;
        }

        .option-btn.correct {
            background: var(--correct);
            border-color: var(--correct);
            color: white;
            box-shadow: 0 6px 0 var(--correct-shadow);
        }

        .option-btn.wrong {
            background: var(--wrong);
            border-color: var(--wrong);
            color: white;
            box-shadow: 0 6px 0 var(--wrong-shadow);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        /* ================= GIẢI THÍCH ================= */
        .explanation-box {
            display: none;
            margin-top: 20px;
            background: #f8f9fa;
            border-left: 6px solid var(--tertiary);
            padding: 20px;
            border-radius: 0 16px 16px 0;
            animation: slideDown 0.3s ease forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation-box h4 { margin-top: 0; color: var(--primary); font-size: 1.2rem; }
        .explanation-box p { margin: 8px 0; line-height: 1.6; }
        .explanation-box strong { color: var(--text-dark); }
        .explanation-box .step { margin-bottom: 12px; }
        .explanation-box .highlight-step { background: #ffeaa7; padding: 2px 6px; border-radius: 4px; }

        /* ================= PHẦN HÌNH ẢNH CSS ================= */
        .css-sign-course {
            background-color: #f0fdfa; padding: 20px; border-radius: 10px; text-align: center; 
            border-top: 25px solid #fde047; font-family: 'Nunito', sans-serif; 
            max-width: 350px; margin: 20px auto; box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            position: relative;
        }
        .css-sign-course::before {
            content: "•••"; position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            color: #b4860b; font-size: 16px; letter-spacing: 2px; font-weight: bold;
        }
        
        .css-sign-fire {
            border: 6px solid #dc2626; border-radius: 12px; max-width: 280px; margin: 20px auto; 
            overflow: hidden; font-family: 'Arial', sans-serif; text-align: center; 
            background: white; box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .css-sign-fire .top { background: #dc2626; color: white; font-weight: 900; font-size: 26px; padding: 12px; letter-spacing: 1px;}
        .css-sign-fire .mid { color: #dc2626; font-weight: 900; font-size: 32px; padding: 12px; }
        .css-sign-fire .bot { color: #dc2626; padding-bottom: 15px; font-size: 36px; font-weight: 900;}

        /* ================= NÚT NỘP BÀI & KẾT QUẢ ================= */
        .submit-btn {
            display: block; width: 100%; max-width: 300px; margin: 40px auto;
            background: var(--tertiary); color: white; border: none;
            padding: 18px 24px; font-size: 1.5rem; font-weight: 900; font-family: 'Nunito', sans-serif;
            border-radius: 20px; cursor: pointer;
            box-shadow: 0 8px 0 #00A388; transition: all 0.1s ease;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #00A388; }
        .submit-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #00A388; }

        .result-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .result-box {
            background: white; padding: 40px; border-radius: 24px; text-align: center;
            max-width: 400px; width: 90%; animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-box h2 { color: var(--primary); font-size: 2.5rem; margin-top: 0; }
        .result-box p { font-size: 1.2rem; font-weight: bold; }
        
        /* Confetti Container */
        #confetti-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 99; overflow: hidden;
        }

        /* Responsive */
        @media(max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>
    <div class="pattern-overlay"></div>
    <div id="confetti-container"></div>

    <div class="container">
        <div class="header">
            <h1>Giáo viên tạo: Ms. Chí Nên · ☎️ 0852639652</h1>
        </div>
        
        <div id="quiz-container">
            </div>

        <button class="submit-btn" onclick="showResults()">NỘP BÀI 🚀</button>
    </div>

    <div class="result-overlay" id="result-overlay">
        <div class="result-box">
            <h2>Hoàn thành! 🎉</h2>
            <p>Số câu đúng: <span id="score" style="color: var(--correct); font-size: 2rem;">0</span> / <span id="total">0</span></p>
            <p id="praise-text" style="color: var(--wrong);"></p>
            <button class="submit-btn" style="margin-top:20px; max-width: 200px; font-size: 1.2rem;" onclick="location.reload()">Làm Lại 🔄</button>
        </div>
    </div>

    <script>
        // ================= DỮ LIỆU ĐỀ BÀI & GIẢI THÍCH SIÊU CHI TIẾT =================
        const quizData = [
            {
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word whose underlined part differs from the other three in pronunciation in each of the following questions.",
                question: "Question 1: A. rea<u>s</u>on | B. con<u>s</u>ist | C. e<u>s</u>tablish | D. que<u>s</u>tion",
                options: [
                    { text: "A. reason", isCorrect: true },
                    { text: "B. consist", isCorrect: false },
                    { text: "C. establish", isCorrect: false },
                    { text: "D. question", isCorrect: false }
                ],
                explanation: `
                    <div class="step"><strong>1. Dịch yêu cầu:</strong> Tìm từ có phần gạch chân phát âm khác với 3 từ còn lại.</div>
                    <div class="step"><strong>2. Phân tích & Dịch nghĩa 4 đáp án:</strong><br>
                    - A. rea<u>s</u>on (n): Lý do. Chữ 's' phát âm là <strong>/z/</strong>.<br>
                    - B. con<u>s</u>ist (v): Bao gồm. Chữ 's' phát âm là <strong>/s/</strong>.<br>
                    - C. e<u>s</u>tablish (v): Thành lập. Chữ 's' phát âm là <strong>/s/</strong>.<br>
                    - D. que<u>s</u>tion (n): Câu hỏi. Chữ 's' kết hợp 'tion' tạo thành âm /tʃ/, nhưng bản thân âm gốc vẫn chứa <strong>/s/</strong>. (Hoặc hiểu đơn giản, chỉ có reason là âm hữu thanh /z/).
                    </div>
                    <div class="step"><span class="highlight-step">3. Tại sao chọn A?</span> Vì chữ "s" trong "reason" được phát âm là âm rung /z/, khác biệt hoàn toàn với các từ còn lại phát âm là âm vô thanh /s/.</div>
                    <div class="step"><strong>4. Tại sao các đáp án khác sai?</strong> Vì B, C, D đều có chung một cách phát âm chữ 's' là /s/ không rung.</div>
                `
            },
            {
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word whose underlined part differs from the other three in pronunciation in each of the following questions.",
                question: "Question 2: A. voc<u>a</u>bulary | B. st<u>a</u>ndard | C. l<u>a</u>nguage | D. gramm<u>a</u>tical",
                options: [
                    { text: "A. vocabulary", isCorrect: true },
                    { text: "B. standard", isCorrect: false },
                    { text: "C. language", isCorrect: false },
                    { text: "D. grammatical", isCorrect: false }
                ],
                explanation: `
                    <div class="step"><strong>1. Dịch yêu cầu:</strong> Tìm từ có phần gạch chân phát âm khác với 3 từ còn lại.</div>
                    <div class="step"><strong>2. Phân tích & Dịch nghĩa 4 đáp án:</strong><br>
                    - A. voc<u>a</u>bulary (n): Từ vựng. Chữ 'a' đầu tiên phát âm là <strong>/ə/</strong> (âm ơ ngắn).<br>
                    - B. st<u>a</u>ndard (adj): Tiêu chuẩn. Chữ 'a' phát âm là <strong>/æ/</strong> (âm a bẹt).<br>
                    - C. l<u>a</u>nguage (n): Ngôn ngữ. Chữ 'a' đầu phát âm là <strong>/æ/</strong>.<br>
                    - D. gramm<u>a</u>tical (adj): Thuộc về ngữ pháp. Chữ 'a' phát âm là <strong>/æ/</strong>.
                    </div>
                    <div class="step"><span class="highlight-step">3. Tại sao chọn A?</span> Vì âm 'a' trong "vocabulary" là âm không nhấn trọng âm, bị nhược hóa thành /ə/, trong khi các từ còn lại đều là âm /æ/.</div>
                    <div class="step"><strong>4. Tại sao các đáp án khác sai?</strong> Vì B, C, D đều có chung cách phát âm /æ/.</div>
                `
            },
            {
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word that differs from the other three in the position of primary stress in each of the following questions.",
                question: "Question 3: A. collection | B. energy | C. finally | D. equity",
                options: [
                    { text: "A. collection", isCorrect: true },
                    { text: "B. energy", isCorrect: false },
                    { text: "C. finally", isCorrect: false },
                    { text: "D. equity", isCorrect: false }
                ],
                explanation: `
                    <div class="step"><strong>1. Dịch yêu cầu:</strong> Tìm từ có vị trí trọng âm chính khác với 3 từ còn lại.</div>
                    <div class="step"><strong>2. Phân tích 4 đáp án:</strong><br>
                    - A. col'lection (n - Bộ sưu tập): Trọng âm rơi vào âm tiết thứ 2 (quy tắc đuôi -ion trọng âm rơi vào âm liền trước nó).<br>
                    - B. 'energy (n - Năng lượng): Trọng âm rơi vào âm tiết thứ 1.<br>
                    - C. 'finally (adv - Cuối cùng): Trọng âm rơi vào âm tiết thứ 1.<br>
                    - D. 'equity (n - Sự công bằng): Trọng âm rơi vào âm tiết thứ 1.
                    </div>
                    <div class="step"><span class="highlight-step">3. Tại sao chọn A?</span> Vì "collection" có trọng âm số 2, khác biệt với phần còn lại.</div>
                    <div class="step"><strong>4. Tại sao các đáp án khác sai?</strong> Vì B, C, D đều có trọng âm rơi vào âm tiết đầu tiên.</div>
                `
            },
            {
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word that differs from the other three in the position of primary stress in each of the following questions.",
                question: "Question 4: A. bilingual | B. concentric | C. connection | D. entity",
                options: [
                    { text: "A. bilingual", isCorrect: false },
                    { text: "B. concentric", isCorrect: false },
                    { text: "C. connection", isCorrect: false },
                    { text: "D. entity", isCorrect: true }
                ],
                explanation: `
                    <div class="step"><strong>1. Dịch yêu cầu:</strong> Tìm từ có vị trí trọng âm chính khác biệt.</div>
                    <div class="step"><strong>2. Phân tích 4 đáp án:</strong><br>
                    - A. bi'lingual (adj - Song ngữ): Trọng âm âm tiết 2.<br>
                    - B. con'centric (adj - Đồng tâm): Trọng âm âm tiết 2 (đuôi -ic trọng âm liền trước).<br>
                    - C. con'nection (n - Sự kết nối): Trọng âm âm tiết 2 (đuôi -ion trọng âm liền trước).<br>
                    - D. 'entity (n - Thực thể): Trọng âm âm tiết 1 (đuôi -y thường trọng âm dịch lên âm thứ 3 từ dưới lên).
                    </div>
                    <div class="step"><span class="highlight-step">3. Tại sao chọn D?</span> Vì "entity" có trọng âm rơi vào âm tiết thứ nhất, các từ còn lại rơi vào âm thứ 2.</div>
                    <div class="step"><strong>4. Tại sao các đáp án khác sai?</strong> Các đáp án A, B, C đều tuân theo quy tắc nhấn âm số 2.</div>
                `
            },
            {
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the correct answer to each of the following questions.",
                question: "Question 5: I’m sure you will be amazed by ______ of the Atacama Desert.",
                options: [
                    { text: "A. landscape", isCorrect: true },
                    { text: "B. land", isCorrect: false },
                    { text: "C. backdrop", isCorrect: false },
                    { text: "D. territory", isCorrect: false }
                ],
                explanation: `
                    <div class="step"><strong>1. Dịch câu hỏi:</strong> "Tôi chắc chắn bạn sẽ bị kinh ngạc bởi ______ của sa mạc Atacama."</div>
                    <div class="step"><strong>2. Phân tích & Dịch nghĩa 4 đáp án:</strong><br>
                    - A. landscape (n): phong cảnh, cảnh quan (tự nhiên).<br>
                    - B. land (n): đất đai, phần đất.<br>
                    - C. backdrop (n): phông nền (sân khấu, hoặc sự kiện).<br>
                    - D. territory (n): lãnh thổ.
                    </div>
                    <div class="step"><span class="highlight-step">3. Tại sao chọn A?</span> Vì khi nói về vẻ đẹp của một địa danh tự nhiên như sa mạc, ta dùng từ "landscape" (cảnh quan tự nhiên) là phù hợp nhất về ngữ cảnh.</div>
                    <div class="step"><strong>4. Tại sao các đáp án khác sai?</strong> B (đất đai) không miêu tả vẻ đẹp; C (phông nền) thường dùng nghĩa bóng hoặc nhiếp ảnh; D (lãnh thổ) mang ý nghĩa hành chính, chính trị.</div>
                `
            },
            {
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the correct answer to each of the following questions.",
                question: "Question 6: Can all of you ______ improving our new ideas for the Literature Club?",
                options: [
                    { text: "A. conserve", isCorrect: false },
                    { text: "B. suggest", isCorrect: true },
                    { text: "C. explore", isCorrect: false },
                    { text: "D. discover", isCorrect: false }
                ],
                explanation: `
                    <div class="step"><strong>1. Dịch câu hỏi:</strong> "Tất cả các bạn có thể ______ việc cải thiện các ý tưởng mới cho Câu lạc bộ Văn học không?"</div>
                    <div class="step"><strong>2. Phân tích & Dịch nghĩa 4 đáp án:</strong><br>
                    - A. conserve (v): bảo tồn.<br>
                    - B. suggest (v): đề xuất, gợi ý.<br>
                    - C. explore (v): khám phá.<br>
                    - D. discover (v): phát hiện ra.
                    </div>
                    <div class="step"><span class="highlight-step">3. Tại sao chọn B?</span> Về ngữ pháp, ta có cấu trúc <strong>suggest + V-ing</strong> (đề xuất làm việc gì đó). Theo sau chỗ trống là V-ing "improving", đồng thời khớp về ý nghĩa "đề xuất việc cải thiện".</div>
                    <div class="step"><strong>4. Tại sao các đáp án khác sai?</strong> Các động từ conserve, explore, discover theo sau trực tiếp thường là danh từ (Something) hoặc To-V, không đi với V-ing trong ngữ cảnh này. Ngoài ra, nghĩa cũng không hợp lý.</div>
                `
            },
            {
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the correct answer to each of the following questions.",
                question: "Question 7: The new government has made a positive ______ to the overall success of the environmental project.",
                options: [
                    { text: "A. contributing", isCorrect: false },
                    { text: "B. contribution", isCorrect: true },
                    { text: "C. contributor", isCorrect: false },
                    { text: "D. contribute", isCorrect: false }

                    <div class="step"><span class="highlight-step">3. Tại sao chọn B?</span> Mặc dù có dấu hiệu "now" (bây giờ), nhưng vì "have" (sở hữu) không dùng V-ing, ta phải dùng thì Hiện tại đơn: <strong>"Do you have..."</strong>. Cụm collocation chuẩn: "have something with somebody" (mang theo cái gì bên người).</div>
                    <div class="step"><strong>4. Tại sao các đáp án khác sai?</strong> A sai vì chia thì Hiện tại tiếp diễn (Are you having). C thiếu trợ động từ (Do) cho câu hỏi. D sai sắc thái nghĩa (Bạn có thể mang hộ chiếu không?).</div>
                `
            },
            {
                instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the sentence that is made from the given cues in each of the following questions.",
                question: "Question 28: hilltop/ get/ good/ view/ our village/.",
                options: [
                    { text: "A. The hilltop can make our village views better.", isCorrect: false },
                    { text: "B. On the hilltop, our village can be viewed very well.", isCorrect: false },
                    { text: "C. From the hilltop, we can get a better view of our village.", isCorrect: true },
                    { text: "D. From the hilltop, our village can get a better view.", isCorrect: false }
                ],
                explanation: `
                    <div class="step"><strong>1. Dịch câu hỏi:</strong> Tạo câu từ gợi ý: đỉnh đồi/ có được/ tầm nhìn/ tốt/ ngôi làng của chúng ta.</div>
                    <div class="step"><strong>2. Phân tích 4 đáp án:</strong><br>
                    A. Đỉnh đồi có thể làm cho cảnh làng đẹp hơn. (Sai logic).<br>
                    B. Trên đỉnh đồi, làng có thể được nhìn rất rõ. (Ngữ pháp gượng gạo).<br>
                    C. Từ đỉnh đồi, chúng ta có thể có được tầm nhìn tốt hơn về ngôi làng của mình.<br>
                    D. Từ đỉnh đồi, ngôi làng có thể có tầm nhìn tốt. (Sai logic: Ngôi làng không có mắt để nhìn).
                    </div>
                    <div class="step"><span class="highlight-step">3. Tại sao chọn C?</span> Sử dụng đúng cụm từ <strong>"get a good/better view of something"</strong> (có tầm nhìn tốt/bao quát về cái gì). Chủ ngữ "we" được thêm vào vô cùng hợp lý, tạo thành một câu hoàn hảo về ngữ pháp lẫn ngữ nghĩa.</div>
                `
            },
            {
                instruction: "Read the following sign or notice and mark the letter A, B, C or D on your answer sheet to indicate the correct answer to each of the following questions.",
                question: `Question 29: Look at the sign.<br>
                <div class="css-sign-course">
                    <h3 style="margin-top:0; color: #374151;">IT Course</h3>
                    <p style="font-size: 14px; color: #4b5563; line-height: 1.5; font-weight: bold;">IT course starts 1st Nov at IT center for beginners. Covers hardware, software, networking, and security. Experienced instructors. Get certificate. Register by 25th Oct on website or at IT center.</p>
                </div>`,
                options: [
                    { text: "A. The IT course starts on 1st October.", isCorrect: false },
                    { text: "B. The IT course covers hardware, software, networking and security.", isCorrect: true },
                    { text: "C. The IT course is for advanced learners.", isCorrect: false },
                    { text: "D. The IT course does not provide a certificate.", isCorrect: false }
                ],
                explanation: `
                    <div class="step"><strong>1. Dịch nội dung biển báo:</strong> "Khóa học IT bắt đầu ngày 1 tháng 11 tại trung tâm IT dành cho người mới bắt đầu. Bao gồm phần cứng, phần mềm, mạng lưới và bảo mật. Giảng viên kinh nghiệm. Nhận chứng chỉ. Đăng ký trước 25 tháng 10 trên web hoặc tại trung tâm."</div>
                    <div class="step"><strong>2. Phân tích 4 đáp án:</strong><br>
                    A. Khóa học bắt đầu 1 tháng 10. -> SAI (Trong bài là 1st Nov - 1 tháng 11).<br>
                    B. Khóa học bao gồm phần cứng, phần mềm, mạng và bảo mật. -> ĐÚNG (Y hệt câu "Covers hardware, software...").<br>
                    C. Dành cho học viên nâng cao (advanced). -> SAI (Trong bài ghi rõ "for beginners" - người mới).<br>
                    D. Không cung cấp chứng chỉ. -> SAI (Trong bài ghi "Get certificate" - Có nhận chứng chỉ).
                    </div>
                    <div class="step"><span class="highlight-step">3. Chốt đáp án B</span> vì khớp thông tin 100% với biển báo.</div>
                `
            },
            {
                instruction: "Read the following sign or notice and mark the letter A, B, C or D on your answer sheet to indicate the correct answer to each of the following questions.",
                question: `Question 30: Look at the signs. Choose the best answer for the question.<br>
                <div class="css-sign-fire">
                    <div class="top">NO PARKING</div>
                    <div class="mid">FIRE LANE</div>
                    <div class="bot">&#8592; &nbsp; &nbsp; &#8594;</div>
                </div>`,
                options: [
                    { text: "A. You can’t park your car here because this area is for fire trucks.", isCorrect: true },
                    { text: "B. If there is a fire, park your vehicle in this area.", isCorrect: false },
                    { text: "C. This area prevents your cars from catching fire.", isCorrect: false },
                    { text: "D. You can’t park your car here when it is on fire.", isCorrect: false }
                ],
                explanation: `
                    <div class="step"><strong>1. Dịch nội dung biển báo:</strong><br>
                    - NO PARKING: Cấm đỗ xe.<br>
                    - FIRE LANE: Làn đường dành riêng cho xe cứu hỏa.</div>
                    <div class="step"><strong>2. Phân tích 4 đáp án:</strong><br>
                    A. Bạn không thể đỗ xe ở đây vì khu vực này dành cho xe cứu hỏa. (Hoàn toàn chính xác).<br>
                    B. Nếu có cháy, đỗ xe của bạn ở khu vực này. (Sai bét, cháy mà đỗ xe cản đường cứu hỏa thì bị phạt nặng!).<br>
                    C. Khu vực này giúp xe bạn không bị bắt lửa. (Suy diễn hài hước, sai).<br>
                    D. Bạn không thể đỗ xe ở đây khi xe ĐANG BỊ CHÁY. (Dịch sai hoàn toàn ý nghĩa biển báo giao thông).
                    </div>
                    <div class="step"><span class="highlight-step">3. Chọn A.</span> Đây là biển báo giao thông cơ bản, cấm các phương tiện dân sự đỗ tại làn đường ưu tiên cho cứu hỏa.</div>
                `
            }
        ];

        // ================= BIẾN TOÀN CỤC =================
        let score = 0;
        let answeredQuestions = new Set();
        
        // ================= ÂM THANH (WEB AUDIO API) =================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // Tiếng "Ding" (Correct)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Note G5
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Tiếng "Buzz" (Wrong - Téo tèo tèo)
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.4);
            }
        }

        // ================= HIỆU ỨNG PHÁO GIẤY (CONFETTI) =================
        function fireConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#00D26A', '#FF4757', '#FDCB6E', '#8854C0', '#00C9A7'];
            
            for (let i = 0; i < 40; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = Math.random() * 10 + 5 + 'px';
                conf.style.height = Math.random() * 20 + 10 + 'px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-20px';
                conf.style.opacity = Math.random() + 0.5;
                conf.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                // Animation
                const duration = Math.random() * 2 + 2;
                conf.animate([
                    { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*100 - 50}px, 100vh, 0) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], { duration: duration * 1000, easing: 'cubic-bezier(.37,0,.63,1)' });
                
                container.appendChild(conf);
                setTimeout(() => conf.remove(), duration * 1000);
            }
        }

        // ================= XỬ LÝ DỮ LIỆU & RENDER =================
        // Thuật toán xáo trộn mảng (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            quizData.forEach((q, qIndex) => {
                // Xáo trộn đáp án
                shuffleArray(q.options);

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${qIndex}`;
                
                let html = `
                    <div class="instruction">${q.instruction}</div>
                    <div class="question-title">${q.question}</div>
                    <div class="options-grid" id="options-${qIndex}">
                `;

                q.options.forEach((opt, optIndex) => {
                    html += `<button class="option-btn" onclick="checkAnswer(${qIndex}, ${optIndex}, ${opt.isCorrect}, this)">${opt.text}</button>`;
                });

                html += `
                    </div>
                    <div class="explanation-box" id="exp-${qIndex}">
                        <h4>Giáo viên giải thích chi tiết 👩‍🏫</h4>
                        ${q.explanation}
                    </div>
                `;
                
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // ================= LOGIC CHẤM ĐIỂM =================
        window.checkAnswer = function(qIndex, optIndex, isCorrect, btnElement) {
            if (answeredQuestions.has(qIndex)) return; // Đã trả lời rồi thì bỏ qua
            
            answeredQuestions.add(qIndex);
            
            const card = document.getElementById(`card-${qIndex}`);
            const buttons = document.getElementById(`options-${qIndex}`).getElementsByTagName('button');
            const expBox = document.getElementById(`exp-${qIndex}`);

            // Vô hiệu hóa tất cả các nút
            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (isCorrect) {
                btnElement.classList.add('correct');
                playSound('correct');
                fireConfetti();
                score++;
            } else {
                btnElement.classList.add('wrong');
                btnElement.classList.add('shake-animation');
                playSound('wrong');
                
                // Hiển thị đáp án đúng để học sinh biết
                for (let i = 0; i < buttons.length; i++) {
                    // Dựa vào text vì ta đã shuffle. Tốt nhất là kiểm tra lại mảng gốc.
                    if (quizData[qIndex].options[i].isCorrect) {
                        buttons[i].classList.add('correct');
                    }
                }
            }

            // HIỆN GIẢI THÍCH NGAY LẬP TỨC
            expBox.style.display = 'block';
        };

        // ================= NỘP BÀI =================
        window.showResults = function() {
            const overlay = document.getElementById('result-overlay');
            document.getElementById('score').innerText = score;
            document.getElementById('total').innerText = quizData.length;
            
            const praiseEl = document.getElementById('praise-text');
            const percent = score / quizData.length;
            
            if (percent === 1) {
                praiseEl.innerText = "Xuất sắc! Em là một thiên tài tiếng Anh thực thụ! 🏆";
                praiseEl.style.color = "var(--correct)";
                fireConfetti();
                fireConfetti();
            } else if (percent >= 0.7) {
                praiseEl.innerText = "Giỏi lắm! Em đã nắm rất chắc kiến thức cơ bản rồi đó! 🌟";
                praiseEl.style.color = "var(--correct)";
                fireConfetti();
            } else if (percent >= 0.5) {
                praiseEl.innerText = "Khá tốt! Đọc kỹ phần giải thích của cô để làm tốt hơn nhé! 💪";
                praiseEl.style.color = "var(--secondary)";
            } else {
                praiseEl.innerText = "Đừng buồn nhé! Học tiếng Anh là một hành trình. Hãy đọc thật kỹ giải thích bên dưới và thử lại nào! ❤️";
                praiseEl.style.color = "var(--wrong)";
            }
            
            overlay.style.display = 'flex';
        };

        // Ẩn popup khi click ra ngoài
        document.getElementById('result-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        });

        // Khởi chạy
        window.onload = renderQuiz;
    </script>
</body>
</html>
