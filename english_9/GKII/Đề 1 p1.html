<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quiz Gamification</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* CSS VARIABLES & RESET */
        :root {
            --bg-color-1: #8854C0;
            --bg-color-2: #FDCB6E;
            --bg-color-3: #00C9A7;
            --bg-color-4: #ff9a9e;
            --correct-color: #00D26A;
            --correct-shadow: #00A352;
            --wrong-color: #FF4757;
            --wrong-shadow: #D63031;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        /* ANIMATED GRADIENT BACKGROUND */
        body {
            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3), var(--bg-color-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* FLOATING PATTERNS */
        .pattern-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            /* SVG Pattern: Stars and bubbles */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 25 L25 10 L30 25 L45 30 L30 35 L25 50 L20 35 L5 30 Z' fill='rgba(255,255,255,0.2)' /%3E%3Ccircle cx='70' cy='70' r='10' fill='rgba(255,255,255,0.15)' /%3E%3Ccircle cx='85' cy='20' r='5' fill='rgba(255,255,255,0.2)' /%3E%3C/svg%3E");
            background-size: 150px 150px;
            animation: floatPattern 40s linear infinite;
        }

        @keyframes floatPattern {
            0% { background-position: 0px 0px; }
            100% { background-position: 300px 300px; }
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 30px 20px;
            position: relative;
            z-index: 10;
        }
        .teacher-name {
            font-size: 1.1rem;
            color: #fff;
            background: rgba(0,0,0,0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            backdrop-filter: blur(5px);
        }
        h1 {
            color: white;
            font-size: 2.5rem;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        /* CONTAINER */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 50px;
            position: relative;
            z-index: 10;
        }

        /* QUESTION CARD */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-bottom: 8px solid rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .question-card:hover {
            transform: translateY(-5px);
        }

        .question-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #4834D4;
            margin-bottom: 15px;
            border-bottom: 2px dashed #dcdde1;
            padding-bottom: 10px;
        }
        
        .instruction {
            font-size: 1rem;
            font-style: italic;
            color: #666;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* OPTIONS GRID */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media(max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: #fff;
            border: 3px solid #f1f2f6;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            box-shadow: 0 6px 0 #dcdde1;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 9px 0 #dcdde1;
            border-color: #a4b0be;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #dcdde1;
        }

        .option-btn.correct {
            background: var(--correct-color);
            color: white;
            border-color: var(--correct-shadow);
            box-shadow: 0 6px 0 var(--correct-shadow);
        }

        .option-btn.wrong {
            background: var(--wrong-color);
            color: white;
            border-color: var(--wrong-shadow);
            box-shadow: 0 6px 0 var(--wrong-shadow);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* EXPLANATION BOX */
        .explanation-box {
            display: none;
            margin-top: 25px;
            background: #F8F9FA;
            border-left: 6px solid #FDCB6E;
            padding: 20px;
            border-radius: 10px;
            animation: slideDown 0.4s ease forwards;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-box h4 {
            color: #E15F41;
            margin-bottom: 10px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .exp-step { margin-bottom: 10px; }
        .exp-step strong { color: #2d98da; }
        .exp-options-list { margin-left: 20px; margin-bottom: 10px;}
        .exp-options-list li { margin-bottom: 5px; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SIGNS CSS RECREATION */
        .css-sign-29 {
            border: 3px solid #1e7e34;
            border-radius: 8px;
            padding: 5px;
            width: 250px;
            margin: 20px auto;
            background: #fff;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .css-sign-29-inner {
            border: 2px solid #1e7e34;
            padding: 15px;
            border-radius: 4px;
        }
        .css-sign-29-top {
            background: #1e7e34;
            color: #fff;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 2px;
            position: relative;
        }
        .css-sign-29-top::before, .css-sign-29-top::after {
            content: ''; position: absolute; top: 50%; transform: translateY(-50%);
            width: 6px; height: 6px; background: white; border-radius: 50%;
        }
        .css-sign-29-top::before { left: 5px; }
        .css-sign-29-top::after { right: 5px; }
        
        .css-sign-29-bottom {
            color: #1e7e34;
            font-weight: 900;
            font-size: 1.4rem;
            line-height: 1.2;
        }

        .css-sign-30 {
            background: #c21a1a;
            color: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 400px;
            margin: 20px auto;
            text-align: center;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.2);
            line-height: 1.5;
        }

        /* SUBMIT BUTTON & MODAL */
        .submit-container { text-align: center; margin-top: 40px; }
        .submit-btn {
            background: #FF9F43;
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 15px 50px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 8px 0 #E15F41;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 11px 0 #E15F41; }
        .submit-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #E15F41; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: white; border-radius: 25px; padding: 40px;
            text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-score { font-size: 3rem; font-weight: 900; color: #4834D4; margin: 20px 0; }
        .modal-message { font-size: 1.3rem; font-weight: 700; color: #666; margin-bottom: 25px; }
        .modal-btn {
            background: #00D26A; color: white; border: none; padding: 12px 30px;
            font-size: 1.2rem; font-weight: bold; border-radius: 20px;
            box-shadow: 0 5px 0 #00A352; cursor: pointer;
        }

        /* CONFETTI */
        .confetti {
            position: fixed; top: -10px; width: 15px; height: 15px; z-index: 50;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>

    <div class="pattern-overlay"></div>

    <header>
        <div class="teacher-name">🌟 Giáo viên tạo: Ms. Chí Nên · ☎️ 0852639652 🌟</div>
        <h1>Thử Thách Tiếng Anh</h1>
    </header>

    <div class="container" id="quiz-container">
        </div>

    <div class="container submit-container">
        <button class="submit-btn" onclick="submitQuiz()">Nộp Bài Báo Cáo Thành Tích</button>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2 style="color: #FF9F43; font-size: 2rem;">KẾT QUẢ CỦA BẠN</h2>
            <div class="modal-score" id="score-text">0/0</div>
            <div class="modal-message" id="score-message">Làm tốt lắm!</div>
            <button class="modal-btn" onclick="closeModal()">Xem Lại Bài</button>
        </div>
    </div>

<script>
    // --- WEB AUDIO API CHO HIỆU ỨNG ÂM THANH ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // --- HIỆU ỨNG PHÁO GIẤY ---
    function shootConfetti() {
        const colors = ['#FF4757', '#00D26A', '#FDCB6E', '#4834D4', '#FF9F43'];
        for (let i = 0; i < 40; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
            // Random shape
            if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3000);
        }
    }

    // --- DỮ LIỆU ĐỀ BÀI (100% Gốc, thêm giải thích siêu chi tiết) ---
    const quizData = [
        {
            instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word whose underlined part differs from the other three in pronunciation in each of the following questions.",
            id: "Question 1",
            text: "A. parad<u>i</u>se &nbsp;&nbsp; B. dest<u>i</u>nation &nbsp;&nbsp; C. r<u>i</u>sk &nbsp;&nbsp; D. majest<u>i</u>c",
            options: [
                { text: "A. paradise", isCorrect: true },
                { text: "B. destination", isCorrect: false },
                { text: "C. risk", isCorrect: false },
                { text: "D. majestic", isCorrect: false }
            ],
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu hỏi:</strong> Chọn từ có phần gạch chân phát âm khác với các từ còn lại.</div>
                <div class="exp-step"><strong>2. Phân tích từ vựng:</strong>
                    <ul class="exp-options-list">
                        <li>A. paradise /ˈpær.ə.d<strong>aɪ</strong>s/ (n): thiên đường.</li>
                        <li>B. destination /ˌdes.tɪˈn<strong>eɪ</strong>.ʃən/ (n): điểm đến (Phần gạch chân chữ i trong âm tiết thứ 2 phát âm là /ɪ/). <i>*Lưu ý: Mặc dù đề không gạch chân rõ, quy luật phát âm ở đây là kiểm tra âm 'i'.</i> -> /ˌdes.t<strong>ɪ</strong>ˈneɪ.ʃən/</li>
                        <li>C. risk /r<strong>ɪ</strong>sk/ (n): rủi ro.</li>
                        <li>D. majestic /məˈdʒes.t<strong>ɪ</strong>k/ (adj): tráng lệ.</li>
                    </ul>
                </div>
                <div class="exp-step"><strong>3. Tại sao chọn A?</strong> Vì chữ "i" trong "paradise" được phát âm là nguyên âm đôi /aɪ/.</div>
                <div class="exp-step"><strong>4. Tại sao các đáp án khác sai?</strong> Vì chữ "i" ở 3 đáp án B, C, D đều được phát âm là âm ngắn /ɪ/.</div>
            `
        },
        {
            instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word whose underlined part differs from the other three in pronunciation in each of the following questions.",
            id: "Question 2",
            text: "A. to<u>g</u>ether &nbsp;&nbsp; B. a<u>g</u>ency &nbsp;&nbsp; C. ima<u>g</u>ine &nbsp;&nbsp; D. <u>g</u>eological",
            options: [
                { text: "A. together", isCorrect: true },
                { text: "B. agency", isCorrect: false },
                { text: "C. imagine", isCorrect: false },
                { text: "D. geological", isCorrect: false }
            ],
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu hỏi:</strong> Chọn từ có phần gạch chân (âm 'g') phát âm khác với các từ còn lại.</div>
                <div class="exp-step"><strong>2. Phân tích từ vựng:</strong>
                    <ul class="exp-options-list">
                        <li>A. together /təˈ<strong>g</strong>eð.ər/ (adv): cùng nhau.</li>
                        <li>B. agency /ˈeɪ.<strong>dʒ</strong>ən.si/ (n): đại lý.</li>
                        <li>C. imagine /ɪˈmæ<strong>dʒ</strong>.ɪn/ (v): tưởng tượng.</li>
                        <li>D. geological /ˌ<strong>dʒ</strong>iː.əˈlɒdʒ.ɪ.kəl/ (adj): thuộc về địa chất.</li>
                    </ul>
                </div>
                <div class="exp-step"><strong>3. Tại sao chọn A?</strong> Chữ "g" trong "together" được phát âm là âm /g/ (g cứng).</div>
                <div class="exp-step"><strong>4. Tại sao các đáp án khác sai?</strong> Chữ "g" trong B, C, D đều đứng trước e, i, y nên được phát âm là /dʒ/ (g mềm).</div>
            `
        },
        {
            instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word that differs from the other three in the position of primary stress in each of the following questions.",
            id: "Question 3",
            text: "A. carry &nbsp;&nbsp; B. flora &nbsp;&nbsp; C. possess &nbsp;&nbsp; D. fauna",
            options: [
                { text: "A. carry", isCorrect: false },
                { text: "B. flora", isCorrect: false },
                { text: "C. possess", isCorrect: true },
                { text: "D. fauna", isCorrect: false }
            ],
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu hỏi:</strong> Chọn từ có trọng âm chính rơi vào vị trí khác với 3 từ còn lại.</div>
                <div class="exp-step"><strong>2. Phân tích từ vựng:</strong>
                    <ul class="exp-options-list">
                        <li>A. <strong>'car</strong>ry (v): mang, vác (Trọng âm 1).</li>
                        <li>B. <strong>'flo</strong>ra (n): hệ thực vật (Trọng âm 1).</li>
                        <li>C. pos<strong>'sess</strong> (v): sở hữu (Trọng âm 2).</li>
                        <li>D. <strong>'fau</strong>na (n): hệ động vật (Trọng âm 1).</li>
                    </ul>
                </div>
                <div class="exp-step"><strong>3. Tại sao chọn C?</strong> Động từ "possess" có 2 âm tiết, âm tiết thứ hai chứa nguyên âm ngắn nhưng kết thúc bằng 2 phụ âm (ss) nên trọng âm rơi vào âm 2.</div>
                <div class="exp-step"><strong>4. Tại sao các đáp án khác sai?</strong> Các từ A, B, D đều là từ 2 âm tiết có trọng âm rơi vào âm tiết thứ nhất theo quy tắc chung của danh từ/động từ.</div>
            `
        },
        {
            instruction: "Mark the letter A, B, C or D on your answer sheet to indicate the word that differs from the other three in the position of primary stress in each of the following questions.",
            id: "Question 4",
            text: "A. encourage &nbsp;&nbsp; B. discovery &nbsp;&nbsp; C. diversity &nbsp;&nbsp; D. recognize",
            options: [
                { text: "A. encourage", isCorrect: false },
                { text: "B. discovery", isCorrect: false },
                { text: "C. diversity", isCorrect: false },
                { text: "D. recognize", isCorrect: true }
            ],
            explanation: `
                <div class="exp-step"><strong>1. Dịch câu hỏi:</strong> Chọn từ có trọng âm chính khác với các từ còn lại.</div>
                <div class="exp-step"><strong>2. Phân tích từ vựng:</strong>
                    <ul class="exp-options-list">
                        <li>A. en<strong>'cou</strong>rage (v): khuyến khích (Trọng âm 2).</li>
                        <li>B. dis<strong>'co</strong>very (n): sự khám phá (Trọng âm 2).</li>
                        <li>C. di<strong>'ver</strong>sity (n): sự đa dạng (Trọng âm 2).</li>
                        <li>D. <strong>'re</strong>cognize (v): công nhận, nhận ra (Trọng âm 1).</li>
                    </ul>
                </div>

    // --- THUẬT TOÁN XÁO TRỘN ĐÁP ÁN (SHUFFLE) ---
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // --- RENDER GIAO DIỆN CÂU HỎI ---
    let state = {
        score: 0,
        answered: new Set()
    };

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        quizData.forEach((q, index) => {
            // Shuffle options for this specific render
            const shuffledOptions = shuffleArray([...q.options]);

            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="instruction">${q.instruction}</div>
                <div class="question-title"><span style="font-size:1.5rem">🔥</span> ${q.id}</div>
                <div class="question-text">${q.text}</div>
                <div class="options-grid" id="options-${index}">
                    ${shuffledOptions.map((opt, optIdx) => `
                        <button class="option-btn" 
                                onclick="handleSelect(${index}, ${optIdx}, ${opt.isCorrect})"
                                id="btn-${index}-${optIdx}">
                            ${opt.text}
                        </button>
                    `).join('')}
                </div>
                <div class="explanation-box" id="exp-${index}">
                    <h4><span style="font-size:1.5rem">💡</span> Giải Thích Siêu Chi Tiết:</h4>
                    ${q.explanation}
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- LOGIC XỬ LÝ KHI CLICK ĐÁP ÁN ---
    function handleSelect(qIndex, optIdx, isCorrect) {
        // Prevent re-answering
        if (state.answered.has(qIndex)) return;
        state.answered.add(qIndex);

        const btn = document.getElementById(`btn-${qIndex}-${optIdx}`);
        const expBox = document.getElementById(`exp-${qIndex}`);
        const allBtns = document.querySelectorAll(`#options-${qIndex} .option-btn`);

        // Disable all buttons for this question
        allBtns.forEach(b => b.disabled = true);

        if (isCorrect) {
            btn.classList.add('correct');
            playSound('correct');
            shootConfetti();
            state.score++;
        } else {
            btn.classList.add('wrong');
            playSound('wrong');
            // Tự động bôi xanh đáp án đúng để học sinh biết
            const correctOptIdx = quizData[qIndex].options.findIndex(o => o.isCorrect);
            // Tìm nút đúng trong giao diện (dựa trên text vì đã shuffle)
            const correctText = quizData[qIndex].options[correctOptIdx].text;
            allBtns.forEach(b => {
                if(b.innerText.includes(correctText)) b.classList.add('correct');
            });
        }

        // Hiện giải thích siêu chi tiết ngay lập tức
        expBox.classList.add('show');
    }

    // --- NỘP BÀI VÀ TỔNG KẾT ---
    function submitQuiz() {
        const total = quizData.length;
        const modal = document.getElementById('result-modal');
        const scoreText = document.getElementById('score-text');
        const scoreMsg = document.getElementById('score-message');

        scoreText.innerText = `${state.score} / ${total}`;
        
        let msg = "";
        const percentage = state.score / total;
        if (percentage === 1) msg = "Quá Đỉnh! Bạn là một bậc thầy Tiếng Anh! 🏆";
        else if (percentage >= 0.7) msg = "Rất Giỏi! Chỉ một chút xíu nữa là hoàn hảo! 🌟";
        else if (percentage >= 0.5) msg = "Cố gắng lên nhé! Đọc kỹ phần giải thích nha! 💪";
        else msg = "Đừng nản chí! Học qua giải thích chi tiết sẽ giúp bạn tiến bộ vượt bậc! 🌱";

        scoreMsg.innerText = msg;
        modal.style.display = 'flex';
        
        if(percentage >= 0.5) {
            playSound('correct');
            shootConfetti();
            setTimeout(shootConfetti, 500);
        } else {
            playSound('wrong');
        }
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
    }

    // Khởi tạo
    window.onload = renderQuiz;

</script>
