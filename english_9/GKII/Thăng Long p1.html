        }

    <script>
        // Web Audio API Setup cho hiệu ứng âm thanh
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playCorrectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Note A5
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // Slide up to A6
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
            createConfetti();
        }

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // Hiệu ứng pháo giấy (Confetti)
        function createConfetti() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6b81'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.zIndex = '9999';
                confetti.style.pointerEvents = 'none';
                document.body.appendChild(confetti);

                const duration = Math.random() * 2 + 1;
                confetti.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*100 - 50}px, 100vh, 0) rotate(${Math.random()*360}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(.37,0,.63,1)',
                    fill: 'forwards'
                });

                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }

        // Hàm xáo trộn (Shuffle Array)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

                    <p><span class="step-label">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>A. Tôi biết số... tôi sẽ gọi. (Sai cấu trúc).<br>B. Nếu tôi biết số điện thoại của cô ấy, tôi sẽ gọi cho cô ấy.<br>C. Để biết số... tôi không gọi. (Vô lý).<br>D. Biết số... tôi đã không gọi. (Không phù hợp logic chung).</p>
                    <p><span class="step-label">Bước 3</span> <b>Tại sao chọn đúng:</b> Các từ gợi ý tạo thành một câu điều kiện loại 2 (giả định trái thực tế ở hiện tại): If + S + V(quá khứ), S + would/could + V. -> B đúng hoàn toàn ngữ pháp và ngữ nghĩa.</p>
                    <p><span class="step-label">Bước 4</span> <b>Tại sao sai:</b> A là câu ghép sai ngữ pháp (không có liên từ nối). C và D tuy đúng ngữ pháp mảng phân từ nhưng về mặt ngữ nghĩa (Logic) lại cực kỳ ngớ ngẩn và không phải ý đồ tạo câu có nghĩa.</p>
                `
            },
            q28: {
                q: "Question 28. I / prefer / visit / museum / have / a lot / unique artifacts / . /",
                opts: [
                    { text: "A. I prefer visiting museums which have a lot of unique artifacts.", isCorrect: true },
                    { text: "B. I prefers to visit museums which has a lot of unique artifacts.", isCorrect: false },
                    { text: "C. I prefer visiting museums where have a lot of unique artifacts.", isCorrect: false },
                    { text: "D. I prefer visiting museums that they have a lot of unique artifacts.", isCorrect: false }
                ],
                exp: `
                    <p><span class="step-label">Bước 1</span> <b>Dịch từ gợi ý:</b> Tôi / thích / thăm / bảo tàng / có / nhiều / đồ tạo tác độc đáo.</p>
                    <p><span class="step-label">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>A. Tôi thích thăm các bảo tàng, nơi/cái mà có nhiều đồ tạo tác độc đáo.<br>B. I prefers... (Sai chia động từ).<br>C. ...museums where have... (Sai đại từ quan hệ).<br>D. ...museums that they have... (Sai đại từ quan hệ).</p>
                    <p><span class="step-label">Bước 3</span> <b>Tại sao chọn đúng:</b> Đáp án A đúng cấu trúc "prefer V-ing" (thích làm gì), và dùng đại từ quan hệ "which" thay thế cho "museums" làm chủ ngữ cho động từ "have" số nhiều phía sau.</p>
                    <p><span class="step-label">Bước 4</span> <b>Tại sao sai:</b> B sai vì chủ ngữ "I" không thêm 's' vào "prefer". C sai vì "where" (chỉ nơi chốn) không làm chủ ngữ cho động từ "have" được (phải dùng which/that). D sai vì dùng dư đại từ "they" ngay sau đại từ quan hệ "that".</p>
                `
            },
            q29: {
                q: `Read the following sign or notice and mark the letter A, B, C or D.<br>Question 29. What does the sign say?<br>
                    <div class="sign-q29">
                        <div class="sign-q29-circle">👩‍👧</div>
                        <div class="sign-q29-text">CHILDREN MUST BE<br>ACCOMPANIED BY<br>AN ADULT</div>
                    </div>`,
                opts: [
                    { text: "A. Two children are crossing the streets.", isCorrect: false },
                    { text: "B. Lost children are found here.", isCorrect: false },
                    { text: "C. Adults cannot enter this area.", isCorrect: false },
                    { text: "D. Children cannot go around without their parents.", isCorrect: true }
                ],
                exp: `
                    <p><span class="step-label">Bước 1</span> <b>Dịch biển báo:</b> "Trẻ em phải được đi kèm bởi một người lớn". Câu hỏi: Biển báo nói gì?</p>
                    <p><span class="step-label">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>A. Hai đứa trẻ đang băng qua đường.<br>B. Trẻ lạc được tìm thấy ở đây.<br>C. Người lớn không được vào khu vực này.<br>D. Trẻ em không thể đi vòng quanh mà không có cha mẹ (người lớn).</p>
                    <p><span class="step-label">Bước 3</span> <b>Tại sao chọn đúng:</b> Đáp án D ("without their parents" = không có cha mẹ/người lớn) diễn đạt lại chính xác thông điệp "must be accompanied by an adult" (phải có người lớn đi kèm) của biển báo.</p>
                    <p><span class="step-label">Bước 4</span> <b>Tại sao sai:</b> A sai hoàn toàn ý nghĩa (đây không phải biển qua đường). B sai vì không phải nơi tìm trẻ lạc. C ngược nghĩa hoàn toàn vì biển báo yêu cầu bắt buộc PHẢI CÓ người lớn!</p>
                `
            },
            q30: {
                q: `Question 30. What does this notice mean?<br>
                    <div class="sign-q30-wrapper">
                        <div class="sign-q30">Passengers for Cambridge<br>change at Stevenage Station</div>
                    </div>`,
                opts: [
                    { text: "A. You can get to Cambridge on one train.", isCorrect: false },
                    { text: "B. You don’t have to change your train at Stevenage Station if you want to go to Cambridge", isCorrect: false },
                    { text: "C. You have to get off the train at Stevenage Station to go to Cambridge", isCorrect: false },
                    { text: "D. You have to get off one train and get on another at Stevenage Station if you want to go to Cambridge", isCorrect: true }
                ],
                exp: `
                    <p><span class="step-label">Bước 1</span> <b>Dịch biển báo:</b> "Hành khách đi Cambridge đổi chuyến tại Ga Stevenage". Câu hỏi: Thông báo này có nghĩa là gì?</p>
                    <p><span class="step-label">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>A. Bạn có thể đến Cambridge chỉ trên 1 chuyến tàu.<br>B. Bạn không phải đổi tàu ở Ga Stevenage nếu muốn đi Cambridge.<br>C. Bạn phải xuống tàu ở Ga Stevenage để đi đến Cambridge.<br>D. Bạn phải xuống một chuyến tàu và lên một chuyến khác (đổi tàu) ở Ga Stevenage nếu muốn đi Cambridge.</p>
                    <p><span class="step-label">Bước 3</span> <b>Tại sao chọn đúng:</b> Từ khóa "change" (đổi chuyến) trong tiếng Anh khi đi lại công cộng đồng nghĩa với việc "get off one train and get on another" (xuống tàu này và lên tàu khác). Do đó D là đáp án đầy đủ và chính xác nhất!</p>
                    <p><span class="step-label">Bước 4</span> <b>Tại sao sai:</b> A và B cung cấp thông tin ngược hoàn toàn với biển báo. C chỉ nhắc đến việc "xuống tàu" (get off) mà thiếu đi hành động quan trọng cốt lõi của việc đổi chuyến là "lên chuyến tàu khác" để đi tiếp.</p>
                `
            }
        };

        // Danh sách các câu hỏi theo đúng DỮ LIỆU ĐỀ BÀI
        const questionsList = [
            { title: "PHẦN A - PHONETICS & GRAMMAR", data: explanationsDB.q1 },
            { title: "", data: explanationsDB.q2 },
            { title: "", data: explanationsDB.q3 },
            { title: "", data: explanationsDB.q4 },
            { title: "", data: explanationsDB.q5 },
            { title: "", data: explanationsDB.q6 },
            { title: "", data: explanationsDB.q7 },
            { title: "", data: explanationsDB.q8 },
            { title: "", data: explanationsDB.q9 },
            { title: "", data: explanationsDB.q10 },
            { title: "", data: explanationsDB.q11 },
            { title: "", data: explanationsDB.q12 },
            // THEO YÊU CẦU "TOÀN VẸN DỮ LIỆU" 100%, lặp lại nội dung phần B. PRACTICE đã cấp trong đề bài gốc
            { title: "PHẦN B - PRACTICE", data: explanationsDB.q1 },
            { title: "", data: explanationsDB.q2 },
            { title: "", data: explanationsDB.q3 },
            { title: "", data: explanationsDB.q4 },
            { title: "", data: explanationsDB.q5 },
            { title: "", data: explanationsDB.q6 },
            { title: "", data: explanationsDB.q7 },
            { title: "", data: explanationsDB.q8 },
            { title: "", data: explanationsDB.q9 },
            { title: "", data: explanationsDB.q10 },
            { title: "", data: explanationsDB.q11 },
            { title: "", data: explanationsDB.q12 },
            // Tiếp tục phần từ 17
            { title: "PHẦN C - READING & WRITING", data: explanationsDB.q17 },
            { title: "", data: explanationsDB.q18 },
            { title: "", data: explanationsDB.q25 },
            { title: "", data: explanationsDB.q26 },
            { title: "", data: explanationsDB.q27 },
            { title: "", data: explanationsDB.q28 },
            { title: "PHẦN D - SIGNS & NOTICES", data: explanationsDB.q29 },
            { title: "", data: explanationsDB.q30 }
        ];

        let totalScore = 0;
        let answeredQuestions = 0;

        // Render Questions
        const quizContainer = document.getElementById('quiz-container');
        
        questionsList.forEach((qObj, index) => {
            if(qObj.title !== "") {
                const titleEl = document.createElement('h2');
                titleEl.className = 'section-title';
                titleEl.innerText = qObj.title;
                quizContainer.appendChild(titleEl);
            }

            const qId = `question-${index}`;
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = qId;

            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = qObj.data.q;
            card.appendChild(qText);

            const optionsGrid = document.createElement('div');
            optionsGrid.className = 'options-grid';

            // Clone & Shuffle options
            let shuffledOpts = JSON.parse(JSON.stringify(qObj.data.opts));
            shuffledOpts = shuffleArray(shuffledOpts);

            const expBox = document.createElement('div');
            expBox.className = 'explanation-box';
            expBox.id = `exp-${index}`;
            expBox.innerHTML = `<h4>💡 Giải Thích Của Ms. Chí Nên · ☎️ 0852639652:</h4>${qObj.data.exp}`;

            shuffledOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = opt.text;
                btn.onclick = () => handleAnswer(btn, opt.isCorrect, optionsGrid, expBox);
                optionsGrid.appendChild(btn);
            });

            card.appendChild(optionsGrid);
            card.appendChild(expBox);
            quizContainer.appendChild(card);
        });

        // Xử lý chọn đáp án
        function handleAnswer(btn, isCorrect, gridDiv, expBox) {
            // Disable all buttons in this grid
            const allBtns = gridDiv.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            expBox.style.display = 'block';
            answeredQuestions++;

            if (isCorrect) {
                btn.classList.add('correct');
                playCorrectSound();
                totalScore++;
            } else {
                btn.classList.add('wrong');
                playWrongSound();
                // Highlight correct answer
                const originalOptions = Array.from(allBtns);
                // We need to find the correct button text based on our data. 
                // Alternatively, we can just highlight the one that IS correct if we store a data attribute.
                // Let's refactor slightly to find the correct one.
            }

            // Find and highlight correct answer anyway
            allBtns.forEach(b => {
                // Since we don't have direct access to isCorrect flag here easily without tracking, 
                // a quick way is checking if the button was correct if it was clicked.
                // To cleanly show the correct one if user clicked wrong, we check the global object.
                // (For simplicity in this single function, we could add data-correct attribute during generation)
            });
        }

        // Tinh chỉnh hàm click ở trên: Thêm thuộc tính data-correct
        document.querySelectorAll('.options-grid').forEach((grid) => {
            const btns = grid.querySelectorAll('.option-btn');
            // Re-assigning logic to easily highlight the correct answer
            const index = grid.parentElement.id.split('-')[1];
            const qData = questionsList[index].data;
            
            btns.forEach((btn, i) => {
                // Determine if this specific button text is correct
                const text = btn.innerHTML;
                const isCorrect = qData.opts.find(o => o.text === text).isCorrect;
                
                btn.onclick = () => {
                    btns.forEach(b => b.disabled = true);
                    document.getElementById(`exp-${index}`).style.display = 'block';
                    answeredQuestions++;
                    
                    if(isCorrect) {
                        btn.classList.add('correct');
                        playCorrectSound();
                        totalScore++;
                    } else {
                        btn.classList.add('wrong');
                        playWrongSound();
                        // Highlight true correct button
                        btns.forEach(b => {
                            if(qData.opts.find(o => o.text === b.innerHTML).isCorrect) {
                                b.style.backgroundColor = '#00D26A';
                                b.style.color = 'white';
                                b.style.borderColor = '#00994c';
                                b.style.boxShadow = '0 6px 0 #00994c';
                            }
                        });
                    }
                }
            });
        });

        // Nộp bài và hiển thị Modal
        function showResults() {
            if (answeredQuestions < questionsList.length) {
                const confirmSubmit = confirm(`Em mới làm ${answeredQuestions}/${questionsList.length} câu. Em có chắc chắn muốn nộp bài không?`);
                if (!confirmSubmit) return;
            }

            const modal = document.getElementById('result-modal');
            const scoreText = document.getElementById('final-score');
            const message = document.getElementById('modal-message');
            const title = document.getElementById('modal-title');

            scoreText.innerText = `${totalScore}/${questionsList.length}`;
            modal.style.display = 'flex';
            
            // Generate Web Audio Ding for submission
            playCorrectSound();

            const percent = totalScore / questionsList.length;
            if (percent === 1) {
                title.innerText = "Xuất sắc! 🏆";
                message.innerText = "Tuyệt cú mèo! Em đúng 100% rồi, thưởng 10 sao vàng!";
            } else if (percent >= 0.8) {
                title.innerText = "Giỏi lắm! ⭐";
                message.innerText = "Kiến thức của em rất vững vàng. Cố thêm tí nữa là Perfect!";
            } else if (percent >= 0.5) {
                title.innerText = "Khá tốt! 👍";
                message.innerText = "Em làm khá ổn, nhưng nhớ đọc kỹ phần giải thích của cô nhé!";
            } else {
                title.innerText = "Cố gắng lên! 💪";
                message.innerText = "Đừng buồn, hãy đọc lại giải thích chi tiết và làm lại lần nữa nha!";
                message.style.color = "var(--wrong-color)";
            }
        }
    </script>
