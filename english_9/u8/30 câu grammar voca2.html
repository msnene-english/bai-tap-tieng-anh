    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-dark: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#8854c0 0.8px, transparent 0.8px), radial-gradient(#8854c0 0.8px, #f0f4f8 0.8px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            color: var(--text-dark);
            padding-bottom: 50px;
        }

        /* Header Styles */
        header {
            background: linear-gradient(135deg, #8854C0, #a29bfe);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(136, 84, 192, 0.3);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            font-size: 1.1rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Quiz Card Styles */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05), 0 15px 20px rgba(0,0,0,0.05);
            border: 2px solid #e1e8ed;
            transition: transform 0.3s ease;
            position: relative;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-number {
            background: var(--primary-teal);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe6e9;
            border-bottom: 5px solid #dfe6e9;
            border-radius: 15px;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #636e72;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-purple);
            border-bottom-color: var(--primary-purple);
            color: var(--primary-purple);
            background-color: #f8f0ff;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-top: 3px;
        }

        /* Correct/Wrong Styles */
        .option-btn.correct {
            background-color: var(--correct-green) !important;
            color: white !important;
            border-color: #00b85c !important;
            border-bottom-color: #008f47 !important;
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            color: white !important;
            border-color: #ff2e40 !important;
            border-bottom-color: #d61c2e !important;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation-box {
            display: none; /* Hidden by default */
            background-color: #e3fcf3;
            border: 2px solid var(--primary-teal);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            animation: popIn 0.4s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: #00967d;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation-content {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .explanation-content strong {
            color: var(--primary-purple);
        }

        .translation-text {
            font-style: italic;
            color: #555;
            margin-bottom: 8px;
            display: block;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 8px;
        }

        .analysis-list {
            list-style: none;
            margin: 10px 0;
            background: rgba(255,255,255,0.6);
            padding: 10px;
            border-radius: 10px;
        }

        .analysis-list li {
            margin-bottom: 5px;
        }

        /* Animations */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Footer / Submit */
        .quiz-footer {
            text-align: center;
            margin-top: 40px;
        }

        .submit-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            border-bottom: 6px solid #6c429c;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Quicksand', sans-serif;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .submit-btn:active {
            transform: translateY(3px);
            border-bottom-width: 3px;
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--primary-purple);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            background: var(--primary-teal);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,201,167,0.4);
        }

        .modal-message {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-purple);
            margin-bottom: 10px;
        }

        .modal-sub {
            color: #636e72;
            margin-bottom: 25px;
        }

        .close-btn {
            background: var(--text-dark);
            color: white;
            padding: 10px 25px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

    </style>

    // --- LOGIC GIAO DIỆN & XỬ LÝ ---

    // 1. Shuffle Function
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // 2. Prepare Data
    let quizData = [];
    let score = 0;
    
    function initQuiz() {
        // Clone data to avoid mutating original
        quizData = JSON.parse(JSON.stringify(rawData));
        
        // Shuffle questions
        shuffleArray(quizData);

        // Shuffle options within each question
        quizData.forEach(q => {
            // Keep track of correct answer text before shuffling
            const correctOptionText = q.answerOptions.find(o => o.isCorrect).text;
            shuffleArray(q.answerOptions);
            // Re-mark correct option (in case logic depends on index, though here we use property)
            q.correctText = correctOptionText;
        });

        renderQuiz();
    }

    // 3. Render Quiz
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        quizData.forEach((item, index) => {
            // Create Card
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `card-${index}`;

            // Header
            const header = document.createElement('div');
            header.className = 'question-header';
            header.innerHTML = `<span class="question-number">Question ${index + 1}</span>`;
            
            // Question Text
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = item.question;

            // Options Grid
            const grid = document.createElement('div');
            grid.className = 'options-grid';

            item.answerOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = opt.text;
                btn.onclick = () => checkAnswer(index, opt, btn);
                grid.appendChild(btn);
            });

            // Explanation Box
            const explainBox = document.createElement('div');
            explainBox.className = 'explanation-box';
            explainBox.id = `explain-${index}`;
            
            // Construct Explanation Content
            let analysisHTML = '<ul class="analysis-list">';
            item.answerOptions.forEach(opt => {
                analysisHTML += `<li>${opt.rationale}</li>`;
            });
            analysisHTML += '</ul>';

            explainBox.innerHTML = `
                <div class="explanation-header">
                    <i class="fas fa-lightbulb"></i> Giải thích chi tiết - Ms. Chí Nên · ☎️ 0852639652:
                </div>
                <div class="explanation-content">
                    <span class="translation-text"><strong>Dịch câu:</strong> "${item.translation}"</span>
                    <br><strong>Phân tích đáp án:</strong>
                    ${analysisHTML}
                    <div style="margin-top:10px; border-top: 1px solid #ccc; padding-top:10px;">
                        <strong>Tại sao chọn đáp án này?</strong><br>
                        ${item.explanation}
                    </div>
                </div>
            `;

            // Append all to card
            card.appendChild(header);
            card.appendChild(qText);
            card.appendChild(grid);
            card.appendChild(explainBox);
            
            // Append card to container
            container.appendChild(card);
        });
    }

    // 4. Check Answer Logic
    function checkAnswer(questionIndex, selectedOption, btnElement) {
        const card = document.getElementById(`card-${questionIndex}`);
        const buttons = card.querySelectorAll('.option-btn');
        const explainBox = document.getElementById(`explain-${questionIndex}`);
        
        // Disable all buttons in this card
        buttons.forEach(btn => btn.disabled = true);

        if (selectedOption.isCorrect) {
            // CORRECT
            btnElement.classList.add('correct');
            score++;
            playSound('correct');
            triggerConfetti(btnElement);
        } else {
            // WRONG
            btnElement.classList.add('wrong');
            playSound('wrong');
            
            // Highlight the correct answer
            buttons.forEach(btn => {
                // Find button text that matches correct answer text from data
                if (btn.innerText === quizData[questionIndex].correctText) {
                    btn.classList.add('correct');
                }
            });
        }

        // Show Explanation
        explainBox.style.display = 'block';
    }

    // 5. Sound Logic
    function playSound(type) {
        const audio = document.getElementById(type === 'correct' ? 'sound-correct' : 'sound-wrong');
        audio.currentTime = 0;
        audio.play().catch(e => console.log("Audio play failed (interaction required):", e));
    }

    // 6. Confetti Effect
    function triggerConfetti(element) {
        const rect = element.getBoundingClientRect();
        // Calculate position relative to viewport
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        confetti({
            particleCount: 100,
            spread: 70,
            origin: { x: x, y: y },
            colors: ['#8854C0', '#00C9A7', '#FF4757', '#FFD700'],
            disableForReducedMotion: true
        });
    }

    // 7. Finish Quiz
    function finishQuiz() {
        const modal = document.getElementById('resultModal');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const msg = document.getElementById('modalMessage');

        scoreDisplay.innerText = `${score}/${quizData.length}`;
        
        const percentage = (score / quizData.length) * 100;
        if (percentage === 100) {
            msg.innerText = "Xuất sắc! Đỉnh của chóp! 🏆";
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        } else if (percentage >= 80) {
            msg.innerText = "Giỏi lắm! Cố chút nữa là 10 điểm! 🌟";
        } else if (percentage >= 50) {
            msg.innerText = "Khá tốt! Ôn lại bài chút nhé! 📚";
        } else {
            msg.innerText = "Cần cố gắng nhiều hơn nha! 💪";
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('resultModal').style.display = 'none';
        window.scrollTo(0, 0);
        location.reload(); // Simple reload to restart
    }

    // Initialize on load
    window.onload = initQuiz;

</script>
