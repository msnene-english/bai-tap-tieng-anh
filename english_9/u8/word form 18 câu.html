<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7: Word Formation Practice - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Tím Pastel */
            --secondary: #00C9A7; /* Xanh ngọc */
            --accent: #FF9F43; /* Cam */
            --success: #00D26A; /* Xanh lá */
            --error: #FF4757; /* Đỏ */
            --text: #2d3436;
            --bg-color: #f0f3f5;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Chống bôi đen để chơi game mượt hơn */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--primary) 1px, transparent 1px), radial-gradient(var(--secondary) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            border: 4px solid #fff;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            padding: 20px;
            text-align: center;
            color: white;
            position: relative;
        }

        .header h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* Progress Bar */
        .progress-container {
            background: rgba(255, 255, 255, 0.3);
            height: 10px;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.5s ease;
        }

        .score-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Content Area */
        .content {
            padding: 30px;
        }

        .question-box {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 30px;
            line-height: 1.6;
            text-align: left;
        }

        .highlight-word {
            color: var(--primary);
            border-bottom: 3px dashed var(--secondary);
            display: inline-block;
            padding: 0 5px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .question-box {
                font-size: 1.2rem;
            }
        }

        .btn-option {
            background: white;
            border: 2px solid #dfe6e9;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: #636e72;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #dfe6e9; /* 3D effect */
            position: relative;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 #dfe6e9;
        }

        .btn-option.correct {
            background-color: var(--success);
            color: white;
            border-color: #00b894;
            box-shadow: 0 6px 0 #00b894;
        }

        .btn-option.wrong {
            background-color: var(--error);
            color: white;
            border-color: #d63031;
            box-shadow: 0 6px 0 #d63031;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .option-letter {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
            background: rgba(0,0,0,0.05);
            border-radius: 50%;
            margin-right: 15px;
            font-size: 0.9rem;
        }

        /* Explanation Box */
        .explanation-area {
            margin-top: 30px;
            background: #f8f9fa;
            border-left: 5px solid var(--secondary);
            border-radius: 8px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-content p {
            margin-bottom: 10px;
            line-height: 1.5;
            color: #4b6584;
        }
        
        .exp-section-title {
            font-weight: 700;
            color: #2d3436;
            margin-top: 10px;
            text-decoration: underline;
            text-decoration-color: var(--secondary);
        }

        .vocab-list {
            list-style: none;
            margin: 10px 0;
            background: white;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }

        .vocab-list li {
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .vocab-tag {
            background: #dfe6e9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 5px;
            color: #636e72;
        }

        /* Controls */
        .controls {
            margin-top: 20px;
            text-align: right;
            height: 50px; /* Placeholder height */
        }

        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #5f27cd;
            transition: all 0.2s;
            display: none; /* Hidden initially */
        }

        .btn-next:hover {
            transform: translateY(-2px);
            background: #9b59b6;
        }

        .btn-next:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* End Screen */
        .end-screen {
            text-align: center;
            display: none;
            padding: 40px 20px;
        }

        .end-score {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary);
            margin: 20px 0;
        }

        .end-message {
            font-size: 1.5rem;
            color: #636e72;
            margin-bottom: 30px;
        }

        .btn-restart {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #10ac84;
        }

        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>BÀI TẬP WORD FORMATION</h1>
        <p>Giáo viên: Ms. Chí Nên · ☎️ 0852639652</p>
        <div class="score-badge">Điểm: <span id="score-val">0</span></div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div class="content" id="quiz-content">
        <!-- Question Area -->
        <div class="question-box" id="question-text">
            Loading...
        </div>

        <!-- Options -->
        <div class="options-grid" id="options-container">
            <!-- Buttons generated by JS -->
        </div>

        <!-- Explanation Area -->
        <div class="explanation-area" id="explanation-box">
            <div class="exp-header">
                <span>💡 Giải thích chi tiết từ Ms. Chí Nên · ☎️ 0852639652</span>
            </div>
            <div class="exp-content" id="explanation-content">
                <!-- Content injected by JS -->
            </div>
        </div>

        <!-- Navigation -->
        <div class="controls">
            <button class="btn-next" id="btn-next" onclick="nextQuestion()">Câu tiếp theo ➜</button>
        </div>
    </div>

    <!-- End Screen -->
    <div class="end-screen" id="end-screen">
        <h2>🎉 CHÚC MỪNG BẠN ĐÃ HOÀN THÀNH! 🎉</h2>
        <div class="end-score" id="final-score">0/0</div>
        <p class="end-message" id="end-message">Bạn làm rất tốt!</p>
        <button class="btn-restart" onclick="location.reload()">Làm lại bài thi ⟳</button>
    </div>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
    /* DỮ LIỆU CÂU HỎI */
    const rawQuestions = [
        {
            q: "These tours usually combine jungle trekking and cave ___________________. (explore)",
            a: "exploration",
            options: ["exploration", "explorer", "exploratory", "exploring"],
            trans: "Những tour này thường kết hợp đi bộ trong rừng và thám hiểm hang động.",
            vocab: [
                {w: "exploration", t: "n", m: "sự thám hiểm"},
                {w: "explorer", t: "n", m: "nhà thám hiểm (chỉ người)"},
                {w: "exploratory", t: "adj", m: "có tính thám hiểm"},
                {w: "exploring", t: "gerund", m: "việc khám phá (ít dùng trong cụm danh từ cố định này)"}
            ],
            whyCorrect: "Cấu trúc song hành (Parallelism): 'jungle trekking' là cụm danh từ, nên sau 'and' cũng cần một danh từ để đi với 'cave'. 'Cave exploration' là một collocation (cụm từ cố định).",
            whyWrong: "'Explorer' chỉ người, không hợp nghĩa. Tính từ 'Exploratory' không thể đứng cuối làm tân ngữ."
        },
        {
            q: "They’re looking for a travel ___________________ to take care of their trip to Africa. (agent)",
            a: "agency",
            options: ["agency", "agent", "agents", "acting"],
            trans: "Họ đang tìm một đại lý du lịch để lo liệu chuyến đi đến Châu Phi của họ.",
            vocab: [
                {w: "agency", t: "n", m: "đại lý, cơ quan, văn phòng"},
                {w: "agent", t: "n", m: "nhân viên đại lý, điệp viên"},
                {w: "agents", t: "n", m: "nhiều nhân viên"},
                {w: "acting", t: "n/adj", m: "diễn xuất / quyền (giám đốc)"}
            ],
            whyCorrect: "'Travel agency' là văn phòng/đại lý du lịch (tổ chức). Trong bài tập Word Form, nếu từ gốc là 'agent', đáp án thường biến đổi thành 'agency'.",
            whyWrong: "'Travel agent' (người) cũng có nghĩa, nhưng ngữ cảnh 'looking for a... to take care' thường ám chỉ tìm một đơn vị dịch vụ (agency) hơn là một cá nhân, và quan trọng là bài tập yêu cầu biến đổi từ gốc (agent -> agency)."
        },
        {
            q: "Spending the summer holidays in the UK isn’t very ___________________ as it often rains a lot. (appeal)",
            a: "appealing",
            options: ["appealing", "appeal", "appealed", "appealingly"],
            trans: "Dành kỳ nghỉ hè ở Anh thì không hấp dẫn lắm vì trời thường mưa nhiều.",
            vocab: [
                {w: "appealing", t: "adj", m: "hấp dẫn, lôi cuốn"},
                {w: "appeal", t: "v/n", m: "kêu gọi / sự hấp dẫn"},
                {w: "appealed", t: "v-ed", m: "đã kêu gọi"},
                {w: "appealingly", t: "adv", m: "một cách hấp dẫn"}
            ],
            whyCorrect: "Sau động từ to be 'isn't' và trạng từ chỉ mức độ 'very', ta cần một Tính từ (Adjective) để chỉ tính chất của việc nghỉ hè.",
            whyWrong: "Các từ loại khác không phù hợp vị trí ngữ pháp sau 'be very'."
        },
        {
            q: "The guest house was on the side of the cliff, with ___________________ views of the ocean below. (breath)",
            a: "breathtaking",
            options: ["breathtaking", "breathless", "breathing", "breath"],
            trans: "Nhà khách nằm bên sườn vách đá, với tầm nhìn ngoạn mục xuống đại dương bên dưới.",
            vocab: [
                {w: "breathtaking", t: "adj", m: "ngoạn mục, đẹp đến nín thở"},
                {w: "breathless", t: "adj", m: "hết hơi, khó thở (dùng cho người)"},
                {w: "breathing", t: "n/v", m: "sự thở"},
                {w: "breath", t: "n", m: "hơi thở"}
            ],
            whyCorrect: "Cần tính từ bổ nghĩa cho danh từ 'views'. 'Breathtaking views' là cụm từ rất phổ biến (collocation) chỉ cảnh đẹp.",
            whyWrong: "'Breathless' dùng để chỉ trạng thái mệt của con người."
        },
        {
            q: "The Taj Mahal is a ___________________ building which is visited by millions of tourists every year. (magnificence)",
            a: "magnificent",
            options: ["magnificent", "magnificently", "magnify", "magnificence"],
            trans: "Taj Mahal là một công trình tráng lệ được hàng triệu du khách ghé thăm mỗi năm.",
            vocab: [
                {w: "magnificent", t: "adj", m: "tráng lệ, hùng vĩ"},
                {w: "magnificently", t: "adv", m: "một cách tráng lệ"},
                {w: "magnify", t: "v", m: "phóng to"},
                {w: "magnificence", t: "n", m: "sự tráng lệ (từ gốc)"}
            ],
            whyCorrect: "Đứng trước danh từ 'building' cần một Tính từ bổ nghĩa.",
            whyWrong: "'Magnificence' là danh từ, 'Magnify' là động từ."
        },
        {
            q: "As the capital of Morbihan, Vannes attracts large numbers of ___________________. (travel)",
            a: "travelers",
            options: ["travelers", "traveling", "travels", "tourist"],
            trans: "Là thủ phủ của Morbihan, Vannes thu hút một lượng lớn khách du lịch.",
            vocab: [
                {w: "travelers", t: "n", m: "khách du lịch (số nhiều)"},
                {w: "traveling", t: "gerund", m: "việc đi du lịch"},
                {w: "travels", t: "n", m: "những chuyến đi"},
                {w: "tourist", t: "n", m: "khách du lịch (nhưng sai gốc từ travel)"}
            ],
            whyCorrect: "Sau cụm lượng từ 'large numbers of' cần Danh từ đếm được số nhiều. Từ cần điền chỉ người (người bị thu hút đến thăm).",
            whyWrong: "'Tourist' đúng nghĩa nhưng sai từ gốc đề bài cho (travel). 'Traveling' là danh động từ không đếm được."
        },
        {
            q: "His parents paid for his hotel ___________________ when he travelled to Japan. (accommodate)",
            a: "accommodation",
            options: ["accommodation", "accommodating", "accommodative", "accommodates"],
            trans: "Bố mẹ anh ấy đã trả tiền chỗ ở khách sạn khi anh ấy đi du lịch Nhật Bản.",
            vocab: [
                {w: "accommodation", t: "n", m: "chỗ ở, tiện nghi ăn ở"},
                {w: "accommodating", t: "adj", m: "hay giúp đỡ, dễ tính"},
                {w: "accommodative", t: "adj", m: "có tính thích nghi"},
                {w: "accommodates", t: "v", m: "cung cấp chỗ ở"}
            ],
            whyCorrect: "Cần danh từ ghép với 'hotel' -> 'hotel accommodation' (chỗ ở khách sạn).",
            whyWrong: "Các đáp án còn lại là tính từ hoặc động từ chia thì."
        },
        {
            q: "Some areas of the park are ___________________ by car from November through May due to snow. (access)",
            a: "inaccessible",
            options: ["inaccessible", "accessible", "accessing", "accessibility"],
            trans: "Một số khu vực của công viên không thể vào được bằng ô tô từ tháng 11 đến tháng 5 do tuyết rơi.",
            vocab: [
                {w: "inaccessible", t: "adj", m: "không thể tiếp cận, không vào được"},
                {w: "accessible", t: "adj", m: "có thể tiếp cận, vào được"},
                {w: "accessing", t: "v-ing", m: "đang truy cập"},
                {w: "accessibility", t: "n", m: "khả năng tiếp cận"}
            ],
            whyCorrect: "Sau động từ to be 'are' cần tính từ. Dựa vào ngữ cảnh 'due to snow' (do tuyết rơi) -> xe không vào được -> Cần tiền tố phủ định 'in-'.",
            whyWrong: "'Accessible' mang nghĩa ngược lại."
        },
        {
            q: "World-famous for football, Barcelona is one of the top sports ___________________ destinations in the world. (tour)",
            a: "tourism",
            options: ["tourism", "tourist", "touring", "tours"],
            trans: "Nổi tiếng thế giới về bóng đá, Barcelona là một trong những điểm đến du lịch thể thao hàng đầu thế giới.",
            vocab: [
                {w: "tourism", t: "n", m: "ngành du lịch, hoạt động du lịch"},
                {w: "tourist", t: "n", m: "khách du lịch"},
                {w: "touring", t: "v-ing", m: "đi tour"},
                {w: "tours", t: "n", m: "các chuyến đi"}
            ],
            whyCorrect: "'Sports tourism' là một thuật ngữ chuyên ngành (Compound Noun) nghĩa là 'Du lịch thể thao'.",
            whyWrong: "'Sports tourist' ám chỉ người khách du lịch thể thao, nhưng ở đây đang nói về loại hình điểm đến (destinations) của ngành du lịch."
        },
        {
            q: "On the first day of school, the children chatted ___________________ to their friends about their summer vacations. (excite)",
            a: "excitedly",
            options: ["excitedly", "excited", "exciting", "excitement"],
            trans: "Vào ngày đầu tiên đi học, bọn trẻ trò chuyện rôm rả với bạn bè về kỳ nghỉ hè của chúng.",
            vocab: [
                {w: "excitedly", t: "adv", m: "một cách hào hứng"},
                {w: "excited", t: "adj", m: "hào hứng (cảm xúc)"},
                {w: "exciting", t: "adj", m: "thú vị (tính chất)"},
                {w: "excitement", t: "n", m: "sự hào hứng"}
            ],
            whyCorrect: "Vị trí này bổ nghĩa cho động từ thường 'chatted' (trò chuyện) -> Cần một Trạng từ (Adverb).",
            whyWrong: "Các từ còn lại là tính từ và danh từ."
        },
        {
            q: "The travel ___________________ assisted us in booking our dream vacation. (agency)",
            a: "agent",
            options: ["agent", "agency", "agents", "acting"],
            trans: "Nhân viên đại lý du lịch đã hỗ trợ chúng tôi đặt kỳ nghỉ mơ ước.",
            vocab: [
                {w: "agent", t: "n", m: "nhân viên đại lý (người)"},
                {w: "agency", t: "n", m: "cơ quan đại lý (tổ chức, nơi chốn)"},
                {w: "agents", t: "n", m: "số nhiều"},
                {w: "acting", t: "adj", m: "tạm quyền"}
            ],
            whyCorrect: "Động từ 'assisted' (hỗ trợ) thường do con người thực hiện trực tiếp. Từ gốc là 'agency' (tổ chức) -> cần biến đổi thành 'agent' (người).",

    /* LOGIC GAME */
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    // Shuffle Array Function
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Audio Context for Generating Sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTone(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // Ding sound: High pitch sine wave
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else {
            // Buzz sound: Low pitch sawtooth
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // Confetti Effect
    function fireConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#f1c40f', '#e74c3c', '#3498db', '#9b59b6', '#2ecc71'];

        for (let i = 0; i < 100; i++) {
            pieces.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                w: Math.random() * 10 + 5,
                h: Math.random() * 10 + 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 0.5) * 20,
                grav: 0.5
            });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            pieces.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.grav;
                p.vx *= 0.95;
                p.vy *= 0.95;
                
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);

                if (p.y < canvas.height) active = true;
            });

            if (active) requestAnimationFrame(update);
            else ctx.clearRect(0,0,canvas.width, canvas.height);
        }
        update();
    }

    function initGame() {
        // Deep copy and shuffle questions
        questions = JSON.parse(JSON.stringify(rawQuestions));
        shuffleArray(questions);
        
        // Also shuffle options within each question
        // Note: Logic below in renderQuestion handles checking correctness by text, so shuffling options is safe
        
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('score-val').textContent = score;
        document.getElementById('quiz-content').style.display = 'block';
        document.getElementById('end-screen').style.display = 'none';
        
        renderQuestion();
    }

    function renderQuestion() {
        isAnswered = false;
        const q = questions[currentQuestionIndex];
        
        // Update Progress Bar
        const progress = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;

        // Update Text
        document.getElementById('question-text').innerHTML = `
            <span style="color:var(--primary); font-size: 1rem;">Câu ${currentQuestionIndex + 1}/${questions.length}:</span><br>
            ${q.q.replace(/_+/g, '<span class="highlight-word">_________</span>')}
        `;

        // Reset UI
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('btn-next').style.display = 'none';
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        // Shuffle Options for display
        let currentOptions = [...q.options]; 
        // We don't shuffle options array here to keep A B C D consistent? 
        // Actually, gamification usually shuffles positions. Let's shuffle positions.
        // But we need to keep track of which is correct. The correct answer text is in q.a
        shuffleArray(currentOptions);

        currentOptions.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerHTML = `<span class="option-letter">${String.fromCharCode(65+index)}</span> ${opt}`;
            btn.onclick = () => checkAnswer(opt, btn, q.a);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedText, btnElement, correctText) {
        if (isAnswered) return;
        isAnswered = true;

        const options = document.querySelectorAll('.btn-option');
        let correctBtn;

        // Find the button with the correct text
        options.forEach(btn => {
            if (btn.innerText.includes(correctText)) { // Simple check, careful with substrings but ok here
                correctBtn = btn;
            }
            btn.disabled = true; // Disable all
            btn.style.cursor = 'default';
        });

        if (selectedText === correctText) {
            // CORRECT
            btnElement.classList.add('correct');
            score++;
            document.getElementById('score-val').textContent = score;
            playTone('correct');
            fireConfetti();
        } else {
            // WRONG
            btnElement.classList.add('wrong');
            correctBtn.classList.add('correct');
            playTone('wrong');
        }

        showExplanation();
        document.getElementById('btn-next').style.display = 'inline-block';
    }

    function showExplanation() {
        const q = questions[currentQuestionIndex];
        const expBox = document.getElementById('explanation-box');
        const content = document.getElementById('explanation-content');

        // Build Explanation HTML
        let vocabHTML = '<ul class="vocab-list">';
        q.vocab.forEach(v => {
            vocabHTML += `<li><span class="vocab-tag">${v.w} (${v.t})</span> ${v.m}</li>`;
        });
        vocabHTML += '</ul>';

        content.innerHTML = `
            <div class="exp-section-title">1. Dịch câu hỏi:</div>
            <p><em>"${q.trans}"</em></p>

            <div class="exp-section-title">2. Phân tích từ vựng:</div>
            ${vocabHTML}

            <div class="exp-section-title">3. Tại sao chọn đáp án "${q.a}"?</div>
            <p style="color: var(--success); font-weight: bold;">${q.whyCorrect}</p>

            <div class="exp-section-title">4. Tại sao các đáp án khác sai?</div>
            <p style="color: var(--error);">${q.whyWrong}</p>
        `;

        expBox.style.display = 'block';
        // Scroll to explanation on mobile
        if(window.innerWidth < 600) {
            expBox.scrollIntoView({behavior: "smooth"});
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            renderQuestion();
        } else {
            endGame();
        }
    }

    function endGame() {
        document.getElementById('quiz-content').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        document.getElementById('progress-bar').style.width = '100%';
        
        const finalScore = document.getElementById('final-score');
        finalScore.textContent = `${score}/${questions.length}`;

        const msg = document.getElementById('end-message');
        if (score === questions.length) {
            msg.textContent = "Xuất sắc! Bạn là thiên tài Word Form! 🌟";
            fireConfetti();
        } else if (score >= questions.length * 0.7) {
            msg.textContent = "Làm tốt lắm! Chỉ còn vài lỗi nhỏ thôi. 💪";
        } else {
            msg.textContent = "Hãy xem lại phần giải thích và thử lại nhé! 📚";
        }
    }

    // Start Game on Load
    initGame();

</script>
