    <style>
        :root {
            --primary-pink: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2d3436;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0e0e0 15%, transparent 16%), radial-gradient(#e0e0e0 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--primary-pink);
        }

        .header h1 {
            font-family: 'Quicksand', sans-serif;
            color: var(--primary-pink);
            font-size: 1.5rem;
            margin: 0;
            font-weight: 800;
            text-transform: uppercase;
        }

        .header h2 {
            font-size: 1rem;
            color: #666;
            margin: 5px 0 0;
        }

        /* Progress Bar */
        .progress-container {
            background-color: #dfe6e9;
            border-radius: 50px;
            height: 20px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary-teal), #55efc4);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
            border-radius: 50px;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8rem;
            font-weight: bold;
            color: #2d3436;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.2);
            margin-bottom: 20px;
            border: 3px solid #f1f2f6;
            position: relative;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .hint-text {
            font-size: 1rem;
            color: var(--primary-pink);
            font-style: italic;
            background: #f3e5f5;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            color: #2d3436;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            box-shadow: 0 5px 0 #b2bec3;
            outline: none;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-pink);
            background-color: #f8f0ff;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b2bec3;
        }

        .option-label {
            font-weight: 800;
            margin-right: 15px;
            background: #dfe6e9;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-green);
            color: white;
            border-color: #00b894;
            box-shadow: 0 5px 0 #00b894;
        }
        .option-btn.correct .option-label { background: rgba(255,255,255,0.3); color: white; }

        .option-btn.wrong {
            background-color: var(--wrong-red);
            color: white;
            border-color: #d63031;
            box-shadow: 0 5px 0 #d63031;
            animation: shake 0.5s;
        }
        .option-btn.wrong .option-label { background: rgba(255,255,255,0.3); color: white; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Explanation Box */
        .explanation-box {
            background: #fff;
            border-left: 6px solid var(--primary-pink);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: none; /* Hidden by default */
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; margin-top: 10px; }
            to { opacity: 1; margin-top: 25px; }
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary-pink);
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .exp-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary-pink);
        }

        .exp-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2d3436;
        }
        
        .exp-section {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #e0e0e0;
        }
        
        .exp-section:last-child { border-bottom: none; }
        
        .exp-label {
            font-weight: bold;
            color: var(--primary-teal);
            display: block;
            margin-bottom: 5px;
        }

        /* Navigation */
        .nav-controls {
            margin-top: 30px;
            text-align: center;
        }

        .next-btn {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #6c429c;
            transition: transform 0.1s;
            display: none; /* Hidden initially */
        }

        .next-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #6c429c;
        }

        /* Result Screen */
        .result-card {
            text-align: center;
            display: none;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--primary-teal);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 3rem;
            font-weight: 800;
            box-shadow: 0 10px 0 #00a388;
        }
        
        .score-text { font-size: 1rem; font-weight: 600; opacity: 0.9; }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        
        /* Mobile Responsive */
        @media (max-width: 600px) {
            .question-text { font-size: 1.1rem; }
            .option-btn { font-size: 1rem; padding: 12px; }
            .header h1 { font-size: 1.2rem; }
        }
    </style>

    // --- GAME STATE ---
    let currentQuestionIndex = 0;
    let score = 0;
    let questions = [];

    // --- AUDIO SYSTEM (Base64 Sounds for Offline/Single File Reliability) ---
    // Simple Beep/Boop Synthesizer used for reliability instead of external links
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // High pitched Ding
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        } else {
            // Low pitched Buzz
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.4);
        }
    }

    // --- CONFETTI LOGIC ---
    function fireConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#8854C0', '#00C9A7', '#00D26A', '#FF4757', '#FFD700'];

        for (let i = 0; i < 150; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 10 + 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                dy: Math.random() * 5 + 2,
                dx: Math.random() * 4 - 2,
                rot: Math.random() * 360,
                drot: Math.random() * 10 - 5
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            pieces.forEach(p => {
                p.y += p.dy;
                p.x += p.dx;
                p.rot += p.drot;
                
                if (p.y < canvas.height) active = true;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                ctx.restore();
            });

            if (active) requestAnimationFrame(draw);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        draw();
    }

    // --- INITIALIZATION ---
    function initGame() {
        // Shuffle questions
        questions = [...quizData.questions];
        shuffleArray(questions);
        
        currentQuestionIndex = 0;
        score = 0;
        renderQuestion();
        updateProgress();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // --- RENDER LOGIC ---
    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        
        // Reset UI
        document.getElementById('explanation-area').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('finish-btn').style.display = 'none';
        
        // Render content
        document.getElementById('question-content').innerHTML = `
            <span style="color:var(--primary-pink); margin-right:5px;">Câu ${currentQuestionIndex + 1}:</span> 
            ${q.question}
        `;
        document.getElementById('question-hint').innerText = "💡 Gợi ý: " + q.hint;

        // Shuffle Options (keep track of indices)
        let options = q.answerOptions.map((opt, idx) => ({...opt, originalIndex: idx}));
        shuffleArray(options);

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        const labels = ['A', 'B', 'C', 'D'];
        
        options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.onclick = () => checkAnswer(opt, btn, q, options);
            btn.innerHTML = `
                <div class="option-label">${labels[idx]}</div>
                <div>${opt.text}</div>
            `;
            optionsContainer.appendChild(btn);
        });
    }

    function updateProgress() {
        const pct = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('progress-text').innerText = `Câu ${currentQuestionIndex + 1}/${questions.length}`;
    }

    // --- CHECK ANSWER & EXPLANATION LOGIC (THE CORE) ---
    function checkAnswer(selectedOpt, btnElement, questionData, shuffledOptions) {
        // Disable all buttons
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        const isCorrect = selectedOpt.isCorrect;

        if (isCorrect) {
            score++;
            btnElement.classList.add('correct');
            playSound('correct');
            fireConfetti();
        } else {
            btnElement.classList.add('wrong');
            playSound('wrong');
            // Highlight correct answer
            buttons.forEach(b => {
                const txt = b.querySelector('div:last-child').innerText;
                const correctOpt = questionData.answerOptions.find(o => o.isCorrect);
                if (txt === correctOpt.text) {
                    b.classList.add('correct');
                }
            });
        }

        // Show Explanation
        showExplanation(selectedOpt, questionData, isCorrect);
        
        // Show Navigation
        if (currentQuestionIndex < questions.length - 1) {
            document.getElementById('next-btn').style.display = 'inline-block';
        } else {
            document.getElementById('finish-btn').style.display = 'inline-block';
        }
    }

    function showExplanation(selectedOpt, questionData, isCorrect) {
        const expArea = document.getElementById('explanation-area');
        const expContent = document.getElementById('explanation-content');
        
        // Find correct option info
        const correctOpt = questionData.answerOptions.find(o => o.isCorrect);

        // Build HTML for explanation
        let html = '';

        // 1. Translation of Question (Reordered sentence meaning)
        html += `<div class="exp-section">
            <span class="exp-label">🌐 Dịch nghĩa câu hoàn chỉnh:</span>
            <em>"${extractTranslation(correctOpt.rationale)}"</em>
        </div>`;

        // 2. Analysis of the User's Choice (Why Right or Why Wrong)
        if (isCorrect) {
            html += `<div class="exp-section">
                <span class="exp-label" style="color:var(--correct-green)">✅ Tại sao bạn đúng?</span>
                ${formatRationale(correctOpt.rationale)}
            </div>`;
        } else {
             html += `<div class="exp-section">
                <span class="exp-label" style="color:var(--wrong-red)">❌ Tại sao câu bạn chọn sai?</span>
                ${selectedOpt.rationale}
            </div>
            <div class="exp-section">
                <span class="exp-label" style="color:var(--correct-green)">✅ Đáp án đúng là:</span>
                <b>${correctOpt.text}</b><br><br>
                ${formatRationale(correctOpt.rationale)}
            </div>`;
        }

        // 3. Vocab/Structure Analysis (Extracted from Correct Rationale)
        html += `<div class="exp-section">
            <span class="exp-label">📚 Cấu trúc cần nhớ:</span>
            ${extractStructure(correctOpt.rationale)}
        </div>`;

        expContent.innerHTML = html;
        expArea.style.display = 'block';
    }

    // Helper to format the Markdown-like syntax in JSON to HTML
    function formatRationale(text) {
        // Remove "Chính xác!", "Sai." etc if needed, or bold them
        let formatted = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold **text**
            .replace(/\n/g, '<br>');
        return formatted;
    }

    function extractTranslation(text) {
        // Simple regex to find text after "Dịch:" or similar markers
        const match = text.match(/Dịch:(.*)/);
        return match ? match[1].trim() : "Xem chi tiết bên dưới.";
    }

    function extractStructure(text) {
         // Simple regex to find text after "Cấu trúc:"
        const match = text.match(/Cấu trúc:(.*?)(\n|$)/);
        return match ? match[1].trim() : "S + Verb + Object";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        renderQuestion();
        updateProgress();
    }

    function showResults() {
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('final-score').innerText = `${score}/${questions.length}`;
        
        const pct = (score / questions.length) * 100;
        const title = document.getElementById('result-title');
        const msg = document.getElementById('result-message');

        if (pct === 100) {
            title.innerText = "Tuyệt đối! 🏆";
            msg.innerText = "Bạn là ngôi sao sáng nhất lớp học của Ms. Chí Nên · ☎️ 0852639652hôm nay!";
            fireConfetti();
        } else if (pct >= 70) {
            title.innerText = "Làm tốt lắm! 🌟";
            msg.innerText = "Bạn nắm chắc kiến thức, chỉ cần cẩn thận hơn xíu thôi.";
        } else {
            title.innerText = "Cố gắng lên nhé! 💪";
            msg.innerText = "Hãy xem lại phần giải thích kỹ hơn để làm tốt lần sau.";
        }
    }

    window.onload = initGame;
