    <style>
        :root {
            --primary: #8854C0; /* Tím Pastel */
            --secondary: #00C9A7; /* Xanh ngọc */
            --accent: #FF9F43; /* Cam */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ */
            --bg-pattern: #F0F4F8;
            --text-main: #2F3542;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Ngăn chọn text để tập trung click */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#dfe4ea 15%, transparent 16%), radial-gradient(#dfe4ea 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--primary);
            animation: float 3s ease-in-out infinite;
        }

        .header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 800;
        }

        .header span {
            color: var(--secondary);
            font-size: 0.9rem;
            font-weight: 700;
        }

        /* --- QUIZ CARD --- */
        .quiz-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            border-bottom: 8px solid #E1E1E1;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #f1f2f6;
            border-radius: 20px;
            margin-bottom: 25px;
            height: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 20px;
        }

        /* Question Area */
        .question-box {
            margin-bottom: 25px;
        }

        .q-tag {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.6;
            white-space: pre-line; /* Giữ định dạng xuống dòng của đề bài */
        }

        .hint-text {
            color: #747d8c;
            font-style: italic;
            font-size: 0.95rem;
            margin-top: 10px;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
        }

        /* Options Area */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            padding: 15px 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            box-shadow: 0 6px 0 #dfe4ea;
            display: flex;
            align-items: center;
        }

        .option-btn .opt-label {
            background: #dfe4ea;
            color: #57606f;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--secondary);
            box-shadow: 0 8px 0 #dfe4ea;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #dfe4ea;
        }

        /* State Classes */
        .option-btn.correct {
            background: #d1f7c4;
            border-color: var(--correct);
            box-shadow: 0 6px 0 #20bf6b !important;
            color: #009432;
        }
        .option-btn.correct .opt-label {
            background: var(--correct);
            color: white;
        }

        .option-btn.wrong {
            background: #ffcccc;
            border-color: var(--wrong);
            box-shadow: 0 6px 0 #eb3b5a !important;
            color: #c0392b;
            animation: shake 0.5s;
        }
        .option-btn.wrong .opt-label {
            background: var(--wrong);
            color: white;
        }

        /* --- EXPLANATION BOX (The Soul of the Immersive) --- */
        .explanation-box {
            margin-top: 25px;
            background: #f8f9fa;
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.5s ease;
        }

        .exp-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: var(--primary);
            font-weight: 800;
            font-size: 1.1rem;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
        }

        .exp-header i { margin-right: 10px; font-size: 1.3rem; }

        .exp-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2f3542;
        }

        .exp-section {
            margin-bottom: 10px;
        }
        
        .exp-section strong {
            color: var(--primary);
        }

        .vocab-item {
            display: inline-block;
            background: #fff;
            border: 1px solid #ddd;
            padding: 2px 8px;
            border-radius: 5px;
            margin: 2px;
            font-size: 0.9rem;
        }

        /* --- CONTROLS --- */
        .controls {
            margin-top: 25px;
            text-align: right;
        }

        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #5f27cd;
            transition: all 0.2s;
            display: none; /* Hidden initially */
        }

        .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #5f27cd; }
        .next-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #5f27cd; }

        /* --- RESULT SCREEN --- */
        .result-screen {
            text-align: center;
            display: none;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 3rem;
            font-weight: 800;
            color: white;
            border: 8px solid white;
            box-shadow: 0 0 0 5px var(--secondary);
        }
        .feedback-text {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .quiz-container { padding: 20px; }
            .header h1 { font-size: 1.2rem; }
            .option-btn { font-size: 1rem; padding: 12px; }
        }
    </style>

    <script>
        // Short beep for correct (Ding)
        const sndCorrect = new Audio("data:audio/wav;base64,UklGRi4AAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="); // Placeholder, will use generated beeps in JS logic for reliability if external links fail, but let's use a real trick with AudioContext for pure JS sounds to avoid large base64 strings.
        
        // Actually, let's use Web Audio API for synthesized sounds (Ding / Buzz) to ensure 0 external dependency and keep file size small.
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playDing() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1); // C6
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playBuzz() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    </script>

        // --- 2. GAME STATE ---
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];

        // --- 3. UTILITIES ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- 4. GAME LOGIC ---
        function initGame() {
            // Shuffle questions but keep Q1, Q2 etc logical if needed. 
            // For now, let's shuffle options within questions, but maybe keep question order fixed 
            // OR shuffle questions too. Let's shuffle questions for variety.
            shuffledQuestions = [...quizData]; 
            // Actually, usually teachers want questions 1-7 in order for context.
            // Let's keep question order FIXED, but shuffle OPTIONS.
            
            shuffledQuestions.forEach(q => {
                q.shuffledOptions = shuffleArray([...q.answerOptions]);
            });

            currentQuestionIndex = 0;
            score = 0;
            document.getElementById("quiz-box").style.display = "block";
            document.getElementById("result-box").style.display = "none";
            loadQuestion();
        }

        function loadQuestion() {
            const data = shuffledQuestions[currentQuestionIndex];
            const qNum = currentQuestionIndex + 1;
            const total = shuffledQuestions.length;

            // Update Progress
            const progressPercent = ((currentQuestionIndex) / total) * 100;
            document.getElementById("progress").style.width = `${progressPercent}%`;

            // Render Text
            document.getElementById("q-number").innerText = `${qNum} / ${total}`;
            document.getElementById("q-text").innerText = data.question;
            
            // Handle Hint
            const hintBox = document.getElementById("q-hint");
            if(data.hint) {
                hintBox.innerHTML = `<i class="fas fa-lightbulb" style="color:#f1c40f"></i> <b>Gợi ý:</b> ${data.hint}`;
                hintBox.style.display = "block";
            } else {
                hintBox.style.display = "none";
            }

            // Hide previous explanation and next button
            document.getElementById("explanation").style.display = "none";
            document.getElementById("next-btn").style.display = "none";

            // Render Options
            const optionsArea = document.getElementById("options-area");
            optionsArea.innerHTML = "";
            const labels = ['A', 'B', 'C', 'D'];

            data.shuffledOptions.forEach((opt, index) => {
                const btn = document.createElement("div");
                btn.className = "option-btn";
                // Only use labels if index < 4
                const label = index < 4 ? labels[index] : "?"; 
                btn.innerHTML = `<span class="opt-label">${label}</span> ${opt.text}`;
                btn.onclick = () => checkAnswer(btn, opt, data);
                optionsArea.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, optionData, questionData) {
            // Disable all buttons
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => {
                btn.style.pointerEvents = "none"; // Disable clicks
                btn.style.opacity = "0.7";
            });
            selectedBtn.style.opacity = "1";

            const expContent = document.getElementById("exp-content");
            const expBox = document.getElementById("explanation");
            const nextBtn = document.getElementById("next-btn");

            // Logic Correct/Wrong
            if (optionData.isCorrect) {
                selectedBtn.classList.add("correct");
                playDing();
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                playBuzz();
                // Highlight the correct one
                // Use a loop to find the button that contains the correct text
                buttons.forEach((btn, idx) => {
                     // logic match by finding the correct option object in the shuffled array
                     if(questionData.shuffledOptions[idx].isCorrect) {
                         btn.classList.add("correct");
                         btn.style.opacity = "1";
                     }
                });
            }

            // Show Explanation logic
            // Build the explanation HTML based on the "Detailed Analysis" requirement
            let html = ``;
            
            // 1. Phân tích 4 đáp án (Analysis of all options from Rationale)
            // Since the user JSON only provides rationale per option, we construct it from there.
            // But we must prioritize the Rationale of the CORRECT answer as it contains the full breakdown.
            
            // Find correct option rationale
            const correctOpt = questionData.answerOptions.find(o => o.isCorrect);
            
            html += `<div class="exp-section">`;
            html += `<strong><i class="fas fa-check-circle"></i> Phân tích chi tiết:</strong><br>`;
            html += `${correctOpt.rationale}`; // This field in JSON already contains the detailed breakdown & translation
            html += `</div>`;

            // Add Specific Wrong reasons if selected wrong
            if (!optionData.isCorrect) {
                html += `<div class="exp-section" style="margin-top:15px; border-top:1px dashed #ccc; padding-top:10px;">`;
                html += `<strong style="color:var(--wrong)"><i class="fas fa-times-circle"></i> Tại sao đáp án bạn chọn lại sai?</strong><br>`;
                html += `${optionData.rationale}`;
                html += `</div>`;
            }

            expContent.innerHTML = html;
            expBox.style.display = "block";
            nextBtn.style.display = "inline-block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz-box").style.display = "none";
            document.getElementById("result-box").style.display = "block";
            document.getElementById("final-score").innerText = `${score}/${shuffledQuestions.length}`;
            
            const percentage = (score / shuffledQuestions.length) * 100;
            let feedback = "";
            if (percentage === 100) feedback = "Xuất sắc! Bạn là thiên tài sắp xếp câu! 🌟";
            else if (percentage >= 80) feedback = "Rất tốt! Bạn nắm rất vững cấu trúc! 🔥";
            else if (percentage >= 50) feedback = "Khá lắm! Cố gắng thêm chút nữa nhé! 💪";
            else feedback = "Đừng nản chí! Hãy xem lại phần giải thích và thử lại nhé! 🍀";
            
            document.getElementById("final-feedback").innerText = feedback;
            
            if (percentage >= 80) {
                confetti({
                    particleCount: 200,
                    spread: 100,
                    origin: { y: 0.6 }
                });
            }
        }

        // Start Game
        window.onload = initGame;

    </script>
