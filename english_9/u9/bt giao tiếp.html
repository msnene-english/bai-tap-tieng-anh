    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f3f5;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d7d7d7 1px, transparent 1px), radial-gradient(#d7d7d7 1px, transparent 1px);

            padding: 20px;
            color: var(--text-color);

        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            color: var(--primary-purple);
            font-weight: 800;
            font-size: 2.2rem;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .teacher-name {
            font-size: 1rem;
            color: #666;
            background: #fff;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 10px;
            font-weight: 700;
        }

        #quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 30px;
            border: 2px solid #eee;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .question-number {
            background: var(--primary-purple);
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #333;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 0 #cccccc;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:active {
            box-shadow: 0 0 0 #cccccc;
            transform: translateY(5px);
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f9f9f9;
            transform: scale(1.02);
            border-color: var(--primary-purple);
        }

        /* Status Styles */
        .option-btn.correct {
            background-color: var(--correct-green);
            color: white;
            border-color: #00b85b;
            box-shadow: 0 5px 0 #008f47;
        }
        
        .option-btn.wrong {
            background-color: var(--wrong-red);
            color: white;
            border-color: #e63b49;
            box-shadow: 0 5px 0 #c22f3d;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
            transform: none !important;
        }

        /* Explanation Box */
        .explanation-box {
            background: #f0fdf4; /* Light green bg */
            border: 2px solid var(--primary-teal);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            display: none; /* Hidden by default */

        }

            display: block;
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary-teal);

            align-items: center;

            line-height: 1.6;
            color: #444;

            align-items: center;

        // State variables
        let quizData = [];
        let score = 0;
        let answeredCount = 0;

        // Shuffle Function (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Initialize Quiz
        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            score = 0;
            answeredCount = 0;
            
            // Clone data to avoid modifying original rawData during shuffling
            quizData = JSON.parse(JSON.stringify(rawData.questions));
            
            // 1. Shuffle Order of Questions
            shuffleArray(quizData);

            // 2. Shuffle Order of Answers (Options) within each question
            quizData.forEach(q => {
                 shuffleArray(q.answerOptions);
            });

            quizData.forEach((q, index) => {
                const card = createQuestionCard(q, index);
                container.appendChild(card);
            });
        }

        // Create Card Element
        function createQuestionCard(q, index) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${index}`;

            // Header: Question Number & Hint Icon
            const headerHtml = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="question-number">Question ${index + 1}</div>
                    ${q.hint ? `<i class="fas fa-lightbulb" style="color:#f1c40f; cursor:pointer;" title="${q.hint}"></i>` : ''}
                </div>
            `;

            // Question Text
            const textHtml = `<div class="question-text">${q.question.replace(/\n/g, '<br>')}</div>`;

            // Options
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options-grid';
            
            // Map original options to include their original index for tracking (though we don't shuffle options here to keep A,B,C,D order consistent with potential text references)
            q.answerOptions.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                // Add A, B, C, D labels
                const label = String.fromCharCode(65 + optIndex); // 65 is 'A'
                btn.innerHTML = `<span style="color:var(--primary-purple); font-weight:800; margin-right:8px;">${label}.</span> ${opt.text}`;
                
                btn.onclick = () => handleAnswer(index, optIndex, opt.isCorrect, btn);
                optionsDiv.appendChild(btn);
            });

            // Explanation Section
            const expDiv = document.createElement('div');
            expDiv.className = 'explanation-box';
            expDiv.id = `exp-${index}`;
            expDiv.innerHTML = `
                <div class="exp-header"><i class="fas fa-glasses"></i> Giải thích chi tiết của Ms. Chí Nên · ☎️ 0852639652:</div>
                <div class="exp-content">${formatRationale(q.rationale)}</div>
            `;

            card.innerHTML = headerHtml + textHtml;
            card.appendChild(optionsDiv);
            card.appendChild(expDiv);

            return card;
        }

        // Format Rationale Text
        function formatRationale(text) {
            if (!text) return "Chưa có giải thích.";
            // Bold key sections
            let formatted = text.replace(/\n/g, '<br>');
            formatted = formatted.replace(/(Phân tích từ vựng:)/g, '<strong>$1</strong>');
            formatted = formatted.replace(/(Dịch nghĩa toàn câu:)/g, '<strong>$1</strong>');
            formatted = formatted.replace(/(Giải thích chi tiết:)/g, '<strong>$1</strong>');
            return formatted;
        }

        // Handle Answer Click
        function handleAnswer(qIndex, optIndex, isCorrect, btnElement) {
            const card = document.getElementById(`q-card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const expBox = document.getElementById(`exp-${qIndex}`);

            // Prevent re-answering
            if (card.getAttribute('data-answered') === 'true') return;
            card.setAttribute('data-answered', 'true');
            answeredCount++;

            // Highlight chosen answer
            if (isCorrect) {
                btnElement.classList.add('correct');
                correctSound.play();
                score++;
                // Confetti for correct answer (small burst)
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.7 },
                    colors: ['#00D26A', '#8854C0']
                });
            } else {
                btnElement.classList.add('wrong');
                wrongSound.play();
                // Find and highlight the correct answer
                quizData[qIndex].answerOptions.forEach((opt, i) => {
                    if (opt.isCorrect) {
                        buttons[i].classList.add('correct');
                    }
                });
            }

            // Disable all buttons
            buttons.forEach(b => b.disabled = true);

            // Show explanation immediately
            expBox.classList.add('show');
        }

        // Finish Quiz
        function finishQuiz() {
            if (answeredCount < quizData.length) {
                if(!confirm(`Con mới làm ${answeredCount}/${quizData.length} câu. Con có chắc muốn nộp bài không?`)) {
                    return;
                }
            }

            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('score-display');
            const msgDisplay = document.getElementById('message-display');

            scoreDisplay.textContent = `${score}/${quizData.length}`;

            // Messages based on score
            const percentage = (score / quizData.length) * 100;
            if (percentage === 100) {
                msgDisplay.textContent = "Xuất sắc! Con là thiên tài tiếng Anh! 🌟🏆";
                completeSound.play();
                // Big confetti
                var duration = 3000;
                var end = Date.now() + duration;
                (function frame() {
                    confetti({
                        particleCount: 5,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 }
                    });
                    confetti({
                        particleCount: 5,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 }
                    });
                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
            } else if (percentage >= 80) {
                msgDisplay.textContent = "Giỏi lắm! Chỉ sai một chút xíu thôi. 💪";
                completeSound.play();
            } else if (percentage >= 50) {
                msgDisplay.textContent = "Khá tốt, nhưng cần ôn lại từ vựng nha con. 📚";
            } else {
                msgDisplay.textContent = "Cố gắng hơn lần sau nhé! Cô tin con làm được. ❤️";
            }

            modal.style.display = "flex";
        }

        // Close Modal & Reset
        function closeModal() {
            document.getElementById('result-modal').style.display = "none";
            // Scroll to top
            window.scrollTo(0,0);
            initQuiz();
        }

        // Start
        window.onload = initQuiz;

    </script>
</body>
</html>
