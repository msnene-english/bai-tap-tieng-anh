<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tập Tiếng Anh 9 - Ms. Chí Nên</title>
    
    <!-- Google Fonts: Nunito & Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Confetti Library -->

    <style>
        :root {
            --primary: #8854C0; /* Purple */
            --primary-dark: #6c429c;
            --secondary: #00C9A7; /* Teal */
            --secondary-dark: #009e82;
            --correct: #00D26A;
            --correct-dark: #00a855;
            --wrong: #FF4757;
            --wrong-dark: #d6303e;
            --bg-color: #f0f4f8;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Prevent text selection for app-like feel */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dfe6e9 15%, transparent 16%), radial-gradient(#dfe6e9 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            margin: 0;
            padding-bottom: 80px; /* Space for footer */
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Question Card */
        .quiz-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.05);
            border: 2px solid #fff;
            position: relative;
            transition: transform 0.3s ease;
        }

        .question-number {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 3px 0 var(--primary-dark);
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr; /* Stack on mobile */
            }
        }

        /* Option Button Styling (3D Effect) */
        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-bottom: 5px solid #e0e0e0; /* 3D effect */
            border-radius: 15px;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }
        
        .option-btn:hover:not(:disabled) {
            background-color: #f9f9f9;
            transform: scale(1.02);
        }

        .option-circle {
            width: 30px;
            height: 30px;
            background: #eee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            color: #777;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct);
            border-color: var(--correct-dark);
            color: white;
        }
        .option-btn.correct .option-circle {
            background-color: rgba(255,255,255,0.3);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            border-color: var(--wrong-dark);
            color: white;
        }
        .option-btn.wrong .option-circle {
            background-color: rgba(255,255,255,0.3);
            color: white;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }
        
        .option-btn:disabled:hover {
            transform: none;
        }

        /* Animation Classes */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background-color: #e3f2fd;
            border: 2px solid #bbdefb;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.show {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .exp-header {
            font-family: 'Quicksand', sans-serif;
            color: #1565c0;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .exp-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap; /* Preserve line breaks from JSON */
        }
        
        /* Highlight sections in explanation */
        .exp-content b {
            color: var(--primary);
        }

        /* Footer / Submit Bar */
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99;
        }

        .score-display {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .submit-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            border-bottom: 5px solid var(--secondary-dark);
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        .submit-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .result-card {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .result-card {
            transform: scale(1);
        }

        .final-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary);
            margin: 10px 0;
        }

        .cheer-msg {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 25px;
        }
        
        .restart-btn {
            background: var(--primary);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 4px solid var(--primary-dark);
        }

    </style>

    <script>
        // --- SOUND ENGINE (Web Audio API - No external files needed) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding sound (High pitch, fast decay)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Buzz sound (Low pitch, saw)
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- DATA (From User Input) ---
        const rawData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "31. Please copy the important information ______ a separate document for easy reference.",
              "answerOptions": [
                { "text": "into", "isCorrect": true, "id": "A" },
                { "text": "from", "isCorrect": false, "id": "B" },
                { "text": "over", "isCorrect": false, "id": "C" },
                { "text": "up", "isCorrect": false, "id": "D" }
              ],
              "rationale": "1. Phân tích từ vựng:\n- A. into (prep): vào trong, vào.\n- B. from (prep): từ.\n- C. over (prep): qua, trùm lên.\n- D. up (prep): lên.\n\n2. Dịch nghĩa: Vui lòng sao chép thông tin quan trọng vào một tài liệu riêng để dễ tham khảo.\n\n3. Giải thích:\n- Cấu trúc: 'copy something into something' (sao chép cái gì vào cái gì).\n- Ta cần giới từ chỉ sự chuyển đổi vị trí vào bên trong một tài liệu khác -> Chọn 'into'."
            },
            {
              "questionNumber": 2,
              "question": "32. The teacher ______ students love English is very kind.",
              "answerOptions": [
                { "text": "whose", "isCorrect": true, "id": "A" },
                { "text": "what", "isCorrect": false, "id": "B" },
                { "text": "who", "isCorrect": false, "id": "C" },
                { "text": "which", "isCorrect": false, "id": "D" }
              ],
              "rationale": "1. Phân tích từ vựng:\n- A. whose (đại từ quan hệ): của ai (chỉ sở hữu).\n- B. what (từ để hỏi/quan hệ): cái gì.\n- C. who (đại từ quan hệ): người mà (làm chủ ngữ/tân ngữ).\n- D. which (đại từ quan hệ): cái mà (chỉ vật).\n\n2. Dịch nghĩa: Người giáo viên mà có những học sinh yêu thích Tiếng Anh thì rất tốt bụng.\n\n3. Giải thích:\n- Danh từ đứng trước là 'The teacher' (người).\n- Danh từ đứng sau là 'students' (học sinh).\n- Mối quan hệ ở đây là sở hữu: Học sinh 'của' giáo viên đó -> Cần dùng đại từ quan hệ chỉ sở hữu 'whose'."
            },
            {
              "questionNumber": 3,
              "question": "33. Let’s visit a museum ______ most famous paintings are displayed.",
              "answerOptions": [
                { "text": "whom", "isCorrect": false, "id": "A" },
                { "text": "whose", "isCorrect": false, "id": "B" },
                { "text": "where", "isCorrect": true, "id": "C" },
                { "text": "which", "isCorrect": false, "id": "D" }
              ],
              "rationale": "1. Phân tích từ vựng:\n- A. whom (đại từ quan hệ): người mà (tân ngữ).\n- B. whose (đại từ quan hệ): của ai/của cái gì.\n- C. where (trạng từ quan hệ): nơi mà.\n- D. which (đại từ quan hệ): cái mà.\n\n2. Dịch nghĩa: Hãy đi thăm một bảo tàng nơi mà những bức tranh nổi tiếng nhất được trưng bày.\n\n3. Giải thích:\n- Danh từ 'museum' chỉ địa điểm.\n- Vế sau 'most famous paintings are displayed' là một hành động diễn ra TẠI địa điểm đó.\n- Where = In which (tại nơi mà). -> Chọn 'where'."
            },
            {
              "questionNumber": 4,
              "question": "34. The man ______ house is located on the hill is very friendly.",
              "answerOptions": [
                { "text": "whose", "isCorrect": true, "id": "A" },
                { "text": "who", "isCorrect": false, "id": "B" },
                { "text": "which", "isCorrect": false, "id": "C" },
                { "text": "when", "isCorrect": false, "id": "D" }
              ],
              "rationale": "1. Phân tích từ vựng:\n- A. whose (đại từ quan hệ): của ai.\n- B. who (đại từ quan hệ): người mà.\n- C. which (đại từ quan hệ): cái mà.\n- D. when (trạng từ quan hệ): khi mà.\n\n2. Dịch nghĩa: Người đàn ông mà có ngôi nhà nằm trên đồi thì rất thân thiện.\n\n3. Giải thích:\n- 'The man' (người) và 'house' (vật).\n- Ngôi nhà thuộc sở hữu của người đàn ông -> Dùng 'whose' để chỉ sở hữu."
            },
            {
              "questionNumber": 5,
              "question": "35. The countries ______ speak English as a first language are a minority.",
              "answerOptions": [
                { "text": "that", "isCorrect": false, "id": "A" },
                { "text": "who", "isCorrect": false, "id": "B" },
                { "text": "which", "isCorrect": true, "id": "C" },
                { "text": "where", "isCorrect": false, "id": "D" }
              ],
              "rationale": "1. Phân tích từ vựng:\n- A. that (đại từ quan hệ): cái mà/người mà.\n- B. who (đại từ quan hệ): người mà.\n- C. which (đại từ quan hệ): cái mà.\n- D. where (trạng từ quan hệ): nơi mà.\n\n2. Dịch nghĩa: Những quốc gia nói Tiếng Anh như ngôn ngữ mẹ đẻ là thiểu số.\n\n3. Giải thích:\n- 'Countries' là danh từ chỉ vật (quốc gia).\n- Động từ theo sau là 'speak' (nói), nên cần đại từ quan hệ đóng vai trò chủ ngữ.\n- 'Which' là đại từ quan hệ dùng cho vật làm chủ ngữ (đáp án C ưu tiên hơn that trong trắc nghiệm chuyên sâu)."
            },
            {
              "questionNumber": 6,
              "question": "36. All the students ______ participated in the exchange program improved their English skills.",
              "answerOptions": [
                { "text": "when", "isCorrect": false, "id": "A" },
                { "text": "whom", "isCorrect": false, "id": "B" },
                { "text": "that", "isCorrect": true, "id": "C" },
                { "text": "whose", "isCorrect": false, "id": "D" }
              ],
              "rationale": "1. Phân tích từ vựng:\n- A. when (trạng từ): khi mà.\n- B. whom (đại từ): người mà (tân ngữ).\n- C. that (đại từ): người mà/cái mà.\n- D. whose (đại từ): của ai.\n\n2. Dịch nghĩa: Tất cả những học sinh tham gia chương trình trao đổi đã cải thiện kỹ năng Tiếng Anh.\n\n3. Giải thích:\n- 'Students' là danh từ chỉ người.\n- Cần một chủ ngữ cho động từ 'participated'.\n- Trong các đáp án, 'who' không có, nên 'that' là lựa chọn đúng nhất. Ngoài ra, sau lượng từ 'All', người ta ưu tiên dùng 'that'."
            },
            {
              "questionNumber": 7,
              "question": "37. The biggest challenge ______ English learners face is pronunciation.",
              "answerOptions": [
                { "text": "which", "isCorrect": false, "id": "A" },
                { "text": "whose", "isCorrect": false, "id": "B" },
                { "text": "that", "isCorrect": true, "id": "C" },
                { "text": "who", "isCorrect": false, "id": "D" }
              ],
              "rationale": "1. Phân tích từ vựng:\n- A. which (đại từ): cái mà.\n- B. whose (đại từ): của ai.\n- C. that (đại từ): cái mà.\n- D. who (đại từ): người mà.\n\n2. Dịch nghĩa: Thử thách lớn nhất mà người học Tiếng Anh phải đối mặt là phát âm.\n\n3. Giải thích:\n- Danh từ 'challenge' đi kèm với so sánh nhất 'The biggest'.\n- Quy tắc: Sau so sánh nhất (superlatives), dùng 'that' thay vì 'which' hoặc 'who'."
            },
            {
              "questionNumber": 8,
              "question": "38. Some of the reasons ______ people learn English are for work or travel.",
              "answerOptions": [
                { "text": "where", "isCorrect": false, "id": "A" },
                { "text": "which", "isCorrect": false, "id": "B" },
                { "text": "when", "isCorrect": false, "id": "C" },
                { "text": "why", "isCorrect": true, "id": "D" }
              ],
              "rationale": "1. Phân tích từ vựng:\n- A. where (trạng từ): nơi mà.\n- B. which (đại từ): cái mà.\n- C. when (trạng từ): khi mà.\n- D. why (trạng từ): tại sao.\n\n2. Dịch nghĩa: Một vài lý do tại sao mọi người học Tiếng Anh là vì công việc hoặc du lịch.\n\n3. Giải thích:\n- Danh từ 'reasons' (lý do) luôn đi với trạng từ quan hệ 'why' (hoặc 'for which').\n- Cụm 'the reasons why' (lý do tại sao) là cụm cố định."
            },
            {
              "questionNumber": 9,
              "question": "39. He’s the guy ______ helped me learn Italian as a second language.",
              "answerOptions": [
                { "text": "what", "isCorrect": false, "id": "A" },
                { "text": "whom", "isCorrect": false, "id": "B" },
                { "text": "who", "isCorrect": true, "id": "C" },
                { "text": "whose", "isCorrect": false, "id": "D" }
              ],
              "rationale": "1. Phân tích từ vựng:\n- A. what (từ để hỏi/quan hệ): cái gì.\n- B. whom (đại từ): người mà (tân ngữ).\n- C. who (đại từ): người mà (chủ ngữ).\n- D. whose (đại từ): của ai.\n\n2. Dịch nghĩa: Anh ấy là chàng trai người mà đã giúp tôi học tiếng Ý như ngôn ngữ thứ hai.\n\n3. Giải thích:\n- 'The guy' là danh từ chỉ người.\n- Động từ 'helped' cần một chủ ngữ.\n- 'Who' là đại từ quan hệ chỉ người làm chủ ngữ."
            },

        let questions = [...rawData.questions];

        const totalQuestions = questions.length;

        // --- SHUFFLE FUNCTION (Fisher-Yates) ---
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Initialize Quiz
        function initQuiz() {
            // Shuffle questions
            questions = shuffle(questions);
            
            // Update counts
            document.getElementById('total-questions').textContent = totalQuestions;
            
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                // Clone options and assign original label based on index (A, B, C, D) before shuffling
                let currentOptions = q.answerOptions.map((opt, originalIndex) => ({
                    ...opt,
                    originalLabel: String.fromCharCode(65 + originalIndex) // 'A' + 0 = 'A', 'A' + 1 = 'B'
                }));
                
                // Shuffle the options
                currentOptions = shuffle(currentOptions);

                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.innerHTML = `
                    <div class="question-number">Câu ${index + 1}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid" id="options-${index}">
                        ${currentOptions.map((opt) => {
                            return `
                                <button class="option-btn" 
                                    onclick="checkAnswer(this, ${opt.isCorrect}, ${index})" 
                                    data-index="${index}"
                                    data-is-correct="${opt.isCorrect}">
                                    <div class="option-circle">${opt.originalLabel}</div>
                                    ${opt.text}
                                </button>
                            `;
                        }).join('')}
                    </div>
                    <div class="explanation-box" id="exp-${index}">
                        <div class="exp-header">
                            <i class="fas fa-lightbulb"></i> Ms. Chí Nên · ☎️ 0852639652giải thích chi tiết:
                        </div>
                        <div class="exp-content">${q.rationale}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Check Answer Function
        function checkAnswer(btn, isCorrect, questionIndex) {
            const parentGrid = document.getElementById(`options-${questionIndex}`);
            const buttons = parentGrid.querySelectorAll('.option-btn');
            
            // Disable all buttons in this question
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                // Handle Correct
                btn.classList.add('correct');
                score++;
                playSound('correct');
                
                // Confetti Effect
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00D26A', '#8854C0', '#00C9A7']
                });
            } else {
                // Handle Wrong
                btn.classList.add('wrong');
                btn.classList.add('shake');
                playSound('wrong');
                
                // Highlight the correct answer automatically by checking the data attribute
                const correctButton = Array.from(buttons).find(b => b.getAttribute('data-is-correct') === 'true');
                if (correctButton) {
                    correctButton.classList.add('correct');
                }
            }

            // Update Score
            answeredCount++;
            document.getElementById('current-score').textContent = score;

            // Show Explanation
            const expBox = document.getElementById(`exp-${questionIndex}`);
            expBox.classList.add('show');
        }

        // Finish Quiz
        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const finalScoreEl = document.getElementById('final-score-display');
            const cheerMsg = document.getElementById('cheer-msg');

            finalScoreEl.textContent = `${score}/${totalQuestions}`;

            // Generate cheer message
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                cheerMsg.textContent = "Xuất sắc! Ms. Chí Nên · ☎️ 0852639652rất tự hào về em! 🌟";

            } else if (percentage >= 80) {
                cheerMsg.textContent = "Làm tốt lắm! Cố gắng giữ phong độ nhé! 🔥";
            } else if (percentage >= 50) {
                cheerMsg.textContent = "Khá tốt! Ôn lại phần giải thích để hiểu sâu hơn nhé. 💪";
            } else {
                cheerMsg.textContent = "Đừng buồn nhé! Hãy đọc kỹ giải thích và thử lại nào. 🌱";
            }

            modal.classList.add('active');
            playSound('correct'); // Positive sound at end
        }
