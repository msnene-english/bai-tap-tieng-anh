<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh 9 - Unit 4 | Ms. Chí Nên</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh Ngọc */
            --correct-color: #00D26A; /* Xanh Lá */
            --wrong-color: #FF4757; /* Đỏ Cam */
            --bg-color: #F0F3F8;
            --card-bg: #FFFFFF;
            --text-color: #2F3542;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --btn-shadow: 0px 5px 0px 0px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dbedf7 15%, transparent 16%), radial-gradient(#dbedf7 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 20px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.3);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            font-size: 2rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            margin: 10px 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px var(--shadow-color);
            font-weight: 700;
            font-size: 1.1rem;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .score-box { color: var(--secondary-color); }
        .progress-box { color: var(--primary-color); }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            position: relative;
            border: 2px solid #eee;
        }

        .question-number {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #333;
        }

        .question-text u {
            text-decoration-color: var(--primary-color);
            text-decoration-thickness: 3px;
            text-underline-offset: 4px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 4px 0 #dcdcdc;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #dcdcdc;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background-color: var(--correct-color);
            border-color: #00B85C;
            color: white;
            box-shadow: 0 4px 0 #009E4F;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            border-color: #E63B4B;
            color: white;
            box-shadow: 0 4px 0 #C92D3C;
            animation: shake 0.5s;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
            pointer-events: none;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background-color: #F8F9FA;
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            border-radius: 10px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .teacher-badge {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .teacher-badge span { margin-right: 10px; font-size: 1.5rem; }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #444;
            white-space: pre-wrap; /* Preserve line breaks */
        }
        
        .explanation-content strong {
            color: var(--primary-color);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Footer */
        .footer-controls {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 40px;
        }

        .submit-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #009e83;
            transition: all 0.2s;
        }

        .submit-btn:hover { transform: scale(1.05); }
        .submit-btn:active { transform: scale(0.95) translateY(4px); box-shadow: 0 2px 0 #009e83; }

    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <header>
            <h1>Bài Kiểm Tra Tiếng Anh 9 - Unit 4</h1>
            <p>Giáo viên hướng dẫn: <strong>Ms. Chí Nên · ☎️ 0852639652 ()</strong></p>
        </header>

        <div class="stats-bar">
            <div class="score-box">Điểm số: <span id="score">0</span></div>
            <div class="progress-box">Câu: <span id="current-progress">0</span>/30</div>
        </div>

        <div id="quiz-container">
            <!-- Questions will be injected here via JavaScript -->
        </div>

        <div class="footer-controls">
            <button class="submit-btn" onclick="finishQuiz()">Nộp Bài & Xem Tổng Kết</button>
        </div>
    </div>

    <script>
        // --- 1. DATA SOURCE ---
        const quizData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "Can you ______ the definition of that word in the dictionary?",
              "answerOptions": [
                { "text": "look up", "isCorrect": true },
                { "text": "look over", "isCorrect": false },
                { "text": "look through", "isCorrect": false },
                { "text": "look at", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. look up (phrasal verb): tra cứu (từ điển, thông tin).\nB. look over (phrasal verb): xem qua, kiểm tra nhanh.\nC. look through (phrasal verb): đọc lướt, xem lướt qua.\nD. look at (phrasal verb): nhìn vào.\n\n2. Dịch nghĩa toàn câu: \"Bạn có thể tra cứu định nghĩa của từ đó trong từ điển được không?\"\n\n3. Giải thích chi tiết:\n- Cụm từ \"in the dictionary\" (trong từ điển) là dấu hiệu cho hành động \"tra cứu\". \"Look up\" là thuật ngữ chuyên dùng cho việc tìm kiếm từ vựng.\n\n4. Tại sao SAI:\n- Các từ còn lại không đi với ngữ cảnh tra từ điển."
            },
            {
              "questionNumber": 2,
              "question": "India is a country with a rich linguistic heritage. The Indian Constitution recognizes 22 ______ languages.",
              "answerOptions": [
                { "text": "bilingual", "isCorrect": false },
                { "text": "official", "isCorrect": true },
                { "text": "first", "isCorrect": false },
                { "text": "second", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. bilingual (adj): song ngữ.\nB. official (adj): chính thức.\nC. first (adj): đầu tiên (tiếng mẹ đẻ).\nD. second (adj): thứ hai.\n\n2. Dịch nghĩa toàn câu: \"Ấn Độ là một quốc gia có di sản ngôn ngữ phong phú. Hiến pháp Ấn Độ công nhận 22 ngôn ngữ chính thức.\"\n\n3. Giải thích chi tiết:\n- \"Recognizes\" (công nhận) trong bối cảnh Hiến pháp (Constitution) đi với \"official languages\" (ngôn ngữ chính thức).\n\n4. Tại sao SAI:\n- Bilingual là người nói 2 thứ tiếng. First/Second không dùng cho danh sách ngôn ngữ quốc gia trong hiến pháp."
            },
            {
              "questionNumber": 3,
              "question": "If you’re interested in visiting a historic castle in the UK, you could travel to ______, the capital of Wales.",
              "answerOptions": [
                { "text": "Cardiff", "isCorrect": true },
                { "text": "Edinburgh", "isCorrect": false },
                { "text": "Oxford", "isCorrect": false },
                { "text": "Belfast", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. Cardiff (noun): Thủ đô của xứ Wales.\nB. Edinburgh (noun): Thủ đô của Scotland.\nC. Oxford (noun): Thành phố đại học ở Anh.\nD. Belfast (noun): Thủ đô của Bắc Ireland.\n\n2. Dịch nghĩa toàn câu: \"Nếu bạn hứng thú tham quan lâu đài lịch sử ở Anh, bạn có thể đến Cardiff, thủ đô của xứ Wales.\"\n\n3. Giải thích chi tiết:\n- Cardiff là thủ đô của Wales (kiến thức địa lý)."
            },
            {
              "questionNumber": 4,
              "question": "In China, Japan and Vietnam, English is spoken as a(n) ______ language.",
              "answerOptions": [
                { "text": "official", "isCorrect": false },
                { "text": "second", "isCorrect": false },
                { "text": "primary", "isCorrect": false },
                { "text": "foreign", "isCorrect": true }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. official (adj): chính thức.\nB. second (adj): thứ hai.\nC. primary (adj): chính/chủ yếu.\nD. foreign (adj): nước ngoài.\n\n2. Dịch nghĩa toàn câu: \"Ở Trung Quốc, Nhật Bản và Việt Nam, tiếng Anh được nói như một ngoại ngữ.\"\n\n3. Giải thích chi tiết:\n- Ở 3 nước này (thuộc Expanding Circle), tiếng Anh là môn học ngoại ngữ (English as a Foreign Language - EFL), không phải ngôn ngữ hành chính hay giao tiếp xã hội phổ biến."
            },
            {
              "questionNumber": 5,
              "question": "English borrows words from many languages. “Karaoke” is a fun example of a word borrowed from ______.",
              "answerOptions": [
                { "text": "Spanish", "isCorrect": false },
                { "text": "French", "isCorrect": false },
                { "text": "Italian", "isCorrect": false },
                { "text": "Japanese", "isCorrect": true }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. Spanish: Tây Ban Nha.\nB. French: Pháp.\nC. Italian: Ý.\nD. Japanese: Nhật Bản.\n\n2. Dịch nghĩa toàn câu: \"Tiếng Anh vay mượn từ nhiều ngôn ngữ. 'Karaoke' là ví dụ thú vị về từ mượn từ tiếng Nhật.\"\n\n3. Giải thích chi tiết:\n- Karaoke xuất phát từ Nhật Bản (Kara = Không, Oke = Dàn nhạc)."
            },
            {
              "questionNumber": 6,
              "question": "The teacher ______ over some mistakes that students made in their essays.",
              "answerOptions": [
                { "text": "went", "isCorrect": true },
                { "text": "caused", "isCorrect": false },
                { "text": "took", "isCorrect": false },
                { "text": "made", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. caused (verb): gây ra.\nB. took (verb): lấy.\nC. went (verb - quá khứ go): đi.\nD. made (verb): làm.\n*Phrasal verb:* go over: xem xét kỹ/chữa bài.\n\n2. Dịch nghĩa toàn câu: \"Giáo viên đã xem xét kỹ một số lỗi sai mà học sinh mắc phải trong bài luận.\"\n\n3. Giải thích chi tiết:\n- \"Go over\" (quá khứ là \"went over\") nghĩa là examine/check details, rất hợp với việc sửa lỗi bài tập."
            },
            {
              "questionNumber": 7,
              "question": "English has borrowed words for many delicious dishes, like pizza from Italian and ______ from Vietnamese.",
              "answerOptions": [
                { "text": "taco", "isCorrect": false },
                { "text": "ramen", "isCorrect": false },
                { "text": "banh mi", "isCorrect": true },
                { "text": "kimchi", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. taco (noun): bánh Taco (Mexico).\nB. ramen (noun): mì Ramen (Nhật).\nC. banh mi (noun): bánh mì (Việt Nam).\nD. kimchi (noun): kim chi (Hàn Quốc).\n\n2. Dịch nghĩa toàn câu: \"Tiếng Anh đã vay mượn từ vựng cho nhiều món ăn ngon, như pizza từ tiếng Ý và bánh mì từ tiếng Việt.\"\n\n3. Giải thích chi tiết:\n- \"Banh mi\" là từ tiếng Việt đã được Oxford công nhận."
            },
            {
              "questionNumber": 8,
              "question": "They invited some famous ______ to be the judges for an English debating contest.",
              "answerOptions": [
                { "text": "linguists", "isCorrect": true },
                { "text": "doctors", "isCorrect": false },
                { "text": "coaches", "isCorrect": false },
                { "text": "accountants", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. doctors (noun): bác sĩ.\nB. linguists (noun): nhà ngôn ngữ học.\nC. coaches (noun): huấn luyện viên.\nD. accountants (noun): kế toán.\n\n2. Dịch nghĩa toàn câu: \"Họ đã mời một số nhà ngôn ngữ học nổi tiếng làm giám khảo cho cuộc thi tranh biện tiếng Anh.\"\n\n3. Giải thích chi tiết:\n- Giám khảo cuộc thi ngôn ngữ cần người có chuyên môn ngôn ngữ -> Linguists."
            },
            {
              "questionNumber": 9,
              "question": "Knowing a wide range of English words helps you understand more complex ______.",
              "answerOptions": [
                { "text": "vocabulary", "isCorrect": true },
                { "text": "fluency", "isCorrect": false },
                { "text": "accent", "isCorrect": false },
                { "text": "pronunciation", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. fluency (noun): sự trôi chảy.\nB. accent (noun): giọng điệu.\nC. vocabulary (noun): từ vựng.\nD. pronunciation (noun): phát âm.\n\n2. Dịch nghĩa toàn câu: \"Biết nhiều từ tiếng Anh giúp bạn hiểu được các từ vựng phức tạp hơn.\"\n\n3. Giải thích chi tiết:\n- Biết nhiều từ (range of words) tương ứng với vốn từ vựng (vocabulary). Pronunciation, accent, fluency là kỹ năng nói."
            },
            {
              "questionNumber": 10,
              "question": "English was the ______ that the three tribes spoke after they settled in Britain.",
              "answerOptions": [
                { "text": "language", "isCorrect": true },
                { "text": "voice", "isCorrect": false },
                { "text": "speech", "isCorrect": false },
                { "text": "statement", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. voice (noun): giọng nói.\nB. speech (noun): lời nói.\nC. statement (noun): tuyên bố.\nD. language (noun): ngôn ngữ.\n\n2. Dịch nghĩa toàn câu: \"Tiếng Anh là ngôn ngữ mà ba bộ tộc đã nói sau khi họ định cư ở Anh.\"\n\n3. Giải thích chi tiết:\n- Tiếng Anh là một hệ thống giao tiếp chung -> Language."
            },
            {
              "questionNumber": 11,
              "question": "The English language today has progressed through several ______ throughout history.",
              "answerOptions": [
                { "text": "forms", "isCorrect": true },
                { "text": "versions", "isCorrect": false },
                { "text": "generations", "isCorrect": false },
                { "text": "drafts", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. versions: phiên bản (phần mềm/sách).\nB. generations: thế hệ (người).\nC. drafts: bản nháp.\nD. forms: hình thức/dạng.\n\n2. Dịch nghĩa toàn câu: \"Ngôn ngữ tiếng Anh ngày nay đã phát triển qua nhiều hình thức trong suốt lịch sử.\"\n\n3. Giải thích chi tiết:\n- Tiếng Anh có các \"forms\" (dạng) như Old, Middle, Modern English. \"Forms\" là từ chính xác nhất về mặt ngôn ngữ học lịch sử."
            },
            {
              "questionNumber": 12,
              "question": "Many people believe that the Angles, Saxons, and Jutes ______ English.",
              "answerOptions": [
                { "text": "invented", "isCorrect": true },
                { "text": "made", "isCorrect": false },
                { "text": "discovered", "isCorrect": false },
                { "text": "found", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. invented (verb): phát minh/sáng tạo ra.\nB. made (verb): làm ra.\nC. discovered (verb): khám phá ra.\nD. found (verb): tìm thấy.\n\n2. Dịch nghĩa toàn câu: \"Nhiều người tin rằng người Angles, Saxons và Jutes đã sáng tạo ra tiếng Anh.\"\n\n3. Giải thích chi tiết:\n- Trong bối cảnh nguồn gốc, \"invented\" được dùng để chỉ việc các bộ tộc này tạo ra nền tảng ngôn ngữ mới (từ con số 0 hoặc kết hợp các phương ngữ)."
            },
            {
              "questionNumber": 13,
              "question": "Another way of conceptualizing learning in English is to view it through the lens of the various ______ of the subject.",
              "answerOptions": [
                { "text": "varieties", "isCorrect": true },
                { "text": "rules", "isCorrect": false },
                { "text": "standards", "isCorrect": false },
                { "text": "models", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. varieties (noun): các biến thể.\nB. rules (noun): quy tắc.\nC. standards (noun): tiêu chuẩn.\nD. models (noun): mô hình.\n\n2. Dịch nghĩa toàn câu: \"Một cách khác để hình dung việc học tiếng Anh là nhìn nó qua lăng kính của các biến thể khác nhau của môn học này.\"\n\n3. Giải thích chi tiết:\n- \"Varieties of English\" (Anh-Anh, Anh-Mỹ, Anh-Úc...) là thuật ngữ chuyên ngành."
            },
            {
              "questionNumber": 14,
              "question": "I can ______ the document into multiple languages to cater to a global audience.",
              "answerOptions": [
                { "text": "translate", "isCorrect": true },
                { "text": "copy", "isCorrect": false },
                { "text": "get", "isCorrect": false },
                { "text": "look", "isCorrect": false }
              ],
              "rationale": "1. Phân tích từ vựng:\nA. copy (verb): sao chép.\nB. translate (verb): dịch.\nC. get (verb): lấy.\nD. look (verb): nhìn.\n\n2. Dịch nghĩa toàn câu: \"Tôi có thể dịch tài liệu sang nhiều ngôn ngữ để phục vụ khán giả toàn cầu.\"\n\n3. Giải thích chi tiết:\n- Cấu trúc \"translate ... into\" (dịch sang) là chính xác."
            },
            {
              "questionNumber": 15,
              "question": "When I was in France, I ______ some French words.",
              "answerOptions": [
                { "text": "picked up", "isCorrect": true },
                { "text": "held up", "isCorrect": false },
                { "text": "copied up", "isCorrect": false },
                { "text": "got up", "isCorrect": false }
              ],

            {

              ],
              "rationale": "1. Phân tích từ vựng:\nA. Immigrants (noun): Người nhập cư (đến ở hẳn).\nB. Migration (noun): Sự di cư.\nC. Migrants (noun): Người di cư (chung chung/tạm thời).\nD. Immigration (noun): Sự nhập cư.\n\n2. Dịch nghĩa toàn câu: \"Những người nhập cư vào Hoa Kỳ phải vượt qua một bài kiểm tra năng lực tiếng Anh.\"\n\n3. Giải thích chi tiết:\n- Cần danh từ chỉ người làm chủ ngữ. \"Immigrants to the US\" là cụm từ chính xác chỉ những người chuyển đến Mỹ định cư."
            },
            {

              "question": "With so many online resources available, it’s easier than ever to ______ basic English on your own.",
              "answerOptions": [

              ],
              "rationale": "1. Phân tích từ vựng:\nA. look up: tra cứu.\nB. go over: xem lại.\nC. pick up: học được/nắm bắt được nhanh.\nD. copy: sao chép.\n\n2. Dịch nghĩa toàn câu: \"Với quá nhiều tài nguyên trực tuyến, việc tự học (nắm bắt) tiếng Anh cơ bản dễ dàng hơn bao giờ hết.\"\n\n3. Giải thích chi tiết:\n- Pick up = Learn naturally/easily without formal instruction. Phù hợp ngữ cảnh \"on your own\" (tự học)."
            }
          ]
        };

        // --- 2. LOGIC ---
        let score = 0;
        let answeredCount = 0;
        const totalQuestions = quizData.questions.length;
        
        // Audio Objects (Using Base64 for single file portability)
        // Short beep for correct
        const correctSound = new Audio("data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbqWEzM2CfutmuYDY0YJ+62a5gNjRgn7rZrmA2NGCfutmuYDY0YJ+62a5gNjRgn7rZrmA2NGCfutmuYDY0YJ+62a5gNjRgAAAAAA=="); 
        // We will just use a visual cue mainly, but here is a simple function for synthetic sound
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Shuffle function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            // Shuffle questions
            const shuffledQuestions = [...quizData.questions];
            shuffleArray(shuffledQuestions);

            shuffledQuestions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-${index}`;

                // Parse Rationale to HTML (convert \n to <br>)
                const rationaleHtml = q.rationale.replace(/\n/g, '<br>');

                // Format Question Text (Handle blanks)
                // If question has '______', we keep it as is.
                
                card.innerHTML = `
                    <div class="question-number">Câu ${index + 1}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid" id="opt-grid-${index}">
                        <!-- Options injected here -->
                    </div>
                    <div class="explanation-box" id="exp-${index}">
                        <div class="teacher-badge"><span>👩‍🏫</span> Ms. Chí Nên · ☎️ 0852639652giải thích:</div>
                        <div class="explanation-content">${rationaleHtml}</div>
                    </div>
                `;

                container.appendChild(card);
                
                // --- NEW SHUFFLE LOGIC FOR OPTIONS ---
                // Clone the options array so we don't mess up the original order permanently (optional but good practice)
                const shuffledOptions = [...q.answerOptions];
                shuffleArray(shuffledOptions);

                // Render Options
                const optGrid = document.getElementById(`opt-grid-${index}`);
                shuffledOptions.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.text;
                    // Note: We still pass shuffledOptions to checkAnswer so the loop inside checkAnswer works correctly
                    btn.onclick = () => checkAnswer(btn, opt.isCorrect, index, shuffledOptions);
                    optGrid.appendChild(btn);
                });
            });
        }

        function checkAnswer(selectedBtn, isCorrect, questionIndex, allOptions) {
            const optGrid = document.getElementById(`opt-grid-${questionIndex}`);
            const buttons = optGrid.getElementsByClassName('option-btn');
            const expBox = document.getElementById(`exp-${questionIndex}`);

            // Prevent re-answering
            if (selectedBtn.classList.contains('disabled')) return;

            // Disable all buttons in this card
            for (let btn of buttons) {
                btn.classList.add('disabled');
                // Highlight the correct answer anyway if user chose wrong
                const optText = btn.innerText;
                const optData = allOptions.find(o => o.text === optText);
                if (optData.isCorrect) {
                    btn.classList.add('correct');
                }
            }

            if (isCorrect) {
                // selectedBtn.classList.add('correct'); // Already handled above loop logic slightly
                playSound('correct');
                fireConfetti(selectedBtn);
                score++;
                document.getElementById('score').innerText = score;
            } else {
                selectedBtn.classList.add('wrong');
                playSound('wrong');
            }

            answeredCount++;
            document.getElementById('current-progress').innerText = answeredCount;

            // Show explanation
            expBox.style.display = 'block';
        }

        // --- 3. CONFETTI EFFECT ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let confetti = [];

        function fireConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 30; i++) {
                confetti.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() - 1) * 10,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 5 + 3,
                    life: 100
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < confetti.length; i++) {
                const p = confetti[i];
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.2; // Gravity
                p.life--;
                p.size *= 0.96;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.life <= 0) {
                    confetti.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(updateConfetti);
        }
        updateConfetti();

        // --- 4. FINISH QUIZ ---
        function finishQuiz() {
            const percentage = Math.round((score / totalQuestions) * 100);
            let message = "";
            if (percentage === 100) message = "Xuất sắc! Em là thiên tài ngôn ngữ! 🌟";
            else if (percentage >= 80) message = "Làm tốt lắm! Em rất chăm chỉ! 💪";
            else if (percentage >= 50) message = "Cố gắng lên! Em đang tiến bộ từng ngày! 🌱";
            else message = "Đừng nản chí! Hãy xem kỹ phần giải thích nhé! 📚";

            alert(`TỔNG KẾT\n\nSố câu đúng: ${score}/${totalQuestions}\n${message}`);
        }

        // Resize canvas on window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start
        window.onload = initQuiz;

    </script>
