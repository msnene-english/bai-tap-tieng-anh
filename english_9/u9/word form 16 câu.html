<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7: Word Forms - Ms. Chí Nên</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-bg: #f0f4f8;
            --main-pink: #8854C0;
            --main-teal: #00C9A7;
            --correct-green: #00D26A;
            --correct-shadow: #00a352;
            --wrong-red: #FF4757;
            --wrong-shadow: #d6303e;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --btn-shadow: 0 5px 0 rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--primary-bg);
            background-image: radial-gradient(#e2e8f0 10%, transparent 10%), radial-gradient(#e2e8f0 10%, transparent 10%);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 80px; /* Space for footer */
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--main-pink), #a29bfe);
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.3);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .header p {
            margin: 10px 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .badge-teacher {
            background: white;
            color: var(--main-pink);
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Card Style */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 #dfe4ea, 0 15px 20px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.3s ease;
            border: 2px solid #f1f2f6;
        }

        .question-number {
            background: var(--main-teal);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 3px 0 #009e82;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #2f3542;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 3D Button Style */
        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-bottom: 5px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #57606f;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #ced6e0;
            background-color: #f8f9fa;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 0px;
            margin-top: 5px;
        }

        /* Correct State */
        .option-btn.correct {
            background-color: var(--correct-green) !important;
            border-color: var(--correct-shadow) !important;
            border-bottom-color: var(--correct-shadow) !important;
            color: white !important;
            transform: translateY(4px);
            border-bottom-width: 0px;
            margin-bottom: 5px; /* Offset margin because border is gone */
        }

        /* Wrong State */
        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-color: var(--wrong-shadow) !important;
            border-bottom-color: var(--wrong-shadow) !important;
            color: white !important;
            animation: shake 0.5s;
        }

        /* Dim other options */
        .question-card.answered .option-btn:not(.correct):not(.wrong) {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f1f2f6;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #f8f0ff; /* Light purple tint */
            border: 2px solid var(--main-pink);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--main-pink);
            font-weight: 800;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px dashed rgba(136, 84, 192, 0.3);
            padding-bottom: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #4a4a4a;
            white-space: pre-wrap; /* Preserve formatting from JSON */
        }

        /* Footer Control */
        .footer-control {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .score-display {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--main-teal);
        }

        .submit-btn {
            background: var(--main-pink);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #6c429c;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal for Final Result */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-score {
            font-size: 4rem;
            font-weight: 900;
            color: var(--main-pink);
            margin: 20px 0;
        }

        .modal-message {
            font-size: 1.2rem;
            color: #57606f;
            margin-bottom: 30px;
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Utility for underlined text in Phonetics/general */
        u {
            text-decoration-color: var(--main-pink);
            text-decoration-thickness: 3px;
            text-underline-offset: 3px;
        }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>

        <span class="badge-teacher"><i class="fas fa-chalkboard-teacher"></i> Ms. Chí Nên · ☎️ 0852639652</span>

    <div class="quiz-container" id="quiz-container">
        <!-- Questions will be injected here by JS -->
    </div>

    <!-- Padding for footer -->
    <div style="height: 60px;"></div>

    <div class="footer-control">
        <div class="score-display">
            <i class="fas fa-star text-yellow-400"></i> Điểm: <span id="current-score">0</span> / <span id="total-questions">0</span>

        <button class="submit-btn" onclick="finishQuiz()">
            <i class="fas fa-flag-checkered"></i> Nộp Bài
        </button>

    <!-- Modal Result -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2 style="color: var(--main-teal); font-weight: 800;">TỔNG KẾT</h2>
            <div class="modal-score" id="final-score">0/0</div>

            <button class="submit-btn" onclick="location.reload()">Làm lại bài</button>
        </div>
    </div>

    <!-- Sound Effects -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sound-finish" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <script>
        // Data from the provided JSON
        const quizData = [
    {
      "questionNumber": 1,
      "question": "When a person is ___________________ in a language, they can speak a language easily and well. (fluency)",
      "answerOptions": [
        { "text": "fluent", "isCorrect": true },
        { "text": "fluency", "isCorrect": false },
        { "text": "fluently", "isCorrect": false },
        { "text": "fluencies", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. fluent (adj): trôi chảy, lưu loát.\nB. fluency (noun): sự trôi chảy.\nC. fluently (adv): một cách trôi chảy.\nD. fluencies (noun - số nhiều): các sự trôi chảy.\n\n2. Dịch nghĩa toàn câu: \"Khi một người lưu loát một ngôn ngữ, họ có thể nói ngôn ngữ đó một cách dễ dàng và tốt.\"\n\n3. Giải thích chi tiết:\n- Vị trí cần điền đứng sau động từ to be \"is\" và nói về tính chất của \"a person\".\n- Cần một tính từ (Adjective).\n- Cấu trúc: be + fluent + in + language."
    },
    {
      "questionNumber": 2,
      "question": "The government has decided that ___________________ is the official language. (England)",
      "answerOptions": [
        { "text": "English", "isCorrect": true },
        { "text": "England", "isCorrect": false },
        { "text": "Englander", "isCorrect": false },
        { "text": "Englishness", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. England (noun): Nước Anh.\nB. English (noun/adj): Tiếng Anh / Người Anh / Thuộc về nước Anh.\nC. Englander (noun): Người Anh (ít dùng).\nD. Englishness (noun): Tính chất Anh.\n\n2. Dịch nghĩa toàn câu: \"Chính phủ đã quyết định rằng Tiếng Anh là ngôn ngữ chính thức.\"\n\n3. Giải thích chi tiết:\n- Ngữ cảnh nói về \"official language\" (ngôn ngữ chính thức).\n- Từ cần điền là tên một ngôn ngữ -> English."
    },
    {
      "questionNumber": 3,
      "question": "The new student is a recent ___________________ to the US from Germany. (immigrate)",
      "answerOptions": [
        { "text": "immigrant", "isCorrect": true },
        { "text": "immigration", "isCorrect": false },
        { "text": "immigrate", "isCorrect": false },
        { "text": "immigrated", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. immigrate (verb): nhập cư.\nB. immigrant (noun): người nhập cư.\nC. immigration (noun): sự nhập cư.\nD. immigrated (verb - past): đã nhập cư.\n\n2. Dịch nghĩa toàn câu: \"Học sinh mới là một người nhập cư gần đây đến Mỹ từ Đức.\"\n\n3. Giải thích chi tiết:\n- Trước chỗ trống là mạo từ \"a\" và tính từ \"recent\".\n- Cần một Danh từ chỉ người (vì chủ ngữ là \"The new student\"). -> Immigrant."
    },
    {
      "questionNumber": 4,
      "question": "When English borrowed words, it kept the original ___________________ from the original languages. (spell)",
      "answerOptions": [
        { "text": "spelling", "isCorrect": true },
        { "text": "spell", "isCorrect": false },
        { "text": "speller", "isCorrect": false },
        { "text": "spelled", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. spell (verb): đánh vần.\nB. spelling (noun): cách viết/chính tả.\nC. speller (noun): người đánh vần.\nD. spelled (verb - past): đã đánh vần.\n\n2. Dịch nghĩa toàn câu: \"Khi tiếng Anh vay mượn từ vựng, nó giữ nguyên cách viết gốc từ các ngôn ngữ gốc.\"\n\n3. Giải thích chi tiết:\n- Sau tính từ \"original\" (gốc) cần một Danh từ.\n- \"Spelling\" là danh từ chỉ cách viết hoặc chính tả của từ."
    },
    {
      "questionNumber": 5,
      "question": "My cousin specialises in ___________________ from Danish into English. (translate)",
      "answerOptions": [
        { "text": "translation", "isCorrect": true },
        { "text": "translator", "isCorrect": false },
        { "text": "translate", "isCorrect": false },
        { "text": "translated", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. translate (verb): dịch.\nB. translation (noun): việc dịch thuật / bản dịch.\nC. translator (noun): biên dịch viên.\nD. translated (verb - past): đã dịch.\n\n2. Dịch nghĩa toàn câu: \"Em họ tôi chuyên về việc dịch thuật từ tiếng Đan Mạch sang tiếng Anh.\"\n\n3. Giải thích chi tiết:\n- Sau giới từ \"in\" cần một Danh từ (Noun) hoặc V-ing.\n- \"Translation\" (lĩnh vực dịch thuật) là từ phù hợp nhất khi nói về chuyên môn (specialises in)."
    },
    {
      "questionNumber": 6,
      "question": "A good translator needs to pay ___________________ to people’s tone when they speak as well. (attend)",
      "answerOptions": [
        { "text": "attention", "isCorrect": true },
        { "text": "attentive", "isCorrect": false },
        { "text": "attend", "isCorrect": false },
        { "text": "attendant", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. attend (verb): tham dự/chú ý.\nB. attention (noun): sự chú ý.\nC. attentive (adj): chăm chú.\nD. attendant (noun): người phục vụ.\n\n2. Dịch nghĩa toàn câu: \"Một biên dịch viên giỏi cần phải chú ý đến giọng điệu của mọi người khi họ nói nữa.\"\n\n3. Giải thích chi tiết:\n- Cấu trúc cố định (Collocation): \"Pay attention to\" (Chú ý đến cái gì)."
    },
    {
      "questionNumber": 7,
      "question": "She is ___________________ in three languages, which allows her to easily communicate with people from different countries. (fluency)",
      "answerOptions": [
        { "text": "fluent", "isCorrect": true },
        { "text": "fluency", "isCorrect": false },
        { "text": "fluently", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. fluent (adj): lưu loát.\nB. fluency (noun): sự lưu loát.\nC. fluently (adv): một cách lưu loát.\n\n2. Dịch nghĩa toàn câu: \"Cô ấy lưu loát 3 ngôn ngữ, điều này cho phép cô ấy dễ dàng giao tiếp với mọi người từ các quốc gia khác nhau.\"\n\n3. Giải thích chi tiết:\n- Sau động từ to be \"is\", cần một Tính từ để miêu tả cô ấy.\n- Cấu trúc: to be fluent in (thành thạo/lưu loát ngôn ngữ nào)."
    },
    {
      "questionNumber": 8,
      "question": "The city has a diverse population, with ___________________ from various countries contributing to its cultural richness. (immigrate)",
      "answerOptions": [
        { "text": "immigrants", "isCorrect": true },
        { "text": "immigration", "isCorrect": false },
        { "text": "immigrates", "isCorrect": false },
        { "text": "immigrant", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. immigrants (noun - số nhiều): những người nhập cư.\nB. immigration (noun): sự nhập cư.\nC. immigrates (verb): nhập cư.\nD. immigrant (noun - số ít): người nhập cư.\n\n2. Dịch nghĩa toàn câu: \"Thành phố có dân số đa dạng, với những người nhập cư từ nhiều quốc gia khác nhau đóng góp vào sự phong phú văn hóa của nó.\"\n\n3. Giải thích chi tiết:\n- Sau giới từ \"with\" cần danh từ.\n- Ngữ cảnh \"from various countries\" (từ nhiều quốc gia) gợi ý số nhiều.\n- Chỉ người (people) nên dùng \"immigrants\"."
    },
    {
      "questionNumber": 9,
      "question": "The conference featured renowned ___________________ who shared their expertise on a wide range of topics. (speak)",
      "answerOptions": [
        { "text": "speakers", "isCorrect": true },
        { "text": "speech", "isCorrect": false },
        { "text": "speaking", "isCorrect": false },
        { "text": "speak", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. speak (verb): nói.\nB. speakers (noun - số nhiều): diễn giả/người nói.\nC. speaking (noun/verb): việc nói.\nD. speech (noun): bài phát biểu.\n\n2. Dịch nghĩa toàn câu: \"Hội nghị có sự góp mặt của các diễn giả nổi tiếng, những người đã chia sẻ chuyên môn của họ về nhiều chủ đề.\"\n\n3. Giải thích chi tiết:\n- Cần danh từ chỉ người (vì phía sau có đại từ quan hệ \"who\").\n- \"Renowned\" (nổi tiếng) bổ nghĩa cho danh từ.\n- Nhiều người (their expertise) -> Số nhiều: Speakers."
    },
    {
      "questionNumber": 10,
      "question": "English is the ___________________ language of many countries, including the United Kingdom and the United States. (office)",
      "answerOptions": [
        { "text": "official", "isCorrect": true },
        { "text": "office", "isCorrect": false },
        { "text": "officer", "isCorrect": false },
        { "text": "officially", "isCorrect": false }
      ],
      "explanation": "1. Phân tích từ vựng:\nA. office (noun): văn phòng.\nB. official (adj): chính thức / thuộc về chính quyền.\nC. officer (noun): sĩ quan/viên chức.\nD. officially (adv): một cách chính thức.\n\n2. Dịch nghĩa toàn câu: \"Tiếng Anh là ngôn ngữ chính thức của nhiều quốc gia, bao gồm Vương quốc Anh và Hoa Kỳ.\"\n\n3. Giải thích chi tiết:\n- Đứng trước danh từ \"language\" cần một Tính từ bổ nghĩa.\n- \"Official language\" là cụm từ cố định (ngôn ngữ chính thức/hành chính)."
    },
    {
      "questionNumber": 11,
      "question": "English, with its numerous ___________________ like British, American, and Australian, is widely spoken as an international language. (various)",
      "answerOptions": [
        { "text": "varieties", "isCorrect": true },
        { "text": "variety", "isCorrect": false },
        { "text": "various", "isCorrect": false },
        { "text": "vary", "isCorrect": false }
      ],

        // Shuffle function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let score = 0;
        let answeredCount = 0;
        const totalQuestions = quizData.length;

        // Shuffle questions initially
        shuffleArray(quizData);

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            document.getElementById('total-questions').innerText = totalQuestions;
            
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${index}`;

                // Header of card
                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerHTML = `<i class="fas fa-question-circle"></i> Câu ${index + 1}`;
                
                const qText = document.createElement('div');
                qText.className = 'question-text';
                // Replace blank lines with a more visible underscore line
                let displayText = item.question.replace(/_+/g, '_______________');
                qText.innerText = displayText;

                // Options Container
                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                // Shuffle options
                // Create a copy to shuffle options without affecting answer checking logic via index if we used index
                // But here we use 'text' and 'isCorrect' directly.
                // We need to keep track of the original index or just shuffle the object array.
                // Since options are objects, we can shuffle them.
                const shuffledOptions = [...item.answerOptions];
                shuffleArray(shuffledOptions);

                shuffledOptions.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.text;
                    btn.onclick = (e) => handleAnswer(index, opt.isCorrect, e.target, item.explanation);
                    optionsGrid.appendChild(btn);
                });

                // Explanation Container
                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp-${index}`;
                expBox.innerHTML = `
                    <div class="explanation-header"><i class="fas fa-glasses"></i> Ms. Chí Nên · ☎️ 0852639652giải thích chi tiết:</div>
                    <div class="explanation-content">${item.explanation}</div>
                `;

                card.appendChild(qNum);
                card.appendChild(qText);
                card.appendChild(optionsGrid);
                card.appendChild(expBox);
                container.appendChild(card);
            });
        }

        function handleAnswer(cardIndex, isCorrect, btnElement, explanation) {
            const card = document.getElementById(`card-${cardIndex}`);
            
            // Prevent re-answering
            if (card.classList.contains('answered')) return;
            card.classList.add('answered');
            answeredCount++;

            const allBtns = card.querySelectorAll('.option-btn');
            
            if (isCorrect) {
                // Logic Correct
                btnElement.classList.add('correct');
                playAudio('sound-correct');
                score++;
                updateScore();
                triggerConfetti(btnElement);
            } else {
                // Logic Wrong
                btnElement.classList.add('wrong');
                playAudio('sound-wrong');
                // Highlight the correct one
                allBtns.forEach(btn => {
                    // Find the button text that corresponds to correct option in data
                    // Since we passed isCorrect, we need to find which button has isCorrect=true attached logic
                    // But wait, the closure has 'opt.isCorrect'. We need to find the correct button visually.
                    // Let's iterate options data again? Or easier:
                    // In the render loop, we didn't add data attribute. Let's fix that conceptually.
                    // Actually, we can just find the button with the text that is correct.
                    // A simpler way:
                    // We need to know which text was correct.
                    const questionObj = quizData[cardIndex]; // Note: quizData is shuffled. 
                    // This index logic matches render order because render iterates quizData.
                    const correctOption = questionObj.answerOptions.find(o => o.isCorrect);
                    
                    if (btn.innerText === correctOption.text) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Show explanation
            const expBox = document.getElementById(`exp-${cardIndex}`);
            expBox.style.display = 'block';
        }

        function updateScore() {
            const scoreEl = document.getElementById('current-score');
            // Animate number
            let start = parseInt(scoreEl.innerText);
            scoreEl.innerText = score;
        }

        function playAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio play failed interaction required"));
            }
        }

        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            // Normalized coordinates (0 to 1)
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { x: x, y: y },
                colors: ['#8854C0', '#00C9A7', '#ffeb3b']
            });
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const scoreText = document.getElementById('final-score');
            const msg = document.getElementById('final-message');

            scoreText.innerText = `${score}/${totalQuestions}`;
            
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                msg.innerText = "Tuyệt vời! Bạn là thiên tài ngôn ngữ! 🏆";
                playAudio('sound-finish');
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
            } else if (percentage >= 80) {
                msg.innerText = "Giỏi lắm! Chỉ sai một chút xíu thôi! 🌟";
                playAudio('sound-finish');
            } else if (percentage >= 50) {
                msg.innerText = "Cố gắng lên! Hãy xem lại phần giải thích nhé! 💪";
            } else {
                msg.innerText = "Đừng buồn! Hãy làm lại bài để nắm chắc kiến thức hơn! 📚";
            }

            modal.style.display = 'flex';
        }

        // Initialize
        window.onload = renderQuiz;

    </script>
