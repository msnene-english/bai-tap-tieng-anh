<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chí NênEnglish 9 Unit 5 Writing</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Confetti Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #8854C0; /* Purple/Pink */
            --secondary: #00C9A7; /* Teal */
            --success: #00D26A; /* Green */
            --error: #FF4757; /* Red/Orange */
            --bg-pattern: #f0f3f9;
            --card-bg: #ffffff;
            --text-main: #2f3542;
            --text-light: #747d8c;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border_box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #dfe6e9;
            background-image: 
                radial-gradient(#8854C0 15%, transparent 16%),
                radial-gradient(#00C9A7 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            border: 4px solid #fff;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
            padding: 20px 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 15px rgba(136, 84, 192, 0.3);
            border-bottom: 5px solid rgba(0,0,0,0.1);
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }
        
        header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            background: #fff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            margin-top: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Progress Bar */
        .progress-container {
            background: #f1f2f6;
            height: 12px;
            width: 100%;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            transition: width 0.5s ease-out;
            border-radius: 0 10px 10px 0;
        }

        /* Game Area */
        .game-area {
            padding: 30px;
        }

        .question-box {
            background: #f7f9fc;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 2px dashed #d1d8e0;
            text-align: center;
            position: relative;
        }

        .question-number {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2f3542;
            line-height: 1.5;
            margin-top: 10px;
        }

        .hint-text {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 10px;
            font-style: italic;
            display: block;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e4e8;
            padding: 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 5px 0 #d1d5db; /* 3D Effect */
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #d1d5db;
            border-color: var(--secondary);
            background: #f0fffc;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #d1d5db;
        }

        .option-btn.correct {
            background: #e3fcf0;
            border-color: var(--success);
            color: #008f48;
            box-shadow: 0 5px 0 #00b85c;
        }

        .option-btn.wrong {
            background: #ffe3e6;
            border-color: var(--error);
            color: #c21326;
            box-shadow: 0 5px 0 #db2839;
            animation: shake 0.5s;
        }

        .option-icon {
            margin-right: 15px;
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 30px;
            background: #fff;
            border: 2px solid var(--primary);
            border-radius: 15px;
            overflow: hidden;
            display: none; /* Hidden by default */
            animation: slideUp 0.4s ease-out;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.1);
        }

        .explanation-header {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            padding: 20px;
            font-size: 1rem;
            line-height: 1.6;
            color: #2f3542;
            white-space: pre-wrap; /* Keeps formatting from JSON */
        }
        
        .explanation-content strong {
            color: var(--primary);
        }

        /* Controls */
        .controls {
            margin-top: 25px;
            text-align: right;
            height: 50px; /* Placeholder for button */
        }

        .next-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #009e82;
            transition: all 0.2s;
            display: none; /* Hidden initially */
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #009e82;
            filter: brightness(1.1);
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #009e82;
        }

        /* Score & Modals */
        .score-display {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 15px;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .end-screen {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .final-score {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary);
            margin: 20px 0;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
        }

        .final-message {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--text-light);
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #6c429c;
            transition: all 0.2s;
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #6c429c;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile adjustments */
        @media (max-width: 500px) {
            header h1 { font-size: 1.4rem; }
            .question-text { font-size: 1.1rem; }
            .option-btn { padding: 15px; font-size: 0.95rem; }
            .container { border-radius: 0; height: 100vh; border: none; }
            body { padding: 0; align-items: flex-start; background: var(--bg-pattern); }
            .explanation-content { font-size: 0.9rem; }
        }
    </style>

<script>

    const rawData = {
      "questions": [
        {
          "questionNumber": 1,
          "question": "Exercise 1 - Q1: learn/ foreign language/ can/ actually/ boost/ your brain power.",
          "answerOptions": [
            {
              "text": "Learning a foreign language can actually boost your brain power.",
              "rationale": "1. Phân tích từ vựng:\n- Learn (v): học -> Learning (Gerund - Danh động từ làm chủ ngữ): Việc học.\n- Foreign language (n.phr): ngoại ngữ.\n- Boost (v): thúc đẩy, tăng cường.\n- Brain power (n.phr): năng lực trí não.\n\n2. Dịch nghĩa: Việc học một ngoại ngữ thực sự có thể tăng cường năng lực trí não của bạn.\n\n3. Giải thích:\n- Động từ 'learn' đứng đầu câu làm chủ ngữ phải chuyển thành Danh động từ (V-ing) -> 'Learning'.\n- Cần thêm mạo từ 'a' trước danh từ đếm được số ít 'foreign language'.\n- Động từ khuyết thiếu 'can' + V-inf (boost).",

            {

              "isCorrect": false
            },
            {
              "text": "Learning foreign language can actually boost your brain power.",
              "rationale": "1. Phân tích từ vựng:\n- Foreign language (n): ngoại ngữ.\n\n2. Dịch nghĩa: (Câu thiếu mạo từ)\n\n3. Giải thích: 'Foreign language' là danh từ đếm được số ít, bắt buộc phải có mạo từ 'a' hoặc 'the' đứng trước.",
              "isCorrect": false
            },
            {
              "text": "To learning a foreign language can actually boost your brain power.",
              "rationale": "1. Phân tích từ vựng:\n- To learning: (sai ngữ pháp).\n\n2. Dịch nghĩa: (Câu sai ngữ pháp)\n\n3. Giải thích: Không tồn tại cấu trúc 'To + V-ing' để làm chủ ngữ. Chỉ dùng 'To learn' hoặc 'Learning'.",
              "isCorrect": false
            }
          ],
          "hint": "Động từ đứng đầu câu làm chủ ngữ thường ở dạng V-ing. Đừng quên mạo từ 'a'."
        },
        {
          "questionNumber": 2,
          "question": "Exercise 1 - Q2: Andy/ wish/ he/ can/ speak English/ good/ as a native speaker.",
          "answerOptions": [
            {
              "text": "Andy wishes he could speak English as well as a native speaker.",
              "rationale": "1. Phân tích từ vựng:\n- Wish (v): ước (cấu trúc câu ước).\n- Could (modal v): có thể (quá khứ của can).\n- Well (adv): tốt/giỏi (bổ nghĩa cho động từ speak).\n- Native speaker (n): người bản xứ.\n\n2. Dịch nghĩa: Andy ước cậu ấy có thể nói tiếng Anh giỏi như người bản xứ.\n\n3. Giải thích:\n- Chủ ngữ 'Andy' số ít -> 'wishes'.\n- Câu ước ở hiện tại/tương lai: S + wish + S + V(past)/could + V.\n- 'Can' lùi thì thành 'could'.\n- So sánh bằng: as + adv + as. Động từ là 'speak' (động từ thường) nên phải dùng trạng từ 'well', không dùng tính từ 'good'.",
              "isCorrect": true
            },
            {
              "text": "Andy wishes he can speak English as good as a native speaker.",

              "isCorrect": false
            },
            {
              "text": "Andy wishes he could speak English as good as a native speaker.",
              "rationale": "1. Phân tích từ vựng:\n- Good (adj): tốt.\n\n2. Dịch nghĩa: (Sai loại từ)\n\n3. Giải thích: Tuy đã lùi thì 'could', nhưng vẫn sai khi dùng tính từ 'good' bổ nghĩa cho động từ 'speak'. Phải dùng 'well'.",

            },
            {
              "text": "Andy wish he could speak English as well as a native speaker.",

          "hint": "Câu ước cần lùi thì ('can' -> 'could'). Động từ 'speak' cần trạng từ ('good' -> 'well')."

        {
          "questionNumber": 3,
          "question": "Exercise 1 - Q3: English/ become/ global/ means/ communication/ with/ lot of/ varieties.",
          "answerOptions": [
            {
              "text": "English has become a global means of communication with a lot of varieties.",
              "rationale": "1. Phân tích từ vựng:\n- Become (v): trở nên (dùng thì hiện tại hoàn thành để chỉ quá trình kéo dài đến nay).\n- Means (n): phương tiện (từ này có 's' ở cuối nhưng dùng được cho cả số ít và nhiều).\n- Communication (n): giao tiếp.\n- Varieties (n): các biến thể.\n\n2. Dịch nghĩa: Tiếng Anh đã trở thành một phương tiện giao tiếp toàn cầu với rất nhiều biến thể.\n\n3. Giải thích:\n- Dùng thì Hiện tại hoàn thành (has become) để diễn tả kết quả hiện tại.\n- Cụm từ 'means of communication' (phương tiện giao tiếp).\n- Thêm mạo từ 'a' trước 'global means'.\n- 'Lot of' cần viết đầy đủ là 'a lot of' hoặc 'lots of'.",

            {

            {

          "questionNumber": 4,

            },
            {
              "text": "The inner circle of the concentric circles consists of countries who are traditional bases of English.",

              "isCorrect": false
            },

    // --- LOGIC ---
    let currentQuestionIndex = 0;
    let score = 0;
    let shuffledQuestions = [];

    // Shuffle Function
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Audio Context for Beeps/Buzz (No external files needed)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // Ding sound (High sine wave)
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            oscillator.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1); // C6
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        } else {
            // Buzz sound (Low sawtooth)
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(100, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    // Initialization
    function initQuiz() {
        shuffledQuestions = shuffleArray([...rawData.questions]);
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('current-score').innerText = score;
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('end-screen').style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        const qData = shuffledQuestions[currentQuestionIndex];
        
        // Update UI
        document.getElementById('q-number-badge').innerText = `Câu ${currentQuestionIndex + 1}/${shuffledQuestions.length}`;
        document.getElementById('question-text').innerText = qData.question;
        document.getElementById('hint-text').innerText = qData.hint ? `💡 Gợi ý: ${qData.hint}` : "";
        
        // Progress Bar
        const progressPercent = (currentQuestionIndex / shuffledQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;

        // Hide Explanation
        document.getElementById('explanation-area').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        // Options
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        // Shuffle Options for better challenge
        const shuffledOptions = shuffleArray([...qData.answerOptions]);

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-icon"><i class="far fa-circle"></i></span> ${opt.text}`;
            btn.onclick = () => checkAnswer(opt, btn, qData, shuffledOptions);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOpt, btnElement, qData, allOptions) {
        // Disable all buttons
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        // Check Logic
        if (selectedOpt.isCorrect) {
            btnElement.classList.add('correct');
            btnElement.querySelector('.option-icon').innerHTML = '<i class="fas fa-check-circle"></i>';
            playSound('correct');
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            score++;
            document.getElementById('current-score').innerText = score;
        } else {
            btnElement.classList.add('wrong');
            btnElement.querySelector('.option-icon').innerHTML = '<i class="fas fa-times-circle"></i>';
            playSound('wrong');

            // Highlight the correct one automatically
            allBtns.forEach((b, index) => {
                if (allOptions[index].isCorrect) {
                    b.classList.add('correct');
                    b.querySelector('.option-icon').innerHTML = '<i class="fas fa-check-circle"></i>';
                }
            });
        }

        // Show Explanation immediately
        const explanationArea = document.getElementById('explanation-area');
        const explanationContent = document.getElementById('explanation-content');
        
        // Find the correct rationale from the data (usually in the correct option)
        const correctOpt = qData.answerOptions.find(o => o.isCorrect);
        
        explanationContent.innerHTML = correctOpt.rationale.replace(/\n/g, '<br>'); // preserve newlines
        explanationArea.style.display = 'block';

        // Show Next Button
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < shuffledQuestions.length) {
            loadQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        document.getElementById('progress-bar').style.width = '100%';
        
        document.getElementById('final-score-display').innerText = `${score}/${shuffledQuestions.length}`;
        
        const percentage = (score / shuffledQuestions.length) * 100;
        let message = "";
        if (percentage === 100) message = "Tuyệt vời! Bạn là thiên tài ngôn ngữ! 🏆";
        else if (percentage >= 80) message = "Làm tốt lắm! Bạn rất có năng khiếu! 🌟";
        else if (percentage >= 50) message = "Cố gắng lên! Bạn đang tiến bộ từng ngày! 💪";
        else message = "Đừng nản chí! Hãy xem lại giải thích và thử lại nhé! 📚";
        
        document.getElementById('final-message').innerText = message;
        
        if (percentage >= 80) {
             confetti({
                particleCount: 200,
                spread: 160,
                origin: { y: 0.6 }
            });
        }
    }

    function restartQuiz() {
        initQuiz();
    }

    // Start
    window.onload = initQuiz;

</script>
</body>
</html>
