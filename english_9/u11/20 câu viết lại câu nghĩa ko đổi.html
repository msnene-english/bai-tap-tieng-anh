<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chí Nên - Trắc nghiệm Viết lại câu (Technology Theme)</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-pastel: #F0F3F9;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pastel);
            background-image: radial-gradient(#dbeafe 2px, transparent 2px), radial-gradient(#dbeafe 2px, transparent 2px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            color: #2d3748;
        }

        /* 3D Button Effect */
        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0px 5px 0px 0px rgba(0,0,0,0.15);
            transform: translateY(0);
        }

        .btn-3d:active {
            transform: translateY(5px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,0.15);
        }

        /* Option Card Styles */
        .option-card {
            cursor: pointer;
            border: 2px solid #e2e8f0;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .option-card:hover {
            transform: scale(1.02);
            border-color: var(--primary-purple);
            background-color: #F3E8FF;
        }

        .option-card.correct {
            background-color: #D1FAE5;
            border-color: var(--correct-green);
            color: #065F46;
            box-shadow: 0px 4px 0px var(--correct-green);
        }

        .option-card.incorrect {
            background-color: #FEE2E2;
            border-color: var(--wrong-red);
            color: #991B1B;
            animation: shake 0.5s;
            box-shadow: 0px 4px 0px var(--wrong-red);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .explanation-box {
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 5px solid var(--primary-purple);
        }

        .teacher-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c0aede; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8854C0; 
        }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>

    <script>
        // DATA SOURCE
        const quizData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "Exercise 3 - Q1: The librarian said to me, “Please use headphones with your laptop.”",
              "answerOptions": [
                {
                  "text": "The librarian kindly suggested turning off my laptop.",
                  "rationale": "1. Phân tích: \n- turn off (phrasal verb): tắt.\n2. Dịch nghĩa: 'Thủ thư gợi ý một cách tử tế là nên tắt máy tính của tôi.'\n3. Giải thích: Sai nghĩa. Câu gốc yêu cầu dùng tai nghe, không phải tắt máy.",
                  "isCorrect": false
                },
                {
                  "text": "The librarian kindly suggested turning down the volume.",
                  "rationale": "1. Phân tích: \n- turn down (phrasal verb): vặn nhỏ.\n- volume (n): âm lượng.\n2. Dịch nghĩa: 'Thủ thư gợi ý nên vặn nhỏ âm lượng.'\n3. Giải thích: Sai nghĩa. Câu gốc nói về việc dùng tai nghe.",
                  "isCorrect": false
                },
                {
                  "text": "The librarian kindly suggested I use headphones with my laptop.",
                  "rationale": "1. Phân tích: \n- suggest (v) + S + (should) + V-bare: gợi ý ai đó nên làm gì (Cấu trúc giả định cách).\n- headphones (n): tai nghe.\n2. Dịch nghĩa: 'Thủ thư gợi ý một cách tử tế rằng tôi nên dùng tai nghe với máy tính của mình.'\n3. Giải thích: Đúng. Cấu trúc 'suggest + clause' dùng để tường thuật lại lời yêu cầu lịch sự 'Please...'.",
                  "isCorrect": true
                },
                {
                  "text": "The librarian warned that we don’t use headphones with our laptop.",
                  "rationale": "1. Phân tích: \n- warn (v): cảnh báo.\n2. Dịch nghĩa: 'Thủ thư cảnh báo rằng chúng tôi không dùng tai nghe...'\n3. Giải thích: Sai nghĩa và sai thì. 'Warn' mang sắc thái quá mạnh so với từ 'Please', và mệnh đề sau sai ngữ pháp tường thuật.",
                  "isCorrect": false
                }
              ],
              "hint": "Câu trực tiếp dùng 'Please' thể hiện sự yêu cầu lịch sự hoặc gợi ý. Cấu trúc 'Suggest + S + V(nguyên thể)' thường dùng để viết lại."
            },
            {
              "questionNumber": 2,
              "question": "Exercise 3 - Q2: My teacher said, “It’s not good to use a tablet for taking note.”",
              "answerOptions": [
                {
                  "text": "My teacher advised not using a tablet for taking note.",
                  "rationale": "1. Phân tích:\n- Advise + not + V-ing: Khuyên không nên làm gì.\n- Tablet (n): máy tính bảng.\n2. Dịch nghĩa: 'Giáo viên của tôi khuyên không nên sử dụng máy tính bảng để ghi chép.'\n3. Giải thích: Đúng. Cấu trúc 'It's not good to...' (Không tốt khi làm gì) tương đương với lời khuyên ngăn 'Advise not doing something'.",
                  "isCorrect": true
                },
                {
                  "text": "My teacher advised us to take all our notes on a tablet.",
                  "rationale": "1. Phân tích:\n- Advise + O + to V: Khuyên ai làm gì.\n2. Dịch nghĩa: 'Giáo viên khuyên chúng tôi ghi chép tất cả trên máy tính bảng.'\n3. Giải thích: Sai nghĩa (Ngược lại với câu gốc 'not good').",
                  "isCorrect": false
                },
                {
                  "text": "My teacher advised that we do not use a tablet for taking note.",
                  "rationale": "1. Phân tích:\n- Advise + that + S + (should) + V: Khuyên rằng...\n2. Dịch nghĩa: 'Giáo viên khuyên rằng chúng tôi không dùng máy tính bảng...'\n3. Giải thích: Về ngữ pháp câu này chấp nhận được, nhưng đáp án A (Advise + V-ing) thường được ưu tiên hơn trong các bài tập viết lại câu khi chủ ngữ 'we' trong câu tường thuật là chung chung hoặc trùng với người nói.",
                  "isCorrect": false
                },
                {
                  "text": "My teacher advised that we should use a tablet for taking note.",
                  "rationale": "1. Phân tích:\n- Should (modal verb): nên.\n2. Dịch nghĩa: 'Giáo viên khuyên rằng chúng tôi nên dùng máy tính bảng...'\n3. Giải thích: Sai nghĩa (Ngược lại với câu gốc).",
                  "isCorrect": false
                }
              ],
              "hint": "Cụm 'It's not good to...' mang nghĩa khuyên ngăn. Cấu trúc: Advise + (not) + V-ing."
            },
            {
              "questionNumber": 3,
              "question": "Exercise 3 - Q3: The teacher said, “Why not turn off notifications while studying?”",
              "answerOptions": [
                {
                  "text": "The teacher encouraged keeping notifications on while studying.",
                  "rationale": "1. Phân tích:\n- Encourage (v): khuyến khích.\n- Keep on (v): giữ nguyên/bật.\n2. Dịch nghĩa: 'Giáo viên khuyến khích việc bật thông báo khi học.'\n3. Giải thích: Sai nghĩa (Ngược lại với câu gốc 'turn off').",
                  "isCorrect": false
                },
                {
                  "text": "The teacher advised not turning off notifications while studying.",
                  "rationale": "1. Phân tích:\n- Advise not turning off: Khuyên không tắt.\n2. Dịch nghĩa: 'Giáo viên khuyên không tắt thông báo...'\n3. Giải thích: Sai nghĩa (Ngược lại với câu gốc).",
                  "isCorrect": false
                },
                {
                  "text": "The teacher informed us that notifications are essential for studying.",
                  "rationale": "1. Phân tích:\n- Inform (v): thông báo.\n- Essential (adj): thiết yếu.\n2. Dịch nghĩa: 'Giáo viên thông báo rằng thông báo là thiết yếu...'\n3. Giải thích: Sai hoàn toàn về nghĩa.",
                  "isCorrect": false
                },
                {
                  "text": "The teacher recommended turning off notifications while studying.",
                  "rationale": "1. Phân tích:\n- Recommend + V-ing: Đề xuất/Khuyên làm gì.\n- Notifications (n): thông báo.\n2. Dịch nghĩa: 'Giáo viên đề xuất việc tắt thông báo trong khi học.'\n3. Giải thích: Đúng. Mẫu câu 'Why not...?' là một lời gợi ý (suggestion) hoặc lời khuyên (recommendation).",
                  "isCorrect": true

              ],
              "hint": "Câu hỏi 'Why not...?' dùng để đưa ra lời gợi ý hoặc lời khuyên. Tương đương với Recommend/Suggest + V-ing."
            },
            {
              "questionNumber": 4,
              "question": "Exercise 3 - Q4: My mom said, “It’s good to take breaks from looking at computer screen.”",
              "answerOptions": [
                {
                  "text": "My mom instructed me to stare at computer screen all the time.",
                  "rationale": "1. Phân tích:\n- Instruct (v): hướng dẫn.\n- Stare at (v): nhìn chằm chằm.\n2. Dịch nghĩa: 'Mẹ hướng dẫn tôi nhìn chằm chằm vào màn hình suốt.'\n3. Giải thích: Sai nghĩa hoàn toàn.",
                  "isCorrect": false
                },
                {
                  "text": "My mom recommended taking breaks from looking at computer screen.",
                  "rationale": "1. Phân tích:\n- Recommend (v): khuyên/đề xuất.\n- Take breaks (v): nghỉ ngơi.\n2. Dịch nghĩa: 'Mẹ tôi khuyên nên nghỉ ngơi, tránh nhìn vào màn hình máy tính.'\n3. Giải thích: Đúng. 'It's good to...' (Thật tốt để làm gì) là cách đưa ra lời khuyên, tương đương với 'Recommend + V-ing'.",
                  "isCorrect": true
                },
                {
                  "text": "My mom discouraged taking breaks while using the computer.",
                  "rationale": "1. Phân tích:\n- Discourage (v): ngăn cản/không khuyến khích.\n2. Dịch nghĩa: 'Mẹ tôi không khuyến khích việc nghỉ ngơi...'\n3. Giải thích: Sai nghĩa (Ngược lại với câu gốc).",
                  "isCorrect": false
                },
                {
                  "text": "My mom thought staring at the screen was a good study habit.",
                  "rationale": "1. Phân tích:\n- Habit (n): thói quen.\n2. Dịch nghĩa: 'Mẹ tôi nghĩ nhìn chằm chằm màn hình là thói quen tốt.'\n3. Giải thích: Sai nghĩa.",
                  "isCorrect": false
                }
              ],
              "hint": "'It's good to...' -> Recommend + V-ing (Khuyên nên làm gì)."
            },
            {
              "questionNumber": 5,
              "question": "Exercise 3 - Q5: The mechanic said, “You should get a cooling pad which prevents overheating.”",
              "answerOptions": [
                {
                  "text": "The mechanic recommended getting a cooling pad which prevents overheating.",
                  "rationale": "1. Phân tích:\n- Recommend + V-ing: Khuyên làm gì.\n- Cooling pad (n): đế tản nhiệt.\n- Overheating (n): quá nhiệt.\n2. Dịch nghĩa: 'Thợ sửa máy khuyên nên mua một cái đế tản nhiệt giúp ngăn chặn quá nhiệt.'\n3. Giải thích: Đúng. 'Should' (nên) dùng để đưa ra lời khuyên, chuyển sang tường thuật dùng động từ 'Recommended'.",
                  "isCorrect": true
                },
                {
                  "text": "The mechanic recommends to get a cooling pad which prevents overheating.",

                  "text": "The mechanic suggested a cooling pad would prevent my computer’s overheating.",

                  "isCorrect": false

            },
            {
              "questionNumber": 6,
              "question": "Exercise 3 - Q6: My friend said, “A camera with a good zoom lens is essential for capturing wildlife shots.”",
              "answerOptions": [
                {
                  "text": "My friend advised getting a camera with a poor zoom lens for capturing wildlife shots.",
                  "rationale": "1. Phân tích:\n- Poor (adj): kém.\n2. Dịch nghĩa: 'Bạn tôi khuyên mua máy ảnh có ống kính zoom kém...'\n3. Giải thích: Sai nghĩa (Good -> Poor).",
                  "isCorrect": false
                },
                {
                  "text": "My friend advised me to get a camera with a good zoom lens for capturing wildlife shots.",
                  "rationale": "1. Phân tích:\n- Advise + O + to V: Khuyên ai làm gì.\n- Essential (adj): thiết yếu/quan trọng.\n2. Dịch nghĩa: 'Bạn tôi khuyên tôi nên mua một chiếc máy ảnh có ống kính zoom tốt để chụp ảnh hoang dã.'\n3. Giải thích: Đúng. Khi ai đó nói cái gì là 'essential' (thiết yếu) cho một mục đích, họ đang gián tiếp khuyên bạn nên trang bị nó.",
                  "isCorrect": true
                },
                {
                  "text": "My friend said a camera with a good zoom lens is essential for capturing wildlife shots.",
                  "rationale": "1. Phân tích:\n- Đây là câu tường thuật giữ nguyên thì hiện tại.\n2. Dịch nghĩa: 'Bạn tôi nói rằng...'\n3. Giải thích: Tuy đúng về mặt ngữ pháp tường thuật trực tiếp, nhưng đề bài yêu cầu chọn câu có nghĩa tương đương (thường là chuyển đổi chức năng giao tiếp). Câu B thể hiện rõ chức năng 'lời khuyên' ẩn ý trong câu gốc hơn.",
                  "isCorrect": false
                },
                {
                  "text": "My friend said that I got a camera with a good zoom lens for capturing wildlife shots.",
                  "rationale": "1. Phân tích:\n- Got (V2): đã có/đã mua.\n2. Dịch nghĩa: 'Bạn tôi nói rằng tôi đã mua...'\n3. Giải thích: Sai nghĩa. Câu gốc nói về sự cần thiết của máy ảnh, không nói về việc tôi đã mua nó.",

                }
              ],
              "hint": "Khi nói 'X is essential for Y', người nói đang đưa ra lời khuyên -> Advise someone to use/get X."
            },
            {
              "questionNumber": 7,
              "question": "Exercise 3 - Q7: Technology can help us learn new things more easily.",
              "answerOptions": [
                {
                  "text": "Technology makes learning new things inaccessible.",
                  "rationale": "1. Phân tích:\n- Inaccessible (adj): không thể tiếp cận.\n2. Dịch nghĩa: 'Công nghệ làm cho việc học cái mới không thể tiếp cận.'\n3. Giải thích: Sai nghĩa (Trái ngược hoàn toàn).",
                  "isCorrect": false
                },
                {
                  "text": "Technology makes it easier to learn new things.",
                  "rationale": "1. Phân tích:\n- Make it + adj + to V: Làm cho việc gì trở nên như thế nào.\n- Easier (adj - so sánh hơn): dễ dàng hơn.\n2. Dịch nghĩa: 'Công nghệ làm cho việc học những điều mới trở nên dễ dàng hơn.'\n3. Giải thích: Đúng. 'Help us learn... more easily' đồng nghĩa với 'Make it easier to learn...'.",
                  "isCorrect": true
                },
                {
                  "text": "Technology allows us to access a wider range of games.",
                  "rationale": "1. Phân tích:\n- Games (n): trò chơi.\n2. Dịch nghĩa: 'Công nghệ cho phép tiếp cận nhiều trò chơi hơn.'\n3. Giải thích: Sai. Câu gốc nói về 'learning' (học tập), không phải 'games'.",
                  "isCorrect": false
                },

        // GLOBAL VARIABLES
        let currentScore = 0;
        const totalQuestions = quizData.questions.length;

        // FUNCTIONS
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            quizData.questions.forEach((q, index) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'bg-white rounded-3xl p-6 mb-8 shadow-xl border-b-4 border-gray-200 relative overflow-hidden';
                questionCard.innerHTML = `
                    <div class="absolute top-0 right-0 p-4 opacity-10">
                        <svg width="64" height="64" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
                    </div>
                    
                    <div class="mb-6 relative z-10">
                        <span class="inline-block bg-teal-100 text-teal-700 text-xs font-bold px-3 py-1 rounded-full mb-2">Question ${index + 1}</span>
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-relaxed">${q.question}</h3>
                        ${q.hint ? `<p class="text-sm text-gray-500 mt-2 italic flex items-center gap-1"><span class="bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded text-xs font-bold">HINT</span> ${q.hint}</p>` : ''}
                    </div>

                    <div class="grid grid-cols-1 gap-4" id="options-${index}">
                        ${q.answerOptions.map((opt, optIndex) => `
                            <div class="option-card rounded-2xl p-4 flex items-center gap-4 group" onclick="checkAnswer(${index}, ${optIndex}, this)">
                                <div class="w-10 h-10 min-w-[2.5rem] rounded-full bg-gray-100 flex items-center justify-center font-bold text-gray-500 group-hover:bg-purple-100 group-hover:text-purple-600 transition-colors">
                                    ${String.fromCharCode(65 + optIndex)}
                                </div>
                                <div class="text-gray-700 font-semibold group-hover:text-purple-800 text-lg leading-snug">
                                    ${opt.text}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div id="explanation-${index}" class="explanation-box mt-6 bg-purple-50 rounded-xl p-6 text-gray-700 relative">
                        <div class="font-bold text-purple-700 mb-2 flex items-center gap-2">
                             <span class="text-xl">👩‍🏫</span> Ms. Chí Nên · ☎️ 0852639652giải thích chi tiết:
                        </div>
                        <div class="space-y-4 text-sm md:text-base leading-relaxed" id="explanation-content-${index}">
                            <!-- Content injected via JS -->
                        </div>
                    </div>
                `;
                container.appendChild(questionCard);
            });
        }

        function checkAnswer(qIndex, optIndex, element) {
            // Prevent multiple clicks
            const parent = document.getElementById(`options-${qIndex}`);
            if (parent.getAttribute('data-answered') === 'true') return;
            parent.setAttribute('data-answered', 'true');

            const question = quizData.questions[qIndex];
            const selectedOption = question.answerOptions[optIndex];
            const explanationBox = document.getElementById(`explanation-${qIndex}`);
            const explanationContent = document.getElementById(`explanation-content-${qIndex}`);

            // Logic styling
            const options = parent.children;
            let correctIndex = -1;

            // Find correct index
            question.answerOptions.forEach((opt, idx) => {
                if (opt.isCorrect) correctIndex = idx;
            });

            if (selectedOption.isCorrect) {
                // CORRECT
                element.classList.add('correct');
                playSound('sound-ding');
                confettiEffect();
                currentScore++;
                updateScore();
            } else {
                // INCORRECT
                element.classList.add('incorrect');
                // Highlight correct one
                options[correctIndex].classList.add('correct');
                playSound('sound-buzz');
            }

            // GENERATE EXPLANATION CONTENT (Ms. Chí Nên · ☎️ 0852639652Style)
            let rationaleHTML = `<p class="font-bold text-gray-900 border-b pb-2 mb-2">${question.question}</p>`;
            
            // Format the specific rationale from JSON
            question.answerOptions.forEach((opt, i) => {
                const label = String.fromCharCode(65 + i);
                const isAnsCorrect = opt.isCorrect;
                const colorClass = isAnsCorrect ? "text-green-600 font-bold" : "text-gray-600";
                
                // Convert newlines in rationale to <br>
                let formattedRationale = opt.rationale.replace(/\n/g, '<br>').replace(/- /g, '• ');
                
                rationaleHTML += `
                    <div class="mb-3 p-3 rounded-lg ${isAnsCorrect ? 'bg-green-50 border border-green-200' : 'bg-white border border-gray-100'}">
                        <strong class="${colorClass}">Đáp án ${label}:</strong>
                        <div class="mt-1 pl-2 text-gray-700">${formattedRationale}</div>
                    </div>
                `;
            });

            explanationContent.innerHTML = rationaleHTML;
            explanationBox.style.display = 'block';
        }

        function updateScore() {
            document.getElementById('score-display').innerText = currentScore;
        }

        function playSound(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio play failed interaction required"));
            }
        }

        function confettiEffect() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#FF4757']
            });
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const finalScoreEl = document.getElementById('final-score');
            const msgEl = document.getElementById('feedback-message');
            
            finalScoreEl.innerText = `${currentScore} / ${totalQuestions}`;
            
            const percentage = (currentScore / totalQuestions) * 100;
            let msg = "";
            
            if (percentage === 100) msg = "Xuất sắc! Bạn là thiên tài tiếng Anh! 🌟";
            else if (percentage >= 80) msg = "Giỏi lắm! Chỉ còn một chút xíu nữa thôi! 💪";
            else if (percentage >= 50) msg = "Khá tốt! Hãy xem lại phần giải thích để tiến bộ hơn nhé! 📚";
            else msg = "Đừng buồn! Thất bại là mẹ thành công. Cố lên! 🔥";

            msgEl.innerText = msg;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            if (percentage >= 50) playSound('sound-cheer');
            
            confetti({
                particleCount: 200,
                spread: 100,
                origin: { y: 0.5 }
            });
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('result-modal').classList.remove('flex');
        }

        // Initialize
        renderQuiz();

    </script>
