<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tiếng Anh - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-pink: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #F0F3F8;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dbe3f0 2px, transparent 2px);
            background-size: 20px 20px;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* --- Header --- */
        .header-bar {
            background: linear-gradient(135deg, var(--primary-pink), #a29bfe);
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(136, 84, 192, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .teacher-name {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 5px;
            display: block;
        }

        /* --- Main Container --- */
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px 80px 15px; /* Bottom padding for fixed footer */
        }

        /* --- Question Card --- */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 #dfe6e9, 0 10px 20px rgba(0,0,0,0.1);
            border: 2px solid #f1f2f6;
            transition: transform 0.3s ease;
            position: relative;
        }

        .question-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2f3542;
            line-height: 1.5;
        }

        .question-number {
            background: var(--primary-teal);
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            margin-right: 10px;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .section-title {
            color: var(--primary-pink);
            font-weight: 800;
            font-size: 1.2rem;
            margin: 40px 0 20px 0;
            text-align: center;
            background: #fff;
            padding: 10px;
            border-radius: 15px;
            border: 2px dashed var(--primary-pink);
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- Options Grid --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe4ea;
            border-bottom: 5px solid #dfe4ea;
            border-radius: 15px;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #57606f;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-pink);
            color: var(--primary-pink);
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        /* --- States --- */
        .option-btn.correct {
            background-color: var(--correct-green);
            border-color: #00b85c;
            border-bottom-color: #00944a;
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red);
            border-color: #ff2e43;
            border-bottom-color: #d63031;
            color: white;
            animation: shake 0.5s;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        /* --- Explanation Box --- */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 20px;
            background: #fdf2f8; /* Pinkish tint */
            border-left: 5px solid var(--primary-pink);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: slideDown 0.3s ease-out;
        }

        .expl-header {
            font-weight: 800;
            color: var(--primary-pink);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .expl-content strong {
            color: #2d3436;
        }
        
        .expl-content ul {
            padding-left: 20px;
            margin: 5px 0;
        }

        /* --- Footer/Submit --- */
        .quiz-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 99;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .score-display {
            font-weight: 800;
            color: var(--primary-teal);
            font-size: 1.2rem;
        }

        .submit-btn {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 50px;
            box-shadow: 0 5px 0 #6c429c;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #6c429c;
        }

        /* --- Animations --- */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Utility for Underline --- */
        u {
            text-decoration: none;
            border-bottom: 2px solid #2d3436;
            font-weight: 700;
        }
        
        /* Modal for results */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            animation: slideDown 0.4s;
        }
        .modal-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-teal);
            margin: 10px 0;
        }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>

    // --- LOGIC JAVASCRIPT ---

    let currentScore = 0;
    const totalQuestions = quizData.filter(q => q.type !== 'section').length;

    // Audio effects (Using short B64 for Single File portability)
    const audioCorrect = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");
    const audioWrong = new Audio("https://actions.google.com/sounds/v1/cartoon/clank_car_crash.ogg");

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        let questionCount = 0;

        quizData.forEach((item, index) => {
            if (item.type === "section") {
                const sectionTitle = document.createElement('div');
                sectionTitle.className = 'section-title';
                sectionTitle.innerText = item.title;
                container.appendChild(sectionTitle);
            } else {
                questionCount++;
                const card = document.createElement('div');
                card.className = 'question-card';
                
                let optionsHtml = '';
                item.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <button class="option-btn" onclick="checkAnswer(this, ${item.id}, ${opt.correct || false})">
                            ${opt.value}. ${opt.text}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">
                        <span class="question-number">Question ${questionCount}</span>
                        ${item.question}
                    </div>
                    <div class="options-grid">
                        ${optionsHtml}
                    </div>
                    <div class="explanation-box" id="expl-${item.id}">
                        <div class="expl-header">
                            <span>💡</span> Giải thích chi tiết
                        </div>
                        <div class="expl-content">
                            ${item.explanation}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            }
        });
    }

    function checkAnswer(btn, questionId, isCorrect) {
        // Prevent clicking multiple times in the same card
        const card = btn.closest('.question-card');
        if (card.classList.contains('answered')) return;
        card.classList.add('answered');

        const allBtns = card.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.classList.add('disabled'));

        const explBox = document.getElementById(`expl-${questionId}`);
        explBox.style.display = 'block';

        if (isCorrect) {
            btn.classList.add('correct');
            currentScore++;
            document.getElementById('current-score').innerText = currentScore;
            
            // Confetti Effect
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#ffeb3b']
            });
            audioCorrect.play();
        } else {
            btn.classList.add('wrong');
            audioWrong.play();
            // Highlight the correct one
            // We need to find the button that corresponds to the correct answer. 
            // In this logic, we pass isCorrect in HTML, so we need to loop buttons to find correct one.
            // But since we generate HTML dynamically, we can inspect the 'onclick' attribute or store data.
            // Simpler: The "correct" logic is passed to the function. We need to find the correct button in DOM.
            // Let's re-loop based on the quizData? No, let's use the DOM.
            // Actually, we can just highlight the button that would have been correct.
            // We will iterate options in the card.
            const dataItem = quizData.find(q => q.id === questionId);
            const correctOptionIndex = dataItem.options.findIndex(o => o.correct);
            allBtns[correctOptionIndex].classList.add('correct'); // Show correct answer
        }
    }

    function finishQuiz() {
        const modal = document.getElementById('result-modal');
        const finalScoreEl = document.getElementById('final-score');
        const msgEl = document.getElementById('teacher-message');

        finalScoreEl.innerText = `${currentScore}/${totalQuestions}`;
        
        const percentage = (currentScore / totalQuestions) * 100;
        if (percentage === 100) {
            msgEl.innerText = "Xuất sắc! Em là thiên tài Tiếng Anh!";
            confetti({ particleCount: 200, spread: 100 });
        } else if (percentage >= 80) {
            msgEl.innerText = "Giỏi lắm! Chỉ sai một chút xíu thôi.";
        } else if (percentage >= 50) {
            msgEl.innerText = "Cố gắng lên! Hãy xem kỹ phần giải thích nhé.";
        } else {
            msgEl.innerText = "Đừng buồn! Ms. Chí Nên · ☎️ 0852639652sẽ giúp em lấy gốc.";
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
        // Scroll to top
        window.scrollTo(0, 0);
    }

    // Init
    renderQuiz();

</script>
</body>
</html>
