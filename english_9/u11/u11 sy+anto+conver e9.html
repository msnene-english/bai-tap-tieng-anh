<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tiếng Anh - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-pink: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #F0F3F8;
            --card-bg: #FFFFFF;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dbe3f0 2px, transparent 2px);
            background-size: 20px 20px;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* --- Header --- */
        .header-bar {
            background: linear-gradient(135deg, var(--primary-pink), #a29bfe);
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(136, 84, 192, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .header-title {
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .teacher-name {
            font-size: 0.9rem;
            opacity: 0.95;
            margin-top: 5px;
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* --- Main Container --- */
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px 100px 15px; /* Padding for footer */
        }

        /* --- Section Header --- */
        .section-header {
            background: #fff;
            border: 3px dashed var(--primary-pink);
            color: var(--primary-pink);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            font-weight: 800;
            font-size: 1.2rem;
            margin: 40px 0 20px 0;
            box-shadow: 0 5px 0 #e1bee7;
        }

        /* --- Question Card --- */
        .question-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 #dfe6e9, 0 10px 20px rgba(0,0,0,0.1);
            border: 2px solid #f1f2f6;
            transition: transform 0.3s ease;
            position: relative;
        }

        .question-header {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #2f3542;
            line-height: 1.6;
        }

        .q-tag {
            background: var(--primary-teal);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            margin-right: 10px;
            font-size: 0.9rem;
            font-weight: 800;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            vertical-align: middle;
        }

        /* --- Options Grid --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe4ea;
            border-bottom: 5px solid #dfe4ea;
            border-radius: 20px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #57606f;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn .label {
            margin-right: 10px;
            background: #f1f2f6;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #a4b0be;
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-pink);
            color: var(--primary-pink);
        }
        
        .option-btn:hover:not(.disabled) .label {
            background: var(--primary-pink);
            color: white;
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* --- States --- */
        .option-btn.correct {
            background-color: var(--correct-green);
            border-color: #00b85c;
            border-bottom-color: #00944a;
            color: white;
        }
        .option-btn.correct .label { background: rgba(255,255,255,0.3); color: white; }

        .option-btn.wrong {
            background-color: var(--wrong-red);
            border-color: #ff2e43;
            border-bottom-color: #d63031;
            color: white;
            animation: shake 0.5s;
        }
        .option-btn.wrong .label { background: rgba(255,255,255,0.3); color: white; }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        /* --- Explanation Box --- */
        .explanation-box {
            display: none;
            margin-top: 25px;
            background: #fff0f6;
            border: 2px solid #ffcce0;
            padding: 20px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: slideUp 0.4s ease-out;
            box-shadow: 0 4px 0 #ffcce0;
        }

        .expl-header {
            font-weight: 800;
            color: #d63031;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        .expl-content strong { color: var(--primary-pink); }
        .expl-content p { margin: 5px 0; }
        .expl-content ul { padding-left: 20px; margin: 10px 0; }
        .expl-content li { margin-bottom: 5px; }

        /* --- Footer/Submit --- */
        .quiz-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            z-index: 99;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .score-box {
            font-weight: 800;
            color: var(--primary-teal);
            font-size: 1.4rem;
            background: #e0fbf6;
            padding: 8px 20px;
            border-radius: 50px;
            border: 2px solid var(--primary-teal);
        }

        .submit-btn {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 50px;
            box-shadow: 0 6px 0 #6c429c;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #6c429c;
        }

        /* --- Animations --- */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-3deg); }
            40% { transform: translateX(8px) rotate(3deg); }
            60% { transform: translateX(-8px) rotate(-3deg); }
            80% { transform: translateX(8px) rotate(3deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        u {
            text-decoration: none;
            border-bottom: 3px solid var(--primary-pink);
            font-weight: 800;
            padding-bottom: 2px;
        }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 90%;
            width: 450px;
            animation: slideUp 0.5s;
            border: 4px solid var(--primary-teal);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .modal-score {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-pink);
            margin: 10px 0;
            text-shadow: 3px 3px 0 #dfe6e9;
        }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>
<body>

    <header class="header-bar">
        <h1 class="header-title">English Test</h1>
        <span class="teacher-name">Giáo viên: Ms. Chí Nên · ☎️ 0852639652</span>
    </header>

    <div class="container" id="quiz-container">
        </div>

    <div class="quiz-footer">
        <div class="score-box">Điểm: <span id="current-score">0</span></div>
        <button class="submit-btn" onclick="finishQuiz()">Nộp bài</button>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2 style="color:var(--primary-teal); margin-top:0;">TỔNG KẾT</h2>
            <p style="font-size: 1.2rem;">Em đã hoàn thành bài tập!</p>
            <div class="modal-score" id="final-score">0/0</div>
            <p id="teacher-message" style="font-weight: 700; color: #57606f; font-size: 1.1rem;"></p>
            <button class="submit-btn" onclick="closeModal()">Xem lại bài làm</button>
        </div>
    </div>

<script>
    // --- DỮ LIỆU ĐỀ BÀI ---
    const quizData = [
        // EXERCISE 4: CLOSEST IN MEANING
        {
            type: "section",
            title: "Exercise 4: Mark the letter A, B, C, or D to indicate the word(s) CLOSEST in meaning."
        },
        {
            id: 1,
            question: "This new smartphone model is very <u>portable</u> and easy to carry around.",
            options: [
                { value: "A", text: "compact", correct: true },
                { value: "B", text: "wireless" },
                { value: "C", text: "lightweight" },
                { value: "D", text: "virtual" }
            ],
            explanation: `
                <strong>Dịch câu:</strong> Mẫu điện thoại thông minh mới này rất <u>di động/tiện lợi</u> và dễ dàng mang theo.<br>
                <strong>Phân tích từ vựng:</strong>
                <ul>
                    <li>A. compact (adj): nhỏ gọn (thường đi đôi với portable).</li>
                    <li>B. wireless (adj): không dây.</li>
                    <li>C. lightweight (adj): nhẹ.</li>
                    <li>D. virtual (adj): ảo.</li>
                </ul>
                <strong>Ms. Chí Nên · ☎️ 0852639652giải thích:</strong> "Portable" có nghĩa là có thể mang theo dễ dàng. Trong ngữ cảnh công nghệ, từ đồng nghĩa sát nhất chỉ tính chất thiết kế là "Compact" (nhỏ gọn). Mặc dù "Lightweight" cũng hợp lý, nhưng "Compact" bao hàm ý nghĩa về kích thước tiện lợi để mang đi (easy to carry).<br>
                <span style="color:red">Lưu ý:</span> Trong nhiều giáo trình, Portable = Compact.
            `
        },
        {
            id: 2,
            question: "I <u>recommend</u> that she use a screen protector on her smartphone to prevent scratches and damage.",
            options: [
                { value: "A", text: "suggest", correct: true },
                { value: "B", text: "stop" },
                { value: "C", text: "use for" },
                { value: "D", text: "navigate" }
            ],
            explanation: `
                <strong>Dịch câu:</strong> Tôi <u>khuyên/đề xuất</u> cô ấy nên dùng miếng dán màn hình...<br>
                <strong>Phân tích:</strong>
                <ul>
                    <li>A. suggest (v): gợi ý, đề xuất (= recommend).</li>
                    <li>B. stop (v): dừng lại.</li>
                    <li>C. use for (v): dùng cho.</li>
                    <li>D. navigate (v): điều hướng.</li>
                </ul>
                <strong>Ms. Chí Nên · ☎️ 0852639652giải thích:</strong> Chọn A vì "Recommend" đồng nghĩa với "Suggest" trong ngữ cảnh đưa ra lời khuyên.
            `
        },
        {
            id: 3,
            question: "Plastic bags are <u>harmful</u> for the environment, so people try to recycle them as much as possible.",
            options: [
                { value: "A", text: "entertaining" },
                { value: "B", text: "high-quality" },
                { value: "C", text: "damaging", correct: true },
                { value: "D", text: "medical" }
            ],
            explanation: `
                <strong>Dịch câu:</strong> Túi nhựa <u>có hại</u> cho môi trường...<br>
                <strong>Phân tích:</strong>
                <ul>
                    <li>A. entertaining (adj): mang tính giải trí.</li>
                    <li>B. high-quality (adj): chất lượng cao.</li>
                    <li>C. damaging (adj): gây thiệt hại, có hại (= harmful).</li>
                    <li>D. medical (adj): thuộc y tế.</li>
                </ul>
                <strong>Ms. Chí Nên · ☎️ 0852639652giải thích:</strong> Chọn C. "Harmful" = "Damaging" (gây hại).
            `
        },
        {
            id: 4,
            question: "Her job requires a lot of <u>flexibility</u> as she often needs to adapt to sudden changes in project deadlines.",
            options: [
                { value: "A", text: "assistant" },
                { value: "B", text: "camcorder" },
                { value: "C", text: "cardboard" },
                { value: "D", text: "adaptability", correct: true }
            ],
            explanation: `
                <strong>Dịch câu:</strong> Công việc đòi hỏi nhiều <u>sự linh hoạt</u> vì cô ấy thường phải thích nghi với thay đổi...<br>
                <strong>Phân tích:</strong>
                <ul>
                    <li>A. assistant (n): trợ lý.</li>
                    <li>B. camcorder (n): máy quay phim.</li>
                    <li>C. cardboard (n): bìa cứng.</li>
                    <li>D. adaptability (n): khả năng thích nghi (= flexibility).</li>
                </ul>
                <strong>Ms. Chí Nên · ☎️ 0852639652giải thích:</strong> Chọn D. "Flexibility" (sự linh hoạt) đồng nghĩa với khả năng thích nghi "Adaptability".
            `
        },
        {
            id: 5,
            question: "Companies now rely on virtual meetings to <u>collaborate</u> with partners from different locations.",
            options: [
                { value: "A", text: "mold" },
                { value: "B", text: "prevent" },
                { value: "C", text: "connect" },
                { value: "D", text: "cooperate", correct: true }
            ],
            explanation: `
                <strong>Dịch câu:</strong> Các công ty dựa vào họp trực tuyến để <u>cộng tác</u> với đối tác...<br>
                <strong>Phân tích:</strong>
                <ul>
                    <li>A. mold (v): đúc khuôn.</li>
                    <li>B. prevent (v): ngăn chặn.</li>
                    <li>C. connect (v): kết nối.</li>
                    <li>D. cooperate (v): hợp tác (= collaborate).</li>
                </ul>
                <strong>Ms. Chí Nên · ☎️ 0852639652giải thích:</strong> Chọn D. Collaborate = Cooperate/Work together. "Connect" chỉ là kết nối, chưa mang nghĩa làm việc chung.
            `
        },

        // EXERCISE 5: OPPOSITE IN MEANING
        {
            type: "section",
            title: "Exercise 5: Mark the letter A, B, C, or D to indicate the word(s) OPPOSITE in meaning."
        },
        {
            id: 6,
            question: "Online resources include a <u>wide range</u> of educational materials readily available on the internet.",
            options: [
                { value: "A", text: "limited", correct: true },
                { value: "B", text: "durable" },
                { value: "C", text: "excellent" },
                { value: "D", text: "visual" }
            ],
            explanation: `
                <strong>Dịch câu:</strong> Tài nguyên trực tuyến bao gồm <u>nhiều loại/phạm vi rộng</u> tài liệu giáo dục...<br>
                <strong>Phân tích (Tìm từ TRÁI NGHĨA):</strong>
                <ul>
                    <li>A. limited (adj): hạn chế >< wide range (rộng rãi).</li>
                    <li>B. durable (adj): bền.</li>
                    <li>C. excellent (adj): xuất sắc.</li>
                    <li>D. visual (adj): thuộc thị giác.</li>
                </ul>
                <strong>Ms. Chí Nên · ☎️ 0852639652giải thích:</strong> Chọn A. Trái nghĩa với "Wide range" (phạm vi rộng/đa dạng) là "Limited" (hạn chế).
            `
        },
        {
            id: 7,
            question: "A major <u>benefit</u> of using robots in factories is that they can perform dangerous jobs...",
            options: [
                { value: "A", text: "response" },
                { value: "B", text: "disadvantage", correct: true },
                { value: "C", text: "self-portrait" },
                { value: "D", text: "application" }
            ],
            explanation: `
                <strong>Dịch câu:</strong> Một <u>lợi ích</u> lớn của việc sử dụng robot...<br>
                <strong>Phân tích:</strong>
                <ul>
                    <li>A. response (n): phản hồi.</li>
                    <li>B. disadvantage (n): bất lợi >< benefit (lợi ích).</li>
                    <li>C. self-portrait (n): chân dung tự họa.</li>
                    <li>D. application (n): ứng dụng.</li>
                </ul>
                <strong>Ms. Chí Nên · ☎️ 0852639652giải thích:</strong> Chọn B. Trái nghĩa của Benefit là Disadvantage (hoặc Drawback).
            `
        },
        {
            id: 8,
            question: "The website looked <u>suspicious</u>. Her dad suggested she not enter any personal information.",
            options: [
                { value: "A", text: "high-quality" },
                { value: "B", text: "suspicious" },
                { value: "C", text: "responsive" },
                { value: "D", text: "trustworthy", correct: true }
            ],
            explanation: `
                <strong>Dịch câu:</strong> Trang web trông có vẻ <u>đáng ngờ</u>...<br>
                <strong>Phân tích:</strong>
                <ul>
                    <li>A. high-quality: chất lượng cao.</li>
                    <li>B. suspicious: đáng ngờ (từ gốc).</li>
                    <li>C. responsive: phản hồi nhanh.</li>
                    <li>D. trustworthy: đáng tin cậy >< suspicious.</li>
                </ul>
                <strong>Ms. Chí Nên · ☎️ 0852639652giải thích:</strong> Chọn D. Trái nghĩa với "đáng ngờ" (suspicious) là "đáng tin" (trustworthy/reliable).
            `
        },
        {
            id: 9,
            question: "Smartphone can be a great learning tool but you need to think of how to use it <u>effectively</u>.",
            options: [
                { value: "A", text: "responsively" },
                { value: "B", text: "unproductively", correct: true },
                { value: "C", text: "conveniently" },
                { value: "D", text: "comfortably" }
            ],
            explanation: `
                <strong>Dịch câu:</strong> ...bạn cần nghĩ cách sử dụng nó <u>một cách hiệu quả</u>.<br>
                <strong>Phân tích:</strong>
                <ul>
                    <li>A. responsively: một cách nhanh nhạy.</li>
                    <li>B. unproductively: không năng suất/không hiệu quả >< effectively.</li>
                    <li>C. conveniently: tiện lợi.</li>
                    <li>D. comfortably: thoải mái.</li>
                </ul>
                <strong>Ms. Chí Nên · ☎️ 0852639652giải thích:</strong> Chọn B. Effectively (hiệu quả) trái nghĩa với Unproductively (kém hiệu quả/không ra sản phẩm).
            `
        },
        {
            id: 10,
            question: "Copper is an <u>excellent</u> conductor of electricity, making it ideal for electrical wiring...",

    // --- LOGIC JS ---
    let currentScore = 0;
    const totalQuestions = quizData.filter(q => q.type !== 'section').length;
    
    // Simple Audio Objects
    const audioDing = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");
    const audioBuzz = new Audio("https://actions.google.com/sounds/v1/cartoon/clank_car_crash.ogg");

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        let qCount = 0;

        quizData.forEach(item => {
            if (item.type === 'section') {
                const header = document.createElement('div');
                header.className = 'section-header';
                header.innerText = item.title;
                container.appendChild(header);
            } else {
                qCount++;
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${item.id}`;
                
                let optionsHtml = '';
                item.options.forEach(opt => {
                    optionsHtml += `
                        <div class="option-btn" onclick="checkAnswer(this, ${item.id}, ${opt.correct || false})">
                            <span class="label">${opt.value}</span>
                            <span>${opt.text}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">
                        <span class="q-tag">Question ${qCount}</span>
                        ${item.question}
                    </div>
                    <div class="options-grid">
                        ${optionsHtml}
                    </div>
                    <div class="explanation-box" id="expl-${item.id}">
                        <div class="expl-header">
                            <span>💡</span> Giải thích chi tiết
                        </div>
                        <div class="expl-content">
                            ${item.explanation}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            }
        });
    }

    function checkAnswer(btn, qId, isCorrect) {
        const card = document.getElementById(`card-${qId}`);
        if (card.classList.contains('answered')) return; // Prevent re-answering
        card.classList.add('answered');

        const allBtns = card.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.classList.add('disabled'));

        const explBox = document.getElementById(`expl-${qId}`);
        explBox.style.display = 'block';

        if (isCorrect) {
            btn.classList.add('correct');
            currentScore++;
            document.getElementById('current-score').innerText = currentScore;
            audioDing.currentTime = 0;
            audioDing.play();
            // Confetti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#ffeb3b']
            });
        } else {
            btn.classList.add('wrong');
            audioBuzz.currentTime = 0;
            audioBuzz.play();
            // Highlight correct answer automatically
            // Find the correct button in DOM
            const dataItem = quizData.find(q => q.id === qId);
            const correctOptIndex = dataItem.options.findIndex(o => o.correct);
            allBtns[correctOptIndex].classList.add('correct');
        }
    }

    function finishQuiz() {
        const modal = document.getElementById('result-modal');
        const finalScoreEl = document.getElementById('final-score');
        const msgEl = document.getElementById('teacher-message');

        finalScoreEl.innerText = `${currentScore}/${totalQuestions}`;
        
        const percentage = (currentScore / totalQuestions) * 100;
        if (percentage === 100) {
            msgEl.innerText = "Wow! Em là thiên tài Tiếng Anh! 🌟";
            confetti({ particleCount: 300, spread: 120, startVelocity: 40 });
        } else if (percentage >= 80) {
            msgEl.innerText = "Giỏi quá! Chỉ sai chút xíu thôi! 💪";
        } else if (percentage >= 50) {
            msgEl.innerText = "Cố lên nhé! Xem kỹ lại giải thích nào! 📚";
        } else {
            msgEl.innerText = "Đừng buồn, Ms. Chí Nên · ☎️ 0852639652sẽ giúp em lấy lại gốc! ❤️";
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize
    renderQuiz();

</script>
