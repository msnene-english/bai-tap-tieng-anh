    <!-- Tailwind CSS (for layout structure) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh Ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #F0F3F9;
            --card-bg: #FFFFFF;
            --text-color: #2F3542;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1c4e9 1px, transparent 1px), radial-gradient(#d1c4e9 1px, transparent 1px);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
            color: var(--text-color);
            overflow-x: hidden;
        }

        .header-banner {
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        /* 3D Button Style */
        .option-btn {
            background-color: white;
            border: 2px solid #E1E1E1;
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            text-align: left;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 4px 0 #dcdcdc;
            font-weight: 600;
            color: #57606f;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #dcdcdc;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #dcdcdc;
        }

        /* State Classes */
        .option-btn.correct {
            background-color: #e0f9ec;
            border-color: var(--correct-color);
            color: var(--correct-color);
            box-shadow: 0 4px 0 #00b85c;
        }

        .option-btn.wrong {
            background-color: #ffeaea;
            border-color: var(--wrong-color);
            color: var(--wrong-color);
            box-shadow: 0 4px 0 #e03b49;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
        }

        .option-btn:disabled:not(.correct):not(.wrong) {
            opacity: 0.5;
            background-color: #f1f2f6;
            border-color: #ced6e0;
            box-shadow: none;
            transform: translateY(2px);
        }

        /* Question Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease;
            border: 3px solid #ffffff;
        }

        .question-badge {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 4px 0 #6c4299;
        }

        .hint-text {
            color: #747d8c;
            font-style: italic;
            font-size: 0.95rem;
            margin-bottom: 15px;
            background: #f1f2f6;
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 4px solid var(--secondary-color);
        }

        /* Explanation Box */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 20px;
            background-color: #f8f9fa;
            border: 2px dashed var(--primary-color);
            border-radius: 15px;
            padding: 20px;
            animation: slideDown 0.4s ease-out;
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .explanation-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-weight: 800;
        }

        .rationale-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2d3436;
        }

        .rationale-content strong {
            color: #d63031;
        }
        
        /* Floating Labels inside buttons */
        .btn-label {
            font-weight: 800;
            margin-right: 10px;
            min-width: 25px;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* Submit Section */
        .submit-section {
            background: white;
            padding: 20px;
            border-top: 1px solid #eee;
            position: fixed;
            bottom: 0;
            width: 100%;
            left: 0;
            text-align: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .submit-btn {
            background-color: var(--secondary-color);
            color: white;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 12px 40px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 5px 0 #009e82;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #009e82;
        }
        
        .submit-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #009e82;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            animation: zoomIn 0.3s;
            border: 4px solid var(--primary-color);
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Utility specific for content */
        u {
            text-decoration-color: var(--primary-color);
            text-decoration-thickness: 2px;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .option-btn {
                font-size: 0.9rem;
                padding: 12px;
            }
            .header-title {
                font-size: 1.2rem;
            }
        }
    </style>

        let currentScore = 0;
        const totalQuestions = quizData.questions.length;
        const labels = ['A', 'B', 'C', 'D'];

        // --- AUDIO CONTEXT (Generated Sounds) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding! (High pitch sine wave)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                // Buzz! (Low pitch sawtooth)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- CONFETTI LOGIC ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD700'];

            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    r: Math.random() * 6 + 2,
                    dx: (Math.random() - 0.5) * 20,
                    dy: (Math.random() - 0.5) * 20,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }

            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    let p = particles[i];
                    p.x += p.dx;
                    p.y += p.dy;
                    p.life--;
                    p.dy += 0.2; // gravity

                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                particles = particles.filter(p => p.life > 0);
                if (particles.length > 0) {
                    requestAnimationFrame(update);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            update();
        }

        // --- RENDER QUIZ ---
        function initQuiz() {
            const container = document.getElementById('quiz-container');
            
            quizData.questions.forEach((q, qIndex) => {
                // Formatting newlines in question text
                const formattedQuestion = q.question.replace(/\n/g, '<br>');

                const cardHTML = `
                    <div class="quiz-card p-6" id="card-${qIndex}">
                        <div class="mb-4">
                            <span class="question-badge">Question ${q.questionNumber}</span>
                            <h3 class="text-xl font-bold text-gray-800 leading-relaxed">
                                ${formattedQuestion}
                            </h3>
                            ${q.hint ? `<div class="hint-text mt-3"><i class="fas fa-lightbulb mr-2"></i> Hint: ${q.hint}</div>` : ''}
                        </div>

                        <div class="options-container" id="options-${qIndex}">
                            ${q.answerOptions.map((opt, optIndex) => `
                                <button class="option-btn" onclick="checkAnswer(${qIndex}, ${optIndex}, ${opt.isCorrect})">
                                    <span class="btn-label">${labels[optIndex]}.</span>
                                    <span>${opt.text}</span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Explanation Area -->
                        <div id="explain-${qIndex}" class="explanation-box">
                            <div class="explanation-header">
                                <div class="teacher-avatar">Ms</div>
                                <span>Ms. Chí Nên · ☎️ 0852639652giải thích:</span>
                            </div>
                            <div class="rationale-content" id="rationale-text-${qIndex}">
                                <!-- Content injected via JS to handle formatting safely -->
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });

            // Update score display initially
            document.getElementById('score-display').innerText = `0 / ${totalQuestions}`;
        }

        function checkAnswer(qIndex, optIndex, isCorrect) {
            const optionsDiv = document.getElementById(`options-${qIndex}`);
            const buttons = optionsDiv.getElementsByTagName('button');
            const explainBox = document.getElementById(`explain-${qIndex}`);
            
            // Disable all buttons for this question
            for (let btn of buttons) {
                btn.disabled = true;
            }

            // Highlight chosen button
            const chosenBtn = buttons[optIndex];
            
            if (isCorrect) {
                chosenBtn.classList.add('correct');
                playSound('correct');
                fireConfetti();
                currentScore++;
                document.getElementById('score-display').innerText = `${currentScore} / ${totalQuestions}`;
            } else {
                chosenBtn.classList.add('wrong');
                playSound('wrong');
                
                // Find and highlight the correct one automatically
                const questionData = quizData.questions[qIndex];
                const correctOptIndex = questionData.answerOptions.findIndex(o => o.isCorrect);
                if (correctOptIndex !== -1) {
                    buttons[correctOptIndex].classList.add('correct');
                    buttons[correctOptIndex].style.opacity = "1"; // Ensure it's visible even if disabled
                }
            }

            // Prepare and Show Explanation
            const questionData = quizData.questions[qIndex];
            // Format the rationale text: bolding the numbering 1. 2. 3.
            let rationaleHTML = '';
            
            // Loop through options to create detailed comparison
            questionData.answerOptions.forEach((opt, idx) => {
                 let status = opt.isCorrect ? '<span class="text-green-600 font-bold">[ĐÚNG]</span>' : '<span class="text-red-500 font-bold">[SAI]</span>';
                 let formattedRationale = opt.rationale.replace(/\n/g, '<br>');
                 
                 // Make headers bold (1. Phân tích, etc)
                 formattedRationale = formattedRationale.replace(/(1\. Phân tích)/g, '<strong>$1</strong>');
                 formattedRationale = formattedRationale.replace(/(2\. Dịch nghĩa)/g, '<strong>$1</strong>');
                 formattedRationale = formattedRationale.replace(/(3\. Giải thích)/g, '<strong>$1</strong>');

                 rationaleHTML += `
                    <div class="mb-4 p-3 rounded bg-white border border-gray-200 ${opt.isCorrect ? 'border-green-400 bg-green-50' : ''}">
                        <p class="font-bold text-gray-700 mb-1">${labels[idx]}. ${opt.text} ${status}</p>
                        <div class="text-sm text-gray-600 pl-4 border-l-2 border-gray-300">
                            ${formattedRationale}
                        </div>
                    </div>
                 `;
            });

            document.getElementById(`rationale-text-${qIndex}`).innerHTML = rationaleHTML;
            explainBox.style.display = 'block';
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const finalScoreEl = document.getElementById('final-score');
            const messageEl = document.getElementById('final-message');
            
            finalScoreEl.innerText = `${currentScore} / ${totalQuestions}`;
            
            const percentage = (currentScore / totalQuestions) * 100;
            if (percentage === 100) {
                messageEl.innerText = "Tuyệt vời! Bạn đã nắm vững toàn bộ kiến thức!";
            } else if (percentage >= 80) {
                messageEl.innerText = "Rất tốt! Chỉ còn một chút xíu nữa thôi là hoàn hảo.";
            } else if (percentage >= 50) {
                messageEl.innerText = "Khá tốt. Hãy xem lại phần giải thích để hiểu rõ hơn nhé.";
            } else {
                messageEl.innerText = "Cố lên! Hãy đọc kỹ giải thích chi tiết của Ms. Chí Nên · ☎️ 0852639652nhé.";
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // FontAwesome Injection (for icons)
        const faScript = document.createElement('script');
        faScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js';
        document.head.appendChild(faScript);

        // Start
        window.onload = initQuiz;

    </script>
