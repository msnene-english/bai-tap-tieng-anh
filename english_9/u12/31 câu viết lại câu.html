    <style>
        :root {
            --primary: #8854C0; /* Tím hồng nhạt */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --background-pattern: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f4f8;
            background-image: var(--background-pattern);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-attachment: fixed;
            background-color: #e0e7ff; /* Fallback light purple/blue */
        }

        /* 3D Button Style */
        .btn-3d {
            transition: all 0.1s;
            border-bottom: 6px solid rgba(0,0,0,0.2);
            position: relative;
        }

        .btn-3d:active {
            transform: translateY(4px);
            border-bottom: 2px solid rgba(0,0,0,0.2);
        }

        .option-btn {
            background-color: white;
            color: #4b5563;
            border: 2px solid #e5e7eb;
            border-bottom: 6px solid #d1d5db;
            border-radius: 16px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            background-color: #f9fafb;
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: #00a855;
            border-bottom-color: #008f48;
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: #ff2e40;
            border-bottom-color: #d61c2d;
            animation: shake 0.5s;
        }

        /* Shake Animation */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        /* Explanation Box */
        .explanation-box {
            border-left: 5px solid var(--secondary);
            background-color: #f0fdfa;
            border-radius: 8px;
            transition: max-height 0.5s ease-in-out, opacity 0.5s ease-in-out;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
        }

        .explanation-box.show {
            max-height: 1000px; /* Arbitrary large height */
            opacity: 1;
            padding: 1.5rem;
            margin-top: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Header Decor */
        .header-bg {
            background: linear-gradient(135deg, #8854C0 0%, #00C9A7 100%);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 25px -5px rgba(136, 84, 192, 0.5);
        }

        .question-card {
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            background: white;
            border: 2px solid white;
        }

        .question-number-badge {
            background-color: var(--primary);
            box-shadow: 0 4px 0 #6b3fa0;
        }
        
        .glossary-table th, .glossary-table td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
        }
        .glossary-table th {
            background-color: #f1f5f9;
            color: #475569;
        }
    </style>

    <script>
        // --- DATA SOURCE ---
        const quizData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "Exercise 1 - Q1: Arrange the words to make a correct sentence:\n(After school, /you/ or/ helping people. / animals/ can choose/ a job/ you/ love, / like/ working with /)",
              "answerOptions": [
                {
                  "text": "After school, you can choose a job you love, like helping people or working with animals.",
                  "rationale": "1. Phân tích từ vựng:\n- After school (phrase): Sau khi học xong (ra trường).\n- Choose a job (v): chọn một công việc.\n- Like (prep): như là (liệt kê).\n- Working with animals (phrase): làm việc với động vật.\n\n2. Dịch nghĩa: 'Sau khi ra trường, bạn có thể chọn một công việc bạn yêu thích, như giúp đỡ mọi người hoặc làm việc với động vật.'\n\n3. Giải thích: Cấu trúc S + V + O. 'Like' dùng để liệt kê ví dụ (helping people or working with animals).",
                  "isCorrect": true
                },
                {
                  "text": "After school, you can choose a job like helping people or working with animals you love.",
                  "rationale": "1. Phân tích: Sai vị trí mệnh đề quan hệ.\n2. Giải thích: 'You love' bổ nghĩa cho 'a job', nên phải đứng ngay sau 'a job'.",
                  "isCorrect": false
                },
                {
                  "text": "You can choose a job you love, like working with animals or helping people after school.",
                  "rationale": "1. Phân tích: Sai vị trí trạng ngữ thời gian.\n2. Giải thích: 'After school' ở cuối câu có thể gây hiểu nhầm là giúp đỡ mọi người 'sau giờ học' (hàng ngày) chứ không phải 'sau khi tốt nghiệp'.",
                  "isCorrect": false
                },
                {
                  "text": "After school, a job you love can choose you, like helping people or working with animals.",
                  "rationale": "1. Phân tích: Sai chủ ngữ - vị ngữ.\n2. Giải thích: Công việc không thể 'chọn' bạn trong ngữ cảnh này.",
                  "isCorrect": false
                }
              ],
              "hint": "Cấu trúc: S + can choose + O + (mệnh đề quan hệ) + like + V-ing..."
            },
            {
              "questionNumber": 2,
              "question": "Exercise 1 - Q2: Arrange the words to make a correct sentence:\n(many/ to/ explore, / from/ a teacher/ to/ your own business. / There are/ becoming/ career paths/ starting/)",
              "answerOptions": [
                {
                  "text": "There are many career paths to explore, from becoming a teacher to starting your own business.",
                  "rationale": "1. Phân tích từ vựng:\n- Career paths (n): con đường sự nghiệp.\n- Explore (v): khám phá.\n- From... to...: từ... đến...\n- Start your own business (v): tự khởi nghiệp.\n\n2. Dịch nghĩa: 'Có rất nhiều con đường sự nghiệp để khám phá, từ việc trở thành giáo viên đến việc tự kinh doanh.'\n\n3. Giải thích: Cấu trúc 'There are + N + to V'. Cấu trúc liệt kê 'From V-ing to V-ing'.",
                  "isCorrect": true
                },
                {
                  "text": "There are many career paths from becoming a teacher to starting your own business to explore.",
                  "rationale": "1. Phân tích: Sai vị trí động từ 'to explore'.\n2. Giải thích: 'To explore' nên đứng ngay sau danh từ nó bổ nghĩa (career paths) trước khi liệt kê.",
                  "isCorrect": false
                },
                {
                  "text": "There are becoming a teacher to starting your own business from many career paths to explore.",
                  "rationale": "1. Phân tích: Sai cấu trúc hoàn toàn.\n2. Giải thích: Không có nghĩa.",
                  "isCorrect": false
                },
                {
                  "text": "Many career paths are there to explore, from becoming a teacher to starting your own business.",
                  "rationale": "1. Phân tích: Đảo ngữ không tự nhiên.\n2. Giải thích: Cấu trúc 'There are...' tự nhiên hơn.",
                  "isCorrect": false
                }
              ],
              "hint": "Cấu trúc: There are + N... From A to B."
            },
            {
              "questionNumber": 3,
              "question": "Exercise 1 - Q3: Arrange the words to make a correct sentence:\n(work experience/ or/ take/ further education. / can/ get/ You/)",
              "answerOptions": [
                {
                  "text": "You can get work experience or take further education.",
                  "rationale": "1. Phân tích từ vựng:\n- Get work experience (v): tích lũy kinh nghiệm làm việc.\n- Take further education (v): học lên cao/học thêm.\n\n2. Dịch nghĩa: 'Bạn có thể tích lũy kinh nghiệm làm việc hoặc học lên cao hơn.'\n\n3. Giải thích: Chủ ngữ You + can + V1 (get) + or + V2 (take).",
                  "isCorrect": true
                },
                {
                  "text": "You can take work experience or get further education.",
                  "rationale": "1. Phân tích: Sai kết hợp từ (Collocation).\n2. Giải thích: Ta dùng 'get/gain experience' và 'take a course/education', không dùng ngược lại.",
                  "isCorrect": false
                },
                {
                  "text": "You can get further education or take work experience.",
                  "rationale": "1. Phân tích: Sai kết hợp từ.\n2. Giải thích: Tương tự đáp án trên.",
                  "isCorrect": false
                },
                {
                  "text": "Work experience can get you or take further education.",
                  "rationale": "1. Phân tích: Sai nghĩa.\n2. Giải thích: Kinh nghiệm không thể 'lấy' bạn.",
                  "isCorrect": false
                }
              ],
              "hint": "Collocation: Get experience; Take education."
            },
            {
              "questionNumber": 4,
              "question": "Exercise 1 - Q4: Arrange the words to make a correct sentence:\n(choose/ while/ others/ pursue/ like/ art or music. / Some people/ traditional careers,/ creative fields/)",
              "answerOptions": [
                {
                  "text": "Some people choose traditional careers, while others pursue creative fields like art or music.",
                  "rationale": "1. Phân tích từ vựng:\n- Traditional careers (n): nghề nghiệp truyền thống.\n- Pursue (v): theo đuổi.\n- Creative fields (n): lĩnh vực sáng tạo.\n- While (conj): trong khi (chỉ sự đối lập).\n\n2. Dịch nghĩa: 'Một số người chọn các nghề nghiệp truyền thống, trong khi những người khác theo đuổi các lĩnh vực sáng tạo như nghệ thuật hay âm nhạc.'\n\n3. Giải thích: Cấu trúc so sánh: Some people... while others...",
                  "isCorrect": true
                },
                {
                  "text": "While some people choose creative fields like art or music, others pursue traditional careers.",
                  "rationale": "1. Phân tích: Ngữ pháp đúng nhưng sai so với trật tự từ gợi ý.\n2. Giải thích: Đề bài nhóm từ 'creative fields' đi với 'like art or music', và 'others' đi với 'pursue'. Cần sắp xếp đúng cụm từ.",
                  "isCorrect": false
                },
                {
                  "text": "Some people pursue traditional careers, while others choose creative fields like art or music.",
                  "rationale": "1. Phân tích: Đổi động từ.\n2. Giải thích: Đề bài cho 'choose' đi với nhóm đầu và 'pursue' đi với nhóm sau (dựa vào ngữ cảnh collocation 'pursue fields').",
                  "isCorrect": false
                },
                {
                  "text": "Others choose traditional careers, while some people pursue creative fields like art or music.",
                  "rationale": "1. Phân tích: Đảo chủ ngữ.\n2. Giải thích: Thường dùng 'Some... others...' theo thứ tự.",
                  "isCorrect": false
                }
              ],
              "hint": "Cấu trúc: Some people... while others..."
            },
            {
              "questionNumber": 5,
              "question": "Exercise 1 - Q5: Arrange the words to make a correct sentence:\n(important thing/ is/ a career/ The most/ that / you/ happy/ and /your skills/ to find/ makes/ uses)",
              "answerOptions": [
                {
                  "text": "The most important thing is to find a career that uses your skills and makes you happy.",
                  "rationale": "1. Phân tích từ vựng:\n- The most important thing (n): Điều quan trọng nhất.\n- Uses your skills: sử dụng kỹ năng của bạn.\n- Makes you happy: làm bạn hạnh phúc.\n\n2. Dịch nghĩa: 'Điều quan trọng nhất là tìm được một công việc sử dụng các kỹ năng của bạn và khiến bạn hạnh phúc.'\n\n3. Giải thích: Cấu trúc 'The most... is to V'. Mệnh đề quan hệ 'that' bổ nghĩa cho 'a career'.",
                  "isCorrect": true
                },
                {
                  "text": "The most important thing is to find a career that makes you skills and uses your happy.",
                  "rationale": "1. Phân tích: Sai nghĩa.\n2. Giải thích: 'Makes you skills' là vô nghĩa.",
                  "isCorrect": false
                },
                {
                  "text": "To find a career that uses your skills and makes you happy is the most important thing.",
                  "rationale": "1. Phân tích: Đúng ngữ pháp nhưng đảo ngược.\n2. Giải thích: Đề bài cho 'The most important thing' viết hoa chữ T, gợi ý nó đứng đầu câu.",
                  "isCorrect": false
                },
                {
                  "text": "The most important thing is that to find a career uses your skills and makes you happy.",
                  "rationale": "1. Phân tích: Thừa từ 'that'.\n2. Giải thích: Sau 'is' là 'to find', không dùng 'that' ở đây.",
                  "isCorrect": false
                }
              ],
              "hint": "S + is + to V + O + (relative clause)."
            },
            {
              "questionNumber": 6,
              "question": "Exercise 2 - Q1: Although she loves Maths, she has decided to become an English teacher.\n🡪 In spite of ____________________",
              "answerOptions": [
                {
                  "text": "In spite of loving Maths, she has decided to become an English teacher.",
                  "rationale": "1. Phân tích:\n- Although + Clause (S + V).\n- In spite of + Noun / V-ing.\n- love (v) -> loving (V-ing).\n\n2. Dịch nghĩa: 'Mặc dù yêu thích môn Toán, cô ấy vẫn quyết định trở thành giáo viên tiếng Anh.'\n\n3. Giải thích: Chuyển động từ 'loves' thành danh động từ 'loving' vì chủ ngữ 2 vế giống nhau (she).",
                  "isCorrect": true
                },
                {
                  "text": "In spite of she loves Maths, she has decided to become an English teacher.",
                  "rationale": "1. Phân tích: Sai ngữ pháp.\n2. Giải thích: 'In spite of' không đi với mệnh đề (she loves).",
                  "isCorrect": false
                },
                {
                  "text": "In spite of her love Maths, she has decided to become an English teacher.",
                  "rationale": "1. Phân tích: Thiếu giới từ.\n2. Giải thích: Phải là 'her love FOR Maths'.",
                  "isCorrect": false
                },
                {
                  "text": "In spite of to love Maths, she has decided to become an English teacher.",
                  "rationale": "1. Phân tích: Sai ngữ pháp.\n2. Giải thích: Không dùng 'to V' sau giới từ.",
                  "isCorrect": false
                }
              ],
              "hint": "In spite of + V-ing (khi cùng chủ ngữ) hoặc Noun phrase."
            },
            {
              "questionNumber": 7,
              "question": "Exercise 2 - Q2: He studied hard, but he didn’t pass the exam.\n🡪 Despite ____________________",
              "answerOptions": [
                {
                  "text": "Despite studying hard, he didn’t pass the exam.",
                  "rationale": "1. Phân tích:\n- Clause 1 + but + Clause 2.\n- Despite + V-ing (cùng chủ ngữ 'he').\n\n2. Dịch nghĩa: 'Mặc dù học chăm chỉ, anh ấy vẫn không qua kỳ thi.'\n\n3. Giải thích: Chuyển 'He studied' thành 'studying' sau giới từ 'Despite'.",
                  "isCorrect": true
                },
                {
                  "text": "Despite he studied hard, he didn’t pass the exam.",
                  "rationale": "1. Phân tích: Sai ngữ pháp.\n2. Giải thích: Despite không đi với mệnh đề.",
                  "isCorrect": false
                },
                {
                  "text": "Despite of studying hard, he didn’t pass the exam.",
                  "rationale": "1. Phân tích: Sai ngữ pháp.\n2. Giải thích: Không có 'Despite of' (chỉ có In spite of).",
                  "isCorrect": false
                },
                {
                  "text": "Despite his study hard, he didn’t pass the exam.",
                  "rationale": "1. Phân tích: Sai từ loại.\n2. Giải thích: 'Hard' là tính từ/trạng từ, 'study' ở đây là danh từ thì phải dùng 'hard study' hoặc 'studying hard'.",
                  "isCorrect": false
                }
              ],
              "hint": "Despite + V-ing."
            },
            {
              "questionNumber": 8,
              "question": "Exercise 2 - Q3: Despite his laziness, he was given the job.\n🡪 Even though ____________________",
              "answerOptions": [
                {
                  "text": "Even though he was lazy, he was given the job.",
                  "rationale": "1. Phân tích:\n- Despite + Noun phrase (his laziness).\n- Even though + Clause (S + V).\n- Laziness (n) -> Lazy (adj).\n\n2. Dịch nghĩa: 'Mặc dù anh ấy lười biếng, anh ấy vẫn được nhận việc.'\n\n3. Giải thích: Chuyển cụm danh từ 'his laziness' thành mệnh đề 'he was lazy'.",
                  "isCorrect": true
                },
                {
                  "text": "Even though his laziness, he was given the job.",
                  "rationale": "1. Phân tích: Sai ngữ pháp.\n2. Giải thích: Even though cần mệnh đề.",
                  "isCorrect": false
                },
                {
                  "text": "Even though he is lazy, he was given the job.",
                  "rationale": "1. Phân tích: Sai thì.\n2. Giải thích: Vế sau 'was given' (quá khứ), nên vế đầu cũng phải là quá khứ 'was lazy'.",
                  "isCorrect": false
                },
                {
                  "text": "Even though being lazy, he was given the job.",
                  "rationale": "1. Phân tích: Sai ngữ pháp.\n2. Giải thích: Even though không đi với V-ing trực tiếp mà phải có chủ ngữ.",
                  "isCorrect": false
                }
              ],
              "hint": "Even though + S + V. (Laziness -> was lazy)."
            },
            {
              "questionNumber": 9,
              "question": "Exercise 2 - Q4: Despite being short, he has been accepted into the volleyball team.\n🡪 Although ____________________",
              "answerOptions": [

        let currentScore = 0;

        // --- RENDER FUNCTIONS ---
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.textContent = `Điểm: 0/${totalQuestions}`;

            quizData.questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = "question-card p-6 md:p-8 animate-fade-in-up";
                card.style.animationDelay = `${index * 0.1}s`;

                // Format explanation text (convert newlines to <br>)
                const formattedQuestion = q.question.replace(/\n/g, '<br>');

                // HTML Structure for a single question card
                card.innerHTML = `
                    <div class="flex items-start mb-6">
                        <div class="question-number-badge text-white font-bold rounded-full w-10 h-10 flex items-center justify-center flex-shrink-0 mr-4 text-lg">
                            ${q.questionNumber}
                        </div>
                        <div class="text-xl font-bold text-gray-800 leading-relaxed">
                            ${formattedQuestion}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        ${q.answerOptions.map((opt, optIndex) => `
                            <button 
                                id="btn-${index}-${optIndex}"
                                onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect})"
                                class="btn-3d option-btn p-4 text-left h-full flex items-center"
                            >
                                <span class="bg-gray-200 text-gray-700 font-bold rounded-full w-8 h-8 flex items-center justify-center mr-3 flex-shrink-0">
                                    ${String.fromCharCode(65 + optIndex)}
                                </span>
                                <span>${opt.text}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Explanation Box (Initially Hidden) -->
                    <div id="explanation-${index}" class="explanation-box">
                        <div class="flex items-center mb-2 text-purple-700">
                            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                            <h3 class="font-bold text-lg">Lời giải chi tiết của Ms. Chí Nên · ☎️ 0852639652:</h3>
                        </div>
                        <div class="text-gray-700 whitespace-pre-line leading-relaxed border-t border-purple-100 pt-2" id="explanation-content-${index}">
                           <!-- Explanation content will be inserted here dynamically based on selection -->
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- INTERACTION LOGIC ---
        function checkAnswer(qIndex, optIndex, isCorrect) {
            const soundCorrect = document.getElementById('sound-correct');
            const soundWrong = document.getElementById('sound-wrong');
            const explanationBox = document.getElementById(`explanation-${qIndex}`);
            const explanationContent = document.getElementById(`explanation-content-${qIndex}`);
            const questionData = quizData.questions[qIndex];
            const selectedOptionData = questionData.answerOptions[optIndex];

            // 1. Play Sound
            if (isCorrect) {
                soundCorrect.currentTime = 0;
                soundCorrect.play();
                triggerConfetti();
                currentScore++;
                document.getElementById('score-display').textContent = `Điểm: ${currentScore}/${totalQuestions}`;
            } else {
                soundWrong.currentTime = 0;
                soundWrong.play();
            }

            // 2. Disable buttons and Visual Feedback
            const buttons = document.querySelectorAll(`[id^="btn-${qIndex}-"]`);
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
                
                // Always highlight the correct answer in Green
                if (questionData.answerOptions[idx].isCorrect) {
                     btn.classList.add('correct');
                     btn.classList.remove('opacity-70');
                }
            });

            // Highlight selected wrong answer in Red
            if (!isCorrect) {
                document.getElementById(`btn-${qIndex}-${optIndex}`).classList.add('wrong');
                document.getElementById(`btn-${qIndex}-${optIndex}`).classList.remove('opacity-70');
            }

            // 3. SHOW EXPLANATION (Crucial Requirement: Show immediately)
            // Use the rationale from the Correct option or the selected option? 
            // The prompt implies showing "Why correct is correct" and "Why wrong is wrong".
            // The JSON structure provides a `rationale` specific to each option usually, OR a general one.
            // In this specific JSON, EACH option has a specific rationale explaining why it is right or wrong.
            // WE WILL SHOW THE RATIONALE OF THE **SELECTED** OPTION + THE CORRECT OPTION if wrong.
            
            let explanationText = "";
            
            // If they clicked the correct answer
            if (isCorrect) {
                 explanationText = `<strong>🎉 Chính xác!</strong>\n\n${selectedOptionData.rationale}`;
            } else {
                // If they clicked the wrong answer
                // Find correct option for comparison
                const correctOpt = questionData.answerOptions.find(o => o.isCorrect);
                explanationText = `<strong>⚠️ Sai rồi!</strong>\n\n<strong>Tại sao câu bạn chọn sai:</strong>\n${selectedOptionData.rationale}\n\n<strong>Đáp án đúng là (${correctOpt.text}):</strong>\n${correctOpt.rationale}`;
            }

            // If the JSON puts the full explanation only in the correct answer (common in some datasets), 
            // we might want to default to showing the correct answer's rationale always. 
            // Checking the dataset: It seems every option has a rationale. Good.
            // However, to be most helpful (Teacher mode), let's show the rationale of the CORRECT answer primarily, 
            // as it contains the vocabulary analysis and translation usually.
            
            const correctOption = questionData.answerOptions.find(o => o.isCorrect);
            
            // Construct the "Teacher Explanation"
            // We use the rationale from the CORRECT answer because it contains the "Analysis", "Translation", and "Explanation" structure required.
            explanationContent.innerHTML = correctOption.rationale.replace(/\n/g, '<br>');

            // Reveal the box
            explanationBox.classList.add('show');
        }

        // --- EFFECTS ---
        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#FFD700']
            });
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const modalContent = document.getElementById('modal-content');
            const finalScoreEl = document.getElementById('final-score');
            const msgEl = document.getElementById('result-message');
            
            finalScoreEl.textContent = `${currentScore}/${totalQuestions}`;
            
            const percentage = (currentScore / totalQuestions) * 100;
            if (percentage === 100) msgEl.textContent = "Xuất sắc! Ms. Chí Nên · ☎️ 0852639652rất tự hào về em! 🌟";
            else if (percentage >= 80) msgEl.textContent = "Giỏi lắm! Cố gắng thêm chút nữa là hoàn hảo! 🔥";
            else if (percentage >= 50) msgEl.textContent = "Khá tốt! Hãy xem lại phần giải thích các câu sai nhé! 📚";
            else msgEl.textContent = "Cần cố gắng nhiều hơn nha! Đừng nản chí! 💪";

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-0');
                triggerConfetti();
            }, 100);
        }

        function closeModal() {
            window.scrollTo(0, 0);
            location.reload();
        }
