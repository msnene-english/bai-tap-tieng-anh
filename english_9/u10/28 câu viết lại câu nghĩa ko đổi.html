<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chí Nên - Writing Practice: Sentence Building</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --accent-color: #FF9F43; /* Cam */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #F0F3F7;
            --card-bg: #FFFFFF;
            --text-color: #2F3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#dbe3eb 15%, transparent 16%), radial-gradient(#dbe3eb 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #eee;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .teacher-name {
            font-family: 'Quicksand', sans-serif;
            color: var(--secondary-color);
            font-size: 1rem;
            font-weight: 700;
        }

        /* --- Game Container --- */
        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            padding: 30px;
            position: relative;
            border: 3px solid #E1E8ED;
        }

        /* --- Progress Bar --- */
        .progress-wrapper {
            width: 100%;
            height: 12px;
            background-color: #E0E0E0;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        /* --- Score Board --- */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .score-display {
            color: var(--accent-color);
            background: #FFF3CD;
            padding: 5px 15px;
            border-radius: 15px;
            border: 2px solid #FFEBA7;
        }

        .question-count {
            color: var(--primary-color);
            background: #EDE4FF;
            padding: 5px 15px;
            border-radius: 15px;
            border: 2px solid #D1C4E9;
        }

        /* --- Question --- */
        .question-box {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #2c3e50;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid var(--primary-color);
        }

        /* --- Options --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1.1rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            box-shadow: 0 4px 0 #ccc; /* 3D Effect */
            font-weight: 600;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #bbb;
            border-color: var(--primary-color);
            background-color: #F8F0FF;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ccc;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00B85C;
            box-shadow: 0 4px 0 #008F47;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #FF2E40;
            box-shadow: 0 4px 0 #D11A2B;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
            transform: none !important;
        }

        /* --- Explanation --- */
        .explanation-container {
            margin-top: 25px;
            background: #F1F9FF;
            border: 2px solid #BEE3F8;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: #3182CE;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2D3748;
        }
        
        .explanation-content strong {
            color: #C53030;
        }

        .explanation-step {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #cbd5e0;
        }
        .explanation-step:last-child {
            border-bottom: none;
        }
        .explanation-step-title {
            font-weight: 700;
            color: var(--primary-color);
            display: block;
            margin-bottom: 4px;
        }

        /* --- Next Button --- */
        .next-btn {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #009E82;
            transition: transform 0.2s;
            display: none; /* Hidden initially */
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #009E82;
        }
        
        .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #009E82;
        }

        /* --- End Screen --- */
        .end-screen {
            text-align: center;
            display: none;
        }

        .end-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-color);
            margin: 20px 0;
        }

        .restart-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            box-shadow: 0 5px 0 #E58E26;
            cursor: pointer;
        }

        /* --- Animations --- */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .question-box {
                font-size: 1.1rem;
            }
            .option-btn {
                font-size: 0.95rem;
            }
            .game-container {
                padding: 15px;
            }
        }
    </style>

<style>#lockModal, #passwordModal, #pwModal, .modal-overlay[id*="lock"], .modal-overlay[id*="pass"] { display: none !important; visibility: hidden !important; pointer-events: none !important; z-index: -9999 !important; }</style>
</head>

        <h1>Writing Practice</h1>
        <div class="teacher-name">Ms. Chí Nên · ☎️ 0852639652 ()</div>

    <div class="game-container">
        
        <!-- Progress & Stats -->
        <div class="progress-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="stats-bar">
            <div class="question-count">Câu: <span id="current-q">1</span>/<span id="total-q">28</span></div>
            <div class="score-display">Điểm: <span id="score">0</span></div>
        </div>

        <!-- Gameplay Area -->
        <div id="quiz-area">
            <div class="question-box" id="question-text">
                Loading question...
            </div>

            <div class="options-grid" id="options-container">
                <!-- Options will be injected here -->
            </div>

            <!-- Explanation Box -->
            <div class="explanation-container" id="explanation-box">
                <div class="explanation-header">
                    <span>💡 Giải thích chi tiết của Ms. Chí Nên · ☎️ 0852639652:</span>
                </div>
                <div class="explanation-content" id="explanation-text">
                    <!-- Explanation content -->
                </div>
            </div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➜</button>

        <!-- End Screen -->
        <div class="end-screen" id="end-screen">
            <h2>🎉 HOÀN THÀNH XUẤT SẮC! 🎉</h2>
            <p>Bạn đã làm rất tốt bài tập hôm nay.</p>
            <div class="end-score" id="final-score">0/0</div>
            <div id="praise-text" style="font-size: 1.2rem; color: #555; margin-bottom: 20px;"></div>
            <button class="restart-btn" onclick="restartQuiz()">Làm lại bài này</button>
        </div>

    </div>

    <!-- Canvas for Confetti -->
    <canvas id="confetti-canvas" style="position: fixed; top: 0; left: 0; pointer-events: none; z-index: 99;"></canvas>

    <script>
        // --- DATA ---
        const quizData = [
            {
                "question": "Exercise 1 - Q1: Make a complete sentence.\nWe / all / know / single day / 24 / hour / long.",
                "options": [
                    "We all know that a single day is 24 hours long.",
                    "We all know single day are 24 hour long.",
                    "We all knowing a single day is 24 hours length.",
                    "We all know that single day were 24 hours long."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> We all know (chúng ta đều biết), single day (một ngày đơn lẻ), 24 hours (24 giờ), long (dài).<br><b>2. Dịch:</b> Chúng ta đều biết rằng một ngày dài 24 giờ.<br><b>3. Giải thích:</b> Cần thêm 'that' (rằng) để nối mệnh đề (tuy có thể lược bỏ nhưng trong văn viết nên có). 'A single day' là chủ ngữ số ít -> động từ to be 'is'. '24' là số nhiều -> 'hour' phải thêm 's' thành 'hours'."
            },
            {
                "question": "Exercise 1 - Q2: Make a complete sentence.\nHowever, / this / only true / for / day / on / planet Earth.",
                "options": [
                    "However, this is only true for a day on planet Earth.",
                    "However, this only true for day on planet Earth.",
                    "However, this is only true for the day on planet Earth.",
                    "However, this are only true for a day on planet Earth."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> However (tuy nhiên), true (đúng), planet Earth (trái đất).<br><b>2. Dịch:</b> Tuy nhiên, điều này chỉ đúng với một ngày trên Trái đất.<br><b>3. Giải thích:</b> 'This' là chủ ngữ số ít -> cần thêm động từ to be 'is' trước tính từ 'true'. Cần thêm mạo từ 'a' trước danh từ số ít đếm được 'day'."
            },
            {
                "question": "Exercise 1 - Q3: Make a complete sentence.\nThat / because / it / take / Earth / 24 / hour / make / one rotation /, or / turn.",
                "options": [
                    "That is because it takes Earth 24 hours to make one rotation, or turn.",
                    "That because it take Earth 24 hours make one rotation, or turn.",
                    "That is because it takes Earth 24 hour to making one rotation, or turn.",
                    "That is because it took Earth 24 hours to make one rotation, or turn."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> It takes + [time] + to V (Mất bao lâu để làm gì).<br><b>2. Dịch:</b> Đó là bởi vì Trái đất mất 24 giờ để thực hiện một vòng quay, hay một lượt xoay.<br><b>3. Giải thích:</b> Cấu trúc 'It takes + O + time + to V'. Chủ ngữ giả 'It' đi với 'takes' (thêm s). '24 hours' số nhiều. Động từ chỉ mục đích là 'to make'."
            },
            {
                "question": "Exercise 1 - Q4: Make a complete sentence.\nDifferent planets / take / different / amount / of time / rotate.",
                "options": [
                    "Different planets take different amounts of time to rotate.",
                    "Different planets takes different amount of time rotate.",
                    "Different planets take different amount of time rotating.",
                    "Different planets take different amounts of time for rotate."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Different planets (các hành tinh khác nhau), amount of time (lượng thời gian), rotate (xoay).<br><b>2. Dịch:</b> Các hành tinh khác nhau mất lượng thời gian khác nhau để tự xoay.<br><b>3. Giải thích:</b> 'Planets' số nhiều -> 'take' giữ nguyên. 'Amounts' nên để số nhiều vì nói về nhiều hành tinh khác nhau. Cấu trúc 'take time TO V' (để xoay)."
            },
            {
                "question": "Exercise 1 - Q5: Make a complete sentence.\nOne day / on / planet Mercury / take / over / 58 / day / in / Earth time.",
                "options": [
                    "One day on planet Mercury takes over 58 days in Earth time.",
                    "One day on planet Mercury take over 58 day in Earth time.",
                    "One day on planet Mercury takes over 58 days on Earth time.",
                    "One day on planet Mercury taking over 58 days in Earth time."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Mercury (sao Thủy), Earth time (giờ Trái đất).<br><b>2. Dịch:</b> Một ngày trên sao Thủy mất hơn 58 ngày tính theo giờ Trái đất.<br><b>3. Giải thích:</b> Chủ ngữ chính là 'One day' (số ít) -> động từ 'take' phải thêm 's' thành 'takes'. '58' là số nhiều -> 'day' phải thêm 's' thành 'days'."
            },
            {
                "question": "Exercise 1 - Q6: Make a complete sentence.\nA day / on / planet Venus / 243 / Earth day / long / -longest day.",
                "options": [
                    "A day on planet Venus is 243 Earth days long - the longest day.",
                    "A day on planet Venus 243 Earth days long - longest day.",
                    "A day on planet Venus is 243 Earth day long - the longest day.",
                    "A day on planet Venus are 243 Earth days long - a longest day."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Venus (sao Kim), longest (dài nhất).<br><b>2. Dịch:</b> Một ngày trên sao Kim dài 243 ngày Trái đất - ngày dài nhất.<br><b>3. Giải thích:</b> Cần động từ 'is' nối chủ ngữ và tính từ 'long'. '243' số nhiều -> 'days'. So sánh nhất 'longest' bắt buộc phải có mạo từ 'the'."
            },
            {
                "question": "Exercise 1 - Q7: Make a complete sentence.\nJupiter, / largest planet, / have / shortest day / -just / 9.9 / Earth hour.",
                "options": [
                    "Jupiter, the largest planet, has the shortest day - just 9.9 Earth hours.",
                    "Jupiter, largest planet, have shortest day - just 9.9 Earth hour.",
                    "Jupiter, the largest planet, having the shortest day - just 9.9 Earth hours.",
                    "Jupiter, a largest planet, has a shortest day - just 9.9 Earth hours."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Jupiter (sao Mộc), largest (lớn nhất), shortest (ngắn nhất).<br><b>2. Dịch:</b> Sao Mộc, hành tinh lớn nhất, có ngày ngắn nhất - chỉ 9.9 giờ Trái đất.<br><b>3. Giải thích:</b> Cụm đồng vị ngữ 'largest planet' cần 'the' (so sánh nhất). Chủ ngữ Jupiter số ít -> 'has'. 'Shortest day' cần 'the'. '9.9' lớn hơn 1 -> 'hours' số nhiều."
            },
            {
                "question": "Exercise 2 - Q1: Complete the sentence using GOING.\nWe were on our way home when we saw an elephant crossing the highway.\n-> While __________________________",
                "options": [
                    "While we were going home, we saw an elephant crossing the highway.",
                    "While we went home, we saw an elephant crossing the highway.",
                    "While going home, we saw an elephant crossing the highway.",
                    "While we are going home, we saw an elephant crossing the highway."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> 'On our way home' = 'going home'. Cấu trúc While + Quá khứ tiếp diễn (hành động đang xảy ra) -> Quá khứ đơn (hành động xen vào).<br><b>2. Dịch:</b> Khi chúng tôi đang trên đường về nhà, chúng tôi thấy một con voi băng qua đường cao tốc.<br><b>3. Giải thích:</b> Dùng 'were going' để thay thế cho 'were on our way'."
            },
            {
                "question": "Exercise 2 - Q2: Complete the sentence using FIND.\nThe children are always fascinated by wildlife documentaries.\n-> The children __________________________",
                "options": [
                    "The children always find wildlife documentaries fascinating.",
                    "The children always find wildlife documentaries fascinated.",
                    "The children are always find wildlife documentaries fascinating.",
                    "The children find always wildlife documentaries fascinating."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Cấu trúc S + find + O + adj (Thấy cái gì đó như thế nào).<br><b>2. Dịch:</b> Lũ trẻ luôn thấy phim tài liệu về động vật hoang dã rất hấp dẫn.<br><b>3. Giải thích:</b> 'Fascinated by' (bị cuốn hút bởi) chuyển thành 'find... fascinating' (thấy... hấp dẫn). 'Fascinating' dùng cho vật (documentaries)."
            },
            {
                "question": "Exercise 2 - Q3: Complete the sentence using WHOSE.\nThe cheetah is the fastest land animal on Earth. Its speed can reach up to 70 mph.\n-> The cheetah, __________________________",
                "options": [
                    "The cheetah, whose speed can reach up to 70 mph, is the fastest land animal on Earth.",
                    "The cheetah, whose speed is the fastest land animal on Earth, can reach up to 70 mph.",
                    "The cheetah, whose is the fastest land animal on Earth, speed can reach up to 70 mph.",
                    "The cheetah whose speed can reach up to 70 mph is the fastest land animal on Earth."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Dùng đại từ quan hệ sở hữu 'whose' thay cho tính từ sở hữu 'Its'.<br><b>2. Dịch:</b> Báo Cheetah, loài mà tốc độ có thể đạt tới 70 dặm/giờ, là động vật trên cạn nhanh nhất Trái đất.<br><b>3. Giải thích:</b> Mệnh đề quan hệ 'whose speed can reach...' được đặt ngay sau chủ ngữ 'The cheetah'. Cần dấu phẩy vì Cheetah là danh từ xác định."
            },
            {
                "question": "Exercise 2 - Q4: Complete the sentence using TOO.\nThe polar regions aren’t warm enough for trees to grow into dense forests.\n-> The polar regions __________________________",
                "options": [
                    "The polar regions are too cold for trees to grow into dense forests.",
                    "The polar regions are too warm for trees to grow into dense forests.",
                    "The polar regions aren't too warm for trees to grow into dense forests.",
                    "The polar regions are too cold that trees to grow into dense forests."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> 'Not warm enough' (không đủ ấm) = 'Too cold' (quá lạnh).<br><b>2. Dịch:</b> Các vùng cực quá lạnh để cây cối có thể phát triển thành rừng rậm.<br><b>3. Giải thích:</b> Cấu trúc: S + be + too + adj + (for O) + to V."
            },
            {
                "question": "Exercise 2 - Q5: Complete the sentence using IF.\n“Can you imagine how life on a planet without plants would be?” she said to me.\n-> She asked me __________________________",
                "options": [
                    "She asked me if I could imagine how life on a planet without plants would be.",
                    "She asked me if I can imagine how life on a planet without plants would be.",
                    "She asked me if could I imagine how life on a planet without plants would be.",
                    "She asked me if you could imagine how life on a planet without plants would be."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Câu tường thuật câu hỏi Yes/No -> dùng 'if'.<br><b>2. Dịch:</b> Cô ấy hỏi tôi liệu tôi có thể tưởng tượng cuộc sống trên một hành tinh không có cây cối sẽ ra sao không.<br><b>3. Giải thích:</b> Đổi ngôi 'you' -> 'I', lùi thì 'Can' -> 'Could'. Không đảo ngữ trong câu tường thuật."
            },
            {
                "question": "Exercise 2 - Q6: Complete the sentence using WHICH.\nShe is reading a book. The book is about the first Asian to travel into space.\n-> The book __________________________",
                "options": [
                    "The book which she is reading is about the first Asian to travel into space.",
                    "The book which is about the first Asian to travel into space is reading her.",
                    "The book, which she is reading is about the first Asian to travel into space.",
                    "The book about which she is reading is the first Asian to travel into space."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Dùng đại từ quan hệ 'which' thay cho 'The book' ở câu đầu.<br><b>2. Dịch:</b> Cuốn sách mà cô ấy đang đọc viết về người châu Á đầu tiên bay vào vũ trụ.<br><b>3. Giải thích:</b> Mệnh đề quan hệ 'which she is reading' bổ nghĩa cho 'The book'. Không dùng dấu phẩy vì đây là mệnh đề xác định."
            },
            {
                "question": "Exercise 2 - Q7: Complete the sentence using WISH.\nIt’s a pity we don’t have any clean-up activities in our neighbourhood.\n-> I __________________________",
                "options": [
                    "I wish we had some clean-up activities in our neighbourhood.",
                    "I wish we have some clean-up activities in our neighbourhood.",
                    "I wish we didn't have any clean-up activities in our neighbourhood.",

            {
                "question": "Exercise 2 - Q8: Complete the sentence using UNLESS.\nIf the government doesn’t take action, half of the rainforest will disappear soon.\n-> Half of the rainforest __________________________",

            {

            },

                "rationale": "<b>1. Phân tích:</b> Kết hợp hành động quan sát dẫn đến kết quả.<br><b>2. Dịch:</b> Isaac Newton quan sát quả táo rơi, điều này giúp ông phát triển thuyết vạn vật hấp dẫn.<br><b>3. Giải thích:</b> 'Which' ở đây thay thế cho cả mệnh đề phía trước (việc quan sát táo). Đây là cách nối câu tự nhiên nhất."
            },
            {
                "question": "Exercise 3 - Q5: Combine the sentences.\nLouis Pasteur developed a vaccine for rabies. It saved countless lives.",

                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Rabies (bệnh dại), countless (vô số).<br><b>2. Dịch:</b> Louis Pasteur đã phát triển vắc-xin bệnh dại, thứ đã cứu vô số mạng sống.<br><b>3. Giải thích:</b> 'Which' thay thế cho danh từ 'vaccine' ngay trước nó."
            },
            {
                "question": "Exercise 3 - Q6: Combine the sentences.\nThe Amazon rainforest is a vast jungle. Humans have lived there for thousands of years.",

            },

            {

            },
            {
                "question": "Exercise 4 - Q3: Choose the CLOSEST meaning.\nHumans often use natural habitats for farming and housing.",
                "options": [
                    "Natural habitats are often used for farming and housing.",

                    "Humans have always used living habitats to farm."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Chuyển sang câu bị động.<br><b>2. Dịch:</b> Các môi trường sống tự nhiên thường được sử dụng cho canh tác và nhà ở.<br><b>3. Giải thích:</b> Chủ động: Humans use habitats -> Bị động: Habitats are used (by humans - lược bỏ)."
            },
            {
                "question": "Exercise 4 - Q4: Choose the CLOSEST meaning.\nThe Arctic Ocean ice and water make up habitats for polar bears.",
                "options": [
                    "The habitats for polar bears are Arctic Ocean ice and water.",

                    "The Arctic Ocean makes up habitats for animals like polar bears."

                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Make up (tạo thành) -> Are (là/cấu thành).<br><b>2. Dịch:</b> Môi trường sống của gấu bắc cực là băng và nước Bắc Băng Dương.<br><b>3. Giải thích:</b> Đảo ngữ để nhấn mạnh định nghĩa môi trường sống."
            },
            {
                "question": "Exercise 4 - Q5: Choose the CLOSEST meaning.\nThe flora and fauna on Earth create an ecological balance.",
                "options": [
                    "Thanks to the flora and fauna, there is ecological balance on Earth.",
                    "There is ecological balance due to the flora and fauna.",
                    "Earth creates flora and fauna for ecological balance.",
                    "The flora and fauna are results of an ecological balance."
                ],
                "correct": 0,
                "rationale": "<b>1. Phân tích:</b> Create (tạo ra) -> Thanks to... there is (Nhờ có... mà có).<br><b>2. Dịch:</b> Nhờ có hệ thực vật và động vật, có sự cân bằng sinh thái trên Trái đất.<br><b>3. Giải thích:</b> Diễn đạt lại nguyên nhân - kết quả. Câu A đầy đủ ý nghĩa (cả on Earth) nhất."
            }
        ];

        // --- STATE ---
        let currentQuestion = 0;
        let score = 0;
        const totalQuestions = quizData.length;

        // --- ELEMENTS ---
        const els = {
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            explanationBox: document.getElementById('explanation-box'),
            explanationText: document.getElementById('explanation-text'),
            nextBtn: document.getElementById('next-btn'),
            currentQ: document.getElementById('current-q'),
            totalQ: document.getElementById('total-q'),
            score: document.getElementById('score'),
            progressBar: document.getElementById('progress-bar'),
            quizArea: document.getElementById('quiz-area'),
            endScreen: document.getElementById('end-screen'),
            finalScore: document.getElementById('final-score'),
            praiseText: document.getElementById('praise-text')
        };

        // --- AUDIO ENGINE (No external files needed) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // Ding sound (High sine wave)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                // Buzz sound (Low sawtooth)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- CONFETTI ENGINE ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const particleCount = 100;
            const colors = ['#8854C0', '#00C9A7', '#FF9F43', '#FF4757', '#F368E0'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 5 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    gravity: 0.5
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.vx *= 0.95;
                    p.vy *= 0.95;

                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.w, p.h);

                    if (p.y < canvas.height) active = true;
                });

                if (active) requestAnimationFrame(draw);
                else ctx.clearRect(0,0, canvas.width, canvas.height);
            }
            draw();
        }

        // --- HELPER FUNCTION: SHUFFLE ARRAY ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- GAME LOGIC ---

        function initQuiz() {
            els.totalQ.innerText = totalQuestions;
            loadQuestion();
        }

        function loadQuestion() {
            const data = quizData[currentQuestion];
            
            // Reset UI
            els.explanationBox.style.display = 'none';
            els.nextBtn.style.display = 'none';
            els.optionsContainer.innerHTML = '';
            
            // Set Progress
            els.currentQ.innerText = currentQuestion + 1;
            els.progressBar.style.width = `${((currentQuestion) / totalQuestions) * 100}%`;

            // Set Text
            // Convert \n to <br> for better display
            els.questionText.innerHTML = data.question.replace(/\n/g, '<br>');

            // --- SHUFFLE OPTIONS LOGIC ---
            // Create options with their original index to track correct answer
            let mappedOptions = data.options.map((opt, i) => ({ text: opt, originalIndex: i }));
            
            // Shuffle the array of options
            shuffleArray(mappedOptions);

            // Create Buttons based on Shuffled Order
            mappedOptions.forEach((optObj, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optObj.text;
                // Store the original index in dataset to find it later
                btn.dataset.originalIndex = optObj.originalIndex;
                
                // When clicked, check against the original index (which is always 0 for correct in data)
                btn.onclick = () => checkAnswer(optObj.originalIndex, btn);
                els.optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(originalIndex, btnElement) {
            // Prevent multiple clicks
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const data = quizData[currentQuestion];
            // Compare original index with data.correct (which is 0)
            const isCorrect = originalIndex === data.correct;

            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                els.score.innerText = score;
                playSound('correct');
                fireConfetti();
            } else {
                btnElement.classList.add('wrong');
                // Highlight correct answer by searching for button with dataset.originalIndex === 0
                allBtns.forEach(btn => {
                    if (parseInt(btn.dataset.originalIndex) === data.correct) {
                        btn.classList.add('correct');
                    }
                });
                playSound('wrong');
            }

            // Show Explanation
            els.explanationText.innerHTML = data.rationale;
            els.explanationBox.style.display = 'block';
            els.nextBtn.style.display = 'block';

            // Scroll to explanation on mobile
            if(window.innerWidth < 600) {
                setTimeout(() => {
                    els.explanationBox.scrollIntoView({behavior: "smooth"});
                }, 300);
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < totalQuestions) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            els.quizArea.style.display = 'none';
            els.endScreen.style.display = 'block';
            els.progressBar.style.width = '100%';
            els.finalScore.innerText = `${score}/${totalQuestions}`;
            
            // Praise Logic
            const percentage = (score / totalQuestions) * 100;
            let praise = "";
            if (percentage === 100) praise = "Tuyệt vời! Bạn là thiên tài ngữ pháp! 🌟";
            else if (percentage >= 80) praise = "Làm rất tốt! Ms. Chí Nên · ☎️ 0852639652rất tự hào về bạn! 🌈";
            else if (percentage >= 50) praise = "Khá lắm! Cố gắng luyện tập thêm một chút nữa nhé! 💪";
            else praise = "Đừng nản lòng! Hãy xem lại phần giải thích và thử lại nhé! 🍀";
            
            els.praiseText.innerText = praise;
            playSound('correct'); // Victory sound
            fireConfetti();
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            els.score.innerText = '0';
            els.endScreen.style.display = 'none';
            els.quizArea.style.display = 'block';
            loadQuestion();
        }

        // Start
        initQuiz();

    </script>
