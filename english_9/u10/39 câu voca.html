    <style>
        /* --- CUSTOM THEME & ANIMATIONS --- */
        :root {
            --primary: #8854C0; /* Tím hồng */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f4f8;
            --card-shadow: 0 4px 0 rgba(0,0,0,0.1);
            --btn-shadow: 0 4px 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E0E7FF;
            background-image: radial-gradient(#8854C0 1px, transparent 1px), radial-gradient(#8854C0 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-attachment: fixed;
            color: #2D3748;
        }

        /* 3D Button Style */
        .btn-option {
            transition: all 0.1s;
            box-shadow: 0 6px 0 #CBD5E0; /* Default shadow color matching gray border */
            border: 2px solid #CBD5E0;
        }
        
        .btn-option:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #CBD5E0;
        }

        .btn-option.selected-correct {
            background-color: var(--correct) !important;
            border-color: #009E4F !important;
            color: white !important;
            box-shadow: 0 6px 0 #009E4F !important;
        }

        .btn-option.selected-wrong {
            background-color: var(--wrong) !important;
            border-color: #C41E3A !important;
            color: white !important;
            box-shadow: 0 6px 0 #C41E3A !important;
        }
        
        .btn-option:active.selected-correct { box-shadow: 0 2px 0 #009E4F !important; }
        .btn-option:active.selected-wrong { box-shadow: 0 2px 0 #C41E3A !important; }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            50% { transform: translateX(5px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }
        .anim-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .card-enter {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Explanation Box Styling */
        .explanation-box {
            border-left: 5px solid var(--secondary);
            background-color: #F0FDFA; /* Light Teal bg */
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* Header Badge */
        .header-badge {
            background: linear-gradient(135deg, var(--primary), #FF6B6B);
            box-shadow: 0 4px 0 #5a3485;
        }

        // --- 2. AUDIO ENGINE (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding sound
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1); // C6
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Buzz sound
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- 3. GAME LOGIC ---
        let correctCount = 0;
        let wrongCount = 0;
        const answeredQuestions = new Set();

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            const findRationale = (options) => {
                const correct = options.find(o => o.isCorrect);
                return correct ? correct.rationale : "Chưa có giải thích.";
            };

            const html = quizData.questions.map((q, qIndex) => `
                <div class="bg-white rounded-3xl p-6 mb-8 card-enter border-b-8 border-gray-200 shadow-xl blooket-card relative overflow-hidden" id="card-${qIndex}">
                    <!-- Question Badge -->
                    <div class="absolute top-0 left-0 bg-purple-500 text-white font-bold px-4 py-2 rounded-br-2xl text-sm">
                        Câu ${q.questionNumber}
                    </div>

                    <div class="mt-8 mb-6">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-snug">
                            ${q.question}
                        </h3>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${q.answerOptions.map((opt, optIndex) => `
                            <button 
                                id="btn-${qIndex}-${optIndex}"
                                onclick="handleAnswer(${qIndex}, ${optIndex}, ${opt.isCorrect})"
                                class="btn-option bg-white hover:bg-gray-50 text-gray-700 font-bold py-4 px-4 rounded-2xl text-lg flex items-center justify-center h-full w-full">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>

                    <!-- Explanation Area (Hidden by default) -->
                    <div id="explain-${qIndex}" class="hidden mt-6 explanation-box rounded-2xl p-6 animate-fade-in-up">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-2xl">👩‍🏫</span>
                            <h4 class="font-extrabold text-teal-600 text-lg uppercase">Ms. Chí Nên · ☎️ 0852639652giải thích:</h4>
                        </div>
                        <div class="text-gray-700 leading-relaxed whitespace-pre-wrap font-medium">
                            ${findRationale(q.answerOptions)}
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function handleAnswer(qIndex, optIndex, isCorrect) {
            if (answeredQuestions.has(qIndex)) return; // Prevent re-answering
            answeredQuestions.add(qIndex);

            const btn = document.getElementById(`btn-${qIndex}-${optIndex}`);
            const card = document.getElementById(`card-${qIndex}`);
            const explanation = document.getElementById(`explain-${qIndex}`);

            // Find correct button index to highlight it even if wrong was chosen
            const correctOptIndex = quizData.questions[qIndex].answerOptions.findIndex(o => o.isCorrect);
            const correctBtn = document.getElementById(`btn-${qIndex}-${correctOptIndex}`);

            if (isCorrect) {
                correctCount++;
                document.getElementById('score-correct').innerText = correctCount;
                btn.classList.add('selected-correct');
                playSound('correct');
                fireConfetti();
            } else {
                wrongCount++;
                document.getElementById('score-wrong').innerText = wrongCount;
                btn.classList.add('selected-wrong');
                correctBtn.classList.add('selected-correct'); // Show correct answer
                card.classList.add('anim-shake');
                playSound('wrong');
            }

            // Disable all buttons in this card
            const allBtns = card.querySelectorAll('.btn-option');
            allBtns.forEach(b => {
                b.disabled = true;
                b.style.cursor = 'default';
                if (!b.classList.contains('selected-correct') && !b.classList.contains('selected-wrong')) {
                    b.style.opacity = '0.5';
                }
            });

            // Show explanation
            explanation.classList.remove('hidden');
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const msgEl = document.getElementById('result-message');
            document.getElementById('final-correct').innerText = correctCount;
            document.getElementById('final-wrong').innerText = wrongCount;

            // Generate random praise
            const praises = [
                "Tuyệt vời! Em đã làm rất tốt! 🌟",
                "Cố gắng thêm chút nữa là hoàn hảo! 💪",
                "Cô rất tự hào về sự nỗ lực của em! ❤️",
                "Đỉnh của chóp! Tiếp tục phát huy nhé! 🚀"
            ];
            const percent = correctCount / quizData.questions.length;
            let msg = "";
            if (percent === 1) msg = "Xuất sắc! Điểm tuyệt đối! 💯";
            else if (percent > 0.8) msg = praises[0];
            else if (percent > 0.5) msg = praises[1];
            else msg = "Hãy ôn lại bài kỹ hơn nhé! 📚";

            msgEl.innerText = msg;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            fireConfetti();
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('result-modal').classList.remove('flex');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 4. CONFETTI EFFECT (Lightweight) ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = 100;
            const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD166', '#00D26A'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    gravity: 0.5,
                    life: 100
                });
            }

            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.life--;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    if (p.life <= 0) particles.splice(index, 1);
                });
                if (particles.length > 0) requestAnimationFrame(update);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            update();
        }

        // Initialize
        renderQuiz();

    </script>
</body>
</html>
