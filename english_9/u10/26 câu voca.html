    <style>
        :root {
            --primary: #8854C0; /* Tím Pastel */
            --secondary: #00C9A7; /* Xanh Ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --btn-shadow: 0 5px 0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e5e5f7;
            background-image:  radial-gradient(#8854C0 0.5px, transparent 0.5px), radial-gradient(#8854C0 0.5px, #e5e5f7 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--primary);
            max-width: 800px;
            width: 100%;
            position: relative;
        }

        h1 {
            color: var(--primary);
            font-weight: 800;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .teacher-name {
            font-family: 'Quicksand', sans-serif;
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
            font-weight: 700;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            max-width: 800px;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--secondary);
            transition: width 0.5s ease;
        }

        /* Quiz Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 25px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            position: relative;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid #eee;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .question-number {
            font-size: 1.1rem;
            color: #888;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .question-text u {
            text-decoration: none;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 2px;
        }
        
        /* Hint Section */
        .hint-box {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border-left: 5px solid #ffeeba;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .question-text {
                font-size: 1.2rem;
            }
        }

        /* Button Styles */
        .btn-option {
            background-color: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #ccc;
            text-align: left;
            position: relative;
            outline: none;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #ccc;
            border-color: var(--primary);
            background-color: #fbf5ff;
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ccc;
        }

        /* Correct/Wrong States */
        .btn-option.correct {
            background-color: var(--correct);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 5px 0 #008f47;
        }

        .btn-option.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: #ff2e40;
            box-shadow: 0 5px 0 #d6182a;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
            border-left: 5px solid var(--primary);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.1rem;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            color: #444;
            line-height: 1.6;
        }
        
        .explanation-content strong {
            color: #2c3e50;
        }

        .analysis-block {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #eee;
        }

        .next-btn-container {
            margin-top: 20px;
            text-align: right;
            display: none;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 0 #6c429c;
            transition: all 0.2s;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #6c429c;
        }

        .btn-next:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #6c429c;
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 0 rgba(0,0,0,0.2);
            animation: popIn 0.5s;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }

        .feedback-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #444;
        }

        .btn-restart {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 0 #009e82;
            transition: all 0.2s;
        }
        
        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #009e82;
        }
        
        .btn-restart:active {
             transform: translateY(2px);
             box-shadow: 0 2px 0 #009e82;
        }

        /* Formatted text helpers */
        .highlight-green { color: var(--correct); font-weight: bold; }
        .highlight-red { color: var(--wrong); font-weight: bold; }
        .vocab-item { display: block; margin-bottom: 5px; }

    </style>

    <script>
        // Data from User
        const quizData = [
    {
      "questionNumber": 1,
      "question": "Exercise 4 - Q1: Fill in the blank:\nEarth is unique in that most of the planet is covered in __________.",
      "answerOptions": [
        {
          "text": "liquid water",
          "rationale": "1. Phân tích: A. liquid water (n): nước lỏng; B. outer space (n): không gian vũ trụ; C. habitat loss (n): mất môi trường sống; D. global warming (n): nóng lên toàn cầu.\n2. Dịch: Trái đất là độc nhất ở chỗ phần lớn hành tinh được bao phủ bởi nước lỏng.\n3. Giải thích: Dựa vào kiến thức thực tế, Trái đất được gọi là hành tinh xanh vì 71% diện tích bề mặt được bao phủ bởi nước ở dạng lỏng.",

        {

          "isCorrect": false
        },
        {
          "text": "habitat loss",
          "rationale": "Sai về nghĩa. Mất môi trường sống là một vấn đề, không phải thứ bao phủ hành tinh.",
          "isCorrect": false

        {

    {
      "questionNumber": 2,
      "question": "Exercise 4 - Q2: Fill in the blank:\n__________ due to deforestation threatens the survival of many species.",
      "answerOptions": [

          "rationale": "1. Phân tích: A. Habitat loss (n): Mất môi trường sống; B. Water bodies (n): Các khối nước (sông, hồ...); C. Living things (n): Sinh vật sống; D. Temperate forest (n): Rừng ôn đới.\n2. Dịch: Mất môi trường sống do phá rừng đe dọa sự sống còn của nhiều loài.\n3. Giải thích: Cụm từ 'due to deforestation' (do phá rừng) là nguyên nhân trực tiếp dẫn đến 'habitat loss', làm động vật mất nơi cư trú.",

    {
      "questionNumber": 3,
      "question": "Exercise 4 - Q3: Fill in the blank:\nCan Hubble Space Telescope take photos of Earth from __________?",

        },
        {
          "text": "Living things",

    {
      "questionNumber": 7,
      "question": "Exercise 4 - Q7: Fill in the blank:\nBears, deer, and songbirds are just a few examples of the __________ diverse species that call the home.",
      "answerOptions": [
        {
          "text": "temperate forest",
          "rationale": "1. Phân tích: A. temperate forest (n): rừng ôn đới; B. polar habitat (n): môi trường cực; C. water bodies (n): khối nước; D. climate change (n): biến đổi khí hậu.\n2. Dịch: Gấu, hươu và chim sơn ca chỉ là một vài ví dụ về các loài đa dạng coi rừng ôn đới là nhà.\n3. Giải thích: Gấu, hươu và chim sơn ca là những loài động vật đặc trưng thường sống ở nơi có khí hậu ôn hòa 4 mùa như 'temperate forest'.",

        },
        {
          "text": "polar habitat",

          "isCorrect": false
        },
        {
          "text": "water bodies",
          "rationale": "Sai. Những loài này sống trên cạn, không sống dưới nước.",
          "isCorrect": false

        let currentQuestion = 0;
        let score = 0;
        const totalQuestions = quizData.length;

        const quizContainer = document.getElementById('quiz-container');
        const progressBar = document.getElementById('progress-bar');
        const soundCorrect = document.getElementById('sound-correct');
        const soundWrong = document.getElementById('sound-wrong');
        const soundFinish = document.getElementById('sound-finish');

        // Helper to format text with newlines to HTML breaks
        function formatText(text) {
            return text.replace(/\n/g, '<br>');
        }
        
        // Helper to parse rationale to structured HTML
        function formatRationale(rationaleText) {
            // Check if rationale follows strict "1. Phân tích..." format
            if (rationaleText.includes("1. Phân tích")) {
                let html = rationaleText;
                
                // Bold major headers
                html = html.replace(/1\. Phân tích:/g, '<div class="analysis-block"><strong>🔍 1. Phân tích từ vựng:</strong><br>');
                html = html.replace(/2\. Dịch:/g, '</div><div class="analysis-block"><strong>📖 2. Dịch nghĩa:</strong><br>');
                html = html.replace(/3\. Giải thích:/g, '</div><div class="analysis-block"><strong>💡 3. Ms. Chí Nên · ☎️ 0852639652giải thích:</strong><br>');
                html = html.replace(/3\. Tại sao chọn/g, '</div><div class="analysis-block"><strong>💡 3. Tại sao chọn đáp án này?</strong><br>');
                
                // Close the last div if we opened one
                if(html.includes('<div')) {
                    html += '</div>';
                }
                
                // Highlight options A, B, C, D inside analysis
                // Updated regex to capture the full option text until a semicolon or end of line
                html = html.replace(/([A-D]\. [^;]+)(?=;|$)/g, '<span class="vocab-item">👉 $1</span>');
                
                return html;
            } else {
                // For simpler rationales (Q1-10), structure them simply
                return `<div class="analysis-block"><strong>💡 Ms. Chí Nên · ☎️ 0852639652giải thích chi tiết:</strong><br>${rationaleText}</div>`;
            }
        }

        function playSound(type) {
            if (type === 'correct') {
                soundCorrect.currentTime = 0;
                soundCorrect.play();
            } else if (type === 'wrong') {
                soundWrong.currentTime = 0;
                soundWrong.play();
            } else if (type === 'finish') {
                soundFinish.currentTime = 0;
                soundFinish.play();
            }
        }

        function renderQuestion(index) {
            if (index >= totalQuestions) {
                finishQuiz();
                return;
            }

            const q = quizData[index];
            
            // Format Question Text (convert newline to br)
            const questionHtml = formatText(q.question);

            let optionsHtml = '';
            q.answerOptions.forEach((opt, idx) => {
                optionsHtml += `<button class="btn-option" onclick="checkAnswer(${idx}, ${index}, this)">${String.fromCharCode(65 + idx)}. ${opt.text}</button>`;
            });

            quizContainer.innerHTML = `
                <div class="question-number">
                    <span>Câu ${q.questionNumber}/${totalQuestions}</span>
                    <span>Điểm: ${score}</span>
                </div>
                <div class="question-text">${questionHtml}</div>
                ${q.hint ? `<div class="hint-box"><i class="fas fa-lightbulb"></i> Gợi ý: ${q.hint}</div>` : ''}
                <div class="options-grid">
                    ${optionsHtml}
                </div>
                <div class="explanation-box" id="explanation-box-${index}">
                    <div class="explanation-header">
                        <i class="fas fa-chalkboard-teacher"></i> Giải thích chi tiết
                    </div>
                    <div class="explanation-content" id="explanation-content-${index}"></div>
                </div>
                <div class="next-btn-container" id="next-btn-container-${index}">
                    <button class="btn-next" onclick="nextQuestion()">Câu tiếp theo <i class="fas fa-arrow-right"></i></button>
                </div>
            `;

            // Update progress
            const progress = ((index) / totalQuestions) * 100;
            progressBar.style.width = `${progress}%`;
        }

        function checkAnswer(selectedIdx, questionIdx, btnElement) {
            // Prevent multiple clicks
            const options = document.querySelectorAll('.btn-option');
            options.forEach(btn => btn.disabled = true);

            const q = quizData[questionIdx];
            const isCorrect = q.answerOptions[selectedIdx].isCorrect;

            // Get correct index
            const correctIdx = q.answerOptions.findIndex(opt => opt.isCorrect);
            const correctBtn = options[correctIdx];

            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                playSound('correct');
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                btnElement.classList.add('wrong');
                correctBtn.classList.add('correct'); // Show correct one
                playSound('wrong');
            }

            // Show explanation
            const explBox = document.getElementById(`explanation-box-${questionIdx}`);
            const explContent = document.getElementById(`explanation-content-${questionIdx}`);
            const correctOptionData = q.answerOptions[correctIdx];
            
            // Build Explanation Content based on "Super Detailed" requirement
            // We use the rationale from the CORRECT answer as the base, 
            // but we might need to append info about why others are wrong if available in the dataset.
            // In this specific dataset, the 'rationale' field of the Correct Option usually contains the full breakdown.
            
            explContent.innerHTML = formatRationale(correctOptionData.rationale);
            explBox.style.display = 'block';

            // Show Next Button
            document.getElementById(`next-btn-container-${questionIdx}`).style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            renderQuestion(currentQuestion);
        }

        function finishQuiz() {
            playSound('finish');
            progressBar.style.width = '100%';
            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('final-score');
            const feedback = document.getElementById('final-feedback');

            scoreDisplay.textContent = `${score}/${totalQuestions}`;
            
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                feedback.textContent = "Xuất sắc! Bạn là thiên tài tiếng Anh! 🏆";
                confetti({ particleCount: 200, spread: 100 });
            } else if (percentage >= 80) {
                feedback.textContent = "Giỏi quá! Cố gắng một chút nữa là tuyệt đối! 🌟";
            } else if (percentage >= 50) {
                feedback.textContent = "Làm tốt lắm! Hãy ôn lại các từ vựng đã sai nhé. 💪";
            } else {
                feedback.textContent = "Đừng buồn nhé! Hãy xem lại phần giải thích và thử lại nào. 📚";
            }

            modal.style.display = 'flex';
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('result-modal').style.display = 'none';
            renderQuestion(0);
        }

        // Initialize
        renderQuestion(0);

    </script>
