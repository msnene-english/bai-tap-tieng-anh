<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tiếng Anh 9 - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Tím hồng */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f3f8;
            --card-bg: #ffffff;
            --text-main: #2f3542;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#ced6e0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: transparent;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #e1e1e1;
        }

        .header h1 {
            color: var(--primary);
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        .header p {
            color: #747d8c;
            font-weight: 600;
            margin: 5px 0 0;
        }

        /* QUESTION CARD */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.1);
            border: 2px solid #f1f2f6;
            position: relative;
            transition: transform 0.3s ease;
        }

        .question-title {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-badge {
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2f3542;
        }

        .question-text u {
            text-decoration: none;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 2px;
        }

        /* OPTIONS GRID */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #57606f;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #e1e1e1;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #e1e1e1;
        }

        .option-btn.correct {
            background: var(--correct);
            border-color: var(--correct);
            box-shadow: 0 4px 0 #00b85c;
            color: white;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .option-btn.wrong {
            background: var(--wrong);
            border-color: var(--wrong);
            box-shadow: 0 4px 0 #d63031;
            color: white;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }

        /* EXPLANATION BOX */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 20px;
            background: #f0fff4;
            border: 2px solid var(--correct);
            border-radius: 15px;
            padding: 20px;
            animation: slideDown 0.4s ease-out;
        }
        
        .explanation-box.wrong-state {
            background: #fff0f1;
            border-color: var(--wrong);
        }

        .exp-header {
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-teacher-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .exp-content p {
            margin: 5px 0;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .exp-label {
            font-weight: 700;
            color: var(--primary);
            display: block;
            margin-top: 10px;
        }

        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .vocab-table th, .vocab-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        
        .vocab-table th {
            background-color: var(--primary);
            color: white;
        }

        /* SUBMIT BUTTON */
        .submit-section {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .submit-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            box-shadow: 0 6px 0 #009e82;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 2px 0 #009e82;
        }

        /* ANIMATIONS */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Popup Score */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 4px solid var(--primary);
            animation: pop 0.5s;
        }
        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--secondary);
            margin: 10px 0;
        }
    </style>

</head>

                    whyCorrect: "C. percent thường nhấn âm 2 (per'cent).",

                }

        ];

        let userAnswers = {};
        let score = 0;

        // === RENDER BÀI THI ===
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                let html = `
                    <div class="question-title">
                        <span class="question-badge">${item.type}</span>
                        <span>Question ${index + 1}</span>
                    </div>
                    <div class="question-text">${item.question}</div>
                    <div class="question-text" style="font-size: 1.4rem; color: var(--primary);">${item.word}</div>
                    
                    <div class="options-grid">
                        ${item.options.map((opt, i) => `
                            <button class="option-btn" id="btn-${index}-${i}" onclick="checkAnswer(${index}, ${i})">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>

                    <div class="explanation-box" id="exp-${index}">
                        <div class="exp-header">
                            <div class="exp-teacher-avatar">Ms.An</div>
                            <span id="exp-status-${index}">Giải thích chi tiết:</span>
                        </div>
                        <div class="exp-content">
                            <span class="exp-label">📖 Từ vựng & Nghĩa:</span>
                            <table class="vocab-table">
                                <tr><th>Option</th><th>Meaning</th></tr>
                                ${Object.entries(item.explanation.meaning).map(([key, val]) => `<tr><td><b>${key}</b></td><td>${val}</td></tr>`).join('')}
                            </table>
                            
                            <span class="exp-label" style="color: var(--correct);">✅ Tại sao đúng:</span>
                            <p>${item.explanation.whyCorrect}</p>
                            
                            <span class="exp-label" style="color: var(--wrong);">❌ Tại sao sai:</span>
                            <p>${item.explanation.whyWrong}</p>
                        </div>
                    </div>
                `;
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // === XỬ LÝ CHECK ĐÁP ÁN ===
        function checkAnswer(questionIndex, selectedOptionIndex) {
            // Prevent re-answering
            if (userAnswers[questionIndex] !== undefined) return;
            
            userAnswers[questionIndex] = selectedOptionIndex;
            const question = quizData[questionIndex];
            const isCorrect = selectedOptionIndex === question.correct;
            
            // UI Update
            const btn = document.getElementById(`btn-${questionIndex}-${selectedOptionIndex}`);
            const correctBtn = document.getElementById(`btn-${questionIndex}-${question.correct}`);
            const expBox = document.getElementById(`exp-${questionIndex}`);
            const statusText = document.getElementById(`exp-status-${questionIndex}`);

            // Disable all buttons for this question
            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn-${questionIndex}-${i}`).disabled = true;
            }

            if (isCorrect) {
                btn.classList.add('correct');
                score++;
                playSound('correct');
                triggerConfetti(btn);
                statusText.innerText = "Chính xác! Em giỏi lắm!";
                statusText.style.color = "var(--correct)";
            } else {
                btn.classList.add('wrong');
                correctBtn.classList.add('correct'); // Show correct answer
                playSound('wrong');
                expBox.classList.add('wrong-state');
                statusText.innerText = "Ôi tiếc quá! Xem giải thích nhé:";
                statusText.style.color = "var(--wrong)";
            }

            // Show Explanation immediately
            expBox.style.display = 'block';
        }

        // === SUBMIT & SCORE ===
        function submitQuiz() {
            const answeredCount = Object.keys(userAnswers).length;
            const total = quizData.length;
            
            // Random praise
            const praises = [
                "Em là siêu nhân Tiếng Anh! 🦸‍♀️",
                "Cố gắng hơn chút nữa là tuyệt vời! 💪",
                "Ms. Chí Nên · ☎️ 0852639652rất tự hào về sự chăm chỉ của em! ❤️",
                "Kiến thức của em rất vững! 🌟"
            ];
            const randomPraise = praises[Math.floor(Math.random() * praises.length)];

            document.getElementById('finalScore').innerText = `${score}/${total}`;
            document.getElementById('feedbackText').innerText = randomPraise;
            document.getElementById('scoreModal').style.display = "flex";
            
            if (score === total) {
                playSound('correct');
                triggerConfetti(document.body);
            }
        }

        function closeModal() {
            document.getElementById('scoreModal').style.display = "none";
            location.reload(); // Reload to retry
        }

        // === AUDIO & EFFECTS ===
        // Using Web Audio API for simple sounds without external files
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // High pitch 'Ding'
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else {
                // Low pitch 'Buzz'
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Simple Confetti Logic
        function triggerConfetti(element) {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD700', '#70a1ff'];

            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: element === document.body ? window.innerWidth / 2 : element.getBoundingClientRect().left + 50,
                    y: element === document.body ? window.innerHeight / 2 : element.getBoundingClientRect().top,
                    r: Math.random() * 6 + 2,
                    d: Math.random() * 5 + 2, // density
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleIncremental: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }

            let animationId;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let results = [];
                particles.forEach((p, index) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.tilt = Math.sin(p.tiltAngle - index / 3) * 15;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 4, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 4);
                    ctx.stroke();

                    if (p.y > canvas.height) results.push(index);
                });

                results.forEach(index => particles.splice(index, 1));

                if (particles.length > 0) {
                    animationId = requestAnimationFrame(draw);
                }
            }
            draw();
        }

        // Initialize
        renderQuiz();
    </script>
