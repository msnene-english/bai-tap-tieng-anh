<script>
(function(){const items=['🌍','🧭','🍜','🧘','🛶','🎒','🏕️','🌏','⛩️','🥢','🧣','🐕','🏔️','🕌','🎋','🌐'];
  const layer=document.getElementById('foodlayer');
  for(let i=0;i<20;i++){const s=document.createElement('span');s.textContent=items[i%items.length];
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(1.6+Math.random()*2.2)+'rem';
    s.style.animationDelay=(Math.random()*8)+'s';s.style.animationDuration=(11+Math.random()*10)+'s';layer.appendChild(s);}})();

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#FF4757','#FDCB6E','#00D26A','#0891b2','#f97316','#7c3aed','#14b8a6'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Ms. Chí Nên · ULIS giải thích chi tiết";
const TOTAL=40;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"handsh<u>a</u>ke",c:true},{t:"pr<u>a</u>ctice",c:false},{t:"h<u>a</u>bit",c:false},{t:"inter<u>a</u>ct",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "a" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>handsh<u>a</u>ke</span> <span class='p-phonetic'>/ˈhændʃeɪk/</span> = <span class='p-mean'>cái bắt tay</span> → âm <b>/eɪ/</b></div>
     <div><span class='p-word'>pr<u>a</u>ctice</span> <span class='p-phonetic'>/ˈpræktɪs/</span> = <span class='p-mean'>luyện tập</span> → âm <b>/æ/</b></div>
     <div><span class='p-word'>h<u>a</u>bit</span> <span class='p-phonetic'>/ˈhæbɪt/</span> = <span class='p-mean'>thói quen</span> → âm <b>/æ/</b></div>
     <div><span class='p-word'>inter<u>a</u>ct</span> <span class='p-phonetic'>/ˌɪntərˈækt/</span> = <span class='p-mean'>tương tác</span> → âm <b>/æ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"handshake" có "a" (trong "-shake") đọc là /eɪ/, khác với ba từ kia có "a" đọc là /æ/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>practice, habit, interact đều có âm /æ/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"b<u>o</u>ring",c:false},{t:"<u>o</u>rnament",c:false},{t:"expl<u>o</u>re",c:false},{t:"l<u>o</u>cal",c:true}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "o" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>b<u>o</u>ring</span> <span class='p-phonetic'>/ˈbɔːrɪŋ/</span> = <span class='p-mean'>nhàm chán</span> → âm <b>/ɔː/</b></div>
     <div><span class='p-word'><u>o</u>rnament</span> <span class='p-phonetic'>/ˈɔːnəmənt/</span> = <span class='p-mean'>đồ trang trí</span> → âm <b>/ɔː/</b></div>
     <div><span class='p-word'>expl<u>o</u>re</span> <span class='p-phonetic'>/ɪkˈsplɔː/</span> = <span class='p-mean'>khám phá</span> → âm <b>/ɔː/</b></div>
     <div><span class='hl-green'>local</span> <span class='p-phonetic'>/ˈləʊkl/</span> = <span class='p-mean'>địa phương</span> → âm <b>/əʊ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"local" có "o" đọc là /əʊ/ (nguyên âm đôi), khác với ba từ kia có "o" đọc là /ɔː/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>boring, ornament, explore đều có âm /ɔː/.</span></li></ol>`},

   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Danh từ chung chung như hạnh phúc, tiền bạc không đi kèm "the".</span></li></ol>`},

     <div><span class='p-word'>Although</span> <span class='wt'>conj</span> = <span class='p-mean'>mặc dù</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Unless" = "If … not" (trừ khi). "Unless the hotel allows…" = nếu khách sạn KHÔNG cho phép thì tìm chỗ khác. Logic khớp.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"If" đảo logic; "Therefore" nối kết quả; "Although" chỉ nhượng bộ — đều không hợp.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:16,type:"mcq",
 q:"In the U.S., Thanksgiving is celebrated ____ the last Thursday ____ November.",
 options:[{t:"in – of",c:false},{t:"on – on",c:false},{t:"in – in",c:false},{t:"on – of",c:true}],
 exp:`<div class="vnt">💬 Dịch: Ở Mỹ, Lễ Tạ ơn được tổ chức vào ngày thứ Năm cuối cùng của tháng 11.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>in – of</span> = <span class='p-mean'>(sai ô 1)</span></div>
     <div><span class='p-word'>on – on</span> = <span class='p-mean'>(sai ô 2)</span></div>
     <div><span class='p-word'>in – in</span> = <span class='p-mean'>(sai cả hai)</span></div>
     <div><span class='hl-green'>on – of</span> = <span class='p-mean'>(đúng)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Với NGÀY (thứ Năm) dùng "on"; "the last Thursday OF November" (của tháng 11) dùng "of" → on – of.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Không dùng "in" trước ngày cụ thể; ô 2 nối "Thursday" với "November" phải là "of".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:17,type:"mcq",
 q:"Ben: \"Can you help me with this maths homework?\" — Alison: \"____\"",
 options:[{t:"Sure. Let me show you how to do it.",c:true},{t:"Wow, what a good idea!",c:false},{t:"Not yet, but I'd love to.",c:false},{t:"It's interesting to know.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Ben: "Cậu giúp tớ làm bài tập toán này được không?" — Alison: "Được chứ. Để tớ chỉ cậu cách làm nhé."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>Sure. Let me show you how to do it.</span> = <span class='p-mean'>Được chứ. Để tớ chỉ cậu cách làm.</span></div>
     <div><span class='p-word'>Wow, what a good idea!</span> = <span class='p-mean'>Ồ, ý hay đấy!</span></div>
     <div><span class='p-word'>Not yet, but I'd love to.</span> = <span class='p-mean'>Chưa, nhưng tớ rất muốn.</span></div>
     <div><span class='p-word'>It's interesting to know.</span> = <span class='p-mean'>Thật thú vị khi biết điều đó.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Ben NHỜ GIÚP ĐỠ → Alison đồng ý và đề nghị giúp: "Sure. Let me show you how to do it."</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác không phải là lời đáp phù hợp cho một lời nhờ giúp đỡ.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:20,type:"error",

/* V. Word form */
{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:21,type:"fill",
 q:"Giving a handshake is a common way of ______ in the world. <span class='hint-word'>(greet)</span>",
 answer:["greeting"],
 exp:`<div class="vnt">💬 Dịch: Bắt tay là một cách <b>chào hỏi</b> phổ biến trên thế giới.</div>
 <ol><li>Từ gốc: <span class='p-word'>greet</span> <span class='wt'>v</span> = <span class='p-mean'>chào hỏi</span> → dạng cần điền: <span class='hl-green'>greeting</span> <span class='wt'>n/gerund</span> = <span class='p-mean'>sự chào hỏi</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: greeting</span> <span class='p-grammar'>Sau giới từ "of" cần DANH TỪ/danh động từ: "a way of greeting" (một cách chào hỏi).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:22,type:"fill",

 answer:["nomadic"],

 <ol><li>Từ gốc: <span class='p-word'>nomad</span> <span class='wt'>n</span> = <span class='p-mean'>người du mục</span> → dạng cần điền: <span class='hl-green'>nomadic</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc về du mục</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: nomadic</span> <span class='p-grammar'>Cần TÍNH TỪ đứng trước danh từ "life" → "a nomadic life" (cuộc sống du mục). Thêm hậu tố "-ic".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:23,type:"fill",
 q:"They ______ enjoyed breakfast while listening to soft jazz music. <span class='hint-word'>(leisure)</span>",
 answer:["leisurely"],
 exp:`<div class="vnt">💬 Dịch: Họ <b>thong thả</b> thưởng thức bữa sáng trong khi nghe nhạc jazz nhẹ nhàng.</div>
 <ol><li>Từ gốc: <span class='p-word'>leisure</span> <span class='wt'>n</span> = <span class='p-mean'>sự nhàn rỗi</span> → dạng cần điền: <span class='hl-green'>leisurely</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách thong thả</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: leisurely</span> <span class='p-grammar'>Cần TRẠNG TỪ bổ nghĩa cho động từ "enjoyed" (thưởng thức một cách thong thả). Thêm "-ly".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:24,type:"fill",

   <li><span class="tag hl-green">✅ ĐÁP ÁN: musher</span> <span class='p-grammar'>Cần DANH TỪ chỉ NGƯỜI (sau "A skilled"). Thêm hậu tố "-er" chỉ người thực hiện: mush → musher.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:25,type:"fill",
 q:"He has an ______ name that most people struggle to pronounce correctly. <span class='hint-word'>(usual)</span>",
 answer:["unusual"],
 exp:`<div class="vnt">💬 Dịch: Anh ấy có một cái tên <b>khác thường</b> mà hầu hết mọi người khó phát âm cho đúng.</div>
 <ol><li>Từ gốc: <span class='p-word'>usual</span> <span class='wt'>adj</span> = <span class='p-mean'>thông thường</span> → dạng cần điền: <span class='hl-green'>unusual</span> <span class='wt'>adj</span> = <span class='p-mean'>khác thường</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: unusual</span> <span class='p-grammar'>Ngữ cảnh "khó phát âm" → cái tên "khác thường". Thêm tiền tố phủ định "un-": usual → unusual.</span></li></ol>`},

/* VI. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:26,type:"fill",
 q:"We love ______ (play) traditional games that remind us of our childhood.",
 answer:["playing","to play"],
 exp:`<div class="vnt">💬 Dịch: Chúng tôi thích chơi những trò chơi truyền thống gợi nhớ về tuổi thơ.</div>
 <ol><li>Đáp án: <span class='hl-green'>playing</span> (hoặc <span class='hl-green'>to play</span>)</li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Động từ "love" có thể đi với cả V-ing và to-V: "love playing" hoặc "love to play" đều đúng.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:27,type:"fill",

 answer:["is having"],
 exp:`<div class="vnt">💬 Dịch: Cô ấy không thể trả lời email của bạn bây giờ. Cô ấy đang trong một cuộc gọi video.</div>
 <ol><li>Đáp án: <span class='hl-green'>is having</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "now" (đang xảy ra ngay lúc nói) → Hiện tại tiếp diễn: "is + V-ing". "have a video call" ở đây nghĩa "đang gọi video" nên chia được: is having.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:28,type:"fill",

 answer:["wore"],

 <ol><li>Đáp án: <span class='hl-green'>wore</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "yesterday" → thì Quá khứ đơn. "wear" là động từ bất quy tắc: wear → wore.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:29,type:"fill",

 answer:["visits will cook","visits i will cook"],

   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (Dylan visits – thêm "s"), … will + V (will cook)".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:30,type:"fill",

 answer:["will apply"],
 exp:`<div class="vnt">💬 Dịch: Sally nghĩ rằng cô ấy sẽ ứng tuyển một công việc liên quan đến sinh học sau khi tốt nghiệp.</div>

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:44,type:"fill",
 q:"<em>ao dai</em> / often / on / wear / Vietnamese people / formal occasions. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["vietnamese people often wear ao dai on formal occasions"],
 exp:`<div class="vnt">💬 Dịch: Người Việt Nam thường mặc áo dài vào những dịp trang trọng.</div>
 <ol><li>Đáp án: <span class='hl-green'>Vietnamese people often wear ao dai on formal occasions.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ ngữ (Vietnamese people) + trạng từ tần suất (often) trước động từ + động từ (wear) + tân ngữ (ao dai) + "on formal occasions" (vào dịp trang trọng).</span></li></ol>`},

{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:45,type:"fill",
 q:"technology / depend more on / In the present time, / in the past / than / people. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["in the present time people depend more on technology than in the past"],
 exp:`<div class="vnt">💬 Dịch: Ngày nay, con người phụ thuộc vào công nghệ nhiều hơn so với trước đây.</div>
 <ol><li>Đáp án: <span class='hl-green'>In the present time, people depend more on technology than in the past.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trạng ngữ "In the present time," + chủ ngữ (people) + "depend more ON technology" (phụ thuộc nhiều hơn vào) + "than in the past" (so với trước đây).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:46,type:"fill",
 q:"Gợi ý: The villagers / earn / living / by / weave clothes / natural cotton and wool. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["the villagers earn their living by weaving clothes from natural cotton and wool","the villagers earn a living by weaving clothes from natural cotton and wool"],
 exp:`<div class="vnt">💬 Dịch: Dân làng kiếm sống bằng cách dệt vải từ bông và len tự nhiên.</div>
 <ol><li>Đáp án: <span class='hl-green'>The villagers earn their/a living by weaving clothes from natural cotton and wool.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm "earn a/their living" (kiếm sống); "by + V-ing" chỉ cách thức (by weaving); "clothes FROM cotton and wool" (làm từ…).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:47,type:"fill",
 q:"Gợi ý: My grandfather / be / the habit of / read / newspaper / every morning. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["my grandfather is in the habit of reading the newspaper every morning","my grandfather is in the habit of reading newspaper every morning"],
 exp:`<div class="vnt">💬 Dịch: Ông tôi có thói quen đọc báo mỗi sáng.</div>
 <ol><li>Đáp án: <span class='hl-green'>My grandfather is in the habit of reading the newspaper every morning.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "be IN the habit OF + V-ing" (có thói quen làm gì): is in the habit of reading.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:48,type:"fill",
 q:"Gợi ý: The children / enjoy / make / craft / because / they / can / use / creativity / freely. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["the children enjoy making crafts because they can use their creativity freely"],
 exp:`<div class="vnt">💬 Dịch: Bọn trẻ thích làm đồ thủ công vì chúng có thể tự do sử dụng khả năng sáng tạo của mình.</div>
 <ol><li>Đáp án: <span class='hl-green'>The children enjoy making crafts because they can use their creativity freely.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"enjoy + V-ing" (making crafts); "because" nối lý do; "can use their creativity freely" (có thể tự do dùng sự sáng tạo của chúng).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:49,type:"fill",
 q:"Gợi ý: They / find / it / hard / maintain / traditional lifestyle / the modern world. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["they find it hard to maintain their traditional lifestyle in the modern world","they find it hard to maintain a traditional lifestyle in the modern world"],
 exp:`<div class="vnt">💬 Dịch: Họ thấy khó duy trì lối sống truyền thống trong thế giới hiện đại.</div>
 <ol><li>Đáp án: <span class='hl-green'>They find it hard to maintain their/a traditional lifestyle in the modern world.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "find it + adj + to V" (thấy việc gì đó thế nào): find it hard to maintain; "in the modern world" (trong thế giới hiện đại).</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:50,type:"mcq",
 q:"Câu gốc: <em>Cindy won't let you borrow her bike unless you ride more carefully.</em>",
 options:[{t:"If you don't ride more carefully, Cindy won't let you borrow her bike.",c:true},
          {t:"You can borrow Cindy's bike even if you don't ride carefully.",c:false},
          {t:"Cindy will lend you her bike whether you ride carefully or not.",c:false},
          {t:"You must not ride carefully to borrow Cindy's bike.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Nếu bạn không đi cẩn thận hơn, Cindy sẽ không cho bạn mượn xe đạp.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>If you don't ride more carefully, Cindy won't let you borrow her bike.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"unless you ride more carefully" (trừ khi bạn đi cẩn thận hơn) = "if you don't ride more carefully" (nếu bạn không đi cẩn thận hơn). "Unless" = "If … not".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu còn lại đảo ngược điều kiện hoặc sai nghĩa hoàn toàn so với câu gốc.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:51,type:"mcq",
 q:"Câu gốc: <em>Let's visit Buckingham Palace when we go to London.</em>",
 options:[{t:"Do you mind visiting Buckingham Palace when we go to London?",c:false},
          {t:"How about visiting Buckingham Palace when we go to London?",c:true},
          {t:"Do we want to visit Buckingham Palace when going to London?",c:false},
          {t:"Will we visit Buckingham Palace when going to London?",c:false}],
 exp:`<div class="vnt">💬 Dịch: Đi thăm Cung điện Buckingham khi chúng ta đến London nhé?</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>How about visiting Buckingham Palace when we go to London?</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Let's + V" (rủ rê) = "How about + V-ing?" (… thì sao?). Sau "How about" dùng danh động từ: visiting.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"Do you mind…?" là xin phép/nhờ vả; "Do we want / Will we…?" là câu hỏi thông tin, không phải lời rủ rê như "Let's".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:52,type:"mcq",
 q:"Câu gốc: <em>I am a more careful driver than my brother is.</em>",
 options:[{t:"My brother doesn't drive as carefully as I do.",c:true},
          {t:"I drive most carefully than my brother does.",c:false},
          {t:"My brother doesn't drive as carelessly as I do.",c:false},
          {t:"I drive more carelessly than my brother does.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Em trai tôi lái xe không cẩn thận bằng tôi.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>My brother doesn't drive as carefully as I do.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Tôi cẩn thận hơn em" = "Em không cẩn thận bằng tôi" → "My brother doesn't drive AS carefully AS I do" (so sánh bằng phủ định).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"most carefully than" sai cấu trúc; các câu dùng "carelessly" (bất cẩn) làm sai nghĩa so với câu gốc.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:53,type:"mcq",
 q:"Câu gốc: <em>It isn't a good idea for Claire to arrive late on her first day at work.</em>",
 options:[{t:"Claire thinks she will arrive early on her first day at work.",c:false},
          {t:"Claire doesn't want to arrive late on her first day at work.",c:false},
          {t:"Claire shouldn't arrive late on her first day at work.",c:true},
          {t:"Claire doesn't have to arrive early on her first day at work.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Claire không nên đến muộn vào ngày đầu tiên đi làm.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Claire shouldn't arrive late on her first day at work.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"It isn't a good idea for sb to V" (không nên làm gì) = "sb shouldn't V". → Claire shouldn't arrive late.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"thinks/doesn't want/doesn't have to" đổi nghĩa: câu gốc là lời KHUYÊN (không nên), không nói về suy nghĩ/mong muốn của Claire.</span></li></ol>`}
];

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#1e1b3a">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#f97316">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 40 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🙌';memeKey='good';msg='Cố thêm chút nữa là hoàn hảo luôn nè! 💪';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='😅';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
