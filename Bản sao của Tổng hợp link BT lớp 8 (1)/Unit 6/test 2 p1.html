<script>
(function(){const items=['🌌','🪐','🌠','✨','🌟','💫','🌙','🔭','⭐','🛸','☄️','🌑','✨','🪐','⭐','🌟'];

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#a855f7','#ec4899','#22d3ee','#fde047','#7c3aed','#f9a8d4','#00D26A'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Ms. Chí Nên · ULIS giải thích chi tiết";
const TOTAL=40;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",

 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "e" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:

   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"contest" có "e" (được nhấn) đọc là /e/, khác với ba từ kia có "e" (không nhấn) đọc là /ɪ/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>event, decide, exam đều có "e" đọc /ɪ/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",

     <div><span class='p-word'>sn<u>ow</u></span> <span class='p-phonetic'>/snəʊ/</span> = <span class='p-mean'>tuyết</span> → âm <b>/əʊ/</b></div>

     <div><span class='p-word'>might</span> <span class='wt'>modal</span> = <span class='p-mean'>có thể</span></div>
     <div><span class='p-word'>want</span> <span class='wt'>v</span> = <span class='p-mean'>muốn</span></div>
     <div><span class='p-word'>can</span> <span class='wt'>modal</span> = <span class='p-mean'>có thể (khả năng)</span></div>
     <div><span class='hl-green'>should</span> <span class='wt'>modal</span> = <span class='p-mean'>nên</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đưa LỜI KHUYÊN (nên chuẩn bị kỹ năng dùng đũa) → dùng "should".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>might/can là khả năng; "want" là động từ thường (sai cấu trúc modal) — không diễn tả lời khuyên.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:16,type:"mcq",
 q:"Japanese ____, with its <em>sushi</em> and <em>sashimi</em>, has become popular worldwide.",
 options:[{t:"culture",c:false},{t:"cuisine",c:true},{t:"tourism",c:false},{t:"industry",c:false}],
 exp:`<div class="vnt">💬 Dịch: Ẩm thực Nhật Bản, với sushi và sashimi, đã trở nên phổ biến trên toàn thế giới.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>culture</span> <span class='wt'>n</span> = <span class='p-mean'>văn hóa</span></div>
     <div><span class='hl-green'>cuisine</span> <span class='wt'>n</span> = <span class='p-mean'>ẩm thực</span></div>
     <div><span class='p-word'>tourism</span> <span class='wt'>n</span> = <span class='p-mean'>du lịch</span></div>
     <div><span class='p-word'>industry</span> <span class='wt'>n</span> = <span class='p-mean'>công nghiệp</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>sushi, sashimi là món ăn → thuộc "cuisine" (ẩm thực) Nhật Bản.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>culture (rộng hơn), tourism (du lịch), industry (công nghiệp) không khớp cụ thể với "sushi và sashimi".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:17,type:"mcq",
 q:"Joe: \"Vietnamese people are really into seafood.\" — Ngoc: \"____ I love seafood, too.\"",
 options:[{t:"Yes, certainly.",c:true},{t:"Good news!",c:false},{t:"My pleasure.",c:false},{t:"No problem!",c:false}],
 exp:`<div class="vnt">💬 Dịch: Joe: "Người Việt Nam rất mê hải sản." — Ngoc: "Đúng vậy. Tớ cũng thích hải sản lắm."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>Yes, certainly.</span> = <span class='p-mean'>Đúng vậy, chắc chắn rồi.</span></div>
     <div><span class='p-word'>Good news!</span> = <span class='p-mean'>Tin tốt đấy!</span></div>
     <div><span class='p-word'>My pleasure.</span> = <span class='p-mean'>Hân hạnh (đáp lời cảm ơn).</span></div>
     <div><span class='p-word'>No problem!</span> = <span class='p-mean'>Không sao đâu.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Ngoc ĐỒNG TÌNH với nhận định của Joe (và nói mình cũng thích) → "Yes, certainly." (Đúng vậy).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"My pleasure/No problem" dùng để đáp lời cảm ơn/xin lỗi; "Good news" không hợp mạch đồng tình.</span></li></ol>`},

/* IV. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:18,type:"error",
 q:"<u>In</u> India, people celebrate Diwali <u>by</u> lighting oil lamps and <u>share</u> <u>sweets</u>.",
 options:["In","by","share","sweets"],correctIdx:2,
 accept:["sharing"],key:"share → sharing",
 exp:`<div class="vnt">💬 Dịch: Ở Ấn Độ, người ta đón lễ Diwali bằng cách thắp đèn dầu và chia sẻ bánh kẹo.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>share</span> → sửa thành <span class='hl-green'>sharing</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Hai hành động sau "by" phải SONG SONG dạng V-ing: "by lighting … and sharing …". Vì vậy "share" → "sharing".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:19,type:"error",
 q:"Unless they <u>don't attend</u> <u>the</u> meeting, they <u>will miss</u> important <u>information</u>.",
 options:["don't attend","the","will miss","information"],correctIdx:0,
 accept:["attend"],key:"don't attend → attend",
 exp:`<div class="vnt">💬 Dịch: Trừ khi họ tham dự cuộc họp, nếu không họ sẽ bỏ lỡ thông tin quan trọng.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>don't attend</span> → sửa thành <span class='hl-green'>attend</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"Unless" đã mang nghĩa PHỦ ĐỊNH ("nếu … không"), nên KHÔNG dùng thêm "don't" (tránh phủ định kép): "Unless they attend…".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:20,type:"error",
 q:"<em>Kimchi</em> <u>was</u> a <u>traditional</u> Korean dish <u>that</u> originated over 3,000 years <u>ago</u>.",
 options:["was","traditional","that","ago"],correctIdx:0,
 accept:["is"],key:"was → is",
 note:"👉 Câu cuối rồi, cố lên nhé! 💪",
 exp:`<div class="vnt">💬 Dịch: Kim chi là một món ăn truyền thống của Hàn Quốc có nguồn gốc từ hơn 3.000 năm trước.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>was</span> → sửa thành <span class='hl-green'>is</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Kim chi VẪN đang tồn tại (là sự thật hiển nhiên ở hiện tại) → dùng thì Hiện tại đơn "is", không dùng "was" (quá khứ). Mệnh đề "originated… ago" mới ở quá khứ.</span></li></ol>`},

/* V. Word form */
{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:21,type:"fill",
 q:"People in Spain ______ take a midday nap, known as a <em>siesta</em>. <span class='hint-word'>(typical)</span>",
 answer:["typically"],
 exp:`<div class="vnt">💬 Dịch: Người Tây Ban Nha <b>thường</b> ngủ trưa một giấc, gọi là "siesta".</div>
 <ol><li>Từ gốc: <span class='p-word'>typical</span> <span class='wt'>adj</span> = <span class='p-mean'>điển hình</span> → dạng cần điền: <span class='hl-green'>typically</span> <span class='wt'>adv</span> = <span class='p-mean'>thường, một cách điển hình</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: typically</span> <span class='p-grammar'>Cần TRẠNG TỪ bổ nghĩa cho động từ "take". Thêm "-ly": typical → typically.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:22,type:"fill",
 q:"______ in online learning is often limited to video calls and discussion boards. <span class='hint-word'>(interact)</span>",
 answer:["interaction"],
 exp:`<div class="vnt">💬 Dịch: <b>Sự tương tác</b> trong học trực tuyến thường bị giới hạn ở các cuộc gọi video và diễn đàn thảo luận.</div>
 <ol><li>Từ gốc: <span class='p-word'>interact</span> <span class='wt'>v</span> = <span class='p-mean'>tương tác</span> → dạng cần điền: <span class='hl-green'>Interaction</span> <span class='wt'>n</span> = <span class='p-mean'>sự tương tác</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: Interaction</span> <span class='p-grammar'>Đầu câu, làm CHỦ NGỮ → cần DANH TỪ (viết hoa chữ đầu). Thêm "-ion": interact → interaction.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:23,type:"fill",
 q:"Nobody wants to be friends with Cedric because of his rude ______. <span class='hint-word'>(behave)</span>",
 answer:["behaviour","behavior"],
 exp:`<div class="vnt">💬 Dịch: Không ai muốn làm bạn với Cedric vì <b>hành vi</b> thô lỗ của cậu ta.</div>
 <ol><li>Từ gốc: <span class='p-word'>behave</span> <span class='wt'>v</span> = <span class='p-mean'>cư xử</span> → dạng cần điền: <span class='hl-green'>behaviour</span> <span class='wt'>n</span> = <span class='p-mean'>hành vi, cách cư xử</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: behaviour</span> <span class='p-grammar'>Sau tính từ "rude" và giới từ "of his" cần DANH TỪ: behave → behaviour (Anh-Anh) / behavior (Anh-Mỹ).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:24,type:"fill",
 q:"In Germany, students are taught to be ______ thinkers from an early age. <span class='hint-word'>(depend)</span>",
 answer:["independent"],
 exp:`<div class="vnt">💬 Dịch: Ở Đức, học sinh được dạy để trở thành những người tư duy <b>độc lập</b> ngay từ nhỏ.</div>
 <ol><li>Từ gốc: <span class='p-word'>depend</span> <span class='wt'>v</span> = <span class='p-mean'>phụ thuộc</span> → dạng cần điền: <span class='hl-green'>independent</span> <span class='wt'>adj</span> = <span class='p-mean'>độc lập</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: independent</span> <span class='p-grammar'>Cần TÍNH TỪ trước danh từ "thinkers"; nghĩa "tư duy độc lập" → thêm tiền tố "in-": dependent → independent.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:25,type:"fill",
 q:"The tourists were excited to join in the ______ dances during the festival. <span class='hint-word'>(tribe)</span>",
 answer:["tribal"],
 exp:`<div class="vnt">💬 Dịch: Các du khách rất hào hứng tham gia những điệu nhảy <b>của bộ tộc</b> trong lễ hội.</div>
 <ol><li>Từ gốc: <span class='p-word'>tribe</span> <span class='wt'>n</span> = <span class='p-mean'>bộ tộc</span> → dạng cần điền: <span class='hl-green'>tribal</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc bộ tộc</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: tribal</span> <span class='p-grammar'>Cần TÍNH TỪ trước danh từ "dances" → "tribal dances" (điệu nhảy bộ tộc). Thêm "-al" (bỏ "e"): tribe → tribal.</span></li></ol>`},

/* VI. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:26,type:"fill",
 q:"Traditionally, her family enjoys ______ (drink) tea in the afternoon.",
 answer:["drinking"],
 exp:`<div class="vnt">💬 Dịch: Theo truyền thống, gia đình cô ấy thích uống trà vào buổi chiều.</div>
 <ol><li>Đáp án: <span class='hl-green'>drinking</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "enjoy + V-ing" (thích làm gì) → drinking.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:27,type:"fill",
 q:"You're late. The performance ______ (start) 30 minutes ago.",
 answer:["started"],
 exp:`<div class="vnt">💬 Dịch: Bạn đến muộn rồi. Buổi biểu diễn đã bắt đầu cách đây 30 phút.</div>
 <ol><li>Đáp án: <span class='hl-green'>started</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "30 minutes ago" → thì Quá khứ đơn: start + "-ed" = started.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:28,type:"fill",
 q:"Hey! I ______ (think) that someone ______ (knock) at the door. <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["think is knocking"],
 exp:`<div class="vnt">💬 Dịch: Này! Tớ nghĩ là có ai đó đang gõ cửa đấy.</div>
 <ol><li>Đáp án: <span class='hl-green'>think</span> … <span class='hl-green'>is knocking</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"think" là động từ tri giác → thì Hiện tại đơn (I think); "someone knocking" đang diễn ra ngay lúc này → Hiện tại tiếp diễn (is knocking).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:29,type:"fill",
 q:"I don't feel like cooking, so I ______ (order) something online.",
 answer:["will order"],
 exp:`<div class="vnt">💬 Dịch: Tôi không muốn nấu ăn, nên tôi sẽ đặt món gì đó trên mạng.</div>
 <ol><li>Đáp án: <span class='hl-green'>will order</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>QUYẾT ĐỊNH ngay tại thời điểm nói → dùng "will + V": will order.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Chia dạng đúng của động từ trong ngoặc",n:30,type:"fill",
 q:"My parents always let me ______ (decide) what to wear.",
 answer:["decide"],
 exp:`<div class="vnt">💬 Dịch: Bố mẹ tôi luôn để tôi tự quyết định mặc gì.</div>
 <ol><li>Đáp án: <span class='hl-green'>decide</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "let sb + V(nguyên mẫu, không "to")" (để/cho ai làm gì) → let me decide.</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:43,type:"fill",
 q:"will arrive / earlier than usual / long lines / to avoid / They / at the airport. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["they will arrive at the airport earlier than usual to avoid long lines"],
 exp:`<div class="vnt">💬 Dịch: Họ sẽ đến sân bay sớm hơn thường lệ để tránh phải xếp hàng dài.</div>
 <ol><li>Đáp án: <span class='hl-green'>They will arrive at the airport earlier than usual to avoid long lines.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ ngữ (They) + "will arrive at the airport" + "earlier than usual" (so sánh hơn) + "to avoid long lines" (to-V chỉ mục đích).</span></li></ol>`},

{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:44,type:"fill",
 q:"a polite greeting / as / In Thailand, / say \"sawadee\" / people. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["in thailand people say sawadee as a polite greeting","in thailand, people say \"sawadee\" as a polite greeting"],
 exp:`<div class="vnt">💬 Dịch: Ở Thái Lan, người ta nói "sawadee" như một lời chào lịch sự.</div>
 <ol><li>Đáp án: <span class='hl-green'>In Thailand, people say "sawadee" as a polite greeting.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trạng ngữ "In Thailand," + chủ ngữ (people) + động từ (say "sawadee") + "AS a polite greeting" (như một lời chào lịch sự).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Nối câu dùng từ cho sẵn",n:45,type:"fill",
 q:"Nối câu: <em>Amanda asked me for help. She didn't know how to use the software.</em> <span class='hint-word'>(SO)</span><br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["amanda didn't know how to use the software so she asked me for help","amanda did not know how to use the software so she asked me for help"],
 exp:`<div class="vnt">💬 Dịch: Amanda không biết cách dùng phần mềm, nên cô ấy đã nhờ tôi giúp.</div>
 <ol><li>Đáp án: <span class='hl-green'>Amanda didn't know how to use the software, so she asked me for help.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"so" nối NGUYÊN NHÂN → KẾT QUẢ. Nguyên nhân (không biết dùng phần mềm) đứng trước, "so" + kết quả (nhờ giúp).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Nối câu dùng từ cho sẵn",n:46,type:"fill",
 q:"Nối câu: <em>Behave nicely. Santa Claus will visit and give you presents.</em> <span class='hint-word'>(IF)</span><br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["if you behave nicely santa claus will visit and give you presents","if you behave nicely, santa claus will visit and give you presents"],
 exp:`<div class="vnt">💬 Dịch: Nếu con ngoan, ông già Noel sẽ đến thăm và tặng quà cho con.</div>
 <ol><li>Đáp án: <span class='hl-green'>If you behave nicely, Santa Claus will visit and give you presents.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (you behave nicely), … will + V (will visit and give)".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Nối câu dùng từ cho sẵn",n:47,type:"fill",
 q:"Nối câu: <em>The park opens in the summer. I will go there every weekend.</em> <span class='hint-word'>(WHEN)</span><br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["when the park opens in the summer i will go there every weekend","when the park opens in the summer, i will go there every weekend"],
 exp:`<div class="vnt">💬 Dịch: Khi công viên mở cửa vào mùa hè, tôi sẽ đến đó vào mỗi cuối tuần.</div>
 <ol><li>Đáp án: <span class='hl-green'>When the park opens in the summer, I will go there every weekend.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Mệnh đề thời gian với "When" dùng thì HIỆN TẠI ĐƠN (opens) dù nói về tương lai; mệnh đề chính dùng "will + V" (will go).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Nối câu dùng từ cho sẵn",n:48,type:"fill",
 q:"Nối câu: <em>You can choose chocolate ice cream for dessert. You can try the tiramisu.</em> <span class='hint-word'>(OR)</span><br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["you can choose chocolate ice cream for dessert or you can try the tiramisu","you can choose chocolate ice cream for dessert, or you can try the tiramisu"],

 q:"Gợi ý: <em>Oscar / had / more experience / Bill, / he / not get / promotion.</em>",
 options:[{t:"Although Oscar had more experience than Bill, he didn't get the promotion.",c:true},
          {t:"Because Oscar had more experience as Bill, he didn't get the promotion.",c:false},
          {t:"Oscar had more experience than Bill, so he didn't get the promotion.",c:false},

 exp:`<div class="vnt">💬 Dịch: Mặc dù Oscar có nhiều kinh nghiệm hơn Bill, anh ấy vẫn không được thăng chức.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Although Oscar had more experience than Bill, he didn't get the promotion.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Có sự TRÁI NGƯỢC (nhiều kinh nghiệm hơn nhưng không được thăng chức) → dùng "Although"; so sánh hơn dùng "more … than".</span></li>

 q:"Gợi ý: <em>She / rush out / hurry / and / forget / lock / front door.</em>",
 options:[{t:"She rushed out in a hurry and forgot to lock the front door.",c:true},
          {t:"She rushes out in a hurry and forgets lock a front door.",c:false},

   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Quá khứ đơn (rushed, forgot); cụm "in a hurry" (cần "a"); "forget TO V" (quên làm gì); "the front door" (cửa xác định).</span></li>

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#1a1440">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#ec4899">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 40 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🚀';memeKey='good';msg='Cố thêm chút nữa là chạm tới các vì sao luôn nè! 💫';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='🌙';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
