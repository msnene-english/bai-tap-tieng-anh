<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Test - Ms MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FFD1DC;
            --secondary: #B5EAD7;
            --tertiary: #C7CEEA;
            --quaternary: #E2F0CB;
            --text-main: #2D3436;
            --bg-glass: rgba(255, 255, 255, 0.65);
            --border-glass: rgba(255, 255, 255, 0.8);
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            background: linear-gradient(-45deg, var(--primary), var(--secondary), var(--tertiary), var(--quaternary));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Emoji Background */
        .floating-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; overflow: hidden;
        }
        .emoji {
            position: absolute;
            font-size: 3rem;
            opacity: 0.3;
            animation: float 20s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Header */
        header {
            text-align: center;
            padding: 10px;
            font-family: 'Baloo 2', cursive;
            z-index: 10;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass);
            box-shadow: var(--shadow-glass);
        }
        header h1 { margin: 0; font-size: 1.8rem; color: #ff6b81; }
        header p { margin: 0; font-size: 0.9rem; font-weight: 600; color: #70a1ff; }

        /* Split Screen Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            z-index: 10;
            padding: 20px;
            gap: 20px;
        }
        .left-pane, .right-pane {
            flex: 1;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: var(--shadow-glass);
            padding: 20px;
            overflow-y: auto;
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }

        /* Typography */
        h2 { font-family: 'Baloo 2', cursive; color: #5352ed; margin-top: 0; }
        .passage { margin-bottom: 30px; border-bottom: 2px dashed #dfe4ea; padding-bottom: 20px; }
        .passage p { font-size: 1.1rem; line-height: 1.6; }
        .btn-translate {
            background: linear-gradient(135deg, #70a1ff, #5352ed);
            color: white; border: none; padding: 6px 12px; border-radius: 20px;
            cursor: pointer; font-size: 0.85rem; font-family: 'Nunito', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 5px;
        }
        .btn-translate:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(83, 82, 237, 0.4); }
        .translation { display: none; color: #2f3542; font-style: italic; background: rgba(255,255,255,0.5); padding: 10px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #5352ed; }

        /* Glossary Table */
        .glossary { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; background: rgba(255,255,255,0.4); border-radius: 10px; overflow: hidden; }
        .glossary th, .glossary td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .glossary th { background: rgba(83, 82, 237, 0.2); font-weight: 700; color: #3742fa; }

        /* Quiz Styling */
        .question-card {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid white;
        }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 15px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-option {
            background: white; border: 2px solid #dfe4ea; border-radius: 12px;
            padding: 12px; font-size: 1.05rem; font-family: 'Nunito', sans-serif;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 600; color: #2f3542;
        }
        .btn-option:hover { border-color: #70a1ff; background: #f1f2f6; transform: translateY(-2px); }
        .btn-option.correct { background: #2ed573; color: white; border-color: #2ed573; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); }
        .btn-option.incorrect { background: #ff4757; color: white; border-color: #ff4757; }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Explanations */
        .explanation {
            display: none; margin-top: 15px; padding: 15px; border-radius: 12px;
            background: rgba(241, 242, 246, 0.8); border: 1px solid #dfe4ea;
            font-size: 0.95rem; line-height: 1.6;
        }
        .explanation ul { padding-left: 20px; margin: 10px 0; }
        .explanation li { margin-bottom: 5px; }
        .p-word { font-weight: 700; color: #3742fa; background: #eccc68; padding: 0 4px; border-radius: 4px; }
        .p-phonetic { font-style: italic; color: #747d8c; }
        .p-mean { color: #2f3542; font-weight: 600; text-decoration: underline; text-decoration-color: #ff6b81;}
        .p-grammar { font-family: monospace; background: #2f3542; color: white; padding: 2px 6px; border-radius: 4px; }
        .hl-green { color: #2ed573; font-weight: bold; }
        .hl-red { color: #ff4757; font-weight: bold; }

        /* Submit Button */
        .btn-submit {
            width: 100%; background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: white; border: none; padding: 15px; border-radius: 15px;
            font-size: 1.2rem; font-family: 'Baloo 2', cursive; font-weight: 800;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
        }
        .btn-submit:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 25px rgba(255, 71, 87, 0.6); }

        /* Modal Scorecard */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 20px;
            text-align: center; width: 90%; max-width: 450px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-content h2 { font-size: 2rem; margin-bottom: 5px; color: #ff6b81; }
        .modal-content .score { font-size: 3rem; font-family: 'Baloo 2', cursive; color: #2ed573; margin: 10px 0; }
        .modal-content .score-10 { font-size: 1.5rem; color: #5352ed; font-weight: bold; }
        .modal-content img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 15px; margin: 15px 0; }
        .btn-close-modal {
            background: #dfe4ea; border: none; padding: 10px 20px; border-radius: 10px;
            font-size: 1rem; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: bold;
        }

        /* Confetti */
        .confetti-piece { position: fixed; width: 10px; height: 10px; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body>

    <div class="floating-bg" id="floatingBg"></div>

    <header>
        <h1>🌟 Super Reading Challenge 🌟</h1>
        <p>Giáo viên tạo: Ms MS Chí Nên</p>
    </header>

    <div class="container">
        <div class="left-pane" id="passages-container">
            </div>

        <div class="right-pane">
            <h2 style="text-align: center;">📝 Bài Tập Trắc Nghiệm</h2>
            <div id="quiz-container">
                </div>
            <button class="btn-submit" onclick="submitTest()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>
        </div>
    </div>

    <div class="modal-overlay" id="nameModal">
        <div class="modal-content">
            <h2>Nhập tên của con nhé! ✨</h2>
            <input type="text" id="studentName" placeholder="Tên học sinh..." style="width: 80%; padding: 12px; border-radius: 10px; border: 2px solid #dfe4ea; font-size: 1rem; margin: 15px 0; font-family: 'Nunito'; text-align: center;" required>
            <button class="btn-submit" style="margin-top: 0; padding: 10px;" onclick="confirmName()">Bắt đầu nộp bài!</button>
        </div>
    </div>

    <div class="modal-overlay" id="scoreModal">
        <div class="modal-content">
            <h2 id="scoreName">Chúc mừng, [Name]!</h2>
            <div class="score" id="scoreValue">0/20</div>
            <div class="score-10" id="score10Value">Điểm hệ 10: 0.00/10</div>
            <p id="scoreComment" style="font-size: 1.1rem; font-weight: 600; color: #2f3542;"></p>
            <img id="scoreGif" src="" alt="Score Reaction GIF">
            <button class="btn-close-modal" onclick="closeModal()">Đóng / Làm lại</button>
        </div>
    </div>

    <script>
        // --- AUDIO SYSTEM (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if(!audioCtx) audioCtx = new AudioContext(); }

        function playDing() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        function playTingTing() {
            initAudio();
            for(let i=0; i<2; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                }, i * 150);
            }
        }

        function shootConfetti() {
            const colors = ['#ff6b81', '#70a1ff', '#2ed573', '#eccc68', '#a29bfe'];
            for(let i=0; i<40; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(confetti);
                
                const speed = Math.random() * 3 + 2;
                const angle = Math.random() * 2 - 1;
                let top = -10, left = parseFloat(confetti.style.left);
                
                const fall = setInterval(() => {
                    top += speed; left += angle;
                    confetti.style.top = top + 'px';
                    confetti.style.left = left + 'vw';
                    if(top > window.innerHeight) { clearInterval(fall); confetti.remove(); }
                }, 20);
            }
        }

        // --- FLOATING BACKGROUND EMOJIS ---
        const emojis = ['🌸', '🧧', '✨', '💍', '📚', '🌻', '🎉'];
        const bgContainer = document.getElementById('floatingBg');
        for(let i=0; i<15; i++) {
            const el = document.createElement('div');
            el.className = 'emoji';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 15 + 15) + 's';
            el.style.animationDelay = (Math.random() * 5) + 's';
            bgContainer.appendChild(el);
        }

        // --- DATA ---
        const passagesData = [
            {
                title: "Passage 1: Discover Our Beautiful Traditions!",
                paragraphs: [
                    {
                        en: "Do you want to learn about Vietnamese culture? It's a great (1) ___ of history and beautiful customs! We have a special way of life that brings families together.",
                        vn: "Bạn có muốn tìm hiểu về văn hóa Việt Nam không? Đó là một sự (1) kết hợp tuyệt vời của lịch sử và những phong tục tươi đẹp! Chúng ta có một lối sống đặc biệt giúp gắn kết các gia đình lại với nhau."
                    },
                    {
                        en: "For example, during Tet (Lunar New Year), we clean our houses and cook traditional food like Banh Chung. Children are very happy to get 'lucky money' in red envelopes.",
                        vn: "Ví dụ, trong dịp Tết (Tết Nguyên Đán), chúng ta dọn dẹp nhà cửa và nấu món ăn truyền thống như Bánh Chưng. Trẻ em rất vui khi nhận được 'tiền mừng tuổi' trong những phong bì đỏ."
                    },
                    {
                        en: "It's a time (2) ___ visiting our grandparents and (3) ___ older people. Our traditional ao dai dress is also (4) ___ symbol of our country. Come and see our traditions! They are very interesting!",
                        vn: "Đó là thời điểm (2) để thăm ông bà và (3) kính trọng người lớn tuổi. Chiếc áo dài truyền thống của chúng ta cũng là (4) một biểu tượng của đất nước. Hãy đến và khám phá những truyền thống của chúng tôi! Chúng rất thú vị!"
                    }
                ],
                glossary: [
                    {word: "culture", type: "n", vn: "văn hóa"}, {word: "custom", type: "n", vn: "phong tục"},
                    {word: "tradition", type: "n", vn: "truyền thống"}, {word: "envelope", type: "n", vn: "phong bì"},
                    {word: "symbol", type: "n", vn: "biểu tượng"}, {word: "generation", type: "n", vn: "thế hệ"},
                    {word: "respect", type: "v", vn: "tôn trọng"}, {word: "historical", type: "adj", vn: "thuộc về lịch sử"},
                    {word: "unique", type: "adj", vn: "độc đáo"}, {word: "atmosphere", type: "n", vn: "bầu không khí"}
                ]
            },
            {
                title: "Passage 2: Visit Sa Dec Flower Village!",
                paragraphs: [
                    {
                        en: "Welcome to Sa Dec Flower Village in Dong Thap! It is (1) ___ very famous place in the Mekong Delta.",
                        vn: "Chào mừng đến với Làng Hoa Sa Đéc ở Đồng Tháp! Đây là (1) một nơi rất nổi tiếng ở Đồng bằng sông Cửu Long."
                    },
                    {
                        en: "Every year, especially before Tet (Lunar New Year), the village becomes very (2) ___. You can see thousands of colourful flowers, like roses, marigolds, and chrysanthemums.",
                        vn: "Hàng năm, đặc biệt là trước Tết, ngôi làng trở nên rất (2) rực rỡ sắc màu. Bạn có thể nhìn thấy hàng ngàn bông hoa đầy màu sắc, như hoa hồng, hoa cúc vạn thọ và cúc đại đóa."
                    },
                    {
                        en: "Farmers grow the flowers on high wooden (3) ___ because of the water below. It is a beautiful sight!",
                        vn: "Những người nông dân trồng hoa trên những (3) luống gỗ cao vì bên dưới có nước. Đó là một cảnh tượng tuyệt đẹp!"
                    },
                    {
                        en: "If you like nature and taking photos, you must visit here. You can enjoy (4) ___ the unique atmosphere and buy some beautiful flowers. Don't miss this amazing experience!",
                        vn: "Nếu bạn thích thiên nhiên và chụp ảnh, bạn phải đến đây. Bạn có thể tận hưởng việc (4) ngắm nhìn bầu không khí độc đáo và mua một số bông hoa đẹp. Đừng bỏ lỡ trải nghiệm tuyệt vời này!"
                    }
                ],
                glossary: [
                    {word: "famous", type: "adj", vn: "nổi tiếng"}, {word: "colourful", type: "adj", vn: "sặc sỡ"},
                    {word: "chrysanthemum", type: "n", vn: "hoa cúc đại đóa"}, {word: "marigold", type: "n", vn: "cúc vạn thọ"},
                    {word: "wooden", type: "adj", vn: "bằng gỗ"}, {word: "atmosphere", type: "n", vn: "bầu không khí"},
                    {word: "unique", type: "adj", vn: "độc nhất"}, {word: "experience", type: "n", vn: "trải nghiệm"},
                    {word: "sight", type: "n", vn: "cảnh tượng"}, {word: "agricultural", type: "adj", vn: "thuộc nông nghiệp"}
                ]
            },
            {
                title: "Passage 3: Tet Festival Foods",
                paragraphs: [
                    {
                        en: "Tet is the biggest festival in Vietnam. To (1) ___ Tet, Vietnamese people make many tasty (2) ___ foods.",
                        vn: "Tết là lễ hội lớn nhất ở Việt Nam. Để (1) ăn mừng Tết, người Việt Nam làm rất nhiều món ăn (2) truyền thống ngon miệng."
                    },
                    {
                        en: "The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; (3) ___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet.",
                        vn: "Thực phẩm quan trọng nhất bao gồm bánh chưng, giò lụa, gà luộc, nem rán và xôi. Bánh chưng được làm từ gạo nếp, thịt lợn, đậu xanh và các loại gia vị khác, gói trong lá xanh; (3) vì vậy, món bánh này cần chuẩn bị rất nhiều. Món bánh này có thể được giữ trong thời gian dài, mặc dù thời tiết thường ẩm ướt trong dịp Tết."
                    },
                    {
                        en: "Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult (4) ___, people often buy them from famous suppliers.",
                        vn: "Những món ăn quan trọng khác không thể thiếu để thờ cúng tổ tiên là giò lụa, nem rán và xôi. Bởi vì giò lụa rất khó (4) để làm, mọi người thường mua chúng từ những nhà cung cấp nổi tiếng."
                    },
                    {
                        en: "However, sticky rice and spring rolls are easier to prepare and must be (5) ___ immediately after they are cooked, so they are often made (6) ___ home.",
                        vn: "Tuy nhiên, xôi và nem rán thì dễ chuẩn bị hơn và phải được (5) phục vụ/dọn ra ngay sau khi nấu chín, nên chúng thường được làm (6) tại nhà."
                    }
                ],
                glossary: [
                    {word: "celebrate", type: "v", vn: "ăn mừng, kỷ niệm"}, {word: "festival", type: "n", vn: "lễ hội"},
                    {word: "traditional", type: "adj", vn: "truyền thống"}, {word: "sticky rice", type: "n", vn: "gạo nếp/xôi"},
                    {word: "supplier", type: "n", vn: "nhà cung cấp"}, {word: "prepare", type: "v", vn: "chuẩn bị"},
                    {word: "humid", type: "adj", vn: "ẩm ướt"}, {word: "ancestor", type: "n", vn: "tổ tiên"},
                    {word: "worship", type: "v", vn: "thờ cúng"}, {word: "significant", type: "adj", vn: "quan trọng, có ý nghĩa"}
                ]
            },
            {
                title: "Passage 4: Wedding Traditions around the World",
                paragraphs: [
                    {
                        en: "A lovely custom from France comes in the form of a two handled cup called the 'coup de marriage'. The cup was saved to be used from one (1) ___ to another, of course, (2) ___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today.",
                        vn: "Một phong tục đáng yêu từ Pháp xuất hiện dưới dạng một chiếc cúp hai quai được gọi là 'coup de marriage'. Chiếc cúp được cất giữ để truyền từ (1) thế hệ này sang thế hệ khác, tất nhiên, (2) phong tục nâng ly chúc mừng lẫn nhau đã được thiết lập từ lâu, nhưng chiếc cúp hai quai tạo thêm nét đặc biệt cho các đám cưới ngày nay."
                    },

                    {text: "are", mean: "hiện tại (to be HTĐ, số nhiều)", correct: false}
                ],
                correctExp: "Đáp án đúng là <span class='p-word'>were</span>. Cụm trạng từ thời gian <span class='p-grammar'>Until recently</span> (cho đến dạo gần đây) hàm ý kể về một sự thật hoặc trạng thái trong quá khứ nay đã kết thúc, do đó động từ chia ở Quá Khứ Đơn là chính xác nhất.",
                wrongExp: "<span class='p-word'>Are</span> và <span class='p-word'>have been</span> sai vì không thể hiện sự thay đổi trạng thái ở quá khứ. <span class='p-word'>Had been</span> chỉ dùng khi nhấn mạnh hành động xảy ra trước 1 hành động khác trong quá khứ."
            },
            {
                q: "This beautiful old (4) ___ could be included in a wedding of today...",
                vn: "(4) ___ cổ xưa tuyệt đẹp này có thể được đưa vào các đám cưới ngày nay...",
                opts: [
                    {text: "tradition", mean: "truyền thống (n)", correct: true},
                    {text: "reunion", mean: "sự đoàn tụ (n)", correct: false},
                    {text: "festival", mean: "lễ hội (n)", correct: false},
                    {text: "worship", mean: "sự thờ cúng (n)", correct: false}
                ],
                correctExp: "Đáp án đúng là <span class='p-word'>tradition</span>. Đoạn văn đang bàn về 'Wedding Traditions' (Các truyền thống trong đám cưới), việc giữ nến là một tập tục lâu đời, nên dùng từ <span class='p-grammar'>tradition</span> là đúng ngữ cảnh nhất.",
                wrongExp: "Việc cầm nến không phải là một <span class='p-word'>festival</span> (lễ hội), <span class='p-word'>reunion</span> (cuộc đoàn tụ gia đình), hay <span class='p-word'>worship</span> (sự cúng bái)."
            },
            {
                q: "These candles could then be used (5) ___ the unity candle at the end...",
                vn: "Những ngọn nến này sau đó có thể được sử dụng (5) ___ ngọn nến đoàn tụ vào cuối...",
                opts: [
                    {text: "to light", mean: "để thắp sáng (to V)", correct: true},
                    {text: "lighting", mean: "việc thắp sáng (v-ing)", correct: false},
                    {text: "light", mean: "thắp sáng (v-infinitive)", correct: false},
                    {text: "lighted", mean: "được thắp sáng (v-ed)", correct: false}
                ],
                correctExp: "Đáp án đúng là <span class='p-word'>to light</span>. Cấu trúc bị động chỉ mục đích: <span class='p-grammar'>S + be used + to V</span> mang ý nghĩa là 'được sử dụng ĐỂ làm gì'.",
                wrongExp: "<span class='p-word'>Lighting</span> chỉ đúng nếu cấu trúc là 'be used TO V-ing' mang nghĩa quen với việc gì. Các dạng <span class='p-word'>light</span>, <span class='p-word'>lighted</span> sai ngữ pháp hoàn toàn."
            },
            {
                q: "Flowers have always played a very (6) ___ part in Indian weddings.",
                vn: "Hoa luôn đóng một phần/vai trò rất (6) ___ trong các đám cưới Ấn Độ.",
                opts: [
                    {text: "important", mean: "quan trọng (adj)", correct: true},
                    {text: "import", mean: "nhập khẩu (v/n)", correct: false},
                    {text: "importance", mean: "sự quan trọng (n)", correct: false},
                    {text: "importantly", mean: "một cách quan trọng (adv)", correct: false}
                ],
                correctExp: "Đáp án đúng là <span class='p-word'>important</span>. Ta có cụm collocation cố định <span class='p-grammar'>play an important part/role in something</span> (đóng vai trò quan trọng trong việc gì). Đứng trước danh từ 'part' ta cần một tính từ.",
                wrongExp: "<span class='p-word'>Importance</span> (Danh từ), <span class='p-word'>Importantly</span> (Trạng từ) sai loại từ. <span class='p-word'>Import</span> (nhập khẩu) sai hoàn toàn về nghĩa."
            }
        ];

        // --- RENDER PASSAGES ---
        const passageContainer = document.getElementById('passages-container');
        passagesData.forEach(p => {
            let html = `<div class="passage"><h2>📖 ${p.title}</h2>`;
            p.paragraphs.forEach((para, idx) => {
                const uniqueId = `trans-${Math.random().toString(36).substring(7)}`;
                html += `
                    <div>
                        <p>${para.en}</p>
                        <button class="btn-translate" onclick="toggleTranslation('${uniqueId}')">Mở dịch đoạn này 🌟</button>
                        <div class="translation" id="${uniqueId}">${para.vn}</div>
                    </div>
                `;
            });
            // Glossary table
            html += `
                <table class="glossary">
                    <thead><tr><th>Từ vựng</th><th>Loại từ</th><th>Nghĩa Tiếng Việt</th></tr></thead>
                    <tbody>
                        ${p.glossary.map(g => `<tr><td><b>${g.word}</b></td><td><i>${g.type}</i></td><td>${g.vn}</td></tr>`).join('')}
                    </tbody>
                </table>
            `;
            html += `</div>`;
            passageContainer.innerHTML += html;
        });

        function toggleTranslation(id) {
            const el = document.getElementById(id);
            if (el.style.display === 'block') { el.style.display = 'none'; } 
            else { el.style.display = 'block'; }
        }

        // --- RENDER QUIZ ---
        const quizContainer = document.getElementById('quiz-container');
        let answeredCount = 0;
        let scoreCount = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        quizData.forEach((q, idx) => {
            const qNum = idx + 1;
            const shuffledOpts = shuffleArray([...q.opts]);
            
            let html = `
                <div class="question-card" id="qCard_${qNum}">
                    <div class="question-text">Câu ${qNum}: ${q.q}</div>
                    <div class="options-grid">
                        ${shuffledOpts.map((opt, optIdx) => `
                            <button class="btn-option" onclick="checkAnswer(this, ${qNum}, ${opt.correct})">${opt.text}</button>
                        `).join('')}
                    </div>
                    <div class="explanation" id="exp_${qNum}">
                        <strong>Dịch đề bài:</strong> ${q.vn}<br><br>
                        <strong>Các đáp án:</strong>
                        <ul>
                            ${q.opts.map(o => `<li><b>${o.text}</b> ➔ Dịch: <span class='p-mean'>${o.mean}</span></li>`).join('')}
                        </ul>
                        <div class="hl-green">✔️ Tại sao đúng:</div>
                        <p>${q.correctExp}</p>
                        <div class="hl-red">❌ Tại sao sai:</div>
                        <p>${q.wrongExp}</p>
                    </div>
                </div>
            `;
            quizContainer.innerHTML += html;
        });

        function checkAnswer(btn, qNum, isCorrect) {
            // Prevent multiple clicks
            const card = document.getElementById(`qCard_${qNum}`);
            if(card.classList.contains('answered')) return;
            card.classList.add('answered');
            answeredCount++;

            const buttons = card.querySelectorAll('.btn-option');
            buttons.forEach(b => { b.style.pointerEvents = 'none'; }); // Disable all

            if(isCorrect) {
                btn.classList.add('correct');
                playDing();
                shootConfetti();
                scoreCount++;
            } else {
                btn.classList.add('incorrect');
                btn.classList.add('shake');
                playTingTing();
                // Highlight correct answer
                buttons.forEach(b => {
                    // We need to find the correct button text based on quizData
                    const correctText = quizData[qNum-1].opts.find(o => o.correct).text;
                    if(b.innerText === correctText) { b.classList.add('correct'); }
                });
            }

            // Show explanation
            document.getElementById(`exp_${qNum}`).style.display = 'block';
        }

        // --- SUBMIT & SCORE LOGIC ---
        function submitTest() {
            if(answeredCount < quizData.length) {
                alert(`Con mới làm ${answeredCount}/${quizData.length} câu thôi. Làm hết rồi mới nộp bài nha!`);
                return;
            }
            document.getElementById('nameModal').style.display = 'flex';
        }

        function confirmName() {
            const name = document.getElementById('studentName').value.trim();
            if(!name) { alert("Con nhớ nhập tên nha!"); return; }
            document.getElementById('nameModal').style.display = 'none';
            showScore(name);
        }

        function showScore(name) {
            const modal = document.getElementById('scoreModal');
            document.getElementById('scoreName').innerText = `Chúc mừng, ${name}! 🎉`;
            document.getElementById('scoreValue').innerText = `${scoreCount}/${quizData.length}`;
            
            // Calculate scale of 10
            const score10 = ((scoreCount / quizData.length) * 10).toFixed(2);
            document.getElementById('score10Value').innerText = `Điểm quy đổi: ${score10}/10`;

            const commentEl = document.getElementById('scoreComment');
            const gifEl = document.getElementById('scoreGif');
            const percentage = scoreCount / quizData.length;

            if(percentage === 1) {
                commentEl.innerText = "Ms MS Chí Nên: Tuyệt vời quá! Con là thiên tài tiếng Anh thực thụ! 💯✨";
                gifEl.src = "https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif"; // Cheering / Genius
            } else if(percentage >= 0.6) {
                commentEl.innerText = "Ms MS Chí Nên: Rất tốt! Cố gắng thêm một chút nữa là hoàn hảo nha! High-five! 🙌";
                gifEl.src = "https://media.giphy.com/media/3o7abGQa0aRJUurpII/giphy.gif"; // High five
            } else {
                commentEl.innerText = "Ms MS Chí Nên: Ui, bài này hơi khó phải không? Không sao, đọc kỹ giải thích của cô và thử lại nha! Cố lên! 💪";
                gifEl.src = "https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif"; // Try again/Cute crying
            }

            modal.style.display = 'flex';
            shootConfetti(); // Big celebration on end
        }

        function closeModal() {
            document.getElementById('scoreModal').style.display = 'none';
            // Optional: Auto scroll to top to review mistakes
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
