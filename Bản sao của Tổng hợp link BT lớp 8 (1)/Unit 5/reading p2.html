<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Test - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff9a9e;
            --secondary: #fecfef;
            --tertiary: #a1c4fd;
            --quaternary: #c2e9fb;
            --text-main: #2d3436;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --border-glass: rgba(255, 255, 255, 0.9);
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            background: linear-gradient(-45deg, var(--primary), var(--secondary), var(--tertiary), var(--quaternary));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            height: 100vh; display: flex; flex-direction: column;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Emoji Background */
        .floating-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; overflow: hidden;
        }
        .emoji {
            position: absolute; font-size: 3.5rem; opacity: 0.35;
            animation: float 20s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Header */
        header {
            text-align: center; padding: 10px; font-family: 'Baloo 2', cursive;
            z-index: 10; background: var(--bg-glass); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass); box-shadow: var(--shadow-glass);
        }
        header h1 { margin: 0; font-size: 1.8rem; color: #ff4757; }
        header p { margin: 0; font-size: 0.95rem; font-weight: 700; color: #5352ed; }

        /* Split Screen Layout */
        .container {
            display: flex; flex: 1; overflow: hidden; z-index: 10; padding: 20px; gap: 20px;
        }
        .left-pane, .right-pane {
            flex: 1; background: var(--bg-glass); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); border: 2px solid var(--border-glass);
            border-radius: 20px; box-shadow: var(--shadow-glass); padding: 20px; overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }

        /* Typography & Passages */
        h2 { font-family: 'Baloo 2', cursive; color: #3742fa; margin-top: 0; font-size: 1.8rem; }
        .passage { margin-bottom: 40px; border-bottom: 3px dashed #ced6e0; padding-bottom: 25px; }
        .passage-content { margin-bottom: 15px; }
        .passage p { font-size: 1.15rem; line-height: 1.7; margin: 10px 0; font-weight: 600; color: #2f3542;}
        .btn-translate {
            background: linear-gradient(135deg, #70a1ff, #5352ed); color: white;
            border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer;
            font-size: 0.9rem; font-family: 'Nunito', sans-serif; font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-translate:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(83, 82, 237, 0.4); }
        .translation {
            display: none; color: #2f3542; font-style: italic; font-weight: 600;
            background: rgba(255,255,255,0.7); padding: 12px; border-radius: 10px;
            margin-top: 10px; border-left: 5px solid #5352ed; font-size: 1.05rem;
        }

        /* Glossary Table */
        .glossary { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.95rem; background: rgba(255,255,255,0.6); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .glossary th, .glossary td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .glossary th { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); font-weight: 800; color: #2f3542; }

        /* Quiz Styling */
        .question-card {
            background: rgba(255, 255, 255, 0.85); border-radius: 15px; padding: 20px; margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08); border: 1px solid white;
        }
        .question-text { font-size: 1.2rem; font-weight: 800; margin-bottom: 18px; color: #2f3542; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .btn-option {
            background: white; border: 2px solid #dfe4ea; border-radius: 12px;
            padding: 15px; font-size: 1.1rem; font-family: 'Nunito', sans-serif;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 700; color: #2f3542; text-align: left; line-height: 1.4;
        }
        .btn-option:hover { border-color: #ff6b81; background: #fff0f2; transform: translateX(5px); }
        .btn-option.correct { background: #2ed573; color: white; border-color: #2ed573; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); }
        .btn-option.incorrect { background: #ff4757; color: white; border-color: #ff4757; }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Explanations CSS Formats (STRICTLY REQUIRED) */
        .explanation {
            display: none; margin-top: 15px; padding: 18px; border-radius: 12px;
            background: rgba(241, 242, 246, 0.9); border: 2px solid #ced6e0;
            font-size: 1rem; line-height: 1.7;
        }
        .explanation ul { padding-left: 20px; margin: 10px 0; }
        .explanation li { margin-bottom: 8px; }
        .p-word { font-weight: 800; color: #3742fa; background: #ffeaa7; padding: 2px 6px; border-radius: 5px; }
        .p-phonetic { font-style: italic; color: #747d8c; font-family: 'Times New Roman', serif; }
        .p-mean { color: #2f3542; font-weight: 700; text-decoration: underline; text-decoration-color: #ff4757; text-decoration-thickness: 2px; }
        .p-grammar { font-family: monospace; background: #2d3436; color: #00cec9; padding: 3px 8px; border-radius: 5px; font-weight: bold; }
        .hl-green { color: #2ed573; font-weight: 800; display: inline-block; margin-top: 10px; }
        .hl-red { color: #ff4757; font-weight: 800; display: inline-block; margin-top: 10px; }

        /* Submit Button */
        .btn-submit {
            width: 100%; background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white; border: none; padding: 18px; border-radius: 15px;
            font-size: 1.3rem; font-family: 'Baloo 2', cursive; font-weight: 800;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
        }
        .btn-submit:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 25px rgba(255, 71, 87, 0.6); }

        /* Modal Scorecard */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: rgba(255,255,255,0.95); padding: 35px; border-radius: 25px;
            text-align: center; width: 90%; max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-content h2 { font-size: 2.2rem; margin-bottom: 5px; color: #ff4757; font-family: 'Baloo 2', cursive; }
        .modal-content .score { font-size: 3.5rem; font-family: 'Baloo 2', cursive; color: #2ed573; margin: 5px 0; line-height: 1; }
        .modal-content .score-10 { font-size: 1.6rem; color: #5352ed; font-weight: 800; background: #f1f2f6; display: inline-block; padding: 5px 15px; border-radius: 10px; margin-bottom: 15px;}
        .modal-content img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 15px; margin: 15px 0; border: 4px solid #dfe4ea; }
        .btn-close-modal {
            background: #2f3542; color: white; border: none; padding: 12px 25px; border-radius: 12px;
            font-size: 1.1rem; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: bold;
            transition: background 0.3s;
        }
        .btn-close-modal:hover { background: #576574; }

        /* Confetti */
        .confetti-piece { position: fixed; width: 12px; height: 12px; pointer-events: none; z-index: 9999; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="floating-bg" id="floatingBg"></div>

    <header>
        <h1>🌟 Super Reading Challenge: Traditions & Gifts 🌟</h1>
        <p>Giáo viên tạo: Ms. Chí Nên</p>
    </header>

    <div class="container">
        <div class="left-pane" id="passages-container">
            </div>

        <div class="right-pane">
            <h2 style="text-align: center; font-size: 2rem;">📝 Bài Tập Trắc Nghiệm</h2>
            <div id="quiz-container">
                </div>
            <button class="btn-submit" onclick="submitTest()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>
        </div>
    </div>

    <div class="modal-overlay" id="nameModal">
        <div class="modal-content">
            <h2>Nhập tên của con nhé! ✨</h2>
            <input type="text" id="studentName" placeholder="Ví dụ: Cà Rốt, Doraemon..." style="width: 85%; padding: 15px; border-radius: 12px; border: 2px solid #ced6e0; font-size: 1.1rem; margin: 20px 0; font-family: 'Nunito'; text-align: center; font-weight: bold;" required>
            <button class="btn-submit" style="margin-top: 0; padding: 12px;" onclick="confirmName()">Bắt đầu nộp bài!</button>
        </div>
    </div>

    <div class="modal-overlay" id="scoreModal">
        <div class="modal-content">
            <h2 id="scoreName">Chúc mừng, [Name]!</h2>
            <div class="score" id="scoreValue">0/18</div>
            <div class="score-10" id="score10Value">Điểm hệ 10: 0.00/10</div>
            <p id="scoreComment" style="font-size: 1.15rem; font-weight: 700; color: #2f3542; margin-top: 0;"></p>
            <img id="scoreGif" src="" alt="Score Reaction GIF">
            <button class="btn-close-modal" onclick="closeModal()">Đóng / Xem lại bài giải</button>
        </div>
    </div>

    <script>
        // --- AUDIO SYSTEM (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if(!audioCtx) audioCtx = new AudioContext(); }

        function playDing() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function playTingTing() {
            initAudio();
            for(let i=0; i<2; i++) {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                }, i * 120);
            }
        }

        function shootConfetti() {
            const colors = ['#ff4757', '#70a1ff', '#2ed573', '#ffa502', '#ff6b81', '#9b59b6'];
            for(let i=0; i<60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(confetti);
                
                const speed = Math.random() * 4 + 2;
                const angle = Math.random() * 3 - 1.5;
                let top = -10, left = parseFloat(confetti.style.left);
                
                const fall = setInterval(() => {
                    top += speed; left += angle;
                    confetti.style.top = top + 'px';
                    confetti.style.left = left + 'vw';
                    if(top > window.innerHeight) { clearInterval(fall); confetti.remove(); }
                }, 20);
            }
        }

        // --- FLOATING BACKGROUND EMOJIS ---
        const emojis = ['💍', '👰‍♀️', '🎁', '🧧', '🎂', '🌳', '🌸'];
        const bgContainer = document.getElementById('floatingBg');
        for(let i=0; i<20; i++) {
            const el = document.createElement('div');
            el.className = 'emoji';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 20 + 15) + 's';
            el.style.animationDelay = (Math.random() * 10) + 's';
            bgContainer.appendChild(el);
        }

        // --- PASSAGE DATA ---
        const passagesData = [
            {
                title: "Passage 1: SOMETHING OLD, SOMETHING NEW",
                paragraphs: [
                    {
                        en: "Although there are various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: 'Something old, something new, something borrowed, something blue.'",
                        vn: "Mặc dù có nhiều phong cách đám cưới khác nhau ở Mỹ, hầu hết các đám cưới vẫn tuân theo những truyền thống nhất định. Một trong số đó là một câu nói cổ có từ nước Anh thế kỷ 19 về những gì cô dâu nên mặc hoặc mang theo: 'Một chút gì đó cũ, một chút gì đó mới, một chút gì đó đi mượn, một chút gì đó màu xanh.'"
                    },
                    {
                        en: "A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes.",
                        vn: "Cô dâu mặc một món đồ cũ để gợi nhớ về gia đình và quá khứ. Một số cô dâu mặc váy cưới của mẹ họ hoặc đeo một món đồ trang sức của bà. Một món đồ mới mang ý nghĩa cầu chúc may mắn và hy vọng về một tương lai hạnh phúc với người chồng mới. Một lần nữa, món đồ này có thể là chiếc váy, nhưng thông thường nó là một đôi giày mới."
                    },
                    {
                        en: "Something borrowed such as a friend's handkerchief or a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married.",
                        vn: "Một món đồ đi mượn như chiếc khăn tay của người bạn hoặc khăn voan cô dâu của một người bạn đã kết hôn có nghĩa là cô dâu có bạn bè và gia đình sẵn sàng giúp đỡ cô ấy. Một món đồ màu xanh là biểu tượng của sự tin tưởng và lòng chung thủy giữa hai vợ chồng. Ngày nay, một số cô dâu sáng tạo với món đồ này bằng cách sơn móng tay màu xanh nhạt hoặc đeo một dải ruy băng vớ (garter) trên chân. Một truyền thống khác nói rằng chú rể nên lấy dải ruy băng vớ đó sau buổi lễ và ném nó cho những người đàn ông độc thân. Người đàn ông nào bắt được nó sẽ là người tiếp theo kết hôn."
                    }
                ],
                glossary: [
                    {word: "various", phonetic: "/ˈveəriəs/", type: "adj", vn: "đa dạng, nhiều loại khác nhau"},
                    {word: "tradition", phonetic: "/trəˈdɪʃn/", type: "n", vn: "truyền thống"},
                    {word: "remind", phonetic: "/rɪˈmaɪnd/", type: "v", vn: "nhắc nhở, làm gợi nhớ"},
                    {word: "jewelry", phonetic: "/ˈdʒuːəlri/", type: "n", vn: "đồ trang sức"},
                    {word: "handkerchief", phonetic: "/ˈhæŋkətʃɪf/", type: "n", vn: "khăn tay"},
                    {word: "bridal veil", phonetic: "/ˈbraɪdl veɪl/", type: "n", vn: "khăn voan cô dâu"},
                    {word: "willing", phonetic: "/ˈwɪlɪŋ/", type: "adj", vn: "sẵn lòng"},
                    {word: "symbol", phonetic: "/ˈsɪmbl/", type: "n", vn: "biểu tượng"},
                    {word: "faith", phonetic: "/feɪθ/", type: "n", vn: "niềm tin, sự chung thủy"},
                    {word: "ceremony", phonetic: "/ˈserəməni/", type: "n", vn: "buổi lễ"}
                ]
            },
            {
                title: "Passage 2: GIFT-GIVING CUSTOMS IN VIET NAM",
                paragraphs: [
                    {
                        en: "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture.",
                        vn: "Việc tặng quà rất quan trọng ở Việt Nam vì tầm quan trọng của các mối quan hệ giữa các cá nhân trong văn hóa Việt Nam."
                    },
                    {
                        en: "First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays to express respect, love, appreciation, or gratitude.",
                        vn: "Đầu tiên và quan trọng nhất, đừng khuyến khích tham nhũng. Có một ranh giới rõ ràng giữa việc tặng quà và hối lộ. Tuy nhiên, việc trao đổi những món quà nhỏ trong một số dịp nhất định như ngày kỷ niệm, ngày lễ Tết để thể hiện sự tôn trọng, tình yêu thương, sự trân trọng hoặc lòng biết ơn là điều phổ biến ở Việt Nam."
                    },
                    {
                        en: "Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee.",
                        vn: "Phong tục tặng quà phụ thuộc vào ngữ cảnh. Nếu đó là món quà riêng tư cho một đối tác người Việt Nam, bạn nên tặng món quà đó vào một dịp riêng tư. Nếu bạn có quà cho toàn bộ văn phòng hoặc công ty, bạn nên tặng nó sau cuộc họp kinh doanh với toàn bộ nhân viên văn phòng."
                    },
                    {
                        en: "Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship.",
                        vn: "Không gói quà bằng giấy màu đen vì màu này không may mắn và liên quan đến đám tang ở Việt Nam. Những món quà tượng trưng cho sự cắt đứt như kéo, dao và các vật sắc nhọn khác nên tránh vì chúng mang ý nghĩa cắt đứt mối quan hệ."
                    },
                    {
                        en: "Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate.",
                        vn: "Người Việt Nam có thể mở hoặc không mở những món quà này khi họ nhận được; hãy để họ tự quyết định. Bạn cũng sẽ nhận được quà và nên nghe theo lời chủ nhà về việc bạn có nên mở chúng khi nhận hay không. Bất kể khi nào nó được mở hay nó là gì, những lời cảm ơn chân thành và nồng nhiệt luôn luôn là điều phù hợp."
                    }
                ],
                glossary: [
                    {word: "significance", phonetic: "/sɪɡˈnɪfɪkəns/", type: "n", vn: "tầm quan trọng, ý nghĩa"},

                        <button class="btn-translate" onclick="toggleTranslation('${uniqueId}')">

                        <div class="translation" id="${uniqueId}">${para.vn}</div>

                </table>
            `;
            html += `</div>`;
            passageContainer.innerHTML += html;

        function toggleTranslation(id) {
            const el = document.getElementById(id);
            if (el.style.display === 'block') { el.style.display = 'none'; }

        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        quizData.forEach((q, idx) => {
            const qNum = idx + 1;
            const shuffledOpts = shuffleArray([...q.opts]);
            
            let html = `
                <div class="question-card" id="qCard_${qNum}">
                    <div class="question-text">Câu ${qNum}: ${q.q}</div>
                    <div class="options-grid">
                        ${shuffledOpts.map((opt) => `
                            <button class="btn-option" onclick="checkAnswer(this, ${qNum}, ${opt.correct})">${opt.text}</button>
                        `).join('')}
                    </div>
                    <div class="explanation" id="exp_${qNum}">
                        <strong>📌 Dịch đề bài:</strong> ${q.vn}<br><br>
                        <strong>🔍 Các đáp án:</strong>
                        <ul>
                            ${q.opts.map(o => `<li><span class='p-word'>${o.text}</span> ➔ Dịch: <span class='p-mean'>${o.mean}</span></li>`).join('')}
                        </ul>
                        <div class="hl-green">✔️ Tại sao đúng:</div>
                        <p>${q.correctExp}</p>
                        <div class="hl-red">❌ Tại sao sai:</div>
                        <p>${q.wrongExp}</p>
                    </div>
                </div>
            `;
            quizContainer.innerHTML += html;
        });

        function checkAnswer(btn, qNum, isCorrect) {
            const card = document.getElementById(`qCard_${qNum}`);
            if(card.classList.contains('answered')) return; // Ngăn chặn bấm nhiều lần
            card.classList.add('answered');
            answeredCount++;

            const buttons = card.querySelectorAll('.btn-option');
            buttons.forEach(b => { b.style.pointerEvents = 'none'; }); // Disable toàn bộ nút

            if(isCorrect) {
                btn.classList.add('correct');
                playDing();
                shootConfetti();
                scoreCount++;
            } else {
                btn.classList.add('incorrect');
                btn.classList.add('shake');
                playTingTing();
                // Tự động Highlight đáp án đúng
                buttons.forEach(b => {
                    const correctText = quizData[qNum-1].opts.find(o => o.correct).text;
                    if(b.innerText === correctText) { b.classList.add('correct'); }
                });
            }

            // Hiện khung giải thích siêu chi tiết
            document.getElementById(`exp_${qNum}`).style.display = 'block';
        }

        // --- SUBMIT & SCORE LOGIC ---
        function submitTest() {
            if(answeredCount < quizData.length) {

            }
            document.getElementById('nameModal').style.display = 'flex';

            const modal = document.getElementById('scoreModal');
            document.getElementById('scoreName').innerText = `🎉 Chúc mừng, ${name}! 🎉`;

            // Tính điểm hệ 10 làm tròn 2 chữ số thập phân
            const score10 = ((scoreCount / quizData.length) * 10).toFixed(2);
            document.getElementById('score10Value').innerText = `Điểm hệ 10: ${score10}/10`;

            const gifEl = document.getElementById('scoreGif');
            const percentage = scoreCount / quizData.length;

            if(percentage === 1) {
                commentEl.innerText = "Ms. Chí Nên: Tuyệt vời quá! Đạt điểm tuyệt đối rồi, con chính là thiên tài tiếng Anh thực thụ! 💯✨";

            }

            modal.style.display = 'flex';
            shootConfetti(); // Bắn pháo hoa vinh danh
