<script>
(function(){const items=['🧧','🏮','🎏','🐉','🥮','🎆','🪷','🎎','🥟','🍊','🪔','🎐','🀄','🧨','🥠','🎋'];
  const layer=document.getElementById('foodlayer');
  for(let i=0;i<20;i++){const s=document.createElement('span');s.textContent=items[i%items.length];
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(1.6+Math.random()*2.2)+'rem';
    s.style.animationDelay=(Math.random()*6)+'s';s.style.animationDuration=(5+Math.random()*5)+'s';layer.appendChild(s);}})();

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#FF4757','#FDCB6E','#00D26A','#f6b93b','#c0392b','#e74c3c','#00C9A7'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Ms. Chí Nên · NEN giải thích chi tiết";
const TOTAL=40;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"u<u>n</u>cle",c:false},{t:"fi<u>n</u>ger",c:false},{t:"mo<u>n</u>k",c:false},{t:"traditio<u>n</u>",c:true}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "n" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>u<u>n</u>cle</span> <span class='p-phonetic'>/ˈʌŋkl/</span> = <span class='p-mean'>chú/bác</span> → âm <b>/ŋ/</b></div>
     <div><span class='p-word'>fi<u>n</u>ger</span> <span class='p-phonetic'>/ˈfɪŋɡə/</span> = <span class='p-mean'>ngón tay</span> → âm <b>/ŋ/</b></div>
     <div><span class='p-word'>mo<u>n</u>k</span> <span class='p-phonetic'>/mʌŋk/</span> = <span class='p-mean'>nhà sư</span> → âm <b>/ŋ/</b></div>
     <div><span class='hl-green'>tradition</span> <span class='p-phonetic'>/trəˈdɪʃn/</span> = <span class='p-mean'>truyền thống</span> → âm <b>/n/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"tradition" có "n" đọc là /n/, khác với ba từ kia có "n" đứng trước k/g nên đọc thành /ŋ/ (âm mũi).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>uncle, finger, monk đều có âm /ŋ/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"decor<u>a</u>te",c:false},{t:"<u>a</u>ncestor",c:true},{t:"f<u>a</u>mous",c:false},{t:"p<u>a</u>per",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "a" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>decor<u>a</u>te</span> <span class='p-phonetic'>/ˈdekəreɪt/</span> = <span class='p-mean'>trang trí</span> → âm <b>/eɪ/</b></div>
     <div><span class='hl-green'>ancestor</span> <span class='p-phonetic'>/ˈænsestə/</span> = <span class='p-mean'>tổ tiên</span> → âm <b>/æ/</b></div>
     <div><span class='p-word'>f<u>a</u>mous</span> <span class='p-phonetic'>/ˈfeɪməs/</span> = <span class='p-mean'>nổi tiếng</span> → âm <b>/eɪ/</b></div>
     <div><span class='p-word'>p<u>a</u>per</span> <span class='p-phonetic'>/ˈpeɪpə/</span> = <span class='p-mean'>giấy</span> → âm <b>/eɪ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"ancestor" có "a" đọc là /æ/ (ngắn), khác với ba từ kia có "a" đọc là /eɪ/ (nguyên âm đôi).</span></li>

     <div><span class='p-word'>release</span> <span class='wt'>v</span> = <span class='p-mean'>thả, phát hành</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"admire the view" = chiêm ngưỡng/ngắm nhìn khung cảnh đẹp.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>decorate, practise, release không phù hợp với việc "ngắm cảnh hoàng hôn".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:16,type:"mcq",
 q:"My brother and I can't wait to open our gifts ____ Christmas Day.",
 options:[{t:"at",c:false},{t:"in",c:false},{t:"on",c:true},{t:"for",c:false}],
 exp:`<div class="vnt">💬 Dịch: Anh trai và tôi nóng lòng muốn mở quà vào ngày Giáng sinh.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>at</span> <span class='wt'>prep</span> = <span class='p-mean'>vào (giờ)</span></div>
     <div><span class='p-word'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>vào (tháng/năm)</span></div>
     <div><span class='hl-green'>on</span> <span class='wt'>prep</span> = <span class='p-mean'>vào (ngày cụ thể)</span></div>
     <div><span class='p-word'>for</span> <span class='wt'>prep</span> = <span class='p-mean'>cho, trong</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Với các NGÀY LỄ có chữ "Day" (Christmas Day) dùng "on": on Christmas Day.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>at (giờ), in (tháng/năm), for (khoảng thời gian) không dùng cho "Christmas Day".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:17,type:"mcq",
 q:"Brady: \"I have no idea what gift to bring to Hoa's birthday party.\" — Jade: \"____\"",
 options:[{t:"Perhaps you should give her a dress.",c:true},{t:"Yes, a dress isn't that expensive.",c:false},{t:"Sorry, I can't go with you to buy the dress.",c:false},{t:"Just wear a dress, and she'll be happy.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Brady: "Tớ chẳng biết mang quà gì đến tiệc sinh nhật của Hoa cả." — Jade: "Có lẽ cậu nên tặng bạn ấy một chiếc váy."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>Perhaps you should give her a dress.</span> = <span class='p-mean'>Có lẽ cậu nên tặng bạn ấy một chiếc váy.</span></div>
     <div><span class='p-word'>Yes, a dress isn't that expensive.</span> = <span class='p-mean'>Ừ, một chiếc váy không đắt lắm đâu.</span></div>
     <div><span class='p-word'>Sorry, I can't go with you...</span> = <span class='p-mean'>Xin lỗi, tớ không đi mua cùng cậu được.</span></div>
     <div><span class='p-word'>Just wear a dress...</span> = <span class='p-mean'>Cứ mặc một chiếc váy đi...</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Brady phân vân chọn quà → Jade ĐƯA GỢI Ý: "Perhaps you should give her a dress." (Có lẽ cậu nên tặng…).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác không trả lời trực tiếp việc "nên tặng quà gì" mà lệch chủ đề (giá tiền, đi mua cùng, mặc váy).</span></li></ol>`},

/* IV. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:18,type:"error",
 q:"In <u>most of</u> Buddhist <u>festivals</u>, the ritual often <u>begins</u> with an <u>offering</u> of incense.",
 options:["most of","festivals","begins","offering"],correctIdx:0,
 accept:["most"],key:"most of → most",
 exp:`<div class="vnt">💬 Dịch: Trong hầu hết các lễ hội Phật giáo, nghi lễ thường bắt đầu bằng việc dâng hương.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>most of</span> → sửa thành <span class='hl-green'>most</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"most + danh từ" (không có "the/this…" theo sau) thì KHÔNG dùng "of". "most Buddhist festivals" (hầu hết các lễ hội Phật giáo). Chỉ dùng "most of" khi có "the/these/my…" (most of the festivals).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:19,type:"error",
 q:"Italians <u>celebrate</u> Christmas Eve <u>with</u> <u>a</u> feast called <em>La Vigilia</em> <u>in</u> December 24th.",
 options:["celebrate","with","a","in"],correctIdx:3,
 accept:["on"],key:"in → on",
 exp:`<div class="vnt">💬 Dịch: Người Ý đón đêm Giáng sinh bằng một bữa tiệc gọi là La Vigilia vào ngày 24 tháng 12.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>in</span> → sửa thành <span class='hl-green'>on</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Với NGÀY THÁNG cụ thể (December 24th) phải dùng giới từ "on", không dùng "in": on December 24th.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:20,type:"error",
 q:"My <u>grandpa</u> favourite leisure activity <u>is</u> <u>taking</u> care of <u>his garden</u>.",
 options:["grandpa","is","taking","his garden"],correctIdx:0,
 accept:["grandpa's","grandpas"],key:"grandpa → grandpa's",
 note:"👉 Câu cuối rồi! Em gõ từ đúng để thay thế nhé (VD: grandpa's).",
 exp:`<div class="vnt">💬 Dịch: Hoạt động giải trí yêu thích của ông tôi là chăm sóc khu vườn của ông.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>grandpa</span> → sửa thành <span class='hl-green'>grandpa's</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Cần dạng SỞ HỮU CÁCH để chỉ "hoạt động của ông" → thêm 's: "My grandpa's favourite leisure activity".</span></li></ol>`},

/* V. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:21,type:"fill",
 q:"In many cultures, you shouldn't ______ (point) at people. It's considered impolite.",
 answer:["point"],
 exp:`<div class="vnt">💬 Dịch: Ở nhiều nền văn hóa, bạn không nên chỉ tay vào người khác. Điều đó bị coi là bất lịch sự.</div>
 <ol><li>Đáp án: <span class='hl-green'>point</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau modal "shouldn't" luôn dùng ĐỘNG TỪ NGUYÊN MẪU (không "to") → point.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",
 q:"If it ______ (not rain) this evening, they ______ (hold) the party in the garden. <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["doesn't rain will hold","does not rain will hold"],
 exp:`<div class="vnt">💬 Dịch: Nếu tối nay trời không mưa, họ sẽ tổ chức bữa tiệc ở ngoài vườn.</div>
 <ol><li>Đáp án: <span class='hl-green'>doesn't rain</span> … <span class='hl-green'>will hold</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (doesn't rain), … will + V (will hold)".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:23,type:"fill",
 q:"______ (you / feed) Jane's cat while she was away?",
 answer:["did you feed"],
 exp:`<div class="vnt">💬 Dịch: Bạn có cho mèo của Jane ăn khi cô ấy đi vắng không?</div>
 <ol><li>Đáp án: <span class='hl-green'>Did you feed</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Mệnh đề "while she was away" ở quá khứ → câu hỏi thì Quá khứ đơn: "Did + S + V(nguyên mẫu)?" = Did you feed.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",
 q:"Many festivals in Viet Nam ______ (take) place in the first lunar month.",
 answer:["take"],
 exp:`<div class="vnt">💬 Dịch: Nhiều lễ hội ở Việt Nam diễn ra vào tháng Giêng âm lịch.</div>
 <ol><li>Đáp án: <span class='hl-green'>take</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sự thật lặp lại hằng năm → Hiện tại đơn. Chủ ngữ "Many festivals" (số nhiều) → động từ giữ nguyên "take" (take place = diễn ra).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:25,type:"fill",
 q:"John asked me ______ (tell) him about Vietnamese wedding customs.",
 answer:["to tell"],
 exp:`<div class="vnt">💬 Dịch: John nhờ tôi kể cho cậu ấy nghe về phong tục cưới hỏi của người Việt.</div>
 <ol><li>Đáp án: <span class='hl-green'>to tell</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "ask sb TO V" (nhờ/yêu cầu ai làm gì) → to tell.</span></li></ol>`},

/* VI. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:26,type:"fill",
 q:"In Spain, people ______ eat 12 grapes at midnight on New Year's Eve. <span class='hint-word'>(tradition)</span>",
 answer:["traditionally"],
 exp:`<div class="vnt">💬 Dịch: Ở Tây Ban Nha, theo <b>truyền thống</b>, người ta ăn 12 quả nho vào lúc nửa đêm Giao thừa.</div>
 <ol><li>Từ gốc: <span class='p-word'>tradition</span> <span class='wt'>n</span> = <span class='p-mean'>truyền thống</span> → dạng cần điền: <span class='hl-green'>traditionally</span> <span class='wt'>adv</span> = <span class='p-mean'>theo truyền thống</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: traditionally</span> <span class='p-grammar'>Cần TRẠNG TỪ bổ nghĩa cho cả hành động "eat". tradition → traditional (adj) → traditionally (adv).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"There are many activities in ______ for our school's annual festival. <span class='hint-word'>(prepare)</span>",
 answer:["preparation"],
 exp:`<div class="vnt">💬 Dịch: Có nhiều hoạt động đang được <b>chuẩn bị</b> cho lễ hội thường niên của trường.</div>
 <ol><li>Từ gốc: <span class='p-word'>prepare</span> <span class='wt'>v</span> = <span class='p-mean'>chuẩn bị</span> → dạng cần điền: <span class='hl-green'>preparation</span> <span class='wt'>n</span> = <span class='p-mean'>sự chuẩn bị</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: preparation</span> <span class='p-grammar'>Sau giới từ "in" cần DANH TỪ. Cụm cố định "in preparation for" (để chuẩn bị cho): prepare → preparation.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"Jane knows how to play the piano, but she doesn't play it very ______. <span class='hint-word'>(good)</span>",
 answer:["well"],
 exp:`<div class="vnt">💬 Dịch: Jane biết chơi piano, nhưng cô ấy chơi không được <b>giỏi</b> lắm.</div>
 <ol><li>Từ gốc: <span class='p-word'>good</span> <span class='wt'>adj</span> = <span class='p-mean'>tốt/giỏi</span> → dạng cần điền: <span class='hl-green'>well</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách giỏi</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: well</span> <span class='p-grammar'>Cần TRẠNG TỪ bổ nghĩa cho động từ "play". Trạng từ bất quy tắc của "good" là "well".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"The market of ______ trees is often busier two weeks before Tet. <span class='hint-word'>(ornament)</span>",
 answer:["ornamental"],
 exp:`<div class="vnt">💬 Dịch: Chợ cây <b>cảnh</b> thường nhộn nhịp hơn vào hai tuần trước Tết.</div>
 <ol><li>Từ gốc: <span class='p-word'>ornament</span> <span class='wt'>n</span> = <span class='p-mean'>đồ trang trí</span> → dạng cần điền: <span class='hl-green'>ornamental</span> <span class='wt'>adj</span> = <span class='p-mean'>để trang trí, cây cảnh</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: ornamental</span> <span class='p-grammar'>Cần TÍNH TỪ đứng trước danh từ "trees" → "ornamental trees" (cây cảnh). Thêm hậu tố "-al".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:30,type:"fill",
 q:"Fruits like oranges and bananas are common ______ during <em>Día de los Muertos</em>. <span class='hint-word'>(offer)</span>",
 answer:["offerings"],
 exp:`<div class="vnt">💬 Dịch: Các loại trái cây như cam và chuối là những <b>đồ cúng/lễ vật</b> phổ biến trong dịp Día de los Muertos.</div>
 <ol><li>Từ gốc: <span class='p-word'>offer</span> <span class='wt'>v</span> = <span class='p-mean'>dâng, mời</span> → dạng cần điền: <span class='hl-green'>offerings</span> <span class='wt'>n</span> = <span class='p-mean'>đồ cúng, lễ vật</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: offerings</span> <span class='p-grammar'>Cần DANH TỪ (bổ ngữ cho "are common ___"), số nhiều. offer → offering(s) (lễ vật, đồ cúng).</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:42,type:"fill",
 q:"are looking forward / in / People / the spring festival / to / celebrating / my village. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["people in my village are looking forward to celebrating the spring festival"],
 exp:`<div class="vnt">💬 Dịch: Người dân trong làng tôi đang rất mong chờ được tham gia lễ hội mùa xuân.</div>
 <ol><li>Đáp án: <span class='hl-green'>People in my village are looking forward to celebrating the spring festival.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "look forward TO + V-ing" (mong chờ làm gì) → looking forward to celebrating; "in my village" bổ nghĩa cho chủ ngữ "People".</span></li></ol>`},

{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:43,type:"fill",
 q:"before Tet / the tradition of / The Vietnamese / maintain / ancestors' graves / visiting. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["the vietnamese maintain the tradition of visiting ancestors' graves before tet","the vietnamese maintain the tradition of visiting ancestors graves before tet"],
 exp:`<div class="vnt">💬 Dịch: Người Việt duy trì truyền thống tảo mộ (thăm mộ tổ tiên) trước Tết.</div>
 <ol><li>Đáp án: <span class='hl-green'>The Vietnamese maintain the tradition of visiting ancestors' graves before Tet.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ ngữ (The Vietnamese) + động từ (maintain) + "the tradition OF + V-ing" (truyền thống làm gì): of visiting ancestors' graves.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết lại câu, dùng từ trong ngoặc, không đổi nghĩa",n:44,type:"fill",
 q:"This exercise isn't as easy as the one my teacher gave me last week. <span class='hint-word'>(MORE)</span><br><span class='hint-word'>➜ This</span> ______",
 answer:["this exercise is more difficult than the one my teacher gave me last week"],
 exp:`<div class="vnt">💬 Dịch: Bài tập này khó hơn bài mà cô giáo giao cho tôi tuần trước.</div>
 <ol><li>Đáp án: <span class='hl-green'>This exercise is more difficult than the one my teacher gave me last week.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"A isn't as easy as B" (A không dễ bằng B) = "A is more difficult than B" (A khó hơn B). Dùng "MORE" với tính từ dài "difficult".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết lại câu, dùng từ trong ngoặc, không đổi nghĩa",n:45,type:"fill",
 q:"It was so foggy that they had to cancel all flights this morning. <span class='hint-word'>(BECAUSE)</span><br><span class='hint-word'>➜ They had to</span> ______",
 answer:["cancel all flights this morning because it was so foggy","they had to cancel all flights this morning because it was so foggy"],
 exp:`<div class="vnt">💬 Dịch: Họ đã phải hủy tất cả các chuyến bay sáng nay vì trời quá nhiều sương mù.</div>
 <ol><li>Đáp án: <span class='hl-green'>They had to cancel all flights this morning because it was so foggy.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"So + adj + that + kết quả" = "kết quả + because + nguyên nhân". Đưa kết quả (hủy chuyến bay) lên trước, "because" nối với nguyên nhân (trời sương mù).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết lại câu, dùng từ trong ngoặc, không đổi nghĩa",n:46,type:"fill",
 q:"We are not allowed to take photos at some sacred places like pagodas or temples. <span class='hint-word'>(MUST)</span><br><span class='hint-word'>➜ We</span> ______",
 answer:["we must not take photos at some sacred places like pagodas or temples","we mustn't take photos at some sacred places like pagodas or temples"],
 exp:`<div class="vnt">💬 Dịch: Chúng ta không được phép chụp ảnh ở một số nơi linh thiêng như chùa chiền hay đền miếu.</div>
 <ol><li>Đáp án: <span class='hl-green'>We must not take photos at some sacred places like pagodas or temples.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"be not allowed to V" (không được phép) = "must not V" (không được, cấm). Dùng "MUST" → must not take.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết lại câu, dùng từ trong ngoặc, không đổi nghĩa",n:47,type:"fill",
 q:"I think we should watch the fireworks display from the rooftop. <span class='hint-word'>(IDEA)</span><br><span class='hint-word'>➜ It's</span> ______",
 answer:["it's a good idea to watch the fireworks display from the rooftop","its a good idea to watch the fireworks display from the rooftop"],
 exp:`<div class="vnt">💬 Dịch: Xem màn bắn pháo hoa từ sân thượng là một ý hay đấy.</div>

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#3a1414">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#c0392b">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 40 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🙌';memeKey='good';msg='Cố thêm chút nữa là hoàn hảo luôn nè! 💪';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='😅';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
