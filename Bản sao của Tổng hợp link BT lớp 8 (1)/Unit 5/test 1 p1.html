<script>
(function(){const items=['🏮','🧧','🎏','🐉','🥮','🎆','🪷','🎎','🥟','🍊','🪔','🎐','🀄','🧨','🥠','🎋'];
  const layer=document.getElementById('foodlayer');
  for(let i=0;i<20;i++){const s=document.createElement('span');s.textContent=items[i%items.length];
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(1.6+Math.random()*2.2)+'rem';
    s.style.animationDelay=(Math.random()*6)+'s';s.style.animationDuration=(5+Math.random()*5)+'s';layer.appendChild(s);}})();

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#FF4757','#FDCB6E','#00D26A','#f6b93b','#c0392b','#e74c3c','#00C9A7'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Ms. Chí Nên · NEN giải thích chi tiết";
const TOTAL=40;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"thi<u>n</u>ker",c:true},{t:"la<u>n</u>tern",c:false},{t:"reu<u>n</u>ion",c:false},{t:"bo<u>n</u>ding",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "n" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>thinker</span> <span class='p-phonetic'>/ˈθɪŋkə/</span> = <span class='p-mean'>người suy nghĩ</span> → âm <b>/ŋ/</b></div>
     <div><span class='p-word'>la<u>n</u>tern</span> <span class='p-phonetic'>/ˈlæntən/</span> = <span class='p-mean'>đèn lồng</span> → âm <b>/n/</b></div>
     <div><span class='p-word'>reu<u>n</u>ion</span> <span class='p-phonetic'>/riˈjuːniən/</span> = <span class='p-mean'>sum họp</span> → âm <b>/n/</b></div>
     <div><span class='p-word'>bo<u>n</u>ding</span> <span class='p-phonetic'>/ˈbɒndɪŋ/</span> = <span class='p-mean'>sự gắn kết</span> → âm <b>/n/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"thinker" có "n" đứng trước "k" nên đọc thành /ŋ/ (âm mũi), khác với ba từ kia đọc "n" bình thường /n/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>lantern, reunion, bonding đều có âm /n/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"publ<u>i</u>c",c:false},{t:"rel<u>i</u>gion",c:false},{t:"long<u>e</u>vity",c:true},{t:"sp<u>i</u>rit",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có nguyên âm gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>publ<u>i</u>c</span> <span class='p-phonetic'>/ˈpʌblɪk/</span> = <span class='p-mean'>công cộng</span> → âm <b>/ɪ/</b></div>
     <div><span class='p-word'>rel<u>i</u>gion</span> <span class='p-phonetic'>/rɪˈlɪdʒən/</span> = <span class='p-mean'>tôn giáo</span> → âm <b>/ɪ/</b></div>
     <div><span class='hl-green'>long<u>e</u>vity</span> <span class='p-phonetic'>/lɒnˈdʒevəti/</span> = <span class='p-mean'>sự trường thọ</span> → âm <b>/e/</b></div>
     <div><span class='p-word'>sp<u>i</u>rit</span> <span class='p-phonetic'>/ˈspɪrɪt/</span> = <span class='p-mean'>linh hồn</span> → âm <b>/ɪ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"longevity" có nguyên âm gạch chân đọc là /e/, khác với ba từ kia đọc là /ɪ/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>public, religion, spirit đều mang âm /ɪ/.</span></li></ol>`},

     <div><span class='hl-green'>danced</span> <span class='p-phonetic'>/dɑːnst/</span> = <span class='p-mean'>đã nhảy</span> → đuôi <b>/t/</b></div>
     <div><span class='p-word'>believed</span> <span class='p-phonetic'>/bɪˈliːvd/</span> = <span class='p-mean'>đã tin</span> → đuôi <b>/d/</b></div>

   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>explored, believed, changed kết thúc bằng âm hữu thanh nên -ed đọc /d/.</span></li></ol>`},

 options:[{t:"to take",c:true},{t:"taking",c:false},{t:"to taking",c:false},{t:"took",c:false}],
 exp:`<div class="vnt">💬 Dịch: Hãy nhớ cởi giày khi bạn bước vào một ngôi nhà kiểu Nhật.</div>

   <div class="grid2">

     <div><span class='p-word'>taking</span> <span class='wt'>V-ing</span> = <span class='p-mean'>(nhớ việc đã làm)</span></div>
     <div><span class='p-word'>to taking</span> <span class='wt'>-</span> = <span class='p-mean'>(sai)</span></div>

   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"more … than" là so sánh hơn (cần vế so sánh); "most exciting than" và "the more exciting" đều sai cấu trúc.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:14,type:"mcq",

     <div><span class='p-word'>Ø – Ø</span> = <span class='p-mean'>(thiếu mạo từ ô 1)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"a new Indian restaurant" (nhắc lần đầu, đếm được số ít → "a"); trước "our neighbourhood" KHÔNG dùng mạo từ (đã có tính từ sở hữu "our") → ô 2 để trống (Ø).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Không đặt mạo từ trước "our"; và danh từ đếm được số ít "restaurant" cần "a".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:16,type:"mcq",
 q:"Our family has a tradition ____ gathering for dinner on New Year's Eve.",
 options:[{t:"of",c:true},{t:"for",c:false},{t:"in",c:false},{t:"with",c:false}],
 exp:`<div class="vnt">💬 Dịch: Gia đình tôi có truyền thống quây quần ăn tối vào đêm Giao thừa.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>of</span> <span class='wt'>prep</span> = <span class='p-mean'>(tradition of + V-ing)</span></div>
     <div><span class='p-word'>for</span> <span class='wt'>prep</span> = <span class='p-mean'>cho</span></div>
     <div><span class='p-word'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>trong</span></div>
     <div><span class='p-word'>with</span> <span class='wt'>prep</span> = <span class='p-mean'>với</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "a tradition OF + V-ing" (truyền thống làm gì): tradition of gathering.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>tradition không đi với for/in/with theo nghĩa này.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:17,type:"mcq",
 q:"Ben: \"In my opinion, reading books is much more interesting than watching movies.\" — Allison: \"____\" I'd prefer movies.",
 options:[{t:"Wow, what a good idea!",c:false},{t:"I totally agree with you.",c:false},{t:"Well, I don't think so.",c:true},{t:"But I'd like to.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Ben: "Theo tớ, đọc sách thú vị hơn nhiều so với xem phim." — Allison: "Ừm, tớ không nghĩ vậy." Tớ thích xem phim hơn.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>Wow, what a good idea!</span> = <span class='p-mean'>Ồ, ý hay đấy!</span></div>
     <div><span class='p-word'>I totally agree with you.</span> = <span class='p-mean'>Tớ hoàn toàn đồng ý.</span></div>
     <div><span class='hl-green'>Well, I don't think so.</span> = <span class='p-mean'>Ừm, tớ không nghĩ vậy.</span></div>
     <div><span class='p-word'>But I'd like to.</span> = <span class='p-mean'>Nhưng tớ muốn thế.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu sau "I'd prefer movies" (tớ thích phim hơn) cho thấy Allison KHÔNG đồng tình → "Well, I don't think so." (thể hiện sự bất đồng lịch sự).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Hai câu đầu là đồng tình (mâu thuẫn với "I'd prefer movies"); "But I'd like to" không hợp ngữ cảnh.</span></li></ol>`},

/* IV. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:18,type:"error",
 q:"<u>Handshakes</u>, bows, <u>or</u> hugs are <u>different from</u> ways people greet <u>each other</u>.",
 options:["Handshakes","or","different from","each other"],correctIdx:2,
 accept:["different"],key:"different from → different",
 exp:`<div class="vnt">💬 Dịch: Bắt tay, cúi chào hay ôm là những cách khác nhau mà mọi người chào hỏi nhau.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>different from</span> → sửa thành <span class='hl-green'>different</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Ở đây "different" bổ nghĩa cho "ways" (những cách khác nhau) → chỉ dùng tính từ "different ways". Thêm "from" là sai vì không có vế so sánh.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:19,type:"error",
 q:"Throughout the <u>coastal</u> regions of <u>the</u> Viet Nam, it is <u>customary</u> to worship <u>whales</u>.",
 options:["coastal","the","customary","whales"],correctIdx:1,
 accept:["viet nam","bỏ the","bo the","bỏ","bo","x","ø","remove the","remove","không có"],key:"the Viet Nam → Viet Nam (bỏ 'the')",
 note:"👉 Từ 'the' này cần BỎ ĐI — em gõ 'Viet Nam' (phần sửa đúng) hoặc 'bỏ the' nhé.",
 exp:`<div class="vnt">💬 Dịch: Ở khắp các vùng ven biển của Việt Nam, tục thờ cá voi là điều phổ biến.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>the Viet Nam</span> → sửa thành <span class='hl-green'>Viet Nam</span> (bỏ "the")</li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Trước TÊN QUỐC GIA (Viet Nam) thường KHÔNG dùng mạo từ "the". Vì vậy phải bỏ "the".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:20,type:"error",
 q:"Lucas would <u>like learning</u> more <u>about</u> <u>Korean</u> customs and <u>traditions</u>.",
 options:["like learning","about","Korean","traditions"],correctIdx:0,
 accept:["like to learn","would like to learn","to learn"],key:"like learning → like to learn",
 note:"👉 Câu cuối rồi! Em gõ cụm đúng để thay thế nhé (VD: like to learn).",
 exp:`<div class="vnt">💬 Dịch: Lucas muốn tìm hiểu thêm về phong tục và truyền thống của Hàn Quốc.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>would like learning</span> → sửa thành <span class='hl-green'>would like to learn</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Cấu trúc "would like TO V" (muốn làm gì) luôn đi với "to + động từ nguyên mẫu", không dùng V-ing. Vì vậy "like learning" → "like to learn".</span></li></ol>`},

/* V. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:21,type:"fill",
 q:"A rainbow ______ (appear) when sunlight passes through raindrops in the air.",
 answer:["appears"],
 exp:`<div class="vnt">💬 Dịch: Cầu vồng xuất hiện khi ánh nắng đi xuyên qua các giọt mưa trong không khí.</div>
 <ol><li>Đáp án: <span class='hl-green'>appears</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đây là một CHÂN LÝ/hiện tượng luôn đúng → thì Hiện tại đơn. Chủ ngữ "A rainbow" (số ít) → appear + "-s" = appears.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",
 q:"When visiting pagodas, we should avoid ______ (wear) shorts or skirts.",
 answer:["wearing"],
 exp:`<div class="vnt">💬 Dịch: Khi đi lễ chùa, chúng ta nên tránh mặc quần đùi hoặc váy.</div>
 <ol><li>Đáp án: <span class='hl-green'>wearing</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "avoid + V-ing" (tránh làm gì) → wearing.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:23,type:"fill",
 q:"I think my little sister ______ (be) a singer because she loves singing!",
 answer:["will be"],
 exp:`<div class="vnt">💬 Dịch: Tôi nghĩ em gái nhỏ của tôi sẽ trở thành ca sĩ vì em ấy rất thích hát!</div>
 <ol><li>Đáp án: <span class='hl-green'>will be</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"I think + S + will + V" là DỰ ĐOÁN về tương lai → thì Tương lai đơn: will be.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",
 q:"Look! Freddy ______ (carry) two heavy baskets. Let's help him.",
 answer:["is carrying"],
 exp:`<div class="vnt">💬 Dịch: Nhìn kìa! Freddy đang khiêng hai cái giỏ nặng. Chúng ta giúp cậu ấy nào.</div>
 <ol><li>Đáp án: <span class='hl-green'>is carrying</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "Look!" (một việc đang diễn ra ngay lúc nói) → Hiện tại tiếp diễn: "is + V-ing" = is carrying.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:25,type:"fill",
 q:"\"Where is Mrs Potter?\" — \"She ______ (leave) the office an hour ago.\"",
 answer:["left"],
 exp:`<div class="vnt">💬 Dịch: "Bà Potter đâu rồi?" — "Bà ấy đã rời văn phòng cách đây một tiếng."</div>
 <ol><li>Đáp án: <span class='hl-green'>left</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "an hour ago" → thì Quá khứ đơn. "leave" là động từ bất quy tắc: leave → left.</span></li></ol>`},

/* VI. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:26,type:"fill",
 q:"On his first day in France, Minh was ______ welcomed by the host family. <span class='hint-word'>(joy)</span>",
 answer:["joyfully"],
 exp:`<div class="vnt">💬 Dịch: Trong ngày đầu tiên ở Pháp, Minh được gia đình chủ nhà chào đón một cách <b>vui vẻ</b>.</div>
 <ol><li>Từ gốc: <span class='p-word'>joy</span> <span class='wt'>n</span> = <span class='p-mean'>niềm vui</span> → dạng cần điền: <span class='hl-green'>joyfully</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách vui vẻ</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: joyfully</span> <span class='p-grammar'>Cần TRẠNG TỪ bổ nghĩa cho động từ "welcomed". joy → joyful (adj) → joyfully (adv).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"People ______ the lion dance during festivals, especially the Lunar New Year. <span class='hint-word'>(performance)</span>",
 answer:["perform"],
 exp:`<div class="vnt">💬 Dịch: Người ta <b>biểu diễn</b> múa lân trong các lễ hội, đặc biệt là dịp Tết Nguyên đán.</div>
 <ol><li>Từ gốc: <span class='p-word'>performance</span> <span class='wt'>n</span> = <span class='p-mean'>buổi biểu diễn</span> → dạng cần điền: <span class='hl-green'>perform</span> <span class='wt'>v</span> = <span class='p-mean'>biểu diễn</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: perform</span> <span class='p-grammar'>Vị trí này cần ĐỘNG TỪ (chủ ngữ "People" số nhiều, hiện tại đơn) → dùng động từ gốc "perform".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"<em>Chuseok</em> is a holiday to worship the ancestors and ______ with family. <span class='hint-word'>(reunion)</span>",
 answer:["reunite"],
 exp:`<div class="vnt">💬 Dịch: Chuseok là ngày lễ để thờ cúng tổ tiên và <b>đoàn tụ</b> với gia đình.</div>
 <ol><li>Từ gốc: <span class='p-word'>reunion</span> <span class='wt'>n</span> = <span class='p-mean'>sự đoàn tụ</span> → dạng cần điền: <span class='hl-green'>reunite</span> <span class='wt'>v</span> = <span class='p-mean'>đoàn tụ</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: reunite</span> <span class='p-grammar'>Sau "to worship … and (to) ___" cần ĐỘNG TỪ nguyên mẫu song song với "worship" → reunite.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"He spent years learning ______ before joining a famous circus. <span class='hint-word'>(acrobat)</span>",
 answer:["acrobatics"],
 exp:`<div class="vnt">💬 Dịch: Anh ấy đã dành nhiều năm học <b>nghệ thuật nhào lộn</b> trước khi gia nhập một gánh xiếc nổi tiếng.</div>
 <ol><li>Từ gốc: <span class='p-word'>acrobat</span> <span class='wt'>n</span> = <span class='p-mean'>diễn viên nhào lộn</span> → dạng cần điền: <span class='hl-green'>acrobatics</span> <span class='wt'>n</span> = <span class='p-mean'>nghệ thuật nhào lộn</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: acrobatics</span> <span class='p-grammar'>Sau "learning" cần DANH TỪ chỉ BỘ MÔN. "acrobatics" (nhào lộn) là môn nghệ thuật anh ấy học.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:30,type:"fill",
 q:"Many families buy ______ items to put on their Christmas trees. <span class='hint-word'>(decorate)</span>",
 answer:["decorative"],
 exp:`<div class="vnt">💬 Dịch: Nhiều gia đình mua các món đồ <b>trang trí</b> để treo lên cây thông Noel.</div>
 <ol><li>Từ gốc: <span class='p-word'>decorate</span> <span class='wt'>v</span> = <span class='p-mean'>trang trí</span> → dạng cần điền: <span class='hl-green'>decorative</span> <span class='wt'>adj</span> = <span class='p-mean'>dùng để trang trí</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: decorative</span> <span class='p-grammar'>Cần TÍNH TỪ đứng trước danh từ "items" → "decorative items" (đồ trang trí). Thêm hậu tố "-ive".</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:43,type:"fill",
 q:"a place for / or worship / The communal house / is / villagers / to meet. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["the communal house is a place for villagers to meet or worship"],
 exp:`<div class="vnt">💬 Dịch: Nhà rông/nhà cộng đồng là nơi để dân làng gặp gỡ hoặc thờ cúng.</div>
 <ol><li>Đáp án: <span class='hl-green'>The communal house is a place for villagers to meet or worship.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ ngữ (The communal house) + is + "a place FOR sb TO V" (nơi để ai làm gì): for villagers to meet or worship.</span></li></ol>`},

{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:44,type:"fill",
 q:"eating fish / In / wealth / places in Asia, / is believed / to / bring / many. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["in many places in asia eating fish is believed to bring wealth"],
 exp:`<div class="vnt">💬 Dịch: Ở nhiều nơi tại châu Á, người ta tin rằng ăn cá sẽ mang lại của cải.</div>
 <ol><li>Đáp án: <span class='hl-green'>In many places in Asia, eating fish is believed to bring wealth.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trạng ngữ nơi chốn "In many places in Asia," + chủ ngữ (danh động từ) "eating fish" + "is believed TO bring wealth" (được tin là mang lại của cải).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:45,type:"fill",
 q:"Gợi ý: Sophie / not win / the competition / if / she / not / practise / more. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["sophie won't win the competition if she doesn't practise more","sophie will not win the competition if she does not practise more","sophie won't win the competition if she doesn't practice more"],
 exp:`<div class="vnt">💬 Dịch: Sophie sẽ không thắng cuộc thi nếu cô ấy không luyện tập nhiều hơn.</div>
 <ol><li>Đáp án: <span class='hl-green'>Sophie won't win the competition if she doesn't practise more.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: mệnh đề chính "will + V" (won't win), mệnh đề "if + hiện tại đơn" (doesn't practise).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:46,type:"fill",
 q:"Gợi ý: Vietnamese families / used / sit / on / mats / with / food / in / middle. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["vietnamese families used to sit on mats with food in the middle"],
 exp:`<div class="vnt">💬 Dịch: Các gia đình Việt Nam ngày xưa thường ngồi trên chiếu với thức ăn đặt ở giữa.</div>
 <ol><li>Đáp án: <span class='hl-green'>Vietnamese families used to sit on mats with food in the middle.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"used TO V" (đã từng làm gì trong quá khứ): used to sit; "on mats" (trên chiếu), "in the middle" (ở giữa).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:47,type:"fill",
 q:"Gợi ý: The lion dance / be / the / highlight / opening ceremony / many / festival. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["the lion dance is the highlight of the opening ceremony of many festivals"],
 exp:`<div class="vnt">💬 Dịch: Múa lân là điểm nhấn của lễ khai mạc trong nhiều lễ hội.</div>
 <ol><li>Đáp án: <span class='hl-green'>The lion dance is the highlight of the opening ceremony of many festivals.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"the highlight OF the opening ceremony OF many festivals" (điểm nhấn của… của…); danh từ số nhiều "festivals".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:48,type:"fill",
 q:"Gợi ý: She / broke / family tradition / by / not become / doctor. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["she broke with her family tradition by not becoming a doctor","she broke with family tradition by not becoming a doctor","she broke her family tradition by not becoming a doctor"],
 exp:`<div class="vnt">💬 Dịch: Cô ấy đã phá vỡ truyền thống gia đình khi không trở thành bác sĩ.</div>
 <ol><li>Đáp án: <span class='hl-green'>She broke with (her) family tradition by not becoming a doctor.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"break with tradition" (phá vỡ/từ bỏ truyền thống); "by + V-ing" chỉ cách thức; phủ định của gerund: "by NOT becoming a doctor".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:49,type:"mcq",
 q:"Câu gốc: <em>You are advised not to wear white or black clothes during Lunar New Year.</em>",
 options:[{t:"You should not wear white or black clothes during Lunar New Year.",c:true},
          {t:"You must not wear white or black clothes during Lunar New Year.",c:false},
          {t:"You don't need to wear white or black clothes during Lunar New Year.",c:false},
          {t:"You are allowed to wear white or black clothes during Lunar New Year.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Bạn không nên mặc đồ trắng hoặc đen trong dịp Tết Nguyên đán.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>You should not wear white or black clothes during Lunar New Year.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"be advised not to V" (được khuyên không nên) = "should not V" (không nên). Đây là lời khuyên, không phải cấm.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"must not" là cấm (quá mạnh); "don't need to" là không cần; "are allowed to" là được phép — đều sai sắc thái so với lời khuyên.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:50,type:"mcq",
 q:"Câu gốc: <em>Mark expresses an interest in Vietnamese customs and traditions.</em>",
 options:[{t:"Mark is interesting in Vietnamese customs and traditions.",c:false},
          {t:"Mark is keen for Vietnamese customs and traditions.",c:false},
          {t:"Mark is interested in Vietnamese customs and traditions.",c:true},
          {t:"Mark keens on Vietnamese customs and traditions.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Mark tỏ ra thích thú với phong tục và truyền thống Việt Nam.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Mark is interested in Vietnamese customs and traditions.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"express an interest in st" (tỏ ra quan tâm/thích) = "be interested IN st". Người thì dùng "interested" (bị động), không dùng "interesting".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"interesting in" sai (interesting mô tả vật/sự việc); "keen for", "keens on" sai cấu trúc (đúng phải là "be keen ON").</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:51,type:"mcq",
 q:"Câu gốc: <em>His first novel was better than his second one.</em>",
 options:[{t:"His second novel was as good as his first one.",c:false},
          {t:"His second novel was not as good as his first one.",c:true},
          {t:"His first novel was not as good as his second one.",c:false},
          {t:"His second novel was better than his first one.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Cuốn tiểu thuyết thứ hai của ông không hay bằng cuốn đầu tiên.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>His second novel was not as good as his first one.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"A better than B" (A hơn B) = "B not as good as A" (B không bằng A). Cuốn 1 hay hơn cuốn 2 → cuốn 2 không hay bằng cuốn 1.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"as good as" (bằng nhau) sai; các câu còn lại đảo ngược sai ý so với câu gốc.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:52,type:"mcq",
 q:"Câu gốc: <em>Emma went to the store to buy some fresh vegetables.</em>",
 options:[{t:"Emma went to the store and bought some fresh vegetables.",c:false},
          {t:"Emma went to the store because she wanted to buy some fresh vegetables.",c:true},
          {t:"Emma bought some fresh vegetables before going to the store.",c:false},

 <ol><li>Đáp án đúng: <span class='hl-green'>Emma went to the store because she wanted to buy some fresh vegetables.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"to V" (để làm gì) chỉ MỤC ĐÍCH = "because she wanted to V" (vì cô ấy muốn làm gì). Cả hai đều diễn tả lý do/mục đích đến cửa hàng.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Câu A biến thành "và đã mua" (không chắc đã mua); câu C, D thay đổi trình tự/nghĩa so với câu gốc.</span></li></ol>`}

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#3a1414">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#c0392b">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 40 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🙌';memeKey='good';msg='Cố thêm chút nữa là hoàn hảo luôn nè! 💪';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='😅';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
