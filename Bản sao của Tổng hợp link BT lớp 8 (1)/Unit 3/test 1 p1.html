<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 3 · Teenagers — TEST 1</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e84393; --yellow:#FDCB6E; --teal:#00C9A7; --sky:#5AA9E6;
  --green:#00D26A; --red:#FF4757; --blue:#2472e8; --purple:#7c3aed;
  --terra:#c0562b; --grammar:#e11d48; --accent:#e84393;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif; color:#2b2350; min-height:100vh;
  background:linear-gradient(-45deg,#e84393,#a55eea,#5AA9E6,#00C9A7,#FDCB6E);
  background-size:400% 400%; animation:bgmove 18s ease infinite; overflow-x:hidden;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaties span{position:absolute;font-size:2.2rem;opacity:.5;animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 80px}
.head{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:rgba(255,255,255,.35);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.5);color:#fff;font-weight:800;font-size:.8rem;
  padding:5px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.title{margin-top:10px;font-size:1.7rem;font-weight:900;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.25)}
.sub{color:#fff;font-weight:700;opacity:.95;margin-top:2px}
.progbar{height:12px;background:rgba(255,255,255,.35);border-radius:20px;margin:14px 0;overflow:hidden;border:1px solid rgba(255,255,255,.5)}
.progfill{height:100%;width:0;background:linear-gradient(90deg,#00D26A,#FDCB6E);transition:width .4s;border-radius:20px}
.sec{margin:26px 0 12px;background:rgba(255,255,255,.28);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:10px 16px;color:#fff;
  font-weight:900;font-size:1.05rem;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card{background:rgba(255,255,255,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);
  border-radius:20px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 8px 22px rgba(120,40,90,.18)}
.qnum{display:inline-block;background:var(--accent);color:#fff;font-weight:900;border-radius:12px;
  padding:2px 10px;font-size:.85rem;margin-right:8px}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.5;display:inline}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px}
.hint{font-size:.85rem;color:#6b5aa0;font-weight:700;margin-top:8px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:linear-gradient(135deg,#fff,#ffe6f3);border:none;border-radius:16px;padding:14px 12px;
  font-family:'Quicksand',sans-serif;font-size:1.08rem;font-weight:700;color:#8a1f5a;cursor:pointer;
  box-shadow:0 6px 0 #f0b6d6,0 8px 14px rgba(0,0,0,.12);transition:transform .12s;text-align:center}
.opt:hover:not(:disabled){transform:scale(1.05)}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.correct{background:linear-gradient(135deg,#00D26A,#57e39a);color:#fff;box-shadow:0 6px 0 #0a9c52}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff7d88);color:#fff;box-shadow:0 6px 0 #c1283a}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.tin{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tin input{flex:1;min-width:180px;font-family:'Quicksand',sans-serif;font-size:1.05rem;font-weight:600;
  padding:12px 14px;border-radius:14px;border:2px solid #eab0d1;background:rgba(255,255,255,.8);color:#2b2350}
.tin input:focus{outline:none;border-color:var(--accent)}
.tin input.ok{border-color:var(--green);background:#e7fff1}
.tin input.no{border-color:var(--red);background:#ffecee}
.btnc{background:linear-gradient(135deg,var(--purple),#a06fd6);color:#fff;border:none;border-radius:14px;
  padding:12px 20px;font-family:'Quicksand',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;
  box-shadow:0 5px 0 #5e3494;transition:transform .12s}
.btnc:hover:not(:disabled){transform:scale(1.05)} .btnc:disabled{opacity:.6;cursor:default}
.letters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lbtn{width:48px;height:48px;border-radius:14px;border:none;font-weight:900;font-size:1.1rem;cursor:pointer;
  font-family:'Quicksand';background:linear-gradient(135deg,#fff,#fff0d6);color:#7c3aed;
  box-shadow:0 5px 0 #e6c98a;transition:transform .12s}
.lbtn:hover:not(:disabled){transform:scale(1.08)}
.lbtn.sel{background:linear-gradient(135deg,var(--yellow),#ffd98a);color:#7a4a00}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#57e39a);color:#fff;box-shadow:0 5px 0 #0a9c52}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff7d88);color:#fff;box-shadow:0 5px 0 #c1283a}
.lbtn:disabled{cursor:default}
.mark{background:rgba(124,58,237,.12);border-radius:6px;padding:0 3px;font-weight:800}
.mark sup{color:var(--purple);font-weight:900;font-size:.7rem}
.exp{margin-top:14px;max-height:0;overflow:hidden;transition:max-height .5s ease;font-size:1rem}
.exp.open{max-height:1500px}
.expin{background:rgba(255,255,255,.72);border-radius:14px;padding:14px;border:1px dashed #dca0c4}
.exp ol{margin:6px 0 0 20px} .exp li{margin:8px 0;line-height:1.55}
.vnt{background:#fff2e0;border-left:5px solid #ff9f43;border-radius:10px;padding:8px 12px;font-weight:800;color:#8a4b12;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0}
.grid2>div{line-height:1.5}
.p-word{color:var(--blue);font-weight:800}
.hl-green{color:#0a9c52;font-weight:900}
.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(124,58,237,.12);color:#6b3fb0;border-radius:6px;padding:1px 6px;font-size:.8rem;font-weight:800}
.p-phonetic{color:var(--purple);background:#f0e9ff;border-radius:6px;padding:1px 6px;font-weight:700}
.p-mean{color:var(--terra);font-weight:700}
.p-grammar{border-bottom:2px solid var(--grammar);color:#7a1030;font-weight:700}
.keyline{background:#e7fff1;border-radius:10px;padding:8px 12px;font-weight:800;color:#0a7c44;margin-bottom:8px}
.submit{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,#e84393,#a55eea);color:#fff;
  border:none;border-radius:20px;padding:18px;font-family:'Quicksand';font-weight:900;font-size:1.25rem;cursor:pointer;
  box-shadow:0 8px 0 #b02870,0 12px 22px rgba(0,0,0,.2)}
.submit:hover{transform:scale(1.02)}
.overlay{position:fixed;inset:0;background:rgba(40,20,70,.55);backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:rgba(255,255,255,.92);border-radius:24px;padding:26px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;color:var(--accent);margin-bottom:12px}
.modal input{width:100%;padding:14px;border-radius:14px;border:2px solid #eab0d1;font-size:1.05rem;font-family:'Quicksand';font-weight:600;margin-bottom:6px}
.modal input.err{border-color:var(--red);background:#ffecee}
.errmsg{color:var(--red);font-weight:800;font-size:.9rem;min-height:20px;margin-bottom:8px}
.modal button{background:linear-gradient(135deg,var(--accent),#f06fb0);color:#fff;border:none;border-radius:14px;
  padding:13px 26px;font-family:'Quicksand';font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 #b02870}
.rgreet{font-size:1.35rem;font-weight:900;color:var(--accent);line-height:1.4}
.rscore{font-size:2.4rem;font-weight:900;color:#2b2350;margin:8px 0}
.rten{font-size:1.5rem;font-weight:900;color:var(--purple);margin-bottom:12px}
.rmeme{width:100%;max-width:280px;border-radius:16px;margin:0 auto 14px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2);min-height:120px;object-fit:cover}
.memefall{font-size:5rem}
@media(max-width:560px){.opts,.grid2{grid-template-columns:1fr}.title{font-size:1.35rem}}
</style>
</head>
<body>
<div class="floaties" id="floaties"></div>
<div class="wrap">
  <div class="head">
    <div class="badge">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên</div>
    <div class="title">📱 Unit 3 · Teenagers</div>
    <div class="sub">TEST 1 — Phần A (I–VI) &amp; C (I–III)</div>
    <div class="progbar"><div class="progfill" id="prog"></div></div>
  </div>
  <div id="quiz"></div>
  <button class="submit" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="overlay" id="nameOv">
  <div class="modal">
    <h2>✍️ Nhập tên của em nhé!</h2>
    <input id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
    <div class="errmsg" id="nameErr"></div>
    <button onclick="showResult()">Xem kết quả 🚀</button>
  </div>
</div>
<div class="overlay" id="resOv">
  <div class="modal">
    <div class="rgreet" id="rGreet"></div>
    <div class="rscore" id="rScore"></div>
    <div class="rten" id="rTen"></div>
    <img class="rmeme" id="rMeme" alt="result">
    <div class="memefall" id="rFall" style="display:none"></div>
    <button onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
(function(){
  const ico=['📱','💬','🎧','🎮','📸','🎵','🎨','📚','⭐','🎸','💡','🏀'];
  const f=document.getElementById('floaties');
  for(let i=0;i<16;i++){const s=document.createElement('span');
    s.textContent=ico[i%ico.length];s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(14+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(1.6+Math.random()*1.8)+'rem';f.appendChild(s);}
})();
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=i?1318:988;o.connect(g);g.connect(c.destination);
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);
  g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.4);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function confetti(){const cols=['#e84393','#FDCB6E','#00C9A7','#FF4757','#00D26A','#a55eea'];
  for(let i=0;i<70;i++){const d=document.createElement('div');
    d.style.cssText='position:fixed;z-index:99;width:10px;height:14px;top:-20px;pointer-events:none;border-radius:2px;';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1500+Math.random()*1500,x=(Math.random()-.5)*300;
    d.animate([{transform:d.style.transform,opacity:1},
      {transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:0}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[.,?!;:'"’\-]/g,' ').replace(/\s+/g,' ').trim();}
function matchWriting(input,answers){const ni=norm(input);if(!ni)return false;
  for(const a of answers){const na=norm(a);if(ni===na)return true;
    if(na.includes(ni)&&ni.length>=na.length*0.5)return true;if(ni.includes(na))return true;}return false;}
let TOTAL=0,correctCount=0,answered=0;
function updateProg(){document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';}

/* ============================================================
   DATA — Unit 3 · TEST 1 · A(I–VI) + C(I–III)
   ============================================================ */
const Q=[];
function sec(t){Q.push({sec:t});}
function mcq(num,q,opts,correctIdx,exp){Q.push({type:'mcq',num,q,opts,correctIdx,exp});}
function txt(num,q,ans,exp,hint){Q.push({type:'txt',num,q,ans,exp,hint});}
function cor(num,q,parts,cIdx,corr,exp){Q.push({type:'cor',num,q,parts,cIdx,corr,exp});}

/* ---------- A. I. Pronunciation ---------- */
sec("A. LANGUAGE FOCUS · I. Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại");
mcq(1,"Chọn từ có phần gạch chân được phát âm khác:",
 ["p<u>oi</u>nt","v<u>oi</u>ce","n<u>oi</u>se","ch<u>oi</u>r"],3,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "oi" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>point</span> <span class='p-phonetic'>/pɔɪnt/</span> = <span class='p-mean'>điểm</span> → /ɔɪ/</div>
 <div><span class='p-word'>voice</span> <span class='p-phonetic'>/vɔɪs/</span> = <span class='p-mean'>giọng nói</span> → /ɔɪ/</div>
 <div><span class='p-word'>noise</span> <span class='p-phonetic'>/nɔɪz/</span> = <span class='p-mean'>tiếng ồn</span> → /ɔɪ/</div>
 <div><span class='hl-green'>choir</span> <span class='p-phonetic'>/ˈkwaɪə/</span> = <span class='p-mean'>dàn hợp xướng</span> → /waɪ/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"choir" là từ đặc biệt: "oi" đọc thành /waɪ/. Ba từ kia "oi" đọc /ɔɪ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>point, voice, noise đều có "oi" đọc /ɔɪ/ nên giống nhau.</span></li></ol>`);
mcq(2,"Chọn từ có phần gạch chân được phát âm khác:",
 ["meas<u>u</u>re","nat<u>u</u>re","p<u>u</u>rely","press<u>u</u>re"],2,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "u" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>measure</span> <span class='p-phonetic'>/ˈmeʒə/</span> = <span class='p-mean'>đo lường</span> → /ə/</div>
 <div><span class='p-word'>nature</span> <span class='p-phonetic'>/ˈneɪtʃə/</span> = <span class='p-mean'>thiên nhiên</span> → /ə/</div>
 <div><span class='hl-green'>purely</span> <span class='p-phonetic'>/ˈpjʊəli/</span> = <span class='p-mean'>hoàn toàn</span> → /ʊə/</div>
 <div><span class='p-word'>pressure</span> <span class='p-phonetic'>/ˈpreʃə/</span> = <span class='p-mean'>áp lực</span> → /ə/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"purely" có "u" đọc thành nguyên âm đầy đủ /ʊə/. Ba từ kia "u" đọc yếu /ə/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>measure, nature, pressure đuôi "-ure" đọc /ə/ nên giống nhau.</span></li></ol>`);
mcq(3,"Chọn từ có phần gạch chân (đuôi -ed) được phát âm khác:",
 ["comment<u>ed</u>","upload<u>ed</u>","stress<u>ed</u>","concentrat<u>ed</u>"],2,
 `<div class="vnt">💬 Dịch: Tìm đuôi -ed đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>commented</span> <span class='p-phonetic'>/ɪd/</span> = <span class='p-mean'>đã bình luận</span></div>
 <div><span class='p-word'>uploaded</span> <span class='p-phonetic'>/ɪd/</span> = <span class='p-mean'>đã tải lên</span></div>
 <div><span class='hl-green'>stressed</span> <span class='p-phonetic'>/t/</span> = <span class='p-mean'>căng thẳng</span></div>
 <div><span class='p-word'>concentrated</span> <span class='p-phonetic'>/ɪd/</span> = <span class='p-mean'>đã tập trung</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"stress" kết thúc bằng /s/ nên -ed đọc là /t/. Ba từ kia gốc kết thúc bằng /t/ hoặc /d/ nên -ed đọc /ɪd/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>comment, upload, concentrate kết thúc bằng /t/,/d/ → -ed đọc /ɪd/, giống nhau.</span></li></ol>`);

/* ---------- A. II. Stress ---------- */
sec("A. LANGUAGE FOCUS · II. Chọn từ có TRỌNG ÂM khác các từ còn lại");
mcq(4,"Chọn từ có trọng âm khác:",
 ["forum","service","support","session"],2,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>FO-rum</span> <span class='wt'>n</span> = <span class='p-mean'>diễn đàn</span> → âm 1</div>
 <div><span class='p-word'>SER-vice</span> <span class='wt'>n</span> = <span class='p-mean'>dịch vụ</span> → âm 1</div>
 <div><span class='hl-green'>sup-PORT</span> <span class='wt'>v/n</span> = <span class='p-mean'>hỗ trợ</span> → âm 2</div>
 <div><span class='p-word'>SES-sion</span> <span class='wt'>n</span> = <span class='p-mean'>buổi/phiên</span> → âm 1</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"support" nhấn âm tiết THỨ HAI. Ba từ kia nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>forum, service, session đều nhấn âm tiết 1.</span></li></ol>`);
mcq(5,"Chọn từ có trọng âm khác:",
 ["expectation","participate","enjoyable","maturity"],0,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>ex-pec-TA-tion</span> <span class='wt'>n</span> = <span class='p-mean'>sự kỳ vọng</span> → âm 3</div>
 <div><span class='p-word'>par-TIC-i-pate</span> <span class='wt'>v</span> = <span class='p-mean'>tham gia</span> → âm 2</div>
 <div><span class='p-word'>en-JOY-a-ble</span> <span class='wt'>adj</span> = <span class='p-mean'>thú vị</span> → âm 2</div>
 <div><span class='p-word'>ma-TU-ri-ty</span> <span class='wt'>n</span> = <span class='p-mean'>sự trưởng thành</span> → âm 2</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"expectation" nhấn âm tiết THỨ BA. Ba từ kia nhấn âm tiết THỨ HAI.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>participate, enjoyable, maturity cùng nhấn âm tiết 2.</span></li></ol>`);

/* ---------- A. IV. Error correction ---------- */
sec("A. LANGUAGE FOCUS · IV. Tìm lỗi sai — Bấm chọn chữ cái (A–D) của phần SAI, rồi GÕ chữ đúng để sửa");
cor(18,"Michael {doesn't} concentrate {in} class, so he doesn't {understand} lessons {as good as} his classmates.",
 ["doesn't","in","understand","as good as"],3,["as well as","well"],
 `<div class="vnt">💬 Dịch: Michael không tập trung trong lớp, nên cậu ấy không hiểu bài GIỎI BẰNG các bạn cùng lớp.</div>
 <div class="keyline">🔑 SỬA: as good as → <span class="hl-green">as well as</span> (understand lessons as well as...)</div>
 <ol>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"good" là TÍNH TỪ, nhưng ở đây bổ nghĩa cho động từ "understand" nên phải dùng TRẠNG TỪ.</span></li>
 <li><span class="hl-green">✅ SỬA ĐÚNG:</span> <span class='p-grammar'>Trạng từ của "good" là "well" → "as well as" (giỏi/tốt bằng).</span></li></ol>
 <div class="hint">(Gõ "as well as" hoặc "well" đều được.)</div>`);
cor(19,"I can {hardly} ask for help {because} everyone {are} busy {with} the project.",
 ["hardly","because","are","with"],2,["is"],
 `<div class="vnt">💬 Dịch: Tôi hầu như không thể nhờ giúp đỡ vì ai cũng bận rộn với dự án.</div>
 <div class="keyline">🔑 SỬA: are → <span class="hl-green">is</span> (everyone is busy)</div>
 <ol>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"everyone" là đại từ SỐ ÍT, không dùng "are".</span></li>
 <li><span class="hl-green">✅ SỬA ĐÚNG:</span> <span class='p-grammar'>everyone/everybody + động từ số ít → "everyone is busy".</span></li></ol>`);
cor(20,"Jimmy wants to be {in} good {shape}; {otherwise}, he {goes} running every day after work.",
 ["in","shape","otherwise","goes"],2,["therefore","so"],
 `<div class="vnt">💬 Dịch: Jimmy muốn có vóc dáng đẹp; VÌ VẬY, anh ấy chạy bộ mỗi ngày sau khi làm việc.</div>
 <div class="keyline">🔑 SỬA: otherwise → <span class="hl-green">therefore</span> (hoặc "so")</div>
 <ol>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"otherwise" = nếu không thì. Ở đây là quan hệ NGUYÊN NHÂN–KẾT QUẢ (muốn đẹp → nên chạy bộ).</span></li>
 <li><span class="hl-green">✅ SỬA ĐÚNG:</span> <span class='p-grammar'>Dùng "therefore" (vì vậy) để chỉ kết quả hợp logic.</span></li></ol>
 <div class="hint">(Gõ "therefore" hoặc "so" đều được.)</div>`);

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const quiz=document.getElementById('quiz');
Q.forEach((it)=>{
  if(it.sec){const d=document.createElement('div');d.className='sec';d.textContent=it.sec;quiz.appendChild(d);return;}
  TOTAL++;
  const card=document.createElement('div');card.className='card';card.id='c'+it.num;
  card.innerHTML=`<div><span class="qnum">Câu ${it.num}</span><span class="qtext">${render(it)}</span></div>`;
  if(it.type==='mcq'){
    const wrap=document.createElement('div');wrap.className='opts';
    const arr=it.opts.map((t,i)=>({t,correct:i===it.correctIdx}));shuffle(arr);
    arr.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>pickMcq(it,card,wrap,b,o.correct);wrap.appendChild(b);});
    card.appendChild(wrap);
  }else if(it.type==='txt'){
    if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='('+it.hint+')';card.appendChild(h);}
    const box=document.createElement('div');box.className='tin';
    const inp=document.createElement('input');inp.placeholder='Gõ đáp án của em...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    const act=()=>checkTxt(it,card,inp,btn);
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    box.appendChild(inp);box.appendChild(btn);card.appendChild(box);
  }else if(it.type==='cor'){
    const letters=document.createElement('div');letters.className='letters';
    const L=['A','B','C','D'];let selIdx=-1;
    const inBox=document.createElement('div');inBox.className='tin';inBox.style.display='none';
    const inp=document.createElement('input');inp.placeholder='Gõ chữ ĐÚNG để sửa...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    inBox.appendChild(inp);inBox.appendChild(btn);
    const lbtns=[];
    L.forEach((L_,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=L_;
      b.onclick=()=>{if(card.dataset.done)return;selIdx=i;lbtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        inBox.style.display='flex';inp.focus();};
      lbtns.push(b);letters.appendChild(b);});
    const act=()=>{if(selIdx<0){inp.placeholder='Hãy chọn chữ cái A–D trước!';return;}checkCor(it,card,lbtns,selIdx,inp,btn);};
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    card.appendChild(letters);card.appendChild(inBox);
  }
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=`<div class="expin">${it.exp}</div>`;
  card.appendChild(exp);quiz.appendChild(card);
});
function render(it){
  if(it.type==='cor'){const L=['A','B','C','D'];let s=it.q;
    it.parts.forEach((p,i)=>{s=s.replace('{'+p+'}',`<span class="mark">${p}<sup>${L[i]}</sup></span>`);});return s;}
  return it.q;
}
function openExp(card){card.querySelector('.exp').classList.add('open');}
function lock(card){card.dataset.done='1';answered++;updateProg();}
function pickMcq(it,card,wrap,btn,correct){
  if(card.dataset.done)return;lock(card);
  [...wrap.children].forEach(b=>{b.disabled=true;if(b.innerHTML===it.opts[it.correctIdx])b.classList.add('correct');});
  if(correct){correctCount++;btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong','shake');buzz();}
  openExp(card);
}
function checkTxt(it,card,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;
  const ok=matchWriting(inp.value,it.ans);
  if(ok){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function checkCor(it,card,lbtns,selIdx,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;lbtns.forEach(b=>b.disabled=true);
  const letterOk=selIdx===it.cIdx, textOk=matchWriting(inp.value,it.corr);
  lbtns[it.cIdx].classList.add('correct');
  if(selIdx!==it.cIdx)lbtns[selIdx].classList.add('wrong');
  if(letterOk&&textOk){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function openName(){document.getElementById('nameOv').classList.add('show');document.getElementById('nameIn').focus();}
function showResult(){
  const n=document.getElementById('nameIn').value.trim();
  const err=document.getElementById('nameErr'),inp=document.getElementById('nameIn');
  if(!n){inp.classList.add('err');err.textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('nameOv').classList.remove('show');
  const pct=correctCount/TOTAL, ten=(correctCount/TOTAL*10).toFixed(2);
  let greet,meme;
  if(pct===1){greet='🌟 THIÊN TÀI! '+n+' xuất sắc tuyệt đối!';meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+n+' làm rất tốt, cố thêm chút nữa nhé!';meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN '+n+'! Ôn lại phần giải thích rồi làm lại nha!';meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent='✅ '+correctCount+' / '+TOTAL+' câu đúng';
  document.getElementById('rTen').textContent='📊 Điểm quy đổi: '+ten+' / 10';
  const img=document.getElementById('rMeme'),fall=document.getElementById('rFall');
  img.style.display='block';fall.style.display='none';img.src=meme;
  img.onerror=()=>{img.style.display='none';fall.style.display='block';
    fall.textContent=pct===1?'🎉🏆🎉':(pct>=0.6?'😄👍':'😭💧');};
  document.getElementById('resOv').classList.add('show');
  if(pct>=0.6){confetti();setTimeout(confetti,400);}
}
updateProg();
</script>
