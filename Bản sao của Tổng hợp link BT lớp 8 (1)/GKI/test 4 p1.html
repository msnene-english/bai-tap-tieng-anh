<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 4 · Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#a855f7; --p3:#00c9a7; --p4:#ff6fa5; --p5:#56ccf2;
  --green:#00D26A; --red:#FF4757; --ink:#4a2b55;
  --glow:#ffd93d; --glow2:#ff4fa3;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
  line-height:1.55; overflow-x:hidden; position:relative;
  background:linear-gradient(-45deg,#ff85c0,#c084fc,#ffd93d,#6ee7b7,#ff9a76,#ff6fa5);
  background-size:400% 400%; animation:bgmove 18s ease infinite;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.4rem;opacity:.36;animation:floaty linear infinite;filter:drop-shadow(0 4px 6px rgba(90,40,80,.25))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0) rotate(0deg)}50%{transform:translateY(50vh) translateX(22px) rotate(180deg)}100%{transform:translateY(-15vh) translateX(-10px) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}

.topbar{
  text-align:center;background:rgba(255,255,255,.24);backdrop-filter:blur(14px);
  border:1.5px solid rgba(255,79,163,.55);border-radius:22px;padding:14px 16px;margin-bottom:16px;
  box-shadow:0 0 26px rgba(255,79,163,.3),0 10px 30px rgba(90,40,80,.25);
}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(168,85,247,.6);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 10px var(--glow),0 3px 10px rgba(120,40,90,.35)}
.topbar p{font-size:.78rem;color:#fff;opacity:.97;margin-top:2px}

.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(120,50,110,.22);backdrop-filter:blur(12px);border-radius:30px;padding:5px;border:1.5px solid rgba(255,79,163,.4);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.4);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s ease;box-shadow:0 0 10px var(--glow2)}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(120,40,90,.4)}

.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;font-weight:900;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 16px rgba(255,79,163,.55)}
.sec h2{color:#fff;font-size:1.02rem;font-weight:800;text-shadow:0 1px 6px rgba(120,40,90,.4);flex:1}

.card{
  background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:20px;
  padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(255,79,163,.4);
  box-shadow:0 0 20px rgba(255,79,163,.14),0 12px 26px rgba(90,40,80,.2);
}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#ffb03a);color:#7a4a00;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 0 12px rgba(255,207,77,.6)}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}

.passage{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid var(--glow);border-radius:12px;padding:10px 13px;margin:10px 0;font-weight:600;line-height:1.65;font-size:1.02rem;color:#6a4a1b}
.orderbox{margin:10px 0;display:flex;flex-direction:column;gap:9px}
.orderbox>div{background:rgba(168,85,247,.08);border:1.5px solid rgba(168,85,247,.2);border-radius:12px;padding:10px 13px;font-size:1.02rem;font-weight:600;line-height:1.55}
.orderbox b{color:var(--p1);font-size:1.08rem;margin-right:3px}

.signbox{display:flex;justify-content:center;margin:12px 0 4px}
.signbox svg{filter:drop-shadow(0 6px 12px rgba(90,40,80,.25))}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{
  background:linear-gradient(135deg,#fff,#fff0f8);border:2px solid rgba(255,79,163,.25);
  border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;
  box-shadow:0 6px 0 rgba(255,79,163,.24),0 8px 14px rgba(90,40,80,.12);
  transition:transform .12s ease,box-shadow .12s ease,background .2s;text-align:center;user-select:none;
}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(255,79,163,.3),0 0 18px rgba(255,207,77,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e,0 0 18px rgba(0,210,106,.6)}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}
.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{
  font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;
  border:2px solid rgba(255,79,163,.35);background:rgba(255,255,255,.95);outline:none;flex:1;min-width:180px;color:var(--ink);
  box-shadow:inset 0 2px 5px rgba(90,40,80,.08);
}
.tin:focus{border-color:var(--glow2);box-shadow:0 0 0 4px rgba(255,79,163,.2)}
.tin.ok{border-color:var(--green);background:#eafff3}
.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.1rem;font-weight:800;color:var(--p1)}
.btn-check{
  font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--glow2),var(--p1));padding:11px 18px;border-radius:14px;
  box-shadow:0 5px 0 rgba(168,85,247,.4),0 0 14px rgba(255,79,163,.4);transition:transform .1s;
}
.btn-check:hover{transform:translateY(-2px)}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(168,85,247,.4)}
.hint{font-size:.82rem;color:#b0448a;font-weight:600;margin-top:7px;font-style:italic}

.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{
  width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,79,163,.3);
  background:linear-gradient(135deg,#fff,#fff0f8);font-weight:900;font-size:1.1rem;cursor:pointer;color:var(--p1);
  box-shadow:0 5px 0 rgba(255,79,163,.24);transition:transform .12s;
}
.lbtn:hover:not(.locked){transform:scale(1.08);box-shadow:0 5px 0 rgba(255,79,163,.24),0 0 14px rgba(255,207,77,.6)}
.lbtn.sel{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;box-shadow:0 0 14px rgba(255,79,163,.6)}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}
.corrbox.show{display:block}

.exp{max-height:0;overflow:hidden;transition:max-height .5s ease,margin .3s,padding .3s;background:rgba(168,85,247,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2000px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(168,85,247,.3)}
.exp ol{margin:6px 0 2px 18px}
.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#f6ecff,#ffe9f4);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#8a3f7a;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.p-word{color:#2563eb;font-weight:800}
.hl-green{color:#0a9d54;font-weight:900}
.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(168,85,247,.15);color:#7b3fb0;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}
.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}

.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{
  font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--glow2),var(--p1),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;
  padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(168,85,247,.4),0 0 28px rgba(255,79,163,.5);transition:transform .1s;
}
.btn-submit:hover{transform:translateY(-3px)}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(168,85,247,.4)}

.mask{position:fixed;inset:0;background:rgba(70,30,70,.55);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:rgba(255,255,255,.97);border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px rgba(255,79,163,.4),0 20px 50px rgba(70,30,70,.4);border:2px solid rgba(255,79,163,.55);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#6a4a75;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(255,79,163,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}
.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:floaty2 2s ease-in-out infinite}
@keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p3),var(--p5));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(0,150,140,.4)}
.btn-again:hover{transform:translateY(-2px)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fff;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>

<div class="wrap">
  <div class="topbar">
    <div class="tag">🧁 Giáo viên tạo: Ms. Chí Nên</div>
    <h1>🍭 TEST 4</h1>
    <p>The First Midterm Tests · Candy Land English</p>
  </div>

  <div class="prog">
    <div class="txt" id="progtxt">0 / 22</div>
    <div class="bar"><div class="fill" id="progfill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="submit-wrap">
    <button class="btn-submit" onclick="openName()">🍬 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>

  <div class="footer">✨ Made with love for young learners · Ms. Chí Nên ✨</div>
</div>

<div class="mask" id="nameMask">
  <div class="modal">
    <h2>🍩 Bé tên là gì nào?</h2>
    <p>Nhập tên của con để xem kết quả nhé!</p>
    <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
    <div class="warn" id="nameWarn"></div>
    <button class="btn-again" style="background:linear-gradient(135deg,var(--glow2),var(--p1));box-shadow:0 6px 0 rgba(168,85,247,.4)" onclick="doSubmit()">Xem kết quả 🎉</button>
  </div>
</div>

<div class="mask" id="resMask">
  <div class="modal">
    <h2 id="resGreet"></h2>
    <div class="score-big" id="resScore"></div>
    <div class="score-10" id="resScore10"></div>
    <img class="meme" id="resMeme" alt="meme" style="display:none">
    <div class="meme-fallback" id="resFallback"></div>
    <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
    <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
/* ================= DATA (TEST 4) ================= */
const DATA=[
/* ---------- I. PHONETICS ---------- */
{sec:"I", head:"Chọn từ có phần gạch chân được phát âm khác các từ còn lại.", num:1, type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["cont<u>a</u>ct","enjoy<u>a</u>ble","rel<u>a</u>x","h<u>a</u>ppy"],
 answer:"enjoy<u>a</u>ble",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "a" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>contact</span> <span class='wt'>n/v</span> <span class='p-phonetic'>/ˈkɒntækt/</span> = <span class='p-mean'>liên hệ → a đọc /æ/</span></div>
 <div><span class='hl-green'>enjoyable</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ɪnˈdʒɔɪəbl/</span> = <span class='p-mean'>thú vị → a đọc /ə/</span></div>
 <div><span class='p-word'>relax</span> <span class='wt'>v</span> <span class='p-phonetic'>/rɪˈlæks/</span> = <span class='p-mean'>thư giãn → a đọc /æ/</span></div>
 <div><span class='p-word'>happy</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈhæpi/</span> = <span class='p-mean'>vui vẻ → a đọc /æ/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trong "enjoyable", chữ "a" nằm ở âm tiết KHÔNG được nhấn nên đọc nhẹ thành /ə/ (âm ơ mờ). Ba từ kia có "a" được nhấn nên đọc rõ /æ/ → enjoyable khác biệt.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>contact, relax, happy đều có "a" đọc /æ/ (âm e bẹt) nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: nguyên âm ở âm tiết KHÔNG nhấn thường "lười" thành /ə/ (schwa).</div>`},

{sec:"I", num:2, type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["club<u>s</u>","craft<u>s</u>","forum<u>s</u>","model<u>s</u>"],
 answer:"craft<u>s</u>",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có đuôi "-s" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>clubs</span> <span class='wt'>n</span> <span class='p-phonetic'>/klʌbz/</span> = <span class='p-mean'>các câu lạc bộ → -s đọc /z/</span></div>
 <div><span class='hl-green'>crafts</span> <span class='wt'>n</span> <span class='p-phonetic'>/krɑːfts/</span> = <span class='p-mean'>các đồ thủ công → -s đọc /s/</span></div>
 <div><span class='p-word'>forums</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈfɔːrəmz/</span> = <span class='p-mean'>các diễn đàn → -s đọc /z/</span></div>
 <div><span class='p-word'>models</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈmɒdlz/</span> = <span class='p-mean'>các mô hình → -s đọc /z/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"craft" kết thúc bằng âm /t/ — âm VÔ THANH — nên đuôi -s đọc là /s/. Ba từ kia kết thúc bằng âm hữu thanh (/b/, /m/, /l/) nên -s đọc /z/ → crafts khác biệt.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>clubs /b/, forums /m/, models /l/ đều là âm HỮU THANH nên -s đều đọc /z/, giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo đuôi -s: /s/ sau âm vô thanh (/p,t,k,f,θ/); /ɪz/ sau /s,z,ʃ,ʒ,tʃ,dʒ/; còn lại /z/.</div>`},

/* ---------- II. STRESS ---------- */
{sec:"II", head:"Chọn từ có trọng âm khác các từ còn lại.", num:3, type:"mcq",
 q:"3. Choose the word whose stress pattern is different.",
 disp:["pressure","ancient","safety","canal"],
 answer:"canal",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>pressure</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈpreʃə/</span> = <span class='p-mean'>áp lực → trọng âm 1</span></div>
 <div><span class='p-word'>ancient</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈeɪnʃənt/</span> = <span class='p-mean'>cổ xưa → trọng âm 1</span></div>
 <div><span class='p-word'>safety</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈseɪfti/</span> = <span class='p-mean'>sự an toàn → trọng âm 1</span></div>
 <div><span class='hl-green'>canal</span> <span class='wt'>n</span> <span class='p-phonetic'>/kəˈnæl/</span> = <span class='p-mean'>kênh mương → trọng âm 2</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"ca-NAL" nhấn âm tiết thứ HAI, còn ba từ kia đều nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>pressure, ancient, safety đều nhấn âm tiết 1 nên giống nhau.</span></li></ol>`},

{sec:"II", num:4, type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["traditional","community","cultivation","amazingly"],
 answer:"cultivation",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>traditional</span> <span class='wt'>adj</span> <span class='p-phonetic'>/trəˈdɪʃənl/</span> = <span class='p-mean'>truyền thống → trọng âm 2</span></div>
 <div><span class='p-word'>community</span> <span class='wt'>n</span> <span class='p-phonetic'>/kəˈmjuːnəti/</span> = <span class='p-mean'>cộng đồng → trọng âm 2</span></div>
 <div><span class='hl-green'>cultivation</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˌkʌltɪˈveɪʃn/</span> = <span class='p-mean'>việc canh tác → trọng âm 3</span></div>
 <div><span class='p-word'>amazingly</span> <span class='wt'>adv</span> <span class='p-phonetic'>/əˈmeɪzɪŋli/</span> = <span class='p-mean'>một cách kinh ngạc → trọng âm 2</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"cul-ti-VA-tion" nhấn âm tiết thứ BA, còn ba từ kia đều nhấn âm tiết thứ HAI.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>traditional, community, amazingly đều nhấn âm tiết 2 nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: từ kết thúc bằng "-tion" luôn nhấn ngay âm tiết TRƯỚC "-tion" (culti-VA-tion).</div>`},

/* ---------- III. MCQ ---------- */
{sec:"III", head:"Chọn từ hoặc cụm từ thích hợp nhất điền vào chỗ trống.", num:5, type:"mcq",
 q:"5. ______ at the airport on time last night?",
 disp:["Did she arrive","Does she arrive","Is she arriving","Will she arrive"],
 answer:"Did she arrive",
 exp:`<div class="vnt">💬 Dịch: <strong>Did she arrive at the airport on time last night?</strong> (Tối qua cô ấy có đến sân bay đúng giờ không?)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>A. Did she arrive</span> = <span class='p-mean'>Cô ấy đã đến...? (quá khứ) ✔</span></div>
 <div><span class='p-word'>B. Does she arrive</span> = <span class='p-mean'>hiện tại đơn (sai)</span></div>
 <div><span class='p-word'>C. Is she arriving</span> = <span class='p-mean'>tiếp diễn (sai)</span></div>
 <div><span class='p-word'>D. Will she arrive</span> = <span class='p-mean'>tương lai (sai)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "last night" (tối qua) → thì quá khứ đơn. Câu hỏi quá khứ: Did + S + V(nguyên mẫu) → "Did she arrive?"</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"last night" đã xảy ra rồi nên không dùng hiện tại/tiếp diễn/tương lai.</span></li></ol>
 <div class="tip">🧠 Nhớ: last night/yesterday/... ago → thì QUÁ KHỨ ĐƠN. Câu hỏi: Did + S + V?</div>`},

{sec:"III", num:6, type:"mcq",
 q:"6. ______ a picturesque view your village has, Thanh!",
 disp:["That","How","What","Which"],
 answer:"What",
 exp:`<div class="vnt">💬 Dịch: <strong>What a picturesque view your village has, Thanh!</strong> (Làng của bạn có khung cảnh đẹp như tranh làm sao, Thanh ơi!)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>A. That</span> = <span class='p-mean'>rằng/đó (không phải cảm thán)</span></div>
 <div><span class='p-word'>B. How</span> = <span class='p-mean'>dùng: How + tính từ + S + V</span></div>
 <div><span class='hl-green'>C. What</span> = <span class='p-mean'>dùng: What + a + adj + N ✔</span></div>
 <div><span class='p-word'>D. Which</span> = <span class='p-mean'>cái nào (câu hỏi)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau chỗ trống là "a picturesque view" (mạo từ + tính từ + DANH TỪ). Câu cảm thán với danh từ dùng: What + a/an + adj + N → "What a picturesque view...!"</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"How" chỉ đi với TÍNH TỪ (How beautiful...), không đi với "a + danh từ"; That/Which không tạo câu cảm thán.</span></li></ol>
 <div class="tip">🧠 Nhớ 2 mẫu cảm thán: What + a/an + ADJ + N! và How + ADJ + S + V!</div>`},

{sec:"III", num:7, type:"mcq",
 q:"7. Ann loves visiting his grandparents' farm because he can ______ the cattle.",
 disp:["take","pick","collect","herd"],
 answer:"herd",
 exp:`<div class="vnt">💬 Dịch: <strong>Ann loves visiting his grandparents' farm because he can herd the cattle.</strong> (Ann thích về thăm nông trại của ông bà vì cậu ấy được chăn/lùa gia súc.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>A. take</span> = <span class='p-mean'>lấy/mang</span></div>
 <div><span class='p-word'>B. pick</span> = <span class='p-mean'>hái/nhặt</span></div>
 <div><span class='p-word'>C. collect</span> = <span class='p-mean'>thu thập</span></div>
 <div><span class='hl-green'>D. herd</span> = <span class='p-mean'>chăn/lùa (gia súc) ✔</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"cattle" (đàn gia súc) đi với động từ "herd" = lùa/chăn dắt đàn gia súc → "herd the cattle".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>take/pick/collect không dùng với "cattle" theo nghĩa chăn dắt.</span></li></ol>`},

{sec:"III", num:8, type:"mcq",
 q:"8. I try to keep ______ by doing simple exercises like stretching and walking daily.",
 disp:["fit","hard","healthy","balanced"],
 answer:"fit",
 exp:`<div class="vnt">💬 Dịch: <strong>I try to keep fit by doing simple exercises like stretching and walking daily.</strong> (Tôi cố giữ dáng cân đối bằng cách tập những bài đơn giản như giãn cơ và đi bộ mỗi ngày.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>A. fit</span> = <span class='p-mean'>cân đối, khỏe khoắn ✔</span></div>
 <div><span class='p-word'>B. hard</span> = <span class='p-mean'>cứng/khó</span></div>
 <div><span class='p-word'>C. healthy</span> = <span class='p-mean'>khỏe mạnh</span></div>
 <div><span class='p-word'>D. balanced</span> = <span class='p-mean'>cân bằng</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Collocation cố định "keep fit" = giữ dáng/giữ cơ thể săn chắc. Tập thể dục để "keep fit" là cách nói chuẩn.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"keep hard/balanced" không hợp nghĩa; "keep healthy" nghe được nhưng "keep fit" mới là cụm chuẩn khi nói về tập luyện giữ dáng.</span></li></ol>
 <div class="tip">🧠 Nhớ collocation: keep/stay FIT (giữ dáng), do exercise, go on a diet.</div>`},

{sec:"III", num:9, type:"mcq",
 q:"9. Farmers in my village rely heavily on rice ______ for their livelihood.",
 disp:["cultivated","cultivate","cultivation","cultivator"],
 answer:"cultivation",
 exp:`<div class="vnt">💬 Dịch: <strong>Farmers in my village rely heavily on rice cultivation for their livelihood.</strong> (Nông dân ở làng tôi sống chủ yếu dựa vào việc trồng lúa.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>A. cultivated</span> = <span class='p-mean'>đã canh tác</span></div>
 <div><span class='p-word'>B. cultivate</span> = <span class='p-mean'>canh tác (động từ)</span></div>
 <div><span class='hl-green'>C. cultivation</span> = <span class='p-mean'>việc canh tác/trồng trọt ✔</span></div>
 <div><span class='p-word'>D. cultivator</span> = <span class='p-mean'>người/máy canh tác</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau "rice" (danh từ) cần một DANH TỪ để tạo cụm "rice cultivation" (việc trồng lúa). "rely on + danh từ" → cần danh từ chỉ hoạt động → cultivation.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>cultivate là động từ; cultivated là quá khứ phân từ; cultivator là "người/máy" (không hợp nghĩa "sống dựa vào việc trồng lúa").</span></li></ol>`},

{sec:"III", num:10, type:"mcq",
 q:"10. Jack can't concentrate ______ his homework when his favourite TV show is on.",
 disp:["with","on","at","for"],
 answer:"on",
 exp:`<div class="vnt">💬 Dịch: <strong>Jack can't concentrate on his homework when his favourite TV show is on.</strong> (Jack không thể tập trung vào bài tập khi chương trình TV yêu thích của cậu đang chiếu.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>A. with</span> = <span class='p-mean'>với</span></div>
 <div><span class='hl-green'>B. on</span> = <span class='p-mean'>vào (concentrate on) ✔</span></div>
 <div><span class='p-word'>C. at</span> = <span class='p-mean'>tại</span></div>
 <div><span class='p-word'>D. for</span> = <span class='p-mean'>cho</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "concentrate ON something" = tập trung vào việc gì → dùng "on".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"concentrate" chỉ đi với "on"; with/at/for không đúng.</span></li></ol>
 <div class="tip">🧠 Nhớ: concentrate ON · focus ON · depend ON · rely ON (nhiều động từ đi với "on").</div>`},

{sec:"III", num:11, type:"mcq",
 q:"11. Teenagers normally have to face lots of ______ from both their families and school.",
 disp:["schoolwork","pressure","support","community"],
 answer:"pressure",
 exp:`<div class="vnt">💬 Dịch: <strong>Teenagers normally have to face lots of pressure from both their families and school.</strong> (Thanh thiếu niên thường phải đối mặt với rất nhiều áp lực từ cả gia đình lẫn nhà trường.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>A. schoolwork</span> = <span class='p-mean'>bài vở ở trường</span></div>
 <div><span class='hl-green'>B. pressure</span> = <span class='p-mean'>áp lực ✔</span></div>
 <div><span class='p-word'>C. support</span> = <span class='p-mean'>sự hỗ trợ</span></div>
 <div><span class='p-word'>D. community</span> = <span class='p-mean'>cộng đồng</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm "face pressure" (đối mặt với áp lực). Áp lực đến "from families and school" (từ gia đình và trường học) → hợp nghĩa nhất là "pressure".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>support (hỗ trợ) mang nghĩa tích cực, không hợp với "have to face"; schoolwork/community không diễn tả điều gây căng thẳng cần "đối mặt".</span></li></ol>`},

{sec:"III", num:12, type:"mcq",
 q:'12. Penelope: "______" – Liam: "I\'m glad you like it."',
 disp:["I bought you a present.","What an expensive T-shirt!","Thanks for the birthday present.","Why don't we buy something for her?"],
 answer:"Thanks for the birthday present.",
 exp:`<div class="vnt">💬 Dịch: <strong>Penelope: "Thanks for the birthday present." – Liam: "I'm glad you like it."</strong> (Penelope: "Cảm ơn vì món quà sinh nhật nhé." – Liam: "Mình vui vì cậu thích nó.")</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='p-word'>A. I bought you a present.</span> = <span class='p-mean'>Mình đã mua cho cậu một món quà.</span></div>
 <div><span class='p-word'>B. What an expensive T-shirt!</span> = <span class='p-mean'>Cái áo đắt ghê!</span></div>
 <div><span class='hl-green'>C. Thanks for the birthday present.</span> = <span class='p-mean'>Cảm ơn vì món quà sinh nhật. ✔</span></div>
 <div><span class='p-word'>D. Why don't we buy something for her?</span> = <span class='p-mean'>Sao chúng mình không mua gì đó cho cô ấy?</span></div>

 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Liam đáp "I'm glad you like it" (Mình vui vì cậu thích nó) — đây là phản hồi khi ai đó CẢM ƠN vì món quà. Vậy Penelope phải nói "Thanks for the birthday present."</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Nếu Penelope là người TẶNG quà (câu A) thì Liam mới là người cảm ơn, không hợp; hai câu còn lại lạc chủ đề với câu đáp "vui vì cậu thích nó".</span></li></ol>`},

/* ---------- IV. TEXT ORDER + ENDING (Q13, Q14 — spacious layout) ---------- */
{sec:"IV", head:"Đọc và trả lời câu hỏi (sắp xếp đoạn văn & chọn câu kết).", num:13, type:"mcq",
 q:`13. Sắp xếp các câu (a–d) theo đúng thứ tự để tạo thành đoạn văn hợp lý.
 <div class="passage">Life in the countryside is different from life in the city. Many people like the countryside because of its many benefits. ______</div>
 <div class="orderbox">
   <div><b>a.</b> Second, the air is fresh and clean, so it's perfect for healthy living.</div>
   <div><b>b.</b> First, it is quiet and peaceful, which makes life more relaxing and enjoyable.</div>
   <div><b>c.</b> Lastly, people in the countryside are often friendly and ready to support each other.</div>
   <div><b>d.</b> Additionally, the cost of living is lower, making life more affordable for families.</div>
 </div>
 <div style="font-weight:800;margin-top:4px">👉 Chọn thứ tự đúng:</div>`,
 disp:["b – d – a – c","b – c – a – b","b – a – d – c","b – a – c – d"],
 answer:"b – a – d – c",
 exp:`<div class="vnt">💬 Dịch nghĩa từng câu:</div>
 <div class="gcol">
   <div><b>a.</b> <strong>Second, the air is fresh and clean, so it's perfect for healthy living.</strong> <br><span class='p-mean'>(Thứ hai, không khí trong lành và sạch sẽ, nên rất lý tưởng cho lối sống khỏe mạnh.)</span></div>
   <div><b>b.</b> <strong>First, it is quiet and peaceful, which makes life more relaxing and enjoyable.</strong> <br><span class='p-mean'>(Đầu tiên, nơi đây yên tĩnh và thanh bình, khiến cuộc sống thư thái và dễ chịu hơn.)</span></div>
   <div><b>c.</b> <strong>Lastly, people in the countryside are often friendly and ready to support each other.</strong> <br><span class='p-mean'>(Cuối cùng, người dân nông thôn thường thân thiện và sẵn sàng giúp đỡ lẫn nhau.)</span></div>
   <div><b>d.</b> <strong>Additionally, the cost of living is lower, making life more affordable for families.</strong> <br><span class='p-mean'>(Ngoài ra, chi phí sinh hoạt thấp hơn, giúp cuộc sống dễ chịu về mặt tài chính hơn cho các gia đình.)</span></div>
 </div>
 <ol><li><span class="hl-green">✅ THỨ TỰ ĐÚNG: b – a – d – c</span></li>
 <li><span class='p-grammar'>Dựa vào các TỪ NỐI chỉ trình tự: <b>First</b> (b) → <b>Second</b> (a) → <b>Additionally</b> (d – bổ sung thêm) → <b>Lastly</b> (c – cuối cùng). Sắp theo đúng mạch: b → a → d → c.</span></li>
 <li><span class="hl-red">❌ Vì sao các đáp án khác sai?</span> <span class='p-grammar'>Chúng đặt "Additionally/Lastly" sai chỗ, hoặc lặp lại chữ "b" (đáp án B: b–c–a–b) → không theo đúng trình tự First–Second–Additionally–Lastly.</span></li></ol>
 <div class="tip">🧠 Mẹo: bám vào từ nối trình tự để sắp xếp: First → Second → Third/Additionally → Finally/Lastly.</div>`},

{sec:"IV", num:14, type:"mcq",
 q:"14. Chọn câu KẾT THÚC đoạn văn ở câu 13 phù hợp nhất.",
 disp:["The countryside is a great place to enjoy a simple and healthy life.","However, many people say the countryside has no fun things to do.","Due to the stress of city life, young people are moving to the countryside.","Some people do not like living far from shops, hospitals and schools."],
 answer:"The countryside is a great place to enjoy a simple and healthy life.",
 exp:`<div class="vnt">💬 Dịch: <strong>The countryside is a great place to enjoy a simple and healthy life.</strong> (Nông thôn là một nơi tuyệt vời để tận hưởng một cuộc sống giản dị và khỏe mạnh.)</div>
 <div class="gcol">
   <div><span class='hl-green'>A. The countryside is a great place to enjoy a simple and healthy life.</span> = <span class='p-mean'>Nông thôn là nơi tuyệt vời để tận hưởng cuộc sống giản dị và khỏe mạnh. (câu kết tổng hợp lợi ích ✔)</span></div>
   <div><span class='p-word'>B. However, many people say the countryside has no fun things to do.</span> = <span class='p-mean'>Tuy nhiên, nhiều người nói nông thôn chẳng có gì vui để làm. (trái ý – chê nông thôn)</span></div>
   <div><span class='p-word'>C. Due to the stress of city life, young people are moving to the countryside.</span> = <span class='p-mean'>Do áp lực cuộc sống thành thị, người trẻ đang chuyển về nông thôn. (lạc ý – nói về thành thị)</span></div>
   <div><span class='p-word'>D. Some people do not like living far from shops, hospitals and schools.</span> = <span class='p-mean'>Một số người không thích sống xa cửa hàng, bệnh viện và trường học. (nêu nhược điểm – trái mạch)</span></div>
 </div>
 <ol><li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cả đoạn đang KHEN các lợi ích của nông thôn (yên bình, không khí sạch, rẻ, thân thiện). Câu kết hợp lý phải TỔNG KẾT tích cực → câu A gói lại ý "nơi tuyệt vời để sống giản dị, khỏe mạnh".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B và D nêu điểm xấu (chê nông thôn) → mâu thuẫn với cả đoạn; C chuyển sang nói về áp lực thành thị → lạc mạch kết luận.</span></li></ol>
 <div class="tip">🧠 Mẹo: câu kết đoạn thường TỔNG KẾT lại ý chính và cùng "giọng điệu" (tích cực/tiêu cực) với cả đoạn.</div>`},

/* ---------- VII. Q25 error + Q26 sign ---------- */
{sec:"VII", head:"Trả lời đúng cho mỗi câu hỏi sau (tìm lỗi sai & đọc biển báo).", num:25, type:"error",
 q:"25. James managed <u>to win</u> the contest <u>although</u> he <u>makes</u> <u>a few</u> mistakes.",
 parts:["to win","although","makes","a few"],
 correctLetter:2, corrAccept:["made"],
 exp:`<div class="vnt">💬 Dịch: <strong>James managed to win the contest although he made a few mistakes.</strong> (James đã giành chiến thắng trong cuộc thi mặc dù cậu ấy đã mắc một vài lỗi.)</div>
 <ol><li>Lỗi sai ở <b>C. makes</b> → sửa thành <span class='hl-green'>made</span>.</li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cả câu ở thì QUÁ KHỨ (managed, win the contest đã diễn ra rồi). Vì thế mệnh đề "although he ___ mistakes" cũng phải ở quá khứ → "makes" đổi thành "made".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>to win (managed TO win – đúng), although (mặc dù – đúng), a few (một vài + danh từ đếm được – đúng). Chỉ "makes" sai thì.</span></li></ol>
 <div class="tip">🧠 Mẹo: kiểm tra sự NHẤT QUÁN về thì. Câu đã ở quá khứ (managed) thì các động từ khác thường cũng ở quá khứ.</div>`},

{sec:"VIII", head:"Chọn câu đúng nhất được tạo từ các từ gợi ý cho sẵn.", num:27, type:"mcq",
 q:"27. Playing/ guitar/ one/ my/ favourite/ hobby.",
 disp:["Playing the guitar is one of my favourite hobbies.","Playing the guitar are one of mine favourite hobbies.","Playing guitar is one of favourite my hobbies.","Playing the guitar is one of mine favourite hobby."],
 answer:"Playing the guitar is one of my favourite hobbies.",
 exp:`<div class="vnt">💬 Dịch: <strong>Playing the guitar is one of my favourite hobbies.</strong> (Chơi ghi-ta là một trong những sở thích yêu thích của tôi.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='hl-green'>A. Playing the guitar is one of my favourite hobbies.</span> = <span class='p-mean'>✔ (đúng ngữ pháp)</span></div>
 <div><span class='p-word'>B. Playing the guitar are one of mine favourite hobbies.</span> = <span class='p-mean'>...are one of mine... (sai "are" và "mine")</span></div>
 <div><span class='p-word'>C. Playing guitar is one of favourite my hobbies.</span> = <span class='p-mean'>...one of favourite my hobbies (sai trật tự "favourite my")</span></div>
 <div><span class='p-word'>D. Playing the guitar is one of mine favourite hobby.</span> = <span class='p-mean'>...one of mine favourite hobby (sai "mine" và "hobby" số ít)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Danh động từ "Playing the guitar" là chủ ngữ SỐ ÍT → dùng "is". Cấu trúc "one of + my + adj + DANH TỪ SỐ NHIỀU" → "one of my favourite hobbies". Có "the" trước "guitar" (chơi nhạc cụ dùng "the").</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B dùng "are" (sai, chủ ngữ số ít) và "mine" (phải là "my" trước danh từ); C sai trật tự "favourite my"; D dùng "mine" sai và "hobby" số ít (phải là "hobbies").</span></li></ol>
 <div class="tip">🧠 Nhớ: one of + (sở hữu) + DANH TỪ SỐ NHIỀU (one of my friends, one of the best). Chơi nhạc cụ: play THE guitar/piano.</div>`},

{sec:"VIII", num:28, type:"mcq",

 <div class="gcol">
 <div><span class='hl-green'>A. Teenagers often feel pressured to meet the expectations of their parents.</span> = <span class='p-mean'>...feel pressured to meet the expectations of their parents. ✔</span></div>
 <div><span class='p-word'>B. Teenagers often feel pressured meeting expectations of their parents.</span> = <span class='p-mean'>...pressured meeting expectations... (sai: dùng "meeting")</span></div>

{sec:"IX", head:"Chọn câu có nghĩa gần nhất với câu gốc.", num:29, type:"mcq",
 q:"29. She enjoys collecting stamps more than making origami.",
 disp:["She prefers collecting stamps than making origami.","She would rather collecting stamps than making origami.","She likes collecting stamps better than making origami.","She loves collecting stamps and making origami."],
 answer:"She likes collecting stamps better than making origami.",
 exp:`<div class="vnt">💬 Dịch: <strong>She likes collecting stamps better than making origami.</strong> (Cô ấy thích sưu tầm tem hơn là gấp giấy origami.)</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="gcol">
 <div><span class='p-word'>A. She prefers collecting stamps than making origami.</span> = <span class='p-mean'>She prefers... than... (sai: prefer đi với "to", không phải "than")</span></div>
 <div><span class='p-word'>B. She would rather collecting stamps than making origami.</span> = <span class='p-mean'>She would rather collecting... (sai: would rather + V nguyên mẫu, không phải V-ing)</span></div>
 <div><span class='hl-green'>C. She likes collecting stamps better than making origami.</span> = <span class='p-mean'>She likes collecting stamps better than making origami. ✔ (thích... hơn)</span></div>
 <div><span class='p-word'>D. She loves collecting stamps and making origami.</span> = <span class='p-mean'>She loves... AND... (thành "thích cả hai" – sai nghĩa so sánh)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"enjoy A more than B" (thích A hơn B) = "like A better than B". Câu C giữ đúng nghĩa so sánh sở thích.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A sai vì "prefer ... TO ..." (không dùng "than"); B sai vì "would rather + V" (không dùng V-ing); D dùng "and" thành "thích cả hai" (mất ý so sánh hơn).</span></li></ol>
 <div class="tip">🧠 Nhớ: like A better than B = prefer A TO B = enjoy A more than B (đều nghĩa "thích A hơn B").</div>`},

/* ================= AUDIO ================= */
let AC;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function ding(){
  const c=ac(); const now=c.currentTime;
  [880,1320,1760].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0,now+i*0.08);
    g.gain.linearRampToValueAtTime(0.25,now+i*0.08+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.4);
    o.start(now+i*0.08); o.stop(now+i*0.08+0.42);
  });
}
function buzz(){
  const c=ac(); const now=c.currentTime;
  [300,220,160].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='square'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.18,now+i*0.13);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.13+0.12);
    o.start(now+i*0.13); o.stop(now+i*0.13+0.13);
  });
}

/* ================= CONFETTI ================= */
function confetti(){
  const cv=document.createElement('canvas'); cv.className='confetti';
  cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); const cols=['#ff4fa3','#a855f7','#ffd93d','#00D26A','#6ee7b7','#ff9a76'];
  const P=[]; for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height); t++;
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();});
    if(t<130)requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ================= HELPERS ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase()
  .replace(/won['’]t/g,'will not')
  .replace(/can['’]t/g,'can not')
  .replace(/n['’]t/g,' not')
  .replace(/['’]/g,'')
  .replace(/[.,!?;:"…\/]/g,' ')
  .replace(/\s+/g,' ').trim();}

const state={};
let answered=0;
const TOTAL=DATA.length;

function updateProg(){
  document.getElementById('progtxt').textContent=answered+' / '+TOTAL;
  document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%';
}

/* ================= RENDER ================= */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){
    const sec=document.createElement('div'); sec.className='sec';
    sec.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;
    quiz.appendChild(sec);
  }
  const card=document.createElement('div'); card.className='card'; card.id='c'+idx;
  const body=document.createElement('div');
  body.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  card.appendChild(body);
  const zone=document.createElement('div'); card.appendChild(zone);
  const exp=document.createElement('div'); exp.className='exp'; exp.innerHTML=it.exp; card.appendChild(exp);
  quiz.appendChild(card);

  if(it.type==='mcq') renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange') renderFill(it,idx,zone,exp);
  else if(it.type==='error') renderError(it,idx,zone,exp);
});
updateProg();

function markDone(idx,ok){ if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg();} }

function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div'); wrap.className='opts';
  const opts=shuffle(it.disp);
  opts.forEach(txt=>{
    const b=document.createElement('div'); b.className='opt'; b.innerHTML=txt;
    b.onclick=()=>{
      if(state[idx])return;
      const all=wrap.querySelectorAll('.opt'); all.forEach(x=>x.classList.add('locked'));
      const isC=(txt===it.answer);
      if(isC){b.classList.add('correct');ding();confetti();markDone(idx,true);}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);
        all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim');});
        setTimeout(()=>b.classList.remove('shake'),450);
      }
      exp.classList.add('open');
    };
    wrap.appendChild(b);
  });
  zone.appendChild(wrap);
}

function renderFill(it,idx,zone,exp){
  const row=document.createElement('div'); row.className='fillrow';
  const inp=document.createElement('input'); inp.className='tin'; inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button'); btn.className='btn-check'; btn.textContent='Kiểm tra';
  row.appendChild(inp); row.appendChild(btn); zone.appendChild(row);
  if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='💡 '+it.hint;zone.appendChild(h);}
  const acc=it.accept.map(norm);
  function check(){
    if(state[idx])return;
    const ok=acc.includes(norm(inp.value));
    inp.disabled=true; btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

function renderError(it,idx,zone,exp){
  const q=document.createElement('div'); q.className='err-parts';
  let labeled=it.q.replace(/^\d+\.\s*/,''); let li=0; const L=['A','B','C','D'];
  labeled=labeled.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);
  q.innerHTML=labeled; zone.appendChild(q);
  const letters=document.createElement('div'); letters.className='letters';
  const corr=document.createElement('div'); corr.className='corrbox';
  const acc=it.corrAccept.map(norm);
  let chosen=null;
  L.forEach((lab,i)=>{
    const b=document.createElement('button'); b.className='lbtn'; b.textContent=lab;
    b.onclick=()=>{
      if(state[idx])return;
      letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); chosen=i;
      corr.classList.add('show'); corr.querySelector('input').focus();
    };
    letters.appendChild(b);
  });
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div><div class="hint">💡 Chọn chữ cái chứa lỗi, gõ từ đúng vào ô rồi bấm Kiểm tra.</div>`;
  zone.appendChild(corr);
  const inp=corr.querySelector('input'); const btn=corr.querySelector('button');
  function check(){
    if(state[idx])return;
    if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return;}
    const letterOK=(chosen===it.correctLetter);
    const textOK=acc.includes(norm(inp.value));
    const ok=letterOK&&textOK;
    inp.disabled=true; btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel');});
    letters.children[it.correctLetter].classList.add('correct');
    if(!letterOK)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

/* ================= SUBMIT / RESULT ================= */
function openName(){ document.getElementById('nameMask').classList.add('show'); setTimeout(()=>document.getElementById('nameInput').focus(),100); }
function doSubmit(){
  const inp=document.getElementById('nameInput'); const w=document.getElementById('nameWarn');
  const name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err'); w.textContent='';
  document.getElementById('nameMask').classList.remove('show');
  showResult(name);
}
function showResult(name){
  let correct=0; for(let i=0;i<TOTAL;i++) if(state[i]==='ok') correct++;
  const pct=correct/TOTAL;
  const s10=(pct*10).toFixed(2);
  let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con ngọt ngào như kẹo! 🏆';fb='🏆🍭🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa là hoàn hảo! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi làm lại nha! 🌈';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('resGreet').textContent=greet;
  document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';
  document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'); const fbEl=document.getElementById('resFallback');
  fbEl.textContent=fb; fbEl.style.display='none'; im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none';};
  im.onerror=()=>{im.style.display='none';fbEl.style.display='block';};
  im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block';}},2500);
  document.getElementById('resMask').classList.add('show');
  if(pct>=0.6){confetti();ding();}
}

/* ================= FLOATING PATTERN ================= */
(function(){
  const icons=['🍭','🍬','🧁','🍩','🍫','🍪','🍦','🎈','🍡','🌈','🍓','🥨'];
  const p=document.getElementById('pattern');
  for(let i=0;i<15;i++){
    const s=document.createElement('span');
    s.className='float'; s.textContent=icons[i%icons.length];
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(17+Math.random()*17)+'s';
    s.style.animationDelay=(-Math.random()*24)+'s';
    s.style.fontSize=(1.6+Math.random()*1.9)+'rem';
    p.appendChild(s);
  }
})();
