<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 1 · Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#8854C0; --p3:#00C9A7; --p4:#FF6FB5; --p5:#5AC8FA;
  --green:#00D26A; --red:#FF4757; --ink:#241a3d;
  --neon:#00F0FF; --neon2:#FF3DDA;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
  line-height:1.55; overflow-x:hidden; position:relative;
  background:linear-gradient(-45deg,#3a1c71,#6C2BD9,#B24BF3,#2D9CDB,#00D0C0,#FF5FA2);
  background-size:400% 400%; animation:bgmove 18s ease infinite;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.4rem;opacity:.32;animation:floaty linear infinite;filter:drop-shadow(0 0 8px rgba(0,240,255,.5))}
@keyframes floaty{0%{transform:translateY(110vh) rotate(0deg)}100%{transform:translateY(-15vh) rotate(360deg)}}
.pattern .star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.8);animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}

.topbar{
  text-align:center;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);
  border:1.5px solid rgba(0,240,255,.4);border-radius:22px;padding:14px 16px;margin-bottom:16px;
  box-shadow:0 0 26px rgba(0,240,255,.3),0 10px 30px rgba(20,10,60,.4);
}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(255,61,218,.5);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px;box-shadow:0 0 12px rgba(255,61,218,.5)}
.topbar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 10px var(--neon),0 0 22px var(--neon2)}
.topbar p{font-size:.78rem;color:#eafcff;opacity:.95;margin-top:2px}

.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(20,10,50,.35);backdrop-filter:blur(12px);border-radius:30px;padding:5px;border:1.5px solid rgba(0,240,255,.35);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.2);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--neon2));border-radius:20px;transition:width .4s ease;box-shadow:0 0 10px var(--neon)}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 0 6px var(--neon)}

.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--neon2),var(--p1));color:#fff;font-weight:900;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 16px rgba(255,61,218,.6)}
.sec h2{color:#fff;font-size:1.02rem;font-weight:800;text-shadow:0 0 8px rgba(0,240,255,.5);flex:1}

.card{
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:20px;
  padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(0,240,255,.5);
  box-shadow:0 0 20px rgba(0,240,255,.18),0 12px 26px rgba(20,10,60,.3);
}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--neon),var(--p5));color:#08313a;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 0 12px rgba(0,240,255,.6)}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--neon2)}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{
  background:linear-gradient(135deg,#fff,#f2ecff);border:2px solid rgba(136,84,192,.25);
  border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;
  box-shadow:0 6px 0 rgba(136,84,192,.25),0 8px 14px rgba(20,10,60,.15);
  transition:transform .12s ease,box-shadow .12s ease,background .2s;text-align:center;user-select:none;
}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(136,84,192,.3),0 0 18px rgba(0,240,255,.4)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#00C9A7);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e,0 0 18px rgba(0,210,106,.6)}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}
.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{
  font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;
  border:2px solid rgba(136,84,192,.35);background:rgba(255,255,255,.95);outline:none;flex:1;min-width:180px;color:var(--ink);
  box-shadow:inset 0 2px 5px rgba(20,10,60,.08);
}
.tin:focus{border-color:var(--neon2);box-shadow:0 0 0 4px rgba(255,61,218,.18)}
.tin.ok{border-color:var(--green);background:#eafff3}
.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.1rem;font-weight:800;color:var(--p1)}
.btn-check{
  font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--neon2),var(--p1));padding:11px 18px;border-radius:14px;
  box-shadow:0 5px 0 rgba(136,84,192,.5),0 0 14px rgba(255,61,218,.4);transition:transform .1s;
}
.btn-check:hover{transform:translateY(-2px)}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(136,84,192,.5)}
.hint{font-size:.82rem;color:#7a3fb0;font-weight:600;margin-top:7px;font-style:italic}

.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{
  width:46px;height:46px;border-radius:14px;border:2px solid rgba(136,84,192,.3);
  background:linear-gradient(135deg,#fff,#f2ecff);font-weight:900;font-size:1.1rem;cursor:pointer;color:var(--p1);
  box-shadow:0 5px 0 rgba(136,84,192,.22);transition:transform .12s;
}
.lbtn:hover:not(.locked){transform:scale(1.08);box-shadow:0 5px 0 rgba(136,84,192,.22),0 0 14px rgba(0,240,255,.5)}
.lbtn.sel{background:linear-gradient(135deg,var(--neon2),var(--p1));color:#fff;box-shadow:0 0 14px rgba(255,61,218,.6)}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#00C9A7);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}
.corrbox.show{display:block}

.exp{max-height:0;overflow:hidden;transition:max-height .5s ease,margin .3s,padding .3s;background:rgba(136,84,192,.07);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:1600px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(136,84,192,.35)}
.exp ol{margin:6px 0 2px 18px}
.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#e6f7ff,#e9e0ff);border-left:5px solid var(--neon2);border-radius:10px;padding:8px 12px;color:#5a2b8a;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.p-word{color:#2563eb;font-weight:800}
.hl-green{color:#0a9d54;font-weight:900}
.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(136,84,192,.15);color:#6b3fa0;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}
.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}

.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{
  font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--neon2),#6C2BD9,var(--neon));background-size:200% 200%;animation:bgmove 6s ease infinite;
  padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(136,84,192,.5),0 0 28px rgba(0,240,255,.5);transition:transform .1s;
}
.btn-submit:hover{transform:translateY(-3px)}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(136,84,192,.5)}

.mask{position:fixed;inset:0;background:rgba(20,10,50,.6);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:rgba(255,255,255,.96);border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px rgba(0,240,255,.4),0 20px 50px rgba(20,10,60,.5);border:2px solid rgba(0,240,255,.5);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#4a3a65;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(136,84,192,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--neon2)}
.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:floaty2 2s ease-in-out infinite}
@keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--neon),var(--p5));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(0,150,180,.4)}
.btn-again:hover{transform:translateY(-2px)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#eafcff;font-size:.75rem;opacity:.9;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>

<div class="wrap">
  <div class="topbar">
    <div class="tag">👩‍🚀 Giáo viên tạo: Ms. Chí Nên</div>
    <h1>🌌 TEST 1</h1>
    <p>The First Midterm Tests · Galaxy English</p>
  </div>

  <div class="prog">
    <div class="txt" id="progtxt">0 / 22</div>
    <div class="bar"><div class="fill" id="progfill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="submit-wrap">
    <button class="btn-submit" onclick="openName()">🚀 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>

  <div class="footer">✨ Made with love for young explorers · Ms. Chí Nên ✨</div>
</div>

<div class="mask" id="nameMask">
  <div class="modal">
    <h2>🌟 Phi hành gia tên gì nào?</h2>
    <p>Nhập tên của con để xem kết quả nhé!</p>
    <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
    <div class="warn" id="nameWarn"></div>
    <button class="btn-again" style="background:linear-gradient(135deg,var(--neon2),var(--p1));box-shadow:0 6px 0 rgba(136,84,192,.4)" onclick="doSubmit()">Xem kết quả 🎉</button>
  </div>
</div>

<div class="mask" id="resMask">
  <div class="modal">
    <h2 id="resGreet"></h2>
    <div class="score-big" id="resScore"></div>
    <div class="score-10" id="resScore10"></div>
    <img class="meme" id="resMeme" alt="meme" style="display:none">
    <div class="meme-fallback" id="resFallback"></div>
    <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
    <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
/* ================= DATA (TEST 1) ================= */
const DATA=[
/* ---------- I. PHONETICS ---------- */
{sec:"I", head:"Chọn từ có phần gạch chân được phát âm khác các từ còn lại.", num:1, type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["sp<u>a</u>cious","f<u>a</u>ncy","<u>a</u>ncient","br<u>a</u>celet"],
 answer:"f<u>a</u>ncy",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "a" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>spacious</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈspeɪʃəs/</span> = <span class='p-mean'>rộng rãi → a đọc /eɪ/</span></div>
 <div><span class='hl-green'>fancy</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈfænsi/</span> = <span class='p-mean'>cầu kì/sang → a đọc /æ/</span></div>
 <div><span class='p-word'>ancient</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈeɪnʃənt/</span> = <span class='p-mean'>cổ xưa → a đọc /eɪ/</span></div>
 <div><span class='p-word'>bracelet</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈbreɪslət/</span> = <span class='p-mean'>vòng tay → a đọc /eɪ/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"fancy" có chữ "a" đọc là /æ/ (âm e bẹt, miệng mở rộng), khác hẳn ba từ kia đọc /eɪ/ (âm ây).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>spacious, ancient, bracelet đều có "a" là nguyên âm đôi /eɪ/ nên phát âm giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: chữ "a" thường đọc /eɪ/ khi đứng ở âm tiết mở/được nhấn; đọc /æ/ khi bị "kẹp" giữa các phụ âm (như f-a-ncy).</div>`},

{sec:"I", num:2, type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["f<u>o</u>cus","m<u>o</u>del","cr<u>o</u>p","h<u>o</u>spitable"],
 answer:"f<u>o</u>cus",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "o" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>focus</span> <span class='wt'>n/v</span> <span class='p-phonetic'>/ˈfəʊkəs/</span> = <span class='p-mean'>tập trung → o đọc /əʊ/</span></div>
 <div><span class='p-word'>model</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈmɒdl/</span> = <span class='p-mean'>mô hình → o đọc /ɒ/</span></div>
 <div><span class='p-word'>crop</span> <span class='wt'>n</span> <span class='p-phonetic'>/krɒp/</span> = <span class='p-mean'>mùa màng → o đọc /ɒ/</span></div>
 <div><span class='p-word'>hospitable</span> <span class='wt'>adj</span> <span class='p-phonetic'>/hɒˈspɪtəbl/</span> = <span class='p-mean'>hiếu khách → o đọc /ɒ/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"focus" có "o" đọc là /əʊ/ (âm âu), khác hẳn ba từ kia đọc /ɒ/ (âm o ngắn).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>model, crop, hospitable đều có "o" đọc /ɒ/ (âm o ngắn) nên giống nhau.</span></li></ol>`},

/* ---------- II. STRESS ---------- */
{sec:"II", head:"Chọn từ có trọng âm khác các từ còn lại.", num:3, type:"mcq",
 q:"3. Choose the word whose stress pattern is different.",
 disp:["puzzle","cattle","orchard","idea"],
 answer:"idea",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>puzzle</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈpʌzl/</span> = <span class='p-mean'>câu đố → trọng âm 1</span></div>
 <div><span class='p-word'>cattle</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈkætl/</span> = <span class='p-mean'>gia súc → trọng âm 1</span></div>
 <div><span class='p-word'>orchard</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈɔːtʃəd/</span> = <span class='p-mean'>vườn cây → trọng âm 1</span></div>
 <div><span class='hl-green'>idea</span> <span class='wt'>n</span> <span class='p-phonetic'>/aɪˈdɪə/</span> = <span class='p-mean'>ý tưởng → trọng âm 2</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"i-DE-a" nhấn âm tiết thứ hai, trong khi ba từ kia đều nhấn âm tiết đầu tiên.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>puzzle, cattle, orchard đều nhấn âm tiết 1 nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: đa số danh từ 2 âm tiết nhấn âm ĐẦU (PUZ-zle, CAT-tle), nhưng "idea" là ngoại lệ nhấn âm SAU.</div>`},

{sec:"II", num:4, type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["enjoyable","expectation","environment","ability"],
 answer:"expectation",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>enjoyable</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ɪnˈdʒɔɪəbl/</span> = <span class='p-mean'>thú vị → trọng âm 2</span></div>
 <div><span class='hl-green'>expectation</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˌekspekˈteɪʃn/</span> = <span class='p-mean'>kỳ vọng → trọng âm 3</span></div>
 <div><span class='p-word'>environment</span> <span class='wt'>n</span> <span class='p-phonetic'>/ɪnˈvaɪrənmənt/</span> = <span class='p-mean'>môi trường → trọng âm 2</span></div>
 <div><span class='p-word'>ability</span> <span class='wt'>n</span> <span class='p-phonetic'>/əˈbɪləti/</span> = <span class='p-mean'>khả năng → trọng âm 2</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"ex-pec-TA-tion" nhấn âm tiết thứ BA, còn ba từ kia đều nhấn âm tiết thứ HAI.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>enjoyable, environment, ability đều nhấn âm tiết 2 nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: từ kết thúc bằng "-tion" luôn nhấn ngay âm tiết TRƯỚC "-tion" (expec-TA-tion).</div>`},

/* ---------- III. MCQ ---------- */
{sec:"III", head:"Chọn từ hoặc cụm từ thích hợp nhất điền vào chỗ trống.", num:5, type:"mcq",
 q:"5. Nick spends hours ______ books to improve his knowledge of history.",
 disp:["reading","to read","read","to be reading"],
 answer:"reading",
 exp:`<div class="vnt">💬 Dịch: Nick dành hàng giờ đọc sách để nâng cao kiến thức lịch sử.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>reading</span> <span class='wt'>V-ing</span> = <span class='p-mean'>việc đọc</span></div>
 <div><span class='p-word'>to read</span> <span class='wt'>to-V</span> = <span class='p-mean'>để đọc (sai cấu trúc)</span></div>
 <div><span class='p-word'>read</span> <span class='wt'>V</span> = <span class='p-mean'>đọc (nguyên mẫu – sai)</span></div>
 <div><span class='p-word'>to be reading</span> = <span class='p-mean'>(sai cấu trúc)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "spend + (thời gian) + V-ing" = dành thời gian làm gì. "spend hours reading" → dùng V-ing "reading".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Sau "spend + thời gian" KHÔNG dùng to-V hay động từ nguyên mẫu, chỉ dùng V-ing.</span></li></ol>
 <div class="tip">🧠 Ghi nhớ: spend time DOING sth (không phải "to do"). Ví dụ: spend money BUYING books.</div>`},

{sec:"III", num:6, type:"mcq",
 q:"6. There's something about old books that I'm particularly ______ of.",
 disp:["keen","crazy","fond","fancy"],
 answer:"fond",
 exp:`<div class="vnt">💬 Dịch: Có điều gì đó ở những cuốn sách cũ mà tôi đặc biệt yêu thích.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>keen</span> <span class='wt'>adj</span> = <span class='p-mean'>hứng thú (keen ON)</span></div>
 <div><span class='p-word'>crazy</span> <span class='wt'>adj</span> = <span class='p-mean'>mê mệt (crazy ABOUT)</span></div>
 <div><span class='hl-green'>fond</span> <span class='wt'>adj</span> = <span class='p-mean'>yêu thích (fond OF)</span></div>
 <div><span class='p-word'>fancy</span> <span class='wt'>v</span> = <span class='p-mean'>thích (không đi với "of")</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau chỗ trống có giới từ "of" → chỉ "fond" đi với "of": "be fond OF sth" = yêu thích cái gì.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>keen đi với "on", crazy đi với "about", fancy không dùng giới từ "of" → không khớp với "of" ở sau.</span></li></ol>
 <div class="tip">🧠 Học theo cặp giới từ: keen ON · crazy/mad ABOUT · fond OF · interested IN.</div>`},

{sec:"III", num:7, type:"mcq",
 q:"7. She was eager to participate ______ the club's volunteer activities last month.",
 disp:["to","on","with","in"],
 answer:"in",
 exp:`<div class="vnt">💬 Dịch: Tháng trước cô ấy rất háo hức tham gia vào các hoạt động tình nguyện của câu lạc bộ.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>to</span> <span class='wt'>prep</span> = <span class='p-mean'>đến/tới</span></div>
 <div><span class='p-word'>on</span> <span class='wt'>prep</span> = <span class='p-mean'>trên</span></div>
 <div><span class='p-word'>with</span> <span class='wt'>prep</span> = <span class='p-mean'>với</span></div>
 <div><span class='hl-green'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>vào (trong)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "participate IN sth" = tham gia vào việc gì → dùng giới từ "in".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"participate" chỉ đi với "in", không đi với to/on/with.</span></li></ol>
 <div class="tip">🧠 Nhớ: participate IN = take part IN = join IN (đều dùng "in" cho việc tham gia).</div>`},

{sec:"III", num:8, type:"mcq",
 q:"8. The ______ gave us some tips to improve our skills for the upcoming competition.",
 disp:["worker","staff","coach","employee"],
 answer:"coach",
 exp:`<div class="vnt">💬 Dịch: Huấn luyện viên đã cho chúng tôi vài lời khuyên để cải thiện kỹ năng cho cuộc thi sắp tới.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>worker</span> <span class='wt'>n</span> = <span class='p-mean'>công nhân</span></div>
 <div><span class='p-word'>staff</span> <span class='wt'>n</span> = <span class='p-mean'>nhân viên (tập thể)</span></div>
 <div><span class='hl-green'>coach</span> <span class='wt'>n</span> = <span class='p-mean'>huấn luyện viên</span></div>
 <div><span class='p-word'>employee</span> <span class='wt'>n</span> = <span class='p-mean'>người làm công</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Người "cho lời khuyên để cải thiện kỹ năng cho cuộc thi" chính là "coach" (huấn luyện viên) → hợp ngữ cảnh thể thao/thi đấu.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>worker/staff/employee chỉ người đi làm nói chung, không phải người huấn luyện kỹ năng thi đấu.</span></li></ol>`},

{sec:"III", num:9, type:"mcq",
 q:"9. The second candidate answered ______ than the first one.",
 disp:["more confidently","most confidently","more confident","most confident"],
 answer:"more confidently",
 exp:`<div class="vnt">💬 Dịch: Ứng viên thứ hai trả lời tự tin hơn ứng viên thứ nhất.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>more confidently</span> <span class='wt'>adv</span> = <span class='p-mean'>tự tin hơn (so sánh hơn)</span></div>
 <div><span class='p-word'>most confidently</span> <span class='wt'>adv</span> = <span class='p-mean'>tự tin nhất (so sánh nhất)</span></div>
 <div><span class='p-word'>more confident</span> <span class='wt'>adj</span> = <span class='p-mean'>tính từ – sai loại từ</span></div>
 <div><span class='p-word'>most confident</span> <span class='wt'>adj</span> = <span class='p-mean'>tính từ – sai loại từ</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"answered" là động từ → cần TRẠNG TỪ (confidently) bổ nghĩa. Có "than" → so sánh hơn. Trạng từ dài (2 âm tiết trở lên) → "more + adv" = more confidently.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"most..." là so sánh nhất (không đi với "than"); "confident" là tính từ, không bổ nghĩa được cho động từ "answered".</span></li></ol>
 <div class="tip">🧠 Có "than" → luôn là so sánh HƠN. Bổ nghĩa cho động từ → dùng TRẠNG TỪ (đuôi -ly).</div>`},

{sec:"III", num:10, type:"mcq",
 q:"10. Jonas's decision to follow his dreams didn't ______ his parents' expectations.",
 disp:["meet","match","fit","suit"],
 answer:"meet",
 exp:`<div class="vnt">💬 Dịch: Quyết định theo đuổi ước mơ của Jonas đã không đáp ứng kỳ vọng của bố mẹ cậu ấy.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>meet</span> <span class='wt'>v</span> = <span class='p-mean'>đáp ứng (meet expectations)</span></div>
 <div><span class='p-word'>match</span> <span class='wt'>v</span> = <span class='p-mean'>hợp/khớp với</span></div>
 <div><span class='p-word'>fit</span> <span class='wt'>v</span> = <span class='p-mean'>vừa vặn</span></div>
 <div><span class='p-word'>suit</span> <span class='wt'>v</span> = <span class='p-mean'>phù hợp (màu sắc/kiểu)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Collocation cố định "meet expectations" = đáp ứng kỳ vọng. Đây là cách kết hợp từ tự nhiên trong tiếng Anh.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>match/fit/suit đều mang nghĩa "hợp/vừa" về hình thức, không dùng với "expectations".</span></li></ol>
 <div class="tip">🧠 Ghi nhớ collocation: meet the deadline (kịp hạn), meet the requirements (đạt yêu cầu), meet expectations (đáp ứng kỳ vọng).</div>`},

{sec:"III", num:11, type:"mcq",
 q:"11. Be quiet! Your baby brother ______ peacefully in his cradle.",
 disp:["sleep","slept","is sleeping","will sleep"],
 answer:"is sleeping",
 exp:`<div class="vnt">💬 Dịch: Suỵt! Em bé của con đang ngủ yên bình trong nôi kìa.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>sleep</span> = <span class='p-mean'>hiện tại đơn (sai)</span></div>
 <div><span class='p-word'>slept</span> = <span class='p-mean'>quá khứ (sai)</span></div>
 <div><span class='hl-green'>is sleeping</span> = <span class='p-mean'>đang ngủ (tiếp diễn)</span></div>
 <div><span class='p-word'>will sleep</span> = <span class='p-mean'>tương lai (sai)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Be quiet!" (Hãy im lặng!) cho thấy hành động ĐANG diễn ra ngay lúc này → dùng hiện tại tiếp diễn: is + V-ing → "is sleeping".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Hiện tại đơn (sleep) chỉ thói quen; quá khứ (slept) đã qua; tương lai (will sleep) chưa xảy ra → không hợp với việc "đang ngủ ngay bây giờ".</span></li></ol>
 <div class="tip">🧠 Dấu hiệu tiếp diễn: Look!, Listen!, Be quiet!, now, at the moment (hành động đang xảy ra).</div>`},

{sec:"III", num:12, type:"mcq",
 q:"12. We need to ______ the rice sacks then move them to the rice barn.",
 disp:["upload","unload","gather","cultivate"],
 answer:"unload",
 exp:`<div class="vnt">💬 Dịch: Chúng ta cần dỡ các bao gạo xuống rồi chuyển chúng vào kho thóc.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>upload</span> <span class='wt'>v</span> = <span class='p-mean'>tải lên (máy tính)</span></div>
 <div><span class='hl-green'>unload</span> <span class='wt'>v</span> = <span class='p-mean'>dỡ hàng xuống</span></div>
 <div><span class='p-word'>gather</span> <span class='wt'>v</span> = <span class='p-mean'>thu gom/tụ họp</span></div>
 <div><span class='p-word'>cultivate</span> <span class='wt'>v</span> = <span class='p-mean'>canh tác, trồng trọt</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau khi "unload" (dỡ xuống) các bao gạo thì mới "move them to the barn" (chuyển vào kho) → hợp trình tự công việc.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>upload dùng cho máy tính; gather (thu gom) và cultivate (trồng trọt) không hợp với hành động "dỡ bao gạo xuống rồi chuyển đi".</span></li></ol>
 <div class="tip">🧠 Cặp trái nghĩa: LOAD (chất hàng lên) ⇄ UNLOAD (dỡ hàng xuống); tiền tố "un-" mang nghĩa ngược lại.</div>`},

{sec:"III", num:13, type:"mcq",
 q:"13. The strong sense of ______ in rural areas comes from shared traditions and mutual support.",
 disp:["creativity","speciality","activity","community"],
 answer:"community",
 exp:`<div class="vnt">💬 Dịch: Tinh thần cộng đồng mạnh mẽ ở vùng nông thôn đến từ truyền thống chung và sự hỗ trợ lẫn nhau.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>creativity</span> <span class='wt'>n</span> = <span class='p-mean'>sự sáng tạo</span></div>
 <div><span class='p-word'>speciality</span> <span class='wt'>n</span> = <span class='p-mean'>đặc sản/chuyên môn</span></div>
 <div><span class='p-word'>activity</span> <span class='wt'>n</span> = <span class='p-mean'>hoạt động</span></div>
 <div><span class='hl-green'>community</span> <span class='wt'>n</span> = <span class='p-mean'>cộng đồng</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm "sense of community" = tinh thần cộng đồng. Nó đến từ "truyền thống chung + hỗ trợ lẫn nhau" → hợp nghĩa.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>creativity, speciality, activity không kết hợp với "shared traditions and mutual support" theo nghĩa tinh thần gắn kết.</span></li></ol>`},

{sec:"III", num:14, type:"mcq",
 q:'14. Mina: "Why don\'t we try the specialities at this open-air market?" – Rose: "______"',
 disp:["That's a good idea.","How interesting you are!","You will never know.","Thank you for trying."],
 answer:"That's a good idea.",
 exp:`<div class="vnt">💬 Dịch: Mina: "Sao chúng mình không thử các món đặc sản ở khu chợ ngoài trời này nhỉ?" – Rose: "Ý hay đấy."</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>That's a good idea.</span> = <span class='p-mean'>Ý hay đấy. (đồng ý gợi ý)</span></div>
 <div><span class='p-word'>How interesting you are!</span> = <span class='p-mean'>Bạn thú vị ghê! (không hợp)</span></div>
 <div><span class='p-word'>You will never know.</span> = <span class='p-mean'>Bạn sẽ không bao giờ biết. (lạc đề)</span></div>
 <div><span class='p-word'>Thank you for trying.</span> = <span class='p-mean'>Cảm ơn đã cố gắng. (lạc đề)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Why don't we...?" là một LỜI GỢI Ý/RỦ RÊ. Cách đáp phù hợp là đồng ý: "That's a good idea." (Ý hay đấy).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Ba câu còn lại không phải cách phản hồi cho một lời rủ rê; chúng lạc chủ đề hoặc sai ngữ cảnh.</span></li></ol>`},

/* ---------- VI. ERROR CORRECTION ---------- */
{sec:"VI", head:"Tìm lỗi sai. Bấm chữ cái chứa lỗi, rồi gõ từ SỬA ĐÚNG.", num:25, type:"error",
 q:"25. The children love <u>helping</u> out <u>and</u> learning new skills <u>when</u> they work <u>in</u> the farm.",
 parts:["helping","and","when","in"],
 correctLetter:3, corrAccept:["on"],
 exp:`<div class="vnt">💬 Dịch: Bọn trẻ thích giúp việc và học các kỹ năng mới khi chúng làm việc trên nông trại.</div>
 <ol><li>Lỗi sai ở <b>D. in</b> → sửa thành <span class='hl-green'>on</span>.</li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Với "farm" (nông trại), tiếng Anh dùng giới từ "ON": "work ON the farm" / "on a farm" (làm việc trên nông trại).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>helping (thích làm gì – đúng), and (nối 2 việc – đúng), when (khi – đúng) → chỉ có "in the farm" sai giới từ, phải là "on the farm".</span></li></ol>
 <div class="tip">🧠 Nhớ: ON the farm, nhưng IN the garden / IN the field. Riêng "farm" luôn đi với "on".</div>`},

{sec:"VI", num:26, type:"error",
 q:"26. I dislike <u>watching</u> scary movies <u>although</u> they keep <u>me</u> <u>awake</u> all night.",
 parts:["watching","although","me","awake"],
 correctLetter:1, corrAccept:["because"],
 exp:`<div class="vnt">💬 Dịch: Tôi ghét xem phim kinh dị vì chúng khiến tôi thức trắng cả đêm.</div>
 <ol><li>Lỗi sai ở <b>B. although</b> → sửa thành <span class='hl-green'>because</span>.</li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"ghét xem phim kinh dị" và "chúng khiến tôi thức cả đêm" có quan hệ NGUYÊN NHÂN (ghét VÌ mất ngủ) → phải dùng "because" (vì), không dùng "although" (mặc dù).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>watching (dislike + V-ing – đúng), me (tân ngữ – đúng), awake (keep sb awake – đúng) → chỉ có "although" sai vì nó chỉ sự tương phản, không hợp logic nguyên nhân.</span></li></ol>
 <div class="tip">🧠 Phân biệt: because = VÌ (nêu lý do) ≠ although = MẶC DÙ (nêu ý trái ngược).</div>`},

/* ---------- VII. MAKE SENTENCES ---------- */
{sec:"VII", head:"Viết câu hoàn chỉnh từ các từ gợi ý. Gõ cả câu vào ô.", num:27, type:"rearrange",
 q:"27. How/ you/ feel/ when/ you/ spend time/ family?",
 accept:["How do you feel when you spend time with your family"],
 hint:"Đây là câu hỏi thì hiện tại đơn — nhớ thêm 'do' và giới từ 'with'. (Gõ cả câu, không cần đúng dấu ?)",
 exp:`<div class="vnt">💬 Dịch: Bạn cảm thấy thế nào khi dành thời gian với gia đình?</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>How do you feel when you spend time with your family?</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu hỏi hiện tại đơn với "you" → How + DO + you + feel...? Sau đó "spend time WITH your family" (dành thời gian với gia đình) cần giới từ "with" và tính từ sở hữu "your".</span></li></ol>
 <div class="tip">🧠 Nhớ: "spend time WITH someone" (dành thời gian bên ai đó) — luôn có "with".</div>`},

{sec:"VII", num:28, type:"rearrange",
 q:"28. Teenagers/ may/ feel/ stressed/ when/ their classmates/ do/ good/ than/ them.",
 accept:["Teenagers may feel stressed when their classmates do better than them"],
 hint:"Có 'than' nên 'good' phải đổi sang dạng so sánh hơn. Gõ cả câu.",
 exp:`<div class="vnt">💬 Dịch: Thanh thiếu niên có thể cảm thấy căng thẳng khi bạn cùng lớp học giỏi hơn chúng.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Teenagers may feel stressed when their classmates do better than them.</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"may feel stressed" (có thể thấy căng thẳng). Có "than" → so sánh hơn. "good" ở đây bổ nghĩa cho động từ "do" nên dùng trạng từ, và dạng so sánh hơn BẤT QUY TẮC của well/good là "better" → "do BETTER than".</span></li></ol>
 <div class="tip">🧠 Ghi nhớ bất quy tắc: good/well → better → best (không nói "gooder" hay "more good").</div>`},

/* ---------- VIII. REWRITE ---------- */
{sec:"VIII", head:"Viết lại câu sao cho nghĩa không đổi, dùng từ trong ngoặc. Gõ cả câu hoàn chỉnh.", num:29, type:"rearrange",
 q:"29. Isabella shows no fondness for water sports. (FOND)",
 accept:["Isabella isn't fond of water sports","Isabella is not fond of water sports"],
 hint:"Dùng 'fond of'. (Gõ cả câu)",
 exp:`<div class="vnt">💬 Dịch: Isabella không thích các môn thể thao dưới nước.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Isabella isn't fond of water sports.</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"show no fondness for" (không có sự yêu thích với) = "not be fond of" (không thích). Danh từ "fondness" đổi thành tính từ "fond" + of.</span></li></ol>
 <div class="tip">🧠 Nhớ cặp: fondness (n) ⇄ fond (adj). "be fond OF sth" = thích cái gì.</div>`},

{sec:"VIII", num:30, type:"rearrange",
 q:"30. He likes hanging out with friends better than watching TV at home. (PREFER)",
 accept:["He prefers hanging out with friends to watching TV at home"],
 hint:"Cấu trúc: prefer + V-ing + to + V-ing. Gõ cả câu.",
 exp:`<div class="vnt">💬 Dịch: Cậu ấy thích đi chơi với bạn bè hơn là xem TV ở nhà.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>He prefers hanging out with friends to watching TV at home.</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"like A better than B" = "prefer A TO B" (thích A hơn B). Lưu ý sau "prefer" dùng "to" chứ KHÔNG dùng "than", và cả hai vế đều là V-ing (hanging... to watching...).</span></li></ol>
 <div class="tip">🧠 Bẫy hay gặp: prefer đi với "TO", không phải "than". → prefer tea TO coffee.</div>`},

{sec:"VIII", num:31, type:"rearrange",
 q:"31. I spent two hours doing my maths homework yesterday. (TOOK)",
 accept:["It took me two hours to do my maths homework yesterday","It took me two hours to do my math homework yesterday","It took me 2 hours to do my maths homework yesterday"],
 hint:"Cấu trúc: It took (sb) + (thời gian) + to do sth. Gõ cả câu.",
 exp:`<div class="vnt">💬 Dịch: Tôi đã mất hai tiếng để làm bài tập toán ngày hôm qua.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>It took me two hours to do my maths homework yesterday.</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"S + spend + time + V-ing" = "It + took + sb + time + TO + V". Đổi "spent ... doing" thành "It took me ... to do". Vế thời gian "two hours" giữ nguyên, "yesterday" ở cuối.</span></li></ol>
 <div class="tip">🧠 Hai cấu trúc tương đương: I SPENT 2 hours DOING it = It TOOK me 2 hours TO DO it.</div>`},

{sec:"VIII", num:32, type:"rearrange",
 q:"32. My sister doesn't dance as beautifully as my cousin does. (MORE)",
 accept:["My cousin dances more beautifully than my sister does","My cousin dances more beautifully than my sister"],
 hint:"Đổi sang so sánh hơn với 'more ... than'. Gõ cả câu.",
 exp:`<div class="vnt">💬 Dịch: Chị họ của tôi nhảy đẹp hơn chị gái tôi.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>My cousin dances more beautifully than my sister (does).</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"A doesn't do sth as ... as B" (A không ... bằng B) nghĩa là B ... HƠN A. Đảo lại: "My cousin dances MORE beautifully THAN my sister". "beautifully" là trạng từ dài nên dùng "more ... than".</span></li></ol>
 <div class="tip">🧠 Quy đổi: "A không + adv + bằng B" ⇔ "B + more + adv + than + A".</div>`}
];

/* ================= AUDIO ================= */
let AC;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function ding(){
  const c=ac(); const now=c.currentTime;
  [880,1320,1760].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0,now+i*0.08);
    g.gain.linearRampToValueAtTime(0.25,now+i*0.08+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.4);
    o.start(now+i*0.08); o.stop(now+i*0.08+0.42);
  });
}
function buzz(){
  const c=ac(); const now=c.currentTime;
  [300,220,160].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='square'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.18,now+i*0.13);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.13+0.12);
    o.start(now+i*0.13); o.stop(now+i*0.13+0.13);
  });
}

/* ================= CONFETTI ================= */
function confetti(){
  const cv=document.createElement('canvas'); cv.className='confetti';
  cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); const cols=['#00F0FF','#FF3DDA','#FDCB6E','#00D26A','#8854C0','#5AC8FA'];
  const P=[]; for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height); t++;
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();});
    if(t<130)requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ================= HELPERS ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase()
  .replace(/won['’]t/g,'will not')
  .replace(/can['’]t/g,'can not')
  .replace(/n['’]t/g,' not')
  .replace(/['’]/g,'')
  .replace(/[.,!?;:"…\/]/g,' ')
  .replace(/\s+/g,' ').trim();}

const state={};
let answered=0;
const TOTAL=DATA.length;

function updateProg(){
  document.getElementById('progtxt').textContent=answered+' / '+TOTAL;
  document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%';
}

/* ================= RENDER ================= */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){
    const sec=document.createElement('div'); sec.className='sec';
    sec.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;
    quiz.appendChild(sec);
  }
  const card=document.createElement('div'); card.className='card'; card.id='c'+idx;
  const body=document.createElement('div');
  body.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  card.appendChild(body);
  const zone=document.createElement('div'); card.appendChild(zone);
  const exp=document.createElement('div'); exp.className='exp'; exp.innerHTML=it.exp; card.appendChild(exp);
  quiz.appendChild(card);

  if(it.type==='mcq') renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange') renderFill(it,idx,zone,exp);
  else if(it.type==='error') renderError(it,idx,zone,exp);
});
updateProg();

function markDone(idx,ok){ if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg();} }

function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div'); wrap.className='opts';
  const opts=shuffle(it.disp);
  opts.forEach(txt=>{
    const b=document.createElement('div'); b.className='opt'; b.innerHTML=txt;
    b.onclick=()=>{
      if(state[idx])return;
      const all=wrap.querySelectorAll('.opt'); all.forEach(x=>x.classList.add('locked'));
      const isC=(txt===it.answer);
      if(isC){b.classList.add('correct');ding();confetti();markDone(idx,true);}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);
        all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim');});
        setTimeout(()=>b.classList.remove('shake'),450);
      }
      exp.classList.add('open');
    };
    wrap.appendChild(b);
  });
  zone.appendChild(wrap);
}

function renderFill(it,idx,zone,exp){
  const row=document.createElement('div'); row.className='fillrow';
  const inp=document.createElement('input'); inp.className='tin'; inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button'); btn.className='btn-check'; btn.textContent='Kiểm tra';
  row.appendChild(inp); row.appendChild(btn); zone.appendChild(row);
  if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='💡 '+it.hint;zone.appendChild(h);}
  const acc=it.accept.map(norm);
  function check(){
    if(state[idx])return;
    const ok=acc.includes(norm(inp.value));
    inp.disabled=true; btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

function renderError(it,idx,zone,exp){
  const q=document.createElement('div'); q.className='err-parts';
  let labeled=it.q.replace(/^\d+\.\s*/,''); let li=0; const L=['A','B','C','D'];
  labeled=labeled.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);
  q.innerHTML=labeled; zone.appendChild(q);
  const letters=document.createElement('div'); letters.className='letters';
  const corr=document.createElement('div'); corr.className='corrbox';
  const acc=it.corrAccept.map(norm);
  let chosen=null;
  L.forEach((lab,i)=>{
    const b=document.createElement('button'); b.className='lbtn'; b.textContent=lab;
    b.onclick=()=>{
      if(state[idx])return;
      letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); chosen=i;
      corr.classList.add('show'); corr.querySelector('input').focus();
    };
    letters.appendChild(b);
  });
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div><div class="hint">💡 Chọn chữ cái chứa lỗi, gõ từ đúng vào ô rồi bấm Kiểm tra (ví dụ: on, because...).</div>`;
  zone.appendChild(corr);
  const inp=corr.querySelector('input'); const btn=corr.querySelector('button');
  function check(){
    if(state[idx])return;
    if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return;}
    const letterOK=(chosen===it.correctLetter);
    const textOK=acc.includes(norm(inp.value));
    const ok=letterOK&&textOK;
    inp.disabled=true; btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel');});
    letters.children[it.correctLetter].classList.add('correct');
    if(!letterOK)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

/* ================= SUBMIT / RESULT ================= */
function openName(){ document.getElementById('nameMask').classList.add('show'); setTimeout(()=>document.getElementById('nameInput').focus(),100); }
function doSubmit(){
  const inp=document.getElementById('nameInput'); const w=document.getElementById('nameWarn');
  const name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err'); w.textContent='';
  document.getElementById('nameMask').classList.remove('show');
  showResult(name);
}
function showResult(name){
  let correct=0; for(let i=0;i<TOTAL;i++) if(state[i]==='ok') correct++;
  const pct=correct/TOTAL;
  const s10=(pct*10).toFixed(2);
  let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con là siêu sao thiên hà! 🏆';fb='🏆🚀🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố lên chút nữa là chạm tới ngôi sao! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi bay lại nha! 🌈';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('resGreet').textContent=greet;
  document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';
  document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'); const fbEl=document.getElementById('resFallback');
  fbEl.textContent=fb; fbEl.style.display='none'; im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none';};
  im.onerror=()=>{im.style.display='none';fbEl.style.display='block';};
  im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block';}},2500);
  document.getElementById('resMask').classList.add('show');
  if(pct>=0.6){confetti();ding();}
}

/* ================= FLOATING PATTERN ================= */
(function(){
  const icons=['🚀','🪐','⭐','🌟','☄️','👾','🛸','🌙','✨','🌌','💫','🔭'];
  const p=document.getElementById('pattern');
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    s.className='float'; s.textContent=icons[i%icons.length];
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(16+Math.random()*16)+'s';
    s.style.animationDelay=(-Math.random()*22)+'s';
    s.style.fontSize=(1.6+Math.random()*1.9)+'rem';
    p.appendChild(s);
  }
  for(let i=0;i<26;i++){
    const st=document.createElement('span');
    st.className='star';
    st.style.left=Math.random()*100+'%';
    st.style.top=Math.random()*100+'%';
    st.style.animationDuration=(1.5+Math.random()*2.5)+'s';
    st.style.animationDelay=(-Math.random()*3)+'s';
    p.appendChild(st);
  }
})();
