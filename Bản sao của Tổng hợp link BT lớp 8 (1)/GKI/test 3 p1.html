<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 3 · Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#7c4dff; --p3:#00c9a7; --p4:#ff6fa5; --p5:#56ccf2;
  --green:#00D26A; --red:#FF4757; --ink:#3a2e5c;
  --glow:#ffcf4d; --glow2:#ff6fa5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
  line-height:1.55; overflow-x:hidden; position:relative;
  background:linear-gradient(-45deg,#7bd389,#56ccf2,#ffd93d,#ff9ec7,#b39ddb);
  background-size:400% 400%; animation:bgmove 18s ease infinite;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.4rem;opacity:.36;animation:floaty linear infinite;filter:drop-shadow(0 4px 6px rgba(80,60,20,.2))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0) rotate(0deg)}50%{transform:translateY(50vh) translateX(24px) rotate(180deg)}100%{transform:translateY(-15vh) translateX(-10px) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}

.topbar{
  text-align:center;background:rgba(255,255,255,.24);backdrop-filter:blur(14px);
  border:1.5px solid rgba(255,207,77,.6);border-radius:22px;padding:14px 16px;margin-bottom:16px;
  box-shadow:0 0 26px rgba(255,207,77,.35),0 10px 30px rgba(90,70,30,.25);
}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(255,111,165,.6);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 10px var(--glow),0 3px 10px rgba(90,60,10,.35)}
.topbar p{font-size:.78rem;color:#fffdf3;opacity:.97;margin-top:2px}

.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(120,80,140,.22);backdrop-filter:blur(12px);border-radius:30px;padding:5px;border:1.5px solid rgba(255,207,77,.45);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.4);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s ease;box-shadow:0 0 10px var(--glow)}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(90,60,10,.4)}

.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;font-weight:900;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 16px rgba(255,111,165,.55)}
.sec h2{color:#fff;font-size:1.02rem;font-weight:800;text-shadow:0 1px 6px rgba(90,60,10,.4);flex:1}

.card{
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-radius:20px;
  padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(255,207,77,.55);
  box-shadow:0 0 20px rgba(255,207,77,.16),0 12px 26px rgba(90,70,30,.2);
}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#ffb03a);color:#6a4a00;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 0 12px rgba(255,207,77,.6)}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}

.signbox{display:flex;justify-content:center;margin:12px 0 4px}
.signbox svg{filter:drop-shadow(0 6px 12px rgba(90,70,30,.25))}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{
  background:linear-gradient(135deg,#fff,#fff6e6);border:2px solid rgba(255,176,58,.3);
  border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;
  box-shadow:0 6px 0 rgba(255,176,58,.28),0 8px 14px rgba(90,70,30,.12);
  transition:transform .12s ease,box-shadow .12s ease,background .2s;text-align:center;user-select:none;
}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(255,176,58,.34),0 0 18px rgba(255,207,77,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e,0 0 18px rgba(0,210,106,.6)}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}
.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{
  font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;
  border:2px solid rgba(255,176,58,.4);background:rgba(255,255,255,.95);outline:none;flex:1;min-width:180px;color:var(--ink);
  box-shadow:inset 0 2px 5px rgba(90,70,30,.08);
}
.tin:focus{border-color:var(--glow2);box-shadow:0 0 0 4px rgba(255,111,165,.2)}
.tin.ok{border-color:var(--green);background:#eafff3}
.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.1rem;font-weight:800;color:var(--p1)}
.btn-check{
  font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--glow2),var(--p1));padding:11px 18px;border-radius:14px;
  box-shadow:0 5px 0 rgba(124,77,255,.4),0 0 14px rgba(255,111,165,.4);transition:transform .1s;
}
.btn-check:hover{transform:translateY(-2px)}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(124,77,255,.4)}
.hint{font-size:.82rem;color:#a05a2c;font-weight:600;margin-top:7px;font-style:italic}

.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{
  width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,176,58,.35);
  background:linear-gradient(135deg,#fff,#fff6e6);font-weight:900;font-size:1.1rem;cursor:pointer;color:#c07a00;
  box-shadow:0 5px 0 rgba(255,176,58,.28);transition:transform .12s;
}
.lbtn:hover:not(.locked){transform:scale(1.08);box-shadow:0 5px 0 rgba(255,176,58,.28),0 0 14px rgba(255,207,77,.6)}
.lbtn.sel{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;box-shadow:0 0 14px rgba(255,111,165,.6)}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#00c9a7);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}
.corrbox.show{display:block}

.exp{max-height:0;overflow:hidden;transition:max-height .5s ease,margin .3s,padding .3s;background:rgba(124,77,255,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:1600px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(124,77,255,.3)}
.exp ol{margin:6px 0 2px 18px}
.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#f3ecff,#ffe9f4);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#7a3f8a;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.p-word{color:#2563eb;font-weight:800}
.hl-green{color:#0a9d54;font-weight:900}
.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(124,77,255,.15);color:#6b3fa0;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}
.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}

.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{
  font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--glow2),var(--p1),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;
  padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(124,77,255,.4),0 0 28px rgba(255,207,77,.5);transition:transform .1s;
}
.btn-submit:hover{transform:translateY(-3px)}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(124,77,255,.4)}

.mask{position:fixed;inset:0;background:rgba(60,40,80,.55);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:rgba(255,255,255,.97);border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px rgba(255,207,77,.4),0 20px 50px rgba(60,40,80,.4);border:2px solid rgba(255,207,77,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#5a4a75;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(255,176,58,.4);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}
.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:floaty2 2s ease-in-out infinite}
@keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p3),var(--p5));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(0,150,140,.4)}
.btn-again:hover{transform:translateY(-2px)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fffdf3;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>

<div class="wrap">
  <div class="topbar">
    <div class="tag">🌻 Giáo viên tạo: Ms. Chí Nên</div>
    <h1>🌈 TEST 3</h1>
    <p>The First Midterm Tests · Rainbow Meadow English</p>
  </div>

  <div class="prog">
    <div class="txt" id="progtxt">0 / 22</div>
    <div class="bar"><div class="fill" id="progfill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="submit-wrap">
    <button class="btn-submit" onclick="openName()">🦋 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>

  <div class="footer">✨ Made with love for young explorers · Ms. Chí Nên ✨</div>
</div>

<div class="mask" id="nameMask">
  <div class="modal">
    <h2>🌸 Bé tên là gì nào?</h2>
    <p>Nhập tên của con để xem kết quả nhé!</p>
    <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
    <div class="warn" id="nameWarn"></div>
    <button class="btn-again" style="background:linear-gradient(135deg,var(--glow2),var(--p1));box-shadow:0 6px 0 rgba(124,77,255,.4)" onclick="doSubmit()">Xem kết quả 🎉</button>
  </div>
</div>

<div class="mask" id="resMask">
  <div class="modal">
    <h2 id="resGreet"></h2>
    <div class="score-big" id="resScore"></div>
    <div class="score-10" id="resScore10"></div>
    <img class="meme" id="resMeme" alt="meme" style="display:none">
    <div class="meme-fallback" id="resFallback"></div>
    <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
    <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
/* ================= DATA (TEST 3) ================= */
const DATA=[
/* ---------- I. PHONETICS ---------- */
{sec:"I", head:"Chọn từ có phần gạch chân được phát âm khác các từ còn lại.", num:1, type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["sch<u>oo</u>lbag","b<u>oo</u>kshop","cart<u>oo</u>n","ball<u>oo</u>n"],
 answer:"b<u>oo</u>kshop",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có phần "oo" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>schoolbag</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈskuːlbæɡ/</span> = <span class='p-mean'>cặp sách → oo đọc /uː/</span></div>
 <div><span class='hl-green'>bookshop</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈbʊkʃɒp/</span> = <span class='p-mean'>hiệu sách → oo đọc /ʊ/</span></div>
 <div><span class='p-word'>cartoon</span> <span class='wt'>n</span> <span class='p-phonetic'>/kɑːˈtuːn/</span> = <span class='p-mean'>phim hoạt hình → oo đọc /uː/</span></div>
 <div><span class='p-word'>balloon</span> <span class='wt'>n</span> <span class='p-phonetic'>/bəˈluːn/</span> = <span class='p-mean'>bóng bay → oo đọc /uː/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"bookshop" có "oo" đọc ngắn là /ʊ/ (âm u ngắn), khác hẳn ba từ kia đọc dài /uː/ (âm u dài).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>schoolbag, cartoon, balloon đều có "oo" đọc /uː/ (u dài) nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: "oo" thường đọc /ʊ/ (ngắn) trong: book, look, good, foot, cook. Còn lại thường /uː/ (dài): school, moon, food, room.</div>`},

{sec:"I", num:2, type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["laugh<u>ed</u>","danc<u>ed</u>","play<u>ed</u>","watch<u>ed</u>"],
 answer:"play<u>ed</u>",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có đuôi "-ed" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>laughed</span> <span class='wt'>v</span> <span class='p-phonetic'>/lɑːft/</span> = <span class='p-mean'>đã cười → -ed đọc /t/</span></div>
 <div><span class='p-word'>danced</span> <span class='wt'>v</span> <span class='p-phonetic'>/dɑːnst/</span> = <span class='p-mean'>đã nhảy → -ed đọc /t/</span></div>
 <div><span class='hl-green'>played</span> <span class='wt'>v</span> <span class='p-phonetic'>/pleɪd/</span> = <span class='p-mean'>đã chơi → -ed đọc /d/</span></div>
 <div><span class='p-word'>watched</span> <span class='wt'>v</span> <span class='p-phonetic'>/wɒtʃt/</span> = <span class='p-mean'>đã xem → -ed đọc /t/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"play" kết thúc bằng nguyên âm /eɪ/ (âm hữu thanh) nên -ed đọc là /d/. Ba từ kia kết thúc bằng âm vô thanh (/f/, /s/, /tʃ/) nên -ed đọc /t/ → played khác biệt.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>laugh /f/, dance /s/, watch /tʃ/ đều là âm VÔ THANH nên -ed đều đọc /t/, giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo đuôi -ed: đọc /t/ sau âm vô thanh (/p,k,f,s,ʃ,tʃ/); đọc /ɪd/ sau /t,d/; còn lại (âm hữu thanh + nguyên âm) đọc /d/.</div>`},

/* ---------- II. STRESS ---------- */
{sec:"II", head:"Chọn từ có trọng âm khác các từ còn lại.", num:3, type:"mcq",
 q:"3. Choose the word whose stress pattern is different.",
 disp:["connect","fancy","surround","expect"],
 answer:"fancy",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>connect</span> <span class='wt'>v</span> <span class='p-phonetic'>/kəˈnekt/</span> = <span class='p-mean'>kết nối → trọng âm 2</span></div>
 <div><span class='hl-green'>fancy</span> <span class='wt'>adj/v</span> <span class='p-phonetic'>/ˈfænsi/</span> = <span class='p-mean'>ưa thích/cầu kì → trọng âm 1</span></div>
 <div><span class='p-word'>surround</span> <span class='wt'>v</span> <span class='p-phonetic'>/səˈraʊnd/</span> = <span class='p-mean'>bao quanh → trọng âm 2</span></div>
 <div><span class='p-word'>expect</span> <span class='wt'>v</span> <span class='p-phonetic'>/ɪkˈspekt/</span> = <span class='p-mean'>mong đợi → trọng âm 2</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"FAN-cy" nhấn âm tiết ĐẦU, còn ba động từ kia đều nhấn âm tiết thứ HAI.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>connect, surround, expect đều nhấn âm tiết 2 nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: nhiều động từ 2 âm tiết nhấn âm SAU; nhưng "fancy" (tính từ/động từ) lại nhấn âm ĐẦU.</div>`},

{sec:"II", num:4, type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["talkative","concentrate","creative","bullying"],
 answer:"creative",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>talkative</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈtɔːkətɪv/</span> = <span class='p-mean'>nói nhiều → trọng âm 1</span></div>
 <div><span class='p-word'>concentrate</span> <span class='wt'>v</span> <span class='p-phonetic'>/ˈkɒnsntreɪt/</span> = <span class='p-mean'>tập trung → trọng âm 1</span></div>
 <div><span class='hl-green'>creative</span> <span class='wt'>adj</span> <span class='p-phonetic'>/kriˈeɪtɪv/</span> = <span class='p-mean'>sáng tạo → trọng âm 2</span></div>
 <div><span class='p-word'>bullying</span> <span class='wt'>n/v</span> <span class='p-phonetic'>/ˈbʊliɪŋ/</span> = <span class='p-mean'>bắt nạt → trọng âm 1</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"cre-A-tive" nhấn âm tiết thứ HAI, còn ba từ kia đều nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>talkative, concentrate, bullying đều nhấn âm tiết 1 nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: đuôi "-ative/-ing" thường không đổi trọng âm; nhưng "create → creative" nhấn ngay âm trước "-ive".</div>`},

/* ---------- III. MCQ ---------- */
{sec:"III", head:"Chọn từ hoặc cụm từ thích hợp nhất điền vào chỗ trống.", num:5, type:"mcq",
 q:"5. Farmers have warmed up to using ______ over harvesting grains manually.",
 disp:["water pumps","power generators","washing machines","combine harvesters"],
 answer:"combine harvesters",
 exp:`<div class="vnt">💬 Dịch: Nông dân đã dần ưa chuộng việc dùng máy gặt đập liên hợp thay vì thu hoạch ngũ cốc bằng tay.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>water pumps</span> <span class='wt'>n</span> = <span class='p-mean'>máy bơm nước</span></div>
 <div><span class='p-word'>power generators</span> <span class='wt'>n</span> = <span class='p-mean'>máy phát điện</span></div>
 <div><span class='p-word'>washing machines</span> <span class='wt'>n</span> = <span class='p-mean'>máy giặt</span></div>
 <div><span class='hl-green'>combine harvesters</span> <span class='wt'>n</span> = <span class='p-mean'>máy gặt đập liên hợp</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Vì nói về "harvesting grains" (thu hoạch ngũ cốc) → dụng cụ phù hợp là "combine harvesters" (máy gặt) thay cho làm bằng tay.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>máy bơm nước, máy phát điện, máy giặt đều không dùng để thu hoạch ngũ cốc.</span></li></ol>`},

{sec:"III", num:6, type:"mcq",
 q:"6. He was very tired after work; ______, he still stayed up to watch a football match.",
 disp:["moreover","therefore","although","however"],
 answer:"however",
 exp:`<div class="vnt">💬 Dịch: Anh ấy rất mệt sau giờ làm; tuy nhiên, anh ấy vẫn thức khuya để xem một trận bóng đá.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>moreover</span> <span class='wt'>adv</span> = <span class='p-mean'>hơn nữa (bổ sung)</span></div>
 <div><span class='p-word'>therefore</span> <span class='wt'>adv</span> = <span class='p-mean'>do đó (kết quả)</span></div>
 <div><span class='p-word'>although</span> <span class='wt'>conj</span> = <span class='p-mean'>mặc dù (đầu mệnh đề)</span></div>
 <div><span class='hl-green'>however</span> <span class='wt'>adv</span> = <span class='p-mean'>tuy nhiên (tương phản)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"rất mệt" >< "vẫn thức khuya xem bóng" là hai ý TRÁI NGƯỢC. Sau dấu chấm phẩy dùng trạng từ nối "however" (tuy nhiên) để nối hai vế tương phản.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>moreover (bổ sung), therefore (kết quả) sai logic; "although" là liên từ đứng ĐẦU mệnh đề, không đặt giữa sau dấu chấm phẩy như vậy.</span></li></ol>
 <div class="tip">🧠 Phân biệt: however/therefore/moreover là TRẠNG TỪ nối (đứng sau ; hoặc đầu câu, kèm dấu phẩy); although/because là LIÊN TỪ (đứng đầu mệnh đề).</div>`},

{sec:"III", num:7, type:"mcq",
 q:"7. My friend spent the whole afternoon learning how to ______ paper cranes.",
 disp:["fold","knit","surf","catch"],
 answer:"fold",
 exp:`<div class="vnt">💬 Dịch: Bạn tôi dành cả buổi chiều để học cách gấp hạc giấy.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>fold</span> <span class='wt'>v</span> = <span class='p-mean'>gấp (giấy)</span></div>
 <div><span class='p-word'>knit</span> <span class='wt'>v</span> = <span class='p-mean'>đan (len)</span></div>
 <div><span class='p-word'>surf</span> <span class='wt'>v</span> = <span class='p-mean'>lướt sóng/lướt web</span></div>
 <div><span class='p-word'>catch</span> <span class='wt'>v</span> = <span class='p-mean'>bắt</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"paper cranes" (hạc giấy – nghệ thuật origami) được tạo ra bằng cách GẤP giấy → "fold paper" = gấp giấy.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>knit (đan len), surf (lướt), catch (bắt) không đi với "paper cranes".</span></li></ol>`},

{sec:"III", num:8, type:"mcq",
 q:"8. He had discussed the problem ______ his parents before making a decision.",
 disp:["with","to","for","at"],
 answer:"with",
 exp:`<div class="vnt">💬 Dịch: Anh ấy đã bàn bạc vấn đề với bố mẹ trước khi đưa ra quyết định.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>with</span> <span class='wt'>prep</span> = <span class='p-mean'>với (discuss with sb)</span></div>
 <div><span class='p-word'>to</span> <span class='wt'>prep</span> = <span class='p-mean'>đến</span></div>
 <div><span class='p-word'>for</span> <span class='wt'>prep</span> = <span class='p-mean'>cho</span></div>
 <div><span class='p-word'>at</span> <span class='wt'>prep</span> = <span class='p-mean'>tại</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "discuss something WITH somebody" = bàn bạc điều gì đó với ai đó → dùng "with".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"discuss" chỉ đi với "with" khi nói bàn bạc cùng ai; to/for/at không đúng.</span></li></ol>
 <div class="tip">🧠 Nhớ: discuss WITH sb, talk WITH/TO sb, share sth WITH sb.</div>`},

{sec:"III", num:9, type:"mcq",
 q:"9. I believe this film ______ the way you think about robots.",
 disp:["is changing","will change","changes","changed"],
 answer:"will change",
 exp:`<div class="vnt">💬 Dịch: Tôi tin rằng bộ phim này sẽ thay đổi cách bạn suy nghĩ về người máy.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>is changing</span> = <span class='p-mean'>đang thay đổi (tiếp diễn)</span></div>
 <div><span class='hl-green'>will change</span> = <span class='p-mean'>sẽ thay đổi (tương lai)</span></div>
 <div><span class='p-word'>changes</span> = <span class='p-mean'>thay đổi (hiện tại đơn)</span></div>
 <div><span class='p-word'>changed</span> = <span class='p-mean'>đã thay đổi (quá khứ)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"I believe (that)..." dùng để nêu DỰ ĐOÁN/niềm tin về điều sắp xảy ra → dùng thì tương lai đơn "will change".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Bộ phim chưa xem xong nên chưa thể "đang/đã" thay đổi suy nghĩ; hiện tại đơn chỉ dùng cho sự thật chung, không phải dự đoán.</span></li></ol>
 <div class="tip">🧠 Mẹo: sau "I think / I believe / I hope..." nói về tương lai → thường dùng "will".</div>`},

{sec:"III", num:10, type:"mcq",
 q:'10. Laura: "Could you show me the way to the library, please?" – Mike: "______"',
 disp:["No, I'm not going to the library now.","Of course! It's right around the corner.","I often go to the library on weekends.","Sure, you can get there by bike."],
 answer:"Of course! It's right around the corner.",
 exp:`<div class="vnt">💬 Dịch: Laura: "Bạn chỉ giúp mình đường đến thư viện được không?" – Mike: "Tất nhiên rồi! Nó ngay góc phố đằng kia thôi."</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>No, I'm not going to the library now.</span> = <span class='p-mean'>không giúp (lạc đề)</span></div>
 <div><span class='hl-green'>Of course! It's right around the corner.</span> = <span class='p-mean'>đồng ý + chỉ đường</span></div>
 <div><span class='p-word'>I often go to the library on weekends.</span> = <span class='p-mean'>nói về thói quen (lạc đề)</span></div>
 <div><span class='p-word'>Sure, you can get there by bike.</span> = <span class='p-mean'>nói phương tiện, không chỉ đường</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Laura nhờ CHỈ ĐƯỜNG. Câu B vừa đồng ý ("Of course!") vừa chỉ đường ("right around the corner" = ngay góc phố) → phù hợp nhất.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>A từ chối và lạc đề; C nói thói quen; D nói phương tiện đi lại chứ không chỉ vị trí/đường đi.</span></li></ol>`},

/* ---------- IV. CLOSEST MEANING ---------- */
{sec:"IV", head:"Chọn từ có nghĩa GẦN NHẤT (đồng nghĩa) với từ gạch chân.", num:11, type:"mcq",
 q:"11. We hiked to the top and enjoyed the <u>picturesque</u> view of the rolling hills.",
 disp:["traditional","popular","terrible","beautiful"],
 answer:"beautiful",
 exp:`<div class="vnt">💬 Dịch: Chúng tôi leo lên đỉnh và ngắm khung cảnh đẹp như tranh của những ngọn đồi thoai thoải.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>traditional</span> <span class='wt'>adj</span> = <span class='p-mean'>truyền thống</span></div>
 <div><span class='p-word'>popular</span> <span class='wt'>adj</span> = <span class='p-mean'>nổi tiếng/phổ biến</span></div>
 <div><span class='p-word'>terrible</span> <span class='wt'>adj</span> = <span class='p-mean'>tồi tệ (trái nghĩa)</span></div>
 <div><span class='hl-green'>beautiful</span> <span class='wt'>adj</span> = <span class='p-mean'>đẹp</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"picturesque" nghĩa là "đẹp như tranh vẽ" → đồng nghĩa gần nhất là "beautiful" (đẹp).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>traditional/popular khác nghĩa; "terrible" (tồi tệ) là TRÁI NGHĨA.</span></li></ol>
 <div class="tip">🧠 Nhớ: picturesque = beautiful = scenic = stunning (đều tả cảnh đẹp).</div>`},

{sec:"IV", num:12, type:"mcq",
 q:"12. He didn't win the <u>contest</u>, but the experience was worth every moment.",
 disp:["victory","reputation","competition","award"],
 answer:"competition",
 exp:`<div class="vnt">💬 Dịch: Anh ấy không thắng cuộc thi, nhưng trải nghiệm đó đáng giá từng khoảnh khắc.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>victory</span> <span class='wt'>n</span> = <span class='p-mean'>chiến thắng</span></div>
 <div><span class='p-word'>reputation</span> <span class='wt'>n</span> = <span class='p-mean'>danh tiếng</span></div>
 <div><span class='hl-green'>competition</span> <span class='wt'>n</span> = <span class='p-mean'>cuộc thi</span></div>
 <div><span class='p-word'>award</span> <span class='wt'>n</span> = <span class='p-mean'>giải thưởng</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"contest" nghĩa là "cuộc thi/cuộc tranh tài" → đồng nghĩa gần nhất là "competition".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>victory (sự thắng), award (giải thưởng), reputation (danh tiếng) là các khái niệm khác, không đồng nghĩa với "cuộc thi".</span></li></ol>`},

/* ---------- V. OPPOSITE MEANING ---------- */
{sec:"V", head:"Chọn từ có nghĩa TRÁI NGƯỢC (trái nghĩa) với từ gạch chân.", num:13, type:"mcq",
 q:"13. The <u>ancient</u> village has remained unchanged for hundreds of years.",
 disp:["modern","peaceful","spacious","rural"],
 answer:"modern",
 exp:`<div class="vnt">💬 Dịch: Ngôi làng cổ kính vẫn giữ nguyên vẹn suốt hàng trăm năm qua.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>modern</span> <span class='wt'>adj</span> = <span class='p-mean'>hiện đại (trái nghĩa)</span></div>
 <div><span class='p-word'>peaceful</span> <span class='wt'>adj</span> = <span class='p-mean'>yên bình</span></div>
 <div><span class='p-word'>spacious</span> <span class='wt'>adj</span> = <span class='p-mean'>rộng rãi</span></div>
 <div><span class='p-word'>rural</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc nông thôn</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"ancient" (cổ xưa, lâu đời) có nghĩa TRÁI NGƯỢC với "modern" (hiện đại, mới mẻ).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>peaceful, spacious, rural không phải trái nghĩa của "cổ xưa".</span></li></ol>
 <div class="tip">🧠 Nhớ cặp trái nghĩa: ancient/old ⇄ modern/new (cổ ⇄ hiện đại).</div>`},

{sec:"V", num:14, type:"mcq",
 q:"14. The street was <u>crowded</u> with people rushing to work in the morning.",
 disp:["busy","noisy","empty","narrow"],
 answer:"empty",
 exp:`<div class="vnt">💬 Dịch: Con phố đông nghịt người vội vã đi làm vào buổi sáng.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>busy</span> <span class='wt'>adj</span> = <span class='p-mean'>nhộn nhịp (gần nghĩa)</span></div>
 <div><span class='p-word'>noisy</span> <span class='wt'>adj</span> = <span class='p-mean'>ồn ào</span></div>
 <div><span class='hl-green'>empty</span> <span class='wt'>adj</span> = <span class='p-mean'>vắng vẻ (trái nghĩa)</span></div>
 <div><span class='p-word'>narrow</span> <span class='wt'>adj</span> = <span class='p-mean'>chật hẹp</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"crowded" (đông đúc) có nghĩa TRÁI NGƯỢC với "empty" (vắng vẻ, trống trải).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"busy" (nhộn nhịp) và "noisy" (ồn) lại GẦN nghĩa với crowded; "narrow" (hẹp) nói về độ rộng, không phải trái nghĩa của "đông".</span></li></ol>
 <div class="tip">🧠 Nhớ cặp trái nghĩa: crowded (đông) ⇄ empty/deserted (vắng).</div>`},

/* ---------- VIII. Q25 error + Q26 sign ---------- */
{sec:"VIII", head:"Trả lời đúng cho mỗi câu hỏi sau (tìm lỗi sai & đọc biển báo).", num:25, type:"error",
 q:"25. If you <u>exercise</u> regularly, <u>your</u> risk <u>of</u> heart disease will be <u>much</u> higher.",
 parts:["exercise","your","of","much"],
 correctLetter:0, corrAccept:["don't exercise","dont exercise","do not exercise","not exercise"],
 exp:`<div class="vnt">💬 Dịch (câu đúng): Nếu bạn KHÔNG tập thể dục thường xuyên, nguy cơ mắc bệnh tim của bạn sẽ cao hơn nhiều.</div>
 <ol><li>Lỗi sai ở <b>A. exercise</b> → sửa thành <span class='hl-green'>don't exercise</span>.</li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đây là lỗi LOGIC. Tập thể dục đều đặn giúp GIẢM nguy cơ bệnh tim, chứ không làm nó "cao hơn". Để câu hợp lý với "will be much higher" (cao hơn), phải là "If you DON'T exercise regularly..." (Nếu bạn KHÔNG tập...).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>your (sở hữu – đúng), of (risk of – đúng), much (much + so sánh hơn – đúng). Chỉ "exercise" sai vì trái với logic sức khỏe.</span></li></ol>
 <div class="tip">🧠 Mẹo: có loại bài tìm lỗi kiểm tra LOGIC. Hãy đọc nghĩa cả câu — nếu vô lý, từ gây vô lý chính là lỗi. Ở đây: tập luyện phải làm GIẢM nguy cơ.</div>`},

/* ================= AUDIO ================= */
let AC;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function ding(){
  const c=ac(); const now=c.currentTime;
  [880,1320,1760].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0,now+i*0.08);
    g.gain.linearRampToValueAtTime(0.25,now+i*0.08+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.4);
    o.start(now+i*0.08); o.stop(now+i*0.08+0.42);
  });
}
function buzz(){
  const c=ac(); const now=c.currentTime;
  [300,220,160].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='square'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.18,now+i*0.13);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.13+0.12);
    o.start(now+i*0.13); o.stop(now+i*0.13+0.13);
  });
}

/* ================= CONFETTI ================= */
function confetti(){
  const cv=document.createElement('canvas'); cv.className='confetti';
  cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); const cols=['#ffcf4d','#ff6fa5','#7c4dff','#00D26A','#56ccf2','#ff9ec7'];
  const P=[]; for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height); t++;
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();});
    if(t<130)requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ================= HELPERS ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase()
  .replace(/won['’]t/g,'will not')
  .replace(/can['’]t/g,'can not')
  .replace(/n['’]t/g,' not')
  .replace(/['’]/g,'')
  .replace(/[.,!?;:"…\/]/g,' ')
  .replace(/\s+/g,' ').trim();}

const state={};
let answered=0;
const TOTAL=DATA.length;

function updateProg(){
  document.getElementById('progtxt').textContent=answered+' / '+TOTAL;
  document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%';
}

/* ================= RENDER ================= */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){
    const sec=document.createElement('div'); sec.className='sec';
    sec.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;
    quiz.appendChild(sec);
  }
  const card=document.createElement('div'); card.className='card'; card.id='c'+idx;
  const body=document.createElement('div');
  body.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  card.appendChild(body);
  const zone=document.createElement('div'); card.appendChild(zone);
  const exp=document.createElement('div'); exp.className='exp'; exp.innerHTML=it.exp; card.appendChild(exp);
  quiz.appendChild(card);

  if(it.type==='mcq') renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange') renderFill(it,idx,zone,exp);
  else if(it.type==='error') renderError(it,idx,zone,exp);
});
updateProg();

function markDone(idx,ok){ if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg();} }

function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div'); wrap.className='opts';
  const opts=shuffle(it.disp);
  opts.forEach(txt=>{
    const b=document.createElement('div'); b.className='opt'; b.innerHTML=txt;
    b.onclick=()=>{
      if(state[idx])return;
      const all=wrap.querySelectorAll('.opt'); all.forEach(x=>x.classList.add('locked'));
      const isC=(txt===it.answer);
      if(isC){b.classList.add('correct');ding();confetti();markDone(idx,true);}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);
        all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim');});
        setTimeout(()=>b.classList.remove('shake'),450);
      }
      exp.classList.add('open');
    };
    wrap.appendChild(b);
  });
  zone.appendChild(wrap);
}

function renderFill(it,idx,zone,exp){
  const row=document.createElement('div'); row.className='fillrow';
  const inp=document.createElement('input'); inp.className='tin'; inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button'); btn.className='btn-check'; btn.textContent='Kiểm tra';
  row.appendChild(inp); row.appendChild(btn); zone.appendChild(row);
  if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='💡 '+it.hint;zone.appendChild(h);}
  const acc=it.accept.map(norm);
  function check(){
    if(state[idx])return;
    const ok=acc.includes(norm(inp.value));
    inp.disabled=true; btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

function renderError(it,idx,zone,exp){
  const q=document.createElement('div'); q.className='err-parts';
  let labeled=it.q.replace(/^\d+\.\s*/,''); let li=0; const L=['A','B','C','D'];
  labeled=labeled.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);
  q.innerHTML=labeled; zone.appendChild(q);
  const letters=document.createElement('div'); letters.className='letters';
  const corr=document.createElement('div'); corr.className='corrbox';
  const acc=it.corrAccept.map(norm);
  let chosen=null;
  L.forEach((lab,i)=>{
    const b=document.createElement('button'); b.className='lbtn'; b.textContent=lab;
    b.onclick=()=>{
      if(state[idx])return;
      letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); chosen=i;
      corr.classList.add('show'); corr.querySelector('input').focus();
    };
    letters.appendChild(b);
  });
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div><div class="hint">💡 Chọn chữ cái chứa lỗi, gõ từ/cụm từ đúng vào ô rồi bấm Kiểm tra (ví dụ: don't exercise).</div>`;
  zone.appendChild(corr);
  const inp=corr.querySelector('input'); const btn=corr.querySelector('button');
  function check(){
    if(state[idx])return;
    if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return;}
    const letterOK=(chosen===it.correctLetter);
    const textOK=acc.includes(norm(inp.value));
    const ok=letterOK&&textOK;
    inp.disabled=true; btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel');});
    letters.children[it.correctLetter].classList.add('correct');
    if(!letterOK)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

/* ================= SUBMIT / RESULT ================= */
function openName(){ document.getElementById('nameMask').classList.add('show'); setTimeout(()=>document.getElementById('nameInput').focus(),100); }
function doSubmit(){
  const inp=document.getElementById('nameInput'); const w=document.getElementById('nameWarn');
  const name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err'); w.textContent='';
  document.getElementById('nameMask').classList.remove('show');
  showResult(name);
}
function showResult(name){
  let correct=0; for(let i=0;i<TOTAL;i++) if(state[i]==='ok') correct++;
  const pct=correct/TOTAL;
  const s10=(pct*10).toFixed(2);
  let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con rực rỡ như cầu vồng! 🏆';fb='🏆🌈🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút là chạm cầu vồng! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi làm lại nha! 🌈';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('resGreet').textContent=greet;
  document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';
  document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'); const fbEl=document.getElementById('resFallback');
  fbEl.textContent=fb; fbEl.style.display='none'; im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none';};
  im.onerror=()=>{im.style.display='none';fbEl.style.display='block';};
  im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block';}},2500);
  document.getElementById('resMask').classList.add('show');
  if(pct>=0.6){confetti();ding();}
}

/* ================= FLOATING PATTERN ================= */
(function(){
  const icons=['🦋','🌸','🌼','🌈','🐝','☀️','☁️','🐦','🌷','🍄','🌿','🐞','🌻'];
  const p=document.getElementById('pattern');
  for(let i=0;i<15;i++){
    const s=document.createElement('span');
    s.className='float'; s.textContent=icons[i%icons.length];
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(17+Math.random()*17)+'s';
    s.style.animationDelay=(-Math.random()*24)+'s';
    s.style.fontSize=(1.6+Math.random()*1.9)+'rem';
    p.appendChild(s);
  }
})();
</script>
