<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 2 · Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#0077b6; --p3:#06d6a0; --p4:#ff70a6; --p5:#48cae4;
  --green:#00D26A; --red:#FF4757; --ink:#0b3a4a;
  --aqua:#00e0d5; --coral:#ff8fab;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
  line-height:1.55; overflow-x:hidden; position:relative;
  background:linear-gradient(-45deg,#0096c7,#00b4d8,#48cae4,#06d6a0,#0077b6,#5eead4);
  background-size:400% 400%; animation:bgmove 18s ease infinite;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.4rem;opacity:.34;animation:swim linear infinite;filter:drop-shadow(0 4px 8px rgba(0,60,80,.3))}
@keyframes swim{0%{transform:translateX(-12vw) translateY(0)}50%{transform:translateX(50vw) translateY(-30px)}100%{transform:translateX(115vw) translateY(0)}}
.pattern .bub{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,255,255,.15));border:1px solid rgba(255,255,255,.4);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.7}90%{opacity:.5}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}

.topbar{
  text-align:center;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);
  border:1.5px solid rgba(0,224,213,.5);border-radius:22px;padding:14px 16px;margin-bottom:16px;
  box-shadow:0 0 26px rgba(0,224,213,.3),0 10px 30px rgba(0,60,90,.3);
}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(0,119,182,.55);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 10px var(--aqua),0 3px 10px rgba(0,60,90,.4)}
.topbar p{font-size:.78rem;color:#eafeff;opacity:.95;margin-top:2px}

.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(0,60,90,.25);backdrop-filter:blur(12px);border-radius:30px;padding:5px;border:1.5px solid rgba(0,224,213,.4);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.28);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--coral));border-radius:20px;transition:width .4s ease;box-shadow:0 0 10px var(--aqua)}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 0 6px var(--aqua)}

.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--aqua),var(--p1));color:#fff;font-weight:900;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 16px rgba(0,224,213,.6)}
.sec h2{color:#fff;font-size:1.02rem;font-weight:800;text-shadow:0 0 8px rgba(0,60,90,.5);flex:1}

.card{
  background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-radius:20px;
  padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(0,224,213,.55);
  box-shadow:0 0 20px rgba(0,224,213,.18),0 12px 26px rgba(0,60,90,.25);
}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--p5),var(--p3));color:#063a3a;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 0 12px rgba(72,202,228,.6)}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--coral)}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{
  background:linear-gradient(135deg,#fff,#e8fbff);border:2px solid rgba(0,119,182,.22);
  border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,119,182,.22),0 8px 14px rgba(0,60,90,.12);
  transition:transform .12s ease,box-shadow .12s ease,background .2s;text-align:center;user-select:none;
}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(0,119,182,.28),0 0 18px rgba(0,224,213,.4)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#06d6a0);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e,0 0 18px rgba(0,210,106,.6)}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}
.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{
  font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;
  border:2px solid rgba(0,119,182,.3);background:rgba(255,255,255,.95);outline:none;flex:1;min-width:180px;color:var(--ink);
  box-shadow:inset 0 2px 5px rgba(0,60,90,.08);
}
.tin:focus{border-color:var(--coral);box-shadow:0 0 0 4px rgba(255,143,171,.22)}
.tin.ok{border-color:var(--green);background:#eafff3}
.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.1rem;font-weight:800;color:var(--p1)}
.btn-check{
  font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--p1),var(--p5));padding:11px 18px;border-radius:14px;
  box-shadow:0 5px 0 rgba(0,80,130,.5),0 0 14px rgba(72,202,228,.4);transition:transform .1s;
}
.btn-check:hover{transform:translateY(-2px)}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,80,130,.5)}
.hint{font-size:.82rem;color:#0a6a86;font-weight:600;margin-top:7px;font-style:italic}

.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{
  width:46px;height:46px;border-radius:14px;border:2px solid rgba(0,119,182,.3);
  background:linear-gradient(135deg,#fff,#e8fbff);font-weight:900;font-size:1.1rem;cursor:pointer;color:var(--p1);
  box-shadow:0 5px 0 rgba(0,119,182,.22);transition:transform .12s;
}
.lbtn:hover:not(.locked){transform:scale(1.08);box-shadow:0 5px 0 rgba(0,119,182,.22),0 0 14px rgba(0,224,213,.5)}
.lbtn.sel{background:linear-gradient(135deg,var(--p1),var(--p5));color:#fff;box-shadow:0 0 14px rgba(72,202,228,.6)}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#06d6a0);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}
.corrbox.show{display:block}

.exp{max-height:0;overflow:hidden;transition:max-height .5s ease,margin .3s,padding .3s;background:rgba(0,119,182,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:1600px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(0,119,182,.3)}
.exp ol{margin:6px 0 2px 18px}
.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#e0fbff,#e0fff4);border-left:5px solid var(--aqua);border-radius:10px;padding:8px 12px;color:#0a5a6b;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.p-word{color:#2563eb;font-weight:800}
.hl-green{color:#0a9d54;font-weight:900}
.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(0,119,182,.15);color:#065a86;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}
.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}

.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{
  font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--coral),var(--p1),var(--aqua));background-size:200% 200%;animation:bgmove 6s ease infinite;
  padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(0,80,130,.5),0 0 28px rgba(0,224,213,.5);transition:transform .1s;
}
.btn-submit:hover{transform:translateY(-3px)}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,80,130,.5)}

.mask{position:fixed;inset:0;background:rgba(0,40,60,.6);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:rgba(255,255,255,.96);border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px rgba(0,224,213,.4),0 20px 50px rgba(0,40,60,.5);border:2px solid rgba(0,224,213,.5);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#345a65;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(0,119,182,.3);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--coral)}
.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:floaty2 2s ease-in-out infinite}
@keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p3),var(--p5));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(0,140,120,.4)}
.btn-again:hover{transform:translateY(-2px)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#eafeff;font-size:.75rem;opacity:.9;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>

<div class="wrap">
  <div class="topbar">
    <div class="tag">🐠 Giáo viên tạo: Ms MS Chí Nên</div>
    <h1>🌊 TEST 2</h1>
    <p>The First Midterm Tests · Ocean English</p>
  </div>

  <div class="prog">
    <div class="txt" id="progtxt">0 / 22</div>
    <div class="bar"><div class="fill" id="progfill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="submit-wrap">
    <button class="btn-submit" onclick="openName()">🐳 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>

  <div class="footer">✨ Made with love for young divers · Ms MS Chí Nên ✨</div>
</div>

<div class="mask" id="nameMask">
  <div class="modal">
    <h2>🐢 Thợ lặn nhí tên gì nào?</h2>
    <p>Nhập tên của con để xem kết quả nhé!</p>
    <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
    <div class="warn" id="nameWarn"></div>
    <button class="btn-again" style="background:linear-gradient(135deg,var(--p1),var(--p5));box-shadow:0 6px 0 rgba(0,80,130,.4)" onclick="doSubmit()">Xem kết quả 🎉</button>
  </div>
</div>

<div class="mask" id="resMask">
  <div class="modal">
    <h2 id="resGreet"></h2>
    <div class="score-big" id="resScore"></div>
    <div class="score-10" id="resScore10"></div>
    <img class="meme" id="resMeme" alt="meme" style="display:none">
    <div class="meme-fallback" id="resFallback"></div>
    <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
    <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
/* ================= DATA (TEST 2) ================= */
const DATA=[
/* ---------- I. PHONETICS ---------- */
{sec:"I", head:"Chọn từ có phần gạch chân được phát âm khác các từ còn lại.", num:1, type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["d<u>i</u>scuss","fam<u>i</u>ly","serv<u>i</u>ce","v<u>i</u>llage"],
 answer:"fam<u>i</u>ly",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "i" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>discuss</span> <span class='wt'>v</span> <span class='p-phonetic'>/dɪˈskʌs/</span> = <span class='p-mean'>thảo luận → i đọc /ɪ/</span></div>
 <div><span class='hl-green'>family</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈfæməli/</span> = <span class='p-mean'>gia đình → i đọc /ə/</span></div>
 <div><span class='p-word'>service</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈsɜːvɪs/</span> = <span class='p-mean'>dịch vụ → i đọc /ɪ/</span></div>
 <div><span class='p-word'>village</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈvɪlɪdʒ/</span> = <span class='p-mean'>ngôi làng → i đọc /ɪ/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trong "family", chữ "i" nằm ở âm tiết không mang trọng âm nên bị đọc nhẹ thành /ə/ (âm ơ mờ). Ba từ còn lại đọc "i" là /ɪ/ → family khác biệt.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>discuss, service, village đều có "i" đọc là /ɪ/ (âm i ngắn) nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: nguyên âm ở âm tiết KHÔNG được nhấn thường "lười" thành /ə/ (schwa) — âm phổ biến nhất trong tiếng Anh.</div>`},

{sec:"I", num:2, type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["se<u>ss</u>ion","pre<u>ss</u>ure","me<u>ss</u>age","pa<u>ss</u>ion"],
 answer:"me<u>ss</u>age",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có phần "ss" gạch chân đọc khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>session</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈseʃn/</span> = <span class='p-mean'>buổi/phiên → ss đọc /ʃ/</span></div>
 <div><span class='p-word'>pressure</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈpreʃə/</span> = <span class='p-mean'>áp lực → ss đọc /ʃ/</span></div>
 <div><span class='hl-green'>message</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈmesɪdʒ/</span> = <span class='p-mean'>tin nhắn → ss đọc /s/</span></div>
 <div><span class='p-word'>passion</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈpæʃn/</span> = <span class='p-mean'>đam mê → ss đọc /ʃ/</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"message" có "ss" đọc là /s/ (âm x). Ba từ kia có "ss" nằm trước "-ion/-ure" nên đọc thành /ʃ/ (âm s cong lưỡi) → message khác biệt.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>session, pressure, passion đều có "ssi/ssu" tạo âm /ʃ/ nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: "ss + ion/ure" thường đọc /ʃ/ (session, pressure, passion). Còn "ss" thường lại đọc /s/ (message, class).</div>`},

/* ---------- II. STRESS ---------- */
{sec:"II", head:"Chọn từ có trọng âm khác các từ còn lại.", num:3, type:"mcq",
 q:"3. Choose the word whose stress pattern is different.",
 disp:["problem","cycle","balance","collect"],
 answer:"collect",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>problem</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈprɒbləm/</span> = <span class='p-mean'>vấn đề → trọng âm 1</span></div>
 <div><span class='p-word'>cycle</span> <span class='wt'>n/v</span> <span class='p-phonetic'>/ˈsaɪkl/</span> = <span class='p-mean'>chu kì/đạp xe → trọng âm 1</span></div>
 <div><span class='p-word'>balance</span> <span class='wt'>n/v</span> <span class='p-phonetic'>/ˈbæləns/</span> = <span class='p-mean'>cân bằng → trọng âm 1</span></div>
 <div><span class='hl-green'>collect</span> <span class='wt'>v</span> <span class='p-phonetic'>/kəˈlekt/</span> = <span class='p-mean'>thu thập → trọng âm 2</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"col-LECT" nhấn âm tiết thứ hai, trong khi ba từ kia đều nhấn âm tiết đầu tiên.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>problem, cycle, balance đều nhấn âm tiết 1 nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: nhiều động từ 2 âm tiết nhấn âm SAU (col-LECT), còn danh từ 2 âm tiết thường nhấn âm ĐẦU.</div>`},

{sec:"II", num:4, type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["picturesque","gardening","understand","Vietnamese"],
 answer:"gardening",
 exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>picturesque</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˌpɪktʃəˈresk/</span> = <span class='p-mean'>đẹp như tranh → trọng âm 3</span></div>
 <div><span class='hl-green'>gardening</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈɡɑːdnɪŋ/</span> = <span class='p-mean'>làm vườn → trọng âm 1</span></div>
 <div><span class='p-word'>understand</span> <span class='wt'>v</span> <span class='p-phonetic'>/ˌʌndəˈstænd/</span> = <span class='p-mean'>hiểu → trọng âm 3</span></div>
 <div><span class='p-word'>Vietnamese</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˌvjetnəˈmiːz/</span> = <span class='p-mean'>thuộc Việt Nam → trọng âm 3</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"GAR-den-ing" nhấn âm tiết ĐẦU, còn ba từ kia (từ 3 âm tiết) đều nhấn âm tiết thứ BA (cuối).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>picturesque, understand, Vietnamese đều nhấn âm tiết 3 nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: đuôi "-esque" (picturesque) và "-ese" (Vietnamese) luôn được nhấn trọng âm.</div>`},

/* ---------- III. MCQ ---------- */
{sec:"III", head:"Chọn từ hoặc cụm từ thích hợp nhất điền vào chỗ trống.", num:5, type:"mcq",
 q:"5. Farmers use water from the ______ to water their crops during dry seasons.",
 disp:["canal","orchard","harvest","resort"],
 answer:"canal",
 exp:`<div class="vnt">💬 Dịch: Nông dân dùng nước từ con kênh để tưới cây trồng vào mùa khô.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>canal</span> <span class='wt'>n</span> = <span class='p-mean'>kênh, mương nước</span></div>
 <div><span class='p-word'>orchard</span> <span class='wt'>n</span> = <span class='p-mean'>vườn cây ăn quả</span></div>
 <div><span class='p-word'>harvest</span> <span class='wt'>n</span> = <span class='p-mean'>vụ thu hoạch</span></div>
 <div><span class='p-word'>resort</span> <span class='wt'>n</span> = <span class='p-mean'>khu nghỉ dưỡng</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"use water from the ___" → nơi chứa/dẫn nước là "canal" (kênh mương). Nông dân lấy nước từ kênh để tưới cây → hợp logic.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>orchard (vườn), harvest (vụ mùa), resort (khu nghỉ) không phải nguồn nước để tưới cây.</span></li></ol>`},

{sec:"III", num:6, type:"mcq",
 q:"6. You ______ spend too much time on social media; it's easy to get addicted.",
 disp:["mightn't","must","shouldn't","could"],
 answer:"shouldn't",
 exp:`<div class="vnt">💬 Dịch: Bạn không nên dành quá nhiều thời gian trên mạng xã hội; rất dễ bị nghiện.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>mightn't</span> <span class='wt'>modal</span> = <span class='p-mean'>có lẽ không</span></div>
 <div><span class='p-word'>must</span> <span class='wt'>modal</span> = <span class='p-mean'>phải</span></div>
 <div><span class='hl-green'>shouldn't</span> <span class='wt'>modal</span> = <span class='p-mean'>không nên</span></div>
 <div><span class='p-word'>could</span> <span class='wt'>modal</span> = <span class='p-mean'>có thể</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Vế sau cảnh báo "dễ bị nghiện" → đây là lời KHUYÊN CAN. "shouldn't" (không nên) diễn tả lời khuyên không nên làm gì.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"must" (phải – bắt buộc), "could" (có thể) mang nghĩa ngược; "mightn't" (có lẽ không) không dùng để khuyên can.</span></li></ol>`},

{sec:"III", num:7, type:"mcq",
 q:"7. In the countryside, my kids spend the summer running around and shouting ______.",
 disp:["happier","happily","happiness","happy"],
 answer:"happily",
 exp:`<div class="vnt">💬 Dịch: Ở vùng quê, các con tôi dành cả mùa hè chạy nhảy và hò hét một cách vui vẻ.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>happier</span> <span class='wt'>adj</span> = <span class='p-mean'>vui hơn (so sánh)</span></div>
 <div><span class='hl-green'>happily</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách vui vẻ</span></div>
 <div><span class='p-word'>happiness</span> <span class='wt'>n</span> = <span class='p-mean'>niềm hạnh phúc</span></div>
 <div><span class='p-word'>happy</span> <span class='wt'>adj</span> = <span class='p-mean'>vui vẻ (tính từ)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cần TRẠNG TỪ để bổ nghĩa cho các động từ "running around and shouting" (chạy nhảy, hò hét như thế nào?) → "happily".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>happier/happy là tính từ (bổ nghĩa cho danh từ); happiness là danh từ → không bổ nghĩa được cho động từ chỉ hành động.</span></li></ol>`},

{sec:"III", num:8, type:"mcq",
 q:"8. Don't put much pressure ______ yourself to be perfect all the time.",
 disp:["on","at","to","of"],
 answer:"on",
 exp:`<div class="vnt">💬 Dịch: Đừng đặt quá nhiều áp lực lên bản thân để lúc nào cũng phải hoàn hảo.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>on</span> <span class='wt'>prep</span> = <span class='p-mean'>lên (put pressure on)</span></div>
 <div><span class='p-word'>at</span> <span class='wt'>prep</span> = <span class='p-mean'>tại</span></div>
 <div><span class='p-word'>to</span> <span class='wt'>prep</span> = <span class='p-mean'>đến</span></div>
 <div><span class='p-word'>of</span> <span class='wt'>prep</span> = <span class='p-mean'>của</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "put pressure ON somebody" = đặt/gây áp lực lên ai đó → dùng giới từ "on".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>at/to/of không đi với "put pressure" theo nghĩa gây áp lực lên ai.</span></li></ol>
 <div class="tip">🧠 Ghi nhớ: put pressure ON sb · depend ON · focus ON — nhiều cụm hay dùng "on".</div>`},

{sec:"III", num:9, type:"mcq",
 q:"9. Three years ago, Mr Davis ______ me for the national tennis competition.",
 disp:["coaches","is coaching","coached","will coach"],
 answer:"coached",
 exp:`<div class="vnt">💬 Dịch: Ba năm trước, thầy Davis đã huấn luyện tôi cho giải quần vợt quốc gia.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>coaches</span> = <span class='p-mean'>hiện tại đơn (sai)</span></div>
 <div><span class='p-word'>is coaching</span> = <span class='p-mean'>tiếp diễn (sai)</span></div>
 <div><span class='hl-green'>coached</span> = <span class='p-mean'>đã huấn luyện (quá khứ)</span></div>
 <div><span class='p-word'>will coach</span> = <span class='p-mean'>tương lai (sai)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "Three years ago" (ba năm trước) → thì quá khứ đơn. "coach" là động từ có quy tắc → thêm -ed → "coached".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"...ago" luôn đi với quá khứ, nên hiện tại đơn/tiếp diễn/tương lai đều không hợp.</span></li></ol>
 <div class="tip">🧠 Mẹo: cụm "... ago" (yesterday, last..., in 2010) là dấu hiệu chắc chắn của thì QUÁ KHỨ ĐƠN.</div>`},

{sec:"III", num:10, type:"mcq",
 q:"10. Though we live far apart, we always keep in ______ through social media.",
 disp:["mind","line","touch","place"],
 answer:"touch",
 exp:`<div class="vnt">💬 Dịch: Dù sống cách xa nhau, chúng tôi vẫn luôn giữ liên lạc qua mạng xã hội.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>keep in mind</span> = <span class='p-mean'>ghi nhớ</span></div>
 <div><span class='p-word'>keep in line</span> = <span class='p-mean'>giữ trật tự/khuôn phép</span></div>
 <div><span class='hl-green'>keep in touch</span> = <span class='p-mean'>giữ liên lạc</span></div>
 <div><span class='p-word'>keep in place</span> = <span class='p-mean'>giữ đúng vị trí</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Thành ngữ "keep in touch (with sb)" = giữ liên lạc. Qua mạng xã hội mọi người giữ liên lạc → hợp nghĩa.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>keep in mind (ghi nhớ), keep in line (giữ khuôn phép), keep in place (giữ nguyên chỗ) đều khác nghĩa "liên lạc".</span></li></ol>`},

{sec:"III", num:11, type:"mcq",
 q:"11. Minh practises cooking daily, ______ he dreams of becoming a professional chef.",
 disp:["for","or","but","so"],
 answer:"for",
 exp:`<div class="vnt">💬 Dịch: Minh luyện nấu ăn mỗi ngày, vì cậu ấy mơ ước trở thành một đầu bếp chuyên nghiệp.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>for</span> <span class='wt'>conj</span> = <span class='p-mean'>vì (= because)</span></div>
 <div><span class='p-word'>or</span> <span class='wt'>conj</span> = <span class='p-mean'>hoặc</span></div>
 <div><span class='p-word'>but</span> <span class='wt'>conj</span> = <span class='p-mean'>nhưng</span></div>
 <div><span class='p-word'>so</span> <span class='wt'>conj</span> = <span class='p-mean'>vì vậy</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Ở đây "for" là liên từ mang nghĩa "vì/bởi vì" (= because), dùng để nêu LÝ DO: Minh luyện nấu ăn VÌ cậu mơ làm đầu bếp.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"or" (lựa chọn), "but" (tương phản) sai logic. "so" (vì vậy) đảo ngược nhân–quả: mơ làm đầu bếp mới là NGUYÊN NHÂN của việc luyện tập, nên không dùng "so".</span></li></ol>
 <div class="tip">🧠 Lưu ý: ngoài nghĩa "cho/trong", "for" còn là liên từ = "because" (vì), thường đứng giữa câu sau dấu phẩy.</div>`},

{sec:"III", num:12, type:"mcq",
 q:"12. It's common for teenagers to ______ photos on Facebook in hopes of getting likes.",
 disp:["load","post","let","browse"],
 answer:"post",
 exp:`<div class="vnt">💬 Dịch: Việc thanh thiếu niên đăng ảnh lên Facebook với hy vọng nhận được lượt thích là chuyện thường thấy.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>load</span> <span class='wt'>v</span> = <span class='p-mean'>chất/nạp</span></div>
 <div><span class='hl-green'>post</span> <span class='wt'>v</span> = <span class='p-mean'>đăng (bài/ảnh)</span></div>
 <div><span class='p-word'>let</span> <span class='wt'>v</span> = <span class='p-mean'>cho phép</span></div>
 <div><span class='p-word'>browse</span> <span class='wt'>v</span> = <span class='p-mean'>lướt/xem qua</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Collocation mạng xã hội "post photos" = đăng ảnh. Đăng ảnh để nhận like → hợp ngữ cảnh.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>load (chất hàng), let (cho phép), browse (lướt xem) không đi với "photos" theo nghĩa "đăng lên".</span></li></ol>`},

{sec:"III", num:13, type:"mcq",
 q:"13. They lived in a small village ______ by forests and winding rivers.",
 disp:["surrounded","protected","divided","connected"],
 answer:"surrounded",
 exp:`<div class="vnt">💬 Dịch: Họ sống trong một ngôi làng nhỏ được bao quanh bởi rừng cây và những dòng sông uốn lượn.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>surrounded</span> <span class='wt'>v(pp)</span> = <span class='p-mean'>được bao quanh</span></div>
 <div><span class='p-word'>protected</span> <span class='wt'>v(pp)</span> = <span class='p-mean'>được bảo vệ</span></div>
 <div><span class='p-word'>divided</span> <span class='wt'>v(pp)</span> = <span class='p-mean'>bị chia cắt</span></div>
 <div><span class='p-word'>connected</span> <span class='wt'>v(pp)</span> = <span class='p-mean'>được kết nối</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm "surrounded BY sth" = được bao quanh bởi cái gì. Làng nằm giữa rừng và sông → được bao quanh → "surrounded by forests and rivers".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>protected (bảo vệ), divided (chia cắt), connected (kết nối) đều không diễn tả cảnh "nằm ở giữa, xung quanh là rừng và sông".</span></li></ol>`},

{sec:"III", num:14, type:"mcq",
 q:'14. Sam: "Would you like to join us for dinner this evening?" – Oscar: "______"',
 disp:["That sounds great. I'd love to!","Actually, I'm really hungry right now.","Sure. I'd be glad to help you.","Dinner is the perfect time to have a chat."],
 answer:"That sounds great. I'd love to!",
 exp:`<div class="vnt">💬 Dịch: Sam: "Cậu có muốn tham gia bữa tối với chúng mình tối nay không?" – Oscar: "Nghe tuyệt đấy. Mình rất sẵn lòng!"</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>That sounds great. I'd love to!</span> = <span class='p-mean'>Nghe hay đấy, mình rất muốn! (nhận lời)</span></div>
 <div><span class='p-word'>Actually, I'm really hungry right now.</span> = <span class='p-mean'>Thật ra mình đang rất đói. (lạc đề)</span></div>
 <div><span class='p-word'>Sure. I'd be glad to help you.</span> = <span class='p-mean'>Được, mình sẵn lòng giúp. (đáp lời nhờ vả)</span></div>
 <div><span class='p-word'>Dinner is the perfect time to have a chat.</span> = <span class='p-mean'>Bữa tối là lúc tuyệt để trò chuyện. (lạc đề)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Would you like to join us...?" là một LỜI MỜI. Cách nhận lời phù hợp là "That sounds great. I'd love to!" (Nghe hay đấy, mình rất muốn).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"I'd be glad to help you" dùng để đáp lời nhờ giúp đỡ; hai câu còn lại lạc chủ đề, không phải cách nhận/từ chối lời mời.</span></li></ol>`},

/* ---------- VI. ERROR CORRECTION ---------- */
{sec:"VI", head:"Tìm lỗi sai. Bấm chữ cái chứa lỗi, rồi gõ từ SỬA ĐÚNG.", num:25, type:"error",
 q:"25. The <u>peaceful</u> atmosphere of the countryside <u>bring</u> a <u>sense</u> of <u>calm</u> to my soul.",
 parts:["peaceful","bring","sense","calm"],
 correctLetter:1, corrAccept:["brings"],
 exp:`<div class="vnt">💬 Dịch: Bầu không khí yên bình của vùng quê mang lại cảm giác thư thái cho tâm hồn tôi.</div>
 <ol><li>Lỗi sai ở <b>B. bring</b> → sửa thành <span class='hl-green'>brings</span>.</li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ ngữ chính là "The peaceful atmosphere" (bầu không khí) — danh từ SỐ ÍT. Vì thế động từ ở hiện tại đơn phải thêm -s → "brings".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>peaceful (tính từ – đúng), sense (danh từ – đúng), calm (danh từ sau "of" – đúng) → chỉ "bring" sai vì chưa chia hợp với chủ ngữ số ít.</span></li></ol>
 <div class="tip">🧠 Bẫy: đừng để cụm "of the countryside" đánh lừa! Chủ ngữ thật là "atmosphere" (số ít) → động từ +s.</div>`},

{sec:"VI", num:26, type:"error",
 q:"26. Sarah read <u>the</u> instructions <u>more</u> <u>careful</u> than she <u>did</u> last time.",
 parts:["the","more","careful","did"],
 correctLetter:2, corrAccept:["carefully"],
 exp:`<div class="vnt">💬 Dịch: Sarah đọc hướng dẫn cẩn thận hơn lần trước.</div>
 <ol><li>Lỗi sai ở <b>C. careful</b> → sửa thành <span class='hl-green'>carefully</span>.</li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"read" là động từ chỉ hành động → cần TRẠNG TỪ bổ nghĩa (đọc như thế nào?). Tính từ "careful" phải đổi thành trạng từ "carefully" → "read more carefully than...".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>the instructions (mạo từ – đúng), more (so sánh hơn – đúng), did (thay cho "read" – đúng) → chỉ "careful" sai loại từ.</span></li></ol>
 <div class="tip">🧠 Nhớ: bổ nghĩa cho ĐỘNG TỪ dùng TRẠNG TỪ (đuôi -ly); so sánh hơn của trạng từ dài là "more + adv".</div>`},

/* ---------- VII. CLOSEST MEANING ---------- */
{sec:"VII", head:"Chọn câu có nghĩa gần nhất với câu gốc.", num:27, type:"mcq",
 q:"27. The tortoise ran more slowly than the hare, but the tortoise won the race.",
 disp:["The hare ran faster than the tortoise, but the hare lost the race.","The hare ran more slowly than the tortoise, so the tortoise won the race.","The tortoise didn't run as slowly as the hare, so the tortoise won the race.","Although the tortoise ran more slowly than the hare, the tortoise lost the race."],
 answer:"The hare ran faster than the tortoise, but the hare lost the race.",
 exp:`<div class="vnt">💬 Dịch: Thỏ chạy nhanh hơn rùa, nhưng thỏ lại thua cuộc.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>The hare ran faster..., but the hare lost.</span> = <span class='p-mean'>Thỏ nhanh hơn nhưng thua</span></div>
 <div><span class='p-word'>The hare ran more slowly..., so...won.</span> = <span class='p-mean'>sai (thỏ đâu có chậm)</span></div>
 <div><span class='p-word'>The tortoise didn't run as slowly as the hare...</span> = <span class='p-mean'>sai nghĩa so sánh</span></div>
 <div><span class='p-word'>Although..., the tortoise lost.</span> = <span class='p-mean'>sai (rùa THẮNG mà)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"rùa chạy chậm hơn thỏ" = "thỏ chạy nhanh hơn rùa"; "nhưng rùa thắng" = "nhưng thỏ thua". Câu A giữ đúng cả hai ý này.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>B nói thỏ chạy chậm (sai); C đảo nghĩa so sánh; D nói rùa THUA (trong khi câu gốc rùa THẮNG).</span></li></ol>`},

/* ================= AUDIO ================= */
let AC;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function ding(){
  const c=ac(); const now=c.currentTime;
  [880,1320,1760].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0,now+i*0.08);
    g.gain.linearRampToValueAtTime(0.25,now+i*0.08+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.4);
    o.start(now+i*0.08); o.stop(now+i*0.08+0.42);
  });
}
function buzz(){
  const c=ac(); const now=c.currentTime;
  [300,220,160].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='square'; o.frequency.value=f;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.18,now+i*0.13);
    g.gain.exponentialRampToValueAtTime(0.001,now+i*0.13+0.12);
    o.start(now+i*0.13); o.stop(now+i*0.13+0.13);
  });
}

/* ================= CONFETTI ================= */
function confetti(){
  const cv=document.createElement('canvas'); cv.className='confetti';
  cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); const cols=['#00e0d5','#ff8fab','#ffd166','#00D26A','#0077b6','#48cae4'];
  const P=[]; for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height); t++;
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();});
    if(t<130)requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ================= HELPERS ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase()
  .replace(/won['’]t/g,'will not')
  .replace(/can['’]t/g,'can not')
  .replace(/n['’]t/g,' not')
  .replace(/['’]/g,'')
  .replace(/[.,!?;:"…\/]/g,' ')
  .replace(/\s+/g,' ').trim();}

const state={};
let answered=0;
const TOTAL=DATA.length;

function updateProg(){
  document.getElementById('progtxt').textContent=answered+' / '+TOTAL;
  document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%';
}

/* ================= RENDER ================= */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){
    const sec=document.createElement('div'); sec.className='sec';
    sec.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;
    quiz.appendChild(sec);
  }
  const card=document.createElement('div'); card.className='card'; card.id='c'+idx;
  const body=document.createElement('div');
  body.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  card.appendChild(body);
  const zone=document.createElement('div'); card.appendChild(zone);
  const exp=document.createElement('div'); exp.className='exp'; exp.innerHTML=it.exp; card.appendChild(exp);
  quiz.appendChild(card);

  if(it.type==='mcq') renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange') renderFill(it,idx,zone,exp);
  else if(it.type==='error') renderError(it,idx,zone,exp);
});
updateProg();

function markDone(idx,ok){ if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg();} }

function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div'); wrap.className='opts';
  const opts=shuffle(it.disp);
  opts.forEach(txt=>{
    const b=document.createElement('div'); b.className='opt'; b.innerHTML=txt;
    b.onclick=()=>{
      if(state[idx])return;
      const all=wrap.querySelectorAll('.opt'); all.forEach(x=>x.classList.add('locked'));
      const isC=(txt===it.answer);
      if(isC){b.classList.add('correct');ding();confetti();markDone(idx,true);}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);
        all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim');});
        setTimeout(()=>b.classList.remove('shake'),450);
      }
      exp.classList.add('open');
    };
    wrap.appendChild(b);
  });
  zone.appendChild(wrap);
}

function renderFill(it,idx,zone,exp){
  const row=document.createElement('div'); row.className='fillrow';
  const inp=document.createElement('input'); inp.className='tin'; inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button'); btn.className='btn-check'; btn.textContent='Kiểm tra';
  row.appendChild(inp); row.appendChild(btn); zone.appendChild(row);
  if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='💡 '+it.hint;zone.appendChild(h);}
  const acc=it.accept.map(norm);
  function check(){
    if(state[idx])return;
    const ok=acc.includes(norm(inp.value));
    inp.disabled=true; btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

function renderError(it,idx,zone,exp){
  const q=document.createElement('div'); q.className='err-parts';
  let labeled=it.q.replace(/^\d+\.\s*/,''); let li=0; const L=['A','B','C','D'];
  labeled=labeled.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);
  q.innerHTML=labeled; zone.appendChild(q);
  const letters=document.createElement('div'); letters.className='letters';
  const corr=document.createElement('div'); corr.className='corrbox';
  const acc=it.corrAccept.map(norm);
  let chosen=null;
  L.forEach((lab,i)=>{
    const b=document.createElement('button'); b.className='lbtn'; b.textContent=lab;
    b.onclick=()=>{
      if(state[idx])return;
      letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); chosen=i;
      corr.classList.add('show'); corr.querySelector('input').focus();
    };
    letters.appendChild(b);
  });
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div><div class="hint">💡 Chọn chữ cái chứa lỗi, gõ từ đúng vào ô rồi bấm Kiểm tra (ví dụ: brings, carefully...).</div>`;
  zone.appendChild(corr);
  const inp=corr.querySelector('input'); const btn=corr.querySelector('button');
  function check(){
    if(state[idx])return;
    if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return;}
    const letterOK=(chosen===it.correctLetter);
    const textOK=acc.includes(norm(inp.value));
    const ok=letterOK&&textOK;
    inp.disabled=true; btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel');});
    letters.children[it.correctLetter].classList.add('correct');
    if(!letterOK)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true);}
    else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450);}
    exp.classList.add('open');
  }
  btn.onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
}

/* ================= SUBMIT / RESULT ================= */
function openName(){ document.getElementById('nameMask').classList.add('show'); setTimeout(()=>document.getElementById('nameInput').focus(),100); }
function doSubmit(){
  const inp=document.getElementById('nameInput'); const w=document.getElementById('nameWarn');
  const name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err'); w.textContent='';
  document.getElementById('nameMask').classList.remove('show');
  showResult(name);
}
function showResult(name){
  let correct=0; for(let i=0;i<TOTAL;i++) if(state[i]==='ok') correct++;
  const pct=correct/TOTAL;
  const s10=(pct*10).toFixed(2);
  let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con là vua/nữ hoàng đại dương! 🏆';fb='🏆🐳🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, bơi thêm chút nữa là hoàn hảo! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi lặn lại nha! 🌈';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('resGreet').textContent=greet;
  document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';
  document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'); const fbEl=document.getElementById('resFallback');
  fbEl.textContent=fb; fbEl.style.display='none'; im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none';};
  im.onerror=()=>{im.style.display='none';fbEl.style.display='block';};
  im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block';}},2500);
  document.getElementById('resMask').classList.add('show');
  if(pct>=0.6){confetti();ding();}
}

/* ================= FLOATING PATTERN ================= */
(function(){
  const icons=['🐠','🐟','🐙','🐢','🐚','🦀','🐳','🦑','🪸','⭐','🐡','🐬'];
  const p=document.getElementById('pattern');
  for(let i=0;i<12;i++){
    const s=document.createElement('span');
    s.className='float'; s.textContent=icons[i%icons.length];
    s.style.top=Math.random()*90+'%';
    s.style.animationDuration=(18+Math.random()*20)+'s';
    s.style.animationDelay=(-Math.random()*30)+'s';
    s.style.fontSize=(1.6+Math.random()*2)+'rem';
    p.appendChild(s);
  }
  for(let i=0;i<20;i++){
    const b=document.createElement('span');
    b.className='bub';
    const sz=6+Math.random()*20;
    b.style.width=sz+'px'; b.style.height=sz+'px';
    b.style.left=Math.random()*100+'%';
    b.style.animationDuration=(7+Math.random()*10)+'s';
    b.style.animationDelay=(-Math.random()*12)+'s';
    p.appendChild(b);
  }
})();
