<script>
(function(){
 const L=document.getElementById('fly');
 const E=['🏫','📚','✏️','⭐','✨','🎈','🎒','🔔'];
 const C=['#FFD166','#E23E57','#FF8A5B','#D9367E','#FF5DA2'];
 for(let i=0;i<24;i++){
  const d=document.createElement('div');d.className='fl1';const inner=document.createElement('i');
  if(i%3===2){const m=document.createElement('div');m.className='mfilm';
   m.style.setProperty('--w',(16+Math.random()*12).toFixed(0)+'px');
   m.style.setProperty('--c',C[i%C.length]);inner.appendChild(m);}
  else{inner.textContent=E[i%E.length];inner.style.fontSize=(15+Math.random()*15).toFixed(0)+'px';}
  d.style.left=(Math.random()*95)+'%';
  d.style.animationDuration=(15+Math.random()*14).toFixed(1)+'s';
  d.style.animationDelay=(-Math.random()*28).toFixed(1)+'s';
  inner.style.animationDuration=(2.4+Math.random()*3).toFixed(1)+'s';
  d.appendChild(inner);L.appendChild(d);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.44);
 o.start(t);o.stop(t+.47)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#FFC53D','#FF4D5E','#3EE0E0','#A77BFF','#FF6FC8'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}

<script>
const Q=[];
function fil(sec,num,q,correct,accept,ex,ph){Q.push({t:'fill',sec,num,q,correct,accept,ex,ph:ph||'Gõ đáp án...'})}
function G(w,ty,m){return "<div><span class='g'>"+w+"</span><span class='t'>"+ty+"</span>= <span class='m'>"+m+"</span></div>"}
function F4(key,de,cells,why,trap){
 return '<div class="kb">✅ Đáp án: '+key+'</div>'+
  '<div class="stp"><span class="l">BƯỚC 1 · DỊCH</span><br>'+de+'</div>'+
  '<div class="stp"><span class="l">BƯỚC 2 · TỪ VỰNG / CẤU TRÚC</span><div class="g2">'+cells+'</div></div>'+
  '<div class="stp"><span class="l">BƯỚC 3 · TẠI SAO ĐÚNG</span><br><span class="pg">'+why+'</span></div>'+
  '<div class="stp"><span class="l">BƯỚC 4 · LƯU Ý / BẪY</span><br><span class="pg">'+trap+'</span></div>'}

/* ═════ E(I) — Write sentences with the cues given (8 câu) ═════ */
function eI(n,cue,model,vi,g1,g2,why,trap){
 fil('SEI',n,'<b>'+n+'.</b> Viết câu hoàn chỉnh từ gợi ý: <i>'+cue+'</i>',model,[model],F4('<b>'+model+'</b>',vi,g1+g2,why,trap),'Gõ cả câu hoàn chỉnh...');
}
eI(1,'Mai / usually / listen / K-pop music / free time.','Mai usually listens to K-pop music in her free time.',
 'Mai thường nghe nhạc K-pop vào thời gian rảnh rỗi của cô ấy.',
 G('usually','adv','thường xuyên → thì hiện tại đơn'),G('listen to','v.phr','nghe (cái gì) — luôn có "to"'),
 'Dấu hiệu "usually" → thì hiện tại đơn; "Mai" số ít nên thêm "-s": <b>listens</b>. Bắt buộc "listen <b>to</b> + N" và "in her free time".',
 'Viết thiếu giới từ "to" sau listen, quên chia "-s", hoặc dùng sai giới từ "on her free time".');
eI(2,'when / I / be / a child / I / enjoy / play / computer games.','When I was a child, I enjoyed playing computer games.',
 'Khi tôi còn là một đứa trẻ, tôi thích chơi trò chơi điện tử.',
 G('was','to be quá khứ','đã là'),G('enjoy + V-ing','structure','thích làm gì (CHỈ V-ing)'),
 '"khi tôi còn nhỏ" → thì quá khứ đơn cho cả câu. to be → <b>was</b>; enjoy → <b>enjoyed</b>; theo cấu trúc enjoy+V-ing nên play → <b>playing</b>.',
 'Quên chia quá khứ ("when I am...enjoy...") hoặc dùng sai "enjoy to play".');
eI(3,'my father / spend / most / spare time / look after / the garden.','My father spends most of his spare time looking after the garden.',
 'Bố tôi dành phần lớn thời gian rảnh rỗi của ông để chăm sóc khu vườn.',
 G('spend time + V-ing','structure','dành thời gian làm gì'),G('look after','phr.v','chăm sóc'),
 'Thì hiện tại đơn (thói quen). "my father" số ít → <b>spends</b>. Thêm "most of his spare time". Theo cấu trúc spend, look → <b>looking after</b>.',
 'Dùng to-V sau spend ("spends...to look after"); quên "of" và "his" trong "most of his spare time".');
eI(4,'watching TV / most / popular / leisure activity / Britain?','Is watching TV the most popular leisure activity in Britain?',
 'Việc xem TV có phải là hoạt động giải trí phổ biến nhất ở Anh không?',
 G('watching TV','gerund subject','chủ ngữ số ít'),G('the most + adj','superlative','...nhất'),
 'Câu hỏi Yes/No thì hiện tại đơn với to be. Chủ ngữ là danh động từ (số ít) → đảo <b>Is</b> lên đầu. So sánh nhất: "the most popular". Thêm "in" trước tên nước.',
 'Quên "the" trước most popular, hoặc mượn sai trợ động từ "Does watching TV is...".');
eI(5,'many teenagers / addicted / the Internet / computer games.','Many teenagers are addicted to the Internet and computer games.',
 'Nhiều thanh thiếu niên bị nghiện Internet và trò chơi điện tử.',
 G('be addicted to','structure','nghiện cái gì'),G('are','to be số nhiều','many teenagers → are'),
 'Nêu hiện trạng → thì hiện tại đơn. Cấu trúc "be addicted to + N/V-ing". Chủ ngữ số nhiều → <b>are</b>. Nối 2 danh từ bằng "and".',
 'Thiếu to be ("teenagers addicted"); dùng sai giới từ "addicted with/in" thay vì "to".');
eI(6,"she / not be / interested / watch / that drama / the life of doctors.","She isn't interested in watching that drama about the life of doctors.",
 'Cô ấy không hứng thú với việc xem bộ phim truyền hình về cuộc đời của các bác sĩ đó.',
 G('be interested in + V-ing','structure','hứng thú với việc gì'),G('about','giới từ','về (chủ đề)'),

/* ═════ E(II) — Complete the sentences, similar meaning (8 câu, chỉ gõ phần TIẾP THEO sau starter) ═════ */
function eII(n,orig,starter,acc,vi,g1,g2,why,trap){
 const accAll=acc.concat(acc.map(a=>starter+a));
 fil('SEII',n,'<b>'+n+'.</b> Câu gốc: <i>"'+orig+'"</i><br>Viết lại bắt đầu bằng: <span class="wii-start">'+starter+'</span>',acc[0],accAll,
  F4('<b>'+starter+acc[0]+'</b>',vi,g1+g2,why,trap),'Gõ phần còn lại, hoặc gõ cả câu đầy đủ đều được...');
}

/* ══ DỰNG TRANG ══ */
const TOTAL=Q.length;let answered=0,score=0;const done={};
function bump(){document.getElementById('fbb').style.width=(answered/TOTAL*100)+'%';
 document.getElementById('sc').textContent=score;
 const p=answered?score/answered:1;
 document.getElementById('md').textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){
 const d=document.createElement('div');d.className='sec';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+
  '</span><h2>'+title+'</h2></div><div class="si">'+ins+'</div>';
 APP.appendChild(d);CUR=d}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

render('SEI');

render('SEII');

/* ══ RENDER ══ */
function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
  '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
  '<button class="ck" id="b_'+gid+'">Kiểm tra</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
 const go=()=>{
  if(done[gid])return;
  const v=norm(inp.value);
  if(!v){inp.classList.add('no');c.classList.add('shk');
   setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},450);return}
  done[gid]=true;answered++;
  const ok=m.accept.map(norm).indexOf(v)>-1;
  inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
  document.getElementById('e_'+gid).classList.add('show');
  if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),450)}
  bump();
 };
 bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 return c;
}
function openName(){document.getElementById('nOv').classList.add('on');
 setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — học sinh lớp 8 quá giỏi luôn! 🎉';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 LÀM TỐT LẮM, '+nm+'!';msg='Điểm khá rồi! Đọc kỹ giải thích 4 bước ở những câu sai nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🎞️ CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc kỹ giải thích rồi làm lại — con sẽ giỏi lên nhanh thôi! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
