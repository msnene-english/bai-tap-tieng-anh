<style>
:root{--bg:#200914;--card:#35121F;--ink:#FFF3E4;--gold:#FFD166;--red:#E23E57;--cyan:#FF8A5B;
  --violet:#D9367E;--pink:#FF5DA2;--dim:#E3B2A8;--good:#37D89A;--bad:#FF6B85;--dark:#12040A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;background:#200914}
body::before{content:'';position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.5;

   conic-gradient(from 0deg at 50% 50%,#E23E57 0 30deg,#FFD166 30deg 60deg,#FF8A5B 60deg 90deg,
    #D9367E 90deg 120deg,#FF5DA2 120deg 150deg,#37D89A 150deg 180deg,#E23E57 180deg 210deg,
    #FFD166 210deg 240deg,#FF8A5B 240deg 270deg,#D9367E 270deg 300deg,#FF5DA2 300deg 330deg,
    #37D89A 330deg 360deg);
  filter:blur(34px);animation:kal 30s linear infinite}
@keyframes kal{to{transform:rotate(360deg)}}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
   repeating-linear-gradient(30deg,rgba(18,4,10,.85) 0 2px,transparent 2px 66px),

.lo{filter:blur(58px);opacity:.55;

.lo2{filter:blur(76px);opacity:.4;
  background:radial-gradient(26% 20% at 50% 42%,rgba(255,77,94,.4),transparent 68%),
   radial-gradient(24% 18% at 8% 56%,rgba(167,123,255,.4),transparent 68%);

.lo3{filter:blur(90px);opacity:.3;

   radial-gradient(38% 28% at 34% 96%,rgba(255,197,61,.35),transparent 70%);
  animation:l3 50s ease-in-out infinite alternate}
@keyframes l1{from{transform:translate3d(-4%,-2%,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.16)}}
@keyframes l2{from{transform:translate3d(3%,2%,0) scale(1.1)}to{transform:translate3d(-3%,-3%,0) scale(1)}}
@keyframes l3{from{transform:translate3d(0,3%,0) scale(1.05)}to{transform:translate3d(2%,-3%,0) scale(1.18)}}
.beam{display:none}
.fly{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl1{position:absolute;bottom:-60px;animation:rise linear infinite}
.fl1 i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes rise{0%{transform:translateY(0);opacity:0}8%{opacity:.9}88%{opacity:.7}

@keyframes sway{from{transform:translateX(-16px) rotate(-14deg)}to{transform:translateX(16px) rotate(14deg)}}
.mfilm{width:var(--w);height:var(--w);background:var(--c);opacity:.85;
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:0 0 14px var(--c)}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:18px 15px 80px}
h1,h2,.pill,.qn,.sbtn,.ck{font-family:'Rye',cursive;font-weight:400;letter-spacing:.5px}
.mq{position:relative;padding:30px 26px 24px;margin:12px 0 20px;text-align:center;border-radius:10px;

   conic-gradient(from 10deg at 50% 42%,rgba(226,62,87,.6) 0 45deg,rgba(255,209,102,.6) 45deg 90deg,
    rgba(255,138,91,.6) 90deg 135deg,rgba(217,54,126,.6) 135deg 180deg,rgba(255,93,162,.6) 180deg 225deg,

.sb{position:sticky;top:8px;z-index:9;display:flex;align-items:center;gap:11px;padding:9px 16px;

.tr{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.fb{height:100%;width:0;transition:width .45s;background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan))}
.sec{position:relative;padding:20px 22px 18px;margin-bottom:26px;border-radius:6px;

.sec::before,.sec::after{content:'';position:absolute;width:24px;height:24px;opacity:.9;

.q{position:relative;background:rgba(255,255,255,.07);border:2px solid rgba(255,209,102,.3);border-radius:4px;

.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:var(--gold);color:#3A1200;min-width:31px;text-align:center;padding:1px 7px;

.qt{font-weight:700;font-size:1rem;line-height:1.9}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
.ti{flex:1 1 100%;background:rgba(18,4,10,.65);border:2px solid rgba(255,209,102,.4);border-radius:5px;

.ck{background:var(--red);color:#fff;border:none;border-radius:4px;padding:9px 18px;font-size:.8rem;

.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.4;cursor:default}
.ex{display:none;margin-top:12px;background:rgba(18,4,10,.6);border:1px solid rgba(255,209,102,.25);
  border-radius:5px;padding:13px;font-size:.94rem;line-height:1.82}
.ex.show{display:block}
.kb{background:rgba(43,217,138,.16);border:2px solid var(--good);border-radius:4px;padding:8px 12px;
  margin-bottom:9px;font-weight:900;color:#9BFFD0;line-height:1.72}
.stp{background:rgba(255,255,255,.055);border:1px solid rgba(255,209,102,.22);border-radius:4px;
  padding:8px 12px;margin-bottom:8px;line-height:1.82}
.stp .l{display:inline-block;background:linear-gradient(135deg,#7C3AED,#C026D3);color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.4);letter-spacing:.4px;padding:2px 12px;font-size:.66rem;
  margin-bottom:5px;font-family:'Rye';border-radius:999px;box-shadow:0 2px 6px rgba(124,58,237,.35)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:6px 0}

.g2>div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:4px;

.w{color:#8FD0FF;font-weight:800}.m{color:#FFCE7A;font-weight:700}.g{color:#7BFFC0;font-weight:900}
.t{background:rgba(167,123,255,.25);color:#DCCBFF;padding:1px 7px;border-radius:999px;font-size:.78em;
  font-weight:800;margin:0 4px}
.pg{background:linear-gradient(transparent 56%,rgba(255,197,61,.3) 56%);font-weight:800}
.sub{text-align:center;margin-top:22px}
.sbtn{background:var(--gold);color:var(--dark);border:none;border-radius:6px;padding:15px 38px;
  font-size:1rem;cursor:pointer;box-shadow:0 8px 22px rgba(255,197,61,.35)}
.sbtn:hover{transform:translateY(-3px)}
.ov{position:fixed;inset:0;background:rgba(5,3,12,.85);z-index:99;display:none;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(6px)}
.ov.on{display:flex}
.mb{background:linear-gradient(180deg,#4A1522,#200914);border:3px solid var(--gold);border-radius:6px;
  box-shadow:0 16px 44px rgba(0,0,0,.7);padding:26px 22px;width:430px;max-width:96%;text-align:center;
  max-height:92vh;overflow-y:auto}
.mb h2{font-size:1.02rem;color:var(--gold);margin-bottom:11px}
.mb input{width:100%;padding:12px;border:2px solid rgba(255,255,255,.2);border-radius:5px;
  background:#120E28;color:var(--ink);font-family:'Nunito';font-weight:800;font-size:1rem;
  text-align:center;outline:none;margin-bottom:11px}
.mb input.er{border-color:var(--bad);animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:9px}
.mb .gr{font-family:'Rye';font-size:1rem;color:var(--pink);line-height:1.5;margin-bottom:6px}
.mb .rs{font-family:'Rye';font-size:2.1rem;color:var(--gold)}
.mb .rt2{font-weight:900;color:var(--cyan);font-size:1.04rem;margin:4px 0 7px}
.mb .rm{font-weight:700;font-size:.92rem;line-height:1.72;margin-bottom:11px;color:var(--dim)}
.mb img{width:100%;max-width:250px;border-radius:6px;margin:11px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:110;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>

<script>
(function(){
 const L=document.getElementById('fly');
 const E=['🏫','📚','✏️','⭐','✨','🎈','🎒','🔔'];
 const C=['#FFD166','#E23E57','#FF8A5B','#D9367E','#FF5DA2'];
 for(let i=0;i<24;i++){
  const d=document.createElement('div');d.className='fl1';const inner=document.createElement('i');
  if(i%3===2){const m=document.createElement('div');m.className='mfilm';
   m.style.setProperty('--w',(16+Math.random()*12).toFixed(0)+'px');
   m.style.setProperty('--c',C[i%C.length]);inner.appendChild(m);}
  else{inner.textContent=E[i%E.length];inner.style.fontSize=(15+Math.random()*15).toFixed(0)+'px';}
  d.style.left=(Math.random()*95)+'%';
  d.style.animationDuration=(15+Math.random()*14).toFixed(1)+'s';
  d.style.animationDelay=(-Math.random()*28).toFixed(1)+'s';
  inner.style.animationDuration=(2.4+Math.random()*3).toFixed(1)+'s';
  d.appendChild(inner);L.appendChild(d);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.44);
 o.start(t);o.stop(t+.47)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#FFC53D','#FF4D5E','#3EE0E0','#A77BFF','#FF6FC8'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
const Q=[];
function fil(sec,num,q,correct,accept,ex,ph){Q.push({t:'fill',sec,num,q,correct,accept,ex,ph:ph||'Gõ đáp án...'})}
function G(w,ty,m){return "<div><span class='g'>"+w+"</span><span class='t'>"+ty+"</span>= <span class='m'>"+m+"</span></div>"}
function F4(key,de,cells,why,trap){
 return '<div class="kb">✅ Đáp án: '+key+'</div>'+
  '<div class="stp"><span class="l">BƯỚC 1 · DỊCH</span><br>'+de+'</div>'+
  '<div class="stp"><span class="l">BƯỚC 2 · TỪ VỰNG / CẤU TRÚC</span><div class="g2">'+cells+'</div></div>'+
  '<div class="stp"><span class="l">BƯỚC 3 · TẠI SAO ĐÚNG</span><br><span class="pg">'+why+'</span></div>'+
  '<div class="stp"><span class="l">BƯỚC 4 · LƯU Ý / BẪY</span><br><span class="pg">'+trap+'</span></div>'}

/* ═════ EXERCISE X — PREPOSITIONS (10 câu) ═════ */
function eX(n,sent,ans,vi,g1,g2,why,trap){
 fil('SX',n,'<b>'+n+'.</b> '+sent,ans,[ans],F4('<b>'+ans+'</b>',vi,g1+g2,why,trap),'Gõ 1 giới từ...');
}
eX(1,"I've been crazy _____ this role-playing game recently.",'about',
 'Gần đây tôi đã phát cuồng vì trò chơi nhập vai này.',
 G('crazy','adj','phát cuồng, mê mẩn'),G('about','giới từ','về, vì'),
 'Cụm tính từ cố định <b>be crazy about + N/V-ing</b> (cực kỳ đam mê điều gì) — chỉ "about" mới ghép được với "crazy".',
 'Đừng dịch word-by-word "phát cuồng VÌ" rồi điền "for" hoặc "in" — đây là lỗi collocation rất nặng.');
eX(2,'She thinks puzzles are good _____ the brain.','for',
 'Cô ấy nghĩ rằng câu đố rất tốt cho não bộ.',
 G('good','adj','tốt, có ích'),G('for','giới từ','cho, dành cho'),
 'Cụm <b>be good for + N</b> (mang lại lợi ích cho ai/cái gì) — não bộ nhận lợi ích từ câu đố nên dùng "for".',
 'Phân biệt: "good at" (giỏi về môn gì) và "good to" (đối xử tốt với ai) — không dùng nhầm vào trường hợp lợi ích sức khỏe.');
eX(3,'I enjoyed hanging out _____ Sarah when we were kids.','with',
 'Tôi thích đi chơi cùng Sarah khi chúng tôi còn nhỏ.',
 G('hang out','phr.v','tụ tập, đi chơi'),G('with','giới từ','cùng với'),
 'Cấu trúc <b>hang out with somebody</b> (tụ tập/đi chơi cùng ai đó) — cần giới từ mang nghĩa "cùng với".',
 'Không bao giờ dùng "to" hay "for" sau "hang out" khi nói về đi chơi cùng bạn bè.');
eX(4,'Could you help me look _____ my contact lens?','for',
 'Bạn có thể giúp tôi tìm kính áp tròng của tôi không?',
 G('look for','phr.v','tìm kiếm'),G('contact lens','n','kính áp tròng'),
 'Cụm động từ <b>look for</b> (tìm kiếm vật/người bị thất lạc) — ngữ cảnh đang mất kính áp tròng và cần trợ giúp.',
 'Phân biệt "look at" (nhìn chằm chằm), "look after" (chăm sóc), "look out" (coi chừng) — đừng nhầm lẫn.');
eX(5,'What do you usually do _____ your leisure time?','in',
 'Bạn thường làm gì vào thời gian rảnh của mình?',
 G('leisure time','n','thời gian rảnh'),G('in','giới từ','vào (khoảng thời gian)'),
 'Cụm cố định <b>in one’s free/leisure time</b> (vào lúc rảnh rỗi) — luôn dùng "in" với khoảng thời gian trừu tượng này.',
 'Học sinh Việt hay dịch "vào" thành "on" hoặc "at" — đây là lỗi collocation sai hoàn toàn.');
eX(6,'A lot of kids nowadays have become addicted _____ surfing the net.','to',
 'Nhiều trẻ em ngày nay đã trở nên nghiện lướt mạng.',
 G('addicted','adj','nghiện'),G('to','giới từ','vào, với'),
 'Cấu trúc kinh điển <b>be/become addicted to + V-ing/N</b> (nghiện, lệ thuộc vào thứ gì) — "addicted" luôn đi cặp với "to".',
 'Đừng dịch "nghiện VỚI" rồi điền "with" hay "in" — tiếng Anh không chấp nhận collocation này.');
eX(7,"My sister loves to do origami _____ her own in her free time.",'on',

/* ══ DỰNG TRANG ══ */
const TOTAL=Q.length;let answered=0,score=0;const done={};
function bump(){document.getElementById('fbb').style.width=(answered/TOTAL*100)+'%';
 document.getElementById('sc').textContent=score;
 const p=answered?score/answered:1;
 document.getElementById('md').textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){
 const d=document.createElement('div');d.className='sec';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+
  '</span><h2>'+title+'</h2></div><div class="si">'+ins+'</div>';
 APP.appendChild(d);CUR=d}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

render('SX');

render('SC');

document.getElementById('tt').textContent=TOTAL;bump();

/* ══ RENDER ══ */
function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
  '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
  '<button class="ck" id="b_'+gid+'">Kiểm tra</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
 const go=()=>{
  if(done[gid])return;
  const v=norm(inp.value);
  if(!v){inp.classList.add('no');c.classList.add('shk');
   setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},450);return}
  done[gid]=true;answered++;
  const ok=m.accept.map(norm).indexOf(v)>-1;
  inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
  document.getElementById('e_'+gid).classList.add('show');
  if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),450)}
  bump();
 };
 bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 return c;
}
function openName(){document.getElementById('nOv').classList.add('on');
 setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — học sinh lớp 8 quá giỏi luôn! 🎉';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 LÀM TỐT LẮM, '+nm+'!';msg='Điểm khá rồi! Đọc kỹ giải thích 4 bước ở những câu sai nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🎞️ CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc kỹ giải thích rồi làm lại — con sẽ giỏi lên nhanh thôi! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
