<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 – Leisure Time – TEST 1 – Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF5D6C; --amber:#FFB020; --teal:#12C2B0; --indigo:#4C6FFF; --violet:#8B4DE8;
  --ink:#181433; --paper:#FFF7EC; --card:#ffffff; --bad:#FF3B4E; --good:#08A24B;
  --c-word:#0D5BC4; --c-mean:#C0562B; --c-gram:#E11D48; --c-phon:#7C3AED;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;
  background:linear-gradient(-45deg,#FF5D6C,#FFB020,#12C2B0,#4C6FFF,#8B4DE8);background-size:400% 400%;animation:bg 22s ease infinite;}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(0,0,0,.12) 1.4px,transparent 1.6px);background-size:16px 16px;}
.pattern{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.pattern span{position:absolute;font-family:'Bangers',cursive;color:#fff;opacity:.5;-webkit-text-stroke:2px var(--ink);animation:drift linear infinite;}
@keyframes drift{0%{transform:translateY(112vh) rotate(-12deg)}100%{transform:translateY(-25vh) rotate(12deg)}}
@media (prefers-reduced-motion:reduce){body,.pattern span{animation:none!important}}

.wrap{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:14px 14px 80px;}

/* header */
.teacher{display:inline-block;font-family:'Bangers',cursive;letter-spacing:1px;font-size:1rem;color:var(--ink);
  background:var(--amber);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;box-shadow:3px 3px 0 var(--ink);margin:2px 0 10px;}
header.top{text-align:center;margin-bottom:16px;}
header.top h1{font-family:'Bangers',cursive;font-size:clamp(34px,7vw,60px);line-height:.95;letter-spacing:2px;color:#fff;
  -webkit-text-stroke:2.5px var(--ink);text-shadow:5px 5px 0 var(--coral),8px 8px 0 rgba(0,0,0,.18);}
header.top .unit{display:inline-block;margin-top:8px;font-family:'Bangers',cursive;font-size:1.1rem;letter-spacing:1px;color:#fff;
  background:var(--violet);border:3px solid var(--ink);border-radius:12px;padding:3px 16px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg);}

/* score bar */
.scorebar{position:sticky;top:8px;z-index:6;margin:0 auto 18px;max-width:520px;
  background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);
  display:flex;align-items:center;gap:12px;padding:9px 14px;}
.scorebar b{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.15rem;}
.track{flex:1;height:14px;background:#eee;border:2px solid var(--ink);border-radius:999px;overflow:hidden;}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .5s cubic-bezier(.2,.9,.3,1.3);}
.star{font-size:1.2rem;}

/* section */
.section{background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);
  padding:16px 15px 18px;margin-bottom:20px;}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px;}
.chip{font-family:'Bangers',cursive;letter-spacing:1px;color:#fff;background:var(--indigo);border:3px solid var(--ink);
  border-radius:10px;padding:3px 12px;box-shadow:2px 2px 0 var(--ink);font-size:.95rem;}
.sec-head h2{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.35rem;}
.sec-instruct{font-style:italic;font-weight:700;color:#5b5570;margin:2px 0 12px;font-size:.95rem;}

/* question card */
.q{border:2.5px dashed #cfc9de;border-radius:14px;padding:12px 12px 13px;margin-bottom:12px;background:#fff;transition:transform .12s;}
.q.shake{animation:shake .45s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.qnum{display:inline-block;font-family:'Bangers',cursive;background:var(--coral);color:#fff;border:2.5px solid var(--ink);
  border-radius:9px;min-width:34px;text-align:center;padding:1px 8px;box-shadow:2px 2px 0 var(--ink);margin-right:8px;font-size:1rem;}
.stem{display:inline;font-weight:700;font-size:1.02rem;line-height:1.7;}
.hintword{color:var(--violet);font-weight:900;}

/* mcq options - NO ABCD */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px;}
@media(max-width:520px){.opts{grid-template-columns:1fr;}}
.opt{display:flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:11px;background:#fff;
  padding:10px 14px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,background .15s;font-size:1.02rem;}
.opt:hover{transform:translate(-1px,-1px);}
.opt.sel{background:#FFF2C2;}
.opt.ok{background:#C9F7DB;border-color:var(--good);}
.opt.no{background:#FFD6DB;border-color:var(--bad);}
.opt u{text-decoration-thickness:2.5px;text-underline-offset:2px;}

/* text inputs */
.blankwrap{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
input.ans{font-family:'Nunito';font-weight:800;font-size:1rem;padding:8px 12px;border:2.5px solid var(--ink);border-radius:10px;
  min-width:150px;box-shadow:2px 2px 0 var(--ink);background:#FFFDF6;flex:1;}
input.ans:focus{outline:none;border-color:var(--indigo);background:#fff;}
input.ans.ok{border-color:var(--good);background:#DFF7E8;}
input.ans.no{border-color:var(--bad);background:#FFE1E5;}

/* error-fix segments */
.efline{font-weight:700;font-size:1.04rem;line-height:2.1;margin-top:6px;}
.seg{display:inline;}
.ul{display:inline-block;position:relative;cursor:pointer;font-weight:800;padding:0 3px;border-bottom:3px solid var(--indigo);
  transition:background .15s;border-radius:4px 4px 0 0;}
.ul:hover{background:#EAF0FF;}
.ul .tag{font-family:'Bangers',cursive;font-size:.68rem;color:#fff;background:var(--indigo);border:1.5px solid var(--ink);
  border-radius:5px;padding:0 4px;margin-left:2px;vertical-align:super;}
.ul.sel{background:#FFF2C2;border-bottom-color:var(--amber);}
.ul.sel .tag{background:var(--amber);color:var(--ink);}
.ul.ok{background:#C9F7DB;border-bottom-color:var(--good);}
.ul.ok .tag{background:var(--good);}
.ul.no{background:#FFD6DB;border-bottom-color:var(--bad);}
.ul.no .tag{background:var(--bad);}
.effix{margin-top:11px;display:none;flex-wrap:wrap;gap:8px;align-items:center;background:#F5F2FF;border:2px dashed #c9bfe8;border-radius:12px;padding:10px;}
.effix.show{display:flex;}
.effix .lb{font-weight:800;color:var(--violet);font-size:.95rem;}

/* buttons */
.btn{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.2rem;color:#fff;background:var(--teal);border:3px solid var(--ink);
  border-radius:12px;padding:10px 24px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .1s;}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.btn.small{padding:7px 16px;font-size:1rem;border-width:2.5px;box-shadow:3px 3px 0 var(--ink);}
.btn.small:hover{box-shadow:4px 4px 0 var(--ink);}

/* explanation styles - REQUIRED */
.exp{margin-top:11px;border-radius:12px;padding:16px 14px;font-weight:600;line-height:1.6;font-size:1rem;display:none;
  border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;}
.exp.show{display:block;animation:pop .3s;}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.exp.ok{border-color:var(--good);}
.exp.no{border-color:var(--bad);}

.vnt { background: #FFF3CD; font-weight: 800; padding: 10px 14px; border-radius: 8px; color: #856404; margin-bottom: 12px; border: 2px dashed #ffe69c; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
@media(max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
.grid2 > div { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; padding: 8px 12px; }
.wt { background: #e2e8f0; color: #475569; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; font-weight: bold; margin: 0 4px; }
.p-phonetic { background: #f3e8ff; color: #7e22ce; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: bold; margin: 0 4px; }
.p-word { color: #2563eb; font-weight: 800; }
.hl-green { color: #16a34a; font-weight: 900; }
.p-mean { color: #c2410c; font-weight: 700; }
.p-grammar { text-decoration: underline; text-decoration-color: #ef4444; text-decoration-thickness: 2.5px; text-underline-offset: 3px; }
.hl-red { color: #ef4444; font-weight: 900; }
.exp ol { padding-left: 18px; margin-top: 10px; }
.exp li { margin-bottom: 8px; }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; }
.modal-box { background: var(--paper); border: 4px solid var(--ink); border-radius: 20px; box-shadow: 8px 8px 0 var(--ink); padding: 24px; max-width: 90%; width: 420px; text-align: center; position: relative; animation: pop .4s; }
.modal-box h2 { font-family: 'Bangers', cursive; font-size: 2rem; letter-spacing: 1px; color: var(--indigo); margin-bottom: 12px; }
.modal-box input { width: 100%; font-family: 'Nunito'; font-weight: 800; font-size: 1.1rem; padding: 12px; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); margin-bottom: 16px; outline: none; }
.modal-box input.error { border-color: var(--bad); background: #FFE1E5; }
.modal-box .err-msg { color: var(--bad); font-weight: 800; font-size: 0.9rem; margin-top: -10px; margin-bottom: 12px; display: none; }
.modal-box .res-score { font-family: 'Bangers', cursive; font-size: 3rem; color: var(--coral); -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 rgba(0,0,0,0.1); line-height: 1; }
.modal-box .res-scale { font-weight: 900; color: var(--violet); font-size: 1.3rem; margin-top: 8px; }
.modal-box img { width: 100%; max-width: 300px; border-radius: 16px; border: 3px solid var(--ink); margin: 16px auto; display: block; box-shadow: 4px 4px 0 var(--ink); }

/* confetti */
.confetti{position:fixed;top:0;left:0;width:11px;height:16px;z-index:50;pointer-events:none;border-radius:2px;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}

.submit-bar { text-align: center; margin-top: 30px; padding-bottom: 20px; }
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>
<div class="wrap">
  <header class="top">
    <div class="teacher">★ Ms. Chí Nên · ULIS ★</div>
    <h1>LEISURE TIME</h1>
    <div class="unit">UNIT 1 · TEST 1 · Comic English</div>
  </header>

  <div class="scorebar">
    <span class="star">⭐</span>
    <b><span id="score">0</span> / <span id="total">40</span></b>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="star" id="mood">💪</span>
  </div>

  <div id="app"></div>

  <div class="submit-bar">
    <button class="btn" id="btnSubmitFinal">🎯 NỘP BÀI & XEM KẾT QUẢ</button>
  </div>
</div>

<!-- Màn hình nhập tên -->
<div class="modal-overlay" id="modalName">
  <div class="modal-box">
    <h2>NHẬP TÊN CỦA BẠN</h2>
    <p style="font-weight:700; margin-bottom:12px;">Hãy cho cô biết tên của thiên tài đang làm bài nhé!</p>
    <input type="text" id="inpName" placeholder="Ví dụ: Nguyễn Văn A..." autocomplete="off">
    <div class="err-msg" id="nameErr">❌ Ô kìa, bạn chưa nhập tên kìa!</div>
    <button class="btn" id="btnConfirmName">🚀 XEM KẾT QUẢ THÔI!</button>
  </div>
</div>

<!-- Màn hình kết quả -->
<div class="modal-overlay" id="modalResult">
  <div class="modal-box">
    <h2 id="resGreeting">🌟 THIÊN TÀI!</h2>
    <div class="res-score"><span id="resCorrect">0</span> / <span id="resTotal">40</span></div>
    <div class="res-scale">Điểm hệ 10: <span id="res10">0.00</span>/10</div>
    <img id="resGif" src="" alt="Result GIF">
    <button class="btn" onclick="location.reload()">🔄 LÀM LẠI TỪ ĐẦU</button>
  </div>
</div>

<script>
/* ===================== DATA ===================== */
const DATA = [
/* ---------- A. I. PRONUNCIATION ---------- */
{tag:"A · I", title:"PHÁT ÂM", type:"mcq",
 instruct:"Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại.",
 items:[
  {n:1, opts:["sch<u>oo</u>l","f<u>oo</u>lish","sm<u>oo</u>thie","c<u>oo</u>kie"], ans:3,
   exp:`<div class="vnt">💬 Dịch: Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại.</div>
<ol>
  <li>Phân tích 4 đáp án:
    <div class="grid2">
      <div><span class='p-word'>school</span> <span class='wt'>n</span> <span class='p-phonetic'>/skuːl/</span> = <span class='p-mean'>trường học</span></div>
      <div><span class='p-word'>foolish</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈfuːlɪʃ/</span> = <span class='p-mean'>ngu ngốc</span></div>
      <div><span class='p-word'>smoothie</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈsmuːði/</span> = <span class='p-mean'>sinh tố</span></div>
      <div><span class='hl-green'>cookie</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈkʊki/</span> = <span class='p-mean'>bánh quy</span></div>
    </div>
  </li>
  <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Từ 'cookie' có âm "oo" được phát âm là âm ngắn /ʊ/. Các từ còn lại phát âm là âm dài /uː/. Do đó, "cookie" có cách phát âm khác biệt.</span></li>
  <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Những từ còn lại đều chia sẻ chung một quy tắc phát âm nguyên âm dài /uː/ nên không được chọn.</span></li>
</ol>`},
  {n:2, opts:["fan<u>c</u>y","re<u>c</u>ipe","re<u>c</u>ent","cy<u>c</u>le"], ans:3,
   exp:`<div class="vnt">💬 Dịch: Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại.</div>
<ol>
  <li>Phân tích 4 đáp án:
    <div class="grid2">
      <div><span class='p-word'>fancy</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈfænsi/</span> = <span class='p-mean'>sang trọng/lạ mắt</span></div>
      <div><span class='p-word'>recipe</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈresəpi/</span> = <span class='p-mean'>công thức nấu ăn</span></div>
      <div><span class='p-word'>recent</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈriːsnt/</span> = <span class='p-mean'>gần đây</span></div>
      <div><span class='hl-green'>cycle</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈsaɪkl/</span> = <span class='p-mean'>chu kỳ/đạp xe</span></div>
    </div>
  </li>
  <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trong từ 'cycle', chữ "c" đầu tiên đọc là /s/ nhưng chữ "c" được gạch chân đọc là /k/. Các từ còn lại đều có chữ "c" đọc là /s/ vì đứng trước e/i/y.</span></li>
  <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Quy tắc cơ bản: Chữ 'c' đứng trước e, i, y luôn phát âm là /s/. Fancy, recipe, recent đều tuân thủ quy tắc này.</span></li>
</ol>`},
  {n:3, opts:["attend<u>ed</u>","preferr<u>ed</u>","hunt<u>ed</u>","decid<u>ed</u>"], ans:1,
   exp:`<div class="vnt">💬 Dịch: Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại.</div>
<ol>
  <li>Phân tích 4 đáp án:
    <div class="grid2">
      <div><span class='p-word'>attended</span> <span class='wt'>v</span> <span class='p-phonetic'>/əˈtendɪd/</span> = <span class='p-mean'>đã tham dự</span></div>
      <div><span class='hl-green'>preferred</span> <span class='wt'>v</span> <span class='p-phonetic'>/prɪˈfɜːd/</span> = <span class='p-mean'>đã thích hơn</span></div>
      <div><span class='p-word'>hunted</span> <span class='wt'>v</span> <span class='p-phonetic'>/ˈhʌntɪd/</span> = <span class='p-mean'>đã săn bắn</span></div>
      <div><span class='p-word'>decided</span> <span class='wt'>v</span> <span class='p-phonetic'>/dɪˈsaɪdɪd/</span> = <span class='p-mean'>đã quyết định</span></div>
    </div>
  </li>
  <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Từ 'prefer' kết thúc bằng âm vô thanh /r/ (khi r rung nhẹ/âm hữu thanh), nên đuôi -ed đọc là /d/.</span></li>
  <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các từ còn lại đều có âm cuối của động từ gốc là /t/ hoặc /d/ (attend, hunt, decide). Theo quy tắc, đuôi -ed sau /t/ hoặc /d/ bắt buộc phải đọc là /ɪd/.</span></li>
</ol>`}
 ]},

/* ---------- A. II. STRESS ---------- */
{tag:"A · II", title:"TRỌNG ÂM", type:"mcq",
 instruct:"Chọn từ có trọng âm rơi vào vị trí KHÁC các từ còn lại.",
 items:[
  {n:4, opts:["balance","leisure","resort","muscle"], ans:2,
   exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi vào vị trí KHÁC các từ còn lại.</div>
<ol>
  <li>Phân tích 4 đáp án:
    <div class="grid2">
      <div><span class='p-word'>balance</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈbæləns/</span> = <span class='p-mean'>sự cân bằng</span></div>
      <div><span class='p-word'>leisure</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈleʒə/</span> = <span class='p-mean'>thời gian rảnh</span></div>
      <div><span class='hl-green'>resort</span> <span class='wt'>n</span> <span class='p-phonetic'>/rɪˈzɔːt/</span> = <span class='p-mean'>khu nghỉ dưỡng</span></div>
      <div><span class='p-word'>muscle</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈmʌsl/</span> = <span class='p-mean'>cơ bắp</span></div>
    </div>
  </li>
  <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Từ 'resort' có trọng âm rơi vào âm tiết thứ 2, vì âm thứ 2 chứa nguyên âm dài /ɔː/.</span></li>
  <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Balance, leisure, muscle đều là danh từ có 2 âm tiết và trọng âm rơi vào âm tiết thứ 1 theo quy tắc chung.</span></li>
</ol>`},
  {n:5, opts:["creative","connection","exhibit","interested"], ans:3,
   exp:`<div class="vnt">💬 Dịch: Chọn từ có trọng âm rơi vào vị trí KHÁC các từ còn lại.</div>
<ol>
  <li>Phân tích 4 đáp án:
    <div class="grid2">
      <div><span class='p-word'>creative</span> <span class='wt'>adj</span> <span class='p-phonetic'>/kriˈeɪtɪv/</span> = <span class='p-mean'>sáng tạo</span></div>

/* ===================== ENGINE ===================== */
const solved = new Set();
let TOTAL = 0;
DATA.forEach(s=>s.items.forEach(()=>TOTAL++));
document.getElementById('total').textContent = TOTAL;

function norm(s){
  return (s||"").toLowerCase().trim()
    .replace(/[’‘`]/g,"'")
    .replace(/[.?!,;:]/g,"")
    .replace(/\s+/g," ");
}

function markSolved(id){
  if(solved.has(id)) return;
  solved.add(id);
  const sc = solved.size;
  document.getElementById('score').textContent = sc;
  document.getElementById('fill').style.width = (sc/TOTAL*100)+"%";
  const mood = document.getElementById('mood');
  mood.textContent = sc>=TOTAL ? "🏆" : sc>=TOTAL*0.7 ? "🔥" : sc>=TOTAL*0.4 ? "😎" : "💪";
}

function confetti(x,y,n){
  const cols=['#FF5D6C','#FFB020','#12C2B0','#4C6FFF','#8B4DE8','#08A24B'];
  for(let i=0;i<(n||34);i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=x+'px';c.style.top=y+'px';c.style.background=cols[i%cols.length];
    const dx=(Math.random()-.5)*360, dur=.9+Math.random()*1.1, rot=Math.random()*360;
    c.style.transform=`translate(${dx}px,0) rotate(${rot}deg)`;
    c.style.animation=`fall ${dur}s cubic-bezier(.3,.7,.5,1) forwards`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),dur*1000+120);
  }
}

function showExp(el,ok,html){
  el.className='exp '+(ok?'ok':'no');
  el.innerHTML="<span class='verdict "+(ok?'ok':'no')+"' style='font-family:Bangers;font-size:1.1rem;display:block;margin-bottom:5px;color:"+(ok?'var(--good)':'var(--bad)')+"'>"+(ok?'✔ CHÍNH XÁC!':'✘ CHƯA ĐÚNG')+"</span>"+html;
  el.classList.add('show');
}

const app=document.getElementById('app');

DATA.forEach((sec,si)=>{
  const box=document.createElement('div');box.className='section';
  box.innerHTML="<div class='sec-head'><span class='chip'>"+sec.tag+"</span><h2>"+sec.title+"</h2></div>"
              +"<div class='sec-instruct'>"+sec.instruct+"</div>";
  sec.items.forEach((it,ii)=>{
    const id=sec.tag+"-"+it.n;
    const q=document.createElement('div');q.className='q';q.id="q_"+id;
    let head="<span class='qnum'>"+it.n+"</span>";
    if(it.stem) head+="<span class='stem'>"+it.stem+(it.hint?" <span class='hintword'>"+it.hint+"</span>":"")+"</span>";
    q.innerHTML=head;

    /* ---- MCQ ---- */
    if(sec.type==="mcq"){
      const opts=document.createElement('div');opts.className='opts';
      it.opts.forEach((o,oi)=>{
        const b=document.createElement('div');b.className='opt';
        // Xóa hoàn toàn hiển thị A, B, C, D
        b.innerHTML="<span>"+o+"</span>";
        b.onclick=()=>{ if(q.dataset.done)return; opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); q.dataset.pick=oi; };
        opts.appendChild(b);
      });
      const exp=document.createElement('div');exp.className='exp';
      const btn=document.createElement('button');btn.className='btn small';btn.textContent='Kiểm tra';btn.style.marginTop='11px';
      btn.onclick=()=>{
        if(q.dataset.pick===undefined){q.classList.add('shake');setTimeout(()=>q.classList.remove('shake'),450);return;}
        const pick=+q.dataset.pick, ok=pick===it.ans;
        const cells=opts.querySelectorAll('.opt');
        cells.forEach(x=>x.classList.remove('sel'));
        cells[pick].classList.add(ok?'ok':'no');
        if(!ok) cells[it.ans].classList.add('ok');
        showExp(exp,ok, "<div style='margin-top:5px'>"+it.exp+"</div>");
        q.dataset.done="1";
        if(ok){markSolved(id);const r=q.getBoundingClientRect();confetti(r.left+r.width/2,r.top+30,26);}
        else{q.classList.add('shake');setTimeout(()=>q.classList.remove('shake'),450);}
      };
      q.appendChild(opts);q.appendChild(btn);q.appendChild(exp);
    }

    /* ---- TEXT ---- */
    else if(sec.type==="text"){
      const bw=document.createElement('div');bw.className='blankwrap';
      const inputs=[];
      it.blanks.forEach((bl,bi)=>{
        const inp=document.createElement('input');inp.className='ans';inp.type='text';
        inp.placeholder=it.blanks.length>1?("Ô "+(bi+1)):"Nhập đáp án…";
        inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','off');inp.spellcheck=false;
        bw.appendChild(inp);inputs.push(inp);
      });
      const btn=document.createElement('button');btn.className='btn small';btn.textContent='Kiểm tra';
      const exp=document.createElement('div');exp.className='exp';
      btn.onclick=()=>{
        if(q.dataset.done)return;
        let allOk=true, empty=true;
        inputs.forEach((inp,bi)=>{
          const val=norm(inp.value); if(val)empty=false;
          const ok=it.blanks[bi].some(a=>norm(a)===val);
          inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no');
          if(!ok)allOk=false;
        });
        if(empty){q.classList.add('shake');setTimeout(()=>q.classList.remove('shake'),450);inputs.forEach(i=>i.classList.remove('no'));return;}
        showExp(exp,allOk,"<div style='margin-top:5px'>"+it.exp+"</div>");
        if(allOk){q.dataset.done="1";markSolved(id);const r=q.getBoundingClientRect();confetti(r.left+r.width/2,r.top+30,26);}
        else{q.classList.add('shake');setTimeout(()=>q.classList.remove('shake'),450);}
      };
      bw.appendChild(btn);q.appendChild(bw);q.appendChild(exp);
    }

    /* ---- ERROR FIX ---- */
    else if(sec.type==="errorfix"){
      const line=document.createElement('div');line.className='efline';
      it.segs.forEach(sg=>{
        if(sg.ul){
          const u=document.createElement('span');u.className='ul';u.dataset.lt=sg.ul;
          u.innerHTML=sg.t+"<span class='tag'>"+sg.ul+"</span>";
          u.onclick=()=>{ if(q.dataset.done)return;
            line.querySelectorAll('.ul').forEach(x=>x.classList.remove('sel'));
            u.classList.add('sel'); q.dataset.pick=sg.ul; fix.classList.add('show'); tin.focus(); };
          line.appendChild(u);
        } else { line.appendChild(document.createTextNode(sg.t)); }
      });
      const fix=document.createElement('div');fix.className='effix';
      const lb=document.createElement('span');lb.className='lb';lb.textContent='Gõ từ/cụm đúng để sửa:';
      const tin=document.createElement('input');tin.className='ans';tin.type='text';tin.placeholder='vd: on, to eat…';
      tin.setAttribute('autocomplete','off');tin.setAttribute('autocapitalize','off');tin.spellcheck=false;
      const btn=document.createElement('button');btn.className='btn small';btn.textContent='Kiểm tra';
      fix.appendChild(lb);fix.appendChild(tin);fix.appendChild(btn);
      const exp=document.createElement('div');exp.className='exp';

      btn.onclick=()=>{
        if(q.dataset.done)return;
        const pick=q.dataset.pick;
        if(!pick){q.classList.add('shake');setTimeout(()=>q.classList.remove('shake'),450);return;}
        const typed=norm(tin.value);
        if(!typed){q.classList.add('shake');setTimeout(()=>q.classList.remove('shake'),450);return;}
        const letterOk = pick===it.ans;
        const wordOk = it.accept.some(a=>norm(a)===typed);
        const ok = letterOk && wordOk;
        const cells=line.querySelectorAll('.ul');
        cells.forEach(x=>x.classList.remove('sel'));
        cells.forEach(x=>{ if(x.dataset.lt===pick) x.classList.add(ok?'ok':'no'); });
        if(!ok) cells.forEach(x=>{ if(x.dataset.lt===it.ans) x.classList.add('ok'); });
        showExp(exp,ok, "<div style='margin-top:5px'>"+it.exp+"</div>");
        if(ok){q.dataset.done="1";tin.classList.add('ok');markSolved(id);const r=q.getBoundingClientRect();confetti(r.left+r.width/2,r.top+30,30);}
        else{tin.classList.add('no');q.classList.add('shake');setTimeout(()=>q.classList.remove('shake'),450);}
      };
      q.appendChild(line);q.appendChild(fix);q.appendChild(exp);
    }

    box.appendChild(q);
  });
  app.appendChild(box);
});

/* Modals Logic */
const btnSubmit = document.getElementById('btnSubmitFinal');
const modalName = document.getElementById('modalName');
const inpName = document.getElementById('inpName');
const nameErr = document.getElementById('nameErr');
const btnConfirmName = document.getElementById('btnConfirmName');
const modalResult = document.getElementById('modalResult');

btnSubmit.onclick = () => {
  modalName.classList.add('show');
  inpName.focus();
};

btnConfirmName.onclick = () => {
  const val = inpName.value.trim();
  if(!val) {
    inpName.classList.add('error');
    nameErr.style.display = 'block';
    modalName.children[0].classList.add('shake');
    setTimeout(()=>modalName.children[0].classList.remove('shake'), 450);
  } else {
    modalName.classList.remove('show');
    showResult(val);
  }
};

inpName.oninput = () => {
  inpName.classList.remove('error');
  nameErr.style.display = 'none';
};

inpName.onkeypress = (e) => {
  if(e.key === 'Enter') btnConfirmName.click();
};

function showResult(name) {
  const finalScore = solved.size;
  const scale10 = ((finalScore / TOTAL) * 10).toFixed(2);
  const ratio = finalScore / TOTAL;

  document.getElementById('resGreeting').textContent = `🌟 THIÊN TÀI! ${name} ĐÃ HOÀN THÀNH!`;
  document.getElementById('resCorrect').textContent = finalScore;
  document.getElementById('resTotal').textContent = TOTAL;
  document.getElementById('res10').textContent = scale10;

  const resGif = document.getElementById('resGif');
  if(ratio === 1) {
    resGif.src = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; // Perfect
    confetti(window.innerWidth/2, 100, 100);
  } else if (ratio >= 0.6) {
    resGif.src = "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif"; // High five / Good
    confetti(window.innerWidth/2, 100, 50);
  } else {
    resGif.src = "https://media.giphy.com/media/2rtQMJvhzOnRe/giphy.gif"; // Cry / Sad
  }

  modalResult.classList.add('show');
}

/* floating comic words */
(function(){
  const words=["FUN!","POW!","DIY!","PLAY","HOBBY","ZAP!","YAY!","BOOM"];
  const p=document.getElementById('pattern');
  for(let i=0;i<9;i++){
    const s=document.createElement('span');
    s.textContent=words[i%words.length];
    s.style.left=(Math.random()*92)+'%';
    s.style.fontSize=(24+Math.random()*30)+'px';
    s.style.animationDuration=(16+Math.random()*14)+'s';
    s.style.animationDelay=(-Math.random()*18)+'s';
    p.appendChild(s);
  }
})();
</script>
