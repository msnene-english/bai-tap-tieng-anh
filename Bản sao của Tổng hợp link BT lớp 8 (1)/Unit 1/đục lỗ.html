<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastel Hogwarts Test - Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --pastel-pink: #FFD1DC;
  --pastel-blue: #AEC6CF;
  --pastel-green: #B5EAD7;
  --pastel-purple: #C7CEEA;
  --pastel-yellow: #FDFD96;
  --glass-bg: rgba(255, 255, 255, 0.4);
  --glass-border: rgba(255, 255, 255, 0.6);
  --text-dark: #2C3E50;
  --correct: #2ECC71;
  --wrong: #E74C3C;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

body {
  background: linear-gradient(-45deg, var(--pastel-pink), var(--pastel-blue), var(--pastel-green), var(--pastel-purple));
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: var(--text-dark);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Floating SVG Pattern */
.svg-pattern {
  position: fixed; inset: 0; z-index: 0; opacity: 0.15; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='30' font-size='20'%3E📚%3C/text%3E%3Ctext x='70' y='60' font-size='20'%3E🪄%3C/text%3E%3Ctext x='20' y='90' font-size='20'%3E🏰%3C/text%3E%3Ctext x='80' y='110' font-size='20'%3E🦉%3C/text%3E%3C/svg%3E");
}

/* Header */
.top-header {
  position: relative; z-index: 10;
  background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px);
  padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 2px solid var(--glass-border); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.top-header h1 { font-family: 'Cinzel', serif; font-size: 1.5rem; color: #5B2C6F; text-shadow: 0 0 10px rgba(255,255,255,0.8); }
.teacher-tag { font-size: 0.85rem; font-weight: 700; color: #8E44AD; background: rgba(255,255,255,0.7); padding: 4px 12px; border-radius: 20px; }

/* Score Bar */
.score-board {
  display: flex; align-items: center; gap: 15px; font-weight: 900; color: #2980B9;
}

/* Split Layout */
.split-layout {
  display: flex; flex: 1; overflow: hidden; position: relative; z-index: 5;
}
.left-pane, .right-pane {
  flex: 1; overflow-y: auto; padding: 20px 30px; scroll-behavior: smooth;
}
.left-pane { border-right: 2px dashed rgba(255,255,255,0.6); }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); }
::-webkit-scrollbar-thumb { background: rgba(142, 68, 173, 0.4); border-radius: 10px; }

/* Glass Cards */
.glass-card {
  background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 25px; margin-bottom: 25px; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
}

/* Reading Passage Styling */
.passage-title { font-family: 'Cinzel', serif; font-size: 1.6rem; color: #8E44AD; margin-bottom: 15px; border-bottom: 2px solid rgba(142, 68, 173, 0.3); padding-bottom: 5px; }
.passage-para { font-size: 1.15rem; line-height: 1.8; color: #2C3E50; margin-bottom: 10px; font-weight: 700; }
.blank-num { display: inline-flex; justify-content: center; align-items: center; width: 28px; height: 28px; background: #FF9AA2; color: #FFF; border-radius: 50%; font-size: 0.9rem; font-weight: 900; margin: 0 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

/* Translation & Buttons */
.trans-btn {
  background: linear-gradient(135deg, #FFB7B2, #FF9AA2); color: #FFF; border: none; padding: 6px 12px; border-radius: 12px;
  font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(255, 154, 162, 0.4); margin-bottom: 15px;
}
.trans-btn:hover { transform: translateY(-2px); }
.trans-text {
  display: none; background: rgba(255,255,255,0.6); padding: 12px; border-radius: 10px; border-left: 4px solid #FF9AA2; font-size: 1.05rem; font-weight: 700; color: #D35400; margin-bottom: 20px;
}
.trans-text.show { display: block; animation: fadeIn 0.3s ease; }

/* Glossary Table */
.glossary-wrap h4 { color: #16A085; margin-bottom: 10px; font-family: 'Cinzel', serif; font-size: 1.2rem; }
.glossary-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.5); border-radius: 10px; overflow: hidden; font-size: 0.95rem; }
.glossary-table th, .glossary-table td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.05); }
.glossary-table th { background: rgba(22, 160, 133, 0.2); color: #0E6655; font-weight: 900; }
.glossary-table td { font-weight: 700; }

/* Questions & MCQ */
.q-title { font-size: 1.2rem; font-weight: 900; color: #2980B9; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
.q-badge { background: #3498DB; color: #FFF; padding: 4px 10px; border-radius: 12px; font-size: 1rem; }
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt-btn {
  background: rgba(255,255,255,0.7); border: 2px solid #BDC3C7; border-radius: 15px; padding: 15px;
  font-size: 1.05rem; font-weight: 800; color: #34495E; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 0 #BDC3C7; text-align: center;
}
.opt-btn:hover:not(:disabled) { transform: translateY(-4px); box-shadow: 0 8px 0 #BDC3C7; background: #FFF; }
.opt-btn:active:not(:disabled) { transform: translateY(0); box-shadow: 0 0 0 transparent; }
.opt-btn:disabled { cursor: not-allowed; }
.opt-btn.correct { background: #D5F5E3; border-color: var(--correct); color: #145A32; box-shadow: 0 4px 0 #27AE60; }
.opt-btn.wrong { background: #FADBD8; border-color: var(--wrong); color: #7B241C; box-shadow: 0 4px 0 #C0392B; }
.shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* Detailed Master Explanations */
.explanation {
  margin-top: 15px; padding: 20px; background: rgba(255,255,255,0.85); border-radius: 15px; border: 2px dashed #9B59B6;
  font-size: 1rem; line-height: 1.7; display: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
}
.explanation.show { display: block; animation: slideDown 0.4s ease; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.exp-title { font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 900; margin-bottom: 10px; }
.exp-title.ok { color: #27AE60; }
.exp-title.no { color: #C0392B; }

/* Strict Ledger CSS Formatting */
.p-word { color: #003366; font-weight: normal; } /* TUYỆT ĐỐI KHÔNG BÔI ĐẬM TIẾNG ANH */
.p-mean { color: #C0392B; font-weight: bold; } /* BÔI ĐẬM TIẾNG VIỆT */
.p-type { background: rgba(139,0,0,0.1); color: #8B0000; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: bold; font-size: 0.85rem; }
.p-grammar { text-decoration: underline; text-decoration-color: #8B0000; text-decoration-thickness: 2px; font-weight: bold; }
.hl-green { color: #145A32; font-weight: 900; background: rgba(46,204,113,0.2); padding: 2px 6px; border-radius: 4px; }
.hl-red { color: #922B21; text-decoration: line-through; font-weight: 800; opacity: 0.8; }
.ev-box { background: #FEF9E7; padding: 10px; border-left: 4px solid #F1C40F; border-radius: 8px; margin: 10px 0; font-weight: 700; color: #7D6608; }

/* Bottom Action */
.action-area { text-align: center; padding: 20px; background: rgba(255,255,255,0.4); backdrop-filter: blur(10px); border-top: 2px solid var(--glass-border); position: relative; z-index: 10; }
.submit-btn {
  background: linear-gradient(135deg, #8E44AD, #3498DB); color: #FFF; border: none; border-radius: 30px;
  padding: 15px 40px; font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 900; cursor: pointer;
  box-shadow: 0 6px 20px rgba(142, 68, 173, 0.4); transition: transform 0.2s;
}
.submit-btn:hover { transform: scale(1.05); }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 9999; }
.modal-content { background: linear-gradient(135deg, #FFF, #F4F6F7); border-radius: 25px; padding: 40px; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 4px solid #8E44AD; }
.modal-content h2 { font-family: 'Cinzel', serif; color: #8E44AD; margin-bottom: 15px; font-size: 1.8rem; }
.name-input { width: 100%; padding: 15px; border: 2px solid #BDC3C7; border-radius: 12px; font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; outline: none; text-align: center; }
.name-input:focus { border-color: #8E44AD; }
.btn-confirm { background: #27AE60; color: #FFF; border: none; padding: 12px 30px; border-radius: 20px; font-size: 1.1rem; font-weight: 900; cursor: pointer; }
.score-big { font-size: 3.5rem; font-weight: 900; color: #E74C3C; margin: 10px 0; text-shadow: 2px 2px 0px #FADBD8; }
.score-scale { font-size: 1.5rem; color: #2980B9; font-weight: 900; margin-bottom: 15px; }
.gif-box { width: 100%; border-radius: 15px; border: 3px solid #F1C40F; margin-bottom: 20px; }

/* Confetti */
.confetti { position: fixed; z-index: 9998; pointer-events: none; animation: fall 2s linear forwards; }
@keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="svg-pattern"></div>

<header class="top-header">
  <h1>✨ Pastel Hogwarts Test</h1>
  <div class="score-board">
    <span>🏆 Điểm Phép Thuật: </span>

<div class="split-layout">

<div class="action-area">

</div>

<!-- Modal Nhập Tên -->
<div class="modal-overlay" id="nameModal">

    <p style="font-weight: 700; color: #7F8C8D; margin-bottom: 20px;">Giáo Sư MS Chí Nên cần biết tên em để ghi vào Bảng Điểm Nhà!</p>
    <input type="text" id="studentName" class="name-input" placeholder="Ví dụ: Harry Potter">
    <button class="btn-confirm" onclick="submitTest()">✨ Xác Nhận Nộp Bài</button>

</div>

<!-- Modal Kết Quả -->

</div>

<script>
// --- AUDIO SYSTEM (Web Audio API) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if(!audioCtx) audioCtx = new AudioContext(); if(audioCtx.state === 'suspended') audioCtx.resume(); }
function playDing() {
  initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.stop(audioCtx.currentTime + 0.5);
}
function playBuzz() {
  initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.stop(audioCtx.currentTime + 0.3);
}

// --- CONFETTI SYSTEM ---
function spawnConfetti() {
  const colors = ['#2ECC71', '#3498DB', '#F1C40F', '#E74C3C', '#9B59B6'];
  for(let i=0; i<40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = c.style.height = (Math.random() * 10 + 5) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    c.style.animationDuration = (Math.random() * 2 + 1) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

// --- DATA STRUCTURE ---
const passages = [
  {
    id: "p1",
    title: "1. Let's Build a Model!",
    paras: [
      {
        en: "Do you like <span class='blank-num'>1</span> things with your hands? Join our Model-Making Workshop! You will learn to make simple models like cars, houses, or robots using paper, plastic, and glue. It's easy and fun! You don't need <span class='blank-num'>2</span> experience. We will help you step by step. Bring your ideas and <span class='blank-num'>3</span> Make new friends and build something amazing together. <span class='blank-num'>4</span> the end, you can take your model home and show it to your family.",
        vi: "Bạn có thích tự tay làm mọi thứ không? Hãy tham gia Xưởng làm mô hình của chúng tôi! Bạn sẽ học cách làm các mô hình đơn giản như ô tô, nhà cửa hoặc rô-bốt bằng giấy, nhựa và keo dán. Nó thật dễ dàng và thú vị! Bạn không cần bất kỳ kinh nghiệm nào. Chúng tôi sẽ giúp bạn từng bước. Hãy mang theo ý tưởng và sự sáng tạo của bạn. Kết bạn mới và cùng nhau xây dựng một điều gì đó tuyệt vời. Cuối cùng, bạn có thể mang mô hình của mình về nhà và khoe với gia đình."
      },
      {
        en: "Every Saturday<br>2 PM-4 PM<br>City Youth Center<br>Come and create something cool!",
        vi: "Thứ Bảy hàng tuần<br>2 giờ chiều - 4 giờ chiều<br>Trung tâm thanh thiếu niên thành phố<br>Hãy đến và tạo ra điều gì đó thật tuyệt vời!"
      }
    ],
    glossary: [
      { w: "workshop", p: "n", m: "xưởng, buổi hội thảo thực hành" },
      { w: "experience", p: "n", m: "kinh nghiệm" },
      { w: "creativity", p: "n", m: "sự sáng tạo" },
      { w: "amazing", p: "adj", m: "tuyệt vời, đáng kinh ngạc" },
      { w: "simple", p: "adj", m: "đơn giản" },
      { w: "robot", p: "n", m: "người máy" },
      { w: "plastic", p: "n", m: "nhựa" },
      { w: "glue", p: "n", m: "keo dán" },
      { w: "idea", p: "n", m: "ý tưởng" },
      { w: "create", p: "v", m: "tạo ra" }
    ]
  },
  {
    id: "p2",
    title: "2. Let's Talk About Leisure Time!",
    paras: [
      {
        en: "Do you like watching movies, playing sports, or reading books? Everyone needs time to relax and enjoy life. Leisure time is important <span class='blank-num'>5</span> it helps us rest and feel happy. After work or school, you can go <span class='blank-num'>6</span> a walk, listen to music, or meet friends. These activities help your body and mind stay <span class='blank-num'>7</span>. You don't need much money-just a little free time and a fun idea. What do you like to do in your free time? Share your <span class='blank-num'>8</span> with us and let's enjoy our leisure time together!",
        vi: "Bạn có thích xem phim, chơi thể thao hay đọc sách không? Mọi người đều cần thời gian để thư giãn và tận hưởng cuộc sống. Thời gian rảnh rỗi rất quan trọng bởi vì nó giúp chúng ta nghỉ ngơi và cảm thấy hạnh phúc. Sau giờ làm việc hoặc giờ học, bạn có thể đi dạo, nghe nhạc hoặc gặp gỡ bạn bè. Những hoạt động này giúp cơ thể và tinh thần của bạn luôn khỏe mạnh. Bạn không cần nhiều tiền - chỉ cần một chút thời gian rảnh và một ý tưởng thú vị. Bạn thích làm gì trong thời gian rảnh rỗi? Hãy chia sẻ sở thích của bạn với chúng tôi và cùng nhau tận hưởng thời gian rảnh rỗi nhé!"

    ],
    glossary: [
      { w: "relax", p: "v", m: "thư giãn" },

    paras: [
      {
        en: "Reading books is one of the <span class='blank-num'>9</span> hobbies that I know. I like <span class='blank-num'>10</span> books because it brings me many benefits. Books provide me <span class='blank-num'>11</span> so much information and facts. Reading books is also a way for me <span class='blank-num'>12</span> in my free time. I can learn a lot of good things from books. Moreover, I can improve my knowledge and skills <span class='blank-num'>13</span> I haven't known before. In addition, I learn how to live and behave <span class='blank-num'>14</span> with others. In conclusion, reading books is a habit that everyone should have.",
        vi: "Đọc sách là một trong những sở thích tuyệt vời nhất mà tôi biết. Tôi thích đọc sách vì nó mang lại cho tôi nhiều lợi ích. Sách cung cấp cho tôi rất nhiều thông tin và sự thật. Đọc sách cũng là một cách để tôi thư giãn trong thời gian rảnh rỗi. Tôi có thể học được nhiều điều hay từ sách. Hơn nữa, tôi có thể cải thiện kiến ​​thức và kỹ năng mà tôi chưa từng biết trước đây. Ngoài ra, tôi học cách sống và cư xử tốt với người khác. Tóm lại, đọc sách là một thói quen mà ai cũng nên có."
      }
    ],

// --- RENDER LOGIC ---
function renderPassages() {
  const container = document.getElementById('readingContainer');
  let html = '';
  passages.forEach(p => {
    html += `<div class="glass-card">
               <h2 class="passage-title">${p.title}</h2>`;
    p.paras.forEach((para, idx) => {
      const pId = `trans-${p.id}-${idx}`;
      html += `<p class="passage-para">${para.en}</p>
               <button class="trans-btn" onclick="document.getElementById('${pId}').classList.toggle('show')">Mở dịch đoạn này 🌟</button>
               <div id="${pId}" class="trans-text">${para.vi}</div>`;
    });
    
    // Glossary
    html += `<div class="glossary-wrap">
               <h4>📚 Bảng Từ Vựng Bậc Thầy (Academic Vocabulary)</h4>
               <table class="glossary-table">
                 <tr><th>Từ vựng</th><th>Loại từ</th><th>Nghĩa tiếng Việt</th></tr>`;
    p.glossary.forEach(g => {
      html += `<tr><td><span class="p-word">${g.w}</span></td><td><span class="p-type">${g.p}</span></td><td><span class="p-mean">${g.m}</span></td></tr>`;
    });
    html += `</table></div></div>`;
  });
  container.innerHTML = html;
}

function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  let html = '';
  questions.forEach((q, index) => {
    html += `<div class="glass-card" id="qCard-${index}">
               <div class="q-title"><span class="q-badge">Câu ${q.q}</span> Chọn Thần Chú Điền Vào Chỗ Trống:</div>
               <div class="options-grid" id="opts-${index}">`;
    let shuffledOpts = shuffle([...q.opts]);
    shuffledOpts.forEach(opt => {
      const safeOpt = opt.replace(/'/g, "\\'");
      html += `<button class="opt-btn" onclick="checkAnswer(this, '${safeOpt}', ${index})">${opt}</button>`;
    });
    html += `</div>
             <div class="explanation" id="exp-${index}">
               <div id="expTitle-${index}"></div>
               ${q.exp}
             </div>
             </div>`;
  });
  container.innerHTML = html;
}

// --- INTERACTION LOGIC ---
let score = 0;
let answered = 0;
const total = questions.length;

function checkAnswer(btn, selected, index) {
  const card = document.getElementById(`qCard-${index}`);
  const buttons = document.getElementById(`opts-${index}`).querySelectorAll('.opt-btn');
  buttons.forEach(b => b.disabled = true);
  
  const correctAns = questions[index].ans;
  const expDiv = document.getElementById(`exp-${index}`);
  const expTitle = document.getElementById(`expTitle-${index}`);
  
  if (selected === correctAns) {
    btn.classList.add('correct');
    playDing(); spawnConfetti();
    score++;
    expTitle.innerHTML = `<h3 class="exp-title ok">✅ Lựa chọn Xuất Sắc!</h3>`;
  } else {
    btn.classList.add('wrong', 'shake');
    playBuzz();
    buttons.forEach(b => {
      if(b.innerText === correctAns) { b.classList.add('correct'); b.style.opacity = '0.7'; }
    });
    expTitle.innerHTML = `<h3 class="exp-title no">❌ Ôi không, bùa chú chệch hướng!</h3>`;
  }
  
  expDiv.classList.add('show');
  answered++;
  document.getElementById('scoreTracker').innerText = `${score} / ${total}`;
}

// --- SUBMISSION & MODALS ---
function openNameModal() {
  if (answered < total) {
    if(!confirm("Em chưa hoàn thành hết bài thi! Vẫn muốn nộp chứ?")) return;
  }
  document.getElementById('nameModal').style.display = 'flex';
}

function submitTest() {
  const nameInput = document.getElementById('studentName');
  const studentName = nameInput.value.trim();
  if(!studentName) {
    nameInput.style.borderColor = '#E74C3C';
    setTimeout(() => nameInput.style.borderColor = '#BDC3C7', 1000);
    return;
  }
  
  document.getElementById('nameModal').style.display = 'none';
  showResult(studentName);
}

function showResult(name) {
  document.getElementById('resultModal').style.display = 'flex';
  document.getElementById('resName').innerText = `✨ Chúc mừng phù thuỷ ${name} ✨`;
  document.getElementById('resScore').innerText = `${score} / ${total}`;
  
  const scale10 = ((score / total) * 10).toFixed(1);
  document.getElementById('resScale').innerText = `(Quy đổi: ${scale10} Điểm)`;
  
  const percent = score / total;
  const gifEl = document.getElementById('resGif');
  const commentEl = document.getElementById('resComment');
  
  if (percent === 1) {
    gifEl.src = "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif"; // Thiên tài
    commentEl.innerText = "Lời phê của Ms MS Chí Nên: Quá xuất sắc! Em là một phù thủy thiên tài!";
    spawnConfetti(); setTimeout(spawnConfetti, 800);
  } else if (percent >= 0.6) {
    gifEl.src = "https://media.giphy.com/media/3o72FcJmLzIdYJiyKA/giphy.gif"; // Khá
    commentEl.innerText = "Lời phê của Ms MS Chí Nên: Rất tốt! Kỹ năng pháp thuật của em rất đáng khen!";
    spawnConfetti();
  } else {
    gifEl.src = "https://media.giphy.com/media/26FPImXfDlv4AFbBC/giphy.gif"; // Yếu
    commentEl.innerText = "Lời phê của Ms MS Chí Nên: Cố lên nhé! Đọc kỹ giải thích để làm phép chuẩn hơn!";
  }
}

// --- INIT ---
window.onload = () => {
  document.body.addEventListener('click', initAudio, { once: true });
  renderPassages();
  renderQuestions();
};
