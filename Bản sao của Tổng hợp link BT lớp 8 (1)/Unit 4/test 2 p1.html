<script>
(function(){const items=['🧵','🏔️','🪕','🎋','🌾','🏠','🧶','🎎','🥁','🌽','🪗','🧺','🌸','⛰️','🎐','🪘'];
  const layer=document.getElementById('foodlayer');
  for(let i=0;i<20;i++){const s=document.createElement('span');s.textContent=items[i%items.length];
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(1.6+Math.random()*2.2)+'rem';
    s.style.animationDelay=(Math.random()*8)+'s';s.style.animationDuration=(11+Math.random()*10)+'s';layer.appendChild(s);}})();

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#FF4757','#FDCB6E','#00D26A','#5ec8ff','#a463f2','#0e7490','#00C9A7'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Ms. Chí Nên · NEN giải thích chi tiết";
const TOTAL=40;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"<u>c</u>ostume",c:false},{t:"fo<u>c</u>us",c:false},{t:"dan<u>c</u>ing",c:true},{t:"<u>c</u>ommunal",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "c" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'><u>c</u>ostume</span> <span class='p-phonetic'>/ˈkɒstjuːm/</span> = <span class='p-mean'>trang phục</span> → âm <b>/k/</b></div>
     <div><span class='p-word'>fo<u>c</u>us</span> <span class='p-phonetic'>/ˈfəʊkəs/</span> = <span class='p-mean'>tập trung</span> → âm <b>/k/</b></div>
     <div><span class='hl-green'>dancing</span> <span class='p-phonetic'>/ˈdɑːnsɪŋ/</span> = <span class='p-mean'>nhảy múa</span> → âm <b>/s/</b></div>
     <div><span class='p-word'><u>c</u>ommunal</span> <span class='p-phonetic'>/kəˈmjuːnl/</span> = <span class='p-mean'>chung, cộng đồng</span> → âm <b>/k/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"dancing" có "c" (đứng trước "i") đọc là /s/, khác với ba từ kia đọc "c" cứng /k/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>costume, focus, communal đều có âm /k/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"<u>g</u>uest",c:false},{t:"<u>g</u>ardening",c:false},{t:"<u>g</u>uide",c:false},{t:"<u>g</u>enerous",c:true}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "g" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>guest</span> <span class='p-phonetic'>/ɡest/</span> = <span class='p-mean'>khách</span> → âm <b>/ɡ/</b></div>
     <div><span class='p-word'>gardening</span> <span class='p-phonetic'>/ˈɡɑːdnɪŋ/</span> = <span class='p-mean'>làm vườn</span> → âm <b>/ɡ/</b></div>
     <div><span class='p-word'>guide</span> <span class='p-phonetic'>/ɡaɪd/</span> = <span class='p-mean'>hướng dẫn</span> → âm <b>/ɡ/</b></div>
     <div><span class='hl-green'>generous</span> <span class='p-phonetic'>/ˈdʒenərəs/</span> = <span class='p-mean'>hào phóng</span> → âm <b>/dʒ/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"generous" có "g" (đứng trước "e") đọc là /dʒ/, khác với ba từ kia đọc "g" cứng /ɡ/.</span></li>

     <div><span class='p-word'>modern</span> <span class='wt'>adj</span> = <span class='p-mean'>hiện đại</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Tre, lá, rơm đều là vật liệu "natural" (tự nhiên).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>expensive, communal, modern không mô tả đúng bản chất của tre/lá/rơm.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:16,type:"mcq",
 q:"____ villages in the Central Highlands still rely on traditional farming methods.",
 options:[{t:"Much",c:false},{t:"Any",c:false},{t:"Some",c:true},{t:"A little",c:false}],
 exp:`<div class="vnt">💬 Dịch: Một số buôn làng ở Tây Nguyên vẫn dựa vào các phương pháp canh tác truyền thống.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>Much</span> <span class='wt'>det</span> = <span class='p-mean'>nhiều (không đếm được)</span></div>
     <div><span class='p-word'>Any</span> <span class='wt'>det</span> = <span class='p-mean'>bất kỳ (phủ định/hỏi)</span></div>
     <div><span class='hl-green'>Some</span> <span class='wt'>det</span> = <span class='p-mean'>một số</span></div>
     <div><span class='p-word'>A little</span> <span class='wt'>det</span> = <span class='p-mean'>một ít (không đếm được)</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu khẳng định + "villages" (đếm được số nhiều) → dùng "Some" (một số).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Much/A little đi với danh từ không đếm được; "Any" dùng cho câu phủ định/nghi vấn.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:17,type:"mcq",
 q:"Mike: \"What do you think about visiting a traditional Tay house?\" — Rita: \"____. We could learn so much about their traditions.\"",
 options:[{t:"I have to think carefully.",c:false},{t:"I think it's interesting.",c:true},{t:"You should think twice about it.",c:false},{t:"Don't think that much.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Mike: "Cậu nghĩ sao về việc đi thăm một ngôi nhà truyền thống của người Tày?" — Rita: "Tớ thấy thú vị đấy. Chúng ta có thể học được nhiều điều về truyền thống của họ."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>I have to think carefully.</span> = <span class='p-mean'>Tớ phải suy nghĩ kỹ.</span></div>
     <div><span class='hl-green'>I think it's interesting.</span> = <span class='p-mean'>Tớ thấy thú vị.</span></div>
     <div><span class='p-word'>You should think twice about it.</span> = <span class='p-mean'>Cậu nên cân nhắc lại.</span></div>
     <div><span class='p-word'>Don't think that much.</span> = <span class='p-mean'>Đừng nghĩ nhiều thế.</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu sau thể hiện thái độ TÍCH CỰC ("học được nhiều điều") → câu đầu phải đồng tình: "I think it's interesting."</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác mang ý do dự/từ chối, mâu thuẫn với câu tiếp theo đầy hào hứng.</span></li></ol>`},

/* IV. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:18,type:"error",
 q:"With a <u>population</u> of 1.6 million, <u>the</u> Tay is <u>a</u> second <u>largest</u> ethnic group in Viet Nam.",
 options:["population","the","a","largest"],correctIdx:2,
 accept:["the"],key:"a → the",
 exp:`<div class="vnt">💬 Dịch: Với dân số 1,6 triệu người, người Tày là dân tộc lớn thứ hai ở Việt Nam.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>a</span> → sửa thành <span class='hl-green'>the</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Cấu trúc so sánh nhất "the + second + largest" luôn dùng mạo từ "the", không dùng "a": "the second largest ethnic group".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:19,type:"error",
 q:"<u>Many</u> communities <u>around</u> the world have <u>its</u> own languages and <u>traditions</u>.",
 options:["Many","around","its","traditions"],correctIdx:2,
 accept:["their"],key:"its → their",
 exp:`<div class="vnt">💬 Dịch: Nhiều cộng đồng trên thế giới có ngôn ngữ và truyền thống riêng của họ.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>its</span> → sửa thành <span class='hl-green'>their</span></li>

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:20,type:"error",
 q:"<u>What</u> ethnic minority <u>group</u> live <u>in</u> the Mekong Delta, the Khmer <u>or</u> the Ede?",
 options:["What","group","in","or"],correctIdx:0,
 accept:["which"],key:"What → Which",

   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Khi có sự LỰA CHỌN GIỚI HẠN được nêu rõ (the Khmer or the Ede), ta dùng "Which" (nào trong số đó), không dùng "What".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:21,type:"fill",
 q:"______ (they / collect) wood in the forest right now? <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",

 answer:["grew"],
 exp:`<div class="vnt">💬 Dịch: Ngày trước, ông ấy trồng lúa và ngô để kiếm sống.</div>

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:25,type:"fill",

/* VI. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:26,type:"fill",
 q:"He became the ______ of the house after his parents passed away. <span class='hint-word'>(own)</span>",
 answer:["owner"],
 exp:`<div class="vnt">💬 Dịch: Anh ấy trở thành <b>chủ</b> ngôi nhà sau khi bố mẹ qua đời.</div>
 <ol><li>Từ gốc: <span class='p-word'>own</span> <span class='wt'>v</span> = <span class='p-mean'>sở hữu</span> → dạng cần điền: <span class='hl-green'>owner</span> <span class='wt'>n</span> = <span class='p-mean'>chủ sở hữu</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: owner</span> <span class='p-grammar'>Sau "the" cần DANH TỪ chỉ NGƯỜI. Thêm hậu tố "-er": own → owner (người sở hữu).</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"The children often ______ near the rice fields to play folk games. <span class='hint-word'>(gathering)</span>",
 answer:["gather"],
 exp:`<div class="vnt">💬 Dịch: Bọn trẻ thường <b>tụ tập</b> gần những cánh đồng lúa để chơi trò chơi dân gian.</div>
 <ol><li>Từ gốc: <span class='p-word'>gathering</span> <span class='wt'>n</span> = <span class='p-mean'>buổi tụ họp</span> → dạng cần điền: <span class='hl-green'>gather</span> <span class='wt'>v</span> = <span class='p-mean'>tụ tập</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: gather</span> <span class='p-grammar'>Vị trí này cần ĐỘNG TỪ (chủ ngữ "The children", có "often"). Thì hiện tại đơn số nhiều → dùng động từ gốc "gather".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"The Northwest region of our country is home to the most beautiful ______ fields. <span class='hint-word'>(terrace)</span>",
 answer:["terraced"],
 exp:`<div class="vnt">💬 Dịch: Vùng Tây Bắc của nước ta là nơi có những thửa ruộng <b>bậc thang</b> đẹp nhất.</div>
 <ol><li>Từ gốc: <span class='p-word'>terrace</span> <span class='wt'>n</span> = <span class='p-mean'>bậc thang, sân thượng</span> → dạng cần điền: <span class='hl-green'>terraced</span> <span class='wt'>adj</span> = <span class='p-mean'>ruộng bậc thang</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: terraced</span> <span class='p-grammar'>Cần TÍNH TỪ đứng trước danh từ "fields" → "terraced fields" (ruộng bậc thang). Thêm "-d".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"______, the costumes of the Ede are black or indigo. <span class='hint-word'>(tradition)</span>",
 answer:["traditionally"],
 exp:`<div class="vnt">💬 Dịch: <b>Theo truyền thống</b>, trang phục của người Ê-đê có màu đen hoặc chàm.</div>
 <ol><li>Từ gốc: <span class='p-word'>tradition</span> <span class='wt'>n</span> = <span class='p-mean'>truyền thống</span> → dạng cần điền: <span class='hl-green'>Traditionally</span> <span class='wt'>adv</span> = <span class='p-mean'>theo truyền thống</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: Traditionally</span> <span class='p-grammar'>Đầu câu, bổ nghĩa cho cả câu → cần TRẠNG TỪ. Thêm "-al" + "-ly": tradition → traditionally.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:30,type:"fill",
 q:"Ethnic minority groups make up about 13% of the total ______ of Viet Nam. <span class='hint-word'>(populate)</span>",
 answer:["population"],
 exp:`<div class="vnt">💬 Dịch: Các dân tộc thiểu số chiếm khoảng 13% tổng <b>dân số</b> của Việt Nam.</div>
 <ol><li>Từ gốc: <span class='p-word'>populate</span> <span class='wt'>v</span> = <span class='p-mean'>cư trú, sinh sống</span> → dạng cần điền: <span class='hl-green'>population</span> <span class='wt'>n</span> = <span class='p-mean'>dân số</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: population</span> <span class='p-grammar'>Sau "the total" cần DANH TỪ. Thêm hậu tố "-ion": populate → population.</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:42,type:"fill",
 q:"is / multi-ethnic / 54 ethnic groups / with / a / Viet Nam / country. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["viet nam is a multi-ethnic country with 54 ethnic groups","viet nam is a multi ethnic country with 54 ethnic groups"],
 exp:`<div class="vnt">💬 Dịch: Việt Nam là một quốc gia đa dân tộc với 54 dân tộc anh em.</div>
 <ol><li>Đáp án: <span class='hl-green'>Viet Nam is a multi-ethnic country with 54 ethnic groups.</span></li>

{sec:"C. WRITING",part:"I. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:43,type:"fill",
 q:"the joyful sounds / welcome / of / The Muong / with / New Year's Eve / gongs and drums. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["the muong welcome new year's eve with the joyful sounds of gongs and drums","the muong welcome new years eve with the joyful sounds of gongs and drums"],
 exp:`<div class="vnt">💬 Dịch: Người Mường đón Giao thừa bằng những âm thanh vui tươi của cồng chiêng và trống.</div>
 <ol><li>Đáp án: <span class='hl-green'>The Muong welcome New Year's Eve with the joyful sounds of gongs and drums.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ ngữ (The Muong) + động từ (welcome) + tân ngữ (New Year's Eve) + "with the joyful sounds OF gongs and drums" (bằng âm thanh vui tươi của…).</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:44,type:"fill",
 q:"Gợi ý: If / you / not follow / instructions / carefully / you / make / a lot of / mistake. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["if you do not follow the instructions carefully you will make a lot of mistakes","if you don't follow the instructions carefully you will make a lot of mistakes"],
 exp:`<div class="vnt">💬 Dịch: Nếu bạn không làm theo hướng dẫn một cách cẩn thận, bạn sẽ mắc rất nhiều lỗi.</div>
 <ol><li>Đáp án: <span class='hl-green'>If you do not follow the instructions carefully, you will make a lot of mistakes.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (do not follow), … will + V (will make)"; danh từ số nhiều "mistakes".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:45,type:"fill",
 q:"Gợi ý: The Pu Peo / believe / that / build / house / be / one of the greatest jobs / life. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["the pu peo believe that building a house is one of the greatest jobs in life"],
 exp:`<div class="vnt">💬 Dịch: Người Pu Péo tin rằng việc dựng nhà là một trong những công việc quan trọng nhất đời người.</div>
 <ol><li>Đáp án: <span class='hl-green'>The Pu Peo believe that building a house is one of the greatest jobs in life.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Mệnh đề "that + S + V": chủ ngữ là danh động từ "building a house" (số ít → is); cụm "one of the greatest jobs IN life".</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:46,type:"fill",
 q:"Gợi ý: What kind / house / ethnic groups / the Central Highlands / live in? <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["what kind of house do ethnic groups in the central highlands live in","what kinds of house do ethnic groups in the central highlands live in","what kind of houses do ethnic groups in the central highlands live in"],
 exp:`<div class="vnt">💬 Dịch: Các dân tộc ở Tây Nguyên sống trong loại nhà nào?</div>
 <ol><li>Đáp án: <span class='hl-green'>What kind(s) of house do ethnic groups in the Central Highlands live in?</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "What kind of + N + do + S + V?"; giới từ "live IN" giữ ở cuối câu; "in the Central Highlands" bổ nghĩa cho chủ ngữ.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Viết câu hoàn chỉnh từ các gợi ý cho sẵn",n:47,type:"fill",
 q:"Gợi ý: Yesterday / they / arrive / the station / late / they / miss / last evening train. <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",
 answer:["yesterday they arrived at the station late so they missed the last evening train","yesterday they arrived at the station late so they missed the last evening train."],
 exp:`<div class="vnt">💬 Dịch: Hôm qua họ đến ga muộn, nên họ đã lỡ chuyến tàu tối cuối cùng.</div>
 <ol><li>Đáp án: <span class='hl-green'>Yesterday, they arrived at the station late, so they missed the last evening train.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "Yesterday" → Quá khứ đơn (arrived, missed); "arrive AT the station"; nối nguyên nhân–kết quả bằng "so".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:48,type:"mcq",
 q:"Câu gốc: <em>Is there an open fire in the middle of your house?</em>",
 options:[{t:"Does your house have an open fire in the middle?",c:true},
          {t:"Are you have an open fire in the middle of your house?",c:false},
          {t:"Do you has an open fire in the middle of your house?",c:false},
          {t:"Is your house have an open fire in the middle?",c:false}],
 exp:`<div class="vnt">💬 Dịch: Nhà của bạn có bếp lửa ở giữa nhà không?</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Does your house have an open fire in the middle?</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Is there + N?" (có … không?) = "Does + S + have + N?". Chủ ngữ "your house" số ít → "Does … have".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"Are you have" và "Is your house have" sai ngữ pháp (thừa động từ); "Do you has" sai chia (phải là "have").</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:49,type:"mcq",
 q:"Câu gốc: <em>The plan didn't succeed; however, we gained valuable lessons from it.</em>",
 options:[{t:"We gained valuable lessons from the plan because it didn't succeed.",c:false},
          {t:"We gained valuable lessons from the plan, so it failed.",c:false},
          {t:"Although the plan failed, we gained valuable lessons from it.",c:true},
          {t:"The plan didn't fail, but we gained valuable lessons from it.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Mặc dù kế hoạch thất bại, chúng tôi vẫn rút ra được những bài học quý giá từ nó.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Although the plan failed, we gained valuable lessons from it.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"didn't succeed; however, …" (thất bại; tuy nhiên) mang nghĩa NHƯỢNG BỘ → dùng "Although + mệnh đề, mệnh đề chính".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"because/so" sai quan hệ logic; câu D nói "didn't fail" trái nghĩa câu gốc.</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:50,type:"mcq",
 q:"Câu gốc: <em>They have different kinds of fruits and flowers in their garden.</em>",
 options:[{t:"There are a few fruits and flowers in their garden.",c:false},
          {t:"Their garden has a variety of fruits and flowers.",c:true},
          {t:"Their garden has no fruits or flowers at all.",c:false},
          {t:"There is only one kind of fruit and flower in their garden.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Khu vườn của họ có đa dạng các loại trái cây và hoa.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Their garden has a variety of fruits and flowers.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"different kinds of" (nhiều loại khác nhau) = "a variety of" (đa dạng). Hai cách diễn đạt đồng nghĩa.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"a few" (một vài), "no … at all" (không có gì), "only one kind" (chỉ một loại) đều sai nghĩa so với "nhiều loại".</span></li></ol>`},

{sec:"C. WRITING",part:"III. Chọn câu gần nghĩa nhất với câu gốc",n:51,type:"mcq",
 q:"Câu gốc: <em>What is the reason for your decision to move abroad?</em>",
 options:[{t:"Why did you make the decision to move abroad?",c:true},
          {t:"How did you decide to live in another country?",c:false},
          {t:"What do you make the decision to move abroad?",c:false},
          {t:"When do you decide to live in another country?",c:false}],
 exp:`<div class="vnt">💬 Dịch: Tại sao bạn lại quyết định chuyển ra nước ngoài sống?</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Why did you make the decision to move abroad?</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"What is the reason for…?" (lý do là gì) = "Why did you…?" (tại sao) — cùng hỏi về LÝ DO.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"How" hỏi cách thức; "When" hỏi thời gian; câu C sai ngữ pháp — đều không hỏi lý do.</span></li></ol>`}
];

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#2b2140">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#ff2e63">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 40 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🙌';memeKey='good';msg='Cố thêm chút nữa là hoàn hảo luôn nè! 💪';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='😅';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
