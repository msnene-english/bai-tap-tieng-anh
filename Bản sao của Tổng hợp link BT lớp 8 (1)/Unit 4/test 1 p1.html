<style>

#nameInput:focus{border-color:var(--purple)}
#nameInput.err{border-color:var(--redorange);background:#ffecee;animation:shake .5s}

footer{text-align:center;color:#fff;font-weight:800;font-size:.82rem;margin-top:24px;text-shadow:0 2px 6px rgba(0,0,0,.25);opacity:.92}
</style>

<body>
<div class="foodlayer" id="foodlayer"></div>
<div class="wrap">

</div></div>

<script>
(function(){const items=['🏔️','🧵','🪕','🎋','🌾','🏠','🧶','🎎','🥁','🌽','🪗','🧺','🌸','⛰️','🎐','🪘'];
  const layer=document.getElementById('foodlayer');
  for(let i=0;i<20;i++){const s=document.createElement('span');s.textContent=items[i%items.length];
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(1.6+Math.random()*2.2)+'rem';
    s.style.animationDelay=(Math.random()*8)+'s';s.style.animationDuration=(11+Math.random()*10)+'s';layer.appendChild(s);}})();

let actx=null;function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx;}
function playCorrect(){const c=ac(),t=c.currentTime;[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.34);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.36);});}
function playWrong(){const c=ac(),t=c.currentTime;[[196,0],[164,.16],[130,.32]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.linearRampToValueAtTime(f*.7,t+d+.14);g.gain.setValueAtTime(.001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.17);});}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d');const cols=['#FF4757','#FDCB6E','#00D26A','#5ec8ff','#a463f2','#e8590c','#00C9A7'];const P=[];for(let i=0;i<130;i++){P.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2-60,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*8,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});}let f=0;(function anim(){f++;ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(f<130)requestAnimationFrame(anim);else cv.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||'').toLowerCase().replace(/[.,!?;:"'’`\-–]/g,' ').replace(/\s+/g,' ').trim();}

const CREDIT="Cô MS Chí Nên · ULIS giải thích chi tiết";
const TOTAL=40;

const DATA=[
/* ===== A. LANGUAGE FOCUS ===== */
{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:1,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"e<u>c</u>onomy",c:false},{t:"<u>sc</u>ience",c:true},{t:"stair<u>c</u>ase",c:false},{t:"<u>c</u>ultural",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "c" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>e<u>c</u>onomy</span> <span class='p-phonetic'>/ɪˈkɒnəmi/</span> = <span class='p-mean'>kinh tế</span> → âm <b>/k/</b></div>
     <div><span class='hl-green'>science</span> <span class='p-phonetic'>/ˈsaɪəns/</span> = <span class='p-mean'>khoa học</span> → âm <b>/s/</b></div>
     <div><span class='p-word'>stair<u>c</u>ase</span> <span class='p-phonetic'>/ˈsteəkeɪs/</span> = <span class='p-mean'>cầu thang</span> → âm <b>/k/</b></div>
     <div><span class='p-word'><u>c</u>ultural</span> <span class='p-phonetic'>/ˈkʌltʃərəl/</span> = <span class='p-mean'>thuộc văn hóa</span> → âm <b>/k/</b></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"science" có "c" (đứng trước "i") đọc là /s/, khác với ba từ kia đọc "c" cứng /k/.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>economy, staircase, cultural đều có âm /k/.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"I. Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại",n:2,type:"mcq",
 q:"Choose the word whose <u>underlined</u> part is pronounced differently.",
 options:[{t:"<u>g</u>entle",c:true},{t:"<u>g</u>ather",c:false},{t:"<u>g</u>uitar",c:false},{t:"<u>g</u>rateful",c:false}],
 exp:`<div class="vnt">💬 Dịch: Chọn từ có chữ "g" gạch chân phát âm khác với các từ còn lại.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>gentle</span> <span class='p-phonetic'>/ˈdʒentl/</span> = <span class='p-mean'>dịu dàng</span> → âm <b>/dʒ/</b></div>
     <div><span class='p-word'>gather</span> <span class='p-phonetic'>/ˈɡæðə/</span> = <span class='p-mean'>tụ họp</span> → âm <b>/ɡ/</b></div>
     <div><span class='p-word'>guitar</span> <span class='p-phonetic'>/ɡɪˈtɑː/</span> = <span class='p-mean'>đàn ghi-ta</span> → âm <b>/ɡ/</b></div>
     <div><span class='p-word'>grateful</span> <span class='p-phonetic'>/ˈɡreɪtfl/</span> = <span class='p-mean'>biết ơn</span> → âm <b>/ɡ/</b></div>
   </div></li>

   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"mine" = "my ethnic minority group" (đại từ sở hữu, thay cho cả cụm để khỏi lặp): different from mine.</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"my" phải đi kèm danh từ; "me/I" là đại từ nhân xưng, không diễn tả sở hữu.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:16,type:"mcq",
 q:"When you live close ____ nature, outdoor activities become a part of your lifestyle.",
 options:[{t:"to",c:true},{t:"with",c:false},{t:"for",c:false},{t:"up",c:false}],
 exp:`<div class="vnt">💬 Dịch: Khi bạn sống gần gũi với thiên nhiên, các hoạt động ngoài trời trở thành một phần lối sống của bạn.</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='hl-green'>to</span> <span class='wt'>prep</span> = <span class='p-mean'>(close to = gần)</span></div>
     <div><span class='p-word'>with</span> <span class='wt'>prep</span> = <span class='p-mean'>với</span></div>
     <div><span class='p-word'>for</span> <span class='wt'>prep</span> = <span class='p-mean'>cho</span></div>
     <div><span class='p-word'>up</span> <span class='wt'>prep</span> = <span class='p-mean'>lên</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "close TO st" (gần gũi với). "live close to nature".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>close không đi với with/for/up theo nghĩa "gần gũi".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"III. Chọn từ/cụm từ đúng nhất điền vào chỗ trống",n:17,type:"mcq",
 q:"Liam: \"____, life in the mountains is really peaceful.\" — Sam: \"I agree, but sometimes it can get a bit boring.\"",
 options:[{t:"If I were you",c:false},{t:"By the way",c:false},{t:"To my way of thinking",c:true},{t:"This might sound strange",c:false}],
 exp:`<div class="vnt">💬 Dịch: Liam: "Theo cách nghĩ của mình, cuộc sống ở vùng núi thật yên bình." — Sam: "Mình đồng ý, nhưng đôi khi cũng hơi buồn tẻ."</div>
 <ol><li>Phân tích 4 đáp án:
   <div class="grid2">
     <div><span class='p-word'>If I were you</span> = <span class='p-mean'>Nếu tôi là bạn</span></div>
     <div><span class='p-word'>By the way</span> = <span class='p-mean'>Nhân tiện</span></div>
     <div><span class='hl-green'>To my way of thinking</span> = <span class='p-mean'>Theo cách nghĩ của tôi</span></div>
     <div><span class='p-word'>This might sound strange</span> = <span class='p-mean'>Điều này nghe có vẻ lạ</span></div>
   </div></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Liam đang nêu QUAN ĐIỂM cá nhân → mở đầu bằng "To my way of thinking" (theo cách nghĩ của tôi).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"If I were you" dùng để khuyên; "By the way" đổi chủ đề; "This might sound strange" mở đầu ý bất ngờ — đều không hợp câu nêu ý kiến này.</span></li></ol>`},

/* IV. Error (comic) */
{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:18,type:"error",
 q:"The Pa Then raise <u>cattles</u> to help <u>with</u> farming <u>and</u> poultry for <u>food and offerings</u>.",
 options:["cattles","with","and","food and offerings"],correctIdx:0,
 accept:["cattle"],key:"cattles → cattle",
 exp:`<div class="vnt">💬 Dịch: Người Pà Thẻn nuôi gia súc để hỗ trợ việc canh tác và nuôi gia cầm để lấy thực phẩm và làm đồ cúng.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>cattles</span> → sửa thành <span class='hl-green'>cattle</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"cattle" (gia súc) là danh từ TẬP HỢP, luôn ở dạng số nhiều sẵn, KHÔNG thêm "-s". Viết "cattles" là sai.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:19,type:"error",
 q:"<u>Farming</u> and <u>grow</u> rice are the main sources <u>of</u> livelihood of the Ta Oi <u>people</u>.",
 options:["Farming","grow","of","people"],correctIdx:1,
 accept:["growing"],key:"grow → growing",
 exp:`<div class="vnt">💬 Dịch: Làm nương và trồng lúa là nguồn sống chính của người Tà Ôi.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>grow</span> → sửa thành <span class='hl-green'>growing</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Hai chủ ngữ phải SONG SONG về dạng. "Farming" là danh động từ (V-ing), nên "grow" cũng phải là "growing": "Farming and growing rice…".</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"IV. Tìm phần gạch chân SAI và sửa lại cho đúng",n:20,type:"error",
 q:"<u>There</u> isn't <u>many</u> information about <u>the</u> origins <u>of</u> that ancient tradition.",
 options:["There","many","the","of"],correctIdx:1,
 accept:["much"],key:"many → much",
 note:"👉 Câu cuối rồi! Em chỉ cần gõ 1 từ đúng để thay thế nhé.",
 exp:`<div class="vnt">💬 Dịch: Không có nhiều thông tin về nguồn gốc của truyền thống cổ xưa đó.</div>
 <ol><li>Lỗi sai: <span class='hl-red'>many</span> → sửa thành <span class='hl-green'>much</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"information" (thông tin) là danh từ KHÔNG đếm được → phải dùng "much", không dùng "many".</span></li></ol>`},

/* V. Verb form */
{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:21,type:"fill",
 q:"Mike suggested ______ (watch) a documentary about the H'mong.",
 answer:["watching"],
 exp:`<div class="vnt">💬 Dịch: Mike đề nghị xem một bộ phim tài liệu về người H'Mông.</div>
 <ol><li>Đáp án: <span class='hl-green'>watching</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "suggest + V-ing" (đề nghị làm gì) → watching.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:22,type:"fill",
 q:"My mother ______ (return) from her business trip three days ago.",
 answer:["returned"],
 exp:`<div class="vnt">💬 Dịch: Mẹ tôi đã trở về từ chuyến công tác cách đây ba ngày.</div>
 <ol><li>Đáp án: <span class='hl-green'>returned</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "three days ago" → thì Quá khứ đơn: return + "-ed" = returned.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:23,type:"fill",
 q:"The train ______ (leave) at 10 o'clock. There's no time to waste now.",
 answer:["leaves"],
 exp:`<div class="vnt">💬 Dịch: Chuyến tàu khởi hành lúc 10 giờ. Bây giờ không còn thời gian để lãng phí đâu.</div>
 <ol><li>Đáp án: <span class='hl-green'>leaves</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Lịch trình tàu xe cố định → dùng thì Hiện tại đơn. Chủ ngữ "The train" (số ít) → leave + "-s" = leaves.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:24,type:"fill",
 q:"Writing helps you ______ (develop) the ability to think logically.",
 answer:["develop","to develop"],
 exp:`<div class="vnt">💬 Dịch: Việc viết lách giúp bạn phát triển khả năng tư duy logic.</div>
 <ol><li>Đáp án: <span class='hl-green'>(to) develop</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "help sb (to) V" → có thể dùng "develop" hoặc "to develop", cả hai đều đúng.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"V. Chia dạng đúng của động từ trong ngoặc",n:25,type:"fill",
 q:"If I ______ (visit) Ha Giang, I ______ (try) the five-colour sticky rice of Tay people. <span class='note-inline' style='display:inline-block;margin:0'>Gõ đáp án cho cả 2 chỗ trống, cách nhau bởi dấu cách</span>",
 answer:["visit will try","visit i will try"],
 exp:`<div class="vnt">💬 Dịch: Nếu tôi đến Hà Giang, tôi sẽ thử món xôi ngũ sắc của người Tày.</div>
 <ol><li>Đáp án: <span class='hl-green'>visit</span> … <span class='hl-green'>will try</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu điều kiện loại 1: "If + hiện tại đơn (visit), … will + V (will try)".</span></li></ol>`},

/* VI. Word form */
{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:26,type:"fill",
 q:"Ethnic people in the Central Highlands live in ______ stilt houses. <span class='hint-word'>(wood)</span>",
 answer:["wooden"],
 exp:`<div class="vnt">💬 Dịch: Người dân tộc ở Tây Nguyên sống trong những ngôi nhà sàn bằng <b>gỗ</b>.</div>
 <ol><li>Từ gốc: <span class='p-word'>wood</span> <span class='wt'>n</span> = <span class='p-mean'>gỗ</span> → dạng cần điền: <span class='hl-green'>wooden</span> <span class='wt'>adj</span> = <span class='p-mean'>bằng gỗ</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: wooden</span> <span class='p-grammar'>Cần TÍNH TỪ đứng trước danh từ "stilt houses". Thêm hậu tố "-en" biến wood → wooden.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:27,type:"fill",
 q:"Leslie asked the tour guide how the ______ earn their living. <span class='hint-word'>(village)</span>",
 answer:["villagers"],
 exp:`<div class="vnt">💬 Dịch: Leslie hỏi hướng dẫn viên du lịch xem <b>dân làng</b> kiếm sống bằng cách nào.</div>
 <ol><li>Từ gốc: <span class='p-word'>village</span> <span class='wt'>n</span> = <span class='p-mean'>ngôi làng</span> → dạng cần điền: <span class='hl-green'>villagers</span> <span class='wt'>n</span> = <span class='p-mean'>dân làng</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: villagers</span> <span class='p-grammar'>Cần DANH TỪ chỉ NGƯỜI, số nhiều (theo sau là "earn their living"). Thêm "-er" + "-s": village → villagers.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:28,type:"fill",
 q:"The young women danced ______ to the sound of folk music. <span class='hint-word'>(beautiful)</span>",
 answer:["beautifully"],
 exp:`<div class="vnt">💬 Dịch: Những thiếu nữ đã nhảy múa một cách <b>đẹp mắt</b> theo tiếng nhạc dân gian.</div>
 <ol><li>Từ gốc: <span class='p-word'>beautiful</span> <span class='wt'>adj</span> = <span class='p-mean'>đẹp</span> → dạng cần điền: <span class='hl-green'>beautifully</span> <span class='wt'>adv</span> = <span class='p-mean'>một cách đẹp mắt</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: beautifully</span> <span class='p-grammar'>Cần TRẠNG TỪ bổ nghĩa cho động từ "danced". Thêm "-ly" (đổi y→i): beautiful → beautifully.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:29,type:"fill",
 q:"We should understand the ______ of preserving traditional crafts. <span class='hint-word'>(important)</span>",
 answer:["importance"],
 exp:`<div class="vnt">💬 Dịch: Chúng ta nên hiểu <b>tầm quan trọng</b> của việc bảo tồn các nghề thủ công truyền thống.</div>
 <ol><li>Từ gốc: <span class='p-word'>important</span> <span class='wt'>adj</span> = <span class='p-mean'>quan trọng</span> → dạng cần điền: <span class='hl-green'>importance</span> <span class='wt'>n</span> = <span class='p-mean'>tầm quan trọng</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: importance</span> <span class='p-grammar'>Sau "the" cần DANH TỪ. Biến tính từ important → danh từ importance.</span></li></ol>`},

{sec:"A. LANGUAGE FOCUS",part:"VI. Điền dạng đúng của từ trong ngoặc (chia dạng từ)",n:30,type:"fill",
 q:"<em>Dan tinh</em> is a ______ instrument played by the Tay in festivals. <span class='hint-word'>(music)</span>",
 answer:["musical"],
 exp:`<div class="vnt">💬 Dịch: Đàn tính là một nhạc cụ (nhạc khí) được người Tày chơi trong các lễ hội.</div>
 <ol><li>Từ gốc: <span class='p-word'>music</span> <span class='wt'>n</span> = <span class='p-mean'>âm nhạc</span> → dạng cần điền: <span class='hl-green'>musical</span> <span class='wt'>adj</span> = <span class='p-mean'>thuộc âm nhạc</span></li>
   <li><span class="tag hl-green">✅ ĐÁP ÁN: musical</span> <span class='p-grammar'>Cần TÍNH TỪ trước danh từ "instrument". Cụm "musical instrument" = nhạc cụ. Thêm "-al": music → musical.</span></li></ol>`},

/* ===== C. WRITING ===== */
{sec:"C. WRITING",part:"I. Chọn câu đúng nhất viết từ các gợi ý",n:42,type:"mcq",
 q:"Gợi ý: <em>Communal house / serve / gathering place / community?</em>",
 options:[{t:"Does the communal house serve as a gathering place for the community?",c:true},
          {t:"Do the communal house serve with a gathering place for the community?",c:false},
          {t:"Is the communal house serve with a gathering place for the community?",c:false},
          {t:"Does the communal houses serves as a gathering place for the community?",c:false}],
 exp:`<div class="vnt">💬 Dịch: Nhà rông có phải là nơi tụ họp của cộng đồng không?</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Does the communal house serve as a gathering place for the community?</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu hỏi hiện tại đơn với chủ ngữ số ít → "Does + S + V(nguyên mẫu)?"; cụm "serve AS" (đóng vai trò là).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Các câu khác dùng "Do/Is" sai, "serve with" sai giới từ, hoặc "houses serves" sai chia động từ.</span></li></ol>`},

{sec:"C. WRITING",part:"I. Chọn câu đúng nhất viết từ các gợi ý",n:43,type:"mcq",
 q:"Gợi ý: <em>There / not / restaurant / open late / night / this area.</em>",
 options:[{t:"There aren't few restaurant open late at night on this area.",c:false},
          {t:"There isn't much restaurants open late at night in this area.",c:false},
          {t:"There isn't little restaurant open late at night on this area.",c:false},
          {t:"There aren't many restaurants open late at night in this area.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Không có nhiều nhà hàng mở cửa muộn vào ban đêm ở khu vực này.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>There aren't many restaurants open late at night in this area.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"restaurants" đếm được số nhiều → "There aren't many + N số nhiều"; "at night" (vào ban đêm); "in this area" (ở khu vực này).</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"much/little" dùng cho danh từ không đếm được; "on this area" sai giới từ (phải là "in").</span></li></ol>`},

{sec:"C. WRITING",part:"I. Chọn câu đúng nhất viết từ các gợi ý",n:44,type:"mcq",
 q:"Gợi ý: <em>Terraced field / be / one / most wonderful / landscape / Sapa.</em>",
 options:[{t:"The terraced fields are one of most wonderful landscapes in Sapa.",c:false},
          {t:"Terraced field is one of the most wonderful landscapes in Sapa.",c:false},
          {t:"The terraced fields are one with the most wonderful landscapes in Sapa.",c:false},
          {t:"The terraced fields are one of the most wonderful landscapes in Sapa.",c:true}],
 exp:`<div class="vnt">💬 Dịch: Ruộng bậc thang là một trong những cảnh quan tuyệt vời nhất ở Sa Pa.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>The terraced fields are one of the most wonderful landscapes in Sapa.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "one of THE + so sánh nhất + N số nhiều": "one of the most wonderful landscapes".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Câu A thiếu "the"; câu B để danh từ số ít sai; câu C dùng "one with" sai cấu trúc.</span></li></ol>`},

{sec:"C. WRITING",part:"I. Chọn câu đúng nhất viết từ các gợi ý",n:45,type:"mcq",
 q:"Gợi ý: <em>Ede village / have / longhouse / generation / live / together.</em>",
 options:[{t:"Ede village has longhouse where many generations are living together.",c:false},
          {t:"Ede villages have longhouses where many generations live together.",c:true},
          {t:"Ede village has a longhouse which many generations will live together.",c:false},
          {t:"Ede villages have longhouses which many generations lived together.",c:false}],
 exp:`<div class="vnt">💬 Dịch: Các buôn làng người Ê-đê có những ngôi nhà dài nơi nhiều thế hệ cùng chung sống.</div>
 <ol><li>Đáp án đúng: <span class='hl-green'>Ede villages have longhouses where many generations live together.</span></li>
   <li><span class="tag hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dùng đại từ quan hệ chỉ NƠI CHỐN "where" (= in which) cho "longhouses"; thì hiện tại đơn diễn tả sự thật/thói quen "live together".</span></li>
   <li><span class="tag hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Câu A thiếu mạo từ; câu C, D dùng "which" sai (phải là "where" chỉ nơi chốn) và sai thì.</span></li></ol>`},

{sec:"C. WRITING",part:"II. Sắp xếp lại các từ/cụm từ thành câu hoàn chỉnh",n:46,type:"fill",
 q:"children's village / the / from / How far / is it / the boarding school / to? <br><span class='hint-word'>➜ Gõ câu hoàn chỉnh:</span>",

let answered=0,correctCount=0;const answeredSet=new Set();
const quizEl=document.getElementById('quiz');
function updateProgress(){document.getElementById('progressbar').style.width=(answered/TOTAL*100)+'%';document.getElementById('ptext').textContent='Đã làm '+answered+' / '+TOTAL+' câu';}
function markAnswered(id,ok){if(answeredSet.has(id))return;answeredSet.add(id);answered++;if(ok)correctCount++;updateProgress();}

let lastSec='',lastPart='';
DATA.forEach((it,idx)=>{
  if(it.sec!==lastSec){const sh=document.createElement('div');sh.className='sec';sh.innerHTML='<h2>'+(it.sec.startsWith('A')?'🎯 ':'✍️ ')+it.sec+'</h2>';quizEl.appendChild(sh);lastSec=it.sec;lastPart='';}
  if(it.part!==lastPart){const ph=document.createElement('div');ph.className='sub-h';ph.textContent='▸ '+it.part;quizEl.appendChild(ph);lastPart=it.part;}
  const card=document.createElement('div');card.className='card'+(it.type==='error'?' comic':'');
  const id='q'+idx;let html='<span class="qnum">Câu '+it.n+'</span>';
  if(it.type==='error')html+='<span class="pow">FIND IT! 💥</span>';
  html+='<div class="qtext">'+it.q+'</div>';
  if(it.dialog)html+='<div class="dialog">'+it.dialog+'</div>';
  if(it.type==='mcq'){html+='<div class="answers" id="'+id+'-ans"></div>';}
  else if(it.type==='fill'){html+='<div class="fillrow"><input type="text" id="'+id+'-inp" placeholder="Gõ đáp án của em..." autocomplete="off"><button class="btn-check" id="'+id+'-btn">Kiểm tra</button></div>';}
  else if(it.type==='error'){html+='<div class="letterrow" id="'+id+'-let"></div><div id="'+id+'-fillzone"></div>';if(it.note)html+='<div class="note-inline">'+it.note+'</div>';}
  html+='<div class="exp" id="'+id+'-exp"><div class="exp-credit">'+CREDIT+'</div>'+it.exp+'</div>';
  card.innerHTML=html;quizEl.appendChild(card);
  const showExp=()=>document.getElementById(id+'-exp').classList.add('show');

  if(it.type==='mcq'){
    const box=document.getElementById(id+'-ans');const opts=shuffle(it.options);
    opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>{if(answeredSet.has(id))return;box.querySelectorAll('.opt').forEach(x=>x.classList.add('locked'));
        if(o.c){b.classList.add('correct');playCorrect();confetti();markAnswered(id,true);}
        else{b.classList.add('wrong');playWrong();markAnswered(id,false);box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('dim');});opts.forEach((oo,i)=>{if(oo.c){box.children[i].classList.remove('dim');box.children[i].classList.add('correct');}});}
        showExp();};
      box.appendChild(b);});
  }
  if(it.type==='fill'){
    const inp=document.getElementById(id+'-inp'),btn=document.getElementById(id+'-btn');
    const check=()=>{if(answeredSet.has(id))return;const val=norm(inp.value);if(!val){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),600);return;}
      const ok=it.answer.some(a=>norm(a)===val);inp.disabled=true;btn.disabled=true;
      if(ok){inp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}else{inp.classList.add('no');playWrong();markAnswered(id,false);}showExp();};
    btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  if(it.type==='error'){
    const letters=['A','B','C','D'];const letBox=document.getElementById(id+'-let');const fillZone=document.getElementById(id+'-fillzone');let picked=-1;
    it.options.forEach((txt,i)=>{const lb=document.createElement('div');lb.className='lbtn';lb.innerHTML='<span class="lead">'+letters[i]+'</span>'+txt;
      lb.onclick=()=>{if(answeredSet.has(id))return;picked=i;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));lb.classList.add('sel');
        fillZone.innerHTML='<div class="fillrow"><span style="font-weight:800;color:#2b2140">Sửa "'+txt+'" thành:</span><input type="text" id="'+id+'-einp" placeholder="Gõ chữ đúng..." autocomplete="off"><button class="btn-check" id="'+id+'-ebtn">Kiểm tra</button></div>';
        const einp=document.getElementById(id+'-einp'),ebtn=document.getElementById(id+'-ebtn');einp.focus();
        const echeck=()=>{if(answeredSet.has(id))return;const val=norm(einp.value);if(!val){einp.classList.add('no');setTimeout(()=>einp.classList.remove('no'),600);return;}
          const ok=(picked===it.correctIdx)&&it.accept.some(a=>norm(a)===val);einp.disabled=true;ebtn.disabled=true;letBox.querySelectorAll('.lbtn').forEach(x=>x.classList.add('locked'));
          if(ok){lb.classList.add('okpick');einp.classList.add('ok');playCorrect();confetti();markAnswered(id,true);}
          else{lb.classList.remove('sel');lb.classList.add('nopick');einp.classList.add('no');playWrong();markAnswered(id,false);letBox.children[it.correctIdx].classList.add('okpick');fillZone.innerHTML+='<div class="note-inline" style="border-color:#ff2e63">🔑 <b>ĐÁP ÁN ĐÚNG:</b> '+letters[it.correctIdx]+' — '+it.key+'</div>';}
          showExp();};
        ebtn.onclick=echeck;einp.addEventListener('keydown',e=>{if(e.key==='Enter')echeck();});};
      letBox.appendChild(lb);});
  }
});
updateProgress();

const nameModal=document.getElementById('nameModal'),resultModal=document.getElementById('resultModal');
const nameInput=document.getElementById('nameInput'),nameWarn=document.getElementById('nameWarn');
document.getElementById('submitBtn').onclick=()=>{try{ac().resume();}catch(e){}nameModal.classList.add('show');setTimeout(()=>nameInput.focus(),100);};
function submitName(){const name=nameInput.value.trim();if(!name){nameInput.classList.add('err');nameWarn.classList.add('show');setTimeout(()=>nameInput.classList.remove('err'),600);return;}nameWarn.classList.remove('show');nameModal.classList.remove('show');showResult(name);}
document.getElementById('nameSubmit').onclick=submitName;
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
nameInput.addEventListener('input',()=>{if(nameInput.value.trim())nameWarn.classList.remove('show');});
const MEMES={win:"https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif",good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"};
function showResult(name){const pct=correctCount/TOTAL,score10=(correctCount/TOTAL*10).toFixed(2);let greet,emoji,memeKey,msg;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';emoji='🏆';memeKey='win';msg='Toàn bộ 40 câu đều đúng — quá đỉnh! 🎉';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+name+' làm rất tốt!';emoji='🙌';memeKey='good';msg='Cố thêm chút nữa là hoàn hảo luôn nè! 💪';}
  else{greet='💪 CỐ LÊN! '+name+' ơi, luyện tập thêm nhé!';emoji='😅';memeKey='low';msg='Đọc kỹ phần giải thích của cô rồi làm lại nha! 📖';}
  document.getElementById('greet').textContent=greet;document.getElementById('scoreBig').textContent=correctCount+' / '+TOTAL;
  document.getElementById('scoreLabel').textContent='câu đúng';document.getElementById('score10').textContent='📊 Quy đổi: '+score10+' / 10 điểm';
  document.getElementById('resultMsg').textContent=msg;
  const img=document.getElementById('memeImg'),emojiEl=document.getElementById('memeEmoji');emojiEl.textContent=emoji;emojiEl.style.display='block';img.style.display='none';
  img.onload=()=>{img.style.display='block';emojiEl.style.display='none';};img.onerror=()=>{img.style.display='none';emojiEl.style.display='block';};img.src=MEMES[memeKey];
  resultModal.classList.add('show');if(pct>=0.6){confetti();setTimeout(confetti,400);}}
document.getElementById('againBtn').onclick=()=>location.reload();
</script>
