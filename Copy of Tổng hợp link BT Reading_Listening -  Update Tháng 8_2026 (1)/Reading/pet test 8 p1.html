<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 8 · Comic English · Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#ffd23f; --orange:#ff9f68; --coral:#ff6b8a; --teal:#4ecdc4; --sky:#5bc0eb; --cream:#fff6e9;
  --ink:#1a1a3a;
  --p-word:#e63946; --p-phon:#7b2cbf; --p-mean:#1d6fb8; --p-gram:#8338ec;
  --green:#2a9d8f; --red:#e5383b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#ffd23f,#ff9f68,#ff6b8a,#4ecdc4,#5bc0eb);background-size:400% 400%;animation:bg 18s ease infinite;}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.3) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:48px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(18px,2.6vw,28px);margin:0;letter-spacing:1.5px;color:#fff;-webkit-text-stroke:1.8px var(--ink);text-shadow:2px 2px 0 var(--coral),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:11px;margin-top:1px;display:inline-block;background:rgba(255,255,255,.65);border:1.5px solid var(--ink);border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(255,246,233,.42);border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(26,26,58,.25)}
.pane::-webkit-scrollbar{width:10px}.pane::-webkit-scrollbar-thumb{background:var(--teal);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;position:sticky;top:0;z-index:2;margin:0 -10px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--coral),var(--teal));border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;margin:18px 0 8px;color:var(--ink);background:var(--sun);display:inline-block;padding:2px 14px;border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.rd{background:rgba(255,255,255,.55);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:3px 3px 0 rgba(26,26,58,.2)}
.rd .num{font-family:'Bangers',cursive;background:var(--teal);border:2px solid var(--ink);border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-right:6px;box-shadow:2px 2px 0 var(--ink)}
.rd p{margin:6px 0;line-height:1.6}
.notice{font-style:italic;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:8px 10px;margin:6px 0}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--teal);color:var(--ink);font-weight:800;font-size:12px;border-radius:20px;padding:3px 12px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#fff0f2;border-left:5px solid var(--coral);border-radius:8px;padding:8px 10px;font-size:14px;color:#7a1f2b}
.note{background:#fff3d6;border:2px dashed var(--orange);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;color:#8a4b00}
.resort{margin:8px 0;padding:8px 10px;background:rgba(255,255,255,.6);border:2px solid var(--ink);border-radius:12px}
.resort b{color:var(--p-mean)}
.gloss{margin:12px 0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 rgba(26,26,58,.2)}
.gloss .gh{font-family:'Bangers',cursive;font-size:19px;letter-spacing:1px;background:var(--sun);padding:6px 12px;border-bottom:2.5px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:rgba(255,255,255,.65)}
th,td{border:1.5px solid var(--ink);padding:5px 8px;text-align:left}
th{background:var(--teal);font-weight:800}
td .w{font-weight:800;color:var(--p-word)}td .t{color:var(--p-gram);font-weight:700}
.q{background:rgba(255,255,255,.6);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:5px 5px 0 rgba(26,26,58,.2)}
.q .qtxt{font-weight:800;margin-bottom:10px;display:flex;gap:8px;line-height:1.45}
.q .badge{font-family:'Bangers',cursive;background:var(--coral);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:15px;background:rgba(255,255,255,.9);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf5;border:2.5px dashed var(--ink);border-radius:14px;padding:12px;font-size:14px;line-height:1.6}
.exp h4{margin:0 0 6px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:18px}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-phonetic{color:var(--p-phon);font-style:italic}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#f1e4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(255,246,233,.5);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--sky),var(--coral));transition:width .3s}
.progtxt{font-weight:800;font-size:12px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#ff6b8a,#ff9f68);border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(26,26,58,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#fff6e9);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(26,26,58,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:46px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:32px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sun);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--teal);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){body{overflow:auto}.wrap{height:auto;min-height:100%}.split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}.float{font-size:36px}footer{position:sticky;bottom:0}}
</style>
</head>
<body>
<div id="bgart">
  <span class="float" style="left:6%;top:14%;animation-delay:0s">📋</span>
  <span class="float" style="left:82%;top:10%;animation-delay:1.2s">🏖️</span>
  <span class="float" style="left:14%;top:74%;animation-delay:2s">💪</span>
  <span class="float" style="left:74%;top:66%;animation-delay:.6s">🍅</span>
  <span class="float" style="left:46%;top:40%;animation-delay:1.8s">⭐</span>
  <span class="float" style="left:90%;top:44%;animation-delay:2.6s">🌳</span>
</div>
<div class="wrap">
  <header>
    <h1>💥 TEST 8 · VOCAB + READING P1-3 💥</h1>
    <div class="sub">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên</div>
  </header>
  <div class="split">
    <div class="pane" id="leftPane"><div class="pane-title">📖 Bài đọc / Reading</div></div>
    <div class="pane" id="rightPane"><div class="pane-title">✏️ Bài tập / Exercises</div></div>
  </div>
  <footer>
    <span class="progtxt" id="ptxt">0/24</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <button class="submit" onclick="openSubmit()">🎯 NỘP BÀI</button>
  </footer>
</div>
<div class="overlay" id="nameOv"><div class="modal">
  <h2>🏆 Nhập tên để nộp bài</h2><input id="nameIn" placeholder="Tên học sinh...">
  <div class="err" id="nameErr"></div><button class="mbtn" onclick="grade()">Nộp bài ➜</button>
</div></div>
<div class="overlay" id="scoreOv"><div class="modal">
  <h2 id="hi"></h2><div class="score-big" id="scoreRaw"></div><div class="score-10" id="score10"></div>
  <div class="gifbox" id="gifbox"></div><div class="comment" id="comment"></div>
  <button class="mbtn" onclick="document.getElementById('scoreOv').style.display='none'">Đóng</button>
</div></div>

<script>
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"🔤 Vocabulary Development",
 left:`
  <div class="gloss"><div class="gh">📚 Từ khoá cần nhớ</div><table>
  <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
  <tr><td><span class="w">amount</span></td><td><span class="t">n</span></td><td>số lượng (không đếm được)</td></tr>
  <tr><td><span class="w">relevant</span></td><td><span class="t">adj</span></td><td>liên quan, phù hợp</td></tr>
  <tr><td><span class="w">valid</span></td><td><span class="t">adj</span></td><td>hợp lệ</td></tr>
  <tr><td><span class="w">attitude</span></td><td><span class="t">n</span></td><td>thái độ</td></tr>
  <tr><td><span class="w">motivate</span></td><td><span class="t">v</span></td><td>tạo động lực</td></tr>
  <tr><td><span class="w">avoid</span></td><td><span class="t">v</span></td><td>tránh</td></tr>
  <tr><td><span class="w">delicious</span></td><td><span class="t">adj</span></td><td>rất ngon</td></tr>
  <tr><td><span class="w">handy</span></td><td><span class="t">adj</span></td><td>tiện lợi, hữu ích</td></tr>
  <tr><td><span class="w">tiny</span></td><td><span class="t">adj</span></td><td>nhỏ xíu</td></tr></table></div>
  <div class="note">📌 <b>Lưu ý của cô:</b> Exercise C trong sách Test 8 bị in lặp nhầm 3 câu của Test 7 (không khớp bộ từ mới). Cô đã thay bằng 3 câu chuẩn dùng đúng từ Test 8: <b>delicious · handy · tiny</b> (từ nhiễu: slim, selfish, suffering, independent).</div>
  <div class="rd"><p><b>Exercise A & B:</b> Choose the correct word (A, B or C).<br>
  <b>Exercise C:</b> Word bank – <b>delicious</b> · <b>handy</b> · slim · selfish · suffering · independent · <b>tiny</b></p></div>`,
 qs:[
  {n:"1",q:"She spends a large ______ of money on clothes.",
   opts:[opt("amount","số lượng (n)"),opt("quality","chất lượng (n)"),opt("habit","thói quen (n)")],a:"amount",
   exp:`<h4>🧠 Câu 1 ➔ amount</h4>
   <b>Dịch cả câu:</b> "Cô ấy tiêu một ______ lớn tiền vào quần áo."
   <ul>
   <li><span class="p-word">amount</span> ➔ <span class="p-mean">số lượng (dùng cho danh từ không đếm được) (n)</span></li>
   <li><span class="p-word">quality</span> ➔ <span class="p-mean">chất lượng (n)</span></li>
   <li><span class="p-word">habit</span> ➔ <span class="p-mean">thói quen (n)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">a large amount of money</span> = một số tiền lớn ("money" không đếm được nên dùng "amount").<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">quality</span> (chất lượng) không đo tiền; <span class="p-word">habit</span> (thói quen) <span class="hl-red">không đi với "of money"</span>.`},
  {n:"2",q:"She couldn't find work ______ to her degree so she had to work in a pub.",
   opts:[opt("relevant","liên quan (adj)"),opt("whole","toàn bộ (adj)"),opt("lasting","lâu dài (adj)")],a:"relevant",
   exp:`<h4>🧠 Câu 2 ➔ relevant</h4>
   <b>Dịch cả câu:</b> "Cô ấy không tìm được công việc ______ với tấm bằng của mình nên phải làm ở một quán rượu."
   <ul>
   <li><span class="p-word">relevant</span> ➔ <span class="p-mean">liên quan, phù hợp (adj)</span></li>
   <li><span class="p-word">whole</span> ➔ <span class="p-mean">toàn bộ, nguyên vẹn (adj)</span></li>
   <li><span class="p-word">lasting</span> ➔ <span class="p-mean">lâu dài, bền (adj)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">relevant to sth</span> = liên quan/phù hợp với cái gì. "work relevant to her degree".<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">whole</span> (toàn bộ) và <span class="p-word">lasting</span> (lâu dài) <span class="hl-red">không đi với "to her degree"</span> và sai nghĩa.`},
  {n:"3",q:"I'm afraid your ticket isn't ______, Sir.",
   opts:[opt("valid","hợp lệ (adj)"),opt("vital","thiết yếu (adj)"),opt("stuck","mắc kẹt (adj)")],a:"valid",
   exp:`<h4>🧠 Câu 3 ➔ valid</h4>
   <b>Dịch cả câu:</b> "Tôi e rằng vé của ngài không ______, thưa ngài."
   <ul>
   <li><span class="p-word">valid</span> ➔ <span class="p-mean">hợp lệ, còn giá trị sử dụng (adj)</span></li>
   <li><span class="p-word">vital</span> ➔ <span class="p-mean">thiết yếu, quan trọng (adj)</span></li>
   <li><span class="p-word">stuck</span> ➔ <span class="p-mean">mắc kẹt (adj)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-word">valid</span> = hợp lệ; một chiếc vé hợp lệ sẽ được chấp nhận. "your ticket isn't valid".<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">vital</span> (thiết yếu) và <span class="p-word">stuck</span> (mắc kẹt) <span class="hl-red">không mô tả tính hợp lệ của vé</span>.`},
  {n:"4",q:"Anna's ______ towards learning is negative.",
   opts:[opt("attitude","thái độ (n)"),opt("custom","phong tục (n)"),opt("habit","thói quen (n)")],a:"attitude",
   exp:`<h4>🧠 Câu 4 ➔ attitude</h4>
   <b>Dịch cả câu:</b> "______ của Anna đối với việc học là tiêu cực."
   <ul>
   <li><span class="p-word">attitude</span> ➔ <span class="p-mean">thái độ (n)</span></li>
   <li><span class="p-word">custom</span> ➔ <span class="p-mean">phong tục (n)</span></li>
   <li><span class="p-word">habit</span> ➔ <span class="p-mean">thói quen (n)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">attitude towards sth</span> = thái độ đối với cái gì. "attitude towards learning".<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">custom</span> (phong tục của cộng đồng) và <span class="p-word">habit</span> (thói quen) <span class="hl-red">không đi với "towards"</span> theo nghĩa thái độ.`},
  {n:"5",q:"The problem is that nothing ______ her.",
   opts:[opt("motivates","tạo động lực (v)"),opt("divides","chia tách (v)"),opt("runs","điều hành/chạy (v)")],a:"motivates",
   exp:`<h4>🧠 Câu 5 ➔ motivates</h4>
   <b>Dịch cả câu:</b> "Vấn đề là chẳng có gì ______ cô ấy cả."
   <ul>
   <li><span class="p-word">motivates</span> ➔ <span class="p-mean">tạo động lực, khiến muốn làm (v)</span></li>
   <li><span class="p-word">divides</span> ➔ <span class="p-mean">chia tách (v)</span></li>
   <li><span class="p-word">runs</span> ➔ <span class="p-mean">điều hành / chạy (v)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-word">motivate sb</span> = tạo động lực cho ai; hợp với việc Anna có thái độ tiêu cực (không gì thúc đẩy cô).<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">divide</span> (chia) và <span class="p-word">run</span> (điều hành) <span class="hl-red">sai nghĩa</span> trong ngữ cảnh này.`},
  {n:"6",q:"Anna always tries to ______ doing her homework.",
   opts:[opt("avoid","tránh (v)"),opt("inspire","truyền cảm hứng (v)"),opt("tend","có xu hướng (v)")],a:"avoid",
   exp:`<h4>🧠 Câu 6 ➔ avoid</h4>
   <b>Dịch cả câu:</b> "Anna luôn cố ______ làm bài tập về nhà."
   <ul>
   <li><span class="p-word">avoid</span> ➔ <span class="p-mean">tránh, né (v)</span></li>
   <li><span class="p-word">inspire</span> ➔ <span class="p-mean">truyền cảm hứng (v)</span></li>
   <li><span class="p-word">tend</span> ➔ <span class="p-mean">có xu hướng (v)</span></li></ul>

  {n:"7",q:"Grandma's homemade pizza is always ______; it's my favourite meal.",

  {n:"9",q:"The baby's shoes were ______, no bigger than my thumb.",

{
 title:"🏖️ Reading · Part 2",
 left:`
 <div class="rd"><p><b>PART 2 (Q6–10):</b> People want to go on holiday. Match each person to the most suitable holiday.</p></div>
 <div class="resort"><b>A. Oceanview Village</b> — Self-catering accommodation in beautiful surroundings close to the beach. Evening entertainment every night and an afternoon kids' club run by trained staff. Excursions available three times a week.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Chỗ ở tự nấu ăn trong khung cảnh đẹp, gần biển. Có giải trí buổi tối mỗi ngày và câu lạc bộ trẻ em buổi chiều do nhân viên được đào tạo phụ trách. Có các chuyến tham quan ba lần mỗi tuần.</div></div>
 <div class="resort"><b>B. Oaktree Park Hotel</b> — In beautiful countryside grounds; first-class accommodation with a delicious menu by an award-winning chef. The landscaped grounds include a stunning lake and nature reserve. A beautiful retreat to get away from it all.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Nằm trong khuôn viên vùng quê tuyệt đẹp; chỗ ở hạng nhất với thực đơn ngon do đầu bếp từng đoạt giải chế biến. Khuôn viên có hồ nước tuyệt đẹp và khu bảo tồn thiên nhiên. Một chốn nghỉ dưỡng để rời xa mọi thứ.</div></div>
 <div class="resort"><b>C. Kidsland Adventure Park</b> — A child's heaven; caters for children aged 11 to 18. Accommodation in ten-bed chalets with adult supervision. Sport, art and craft, computer technology, music, cookery. All meals included, entertainment every night.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Thiên đường cho trẻ; phục vụ trẻ 11–18 tuổi. Ở trong các nhà gỗ 10 giường có người lớn giám sát. Thể thao, thủ công, công nghệ, âm nhạc, nấu ăn. Bao gồm tất cả các bữa ăn, giải trí mỗi tối.</div></div>
 <div class="resort"><b>D. Bob's Diving Centre</b> — Courses for beginner and advanced divers, plus watersport activities including jetskis, surfing and water volleyball. Self-catering accommodation with a handy shop on-site. Evening entertainment every night plus a weekly barbecue.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Các khóa học cho thợ lặn mới và nâng cao, cùng các hoạt động thể thao nước như jetski, lướt sóng và bóng chuyền nước. Chỗ ở tự nấu ăn với một cửa hàng tiện lợi ngay tại chỗ. Giải trí mỗi tối và tiệc nướng hàng tuần.</div></div>
 <div class="resort"><b>E. Sandybeach Hotel</b> — Only a two-minute walk from the beach, with plenty of bars and restaurants and a nightclub where you can dance until the early hours. Breakfast and evening meal included; two-day trips to local places of interest and historical sights offered.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Chỉ đi bộ 2 phút là tới biển, có nhiều quán bar, nhà hàng và một hộp đêm để bạn nhảy tới tận sáng sớm. Bao gồm bữa sáng và bữa tối; có các chuyến đi hai ngày tới các điểm tham quan và di tích lịch sử địa phương.</div></div>
 <div class="resort"><b>F. Desert Walking Holidays</b> — Give yourself a challenge and cross a desert. Organised trips (camels carry your bags). Professional guides lead you through the sand. Campfire cooking and fantastic landscapes; trek all day and enjoy quiet nights round the campfire.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Hãy thử thách bản thân và băng qua một sa mạc. Các chuyến đi có tổ chức (lạc đà chở hành lý). Hướng dẫn viên chuyên nghiệp dẫn bạn qua cát. Nấu ăn bên lửa trại và cảnh quan tuyệt đẹp; đi bộ cả ngày và tận hưởng những đêm yên tĩnh bên lửa trại.</div></div>

 title:"💪 Reading · Part 3",
 left:`
 <div class="rd"><p><b>PART 3 (Q11–15):</b> Getting fit and slim</p></div>
 <div class="rd">
   <p>I know that many people, myself included, each year make a promise to themselves to get fit and slim, join a gym and start a diet. But what happens to these gym visits and the lettuce diet? At least half of us who try to get fit and thinner give up after less than a month. Many people seem to blame their failure on lack of time. Lack of willpower is even more important, though.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Tôi biết nhiều người, kể cả tôi, mỗi năm đều tự hứa sẽ khỏe và thon gọn, đăng ký phòng gym và bắt đầu ăn kiêng. Nhưng những buổi tới gym và chế độ ăn rau diếp ấy rồi ra sao? Ít nhất một nửa trong số chúng ta cố gắng khỏe và gầy hơn đã bỏ cuộc sau chưa đầy một tháng. Nhiều người có vẻ đổ lỗi thất bại cho việc thiếu thời gian. Tuy nhiên, thiếu ý chí còn quan trọng hơn.</div></div>
 <div class="rd">
   <p>Much of this has to do with the fact that we set unrealistic fitness goals - a flat stomach in eight weeks and a celebrity diet plan - instead of doing what we know will have the best results in the long term: exercising a bit more and eating a bit less. Most fitness clubs get many new members from January to March, but their use of the gym tends to decline after that. So how can someone beat the temptation to give up? First, no one should expect to fail as soon as they start; we must stay positive, even if we've failed before.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Phần lớn điều này liên quan đến việc chúng ta đặt ra những mục tiêu tập luyện phi thực tế – bụng phẳng trong tám tuần và chế độ ăn của người nổi tiếng – thay vì làm điều mà ta biết sẽ có kết quả tốt nhất về lâu dài: tập nhiều hơn một chút và ăn ít đi một chút. Hầu hết các câu lạc bộ thể hình có nhiều hội viên mới từ tháng Một đến tháng Ba, nhưng việc họ tới gym thường giảm dần sau đó. Vậy làm sao để vượt qua sự cám dỗ bỏ cuộc? Trước hết, không ai nên kỳ vọng sẽ thất bại ngay khi vừa bắt đầu; ta phải giữ thái độ tích cực, kể cả khi từng thất bại.</div></div>
 <div class="rd">
   <p>Many people are fooled into believing that they really need to follow an expensive fitness and eating plan. But this is simply not true. The only correct answer seems to be to search for the thing that really interests and motivates you. It's fine to have many small motivations, but you should write them down and put them together to make a list of things to keep you going.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Nhiều người bị lừa tin rằng họ thực sự cần theo một kế hoạch tập luyện và ăn uống đắt đỏ. Nhưng điều đó đơn giản là không đúng. Câu trả lời đúng duy nhất có vẻ là hãy đi tìm điều thực sự khiến bạn hứng thú và tạo động lực cho bạn. Có nhiều động lực nhỏ cũng không sao, nhưng bạn nên viết chúng ra và ghép lại thành một danh sách những điều giúp bạn tiếp tục.</div></div>
 <div class="rd">
   <p>You also need to change the way you think about things. Women, for example, feel particularly guilty about exercising two or three hours a week, thinking this is 'selfish time' that takes them away from responsibilities to family and friends. But it is much better to see this as vital 'self-care' time. Many people also think that three hours is a lot of time out of their ordinary week, but as we spend around 98 hours a week awake, that leaves us nearly 95 hours to do everything else that we need to do.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Bạn cũng cần thay đổi cách suy nghĩ. Chẳng hạn, phụ nữ thường thấy đặc biệt có lỗi khi tập hai, ba tiếng mỗi tuần, cho rằng đó là "thời gian ích kỷ" khiến họ xao lãng trách nhiệm với gia đình và bạn bè. Nhưng tốt hơn nhiều là hãy xem đó là thời gian "tự chăm sóc bản thân" thiết yếu. Nhiều người cũng nghĩ ba tiếng là quá nhiều trong một tuần bình thường, nhưng vì ta thức khoảng 98 tiếng mỗi tuần, nên vẫn còn gần 95 tiếng để làm mọi việc khác cần làm.</div></div>

         opt("they can't afford to continue.","họ không đủ khả năng chi trả để tiếp tục.")],a:"they expect too much of themselves.",
   exp:`<h4>🧠 Câu 13 ➔ B</h4>
   <b>Dịch đề:</b> "Một lý do khác khiến người ta bỏ chương trình tập luyện là..."
   <ul>
   <li>They expect too much of themselves. ➔ <span class="p-mean">Họ kỳ vọng quá nhiều ở bản thân.</span></li>
   <li>They have achieved their goals. ➔ <span class="p-mean">Họ đã đạt được mục tiêu.</span></li>
   <li>They become too tired. ➔ <span class="p-mean">Họ trở nên quá mệt.</span></li>
   <li>They can't afford to continue. ➔ <span class="p-mean">Họ không đủ tiền để tiếp tục.</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Dẫn chứng: "we set <span class="p-word">unrealistic fitness goals - a flat stomach in eight weeks</span>" (đặt mục tiêu phi thực tế) ➔ kỳ vọng quá nhiều ở bản thân.<br>
   <span class="hl-red">Tại sao sai:</span> Họ bỏ vì <span class="hl-red">chưa</span> đạt được (không phải đã đạt); bài không nói "quá mệt" hay "không đủ tiền".`},
  {n:"14",q:"In order to continue a successful fitness programme",
   opts:[opt("you need to find a strong and lasting reason.","bạn cần tìm một lý do mạnh mẽ và bền vững."),
         opt("you need a friend to exercise with.","bạn cần một người bạn tập cùng."),
         opt("you can't avoid suffering for many hours.","bạn không thể tránh chịu đựng nhiều giờ."),
         opt("your friends and family will have to suffer.","bạn bè và gia đình bạn sẽ phải chịu thiệt.")],a:"you need to find a strong and lasting reason.",
   exp:`<h4>🧠 Câu 14 ➔ A</h4>
   <b>Dịch đề:</b> "Để tiếp tục một chương trình tập luyện thành công,"
   <ul>
   <li>You need to find a strong and lasting reason. ➔ <span class="p-mean">Bạn cần tìm một lý do mạnh mẽ và bền vững.</span></li>
   <li>You need a friend to exercise with. ➔ <span class="p-mean">Bạn cần người bạn tập cùng.</span></li>
   <li>You can't avoid suffering for many hours. ➔ <span class="p-mean">Không thể tránh chịu đựng nhiều giờ.</span></li>
   <li>Your friends and family will have to suffer. ➔ <span class="p-mean">Bạn bè, gia đình sẽ phải chịu thiệt.</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Dẫn chứng: "search for the thing that really <span class="p-word">interests and motivates you</span>... make a list of things to <span class="p-word">keep you going</span>" ➔ tìm lý do/động lực mạnh và bền.<br>
   <span class="hl-red">Tại sao sai:</span> Bài không nói cần "bạn tập cùng"; không nói phải "chịu đựng nhiều giờ"; và nhấn "<span class="hl-red">self-care</span>" chứ không phải gia đình phải chịu thiệt.`},
  {n:"15",q:"What would the writer say about exercise?",
   opts:[opt("If you really want to get fit, you need to find the time and a reason why and then commit to it.","Nếu thực sự muốn khỏe, bạn cần tìm thời gian, một lý do và rồi cam kết với nó."),
         opt("It isn't actually worth all this effort because of how slow the results are.","Thực ra không đáng bỏ công đến vậy vì kết quả quá chậm."),
         opt("No one should overtire themselves because it does not make much difference.","Không ai nên tập kiệt sức vì nó chẳng khác biệt mấy."),
         opt("Going to the gym is a waste of time and very boring.","Đến phòng gym là phí thời gian và rất chán.")],a:"If you really want to get fit, you need to find the time and a reason why and then commit to it.",
   exp:`<h4>🧠 Câu 15 ➔ D</h4>
   <b>Dịch đề:</b> "Tác giả sẽ nói gì về việc tập thể dục?"
   <ul>
   <li>If you really want to get fit, find the time and a reason, then commit. ➔ <span class="p-mean">Nếu thực sự muốn khỏe, hãy tìm thời gian, lý do và cam kết.</span></li>
   <li>It isn't worth all this effort because results are slow. ➔ <span class="p-mean">Không đáng công vì kết quả chậm.</span></li>
   <li>No one should overtire themselves; it makes little difference. ➔ <span class="p-mean">Đừng tập kiệt sức vì chẳng khác biệt mấy.</span></li>
   <li>Going to the gym is a waste of time and boring. ➔ <span class="p-mean">Đến gym là phí thời gian và chán.</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Cả bài nêu vì sao người ta thất bại nhưng cũng chỉ cách vượt qua (<span class="p-word">tìm động lực, giữ tích cực, sắp xếp thời gian</span>) ➔ nếu quyết tâm và có lý do thì làm được.<br>
   <span class="hl-red">Tại sao sai:</span> Tác giả <span class="hl-red">không</span> nói "không đáng công / phí thời gian / chán" (giọng bài tích cực); và không nói tập kiệt sức là vô ích.`}
 ]

/* ===== ENGINE ===== */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    TOTAL++;
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    const box=document.createElement('div'); box.className='opts';
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.textContent=o.en; b.dataset.val=o.en; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
    });
    card.appendChild(box);
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#ffd23f','#ff9f68','#ff6b8a','#4ecdc4','#5bc0eb','#fff6e9'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';t.style.display=open?'none':'block';btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms MS Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
</body>
