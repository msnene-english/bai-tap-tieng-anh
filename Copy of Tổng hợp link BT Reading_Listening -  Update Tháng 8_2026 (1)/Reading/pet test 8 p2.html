.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sun);min-height:120px;display:flex;align-items:center;justify-content:center}

<script>
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"💧 Reading · Part 4 — Don't drink the water!",
 left:`
 <div class="rd"><p><b>PART 4 (Q16–20):</b> Five sentences have been removed. Choose the correct sentence for each gap. There are three extra sentences you do not need.</p></div>
 <div class="rd"><b>Don't drink the water!</b>
 <p>People often don't think about the water they drink. However, it's a very different story if we are travelling abroad. In some countries the water is simply not safe to drink. <span class="gap">16</span> Try to learn anything you can about the water situation of the place where you are travelling. The health problems from drinking unsafe water can often be really serious if you don't.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Người ta thường không nghĩ về nước mình uống. Tuy nhiên, câu chuyện lại rất khác khi ta đi nước ngoài. Ở một số nước, nước đơn giản là không an toàn để uống. (16) Hãy cố tìm hiểu mọi thứ có thể về tình hình nước ở nơi bạn đang đi. Các vấn đề sức khỏe do uống nước không an toàn thường có thể rất nghiêm trọng nếu bạn không làm vậy.</div>
 <p>The water you need to worry about is water that could be dirty. Unsafe water does not actually mean it will kill you. Local people can drink the water where they live and are fine because their bodies are used to it. <span class="gap">17</span> Even a tiny amount can have unpleasant results. On your travels it's best to ask the locals about the quality of the tap water. These are the people who are living there, so they are your best guide.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Loại nước bạn cần lo là nước có thể bị bẩn. Nước không an toàn thực ra không có nghĩa nó sẽ giết bạn. Người dân địa phương uống nước nơi họ sống mà vẫn ổn vì cơ thể họ đã quen. (17) Chỉ một lượng nhỏ cũng có thể gây hậu quả khó chịu. Khi đi du lịch, tốt nhất hãy hỏi người địa phương về chất lượng nước máy. Họ sống ở đó nên là người chỉ dẫn tốt nhất cho bạn.</div>
 <p><span class="gap">18</span> If the water is unsafe, there will usually be a notice in your room. This also means you should not clean your teeth with tap water. And, of course, don't take any pills with it. Use bottled water instead.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">(18) Nếu nước không an toàn, thường sẽ có một thông báo trong phòng bạn. Điều này cũng có nghĩa bạn không nên đánh răng bằng nước máy. Và tất nhiên, đừng uống thuốc với nó. Hãy dùng nước đóng chai thay thế.</div>
 <p>Another danger, of course, could be swimming. Check that natural water lakes and rivers are safe before you swim. And don't open your mouth when swimming! <span class="gap">19</span> It's the same tap water!</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Một mối nguy khác, tất nhiên, có thể là bơi lội. Hãy kiểm tra xem hồ và sông tự nhiên có an toàn không trước khi bơi. Và đừng mở miệng khi bơi! (19) Vẫn là nước máy đó thôi!</div>
 <p>What many people don't consider until it's too late is food which has not been cooked; salad or fruit, for example. <span class="gap">20</span> So only eat food which has been cooked or that has an outside peel or skin (like an orange or banana) which you can remove. And finally, don't have ice in your drinks! Remember, before it became ice, it was tap water!</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Điều nhiều người không nghĩ tới cho đến khi quá muộn là thức ăn chưa nấu chín; ví dụ salad hay trái cây. (20) Vì vậy chỉ ăn thức ăn đã nấu chín hoặc có vỏ ngoài (như cam hay chuối) mà bạn có thể bóc bỏ. Và cuối cùng, đừng cho đá vào đồ uống! Nhớ rằng, trước khi thành đá, nó từng là nước máy!</div></div>
 <div class="optbank"><b>Ngân hàng câu (A–H):</b><br>
 A. It will have been washed in water.<br>
 B. Of course, food in other countries can be delicious.<br>
 C. So you must get all the relevant information.<br>
 D. They can't eat and drink without worrying.<br>
 E. Of course, your hotel will let you know if the water isn't safe to drink.<br>
 F. Also remember to keep it closed in the shower, too.<br>
 G. Drinking from rivers and lakes by mistake cannot cause any serious harm.<br>
 H. But yours is not, so you could get seriously ill.</div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">abroad</span></td><td><span class="t">adv</span></td><td>ở nước ngoài</td></tr>
 <tr><td><span class="w">unsafe</span></td><td><span class="t">adj</span></td><td>không an toàn</td></tr>
 <tr><td><span class="w">tiny amount</span></td><td><span class="t">n</span></td><td>một lượng nhỏ xíu</td></tr>
 <tr><td><span class="w">tap water</span></td><td><span class="t">n</span></td><td>nước máy</td></tr>
 <tr><td><span class="w">notice</span></td><td><span class="t">n</span></td><td>thông báo</td></tr>
 <tr><td><span class="w">bottled water</span></td><td><span class="t">n</span></td><td>nước đóng chai</td></tr>
 <tr><td><span class="w">danger</span></td><td><span class="t">n</span></td><td>mối nguy</td></tr>
 <tr><td><span class="w">cooked</span></td><td><span class="t">adj</span></td><td>đã nấu chín</td></tr>
 <tr><td><span class="w">peel / skin</span></td><td><span class="t">n</span></td><td>vỏ ngoài</td></tr>
 <tr><td><span class="w">relevant</span></td><td><span class="t">adj</span></td><td>liên quan</td></tr>
 <tr><td><span class="w">be used to</span></td><td><span class="t">phr</span></td><td>quen với</td></tr>
 <tr><td><span class="w">seriously ill</span></td><td><span class="t">phr</span></td><td>ốm nặng</td></tr></table></div>`,
 qs:[
  {n:"16",q:"Choose the sentence for gap 16.",
   opts:[opt("So you must get all the relevant information."),opt("Of course, food in other countries can be delicious."),opt("They can't eat and drink without worrying."),opt("Drinking from rivers and lakes by mistake cannot cause any serious harm.")],
   a:"So you must get all the relevant information.",
   exp:`<h4>🧠 Câu 16 ➔ C</h4>
   <b>Dịch ngữ cảnh:</b> Câu trước: "Ở một số nước, nước đơn giản là không an toàn để uống." Câu sau: "Hãy cố tìm hiểu mọi thứ có thể về tình hình nước nơi bạn đang đi."
   <ul>
   <li>C. So you must get all the relevant information. ➔ <span class="p-mean">Vì vậy bạn phải thu thập tất cả thông tin liên quan.</span></li>
   <li>B. Of course, food in other countries can be delicious. ➔ <span class="p-mean">Tất nhiên, đồ ăn ở các nước khác có thể rất ngon.</span></li>
   <li>D. They can't eat and drink without worrying. ➔ <span class="p-mean">Họ không thể ăn uống mà không lo lắng.</span></li>
   <li>G. Drinking from rivers and lakes by mistake cannot cause any serious harm. ➔ <span class="p-mean">Uống nhầm nước sông hồ không thể gây hại nghiêm trọng.</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Nước không an toàn ➔ "<span class="p-word">So</span> you must get all the relevant information" (phải tìm thông tin), nối thẳng với "<span class="p-word">Try to learn anything you can</span>" ở câu sau.<br>
   <span class="hl-red">Tại sao sai:</span> B nói đồ ăn ngon (lạc đề); D có "They" <span class="hl-red">không có đối tượng</span>; G <span class="hl-red">mâu thuẫn</span> (nói uống nhầm không hại — nhưng cả bài cảnh báo là CÓ hại). (B, D, G là 3 câu thừa.)`},
  {n:"17",q:"Choose the sentence for gap 17.",
   opts:[opt("But yours is not, so you could get seriously ill."),opt("Of course, food in other countries can be delicious."),opt("They can't eat and drink without worrying."),opt("Drinking from rivers and lakes by mistake cannot cause any serious harm.")],

   exp:`<h4>🧠 Câu 17 ➔ H</h4>

 title:"🍅 Reading · Part 5 — Tomatoes",
 left:`
 <div class="rd"><p><b>PART 5 (Q21–26):</b> For each question, choose the correct answer.</p></div>
 <div class="rd"><b>Tomatoes - the whole truth</b>
 <p>Leading scientists have <span class="gap">21</span> that tomatoes can be of great benefit to our health. A lot of <span class="gap">22</span> has been done in recent years, trying to understand why that is. It now seems that it's the whole tomato that may lower cancer risks, not parts of it, according to some new studies.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Các nhà khoa học hàng đầu đã (21) rằng cà chua có thể rất có lợi cho sức khỏe. Rất nhiều (22) đã được thực hiện trong những năm gần đây nhằm hiểu vì sao lại như vậy. Giờ đây có vẻ chính cả quả cà chua mới có thể làm giảm nguy cơ ung thư, chứ không phải các phần của nó, theo một số nghiên cứu mới.</div>
 <p>Experts have <span class="gap">23</span> that simply taking the antioxidant lycopene - a substance which is found in tomatoes but is highly popular as a health food supplement because of its link to a(n) <span class="gap">24</span> risk of cancer - did not work as well as eating whole tomatoes.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Các chuyên gia đã (23) rằng chỉ uống chất chống oxy hóa lycopene – một chất có trong cà chua nhưng rất được ưa chuộng làm thực phẩm bổ sung vì mối liên hệ của nó với việc (24) nguy cơ ung thư – không hiệu quả bằng ăn cả quả cà chua.</div>
 <p>This is why scientists today believe that people should eat tomatoes in pastas, salads, tomato juice and pizza, rather than take supplements. Recent findings suggest that the risks of poor eating <span class="gap">25</span> cannot simply be reversed with a pill.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Đây là lý do vì sao các nhà khoa học ngày nay tin rằng người ta nên ăn cà chua trong mì Ý, salad, nước ép và pizza, thay vì uống thực phẩm bổ sung. Các phát hiện gần đây cho thấy nguy cơ từ (25) ăn uống kém không thể đơn giản được đảo ngược bằng một viên thuốc.</div>
 <p>We shouldn't <span class="gap">26</span> easy solutions to a complex problem.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Chúng ta không nên (26) những giải pháp dễ dàng cho một vấn đề phức tạp.</div></div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">benefit</span></td><td><span class="t">n</span></td><td>lợi ích</td></tr>

 <tr><td><span class="w">substance</span></td><td><span class="t">n</span></td><td>chất</td></tr>
 <tr><td><span class="w">supplement</span></td><td><span class="t">n</span></td><td>thực phẩm bổ sung</td></tr>
 <tr><td><span class="w">reverse</span></td><td><span class="t">v</span></td><td>đảo ngược</td></tr>
 <tr><td><span class="w">complex</span></td><td><span class="t">adj</span></td><td>phức tạp</td></tr>
 <tr><td><span class="w">findings</span></td><td><span class="t">n</span></td><td>phát hiện (nghiên cứu)</td></tr>
 <tr><td><span class="w">whole</span></td><td><span class="t">adj</span></td><td>toàn bộ, cả quả</td></tr></table></div>`,
 qs:[
  {n:"21",q:"Leading scientists have ______ that tomatoes can be of great benefit to our health.",

   exp:`<h4>🧠 Câu 21 ➔ announced</h4>

   <ul>

   <span class="hl-red">Tại sao sai:</span> <span class="p-word">approach</span> không đi với "do a lot of"; <span class="p-word">investigation</span> đi với "<span class="p-grammar">carry out</span>" và mang nghĩa điều tra vụ việc; <span class="p-word">improvement</span> đi với "make" và thường số nhiều.`},
  {n:"23",q:"Experts have ______ that simply taking the antioxidant lycopene... did not work as well.",

   exp:`<h4>🧠 Câu 23 ➔ discovered</h4>

   <span class="hl-red">Tại sao sai:</span> <span class="p-word">invent</span> (phát minh) cần tân ngữ trực tiếp, không "invent that"; <span class="p-word">develop</span> cần tân ngữ; <span class="p-word">inspire</span> dùng "inspire sb to do" (chủ động, tân ngữ người).`},
  {n:"24",q:"...because of its link to a(n) ______ risk of cancer...",

 title:"🌳 Reading · Part 6 — Changing attitudes (Gõ đáp án)",
 left:`
 <div class="rd"><p><b>PART 6 (Q27–32):</b> Write <b>ONE word</b> for each gap. (Gõ 1 từ vào mỗi ô)</p></div>
 <div class="rd"><b>Changing attitudes</b>
 <p>Every culture has its own traditional ways of celebrating the birth of a child. In the Indian village of Piplantri, for instance, baby girls are an opportunity to plant 111 trees.</p>
 <p>In most Indian villages, daughters <span class="gap">27</span> considered a problem. There still exists an old marriage system: this means the parents of the girl must give a 'dowry' when the time comes for a girl to marry. In <span class="gap">28</span> words, property or money. This means the marriage of a girl costs a lot.</p>
 <p>However, the practice of planting trees completely goes against this idea. <span class="gap">29</span> celebrating girls in this way, the villagers hope to change attitudes. When born, daughters are given money by the villagers <span class="gap">30</span> that they can be independent when they grow up.</p>
 <p>The parents <span class="gap">31</span> to agree that the girls will be educated and that they will not get married <span class="gap">32</span> they are eighteen. And of course, the 111 trees have to be cared for! So, both the women of tomorrow and the local environment benefit to a great extent.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch cả bài</button>
 <div class="trans">Mỗi nền văn hóa có cách truyền thống riêng để mừng sự ra đời của một đứa trẻ. Chẳng hạn ở làng Piplantri của Ấn Độ, các bé gái là cơ hội để trồng 111 cây xanh.<br><br>Ở hầu hết các làng quê Ấn Độ, con gái (27) bị coi là một vấn đề. Vẫn còn tồn tại một hệ thống hôn nhân cũ: cha mẹ cô gái phải đưa "của hồi môn" khi tới lúc con gái lấy chồng. Nói (28) cách khác, là tài sản hoặc tiền bạc. Điều này nghĩa là gả một cô gái tốn rất nhiều.<br><br>Tuy nhiên, tục trồng cây hoàn toàn đi ngược lại quan niệm này. (29) việc tôn vinh các bé gái theo cách này, dân làng hy vọng thay đổi thái độ. Khi chào đời, các bé gái được dân làng tặng tiền (30) để các em có thể tự lập khi lớn lên.<br><br>Cha mẹ (31) đồng ý rằng các bé gái sẽ được đi học và sẽ không kết hôn (32) khi các em mười tám tuổi. Và tất nhiên, 111 cây cũng phải được chăm sóc! Vậy nên, cả những người phụ nữ của ngày mai lẫn môi trường địa phương đều được hưởng lợi rất lớn.</div></div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">culture</span></td><td><span class="t">n</span></td><td>nền văn hóa</td></tr>
 <tr><td><span class="w">celebrate</span></td><td><span class="t">v</span></td><td>tôn vinh, ăn mừng</td></tr>
 <tr><td><span class="w">opportunity</span></td><td><span class="t">n</span></td><td>cơ hội</td></tr>
 <tr><td><span class="w">dowry</span></td><td><span class="t">n</span></td><td>của hồi môn</td></tr>
 <tr><td><span class="w">property</span></td><td><span class="t">n</span></td><td>tài sản</td></tr>
 <tr><td><span class="w">attitude</span></td><td><span class="t">n</span></td><td>thái độ</td></tr>
 <tr><td><span class="w">independent</span></td><td><span class="t">adj</span></td><td>tự lập, độc lập</td></tr>
 <tr><td><span class="w">educated</span></td><td><span class="t">adj</span></td><td>được đi học</td></tr>
 <tr><td><span class="w">environment</span></td><td><span class="t">n</span></td><td>môi trường</td></tr>
 <tr><td><span class="w">to a great extent</span></td><td><span class="t">phr</span></td><td>rất nhiều, ở mức lớn</td></tr>
 <tr><td><span class="w">marriage</span></td><td><span class="t">n</span></td><td>hôn nhân, việc cưới</td></tr></table></div>`,
 qs:[
  {n:"27",type:"fill",q:"In most Indian villages, daughters ______ considered a problem.",accept:["are"],
   exp:`<h4>🧠 Câu 27 ➔ are</h4>
   <b>Dịch cả câu:</b> "Ở hầu hết các làng quê Ấn Độ, con gái ______ bị coi là một vấn đề."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Cần động từ "be" ở dạng <span class="p-grammar">bị động: are considered</span> (bị coi là), chia số nhiều ngôi 3 hợp với "daughters".</li>
   <li><span class="hl-red">Tránh nhầm:</span> "is" số ít (sai vì "daughters" số nhiều); "were" quá khứ (cả đoạn dùng <span class="hl-red">thì hiện tại</span> — "There still exists").</li></ul>`},
  {n:"28",type:"fill",q:"In ______ words, property or money.",accept:["other"],
   exp:`<h4>🧠 Câu 28 ➔ other</h4>
   <b>Dịch cả câu:</b> "...cha mẹ cô gái phải đưa 'của hồi môn' khi con gái lấy chồng. Nói ______ cách khác, là tài sản hoặc tiền bạc."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Cụm cố định <span class="p-grammar">in other words</span> = nói cách khác (dùng để giải thích lại).</li>
   <li><span class="hl-red">Tránh nhầm:</span> "another" đi với danh từ <span class="hl-red">số ít</span> ("another word"); "others" là đại từ đứng một mình, không đứng trước "words".</li></ul>`},
  {n:"29",type:"fill",q:"______ celebrating girls in this way, the villagers hope to change attitudes.",accept:["by"],
   exp:`<h4>🧠 Câu 29 ➔ By</h4>
   <b>Dịch cả câu:</b> "______ việc tôn vinh các bé gái theo cách này, dân làng hy vọng thay đổi thái độ."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">By + V-ing</span> = bằng cách làm gì (chỉ phương tiện tạo ra kết quả). "By celebrating girls... they hope to change attitudes".</li>
   <li><span class="hl-red">Tránh nhầm:</span> "For celebrating" sai nghĩa; "In celebrating" không tự nhiên bằng "By" khi diễn tả <span class="hl-red">phương tiện đạt kết quả</span>.</li></ul>`},
  {n:"30",type:"fill",q:"...daughters are given money by the villagers ______ that they can be independent...",accept:["so"],
   exp:`<h4>🧠 Câu 30 ➔ so</h4>
   <b>Dịch cả câu:</b> "Khi chào đời, các bé gái được dân làng tặng tiền ______ để các em có thể tự lập khi lớn lên."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">so that</span> = để mà (mệnh đề chỉ mục đích/kết quả). "given money... so that they can be independent".</li>
   <li><span class="hl-red">Tránh nhầm:</span> một từ đứng trước "that" để chỉ mục đích thì là "so" (so that); "such that" hiếm dùng và <span class="hl-red">không hợp</span> ngữ cảnh này.</li></ul>`},
  {n:"31",type:"fill",q:"The parents ______ to agree that the girls will be educated...",accept:["have"],
   exp:`<h4>🧠 Câu 31 ➔ have</h4>
   <b>Dịch cả câu:</b> "Cha mẹ ______ đồng ý rằng các bé gái sẽ được đi học và sẽ không kết hôn khi các em mười tám tuổi."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">have to + V</span> = phải làm gì (nghĩa vụ). Vì sau chỗ trống có "to agree" nên "have to agree" = buộc phải đồng ý.</li>
   <li><span class="hl-red">Tránh nhầm:</span> "must" cũng chỉ nghĩa vụ nhưng "must to agree" <span class="hl-red">sai</span> (must + V nguyên mẫu, không "to"); vì có "to" nên phải là "have".</li></ul>`},
  {n:"32",type:"fill",q:"...they will not get married ______ they are eighteen.",accept:["before"],
   exp:`<h4>🧠 Câu 32 ➔ before</h4>
   <b>Dịch cả câu:</b> "...các em sẽ không kết hôn ______ khi các em mười tám tuổi."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> <span class="p-word">before</span> mô tả khoảng thời gian dẫn tới một mốc trong tương lai. "not get married before they are eighteen" = không kết hôn trước khi đủ 18 tuổi.</li>
   <li><span class="hl-red">Tránh nhầm:</span> "after" trái nghĩa (thành "chỉ cưới sau 18"); ý của bài là <span class="hl-red">cấm cưới trước 18 tuổi</span> nên dùng "before".</li></ul>`}
 ]
}
];

/* ===== ENGINE ===== */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    TOTAL++;
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    if(q.type==='fill'){
      const fin=document.createElement('div'); fin.className='fin';
      const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Gõ 1 từ...';
      const cb=document.createElement('button'); cb.className='checkbtn'; cb.textContent='Kiểm tra ✓';
      cb.onclick=()=>checkFill(inp,cb,card,qid,q.accept);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')cb.click();});
      fin.appendChild(inp); fin.appendChild(cb); card.appendChild(fin);
    } else {
      const box=document.createElement('div'); box.className='opts';
      shuffle(q.opts).forEach(o=>{
        const b=document.createElement('button'); b.className='opt'; b.type='button';
        b.textContent=o.en; b.dataset.val=o.en; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
      });
      card.appendChild(box);
    }
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#ffd23f','#ff9f68','#ff6b8a','#4ecdc4','#5bc0eb','#fff6e9'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';t.style.display=open?'none':'block';btn.textContent=open?(btn.textContent.includes('bài')?'🌟 Mở dịch cả bài':'🌟 Mở dịch đoạn này'):'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function checkFill(inp,btn,card,qid,accept){
  if(qid in answered) return;
  const val=inp.value.trim().toLowerCase().replace(/[.,;:]/g,'');
  const ok=accept.includes(val); answered[qid]=ok;
  inp.disabled=true; btn.disabled=true;
  if(ok){inp.classList.add('correct');ding();confetti();}
  else{inp.classList.add('wrong');card.classList.add('shake');buzz();
    const hint=document.createElement('div');hint.style.marginTop='6px';hint.style.fontWeight='800';
    hint.innerHTML='✅ Đáp án đúng: <span class="hl-green">'+accept.join(' / ')+'</span>';
    card.querySelector('.fin').after(hint);
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms. Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
