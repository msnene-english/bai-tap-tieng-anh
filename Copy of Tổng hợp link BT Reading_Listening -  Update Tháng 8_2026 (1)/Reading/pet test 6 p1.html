<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 6 · Comic English · Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --grape:#c8b6ff; --coral:#ffc09f; --aqua:#9defe0; --blue:#a3c4ff; --pink2:#ffb8e6; --lemon:#fdffb6;
  --ink:#241b3a;
  --p-word:#d1006f; --p-phon:#5f0f40; --p-mean:#0466c8; --p-gram:#6a00f4;
  --green:#2a9d8f; --red:#e5383b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#c8b6ff,#a3c4ff,#9defe0,#fdffb6,#ffb8e6);
  background-size:400% 400%;animation:bg 18s ease infinite;}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.28) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:48px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(18px,2.6vw,28px);margin:0;letter-spacing:1.5px;
  color:#fff;-webkit-text-stroke:1.8px var(--ink);text-shadow:2px 2px 0 var(--pink2),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:11px;margin-top:1px;display:inline-block;background:rgba(255,255,255,.6);
  border:1.5px solid var(--ink);border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(255,255,255,.3);
  border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(36,27,58,.25)}
.pane::-webkit-scrollbar{width:10px}
.pane::-webkit-scrollbar-thumb{background:var(--grape);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;position:sticky;top:0;z-index:2;
  margin:0 -10px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--pink2),var(--aqua));
  border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;margin:18px 0 8px;color:var(--ink);
  background:var(--lemon);display:inline-block;padding:2px 14px;border:2.5px solid var(--ink);border-radius:14px;
  transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.rd{background:rgba(255,255,255,.5);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:3px 3px 0 rgba(36,27,58,.2)}
.rd .num{font-family:'Bangers',cursive;background:var(--aqua);border:2px solid var(--ink);border-radius:50%;width:30px;height:30px;
  display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-right:6px;box-shadow:2px 2px 0 var(--ink)}
.rd p{margin:6px 0;line-height:1.6}
.notice{font-style:italic;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:8px 10px;margin:6px 0}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--grape);color:var(--ink);font-weight:800;font-size:12px;
  border-radius:20px;padding:3px 12px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#fff0fa;border-left:5px solid var(--pink2);border-radius:8px;padding:8px 10px;font-size:14px;color:#5f0f40}
.resort{margin:8px 0;padding:8px 10px;background:rgba(255,255,255,.55);border:2px solid var(--ink);border-radius:12px}
.resort b{color:var(--p-mean)}
.gloss{margin:12px 0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 rgba(36,27,58,.2)}
.gloss .gh{font-family:'Bangers',cursive;font-size:19px;letter-spacing:1px;background:var(--coral);padding:6px 12px;border-bottom:2.5px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:rgba(255,255,255,.6)}
th,td{border:1.5px solid var(--ink);padding:5px 8px;text-align:left}
th{background:var(--blue);font-weight:800}
td .w{font-weight:800;color:var(--p-word)}
td .t{color:var(--p-gram);font-weight:700}
.q{background:rgba(255,255,255,.55);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:5px 5px 0 rgba(36,27,58,.2)}
.q .qtxt{font-weight:800;margin-bottom:10px;display:flex;gap:8px;line-height:1.45}
.q .badge{font-family:'Bangers',cursive;background:var(--pink2);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.6px var(--ink);
  border-radius:12px;min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:15px;background:rgba(255,255,255,.88);border:2.5px solid var(--ink);
  border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--lemon)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf7;border:2.5px dashed var(--ink);border-radius:14px;padding:12px;font-size:14px;line-height:1.6}
.exp h4{margin:0 0 6px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:18px}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-phonetic{color:var(--p-phon);font-style:italic}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#efe4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(255,255,255,.42);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--blue),var(--grape));transition:width .3s}
.progtxt{font-weight:800;font-size:12px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);
  background:linear-gradient(90deg,#d1006f,#6a00f4);border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(36,27,58,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#fff0fa);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(36,27,58,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:46px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:32px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--lemon);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--blue);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){
  body{overflow:auto}.wrap{height:auto;min-height:100%}
  .split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}
  .float{font-size:36px}footer{position:sticky;bottom:0}
}
</style>
</head>
<body>
<div id="bgart">
  <span class="float" style="left:6%;top:14%;animation-delay:0s">📚</span>
  <span class="float" style="left:82%;top:10%;animation-delay:1.2s">🎭</span>
  <span class="float" style="left:14%;top:74%;animation-delay:2s">🎬</span>
  <span class="float" style="left:74%;top:66%;animation-delay:.6s">✍️</span>
  <span class="float" style="left:46%;top:40%;animation-delay:1.8s">⭐</span>
  <span class="float" style="left:90%;top:44%;animation-delay:2.6s">🎨</span>
</div>
<div class="wrap">
  <header>
    <h1>💫 TEST 6 · VOCAB + READING P1-3 💫</h1>
    <div class="sub">👩‍🏫 Giáo viên tạo: Ms. Chí Nên</div>
  </header>
  <div class="split">
    <div class="pane" id="leftPane"><div class="pane-title">📖 Bài đọc / Reading</div></div>
    <div class="pane" id="rightPane"><div class="pane-title">✏️ Bài tập / Exercises</div></div>
  </div>
  <footer>
    <span class="progtxt" id="ptxt">0/24</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <button class="submit" onclick="openSubmit()">🎯 NỘP BÀI</button>
  </footer>
</div>
<div class="overlay" id="nameOv"><div class="modal">
  <h2>🏆 Nhập tên để nộp bài</h2><input id="nameIn" placeholder="Tên học sinh...">
  <div class="err" id="nameErr"></div><button class="mbtn" onclick="grade()">Nộp bài ➜</button>
</div></div>
<div class="overlay" id="scoreOv"><div class="modal">
  <h2 id="hi"></h2><div class="score-big" id="scoreRaw"></div><div class="score-10" id="score10"></div>
  <div class="gifbox" id="gifbox"></div><div class="comment" id="comment"></div>
  <button class="mbtn" onclick="document.getElementById('scoreOv').style.display='none'">Đóng</button>
</div></div>

<script>
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"🔤 Vocabulary Development",
 left:`
  <div class="gloss"><div class="gh">📚 Từ khoá cần nhớ</div><table>
  <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
  <tr><td><span class="w">exhausted</span></td><td><span class="t">adj</span></td><td>kiệt sức</td></tr>
  <tr><td><span class="w">criticise</span></td><td><span class="t">v</span></td><td>chỉ trích, phê phán</td></tr>
  <tr><td><span class="w">shortage</span></td><td><span class="t">n</span></td><td>sự thiếu hụt</td></tr>
  <tr><td><span class="w">retired</span></td><td><span class="t">adj</span></td><td>đã nghỉ hưu</td></tr>
  <tr><td><span class="w">romantic novel</span></td><td><span class="t">n</span></td><td>tiểu thuyết lãng mạn</td></tr>
  <tr><td><span class="w">chapter</span></td><td><span class="t">n</span></td><td>chương (sách)</td></tr>
  <tr><td><span class="w">deposit</span></td><td><span class="t">n</span></td><td>tiền đặt cọc</td></tr>
  <tr><td><span class="w">warning</span></td><td><span class="t">n</span></td><td>lời cảnh cáo</td></tr>
  <tr><td><span class="w">effect</span></td><td><span class="t">n</span></td><td>tác dụng, ảnh hưởng</td></tr></table></div>
  <div class="rd"><p><b>Exercise A & B:</b> Choose the correct word (A, B or C).<br>
  <b>Exercise C:</b> Word bank – warning · realisation · effect · process · vision · admission · <b>deposit</b></p></div>`,
 qs:[
  {n:"1",q:"I feel ______ . I've been working all day!",
   opts:[opt("exhausted","kiệt sức (adj)"),opt("complex","phức tạp (adj)"),opt("archaeological","thuộc khảo cổ (adj)")],a:"exhausted",
   exp:`<h4>🧠 Câu 1 ➔ exhausted</h4>
   <b>Dịch đề:</b> "Tôi cảm thấy ______. Tôi đã làm việc cả ngày rồi!"
   <ul>
   <li><span class="p-word">exhausted</span> ➔ <span class="p-mean">kiệt sức, mệt lử (adj)</span></li>
   <li><span class="p-word">complex</span> ➔ <span class="p-mean">phức tạp (adj)</span></li>
   <li><span class="p-word">archaeological</span> ➔ <span class="p-mean">thuộc về khảo cổ học (adj)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> "working all day" (làm cả ngày) ➔ cảm giác <span class="p-word">exhausted</span> = <span class="p-mean">extremely tired</span> (rất mệt).<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">complex</span> (phức tạp) và <span class="p-word">archaeological</span> (khảo cổ) <span class="hl-red">không tả cảm giác mệt của con người</span>.`},
  {n:"2",q:"The school is being ______ for allowing this kind of behaviour.",
   opts:[opt("criticised","bị chỉ trích (v)"),opt("concentrated","tập trung (v)"),opt("struggled","vật lộn (v)")],a:"criticised",
   exp:`<h4>🧠 Câu 2 ➔ criticised</h4>
   <b>Dịch đề:</b> "Nhà trường đang bị ______ vì cho phép loại hành vi này."
   <ul>
   <li><span class="p-word">criticised</span> ➔ <span class="p-mean">bị chỉ trích, bị phê phán (v)</span></li>
   <li><span class="p-word">concentrated</span> ➔ <span class="p-mean">tập trung (v)</span></li>
   <li><span class="p-word">struggled</span> ➔ <span class="p-mean">vật lộn, gắng sức (v)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">be criticised for + V-ing</span> = bị chỉ trích vì làm gì. "allowing bad behaviour" ➔ bị chê trách.<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">concentrate</span> đi với <span class="p-grammar">on</span> (không phải "for"); <span class="p-word">struggle</span> nghĩa "vật lộn", <span class="hl-red">sai nghĩa & sai cấu trúc bị động</span>.`},
  {n:"3",q:"There is a ______ of water, so the government is going to take measures.",
   opts:[opt("shortage","sự thiếu hụt (n)"),opt("comfort","sự thoải mái (n)"),opt("purpose","mục đích (n)")],a:"shortage",
   exp:`<h4>🧠 Câu 3 ➔ shortage</h4>
   <b>Dịch đề:</b> "Có một ______ nước, nên chính phủ sẽ áp dụng biện pháp."
   <ul>
   <li><span class="p-word">shortage</span> ➔ <span class="p-mean">sự thiếu hụt (n)</span></li>
   <li><span class="p-word">comfort</span> ➔ <span class="p-mean">sự thoải mái (n)</span></li>
   <li><span class="p-word">purpose</span> ➔ <span class="p-mean">mục đích (n)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">a shortage of + N</span> = sự thiếu hụt cái gì. Chính phủ phải hành động vì thiếu nước.<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">comfort</span> (thoải mái) và <span class="p-word">purpose</span> (mục đích) <span class="hl-red">không hợp lý</span> với việc phải "take measures".`},
  {n:"4",q:"Susan is 69 and is a(n) ______ teacher.",
   opts:[opt("retired","đã nghỉ hưu (adj)"),opt("analytical","có tính phân tích (adj)"),opt("human","thuộc con người (adj)")],a:"retired",
   exp:`<h4>🧠 Câu 4 ➔ retired</h4>
   <b>Dịch đề:</b> "Susan 69 tuổi và là một giáo viên ______."
   <ul>
   <li><span class="p-word">retired</span> ➔ <span class="p-mean">đã nghỉ hưu (adj)</span></li>
   <li><span class="p-word">analytical</span> ➔ <span class="p-mean">có tính phân tích (adj)</span></li>
   <li><span class="p-word">human</span> ➔ <span class="p-mean">thuộc con người (adj)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> 69 tuổi ➔ đã <span class="p-word">retired</span> = <span class="p-mean">đã ngừng làm việc vì đến tuổi</span>. "a retired teacher".<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">analytical</span>/<span class="p-word">human</span> không liên quan tới tuổi tác/nghỉ hưu; "a human teacher" <span class="hl-red">vô nghĩa</span>.`},
  {n:"5",q:"She started writing, and in December, her first romantic ______ was published.",
   opts:[opt("novel","tiểu thuyết (n)"),opt("acceptance","sự chấp nhận (n)"),opt("mind","trí óc (n)")],a:"novel",
   exp:`<h4>🧠 Câu 5 ➔ novel</h4>
   <b>Dịch đề:</b> "Cô ấy bắt đầu viết, và vào tháng 12, cuốn ______ lãng mạn đầu tay của cô được xuất bản."
   <ul>
   <li><span class="p-word">novel</span> ➔ <span class="p-mean">tiểu thuyết (n)</span></li>
   <li><span class="p-word">acceptance</span> ➔ <span class="p-mean">sự chấp nhận (n)</span></li>
   <li><span class="p-word">mind</span> ➔ <span class="p-mean">trí óc (n)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">romantic novel</span> = tiểu thuyết lãng mạn; "started writing" + "was published" ➔ đó là một cuốn sách.<br>
   <span class="hl-red">Tại sao sai:</span> "romantic acceptance/mind" <span class="hl-red">không phải cụm từ hợp lý</span> và không thể "được xuất bản".`},
  {n:"6",q:"The first ______ of the book is not very interesting.",
   opts:[opt("chapter","chương (n)"),opt("surgery","ca phẫu thuật (n)"),opt("trade","sự buôn bán (n)")],a:"chapter",
   exp:`<h4>🧠 Câu 6 ➔ chapter</h4>
   <b>Dịch đề:</b> "______ đầu tiên của cuốn sách không hay lắm."
   <ul>
   <li><span class="p-word">chapter</span> ➔ <span class="p-mean">chương sách (n)</span></li>
   <li><span class="p-word">surgery</span> ➔ <span class="p-mean">ca phẫu thuật (n)</span></li>
   <li><span class="p-word">trade</span> ➔ <span class="p-mean">sự buôn bán (n)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> "of the book" ➔ một phần của sách chính là <span class="p-word">chapter</span> = <span class="p-mean">phần riêng có đánh số/tựa</span>.<br>

 <div class="rd"><span class="num">1</span>

{
 title:"📚 Reading · Part 2",
 left:`
 <div class="rd"><p><b>PART 2 (Q6–10):</b> People want to borrow a book. Match each person to the most suitable book review.</p></div>
 <div class="resort"><b>A. Journeys with my Family</b> — Not about travelling. A collection of short stories: studies of how people are with their families. Often funny and heartbreaking; shows the best and worst of people.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Không phải về du lịch. Là tập truyện ngắn: nghiên cứu về cách con người cư xử với gia đình. Vừa hài vừa xúc động; cho thấy mặt tốt và xấu của con người.</div></div>
 <div class="resort"><b>B. The Enchanted April</b> — An advertisement for a castle to rent on the Italian Riviera brings together four very different women. The environment helps them make discoveries about themselves, life and love. A novel you won't want to put down.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Một mẩu quảng cáo thuê lâu đài ở Riviera nước Ý đưa bốn người phụ nữ rất khác nhau đến với nhau. Khung cảnh giúp họ khám phá bản thân, cuộc sống và tình yêu. Một tiểu thuyết khó rời tay.</div></div>
 <div class="resort"><b>C. Living with the Bushmen</b> — The true story of Richard Berk's search for the African bushmen and their acceptance of him. He lived with them for six months, learning their language and exploring their culture. A great story about an impressive anthropologist.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Câu chuyện có thật về hành trình của Richard Berk tìm người Bushmen châu Phi và sự đón nhận của họ. Ông sống cùng họ 6 tháng, học ngôn ngữ và khám phá văn hoá. Câu chuyện tuyệt vời về một nhà nhân học ấn tượng.</div></div>
 <div class="resort"><b>D. Trouble in the Suburbs</b> — A light-hearted crime story about a private detective on his final case. The investigation takes an unexpected turn and the hero is put in danger. A good read for those who don't want to be challenged too much.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Một truyện trinh thám nhẹ nhàng về một thám tử tư trong vụ án cuối cùng. Cuộc điều tra rẽ hướng bất ngờ và nhân vật chính gặp nguy hiểm. Đọc thoải mái cho người không muốn quá "hại não".</div></div>
 <div class="resort"><b>E. The King of all Kings</b> — A story of an imaginary Egyptian pharaoh with interesting archaeological facts and beautifully drawn maps and diagrams. But unless you have a passion for Ancient Egypt, it probably wouldn't be a gripping read.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Câu chuyện về một pharaoh Ai Cập hư cấu với các dữ kiện khảo cổ thú vị cùng bản đồ, sơ đồ đẹp. Nhưng trừ khi bạn mê Ai Cập cổ, nó khó mà cuốn hút.</div></div>
 <div class="resort"><b>F. The History of Advertising</b> — A surprisingly interesting look at how the media has changed our lifestyles. This non-fiction book shows how advertising has developed and how we now accept images once criticised.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Một cái nhìn thú vị bất ngờ về cách truyền thông thay đổi lối sống. Cuốn phi hư cấu này cho thấy quảng cáo đã phát triển ra sao và ta nay chấp nhận những hình ảnh từng bị chỉ trích.</div></div>
 <div class="resort"><b>G. The Connection</b> — Not an easy-reading book. This novel takes the reader into a world of mystery and strange events that all affect each other. There is one common factor that links everything. Can you work out what it is before the final chapter?
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Không phải sách dễ đọc. Tiểu thuyết đưa người đọc vào thế giới bí ẩn với những sự kiện lạ có liên quan lẫn nhau. Có một mấu chốt chung kết nối mọi thứ. Bạn có đoán ra trước chương cuối không?</div></div>
 <div class="resort"><b>H. The Lost Leopard</b> — The story of a snow leopard, orphaned by hunters, which ran across miles of frozen land searching for a home. Sponsored by the Leopard Sanctuary; its message about the illegal fur trade is clear and powerful.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Câu chuyện về một con báo tuyết mồ côi vì thợ săn, chạy qua hàng dặm băng giá tìm nơi trú ngụ. Được tài trợ bởi Khu bảo tồn Báo; thông điệp về nạn buôn bán lông thú trái phép rất rõ và mạnh mẽ.</div></div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">graduate</span></td><td><span class="t">v</span></td><td>tốt nghiệp</td></tr>
 <tr><td><span class="w">anthropologist</span></td><td><span class="t">n</span></td><td>nhà nhân học</td></tr>
 <tr><td><span class="w">acceptance</span></td><td><span class="t">n</span></td><td>sự đón nhận</td></tr>
 <tr><td><span class="w">timeless</span></td><td><span class="t">adj</span></td><td>không bị thời gian tác động</td></tr>
 <tr><td><span class="w">archaeological</span></td><td><span class="t">adj</span></td><td>thuộc khảo cổ</td></tr>
 <tr><td><span class="w">gripping</span></td><td><span class="t">adj</span></td><td>hấp dẫn, cuốn hút</td></tr>

{
 title:"🎭 Reading · Part 3",
 left:`
 <div class="rd"><p><b>PART 3 (Q11–15):</b> This is how it all started — <i>by Joanna Summers</i></p></div>
 <div class="rd">
   <p>I guess you could say that acting is in my blood as my mother and my father are both actors, my grandfather was a theatre musician and my grandmother was a singer and dancer. I suppose it seemed normal for me to perform for family and friends and I certainly wasn't shy while growing up. I actually used to enjoy the attention and I still have many enjoyable memories of the whole family singing and dancing together.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Có thể nói diễn xuất nằm trong máu tôi, vì mẹ và bố tôi đều là diễn viên, ông tôi là nhạc công sân khấu và bà tôi là ca sĩ kiêm vũ công. Việc biểu diễn cho gia đình và bạn bè có vẻ là điều bình thường với tôi, và tôi chắc chắn không hề nhút nhát khi lớn lên. Thực ra tôi từng rất thích được chú ý, và đến nay vẫn còn nhiều kỷ niệm vui khi cả nhà cùng hát và nhảy.</div></div>
 <div class="rd">
   <p>That's why it came as no surprise that I started going to Drama school from the young age of six. I attended classes there every Saturday for almost 10 years. We were taught how to sing and dance, as well as act, so I was quite good by my teens.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Vì vậy chẳng có gì lạ khi tôi bắt đầu học trường kịch từ năm sáu tuổi. Tôi học ở đó mỗi thứ Bảy suốt gần 10 năm. Chúng tôi được dạy hát, nhảy và cả diễn xuất, nên tôi khá giỏi khi ở tuổi thiếu niên.</div></div>
 <div class="rd">
   <p>Once I'd left school, I went to drama school in London full-time to do a degree. I must say that at that time, and for a period of about six months, I needed a break. I had spent my whole childhood acting and it felt like I had missed out on so much.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Sau khi rời trường phổ thông, tôi vào học toàn thời gian ở một trường kịch tại London để lấy bằng. Phải nói rằng lúc đó, trong khoảng sáu tháng, tôi cần một quãng nghỉ. Tôi đã dành cả tuổi thơ để diễn và cảm thấy mình đã bỏ lỡ quá nhiều thứ.</div></div>
 <div class="rd">
   <p>So I started partying with friends, danced the nights away and slept late most mornings. It was only when my personal tutor told me that I was on my final warning that I realised it was time to stop. Partying was great but I was about to lose everything I had worked so hard for all these years.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Thế là tôi bắt đầu tiệc tùng với bạn bè, nhảy thâu đêm và hầu như sáng nào cũng dậy muộn. Chỉ đến khi giáo viên chủ nhiệm nói tôi đang bị cảnh cáo lần cuối, tôi mới nhận ra đã đến lúc dừng lại. Tiệc tùng rất vui nhưng tôi sắp đánh mất mọi thứ mình đã vất vả gây dựng bấy lâu.</div></div>
 <div class="rd">
   <p>After the shock of that realisation, I got my act together very quickly, went back to classes and workshops and soon after, I ended up graduating with a first. I had always been confident about my acting skills but it was then that I felt truly ready to get myself out there professionally. A few months later, The Royal Shakespeare Company gave me my first real role and I acted alongside some great names in the world of the stage. Now, of course, I'm better known for my Hollywood roles and people will probably be amazed to hear that I started my acting career as a Shakespearean actor. But it's true; this is how it all started.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Sau cú sốc nhận ra điều đó, tôi nhanh chóng chấn chỉnh bản thân, quay lại lớp học và các buổi thực hành, và không lâu sau tôi tốt nghiệp loại xuất sắc. Tôi luôn tự tin về khả năng diễn của mình, nhưng chính lúc đó tôi mới thấy thực sự sẵn sàng bước ra chuyên nghiệp. Vài tháng sau, Công ty Royal Shakespeare giao cho tôi vai diễn thực thụ đầu tiên và tôi diễn cùng những tên tuổi lớn của sân khấu. Giờ thì tất nhiên tôi được biết đến nhiều hơn với các vai ở Hollywood, và có lẽ mọi người sẽ ngạc nhiên khi biết tôi khởi nghiệp diễn xuất với vai kịch Shakespeare. Nhưng đó là sự thật; mọi chuyện đã bắt đầu như thế.</div></div>

   <b>Dịch đề:</b> Mô tả nào đúng nhất về Joanna?
   <ul>
   <li>Followed parents' footsteps, Shakespeare ➔ Hollywood ➔ <span class="p-mean">Nối nghiệp bố mẹ, từ Shakespeare sang Hollywood</span></li>
   <li>Young actress developing a career ➔ <span class="p-mean">Diễn viên trẻ đang lập nghiệp</span></li>
   <li>Struggled, became a Hollywood director ➔ <span class="p-mean">Vật lộn rồi thành đạo diễn Hollywood</span></li>
   <li>Wild life affecting career, now serious ➔ <span class="p-mean">Sống buông thả, nay cố nghiêm túc</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Cả bài kể việc cô <span class="p-word">nối nghiệp bố mẹ diễn viên</span>, khởi đầu là diễn viên Shakespeare rồi "better known for my <span class="p-word">Hollywood roles</span>" ➔ đi từ Shakespeare sang Hollywood.<br>
   <span class="hl-red">Tại sao sai:</span> Cô đã là <span class="hl-red">diễn viên thành danh</span>, không còn "trẻ đang lập nghiệp"; cô là <span class="hl-red">diễn viên (actress)</span> chứ không phải <span class="hl-red">đạo diễn</span>; lối sống buông thả là chuyện <span class="hl-red">quá khứ</span>, không phải hiện tại.`}
 ]
}
];

/* ===== ENGINE ===== */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    TOTAL++;
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    const box=document.createElement('div'); box.className='opts';
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.textContent=o.en; b.dataset.val=o.en; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
    });
    card.appendChild(box);
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#c8b6ff','#ffc09f','#9defe0','#a3c4ff','#ffb8e6','#fdffb6'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';t.style.display=open?'none':'block';btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms. Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
</body>
</html>
