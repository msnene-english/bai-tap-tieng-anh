<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#c8b6ff,#a3c4ff,#9defe0,#fdffb6,#ffb8e6);background-size:400% 400%;animation:bg 18s ease infinite;}

#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.28) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:48px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(18px,2.6vw,28px);margin:0;letter-spacing:1.5px;color:#fff;-webkit-text-stroke:1.8px var(--ink);text-shadow:2px 2px 0 var(--pink2),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:11px;margin-top:1px;display:inline-block;background:rgba(255,255,255,.6);border:1.5px solid var(--ink);border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(255,255,255,.3);border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(36,27,58,.25)}
.pane::-webkit-scrollbar{width:10px}.pane::-webkit-scrollbar-thumb{background:var(--grape);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;position:sticky;top:0;z-index:2;margin:0 -10px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--pink2),var(--aqua));border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;margin:18px 0 8px;color:var(--ink);background:var(--lemon);display:inline-block;padding:2px 14px;border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.rd{background:rgba(255,255,255,.5);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:3px 3px 0 rgba(36,27,58,.2)}
.rd p{margin:6px 0;line-height:1.6}

.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--grape);color:var(--ink);font-weight:800;font-size:12px;border-radius:20px;padding:3px 12px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#fff0fa;border-left:5px solid var(--pink2);border-radius:8px;padding:8px 10px;font-size:14px;color:#5f0f40}
.optbank{background:rgba(255,255,255,.55);border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:14px}
.gloss{margin:12px 0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 rgba(36,27,58,.2)}
.gloss .gh{font-family:'Bangers',cursive;font-size:19px;letter-spacing:1px;background:var(--coral);padding:6px 12px;border-bottom:2.5px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:rgba(255,255,255,.6)}
th,td{border:1.5px solid var(--ink);padding:5px 8px;text-align:left}
th{background:var(--blue);font-weight:800}
td .w{font-weight:800;color:var(--p-word)}td .t{color:var(--p-gram);font-weight:700}
.q{background:rgba(255,255,255,.55);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:5px 5px 0 rgba(36,27,58,.2)}
.q .qtxt{font-weight:800;margin-bottom:10px;display:flex;gap:8px;line-height:1.45}
.q .badge{font-family:'Bangers',cursive;background:var(--pink2);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none}

.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--lemon)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
.fin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fin input{font-family:'Nunito';font-weight:700;font-size:15px;padding:9px 12px;border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);min-width:150px}
.fin input.correct{background:#8ce99a;border-color:#2b8a3e}
.fin input.wrong{background:#ffa8a8;border-color:#c92a2a}
.checkbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:.5px;color:#fff;-webkit-text-stroke:.5px var(--ink);background:var(--green);border:2.5px solid var(--ink);border-radius:12px;padding:7px 16px;box-shadow:3px 3px 0 var(--ink)}
.checkbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf7;border:2.5px dashed var(--ink);border-radius:14px;padding:12px;font-size:14px;line-height:1.6}
.exp h4{margin:0 0 6px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:18px}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-phonetic{color:var(--p-phon);font-style:italic}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#efe4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(255,255,255,.42);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--blue),var(--grape));transition:width .3s}
.progtxt{font-weight:800;font-size:12px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#d1006f,#6a00f4);border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(36,27,58,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#fff0fa);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(36,27,58,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:46px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:32px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--lemon);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--blue);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){body{overflow:auto}.wrap{height:auto;min-height:100%}.split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}.float{font-size:36px}footer{position:sticky;bottom:0}}
</style>

<script>
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"💼 Reading · Part 4 — The Choice",
 left:`
 <div class="rd"><p><b>PART 4 (Q16–20):</b> Five sentences have been removed. Choose the correct sentence for each gap. There are three extra sentences you do not need.</p></div>
 <div class="rd"><b>The Choice</b>
 <p>I was looking out of the window, watching the traffic and umbrellas below. As the rain fell, I was wondering what I was doing with my life. <span class="gap">16</span> I had finished university and taken the first job that I was interviewed for.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Tôi nhìn ra ngoài cửa sổ, ngắm dòng xe cộ và những chiếc ô bên dưới. Khi mưa rơi, tôi tự hỏi mình đang làm gì với cuộc đời mình. (16) Tôi đã tốt nghiệp đại học và nhận luôn công việc đầu tiên mà tôi được phỏng vấn.</div>
 <p>I was worried I would join all those who ended up working in cafes or fast-food places after graduation, or that I'd be out of work. <span class="gap">17</span> I listened to my friends and parents saying congratulations, but, actually, I did not feel like celebrating. I had never thought of myself as the person who would end up working late in the office and having to attend long, boring meetings.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Tôi lo mình sẽ gia nhập đám người rốt cuộc đi làm ở quán cà phê hay tiệm đồ ăn nhanh sau khi ra trường, hoặc thất nghiệp. (17) Tôi nghe bạn bè và bố mẹ chúc mừng, nhưng thật ra tôi chẳng thấy muốn ăn mừng. Tôi chưa bao giờ nghĩ mình sẽ là người rốt cuộc làm việc muộn ở văn phòng và phải dự những cuộc họp dài lê thê, chán ngắt.</div>
 <p>Well, that was a year ago. Today I am sitting in a boat in the Pacific Ocean, filming a documentary about sea pollution. I remember that day, when unable to concentrate on my work, I started to look at volunteer sites on the internet. Then I saw it! My dream job! <span class="gap">18</span> However, food and board are free. Anyway, I decided to apply. My parents were shocked! <span class="gap">19</span> But after seeing how enthusiastic I was, they started to be more positive.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Vậy mà đó là chuyện của một năm trước. Hôm nay tôi đang ngồi trên một chiếc thuyền giữa Thái Bình Dương, quay phim tài liệu về ô nhiễm biển. Tôi nhớ ngày hôm đó, khi không thể tập trung làm việc, tôi bắt đầu xem các trang tình nguyện trên mạng. Rồi tôi thấy nó! Công việc mơ ước của tôi! (18) Tuy nhiên, ăn ở thì miễn phí. Dù sao, tôi quyết định nộp đơn. Bố mẹ tôi sốc lắm! (19) Nhưng sau khi thấy tôi hào hứng thế nào, họ bắt đầu tích cực hơn.</div>
 <p>For me it was the decision of a lifetime. I knew I could not spend the rest of my life working just to pay the bills. Through the work I do now, I have met amazing people. I started as a member of a research group but now I work on the documentary team making films for schools. The aim is to teach kids about how they can keep the oceans clean by reducing their personal pollution. <span class="gap">20</span> It's not a lot, but it doesn't matter because I really feel I'm doing something important now.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Với tôi, đó là quyết định của cả đời. Tôi biết mình không thể dành cả phần đời còn lại chỉ để làm việc trả hóa đơn. Nhờ công việc bây giờ, tôi đã gặp những con người tuyệt vời. Tôi bắt đầu là thành viên một nhóm nghiên cứu, nhưng giờ tôi làm trong ê-kíp làm phim tài liệu cho trường học. Mục tiêu là dạy trẻ cách giữ cho đại dương sạch bằng cách giảm ô nhiễm cá nhân. (20) Không nhiều, nhưng chẳng sao, vì tôi thực sự thấy mình đang làm điều gì đó có ý nghĩa.</div></div>
 <div class="optbank"><b>Ngân hàng câu (A–H):</b><br>
 A. And the most amazing part is that I am now being paid!<br>
 B. The pay was much more than I had expected.<br>
 C. Well, not exactly a job, because you don't get paid when you start.<br>
 D. I guess they wanted to prove something to me.<br>
 E. So, I just took the first offer of employment.<br>
 F. Although I had a good job, I was bored.<br>
 G. We teach them how to swim more carefully.<br>
 H. They couldn't understand why I wanted to give up a paid job.</div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">graduation</span></td><td><span class="t">n</span></td><td>sự tốt nghiệp</td></tr>
 <tr><td><span class="w">out of work</span></td><td><span class="t">phr</span></td><td>thất nghiệp</td></tr>
 <tr><td><span class="w">dream job</span></td><td><span class="t">n</span></td><td>công việc mơ ước</td></tr>
 <tr><td><span class="w">board</span></td><td><span class="t">n</span></td><td>tiền ăn/chỗ ở (khi lưu trú)</td></tr>
 <tr><td><span class="w">apply</span></td><td><span class="t">v</span></td><td>nộp đơn</td></tr>
 <tr><td><span class="w">shocked</span></td><td><span class="t">adj</span></td><td>bị sốc</td></tr>
 <tr><td><span class="w">enthusiastic</span></td><td><span class="t">adj</span></td><td>hào hứng, nhiệt tình</td></tr>
 <tr><td><span class="w">pollution</span></td><td><span class="t">n</span></td><td>sự ô nhiễm</td></tr>
 <tr><td><span class="w">documentary</span></td><td><span class="t">n</span></td><td>phim tài liệu</td></tr>
 <tr><td><span class="w">pay the bills</span></td><td><span class="t">phr</span></td><td>trả các hóa đơn</td></tr>
 <tr><td><span class="w">aim</span></td><td><span class="t">n</span></td><td>mục tiêu</td></tr>
 <tr><td><span class="w">give up</span></td><td><span class="t">v</span></td><td>từ bỏ</td></tr></table></div>`,
 qs:[
  {n:"16",q:"Choose the sentence for gap 16.",
   opts:[opt("Although I had a good job, I was bored."),opt("The pay was much more than I had expected."),opt("I guess they wanted to prove something to me."),opt("We teach them how to swim more carefully.")],
   a:"Although I had a good job, I was bored.",
   exp:`<h4>🧠 Câu 16 ➔ F</h4>
   <b>Dịch ngữ cảnh:</b> Câu trước: "Khi mưa rơi, tôi tự hỏi mình đang làm gì với cuộc đời mình." Câu sau: "Tôi đã tốt nghiệp đại học và nhận luôn công việc đầu tiên được phỏng vấn."
   <ul>
   <li>F. Although I had a good job, I was bored. ➔ <span class="p-mean">Dù có một công việc tốt, tôi vẫn thấy chán.</span></li>
   <li>B. The pay was much more than I had expected. ➔ <span class="p-mean">Mức lương cao hơn nhiều so với tôi mong đợi.</span></li>
   <li>D. I guess they wanted to prove something to me. ➔ <span class="p-mean">Tôi đoán họ muốn chứng minh điều gì đó với tôi.</span></li>
   <li>G. We teach them how to swim more carefully. ➔ <span class="p-mean">Chúng tôi dạy chúng cách bơi cẩn thận hơn.</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> F thể hiện sự bất mãn ("<span class="p-word">I was bored</span>") nối thẳng với "<span class="p-word">wondering what I was doing with my life</span>" (băn khoăn về cuộc đời).<br>
   <span class="hl-red">Tại sao sai:</span> B nói về lương (chưa nhắc đến); D có "they" nhưng <span class="hl-red">chưa có ai được nhắc</span>; G về dạy bơi <span class="hl-red">lạc chủ đề</span>. (B, D, G là 3 câu thừa.)`},
  {n:"17",q:"Choose the sentence for gap 17.",
   opts:[opt("So, I just took the first offer of employment."),opt("The pay was much more than I had expected."),opt("I guess they wanted to prove something to me."),opt("We teach them how to swim more carefully.")],
   a:"So, I just took the first offer of employment.",
   exp:`<h4>🧠 Câu 17 ➔ E</h4>

 title:"😴 Reading · Part 5 — A good night's sleep",
 left:`
 <div class="rd"><p><b>PART 5 (Q21–26):</b> For each question, choose the correct answer.</p></div>
 <div class="rd"><b>We all need a good night's sleep</b>
 <p>According to research, 20 million people in the UK are not <span class="gap">21</span> enough sleep nowadays. Experts believe that this may be one of the leading causes of health problems.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Theo nghiên cứu, hiện có 20 triệu người ở Anh không (21) đủ giấc ngủ. Các chuyên gia tin rằng đây có thể là một trong những nguyên nhân hàng đầu gây ra các vấn đề sức khỏe.</div>
 <p>So all of us should try to work out how much sleep we need, says Professor Chris Idzikowski. To do so, we must <span class="gap">22</span> our alarm clock for when we need to get up, then count back six to eight hours, <span class="gap">23</span> on how much sleep we feel we need. Then, we should try to go to bed and get up at the same time every day, even at weekends. If we still feel tired during the day, we should try going to bed 15 minutes earlier for a week until we wake up refreshed. So if we <span class="gap">24</span> go to bed at 11pm, we should go at 10.45pm. If we are still tired, then we should go at 10.30 the following week, and so on, until we find the perfect <span class="gap">25</span> for us.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Vậy nên tất cả chúng ta nên cố tính xem mình cần ngủ bao nhiêu, Giáo sư Chris Idzikowski nói. Để làm vậy, ta phải (22) đồng hồ báo thức cho giờ cần dậy, rồi đếm ngược sáu đến tám tiếng, (23) vào lượng giấc ngủ ta cảm thấy mình cần. Sau đó, nên đi ngủ và thức dậy cùng giờ mỗi ngày, kể cả cuối tuần. Nếu ban ngày vẫn thấy mệt, ta nên thử đi ngủ sớm hơn 15 phút trong một tuần cho đến khi thức dậy thấy sảng khoái. Vậy nếu ta (24) đi ngủ lúc 11 giờ, thì nên đi lúc 10.45. Nếu vẫn mệt, tuần sau nên đi lúc 10.30, cứ thế, cho đến khi tìm được (25) hoàn hảo cho mình.</div>
 <p>Finally, we must remember that a weekend afternoon nap can help <span class="gap">26</span> up for any missed hours in the week.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Cuối cùng, ta phải nhớ rằng một giấc ngủ trưa cuối tuần có thể giúp (26) bù cho số giờ đã thiếu trong tuần.</div></div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">research</span></td><td><span class="t">n</span></td><td>nghiên cứu</td></tr>

 <tr><td><span class="w">work out</span></td><td><span class="t">v</span></td><td>tính toán, tìm ra</td></tr>
 <tr><td><span class="w">alarm clock</span></td><td><span class="t">n</span></td><td>đồng hồ báo thức</td></tr>
 <tr><td><span class="w">count back</span></td><td><span class="t">v</span></td><td>đếm ngược</td></tr>
 <tr><td><span class="w">refreshed</span></td><td><span class="t">adj</span></td><td>sảng khoái, khỏe lại</td></tr>
 <tr><td><span class="w">nap</span></td><td><span class="t">n</span></td><td>giấc ngủ ngắn</td></tr>
 <tr><td><span class="w">missed</span></td><td><span class="t">adj</span></td><td>bị thiếu, bị bỏ lỡ</td></tr>
 <tr><td><span class="w">routine</span></td><td><span class="t">n</span></td><td>thói quen, nếp sinh hoạt</td></tr>
 <tr><td><span class="w">get up</span></td><td><span class="t">v</span></td><td>thức dậy</td></tr></table></div>`,
 qs:[
  {n:"21",q:"...20 million people in the UK are not ______ enough sleep nowadays.",
   opts:[opt("getting","có được (v)"),opt("earning","kiếm được (bằng lao động) (v)"),opt("gaining","tăng thêm (v)"),opt("receiving","nhận được (v)")],a:"getting",
   exp:`<h4>🧠 Câu 21 ➔ getting</h4>

   <ul>

   <span class="hl-red">Tại sao sai:</span> <span class="p-word">take</span> (lấy đi); <span class="p-word">make</span> (chế tạo); <span class="p-word">fix</span> (sửa) chỉ dùng <span class="hl-red">khi đồng hồ bị hỏng</span>.`},
  {n:"23",q:"...then count back six to eight hours, ______ on how much sleep we feel we need.",

   exp:`<h4>🧠 Câu 23 ➔ depending</h4>
   <b>Dịch cả câu:</b> "...rồi đếm ngược sáu đến tám tiếng, ______ vào lượng giấc ngủ mà ta cảm thấy mình cần."
   <ul>

   <span class="hl-red">Tại sao sai:</span> <span class="p-word">count on</span>/<span class="p-word">rely on</span> = trông cậy ai đó giúp (dùng cho người); <span class="p-word">insist on</span> = nằng nặc đòi — <span class="hl-red">không diễn tả sự "tùy thuộc"</span>.`},
  {n:"24",q:"So if we ______ go to bed at 11pm, we should go at 10.45pm.",

 title:"🐱 Reading · Part 6 — Cats and humans (Gõ đáp án)",
 left:`
 <div class="rd"><p><b>PART 6 (Q27–32):</b> Write <b>ONE word</b> for each gap. (Gõ 1 từ vào mỗi ô)</p></div>
 <div class="rd"><b>Cats and humans</b>
 <p>Cats have a strange effect on people. You <span class="gap">27</span> love them or hate them. Some people like the fact that cats are independent. They don't really need us, except for food and a comfortable sofa to sleep on. <span class="gap">28</span> feel the opposite. Some people prefer dogs as company because dogs show their happiness <span class="gap">29</span> people are around and they also make them feel important.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Mèo có một tác động kỳ lạ lên con người. Bạn (27) yêu chúng hoặc ghét chúng. Một số người thích việc mèo độc lập. Chúng chẳng thực sự cần ta, ngoại trừ thức ăn và một chiếc sofa êm ái để ngủ. (28) thì cảm thấy ngược lại. Một số người thích chó làm bạn hơn vì chó thể hiện niềm vui (29) có người ở bên và cũng khiến người ta thấy mình quan trọng.</div>
 <p>But for the cat people, <span class="gap">30</span> find these beautiful small animals charming, it is often a one-sided relationship. You have to accept that this cute creature will always rule your house, but will only occasionally be sweet to you, in return. They are lazy, they won't eat if they do not like <span class="gap">31</span> is offered and they will leave their hair on the furniture. Sometimes they will climb your curtains. And <span class="gap">32</span> you are really lucky, you may find an unlucky mouse left on the kitchen floor.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Nhưng với những người yêu mèo, (30) thấy những sinh vật nhỏ xinh này thật đáng yêu, đó thường là một mối quan hệ một chiều. Bạn phải chấp nhận rằng sinh vật đáng yêu này sẽ luôn thống trị ngôi nhà của bạn, nhưng chỉ thỉnh thoảng mới ngọt ngào với bạn để đáp lại. Chúng lười biếng, sẽ không ăn nếu không thích (31) được dọn ra, và sẽ để lại lông trên đồ đạc. Đôi khi chúng leo lên rèm cửa. Và (32) bạn thật may mắn, bạn có thể tìm thấy một con chuột xấu số nằm trên sàn bếp.</div></div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">effect</span></td><td><span class="t">n</span></td><td>tác động, ảnh hưởng</td></tr>
 <tr><td><span class="w">independent</span></td><td><span class="t">adj</span></td><td>độc lập</td></tr>
 <tr><td><span class="w">the opposite</span></td><td><span class="t">n</span></td><td>điều ngược lại</td></tr>
 <tr><td><span class="w">company</span></td><td><span class="t">n</span></td><td>sự bầu bạn</td></tr>
 <tr><td><span class="w">one-sided</span></td><td><span class="t">adj</span></td><td>một chiều</td></tr>
 <tr><td><span class="w">creature</span></td><td><span class="t">n</span></td><td>sinh vật</td></tr>
 <tr><td><span class="w">rule</span></td><td><span class="t">v</span></td><td>thống trị, cai trị</td></tr>
 <tr><td><span class="w">occasionally</span></td><td><span class="t">adv</span></td><td>thỉnh thoảng</td></tr>
 <tr><td><span class="w">lazy</span></td><td><span class="t">adj</span></td><td>lười biếng</td></tr>
 <tr><td><span class="w">furniture</span></td><td><span class="t">n</span></td><td>đồ nội thất</td></tr>
 <tr><td><span class="w">curtains</span></td><td><span class="t">n</span></td><td>rèm cửa</td></tr></table></div>`,
 qs:[
  {n:"27",type:"fill",q:"You ______ love them or hate them.",accept:["either"],
   exp:`<h4>🧠 Câu 27 ➔ either</h4>
   <b>Dịch cả câu:</b> "Mèo có một tác động kỳ lạ lên con người. Bạn ______ yêu chúng hoặc ghét chúng."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Cấu trúc cố định <span class="p-grammar">either ... or ...</span> = hoặc... hoặc..., đưa ra 2 khả năng (yêu / ghét). "either love them or hate them".</li>
   <li><span class="hl-red">Tránh nhầm:</span> "neither ... nor" mang nghĩa <span class="hl-red">phủ định</span> (không... cũng không...), sai vì câu dùng "or".</li></ul>`},
  {n:"28",type:"fill",q:"...except for food and a comfortable sofa to sleep on. ______ feel the opposite.",accept:["others"],
   exp:`<h4>🧠 Câu 28 ➔ Others</h4>
   <b>Dịch cả câu:</b> "Một số người thích việc mèo độc lập... ______ thì cảm thấy ngược lại."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Cặp cấu trúc <span class="p-grammar">Some ... Others ...</span> = một số người... những người khác... (hai luồng ý kiến). "Others feel the opposite".</li>
   <li><span class="hl-red">Tránh nhầm:</span> "Another" (số ít) sai; "Other" phải đi kèm danh từ ("other people"), còn ở đây đứng một mình làm chủ ngữ nên dùng <span class="p-word">Others</span>.</li></ul>`},
  {n:"29",type:"fill",q:"...dogs show their happiness ______ people are around...",accept:["when"],
   exp:`<h4>🧠 Câu 29 ➔ when</h4>
   <b>Dịch cả câu:</b> "Một số người thích chó làm bạn hơn vì chó thể hiện niềm vui ______ có người ở bên và cũng khiến người ta thấy mình quan trọng."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Đây là <span class="p-grammar">câu điều kiện loại 0</span> (một sự thật luôn đúng) ➔ dùng <span class="p-word">when</span> (mỗi khi/khi mà) chứ không dùng "if".</li>
   <li><span class="hl-red">Tránh nhầm:</span> "if" hàm ý điều kiện <span class="hl-red">có thể không xảy ra</span>; ở đây là quy luật luôn đúng nên "when" chuẩn hơn.</li></ul>`},
  {n:"30",type:"fill",q:"But for the cat people, ______ find these beautiful small animals charming...",accept:["who"],
   exp:`<h4>🧠 Câu 30 ➔ who</h4>
   <b>Dịch cả câu:</b> "Nhưng với những người yêu mèo, ______ thấy những sinh vật nhỏ xinh này thật đáng yêu, đó thường là một mối quan hệ một chiều."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Cần <span class="p-grammar">đại từ quan hệ chỉ người</span> làm chủ ngữ cho mệnh đề, thay cho "the cat people" ➔ <span class="p-word">who</span>. "the cat people, who find...".</li>
   <li><span class="hl-red">Tránh nhầm:</span> "which" chỉ <span class="hl-red">vật</span>; "whose" chỉ <span class="hl-red">sở hữu</span>, đều không hợp.</li></ul>`},
  {n:"31",type:"fill",q:"...they won't eat if they do not like ______ is offered...",accept:["what"],
   exp:`<h4>🧠 Câu 31 ➔ what</h4>
   <b>Dịch cả câu:</b> "Chúng lười biếng, sẽ không ăn nếu không thích ______ được dọn ra, và sẽ để lại lông trên đồ đạc."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">what</span> = "cái mà" (gộp cả "the thing that"), làm tân ngữ cho "like". "like <span class="p-word">what</span> is offered" = thích thứ được dọn ra.</li>
   <li><span class="hl-red">Tránh nhầm:</span> "that/which" cần một <span class="hl-red">danh từ đứng trước</span> làm tiền ngữ; ở đây không có danh từ nào nên phải dùng "what".</li></ul>`},
  {n:"32",type:"fill",q:"And ______ you are really lucky, you may find an unlucky mouse left on the kitchen floor.",accept:["if"],
   exp:`<h4>🧠 Câu 32 ➔ if</h4>
   <b>Dịch cả câu:</b> "Và ______ bạn thật may mắn, bạn có thể tìm thấy một con chuột xấu số nằm trên sàn bếp."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">Câu điều kiện loại 1</span> (khả năng có thể xảy ra): If + hiện tại, ... may + V. "If you are really lucky, you may find...".</li>
   <li><span class="hl-red">Tránh nhầm:</span> "when" hàm ý việc <span class="hl-red">chắc chắn xảy ra</span>; ở đây chỉ là khả năng (may) nên dùng "if".</li></ul>`}
 ]
}
];

/* ===== ENGINE ===== */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    TOTAL++;
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    if(q.type==='fill'){
      const fin=document.createElement('div'); fin.className='fin';
      const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Gõ 1 từ...';
      const cb=document.createElement('button'); cb.className='checkbtn'; cb.textContent='Kiểm tra ✓';
      cb.onclick=()=>checkFill(inp,cb,card,qid,q.accept);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')cb.click();});
      fin.appendChild(inp); fin.appendChild(cb); card.appendChild(fin);
    } else {
      const box=document.createElement('div'); box.className='opts';
      shuffle(q.opts).forEach(o=>{
        const b=document.createElement('button'); b.className='opt'; b.type='button';
        b.textContent=o.en; b.dataset.val=o.en; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
      });
      card.appendChild(box);
    }
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#c8b6ff','#ffc09f','#9defe0','#a3c4ff','#ffb8e6','#fdffb6'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';t.style.display=open?'none':'block';btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function checkFill(inp,btn,card,qid,accept){
  if(qid in answered) return;
  const val=inp.value.trim().toLowerCase().replace(/[.,;:]/g,'');
  const ok=accept.includes(val); answered[qid]=ok;
  inp.disabled=true; btn.disabled=true;
  if(ok){inp.classList.add('correct');ding();confetti();}
  else{inp.classList.add('wrong');card.classList.add('shake');buzz();
    const hint=document.createElement('div');hint.style.marginTop='6px';hint.style.fontWeight='800';
    hint.innerHTML='✅ Đáp án đúng: <span class="hl-green">'+accept.join(' / ')+'</span>';
    card.querySelector('.fin').after(hint);
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms MS Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
