<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 7 · Comic English · Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --grape:#c8b6ff; --coral:#ffc09f; --aqua:#9defe0; --blue:#a3c4ff; --pink2:#ffb8e6; --lemon:#fdffb6;
  --ink:#241b3a;
  --p-word:#d1006f; --p-phon:#5f0f40; --p-mean:#0466c8; --p-gram:#6a00f4;
  --green:#2a9d8f; --red:#e5383b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#c8b6ff,#a3c4ff,#9defe0,#fdffb6,#ffb8e6);background-size:400% 400%;animation:bg 18s ease infinite;}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.28) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:48px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(18px,2.6vw,28px);margin:0;letter-spacing:1.5px;color:#fff;-webkit-text-stroke:1.8px var(--ink);text-shadow:2px 2px 0 var(--pink2),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:11px;margin-top:1px;display:inline-block;background:rgba(255,255,255,.6);border:1.5px solid var(--ink);border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(255,255,255,.3);border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(36,27,58,.25)}
.pane::-webkit-scrollbar{width:10px}.pane::-webkit-scrollbar-thumb{background:var(--grape);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;position:sticky;top:0;z-index:2;margin:0 -10px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--pink2),var(--aqua));border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;margin:18px 0 8px;color:var(--ink);background:var(--lemon);display:inline-block;padding:2px 14px;border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.rd{background:rgba(255,255,255,.5);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:3px 3px 0 rgba(36,27,58,.2)}
.rd .num{font-family:'Bangers',cursive;background:var(--aqua);border:2px solid var(--ink);border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-right:6px;box-shadow:2px 2px 0 var(--ink)}
.rd p{margin:6px 0;line-height:1.6}
.notice{font-style:italic;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:8px 10px;margin:6px 0}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--grape);color:var(--ink);font-weight:800;font-size:12px;border-radius:20px;padding:3px 12px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#fff0fa;border-left:5px solid var(--pink2);border-radius:8px;padding:8px 10px;font-size:14px;color:#5f0f40}
.resort{margin:8px 0;padding:8px 10px;background:rgba(255,255,255,.55);border:2px solid var(--ink);border-radius:12px}
.resort b{color:var(--p-mean)}
.gloss{margin:12px 0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 rgba(36,27,58,.2)}
.gloss .gh{font-family:'Bangers',cursive;font-size:19px;letter-spacing:1px;background:var(--coral);padding:6px 12px;border-bottom:2.5px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:rgba(255,255,255,.6)}
th,td{border:1.5px solid var(--ink);padding:5px 8px;text-align:left}
th{background:var(--blue);font-weight:800}
td .w{font-weight:800;color:var(--p-word)}td .t{color:var(--p-gram);font-weight:700}
.q{background:rgba(255,255,255,.55);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:5px 5px 0 rgba(36,27,58,.2)}
.q .qtxt{font-weight:800;margin-bottom:10px;display:flex;gap:8px;line-height:1.45}
.q .badge{font-family:'Bangers',cursive;background:var(--pink2);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:15px;background:rgba(255,255,255,.88);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--lemon)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf7;border:2.5px dashed var(--ink);border-radius:14px;padding:12px;font-size:14px;line-height:1.6}
.exp h4{margin:0 0 6px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:18px}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-phonetic{color:var(--p-phon);font-style:italic}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#efe4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(255,255,255,.42);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--blue),var(--grape));transition:width .3s}
.progtxt{font-weight:800;font-size:12px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#d1006f,#6a00f4);border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(36,27,58,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#fff0fa);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(36,27,58,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:46px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:32px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--lemon);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--blue);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){body{overflow:auto}.wrap{height:auto;min-height:100%}.split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}.float{font-size:36px}footer{position:sticky;bottom:0}}
</style>
</head>
<body>
<div id="bgart">
  <span class="float" style="left:6%;top:14%;animation-delay:0s">📦</span>
  <span class="float" style="left:82%;top:10%;animation-delay:1.2s">📺</span>
  <span class="float" style="left:14%;top:74%;animation-delay:2s">⚖️</span>
  <span class="float" style="left:74%;top:66%;animation-delay:.6s">🎬</span>
  <span class="float" style="left:46%;top:40%;animation-delay:1.8s">⭐</span>
  <span class="float" style="left:90%;top:44%;animation-delay:2.6s">📖</span>
</div>
<div class="wrap">
  <header>
    <h1>💫 TEST 7 · VOCAB + READING P1-3 💫</h1>
    <div class="sub">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên</div>
  </header>
  <div class="split">
    <div class="pane" id="leftPane"><div class="pane-title">📖 Bài đọc / Reading</div></div>
    <div class="pane" id="rightPane"><div class="pane-title">✏️ Bài tập / Exercises</div></div>
  </div>
  <footer>
    <span class="progtxt" id="ptxt">0/24</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <button class="submit" onclick="openSubmit()">🎯 NỘP BÀI</button>
  </footer>
</div>
<div class="overlay" id="nameOv"><div class="modal">
  <h2>🏆 Nhập tên để nộp bài</h2><input id="nameIn" placeholder="Tên học sinh...">
  <div class="err" id="nameErr"></div><button class="mbtn" onclick="grade()">Nộp bài ➜</button>
</div></div>
<div class="overlay" id="scoreOv"><div class="modal">
  <h2 id="hi"></h2><div class="score-big" id="scoreRaw"></div><div class="score-10" id="score10"></div>
  <div class="gifbox" id="gifbox"></div><div class="comment" id="comment"></div>
  <button class="mbtn" onclick="document.getElementById('scoreOv').style.display='none'">Đóng</button>
</div></div>

<script>
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"🔤 Vocabulary Development",
 left:`
  <div class="gloss"><div class="gh">📚 Từ khoá cần nhớ</div><table>
  <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
  <tr><td><span class="w">work placement</span></td><td><span class="t">n</span></td><td>kỳ thực tập</td></tr>
  <tr><td><span class="w">beyond</span></td><td><span class="t">adv</span></td><td>ở phía xa hơn, phía bên kia</td></tr>
  <tr><td><span class="w">transform</span></td><td><span class="t">v</span></td><td>biến đổi hoàn toàn</td></tr>
  <tr><td><span class="w">wealthy</span></td><td><span class="t">adj</span></td><td>giàu có</td></tr>
  <tr><td><span class="w">fond (of)</span></td><td><span class="t">adj</span></td><td>quý mến, thích</td></tr>
  <tr><td><span class="w">blame</span></td><td><span class="t">v</span></td><td>đổ lỗi, trách</td></tr>
  <tr><td><span class="w">frozen</span></td><td><span class="t">adj</span></td><td>đông lạnh</td></tr>
  <tr><td><span class="w">military</span></td><td><span class="t">adj</span></td><td>thuộc quân sự</td></tr>
  <tr><td><span class="w">guilty</span></td><td><span class="t">adj</span></td><td>tội lỗi, áy náy</td></tr></table></div>
  <div class="rd"><p><b>Exercise A & B:</b> Choose the correct word (A, B or C).<br>
  <b>Exercise C:</b> Word bank – <b>guilty</b> · challenging · <b>military</b> · violent · involved · <b>frozen</b> · tough</p></div>`,
 qs:[
  {n:"1",q:"My brother is a business student and he's now on ______ with a huge company.",
   opts:[opt("work placement","kỳ thực tập (n)"),opt("identity card","thẻ căn cước (n)"),opt("reality show","truyền hình thực tế (n)")],a:"work placement",
   exp:`<h4>🧠 Câu 1 ➔ work placement</h4>
   <b>Dịch cả câu:</b> "Anh trai tôi là sinh viên ngành kinh doanh và hiện đang ______ tại một công ty lớn."
   <ul>
   <li><span class="p-word">work placement</span> ➔ <span class="p-mean">kỳ thực tập (sinh viên đi làm để lấy kinh nghiệm) (n)</span></li>
   <li><span class="p-word">identity card</span> ➔ <span class="p-mean">thẻ căn cước (n)</span></li>
   <li><span class="p-word">reality show</span> ➔ <span class="p-mean">chương trình truyền hình thực tế (n)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">on work placement with a company</span> = đang thực tập tại công ty; hợp với "business student".<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">identity card</span> là một tấm thẻ (không "on... with a company"); <span class="p-word">reality show</span> là chương trình TV, <span class="hl-red">không liên quan</span> việc sinh viên đi làm.`},
  {n:"2",q:"...We saw the whole village and the woods ______ .",
   opts:[opt("beyond","ở phía xa (adv)"),opt("emotionally","một cách xúc động (adv)"),opt("occasionally","thỉnh thoảng (adv)")],a:"beyond",
   exp:`<h4>🧠 Câu 2 ➔ beyond</h4>
   <b>Dịch cả câu:</b> "Chủ nhật tuần trước, chúng tôi lên đỉnh núi, nơi khung cảnh thật tuyệt vời. Chúng tôi nhìn thấy cả ngôi làng và những cánh rừng ______ ."
   <ul>
   <li><span class="p-word">beyond</span> ➔ <span class="p-mean">ở phía bên kia, xa hơn (adv)</span></li>
   <li><span class="p-word">emotionally</span> ➔ <span class="p-mean">một cách xúc động (adv)</span></li>
   <li><span class="p-word">occasionally</span> ➔ <span class="p-mean">thỉnh thoảng (adv)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> "the woods <span class="p-word">beyond</span>" = những cánh rừng ở phía xa hơn; hợp cảnh nhìn từ đỉnh núi ra xa.<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">emotionally</span> (một cách xúc động) không tả vị trí; <span class="p-word">occasionally</span> (thỉnh thoảng) là trạng từ chỉ tần suất, <span class="hl-red">không hợp ngữ cảnh không gian</span>.`},
  {n:"3",q:"They ______ the field into a beautiful park.",
   opts:[opt("transformed","biến đổi (v)"),opt("irritated","làm khó chịu (v)"),opt("survived","sống sót (v)")],a:"transformed",
   exp:`<h4>🧠 Câu 3 ➔ transformed</h4>
   <b>Dịch cả câu:</b> "Họ đã ______ cánh đồng thành một công viên xinh đẹp."
   <ul>
   <li><span class="p-word">transformed</span> ➔ <span class="p-mean">biến đổi hoàn toàn (v)</span></li>
   <li><span class="p-word">irritated</span> ➔ <span class="p-mean">làm khó chịu, chọc tức (v)</span></li>
   <li><span class="p-word">survived</span> ➔ <span class="p-mean">sống sót (v)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">transform sth into sth</span> = biến đổi cái gì thành cái gì. "transformed the field into a park".<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">irritate</span> (chọc tức) dùng cho người; <span class="p-word">survive</span> (sống sót) <span class="hl-red">không đi với "into a park"</span>.`},
  {n:"4",q:"Adam is a very ______ man. He even has his own helicopter.",
   opts:[opt("wealthy","giàu có (adj)"),opt("previous","trước đó (adj)"),opt("involved","có liên quan (adj)")],a:"wealthy",
   exp:`<h4>🧠 Câu 4 ➔ wealthy</h4>
   <b>Dịch cả câu:</b> "Adam là một người rất ______. Anh ấy thậm chí còn có cả trực thăng riêng."
   <ul>
   <li><span class="p-word">wealthy</span> ➔ <span class="p-mean">giàu có (adj)</span></li>
   <li><span class="p-word">previous</span> ➔ <span class="p-mean">trước đó (adj)</span></li>
   <li><span class="p-word">involved</span> ➔ <span class="p-mean">có liên quan, dính líu (adj)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Có <span class="p-word">trực thăng riêng</span> ➔ rất <span class="p-word">wealthy</span> (giàu có).<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">previous</span> (trước đó) chỉ thứ tự thời gian; <span class="p-word">involved</span> (dính líu) <span class="hl-red">không tả sự giàu có</span>.`},
  {n:"5",q:"I used to be ______ of him when I was a teenager.",
   opts:[opt("fond","quý mến (adj)"),opt("refreshed","sảng khoái (adj)"),opt("suitable","phù hợp (adj)")],a:"fond",
   exp:`<h4>🧠 Câu 5 ➔ fond</h4>
   <b>Dịch cả câu:</b> "Tôi từng rất ______ anh ấy khi còn là thiếu niên."
   <ul>
   <li><span class="p-word">fond</span> ➔ <span class="p-mean">quý mến, thích (adj)</span></li>
   <li><span class="p-word">refreshed</span> ➔ <span class="p-mean">sảng khoái, đỡ mệt (adj)</span></li>
   <li><span class="p-word">suitable</span> ➔ <span class="p-mean">phù hợp (adj)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Cụm cố định <span class="p-grammar">be fond of sb</span> = quý mến/thích ai. "used to be fond of him".<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">refreshed</span> (sảng khoái) và <span class="p-word">suitable</span> (phù hợp) <span class="hl-red">không đi với giới từ "of"</span> theo nghĩa này ("suitable for").`},
  {n:"6",q:"I started disliking him when he ______ me for something that I hadn't done.",
   opts:[opt("blamed","đổ lỗi (v)"),opt("faced","đối mặt (v)"),opt("misbehaved","cư xử hư (v)")],a:"blamed",
   exp:`<h4>🧠 Câu 6 ➔ blamed</h4>
   <b>Dịch cả câu:</b> "Tôi bắt đầu ghét anh ta khi anh ta ______ tôi vì một việc mà tôi không hề làm."
   <ul>
   <li><span class="p-word">blamed</span> ➔ <span class="p-mean">đổ lỗi, quy trách (v)</span></li>
   <li><span class="p-word">faced</span> ➔ <span class="p-mean">đối mặt (v)</span></li>
   <li><span class="p-word">misbehaved</span> ➔ <span class="p-mean">cư xử hư (v)</span></li></ul>

{
 title:"📺 Reading · Part 2",
 left:`
 <div class="rd"><p><b>PART 2 (Q6–10):</b> People want to watch something on TV tonight. Match each person to the most suitable programme.</p></div>
 <div class="resort"><b>A. Drumline</b> (6pm) — A tough kid finds himself in a new school where he joins the military marching band. An excellent teen movie with some great drumming scenes. Can he work in a team instead of being a loner?
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Một cậu bé bướng bỉnh vào trường mới và gia nhập ban nhạc diễu hành quân đội. Một phim tuổi teen tuyệt vời với nhiều cảnh chơi trống hay. Liệu cậu có học được cách làm việc nhóm thay vì cô độc?</div></div>
 <div class="resort"><b>B. Journey of Life</b> (9pm) — Steve Leonard leads this five-part exploration of nature, with lots of great images: flying fish, sharks, coral, baby turtles and a sea cucumber defending itself.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Steve Leonard dẫn dắt loạt phim 5 phần khám phá thiên nhiên, với nhiều hình ảnh đẹp: cá bay, cá mập, san hô, rùa con và một con hải sâm tự vệ.</div></div>
 <div class="resort"><b>C. Horizon</b> (9pm) — Documentary examining the rise and fall of the Moche people who ruled the northern coast of Peru. New evidence lets scientists understand what happened to one of the greatest civilisations of the ancient world.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Phim tài liệu xem xét sự trỗi dậy và suy tàn của người Moche từng cai trị bờ biển phía bắc Peru. Bằng chứng mới giúp các nhà khoa học hiểu điều gì đã xảy ra với một trong những nền văn minh vĩ đại nhất thời cổ đại.</div></div>
 <div class="resort"><b>D. Murder One</b> (9pm) — A great crime show following a single murder case. The main character is LA's top lawyer, hired to help a millionaire when he is involved in a murder investigation. Talented Hollywood actors, lots of action and great mystery.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Một phim hình sự hay theo dõi một vụ án mạng. Nhân vật chính là luật sư hàng đầu ở LA, được thuê giúp một triệu phú dính vào một cuộc điều tra giết người. Diễn viên Hollywood tài năng, nhiều hành động và bí ẩn hấp dẫn.</div></div>
 <div class="resort"><b>E. Masterchef Goes Large</b> (6.30pm) — Contestants create a new recipe in 30 minutes; the three best are sent to a London kitchen to prepare simple Italian meals. Their final challenge decides who goes through to Friday's quarter-final.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Các thí sinh sáng tạo món mới trong 30 phút; ba người xuất sắc nhất được đưa tới một bếp ở London để nấu món Ý đơn giản. Thử thách cuối quyết định ai vào tứ kết ngày thứ Sáu.</div></div>
 <div class="resort"><b>F. A Dream Home Abroad</b> (8pm) — George Clarke follows a wealthy north London couple as they transform a 200-year-old farmhouse in Piedmont, Italy, into the house of their dreams, trusting the builders to do the job.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">George Clarke theo chân một cặp đôi giàu có ở bắc London khi họ cải tạo một trang trại 200 năm tuổi ở Piedmont, Ý thành ngôi nhà mơ ước, tin tưởng giao cho thợ xây thực hiện.</div></div>
 <div class="resort"><b>G. Faith</b> (9pm) — William Ivory's story of love and heartbreak, set during the miners' strike of 1984-1985. This conflict forces two sisters and their husbands to think about their relationships before their lives change forever.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Câu chuyện tình yêu và tan vỡ của William Ivory, đặt trong bối cảnh cuộc đình công thợ mỏ 1984-1985. Xung đột này buộc hai chị em và chồng họ phải nhìn lại các mối quan hệ trước khi cuộc đời thay đổi mãi mãi.</div></div>
 <div class="resort"><b>H. Dispatches</b> (9pm) — An investigation into the working lives of traffic wardens, with hidden cameras revealing the abuse they face daily from angry, violent motorists. It also explains how they make sure people who break parking laws get a suitable punishment.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Một cuộc điều tra về đời sống công việc của nhân viên bãi đỗ xe, với camera ẩn ghi lại sự lăng mạ họ phải chịu hằng ngày từ những tài xế giận dữ, hung hăng. Chương trình cũng giải thích cách họ xử phạt phù hợp người vi phạm luật đỗ xe.</div></div>

 title:"⚖️ Reading · Part 3",
 left:`
 <div class="rd"><p><b>PART 3 (Q11–15):</b> Fight for what is right — <i>by Ted Williams</i></p></div>
 <div class="rd">
   <p>I've always enjoyed being with other people and I suppose I've always had a strong opinion about what is wrong and what is right, ever since I was a very young child. That used to irritate my brothers and sisters because I would always tell our parents if they did something wrong. I remember they had secrets that they wouldn't share with me and I probably missed out on a lot because of that. Not that I blame them.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Tôi luôn thích ở bên mọi người và tôi nghĩ mình luôn có quan điểm rõ ràng về đúng và sai, ngay từ khi còn rất nhỏ. Điều đó từng khiến anh chị em tôi khó chịu vì tôi luôn mách bố mẹ mỗi khi họ làm gì sai. Tôi nhớ họ có những bí mật không chia sẻ với tôi và có lẽ vì thế tôi đã bỏ lỡ nhiều thứ. Nhưng tôi không trách họ.</div></div>
 <div class="rd">
   <p>When I finished school, I actually studied history at university and then, in my final year, I had a work placement in a lawyer's office. I was fascinated from day one and, as soon as I graduated, I applied to do a degree in law. I don't know why I hadn't thought of this earlier, but I was certain I would love to be a judge one day.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Khi học xong phổ thông, tôi thực ra đã học ngành lịch sử ở đại học, rồi vào năm cuối tôi có một kỳ thực tập ở văn phòng luật sư. Tôi bị cuốn hút ngay từ ngày đầu, và ngay khi tốt nghiệp, tôi nộp đơn học lấy bằng luật. Tôi không hiểu sao mình không nghĩ tới điều này sớm hơn, nhưng tôi chắc chắn một ngày nào đó mình sẽ rất thích được làm thẩm phán.</div></div>
 <div class="rd">
   <p>Several years have gone by and I am still very fond of my job. I'm keen on fighting for justice, no matter what kind of case it is. Being a judge is not an easy profession, I must admit.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Nhiều năm đã trôi qua và tôi vẫn rất yêu công việc của mình. Tôi hăng hái đấu tranh cho công lý, dù đó là loại vụ án nào. Phải thừa nhận rằng làm thẩm phán không phải nghề dễ dàng.</div></div>
 <div class="rd">
   <p>It can be really challenging at times not to get emotionally involved. In most cases it helps if you just follow your head and not your heart when you can't make up your mind. The working hours are quite long and not all judges earn a lot of money. But for me, choosing an occupation was never about the financial aspect.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Đôi khi thực sự khó để không bị cuốn vào cảm xúc. Trong hầu hết trường hợp, sẽ tốt hơn nếu bạn nghe theo lý trí chứ không theo con tim khi chưa quyết định được. Giờ làm việc khá dài và không phải thẩm phán nào cũng kiếm được nhiều tiền. Nhưng với tôi, chọn một nghề chưa bao giờ là vì khía cạnh tiền bạc.</div></div>
 <div class="rd">
   <p>When a court case is finished and I am confident that I have made the right decision, I am relieved. Knowing that people guilty of crimes will end up in prison and society will be a bit safer tomorrow could not make me any happier. However, I make it a personal rule not to take my work home with me. Once I leave the court, I switch off and concentrate on my family. They will always be my number one priority. When I'm at home, I'm no longer a judge; I'm a husband and a dad and that sometimes takes even more work.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Khi một vụ án kết thúc và tôi tự tin mình đã ra quyết định đúng, tôi thấy nhẹ nhõm. Biết rằng những kẻ phạm tội sẽ vào tù và ngày mai xã hội sẽ an toàn hơn một chút khiến tôi không thể vui hơn được nữa. Tuy nhiên, tôi đặt cho mình một quy tắc riêng là không mang công việc về nhà. Khi rời khỏi toà, tôi "tắt" mọi thứ và tập trung cho gia đình. Họ luôn là ưu tiên số một của tôi. Khi ở nhà, tôi không còn là thẩm phán; tôi là một người chồng, người cha, và đôi khi việc đó còn vất vả hơn cả.</div></div>

   <li>Leave all his work problems at the court. ➔ <span class="p-mean">Để lại mọi vấn đề công việc ở toà.</span></li>
   <li>Finish off any work that he has at home. ➔ <span class="p-mean">Làm nốt việc còn tồn ở nhà.</span></li>
   <li>Tell his family all about his working day. ➔ <span class="p-mean">Kể cho gia đình nghe về ngày làm việc.</span></li>
   <li>Stop spending time with his family. ➔ <span class="p-mean">Ngừng dành thời gian cho gia đình.</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Dẫn chứng: "I make it a personal rule <span class="p-word">not to take my work home with me. Once I leave the court, I switch off</span>" ➔ để lại công việc ở toà.<br>
   <span class="hl-red">Tại sao sai:</span> Ngược lại, anh <span class="hl-red">không mang việc về nhà</span>; không nói kể chuyện công việc; ở nhà anh <span class="hl-red">tập trung cho gia đình</span> (ưu tiên số một).`},
  {n:"15",q:"What would Ted say if someone asked him to describe himself?",
   opts:[opt("\"I care deeply about both my family and work and I try to keep them separated.\"","\"Tôi quan tâm sâu sắc cả gia đình lẫn công việc và cố giữ chúng tách bạch.\""),
         opt("\"I am a strict family man who does not easily take no for an answer.\"","\"Tôi là người của gia đình nghiêm khắc, khó chấp nhận bị từ chối.\""),
         opt("\"Unfortunately I tend to put work before family most of the times.\"","\"Tiếc là tôi thường đặt công việc trước gia đình.\""),
         opt("\"I am proud to be a judge that everyone fears.\"","\"Tôi tự hào là một thẩm phán mà ai cũng sợ.\"")],a:"\"I care deeply about both my family and work and I try to keep them separated.\"",
   exp:`<h4>🧠 Câu 15 ➔ C</h4>
   <b>Dịch đề:</b> "Ted sẽ nói gì nếu ai đó nhờ mô tả bản thân?"
   <ul>
   <li>"I care deeply about both my family and work and I try to keep them separated." ➔ <span class="p-mean">"Tôi quan tâm sâu sắc cả gia đình lẫn công việc và cố giữ chúng tách bạch."</span></li>
   <li>"I am a strict family man who does not easily take no for an answer." ➔ <span class="p-mean">"Tôi là người gia trưởng nghiêm khắc, khó chấp nhận bị từ chối."</span></li>
   <li>"Unfortunately I tend to put work before family most of the times." ➔ <span class="p-mean">"Tiếc là tôi thường đặt công việc trước gia đình."</span></li>
   <li>"I am proud to be a judge that everyone fears." ➔ <span class="p-mean">"Tôi tự hào là thẩm phán mà ai cũng sợ."</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Anh yêu công việc nhưng "<span class="p-word">not to take my work home... concentrate on my family... number one priority</span>" ➔ coi trọng <span class="p-word">cả hai</span> và giữ chúng <span class="p-word">tách bạch</span>.<br>
   <span class="hl-red">Tại sao sai:</span> Không có ý "gia trưởng/khó bị từ chối"; ngược lại, gia đình là <span class="hl-red">ưu tiên số một</span> (không đặt công việc trước); và anh không hề muốn người khác <span class="hl-red">sợ mình</span>.`}
 ]
}
];

/* ===== ENGINE ===== */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    TOTAL++;
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    const box=document.createElement('div'); box.className='opts';
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.textContent=o.en; b.dataset.val=o.en; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
    });
    card.appendChild(box);
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#c8b6ff','#ffc09f','#9defe0','#a3c4ff','#ffb8e6','#fdffb6'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';t.style.display=open?'none':'block';btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms MS Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
</body>
</html>
