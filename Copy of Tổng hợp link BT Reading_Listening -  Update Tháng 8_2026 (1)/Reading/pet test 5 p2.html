<style>
:root{
  --pink:#ffb3d1; --peach:#ffd6a5; --mint:#a8f0d1; --sky:#a5d8ff; --lav:#d0bfff; --yellow:#fff3b0;
  --ink:#22223b;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#ffb3d1,#a5d8ff,#a8f0d1,#fff3b0,#d0bfff);

@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.25) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:48px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(18px,2.6vw,28px);margin:0;letter-spacing:1.5px;
  color:#fff;-webkit-text-stroke:1.8px var(--ink);text-shadow:2px 2px 0 var(--pink),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:11px;margin-top:1px;display:inline-block;background:rgba(255,255,255,.55);
  border:1.5px solid var(--ink);border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(255,255,255,.28);
  border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(34,34,59,.25)}
.pane::-webkit-scrollbar{width:10px}
.pane::-webkit-scrollbar-thumb{background:var(--lav);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;position:sticky;top:0;z-index:2;
  margin:0 -10px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--pink),var(--sky));
  border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;margin:18px 0 8px;color:var(--ink);

.rd{background:rgba(255,255,255,.45);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0;
  box-shadow:3px 3px 0 rgba(34,34,59,.2)}
.rd p{margin:6px 0;line-height:1.6}
.gap{font-family:'Bangers',cursive;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;
  padding:0 8px;margin:0 2px}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--lav);color:var(--ink);font-weight:800;font-size:12px;
  border-radius:20px;padding:3px 12px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#fff0f6;border-left:5px solid var(--pink);border-radius:8px;
  padding:8px 10px;font-size:14px;color:#5f0f40}
.optbank{background:rgba(255,255,255,.5);border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:14px}
.optbank b{color:var(--p-mean)}
.gloss{margin:12px 0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 rgba(34,34,59,.2)}
.gloss .gh{font-family:'Bangers',cursive;font-size:19px;letter-spacing:1px;background:var(--peach);padding:6px 12px;border-bottom:2.5px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:rgba(255,255,255,.55)}
th,td{border:1.5px solid var(--ink);padding:5px 8px;text-align:left}
th{background:var(--sky);font-weight:800}
td .w{font-weight:800;color:var(--p-word)}
td .t{color:var(--p-gram);font-weight:700}
.q{background:rgba(255,255,255,.5);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:5px 5px 0 rgba(34,34,59,.2)}
.q .qtxt{font-weight:800;margin-bottom:10px;display:flex;gap:8px;line-height:1.45}
.q .badge{font-family:'Bangers',cursive;background:var(--pink);border:2.5px solid var(--ink);color:#fff;
  -webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:34px;height:34px;display:inline-flex;
  align-items:center;justify-content:center;font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:15px;background:rgba(255,255,255,.85);
  border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--yellow)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
.fin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fin input{font-family:'Nunito';font-weight:700;font-size:15px;padding:9px 12px;border:2.5px solid var(--ink);
  border-radius:12px;box-shadow:3px 3px 0 var(--ink);min-width:150px}
.fin input.correct{background:#8ce99a;border-color:#2b8a3e}
.fin input.wrong{background:#ffa8a8;border-color:#c92a2a}
.checkbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:.5px;color:#fff;
  -webkit-text-stroke:.5px var(--ink);background:var(--green);border:2.5px solid var(--ink);border-radius:12px;
  padding:7px 16px;box-shadow:3px 3px 0 var(--ink)}
.checkbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf5;border:2.5px dashed var(--ink);border-radius:14px;padding:12px;font-size:14px;line-height:1.6}
.exp h4{margin:0 0 6px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:18px}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-phonetic{color:var(--p-phon);font-style:italic}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#f3e8ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(255,255,255,.4);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky),var(--lav));transition:width .3s}
.progtxt{font-weight:800;font-size:12px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);
  background:linear-gradient(90deg,#ff6b9d,#ff9e6b);border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(34,34,59,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#fff0f6);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(34,34,59,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:46px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:32px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--yellow);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--sky);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){
  body{overflow:auto}.wrap{height:auto;min-height:100%}
  .split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}
  .float{font-size:36px}footer{position:sticky;bottom:0}
}
</style>

<script>
/* ================= DATA ================= */
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"⚠️ Reading · Part 4 — Dangerous Fun",
 left:`
 <div class="rd"><p><b>PART 4 (Q16–20):</b> Five sentences have been removed. Choose the correct sentence for each gap. There are three extra sentences you do not need.</p></div>
 <div class="rd"><b>Dangerous Fun</b>
 <p>When we think about dangerous and extreme sports, bungee jumping or sky diving comes to mind. But did you know that there are several festivals or events that take place around the world where people risk serious injury or even death?</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Khi nghĩ về thể thao nguy hiểm và mạo hiểm, ta nghĩ ngay tới nhảy bungee hay nhảy dù. Nhưng bạn có biết trên thế giới có nhiều lễ hội/sự kiện nơi người ta liều bị thương nặng hoặc thậm chí tử vong không?</div>
 <p>The custom of cheese rolling in the UK is only one of them. It is actually so unsafe that many think it should be banned. <span class="gap">16</span> This event takes place on a grassy hill which is too steep for a person to walk down standing up. Competitors run after a round, five-kilo English cheese, going at speed down this hill. The cheese, which is given a one-second head start on the runners, may go as fast as one hundred and twelve kilometres an hour. <span class="gap">17</span> However, it is the competitors who are in the most danger as they fall down running after the cheese. As you can imagine, there are broken bones and other injuries by the time this event has finished. <span class="gap">18</span> However, very few do, which means the winner is the first person to reach the bottom, broken bones or not.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Tục lăn phô mai ở Anh chỉ là một trong số đó. Nó nguy hiểm đến mức nhiều người cho rằng nên bị cấm. (16) Sự kiện diễn ra trên một ngọn đồi cỏ quá dốc đến mức không thể đi bộ xuống khi đứng thẳng. Người thi chạy đuổi theo một khối phô MS Chí Nênh tròn nặng 5 kg lao xuống đồi. Khối phô mai được cho xuất phát trước 1 giây và có thể lao nhanh tới 112 km/h. (17) Tuy nhiên, chính người thi mới nguy hiểm nhất khi họ ngã trong lúc chạy đuổi phô mai. Có gãy xương và nhiều chấn thương khi sự kiện kết thúc. (18) Tuy nhiên, rất ít người làm được, nghĩa là người thắng là người đầu tiên xuống tới chân đồi, dù gãy xương hay không.</div>
 <p>And if you thought this was mad enough, go to Greece, where at the village of Vrontados people have an unusual, but extremely dangerous custom. Two competing churches have an annual war. <span class="gap">19</span> This attack does not happen while the churches are empty, but while services are being held, so both churches are full. <span class="gap">20</span> This is why this extreme tradition is also very dangerous. Nobody is sure exactly how it got started but, whatever the history, if you feel like risking your life, these two unusual extreme customs are a good way to start.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Và nếu bạn nghĩ thế đã đủ điên, hãy tới Hy Lạp, nơi ở làng Vrontados người ta có một tục lệ khác thường nhưng cực kỳ nguy hiểm. Hai nhà thờ đối địch tổ chức một "cuộc chiến" hằng năm. (19) Cuộc tấn công không diễn ra khi nhà thờ trống, mà khi đang có lễ, nên cả hai nhà thờ đều đông người. (20) Đó là lý do truyền thống mạo hiểm này cũng rất nguy hiểm. Không ai chắc nó bắt đầu thế nào, nhưng dù lịch sử ra sao, nếu bạn muốn liều mạng, hai tục lệ khác thường này là cách khởi đầu tốt.</div>
 </div>
 <div class="optbank"><b>Ngân hàng câu (A–H):</b><br>
 A. They fire up to 60,000 small rockets at each other's bell towers.<br>
 B. They are situated on opposite hills.<br>
 C. This is hardly surprising.<br>
 D. Everyone is aiming to catch the cheese.<br>
 E. Although the light show in the night sky is amazing, some of the rockets go off course.<br>
 F. The cheese is a particular local type.<br>
 G. This obviously is dangerous for anybody watching, too.<br>
 H. No competitors could, at such a speed, hurt themselves.</div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">custom</span></td><td><span class="t">n</span></td><td>phong tục, tục lệ</td></tr>
 <tr><td><span class="w">banned</span></td><td><span class="t">adj/v</span></td><td>bị cấm</td></tr>
 <tr><td><span class="w">steep</span></td><td><span class="t">adj</span></td><td>dốc đứng</td></tr>
 <tr><td><span class="w">competitor</span></td><td><span class="t">n</span></td><td>người dự thi</td></tr>
 <tr><td><span class="w">head start</span></td><td><span class="t">n</span></td><td>sự xuất phát trước</td></tr>
 <tr><td><span class="w">injury</span></td><td><span class="t">n</span></td><td>chấn thương</td></tr>
 <tr><td><span class="w">annual</span></td><td><span class="t">adj</span></td><td>hằng năm</td></tr>
 <tr><td><span class="w">extreme</span></td><td><span class="t">adj</span></td><td>cực đoan, mạo hiểm</td></tr>
 <tr><td><span class="w">go off course</span></td><td><span class="t">v</span></td><td>đi chệch hướng</td></tr>
 <tr><td><span class="w">bell tower</span></td><td><span class="t">n</span></td><td>tháp chuông</td></tr>
 <tr><td><span class="w">tradition</span></td><td><span class="t">n</span></td><td>truyền thống</td></tr>
 <tr><td><span class="w">risk</span></td><td><span class="t">v</span></td><td>liều, mạo hiểm</td></tr></table></div>`,
 qs:[
  {n:"16",q:"Choose the sentence for gap 16.",
   opts:[opt("This is hardly surprising."),opt("The cheese is a particular local type."),opt("No competitors could, at such a speed, hurt themselves."),opt("They are situated on opposite hills.")],
   a:"This is hardly surprising.",
   exp:`<h4>🧠 Câu 16 ➔ C</h4>
   <b>Dịch đề:</b> Điền câu hợp lý vào chỗ trống 16.<br>
   <b>Câu đúng:</b> "This is hardly surprising." ➔ <span class="p-mean">Điều này chẳng có gì đáng ngạc nhiên.</span>
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Câu trước nói "so unsafe that many think it should be <span class="p-word">banned</span>" (nguy hiểm đến mức nên bị cấm). "This is <span class="p-word">hardly surprising</span>" (chẳng lạ gì) nối mượt, rồi câu sau giải thích lý do: đồi <span class="p-word">too steep</span> (quá dốc).</li>
   <li><span class="hl-red">Tại sao sai:</span> "The cheese is a particular local type" (F) <span class="hl-red">lạc mạch</span>, không nối với ý "bị cấm"; "No competitors could... at such a speed" (H) nhắc <span class="hl-red">tốc độ chưa xuất hiện</span> ở đây; "They are situated on opposite hills" (B) dùng <span class="p-grammar">"They"</span> cần <span class="hl-red">chủ ngữ số nhiều</span> (là 2 nhà thờ, thuộc đoạn Hy Lạp).</li></ul>`},
  {n:"17",q:"Choose the sentence for gap 17.",
   opts:[opt("This obviously is dangerous for anybody watching, too."),opt("No competitors could, at such a speed, hurt themselves."),opt("Everyone is aiming to catch the cheese."),opt("The cheese is a particular local type.")],
   a:"This obviously is dangerous for anybody watching, too.",
   exp:`<h4>🧠 Câu 17 ➔ G</h4>
   <b>Dịch đề:</b> Điền câu hợp lý vào chỗ trống 17.<br>
   <b>Câu đúng:</b> "This obviously is dangerous for anybody watching, too." ➔ <span class="p-mean">Điều này rõ ràng cũng nguy hiểm cho bất kỳ ai đứng xem.</span>
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Câu trước nói phô mai lao <span class="p-word">112 km/h</span> ➔ nguy hiểm cho <span class="p-word">người xem</span> "too". Câu sau dùng <span class="p-grammar">"However"</span> để tương phản: người thi mới nguy hiểm <span class="p-word">nhất</span>. Cặp "too ... most" khớp logic.</li>

 title:"🏜️ Reading · Part 6 — Namibia (Gõ đáp án)",
 left:`
 <div class="rd"><p><b>PART 6 (Q27–32):</b> Write <b>ONE word</b> for each gap. (Gõ 1 từ vào mỗi ô)</p></div>
 <div class="rd"><b>Namibia</b>
 <p>Namibia is in Southern Western Africa. It's a country of desert and sand, with a long coast on the South Atlantic Ocean. The Namib Desert, which, at 80 million years old, is the <span class="gap">27</span> ancient desert on the whole planet, is also home to the highest sand hill in the world, known <span class="gap">28</span> a dune.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Namibia nằm ở Tây Nam châu Phi. Đây là đất nước của sa mạc và cát, với bờ biển dài trên Nam Đại Tây Dương. Sa mạc Namib, với 80 triệu năm tuổi, là sa mạc cổ (27) nhất trên hành tinh, cũng là nơi có đồi cát cao nhất thế giới, được gọi (28) một cồn cát.</div>
 <p>The name 'Namib' translates as 'vast place', or in <span class="gap">29</span> words, a huge area. This is an accurate description of this desert region <span class="gap">30</span> is one of the least crowded places on the planet. Only Greenland, the Falkland Islands, Mongolia and the Western Sahara have fewer people for <span class="gap">31</span> square kilometre.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Cái tên 'Namib' dịch là 'nơi rộng lớn', hay nói (29) cách khác, một vùng rộng lớn. Đây là mô tả chính xác về vùng sa mạc này, (30) là một trong những nơi thưa dân nhất hành tinh. Chỉ Greenland, quần đảo Falkland, Mông Cổ và Tây Sahara có ít người hơn trên (31) mỗi ki-lô-mét vuông.</div>
 <p>And in this huge empty area of Southern Africa lives the fastest land animal on the planet, the cheetah. As home to the world's largest population of wild and completely free cheetahs, it is hardly surprising <span class="gap">32</span> Namibia is turning into a popular tourist destination.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Và trong vùng rộng lớn hoang vắng này của Nam Phi sống loài thú chạy nhanh nhất hành tinh — báo cheetah. Là nơi có quần thể báo hoang dã và hoàn toàn tự do lớn nhất thế giới, chẳng có gì lạ (32) Namibia đang trở thành điểm du lịch nổi tiếng.</div></div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">desert</span></td><td><span class="t">n</span></td><td>sa mạc</td></tr>
 <tr><td><span class="w">coast</span></td><td><span class="t">n</span></td><td>bờ biển</td></tr>
 <tr><td><span class="w">ancient</span></td><td><span class="t">adj</span></td><td>cổ xưa</td></tr>
 <tr><td><span class="w">dune</span></td><td><span class="t">n</span></td><td>cồn cát</td></tr>
 <tr><td><span class="w">vast</span></td><td><span class="t">adj</span></td><td>rộng lớn</td></tr>
 <tr><td><span class="w">translate</span></td><td><span class="t">v</span></td><td>dịch, có nghĩa là</td></tr>
 <tr><td><span class="w">crowded</span></td><td><span class="t">adj</span></td><td>đông đúc</td></tr>
 <tr><td><span class="w">population</span></td><td><span class="t">n</span></td><td>quần thể, dân số</td></tr>
 <tr><td><span class="w">surprising</span></td><td><span class="t">adj</span></td><td>đáng ngạc nhiên</td></tr>
 <tr><td><span class="w">destination</span></td><td><span class="t">n</span></td><td>điểm đến</td></tr>
 <tr><td><span class="w">region</span></td><td><span class="t">n</span></td><td>vùng, khu vực</td></tr></table></div>`,
 qs:[
  {n:"27",type:"fill",q:"...is the ______ ancient desert on the whole planet",accept:["most"],
   exp:`<h4>🧠 Câu 27 ➔ most</h4>
   <b>Dịch đề:</b> "...là sa mạc cổ ______ trên toàn hành tinh."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Có <span class="p-word">the</span> + tính từ dài "ancient" ➔ dạng <span class="p-grammar">so sánh nhất: the most + adj</span> = "the most ancient" (cổ nhất). Cụm "on the whole planet" xác nhận so sánh nhất.</li>
   <li><span class="hl-red">Tránh nhầm:</span> không viết "oldest" (vì đề chừa trống trước "ancient", cần <span class="hl-red">một từ bổ nghĩa cho "ancient"</span>).</li></ul>`},
  {n:"28",type:"fill",q:"...the highest sand hill in the world, known ______ a dune",accept:["as"],
   exp:`<h4>🧠 Câu 28 ➔ as</h4>
   <b>Dịch đề:</b> "...đồi cát cao nhất thế giới, được gọi ______ một cồn cát."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Cụm cố định <span class="p-grammar">known as = được biết đến / được gọi là</span>.</li>
   <li><span class="hl-red">Tránh nhầm:</span> "known to" nghĩa "được ai đó biết tới" – <span class="hl-red">sai ngữ cảnh gọi tên</span>.</li></ul>`},
  {n:"29",type:"fill",q:"...or in ______ words, a huge area",accept:["other"],
   exp:`<h4>🧠 Câu 29 ➔ other</h4>
   <b>Dịch đề:</b> "...hay nói ______ cách khác, một vùng rộng lớn."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Thành ngữ nối câu <span class="p-grammar">in other words = nói cách khác</span> (dùng để diễn giải lại).</li>
   <li><span class="hl-red">Tránh nhầm:</span> "in another word" <span class="hl-red">sai</span> (thành ngữ luôn số nhiều "words" + "other").</li></ul>`},
  {n:"30",type:"fill",q:"...this desert region ______ is one of the least crowded places",accept:["which","that"],
   exp:`<h4>🧠 Câu 30 ➔ which (hoặc that)</h4>
   <b>Dịch đề:</b> "...vùng sa mạc này, ______ là một trong những nơi thưa dân nhất."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Cần <span class="p-grammar">đại từ quan hệ cho vật (which/that)</span> làm chủ ngữ cho mệnh đề "is one of the least crowded places", thay cho "this desert region".</li>
   <li><span class="hl-red">Tránh nhầm:</span> "who" chỉ dùng cho <span class="hl-red">người</span>; "where" cần theo sau là <span class="hl-red">mệnh đề đủ chủ–vị</span>, không phù hợp ở đây.</li></ul>`},
  {n:"31",type:"fill",q:"...have fewer people for ______ square kilometre",accept:["each","every"],
   exp:`<h4>🧠 Câu 31 ➔ each (hoặc every)</h4>
   <b>Dịch đề:</b> "...có ít người hơn trên ______ ki-lô-mét vuông."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> "square kilometre" là <span class="p-grammar">danh từ đếm được số ít</span> ➔ cần <span class="p-word">each/every</span> (mỗi) đứng trước ➔ "for each/every square kilometre" (tính trên mỗi km²).</li>
   <li><span class="hl-red">Tránh nhầm:</span> "for all square kilometre" <span class="hl-red">sai</span> (all + danh từ số nhiều).</li></ul>`},
  {n:"32",type:"fill",q:"...it is hardly surprising ______ Namibia is turning into a popular tourist destination",accept:["that"],
   exp:`<h4>🧠 Câu 32 ➔ that</h4>
   <b>Dịch đề:</b> "...chẳng có gì lạ ______ Namibia đang trở thành điểm du lịch nổi tiếng."
   <ul>
   <li><span class="hl-green">Tại sao đúng:</span> Cấu trúc <span class="p-grammar">It is + adj + that + mệnh đề</span> ➔ "it is surprising <span class="p-word">that</span> ..." (liên từ nối mệnh đề danh ngữ).</li>
   <li><span class="hl-red">Tránh nhầm:</span> "surprising if" đổi nghĩa sang điều kiện; "surprising because" thừa vì đã có mệnh đề nêu sự việc, không phải nêu lý do.</li></ul>`}
 ]
}
];

/* ================= RENDER ================= */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    TOTAL++;
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`;
    card.appendChild(head);
    if(q.type==='fill'){
      const fin=document.createElement('div'); fin.className='fin';
      const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Gõ 1 từ...';
      const cb=document.createElement('button'); cb.className='checkbtn'; cb.textContent='Kiểm tra ✓';
      cb.onclick=()=>checkFill(inp,cb,card,qid,q.accept);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')cb.click();});
      fin.appendChild(inp); fin.appendChild(cb); card.appendChild(fin);
    } else {
      const box=document.createElement('div'); box.className='opts';
      shuffle(q.opts).forEach(o=>{
        const b=document.createElement('button'); b.className='opt'; b.type='button';
        b.textContent=o.en; b.dataset.val=o.en;
        b.onclick=()=>choose(b,card,qid,q.a);
        box.appendChild(b);
      });
      card.appendChild(box);
    }
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;

/* ================= AUDIO / FX ================= */
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#ff6b9d','#ffd6a5','#a8f0d1','#a5d8ff','#d0bfff','#fff3b0'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}

/* ================= INTERACTION ================= */
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';t.style.display=open?'none':'block';btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function checkFill(inp,btn,card,qid,accept){
  if(qid in answered) return;
  const val=inp.value.trim().toLowerCase().replace(/[.,;:]/g,'');
  const ok=accept.includes(val); answered[qid]=ok;
  inp.disabled=true; btn.disabled=true;
  if(ok){inp.classList.add('correct');ding();confetti();}
  else{inp.classList.add('wrong');card.classList.add('shake');buzz();
    const hint=document.createElement('div');hint.style.marginTop='6px';hint.style.fontWeight='800';
    hint.innerHTML='✅ Đáp án đúng: <span class="hl-green">'+accept.join(' / ')+'</span>';
    card.querySelector('.fin').after(hint);
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}

/* ================= SUBMIT ================= */
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms. Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
