.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(255,255,255,.3);border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(36,27,58,.25)}

.trans{display:none;margin-top:6px;background:#fff0fa;border-left:5px solid var(--pink2);border-radius:8px;padding:8px 10px;font-size:14px;color:#5f0f40}
.optbank{background:rgba(255,255,255,.55);border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:14px}

td .w{font-weight:800;color:var(--p-word)}td .t{color:var(--p-gram);font-weight:700}

.checkbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:.5px;color:#fff;-webkit-text-stroke:.5px var(--ink);background:var(--green);border:2.5px solid var(--ink);border-radius:12px;padding:7px 16px;box-shadow:3px 3px 0 var(--ink)}

@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(255,255,255,.42);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}

.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#d1006f,#6a00f4);border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}

.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(36,27,58,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#fff0fa);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(36,27,58,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:46px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:32px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--lemon);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--blue);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}

<script>
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"💧 Reading · Part 4 — The Future of Water",
 left:`
 <div class="rd"><p><b>PART 4 (Q16–20):</b> Five sentences have been removed. Choose the correct sentence for each gap. There are three extra sentences you do not need.</p></div>
 <div class="rd"><b>The Future of Water</b>
 <p>Even at a time when global warming and the effect it will have on our water supply is often in the news, those of us living in developed countries cannot imagine not having a shower whenever we want, or drinking water when we are thirsty. We are often told about the effects of climate change and future water shortages. <span class="gap">16</span> Of course not! It seems we haven't realised what is really going on around us or we choose not to.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Ngay cả khi nóng lên toàn cầu và tác động của nó tới nguồn nước thường xuất hiện trên tin tức, những người sống ở các nước phát triển như chúng ta không thể tưởng tượng cảnh không được tắm khi muốn, hay không có nước uống khi khát. Chúng ta thường được nghe về tác động của biến đổi khí hậu và tình trạng thiếu nước trong tương lai. (16) Tất nhiên là không! Có vẻ chúng ta chưa nhận ra điều gì đang thực sự diễn ra quanh mình, hoặc chọn cách không nhận ra.</div>
 <p>The fact that the growing world population is going to make an even bigger demand on the planet's water is something most of us prefer not to think about. <span class="gap">17</span> In addition, as developing countries become richer, more people have the ability to spend money, so there is greater demand for water. More gardens need watering, more dishwashers and washing machines are in use and there are more cars to wash. Water is being wasted every day for some people's comfort.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Việc dân số thế giới ngày càng tăng sẽ tạo ra nhu cầu nước lớn hơn nữa là điều đa số chúng ta không muốn nghĩ tới. (17) Thêm vào đó, khi các nước đang phát triển giàu lên, nhiều người có khả năng chi tiêu hơn, nên nhu cầu về nước tăng. Nhiều vườn cần tưới hơn, nhiều máy rửa bát và máy giặt được dùng hơn, và nhiều xe hơi cần rửa hơn. Nước bị lãng phí mỗi ngày cho sự tiện nghi của một số người.</div>
 <p>However, for many people in less developed regions of the world, water is not a question of turning on a tap. For women, especially, it can mean a long walk to get water from a well or a river. This may be some kilometres away from their homes. <span class="gap">18</span> And girls also have to help their mothers, so education takes second place, or no place at all. And without education there cannot be positive change. <span class="gap">19</span></p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Tuy nhiên, với nhiều người ở các vùng kém phát triển hơn, nước không phải chuyện chỉ cần vặn vòi. Đặc biệt với phụ nữ, điều đó có thể nghĩa là đi bộ một quãng dài để lấy nước từ giếng hoặc sông. Nơi đó có thể cách nhà họ vài ki-lô-mét. (18) Và các bé gái cũng phải giúp mẹ, nên việc học bị xếp thứ yếu, hoặc không có chỗ. Mà không có giáo dục thì không thể có thay đổi tích cực. (19)</div>
 <p>So, next time you leave the tap running when brushing your teeth, think. <span class="gap">20</span> And ask yourself: 'How can I help to save water?' Start thinking before it's too late because the time will come when all of us will have to deal with the lack of water.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Vậy nên, lần tới khi bạn để vòi nước chảy trong lúc đánh răng, hãy suy nghĩ. (20) Và tự hỏi: "Mình có thể làm gì để tiết kiệm nước?" Hãy bắt đầu nghĩ trước khi quá muộn, vì sẽ đến lúc tất cả chúng ta phải đối mặt với tình trạng thiếu nước.</div></div>
 <div class="optbank"><b>Ngân hàng câu (A–H):</b><br>
 A. And all this is because there is no running water nearby.<br>
 B. It's not difficult to live without water.<br>
 C. Think about all those who don't have a tap to turn on.<br>
 D. And this refusal to drink is the problem.<br>
 E. These women cannot have a job because they have no time.<br>
 F. Scientists are not worried about the future.<br>
 G. Feeding this number of people means more water for farming, for example.<br>
 H. But do we really believe wars may be fought over water?</div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">global warming</span></td><td><span class="t">n</span></td><td>sự nóng lên toàn cầu</td></tr>
 <tr><td><span class="w">water supply</span></td><td><span class="t">n</span></td><td>nguồn cung cấp nước</td></tr>
 <tr><td><span class="w">developed country</span></td><td><span class="t">n</span></td><td>nước phát triển</td></tr>
 <tr><td><span class="w">shortage</span></td><td><span class="t">n</span></td><td>sự thiếu hụt</td></tr>
 <tr><td><span class="w">demand</span></td><td><span class="t">n</span></td><td>nhu cầu</td></tr>
 <tr><td><span class="w">population</span></td><td><span class="t">n</span></td><td>dân số</td></tr>
 <tr><td><span class="w">region</span></td><td><span class="t">n</span></td><td>vùng, khu vực</td></tr>
 <tr><td><span class="w">well</span></td><td><span class="t">n</span></td><td>cái giếng</td></tr>
 <tr><td><span class="w">education</span></td><td><span class="t">n</span></td><td>giáo dục</td></tr>
 <tr><td><span class="w">waste</span></td><td><span class="t">v</span></td><td>lãng phí</td></tr>
 <tr><td><span class="w">comfort</span></td><td><span class="t">n</span></td><td>sự tiện nghi</td></tr>
 <tr><td><span class="w">tap</span></td><td><span class="t">n</span></td><td>vòi nước</td></tr></table></div>`,
 qs:[
  {n:"16",q:"Choose the sentence for gap 16.",
   opts:[opt("But do we really believe wars may be fought over water?"),opt("It's not difficult to live without water."),opt("And this refusal to drink is the problem."),opt("Scientists are not worried about the future.")],
   a:"But do we really believe wars may be fought over water?",
   exp:`<h4>🧠 Câu 16 ➔ H</h4>
   <b>Dịch ngữ cảnh:</b> Câu trước: "Chúng ta thường được nghe về tác động của biến đổi khí hậu và tình trạng thiếu nước trong tương lai." Câu sau: "Tất nhiên là không! Có vẻ chúng ta chưa nhận ra..."
   <ul>
   <li>H. But do we really believe wars may be fought over water? ➔ <span class="p-mean">Nhưng chúng ta có thực sự tin rằng chiến tranh có thể nổ ra vì nước không?</span></li>
   <li>B. It's not difficult to live without water. ➔ <span class="p-mean">Sống thiếu nước không khó khăn gì.</span></li>
   <li>D. And this refusal to drink is the problem. ➔ <span class="p-mean">Và việc từ chối uống nước này chính là vấn đề.</span></li>
   <li>F. Scientists are not worried about the future. ➔ <span class="p-mean">Các nhà khoa học không lo lắng về tương lai.</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> H là một <span class="p-word">câu hỏi</span>, và câu sau "<span class="p-word">Of course not!</span>" (Tất nhiên là không!) chính là câu <span class="p-mean">trả lời</span> cho nó. Ăn khớp hoàn hảo.<br>
   <span class="hl-red">Tại sao sai:</span> B, D, F đều là <span class="hl-red">câu khẳng định</span>, không thể được đáp lại bằng "Of course not!"; ngoài ra B nói "sống thiếu nước không khó" và F nói "nhà khoa học không lo" đều <span class="hl-red">trái với thông điệp báo động</span> của bài. (B, D, F là 3 câu thừa.)`},
  {n:"17",q:"Choose the sentence for gap 17.",
   opts:[opt("Feeding this number of people means more water for farming, for example."),opt("It's not difficult to live without water."),opt("And this refusal to drink is the problem."),opt("Scientists are not worried about the future.")],
   a:"Feeding this number of people means more water for farming, for example.",
   exp:`<h4>🧠 Câu 17 ➔ G</h4>

{
 title:"👁️ Reading · Part 5 — Look after your eyes",
 left:`
 <div class="rd"><p><b>PART 5 (Q21–26):</b> For each question, choose the correct answer.</p></div>
 <div class="rd"><b>Look after your eyes</b>
 <p>The eye is undoubtedly one of the greatest organs in our body. It is actually like a camera working 24 hours a day, 7 days a week. The eye takes pictures of the world around us and <span class="gap">21</span> these pictures to our brain. Then the brain works out what it is that our eyes see.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Mắt chắc chắn là một trong những cơ quan tuyệt vời nhất của cơ thể. Nó thực sự giống một chiếc máy ảnh hoạt động 24 giờ mỗi ngày, 7 ngày mỗi tuần. Mắt chụp lại hình ảnh thế giới xung quanh và (21) những hình ảnh đó tới não. Rồi não xử lý xem mắt ta đang nhìn thấy gì.</div>
 <p>As this happens from the moment we open our eyes in the morning to when we close them at night, most of us take our vision for granted, giving little thought to the complex processes that <span class="gap">22</span> us to see, until one <span class="gap">23</span> we realise we may have an eye problem.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Vì điều này diễn ra từ lúc ta mở mắt buổi sáng đến khi nhắm mắt ban đêm, hầu hết chúng ta coi thị lực là điều hiển nhiên, ít khi để tâm tới những quá trình phức tạp (22) ta nhìn được, cho đến một (23) ta nhận ra mình có thể có vấn đề về mắt.</div>
 <p>At middle age, several eye conditions are becoming more and more <span class="gap">24</span> and by the age of 50 most people have <span class="gap">25</span> that they cannot see as well as they once could. They may become near-sighted or far-sighted. People who are near-sighted can't see things far away while people who are far-sighted can't see things <span class="gap">26</span> up. Most of these problems can be corrected with glasses but some of them may need surgery.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Ở tuổi trung niên, một số bệnh về mắt ngày càng (24) và đến tuổi 50, hầu hết mọi người đã (25) rằng họ không còn nhìn rõ như trước. Họ có thể bị cận thị hoặc viễn thị. Người cận thị không nhìn rõ vật ở xa, còn người viễn thị không nhìn rõ vật ở (26). Hầu hết các vấn đề này có thể khắc phục bằng kính, nhưng một số cần phẫu thuật.</div></div>
 <div class="gloss"><div class="gh">📚 Glossary</div><table>
 <tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
 <tr><td><span class="w">organ</span></td><td><span class="t">n</span></td><td>cơ quan (cơ thể)</td></tr>
 <tr><td><span class="w">vision</span></td><td><span class="t">n</span></td><td>thị lực</td></tr>
 <tr><td><span class="w">take for granted</span></td><td><span class="t">phr</span></td><td>coi là hiển nhiên</td></tr>
 <tr><td><span class="w">complex</span></td><td><span class="t">adj</span></td><td>phức tạp</td></tr>
 <tr><td><span class="w">process</span></td><td><span class="t">n</span></td><td>quá trình</td></tr>
 <tr><td><span class="w">condition</span></td><td><span class="t">n</span></td><td>tình trạng, bệnh lý</td></tr>
 <tr><td><span class="w">near-sighted</span></td><td><span class="t">adj</span></td><td>cận thị</td></tr>
 <tr><td><span class="w">far-sighted</span></td><td><span class="t">adj</span></td><td>viễn thị</td></tr>
 <tr><td><span class="w">correct</span></td><td><span class="t">v</span></td><td>chỉnh, sửa</td></tr>
 <tr><td><span class="w">surgery</span></td><td><span class="t">n</span></td><td>phẫu thuật</td></tr>
 <tr><td><span class="w">transfer</span></td><td><span class="t">v</span></td><td>chuyển, truyền</td></tr>
 <tr><td><span class="w">enable</span></td><td><span class="t">v</span></td><td>giúp/khiến có thể</td></tr></table></div>`,

   <span class="hl-red">Tại sao sai:</span> <span class="p-word">let</span> theo sau là <span class="p-grammar">let sb do (V nguyên mẫu, KHÔNG "to")</span>; <span class="p-word">encourage</span> dùng cho việc thuyết phục <span class="hl-red">người có ý chí</span>, không hợp "processes"; <span class="p-word">provide</span> đi với <span class="p-grammar">with/for</span> và không dùng "provide us to see".`},
  {n:"23",q:"...until one ______ we realise we may have an eye problem.",

/* ===== ENGINE ===== */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    TOTAL++;
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    if(q.type==='fill'){
      const fin=document.createElement('div'); fin.className='fin';
      const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Gõ 1 từ...';
      const cb=document.createElement('button'); cb.className='checkbtn'; cb.textContent='Kiểm tra ✓';
      cb.onclick=()=>checkFill(inp,cb,card,qid,q.accept);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')cb.click();});
      fin.appendChild(inp); fin.appendChild(cb); card.appendChild(fin);
    } else {
      const box=document.createElement('div'); box.className='opts';
      shuffle(q.opts).forEach(o=>{
        const b=document.createElement('button'); b.className='opt'; b.type='button';
        b.textContent=o.en; b.dataset.val=o.en; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
      });
      card.appendChild(box);
    }
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#c8b6ff','#ffc09f','#9defe0','#a3c4ff','#ffb8e6','#fdffb6'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';t.style.display=open?'none':'block';btn.textContent=open?(btn.textContent.includes('thư')?'🌟 Mở dịch cả lá thư':'🌟 Mở dịch đoạn này'):'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function checkFill(inp,btn,card,qid,accept){
  if(qid in answered) return;
  const val=inp.value.trim().toLowerCase().replace(/[.,;:]/g,'');
  const ok=accept.includes(val); answered[qid]=ok;
  inp.disabled=true; btn.disabled=true;
  if(ok){inp.classList.add('correct');ding();confetti();}
  else{inp.classList.add('wrong');card.classList.add('shake');buzz();
    const hint=document.createElement('div');hint.style.marginTop='6px';hint.style.fontWeight='800';
    hint.innerHTML='✅ Đáp án đúng: <span class="hl-green">'+accept.join(' / ')+'</span>';
    card.querySelector('.fin').after(hint);
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms MS Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
