<style>
:root{
  --ink:#1d1d2b; --pink:#ffd6e8; --mint:#c8f4e4; --lemon:#fff3b0; --sky:#cfe8ff;
  --hot:#ff5da2; --pow:#ffd93d; --green:#2ecc71; --red:#ff4d4d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Baloo 2',sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(120deg,var(--pink),var(--sky),var(--mint),var(--lemon),var(--pink));

  background:radial-gradient(rgba(29,29,43,.14) 1.4px,transparent 1.6px);

#floatLayer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#floatLayer span{position:absolute;font-size:52px;opacity:.18;animation:drift 14s ease-in-out infinite alternate;filter:blur(1px)}
@keyframes drift{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-60px) rotate(10deg)}}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:10px 14px 90px}
/* header */
header{text-align:center;padding:6px 0 2px}
header h1{font-family:'Bangers',cursive;font-size:clamp(26px,4vw,44px);letter-spacing:2px;
  color:var(--hot);text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1.2px var(--ink)}
header .by{font-size:12.5px;font-weight:600;opacity:.75}

.tabs{display:flex;gap:10px;justify-content:center;margin:10px 0}
.tab{font-family:'Bangers',cursive;letter-spacing:1.5px;font-size:19px;padding:8px 20px;cursor:pointer;
  border:3px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);
  box-shadow:4px 4px 0 var(--ink);transition:.15s}
.tab:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tab.on{background:var(--pow);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
/* split screen */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{border:3px solid var(--ink);border-radius:20px;padding:16px;
  background:rgba(255,255,255,.5);backdrop-filter:blur(12px);
  box-shadow:7px 7px 0 rgba(29,29,43,.85), inset 0 0 0 1.5px rgba(255,255,255,.8);
  height:calc(100vh - 190px);min-height:420px;overflow-y:auto}
.panel::-webkit-scrollbar{width:10px}
.panel::-webkit-scrollbar-thumb{background:var(--hot);border:2px solid var(--ink);border-radius:8px}
.ptitle{font-family:'Bangers',cursive;font-size:24px;letter-spacing:1.5px;display:inline-block;
  background:var(--hot);color:#fff;-webkit-text-stroke:.8px var(--ink);padding:3px 16px;border:3px solid var(--ink);
  border-radius:12px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg);margin-bottom:12px}
.instr{font-size:14px;font-weight:600;background:rgba(255,243,176,.8);border:2px dashed var(--ink);
  border-radius:12px;padding:8px 12px;margin-bottom:12px}
/* reading cards */
.rcard{border:3px solid var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:14px;
  background:rgba(255,255,255,.65);box-shadow:4px 4px 0 rgba(29,29,43,.75);position:relative}
.rcard.c1{background:rgba(255,214,232,.75)}.rcard.c2{background:rgba(200,244,228,.75)}
.rcard.c3{background:rgba(207,232,255,.75)}.rcard.c4{background:rgba(255,243,176,.75)}
.rtag{font-family:'Bangers',cursive;font-size:15px;letter-spacing:1px;background:var(--ink);color:var(--pow);
  padding:1px 10px;border-radius:8px;display:inline-block;margin-bottom:6px}
.rcard p.en{font-size:15.5px;line-height:1.55;font-weight:600}
.btn-tr{margin-top:8px;font-family:'Baloo 2';font-weight:700;font-size:13px;cursor:pointer;
  border:2.5px solid var(--ink);border-radius:20px;padding:4px 14px;background:var(--sky);
  box-shadow:3px 3px 0 var(--ink);transition:.12s}
.btn-tr:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn-tr:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.vi{display:none;margin-top:8px;font-size:14.5px;line-height:1.55;background:rgba(255,255,255,.85);
  border-left:5px solid var(--hot);border-radius:8px;padding:8px 10px;font-style:italic}
.vi.show{display:block;animation:pop .25s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
/* glossary */
table.gloss{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px;background:rgba(255,255,255,.8);
  border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.gloss th{font-family:'Bangers',cursive;letter-spacing:1px;font-size:15px;background:var(--pow);border:2px solid var(--ink);padding:5px}
.gloss td{border:2px solid var(--ink);padding:5px 8px}
.gloss tr:nth-child(even) td{background:rgba(207,232,255,.5)}
.gloss td:first-child{font-weight:800;color:#0b6bcb}
/* questions */
.qcard{border:3px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:18px;position:relative;
  background:rgba(255,255,255,.62);backdrop-filter:blur(8px);box-shadow:5px 5px 0 rgba(29,29,43,.8)}
.qcard::after{content:"";position:absolute;left:30px;bottom:-14px;width:0;height:0;
  border:12px solid transparent;border-top-color:var(--ink)}
.qnum{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.7px var(--ink);
  background:var(--hot);border:3px solid var(--ink);border-radius:50%;width:44px;height:44px;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);
  margin-right:8px;flex:none;transform:rotate(-6deg)}
.qtop{display:flex;align-items:flex-start;gap:6px;margin-bottom:10px}
.qtext{font-size:15.5px;font-weight:700;line-height:1.5;padding-top:6px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{font-family:'Baloo 2';font-weight:600;font-size:14.5px;line-height:1.45;text-align:left;cursor:pointer;
  border:3px solid var(--ink);border-radius:14px;padding:9px 14px;background:rgba(255,255,255,.9);
  box-shadow:3px 3px 0 rgba(29,29,43,.8);transition:.15s;white-space:normal;word-break:normal}
.opt:hover:not(:disabled){background:var(--lemon);transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.opt:disabled{cursor:default;opacity:.95}
.opt.ok{background:var(--green)!important;color:#fff;border-color:#0d7a3e}
.opt.bad{background:var(--red)!important;color:#fff;border-color:#8f0f0f;animation:shake .4s}
.opt.reveal{outline:4px dashed var(--green);outline-offset:2px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.stamp{position:absolute;top:-14px;right:10px;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;
  padding:2px 12px;border:3px solid var(--ink);border-radius:10px;transform:rotate(6deg);display:none;box-shadow:3px 3px 0 var(--ink)}
.stamp.ok{display:block;background:var(--green);color:#fff}.stamp.bad{display:block;background:var(--red);color:#fff}
/* explanation */
.expl{display:none;margin-top:12px;border:3px solid var(--ink);border-radius:14px;padding:12px;
  background:rgba(255,255,255,.92);font-size:14px;line-height:1.65}
.expl.show{display:block;animation:pop .3s}
.expl ul{margin:6px 0 10px 20px}
.expl li{margin-bottom:4px}
.expl .etitle{font-family:'Bangers',cursive;font-size:18px;letter-spacing:1px;color:var(--hot);-webkit-text-stroke:.5px var(--ink)}
.p-word{font-weight:800;color:#0b6bcb;background:rgba(207,232,255,.7);padding:0 4px;border-radius:5px}
.p-phonetic{color:#7a4fbf;font-style:italic}
.p-mean{color:#c2185b;font-weight:700;background:rgba(255,214,232,.6);padding:0 4px;border-radius:5px}
.p-grammar{color:#0d7a3e;font-weight:800;background:rgba(200,244,228,.8);padding:0 4px;border-radius:5px;border-bottom:2px dotted #0d7a3e}
.hl-green{background:var(--green);color:#fff;font-weight:800;padding:1px 8px;border-radius:8px;border:2px solid var(--ink)}
.hl-red{background:var(--red);color:#fff;font-weight:800;padding:1px 8px;border-radius:8px;border:2px solid var(--ink)}
.quote{background:rgba(255,243,176,.7);border-left:5px solid var(--pow);border-radius:8px;padding:6px 10px;margin:6px 0;font-weight:600}

#submitBar{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;z-index:5}
#btnSubmit{font-family:'Bangers',cursive;font-size:24px;letter-spacing:2px;cursor:pointer;color:#fff;

#btnSubmit:hover{transform:translate(-2px,-2px) scale(1.03);box-shadow:8px 8px 0 var(--ink)}
/* modal */
.modal{display:none;position:fixed;inset:0;background:rgba(29,29,43,.55);backdrop-filter:blur(4px);z-index:10;
  align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.mbox{background:linear-gradient(160deg,#fff,var(--pink));border:4px solid var(--ink);border-radius:24px;
  box-shadow:10px 10px 0 var(--ink);padding:24px;max-width:460px;width:100%;text-align:center;animation:pop .3s}
.mbox h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:2px;color:var(--hot);-webkit-text-stroke:1px var(--ink)}
.mbox input{width:100%;margin:14px 0;padding:10px 14px;font-family:'Baloo 2';font-weight:700;font-size:16px;
  border:3px solid var(--ink);border-radius:14px;box-shadow:inset 3px 3px 0 rgba(29,29,43,.15)}
.mbox .go{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1.5px;cursor:pointer;padding:8px 26px;
  background:var(--pow);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.mbox .warn{color:var(--red);font-weight:800;font-size:13px;display:none}
.score-big{font-family:'Bangers',cursive;font-size:52px;color:var(--hot);-webkit-text-stroke:1.5px var(--ink);letter-spacing:2px}
.score-10{font-size:22px;font-weight:800;background:var(--mint);border:3px solid var(--ink);border-radius:14px;
  display:inline-block;padding:4px 18px;box-shadow:3px 3px 0 var(--ink);margin:6px 0}
.mbox img{max-width:100%;max-height:210px;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);margin-top:10px}
.remark{font-weight:700;font-size:15px;margin-top:10px;background:rgba(255,255,255,.85);border:2px dashed var(--ink);border-radius:12px;padding:8px}
/* confetti */
.cf{position:fixed;top:-30px;z-index:50;font-size:20px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:900px){
  .split{grid-template-columns:1fr}
  .panel{height:auto;max-height:70vh}
}
@media (prefers-reduced-motion: reduce){body{animation:none}#floatLayer span{animation:none}}
</style>

why:"Dẫn chứng: <span class='p-word'>\"The hotel's not great, but we're out most of the time!\"</span> <span class='p-mean'>\"Khách sạn không tuyệt lắm, nhưng bọn mình ra ngoài hầu hết thời gian!\"</span>. Từ <span class='p-word'>hotel</span> <span class='p-mean'>khách sạn (n)</span> được diễn đạt lại bằng <span class='p-word'>accommodation</span> <span class='p-phonetic'>/əˌkɒməˈdeɪʃn/</span> <span class='p-mean'>chỗ ở (n)</span>; <span class='p-word'>not great</span> = <span class='p-word'>not very satisfied</span> <span class='p-mean'>không hài lòng lắm (adj)</span>. Cấu trúc <span class='p-grammar'>..., but + mệnh đề đối lập</span> cho thấy cô ấy <span class='p-word'>doesn't mind that much</span> <span class='p-mean'>không bận tâm nhiều (v)</span> vì đi chơi suốt.",
wrong:"Đáp án về thời tiết <span class='hl-red'>sai</span> vì Anne chỉ nói <span class='p-word'>the sun's shining</span> <span class='p-mean'>trời đang nắng</span>, KHÔNG hề so sánh với kỳ vọng — cấu trúc so sánh <span class='p-grammar'>much better than + they had expected (quá khứ hoàn thành)</span> không có trong bài. Đáp án <span class='p-word'>wasn't able to accompany Jane</span> <span class='hl-red'>sai ngược hoàn toàn</span>: câu <span class='p-word'>\"Wish you were here\"</span> <span class='p-mean'>\"Ước gì cậu ở đây\"</span> chứng tỏ JANE mới là người không đi cùng ANNE, chứ không phải Anne bỏ lỡ chuyến đi."},

why:"Dẫn chứng: <span class='p-word'>\"I've found a great site that's got reviews of all the latest Hollywood films! Check out the articles...\"</span>. Cụm <span class='p-word'>Check out</span> <span class='p-mean'>xem thử, đọc thử (phr. v)</span> chính là lời đề nghị Nick ĐỌC các <span class='p-word'>reviews</span> <span class='p-phonetic'>/rɪˈvjuːz/</span> <span class='p-mean'>bài đánh giá (n)</span> trên <span class='p-word'>site</span> <span class='p-mean'>trang web (n)</span> — khớp hoàn toàn với đáp án đúng.",

why:"Dẫn chứng: <span class='p-word'>\"ring dad on his mobile... he's got to collect her\"</span>. Động từ <span class='p-word'>ring</span> <span class='p-mean'>gọi điện (v)</span> = <span class='p-word'>call</span>; đại từ <span class='p-word'>he</span> chỉ BỐ, <span class='p-word'>her</span> chỉ MẸ. Cấu trúc <span class='p-grammar'>have/has got to + V = must + V (phải làm gì)</span>, và <span class='p-word'>collect</span> <span class='p-mean'>đón (v)</span> đồng nghĩa với <span class='p-word'>pick up</span> <span class='p-mean'>đón (phr. v)</span>. Vậy nhiệm vụ của David là GỌI cho bố để bố đi đón mẹ.",
wrong:"Đáp án David tự đi đón mẹ <span class='hl-red'>sai chủ thể</span>: người phải đón mẹ là <span class='p-word'>dad</span> (thể hiện qua <span class='p-word'>HE's got to collect her</span>), David chỉ cần gọi điện. Đáp án về tai nạn <span class='hl-red'>sai hai lỗi</span>: xe bị hỏng là xe của <span class='p-word'>Mum</span> chứ không phải của bố, và <span class='p-word'>broke down</span> <span class='p-mean'>bị hỏng máy (phr. v)</span> khác hẳn <span class='p-word'>accident</span> <span class='p-phonetic'>/ˈæksɪdənt/</span> <span class='p-mean'>tai nạn (n)</span> — đây là bẫy từ vựng kinh điển."},

/* ============ PART 2 ============ */
{
title:"PART 2 · Questions 6–10",
instr:"📌 5 người dưới đây đều muốn đi xem phim. Có 8 bài giới thiệu phim (A→H bên trái). Hãy chọn bộ phim PHÙ HỢP NHẤT cho mỗi người.",
reading:[
{tag:"🎬 East-side Story",cls:"c1",en:"This sequel to the original musical classic is definitely worth seeing. This time, the romantic interest takes place between a middle-aged Italian man and a Russian woman in New York, with a great message about love and age. Excellent dance routines and singing performances make this exceptional film as entertaining as a Broadway hit.",vi:"Phần tiếp theo của bộ phim ca nhạc kinh điển này chắc chắn đáng xem. Lần này, mối tình lãng mạn diễn ra giữa một người đàn ông Ý trung niên và một phụ nữ Nga ở New York, với thông điệp tuyệt vời về tình yêu và tuổi tác. Những màn vũ đạo và trình diễn ca hát xuất sắc khiến bộ phim đặc biệt này giải trí chẳng kém một vở diễn ăn khách ở Broadway."},
{tag:"🎬 Chuckling all Day",cls:"c2",en:"The young comedian Steve Trumann gives us another extremely funny performance as the office worker who has one humorous accident after another in the busy city he lives in. In the end, we feel that this could happen to any one of us, which perhaps helps us laugh in an understanding way.",vi:"Diễn viên hài trẻ Steve Trumann mang đến một màn trình diễn cực kỳ hài hước khác trong vai anh nhân viên văn phòng gặp hết tai nạn hài hước này đến tai nạn khác trong thành phố nhộn nhịp nơi anh sống. Cuối phim, ta cảm thấy chuyện này có thể xảy ra với bất kỳ ai trong chúng ta, điều đó có lẽ giúp ta cười một cách đầy cảm thông."},
{tag:"🎬 Phantom Screams",cls:"c3",en:"In this tense psychological thriller, James Tyler has the same terrible dream: that spirits who want the house empty, kill him and his family. However, when the first events of his dream start happening, a series of clues become the only hope he has to save himself and the family.",vi:"Trong bộ phim giật gân tâm lý căng thẳng này, James Tyler liên tục gặp cùng một cơn ác mộng khủng khiếp: những hồn ma muốn ngôi nhà trống không sẽ giết anh và gia đình. Tuy nhiên, khi những sự kiện đầu tiên trong giấc mơ bắt đầu xảy ra, một chuỗi manh mối trở thành hy vọng duy nhất để anh cứu bản thân và gia đình."},
{tag:"🎬 The Soldier Returns",cls:"c4",en:"Although Arnold Stallon tried his best in this film, he seems to have failed. He plays an ex-commando who must now fight a drug-lord. But the only thing he seems to do throughout the movie is fight everyone, using guns, knives and bombs. His character is nothing more than a guy who enjoys killing others.",vi:"Dù Arnold Stallon đã cố hết sức trong phim này, anh dường như đã thất bại. Anh vào vai một cựu đặc nhiệm giờ phải chiến đấu với một trùm ma túy. Nhưng điều duy nhất anh làm suốt bộ phim là đánh nhau với tất cả mọi người bằng súng, dao và bom. Nhân vật của anh chẳng khác gì một gã thích giết người."},
{tag:"🎬 Destiny of the Heart",cls:"c1",en:"Two young students leave high school for college, and although they were in love with each other, neither managed to tell the other. The film is set four years later when the two meet by chance at a train station. Will they let each other go again or live happily ever after? A predictable but sweet romantic movie for teenagers.",vi:"Hai học sinh trẻ rời trường trung học để vào đại học, và dù yêu nhau, cả hai đều không ai dám nói ra. Bộ phim lấy bối cảnh bốn năm sau khi hai người tình cờ gặp lại ở một nhà ga. Liệu họ sẽ lại để tuột mất nhau hay sống hạnh phúc mãi mãi? Một bộ phim lãng mạn dễ đoán nhưng ngọt ngào dành cho tuổi teen."},
{tag:"🎬 Murder at the Office",cls:"c2",en:"This is a classic murder mystery. At the beginning of the film, we see through the murderer's eyes, as he attacks and kills his victim, a rich businessman. Next, we see a room with five suspects, all his employees, who were in the building at the time. Can you guess who did it?",vi:"Đây là một phim trinh thám án mạng kinh điển. Đầu phim, ta nhìn qua con mắt của kẻ sát nhân khi hắn tấn công và giết nạn nhân — một doanh nhân giàu có. Tiếp theo, ta thấy căn phòng với năm nghi phạm, đều là nhân viên của ông ta, những người có mặt trong tòa nhà lúc đó. Bạn có đoán được ai là hung thủ không?"},
{tag:"🎬 The 23rd Century Man",cls:"c3",en:"The biggest science fiction film of the year does not disappoint as Michael Saunt plays an astronaut in the 23rd century who is travelling the stars with only robots and computers as company. But there's more to this film than fiction, as it warns us about the danger of losing our human nature to computers.",vi:"Bộ phim khoa học viễn tưởng lớn nhất năm không gây thất vọng khi Michael Saunt vào vai một phi hành gia ở thế kỷ 23 du hành giữa các vì sao chỉ với robot và máy tính làm bạn đồng hành. Nhưng bộ phim còn hơn cả viễn tưởng, vì nó cảnh báo chúng ta về nguy cơ đánh mất bản tính con người vào tay máy tính."},
{tag:"🎬 Henry V",cls:"c4",en:"Anyone looking for a classic should consider this Shakespeare play, complete with Hollywood special effects and star names. The hard reality of war in the Middle Ages is certainly brought to life by the tough actors as they march through France.",vi:"Ai đang tìm kiếm một tác phẩm kinh điển nên cân nhắc vở kịch Shakespeare này, đầy đủ kỹ xảo Hollywood và các ngôi sao tên tuổi. Hiện thực khốc liệt của chiến tranh thời Trung Cổ chắc chắn được các diễn viên gai góc tái hiện sống động khi họ hành quân qua nước Pháp."}
],

{q:"Câu 8 · Nick has had a stressful day and wants to see a film that will help him relax and escape. He would like something funny but does not enjoy science fiction films.",qvi:"Nick vừa trải qua một ngày căng thẳng và muốn xem một bộ phim giúp anh thư giãn, thoát khỏi thực tại. Anh muốn thứ gì đó hài hước nhưng không thích phim khoa học viễn tưởng.",
opts:"films",c:1,
why:"Đáp án đúng là <span class='p-word'>Chuckling all Day</span>. Từ khóa <span class='p-word'>funny</span> <span class='p-mean'>hài hước (adj)</span> khớp trực tiếp với <span class='p-word'>extremely funny performance</span> <span class='p-mean'>màn trình diễn cực kỳ hài hước</span> và <span class='p-word'>one humorous accident after another</span> <span class='p-mean'>hết tai nạn hài hước này đến tai nạn khác</span>. Ngay tên phim, <span class='p-word'>chuckle</span> <span class='p-phonetic'>/ˈtʃʌkl/</span> <span class='p-mean'>cười khúc khích (v)</span>, đã báo hiệu thể loại hài — hoàn hảo để <span class='p-word'>relax</span> <span class='p-mean'>thư giãn (v)</span> sau một ngày <span class='p-word'>stressful</span> <span class='p-mean'>căng thẳng (adj)</span>.",

reading:[
{tag:"📖 Đoạn 1",cls:"c1",en:"Ever since she arrived on the pop scene in the early eighties, Madonna has remained one of the most well-known celebrities in the world. She has shown herself to be a talented singer, dancer, songwriter and actress. Having achieved all this, one cannot doubt that she has a strong belief in herself and her abilities. She seems to have gained such a strong personality through her own painful childhood experiences. She went to a strict Catholic school, was one of many children, and her family was split up after her mother died from cancer.",vi:"Kể từ khi xuất hiện trên sân khấu nhạc pop đầu thập niên 80, Madonna vẫn luôn là một trong những người nổi tiếng được biết đến nhiều nhất thế giới. Cô đã chứng tỏ mình là một ca sĩ, vũ công, nhạc sĩ và diễn viên tài năng. Đạt được tất cả những điều này, không ai có thể nghi ngờ rằng cô có niềm tin mạnh mẽ vào bản thân và khả năng của mình. Dường như cô có được cá tính mạnh mẽ ấy nhờ chính những trải nghiệm tuổi thơ đau đớn. Cô học ở một trường Công giáo nghiêm khắc, là một trong nhiều người con trong gia đình, và gia đình cô ly tán sau khi mẹ cô qua đời vì ung thư."},
{tag:"📖 Đoạn 2",cls:"c2",en:"Eventually, in search of fame, she left college and went to New York with only her suitcase and a few dollars. Madonna became one of the biggest stars on the planet, and has sold over 200 million records worldwide, making her the most successful solo artist alive. Few, though, may have realised that her rough start in life is exactly what made her so determined to get ahead and to decide to help so many others.",vi:"Cuối cùng, để tìm kiếm danh tiếng, cô bỏ đại học và đến New York chỉ với chiếc vali và vài đô la. Madonna đã trở thành một trong những ngôi sao lớn nhất hành tinh, bán được hơn 200 triệu đĩa nhạc trên toàn thế giới, trở thành nghệ sĩ solo thành công nhất còn sống. Tuy nhiên, ít ai nhận ra rằng chính khởi đầu gian khó trong cuộc đời đã khiến cô quyết tâm vươn lên đến vậy và quyết định giúp đỡ rất nhiều người khác."},
{tag:"📖 Đoạn 3",cls:"c3",en:"Madonna's single cause over the past 10 years of her life is to give back to the people as much as she can. This is why she has made such a huge effort to bring an end to the extreme poverty and hardship experienced by Malawi's 2 million orphans. She founded Raising Malawi, a non-profit organisation that gives children in Malawi food, clothing, shelter, education, medical care and psychological support. At the same time, she supports other non-government organisations that offer many poor African families opportunities to earn money themselves. These programmes try to change the lives of these people once and for all.",vi:"Mục tiêu duy nhất của Madonna trong 10 năm qua là đền đáp lại mọi người nhiều nhất có thể. Đó là lý do cô đã nỗ lực rất lớn để chấm dứt cảnh nghèo đói cùng cực và khó khăn mà 2 triệu trẻ mồ côi ở Malawi phải chịu đựng. Cô sáng lập Raising Malawi, một tổ chức phi lợi nhuận cung cấp cho trẻ em Malawi thức ăn, quần áo, chỗ ở, giáo dục, chăm sóc y tế và hỗ trợ tâm lý. Đồng thời, cô hỗ trợ các tổ chức phi chính phủ khác — những tổ chức mang lại cho nhiều gia đình nghèo châu Phi cơ hội tự kiếm tiền. Các chương trình này cố gắng thay đổi cuộc sống của những người này một lần và mãi mãi."},
{tag:"📖 Đoạn 4",cls:"c4",en:"It makes you wonder, doesn't it? What would happen if every one of us, just like Madonna did, gave back to those in need? Without a doubt, the world would be such a better place to live in. And it's not simply because certain people would be able to have the things that they should have never lived without in the first place, but also because through volunteering and charity, everyone can become a better person, experiencing benefits one would have never even imagined.",vi:"Điều đó khiến bạn tự hỏi, phải không? Điều gì sẽ xảy ra nếu mỗi người chúng ta, giống như Madonna, đền đáp lại những người đang cần giúp đỡ? Chắc chắn thế giới sẽ trở thành một nơi tốt đẹp hơn nhiều để sống. Và không chỉ đơn giản vì một số người sẽ có được những thứ mà lẽ ra họ không bao giờ phải sống thiếu, mà còn vì thông qua hoạt động tình nguyện và từ thiện, mỗi người đều có thể trở thành phiên bản tốt hơn của chính mình, trải nghiệm những lợi ích mà ta chưa từng tưởng tượng nổi."}

let AC;
function beep(freqs,type,dur,gap){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
      const t=AC.currentTime+i*gap;
      g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t);o.stop(t+dur+.05);
    });
  }catch(e){}
}
const sndOK=()=>beep([880,1318.5],"sine",.5,.12);
const sndNO=()=>beep([320,320],"square",.15,.2);

/* ================= CONFETTI ================= */
function confetti(){
  const em=["🎉","⭐","💖","🎊","✨","💛","💚"];
  for(let i=0;i<60;i++){
    const s=document.createElement("div");s.className="cf";
    s.textContent=em[Math.floor(Math.random()*em.length)];
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(14+Math.random()*20)+"px";
    s.style.animationDuration=(1.8+Math.random()*2)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),4200);
  }
}

/* ================= STATE & RENDER ================= */
const answered={}; // key "p-q" -> true/false correct
const TOTAL=PARTS.reduce((a,p)=>a+p.qs.length,0);

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function explHTML(q,opts){
  const list=opts.map(o=>`<li><span class='p-word'>${o[0]}</span> ➔ <span class='p-mean'>${o[1]}</span></li>`).join("");
  return `<div class='etitle'>💡 GIẢI THÍCH SIÊU CHI TIẾT</div>
  <p><b>📖 Dịch đề bài:</b> <span class='p-mean'>${q.qvi}</span></p>
  <p><b>🔤 Các đáp án &amp; dịch nghĩa:</b></p><ul>${list}</ul>
  <p><span class='hl-green'>✅ Tại sao đúng</span> ${q.why}</p>
  <p style='margin-top:8px'><span class='hl-red'>❌ Tại sao sai</span> ${q.wrong}</p>`;
}

function build(){
  const root=document.getElementById("parts");
  PARTS.forEach((p,pi)=>{
    const sec=document.createElement("section");
    sec.className="split";sec.style.display=pi===0?"grid":"none";sec.id="part"+pi;
    /* left */
    let L=`<div class="panel"><div class="ptitle">${p.title.split("·")[0]} 📚 BÀI ĐỌC</div><div class="instr">${p.instr}</div>`;
    p.reading.forEach((r,ri)=>{
      L+=`<div class="rcard ${r.cls}"><span class="rtag">${r.tag}</span><p class="en">${r.en}</p>
      <button class="btn-tr" onclick="tgl('vi${pi}-${ri}',this)">Mở dịch đoạn này 🌟</button>
      <div class="vi" id="vi${pi}-${ri}">🇻🇳 ${r.vi}</div></div>`;
    });
    L+=`<div class="rcard c4"><span class="rtag">📒 GLOSSARY · TỪ VỰNG KHÓ</span>
    <table class="gloss"><tr><th>Từ vựng</th><th>Loại từ</th><th>Nghĩa tiếng Việt</th></tr>`;
    p.gloss.forEach(g=>{L+=`<tr><td>${g[0]}</td><td><i>${g[1]}</i></td><td>${g[2]}</td></tr>`;});
    L+=`</table></div></div>`;
    /* right */
    let R=`<div class="panel"><div class="ptitle" style="background:#0b6bcb">✏️ BÀI TẬP</div>`;
    p.qs.forEach((q,qi)=>{
      const key=pi+"-"+qi;
      const baseOpts=(q.opts==="films")?FILMS.map(f=>[f[0],f[1]]):q.opts;
      const order=shuffle(baseOpts.map((_,i)=>i));
      let btns=order.map(oi=>{
        const label=(q.opts==="films")?("🎬 "+baseOpts[oi][0]):baseOpts[oi][0];
        return `<button class="opt" data-i="${oi}" onclick="pick(this,'${key}',${pi},${qi})">${label}</button>`;
      }).join("");
      R+=`<div class="qcard" id="qc${key}"><span class="stamp" id="st${key}"></span>
      <div class="qtop"><span class="qnum">${q.q.match(/\d+/)[0]}</span><div class="qtext">${q.q.replace(/^Câu \d+ · /,"")}</div></div>
      <div class="opts">${btns}</div>
      <div class="expl" id="ex${key}">${explHTML(q,baseOpts)}</div></div>`;
    });
    R+=`</div>`;
    sec.innerHTML=L+R;
    root.appendChild(sec);
  });
}
build();

function tgl(id,btn){
  const el=document.getElementById(id);
  el.classList.toggle("show");
  btn.textContent=el.classList.contains("show")?"Ẩn phần dịch 🙈":"Mở dịch đoạn này 🌟";
}

function pick(btn,key,pi,qi){
  if(answered[key]!==undefined)return;
  const q=PARTS[pi].qs[qi];
  const ok=Number(btn.dataset.i)===q.c;
  answered[key]=ok;
  const card=document.getElementById("qc"+key);
  card.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(Number(b.dataset.i)===q.c && !ok) b.classList.add("reveal");
  });
  const st=document.getElementById("st"+key);
  if(ok){btn.classList.add("ok");st.textContent="BOOM! ĐÚNG RỒI 🎉";st.className="stamp ok";sndOK();confetti();}
  else{btn.classList.add("bad");st.textContent="OOPS! SAI RỒI 😅";st.className="stamp bad";sndNO();}
  document.getElementById("ex"+key).classList.add("show");
}

/* tabs */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  PARTS.forEach((_,i)=>document.getElementById("part"+i).style.display=(i==t.dataset.p)?"grid":"none");
});

/* submit */
function closeM(id){document.getElementById(id).classList.remove("show");}
document.getElementById("btnSubmit").onclick=()=>{
  document.getElementById("mName").classList.add("show");
  document.getElementById("stName").focus();
};
function showScore(){
  const name=document.getElementById("stName").value.trim();
  if(!name){document.getElementById("nameWarn").style.display="block";return;}
  document.getElementById("nameWarn").style.display="none";
  closeM("mName");
  const correct=Object.values(answered).filter(Boolean).length;
  const done=Object.keys(answered).length;
  const s10=Math.round(correct/TOTAL*1000)/100;
  const pct=correct/TOTAL;
  let gif,remark;
  if(pct===1){gif="https://media.giphy.com/media/g9582DNuQppxC/giphy.gif";
    remark="🏆 THIÊN TÀI! Con làm đúng 100%! Ms MS Chí Nên tự hào về con lắm luôn — đỉnh của chóp! 💯✨";}
  else if(pct>=0.6){gif="https://media.giphy.com/media/111ebonMs90YLu/giphy.gif";
    remark="👏 RẤT TỐT! High-five nào! Con nắm bài khá chắc rồi, xem lại vài câu sai trong phần giải thích để đạt điểm tuyệt đối nhé! 🙌";}
  else{gif="https://media.giphy.com/media/L95W4wv8nnb9K/giphy.gif";
    remark="💪 CỐ LÊN NHÉ! Đừng buồn — mỗi câu sai là một bài học! Đọc kỹ phần giải thích màu sắc bên dưới mỗi câu rồi thử lại, con sẽ tiến bộ nhanh thôi! 🌈";}
  document.getElementById("scoreBox").innerHTML=`
    <h2>🎯 BẢNG ĐIỂM</h2>
    <p style="font-weight:800;font-size:18px">Học sinh: <span style="color:var(--hot)">${name}</span></p>
    <div class="score-big">${correct}/${TOTAL}</div>
    <div class="score-10">Quy đổi: ${s10.toFixed(2)}/10 điểm</div>
    <p style="font-size:13px;font-weight:600">(Đã làm ${done}/${TOTAL} câu)</p>
    <img src="${gif}" alt="meme" onerror="this.style.display='none'">
    <div class="remark">📝 <b>Lời phê của Ms MS Chí Nên:</b> ${remark}</div>
    <div style="margin-top:14px"><button class="go" onclick="closeM('mScore')">Đóng ✖</button></div>`;
  document.getElementById("mScore").classList.add("show");
  if(pct>=0.6){confetti();sndOK();}
}
</script>
</body>
</html>
