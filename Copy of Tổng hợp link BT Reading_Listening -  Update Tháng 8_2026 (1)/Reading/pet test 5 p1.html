<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 5 · Comic English · Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ffb3d1; --peach:#ffd6a5; --mint:#a8f0d1; --sky:#a5d8ff; --lav:#d0bfff; --yellow:#fff3b0;
  --ink:#22223b; --line:#22223b;
  --p-word:#e63946; --p-phon:#5f0f40; --p-mean:#0077b6; --p-gram:#7209b7;
  --green:#2a9d8f; --red:#e63946;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#ffb3d1,#a5d8ff,#a8f0d1,#fff3b0,#d0bfff);
  background-size:400% 400%;animation:bg 18s ease infinite;
}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
/* halftone + floating layer */
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.25) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:52px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}

.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(18px,2.6vw,28px);margin:0;letter-spacing:1.5px;
  color:#fff;-webkit-text-stroke:1.8px var(--ink);text-stroke:1.8px var(--ink);
  text-shadow:2px 2px 0 var(--pink),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:11px;margin-top:1px;
  display:inline-block;background:rgba(255,255,255,.55);border:1.5px solid var(--ink);
  border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}

/* split screen */
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;
  background:rgba(255,255,255,.28);border:3px solid var(--ink);
  backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(34,34,59,.25)}
.pane::-webkit-scrollbar{width:10px}
.pane::-webkit-scrollbar-thumb{background:var(--lav);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;
  position:sticky;top:0;z-index:2;margin:0 -10px 8px;padding:5px 12px;
  background:linear-gradient(90deg,var(--pink),var(--sky));border-bottom:3px solid var(--ink);
  color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;margin:18px 0 8px;
  color:var(--ink);background:var(--yellow);display:inline-block;padding:2px 14px;
  border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}

/* reading blocks */
.rd{background:rgba(255,255,255,.45);border:2.5px solid var(--ink);border-radius:16px;
  padding:12px 14px;margin:10px 0;box-shadow:3px 3px 0 rgba(34,34,59,.2)}
.rd .num{font-family:'Bangers',cursive;background:var(--mint);border:2px solid var(--ink);
  border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  font-size:17px;margin-right:6px;box-shadow:2px 2px 0 var(--ink)}
.rd p{margin:6px 0;line-height:1.55}
.notice{font-style:italic;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:8px 10px;margin:6px 0}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--lav);color:var(--ink);
  font-family:'Nunito';font-weight:800;font-size:12px;border-radius:20px;padding:3px 12px;margin-top:6px;
  box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#fff0f6;border-left:5px solid var(--pink);
  border-radius:8px;padding:8px 10px;font-size:14px;color:#5f0f40}
.resort{margin:8px 0;padding:8px 10px;background:rgba(255,255,255,.5);border:2px solid var(--ink);border-radius:12px}
.resort b{color:var(--p-mean)}

/* glossary */
.gloss{margin:12px 0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 rgba(34,34,59,.2)}
.gloss .gh{font-family:'Bangers',cursive;font-size:19px;letter-spacing:1px;background:var(--peach);
  padding:6px 12px;border-bottom:2.5px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:rgba(255,255,255,.55)}
th,td{border:1.5px solid var(--ink);padding:5px 8px;text-align:left}
th{background:var(--sky);font-weight:800}
td .w{font-weight:800;color:var(--p-word)}
td .t{color:var(--p-gram);font-weight:700}

/* questions */
.q{background:rgba(255,255,255,.5);border:3px solid var(--ink);border-radius:18px;
  padding:12px 14px;margin:12px 0;box-shadow:5px 5px 0 rgba(34,34,59,.2)}
.q .qtxt{font-weight:800;margin-bottom:10px;display:flex;gap:8px;line-height:1.45}
.q .badge{font-family:'Bangers',cursive;background:var(--pink);border:2.5px solid var(--ink);
  color:#fff;-webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:34px;height:34px;
  display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;font-family:'Nunito';font-weight:700;font-size:15px;
  background:rgba(255,255,255,.85);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;
  box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--yellow)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf5;border:2.5px dashed var(--ink);border-radius:14px;padding:12px;font-size:14px;line-height:1.6}
.exp h4{margin:0 0 6px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:18px}
.exp ul{margin:6px 0;padding-left:18px}
.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-phonetic{color:var(--p-phon);font-style:italic}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#f3e8ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}

/* footer */
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;
  background:rgba(255,255,255,.4);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky),var(--lav));transition:width .3s}
.progtxt{font-weight:800;font-size:12px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;
  -webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#ff6b9d,#ff9e6b);
  border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(34,34,59,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#fff0f6);border:4px solid var(--ink);border-radius:24px;
  max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(34,34,59,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);
  border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;
  -webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;
  padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:50px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:34px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--yellow);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--sky);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}

/* confetti */
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}

@media(max-width:820px){
  body{overflow:auto}
  .wrap{height:auto;min-height:100%}
  .split{grid-template-columns:1fr;padding:6px 10px}
  .pane{overflow:visible;max-height:none}
  .float{font-size:38px}
  footer{position:sticky;bottom:0}
}
</style>
</head>
<body>
<div id="bgart">
  <span class="float" style="left:6%;top:14%;animation-delay:0s">🎸</span>
  <span class="float" style="left:82%;top:10%;animation-delay:1.2s">🎤</span>
  <span class="float" style="left:14%;top:74%;animation-delay:2s">🌍</span>
  <span class="float" style="left:74%;top:66%;animation-delay:.6s">🏖️</span>
  <span class="float" style="left:46%;top:40%;animation-delay:1.8s">⭐</span>
  <span class="float" style="left:90%;top:44%;animation-delay:2.6s">📚</span>
</div>

<div class="wrap">
  <header>
    <h1>💥 TEST 5 · COMIC ENGLISH 💥</h1>
    <div class="sub">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên</div>
  </header>

  <div class="split">
    <div class="pane" id="leftPane"><div class="pane-title">📖 Bài đọc / Reading</div></div>
    <div class="pane" id="rightPane"><div class="pane-title">✏️ Bài tập / Exercises</div></div>
  </div>

  <footer>
    <span class="progtxt" id="ptxt">0/24</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <button class="submit" onclick="openSubmit()">🎯 NỘP BÀI</button>
  </footer>
</div>

<!-- name modal -->
<div class="overlay" id="nameOv">
  <div class="modal">
    <h2>🏆 Nhập tên để nộp bài</h2>
    <input id="nameIn" placeholder="Tên học sinh...">
    <div class="err" id="nameErr"></div>
    <button class="mbtn" onclick="grade()">Nộp bài ➜</button>
  </div>
</div>

<!-- score modal -->
<div class="overlay" id="scoreOv">
  <div class="modal">
    <h2 id="hi"></h2>
    <div class="score-big" id="scoreRaw"></div>
    <div class="score-10" id="score10"></div>
    <div class="gifbox" id="gifbox"></div>
    <div class="comment" id="comment"></div>
    <button class="mbtn" onclick="document.getElementById('scoreOv').style.display='none'">Đóng</button>
  </div>
</div>

<script>
/* ================= DATA ================= */
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"🔤 Vocabulary Development",
 left:`
  <div class="gloss"><div class="gh">📚 Từ khoá cần nhớ</div>
  <table><tr><th>Từ</th><th>Loại</th><th>Nghĩa</th></tr>
  <tr><td><span class="w">memorable</span></td><td><span class="t">adj</span></td><td>đáng nhớ</td></tr>
  <tr><td><span class="w">arrest</span></td><td><span class="t">v</span></td><td>bắt giữ</td></tr>
  <tr><td><span class="w">landmark</span></td><td><span class="t">n</span></td><td>địa danh nổi tiếng</td></tr>
  <tr><td><span class="w">anniversary</span></td><td><span class="t">n</span></td><td>lễ kỷ niệm</td></tr>
  <tr><td><span class="w">nearby</span></td><td><span class="t">adj</span></td><td>gần đó</td></tr>
  <tr><td><span class="w">glamorous</span></td><td><span class="t">adj</span></td><td>lộng lẫy, hào nhoáng</td></tr>
  <tr><td><span class="w">property</span></td><td><span class="t">n</span></td><td>nhà đất, bất động sản</td></tr>
  <tr><td><span class="w">access</span></td><td><span class="t">n</span></td><td>quyền truy cập</td></tr>
  <tr><td><span class="w">gadget</span></td><td><span class="t">n</span></td><td>thiết bị nhỏ tiện dụng</td></tr>
  </table></div>
  <div class="rd"><p><b>Exercise A & B:</b> Choose the correct word to complete the sentence.<br>
  <b>Exercise C:</b> Word bank – region · <b>property</b> · <b>gadget</b> · conflict · desire · issue · <b>access</b></p></div>`,
 qs:[
  {n:"1",q:"What an amazing singer! It was a(n) ______ performance.",
   opts:[opt("memorable","đáng nhớ (adj)"),opt("connected","được kết nối (adj)"),opt("untouched","nguyên vẹn (adj)")],a:"memorable",
   exp:`<h4>🧠 Giải thích Câu 1</h4>
   <b>Dịch đề:</b> "Thật là một ca sĩ tuyệt vời! Đó là một buổi biểu diễn ______."
   <ul>
   <li><span class="p-word">memorable</span> ➔ <span class="p-mean">đáng nhớ (adj)</span></li>
   <li><span class="p-word">connected</span> ➔ <span class="p-mean">được kết nối (adj)</span></li>
   <li><span class="p-word">untouched</span> ➔ <span class="p-mean">nguyên vẹn, chưa động tới (adj)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-word">memorable</span> tạo <span class="p-grammar">collocation: a memorable performance</span> (buổi diễn đáng nhớ), khớp lời khen "amazing singer".<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">connected</span> (kết nối) và <span class="p-word">untouched</span> (nguyên vẹn) đều <span class="hl-red">sai ngữ cảnh</span>, không dùng để tả một buổi biểu diễn hay.`},
  {n:"2",q:"The police ______ the shop-lifter when he was trying to escape in a stolen car.",
   opts:[opt("arrested","bắt giữ (v)"),opt("allowed","cho phép (v)"),opt("communicated","giao tiếp (v)")],a:"arrested",
   exp:`<h4>🧠 Giải thích Câu 2</h4>
   <b>Dịch đề:</b> "Cảnh sát đã ______ tên trộm khi hắn cố trốn thoát bằng một chiếc xe ăn cắp."
   <ul>
   <li><span class="p-word">arrested</span> ➔ <span class="p-mean">bắt giữ (v)</span></li>
   <li><span class="p-word">allowed</span> ➔ <span class="p-mean">cho phép (v)</span></li>
   <li><span class="p-word">communicated</span> ➔ <span class="p-mean">giao tiếp (v)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">the police + arrested + someone</span> = cảnh sát bắt giữ ai đó, đúng logic với "tên trộm".<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">allowed</span> (cho phép hắn trốn – <span class="hl-red">vô lý</span>); <span class="p-word">communicated</span> (giao tiếp – <span class="hl-red">sai nghĩa</span>).`},
  {n:"3",q:"The London Eye is one of the most famous ______ in London.",
   opts:[opt("landmarks","địa danh (n)"),opt("cultures","văn hoá (n)"),opt("emotions","cảm xúc (n)")],a:"landmarks",
   exp:`<h4>🧠 Giải thích Câu 3</h4>
   <b>Dịch đề:</b> "London Eye là một trong những ______ nổi tiếng nhất ở London."
   <ul>
   <li><span class="p-word">landmarks</span> ➔ <span class="p-mean">địa danh, thắng cảnh (n)</span></li>
   <li><span class="p-word">cultures</span> ➔ <span class="p-mean">các nền văn hoá (n)</span></li>
   <li><span class="p-word">emotions</span> ➔ <span class="p-mean">cảm xúc (n)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> London Eye là một công trình/địa điểm nổi tiếng ➔ <span class="p-word">landmark</span> (địa danh).<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">cultures</span> (văn hoá – trừu tượng) và <span class="p-word">emotions</span> (cảm xúc) <span class="hl-red">không phải địa điểm</span>.`},
  {n:"4",q:"Alex and Marian celebrated their wedding ______ last Sunday.",
   opts:[opt("anniversary","lễ kỷ niệm (n)"),opt("development","sự phát triển (n)"),opt("landmark","địa danh (n)")],a:"anniversary",
   exp:`<h4>🧠 Giải thích Câu 4</h4>
   <b>Dịch đề:</b> "Alex và Marian đã kỷ niệm ______ đám cưới vào Chủ nhật tuần trước."
   <ul>
   <li><span class="p-word">anniversary</span> ➔ <span class="p-mean">lễ kỷ niệm (n)</span></li>
   <li><span class="p-word">development</span> ➔ <span class="p-mean">sự phát triển (n)</span></li>
   <li><span class="p-word">landmark</span> ➔ <span class="p-mean">địa danh (n)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">wedding anniversary</span> là cụm cố định = kỷ niệm ngày cưới.<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">development</span> và <span class="p-word">landmark</span> <span class="hl-red">không đi với "wedding"</span>.`},
  {n:"5",q:"Alex had booked a table in a(n) ______ restaurant.",
   opts:[opt("nearby","gần đó (adj)"),opt("situated","toạ lạc (adj)"),opt("accurate","chính xác (adj)")],a:"nearby",
   exp:`<h4>🧠 Giải thích Câu 5</h4>
   <b>Dịch đề:</b> "Alex đã đặt bàn tại một nhà hàng ______."
   <ul>
   <li><span class="p-word">nearby</span> ➔ <span class="p-mean">gần đó (adj)</span></li>
   <li><span class="p-word">situated</span> ➔ <span class="p-mean">toạ lạc (adj/v-ed)</span></li>
   <li><span class="p-word">accurate</span> ➔ <span class="p-mean">chính xác (adj)</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">a nearby + noun</span> (a nearby restaurant) – tính từ đứng trực tiếp trước danh từ.<br>
   <span class="hl-red">Tại sao sai:</span> <span class="p-word">situated</span> cần địa điểm phía sau (<span class="p-grammar">situated in/near...</span>), <span class="hl-red">không đứng trực tiếp trước restaurant</span>; <span class="p-word">accurate</span> (chính xác) không tả nhà hàng.`},
  {n:"6",q:"Marian looked ______ in her red dress.",
   opts:[opt("glamorous","lộng lẫy (adj)"),opt("several","vài (adj)"),opt("grassy","đầy cỏ (adj)")],a:"glamorous",
   exp:`<h4>🧠 Giải thích Câu 6</h4>
   <b>Dịch đề:</b> "Marian trông ______ trong chiếc váy đỏ."
   <ul>
   <li><span class="p-word">glamorous</span> ➔ <span class="p-mean">lộng lẫy, quyến rũ (adj)</span></li>
   <li><span class="p-word">several</span> ➔ <span class="p-mean">một vài (adj/lượng từ)</span></li>

 left:`
 <div class="rd"><p><b>PART 2 (Q6–10):</b> People are looking for a holiday destination in Greece. Match each person to the most suitable resort.</p></div>
 <div class="resort"><b>Corfu</b> — The classic Greek family destination. A two-kilometre beach with no bars or nightclubs. Daily children's club activities; parents welcome.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Điểm đến gia đình cổ điển ở Corfu. Bãi biển 2 km, không quán bar/hộp đêm. Có câu lạc bộ trẻ em mỗi ngày, bố mẹ được tham gia.</div></div>
 <div class="resort"><b>Cape Attica</b> — A few hundred metres from historic Cape Sounio, fifty minutes from Athens. Daily trips to the Acropolis and famous landmarks. Night bus for a full experience of Athens' nightlife.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Cách di tích Cape Sounio vài trăm mét, 50 phút từ Athens. Có chuyến đi hằng ngày tới Acropolis. Xe buýt đêm cho trải nghiệm trọn vẹn cuộc sống về đêm ở Athens.</div></div>
 <div class="resort"><b>Mount Athos</b> — A religious peninsula untouched by modern development, beautiful natural scenery. A male-only area, home to monasteries; peaceful enough for time alone.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Bán đảo tôn giáo chưa bị hiện đại hoá, cảnh đẹp. Khu vực chỉ dành cho nam giới, có các tu viện; yên tĩnh để ở một mình.</div></div>
 <div class="resort"><b>Mykonos</b> — Internationally famous for glamorous clubs and bars, attracting the rich and famous. A unique party atmosphere. Ferries available for short trips to nearby islands.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Nổi tiếng với câu lạc bộ, quán bar hào nhoáng, thu hút người giàu và nổi tiếng. Không khí tiệc tùng độc đáo. Có phà đi các chuyến ngắn tới đảo lân cận.</div></div>
 <div class="resort"><b>Crete</b> — Exotic beaches in the south. The famous Samaria canyon, longest in Europe, well worth a visit for the very active and fit if you put in the legwork.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Bãi biển kỳ lạ ở phía nam. Hẻm núi Samaria dài nhất châu Âu, đáng thăm với người năng động, khoẻ nếu chịu bỏ công.</div></div>
 <div class="resort"><b>Thessalonica</b> — Shopping in Greece's second biggest city; all the top designers. Then enjoy traditional nightlife in many live music clubs.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Mua sắm ở thành phố lớn thứ hai Hy Lạp, có mọi nhà thiết kế hàng đầu. Sau đó tận hưởng cuộc sống về đêm ở nhiều câu lạc bộ nhạc sống.</div></div>
 <div class="resort"><b>Peloponnesian Tour</b> — A tour of historic Peloponnese (Sparta, Argos, Corinth). Comfortable, peaceful hotels with the best local food and wines. Perfect for learning Greek history and culture.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Tham quan vùng Peloponnese lịch sử (Sparta, Argos, Corinth). Khách sạn thoải mái, yên bình, ẩm thực & rượu vang địa phương. Hoàn hảo để tìm hiểu lịch sử, văn hoá Hy Lạp.</div></div>
 <div class="resort"><b>Santorini</b> — A volcanic island unique among the Greek islands, with a magic of its own, though fewer beaches. Spectacular sunset views. The perfect place for people who are in love.
   <button class="tbtn" onclick="tg(this)">🌟 Dịch</button><div class="trans">Đảo núi lửa độc nhất giữa các đảo Hy Lạp, có sức hút riêng dù ít bãi biển. Hoàng hôn ngoạn mục. Nơi hoàn hảo cho những người đang yêu.</div></div>

{
 title:"🎸 Reading · Part 3",
 left:`
 <div class="rd"><p><b>PART 3 (Q11–15):</b> How to follow your dreams — <i>by Paul Staples</i></p></div>
 <div class="rd">
   <p>I have had many years as a successful rock star, but will always remember how it all started and how I formed my first band. At sixteen I was still growing up in a bad part of town. I didn't have any way to express myself; I was disappointed by the terrible state of the neighbourhood and the unfairness that existed. Rich people, who had everything, lived just one mile away, while we had nothing, and could only hope for the worst of jobs.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Tôi đã có nhiều năm là ngôi sao nhạc rock thành công, nhưng luôn nhớ mọi thứ bắt đầu ra sao và tôi lập ban nhạc đầu tiên thế nào. Năm 16 tuổi tôi vẫn lớn lên ở một khu phố tồi tàn. Tôi không có cách nào thể hiện bản thân; tôi thất vọng vì tình trạng tệ của khu phố và sự bất công đang tồn tại. Người giàu, những người có tất cả, sống cách chỉ một dặm, còn chúng tôi chẳng có gì và chỉ hy vọng vào những công việc tệ nhất.</div></div>
 <div class="rd">
   <p>One night, while I was at a friend's house we found a pair of electric guitars and started playing. We pretty much taught ourselves the music, and when a couple of other guys, who really knew how to play, joined us I knew we had something. With my songs, I could express far more emotion and I could communicate with other people. Soon after that we set up our own band.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Một đêm nọ, khi ở nhà một người bạn, chúng tôi tìm thấy cặp guitar điện và bắt đầu chơi. Chúng tôi gần như tự học, và khi vài người khác thực sự biết chơi tham gia, tôi biết mình có tiềm năng. Nhờ những bài hát, tôi bày tỏ được nhiều cảm xúc hơn và giao tiếp với người khác. Ngay sau đó chúng tôi lập ban nhạc riêng.</div></div>
 <div class="rd">
   <p>The songs we write are still very important to us. They're about telling others how we feel about the problems and issues around us; crime, unemployment, exploitation, and the inequality present in the country. Of course, we are also expressing our own dreams and desires. It is amazing to be on stage and have twenty thousand people sing the songs that you write, songs that are about people like them, and in the end, these songs are for people like them.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Những bài hát chúng tôi viết vẫn rất quan trọng. Chúng nói cho người khác biết chúng tôi cảm nhận thế nào về các vấn đề xung quanh: tội phạm, thất nghiệp, bóc lột và sự bất bình đẳng trong đất nước. Tất nhiên, chúng tôi cũng thể hiện ước mơ và khao khát của mình. Thật tuyệt khi đứng trên sân khấu và có hai mươi nghìn người hát bài bạn viết — những bài về những người như họ, và cuối cùng dành cho những người như họ.</div></div>
 <div class="rd">
   <p>Our music has been very popular and is worth listening to, as it is the ordinary people who have made it such a success. We sing what we feel, so we're sure that if people listen to the music, they'll understand our message, too.</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Âm nhạc của chúng tôi rất được yêu thích và đáng nghe, bởi chính những người bình thường đã làm nên thành công đó. Chúng tôi hát điều mình cảm nhận, nên chắc chắn nếu mọi người nghe, họ cũng sẽ hiểu thông điệp của chúng tôi.</div></div>
 <div class="rd">
   <p>So my advice to anyone dreaming of becoming a rock star is to never give up! Learn how to play a musical instrument and take vocal lessons. Put together a band and practise as much as you can. Write your own music, record it and let your friends listen to it. Play in front of an audience. Make a Youtube channel with your music and videos of live performances. You will, sooner or later, find yourself with a larger fan base and this will be the time when the adventure will begin!</p>
   <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
   <div class="trans">Vậy lời khuyên của tôi cho ai mơ trở thành ngôi sao nhạc rock là đừng bao giờ bỏ cuộc! Hãy học chơi một nhạc cụ và học thanh nhạc. Lập ban nhạc và tập luyện nhiều nhất có thể. Viết nhạc của riêng bạn, thu âm và cho bạn bè nghe. Biểu diễn trước khán giả. Lập kênh YouTube với nhạc và video biểu diễn trực tiếp. Sớm muộn bạn sẽ có lượng fan lớn hơn, và đó là lúc cuộc phiêu lưu bắt đầu!</div></div>

   <li>No longer connected ➔ <span class="p-mean">Không còn kết nối như xưa</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Dẫn chứng: "telling others how we feel about the problems... I could <span class="p-word">communicate</span> with other people" = âm nhạc để bình luận xã hội & giao tiếp.<br>
   <span class="hl-red">Tại sao sai:</span> Không vì "<span class="hl-red">money and being famous</span>"; không vì "<span class="hl-red">commercial music/more money</span>"; anh <span class="hl-red">vẫn</span> thấy kết nối với khán giả (ngược với "no longer connected").`}
 ]
}
];

/* ================= RENDER ================= */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    TOTAL++;
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`;
    card.appendChild(head);
    const box=document.createElement('div'); box.className='opts';
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.textContent = o.en;
      b.dataset.val=o.en;
      b.onclick=()=>choose(b,card,qid,q.a);
      box.appendChild(b);
    });
    card.appendChild(box);
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;

/* ================= INTERACTION ================= */
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';
  t.style.display=open?'none':'block';btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}

let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}

function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok = btn.dataset.val===correct;
  answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
       card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
       setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block';
  const done=Object.keys(answered).length;
  document.getElementById('ptxt').textContent=done+'/'+TOTAL;
  document.getElementById('fill').style.width=(done/TOTAL*100)+'%';
}

function confetti(){const cols=['#ff6b9d','#ffd6a5','#a8f0d1','#a5d8ff','#d0bfff','#fff3b0'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1600+Math.random()*1200;
    d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});
    setTimeout(()=>d.remove(),dur);}}

/* ================= SUBMIT / SCORE ================= */
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100;
  const ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms MS Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn')&&document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
