<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms MS Chí Nên - English Master Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #4facfe;
            --secondary-color: #00f2fe;
            --text-color: #2c3e50;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --correct-color: #00D26A;
            --wrong-color: #FF4757;
            --shadow-color: rgba(0,0,0,0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Prevent cheating by copy paste */
        }

        body {
            font-family: 'Quicksand', sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f2f5;
            transition: background 0.5s ease;
        }

        /* --- Dynamic Themes --- */
        /* Theme 1: Snake (Nature/Danger) */
        body.theme-snake {
            --primary-color: #2ecc71;
            --secondary-color: #1e8449;
            background-image: radial-gradient(circle at 50% 50%, rgba(46, 204, 113, 0.2), rgba(30, 132, 73, 0.4)), 
                              url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='30' font-size='20'%3E🐍%3C/text%3E%3Ctext x='60' y='70' font-size='20'%3E🌿%3C/text%3E%3C/svg%3E");
        }

        /* Theme 2: History (Old Paper/Royal) */
        body.theme-history {
            --primary-color: #e74c3c;
            --secondary-color: #2c3e50;
            background-image: radial-gradient(circle at 50% 50%, rgba(231, 76, 60, 0.2), rgba(44, 62, 80, 0.4)), 
                              url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='20' y='40' font-size='24'%3E📮%3C/text%3E%3Ctext x='70' y='80' font-size='24'%3E👑%3C/text%3E%3C/svg%3E");
        }

        /* --- Header --- */
        header {
            height: 60px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 100;
            position: relative;
        }

        .teacher-name {
            font-size: 0.9rem;
            color: #7f8c8d;
            font-weight: 700;
        }

        .timer-container {
            background: #333;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .timer-container:hover {
            transform: scale(1.05);
        }

        .nav-controls button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: all 0.1s;
        }

        .nav-controls button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* --- Main Layout --- */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .panel {
            width: 50%;
            padding: 30px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

        /* --- Left Panel (Reading) --- */
        .reading-card {
            background: var(--bg-glass);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid white;
        }

        .reading-title {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .reading-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #34495e;
            text-align: justify;
        }

        .gap-marker {
            font-weight: bold;
            color: var(--primary-color);
            background: rgba(255,255,255,0.8);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px dashed var(--primary-color);
        }

        .tools-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .translate-btn {
            background: linear-gradient(45deg, #FFC312, #EE5A24);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 0 #b33939;
            transition: all 0.2s;
        }

        .translate-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .translation-box {
            display: none;
            background: #fff8e1;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #FFC312;
            margin-top: 10px;
            font-style: italic;
        }

        .glossary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-top: 20px;
        }

        .glossary-table th {
            background: var(--primary-color);
            color: white;
            padding: 12px;
            text-align: left;
        }

        .glossary-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #555;
        }

        /* --- Right Panel (Exercises) --- */
        .question-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .q-number {
            background: var(--secondary-color);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 0 #dcdcdc;
        }

        .option-btn:hover:not(.disabled) {
            transform: scale(1.02);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        .option-btn.correct {
            background: var(--correct-color);
            color: white;
            border-color: var(--correct-color);
            box-shadow: 0 4px 0 #00a352;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .option-btn.wrong {
            background: var(--wrong-color);
            color: white;
            border-color: var(--wrong-color);
            box-shadow: 0 4px 0 #d63031;
            animation: shake 0.5s;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
            transform: none !important;
            box-shadow: none !important;
        }

        .explanation-box {
            display: none;
            margin-top: 20px;
            background: #f1f9ff;
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 20px;
            animation: slideDown 0.5s ease;
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .exp-detail {
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        .exp-detail strong {
            color: #d63031;
        }

        /* --- Animations --- */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Overlay/Modals --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-weight: 800;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--correct-color);
            margin: 20px 0;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        }

        .big-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .big-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        
        /* Submit Button */
        #finish-btn {
            width: 100%;
            margin-top: 20px;
            background: #2c3e50;
        }

    </style>
</head>
<body>

    <header>
        <div class="teacher-name">
            <i class="fas fa-graduation-cap"></i> TEST CREATED BY: MS MS Chí Nên
        </div>
        
        <div class="timer-container" id="timer-btn" onclick="toggleTimer()">
            <i class="fas fa-clock"></i> <span id="time-display">10:00</span>
        </div>

        <div class="nav-controls">
            <button id="switch-part-btn" onclick="switchPart()">
                Next Passage <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </header>

    <div class="main-container">
        <div class="panel left-panel" id="reading-panel">
            </div>

        <div class="panel right-panel" id="exercise-panel">
            <button id="finish-btn" class="big-btn" onclick="finishTest()" style="display:none">NỘP BÀI <i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="modal-overlay" id="score-modal">
        <div class="modal-card">
            <div class="modal-title">KẾT QUẢ CỦA BẠN</div>
            <div id="score-message" style="font-size: 1.2rem; color: #555; margin-bottom: 10px;"></div>
            <div class="score-display" id="final-score">0/12</div>
            <button class="big-btn" onclick="closeModal()">Xem lại bài làm</button>
        </div>
    </div>
    
    <div class="modal-overlay" id="timeout-modal">
        <div class="modal-card">
            <div class="modal-title">⏰ HẾT GIỜ!</div>
            <p style="margin-bottom: 20px; font-size: 1.1rem; line-height: 1.5;">
                Đã hết thời gian làm bài chuẩn (10 phút).<br>
                Bạn vẫn có thể tiếp tục làm, nhưng hãy nhớ luyện tập tốc độ nhé!
            </p>
            <button class="big-btn" onclick="closeTimeoutModal()">Tiếp tục làm bài</button>
        </div>
    </div>

    <canvas id="confetti" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999;"></canvas>

    <script>
        // --- DATA ---
        const quizData = [
            {
                id: "part1",
                title: "The Black Mamba",
                themeClass: "theme-snake",
                text: `
                    <p>A bite from the Black Mamba is <span class="gap-marker">(1)</span> 'the kiss of death' in South Africa and it is <span class="gap-marker">(2)</span> a very dangerous snake.</p>
                    <p>The venom can kill a person within 30 minutes to a few hours <span class="gap-marker">(3)</span> medical help. It is one of the world’s fastest snakes as well and can travel at up to 16 kilometres an hour, though it uses this speed to <span class="gap-marker">(4)</span> danger rather than to attack. In fact, the Black Mamba is a rather <span class="gap-marker">(5)</span> creature and will avoid people if possible. It can measure anywhere between two and four metres long and, <span class="gap-marker">(6)</span> on the area where it lives, can be a different colour, from brown to green to grey. It gets its name from the inside of its mouth, which is ink black.</p>
                `,
                translation: `
                    <p><strong>Dịch:</strong> Một vết cắn từ rắn Mamba đen được <strong>gọi là</strong> 'nụ hôn của tử thần' ở Nam Phi và nó <strong>chắc chắn</strong> là một loài rắn rất nguy hiểm.</p>
                    <p>Nọc độc có thể giết chết một người trong vòng 30 phút đến vài giờ <strong>nếu không có</strong> sự trợ giúp y tế. Nó cũng là một trong những loài rắn nhanh nhất thế giới và có thể di chuyển với tốc độ lên đến 16 km/h, mặc dù nó sử dụng tốc độ này để <strong>thoát khỏi</strong> nguy hiểm hơn là để tấn công. Trên thực tế, Mamba đen là một sinh vật khá <strong>nhút nhát</strong> và sẽ tránh con người nếu có thể. Nó có thể dài từ hai đến bốn mét và, <strong>tùy thuộc vào</strong> khu vực nơi nó sống, có thể có màu khác nhau, từ nâu đến xanh lá cây đến xám. Nó được đặt tên theo màu bên trong miệng của nó, màu đen như mực.</p>
                `,
                glossary: [
                    { word: "Venom", type: "n", meaning: "Nọc độc" },
                    { word: "Creature", type: "n", meaning: "Sinh vật" },
                    { word: "Medical help", type: "n.phr", meaning: "Sự trợ giúp y tế" },
                    { word: "Avoid", type: "v", meaning: "Tránh xa" },
                    { word: "Attack", type: "v", meaning: "Tấn công" },
                    { word: "Measure", type: "v", meaning: "Đo lường / Có kích thước" }
                ],
                questions: [
                    {
                        id: 1,
                        options: ["A. said", "B. made", "C. called", "D. titled"],
                        correct: 2, // C
                        explanation: `
                            <strong>Đáp án đúng: C. called</strong><br>
                            - Cấu trúc: <em>be called + Noun</em> (được gọi là...).<br>
                            - <em>Said</em> thường đi với 'to be' hoặc mệnh đề that.<br>
                            - <em>Titled</em> dùng cho tước hiệu hoặc tên sách/phim.<br>
                            -> Dịch: Vết cắn được gọi là 'nụ hôn tử thần'.
                        `
                    },
                    {
                        id: 2,
                        options: ["A. certainly", "B. exactly", "C. just", "D. fairly"],
                        correct: 0, // A
                        explanation: `
                            <strong>Đáp án đúng: A. certainly</strong><br>
                            - <em>Certainly</em> (chắc chắn): Nhấn mạnh sự thật hiển nhiên.<br>
                            - <em>Exactly</em> (chính xác): Dùng cho độ chính xác của số liệu/vị trí.<br>
                            - <em>Fairly</em> (khá): Mức độ nhẹ hơn, không hợp ngữ cảnh nguy hiểm chết người.<br>
                            -> Dịch: Nó chắc chắn là một loài rắn rất nguy hiểm.
                        `
                    },
                    {
                        id: 3,
                        options: ["A. outside", "B. besides", "C. away", "D. without"],
                        correct: 3, // D
                        explanation: `
                            <strong>Đáp án đúng: D. without</strong><br>
                            - Ngữ cảnh: Chết trong 30 phút nếu <strong>không có</strong> sự trợ giúp y tế.<br>
                            - <em>Without</em>: Không có.<br>
                            - <em>Besides</em>: Bên cạnh đó/Ngoài ra.<br>
                            - <em>Outside</em>: Bên ngoài.
                        `
                    },
                    {
                        id: 4,
                        options: ["A. break", "B. escape", "C. lose", "D. run"],
                        correct: 1, // B
                        explanation: `
                            <strong>Đáp án đúng: B. escape</strong><br>
                            - Cụm từ: <em>escape danger</em> (thoát khỏi nguy hiểm).<br>
                            - <em>Run</em> phải đi với 'away from'.<br>
                            - <em>Lose</em> (thua/mất).<br>
                            -> Rắn dùng tốc độ để chạy trốn chứ không phải tấn công.
                        `
                    },
                    {
                        id: 5,
                        options: ["A. shy", "B. brave", "C. afraid", "D. soft"],
                        correct: 0, // A
                        explanation: `
                            <strong>Đáp án đúng: A. shy</strong><br>
                            - Dựa vào câu sau: "will avoid people if possible" (sẽ tránh người nếu có thể).<br>
                            -> Đây là đặc điểm của sinh vật <em>nhút nhát</em> (shy).<br>
                            - <em>Brave</em> (dũng cảm) >< Avoid people.<br>
                            - <em>Afraid</em> (sợ hãi) thường là 'afraid OF something'.
                        `
                    },
                    {
                        id: 6,
                        options: ["A. relying", "B. choosing", "C. depending", "D. taking"],
                        correct: 2, // C
                        explanation: `
                            <strong>Đáp án đúng: C. depending</strong><br>
                            - Cụm từ cố định (Collocation): <em>Depending on</em> (Tùy thuộc vào).<br>
                            - <em>Relying on</em>: Dựa dẫm vào (mang tính tin tưởng/nhờ vả).<br>
                            -> Màu sắc thay đổi tùy thuộc vào khu vực sống.
                        `
                    }
                ]
            },
            {
                id: "part2",
                title: "The Penny Black",
                themeClass: "theme-history",
                text: `
                    <p>In 1840, The Penny Black became the <span class="gap-marker">(1)</span> sticky postage stamp in the world. Before this the <span class="gap-marker">(2)</span> of posting something in the UK was very expensive. This depended on distance and how many sheets of paper were being sent and was paid by the person receiving the post. The idea of paying in advance was <span class="gap-marker">(3)</span> to parliament and in 1839 this became law.</p>
                    <p>A <span class="gap-marker">(4)</span> was held to find the best way of sending post. The first suggestion attempted was a special envelope or ‘lettersheet’ with a stamp attached, but this wasn’t <span class="gap-marker">(5)</span> and in the end the stamp itself was used with a picture of Queen Victoria and the price – one penny. However, the colour was a problem as it was difficult to cancel the stamp after it had been <span class="gap-marker">(6)</span>. This was eventually changed to red and black ink was used to cancel it.</p>
                `,
                translation: `
                    <p><strong>Dịch:</strong> Năm 1840, Penny Black trở thành con tem bưu chính dính <strong>đầu tiên</strong> trên thế giới. Trước đó, <strong>chi phí</strong> gửi bưu kiện ở Anh rất đắt đỏ. Điều này phụ thuộc vào khoảng cách và số lượng tờ giấy được gửi và được trả bởi người nhận thư. Ý tưởng trả trước đã được <strong>đề xuất</strong> lên quốc hội và năm 1839 điều này đã trở thành luật.</p>
                    <p>Một <strong>cuộc thi</strong> đã được tổ chức để tìm ra cách gửi thư tốt nhất. Gợi ý đầu tiên được thử nghiệm là một phong bì đặc biệt hoặc 'tờ thư' có dán tem, nhưng nó không <strong>phổ biến</strong> và cuối cùng con tem đã được sử dụng với hình ảnh Nữ hoàng Victoria và giá – một xu. Tuy nhiên, màu sắc là một vấn đề vì rất khó để hủy con tem sau khi nó đã được <strong>sử dụng</strong>. Cuối cùng, nó đã được đổi thành màu đỏ và mực đen được dùng để hủy nó.</p>
                `,
                glossary: [
                    { word: "Postage stamp", type: "n.phr", meaning: "Tem thư" },
                    { word: "Parliament", type: "n", meaning: "Quốc hội / Nghị viện" },
                    { word: "In advance", type: "idiom", meaning: "Trước (trả trước)" },
                    { word: "Attempt", type: "v", meaning: "Cố gắng / Thử nghiệm" },
                    { word: "Cancel", type: "v", meaning: "Hủy bỏ (đóng dấu hủy tem)" },
                    { word: "Eventually", type: "adv", meaning: "Cuối cùng thì" }
                ],
                questions: [
                    {
                        id: 1,
                        options: ["A. basic", "B. first", "C. beginning", "D. start"],
                        correct: 1, // B
                        explanation: `
                            <strong>Đáp án đúng: B. first</strong><br>
                            - Penny Black là con tem <em>đầu tiên</em> trên thế giới.<br>
                            - <em>Basic</em>: Cơ bản.<br>
                            - <em>Beginning/Start</em>: Sự bắt đầu (Danh từ/Ving), không đứng trước tính từ 'sticky' như một tính từ chỉ thứ tự hợp lý ở đây.
                        `
                    },
                    {
                        id: 2,
                        options: ["A. money", "B. amount", "C. cost", "D. payment"],
                        correct: 2, // C
                        explanation: `
                            <strong>Đáp án đúng: C. cost</strong><br>
                            - <em>The cost of V-ing</em>: Chi phí làm việc gì đó.<br>
                            - <em>Money</em>: Tiền (chung chung).<br>
                            - <em>Payment</em>: Sự thanh toán.<br>
                            -> Chi phí gửi thư rất đắt.
                        `
                    },
                    {
                        id: 3,
                        options: ["A. recommended", "B. said", "C. played", "D. ordered"],
                        correct: 0, // A
                        explanation: `
                            <strong>Đáp án đúng: A. recommended</strong><br>
                            - <em>Recommended to Parliament</em>: Được đề xuất/tiến cử lên Quốc hội.<br>
                            - <em>Ordered</em>: Ra lệnh (không phù hợp ngữ cảnh đề xuất ý tưởng mới).<br>
                            - <em>Said</em>: Nói.
                        `
                    },
                    {
                        id: 4,
                        options: ["A. match", "B. prize", "C. competition", "D. race"],
                        correct: 2, // C
                        explanation: `
                            <strong>Đáp án đúng: C. competition</strong><br>
                            - Ngữ cảnh: Tổ chức để "tìm ra cách tốt nhất" -> Đây là mục đích của một cuộc thi thiết kế.<br>
                            - <em>Race</em>: Cuộc đua (tốc độ).<br>
                            - <em>Match</em>: Trận đấu (thể thao).
                        `
                    },
                    {
                        id: 5,
                        options: ["A. dear", "B. popular", "C. famous", "D. common"],
                        correct: 1, // B
                        explanation: `
                            <strong>Đáp án đúng: B. popular</strong><br>
                            - Ngữ cảnh: Ý tưởng phong bì đặc biệt không được người dân yêu thích/đón nhận.<br>
                            - <em>Popular</em>: Phổ biến, được yêu thích.<br>
                            - <em>Common</em>: Thông thường.<br>
                            - <em>Famous</em>: Nổi tiếng (dùng cho người/địa danh).
                        `
                    },
                    {
                        id: 6,
                        options: ["A. near", "B. worn", "C. passed", "D. used"],
                        correct: 3, // D
                        explanation: `
                            <strong>Đáp án đúng: D. used</strong><br>
                            - Tem cần được hủy (đóng dấu) sau khi đã được <em>sử dụng</em> (để gửi thư) để tránh dùng lại.<br>
                            - <em>Passed</em>: Trôi qua.<br>
                            - <em>Worn</em>: Mòn/Mặc.
                        `
                    }
                ]
            }
        ];

        // --- STATE ---
        let currentPartIndex = 0;
        let scores = new Array(12).fill(null); // Null = not answered, 0 = wrong, 1 = correct
        let timerInterval;
        let timeLeft = 600; // 10 minutes
        let isTimerRunning = false;

        // --- AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // High pitch Ding
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else {
                // Low pitch Buzz
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- INITIALIZATION ---
        window.onload = function() {
            renderPart(0);
        };

        function renderPart(index) {
            const data = quizData[index];
            const body = document.body;
            
            // Set Theme
            body.className = data.themeClass;
            
            // Render Reading Text
            const readingPanel = document.getElementById('reading-panel');
            let glossaryHtml = '<table class="glossary-table"><thead><tr><th>Word</th><th>Type</th><th>Meaning</th></tr></thead><tbody>';
            data.glossary.forEach(g => {
                glossaryHtml += `<tr><td><strong>${g.word}</strong></td><td><em>${g.type}</em></td><td>${g.meaning}</td></tr>`;
            });
            glossaryHtml += '</tbody></table>';

            readingPanel.innerHTML = `
                <div class="reading-card">
                    <h2 class="reading-title">${data.title}</h2>
                    <div class="reading-text">${data.text}</div>
                    <div class="tools-section">
                        <button class="translate-btn" onclick="toggleTranslation()">
                            <i class="fas fa-language"></i> HIỆN BẢN DỊCH ĐẦY ĐỦ
                        </button>
                        <div class="translation-box" id="trans-box">${data.translation}</div>
                    </div>
                </div>
                <h3 style="color:var(--primary-color); margin-bottom:10px;"><i class="fas fa-book"></i> GLOSSARY (TỪ VỰNG)</h3>
                ${glossaryHtml}
            `;

            // Render Questions
            const exercisePanel = document.getElementById('exercise-panel');
            let questionsHtml = '';
            
            data.questions.forEach((q, qIdx) => {
                // Adjust global index based on part
                const globalQIdx = index === 0 ? qIdx : qIdx + 6; 
                const alreadyAnswered = scores[globalQIdx] !== null;
                
                let optionsHtml = '';
                q.options.forEach((opt, oIdx) => {
                    let btnClass = 'option-btn';
                    let onclick = `checkAnswer(${index}, ${qIdx}, ${oIdx}, this)`;
                    
                    if (alreadyAnswered) {
                        onclick = '';
                        btnClass += ' disabled';
                        if (oIdx === q.correct) btnClass += ' correct';
                        // if user chose wrong previously, we don't strictly save WHICH wrong one, but usually we just show correct one if revisiting.
                    }
                    
                    optionsHtml += `<button class="${btnClass}" onclick="${onclick}">${opt}</button>`;
                });

                let explanationDisplay = alreadyAnswered ? 'block' : 'none';

                questionsHtml += `
                    <div class="question-card" id="q-card-${index}-${qIdx}">
                        <div class="question-header">
                            <div class="q-number">${globalQIdx + 1}</div>
                        </div>
                        <div class="options-grid">
                            ${optionsHtml}
                        </div>
                        <div class="explanation-box" id="exp-${index}-${qIdx}" style="display: ${explanationDisplay}">
                            <div class="exp-header">
                                <img src="https://ui-avatars.com/api/?name=Mai+An&background=random" class="teacher-avatar" alt="Teacher">
                                Ms MS Chí Nên giải thích:
                            </div>
                            <div class="exp-detail">${q.explanation}</div>
                        </div>
                    </div>
                `;
            });

            // Handle "Next" or "Finish" button visibility
            const btnHtml = index === 0 
                ? `<div style="height:50px"></div>` // Spacer
                : `<button id="finish-btn" class="big-btn" onclick="finishTest()">NỘP BÀI <i class="fas fa-paper-plane"></i></button>`;

            exercisePanel.innerHTML = questionsHtml + btnHtml;
            exercisePanel.scrollTop = 0; // Reset scroll
            
            // Update Top Button
            const switchBtn = document.getElementById('switch-part-btn');
            if (index === 0) {
                switchBtn.innerHTML = `Next Passage <i class="fas fa-arrow-right"></i>`;
                switchBtn.onclick = switchPart;
            } else {
                switchBtn.innerHTML = `<i class="fas fa-arrow-left"></i> Previous Passage`;
                switchBtn.onclick = prevPart;
            }
        }

        function toggleTranslation() {
            const box = document.getElementById('trans-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function switchPart() {
            currentPartIndex = 1;
            renderPart(1);
        }

        function prevPart() {
            currentPartIndex = 0;
            renderPart(0);
        }

        function checkAnswer(partIdx, qIdx, selectedOptIdx, btnElement) {
            // Prevent multiple clicks
            const parent = btnElement.parentElement;
            if (parent.querySelectorAll('.disabled').length > 0) return;

            const globalQIdx = partIdx === 0 ? qIdx : qIdx + 6;
            const questionData = quizData[partIdx].questions[qIdx];
            const isCorrect = selectedOptIdx === questionData.correct;

            // Update UI
            const buttons = parent.querySelectorAll('.option-btn');
            buttons.forEach(b => b.classList.add('disabled')); // Disable all

            if (isCorrect) {
                btnElement.classList.add('correct');
                playSound('correct');
                fireConfetti(btnElement);
                scores[globalQIdx] = 1;
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                scores[globalQIdx] = 0;
                // Highlight correct answer
                buttons[questionData.correct].classList.add('correct');
            }

            // Show explanation
            const expBox = document.getElementById(`exp-${partIdx}-${qIdx}`);
            expBox.style.display = 'block';
        }

        function startTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    document.getElementById('timeout-modal').classList.add('active');
                    playSound('wrong');
                }
            }, 1000);
        }

        function toggleTimer() {
            if (timeLeft <= 0) return; // Finished
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('time-display').style.opacity = '0.5';
            } else {
                startTimer();
                document.getElementById('time-display').style.opacity = '1';
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('time-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function closeTimeoutModal() {
            document.getElementById('timeout-modal').classList.remove('active');
        }

        function finishTest() {
            // Calculate Score
            let correctCount = scores.filter(s => s === 1).length;
            const total = 12;
            
            const modal = document.getElementById('score-modal');
            const scoreMsg = document.getElementById('score-message');
            const finalScore = document.getElementById('final-score');
            
            let msg = "";
            const percentage = (correctCount / total) * 100;
            
            if (percentage === 100) msg = "🏆 THIÊN TÀI! Bạn đã làm đúng tuyệt đối!";
            else if (percentage >= 80) msg = "🌟 XUẤT SẮC! Bạn nắm rất chắc kiến thức.";
            else if (percentage >= 50) msg = "👍 LÀM TỐT LẮM! Cố gắng thêm chút nữa nhé.";
            else msg = "💪 CỐ LÊN NHÉ! Hãy xem kỹ lại phần giải thích.";

            scoreMsg.innerText = msg;
            finalScore.innerText = `${correctCount}/${total}`;
            
            modal.classList.add('active');
            
            if (percentage >= 50) {
                // Big celebration confetti
                const duration = 3000;
                const end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }
        }

        function closeModal() {
            document.getElementById('score-modal').classList.remove('active');
        }

        // --- CONFETTI LOGIC (Mini Library) ---
        // Simple manual canvas confetti for single-file requirement
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];

        function fireConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 5,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    life: 100
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 5, 5);
                if (p.life <= 0) particles.splice(i, 1);
            });
            requestAnimationFrame(updateConfetti);
        }
        updateConfetti();
        
        // External confetti lib simulation for the "Big Finish"
        // Since we can't link external scripts easily in prompt, the finishTest() logic calls a placeholder.
        // The fireConfetti above handles the button clicks locally.
        var confetti = function() {}; // Placeholder if needed

    </script>
</body>
</html>
