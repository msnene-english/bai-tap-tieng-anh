<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default Theme Variables */
            --primary-color: #2c3e50;
            --secondary-color: #f1c40f;
            --bg-emoji-svg: "";
            --text-color: #2d3436;
            --card-bg: rgba(255, 255, 255, 0.95);
            --correct-color: #00D26A;
            --wrong-color: #FF4757;
            --shadow-color: rgba(0,0,0,0.15);
        }

        * { box-sizing: border-box; transition: background-color 0.5s ease, border-color 0.3s ease, color 0.3s ease; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            background-color: #ecf0f1; /* Fallback */
            /* Dynamic Background using CSS Variables updated by JS */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.6) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.6) 0%, transparent 20%),
                var(--bg-emoji-svg);
            background-attachment: fixed;
            background-size: cover;
        }

        /* --- Header --- */
        header {
            height: 60px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            position: relative;
        }
        .teacher-brand { 
            font-weight: 800; font-size: 1.1rem; color: #555; 
            display: flex; align-items: center; gap: 10px;
        }
        .teacher-brand span { color: var(--primary-color); font-size: 1.3rem; }
        
        .timer-container { 
            font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1.4rem; 
            color: var(--wrong-color); display: flex; align-items: center; gap: 15px; 
        }
        #timer-btn {
            background: var(--primary-color); color: white; border: none; 
            padding: 8px 20px; border-radius: 20px; cursor: pointer; 
            font-weight: bold; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        #timer-btn:active { transform: translateY(4px); box-shadow: none; }

        /* --- Split Layout --- */
        .split-container {
            display: flex;
            height: calc(100vh - 60px);
        }
        .panel {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }
        .panel::-webkit-scrollbar { width: 8px; }
        .panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }

        /* --- Reading Section (Left) --- */
        #reading-section { border-right: 2px dashed rgba(0,0,0,0.1); background: rgba(255,255,255,0.3); backdrop-filter: blur(5px); }
        .reading-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-left: 6px solid var(--primary-color);
            position: relative;
        }
        .reading-title { 
            font-family: 'Quicksand', sans-serif; font-size: 2rem; font-weight: 800;
            color: var(--primary-color); margin-bottom: 20px; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .reading-content { 
            font-size: 1.15rem; line-height: 1.9; text-align: justify; color: #444; 
        }
        
        /* Highlight gaps in text */
        .gap-marker {
            display: inline-block;
            background: #eee;
            padding: 0 8px;
            border-radius: 4px;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        /* Glossary Table */
        .glossary-box { margin-top: 25px; border: 2px solid #eee; border-radius: 15px; overflow: hidden; background: #fff; }
        .glossary-header { background: var(--primary-color); color: #fff; padding: 10px 15px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .glossary-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        .glossary-table td { padding: 10px 15px; border-bottom: 1px solid #f1f1f1; }
        .glossary-table tr:last-child td { border-bottom: none; }
        .word-type { font-style: italic; color: #888; font-size: 0.85rem; }

        /* Translation */
        .translate-btn {
            background: white; border: 2px solid var(--primary-color); color: var(--primary-color);
            padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 700; 
            margin-top: 20px; display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 0 #eee;
        }
        .translate-btn:hover { transform: translateY(-2px); }
        .translate-btn:active { transform: translateY(2px); box-shadow: none; }
        .translation-text {
            display: none; margin-top: 15px; padding: 20px; 
            background: #f8f9fa; border-radius: 12px; 
            border-left: 4px solid var(--secondary-color); 
            font-style: italic; color: #555; line-height: 1.6;
        }

        /* --- Exercise Section (Right) --- */
        .question-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05); /* 3D effect base */
            border: 1px solid #eee;
        }
        .q-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .q-badge {
            background: var(--primary-color); color: white; 
            width: 35px; height: 35px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: 800; font-family: 'Quicksand', sans-serif;
        }
        .q-text { font-weight: 700; font-size: 1.1rem; color: #333; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn {
            background: #f1f2f6; border: none; 
            border-radius: 12px; padding: 15px; text-align: left; 
            cursor: pointer; font-family: 'Nunito', sans-serif; 
            font-weight: 700; font-size: 1rem; color: #57606f;
            box-shadow: 0 4px 0 #dfe4ea; /* 3D Button */
            position: relative; overflow: hidden;
        }
        .option-btn:hover { background: #dfe4ea; transform: translateY(-2px); }
        .option-btn:active { transform: translateY(2px); box-shadow: none; }
        
        .option-btn.correct { 
            background: var(--correct-color); color: white; 
            box-shadow: 0 4px 0 #00b85c; 
        }
        .option-btn.wrong { 
            background: var(--wrong-color); color: white; 
            box-shadow: 0 4px 0 #ff2e43; 
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; 
        }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* Explanation Box */
        .explanation-box {
            display: none;
            margin-top: 20px;
            background: #fff;
            border: 2px solid var(--secondary-color);
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            animation: slideDown 0.3s ease-out;
        }
        .exp-header {
            background: var(--secondary-color);
            color: #fff; /* Depends on secondary color brightness, usually white or dark */
            color: #2d3436; /* Safer contrast */
            padding: 8px 15px;
            font-weight: 800; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px;
        }
        .exp-content { padding: 15px; font-size: 0.95rem; line-height: 1.6; }
        .exp-step { margin-bottom: 10px; }
        .highlight-vocab { color: #d63031; font-weight: bold; }
        .logic-reason { color: #0984e3; font-weight: bold; }

        /* --- Animations --- */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Submit & Modal --- */
        .submit-container { text-align: center; margin-top: 40px; padding-bottom: 60px; }
        .submit-btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe); 
            color: white; font-size: 1.5rem; border: none; 
            padding: 15px 50px; border-radius: 50px; cursor: pointer; 
            font-weight: 800; box-shadow: 0 10px 25px rgba(108, 92, 231, 0.4);
            font-family: 'Quicksand', sans-serif;
        }
        .submit-btn:hover { transform: scale(1.05); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 1000; 
            display: none; justify-content: center; align-items: center;
        }
        .result-card {
            background: white; width: 90%; max-width: 500px; 
            border-radius: 30px; padding: 40px; text-align: center; 
            position: relative; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--primary-color);
        }
        @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #confetti-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 999; }

        /* Responsive */
        @media (max-width: 768px) {
            .split-container { flex-direction: column; height: auto; overflow: visible; }
            .panel { height: auto; overflow: visible; }
            #reading-section { border-right: none; border-bottom: 2px dashed #ccc; padding-bottom: 40px; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="teacher-brand">
            <span>👩‍🏫</span> Ms MS Chí Nên
        </div>
        <div class="timer-container">
            <span>⏱️</span>
            <span id="timer-display">10:00</span>
            <button id="timer-btn" onclick="toggleTimer()">BẮT ĐẦU</button>
        </div>
    </header>

    <div class="split-container">
        <div class="panel" id="reading-section">
            </div>

        <div class="panel" id="exercise-section">
            <div id="exercise-container">
                </div>
            <div class="submit-container">
                <button class="submit-btn" onclick="showResults()">NỘP BÀI 🏆</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="result-card">
            <h1 style="color: var(--primary-color); font-family:'Quicksand'">KẾT QUẢ</h1>
            <div style="font-size: 5rem; margin: 10px 0;">🌟</div>
            <h2 id="final-score" style="font-size: 3rem; margin: 0; color: #333;">0/12</h2>
            <p id="teacher-comment" style="font-size: 1.2rem; color: #555; padding: 0 20px;"></p>
            <button class="submit-btn" onclick="closeModal()" style="font-size: 1rem; padding: 10px 30px; margin-top:20px;">Xem lại bài làm</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        // --- DATA STORE ---
        const examData = [
            {
                id: "passage1",
                title: "Light Pollution",
                topic: "environment_space",
                theme: {
                    primary: "#2c3e50", // Midnight Blue
                    secondary: "#f1c40f", // Moon Yellow
                    emojis: ["🌃", "💡", "🦉"]
                },
                content: `We are all familiar with air pollution, (1) <span class='gap-marker'>...........</span> if we live in busy cities and suffer with pollution from factories and heavy traffic. But many of us don’t take light pollution (2) <span class='gap-marker'>...........</span>.<br><br> Compared to the skies of our grandparents, the night isn’t (3) <span class='gap-marker'>...........</span> as dark as it used to be because the use of artificial lighting has increased. As a result, this can create problems for migrating birds, which are not able to use the moon and stars to (4) <span class='gap-marker'>...........</span> their journey. In addition, light from our neighbourhood, whether that is street lighting, (5) <span class='gap-marker'>...........</span> lights or passing cars, can also (6) <span class='gap-marker'>...........</span> our own sleep patterns. And of course, the night sky is harder for us to see unless we go to parts of the world free of artificial lighting.`,
                translation: "Chúng ta đều quen thuộc với ô nhiễm không khí, đặc biệt là nếu chúng ta sống ở các thành phố sầm uất và chịu đựng ô nhiễm từ các nhà máy và xe cộ đông đúc. Nhưng nhiều người trong chúng ta không coi trọng ô nhiễm ánh sáng. So với bầu trời của ông bà chúng ta, ban đêm không còn tối hẳn như trước nữa vì việc sử dụng ánh sáng nhân tạo đã gia tăng. Kết quả là, điều này có thể tạo ra vấn đề cho các loài chim di cư, những loài không thể sử dụng mặt trăng và các vì sao để hoàn thành hành trình của chúng. Ngoài ra, ánh sáng từ khu vực lân cận của chúng ta, cho dù đó là đèn đường, đèn an ninh hay xe hơi đi ngang qua, cũng có thể ảnh hưởng đến giấc ngủ của chính chúng ta. Và tất nhiên, bầu trời đêm khó nhìn hơn đối với chúng ta trừ khi chúng ta đi đến những nơi trên thế giới không có ánh sáng nhân tạo.",
                glossary: [
                    { word: "Artificial", type: "adj", mean: "Nhân tạo (do con người làm ra)" },
                    { word: "Migrating", type: "adj/v", mean: "Di cư (chim, động vật)" },
                    { word: "Pattern", type: "n", mean: "Kiểu, mô hình, nếp (sinh hoạt)" },
                    { word: "Suffer", type: "v", mean: "Chịu đựng, trải qua (điều tồi tệ)" },
                    { word: "Familiar with", type: "adj", mean: "Quen thuộc với" }
                ],
                questions: [
                    {
                        id: "p1q1", q: "Question 1",
                        options: { A: "really", B: "especially", C: "because", D: "when" },
                        correct: "B",
                        explanation: `
                            <div class="exp-step"><b>1. Phân tích ngữ cảnh:</b><br>Câu văn đang nói về việc quen với ô nhiễm không khí, và điều này càng đúng hơn <i>(nhấn mạnh)</i> nếu sống ở thành phố lớn.</div>
                            <div class="exp-step"><b>2. Phân tích từ vựng:</b><br>
                            - <b>Especially (adv):</b> đặc biệt là (dùng để nhấn mạnh một trường hợp cụ thể).<br>
                            - Really (adv): thực sự.<br>
                            - Because (conj): bởi vì.<br>
                            - When (adv): khi.</div>
                            <div class="exp-step logic-reason">➤ Chọn B. "especially if we live..." (đặc biệt là nếu chúng ta sống...).</div>
                        `
                    },
                    {
                        id: "p1q2", q: "Question 2",
                        options: { A: "seriously", B: "real", C: "mainly", D: "important" },
                        correct: "A",
                        explanation: `
                            <div class="exp-step"><b>1. Cấu trúc (Collocation):</b><br>Cụm từ cố định: <b>Take something seriously</b> (Coi trọng vấn đề gì đó/Xem xét cái gì một cách nghiêm túc).</div>
                            <div class="exp-step logic-reason">➤ Chọn A. seriously.</div>
                            <div class="exp-step"><i>Lưu ý:</i> Đề bài có chút nhầm lẫn đánh số (2) hai lần, nhưng dựa vào vị trí "take light pollution...", ta điền trạng từ bổ nghĩa cho động từ 'take'.</div>
                        `
                    },
                    {
                        id: "p1q3", q: "Question 3 (Text gap 3)",
                        options: { A: "just", B: "quite", C: "equal", D: "same" },
                        correct: "B",
                        explanation: `
                            <div class="exp-step"><b>1. Cấu trúc so sánh:</b><br>Cụm từ: <b>Not quite as + adj + as...</b> (Không hoàn toàn ... như là...).</div>
                            <div class="exp-step"><b>2. Loại trừ:</b><br>
                            - Just as... as: Cũng ... như (ngang bằng). Ngữ cảnh bài là "không tối bằng ngày xưa" -> phủ định.<br>
                            - Equal/Same: Sai ngữ pháp cấu trúc so sánh ngang bằng (as...as).</div>
                            <div class="exp-step logic-reason">➤ Chọn B. quite.</div>
                        `
                    },
                    {
                        id: "p1q4", q: "Question 4",
                        options: { A: "fly", B: "leave", C: "set", D: "complete" },
                        correct: "D",
                        explanation: `
                            <div class="exp-step"><b>1. Ngữ nghĩa:</b><br>Chim di cư dùng sao và trăng để định hướng và <b>hoàn thành</b> chuyến đi của chúng.</div>
                            <div class="exp-step"><b>2. Tại sao chọn D?</b><br>
                            - <b>Complete (v):</b> hoàn thành (một quá trình/hành trình).<br>
                            - Set: thiết lập.<br>
                            - Leave: rời đi.<br>
                            - Fly: bay (chim thì đương nhiên bay, nhưng ở đây nói về mục đích của việc dùng sao/trăng là để định hướng đi đến đích).</div>
                        `
                    },
                    {
                        id: "p1q5", q: "Question 5",
                        options: { A: "danger", B: "security", C: "guard", D: "guarantee" },
                        correct: "B",
                        explanation: `
                            <div class="exp-step"><b>1. Danh từ ghép (Compound Noun):</b><br>
                            - <b>Security lights:</b> Đèn an ninh (loại đèn tự bật khi có chuyển động để chống trộm).</div>
                            <div class="exp-step logic-reason">➤ Chọn B. Security.</div>
                        `
                    },
                    {
                        id: "p1q6", q: "Question 6",
                        options: { A: "make", B: "create", C: "influence", D: "do" },
                        correct: "C",
                        explanation: `
                            <div class="exp-step"><b>1. Ngữ nghĩa:</b><br>Ánh sáng có thể ____ giấc ngủ của chúng ta.</div>
                            <div class="exp-step"><b>2. Phân tích:</b><br>
                            - <b>Influence (v):</b> ảnh hưởng/tác động.<br>
                            - Create (v): tạo ra.<br>
                            - Make/Do: không đi với "sleep patterns" theo nghĩa ảnh hưởng.</div>
                            <div class="exp-step logic-reason">➤ Chọn C. influence.</div>
                        `
                    }
                ]
            },
            {
                id: "passage2",
                title: "Teenage Teachers",
                topic: "education_school",
                theme: {
                    primary: "#00b894", // Mint Green
                    secondary: "#e17055", // Orange
                    emojis: ["👩‍🏫", "📚", "✏️"]
                },
                content: `People may think teenagers are too young to be in charge of a class when they’re still students themselves, but that’s not true. Sixteen-year-olds are (1) <span class='gap-marker'>...........</span> teaching lessons to primary school children in a new government scheme which allows school leavers to (2) <span class='gap-marker'>...........</span> as teaching assistants in primary schools.<br><br>
New rules were recently introduced which have allowed all primary school teachers to have more time during the school day for (3) <span class='gap-marker'>...........</span> lessons, but this sometimes means that teachers have less time for teaching. Now teenagers fill the gap. They take a two-year course, starting when they’re 14. When they enter the classroom as teachers (4) <span class='gap-marker'>...........</span> than students, they have to quickly put into practice the skills they learned (5) <span class='gap-marker'>...........</span> they were studying.<br>
The government believes that about 18,000 teenagers could get jobs in this (6) <span class='gap-marker'>...........</span> . However, many people believe that young teenagers will not make suitable teachers.`,
                translation: "Mọi người có thể nghĩ rằng thanh thiếu niên còn quá trẻ để phụ trách một lớp học khi chính họ vẫn còn là học sinh, nhưng điều đó không đúng. Những thanh niên 16 tuổi hiện đang giảng dạy cho trẻ em tiểu học trong một chương trình mới của chính phủ cho phép học sinh mới ra trường làm trợ giảng tại các trường tiểu học. Các quy tắc mới gần đây đã được đưa ra cho phép tất cả giáo viên tiểu học có nhiều thời gian hơn trong ngày học để chuẩn bị bài học, nhưng điều này đôi khi có nghĩa là giáo viên có ít thời gian hơn để giảng dạy. Giờ đây, thanh thiếu niên lấp đầy khoảng trống đó. Họ tham gia một khóa học kéo dài hai năm, bắt đầu khi họ 14 tuổi. Khi bước vào lớp học với tư cách là giáo viên thay vì học sinh, họ phải nhanh chóng đưa vào thực tế các kỹ năng họ đã học được trong khi họ đang học. Chính phủ tin rằng khoảng 18.000 thanh thiếu niên có thể nhận được việc làm theo cách này. Tuy nhiên, nhiều người tin rằng thanh thiếu niên trẻ tuổi sẽ không trở thành những giáo viên phù hợp.",
                glossary: [
                    { word: "Scheme", type: "n", mean: "Kế hoạch, chương trình (của chính phủ/tổ chức)" },
                    { word: "Assistant", type: "n", mean: "Trợ lý, người phụ tá" },
                    { word: "Put into practice", type: "idm", mean: "Đưa vào thực tiễn/áp dụng" },
                    { word: "Suitable", type: "adj", mean: "Phù hợp, thích hợp" },
                    { word: "In charge of", type: "idm", mean: "Chịu trách nhiệm, phụ trách" }
                ],
                questions: [
                    {
                        id: "p2q1", q: "Question 1",
                        options: { A: "currently", B: "newly", C: "previously", D: "recently" },
                        correct: "A",
                        explanation: `
                            <div class="exp-step"><b>1. Ngữ pháp & Ngữ nghĩa:</b><br>Câu diễn tả một hành động đang diễn ra ở hiện tại ("are ... teaching").</div>
                            <div class="exp-step"><b>2. Phân tích:</b><br>
                            - <b>Currently (adv):</b> hiện tại/hiện nay (thường đi với thì tiếp diễn).<br>
                            - Previously: trước đây (quá khứ).<br>
                            - Recently/Newly: gần đây (thường đi với thì hoàn thành hoặc quá khứ).</div>
                            <div class="exp-step logic-reason">➤ Chọn A. currently.</div>
                        `
                    },
                    {
                        id: "p2q2", q: "Question 2",
                        options: { A: "be", B: "feel", C: "learn", D: "work" },
                        correct: "D",
                        explanation: `
                            <div class="exp-step"><b>1. Cấu trúc (Collocation):</b><br>
                            <b>Work as + [Job Title]:</b> Làm việc với tư cách là/Làm nghề gì.</div>
                            <div class="exp-step logic-reason">➤ Chọn D. work (work as teaching assistants).</div>
                        `
                    },
                    {
                        id: "p2q3", q: "Question 3",
                        options: { A: "practising", B: "preparing", C: "reading", D: "thinking" },
                        correct: "B",
                        explanation: `
                            <div class="exp-step"><b>1. Ngữ cảnh lớp học:</b><br>Giáo viên cần thời gian để làm gì với các bài giảng (lessons)? -> Soạn bài.</div>
                            <div class="exp-step"><b>2. Phân tích:</b><br>
                            - <b>Preparing (v):</b> chuẩn bị/soạn bài.<br>
                            - Practising: luyện tập (giáo viên ít khi 'luyện tập' bài giảng trong giờ hành chính).</div>
                            <div class="exp-step logic-reason">➤ Chọn B. preparing.</div>
                        `
                    },
                    {
                        id: "p2q4", q: "Question 4",
                        options: { A: "even", B: "instead", C: "rather", D: "sooner" },
                        correct: "C",
                        explanation: `
                            <div class="exp-step"><b>1. Cấu trúc so sánh/đối chiếu:</b><br>
                            <b>... rather than ... :</b> ... hơn là ... (mang ý nghĩa thay vì/khác với).</div>
                            <div class="exp-step">"teachers RATHER THAN students": Với tư cách là giáo viên chứ không phải học sinh.</div>
                            <div class="exp-step logic-reason">➤ Chọn C. rather.</div>
                        `
                    },
                    {
                        id: "p2q5", q: "Question 5",
                        options: { A: "except", B: "however", C: "throughout", D: "while" },
                        correct: "D",
                        explanation: `
                            <div class="exp-step"><b>1. Mệnh đề thời gian:</b><br>
                            Họ áp dụng kỹ năng đã học <b>trong khi</b> (khoảng thời gian) họ đang học.</div>
                            <div class="exp-step"><b>2. Tại sao chọn D?</b><br>
                            - <b>While + mệnh đề:</b> trong khi.<br>
                            - Throughout + danh từ: xuyên suốt.<br>
                            - Except: ngoại trừ.</div>
                            <div class="exp-step logic-reason">➤ Chọn D. while.</div>
                        `
                    },
                    {
                        id: "p2q6", q: "Question 6",
                        options: { A: "kind", B: "style", C: "type", D: "way" },
                        correct: "D",
                        explanation: `
                            <div class="exp-step"><b>1. Cụm từ (Idiom):</b><br>
                            <b>In this way:</b> Theo cách này/Bằng cách này.</div>
                            <div class="exp-step">Ý nói: Có được việc làm bằng phương thức này (tham gia chương trình).</div>
                            <div class="exp-step logic-reason">➤ Chọn D. way.</div>
                        `
                    }
                ]
            }
        ];

        // --- GAME LOGIC ---
        let currentScore = 0;
        let totalQuestions = 0;
        let timerInterval;
        let timeLeft = 600; // 10 minutes
        let isTimerRunning = false;
        
        // Sound Synthesis (No external files)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding: High Sine Wave
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Buzz: Low Sawtooth
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Generate SVG Background from Emojis
        function generateSvgBg(emojis) {
            const svgContent = `
                <svg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg' opacity='0.5'>
                    <text x='10' y='30' font-size='20'>${emojis[0]}</text>
                    <text x='60' y='70' font-size='20'>${emojis[1]}</text>
                    <text x='20' y='90' font-size='15'>${emojis[2] || ''}</text>
                </svg>`;
            return `url("data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svgContent)))}")`;
        }

        function init() {
            const readingSection = document.getElementById('reading-section');
            const exerciseContainer = document.getElementById('exercise-container');

            examData.forEach((data, index) => {
                totalQuestions += data.questions.length;
                const bgSvg = generateSvgBg(data.theme.emojis);

                // 1. Create Reading Card
                const rCard = document.createElement('div');
                rCard.className = 'reading-card';
                rCard.id = `reading-${index}`;
                // Attach theme data to DOM element for IntersectionObserver
                rCard.dataset.primary = data.theme.primary;
                rCard.dataset.secondary = data.theme.secondary;
                rCard.dataset.svg = bgSvg;

                rCard.innerHTML = `
                    <div class="reading-title">${data.title}</div>
                    <div class="reading-content">${data.content}</div>
                    
                    <div style="margin-top:20px;">
                        <button class="translate-btn" onclick="toggleTrans('trans-${index}')">
                            🇻🇳 BẢN DỊCH ĐẦY ĐỦ
                        </button>
                        <div id="trans-${index}" class="translation-text">${data.translation}</div>
                    </div>

                    <div class="glossary-box">
                        <div class="glossary-header">
                            <span>📖</span> Ms MS Chí Nên's Glossary
                        </div>
                        <table class="glossary-table">
                            ${data.glossary.map(g => `
                                <tr>
                                    <td width="30%"><b>${g.word}</b> <span class="word-type">(${g.type})</span></td>
                                    <td>${g.mean}</td>
                                </tr>`).join('')}
                        </table>
                    </div>
                `;
                readingSection.appendChild(rCard);

                // 2. Create Questions
                data.questions.forEach(q => {
                    const qCard = document.createElement('div');
                    qCard.className = 'question-card';
                    qCard.innerHTML = `
                        <div class="q-header">
                            <div class="q-badge" style="background:${data.theme.primary}">${q.id.slice(-1)}</div>
                            <div class="q-text">${q.q}</div>
                        </div>
                        <div class="options-grid" id="opt-group-${q.id}">
                            ${Object.entries(q.options).map(([key, val]) => `
                                <button class="option-btn" onclick="handleAnswer(this, '${q.id}', '${key}', '${q.correct}')">
                                    <b>${key}.</b> ${val}
                                </button>
                            `).join('')}
                        </div>
                        <div id="exp-${q.id}" class="explanation-box" style="border-color:${data.theme.secondary}">
                            <div class="exp-header" style="background:${data.theme.secondary}">
                                <span>👩‍🏫</span> GIẢI THÍCH CHI TIẾT
                            </div>
                            <div class="exp-content">${q.explanation}</div>
                        </div>
                    `;
                    exerciseContainer.appendChild(qCard);
                });
            });

            setupThemeObserver();
        }

        function handleAnswer(btn, qId, selected, correct) {
            const group = document.getElementById(`opt-group-${qId}`);
            const buttons = group.querySelectorAll('.option-btn');
            const expBox = document.getElementById(`exp-${qId}`);

            // Prevent re-answering
            if (group.dataset.answered) return;
            group.dataset.answered = "true";
            buttons.forEach(b => b.classList.add('disabled'));

            if (selected === correct) {
                btn.classList.add('correct');
                playSound('correct');
                fireConfetti(btn);
                currentScore++;
            } else {
                btn.classList.add('wrong');
                playSound('wrong');
                // Highlight correct answer
                buttons.forEach(b => {
                    if (b.innerText.startsWith(correct)) b.classList.add('correct');
                });
            }

            // Show Explanation
            expBox.style.display = 'block';
        }

        function toggleTrans(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function setupThemeObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const root = document.documentElement;
                        const ds = entry.target.dataset;
                        root.style.setProperty('--primary-color', ds.primary);
                        root.style.setProperty('--secondary-color', ds.secondary);
                        root.style.setProperty('--bg-emoji-svg', ds.svg);
                    }
                });
            }, { threshold: 0.5 }); // Trigger when 50% of reading card is visible

            document.querySelectorAll('.reading-card').forEach(card => observer.observe(card));
        }

        // --- TIMER ---
        function toggleTimer() {
            const btn = document.getElementById('timer-btn');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btn.innerText = "TIẾP TỤC";
                btn.style.background = "#95a5a6";
            } else {
                isTimerRunning = true;
                btn.innerText = "TẠM DỪNG";
                btn.style.background = "#FF4757";
                timerInterval = setInterval(() => {
                    timeLeft--;
                    const m = Math.floor(timeLeft / 60);
                    const s = timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        alert("Đã hết giờ làm bài! Hãy cố gắng hoàn thành nốt nhé.");
                    }
                }, 1000);
            }
        }

        // --- RESULTS ---
        function showResults() {
            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('final-score');
            const comment = document.getElementById('teacher-comment');
            
            scoreDisplay.innerText = `${currentScore}/${totalQuestions}`;
            const percent = (currentScore / totalQuestions) * 100;

            if (percent === 100) comment.innerText = "Tuyệt vời! Em là thiên tài ngôn ngữ! 🌟";
            else if (percent >= 80) comment.innerText = "Làm rất tốt! Em nắm bài rất chắc chắn. 👍";
            else if (percent >= 50) comment.innerText = "Cố gắng lên! Hãy xem kỹ lại phần giải thích nhé. 💪";
            else comment.innerText = "Đừng buồn! Hãy đọc kỹ giải thích của cô MS Chí Nên để làm tốt hơn lần sau nhé. ❤️";

            modal.style.display = 'flex';
            if (percent >= 50) fireConfetti(document.body, true);
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // --- CONFETTI EFFECT ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];

        function fireConfetti(element, global = false) {
            const rect = global ? {left: window.innerWidth/2, top: window.innerHeight/2} : element.getBoundingClientRect();
            const colors = ['#00D26A', '#FF4757', '#54a0ff', '#feca57'];
            for(let i=0; i<30; i++) {
                particles.push({
                    x: rect.left + (global ? 0 : 50), y: rect.top,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 5,
                    color: colors[Math.floor(Math.random()*colors.length)],
                    life: 100
                });
            }
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach((p,i) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life--;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 8, 8);
                if(p.life <= 0) particles.splice(i,1);
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        init(); animate();

    </script>
</body>
</html>
