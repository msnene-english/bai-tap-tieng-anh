<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 18: Sentence Combination (Relative Clauses) - Ms. Chí Nên</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #8854C0; /* Purple */
            --secondary-color: #00C9A7; /* Teal */
            --correct-color: #00D26A; /* Green */
            --wrong-color: #FF4757; /* Red/Orange */
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #2D3436;
            --text-light: #636E72;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Prevent text selection for game feel */
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dfe6e9 10%, transparent 10%), radial-gradient(#dfe6e9 10%, transparent 10%);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 25px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1), 0 20px 30px rgba(0,0,0,0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
        }

        /* Header Styles */
        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .teacher-badge {
            background: var(--primary-color);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background-color: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-color), #00b894);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 10px;
        }

        /* Question Area */
        .question-box {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            line-height: 1.5;
            text-align: center;
        }

        .hint-text {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            margin-bottom: 25px;
            font-size: 0.95rem;
            background: #f1f2f6;
            padding: 8px;
            border-radius: 10px;
            display: inline-block;
            width: 100%;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            gap: 15px;
            grid-template-columns: 1fr; /* Default mobile */
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr; /* 2 columns on desktop */
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-bottom: 6px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            color: var(--primary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-bottom: 4px; /* offset the border reduction */
        }

        .option-letter {
            background: #f1f2f6;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            margin-right: 12px;
            flex-shrink: 0;
            color: var(--text-light);
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00b894;
            border-bottom-color: #008f72;
        }
        .option-btn.correct .option-letter {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #ff6b81;
            border-bottom-color: #e03b4b;
            animation: shake 0.5s;
        }
        .option-btn.wrong .option-letter {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #fff8e1; /* Light yellow note */
            border: 2px solid #ffeaa7;
            border-left: 8px solid #fdcb6e;
            border-radius: 12px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideUp 0.4s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: #d35400;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content p {
            margin: 8px 0;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        
        .exp-label {
            font-weight: 700;
            color: var(--primary-color);
        }

        .exp-translation {
            color: #2c3e50;
            font-style: italic;
        }

        /* Controls */
        .controls {
            margin-top: 25px;
            text-align: right;
        }

        .next-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            font-family: 'Nunito', sans-serif;
            display: none; /* Hidden until answered */
        }

        .next-btn:hover {
            transform: scale(1.05);
            background: var(--primary-color);
        }

        /* Modal */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .result-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 20px 0;
        }

        .feedback-text {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .game-container { padding: 15px; border-width: 2px; }
            .question-box { font-size: 1.1rem; }
            .option-btn { padding: 15px; font-size: 0.9rem; }
            .teacher-badge { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="teacher-badge">👩‍🏫 Giáo viên: Ms. Chí Nên</div>
        <div id="score-tracker" style="font-weight: bold; color: var(--primary-color);">Điểm: 0</div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-area">

        </div>
        
        <div class="hint-text" id="hint-text"></div>

        <div class="options-grid" id="options-container">
            <!-- Options generated by JS -->
        </div>

        <div class="explanation-box" id="explanation-box">
            <div class="explanation-header">
                <span>💡 Ms. Chí Nên giải thích chi tiết:</span>
            </div>
            <div class="explanation-content" id="explanation-content">
                <!-- Content generated by JS -->
            </div>
        </div>

        <div class="controls">
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➜</button>
            <button class="next-btn" id="finish-btn" onclick="showResults()" style="display:none; background-color: var(--secondary-color);">Nộp bài & Xem điểm 🏆</button>
        </div>
    </div>
</div>

<!-- Result Modal -->
<div class="result-modal" id="result-modal">
    <div class="result-content">
        <h2>🎉 HOÀN THÀNH!</h2>
        <div class="score-display" id="final-score">0/15</div>
        <p class="feedback-text" id="final-feedback">Bạn làm tốt lắm!</p>
        <button class="next-btn" style="display:inline-block;" onclick="location.reload()">Làm lại bài thi 🔄</button>
    </div>
</div>

<script>

            { "text": "The tourists whom are visiting the floating market are from Japan.", "isCorrect": false, "analysis": "Dùng 'whom' (chỉ tân ngữ) -> Sai vì chỗ trống cần Chủ ngữ cho 'are visiting'." }

    // --- GAME LOGIC ---
    
    // Audio Context Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // Ding sound: Sine wave, high pitch, short decay
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1); // C6
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else {
            // Error sound: Sawtooth, low pitch, dissonant
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initGame() {
        // Deep copy and shuffle questions
        questions = JSON.parse(JSON.stringify(rawData.questions));
        questions = shuffleArray(questions);
        
        // Shuffle options for each question but keep track of indices if needed (not needed here as we check isCorrect)
        questions.forEach(q => {
            q.answerOptions = shuffleArray(q.answerOptions);
        });

        currentQuestionIndex = 0;
        score = 0;
        updateScore();
        loadQuestion();
    }

    function updateScore() {
        document.getElementById('score-tracker').innerText = `Điểm: ${score}`;
        const progress = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function loadQuestion() {
        answered = false;
        const qData = questions[currentQuestionIndex];
        
        // Reset UI
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('finish-btn').style.display = 'none';
        
        // Set Content
        document.getElementById('question-text').innerText = `Câu ${currentQuestionIndex + 1}: ${qData.question}`;
        document.getElementById('hint-text').innerText = `💡 Gợi ý: ${qData.hint}`;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        const letters = ['A', 'B', 'C', 'D'];
        qData.answerOptions.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<div class="option-letter">${letters[index]}</div><span>${opt.text}</span>`;
            btn.onclick = () => checkAnswer(opt, btn, qData);
            optionsContainer.appendChild(btn);
        });

        updateScore();
    }

    function checkAnswer(selectedOption, btnElement, questionData) {
        if (answered) return;
        answered = true;

        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(btn => btn.disabled = true);

        if (selectedOption.isCorrect) {
            // Correct
            btnElement.classList.add('correct');
            score++;
            playSound('correct');
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#00D26A', '#00C9A7', '#f1c40f']
            });
        } else {
            // Wrong
            btnElement.classList.add('wrong');
            playSound('wrong');
            // Highlight the correct one
            questionData.answerOptions.forEach((opt, idx) => {
                if (opt.isCorrect) {
                    allButtons[idx].classList.add('correct');
                }
            });
        }

        updateScore();
        showExplanation(questionData);

        // Show Next or Finish button
        if (currentQuestionIndex < questions.length - 1) {
            document.getElementById('next-btn').style.display = 'inline-block';
        } else {
            document.getElementById('finish-btn').style.display = 'inline-block';
        }
    }

    function showExplanation(qData) {
        const expBox = document.getElementById('explanation-box');
        const expContent = document.getElementById('explanation-content');
        
        // Construct Explanation HTML strictly following the request
        // 1. Dịch câu hỏi
        // 2. Phân tích 4 đáp án (A, B, C, D)
        // 3. Tại sao đúng/sai
        
        let analysisHTML = '<div style="margin-top:10px;">';
        const letters = ['A', 'B', 'C', 'D'];
        
        qData.answerOptions.forEach((opt, idx) => {
            const statusIcon = opt.isCorrect ? '✅' : '❌';
            analysisHTML += `<p><strong>${letters[idx]} (${statusIcon}):</strong> ${opt.text}<br><span style="color:#636E72; font-size:0.9em;">➡ ${opt.analysis}</span></p>`;
        });
        analysisHTML += '</div>';

        expContent.innerHTML = `
            <p><span class="exp-label">1. Dịch đề bài:</span> "${qData.transQ}"</p>
            <p><span class="exp-label">2. Phân tích đáp án:</span></p>
            ${analysisHTML}
            <div style="margin-top:15px; border-top: 1px dashed #ccc; padding-top:10px;">
                <p><span class="exp-label">🎯 Đáp án đúng:</span> "${qData.transA}"</p>
                <p><strong>Tại sao đúng?</strong> Ta dùng đại từ quan hệ phù hợp với danh từ đứng trước (Người/Vật/Sở hữu) và vai trò ngữ pháp của nó trong mệnh đề quan hệ (Chủ ngữ/Tân ngữ).</p>
            </div>
        `;
        
        expBox.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
        // Smooth scroll to top of game container for mobile
        document.querySelector('.game-container').scrollIntoView({ behavior: 'smooth' });
    }

    function showResults() {
        const modal = document.getElementById('result-modal');
        const finalScore = document.getElementById('final-score');
        const feedback = document.getElementById('final-feedback');
        
        finalScore.innerText = `${score}/${questions.length}`;
        
        const percentage = (score / questions.length) * 100;
        if (percentage === 100) {
            feedback.innerText = "🌟 Xuất sắc! Em là thiên tài ngữ pháp! 🌟";
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        } else if (percentage >= 80) {
            feedback.innerText = "👏 Giỏi lắm! Em nắm bài rất chắc!";
        } else if (percentage >= 50) {
            feedback.innerText = "💪 Cố gắng lên! Em đã hiểu bài nhưng cần cẩn thận hơn.";
        } else {
            feedback.innerText = "📚 Cần ôn lại bài nhé! Đừng nản chí!";
        }
        
        modal.style.display = 'flex';
        playSound('correct');
    }

    // Start
    window.onload = initGame;

</script>
