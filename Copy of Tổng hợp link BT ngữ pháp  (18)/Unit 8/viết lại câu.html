<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. MS Chí Nên - Relative Clauses Mastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Tím hồng */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-color: #2D3436;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fff0f5;
            background-image: 
                radial-gradient(#8854C0 15%, transparent 16%),
                radial-gradient(#00C9A7 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header Styles */
        header {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border: 4px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
            margin-top: 10px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
        }

        .badge {
            background: var(--secondary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 5px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Question Card Styles */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 3px solid #e0e0e0;
            transition: transform 0.3s ease;
            position: relative;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
        }

        .question-number {
            background: var(--primary-color);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            position: absolute;
            top: -15px;
            left: -15px;
            box-shadow: 0 4px 0 #5e35b1;
            z-index: 2;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #2d3436;
            line-height: 1.5;
            padding-left: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #ddd;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #ddd;
            position: relative;
            color: #555;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            background-color: #f9f9f9;
            border-color: var(--primary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 0 0 #ddd;
        }

        .option-letter {
            background: #eee;
            color: #555;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: 800;
            flex-shrink: 0;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background-color: #d1fae5;
            border-color: var(--correct-color);
            color: #065f46;
            box-shadow: 0 5px 0 #059669;
        }
        .option-btn.correct .option-letter {
            background: var(--correct-color);
            color: white;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--wrong-color);
            color: #991b1b;
            box-shadow: 0 5px 0 #b91c1c;
        }
        .option-btn.wrong .option-letter {
            background: var(--wrong-color);
            color: white;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
            transform: none !important;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            background: #fff8e1;
            border: 2px dashed #ffc107;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            font-weight: 800;
            color: #d97706;
            margin-bottom: 10px;
            border-bottom: 2px solid #ffecb3;
            padding-bottom: 5px;
        }

        .explanation-header span {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #4b5563;
            white-space: pre-line; /* Preserves newlines from JSON */
        }

        /* Footer / Submit */
        .footer-controls {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #5e35b1;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            background: #9b6bd6;
        }

        .submit-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #5e35b1;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake-element {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 5px solid var(--secondary-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--secondary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 0 0 5px var(--secondary-color);
        }

        .result-message {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Ms. MS Chí Nên</h1>
            <div class="badge">English Master Class</div>
            <p>Rewrite Sentences: Relative Clauses Mastery 🏰</p>
            <p style="font-size: 0.9rem; margin-top: 5px; color: #888;">Hãy chọn câu viết lại đúng nhất nhé!</p>
        </header>

        <div id="quiz-container">
            <!-- Questions will be injected here via JavaScript -->
        </div>

        <div class="footer-controls">
            <button class="submit-btn" onclick="finishQuiz()">Nộp Bài (Submit)</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="result-card">
            <div class="score-circle" id="finalScore">0/0</div>
            <div class="result-message" id="resultMessage">Tuyệt vời!</div>
            <p style="color: #666; margin-bottom: 20px;">Cảm ơn em đã hoàn thành bài tập!</p>
            <button class="submit-btn" onclick="location.reload()">Làm Lại (Replay)</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        // === DỮ LIỆU BÀI TẬP (DATA) ===
        const quizData = [
            {
                "questionNumber": 1,
                "question": "The tourist got lost in the city. The tourist didn’t speak English. (who)\n→ Rewrite: _____________________________________________________________________________________",
                "answerOptions": [
                    {
                        "text": "The tourist who didn’t speak English got lost in the city.",
                        "rationale": "Dịch chi tiết:\nA. 'who' (pronoun - đại từ quan hệ): người mà. Mệnh đề quan hệ bổ nghĩa cho 'The tourist'.\n\nGiải thích: \n- 'The tourist' là danh từ chỉ người -> dùng 'who'.\n- Mệnh đề 'who didn't speak English' được lồng vào giữa để bổ nghĩa rõ ràng cho chủ ngữ.\n- Câu đúng ngữ pháp và giữ nguyên nghĩa gốc.\n\nDịch câu: Người du khách, người mà không nói tiếng Anh, đã bị lạc trong thành phố.",
                        "isCorrect": true
                    },
                    {
                        "text": "The tourist which didn’t speak English got lost in the city.",
                        "rationale": "Dịch chi tiết:\nB. 'which' (pronoun): cái mà (dùng cho vật).\n\nGiải thích: Sai vì 'The tourist' là người, không thể dùng 'which'.\n\nDịch câu (sai): Người du khách cái mà không nói tiếng Anh đã bị lạc trong thành phố.",
                        "isCorrect": false
                    },
                    {
                        "text": "The tourist got lost in the city who didn’t speak English.",
                        "rationale": "Dịch chi tiết:\nC. Vị trí mệnh đề sai.\n\nGiải thích: Sai cấu trúc. Mệnh đề quan hệ 'who didn't speak English' phải đứng ngay sau danh từ nó bổ nghĩa ('The tourist'). Đặt ở cuối câu khiến người đọc hiểu nhầm là 'the city' không biết nói tiếng Anh.\n\nDịch câu (sai): Người du khách bị lạc trong thành phố người mà không nói tiếng Anh.",
                        "isCorrect": false
                    },
                    {
                        "text": "The tourist whom didn’t speak English got lost in the city.",
                        "rationale": "Dịch chi tiết:\nD. 'whom' (pronoun): người mà (tân ngữ).\n\nGiải thích: Sai ngữ pháp. Ở đây cần chủ ngữ cho động từ 'speak', nên phải dùng 'who'. 'Whom' chỉ dùng làm tân ngữ.\n\nDịch câu (sai): Người du khách người mà (tân ngữ) không nói tiếng Anh đã bị lạc...",
                        "isCorrect": false
                    }
                ]
            },
            {
                "questionNumber": 2,
                "question": "Mount Fuji is a dormant volcano in Japan. It’s a popular destination for hikers. (which)\n→ Rewrite: Mount Fuji, ____________________________________________________________________________________",
                "answerOptions": [
                    {
                        "text": "which is a popular destination for hikers, is a dormant volcano in Japan.",
                        "rationale": "Dịch chi tiết:\nA. 'which' (pronoun): cái mà/nơi mà.\n\nGiải thích: \n- 'Mount Fuji' là tên riêng (địa danh cụ thể) -> Dùng mệnh đề quan hệ không xác định (có dấu phẩy).\n- 'Which' thay thế cho 'It' để làm chủ ngữ cho mệnh đề phụ.\n- Cấu trúc: Subject + , which + clause , + main verb...\n\nDịch câu: Núi Phú Sĩ, nơi là một điểm đến phổ biến cho người leo núi, là một ngọn núi lửa đã tắt ở Nhật Bản.",
                        "isCorrect": true
                    },
                    {
                        "text": "that is a popular destination for hikers, is a dormant volcano in Japan.",
                        "rationale": "Dịch chi tiết:\nB. 'that' (pronoun): cái mà.\n\nGiải thích: Sai ngữ pháp. Không được dùng 'that' trong mệnh đề quan hệ có dấu phẩy (non-defining relative clause).\n\nDịch câu (sai): Dùng 'that' sau dấu phẩy là lỗi ngữ pháp.",
                        "isCorrect": false
                    },
                    {
                        "text": "which is a popular destination for hikers is a dormant volcano in Japan.",
                        "rationale": "Dịch chi tiết:\nC. Thiếu dấu phẩy.\n\nGiải thích: Sai lỗi chính tả/ngữ pháp. Vì 'Mount Fuji' là tên riêng, bắt buộc phải có dấu phẩy ngăn cách mệnh đề quan hệ.\n\nDịch câu (sai): Thiếu dấu phẩy ngăn cách.",
                        "isCorrect": false
                    },
                    {
                        "text": "who is a popular destination for hikers, is a dormant volcano in Japan.",
                        "rationale": "Dịch chi tiết:\nD. 'who' (pronoun): người mà.\n\nGiải thích: Sai vì 'Mount Fuji' là vật/địa danh, không phải người.\n\nDịch câu (sai): Núi Phú Sĩ người mà...",
                        "isCorrect": false
                    }
                ]
            },
            {
                "questionNumber": 3,
                "question": "Tourists flock to the Taj Mahal in India. It’s made from white marble. (which)\n→ Rewrite: Tourists flock ___________________________________________________________________________________",
                "answerOptions": [
                    {
                        "text": "to the Taj Mahal in India, which is made from white marble.",
                        "rationale": "Dịch chi tiết:\nA. 'which' (pronoun): cái mà.\n\nGiải thích: \n- 'The Taj Mahal' là danh từ đứng trước. \n- Mệnh đề 'which is made from white marble' bổ sung thông tin thêm về Taj Mahal.\n- Dùng dấu phẩy vì Taj Mahal là địa danh xác định duy nhất.\n\nDịch câu: Du khách đổ xô đến đền Taj Mahal ở Ấn Độ, nơi được làm từ đá cẩm thạch trắng.",
                        "isCorrect": true
                    },
                    {
                        "text": "to the Taj Mahal in India, where is made from white marble.",
                        "rationale": "Dịch chi tiết:\nB. 'where' (adverb): nơi mà.\n\nGiải thích: Sai ngữ pháp. 'Where' = 'in which', sau 'where' phải là một mệnh đề đầy đủ (S + V). Ở đây 'is made' là động từ, thiếu chủ ngữ, nên phải dùng 'which' làm chủ ngữ.\n\nDịch câu (sai): Dùng 'where' làm chủ ngữ là sai.",
                        "isCorrect": false
                    },
                    {
                        "text": "to the Taj Mahal in India which is made from white marble.",
                        "rationale": "Dịch chi tiết:\nC. Thiếu dấu phẩy.\n\nGiải thích: Taj Mahal là tên riêng, nên mệnh đề quan hệ đi sau nó mang tính bổ sung (non-defining), cần có dấu phẩy.\n\nDịch câu (sai): Thiếu dấu phẩy.",
                        "isCorrect": false
                    },
                    {
                        "text": "to the Taj Mahal in India, who is made from white marble.",
                        "rationale": "Dịch chi tiết:\nD. 'who' (pronoun): người mà.\n\nGiải thích: Sai vì Taj Mahal là vật/địa điểm.\n\nDịch câu (sai): Taj Mahal người mà...",
                        "isCorrect": false
                    }
                ]
            },
            {
                "questionNumber": 4,
                "question": "The chef won a food competition. He prepared the dish with fresh ingredients. (who)\n→ Rewrite: The chef _______________________________________________________________________________________",
                "answerOptions": [
                    {
                        "text": "who prepared the dish with fresh ingredients won a food competition.",
                        "rationale": "Dịch chi tiết:\nA. 'who' (pronoun): người mà.\n\nGiải thích: \n- 'The chef' là danh từ chỉ người.\n- Dùng 'who' thay thế cho 'He' trong câu thứ hai để tạo thành mệnh đề quan hệ 'who prepared...'.\n- Mệnh đề này bổ nghĩa cho 'The chef'.\n\nDịch câu: Người đầu bếp, người mà đã chuẩn bị món ăn với các nguyên liệu tươi ngon, đã chiến thắng cuộc thi ẩm thực.",
                        "isCorrect": true
                    },
                    {
                        "text": "which prepared the dish with fresh ingredients won a food competition.",
                        "rationale": "Dịch chi tiết:\nB. 'which' (pronoun): cái mà.\n\nGiải thích: Sai vì 'The chef' là người.\n\nDịch câu (sai): Người đầu bếp cái mà...",
                        "isCorrect": false
                    },
                    {
                        "text": "whom prepared the dish with fresh ingredients won a food competition.",
                        "rationale": "Dịch chi tiết:\nC. 'whom' (pronoun): người mà (tân ngữ).\n\nGiải thích: Sai ngữ pháp. Ở đây cần chủ ngữ cho động từ 'prepared', nên phải dùng 'who'.\n\nDịch câu (sai): Dùng 'whom' làm chủ ngữ là sai.",
                        "isCorrect": false
                    },
                    {
                        "text": "won a food competition who prepared the dish with fresh ingredients.",
                        "rationale": "Dịch chi tiết:\nD. Sai vị trí.\n\nGiải thích: Mệnh đề quan hệ 'who...' đang đứng quá xa danh từ 'The chef', gây khó hiểu hoặc sai nghĩa.\n\nDịch câu (sai): Sắp xếp lộn xộn.",
                        "isCorrect": false
                    }
                ]
            },
            {
                "questionNumber": 5,
                "question": "The Philippines has incredible biodiversity. It’s home to many unique species of plants and animals. (which)\n→ Rewrite: The Philippines, ________________________________________________________________________________",
                "answerOptions": [
                    {
                        "text": "which is home to many unique species of plants and animals, has incredible biodiversity.",
                        "rationale": "Dịch chi tiết:\nA. 'which' (pronoun): cái mà/nơi mà.\n\nGiải thích: \n- 'The Philippines' là tên riêng -> cần dấu phẩy.\n- 'Which' thay thế cho 'It' làm chủ ngữ trong mệnh đề quan hệ.\n- Câu chính: The Philippines has incredible biodiversity.\n\nDịch câu: Philippines, nơi là nhà của nhiều loài động thực vật độc đáo, có sự đa dạng sinh học đáng kinh ngạc.",
                        "isCorrect": true
                    },
                    {
                        "text": "where is home to many unique species of plants and animals, has incredible biodiversity.",
                        "rationale": "Dịch chi tiết:\nB. 'where' (adverb): nơi mà.\n\nGiải thích: Sai ngữ pháp. 'Where' không làm chủ ngữ cho động từ 'is'. (Nếu muốn dùng where, câu phải là 'where many unique species live').\n\nDịch câu (sai): Dùng 'where' sai chức năng ngữ pháp.",
                        "isCorrect": false
                    },
                    {
                        "text": "that is home to many unique species of plants and animals, has incredible biodiversity.",
                        "rationale": "Dịch chi tiết:\nC. 'that' (pronoun).\n\nGiải thích: Sai vì không dùng 'that' sau dấu phẩy (mệnh đề không xác định).\n\nDịch câu (sai): Dùng 'that' trong mệnh đề có dấu phẩy.",
                        "isCorrect": false
                    },
                    {
                        "text": "who is home to many unique species of plants and animals, has incredible biodiversity.",
                        "rationale": "Dịch chi tiết:\nD. 'who' (pronoun).\n\nGiải thích: Sai vì Philippines là tên nước (vật/nơi chốn), không dùng 'who'.\n\nDịch câu (sai): Dùng sai đại từ quan hệ.",
                        "isCorrect": false
                    }
                ]
            },
            {
                "questionNumber": 6,
                "question": "Ha Long Bay is famous for stunning scenery. Its limestone formations rise out of the emerald water. (whose)\n→ Rewrite: Ha Long Bay, ___________________________________________________________________________________",
                "answerOptions": [
                    {
                        "text": "whose limestone formations rise out of the emerald water, is famous for stunning scenery.",
                        "rationale": "Dịch chi tiết:\nA. 'whose' (pronoun): của... (sở hữu).\n\nGiải thích: \n- Thay 'Its' (của nó) bằng 'whose'.\n- 'Ha Long Bay' là tên riêng -> dùng dấu phẩy.\n- Cấu trúc: Tên riêng + , whose + danh từ + V..., + V chính...\n\nDịch câu: Vịnh Hạ Long, nơi có những khối đá vôi nhô lên khỏi mặt nước xanh ngọc bích, nổi tiếng với phong cảnh tuyệt đẹp.",
                        "isCorrect": true
                    },
                    {
                        "text": "which limestone formations rise out of the emerald water, is famous for stunning scenery.",
                        "rationale": "Dịch chi tiết:\nB. 'which' (pronoun).\n\nGiải thích: Sai. 'Which' không chỉ sự sở hữu. Phải dùng 'whose' để thay cho 'Its'.\n\nDịch câu (sai): Không thể hiện được ý 'của Vịnh Hạ Long'.",
                        "isCorrect": false
                    },
                    {
                        "text": "whose limestone formations rise out of the emerald water is famous for stunning scenery.",
                        "rationale": "Dịch chi tiết:\nC. Thiếu dấu phẩy.\n\nGiải thích: Sai lỗi ngữ pháp. Thiếu dấu phẩy thứ hai trước động từ chính 'is famous'. Mệnh đề quan hệ không xác định phải được tách biệt hoàn toàn bằng 2 dấu phẩy.\n\nDịch câu (sai): Thiếu dấu phẩy ngắt câu.",
                        "isCorrect": false
                    },
                    {
                        "text": "that limestone formations rise out of the emerald water, is famous for stunning scenery.",
                        "rationale": "Dịch chi tiết:\nD. 'that' (pronoun).\n\nGiải thích: Sai hoàn toàn về cấu trúc sở hữu và quy tắc dùng 'that' sau dấu phẩy.\n\nDịch câu (sai): Sai cấu trúc.",
                        "isCorrect": false
                    }
                ]
            }
        ];

        // Shuffle logic
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // Shuffle the questions for variety
        shuffleArray(quizData);

        // State tracking
        let score = 0;
        let answeredCount = 0;
        const totalQuestions = quizData.length;

        // === RENDER BÀI TẬP ===
        const container = document.getElementById('quiz-container');

        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `card-${index}`;

            // Format question text (replace newlines)
            const questionText = item.question.replace(/\n/g, '<br>');

            // Generate Options HTML
            let optionsHtml = '';
            item.answerOptions.forEach((opt, optIndex) => {
                const letters = ['A', 'B', 'C', 'D'];
                optionsHtml += `
                    <button class="option-btn" onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect}, this)">
                        <div class="option-letter">${letters[optIndex]}</div>
                        <div>${opt.text}</div>
                    </button>
                `;
            });

            // Find the correct rationale to display
            const correctOption = item.answerOptions.find(opt => opt.isCorrect);
            // Construct full rationale explanation combining all rationales for comparison
            let fullRationale = "";
            item.answerOptions.forEach((opt, idx) => {
                fullRationale += `<b>Phương án ${['A','B','C','D'][idx]}:</b>\n${opt.rationale}\n\n-----------------\n\n`;
            });


            card.innerHTML = `
                <div class="question-number">${index + 1}</div>
                <div class="question-text">${questionText}</div>
                <div class="options-grid" id="options-${index}">
                    ${optionsHtml}
                </div>
                <div class="explanation-box" id="explanation-${index}">
                    <div class="explanation-header">
                        <span>👩‍🏫</span> Giải thích chi tiết bởi Ms. MS Chí Nên:
                    </div>
                    <div class="explanation-content">${fullRationale}</div>
                </div>
            `;
            container.appendChild(card);
        });

        // === XỬ LÝ SỰ KIỆN ===

        // Sound Effects (Using standard URLs for reliability)
        const soundCorrect = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');
        const soundWrong = new Audio('https://www.soundjay.com/buttons/sounds/button-10.mp3'); 
        const soundClap = new Audio('https://www.soundjay.com/human/sounds/applause-01.mp3');

        function checkAnswer(cardIndex, optionIndex, isCorrect, btnElement) {
            const card = document.getElementById(`card-${cardIndex}`);
            const optionsDiv = document.getElementById(`options-${cardIndex}`);
            const explanationBox = document.getElementById(`explanation-${cardIndex}`);
            const buttons = optionsDiv.getElementsByClassName('option-btn');

            // Prevent re-clicking
            if (btnElement.disabled) return;

            // Disable all buttons in this card
            for (let btn of buttons) {
                btn.disabled = true;
                // Highlight the correct answer anyway if user chose wrong
                // Find data-correct logic? We passed isCorrect in onclick, need to find the correct button text
                // Simpler: We loop through quizData
                const qData = quizData[cardIndex];
                // Check if this button corresponds to a correct option
                // Since we rendered sequentially, button index matches option index
            }
            
            // Highlight Correct Answer visually even if wrong picked
            const correctBtnIndex = quizData[cardIndex].answerOptions.findIndex(o => o.isCorrect);
            buttons[correctBtnIndex].classList.add('correct');

            if (isCorrect) {
                score++;
                // Play sound
                soundCorrect.currentTime = 0;
                soundCorrect.play();
                // Confetti
                fireConfetti(btnElement.getBoundingClientRect());
            } else {
                btnElement.classList.add('wrong');
                // Play sound
                soundWrong.currentTime = 0;
                soundWrong.play();
                // Shake animation
                card.classList.add('shake-element');
                setTimeout(() => card.classList.remove('shake-element'), 500);
            }

            // Show explanation
            explanationBox.classList.add('show');
            
            answeredCount++;
        }

        function finishQuiz() {
            if (answeredCount < totalQuestions) {
                if(!confirm(`Em mới làm ${answeredCount}/${totalQuestions} câu. Em có chắc chắn muốn nộp bài không?`)) {
                    return;
                }
            }

            const modal = document.getElementById('resultModal');
            const scoreDisplay = document.getElementById('finalScore');
            const msgDisplay = document.getElementById('resultMessage');

            scoreDisplay.innerText = `${score}/${totalQuestions}`;
            
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                msgDisplay.innerText = "Xuất sắc! Em là thiên tài! 🌟";
                soundClap.play();
                fireGlobalConfetti();
            } else if (percentage >= 80) {
                msgDisplay.innerText = "Giỏi lắm! Cố chút nữa là điểm 10! 💪";
            } else if (percentage >= 50) {
                msgDisplay.innerText = "Khá tốt! Cần ôn lại bài một chút nhé! 📚";
            } else {
                msgDisplay.innerText = "Đừng buồn! Hãy xem lại giải thích và thử lại nha! ❤️";
            }

            modal.style.display = 'flex';
        }

        // === CONFETTI EFFECT ===
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];

        function fireConfetti(rect) {
            // Origin at center of clicked button
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 5, // Upwards bias
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    gravity: 0.5,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10,
                    life: 100
                });
            }
            animateConfetti();
        }

        function fireGlobalConfetti() {
             for (let i = 0; i < 200; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20 - 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    gravity: 0.5,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10,
                    life: 150
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            if (particles.length === 0) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.rotation += p.rotationSpeed;
                p.life--;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            }

            particles = particles.filter(p => p.life > 0);

            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

    </script>
</body>
</html>
