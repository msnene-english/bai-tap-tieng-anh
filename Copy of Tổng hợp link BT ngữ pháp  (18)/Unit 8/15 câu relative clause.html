<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #8854C0; /* Tím hồng */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f3f5;
            --text-color: #2f3542;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border_box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#d1ccc0 10%, transparent 10%), radial-gradient(#d1ccc0 10%, transparent 10%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* HEADER */
        .header-card {
            background: linear-gradient(135deg, var(--primary-color), #a29bfe);
            color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .header-card h1 {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .header-card p {
            margin: 10px 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .teacher-badge {
            background: #fff;
            color: var(--primary-color);
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 800;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }

        /* QUESTION CARD */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            border: 2px solid #eee;
            position: relative;
            transition: transform 0.3s ease;
        }

        .question-number {
            background: var(--secondary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #2d3436;
            line-height: 1.5;
        }

        .question-hint {
            background-color: #fff8e1;
            border-left: 5px solid #ffc107;
            padding: 10px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #5d4037;
        }

        .question-hint i {
            color: #ffc107;
            margin-right: 8px;
        }

        /* ANSWER OPTIONS (GRID LAYOUT) */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe6e9;
            border-bottom: 6px solid #dfe6e9; /* 3D Effect */
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #636e72;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #b2bec3;
            border-bottom-color: #b2bec3;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-bottom: 4px; /* Maintain layout flow */
        }

        /* CORRECT / WRONG STATES */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00b894;
            border-bottom-color: #008f72;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #ff6b81;
            border-bottom-color: #e03b49;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* EXPLANATION BOX (Ms MS Chí Nên Style) */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 25px;
            background: #f8f9fa;
            border: 2px dashed var(--primary-color);
            border-radius: 15px;
            padding: 20px;
            animation: slideDown 0.4s ease-out;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.2rem;
        }

        .explanation-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid var(--primary-color);
        }

        .exp-section {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e1e1e1;
        }

        .exp-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .exp-label {
            font-weight: 800;
            color: #2d3436;
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .exp-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2d3436;
        }
        
        .exp-content em {
            color: var(--primary-color);
            font-style: normal;
            font-weight: 700;
        }

        /* ANIMATIONS */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FOOTER & BUTTONS */
        .controls {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .submit-btn {
            background: linear-gradient(to bottom, #00C9A7, #00a88d);
            color: white;
            border: none;
            border-bottom: 6px solid #007965;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0,201,167,0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .submit-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        /* RESULT MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 5px solid var(--primary-color);
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .score-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary-color);
            margin: 10px 0;
            text-shadow: 3px 3px 0px #eee;
        }
        
        .feedback-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 20px;
        }

        .close-btn {
            background: #dfe6e9;
            color: #2d3436;
            border: none;
            padding: 10px 30px;
            font-size: 1.1rem;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .close-btn:hover {
            background: #b2bec3;
        }

        /* Utility for underlined text in phonetics (if needed) */
        u {
            text-decoration: none;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 1px;
        }
        
        @media (min-width: 768px) {
            .options-grid {
                grid-template-columns: 1fr; /* Keep single column for long sentences */
            }
        }
    </style>
</head>

        // --- GAME LOGIC ---

        let questions = [];
        let score = 0;
        let answeredCount = 0;

        // Shuffle Function (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Initialize Quiz
        function initQuiz() {
            // Shuffle questions for variety
            questions = shuffle([...rawData.questions]);
            
            // Render all questions
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `q-${index}`;

                // Extract translation from correct answer rationale if available
                let translation = "";
                const correctOpt = q.answerOptions.find(o => o.isCorrect);
                if (correctOpt && correctOpt.rationale.includes("Dịch:")) {
                    translation = correctOpt.rationale.split("Dịch:")[1].trim();
                } else if (correctOpt && correctOpt.rationale.includes("Dịch")) {
                     // Fallback split logic just in case
                     translation = correctOpt.rationale.substring(correctOpt.rationale.indexOf("Dịch"));
                }

                // Question HTML
                let html = `
                    <div class="question-number">Question ${index + 1} / ${questions.length}</div>
                    <div class="question-text">${q.question.replace(/\n/g, '<br>')}</div>
                    <div class="question-hint"><i class="fas fa-lightbulb"></i> Gợi ý: ${q.hint}</div>
                    
                    <div class="options-grid">
                `;

                // Options HTML
                q.answerOptions.forEach((opt, optIndex) => {
                    html += `
                        <button class="option-btn" onclick="checkAnswer(${index}, ${optIndex}, this, ${opt.isCorrect})">
                            ${String.fromCharCode(65 + optIndex)}. ${opt.text}
                        </button>
                    `;
                });

                html += `</div>`; // Close grid

                // Detailed Explanation Container (Hidden initially)
                html += `
                    <div class="explanation-box" id="exp-${index}">
                        <div class="explanation-header">
                            <i class="fas fa-chalkboard-teacher" style="font-size: 30px; margin-right: 10px;"></i>
                            Ms MS Chí Nên giải thích chi tiết:
                        </div>
                        
                        <div class="exp-section">
                            <span class="exp-label">Dịch nghĩa & Phân tích đáp án:</span>
                            <div class="exp-content">
                                <em>Câu gốc:</em> "${translation || 'Chưa có bản dịch'}"<br><br>
                                <strong>A.</strong> ${q.answerOptions[0].text}<br>
                                <strong>B.</strong> ${q.answerOptions[1].text}<br>
                                <strong>C.</strong> ${q.answerOptions[2].text}<br>
                                <strong>D.</strong> ${q.answerOptions[3].text}
                            </div>
                        </div>

                        <div class="exp-section">
                            <span class="exp-label" style="color: var(--correct-color);">Tại sao ĐÚNG?</span>
                            <div class="exp-content">
                                ${correctOpt ? correctOpt.rationale.split('Sai')[0].replace('Chính xác!', '') : ''}
                            </div>
                        </div>

                        <div class="exp-section">
                            <span class="exp-label" style="color: var(--wrong-color);">Tại sao SAI?</span>
                            <div class="exp-content">
                                <ul style="margin: 0; padding-left: 20px;">
                                    ${q.answerOptions.filter(o => !o.isCorrect).map(o => `<li>${o.rationale}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // Sound Effects
        const correctSound = new Audio("https://actions.google.com/sounds/v1/cartoon/clank_car_crash.ogg"); // Fallback
        // Using synthetic sounds for reliability without external assets if possible, 
        // but for now, simple frequency beeps are most reliable in single file without huge base64 blocks.
        
        function playSound(isCorrect) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (isCorrect) {
                // Ding sound (High pitch sine wave)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.1); // C6
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } else {
                // Buzz sound (Low pitch sawtooth)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        }

        // Check Answer Logic
        function checkAnswer(qIndex, optIndex, btnElement, isCorrect) {
            // Prevent re-clicking
            const card = document.getElementById(`q-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            if ([...buttons].some(b => b.disabled)) return;

            // Disable all buttons in this card
            buttons.forEach(b => b.disabled = true);

            // Update UI
            if (isCorrect) {
                btnElement.classList.add('correct');
                playSound(true);
                score++;
                
                // Confetti Effect
                const rect = btnElement.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { x: x, y: y },
                    colors: ['#00C9A7', '#8854C0', '#F3A683']
                });
            } else {
                btnElement.classList.add('wrong');
                playSound(false);
                
                // Highlight the correct answer automatically
                const correctBtnIndex = questions[qIndex].answerOptions.findIndex(o => o.isCorrect);
                buttons[correctBtnIndex].classList.add('correct'); // Show correct answer
            }

            answeredCount++;

            // Show Explanation
            const expBox = document.getElementById(`exp-${qIndex}`);
            expBox.style.display = 'block';
            
            // Scroll slightly to show explanation if on mobile
            if (window.innerWidth < 768) {
                setTimeout(() => {
                    expBox.scrollIntoView({behavior: "smooth", block: "nearest"});
                }, 300);
            }
        }

        // Submit & Show Results
        function submitQuiz() {
            if (answeredCount < questions.length) {
                const confirmSubmit = confirm(`Bạn mới làm ${answeredCount}/${questions.length} câu. Bạn có chắc chắn muốn nộp bài không?`);
                if (!confirmSubmit) return;
            }

            const modal = document.getElementById('resultModal');
            const scoreText = document.getElementById('finalScore');
            const feedback = document.getElementById('feedbackText');

            scoreText.textContent = `${score}/${questions.length}`;

            // Feedback Logic
            const percentage = (score / questions.length) * 100;
            if (percentage === 100) {
                feedback.textContent = "Xuất sắc! Bạn là thiên tài ngữ pháp! 🏆";
                confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
            } else if (percentage >= 80) {
                feedback.textContent = "Giỏi lắm! Cố gắng thêm chút nữa là hoàn hảo! 🌟";
            } else if (percentage >= 50) {
                feedback.textContent = "Tạm ổn! Hãy xem lại phần giải thích nhé! 💪";
            } else {
                feedback.textContent = "Cần cố gắng nhiều hơn! Đừng nản lòng nhé! 📚";
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        // Start the game
        initQuiz();

    </script>
