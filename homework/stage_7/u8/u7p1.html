<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chí Nên - Verb Tense Challenge</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #F0F3FF;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--primary-purple) 0.5px, transparent 0.5px), radial-gradient(var(--primary-purple) 0.5px, var(--bg-color) 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-purple), #a29bfe);
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1);
            color: white;
            width: 90%;
            max-width: 800px;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            margin: 5px 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .teacher-tag {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding-bottom: 80px;
        }

        /* Question Card */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05), 0 15px 20px rgba(0,0,0,0.05);
            border: 2px solid #fff;
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .question-number {
            background: var(--primary-teal);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3436;
            line-height: 1.4;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: #f1f2f6;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            padding: 15px 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #57606f;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 5px 0 #d1d1d1;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .btn-option .choice-label {
            width: 25px;
            height: 25px;
            background: #dfe4ea;
            color: #747d8c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            margin-right: 10px;
            font-weight: 800;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #d1d1d1;
            background: #ffffff;
            border-color: var(--primary-purple);
            color: var(--primary-purple);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #d1d1d1;
        }

        /* States */
        .btn-option.correct {
            background-color: var(--correct-green) !important;
            color: white !important;
            border-color: #00b85c !important;
            box-shadow: 0 5px 0 #00944a !important;
            transform: translateY(2px);
        }
        
        .btn-option.correct .choice-label {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .btn-option.wrong {
            background-color: var(--wrong-red) !important;
            color: white !important;
            border-color: #ff2e43 !important;
            box-shadow: 0 5px 0 #d61c2f !important;
            animation: shake 0.5s;
            transform: translateY(2px);
        }

        .btn-option.wrong .choice-label {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .btn-option:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            background: #f8f9fa;
            border-left: 5px solid var(--primary-purple);
            padding: 15px;
            border-radius: 10px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.show {
            display: block;
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary-purple);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-hint {
            font-style: italic;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-size: 0.95rem;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
        }

        .exp-details ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .exp-details li {
            margin-bottom: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            background: white;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        /* Submit Button */
        .submit-container {
            text-align: center;
            margin-top: 20px;
        }

        .btn-submit {
            background: linear-gradient(to bottom, #00C9A7, #00b899);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            box-shadow: 0 8px 0 #008c74;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Quicksand', sans-serif;
            width: 100%;
            max-width: 300px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 0 #008c74;
        }

        .btn-submit:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #008c74;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 5px solid var(--primary-purple);
        }

        .score-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary-purple);
            margin: 20px 0;
        }

        .feedback-msg {
            font-size: 1.2rem;
            color: #57606f;
            margin-bottom: 30px;
        }

        .btn-restart {
            background: var(--wrong-red);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #c23642;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0) translateY(2px); }
            25% { transform: translateX(-5px) translateY(2px); }
            50% { transform: translateX(5px) translateY(2px); }
            75% { transform: translateX(-5px) translateY(2px); }
            100% { transform: translateX(0) translateY(2px); }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            header h1 { font-size: 1.8rem; }
            .card { padding: 15px; }
            .question-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="teacher-tag">Giáo viên: Ms. Chí Nên</div>
        <h1><i class="fas fa-gamepad"></i> VERB TENSE CHALLENGE</h1>
        <p>Thử thách 30 câu chia động từ - Level Tiểu học</p>
    </header>

    <div class="container" id="quiz-container">
        <!-- Questions will be injected here via JS -->
    </div>

    <div class="submit-container">
        <button class="btn-submit" onclick="submitQuiz()">Nộp bài <i class="fas fa-trophy"></i></button>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2 style="color: var(--primary-teal); margin:0;">Kết quả</h2>
            <div class="score-display" id="finalScore">0/30</div>
            <p class="feedback-msg" id="feedbackMsg">Làm tốt lắm!</p>
            <button class="btn-restart" onclick="location.reload()">Làm lại <i class="fas fa-redo"></i></button>
        </div>
    </div>

    <!-- Audio Elements (Using Base64 sounds to ensure single-file functionality offline/online) -->
    <!-- Ding Sound (Short Chime) -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
    <!-- Buzz Sound (Short Error) -->
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" preload="auto"></audio>

    <script>
        // --- DATA INPUT ---
        // Dữ liệu từ file verb_tenses_comprehensive_30
        const rawQuestions = [
            {
            "questionNumber": 1,
            "question": "Look! The bus ______.",
            "answerOptions": [
                { "text": "comes", "rationale": "❌ Sai thì. 'Comes' là hiện tại đơn (thói quen).", "isCorrect": false },
                { "text": "is coming", "rationale": "✅ Đúng. 'Look!' là dấu hiệu Hiện tại tiếp diễn.", "isCorrect": true },
                { "text": "coming", "rationale": "❌ Sai ngữ pháp. Thiếu 'to be'.", "isCorrect": false },
                { "text": "came", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false }
            ],
            "hint": "Dấu hiệu 'Look!' diễn tả hành động đang xảy ra ngay lúc nói."
            },
            {
            "questionNumber": 2,
            "question": "She usually ______ to school by bike.",
            "answerOptions": [
                { "text": "go", "rationale": "❌ Sai chia động từ. 'She' cần thêm 'es'.", "isCorrect": false },
                { "text": "goes", "rationale": "✅ Đúng. 'Usually' là dấu hiệu Hiện tại đơn.", "isCorrect": true },
                { "text": "is going", "rationale": "❌ Sai thì. Tiếp diễn không dùng cho thói quen.", "isCorrect": false },
                { "text": "went", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false }
            ],
            "hint": "Trạng từ 'usually' là dấu hiệu của thì Hiện tại đơn."
            },
            {
            "questionNumber": 3,
            "question": "I ______ him three months ago.",
            "answerOptions": [
                { "text": "see", "rationale": "❌ Sai thì. Hiện tại.", "isCorrect": false },
                { "text": "saw", "rationale": "✅ Đúng. 'Ago' là dấu hiệu Quá khứ đơn.", "isCorrect": true },
                { "text": "have seen", "rationale": "❌ Sai thì. Hoàn thành không dùng với 'ago'.", "isCorrect": false },
                { "text": "seeing", "rationale": "❌ Sai ngữ pháp. V-ing đứng một mình.", "isCorrect": false }
            ],
            "hint": "Từ 'ago' chỉ một thời điểm xác định trong quá khứ."
            },
            {
            "questionNumber": 4,
            "question": "We ______ for Paris next week.",
            "answerOptions": [
                { "text": "leave", "rationale": "❌ Ít dùng hơn. Hiện tại đơn chỉ lịch trình tàu xe.", "isCorrect": false },
                { "text": "left", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false },
                { "text": "will leave", "rationale": "✅ Đúng. 'Next week' chỉ tương lai.", "isCorrect": true },
                { "text": "have left", "rationale": "❌ Sai thì. Hiện tại hoàn thành.", "isCorrect": false }
            ],
            "hint": "'Next week' là dấu hiệu của thì Tương lai."
            },
            {
            "questionNumber": 5,
            "question": "While I ______ my homework, the phone rang.",
            "answerOptions": [
                { "text": "did", "rationale": "❌ Sai thì. Cần thì tiếp diễn.", "isCorrect": false },
                { "text": "was doing", "rationale": "✅ Đúng. While + Quá khứ tiếp diễn (hành động nền).", "isCorrect": true },
                { "text": "am doing", "rationale": "❌ Sai thì. Vế sau là quá khứ.", "isCorrect": false },
                { "text": "do", "rationale": "❌ Sai thì. Hiện tại đơn.", "isCorrect": false }
            ],
            "hint": "Hành động đang diễn ra trong quá khứ khi hành động khác xen vào."
            },
            {
            "questionNumber": 6,
            "question": "He ______ in London for ten years.",
            "answerOptions": [
                { "text": "lives", "rationale": "❌ Sai thì. Hiện tại đơn.", "isCorrect": false },
                { "text": "has lived", "rationale": "✅ Đúng. 'For + time' là dấu hiệu Hiện tại hoàn thành.", "isCorrect": true },
                { "text": "is living", "rationale": "❌ Sai thì. Tiếp diễn chỉ sự tạm thời.", "isCorrect": false },
                { "text": "lived", "rationale": "❌ Chưa tối ưu. Dùng nếu đã chuyển đi nơi khác.", "isCorrect": false }
            ],
            "hint": "Dấu hiệu 'for ten years' thường dùng với thì Hoàn thành."
            },
            {
            "questionNumber": 7,
            "question": "Listen! Someone ______ at the door.",
            "answerOptions": [
                { "text": "knock", "rationale": "❌ Sai ngữ pháp (chia động từ) và sai thì.", "isCorrect": false },
                { "text": "knocks", "rationale": "❌ Sai thì. Hiện tại đơn.", "isCorrect": false },
                { "text": "is knocking", "rationale": "✅ Đúng. 'Listen!' là dấu hiệu hành động đang xảy ra.", "isCorrect": true },
                { "text": "knocked", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false }
            ],
            "hint": "Dấu hiệu 'Listen!' cho biết hành động đang diễn ra."
            },
            {
            "questionNumber": 8,
            "question": "They ______ dinner when I arrived.",
            "answerOptions": [
                { "text": "were having", "rationale": "✅ Đúng. Hành động đang xảy ra tại thời điểm quá khứ.", "isCorrect": true },
                { "text": "had", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false },
                { "text": "are having", "rationale": "❌ Sai thì. Không hòa hợp thì với 'arrived'.", "isCorrect": false },
                { "text": "have", "rationale": "❌ Sai thì. Hiện tại đơn.", "isCorrect": false }
            ],
            "hint": "Hành động 'ăn tối' đang diễn ra thì hành động 'tôi đến' xen vào."
            },
            {
            "questionNumber": 9,
            "question": "I promise I ______ you tomorrow.",
            "answerOptions": [
                { "text": "help", "rationale": "❌ Sai thì. Hiện tại đơn.", "isCorrect": false },
                { "text": "will help", "rationale": "✅ Đúng. 'Promise' (hứa) dùng với 'will'.", "isCorrect": true },
                { "text": "am helping", "rationale": "❌ Sai thì. Tiếp diễn dùng cho kế hoạch chắc chắn.", "isCorrect": false },
                { "text": "helped", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false }
            ],
            "hint": "Lời hứa (promise) thường dùng với 'will'."
            },
            {
            "questionNumber": 10,
            "question": "The sun ______ in the East.",
            "answerOptions": [
                { "text": "rise", "rationale": "❌ Sai ngữ pháp. 'Sun' số ít cần 's'.", "isCorrect": false },
                { "text": "rises", "rationale": "✅ Đúng. Sự thật hiển nhiên -> Hiện tại đơn.", "isCorrect": true },
                { "text": "rose", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false },
                { "text": "is rising", "rationale": "❌ Sai thì. Hiện tại tiếp diễn.", "isCorrect": false }
            ],
            "hint": "Đây là một sự thật hiển nhiên (fact)."
            },
            {
            "questionNumber": 11,
            "question": "She ______ just ______ her homework.",
            "answerOptions": [
                { "text": "has / finished", "rationale": "✅ Đúng. 'Just' dùng với Hiện tại hoàn thành.", "isCorrect": true },
                { "text": "have / finished", "rationale": "❌ Sai trợ động từ. 'She' đi với 'has'.", "isCorrect": false },
                { "text": "did / finish", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false },
                { "text": "is / finishing", "rationale": "❌ Sai thì. Tiếp diễn không dùng 'just' kiểu này.", "isCorrect": false }
            ],
            "hint": "'Just' là dấu hiệu nhận biết đặc trưng của thì Hiện tại hoàn thành."
            },
            {
            "questionNumber": 12,
            "question": "At this time yesterday, we ______ football.",
            "answerOptions": [
                { "text": "played", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false },
                { "text": "were playing", "rationale": "✅ Đúng. Giờ cụ thể trong quá khứ -> QK Tiếp diễn.", "isCorrect": true },
                { "text": "are playing", "rationale": "❌ Sai thì. Hiện tại tiếp diễn.", "isCorrect": false },
                { "text": "play", "rationale": "❌ Sai thì. Hiện tại đơn.", "isCorrect": false }
            ],
            "hint": "Thời điểm cụ thể trong quá khứ dùng Quá khứ tiếp diễn."
            },
            {
            "questionNumber": 13,
            "question": "I ______ to the cinema tonight. I have a ticket.",
            "answerOptions": [
                { "text": "will go", "rationale": "❌ Không chính xác. 'Will' dùng cho quyết định tức thì.", "isCorrect": false },
                { "text": "am going", "rationale": "✅ Đúng. Kế hoạch chắc chắn (có vé) -> HT Tiếp diễn.", "isCorrect": true },
                { "text": "go", "rationale": "❌ Sai thì. Hiện tại đơn.", "isCorrect": false },
                { "text": "went", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false }
            ],
            "hint": "Một kế hoạch đã được sắp xếp (có vé) thường dùng Hiện tại tiếp diễn mang nghĩa tương lai."
            },
            {
            "questionNumber": 14,
            "question": "He ______ his keys yesterday.",
            "answerOptions": [
                { "text": "loses", "rationale": "❌ Sai thì. Hiện tại đơn.", "isCorrect": false },
                { "text": "lost", "rationale": "✅ Đúng. 'Yesterday' -> Quá khứ đơn.", "isCorrect": true },
                { "text": "has lost", "rationale": "❌ Sai thì. Hoàn thành không đi với 'yesterday'.", "isCorrect": false },
                { "text": "was losing", "rationale": "❌ Sai ngữ cảnh. Không phải quá trình kéo dài.", "isCorrect": false }
            ],
            "hint": "'Yesterday' là dấu hiệu của Quá khứ đơn."
            },
            {
            "questionNumber": 15,
            "question": "Water ______ at 100 degrees Celsius.",
            "answerOptions": [
                { "text": "boil", "rationale": "❌ Sai ngữ pháp. 'Water' số ít cần 's'.", "isCorrect": false },
                { "text": "is boiling", "rationale": "❌ Sai thì. Chỉ hành động đang xảy ra, không phải chân lý.", "isCorrect": false },
                { "text": "boils", "rationale": "✅ Đúng. Chân lý khoa học -> Hiện tại đơn.", "isCorrect": true },
                { "text": "boiled", "rationale": "❌ Sai thì. Quá khứ đơn.", "isCorrect": false }
            ],
            "hint": "Sự thật hiển nhiên về vật lý dùng Hiện tại đơn."
            },

        // --- GAME LOGIC ---

        // 1. Shuffle Function (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Shuffle questions immediately
        let questions = shuffle([...rawQuestions]);
        let userScore = 0;

        // 2. Render Questions
        const quizContainer = document.getElementById('quiz-container');

        function renderQuiz() {
            quizContainer.innerHTML = '';
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Create HTML for options
                let optionsHtml = '';
                // Note: We don't shuffle options inside the card to keep A,B,C,D order consistent with explanation logic
                // But we can shuffle if we map indices dynamically. For simplicity and clarity in explanation, we keep order.
                const labels = ['A', 'B', 'C', 'D'];
                
                q.answerOptions.forEach((opt, idx) => {
                    optionsHtml += `
                        <button class="btn-option" onclick="checkAnswer(this, ${index}, ${opt.isCorrect}, '${labels[idx]}')">
                            <span class="choice-label">${labels[idx]}</span>
                            ${opt.text}
                        </button>
                    `;
                });

                // Create Explanation Content
                let explanationItems = '';
                q.answerOptions.forEach((opt, idx) => {
                    explanationItems += `<li><strong>${labels[idx]}. ${opt.text}:</strong> ${opt.rationale}</li>`;
                });

                card.innerHTML = `
                    <div class="question-number">Câu ${index + 1}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid">
                        ${optionsHtml}
                    </div>
                    
                    <div class="explanation-box" id="exp-${index}">
                        <div class="exp-header"><i class="fas fa-chalkboard-teacher"></i> MS Chí Nên giải thích:</div>
                        <div class="exp-hint">💡 Gợi ý: ${q.hint}</div>
                        <div class="exp-details">
                            <ul>
                                ${explanationItems}
                            </ul>
                        </div>
                    </div>
                `;
                quizContainer.appendChild(card);
            });
        }

        // 3. Check Answer Function
        function checkAnswer(btn, questionIndex, isCorrect, label) {
            const card = btn.closest('.card');
            const allBtns = card.querySelectorAll('.btn-option');
            const expBox = document.getElementById(`exp-${questionIndex}`);

            // Prevent multiple clicks
            if (btn.disabled) return;

            // Disable all buttons in this card
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                // Handle Correct
                btn.classList.add('correct');
                playSound('correct');
                triggerConfetti(btn);
                userScore++;
            } else {
                // Handle Wrong
                btn.classList.add('wrong');
                playSound('wrong');
                // Highlight the correct answer automatically
                const correctBtnIndex = questions[questionIndex].answerOptions.findIndex(o => o.isCorrect);
                if (correctBtnIndex !== -1) {
                    allBtns[correctBtnIndex].classList.add('correct');
                }
            }

            // Show Explanation immediately
            expBox.classList.add('show');
        }

        // 4. Sound Effects
        function playSound(type) {
            const sound = document.getElementById(type === 'correct' ? 'sound-correct' : 'sound-wrong');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play failed interaction required"));
            }
        }

        // 5. Confetti Effect
        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            // Normalize coordinates to 0-1 range
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;

            confetti({
                particleCount: 60,
                spread: 70,
                origin: { x: x, y: y },
                colors: ['#00C9A7', '#8854C0', '#FF4757'],
                disableForReducedMotion: true
            });
        }

        // 6. Submit Function
        function submitQuiz() {
            const modal = document.getElementById('resultModal');
            const finalScoreEl = document.getElementById('finalScore');
            const feedbackEl = document.getElementById('feedbackMsg');
            
            finalScoreEl.textContent = `${userScore}/30`;
            
            let msg = "";
            if (userScore === 30) msg = "Tuyệt đối! Em là thiên tài ngữ pháp! 🌟";
            else if (userScore >= 25) msg = "Rất xuất sắc! Cô Chí Nên tự hào về em! 🎉";
            else if (userScore >= 15) msg = "Khá lắm! Cố gắng luyện thêm xíu nữa nhé! 💪";
            else msg = "Đừng buồn nhé! Hãy xem lại phần giải thích để tiến bộ hơn! 🌱";

            feedbackEl.textContent = msg;
            modal.style.display = 'flex';
            
            // Big confetti
            confetti({
                particleCount: 150,
                spread: 180,
                origin: { y: 0.6 }
            });
        }

        // Initialize
        window.onload = renderQuiz;

    </script>
