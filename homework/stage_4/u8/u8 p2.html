<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms Mai An ULIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-pink: #8854C0;
            --primary-teal: #00C9A7;
            --correct-color: #00D26A;
            --wrong-color: #FF4757;
            --bg-color: #F0F4F8;
            --text-color: #2D3436;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e0f7fa;
            background-image: radial-gradient(#00C9A7 15%, transparent 16%), radial-gradient(#8854C0 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 30px;
            position: relative;
            border: 4px solid var(--primary-pink);
            overflow: hidden;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px dashed #ddd;
            padding-bottom: 15px;
        }

        h1 {
            color: var(--primary-pink);
            font-family: 'Quicksand', sans-serif;
            font-size: 24px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--primary-teal);
            font-weight: 700;
            font-size: 16px;
        }

        /* Progress Bar */
        .progress-container {
            background: #eee;
            border-radius: 20px;
            height: 15px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
            border: 2px solid #ccc;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary-teal), var(--primary-pink));
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 20px;
        }

        /* Question Box */
        .question-box {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 3px solid var(--primary-teal);
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            color: #333;
            box-shadow: 0 5px 0 #009e82;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 3px solid #ddd;
            border-radius: 15px;
            padding: 15px;
            font-size: 18px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #bbb;
            color: #555;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: var(--primary-pink);
            color: var(--primary-pink);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #bbb;
        }

        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00a352;
            box-shadow: 0 5px 0 #00a352;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #d63030;
            box-shadow: 0 5px 0 #d63030;
            animation: shake 0.5s;
        }

        /* Explanation Section */
        #explanation-area {
            margin-top: 30px;
            background: #fff9f0;
            border: 2px solid #ffcc80;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden initially */
        }

        .exp-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .exp-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        .exp-content h3 {
            margin: 10px 0;
            font-size: 18px;
            color: var(--primary-pink);
        }

        .exp-content ul {
            list-style: none;
            padding: 0;
        }

        .exp-content li {
            margin-bottom: 5px;
            padding: 5px 10px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        
        .exp-tag {
            font-size: 12px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            text-transform: uppercase;
        }
        
        .tag-verb { background: #e3f2fd; color: #1565c0; }
        .tag-adj { background: #fff3e0; color: #ef6c00; }
        .tag-adv { background: #e8f5e9; color: #2e7d32; }
        .tag-noun { background: #f3e5f5; color: #7b1fa2; }

        .why-correct {
            background: #e8f5e9;
            padding: 10px;
            border-radius: 10px;
            border-left: 5px solid var(--correct-color);
            margin-top: 10px;
        }

        .why-wrong {
            background: #ffebee;
            padding: 10px;
            border-radius: 10px;
            border-left: 5px solid var(--wrong-color);
            margin-top: 10px;
        }

        /* Next Button */
        #next-btn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #5e3a85;
            transition: all 0.2s;
        }

        #next-btn:hover {
            filter: brightness(1.1);
        }
        
        #next-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #5e3a85;
        }

        /* Result Modal */
        #result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--primary-teal);
        }

        .score-display {
            font-size: 60px;
            font-weight: 800;
            color: var(--primary-pink);
            margin: 20px 0;
        }

        .feedback-text {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
        }

        .restart-btn {
            background: var(--primary-teal);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #00876f;
        }
        
        .restart-btn:active {
             transform: translateY(4px);
             box-shadow: 0 1px 0 #00876f;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .question-box {
                font-size: 18px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Giáo viên tạo: Ms Mai An ULIS</h1>
            <div class="subtitle">Super Grammar Challenge (Grade 3-4-5)</div>
        </header>

        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #666;">
            <span id="question-count">Câu: 1/30</span>
            <span id="score-count">Điểm: 0</span>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-box" id="question-text">
            Loading question...
        </div>

        <div class="options-grid" id="options-container">
            </div>

        <div id="explanation-area">
            <div class="exp-header">
                <div class="exp-avatar">M</div>
                <div style="font-weight: bold; color: var(--primary-pink);">Cô Mai An giải thích:</div>
            </div>
            <div class="exp-content" id="exp-content">
                </div>
        </div>

        <button id="next-btn" onclick="nextQuestion()">Câu Tiếp Theo <i class="fas fa-arrow-right"></i></button>
    </div>

    <div id="result-modal">
        <div class="result-card">
            <h2 style="color: var(--primary-teal);">HOÀN THÀNH! 🎉</h2>
            <div class="score-display" id="final-score">0/30</div>
            <div class="feedback-text" id="final-feedback">Bạn làm rất tốt!</div>
            <button class="restart-btn" onclick="location.reload()">Làm Lại Bài <i class="fas fa-redo"></i></button>
        </div>
    </div>

    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sound-finish" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <script>
        // --- DỮ LIỆU CÂU HỎI (30 Câu - Mix các thì cơ bản) ---
        // Format: Question, Options, Correct Index, Explanation Object
        const rawQuestions = [
            {
                q: "Look! The bus _______ .",
                options: ["come", "comes", "is coming", "came"],
                correct: 2,
                exp: {
                    translation: "Nhìn kìa! Xe buýt đang tới.",
                    analysis: [
                        {w: "come", t: "v", m: "đến (nguyên thể)"},
                        {w: "comes", t: "v", m: "đến (hiện tại đơn - số ít)"},
                        {w: "is coming", t: "v", m: "đang đến (hiện tại tiếp diễn)"},
                        {w: "came", t: "v", m: "đã đến (quá khứ đơn)"}
                    ],
                    correctReason: "Dấu hiệu 'Look!' (Nhìn kìa!) đứng đầu câu kèm dấu chấm than -> Diễn tả hành động đang xảy ra ngay lúc nói -> Dùng thì **Hiện tại tiếp diễn** (S + am/is/are + Ving).",
                    wrongReason: "Các đáp án A, B là hiện tại đơn (chỉ thói quen); D là quá khứ đơn (đã xảy ra). Đều không phù hợp với mệnh lệnh từ 'Look!'."
                }
            },
            {
                q: "She always _______ her homework after dinner.",
                options: ["do", "does", "doing", "did"],
                correct: 1,
                exp: {
                    translation: "Cô ấy luôn làm bài tập về nhà sau bữa tối.",
                    analysis: [
                        {w: "do", t: "v", m: "làm (số nhiều/nguyên thể)"},
                        {w: "does", t: "v", m: "làm (số ít)"},
                        {w: "doing", t: "v", m: "đang làm"},
                        {w: "did", t: "v", m: "đã làm"}
                    ],
                    correctReason: "Có trạng từ chỉ tần suất '**always**' (luôn luôn) -> Dùng thì **Hiện tại đơn**. Chủ ngữ là 'She' (ngôi thứ 3 số ít) nên động từ 'do' phải thêm 'es' thành 'does'.",
                    wrongReason: "A sai vì thiếu 'es'. C sai vì thiếu tobe. D sai vì là quá khứ."
                }
            },
            {
                q: "I _______ my grandparents yesterday.",
                options: ["visit", "visited", "visiting", "visits"],
                correct: 1,
                exp: {
                    translation: "Tôi đã thăm ông bà vào hôm qua.",
                    analysis: [
                        {w: "visit", t: "v", m: "thăm (hiện tại)"},
                        {w: "visited", t: "v", m: "đã thăm (quá khứ)"},
                        {w: "visiting", t: "v", m: "đang thăm"},
                        {w: "visits", t: "v", m: "thăm (số ít)"}
                    ],
                    correctReason: "Có từ '**yesterday**' (hôm qua) -> Dấu hiệu của thì **Quá khứ đơn**. Động từ 'visit' là động từ có quy tắc, thêm đuôi '-ed'.",
                    wrongReason: "A, C, D đều là các dạng chia ở hiện tại, không dùng cho quá khứ."
                }
            },
            {
                q: "_______ you go to school by bus every day?",
                options: ["Do", "Does", "Are", "Is"],
                correct: 0,
                exp: {
                    translation: "Bạn có đi học bằng xe buýt mỗi ngày không?",
                    analysis: [
                        {w: "Do", t: "trợ từ", m: "dùng cho I/You/We/They"},
                        {w: "Does", t: "trợ từ", m: "dùng cho He/She/It"},
                        {w: "Are", t: "tobe", m: "thì/là/ở"},
                        {w: "Is", t: "tobe", m: "thì/là/ở"}
                    ],
                    correctReason: "Câu hỏi thì **Hiện tại đơn** với động từ thường 'go'. Chủ ngữ là '**you**' -> Dùng trợ động từ '**Do**' đảo lên đầu câu.",
                    wrongReason: "B dùng cho số ít (She/He). C, D là động từ Tobe, không đi trực tiếp với động từ thường 'go' ở dạng nguyên thể."
                }
            },
            {
                q: "They _______ play football next Sunday.",
                options: ["will", "did", "are", "do"],
                correct: 0,
                exp: {
                    translation: "Họ sẽ chơi bóng đá vào Chủ nhật tới.",
                    analysis: [
                        {w: "will", t: "modal v", m: "sẽ (tương lai)"},
                        {w: "did", t: "trợ từ", m: "đã (quá khứ)"},
                        {w: "are", t: "tobe", m: "thì/là/ở"},
                        {w: "do", t: "trợ từ", m: "làm"}
                    ],
                    correctReason: "Có từ '**next Sunday**' (Chủ nhật tới) -> Dấu hiệu của thì **Tương lai đơn**. Cấu trúc: S + will + V(nguyên thể).",
                    wrongReason: "B là quá khứ. C sai vì 'are play' sai ngữ pháp (phải là are playing). D là hiện tại."
                }
            },
            {
                q: "He _______ never _______ to London.",
                options: ["have / been", "has / been", "has / be", "have / be"],
                correct: 1,
                exp: {
                    translation: "Anh ấy chưa bao giờ đến London.",
                    analysis: [
                        {w: "have/has", t: "trợ từ", m: "của thì HTHT"},
                        {w: "been", t: "V3/ed", m: "đã ở/đến (phân từ 2 của be)"}
                    ],
                    correctReason: "Câu dùng thì **Hiện tại hoàn thành** để diễn tả trải nghiệm. Chủ ngữ 'He' dùng trợ từ '**has**'. Công thức: S + has + V3/ed (been).",
                    wrongReason: "A sai vì 'He' không đi với 'have'. C, D sai vì sau have/has phải là V3 (been) chứ không phải nguyên thể (be)."
                }
            },
            {
                q: "Where _______ you last summer?",
                options: ["were", "was", "are", "do"],
                correct: 0,
                exp: {
                    translation: "Bạn đã ở đâu mùa hè trước?",
                    analysis: [
                        {w: "were", t: "tobe", m: "đã là/ở (số nhiều/you)"},
                        {w: "was", t: "tobe", m: "đã là/ở (số ít)"},
                        {w: "are", t: "tobe", m: "là/ở (hiện tại)"},
                        {w: "do", t: "trợ từ", m: "làm"}
                    ],
                    correctReason: "Có '**last summer**' -> Quá khứ đơn. Động từ trong câu là tobe (hỏi về địa điểm). Chủ ngữ 'you' đi với tobe quá khứ là '**were**'.",
                    wrongReason: "B dùng cho I/He/She/It. C là hiện tại. D sai vì không có động từ thường trong câu."
                }
            },
            {
                q: "Please be quiet! The baby _______ .",
                options: ["sleeps", "slept", "is sleeping", "are sleeping"],
                correct: 2,
                exp: {
                    translation: "Làm ơn trật tự đi! Em bé đang ngủ.",
                    analysis: [
                        {w: "sleeps", t: "v", m: "ngủ (thường xuyên)"},
                        {w: "slept", t: "v", m: "đã ngủ"},
                        {w: "is sleeping", t: "v", m: "đang ngủ"},
                        {w: "are sleeping", t: "v", m: "đang ngủ (số nhiều)"}
                    ],
                    correctReason: "Câu mệnh lệnh 'Please be quiet!' cho biết hành động đang diễn ra -> Thì **Hiện tại tiếp diễn**. Chủ ngữ 'The baby' (số ít) -> dùng '**is sleeping**'.",
                    wrongReason: "A là thói quen. B là quá khứ. D sai tobe 'are' (vì baby là số ít)."
                }
            },
            {
                q: "_______ she _______ a new car two days ago?",
                options: ["Did / buy", "Do / buy", "Did / bought", "Does / buy"],
                correct: 0,
                exp: {
                    translation: "Cô ấy đã mua một chiếc xe mới cách đây 2 ngày phải không?",
                    analysis: [
                        {w: "Did", t: "trợ từ", m: "đã (quá khứ)"},
                        {w: "buy", t: "v", m: "mua (nguyên thể)"},
                        {w: "bought", t: "v", m: "đã mua (V-ed/cột 2)"}
                    ],
                    correctReason: "Có '**ago**' -> Quá khứ đơn. Câu hỏi dạng Yes/No ở quá khứ: **Did** + S + **V(nguyên thể)**. Vậy chọn 'Did' và 'buy'.",
                    wrongReason: "C sai vì sau Did động từ phải về nguyên thể (không dùng bought). B, D là hiện tại đơn."
                }
            },
            {
                q: "I _______ hungry right now.",
                options: ["am", "is", "are", "be"],
                correct: 0,
                exp: {
                    translation: "Bây giờ tớ đang đói.",
                    analysis: [
                        {w: "am", t: "tobe", m: "đi với I"},
                        {w: "is", t: "tobe", m: "đi với He/She/It"},
                        {w: "are", t: "tobe", m: "đi với You/We/They"},
                        {w: "be", t: "v", m: "nguyên thể"}
                    ],
                    correctReason: "Mô tả trạng thái ở hiện tại ('now'). Chủ ngữ là 'I' luôn đi với tobe '**am**'.",
                    wrongReason: "B, C sai ngôi. D sai dạng (phải chia động từ)."
                }
            },
             {
                q: "He usually _______ to school by bike, but today he _______ by bus.",
                options: ["goes / goes", "go / is going", "goes / is going", "is going / goes"],
                correct: 2,
                exp: {
                    translation: "Cậu ấy thường đi học bằng xe đạp, nhưng hôm nay cậu ấy đi bằng xe buýt.",
                    analysis: [
                        {w: "usually", t: "adv", m: "thường xuyên (HTĐ)"},
                        {w: "today", t: "adv", m: "hôm nay (dùng HTTD để chỉ sự thay đổi tạm thời)"}
                    ],
                    correctReason: "Vế 1: 'usually' -> Hiện tại đơn (He **goes**). Vế 2: 'but today' (sự việc tạm thời khác thường lệ) -> Hiện tại tiếp diễn (he **is going**).",
                    wrongReason: "A sai vế 2 (không dùng hiện tại đơn cho hành động tạm thời). B sai vế 1 (He phải thêm es). D ngược thứ tự thì."
                }
            },
            {
                q: "We _______ a comic book at the moment.",
                options: ["reading", "are reading", "read", "is reading"],
                correct: 1,
                exp: {
                    translation: "Chúng tôi đang đọc truyện tranh ngay lúc này.",
                    analysis: [
                        {w: "reading", t: "V-ing", m: "đang đọc (thiếu tobe)"},
                        {w: "are reading", t: "v", m: "đang đọc (số nhiều)"},
                        {w: "read", t: "v", m: "đọc (hiện tại đơn)"},
                        {w: "is reading", t: "v", m: "đang đọc (số ít)"}
                    ],
                    correctReason: "Có '**at the moment**' -> Hiện tại tiếp diễn. Chủ ngữ 'We' (số nhiều) đi với '**are reading**'.",
                    wrongReason: "A thiếu tobe. C sai thì. D sai tobe (is dùng cho số ít)."
                }
            },
            {
                q: "Tom _______ not _______ his homework yet.",
                options: ["has / finished", "have / finished", "did / finish", "is / finishing"],
                correct: 0,
                exp: {
                    translation: "Tom vẫn chưa làm xong bài tập về nhà.",
                    analysis: [
                        {w: "yet", t: "adv", m: "chưa (dấu hiệu HTHT)"},

        // --- GAME LOGIC ---
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        // Shuffle Function (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initGame() {
            // Clone and Shuffle questions
            questions = JSON.parse(JSON.stringify(rawQuestions));
            shuffleArray(questions);
            
            // Reset state
            currentQuestionIndex = 0;
            score = 0;
            isAnswered = false;
            
            // UI Reset
            document.getElementById('result-modal').style.display = 'none';
            document.getElementById('score-count').innerText = `Điểm: 0`;
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            const qData = questions[currentQuestionIndex];
            
            // Update Progress
            document.getElementById('question-count').innerText = `Câu: ${currentQuestionIndex + 1}/${questions.length}`;
            const percent = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            // Display Question
            document.getElementById('question-text').innerText = qData.q;

            // Display Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // Hide Explanation & Next Btn
            document.getElementById('explanation-area').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<strong>${String.fromCharCode(65 + index)}.</strong> ${opt}`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const qData = questions[currentQuestionIndex];
            const correctIndex = qData.correct;
            const allBtns = document.querySelectorAll('.option-btn');

            // Disable all buttons
            allBtns.forEach(btn => btn.disabled = true);

            // Logic Check
            if (selectedIndex === correctIndex) {
                // Correct
                btnElement.classList.add('correct');
                score++;
                document.getElementById('score-count').innerText = `Điểm: ${score}`;
                document.getElementById('sound-correct').play();
                triggerConfetti();
            } else {
                // Wrong
                btnElement.classList.add('wrong');
                // Highlight correct one
                allBtns[correctIndex].classList.add('correct');
                document.getElementById('sound-wrong').play();
            }

            // Show Explanation
            renderExplanation(qData);
            document.getElementById('next-btn').style.display = 'block';
            
            // Scroll to explanation on mobile
            setTimeout(() => {
                document.getElementById('explanation-area').scrollIntoView({behavior: "smooth", block: "start"});
            }, 300);
        }

        function renderExplanation(qData) {
            const expDiv = document.getElementById('explanation-area');
            const expContent = document.getElementById('exp-content');
            
            // Generate Analysis HTML
            let analysisHTML = '';
            qData.exp.analysis.forEach((item, idx) => {
                let tagClass = 'tag-noun';
                if(item.t.includes('v') || item.t.includes('động')) tagClass = 'tag-verb';
                if(item.t.includes('adj') || item.t.includes('tính')) tagClass = 'tag-adj';
                if(item.t.includes('adv') || item.t.includes('trạng')) tagClass = 'tag-adv';

                analysisHTML += `<li><span class="exp-tag ${tagClass}">${item.t}</span> <strong>${item.w}:</strong> ${item.m}</li>`;
            });

            expContent.innerHTML = `
                <div style="font-style: italic; margin-bottom: 10px; color: #555;">"${qData.exp.translation}"</div>
                <h4>🔎 Phân tích đáp án:</h4>
                <ul>${analysisHTML}</ul>
                <div class="why-correct">
                    <strong>✅ Tại sao ĐÚNG:</strong><br>
                    ${qData.exp.correctReason}
                </div>
                <div class="why-wrong">
                    <strong>❌ Tại sao SAI:</strong><br>
                    ${qData.exp.wrongReason}
                </div>
            `;
            
            expDiv.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
                document.body.scrollIntoView({behavior: "smooth", block: "start"});
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('progress-bar').style.width = '100%';
            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('final-score');
            const feedback = document.getElementById('final-feedback');
            
            scoreDisplay.innerText = `${score}/${questions.length}`;
            
            let msg = "";
            const percent = (score / questions.length) * 100;
            if(percent === 100) msg = "Xuất sắc! Bạn là thiên tài ngữ pháp! 🌟";
            else if(percent >= 80) msg = "Giỏi lắm! Chỉ sai một chút xíu thôi! 💪";
            else if(percent >= 50) msg = "Khá tốt! Cần ôn lại vài thì nhé! 📚";
            else msg = "Cố lên! Hãy làm lại để nhớ kiến thức hơn nhé! 🔥";

            feedback.innerText = msg;
            modal.style.display = 'flex';
            document.getElementById('sound-finish').play();
            triggerConfetti();
        }

        function triggerConfetti() {
            var duration = 1500;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function random(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              // since particles fall down, start a bit higher than random
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // Start Game
        window.onload = initGame;

    </script>
