<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Ngữ Pháp - Ms Mai An ULIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f3f5;
            --text-color: #2d3436;
            --card-shadow: 0 10px 0px rgba(0,0,0,0.1);
            --btn-shadow: 0 6px 0px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e0f7fa;
            background-image: radial-gradient(#00C9A7 15%, transparent 16%), radial-gradient(#8854C0 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            position: relative;
            margin-top: 20px;
            border: 4px solid var(--primary-purple);
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-teal));
            padding: 20px;
            border-radius: 20px;
            color: white;
            box-shadow: var(--card-shadow);
        }

        header h1 {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        header h2 {
            margin: 5px 0 0;
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 600;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #ddd;
            border-radius: 50px;
            height: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 2px solid #ccc;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-teal);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 50px;
        }

        /* Question Card */
        .question-box {
            background: #fff;
            border: 3px solid #eee;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-purple);
            position: relative;
        }

        .question-number {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background-color: white;
            border: 3px solid #e0e0e0;
            border-bottom: 6px solid #e0e0e0; /* 3D effect */
            border-radius: 15px;
            padding: 15px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: var(--primary-teal);
            border-bottom-color: var(--primary-teal);
            background-color: #f0fffa;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .option-btn.correct {
            background-color: var(--correct-green) !important;
            color: white !important;
            border-color: #00a653 !important;
            border-bottom-color: #008f47 !important;
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            color: white !important;
            border-color: #d63031 !important;
            border-bottom-color: #b71c1c !important;
            animation: shake 0.5s;
        }

        /* Explanation Section */
        #explanation-container {
            display: none;
            margin-top: 25px;
            background: #fff;
            border-radius: 15px;
            border: 2px dashed var(--primary-purple);
            overflow: hidden;
            animation: slideDown 0.4s ease-out;
        }

        .exp-header {
            background: #f3e5f5;
            padding: 10px 20px;
            font-weight: 800;
            color: var(--primary-purple);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-content {
            padding: 20px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .exp-section {
            margin-bottom: 15px;
        }

        .exp-section strong {
            color: var(--primary-purple);
            display: block;
            margin-bottom: 5px;
        }

        .vocab-list {
            list-style: none;
            padding: 0;
            background: #fafafa;
            padding: 10px;
            border-radius: 10px;
        }
        
        .vocab-list li {
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
            margin-right: 5px;
        }
        .badge-type { background-color: #a29bfe; }
        .badge-correct { background-color: var(--correct-green); }
        .badge-wrong { background-color: var(--wrong-red); }

        /* Next Button */
        #next-btn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background-color: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #6c429c;
            transition: all 0.2s;
        }

        #next-btn:hover {
            transform: scale(1.02);
            background-color: #9b59b6;
        }

        #next-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #6c429c;
        }

        /* Result Screen */
        #result-screen {
            display: none;
            text-align: center;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            background: var(--primary-teal);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: 800;
            color: white;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 0 0 5px var(--primary-teal);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Bài Tập Ngữ Pháp Tổng Hợp</h1>
        <h2>Giáo viên: Ms Mai An ULIS</h2>
    </header>

    <div id="quiz-area">
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-box">
            <span class="question-number">Câu <span id="q-current">1</span>/<span id="q-total">30</span></span>
            <div id="question-text">Loading...</div>
        </div>

        <div class="options-grid" id="options-container">
            </div>

        <div id="explanation-container">
            <div class="exp-header">
                <span>👩‍🏫 Ms Mai An giải thích:</span>
            </div>
            <div class="exp-content" id="exp-content">
                </div>
        </div>

        <button id="next-btn" onclick="nextQuestion()">Câu Tiếp Theo ➔</button>
    </div>

    <div id="result-screen">
        <h2>🎉 HOÀN THÀNH BÀI THI! 🎉</h2>
        <div class="score-circle">
            <span id="final-score">0</span>
        </div>
        <p id="final-msg" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
        <button id="next-btn" style="display:block" onclick="location.reload()">Làm Lại Bài Thi 🔄</button>
    </div>
</div>

<script>
    // --- DATABASE: 30 Questions (Mixed Tenses for Grade 3-4) ---
    // Tenses: Present Simple, Present Continuous, Past Simple, Present Perfect, Future Simple
    
    const rawQuestions = [
        {
            question: "Look! The boys ______ football in the playground.",
            options: ["A. play", "B. are playing", "C. played", "D. will play"],
            correct: 1, // Index 0-3
            explanation: {
                vocab: [
                    "A. play (v): chơi (Hiện tại đơn)",
                    "B. are playing (v): đang chơi (Hiện tại tiếp diễn)",
                    "C. played (v): đã chơi (Quá khứ đơn)",
                    "D. will play (v): sẽ chơi (Tương lai đơn)"
                ],
                trans: "Nhìn kìa! Các cậu bé đang đá bóng trong sân chơi.",
                correctReason: "Có từ tín hiệu 'Look!' (Nhìn kìa!) đứng đầu câu → Dấu hiệu của thì **Hiện tại tiếp diễn** (hành động đang xảy ra ngay lúc nói).",
                wrongReason: "Các đáp án A, C, D sai về thì. 'Look!' yêu cầu một hành động đang diễn ra."
            }
        },
        {
            question: "I ______ to the zoo last Sunday.",
            options: ["A. go", "B. goes", "C. went", "D. going"],
            correct: 2,
            explanation: {
                vocab: [
                    "A. go (v): đi (nguyên thể)",
                    "B. goes (v): đi (chia ngôi thứ 3 số ít)",
                    "C. went (v): đã đi (Quá khứ của go)",
                    "D. going (v): đang đi (V-ing)"
                ],
                trans: "Tớ đã đi sở thú vào Chủ nhật tuần trước.",
                correctReason: "Có cụm từ 'last Sunday' (Chủ nhật trước) → Dấu hiệu của thì **Quá khứ đơn**.",
                wrongReason: "A, B là hiện tại. D thiếu động từ tobe. C là dạng quá khứ của 'go' nên đúng."
            }
        },
        {
            question: "She usually ______ up at 6 o'clock every morning.",
            options: ["A. get", "B. gets", "C. is getting", "D. got"],
            correct: 1,
            explanation: {
                vocab: [
                    "A. get (v): thức dậy (số nhiều)",
                    "B. gets (v): thức dậy (số ít)",
                    "C. is getting (v): đang thức dậy",
                    "D. got (v): đã thức dậy"
                ],
                trans: "Cô ấy thường thức dậy lúc 6 giờ mỗi sáng.",
                correctReason: "Có từ 'usually' và 'every morning' → Dấu hiệu của thì **Hiện tại đơn** diễn tả thói quen. Chủ ngữ 'She' là ngôi thứ 3 số ít nên động từ thêm 's'.",
                wrongReason: "A sai vì thiếu 's'. C sai thì. D sai thì."
            }
        },
        {
            question: "We ______ Grandma next week.",
            options: ["A. visit", "B. visited", "C. have visited", "D. will visit"],
            correct: 3,
            explanation: {
                vocab: [
                    "A. visit (v): thăm",
                    "B. visited (v): đã thăm",
                    "C. have visited (v): đã từng thăm",
                    "D. will visit (v): sẽ thăm"
                ],
                trans: "Chúng tớ sẽ đi thăm bà vào tuần tới.",
                correctReason: "Có từ 'next week' (tuần tới) → Dấu hiệu của thì **Tương lai đơn**.",
                wrongReason: "A, B, C đều sai mốc thời gian (hiện tại, quá khứ)."
            }
        },
        {
            question: "______ you finished your homework yet?",
            options: ["A. Do", "B. Did", "C. Have", "D. Are"],
            correct: 2,
            explanation: {
                vocab: [
                    "A. Do (trợ từ HTĐ)",
                    "B. Did (trợ từ QKĐ)",
                    "C. Have (trợ từ HTHT)",
                    "D. Are (động từ tobe)"
                ],
                trans: "Bạn đã làm xong bài tập về nhà chưa?",
                correctReason: "Có từ 'yet' ở cuối câu hỏi và động từ chính 'finished' (V3/ed) → Dấu hiệu của thì **Hiện tại hoàn thành**. Cấu trúc: Have/Has + S + V3/ed...?",
                wrongReason: "A, B đi với động từ nguyên thể. D đi với V-ing."
            }
        },
        {
            question: "My father ______ TV in the living room now.",
            options: ["A. watch", "B. watches", "C. is watching", "D. watched"],
            correct: 2,
            explanation: {
                vocab: [
                    "A. watch (v): xem",
                    "B. watches (v): xem (số ít)",
                    "C. is watching (v): đang xem",
                    "D. watched (v): đã xem"
                ],
                trans: "Bố tớ đang xem TV ở phòng khách bây giờ.",
                correctReason: "Có từ 'now' (bây giờ) → Dấu hiệu của thì **Hiện tại tiếp diễn**.",
                wrongReason: "A, B là hiện tại đơn (thói quen). D là quá khứ."
            }
        },
        {
            question: "He ______ play the guitar two years ago.",
            options: ["A. doesn't", "B. don't", "C. didn't", "D. won't"],
            correct: 2,
            explanation: {
                vocab: [
                    "A. doesn't (HTĐ)",
                    "B. don't (HTĐ)",
                    "C. didn't (QKĐ)",
                    "D. won't (TLĐ)"
                ],
                trans: "Anh ấy đã không chơi ghi-ta cách đây 2 năm.",
                correctReason: "Có 'two years ago' (2 năm trước) → Dấu hiệu thì **Quá khứ đơn**. Câu phủ định của quá khứ đơn dùng trợ từ 'didn't'.",
                wrongReason: "A, B là hiện tại. D là tương lai."
            }
        },
        {
            question: "They ______ in this house for 10 years.",
            options: ["A. live", "B. lived", "C. are living", "D. have lived"],
            correct: 3,
            explanation: {
                vocab: [
                    "A. live (HTĐ)",
                    "B. lived (QKĐ)",
                    "C. are living (HTTD)",
                    "D. have lived (HTHT)"
                ],
                trans: "Họ đã sống ở ngôi nhà này được 10 năm rồi.",
                correctReason: "Có 'for 10 years' (được 10 năm) → Dấu hiệu thì **Hiện tại hoàn thành** (hành động bắt đầu trong quá khứ và kéo dài đến hiện tại).",
                wrongReason: "A, C chỉ hiện tại. B chỉ quá khứ đã chấm dứt."
            }
        },
        {
            question: "Be quiet! The baby ______.",
            options: ["A. sleep", "B. sleeps", "C. is sleeping", "D. slept"],
            correct: 2,
            explanation: {
                vocab: [
                    "A. sleep (v): ngủ",
                    "B. sleeps (v): ngủ (số ít)",
                    "C. is sleeping (v): đang ngủ",
                    "D. slept (v): đã ngủ"
                ],
                trans: "Trật tự nào! Em bé đang ngủ.",
                correctReason: "Có câu mệnh lệnh 'Be quiet!' (Trật tự đi!) → Cảnh báo một hành động đang diễn ra → **Hiện tại tiếp diễn**.",
                wrongReason: "A, B chỉ thói quen. D là quá khứ."
            }
        },
        {
            question: "Tom ______ to school by bus every day.",
            options: ["A. go", "B. goes", "C. going", "D. went"],
            correct: 1,
            explanation: {
                vocab: [
                    "A. go (nguyên thể)",
                    "B. goes (thêm es)",
                    "C. going (V-ing)",
                    "D. went (quá khứ)"
                ],
                trans: "Tom đi học bằng xe buýt mỗi ngày.",
                correctReason: "Có 'every day' → Thói quen ở hiện tại → **Hiện tại đơn**. Chủ ngữ 'Tom' (số ít) nên động từ 'go' thêm 'es' thành 'goes'.",
                wrongReason: "A sai ngôi. C thiếu tobe. D sai thì."
            }
        },
        {
            question: "I think it ______ rain tomorrow.",
            options: ["A. rains", "B. rained", "C. is raining", "D. will"],
            correct: 3,
            explanation: {
                vocab: [
                    "A. rains (HTĐ)",
                    "B. rained (QKĐ)",
                    "C. is raining (HTTD)",
                    "D. will (TLĐ - thiếu 'rain' nhưng trong trắc nghiệm đôi khi viết tắt, ở đây đầy đủ là 'will rain' nhưng đề bài chỉ cần điền trợ từ hoặc đề bài có lỗi nhỏ? À không, đề bài là '... rain', vậy chỗ trống cần điền trợ từ)",
                ],
                // Correction for context: The blank needs an auxiliary verb or modal.
                // Re-analyzing options: If the blank is before "rain" (verb), D is "will". 
                trans: "Tớ nghĩ ngày mai trời sẽ mưa.",
                correctReason: "Có 'tomorrow' và 'I think' (dự đoán) → **Tương lai đơn**. Cấu trúc: will + V_nguyên_thể.",
                wrongReason: "A, B sai thì. C sai cấu trúc (is raining rain? -> sai)."
            }
        },
        {
            question: "______ she play badminton yesterday?",
            options: ["A. Do", "B. Does", "C. Did", "D. Will"],
            correct: 2,
            explanation: {
                vocab: [
                    "A. Do (HTĐ)",
                    "B. Does (HTĐ số ít)",
                    "C. Did (QKĐ)",
                    "D. Will (TLĐ)"
                ],
                trans: "Cô ấy có chơi cầu lông hôm qua không?",
                correctReason: "Có 'yesterday' (hôm qua) → Câu hỏi **Quá khứ đơn**. Trợ từ đảo lên đầu là 'Did'.",
                wrongReason: "A, B là hiện tại. D là tương lai."
            }
        },
        {
            question: "We ______ just ______ our dinner.",
            options: ["A. have / eat", "B. have / eaten", "C. did / eat", "D. are / eating"],
            correct: 1,
            explanation: {
                vocab: [
                    "A. have/eat (sai V3)",
                    "B. have/eaten (HT hoàn thành)",
                    "C. did/eat (Quá khứ)",
                    "D. are/eating (Tiếp diễn)"
                ],
                trans: "Chúng tớ vừa mới ăn tối xong.",
                correctReason: "Có từ 'just' nằm giữa → Dấu hiệu **Hiện tại hoàn thành**. Cấu trúc: Have + just + V3 (eaten).",
                wrongReason: "A sai V3. C và D không dùng với 'just' ở vị trí này mang nghĩa vừa mới xong."
            }
        },
        {
            question: "Where ______ you last summer?",
            options: ["A. are", "B. do", "C. were", "D. was"],
            correct: 2,
            explanation: {
                vocab: [
                    "A. are (tobe HT)",
                    "B. do (trợ từ thường)",
                    "C. were (tobe QK số nhiều)",
                    "D. was (tobe QK số ít)"
                ],
                trans: "Bạn đã ở đâu vào mùa hè trước?",
                correctReason: "Có 'last summer' → Quá khứ. Chủ ngữ 'you' đi với động từ tobe quá khứ số nhiều là 'were'.",
                wrongReason: "A là hiện tại. B là động từ thường. D dùng cho ngôi số ít (I, He, She, It)."
            }
        },
        {
            question: "Listen! Someone ______ the piano.",
            options: ["A. plays", "B. played", "C. is playing", "D. has played"],
            correct: 2,
            explanation: {
                vocab: [
                    "A. plays (HTĐ)",
                    "B. played (QKĐ)",
                    "C. is playing (HTTD)",
                    "D. has played (HTHT)"
                ],
                trans: "Nghe kìa! Ai đó đang chơi đàn piano.",
                correctReason: "Có 'Listen!' (Nghe kìa!) → Dấu hiệu **Hiện tại tiếp diễn**. Hành động đang xảy ra.",
                wrongReason: "A chỉ thói quen. B, D sai ngữ cảnh đang diễn ra."
            }
        },
        {
            question: "My mom ______ buy a new bike for me next month.",
            options: ["A. will", "B. is", "C. did", "D. does"],
            correct: 0,
            explanation: {
                vocab: [
                    "A. will (sẽ)",
                    "B. is (thì)",
                    "C. did (đã)",
                    "D. does (làm)"
                ],
                trans: "Mẹ tớ sẽ mua một chiếc xe đạp mới cho tớ vào tháng sau.",
                correctReason: "Có 'next month' (tháng sau) → **Tương lai đơn**. Cấu trúc: will + V (buy).",
                wrongReason: "B cần V-ing. C là quá khứ. D là hiện tại đơn."
            }
        },
        {
            question: "She never ______ coffee.",

    // --- GAME LOGIC ---

    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = [];
    
    // Audio files (Simple short sounds using standardized CDN links for reliability)
    const soundCorrect = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3');
    const soundWrong = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3');
    const soundFinish = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3');

    // Shuffle Algorithm (Fisher-Yates)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // Initialize Quiz
    function initQuiz() {
        // Clone and shuffle questions
        questions = [...rawQuestions];
        shuffleArray(questions);
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('q-total').innerText = questions.length;
        loadQuestion();
    }

    // Load Question
    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            showResult();
            return;
        }

        // Update Progress
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        
        // Reset UI
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('explanation-container').style.display = 'none';
        document.getElementById('explanation-container').style.animation = 'none';
        
        const currentQ = questions[currentQuestionIndex];
        
        // Render Text
        document.getElementById('q-current').innerText = currentQuestionIndex + 1;
        document.getElementById('question-text').innerText = currentQ.question;
        
        // Render Options
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        currentQ.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    // Check Answer
    function checkAnswer(selectedIndex, btnElement) {
        const currentQ = questions[currentQuestionIndex];
        const correctIndex = currentQ.correct;
        const allBtns = document.querySelectorAll('.option-btn');

        // Disable all buttons
        allBtns.forEach(btn => btn.disabled = true);

        // Highlight Logic
        if (selectedIndex === correctIndex) {
            // CORRECT
            btnElement.classList.add('correct');
            score++;
            soundCorrect.currentTime = 0;
            soundCorrect.play();
            triggerConfetti();
        } else {
            // WRONG
            btnElement.classList.add('wrong');
            allBtns[correctIndex].classList.add('correct'); // Show correct answer
            soundWrong.currentTime = 0;
            soundWrong.play();
        }

        // Show Explanation immediately
        renderExplanation(currentQ, selectedIndex === correctIndex);
        
        // Show Next Button
        document.getElementById('next-btn').style.display = 'block';
    }

    // Render Explanation
    function renderExplanation(qData, isCorrect) {
        const expContainer = document.getElementById('explanation-container');
        const expContent = document.getElementById('exp-content');
        
        // Build Vocab List HTML
        let vocabHTML = '<ul class="vocab-list">';
        qData.explanation.vocab.forEach(v => {
            vocabHTML += `<li>📌 ${v}</li>`;
        });
        vocabHTML += '</ul>';

        const statusBadge = isCorrect 
            ? `<span class="badge badge-correct">ĐÚNG RỒI! 🎉</span>` 
            : `<span class="badge badge-wrong">TIẾC QUÁ! 😅</span>`;

        expContent.innerHTML = `
            <div class="exp-section">
                ${statusBadge}
                <strong>📖 Dịch câu hỏi:</strong>
                <em>"${qData.explanation.trans}"</em>
            </div>
            <div class="exp-section">
                <strong>🔍 Phân tích từ vựng:</strong>
                ${vocabHTML}
            </div>
            <div class="exp-section" style="background: #e8f5e9; padding: 10px; border-radius: 8px;">
                <strong>✅ Tại sao đáp án đúng?</strong>
                ${qData.explanation.correctReason}
            </div>
            <div class="exp-section" style="background: #ffebee; padding: 10px; border-radius: 8px;">
                <strong>❌ Tại sao các câu kia sai?</strong>
                ${qData.explanation.wrongReason}
            </div>
        `;

        expContainer.style.display = 'block';
        // Reset animation to play again
        setTimeout(() => {
            expContainer.style.animation = 'slideDown 0.5s ease-out';
        }, 10);
        
        // Scroll to explanation on mobile
        if(window.innerWidth < 600) {
            expContainer.scrollIntoView({behavior: "smooth", block: "start"});
        }
    }

    // Next Question
    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    // Confetti Effect
    function triggerConfetti() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#00C9A7', '#8854C0', '#FF4757', '#FFD700']
        });
    }

    // Show Result
    function showResult() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${score}/${questions.length}`;
        soundFinish.play();
        triggerConfetti(); // Big confetti for finish

        let msg = "";
        if (score === questions.length) msg = "Xuất sắc! Bạn là thiên tài ngữ pháp! 🏆";
        else if (score >= 25) msg = "Rất giỏi! Em nắm bài rất chắc! 🌟";
        else if (score >= 15) msg = "Khá tốt! Cố gắng ôn tập thêm chút nữa nhé! 💪";
        else msg = "Đừng buồn! Hãy xem lại giải thích và làm lại nhé! 🌱";
        
        document.getElementById('final-msg').innerText = msg;
    }

    // Start
    initQuiz();
