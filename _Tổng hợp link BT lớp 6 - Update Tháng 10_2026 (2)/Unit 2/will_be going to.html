<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2 - Grammar | Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00f5a0; --wrong:#ff4d6d; --blue:#2563eb; --hlg:#0a8f5b;
  --terra:#c1440e; --purple:#7c3aed; --grammar:#dc2626;
  --neon:#00f5d4; --neon2:#ff6ec7;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Nunito',sans-serif; color:#eaf2ff; min-height:100vh;
  background:linear-gradient(-45deg,#0b0a2e,#311b6e,#0b3d91,#5b1f9c,#1a0b3d);
  background-size:400% 400%; animation:bgmove 22s ease infinite;
  position:relative; overflow-x:hidden; padding-bottom:60px;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.pattern{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.pattern span{position:absolute;animation:float 16s ease-in-out infinite;
  filter:drop-shadow(0 0 8px rgba(0,245,212,.6));}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-40px) rotate(20deg)}}
.star{position:fixed;width:2px;height:2px;background:#fff;border-radius:50%;
  box-shadow:0 0 6px #fff;animation:tw 3s ease-in-out infinite;z-index:0;}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}

.wrap{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:18px 14px;}

.cred{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;
  background:rgba(0,245,212,.12);backdrop-filter:blur(8px);
  display:inline-block;padding:5px 14px;border-radius:20px;
  border:1px solid rgba(0,245,212,.45);box-shadow:0 0 16px rgba(0,245,212,.3);}
h1{color:#fff;text-align:center;font-weight:900;font-size:1.95rem;margin:10px 0 2px;
  text-shadow:0 0 14px var(--neon),0 0 28px rgba(255,110,199,.5);}
.sub{text-align:center;color:#bdeaff;font-weight:700;margin-bottom:18px;letter-spacing:1px;}

.sec{background:rgba(20,12,55,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(0,245,212,.4);border-radius:18px;
  padding:12px 18px;margin:24px 0 14px;color:#eafffc;font-weight:900;
  font-size:1.15rem;box-shadow:0 0 22px rgba(124,58,237,.4);}
.sec small{display:block;font-weight:700;font-size:.85rem;color:#9fd9ff;margin-top:2px;}

.card{background:rgba(255,255,255,.93);backdrop-filter:blur(14px);
  border:1px solid rgba(0,245,212,.55);border-radius:20px;
  padding:18px 18px 16px;margin-bottom:18px;color:#2d2150;
  box-shadow:0 0 24px rgba(0,245,212,.25),0 10px 26px rgba(0,0,0,.35);}
.qnum{display:inline-block;background:linear-gradient(135deg,#7c3aed,#00f5d4);color:#fff;font-weight:900;
  width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;margin-right:8px;
  box-shadow:0 0 10px rgba(0,245,212,.6);}
.qtext{font-size:1.15rem;font-weight:700;color:#241845;line-height:1.5;margin-bottom:14px;}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.opts.col1{grid-template-columns:1fr;}
.opt{font-size:1.08rem;font-weight:700;text-align:center;cursor:pointer;
  background:linear-gradient(145deg,#ffffff,#e7faff);
  border:none;border-radius:16px;padding:14px 12px;color:#1c2b66;line-height:1.4;
  box-shadow:0 6px 0 #b8e6f0,0 8px 16px rgba(0,0,0,.18);
  transition:transform .15s ease,box-shadow .15s ease;}
.opts.col1 .opt{text-align:left;}
.opt:hover:not(.locked){transform:scale(1.04);box-shadow:0 8px 0 #9fdcec,0 12px 22px rgba(0,245,212,.3);}
.opt:active:not(.locked){transform:scale(.98);}
.opt.correct{background:linear-gradient(145deg,#5cffc0,#00f5a0);color:#063b25;box-shadow:0 6px 0 #06b277,0 0 18px rgba(0,245,160,.7);}
.opt.wrong{background:linear-gradient(145deg,#ff8fa6,#ff4d6d);color:#fff;box-shadow:0 6px 0 #c61b3d,0 0 16px rgba(255,77,109,.6);}
.opt.locked{cursor:default;}
.opt.dim{opacity:.45;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .45s;}

.exp{display:none;margin-top:14px;font-size:1rem;line-height:1.6;
  background:rgba(245,248,255,.96);border-radius:14px;padding:14px 16px;
  border:1px dashed #8a78d6;color:#2d2150;}
.exp.show{display:block;animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.exp ol{margin:8px 0 0 18px;}
.exp li{margin:8px 0;}
.vnt{background:#fff3e0;border-left:5px solid #ff9f1c;border-radius:8px;
  padding:8px 12px;font-weight:800;color:#7a3e00;margin-bottom:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:6px 0;}
.grid2 div{background:rgba(124,58,237,.07);border-radius:8px;padding:5px 8px;font-size:.96rem;}
.p-word{color:var(--blue);font-weight:800;}
.hl-green{color:var(--hlg);font-weight:900;}
.hl-red{color:#dc2626;font-weight:900;}
.wt{background:rgba(120,80,180,.15);border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:800;color:#5b3a8a;}
.p-phonetic{color:var(--purple);background:#f1e9ff;border-radius:5px;padding:1px 5px;}
.p-mean{color:var(--terra);font-weight:700;}
.p-grammar{border-bottom:2px solid var(--grammar);color:#2d2150;font-weight:700;}
.formula{display:inline-block;background:#eafff8;border:1px solid #00b07a;border-radius:8px;
  padding:2px 10px;font-weight:800;color:#0a6e4a;font-family:'Quicksand';}

.submit{display:block;margin:30px auto 10px;font-family:'Nunito';font-size:1.25rem;
  font-weight:900;color:#06121f;background:linear-gradient(145deg,#00f5d4,#7c3aed);
  border:none;border-radius:20px;padding:16px 40px;cursor:pointer;
  box-shadow:0 0 24px rgba(0,245,212,.6),0 10px 22px rgba(0,0,0,.4);transition:transform .15s;}
.submit:hover{transform:scale(1.05);}
.submit:active{transform:scale(.97);}

.mask{display:none;position:fixed;inset:0;background:rgba(8,5,25,.7);
  backdrop-filter:blur(5px);z-index:50;align-items:center;justify-content:center;padding:18px;}
.mask.show{display:flex;}
.modal{background:rgba(255,255,255,.95);border-radius:24px;padding:26px 22px;
  max-width:440px;width:100%;text-align:center;color:#2d2150;
  box-shadow:0 0 40px rgba(0,245,212,.5);animation:pop .3s ease;}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{color:#3a1d6e;font-size:1.4rem;margin-bottom:12px;}
.modal input{width:100%;padding:13px 16px;font-size:1.05rem;font-family:'Nunito';
  border:2px solid #b9a6f0;border-radius:14px;outline:none;font-weight:700;}
.modal input.err{border-color:var(--wrong);}
.warn{color:var(--wrong);font-weight:800;font-size:.9rem;height:18px;margin:6px 0;}
.modal button{margin-top:8px;font-family:'Nunito';font-weight:900;font-size:1.1rem;color:#fff;
  background:linear-gradient(145deg,#7c3aed,#00bfa6);border:none;border-radius:16px;
  padding:13px 30px;cursor:pointer;box-shadow:0 6px 0 #4a2b9e;transition:transform .15s;}
.modal button:hover{transform:scale(1.05);}
.greet{font-size:1.3rem;font-weight:900;color:#7c3aed;margin-bottom:6px;}
.score{font-size:2.6rem;font-weight:900;color:#00bfa6;margin:6px 0;}
.score10{font-size:1.5rem;font-weight:900;color:#ff6ec7;margin-bottom:14px;}
.memewrap{width:100%;max-width:300px;margin:0 auto 14px;border-radius:18px;overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.25);}
.memewrap img{width:100%;display:block;}
.memefall{font-size:4.5rem;padding:20px;}

@media(max-width:560px){
  .opts{grid-template-columns:1fr;} .grid2{grid-template-columns:1fr;}
  h1{font-size:1.5rem;}
}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>

<div class="wrap">
  <div style="text-align:center"><span class="cred">👩‍🚀 Giáo viên tạo: Ms. Chí Nên</span></div>
  <h1>🚀 Unit 2 — Grammar: The Future</h1>
  <div class="sub">C. GRAMMAR (I) — will / be going to</div>

  <div id="quiz"></div>

  <button class="submit" onclick="openName()">🛸 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="mask" id="nameMask">
  <div class="modal">
    <h2>🌟 Phi hành gia tên gì nào?</h2>
    <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
    <div class="warn" id="warn"></div>
    <button onclick="showResult()">Phóng tàu 🚀</button>
  </div>
</div>

<div class="mask" id="resMask">
  <div class="modal">
    <div class="greet" id="greet"></div>
    <div class="memewrap" id="memewrap"></div>
    <div class="score" id="scoreTxt"></div>
    <div class="score10" id="score10"></div>
    <button onclick="location.reload()">🔄 Bay lại lần nữa</button>
  </div>
</div>

<script>
/* Floating space deco + stars */
(function(){
  const ic=['⭐','🚀','🌟','🪐','🌙','✨','💫','🛸','🌌','☄️'];
  let h='';
  for(let i=0;i<16;i++){
    h+=`<span style="left:${Math.random()*95}%;top:${Math.random()*95}%;
      animation-delay:${(Math.random()*9).toFixed(1)}s;
      font-size:${(1.5+Math.random()*1.8).toFixed(1)}rem">${ic[i%ic.length]}</span>`;
  }
  for(let i=0;i<40;i++){
    h+=`<i class="star" style="left:${Math.random()*100}%;top:${Math.random()*100}%;
      animation-delay:${(Math.random()*3).toFixed(1)}s"></i>`;
  }
  document.getElementById('pattern').innerHTML=h;
})();

/* helper for grid2 verb-form analysis */
function gf(txt,form,use,ok){
  const c=ok?'hl-green':'p-word';
  return `<div><span class='${c}'>${txt}</span> <span class='wt'>${form}</span> = <span class='p-mean'>${use}</span></div>`;
}

const PARTS=[
{t:"I. Complete the sentences using the future with will or the correct forms of be going to.",
 s:"Chọn dạng tương lai đúng (will / be going to).",q:[
 {q:"In the future people _______ (have) bigger heads.",o:["will have","is going to have","are going to have","will has"],a:"will have",
  e:`<div class="vnt">💬 Dịch: Trong tương lai, con người sẽ có cái đầu to hơn.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("will have","will + V","dự đoán",true)}${gf("are going to have","be going to","kế hoạch")}${gf("is going to have","be going to","sai chủ ngữ")}${gf("will has","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Dự đoán tương lai xa, không có bằng chứng → dùng "will"; sau "will" luôn là V nguyên thể.</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"is going to" sai chủ ngữ số nhiều "people"; "are going to" nhấn kế hoạch; "will has" sai dạng động từ.</span></li></ol>`},
 {q:"That trash bin is full. I think the trash _______ (fall).",o:["is going to fall","will fall","are going to fall","is going to falls"],a:"is going to fall",
  e:`<div class="vnt">💬 Dịch: Thùng rác đầy rồi. Tôi nghĩ rác sắp rơi ra.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("is going to fall","be going to","có bằng chứng",true)}${gf("will fall","will + V","dự đoán suông")}${gf("are going to fall","be going to","sai chủ ngữ")}${gf("is going to falls","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Có bằng chứng hiện tại (thùng đầy) → "be going to"; "trash" số ít → "is going to".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"will" dùng khi không có dấu hiệu; "are" sai chủ ngữ; "falls" sai vì sau "to" là V nguyên thể.</span></li></ol>`},
 {q:"Look at those clouds. It _______ (rain).",o:["is going to rain","will rain","are going to rain","is going to rains"],a:"is going to rain",
  e:`<div class="vnt">💬 Dịch: Nhìn những đám mây kìa. Trời sắp mưa.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("is going to rain","be going to","có bằng chứng",true)}${gf("will rain","will + V","dự đoán suông")}${gf("are going to rain","be going to","sai chủ ngữ")}${gf("is going to rains","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>"Look at those clouds" là bằng chứng → "be going to"; "It" → "is going to".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"will" thiếu bằng chứng; "are" sai chủ ngữ "It"; "rains" sai dạng.</span></li></ol>`},
 {q:"This team is playing so bad today. They _______ (lose)!",o:["are going to lose","will lose","is going to lose","are going to losing"],a:"are going to lose",
  e:`<div class="vnt">💬 Dịch: Đội này chơi quá tệ hôm nay. Họ sắp thua rồi!</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("are going to lose","be going to","có bằng chứng",true)}${gf("will lose","will + V","dự đoán suông")}${gf("is going to lose","be going to","sai chủ ngữ")}${gf("are going to losing","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Bằng chứng (chơi tệ) → "be going to"; "They" số nhiều → "are going to".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"will" thiếu bằng chứng; "is" sai chủ ngữ; "losing" sai dạng.</span></li></ol>`},
 {q:"I _______ (help) you with your luggage. It looks heavy.",o:["will help","am going to help","will helping","am help"],a:"will help",
  e:`<div class="vnt">💬 Dịch: Tôi sẽ giúp bạn xách hành lý. Trông nó nặng quá.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("will help","will + V","quyết định tức thời",true)}${gf("am going to help","be going to","kế hoạch trước")}${gf("will helping","sai","sai dạng")}${gf("am help","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Quyết định ngay lúc nói (thấy nặng nên giúp) → "will".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"am going to" là kế hoạch định trước; "will helping"/"am help" sai dạng động từ.</span></li></ol>`},
 {q:"_______ (they, start) a new business together as they have planned?",o:["Are they going to start","Will they start","Are they going to starting","Do they going to start"],a:"Are they going to start",
  e:`<div class="vnt">💬 Dịch: Họ có định bắt đầu kinh doanh chung như đã lên kế hoạch không?</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("Are they going to start","câu hỏi be going to","kế hoạch",true)}${gf("Will they start","câu hỏi will","quyết định")}${gf("Are they going to starting","sai","sai dạng")}${gf("Do they going to start","sai","sai cấu trúc")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>"as they have planned" = kế hoạch → "be going to"; câu hỏi đảo "Are they going to + V?".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"Will they" hỏi dự đoán/quyết định; "starting"/"Do they going to" sai cấu trúc.</span></li></ol>`},
 {q:"We _______ (reuse) these plastic bags within this week.",o:["are going to reuse","will reuse","is going to reuse","are going to reusing"],a:"are going to reuse",
  e:`<div class="vnt">💬 Dịch: Chúng tôi sẽ tái sử dụng những túi nilon này trong tuần này.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("are going to reuse","be going to","ý định/kế hoạch",true)}${gf("will reuse","will + V","quyết định tức thời")}${gf("is going to reuse","be going to","sai chủ ngữ")}${gf("are going to reusing","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Ý định/kế hoạch trong tuần → "be going to"; "We" → "are going to".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"will" là quyết định tức thời; "is" sai chủ ngữ; "reusing" sai dạng.</span></li></ol>`},
 {q:"Frank _______ (not take) a three-day holiday next month.",o:["isn't going to take","won't take","aren't going to take","isn't going to taking"],a:"isn't going to take",
  e:`<div class="vnt">💬 Dịch: Frank sẽ không nghỉ ba ngày vào tháng tới.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("isn't going to take","be going to (phủ định)","kế hoạch đã định",true)}${gf("won't take","will (phủ định)","từ chối/dự đoán")}${gf("aren't going to take","be going to","sai chủ ngữ")}${gf("isn't going to taking","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Kế hoạch đã định (next month) thể phủ định → "isn't going to"; Frank số ít.</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"won't" là dự đoán/từ chối; "aren't" sai chủ ngữ; "taking" sai dạng.</span></li></ol>`},
 {q:"There isn't any drinking water left. I _______ (order) a big bottle now.",o:["will order","am going to order","will ordering","am order"],a:"will order",
  e:`<div class="vnt">💬 Dịch: Không còn nước uống nào cả. Tôi sẽ đặt một bình lớn ngay bây giờ.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("will order","will + V","quyết định tức thời",true)}${gf("am going to order","be going to","kế hoạch trước")}${gf("will ordering","sai","sai dạng")}${gf("am order","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Quyết định ngay lúc nói ("now", hết nước nên đặt liền) → "will".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"am going to" là kế hoạch trước; "will ordering"/"am order" sai dạng.</span></li></ol>`},
 {q:"They brought the paint here because they _______ (repaint) the wall.",o:["are going to repaint","will repaint","is going to repaint","are going to repainting"],a:"are going to repaint",
  e:`<div class="vnt">💬 Dịch: Họ mang sơn đến đây vì họ định sơn lại bức tường.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("are going to repaint","be going to","ý định từ trước",true)}${gf("will repaint","will + V","quyết định tức thời")}${gf("is going to repaint","be going to","sai chủ ngữ")}${gf("are going to repainting","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Đã mang sơn tới = ý định/kế hoạch từ trước → "be going to"; "they" → "are".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"will" là quyết định tức thời; "is" sai chủ ngữ; "repainting" sai dạng.</span></li></ol>`},
 {q:"Today's generation _______ (live) longer.",o:["will live","is going to live","will lives","are going to live"],a:"will live",
  e:`<div class="vnt">💬 Dịch: Thế hệ ngày nay sẽ sống lâu hơn.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("will live","will + V","dự đoán chung",true)}${gf("is going to live","be going to","cần bằng chứng")}${gf("will lives","sai","sai dạng")}${gf("are going to live","be going to","sai chủ ngữ")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Dự đoán chung về tương lai → "will"; sau "will" là V nguyên thể.</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"is/are going to" cần kế hoạch/bằng chứng cụ thể; "lives" sai dạng.</span></li></ol>`},
 {q:"My classmates and I _______ (join) a community service project this summer.",o:["are going to join","will join","am going to join","is going to join"],a:"are going to join",
  e:`<div class="vnt">💬 Dịch: Các bạn cùng lớp và tôi sẽ tham gia một dự án phục vụ cộng đồng vào hè này.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("are going to join","be going to","kế hoạch",true)}${gf("will join","will + V","quyết định tức thời")}${gf("am going to join","be going to","sai chủ ngữ")}${gf("is going to join","be going to","sai chủ ngữ")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Kế hoạch mùa hè → "be going to"; "My classmates and I" = we → "are going to".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"will" là quyết định tức thời; "am/is going to" sai chủ ngữ số nhiều.</span></li></ol>`},
 {q:"I can't open this jar. – Give it to me. I _______ (do) it.",o:["will do","am going to do","will doing","am do"],a:"will do",
  e:`<div class="vnt">💬 Dịch: Tôi không mở được cái lọ này. – Đưa tôi. Tôi sẽ mở nó.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("will do","will + V","đề nghị giúp tức thời",true)}${gf("am going to do","be going to","kế hoạch trước")}${gf("will doing","sai","sai dạng")}${gf("am do","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Đề nghị giúp ngay lúc nói → "will".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"am going to" là kế hoạch trước; "will doing"/"am do" sai dạng.</span></li></ol>`},
 {q:"Susan feels sick. She knows that she _______ (not study) at school.",o:["isn't going to study","won't study","aren't going to study","doesn't going to study"],a:"isn't going to study",
  e:`<div class="vnt">💬 Dịch: Susan thấy mệt. Cô ấy biết mình sẽ không đi học.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("isn't going to study","be going to (phủ định)","có bằng chứng (ốm)",true)}${gf("won't study","will (phủ định)","ý chí/từ chối")}${gf("aren't going to study","be going to","sai chủ ngữ")}${gf("doesn't going to study","sai","sai cấu trúc")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Bằng chứng (ốm) → dự đoán "be going to" phủ định; "she" → "isn't going to".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"won't" là ý chí/từ chối; "aren't" sai chủ ngữ; "doesn't going to" sai cấu trúc.</span></li></ol>`},
 {q:"Mia keeps lots of empty bottles. She _______ (recycle) them.",o:["is going to recycle","will recycle","are going to recycle","is going to recycling"],a:"is going to recycle",
  e:`<div class="vnt">💬 Dịch: Mia giữ rất nhiều chai rỗng. Cô ấy định tái chế chúng.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("is going to recycle","be going to","có bằng chứng",true)}${gf("will recycle","will + V","dự đoán suông")}${gf("are going to recycle","be going to","sai chủ ngữ")}${gf("is going to recycling","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Bằng chứng (giữ nhiều chai) → "be going to"; "She" → "is going to".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"will" thiếu bằng chứng; "are" sai chủ ngữ; "recycling" sai dạng.</span></li></ol>`},
 {q:"_______ (young people, have) more job opportunities?",o:["Will young people have","Are young people going to have","Is young people going to have","Will young people having"],a:"Will young people have",
  e:`<div class="vnt">💬 Dịch: Người trẻ sẽ có nhiều cơ hội việc làm hơn không?</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("Will young people have","câu hỏi will","dự đoán chung",true)}${gf("Are young people going to have","be going to","kế hoạch cụ thể")}${gf("Is young people going to have","be going to","sai chủ ngữ")}${gf("Will young people having","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Câu hỏi dự đoán chung về tương lai → "Will + S + V?".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"Are...going to" hỏi kế hoạch cụ thể; "Is" sai chủ ngữ số nhiều; "having" sai dạng.</span></li></ol>`},
 {q:"She passed her exams. She _______ (study) in a university.",o:["is going to study","will study","are going to study","is going to studies"],a:"is going to study",
  e:`<div class="vnt">💬 Dịch: Cô ấy đã đỗ kỳ thi. Cô ấy sẽ học đại học.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("is going to study","be going to","kế hoạch dựa trên kết quả",true)}${gf("will study","will + V","quyết định tức thời")}${gf("are going to study","be going to","sai chủ ngữ")}${gf("is going to studies","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Đã đỗ → kế hoạch học đại học → "be going to"; "She" → "is going to".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"will" là quyết định tức thời; "are" sai chủ ngữ; "studies" sai dạng.</span></li></ol>`},
 {q:"I think she _______ (not participate) in the volunteer programme.",o:["won't participate","isn't going to participate","aren't going to participate","won't participating"],a:"won't participate",
  e:`<div class="vnt">💬 Dịch: Tôi nghĩ cô ấy sẽ không tham gia chương trình tình nguyện.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("won't participate","will (phủ định)","ý kiến/dự đoán",true)}${gf("isn't going to participate","be going to","cần bằng chứng")}${gf("aren't going to participate","be going to","sai chủ ngữ")}${gf("won't participating","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>"I think" + dự đoán/ý kiến → "will" (phủ định "won't").</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"isn't going to" cần bằng chứng cụ thể; "aren't" sai chủ ngữ; "participating" sai dạng.</span></li></ol>`},
 {q:"Addressing global warming today _______ (save) lives and money for years to come.",o:["will save","is going to save","are going to save","will saves"],a:"will save",
  e:`<div class="vnt">💬 Dịch: Giải quyết nóng lên toàn cầu hôm nay sẽ cứu được nhiều mạng sống và tiền bạc trong nhiều năm tới.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("will save","will + V","dự đoán/khẳng định chung",true)}${gf("is going to save","be going to","cần bằng chứng")}${gf("are going to save","be going to","sai chủ ngữ")}${gf("will saves","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Khẳng định/dự đoán chung về kết quả tương lai → "will".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"is/are going to" cần kế hoạch/bằng chứng; "saves" sai dạng sau "will".</span></li></ol>`},
 {q:"Air pollution is dangerous for the forests. It _______ (destroy) the trees.",o:["is going to destroy","will destroy","are going to destroy","is going to destroys"],a:"is going to destroy",
  e:`<div class="vnt">💬 Dịch: Ô nhiễm không khí nguy hiểm cho rừng. Nó sẽ phá hủy cây cối.</div><ol><li>Phân tích đáp án:<div class="grid2">${gf("is going to destroy","be going to","có bằng chứng (nguy hiểm)",true)}${gf("will destroy","will + V","dự đoán suông")}${gf("are going to destroy","be going to","sai chủ ngữ")}${gf("is going to destroys","sai","sai dạng")}</div></li><li><span class="hl-green">✅ ĐÚNG?</span> <span class='p-grammar'>Bằng chứng (ô nhiễm nguy hiểm) → "be going to"; "It" → "is going to".</span></li><li><span class="hl-red">❌ SAI?</span> <span class='p-grammar'>"will" thiếu bằng chứng; "are" sai chủ ngữ; "destroys" sai dạng.</span></li></ol>`}
]}
];

let TOTAL=0, answered={}, correctCount=0, qid=0;
const root=document.getElementById('quiz');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

PARTS.forEach(p=>{
  const sec=document.createElement('div');
  sec.className='sec';sec.innerHTML=p.t+'<small>'+p.s+'</small>';
  root.appendChild(sec);
  p.q.forEach((item,idx)=>{
    TOTAL++;
    const id='q'+(qid++);
    const card=document.createElement('div');
    card.className='card';
    const wide=p.wide||item.o.some(o=>o.length>34);
    let optsHtml='';
    shuffle(item.o).forEach(opt=>{
      optsHtml+=`<button class="opt" data-id="${id}" data-val="${opt.replace(/"/g,'&quot;')}">${opt}</button>`;
    });
    card.innerHTML=`<div class="qtext"><span class="qnum">${idx+1}</span>${item.q}</div>
      <div class="opts ${wide?'col1':''}">${optsHtml}</div>
      <div class="exp" id="exp-${id}">${item.e}</div>`;
    card.dataset.ans=item.a;
    root.appendChild(card);
  });
});

let AC;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*0.08);g.gain.linearRampToValueAtTime(.25,t+i*0.08+0.02);g.gain.exponentialRampToValueAtTime(.001,t+i*0.08+0.5);o.start(t+i*0.08);o.stop(t+i*0.08+0.55);});}
function buzz(){const c=ac(),t=c.currentTime;[300,250,200].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,t+i*0.12);g.gain.exponentialRampToValueAtTime(.001,t+i*0.12+0.1);o.start(t+i*0.12);o.stop(t+i*0.12+0.12);});}
function confetti(){const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99';document.body.appendChild(cv);cv.width=innerWidth;cv.height=innerHeight;const ctx=cv.getContext('2d');const cols=['#00f5d4','#ff6ec7','#7c3aed','#ffd60a','#00f5a0'];const ps=[];for(let i=0;i<90;i++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height/2,s:5+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,r:Math.random()*6});let f=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.restore();});f++;if(f<110)requestAnimationFrame(loop);else cv.remove();})();}

document.addEventListener('click',e=>{
  const btn=e.target.closest('.opt');
  if(!btn||btn.classList.contains('locked'))return;
  const id=btn.dataset.id;if(answered[id])return;
  const card=btn.closest('.card');const ans=card.dataset.ans;const chosen=btn.dataset.val;
  answered[id]=true;
  card.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');if(o.dataset.val===ans)o.classList.add('correct');else o.classList.add('dim');});
  if(chosen===ans){correctCount++;ding();confetti();}
  else{btn.classList.remove('dim');btn.classList.add('wrong','shake');buzz();setTimeout(()=>btn.classList.remove('shake'),500);}
  document.getElementById('exp-'+id).classList.add('show');
});

function openName(){document.getElementById('nameMask').classList.add('show');setTimeout(()=>document.getElementById('nameInput').focus(),100);}
function showResult(){
  const inp=document.getElementById('nameInput');const name=inp.value.trim();
  if(!name){inp.classList.add('err');document.getElementById('warn').textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');document.getElementById('nameMask').classList.remove('show');
  const pct=correctCount/TOTAL;const ten=(pct*10).toFixed(2);
  let greet,meme,fall;
  if(pct===1){greet=`🌟 PHI HÀNH GIA HUYỀN THOẠI! ${name} đạt tuyệt đối!`;meme='https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif';fall='🚀🏆🎊';}
  else if(pct>=0.6){greet=`👏 BAY TỐT LẮM! ${name} đã chinh phục phần lớn vũ trụ rồi!`;meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';fall='🛸👍✨';}
  else{greet=`💪 ĐỪNG NẢN ${name}! Nạp nhiên liệu rồi phóng lại nhé!`;meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';fall='😭🪐💔';}
  document.getElementById('greet').textContent=greet;
  document.getElementById('memewrap').innerHTML=`<img src="${meme}" alt="meme" onerror="this.parentNode.innerHTML='<div class=&quot;memefall&quot;>${fall}</div>'">`;
  document.getElementById('scoreTxt').textContent=`Số câu đúng: ${correctCount}/${TOTAL}`;
  document.getElementById('score10').textContent=`📊 Quy đổi: ${ten}/10 điểm`;
  document.getElementById('resMask').classList.add('show');
}
</script>
