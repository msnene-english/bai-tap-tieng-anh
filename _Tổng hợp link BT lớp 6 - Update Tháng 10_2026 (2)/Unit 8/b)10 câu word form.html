<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Word Form: Sports & Games - Ms. Chí Nên</title>

    <!-- Google Fonts: Nunito & Quicksand -->

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome cho icon -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Confetti Library -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>



    <style>

        :root {

            --primary-purple: #8854C0;

            --primary-teal: #00C9A7;

            --correct-green: #00D26A;

            --wrong-red: #FF4757;

            --bg-pastel: #F3F0FF;

            --text-dark: #2C3E50;

            --card-shadow: 0 8px 0 rgba(0,0,0,0.1);

            --btn-shadow: 0 5px 0 rgba(0,0,0,0.15);

        }



        body {

            font-family: 'Nunito', sans-serif;

            background-color: var(--bg-pastel);

            /* Zigzag pattern background */

            background-image: linear-gradient(135deg, #ffffff 25%, transparent 25%), 

                              linear-gradient(225deg, #ffffff 25%, transparent 25%), 

                              linear-gradient(45deg, #ffffff 25%, transparent 25%), 

                              linear-gradient(315deg, #ffffff 25%, transparent 25%);

            background-position: 10px 0, 10px 0, 0 0, 0 0;

            background-size: 20px 20px;

            background-repeat: repeat;

            color: var(--text-dark);

            margin: 0;

            padding: 20px;

            min-height: 100vh;

        }



        .container {

            max-width: 800px;

            margin: 0 auto;

        }



        /* HEADER */

        header {

            text-align: center;

            margin-bottom: 30px;

            padding: 20px;

            background: linear-gradient(to right, var(--primary-purple), var(--primary-teal));

            border-radius: 20px;

            color: white;

            box-shadow: 0 10px 20px rgba(0,0,0,0.1);

            position: relative;

            overflow: hidden;

        }



        header h1 {

            font-family: 'Quicksand', sans-serif;

            margin: 0;

            font-size: 2rem;

            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);

        }



        header p {

            margin: 5px 0 0;

            font-size: 1rem;

            opacity: 0.9;

        }



        .teacher-tag {

            background: white;

            color: var(--primary-purple);

            padding: 5px 15px;

            border-radius: 50px;

            font-weight: 800;

            font-size: 0.8rem;

            display: inline-block;

            margin-top: 10px;

            box-shadow: 0 3px 0 rgba(0,0,0,0.1);

        }



        /* QUIZ CARD */

        .quiz-card {

            background: white;

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.1);

            border: 2px solid #eee;

            position: relative;

            transition: transform 0.3s ease;

        }



        .question-number {

            background: var(--primary-teal);

            color: white;

            width: 40px;

            height: 40px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: 800;

            position: absolute;

            top: -15px;

            left: -15px;

            box-shadow: 0 4px 0 rgba(0,0,0,0.1);

            border: 2px solid white;

        }



        .question-text {

            font-size: 1.2rem;

            font-weight: 700;

            margin-bottom: 20px;

            line-height: 1.5;

            color: #2c3e50;

            padding-left: 10px;

        }



        .word-hint {

            color: var(--primary-purple);

            font-weight: 800;

            font-style: italic;

        }



        /* OPTIONS GRID */

        .options-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

        }



        @media (max-width: 600px) {

            .options-grid {

                grid-template-columns: 1fr;

            }

        }



        .option-btn {

            background: #fff;

            border: 2px solid #e0e0e0;

            border-bottom: 5px solid #e0e0e0;

            padding: 15px;

            border-radius: 15px;

            font-family: 'Nunito', sans-serif;

            font-size: 1rem;

            font-weight: 600;

            color: #555;

            cursor: pointer;

            transition: all 0.1s;

            position: relative;

            text-align: left;

        }



        .option-btn:active {

            transform: translateY(3px);

            border-bottom-width: 2px;

        }



        .option-btn:hover:not(:disabled) {

            background-color: #f9f9f9;

            transform: scale(1.02);

        }



        /* STATES */

        .option-btn.correct {

            background-color: var(--correct-green);

            border-color: #00A653; /* Darker green for 3D effect */

            color: white;

            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        }



        .option-btn.wrong {

            background-color: var(--wrong-red);

            border-color: #D63031; /* Darker red */

            color: white;

            animation: shake 0.5s;

        }



        .option-btn:disabled {

            cursor: default;

            opacity: 0.8;

        }



        .option-btn.dimmed {

            opacity: 0.5;

        }



        /* EXPLANATION BOX */

        .explanation-box {

            margin-top: 20px;

            background: #F0F8FF;

            border-radius: 12px;

            padding: 20px;

            border-left: 6px solid var(--primary-purple);

            display: none; /* Hidden initially */

            animation: slideDown 0.4s ease-out;

        }



        .teacher-avatar {

            width: 40px;

            height: 40px;

            border-radius: 50%;

            margin-right: 10px;

            vertical-align: middle;

            border: 2px solid var(--primary-purple);

        }



        .explain-header {

            font-weight: 800;

            color: var(--primary-purple);

            margin-bottom: 10px;

            display: flex;

            align-items: center;

        }



        .explain-content p {

            margin: 5px 0;

            line-height: 1.6;

        }



        .vocab-list {

            list-style: none;

            padding: 0;

            margin: 10px 0;

            background: white;

            padding: 10px;

            border-radius: 8px;

            border: 1px dashed #ccc;

        }



        .vocab-list li {

            margin-bottom: 5px;

        }



        .vocab-word {

            font-weight: 700;

            color: var(--primary-teal);

        }



        /* FOOTER & SUBMIT */

        .footer-controls {

            text-align: center;

            margin-top: 40px;

            padding-bottom: 50px;

        }



        .submit-btn {

            background: linear-gradient(to bottom, #FFD700, #FFA502);

            color: #583a00;

            font-size: 1.5rem;

            font-weight: 800;

            padding: 15px 50px;

            border: none;

            border-radius: 50px;

            border-bottom: 6px solid #e69500;

            cursor: pointer;

            transition: transform 0.2s;

            box-shadow: 0 10px 20px rgba(0,0,0,0.1);

        }



        .submit-btn:hover {

            transform: scale(1.05);

        }



        .submit-btn:active {

            transform: translateY(4px) scale(1.05);

            border-bottom-width: 2px;

        }



        /* ANIMATIONS */

        @keyframes pop {

            0% { transform: scale(1); }

            50% { transform: scale(1.1); }

            100% { transform: scale(1); }

        }



        @keyframes shake {

            0% { transform: translateX(0); }

            20% { transform: translateX(-10px); }

            40% { transform: translateX(10px); }

            60% { transform: translateX(-10px); }

            80% { transform: translateX(10px); }

            100% { transform: translateX(0); }

        }



        @keyframes slideDown {

            from { opacity: 0; transform: translateY(-10px); }

            to { opacity: 1; transform: translateY(0); }

        }



        /* MODAL */

        .modal-overlay {

            position: fixed;

            top: 0; left: 0; width: 100%; height: 100%;

            background: rgba(0,0,0,0.6);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 1000;

            backdrop-filter: blur(5px);

        }



        .result-card {

            background: white;

            padding: 40px;

            border-radius: 30px;

            text-align: center;

            max-width: 400px;

            width: 90%;

            box-shadow: 0 20px 50px rgba(0,0,0,0.3);

            border: 4px solid var(--primary-teal);

            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        }



        .score-big {

            font-size: 4rem;

            font-weight: 900;

            color: var(--primary-purple);

            margin: 10px 0;

            text-shadow: 3px 3px 0 #eee;

        }



        .feedback-text {

            font-size: 1.2rem;

            color: #555;

            margin-bottom: 20px;

        }



        /* Audio Hidden */

        audio { display: none; }

    </style>

</head>

<body>



<header>

    <h1><i class="fas fa-gamepad"></i> SPORTS & GAMES QUIZ</h1>

    <p>Word Form Challenge - Grade 6</p>

    <div class="teacher-tag">Giáo viên: Ms. Chí Nên</div>

</header>



<div class="container" id="quiz-container">

    <!-- Questions will be injected here by JS -->

</div>



<div class="footer-controls">

    <button class="submit-btn" onclick="submitQuiz()">

        <i class="fas fa-check-circle"></i> NỘP BÀI & XEM ĐIỂM

    </button>

</div>



<!-- Modal Result -->

<div class="modal-overlay" id="resultModal">

    <div class="result-card">

        <h2 style="color: var(--primary-teal); margin-top:0;">KẾT QUẢ CỦA CON</h2>

        <div class="score-big" id="finalScore">0/10</div>

        <p class="feedback-text" id="feedbackMsg">Tuyệt vời ông mặt trời!</p>

        <button class="submit-btn" style="font-size: 1rem; padding: 10px 30px;" onclick="location.reload()">Làm lại bài</button>

    </div>

</div>



<!-- Sounds -->

<!-- Sử dụng âm thanh ngắn từ nguồn uy tín cho giáo dục -->

<audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio> <!-- Ding -->

<audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio> <!-- Buzz/Fail -->

<audio id="sound-cheer" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio> <!-- Victory -->



<script>

    // DỮ LIỆU CÂU HỎI & GIẢI THÍCH CHI TIẾT

    const quizData = [

        {

            id: 1,

            question: "Stories about _____________ people in the world of sports are often very interesting. <span class='word-hint'>(fame)</span>",

            options: ["famous", "fame", "famously", "infamous"],

            correct: 0, // Index of correct answer

            explanation: {

                translate: "Những câu chuyện về những người nổi tiếng trong giới thể thao thường rất thú vị.",

                vocab: [

                    "A. famous (adj - tính từ): nổi tiếng",

                    "B. fame (n - danh từ): sự nổi tiếng, danh vọng",

                    "C. famously (adv - trạng từ): một cách nổi tiếng",

                    "D. infamous (adj - tính từ): khét tiếng (nổi tiếng vì điều xấu)"

                ],

                whyCorrect: "Trước danh từ 'people' (người) chúng ta cần một <b>Tính từ (Adjective)</b> để bổ nghĩa.",

                whyWrong: "Loại B (Danh từ) và C (Trạng từ) vì sai loại từ. Loại D vì 'infamous' mang nghĩa tiêu cực, không phù hợp với ngữ cảnh 'interesting' (thú vị)."

            }

        },

        {

            id: 2,

            question: "When you open a newspaper, you’ll always find _____________ about some games. <span class='word-hint'>(inform)</span>",

            options: ["informative", "information", "inform", "informer"],

            correct: 1,

            explanation: {

                translate: "Khi con mở một tờ báo, con sẽ luôn tìm thấy thông tin về các trò chơi.",

                vocab: [

                    "A. informative (adj): cung cấp nhiều tin tức/bổ ích",

                    "B. information (n): thông tin",

                    "C. inform (v): thông báo",

                    "D. informer (n): người chỉ điểm/mật thám"

                ],

                whyCorrect: "Sau động từ 'find' (tìm thấy), ta cần một <b>Danh từ (Noun)</b> chỉ sự vật để làm tân ngữ.",

                whyWrong: "Loại A (Tính từ), C (Động từ). Loại D (Người chỉ điểm) vì sai nghĩa hoàn toàn."

            }

        },

        {

            id: 3,

            question: "Huy’s brother is a _____________ football player, isn’t he? <span class='word-hint'>(profession)</span>",

            options: ["profession", "professor", "professional", "professionally"],

            correct: 2,

            explanation: {

                translate: "Anh trai của Huy là một cầu thủ bóng đá chuyên nghiệp, phải không?",

                vocab: [

                    "A. profession (n): nghề nghiệp",

                    "B. professor (n): giáo sư",

                    "C. professional (adj): chuyên nghiệp",

                    "D. professionally (adv): một cách chuyên nghiệp"

                ],

                whyCorrect: "Đứng trước cụm danh từ 'football player', ta cần một <b>Tính từ (Adjective)</b> để miêu tả tính chất của cầu thủ đó.",

                whyWrong: "Loại A, B (Danh từ) và D (Trạng từ). 'Professional' là tính từ hợp lý nhất."

            }

        },

        {

            id: 4,

            question: "Please listen to the _____________ carefully. <span class='word-hint'>(instruct)</span>",

            options: ["instructs", "instructive", "instructor", "instructions"],

            correct: 3,

            explanation: {

                translate: "Làm ơn hãy lắng nghe các hướng dẫn một cách cẩn thận.",

                vocab: [

                    "A. instructs (v): hướng dẫn (chia ngôi 3)",

                    "B. instructive (adj): có tính răn dạy",

                    "C. instructor (n): người hướng dẫn",

                    "D. instructions (n): các lời chỉ dẫn/hướng dẫn"

                ],

                whyCorrect: "Sau 'the' là danh từ. Cụm từ 'listen to the instructions' (nghe hướng dẫn/luật chơi) là cụm từ cố định trong thể thao/trò chơi.",

                whyWrong: "Dù C là danh từ (người hướng dẫn), nhưng trong ngữ cảnh trò chơi, ta thường nghe 'lời hướng dẫn' (instructions) hơn là nghe 'người'."

            }

        },

        {

            id: 5,

            question: "Did you join the sports _____________ last week, Tom? <span class='word-hint'>(compete)</span>",

            options: ["competitive", "competition", "competitor", "competes"],

            correct: 1,

            explanation: {

                translate: "Bạn có tham gia cuộc thi thể thao tuần trước không Tom?",

                vocab: [

                    "A. competitive (adj): có tính cạnh tranh",

                    "B. competition (n): cuộc thi",

                    "C. competitor (n): đối thủ",

                    "D. competes (v): thi đấu"

                ],

                whyCorrect: "Cần một danh từ ghép với 'sports'. 'Sports competition' nghĩa là hội thi/cuộc thi thể thao.",

                whyWrong: "Không thể 'join a competitor' (tham gia một đối thủ) nên loại C. A và D sai loại từ."

            }

        },

        {

            id: 6,

            question: "_____________ ! Your team won the first prize. <span class='word-hint'>(congratulate)</span>",

            options: ["Congratulate", "Congratulations", "Congratulation", "Congratulating"],

            correct: 1,

            explanation: {

                translate: "Xin chúc mừng! Đội của bạn đã giành giải nhất.",

                vocab: [

                    "A. Congratulate (v): chúc mừng",

                    "B. Congratulations (n): lời chúc mừng (có 's')",

                    "C. Congratulation (n): sự chúc mừng (thiếu 's')",

                    "D. Congratulating (V-ing): việc chúc mừng"

                ],

                whyCorrect: "Khi dùng làm câu cảm thán để chúc mừng ai đó, danh từ này <b>LUÔN LUÔN phải có 's'</b> ở cuối -> Congratulations!",

                whyWrong: "A là động từ. C thiếu 's'. D là V-ing không đứng làm câu cảm thán."

            }

        },

        {

            id: 7,

            question: "The _____________ in this gym is very modern. <span class='word-hint'>(equip)</span>",

            options: ["equipment", "equipments", "equipped", "equipping"],

            correct: 0,

            explanation: {

                translate: "Trang thiết bị trong phòng tập này rất hiện đại.",

                vocab: [

                    "A. equipment (n): trang thiết bị (không đếm được)",

                    "B. equipments (sai ngữ pháp): từ này không bao giờ thêm 's'",

                    "C. equipped (v/adj): được trang bị",

                    "D. equipping (V-ing): việc trang bị"

                ],

                whyCorrect: "Sau 'The' cần danh từ. Lưu ý đặc biệt: <b>Equipment</b> là danh từ KHÔNG ĐẾM ĐƯỢC, không bao giờ có dạng số nhiều thêm 's'.",

                whyWrong: "B sai vì thêm 's'. C và D sai loại từ."

            }

        },

        {

            id: 8,

            question: "I think sports and games are very _____________ . <span class='word-hint'>(use)</span>",

            options: ["use", "useful", "useless", "usefully"],

            correct: 1,

            explanation: {

                translate: "Cô nghĩ thể thao và các trò chơi rất hữu ích.",

                vocab: [

                    "A. use (v/n): dùng/công dụng",

                    "B. useful (adj): có ích, hữu ích",

                    "C. useless (adj): vô dụng",

                    "D. usefully (adv): một cách hữu ích"

                ],

                whyCorrect: "Sau động từ to be 'are' và trạng từ 'very', ta cần một <b>Tính từ (Adjective)</b>.",

                whyWrong: "Loại A và D. Loại C (vô dụng) vì nghĩa tiêu cực, không hợp với ý khen ngợi thể thao."

            }

        },

        {

            id: 9,

            question: "The football fans cheered _____________ for their side. <span class='word-hint'>(loud)</span>",

            options: ["loud", "loudly", "loudness", "louder"],

            correct: 1,

            explanation: {

                translate: "Các cổ động viên bóng đá đã hò reo ầm ĩ cho đội của họ.",

                vocab: [

                    "A. loud (adj): to, ồn ào",

                    "B. loudly (adv): một cách ầm ĩ/nhiệt tình",

                    "C. loudness (n): sự ồn ào",

                    "D. louder (adj): to hơn (so sánh hơn)"

                ],

                whyCorrect: "Để bổ nghĩa cho động từ thường 'cheered' (hò reo), ta cần một <b>Trạng từ (Adverb)</b> thường có đuôi -ly.",

                whyWrong: "A là tính từ. C là danh từ. D là so sánh hơn (không có 'than' nên không dùng)."

            }

        },

        {

            id: 10,

            question: "I did many sports last week and was _____________. <span class='word-hint'>(exhaust)</span>",

            options: ["exhausting", "exhaustion", "exhausted", "exhausts"],

            correct: 2,

            explanation: {

                translate: "Tuần trước tôi chơi nhiều thể thao quá nên đã bị kiệt sức.",

                vocab: [

                    "A. exhausting (adj): gây kiệt sức (dùng cho vật/việc)",

                    "B. exhaustion (n): sự kiệt sức",

                    "C. exhausted (adj): bị kiệt sức (dùng cho người)",

                    "D. exhausts (v): xả ra/làm kiệt sức"

                ],

                whyCorrect: "Miêu tả cảm xúc/trạng thái của con người (I was...), ta dùng tính từ đuôi <b>-ed</b>.",

                whyWrong: "A dùng cho sự vật (The game was exhausting). B sai loại từ. D sai ngữ pháp."

            }

        }

    ];



    let score = 0;

    let answeredCount = 0;



    // RENDER QUIZ

    const container = document.getElementById('quiz-container');



    quizData.forEach((item, index) => {

        const card = document.createElement('div');

        card.className = 'quiz-card';

        card.innerHTML = `

            <div class="question-number">${index + 1}</div>

            <div class="question-text">${item.question}</div>

            <div class="options-grid" id="options-${index}">

                ${item.options.map((opt, i) => `

                    <button class="option-btn" onclick="checkAnswer(${index}, ${i}, this)">

                        ${String.fromCharCode(65 + i)}. ${opt}

                    </button>

                `).join('')}

            </div>

            

            <div class="explanation-box" id="explain-${index}">

                <div class="explain-header">

                    <i class="fas fa-chalkboard-teacher" style="font-size: 1.5rem; margin-right: 10px;"></i>

                    Ms. Chí Nên giải thích:

                </div>

                <div class="explain-content">

                    <p><b>🔍 Dịch câu:</b> <i>"${item.explanation.translate}"</i></p>

                    <ul class="vocab-list">

                        ${item.explanation.vocab.map(v => `<li>${v}</li>`).join('')}

                    </ul>

                    <p style="color: var(--correct-green);"><i class="fas fa-check-circle"></i> <b>Tại sao ĐÚNG:</b> ${item.explanation.whyCorrect}</p>

                    <p style="color: var(--wrong-red);"><i class="fas fa-times-circle"></i> <b>Tại sao SAI:</b> ${item.explanation.whyWrong}</p>

                </div>

            </div>

        `;

        container.appendChild(card);

    });



    // CHECK ANSWER FUNCTION

    function checkAnswer(questionIndex, selectedOptionIndex, btnElement) {

        const questionData = quizData[questionIndex];

        const optionsDiv = document.getElementById(`options-${questionIndex}`);

        const allBtns = optionsDiv.getElementsByTagName('button');

        const explainBox = document.getElementById(`explain-${questionIndex}`);



        // Prevent clicking again

        if (btnElement.classList.contains('disabled')) return;

        

        // Disable all buttons in this question

        for (let btn of allBtns) {

            btn.classList.add('disabled');

            btn.disabled = true;

            if (btn !== btnElement) btn.classList.add('dimmed');

        }



        answeredCount++;



        if (selectedOptionIndex === questionData.correct) {

            // CORRECT

            btnElement.classList.add('correct');

            playSound('correct');

            score++;

            triggerConfetti();

        } else {

            // WRONG

            btnElement.classList.add('wrong');

            playSound('wrong');

            // Highlight the correct answer automatically

            allBtns[questionData.correct].classList.remove('dimmed');

            allBtns[questionData.correct].classList.add('correct');

        }



        // SHOW EXPLANATION

        explainBox.style.display = 'block';

    }



    // PLAY SOUND

    function playSound(type) {

        const soundMap = {

            'correct': 'sound-correct',

            'wrong': 'sound-wrong',

            'cheer': 'sound-cheer'

        };

        const audio = document.getElementById(soundMap[type]);

        if (audio) {

            audio.currentTime = 0;

            audio.play().catch(e => console.log("Audio play failed interaction needed"));

        }

    }



    // CONFETTI EFFECT

    function triggerConfetti() {

        confetti({

            particleCount: 100,

            spread: 70,

            origin: { y: 0.6 },

            colors: ['#8854C0', '#00C9A7', '#FF4757', '#FFD700']

        });

    }



    // SUBMIT & SHOW SCORE

    function submitQuiz() {

        if (answeredCount < quizData.length) {

            const confirmMsg = confirm("Con chưa làm hết các câu hỏi. Con có chắc chắn muốn nộp bài không?");

            if (!confirmMsg) return;

        }



        const modal = document.getElementById('resultModal');

        const scoreDisplay = document.getElementById('finalScore');

        const feedback = document.getElementById('feedbackMsg');



        scoreDisplay.textContent = `${score}/${quizData.length}`;

        

        // Feedback logic

        const percentage = (score / quizData.length) * 100;

        if (percentage === 100) {

            feedback.textContent = "Xuất sắc! Con là thiên tài Word Form! 🌟";

            playSound('cheer');

            confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });

        } else if (percentage >= 70) {

            feedback.textContent = "Làm tốt lắm! Chỉ sai xíu xiu thôi. 💪";

            playSound('cheer');

        } else {

            feedback.textContent = "Cố gắng hơn nhé! Hãy xem lại phần giải thích của Ms. Chí Nên. 📚";

        }



        modal.style.display = 'flex';

    }

</script>
