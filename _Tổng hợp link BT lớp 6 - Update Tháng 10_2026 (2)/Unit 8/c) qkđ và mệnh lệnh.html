<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Anh Cùng Cô MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f7ff;
            background-image: radial-gradient(#8854c0 0.5px, transparent 0.5px), radial-gradient(#8854c0 0.5px, #f0f7ff 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 20px 0 rgba(136, 84, 192, 0.2);
            transition: all 0.3s ease;
        }

        .btn-option {
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 6px 0 #e2e8f0;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            text-align: left;
            padding: 1rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #cbd5e1;
            border-color: #cbd5e1;
        }

        .btn-option:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #cbd5e1;
        }

        .btn-option.correct {
            background-color: #00D26A !important;
            border-color: #00a854 !important;
            box-shadow: 0 6px 0 #008f47 !important;
            color: white !important;
        }

        .btn-option.wrong {
            background-color: #FF4757 !important;
            border-color: #e03d4b !important;
            box-shadow: 0 6px 0 #c03440 !important;
            color: white !important;
        }

        .explanation-box {
            animation: slideIn 0.5s ease-out;
            border-left: 8px solid #00C9A7;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake { animation: shake 0.4s ease-in-out; }

        .progress-bar-inner {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ulis-header {
            font-size: 0.8rem;
            color: #8854C0;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #8854C0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header Section -->
    <div class="text-center mb-6">
        <h3 class="ulis-header uppercase">Giáo viên tạo: Ms MS Chí Nên</h3>
        <h1 class="text-3xl md:text-4xl font-extrabold text-[#8854C0] mt-1 drop-shadow-sm">🏆 THỬ THÁCH SIÊU SAO THỂ THAO</h1>
    </div>

    <!-- Main Quiz Container -->
    <div id="quiz-container" class="w-full max-w-2xl">
        <!-- Progress Info -->
        <div class="flex justify-between items-center mb-4 px-2">
            <span class="font-bold text-[#8854C0]">Câu hỏi: <span id="current-idx">1</span>/30</span>
            <span class="font-bold text-[#00C9A7]">Điểm: <span id="score">0</span></span>
        </div>
        
        <!-- Progress Bar -->
        <div class="w-full h-4 bg-white rounded-full mb-8 overflow-hidden shadow-inner border-2 border-white">
            <div id="progress-bar" class="progress-bar-inner h-full bg-[#00C9A7]" style="width: 3.33%"></div>
        </div>

        <!-- Question Card -->
        <div id="question-card" class="glass-card p-6 md:p-8 relative">
            <div id="question-text" class="text-xl md:text-2xl font-bold text-gray-800 mb-8 leading-relaxed">
                Loading...
            </div>

            <div id="options-container" class="grid grid-cols-1 gap-4 mb-8">
                <!-- Options will be injected here -->
            </div>

            <!-- Explanation Area (Hidden by default) -->
            <div id="explanation-area" class="hidden">
                <div class="explanation-box bg-emerald-50 p-5 rounded-2xl mb-6 text-gray-700 shadow-sm border border-emerald-100">
                    <h4 class="font-black text-emerald-700 mb-2 flex items-center">
                        <span class="mr-2">👩‍🏫</span> CÔ MS Chí Nên GIẢI THÍCH:
                    </h4>
                    <div id="explanation-content" class="text-sm md:text-base space-y-3 leading-relaxed">
                        <!-- Content here -->
                    </div>
                </div>
                <button id="next-btn" class="w-full py-4 bg-[#8854C0] text-white font-extrabold rounded-2xl shadow-[0_6px_0_#6b3da3] hover:translate-y-[-2px] hover:shadow-[0_8px_0_#6b3da3] active:translate-y-[4px] active:shadow-none transition-all text-lg">
                    TIẾP TỤC THÔI! 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- Final Result Modal -->
    <div id="result-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-card max-w-sm w-full p-8 text-center animate-bounce-short">
            <div class="text-6xl mb-4">⭐</div>
            <h2 class="text-3xl font-black text-[#8854C0] mb-2">XUẤT SẮC!</h2>
            <p class="text-gray-600 mb-6 font-semibold">Bạn đã hoàn thành bài thi của Cô MS Chí Nên.</p>
            <div class="bg-gray-100 rounded-2xl p-6 mb-8 border-2 border-dashed border-gray-300">
                <div class="text-5xl font-black text-[#00C9A7]" id="final-score">0/30</div>
                <div class="text-sm font-bold text-gray-500 mt-2 uppercase">Tổng số câu đúng</div>
            </div>
            <p id="comment" class="text-emerald-600 font-bold italic mb-8">"Làm tốt lắm, tiếp tục phát huy nhé!"</p>
            <button onclick="location.reload()" class="w-full py-4 bg-[#00C9A7] text-white font-extrabold rounded-2xl shadow-[0_6px_0_#00a88c] hover:translate-y-[-2px] transition-all">
                LÀM LẠI BÀI THI 🔄
            </button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                q: "Yesterday, our team _______ (win) the basketball championship 85-70.",
                options: ["won", "winned", "wins", "winning"],
                correct: 0,
                explanation: {
                    analysis: ["won (v2): thắng (động từ bất quy tắc).", "winned: sai (không tồn tại trong tiếng Anh).", "wins (v1): thắng (dùng cho hiện tại đơn).", "winning (v-ing): đang thắng (cần trợ động từ be)."],
                    translation: "Hôm qua, đội của chúng tôi đã thắng chức vô địch bóng rổ với tỉ số 85-70.",
                    whyRight: "Vì có trạng từ 'Yesterday' (hôm qua), ta dùng thì Quá khứ đơn. 'Win' là động từ bất quy tắc, cột 2 là 'won'.",
                    whyWrong: "'Wins' dùng cho hiện tại, 'Winning' không đứng một mình làm động từ chính, 'Winned' là từ viết sai quy tắc."
                }
            },
            {
                q: "I _______ (not/go) swimming last Sunday because it was too cold.",
                options: ["not went", "didn't go", "didn't went", "don't go"],
                correct: 1,
                explanation: {
                    analysis: ["not went: sai cấu trúc phủ định.", "didn't go: đúng (cấu trúc phủ định quá khứ).", "didn't went: sai (sau didn't động từ phải nguyên mẫu).", "don't go: sai (dùng cho hiện tại)."],
                    translation: "Tôi đã không đi bơi chủ nhật trước vì trời quá lạnh.",
                    whyRight: "Cấu trúc phủ định Quá khứ đơn với động từ thường: S + didn't + V (nguyên thể). Ở đây có 'last Sunday'.",
                    whyWrong: "Không bao giờ dùng 'not' đứng trước V2, và không bao giờ dùng V2 (went) sau 'didn't'."
                }
            },
            {
                q: "_______ you _______ (watch) the football match on TV last night?",
                options: ["Did / watch", "Do / watch", "Did / watched", "Were / watch"],
                correct: 0,
                explanation: {
                    analysis: ["Did / watch: đúng cấu trúc câu hỏi quá khứ.", "Do / watch: sai thì (hiện tại).", "Did / watched: sai (sau did động từ giữ nguyên).", "Were / watch: sai trợ động từ."],
                    translation: "Bạn có xem trận bóng đá trên TV tối qua không?",
                    whyRight: "Câu hỏi Nghi vấn Quá khứ đơn: Did + S + V (nguyên thể)? Dấu hiệu: 'last night'.",
                    whyWrong: "'Were' chỉ dùng cho danh từ/tính từ trong quá khứ, không dùng để hỏi cho động từ thường 'watch'."
                }
            },
            {
                q: "The students _______ (play) badminton in the schoolyard two hours ago.",
                options: ["played", "plaied", "playing", "plays"],
                correct: 0,
                explanation: {
                    analysis: ["played: đúng (động từ có quy tắc).", "plaied: sai chính tả.", "playing: thiếu to be.", "plays: sai thì (hiện tại)."],
                    translation: "Các học sinh đã chơi cầu lông ở sân trường hai giờ trước.",
                    whyRight: "Dấu hiệu 'two hours ago' -> Quá khứ đơn. 'Play' là động từ có quy tắc, chỉ cần thêm '-ed' thành 'played'.",
                    whyWrong: "Quy tắc chính tả: 'y' đứng sau nguyên âm 'a' thì chỉ việc thêm 'ed', không đổi thành 'i'."
                }
            },
            {
                q: "My brother _______ (be) the best chess player in his class last year.",
                options: ["were", "was", "is", "been"],
                correct: 1,
                explanation: {
                    analysis: ["were: sai ngôi (dùng cho số nhiều).", "was: đúng (quá khứ của be số ít).", "is: sai thì (hiện tại).", "been: sai dạng (phân từ 2)."],
                    translation: "Anh trai tôi là người chơi cờ giỏi nhất lớp năm ngoái.",
                    whyRight: "Chủ ngữ 'My brother' là số ít, trạng từ 'last year' -> dùng 'was'.",
                    whyWrong: "'Were' dùng cho các chủ ngữ số nhiều như You/We/They."
                }
            },
            {
                q: "We _______ (stop) playing tennis when it started to rain.",
                options: ["stopped", "stoped", "stops", "stopping"],
                correct: 0,
                explanation: {
                    analysis: ["stopped: đúng (gấp đôi phụ âm).", "stoped: sai chính tả.", "stops: sai thì.", "stopping: sai cấu trúc."],
                    translation: "Chúng tôi đã ngừng chơi quần vợt khi trời bắt đầu mưa.",
                    whyRight: "Động từ 'stop' tận cùng là 1 nguyên âm kẹp giữa 2 phụ âm (o nằm giữa t và p) -> Phải gấp đôi phụ âm cuối trước khi thêm '-ed'.",
                    whyWrong: "Nếu không gấp đôi 'p' là viết sai chính tả tiếng Anh."
                }
            },
            {
                q: "_______ (be) you at the sports center yesterday afternoon?",
                options: ["Was", "Were", "Are", "Did"],
                correct: 1,
                explanation: {
                    analysis: ["Was: sai ngôi (dùng cho I/He/She/It).", "Were: đúng ngôi (You/We/They).", "Are: hiện tại.", "Did: không dùng với tính từ/trạng từ nơi chốn."],
                    translation: "Bạn có ở trung tâm thể thao chiều hôm qua không?",
                    whyRight: "Câu hỏi với động từ To be ở quá khứ: Were + You + ...? Vì chủ ngữ là 'You'.",
                    whyWrong: "Không dùng 'Did' vì ở đây không có động từ hành động chính, chỉ có trạng ngữ nơi chốn."
                }
            },
            {
                q: "She _______ (study) all the rules before joining the karate club.",
                options: ["studyed", "studied", "studies", "studying"],
                correct: 1,
                explanation: {
                    analysis: ["studyed: sai chính tả.", "studied: đúng quy tắc biến y thành i.", "studies: hiện tại.", "studying: đang học."],
                    translation: "Cô ấy đã nghiên cứu tất cả các quy tắc trước khi tham gia câu lạc bộ karate.",
                    whyRight: "'Study' tận cùng là 'y', trước đó là phụ âm 'd' -> Phải đổi 'y' thành 'i' rồi mới thêm '-ed'.",
                    whyWrong: "Viết 'studyed' là lỗi sai chính tả phổ biến cần tránh."
                }
            },
            {
                q: "They _______ (not/be) happy when their team lost the game.",
                options: ["didn't be", "weren't", "wasn't", "aren't"],
                correct: 1,
                explanation: {
                    analysis: ["didn't be: sai (không bao giờ dùng didn't với be).", "weren't: đúng (were not).", "wasn't: sai ngôi (số ít).", "aren't: hiện tại."],
                    translation: "Họ đã không vui khi đội của họ thua trận.",
                    whyRight: "Động từ 'to be' tự bản thân nó thêm 'not' trong phủ định quá khứ. Chủ ngữ 'They' dùng 'were not' = 'weren't'.",
                    whyWrong: "Lưu ý cực quan trọng: Động từ To be KHÔNG mượn trợ động từ 'did'."
                }
            },
            {
                q: "When _______ he _______ (start) learning table tennis?",
                options: ["did / started", "did / start", "do / start", "was / start"],
                correct: 1,
                explanation: {
                    analysis: ["did / started: sai (thừa ed).", "did / start: đúng cấu trúc câu hỏi.", "do / start: hiện tại.", "was / start: sai trợ động từ."],
                    translation: "Anh ấy bắt đầu học bóng bàn khi nào?",
                    whyRight: "Câu hỏi Wh- ở quá khứ: Wh- + did + S + V (nguyên thể)?",
                    whyWrong: "Trong câu hỏi đã có 'did' thì động từ phải trở về 'start' nguyên gốc."
                }
            },
            {
                q: "The coach _______ (teach) us new techniques last Monday.",
                options: ["teached", "taught", "thought", "teaching"],
                correct: 1,
                explanation: {
                    analysis: ["teached: sai (không tồn tại).", "taught: đúng (quá khứ của teach).", "thought: sai nghĩa (nghĩ).", "teaching: đang dạy."],
                    translation: "Huấn luyện viên đã dạy chúng tôi các kỹ thuật mới vào thứ Hai tuần trước.",
                    whyRight: "'Teach' là động từ bất quy tắc, quá khứ là 'taught'.",
                    whyWrong: "'Thought' là quá khứ của 'think', rất dễ bị nhầm lẫn vì cách viết tương tự."
                }
            },
            {
                q: "I _______ (try) aerobics for the first time three weeks ago.",
                options: ["tried", "tryed", "trys", "trying"],
                correct: 0,
                explanation: {
                    analysis: ["tried: đúng quy tắc y -> i.", "tryed: sai chính tả.", "trys: hiện tại.", "trying: đang thử."],
                    translation: "Tôi đã thử tập aerobics lần đầu tiên ba tuần trước.",
                    whyRight: "'Try' kết thúc bằng 'y', trước là phụ âm 'r' -> đổi 'y' thành 'i' + 'ed'.",
                    whyWrong: "'Tryed' là cách viết sai chính tả."
                }
            },
            {
                q: "The players _______ (not/have) enough time to practice before the tournament.",
                options: ["didn't had", "didn't have", "not had", "don't have"],
                correct: 1,
                explanation: {
                    analysis: ["didn't had: sai (sau didn't phải nguyên mẫu).", "didn't have: đúng cấu trúc phủ định.", "not had: thiếu trợ động từ.", "don't have: hiện tại."],
                    translation: "Các cầu thủ đã không có đủ thời gian để tập luyện trước giải đấu.",
                    whyRight: "Cấu trúc: didn't + V (nguyên mẫu). 'Have' là nguyên mẫu của 'had'.",
                    whyWrong: "Không bao giờ dùng V2 (had) sau 'didn't'."
                }
            },
            {
                q: "All the students _______ (be) excited about Sports Day in 2023.",
                options: ["was", "were", "are", "been"],
                correct: 1,
                explanation: {
                    analysis: ["was: sai ngôi (số ít).", "were: đúng ngôi (số nhiều).", "are: hiện tại.", "been: phân từ 2."],
                    translation: "Tất cả học sinh đều hào hứng về Ngày hội Thể thao năm 2023.",
                    whyRight: "Chủ ngữ 'All the students' là danh từ số nhiều -> dùng 'were'.",
                    whyWrong: "Dù là học sinh tiểu học hay cấp 2, nhớ 'were' đi với số nhiều nhé!"
                }
            },
            {
                q: "My father _______ (buy) me new goggles for swimming last month.",
                options: ["bought", "buyed", "buys", "buying"],
                correct: 0,
                explanation: {
                    analysis: ["bought: đúng (quá khứ bất quy tắc).", "buyed: sai (không tồn tại).", "buys: hiện tại.", "buying: đang mua."],
                    translation: "Bố tôi đã mua cho tôi kính bơi mới vào tháng trước.",
                    whyRight: "'Buy' là động từ bất quy tắc, quá khứ là 'bought'.",
                    whyWrong: "Rất nhiều bạn nhầm 'buyed', nhớ học thuộc bảng động từ bất quy tắc nha!"
                }
            },
            // IMPERATIVES SECTION
            {
                q: "_______ (bring) your racket to the tennis court tomorrow!",
                options: ["Bringing", "To bring", "Bring", "Brought"],
                correct: 2,
                explanation: {
                    analysis: ["Bringing: sai.", "To bring: sai.", "Bring: đúng (câu mệnh lệnh).", "Brought: quá khứ."],
                    translation: "Hãy mang vợt của bạn đến sân quần vợt ngày mai nhé!",
                    whyRight: "Câu mệnh lệnh khẳng định bắt đầu trực tiếp bằng động từ nguyên mẫu (Bare infinitive).",
                    whyWrong: "Không dùng 'To' hay đuôi '-ing' ở đầu câu mệnh lệnh."
                }
            },
            {
                q: "_______ (not/run) near the swimming pool! It's dangerous.",
                options: ["Not run", "Don't run", "No run", "Doesn't run"],
                correct: 1,
                explanation: {
                    analysis: ["Not run: sai cấu trúc.", "Don't run: đúng mệnh lệnh phủ định.", "No run: sai.", "Doesn't run: sai (mệnh lệnh chỉ dùng Don't)."],
                    translation: "Đừng chạy gần hồ bơi! Nguy hiểm lắm.",
                    whyRight: "Câu mệnh lệnh phủ định (cấm đoán) luôn bắt đầu bằng: Don't + V (nguyên thể).",
                    whyWrong: "Kể cả chủ ngữ ngầm định là ai, câu mệnh lệnh chỉ dùng 'Don't', không dùng 'Doesn't' hay 'No'."
                }
            },
            {
                q: "_______ (let/play) chess together this afternoon!",
                options: ["Let play", "Let's play", "Lets play", "Let's playing"],
                correct: 1,
                explanation: {
                    analysis: ["Let play: thiếu 's.", "Let's play: đúng (rủ rê).", "Lets play: sai (thiếu dấu phẩy s).", "Let's playing: sai (sau Let's dùng nguyên mẫu)."],
                    translation: "Chúng ta hãy cùng chơi cờ vua chiều nay nhé!",
                    whyRight: "Cấu trúc rủ rê: Let's (viết tắt của Let us) + V (nguyên thể).",
                    whyWrong: "'Lets' không có dấu phẩy là động từ chia ở ngôi thứ 3 số ít, không phải cấu trúc rủ rê."
                }
            },
            {
                q: "_______ (pass) me the ball, please!",
                options: ["Pass", "To pass", "Passing", "Passed"],
                correct: 0,
                explanation: {
                    analysis: ["Pass: đúng.", "To pass: sai.", "Passing: sai.", "Passed: quá khứ."],
                    translation: "Làm ơn chuyền bóng cho tôi!",
                    whyRight: "Đây là câu yêu cầu lịch sự, ta dùng động từ nguyên mẫu 'Pass'.",
                    whyWrong: "Dù có 'please' ở cuối thì cấu trúc mệnh lệnh vẫn không thay đổi."
                }
            },
            {
                q: "Please _______ (wear) your goggles before jumping into the water.",
                options: ["to wear", "wearing", "wear", "wears"],
                correct: 2,
                explanation: {
                    analysis: ["to wear: sai.", "wearing: sai.", "wear: đúng.", "wears: sai (thừa s)."],
                    translation: "Vui lòng đeo kính bơi trước khi nhảy xuống nước.",
                    whyRight: "Cấu trúc: Please + V (nguyên thể) dùng để ra lệnh/yêu cầu lịch sự.",
                    whyWrong: "Không được thêm 's' vào động từ trong câu mệnh lệnh."
                }
            },
            {
                q: "_______ (not/forget) to warm up before doing aerobics!",
                options: ["Don't forget", "Not forget", "No forget", "Doesn't forget"],
                correct: 0,
                explanation: {
                    analysis: ["Don't forget: đúng.", "Not forget: sai.", "No forget: sai.", "Doesn't forget: sai."],
                    translation: "Đừng quên khởi động trước khi tập aerobics nhé!",
                    whyRight: "Mệnh lệnh phủ định (nhắc nhở đừng quên): Don't + forget.",
                    whyWrong: "Tiếng Anh không dùng 'No forget' hay 'Not forget' ở đầu câu."
                }
            },
            {
                q: "_______ (let/not/give) up! We can still win this match!",
                options: ["Let's not give", "Let's don't give", "Don't let's give", "Not let's give"],
                correct: 0,
                explanation: {
                    analysis: ["Let's not give: đúng cấu trúc phủ định của let's.", "Let's don't give: sai.", "Don't let's give: sai.", "Not let's give: sai."],
                    translation: "Chúng ta đừng bỏ cuộc! Chúng ta vẫn có thể thắng trận này!",
                    whyRight: "Cấu trúc rủ rê phủ định (khuyên ai đó đừng làm gì cùng mình): Let's + not + V (nguyên thể).",
                    whyWrong: "Không dùng 'don't' sau 'Let's'."
                }
            },
            {
                q: "_______ (watch) the coach carefully and learn the moves!",
                options: ["Watch", "Watching", "Watches", "To watch"],
                correct: 0,
                explanation: {
                    analysis: ["Watch: đúng.", "Watching: sai.", "Watches: sai.", "To watch: sai."],
                    translation: "Hãy quan sát huấn luyện viên cẩn thận và học các động tác!",
                    whyRight: "Câu mệnh lệnh bắt đầu bằng động từ 'Watch'.",
                    whyWrong: "Câu này có 2 vế nối bằng 'and', vế sau là 'learn' (nguyên mẫu) thì vế đầu cũng phải là 'Watch' (nguyên mẫu)."
                }
            },
            {
                q: "The coach said: \"_______ (hurry) up! The game is starting!\"",
                options: ["Hurry", "Hurrying", "Hurries", "To hurry"],
                correct: 0,
                explanation: {
                    analysis: ["Hurry: đúng.", "Hurrying: sai.", "Hurries: sai.", "To hurry: sai."],
                    translation: "Huấn luyện viên nói: 'Nhanh lên! Trận đấu bắt đầu rồi!'",
                    whyRight: "Cụm động từ mệnh lệnh: Hurry up (Nhanh lên).",
                    whyWrong: "Đây là lời nói trực tiếp mang tính thúc giục, dùng động từ nguyên mẫu."
                }
            },
            {
                q: "_______ (not/be) late for karate practice!",
                options: ["Don't be", "Not be", "No be", "Don't"],
                correct: 0,
                explanation: {
                    analysis: ["Don't be: đúng.", "Not be: sai.", "No be: sai.", "Don't: thiếu động từ be."],
                    translation: "Đừng đến muộn buổi tập karate nhé!",
                    whyRight: "Cấu trúc phủ định với tính từ 'late': Don't + be + adj.",
                    whyWrong: "Vì 'late' là tính từ nên bắt buộc phải có động từ 'be' đi kèm, không được nói 'Don't late'."
                }
            },
            {
                q: "_______ (keep) your eyes on the ball when playing table tennis!",
                options: ["Keep", "Keeping", "Kept", "To keep"],
                correct: 0,
                explanation: {
                    analysis: ["Keep: đúng.", "Keeping: sai.", "Kept: quá khứ.", "To keep: sai."],
                    translation: "Hãy để mắt đến quả bóng khi chơi bóng bàn!",
                    whyRight: "Mệnh lệnh khẳng định: Keep.",
                    whyWrong: "Dạng nguyên mẫu 'Keep' là chính xác cho một lời hướng dẫn kỹ thuật."
                }
            },
            {
                q: "_______ (let/practice) outdoors today! The weather is perfect.",
                options: ["Let's practice", "Let practice", "Let's practicing", "Let's to practice"],
                correct: 0,
                explanation: {
                    analysis: ["Let's practice: đúng.", "Let practice: thiếu 's.", "Let's practicing: sai.", "Let's to practice: sai."],
                    translation: "Chúng ta hãy tập luyện ngoài trời hôm nay đi! Thời tiết rất tuyệt.",
                    whyRight: "Let's + V (nguyên mẫu).",
                    whyWrong: "Luôn nhớ: sau Let's KHÔNG có 'to' và KHÔNG có '-ing'."
                }
            },
            {
                q: "Please _______ (wait) for me at the schoolyard, I'll be there soon.",
                options: ["waiting", "waits", "wait", "to wait"],
                correct: 2,
                explanation: {
                    analysis: ["waiting: sai.", "waits: sai.", "wait: đúng.", "to wait: sai."],
                    translation: "Vui lòng đợi tớ ở sân trường, tớ sẽ đến đó sớm thôi.",
                    whyRight: "Câu yêu cầu với 'Please' dùng động từ 'wait' nguyên mẫu.",
                    whyWrong: "Không dùng 'waiting' hay 'to wait' sau 'Please'."
                }
            },
            {
                q: "_______ (let/not/play) video games all day! We should exercise.",
                options: ["Let's not play", "Let's no play", "Don't let's play", "Let's don't play"],
                correct: 0,
                explanation: {
                    analysis: ["Let's not play: đúng.", "Let's no play: sai từ.", "Don't let's play: sai cấu trúc.", "Let's don't play: sai."],
                    translation: "Chúng ta đừng chơi điện tử cả ngày! Chúng ta nên tập thể dục.",
                    whyRight: "Cấu trúc chuẩn nhất cho lời rủ rê phủ định: Let's not + V.",
                    whyWrong: "Dùng 'Let's don't' là lỗi sai ngữ pháp nghiêm trọng."
                }
            },
            {
                q: "_______ (listen) to the referee's instructions, please!",
                options: ["Listen", "Listening", "To listen", "Listened"],
                correct: 0,
                explanation: {
                    analysis: ["Listen: đúng.", "Listening: sai.", "To listen: sai.", "Listened: quá khứ."],
                    translation: "Làm ơn hãy lắng nghe hướng dẫn của trọng tài!",
                    whyRight: "Động từ nguyên mẫu đứng đầu câu làm mệnh lệnh.",
                    whyWrong: "Kể cả có 'please' ở cuối, cấu trúc đầu câu vẫn là động từ nguyên mẫu."
                }
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let hasAnswered = false;

        const soundCorrect = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
        const soundWrong = new Audio('https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3');

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            hasAnswered = false;
            const q = quizData[currentIdx];
            document.getElementById('current-idx').innerText = currentIdx + 1;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress-bar').style.width = ((currentIdx + 1) / 30 * 100) + '%';
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option text-lg font-bold text-gray-700 flex items-center';
                btn.innerHTML = `
                    <span class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center mr-4 text-sm border-2 border-gray-200">
                        ${String.fromCharCode(65 + i)}
                    </span>
                    ${opt}
                `;
                btn.onclick = () => checkAnswer(i, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation-area').classList.add('hidden');
        }

        function checkAnswer(selectedIdx, btn) {
            if (hasAnswered) return;
            hasAnswered = true;
            
            const q = quizData[currentIdx];
            const allBtns = document.querySelectorAll('.btn-option');
            
            if (selectedIdx === q.correct) {
                btn.classList.add('correct');
                score++;
                document.getElementById('score').innerText = score;
                soundCorrect.play();
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#8854C0', '#00C9A7', '#FFD700']
                });
            } else {
                btn.classList.add('wrong');
                btn.classList.add('shake');
                allBtns[q.correct].classList.add('correct');
                soundWrong.play();
            }

            showExplanation();
        }

        function showExplanation() {
            const q = quizData[currentIdx];
            const content = document.getElementById('explanation-content');
            content.innerHTML = `
                <p><strong>1. Phân tích 4 đáp án:</strong></p>
                <ul class="list-disc ml-5 space-y-1">
                    ${q.explanation.analysis.map(item => `<li>${item}</li>`).join('')}
                </ul>
                <p><strong>2. Dịch nghĩa toàn câu:</strong> "${q.explanation.translation}"</p>
                <p><strong>3. Tại sao chọn đáp án này?</strong> ${q.explanation.whyRight}</p>
                <p><strong>4. Tại sao các câu kia sai?</strong> ${q.explanation.whyWrong}</p>
                <p class="text-right font-bold text-emerald-600 mt-2">— Chúc các em học tốt! ✨ —</p>
            `;
            document.getElementById('explanation-area').classList.remove('hidden');
            
            // Auto scroll to explanation for better UX on mobile
            setTimeout(() => {
                document.getElementById('explanation-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        document.getElementById('next-btn').onclick = () => {
            currentIdx++;
            if (currentIdx < quizData.length) {
                renderQuestion();
            } else {
                showFinalResult();
            }
        };

        function showFinalResult() {
            document.getElementById('final-score').innerText = `${score}/30`;
            const comment = document.getElementById('comment');
            if (score === 30) comment.innerText = '"Tuyệt vời ông mặt trời! Em là thiên tài tiếng Anh!"';
            else if (score >= 25) comment.innerText = '"Rất tốt! Em sắp trở thành siêu sao rồi đó!"';
            else if (score >= 15) comment.innerText = '"Khá lắm, nhưng cần xem kỹ lời giải của cô MS Chí Nên nhé!"';
            else comment.innerText = '"Đừng buồn, hãy ôn lại bài và thử lại lần nữa nhé. Cô tin em!"';
            
            document.getElementById('result-modal').classList.remove('hidden');
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
