<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 8: Sports & Games - Ms MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #8854C0; /* Tím hồng */
            --secondary: #00C9A7; /* Xanh ngọc */
            --accent: #FF9F43; /* Cam */
            --correct: #00D26A;
            --wrong: #FF4757;
            --bg: #F0F3F8;
            --text: #2C3E50;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(var(--primary) 0.5px, transparent 0.5px), radial-gradient(var(--secondary) 0.5px, #F0F3F8 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 0 rgba(136, 84, 192, 0.2);
            border: 3px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        h1 {
            font-family: 'Quicksand', sans-serif;
            color: var(--primary);
            font-size: 1.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .teacher-name {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
            font-weight: 700;
        }

        /* SCOREBOARD */
        .scoreboard {
            position: sticky;
            top: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            z-index: 1000;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid var(--secondary);
        }

        .score-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
        }

        .score-correct { color: var(--correct); }
        .score-total { color: var(--primary); }

        /* QUESTION CARD */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 #E0E6ED;
            border: 2px solid #E0E6ED;
            transition: transform 0.2s;
            position: relative;
        }
        
        .card:hover { transform: translateY(-3px); }

        .q-number {
            position: absolute;
            top: -15px;
            left: 20px;
            background: var(--accent);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 4px 0 #E58E26;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 25px;
            margin-top: 10px;
            line-height: 1.6;
            color: #2D3436;
        }

        .highlight {
            color: var(--primary);
            font-weight: 800;
            background: #F3E5F5;
            padding: 2px 5px;
            border-radius: 4px;
        }

        /* OPTIONS GRID */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-option {
            background: white;
            border: 2px solid #E0E6ED;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 0 #E0E6ED;
            text-align: left;
            position: relative;
            display: flex;
            align-items: center;
        }

        .btn-option:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #E0E6ED;
        }

        .btn-option:hover {
            background-color: #f8f9fa;
            border-color: var(--secondary);
        }

        .btn-option.correct {
            background-color: var(--correct);
            color: white;
            border-color: #00A653;
            box-shadow: 0 5px 0 #00A653;
        }

        .btn-option.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: #D63031;
            box-shadow: 0 5px 0 #D63031;
            animation: shake 0.5s;
        }

        .opt-label {
            background: #E0E6ED;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            font-size: 0.9rem;
            color: #636e72;
            flex-shrink: 0;
        }
        
        .btn-option.correct .opt-label { background: rgba(255,255,255,0.3); color: white; }
        .btn-option.wrong .opt-label { background: rgba(255,255,255,0.3); color: white; }

        /* EXPLANATION BOX */
        .explanation {
            margin-top: 25px;
            background: #F0F9FF;
            border: 2px solid #BAE6FD;
            border-radius: 15px;
            padding: 20px;
            display: none;
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .explanation::before {
            content: '💡 Cô MS Chí Nên giải thích:';
            position: absolute;
            top: -12px;
            left: 20px;
            background: #BAE6FD;
            color: #0284C7;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 10px;
        }

        .explanation.show { display: block; }

        .exp-section { margin-bottom: 10px; }
        .exp-label { font-weight: 800; color: var(--primary); font-size: 0.95rem; text-decoration: underline; text-decoration-color: var(--secondary); }
        .exp-text { font-size: 0.95rem; line-height: 1.5; color: #334155; }
        .vocab-item { display: block; margin-bottom: 5px; }
        .vocab-word { font-weight: bold; color: #D35400; }

        /* SPECIAL CSS DRAWINGS FOR Q29 & Q30 */
        
        /* Q29: Restaurant Sign */
        .restaurant-sign {
            background: #2d3436;
            border: 4px solid #d63031;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(214, 48, 49, 0.5), inset 0 0 20px rgba(0,0,0,0.5);
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            position: relative;
            margin-bottom: 20px;
        }
        .restaurant-sign h3 {
            color: #ff7675;
            text-shadow: 0 0 10px #ff7675;
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            border-bottom: 2px dashed #636e72;
            padding-bottom: 10px;
        }
        .restaurant-sign p {
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .restaurant-sign .blank-space {
            border-bottom: 2px solid #ffeaa7;
            color: #ffeaa7;
            display: inline-block;
            min-width: 100px;
        }

        /* Q30: Smart Watch / Phone App */
        .health-app {
            background: linear-gradient(135deg, #00b894, #00cec9);
            border-radius: 30px;
            padding: 30px;
            color: white;
            width: 100%;
            max-width: 350px;
            margin: 0 auto 20px auto;
            box-shadow: 0 15px 30px rgba(0, 184, 148, 0.4);
            border: 8px solid #dfe6e9;
            position: relative;
        }
        .health-app::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 5px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
        }
        .health-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 10px;
            animation: heartbeat 1.5s infinite;
        }
        .health-msg {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            line-height: 1.5;
            backdrop-filter: blur(5px);
        }

        /* ANIMATIONS */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* SUBMIT BUTTON */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 40px;
            cursor: pointer;
            box-shadow: 0 8px 0 #009e82;
            transition: transform 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .submit-btn:active {
            transform: translateY(8px);
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .card { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Exercise 3: Sports & Games</h1>
        <div class="teacher-name">Giáo viên tạo: Ms MS Chí Nên</div>
    </header>

    <div class="scoreboard">
        <div class="score-box score-correct">
            <span>🏆 Đúng: </span> <span id="score">0</span>
        </div>
        <div class="score-box score-total">
            <span>📝 Câu: </span> <span id="current">0</span>/30
        </div>
    </div>

    <div id="quiz-container">
        </div>

    <button class="submit-btn" onclick="finishTest()">Nộp Bài & Nhận Quà</button>
</div>

<script>
    // DỮ LIỆU CÂU HỎI (30 Câu - Exercise 3)
    const questions = [
        {
            id: 1,
            text: "I go to the _______ to use the treadmill and lift weights.",
            options: [
                { id: 'A', text: "gym" },
                { id: 'B', text: "park" },
                { id: 'C', text: "stadium" },
                { id: 'D', text: "field" }
            ],
            correct: 'A',
            vocab: [
                "A. Gym (n): Phòng tập thể hình",
                "B. Park (n): Công viên",
                "C. Stadium (n): Sân vận động",
                "D. Field (n): Cánh đồng/Sân cỏ"
            ],
            trans: "Tôi đến phòng tập để sử dụng máy chạy bộ và nâng tạ.",
            whyCorrect: "Câu có từ khóa 'treadmill' (máy chạy bộ) và 'lift weights' (nâng tạ). Đây là các hoạt động đặc trưng trong phòng gym.",
            whyWrong: "Park (ngoài trời), Stadium (để thi đấu/xem), Field (sân cỏ) thường không có máy chạy bộ hay tạ."
        },
        {
            id: 2,
            text: "Each tennis _______ must wear white clothes at Wimbledon.",
            options: [
                { id: 'A', text: "viewer" },
                { id: 'B', text: "student" },
                { id: 'C', text: "player" },
                { id: 'D', text: "visitor" }
            ],
            correct: 'C',
            vocab: [
                "A. Viewer (n): Khán giả (xem TV)",
                "B. Student (n): Học sinh",
                "C. Player (n): Người chơi/Vận động viên",
                "D. Visitor (n): Khách tham quan"
            ],
            trans: "Mỗi vận động viên quần vợt phải mặc đồ trắng tại giải Wimbledon.",
            whyCorrect: "Người trực tiếp tham gia thi đấu thể thao gọi là 'player'. Wimbledon có quy định người chơi phải mặc đồ trắng.",
            whyWrong: "Viewer/Visitor là người xem, không phải người thi đấu."
        },
        {
            id: 3,
            text: "We store all the sports _______ in the PE room - balls, rackets, and nets.",
            options: [
                { id: 'A', text: "uniforms" },
                { id: 'B', text: "equipment" },
                { id: 'C', text: "trophies" },
                { id: 'D', text: "medals" }
            ],
            correct: 'B',
            vocab: [
                "A. Uniforms (n): Đồng phục",
                "B. Equipment (n): Dụng cụ/Thiết bị",
                "C. Trophies (n): Cúp",
                "D. Medals (n): Huy chương"
            ],
            trans: "Chúng tôi cất giữ tất cả dụng cụ thể thao trong phòng thể dục - bóng, vợt và lưới.",
            whyCorrect: "Các vật được liệt kê: balls (bóng), rackets (vợt), nets (lưới) đều là dụng cụ thể thao (equipment).",
            whyWrong: "Uniforms là quần áo. Trophies/Medals là giải thưởng."
        },
        {
            id: 4,
            text: "The football _______ between Real Madrid and Barcelona is tonight.",
            options: [
                { id: 'A', text: "lesson" },
                { id: 'B', text: "practice" },
                { id: 'C', text: "training" },
                { id: 'D', text: "match" }
            ],
            correct: 'D',
            vocab: [
                "A. Lesson (n): Bài học",
                "B. Practice (n): Buổi luyện tập",
                "C. Training (n): Sự huấn luyện",
                "D. Match (n): Trận đấu"
            ],
            trans: "Trận đấu bóng đá giữa Real Madrid và Barcelona diễn ra tối nay.",
            whyCorrect: "Hai đội bóng đối đầu nhau (Real vs Barca) để thi đấu, ta dùng từ 'match'.",
            whyWrong: "Lesson/Practice/Training mang tính chất học tập hoặc rèn luyện nội bộ."
        },
        {
            id: 5,
            text: "Children must learn to _______ before they can join the water polo team.",
            options: [
                { id: 'A', text: "run" },
                { id: 'B', text: "jump" },
                { id: 'C', text: "climb" },
                { id: 'D', text: "swim" }
            ],
            correct: 'D',
            vocab: [
                "A. Run (v): Chạy",
                "B. Jump (v): Nhảy",
                "C. Climb (v): Leo trèo",
                "D. Swim (v): Bơi"
            ],
            trans: "Trẻ em phải học bơi trước khi có thể tham gia đội bóng ném dưới nước.",
            whyCorrect: "Water polo (bóng ném dưới nước) yêu cầu kỹ năng bơi lội (swim).",
            whyWrong: "Run/Jump/Climb là hoạt động trên cạn."
        },
        {
            id: 6,
            text: "In _______, you hit a shuttlecock over a high net.",
            options: [
                { id: 'A', text: "badminton" },
                { id: 'B', text: "tennis" },
                { id: 'C', text: "golf" },
                { id: 'D', text: "baseball" }
            ],
            correct: 'A',
            vocab: [
                "A. Badminton: Cầu lông",
                "B. Tennis: Quần vợt",
                "C. Golf: Gôn",
                "D. Baseball: Bóng chày"
            ],
            trans: "Trong môn cầu lông, bạn đánh quả cầu qua một tấm lưới cao.",
            whyCorrect: "Từ khóa 'shuttlecock' nghĩa là quả cầu lông -> Chỉ có môn Badminton dùng cầu.",
            whyWrong: "Tennis dùng bóng nỉ. Golf dùng bóng nhỏ cứng. Baseball dùng bóng chày."
        },
        {
            id: 7,
            text: "I _______ play tennis - about five times every week.",
            options: [
                { id: 'A', text: "never" },
                { id: 'B', text: "often" },
                { id: 'C', text: "seldom" },
                { id: 'D', text: "rarely" }
            ],
            correct: 'B',
            vocab: [
                "A. Never: Không bao giờ",
                "B. Often: Thường xuyên",
                "C. Seldom: Hiếm khi",
                "D. Rarely: Hiếm khi"
            ],
            trans: "Tôi thường chơi tennis - khoảng 5 lần mỗi tuần.",
            whyCorrect: "Tần suất 'five times every week' (5 lần/tuần) là rất nhiều -> Chọn 'often'.",
            whyWrong: "Never, Seldom, Rarely đều chỉ tần suất thấp hoặc không có."
        },
        {
            id: 8,
            text: "The striker kicked the ball into the net and scored a _______.",
            options: [
                { id: 'A', text: "point" },
                { id: 'B', text: "number" },
                { id: 'C', text: "goal" },
                { id: 'D', text: "mark" }
            ],
            correct: 'C',
            vocab: [
                "A. Point: Điểm",
                "B. Number: Con số",
                "C. Goal: Bàn thắng",
                "D. Mark: Điểm số/Dấu vết"
            ],
            trans: "Tiền đạo đá bóng vào lưới và ghi một bàn thắng.",
            whyCorrect: "Trong bóng đá, khi bóng vào lưới (net) thì gọi là ghi bàn (scored a goal).",
            whyWrong: "Point dùng cho tennis/bóng rổ. Mark dùng cho điểm bài thi."
        },
        {
            id: 9,
            text: "After the marathon, I was completely _______ and couldn't walk.",
            options: [
                { id: 'A', text: "hungry" },
                { id: 'B', text: "thirsty" },
                { id: 'C', text: "exhausted" },
                { id: 'D', text: "angry" }
            ],
            correct: 'C',
            vocab: [
                "A. Hungry: Đói",
                "B. Thirsty: Khát",
                "C. Exhausted: Kiệt sức",
                "D. Angry: Tức giận"
            ],
            trans: "Sau cuộc chạy marathon, tôi hoàn toàn kiệt sức và không thể đi bộ nổi.",
            whyCorrect: "Marathon rất dài, kết quả 'couldn't walk' (không đi nổi) biểu thị sự kiệt sức (exhausted).",
            whyWrong: "Đói/Khát/Giận không trực tiếp khiến người ta không đi nổi."
        },
        {
            id: 10,
            text: "Basketball is a team _______ played with five players on each side.",
            options: [
                { id: 'A', text: "hobby" },
                { id: 'B', text: "sport" },
                { id: 'C', text: "subject" },
                { id: 'D', text: "lesson" }
            ],
            correct: 'B',
            vocab: [
                "A. Hobby: Sở thích",
                "B. Sport: Môn thể thao",
                "C. Subject: Môn học",
                "D. Lesson: Bài học"
            ],
            trans: "Bóng rổ là một môn thể thao đồng đội chơi với 5 người mỗi bên.",
            whyCorrect: "Basketball là định nghĩa của một môn thể thao (sport).",
            whyWrong: "Subject là môn học ở trường (Toán, Lý...). Hobby là sở thích chung chung."
        },
        {
            id: 11,
            text: "I ride my _______ because it has two wheels and pedals.",
            options: [
                { id: 'A', text: "car" },
                { id: 'B', text: "bicycle" },
                { id: 'C', text: "boat" },
                { id: 'D', text: "plane" }
            ],
            correct: 'B',
            vocab: [
                "A. Car: Ô tô",
                "B. Bicycle: Xe đạp",
                "C. Boat: Thuyền",

    // LOGIC RENDER & CHECK
    const quizContainer = document.getElementById('quiz-container');
    const scoreEl = document.getElementById('score');
    const currentEl = document.getElementById('current');
    
    // Sounds
    const sndCorrect = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3');
    const sndWrong = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3');
    const sndFinish = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3');

    let userScore = 0;
    let answeredCount = 0;

    function renderQuiz() {
        quizContainer.innerHTML = '';
        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Render Special CSS Drawings for Q29 & Q30
            let questionContent = '';
            if (q.isVisual && q.visualType === 'restaurant') {
                questionContent = `
                    <div class="restaurant-sign">
                        <h3>🍕 PIZZA HUT 🍕</h3>
                        <p>${q.text.replace('_______', '<span class="blank-space"></span>')}</p>
                    </div>
                `;
            } else if (q.isVisual && q.visualType === 'phone') {
                questionContent = `
                    <div class="health-app">
                        <div class="health-icon">❤️</div>
                        <div class="health-msg">
                            <b>Daily Reminder:</b><br>
                            ${q.text.replace('_______', '<u>.......</u>')}
                        </div>
                    </div>
                `;
            } else {
                questionContent = `<div class="question-text">${q.text}</div>`;
            }

            card.innerHTML = `
                <div class="q-number">Câu ${index + 1}</div>
                ${questionContent}
                <div class="options-grid" id="opt-grid-${q.id}">
                    ${q.options.map(opt => `
                        <div class="btn-option" onclick="checkAnswer(${q.id}, '${opt.id}', this)">
                            <div class="opt-label">${opt.id}</div>
                            ${opt.text}
                        </div>
                    `).join('')}
                </div>
                <div class="explanation" id="exp-${q.id}">
                    <div class="exp-section">
                        <div class="exp-label">Dịch nghĩa:</div>
                        <div class="exp-text">${q.trans}</div>
                    </div>
                    <div class="exp-section">
                        <div class="exp-label">Phân tích từ vựng:</div>
                        <div class="exp-text">
                            ${q.vocab.map(v => `<span class="vocab-item"><span class="vocab-word">${v.split(':')[0]}</span>: ${v.split(':')[1]}</span>`).join('')}
                        </div>
                    </div>
                    <div class="exp-section">
                        <div class="exp-label">Tại sao đúng?</div>
                        <div class="exp-text" style="color:var(--correct); font-weight:bold;">${q.whyCorrect}</div>
                    </div>
                    <div class="exp-section">
                        <div class="exp-label">Tại sao sai?</div>
                        <div class="exp-text" style="color:var(--wrong);">${q.whyWrong}</div>
                    </div>
                </div>
            `;
            quizContainer.appendChild(card);
        });
    }

    function checkAnswer(qId, userChoice, btnElement) {
        // Prevent re-answering
        if (btnElement.parentElement.classList.contains('answered')) return;
        
        const qData = questions.find(q => q.id === qId);
        const grid = document.getElementById(`opt-grid-${qId}`);
        const exp = document.getElementById(`exp-${qId}`);
        
        grid.classList.add('answered');
        answeredCount++;
        currentEl.innerText = answeredCount;

        if (userChoice === qData.correct) {
            // Correct
            userScore++;
            scoreEl.innerText = userScore;
            btnElement.classList.add('correct');
            sndCorrect.currentTime = 0;
            sndCorrect.play();
            confetti({
                particleCount: 50,
                spread: 70,
                origin: { y: 0.6 }
            });
        } else {
            // Wrong
            btnElement.classList.add('wrong');
            sndWrong.currentTime = 0;
            sndWrong.play();
            // Highlight correct answer
            const correctBtn = Array.from(grid.children).find(child => child.innerText.includes(qData.correct));
            if (correctBtn) correctBtn.classList.add('correct');
        }

        // Show Explanation
        exp.classList.add('show');
    }

    function finishTest() {
        sndFinish.play();
        const percent = Math.round((userScore / 30) * 100);
        let msg = "";
        if(percent === 100) msg = "Xuất sắc! Cô MS Chí Nên rất tự hào về em! 🌟";
        else if(percent >= 80) msg = "Làm tốt lắm! Em sắp trở thành kiện tướng tiếng Anh rồi! 💪";
        else msg = "Cố gắng lên nhé! Hãy xem kỹ phần giải thích để tiến bộ hơn! 📚";

        alert(`KẾT QUẢ CỦA BẠN:\n\nĐúng: ${userScore}/30 câu\n${msg}`);
        window.scrollTo({top: 0, behavior: 'smooth'});
        
        // Massive Confetti
        var duration = 3 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

        function randomInRange(min, max) { return Math.random() * (max - min) + min; }

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) { return clearInterval(interval); }
            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    // Initialize
    renderQuiz();

</script>

</body>
