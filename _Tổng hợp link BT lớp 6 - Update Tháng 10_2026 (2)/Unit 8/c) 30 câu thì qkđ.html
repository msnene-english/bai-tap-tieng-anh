    <style>
        :root {
            --primary-color: #8854C0; /* Tím hồng nhạt */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf2ff;
            background-image: var(--bg-pattern);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #eee;
            position: relative;
            z-index: 10;
            max-width: 800px;
            width: 90%;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .teacher-tag {
            background: var(--secondary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        .question-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            border: 3px solid #f0f0f0;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed #eee;
            padding-bottom: 15px;
        }

        .q-number {
            font-weight: 800;
            color: var(--primary-color);
            font-size: 1.2rem;
            background: #f3e5f5;
            padding: 8px 15px;
            border-radius: 12px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3436;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 0 #e0e0e0;
            text-align: left;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--secondary-color);
            color: var(--secondary-color);
            box-shadow: 0 7px 0 #e0e0e0;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 #e0e0e0;
        }

        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 5px 0 #00b85c;
            animation: pulse 0.5s;
        }

        .option-btn.incorrect {
            background-color: var(--wrong-color);
            color: white;
            border-color: #d63031;
            box-shadow: 0 5px 0 #d63031;
            animation: shake 0.5s;
        }

        .explanation-box {
            margin-top: 25px;
            background: #f0fff4;
            border: 2px solid var(--correct-color);
            border-radius: 15px;
            padding: 20px;
            display: none;
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.show {
            display: block;
        }

        .exp-header {
            font-weight: 800;
            color: var(--correct-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-content p {
            margin: 8px 0;
            line-height: 1.5;
        }

        .exp-label {
            font-weight: 700;
            color: #444;
            background: rgba(255, 255, 255, 0.6);
            padding: 2px 8px;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .vocab-highlight {
            color: #e67e22;
            font-weight: bold;
        }

        .controls {
            margin-top: 40px;
            text-align: center;
            padding-bottom: 50px;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #6c429c;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            background: #9b59b6;
        }

        .submit-btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #6c429c;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 5px solid var(--secondary-color);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary-color);
            margin: 20px 0;
        }

        /* Canvas for Confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

    </style>

        const soundCorrect = new Audio("data:audio/wav;base64,UklGRl9vT1ZBWl3..."); // Placeholder, using simplified chime below
        // Since base64 strings are long, I will use a simple synth function for sounds to keep the file clean and working offline without external assets.
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Happy Chime: High pitch ascending
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Sad Buzz: Low pitch descending saw
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        let score = 0;
        const quizArea = document.getElementById('quiz-area');

        // --- RENDER QUIZ ---
        function renderQuiz() {
            quizArea.innerHTML = '';
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${index}`;

                // Header
                const header = document.createElement('div');
                header.className = 'question-header';
                header.innerHTML = `
                    <span class="q-number">Câu ${q.questionNumber}</span>
                    <i class="fas fa-star" style="color: #f1c40f;"></i>
                `;

                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.textContent = q.question;

                // Options Grid
                const grid = document.createElement('div');
                grid.className = 'options-grid';

                q.answerOptions.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span style="font-weight:800; color:var(--primary-color)">${String.fromCharCode(65+i)}.</span> ${opt.text}`;
                    btn.onclick = () => checkAnswer(index, i, btn, opt.isCorrect, q);
                    grid.appendChild(btn);
                });

                // Explanation Box (Hidden initially)
                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp-${index}`;
                
                // Build Detailed Explanation Content
                let expHTML = `
                    <div class="exp-header">
                        <i class="fas fa-chalkboard-teacher"></i> Ms. Chí Nên giải thích chi tiết:
                    </div>
                    <div class="exp-content">
                        <p><span class="exp-label">Dịch câu hỏi:</span> <em>"${q.translation}"</em></p>
                        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 10px 0;">
                        <p><span class="exp-label">Phân tích đáp án:</span></p>
                        <ul style="list-style: none; padding-left: 5px;">
                `;

                q.answerOptions.forEach((opt, i) => {
                    const icon = opt.isCorrect ? '<i class="fas fa-check-circle" style="color:var(--correct-color)"></i>' : '<i class="fas fa-times-circle" style="color:var(--wrong-color)"></i>';
                    const colorStyle = opt.isCorrect ? 'color: var(--correct-color); font-weight:bold;' : 'color: #555;';
                    expHTML += `<li style="margin-bottom: 5px; ${colorStyle}">${String.fromCharCode(65+i)}. ${opt.text} — ${opt.rationale} ${icon}</li>`;
                });

                expHTML += `</ul></div>`;
                expBox.innerHTML = expHTML;

                // Append all
                card.appendChild(header);
                card.appendChild(qText);
                card.appendChild(grid);
                card.appendChild(expBox);
                quizArea.appendChild(card);
            });
        }

        // --- CHECK ANSWER ---
        function checkAnswer(qIndex, optIndex, btnElement, isCorrect, questionData) {
            // Disable all buttons in this card
            const card = document.getElementById(`question-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            
            if (btnElement.disabled) return; // Prevent double clicks

            buttons.forEach(btn => btn.disabled = true);

            // Show explanation
            const expBox = document.getElementById(`exp-${qIndex}`);
            expBox.classList.add('show');

            if (isCorrect) {
                btnElement.classList.add('correct');
                playSound('correct');
                score++;
                triggerConfetti(btnElement);
            } else {
                btnElement.classList.add('incorrect');
                playSound('wrong');
                // Highlight the correct answer automatically
                questionData.answerOptions.forEach((opt, i) => {
                    if (opt.isCorrect) {
                        buttons[i].classList.add('correct');
                    }
                });
            }
        }

        // --- FINISH QUIZ ---
        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const scoreText = document.getElementById('final-score');
            const comment = document.getElementById('teacher-comment');

            scoreText.textContent = `${score}/${questions.length}`;
            
            if (score === questions.length) {
                comment.textContent = "Tuyệt vời! Em là thiên tài ngữ pháp! 🌟🏆";
                startFullConfetti();
            } else if (score >= 20) {
                comment.textContent = "Làm tốt lắm! Chỉ cần cẩn thận hơn một chút nữa thôi! 💪";
            } else {
                comment.textContent = "Cố gắng lên nhé! Hãy xem lại phần giải thích để hiểu rõ hơn nha! 📚";
            }

            modal.style.display = 'flex';
        }

        // --- CONFETTI EFFECT (Mini canvas interaction) ---
        function triggerConfetti(element) {
            const rect = element.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            
            // Simple localized burst logic could go here, 
            // but for simplicity, we rely on the full screen confetti for the grand finale 
            // and a simple CSS pulse for individual correct answers.
        }

        // Full Screen Confetti Logic
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let confetti = [];

        function startFullConfetti() {
            for (let i = 0; i < 100; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 5 + 2,
                    angle: Math.random() * 6.28
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confetti.forEach((p, i) => {
                p.y += p.speed;
                p.x += Math.sin(p.angle) * 2;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                
                if (p.y > canvas.height) confetti[i].y = -10;
            });
            requestAnimationFrame(animateConfetti);
        }

        // Init
        renderQuiz();

    </script>
