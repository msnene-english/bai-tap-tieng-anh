    <style>

        :root {

            --primary: #8854C0;       /* Tím Pastel */

            --primary-dark: #6c4298;

            --secondary: #00C9A7;     /* Xanh ngọc */

            --secondary-dark: #009e82;

            --correct: #00D26A;       /* Xanh lá - Đúng */

            --correct-dark: #00a352;

            --wrong: #FF4757;         /* Đỏ cam - Sai */

            --wrong-dark: #cc3744;

            --bg-pattern: #f0f3f9;

            --text-dark: #2f3542;

            --card-bg: #ffffff;

        }



        * {

            box-sizing: border-box;

            font-family: 'Nunito', sans-serif;

        }



        body {

            background-color: var(--bg-pattern);

            background-image: radial-gradient(#d1d8e0 2px, transparent 2px);

            background-size: 20px 20px;

            margin: 0;

            padding: 20px;

            color: var(--text-dark);

        }



        .container {

            max-width: 800px;

            margin: 0 auto;

        }



        /* HEADER */

        header {

            text-align: center;

            margin-bottom: 30px;

            background: linear-gradient(135deg, var(--primary), #a29bfe);

            padding: 20px;

            border-radius: 20px;

            box-shadow: 0 8px 16px rgba(136, 84, 192, 0.2);

            color: white;

            border: 4px solid white;

        }



        h1 {

            margin: 0;

            font-weight: 800;

            font-size: 2rem;

            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);

        }



        .subtitle {

            font-size: 1.1rem;

            opacity: 0.9;

            margin-top: 5px;

        }



        /* PROGRESS BAR */

        .progress-container {

            background: #e0e0e0;

            border-radius: 30px;

            height: 20px;

            width: 100%;

            margin-bottom: 30px;

            border: 2px solid white;

            box-shadow: 0 4px 0 rgba(0,0,0,0.1);

            overflow: hidden;

        }



        .progress-bar {

            background: var(--secondary);

            height: 100%;

            width: 0%;

            border-radius: 30px;

            transition: width 0.5s cubic-bezier(0.4, 1.8, 0.4, 0.9);

        }



        /* QUESTION CARD */

        .quiz-card {

            background: var(--card-bg);

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow: 0 10px 0 #dfe4ea, 0 10px 20px rgba(0,0,0,0.1);

            position: relative;

            border: 2px solid #f1f2f6;

            transition: transform 0.3s ease;

        }



        .question-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

        }



        .question-number {

            background: var(--primary);

            color: white;

            padding: 5px 15px;

            border-radius: 15px;

            font-weight: 700;

            font-size: 0.9rem;

        }



        .question-text {

            font-size: 1.3rem;

            font-weight: 700;

            margin-bottom: 20px;

            line-height: 1.5;

            color: var(--text-dark);

        }



        /* OPTIONS GRID */

        .options-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

        }



        @media (max-width: 600px) {

            .options-grid {

                grid-template-columns: 1fr;

            }

        }



        .option-btn {

            background: white;

            border: 2px solid #dfe4ea;

            border-bottom: 6px solid #dfe4ea; /* 3D effect base */

            border-radius: 15px;

            padding: 15px 20px;

            font-size: 1.1rem;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.1s;

            text-align: left;

            position: relative;

            color: var(--text-dark);

        }



        .option-btn:hover:not(:disabled) {

            transform: translateY(-2px);

            border-color: var(--primary);

            border-bottom-color: var(--primary);

            color: var(--primary);

        }



        .option-btn:active:not(:disabled) {

            transform: translateY(4px);

            border-bottom-width: 2px;

            box-shadow: none;

        }



        /* CORRECT / WRONG STATES */

        .option-btn.correct {

            background-color: var(--correct);

            border-color: var(--correct-dark);

            border-bottom-color: var(--correct-dark);

            color: white;

            transform: translateY(4px);

            border-bottom-width: 2px;

        }



        .option-btn.wrong {

            background-color: var(--wrong);

            border-color: var(--wrong-dark);

            border-bottom-color: var(--wrong-dark);

            color: white;

            animation: shake 0.5s;

        }



        .option-btn:disabled {

            cursor: default;

            opacity: 0.7;

        }



        /* ANIMATIONS */

        @keyframes shake {

            0% { transform: translateX(0); }

            25% { transform: translateX(-5px) rotate(-2deg); }

            50% { transform: translateX(5px) rotate(2deg); }

            75% { transform: translateX(-5px) rotate(-2deg); }

            100% { transform: translateX(0); }

        }



        /* EXPLANATION BOX */

        .explanation-box {

            margin-top: 20px;

            background: #f1f9fe;

            border-left: 5px solid var(--secondary);

            border-radius: 10px;

            padding: 20px;

            display: none; /* Hidden by default */

            animation: slideDown 0.4s ease-out;

        }



        @keyframes slideDown {

            from { opacity: 0; transform: translateY(-10px); }

            to { opacity: 1; transform: translateY(0); }

        }



        .explanation-header {

            font-weight: 800;

            color: var(--secondary-dark);

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 10px;

            font-size: 1.1rem;

        }



        .explanation-content {

            font-size: 1rem;

            line-height: 1.6;

            white-space: pre-line; /* Preserves line breaks in text */

            color: #4a5568;

        }



        .explanation-content strong {

            color: var(--primary);

        }



        /* SUBMIT BUTTON */

        .submit-section {

            text-align: center;

            margin-top: 40px;

            padding-bottom: 50px;

        }



        .main-btn {

            background-color: var(--primary);

            color: white;

            border: none;

            border-bottom: 6px solid var(--primary-dark);

            padding: 15px 40px;

            font-size: 1.5rem;

            font-weight: 800;

            border-radius: 50px;

            cursor: pointer;

            transition: all 0.2s;

            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.3);

        }



        .main-btn:hover {

            transform: translateY(-2px);

            filter: brightness(1.1);

        }



        .main-btn:active {

            transform: translateY(4px);

            border-bottom-width: 2px;

            box-shadow: none;

        }



        /* SCORE MODAL */

        .modal-overlay {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(0,0,0,0.5);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 1000;

            backdrop-filter: blur(5px);

        }



        .score-modal {

            background: white;

            padding: 40px;

            border-radius: 30px;

            text-align: center;

            max-width: 500px;

            width: 90%;

            box-shadow: 0 20px 50px rgba(0,0,0,0.2);

            border: 5px solid var(--primary);

            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        }



        @keyframes popIn {

            from { opacity: 0; transform: scale(0.5); }

            to { opacity: 1; transform: scale(1); }

        }



        .score-circle {

            width: 150px;

            height: 150px;

            background: var(--secondary);

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            margin: 0 auto 20px;

            color: white;

            font-size: 3rem;

            font-weight: 800;

            border: 5px solid white;

            box-shadow: 0 10px 0 var(--secondary-dark);

        }



        .feedback-text {

            font-size: 1.5rem;

            color: var(--primary);

            font-weight: 700;

            margin-bottom: 20px;

        }



    </style>

</head>

    <script>

        // --- DATA SOURCE (From english_review_part2_30) ---

        const quizData = [

            {

                "id": 21,

                "question": "His new bike is quite small. ______ is bigger.",

                "options": ["Mine", "My", "Her", "Their"],

                "answer": 0, // Index of "Mine"

                "rationale": "1. Phân tích từ vựng:\nA. My (tính từ sở hữu): của tôi (cần danh từ đi sau).\nB. Her (tính từ sở hữu): của cô ấy.\nC. Their (tính từ sở hữu): của họ.\nD. Mine (đại từ sở hữu): cái của tôi.\n\n2. Dịch nghĩa toàn câu: \"Xe đạp mới của anh ấy khá nhỏ. Cái của tôi thì to hơn.\"\n\n3. Tại sao chọn D?\nChỗ trống đóng vai trò chủ ngữ và không có danh từ đi kèm phía sau. Ta cần một Đại từ sở hữu để thay thế cho cụm \"My bike\".\nMine = My bike.\n\n4. Tại sao đáp án khác sai?\nCác đáp án A, B, C đều là Tính từ sở hữu, bắt buộc phải có danh từ đi kèm (Vd: My bike, Her bike)."

            },

            {

                "id": 22,

                "question": "David has got two brothers. They are ______ daughters.",

                "options": ["his", "its", "her", "their"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. his (tính từ sở hữu): của anh ấy.\nB. its (tính từ sở hữu): của nó.\nC. her (tính từ sở hữu): của cô ấy.\nD. their (tính từ sở hữu): của họ.\n\n2. Dịch nghĩa toàn câu: \"David có hai người anh em. Họ là những cô con gái của anh ấy.\"\n(Lưu ý: Ngữ cảnh gia đình David).\n\n3. Tại sao chọn A?\nNgười sở hữu là \"David\" (nam giới số ít) -> Tính từ sở hữu tương ứng là \"his\".\n\n4. Tại sao đáp án khác sai?\n- its: dùng cho vật.\n- her: dùng cho nữ.\n- their: dùng cho số nhiều (của họ)."

            },

            {

                "id": 23,

                "question": "Can you lend me your red pen? I don’t know where ______ is.",

                "options": ["mine", "my", "I", "me"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. mine (đại từ sở hữu): cái của tôi.\nB. my (tính từ sở hữu): của tôi.\nC. I (đại từ nhân xưng): tôi (chủ ngữ).\nD. me (đại từ tân ngữ): tôi (tân ngữ).\n\n2. Dịch nghĩa toàn câu: \"Bạn cho mình mượn bút đỏ được không? Mình không biết cái của mình ở đâu cả.\"\n\n3. Tại sao chọn A?\nCâu cần chủ ngữ cho động từ \"is\", thay thế cho cụm \"my pen\". Mine = My pen.\n\n4. Tại sao đáp án khác sai?\n- my: cần danh từ đi sau.\n- I: không hợp nghĩa (tôi ở đâu).\n- me: sai ngữ pháp chủ ngữ."

            },

            {

                "id": 24,

                "question": "New York City is a big city. ______ buildings are high.",

                "options": ["Its", "It’s", "Their", "Theirs"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. Its (tính từ sở hữu): của nó.\nB. It’s (viết tắt): nó là.\nC. Their (tính từ sở hữu): của họ.\nD. Theirs (đại từ sở hữu): cái của họ.\n\n2. Dịch nghĩa toàn câu: \"Thành phố New York là một thành phố lớn. Các tòa nhà của nó rất cao.\"\n\n3. Tại sao chọn A?\n\"New York City\" là danh từ số ít chỉ vật/địa điểm -> dùng tính từ sở hữu \"Its\".\n\n4. Tại sao đáp án khác sai?\n- It's: là động từ, không chỉ sở hữu.\n- Their: dùng cho số nhiều.\n- Theirs: không đứng trước danh từ."

            },

            {

                "id": 25,

                "question": "This camera belongs to my aunt. This camera is ______.",

                "options": ["hers", "mine", "his", "ours"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. hers (đại từ sở hữu): cái của cô ấy.\nB. mine (đại từ sở hữu): cái của tôi.\nC. his (đại từ sở hữu): cái của anh ấy.\nD. ours (đại từ sở hữu): cái của chúng tôi.\n\n2. Dịch nghĩa toàn câu: \"Cái máy ảnh này thuộc về dì tôi. Cái máy ảnh này là của cô ấy.\"\n\n3. Tại sao chọn A?\n\"My aunt\" là nữ giới -> Đại từ sở hữu tương ứng là \"hers\".\n\n4. Tại sao đáp án khác sai?\nSai người sở hữu (tôi, anh ấy, chúng tôi)."

            },

            {

                "id": 26,

                "question": "Hanoi’s streets are too ______ at rush hour.",

                "options": ["crowded", "interested", "exciting", "friendly"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. crowded (adj): đông đúc.\nB. interested (adj): quan tâm.\nC. exciting (adj): thú vị.\nD. friendly (adj): thân thiện.\n\n2. Dịch nghĩa toàn câu: \"Đường phố Hà Nội quá đông đúc vào giờ cao điểm.\"\n\n3. Tại sao chọn A?\n\"Rush hour\" (giờ cao điểm) đặc trưng bởi sự đông đúc -> \"crowded\".\n\n4. Tại sao đáp án khác sai?\nCác tính từ khác không mô tả đúng trạng thái giao thông giờ cao điểm."

            },

            {

                "id": 27,

                "question": "People celebrate it ______ an Easter breakfast or meal.",

                "options": ["with", "by", "for", "in"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. with (prep): với.\nB. by (prep): bằng cách.\nC. for (prep): cho.\nD. in (prep): trong.\n\n2. Dịch nghĩa toàn câu: \"Mọi người ăn mừng dịp đó với một bữa ăn sáng hoặc bữa tiệc Phục sinh.\"\n\n3. Tại sao chọn A?\nCấu trúc \"Celebrate [something] with [something]\" (Ăn mừng cái gì bằng/với cái gì).\n\n4. Tại sao đáp án khác sai?\n- by: thường đi với V-ing.\n- for, in: không đúng collocations."

            },

            {

                "id": 28,

                "question": "They decorate their house ______ beautiful Christmas trees.",

                "options": ["with", "by", "on", "of"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. with (prep): với/bằng.\nB. by (prep): bởi.\nC. on (prep): trên.\nD. of (prep): của.\n\n2. Dịch nghĩa toàn câu: \"Họ trang trí nhà của họ bằng những cây thông Noel xinh đẹp.\"\n\n3. Tại sao chọn A?\nCấu trúc: \"Decorate [something] with [something]\" (Trang trí cái gì bằng cái gì).\n\n4. Tại sao đáp án khác sai?\nSai giới từ đi kèm với động từ decorate."

            },

            {

                "id": 29,

                "question": "There are a lot of ______ in Thailand.",

                "options": ["floating markets", "Shop", "restaurant", "street food"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. floating markets (n): chợ nổi (số nhiều).\nB. Shop (n): cửa hàng (số ít).\nC. restaurant (n): nhà hàng (số ít).\nD. street food (n): ẩm thực đường phố (không đếm được).\n\n2. Dịch nghĩa toàn câu: \"Có rất nhiều chợ nổi ở Thái Lan.\"\n\n3. Tại sao chọn A?\nCấu trúc \"There are a lot of...\" yêu cầu danh từ đếm được SỐ NHIỀU. Chỉ có \"floating markets\" thỏa mãn.\n\n4. Tại sao đáp án khác sai?\n- Shop, restaurant: đang ở dạng số ít.\n- street food: không đếm được, phải dùng 'There is'."

            },

            {

                "id": 30,

                "question": "The Eiffel Tower is a famous ______ of Paris.",

                "options": ["landmark", "Square", "cathedral", "principal"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. landmark (n): địa danh/thắng cảnh.\nB. Square (n): quảng trường.\nC. cathedral (n): nhà thờ lớn.\nD. principal (n): hiệu trưởng.\n\n2. Dịch nghĩa toàn câu: \"Tháp Eiffel là một địa danh nổi tiếng của Paris.\"\n\n3. Tại sao chọn A?\nTháp Eiffel là biểu tượng du lịch -> landmark.\n\n4. Tại sao đáp án khác sai?\nEiffel không phải là quảng trường hay nhà thờ."

            },

            {

                "id": 31,

                "question": "VI.1. Lagos is a lovely city. ______ avenue is great for walking.",

                "options": ["Its", "My", "Their", "Our"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. Its: của nó.\nB. My: của tôi.\nC. Their: của họ.\nD. Our: của chúng tôi.\n\n2. Dịch nghĩa: \"Lagos là một thành phố đáng yêu. Đại lộ của nó rất tuyệt để đi dạo.\"\n\n3. Tại sao chọn A?\nLagos là tên thành phố (số ít, vật) -> dùng \"Its\".\n\n4. Tại sao đáp án khác sai?\nKhông phù hợp chủ ngữ Lagos."

            },

            {

                "id": 32,

                "question": "VI.2. They don’t like fish. ______ favourite food is steak.",

                "options": ["Their", "His", "Her", "Your"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. Their: của họ.\nB. His: của anh ấy.\nC. Her: của cô ấy.\nD. Your: của bạn.\n\n2. Dịch nghĩa: \"Họ không thích cá. Món ăn yêu thích của họ là bít tết.\"\n\n3. Tại sao chọn A?\nChủ ngữ là \"They\" -> Tính từ sở hữu là \"Their\"."

            },

            {

                "id": 33,

                "question": "VI.3. Susan has got a new car. ______ car is very nice.",

                "options": ["Her", "His", "Its", "My"],

                "answer": 0,

                "rationale": "1. Phân tích từ vựng:\nA. Her: của cô ấy.\nB. His: của anh ấy.\nC. Its: của nó.\nD. My: của tôi.\n\n2. Dịch nghĩa: \"Susan có một chiếc xe hơi mới. Xe của cô ấy rất đẹp.\"\n\n3. Tại sao chọn A?\nSusan là nữ -> Dùng \"Her\"."

            },

            {

                "id": 34,

                "question": "VI.4. I have got a car. ______ name is Miko.",

        let score = 0;

        let answeredCount = 0;

        const totalQuestions = quizData.length;



        // --- RENDER QUIZ ---

        function renderQuiz() {

            const container = document.getElementById('quiz-container');

            

            quizData.forEach((item, index) => {

                const card = document.createElement('div');

                card.className = 'quiz-card';

                card.id = `question-${index}`;



                // Question Header & Text

                let html = `

                    <div class="question-header">

                        <span class="question-number">Question ${item.id}</span>

                        <i class="fa-solid fa-star" style="color: #f1c40f;"></i>

                    </div>

                    <div class="question-text">${item.question}</div>

                    <div class="options-grid">

                `;



                // Options Buttons

                item.options.forEach((opt, optIndex) => {

                    html += `<button class="option-btn" onclick="checkAnswer(${index}, ${optIndex}, this)">${opt}</button>`;

                });



                html += `</div>`;



                // Explanation Box (Hidden initially)

                html += `

                    <div class="explanation-box" id="explanation-${index}">

                        <div class="explanation-header">

                            <i class="fa-solid fa-chalkboard-user"></i> Ms. Chí Nên giải thích:

                        </div>

                        <div class="explanation-content">${item.rationale}</div>

                    </div>

                `;



                card.innerHTML = html;

                container.appendChild(card);

            });

        }



        // --- CHECK ANSWER LOGIC ---

        function checkAnswer(qIndex, selectedOptIndex, btnElement) {

            const qData = quizData[qIndex];

            const explanationBox = document.getElementById(`explanation-${qIndex}`);

            const allBtns = btnElement.parentElement.querySelectorAll('.option-btn');



            // Disable all buttons for this question

            allBtns.forEach(btn => btn.disabled = true);



            // Increment answered count

            answeredCount++;

            updateProgress();



            if (selectedOptIndex === qData.answer) {

                // CORRECT

                score++;

                btnElement.classList.add('correct');

                playSound('correct');

                triggerConfetti();

                

                // Add icon

                btnElement.innerHTML += ` <i class="fa-solid fa-check-circle" style="float:right;"></i>`;

            } else {

                // WRONG

                btnElement.classList.add('wrong');

                playSound('wrong');

                

                // Add icon to wrong

                btnElement.innerHTML += ` <i class="fa-solid fa-times-circle" style="float:right;"></i>`;



                // Highlight correct answer

                allBtns[qData.answer].classList.add('correct');

                allBtns[qData.answer].innerHTML += ` <i class="fa-solid fa-check-circle" style="float:right;"></i>`;

            }



            // SHOW EXPLANATION IMMEDIATELY

            explanationBox.style.display = 'block';

        }



        // --- UTILS ---

        function updateProgress() {

            const percent = (answeredCount / totalQuestions) * 100;

            document.getElementById('progressBar').style.width = `${percent}%`;

        }



        function playSound(type) {

            const sound = document.getElementById(`sound-${type}`);

            if (sound) {

                sound.currentTime = 0;

                sound.play().catch(e => console.log("Audio play blocked by browser policy"));

            }

        }



        function triggerConfetti() {

            confetti({

                particleCount: 100,

                spread: 70,

                origin: { y: 0.6 },

                colors: ['#8854C0', '#00C9A7', '#f1c40f']

            });

        }



        // --- SUBMIT & SCORE ---

        function finishQuiz() {

            const modal = document.getElementById('scoreModal');

            const scoreText = document.getElementById('finalScore');

            const feedbackText = document.getElementById('feedbackText');

            const feedbackSub = document.getElementById('feedbackSubtext');



            scoreText.textContent = `${score}/${totalQuestions}`;



            const percentage = (score / totalQuestions) * 100;

            if (percentage === 100) {

                feedbackText.textContent = "Xuất sắc! 🏆";

                feedbackSub.textContent = "Bạn đã nắm vững toàn bộ kiến thức!";

                triggerConfetti();

            } else if (percentage >= 80) {

                feedbackText.textContent = "Làm tốt lắm! 🌟";

                feedbackSub.textContent = "Bạn rất chăm chỉ, cố gắng thêm chút nữa nhé.";

            } else if (percentage >= 50) {

                feedbackText.textContent = "Cố lên nhé! 💪";

                feedbackSub.textContent = "Hãy xem kỹ lại phần giải thích để hiểu bài hơn.";

            } else {

                feedbackText.textContent = "Cần luyện tập thêm 📚";

                feedbackSub.textContent = "Đừng nản lòng, hãy ôn lại kiến thức nhé!";

            }



            modal.style.display = 'flex';

        }



        function closeModal() {

            document.getElementById('scoreModal').style.display = 'none';

        }



        // Initialize

        window.onload = renderQuiz;



    </script>
