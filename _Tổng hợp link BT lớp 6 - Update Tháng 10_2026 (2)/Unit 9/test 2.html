<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. MS Chí Nên - English Test Unit 9</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-pink: #8854C0;
            --primary-teal: #00C9A7;
            --correct: #00D26A;
            --wrong: #FF4757;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#8854c0 0.5px, transparent 0.5px), radial-gradient(#8854c0 0.5px, #f0f4f8 0.5px);
            background-size: 20px 20px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 0 rgba(136, 84, 192, 0.2);
            border: 3px solid var(--primary-pink);
        }

        h1 {
            color: var(--primary-pink);
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #636e72;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* QUESTION CARD */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 #dfe6e9;
            border: 2px solid #f1f2f6;
            position: relative;
            transition: transform 0.3s;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3436;
        }

        .question-text u {
            text-decoration: underline;
            text-decoration-thickness: 3px;
            text-decoration-color: var(--primary-pink);
            text-underline-offset: 3px;
        }

        /* OPTIONS */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 3px solid #dfe6e9;
            border-radius: 15px;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #dfe6e9;
            position: relative;
        }

        .option-btn:hover {
            transform: scale(1.02);
            border-color: var(--primary-teal);
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #dfe6e9;
        }

        .option-btn.correct {
            background-color: #d1fae5;
            border-color: var(--correct);
            box-shadow: 0 5px 0 #059669;
            color: #065f46;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--wrong);
            box-shadow: 0 5px 0 #b91c1c;
            color: #991b1b;
            animation: shake 0.5s;
        }

        /* EXPLANATION BOX */
        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            border-radius: 10px;
            display: none; /* Hidden by default */
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .explanation.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .teacher-tag {
            font-weight: 800;
            color: var(--primary-pink);
            margin-bottom: 10px;
            display: block;
        }

        .expl-step {
            margin-bottom: 8px;
        }

        /* READING & GAP FILL STYLES */
        .reading-passage {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed var(--primary-teal);
            margin-bottom: 20px;
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .glossary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            font-size: 0.9rem;
        }

        .glossary-table th {
            background: var(--primary-pink);
            color: white;
            padding: 10px;
            text-align: left;
        }

        .glossary-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }

        /* GAP FILL SPECIAL LAYOUT (Q37-40) */
        .gap-fill-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .options-box {
            background: #e0f2f1;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--primary-teal);
        }

        /* CUSTOM SIGNS (Q29, Q30) */
        .sign-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .stamp-sold-out {
            border: 5px double #D32F2F;
            color: #D32F2F;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 2rem;
            padding: 10px 20px;
            text-transform: uppercase;
            transform: rotate(-10deg);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: inline-block;
        }

        .sign-no-grass {
            width: 120px;
            height: 120px;
            border: 10px solid #D32F2F;
            border-radius: 50%;
            position: relative;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .sign-no-grass::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 100%;
            background: #D32F2F;
            transform: rotate(-45deg);
        }

        .sign-content {
            font-size: 3.5rem;
            z-index: 1;
        }

        /* FOOTER & BUTTONS */
        .submit-btn {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #5f27cd;
            display: block;
            margin: 40px auto;
            transition: transform 0.2s;
        }

        .submit-btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #5f27cd;
        }

        /* ANIMATIONS */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CONFETTI CANVAS */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            animation: slideDown 0.5s;
            max-width: 400px;
            width: 90%;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-pink);
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <header>
            <h1>UNIT 9 – CITIES OF THE WORLD</h1>
            <div class="subtitle">Test 02 | Teacher: Ms. MS Chí Nên</div>
        </header>

        <div id="quiz-container">
            </div>

        <button class="submit-btn" onclick="finishQuiz()">NỘP BÀI (SUBMIT)</button>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2>Kết Quả</h2>
            <div class="score-display" id="finalScore">0/40</div>
            <p id="feedbackText">Làm tốt lắm!</p>
            <button class="submit-btn" style="margin-top:20px; padding: 10px 30px;" onclick="closeModal()">Xem lại bài</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const quizData = [
            // PHONETICS
            {
                id: 1,
                type: 'mcq',
                question: "Choose the word whose underlined part differs from the other three in pronunciation.",
                text: "A. c<u>oa</u>ch &nbsp;&nbsp; B. s<u>oa</u>r &nbsp;&nbsp; C. s<u>oa</u>p &nbsp;&nbsp; D. l<u>oa</u>d",
                options: ["A", "B", "C", "D"],
                correct: 1, // Index of B
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    1. <b>Phân tích phiên âm:</b><br>
                    - A. Coach /kəʊtʃ/ (Xe khách)<br>
                    - B. Soar /sɔːr/ (Bay vút lên) -> Âm /ɔː/<br>
                    - C. Soap /səʊp/ (Xà phòng)<br>
                    - D. Load /ləʊd/ (Chất tải)<br>
                    2. <b>Kết luận:</b> Chọn đáp án B vì phát âm là /ɔː/, các từ còn lại là /əʊ/.
                `
            },
            {
                id: 2,
                type: 'mcq',
                question: "Choose the word whose underlined part differs from the other three in pronunciation.",
                text: "A. sn<u>ow</u> &nbsp;&nbsp; B. h<u>ow</u> &nbsp;&nbsp; C. all<u>ow</u> &nbsp;&nbsp; D. c<u>ow</u>",
                options: ["A", "B", "C", "D"],
                correct: 0, // A
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    1. <b>Phân tích phiên âm:</b><br>
                    - A. Snow /snəʊ/ (Tuyết) -> Âm /əʊ/<br>
                    - B. How /haʊ/ (Như thế nào)<br>
                    - C. Allow /əˈlaʊ/ (Cho phép)<br>
                    - D. Cow /kaʊ/ (Con bò)<br>
                    2. <b>Kết luận:</b> Chọn đáp án A vì phát âm là /əʊ/, các từ còn lại là /aʊ/.
                `
            },
            // STRESS
            {
                id: 3,
                type: 'mcq',
                question: "Choose the word that differs from the other three in the position of primary stress.",
                text: "A. earthquake &nbsp;&nbsp; B. program &nbsp;&nbsp; C. courage &nbsp;&nbsp; D. prestige",
                options: ["A", "B", "C", "D"],
                correct: 3, // D
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    1. <b>Phân tích trọng âm:</b><br>
                    - A. Earthquake /ˈɜːθ.kweɪk/ (Trọng âm 1)<br>
                    - B. Program /ˈprəʊ.ɡræm/ (Trọng âm 1)<br>
                    - C. Courage /ˈkʌr.ɪdʒ/ (Trọng âm 1)<br>
                    - D. Prestige /presˈtiːʒ/ (Trọng âm 2 - Quy tắc: từ vay mượn tiếng Pháp thường nhấn âm cuối)<br>
                    2. <b>Kết luận:</b> Chọn D.
                `
            },
            {
                id: 4,
                type: 'mcq',
                question: "Choose the word that differs from the other three in the position of primary stress.",
                text: "A. receive &nbsp;&nbsp; B. crowded &nbsp;&nbsp; C. helmet &nbsp;&nbsp; D. helpful",
                options: ["A", "B", "C", "D"],
                correct: 0, // A
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    1. <b>Phân tích trọng âm:</b><br>
                    - A. Receive /rɪˈsiːv/ (Trọng âm 2)<br>
                    - B. Crowded /ˈkraʊ.dɪd/ (Trọng âm 1)<br>
                    - C. Helmet /ˈhel.mət/ (Trọng âm 1)<br>
                    - D. Helpful /ˈhelp.fəl/ (Trọng âm 1)<br>
                    2. <b>Kết luận:</b> Chọn A.
                `
            },
            // GRAMMAR & VOCAB
            {
                id: 5,
                type: 'mcq',
                question: "Question 5: Quoc Tu Giam is regarded as the first national __________ of Viet Nam.",
                text: "A. Capital &nbsp;&nbsp; B. university &nbsp;&nbsp; C. temple &nbsp;&nbsp; D. school",
                options: ["A", "B", "C", "D"],
                correct: 1, // B
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    <b>Dịch câu:</b> Quốc Tử Giám được xem là trường đại học quốc gia đầu tiên của Việt Nam.<br>
                    <b>Phân tích từ vựng:</b><br>
                    - A. Capital: Thủ đô<br>
                    - B. University: Trường đại học (Đúng kiến thức thực tế)<br>
                    - C. Temple: Đền<br>
                    - D. School: Trường học (chung chung)<br>
                    => Chọn <b>B</b> theo danh xưng lịch sử "The first national university".
                `
            },
            {
                id: 6,
                type: 'mcq',
                question: "Question 6: Asia is Earth’s largest and most populous ____________.",
                text: "A. Island &nbsp;&nbsp; B. country &nbsp;&nbsp; C. ocean &nbsp;&nbsp; D. continent",
                options: ["A", "B", "C", "D"],
                correct: 3, // D
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    <b>Dịch câu:</b> Châu Á là _____ lớn nhất và đông dân nhất Trái Đất.<br>
                    <b>Phân tích:</b><br>
                    - A. Island: Đảo<br>
                    - B. Country: Quốc gia<br>
                    - C. Ocean: Đại dương<br>
                    - D. Continent: Châu lục<br>
                    => Châu Á là một châu lục. Chọn <b>D</b>.
                `
            },
            {
                id: 7,
                type: 'mcq',
                question: "Question 7: Young people ______obey their parents.",
                text: "A. Must &nbsp;&nbsp; B. may &nbsp;&nbsp; C. will &nbsp;&nbsp; D. ought to",
                options: ["A", "B", "C", "D"],
                correct: 3, // D
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    <b>Dịch câu:</b> Người trẻ _____ vâng lời cha mẹ.<br>
                    <b>Ngữ pháp (Modal Verbs):</b><br>
                    - A. Must: Phải (Mang tính bắt buộc cưỡng chế)<br>
                    - B. May: Có lẽ<br>
                    - C. Will: Sẽ<br>
                    - D. Ought to (= Should): Nên (Mang tính khuyên răn, bổn phận đạo đức)<br>
                    => Trong bối cảnh này, nói về bổn phận đạo đức dùng <b>ought to</b> là phù hợp nhất. Chọn <b>D</b>.
                `
            },
            {
                id: 8,
                type: 'mcq',
                question: "Question 8: I ______ be delighted to show you round the factory.",
                text: "A. Ought to &nbsp;&nbsp; B. would &nbsp;&nbsp; C. might &nbsp;&nbsp; D. can",
                options: ["A", "B", "C", "D"],
                correct: 1, // B
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    <b>Cấu trúc:</b> "I would be delighted to..." (Tôi rất hân hạnh/vui lòng được...)<br>
                    Đây là câu nói lịch sự khi nhận lời hoặc đề nghị làm gì giúp ai.<br>
                    => Chọn <b>B</b>.
                `
            },
            {
                id: 9,
                type: 'mcq',
                question: "Question 9: Our city is very crowded. How about ______?",
                text: "A. Yours &nbsp;&nbsp; B. you &nbsp;&nbsp; C. your &nbsp;&nbsp; D. me",
                options: ["A", "B", "C", "D"],
                correct: 0, // A
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    <b>Ngữ cảnh:</b> Thành phố của chúng tôi rất đông. Còn [thành phố của bạn] thì sao?<br>
                    <b>Ngữ pháp:</b> Ta cần một Đại từ sở hữu (Possessive Pronoun) để thay thế cho cụm danh từ "your city" đã nhắc đến ngầm ý.<br>
                    - A. Yours = Your city (Đúng)<br>
                    - B. You: Bạn (Sai nghĩa)<br>
                    - C. Your: Tính từ sở hữu (Phải đi kèm danh từ, ví dụ "Your city")<br>
                    => Chọn <b>A</b>.
                `
            },
            {
                id: 10,
                type: 'mcq',
                question: "Question 10: He did not bring his briefcase, but I brought _________.",
                text: "A. My &nbsp;&nbsp; B. mine &nbsp;&nbsp; C. me &nbsp;&nbsp; D. I",
                options: ["A", "B", "C", "D"],
                correct: 1, // B
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    <b>Ngữ cảnh:</b> Anh ấy không mang cặp, nhưng tôi đã mang [cặp của tôi].<br>
                    <b>Ngữ pháp:</b> Tương tự câu trên, cần Đại từ sở hữu thay thế cho "my briefcase".<br>
                    - A. My (+Noun)<br>
                    - B. Mine = My briefcase (Đúng)<br>
                    => Chọn <b>B</b>.
                `
            },
            {
                id: 11,
                type: 'mcq',
                question: "Question 11: _______a lovely garden your cousin has!",
                text: "A. How &nbsp;&nbsp; B. Whose &nbsp;&nbsp; C. Who &nbsp;&nbsp; D. Which",
                options: ["A", "B", "C", "D"],
                correct: 0, // A (Based on prompt structure limitation, usually What)
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    <b>Dịch câu:</b> Em họ bạn có khu vườn đáng yêu làm sao!<br>
                    <b>Ngữ pháp (Câu cảm thán):</b><br>
                    - Cấu trúc chuẩn: <i>What + (a/an) + Adj + N + S + V!</i> (Ví dụ: What a lovely garden your cousin has!)<br>
                    - Tuy nhiên, đề bài không có "What". Trong các đáp án còn lại, "How" là từ để hỏi/cảm thán duy nhất phù hợp về mặt ngữ nghĩa (dù cấu trúc <i>How a lovely garden...</i> là không chuẩn ngữ pháp tiếng Anh hiện đại, thường phải là <i>How lovely a garden...</i>).<br>
                    - Loại B, C, D vì sai hoàn toàn nghĩa.<br>
                    => Trong khuôn khổ bài thi này, chọn <b>A</b>.
                `
            },
            {
                id: 12,
                type: 'mcq',
                question: "Question 12: “What would you like to drink now?” – “ _________.”",
                text: "A. Yes, please &nbsp;&nbsp; B. Apple juice please &nbsp;&nbsp; C. No &nbsp;&nbsp; D. Thank you",
                options: ["A", "B", "C", "D"],
                correct: 1, // B
                explanation: `
                    <span class="teacher-tag">Cô MS Chí Nên giải thích:</span>
                    <b>Dịch câu hỏi:</b> "Bây giờ bạn muốn uống gì?" (Câu hỏi WH-question, không phải Yes/No).<br>
                    <b>Phân tích:</b><br>
                    - A. Vâng, làm ơn (Trả lời cho câu mời)<br>
                    - B. Nước táo, làm ơn (Đưa ra lựa chọn -> Đúng)<br>
                    - C. Không (Trả lời Yes/No)<br>
                    => Chọn <b>B</b>.
                `
            },
            // READING CLOZE (13-16)
            {
                id: 13,
                type: 'reading_group',

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding sound (High pitch sine wave)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                fireConfetti();
            } else {
                // Wrong sound (Low pitch saw wave)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

            `;
        }

        function createReadingGroup(data) {
            let html = `
                <div class="card">
                    <div class="reading-passage">
                        ${data.readingText}
                        ${createGlossary(data.glossary)}
                    </div>
            `;

            data.questions.forEach(q => {
                html += `
                    <div style="margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;" id="card-${q.subId}">
                        <div class="question-text">${q.question}</div>
                        <div style="margin-bottom: 15px;">${q.text}</div>
                        <div class="options-grid">
                            ${q.options.map((opt, index) => `
                                <button class="option-btn" onclick="checkReading(${q.subId}, ${index}, this, ${q.correct}, '${escapeHtml(q.explanation)}')">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                        <div class="explanation" id="expl-${q.subId}"></div>
                    </div>
                `;
            });

            html += `</div>`;
            return html;
        }

        function createGapFillSpecial(data) {
            let html = `
                <div class="card">
                     <div class="question-text">Fill in the blanks (37-40)</div>
                    <div class="gap-fill-container">
                        <div class="options-box">
                            <strong>OPTIONS:</strong><br>
                            ${data.optionsBox.join('<br>')}
                        </div>
                        <div class="reading-passage">
                            ${data.passage}
                            ${createGlossary(data.glossary)}
                        </div>
                        <div class="options-grid" style="grid-template-columns: 1fr;">
            `;
            
            data.questions.forEach(q => {
                html += `
                    <div id="gf-${q.qId}" style="margin-bottom: 10px;">
                        <strong>Question ${q.qId}:</strong>
                        <div style="display:flex; gap:10px; margin-top:5px;">
                            ${['A', 'B', 'C', 'D'].map((opt, idx) => `
                                <button class="option-btn" style="width:50px; text-align:center;" onclick="checkGapFill(${q.qId}, ${idx}, this, ${q.correct}, '${escapeHtml(q.exp)}')">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                        <div class="explanation" id="expl-${q.qId}"></div>
                    </div>
                `;
            });

            html += `</div></div></div>`;
            return html;
        }

        function createGlossary(list) {
            if (!list) return '';
            return `
                <table class="glossary-table">
                    <tr><th>Word</th><th>Type</th><th>Meaning</th></tr>
                    ${list.map(w => `<tr><td><b>${w.w}</b></td><td><i>${w.t}</i></td><td>${w.m}</td></tr>`).join('')}
                </table>
            `;
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        }

        // --- LOGIC ---
        function checkMCQ(id, selectedIdx, btn) {
            const question = quizData.find(q => q.id === id);
            const parent = btn.parentElement;
            const expl = document.getElementById(`expl-${id}`);
            
            // Disable buttons
            Array.from(parent.children).forEach(b => b.disabled = true);

            if (selectedIdx === question.correct) {
                btn.classList.add('correct');
                playSound('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                parent.children[question.correct].classList.add('correct'); // Show correct
                playSound('wrong');
            }
            expl.classList.add('show');
        }

        function checkReading(id, selectedIdx, btn, correctIdx, explText) {
            const parent = btn.parentElement;
            const explDiv = document.getElementById(`expl-${id}`);
            
            Array.from(parent.children).forEach(b => b.disabled = true);

            if (selectedIdx === correctIdx) {
                btn.classList.add('correct');
                playSound('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                parent.children[correctIdx].classList.add('correct');
                playSound('wrong');
            }
            explDiv.innerHTML = `<span class="teacher-tag">Cô MS Chí Nên giải thích:</span>${explText}`;
            explDiv.classList.add('show');
        }

        function checkGapFill(id, selectedIdx, btn, correctIdx, explText) {
            const parent = btn.parentElement;
            const explDiv = document.getElementById(`expl-${id}`);
            
            Array.from(parent.children).forEach(b => b.disabled = true);

            if (selectedIdx === correctIdx) {
                btn.classList.add('correct');
                playSound('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                parent.children[correctIdx].classList.add('correct');
                playSound('wrong');
            }
            explDiv.innerHTML = `<span class="teacher-tag">Cô MS Chí Nên giải thích:</span>${explText}`;
            explDiv.classList.add('show');
        }

        function finishQuiz() {
            document.getElementById('finalScore').innerText = `${score} / ${totalQuestions}`;
            
            let msg = "";
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) msg = "Xuất sắc! Cô MS Chí Nên rất tự hào!";
            else if (percentage >= 80) msg = "Giỏi lắm! Cố thêm chút nữa là hoàn hảo!";
            else if (percentage >= 50) msg = "Khá tốt! Ôn lại bài một chút nhé.";
            else msg = "Cần cố gắng nhiều hơn nhé!";
            
            document.getElementById('feedbackText').innerText = msg;
            document.getElementById('resultModal').style.display = 'flex';
            if (percentage >= 50) fireConfetti();
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        // --- CONFETTI EFFECT ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: `hsl(${Math.random()*360}, 100%, 50%)`,
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 5 + 2
                });
            }

            function animate() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.y += p.speed;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    if(p.y < canvas.height) active = true;
                });
                if(active) requestAnimationFrame(animate);
                else ctx.clearRect(0,0,canvas.width,canvas.height);
            }
            animate();
        }

        // Init
        renderQuiz();

    </script>
</body>
</html>
