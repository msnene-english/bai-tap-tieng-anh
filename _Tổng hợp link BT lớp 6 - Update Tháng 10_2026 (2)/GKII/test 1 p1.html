<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌄 SECOND MIDTERM TEST 1 · P1 — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3B2A56;--deep:#7A2E5D;--coral:#FF7B8A;--peach:#FFA45C;--violet:#8854C0;
  --gold:#FDCB6E;--teal:#00C9A7;--good:#0E9F6E;--bad:#E03131;--glass:rgba(255,255,255,.84)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,#2B2560 0%,#5B3D8C 14%,#8854C0 30%,#FF7B8A 50%,#FFA45C 68%,#FDCB6E 84%,#FFF3D0 100%);
  background-size:100% 220%;background-attachment:fixed;animation:sky 26s ease-in-out infinite alternate}
@keyframes sky{from{background-position:50% 0%}to{background-position:50% 100%}}
/* ── MẶT TRỜI BÌNH MINH ── */
.sun{position:fixed;left:50%;bottom:15vh;transform:translateX(-50%);width:220px;height:220px;border-radius:50%;
  z-index:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#FFF9E0 8%,#FFE083 34%,#FFB25C 62%,rgba(255,150,90,0) 74%);
  animation:glow 8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.88;transform:translateX(-50%) scale(1)}
  50%{opacity:1;transform:translateX(-50%) scale(1.07)}}
/* ── ĐƯỜNG CHÂN TRỜI THÀNH PHỐ + CÂY ── */
.city{position:fixed;left:0;right:0;bottom:0;height:24vh;min-height:150px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:0;opacity:.9}
.bd{position:relative;flex:0 0 auto;background:linear-gradient(180deg,#3A2551,#241634)}
.bd::before{content:'';position:absolute;left:0;right:0;top:0;height:100%;
  background-image:radial-gradient(circle,rgba(255,214,120,.95) 1.6px,transparent 1.8px);
  background-size:14px 18px;background-position:5px 9px;opacity:.55;animation:win 4s steps(2) infinite}
@keyframes win{0%,100%{opacity:.5}50%{opacity:.85}}
.bd.spire::after{content:'';position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
  width:3px;height:26px;background:#241634}
.tr2{position:relative;flex:0 0 auto;width:24px;align-self:flex-end}
.tr2::before{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:6px;height:20px;background:#6B4423;border-radius:1px}
.tr2::after{content:'';position:absolute;left:50%;bottom:15px;transform:translateX(-50%);
  width:30px;height:30px;background:radial-gradient(circle at 35% 30%,#5FE0A0,#1F8F5A);border-radius:50%}
.city2{position:fixed;left:0;right:0;bottom:0;height:16vh;min-height:96px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;opacity:.55;filter:blur(.6px)}
.city2 .bd{background:linear-gradient(180deg,#5A3B72,#3A2551)}
.city2 .tr2::after{background:radial-gradient(circle at 35% 30%,#4FCB8E,#237249)}
/* ── KHINH KHÍ CẦU, MÂY & CHIM ── */
.fly{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fo{position:absolute;bottom:-90px;animation:up linear infinite}
.fo i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes up{0%{transform:translateY(0);opacity:0}9%{opacity:.95}86%{opacity:.75}
  100%{transform:translateY(-118vh);opacity:0}}
@keyframes sway{from{transform:translateX(-16px) rotate(-7deg)}to{transform:translateX(16px) rotate(7deg)}}
.bal{position:relative;width:var(--s);height:calc(var(--s)*1.18);
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.6),transparent 42%),
   linear-gradient(90deg,var(--c1) 0 22%,var(--c2) 22% 45%,var(--c1) 45% 68%,var(--c2) 68% 100%);
  border-radius:50% 50% 46% 46%/58% 58% 42% 42%;box-shadow:0 3px 9px rgba(90,40,80,.28)}
.bal::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
  width:calc(var(--s)*.3);height:calc(var(--s)*.24);background:#8A5A2B;border-radius:2px 2px 4px 4px;
  box-shadow:0 -3px 0 -1px rgba(0,0,0,.2)}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:16px 14px 30vh}
h1,h2,.pill,.qn,.sbtn,.ck{font-family:'Fredoka',sans-serif;font-weight:700}
.gl{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:2px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 10px 30px rgba(90,40,90,.24)}
.hdr{padding:20px 20px 17px;text-align:center;margin:8px 0 18px}
.hdr h1{font-size:clamp(18px,4.1vw,29px);line-height:1.25;
  background:linear-gradient(90deg,var(--deep),var(--coral),var(--violet),var(--deep));
  background-size:280% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:shim 6s linear infinite}
@keyframes shim{0%{background-position:0%}100%{background-position:280%}}
.hdr .sub{display:inline-block;margin-top:8px;font-family:'Fredoka',sans-serif;font-size:.92rem;color:#fff;
  background:linear-gradient(135deg,var(--coral),var(--violet));padding:3px 16px;border-radius:999px}
.hdr p{font-size:.8rem;font-weight:700;color:var(--deep);margin-top:9px;line-height:1.75}
.sb{position:sticky;top:8px;z-index:9;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:18px;
  border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border:2px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(90,40,90,.2)}
.sb b{font-family:'Fredoka',sans-serif;font-size:1.14rem;color:var(--deep)}
.tr{flex:1;height:11px;background:rgba(136,84,192,.18);border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--coral),var(--violet));transition:width .45s}
.sec{padding:20px 17px 19px;margin-bottom:24px}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.pill{color:#fff;border-radius:999px;padding:3px 15px;font-size:.9rem;box-shadow:0 3px 10px rgba(90,40,90,.26)}
.st h2{font-size:1.08rem;color:var(--deep);font-family:'Fredoka',sans-serif}
.si{font-size:.85rem;font-weight:700;color:#7A5B86;font-style:italic;margin:2px 0 15px;line-height:1.8}
.q{background:rgba(255,255,255,.97);border-radius:16px;padding:18px 18px 19px;margin-bottom:18px;
  box-shadow:0 4px 14px rgba(90,40,90,.14);border-left:5px solid var(--peach)}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:linear-gradient(135deg,var(--coral),var(--violet));color:#fff;
  border-radius:10px;min-width:32px;text-align:center;padding:1px 8px;margin-right:8px;font-size:.92rem}
.qt{font-weight:700;font-size:1.15rem;line-height:2.05}
.qt .bl{display:inline-block;min-width:100px;border-bottom:3px solid var(--violet);text-align:center;
  color:var(--deep);font-weight:900}
.src{background:#FFF4F6;border-left:4px solid var(--coral);border-radius:0 11px 11px 0;padding:10px 13px;
  margin-top:9px;font-weight:800;font-size:1.05rem;line-height:1.9}
.cue{background:#FFF8E6;border:2px dashed var(--gold);border-radius:11px;padding:10px 13px;margin-top:9px;
  font-weight:800;font-size:1.05rem;line-height:1.9;color:#8A5A00}
.tg{display:inline-block;background:#F3E8FF;border:1.5px solid var(--violet);color:#6B21A8;border-radius:8px;
  padding:0 9px;font-size:.78rem;margin-left:6px;font-weight:800}
u{background:#FFE9A8;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800}
.ob u,.og u,.qt u{background:#FFDF7A;border-radius:3px;padding:0 1px;margin:0 -1px;font-weight:900;
  text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;text-decoration-color:var(--deep)}
/* ── TÌM & SỬA LỖI ── */
.segs{margin-top:13px;font-weight:700;font-size:1.08rem;line-height:2.6;
  background:#FFF4F6;border-left:4px solid var(--coral);border-radius:0 11px 11px 0;padding:12px 15px}
.sg{display:inline-block;background:#fff;border:2px solid var(--violet);border-radius:10px;padding:2px 9px;
  margin:0 2px;font-weight:800;font-size:1.02rem;cursor:pointer;transition:.14s;color:#6B21A8;
  box-shadow:0 2px 5px rgba(136,84,192,.2)}
.sg b{display:inline-block;background:var(--violet);color:#fff;border-radius:6px;padding:0 6px;margin-right:6px;
  font-size:.75rem;font-family:'Fredoka',sans-serif}
.sg:hover:not(.dn){transform:translateY(-2px);background:#FAF0FF}
.sg.sel{border-color:var(--gold);background:#FFF8E6;box-shadow:0 0 0 3px rgba(253,203,110,.4)}
.sg.dn{cursor:default;transform:none}
.sg.sgok{background:#D6F5E6;border-color:var(--good);color:#08663f}.sg.sgok b{background:var(--good)}
.sg.sgno{background:#FFE3E3;border-color:var(--bad);color:#96140f}.sg.sgno b{background:var(--bad)}
.sg.sgdim{opacity:.4}
.fz{max-height:0;overflow:hidden;transition:max-height .32s ease;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fz.open{max-height:220px;margin-top:12px}
.fzl{font-weight:900;color:#8A5A00;font-size:.95rem;width:100%}
.hint{margin-top:10px;background:#FFF8E6;border:2px dashed var(--gold);border-radius:10px;padding:8px 12px;
  font-size:.91rem;font-weight:700;color:#8A5A00;line-height:1.8}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:680px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.og{grid-template-columns:1fr}}
.ob{background:#FFFDFE;border:2px solid rgba(136,84,192,.4);border-radius:14px;padding:12px 14px;
  font-family:'Nunito';font-size:1.08rem;font-weight:800;cursor:pointer;transition:.15s;text-align:center;
  line-height:1.6;color:var(--ink);box-shadow:0 3px 8px rgba(136,84,192,.14)}
.ob:hover:not(.dn){transform:translateY(-2px) scale(1.02);background:#FAF0FF;border-color:var(--violet)}
.ob.ok{background:#D6F5E6;border-color:var(--good);color:#08663f}
.ob.no{background:#FFE3E3;border-color:var(--bad);color:#96140f}
.ob.dim{opacity:.42}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ti{flex:1;min-width:200px;padding:10px 14px;border:2px solid rgba(136,84,192,.4);border-radius:11px;
  font-family:'Nunito';font-size:1rem;font-weight:800;outline:none;background:#FFFDFE;color:var(--ink)}
.ti::placeholder{color:#c3aecd}
.ti:focus{border-color:var(--violet);background:#fff}
.ti.ok{border-color:var(--good);background:#D6F5E6}.ti.no{border-color:var(--bad);background:#FFE3E3}
.ck{background:linear-gradient(135deg,var(--coral),var(--violet));color:#fff;border:none;border-radius:11px;
  padding:10px 20px;font-size:.97rem;cursor:pointer;box-shadow:0 4px 12px rgba(136,84,192,.4);white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.42;cursor:default}
.ex{display:none;margin-top:13px;background:#FFFDFE;border:1.5px solid rgba(136,84,192,.3);border-radius:14px;
  padding:15px 16px;font-size:1rem;line-height:1.85}
.ex.show{display:block}
.kb{background:#D6F5E6;border:1.5px solid var(--good);border-radius:9px;padding:8px 12px;margin-bottom:10px;
  font-weight:900;color:#08663f;line-height:1.75}
.vnt{background:#FFF1DE;border-left:4px solid var(--peach);border-radius:0 10px 10px 0;padding:9px 13px;
  margin-bottom:11px;font-weight:800;color:#8A4B00;line-height:1.85}
.ex ol{padding-left:20px}
.ex ol li{margin-bottom:12px;line-height:1.9}
.ex ol li:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#fff;border:1.5px solid #F0DFF7;border-radius:10px;padding:8px 11px;line-height:1.7;font-weight:700}
.p-word{color:#1D4ED8;font-weight:800}
.hl-green{color:var(--good);font-weight:900}
.hl-red{color:var(--bad);font-weight:900}
.wt{background:#F3E8FF;color:#6B21A8;padding:1px 6px;border-radius:5px;font-size:.79em;font-weight:800;margin:0 4px}
.p-mean{color:#C2410C;font-weight:700}
.p-phonetic{color:#6A1B9A;background:rgba(106,27,154,.09);border-radius:4px;padding:1px 6px;
  font-family:'Courier New',monospace;font-size:.9em;font-weight:800}
.p-grammar{text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2.5px;
  text-underline-offset:3px;font-weight:700}
.note{background:#EEF2F7;border-left:4px solid #7A8FA6;border-radius:0 8px 8px 0;padding:8px 12px;margin-top:9px;
  font-size:.9rem;font-weight:700;color:#3D5166;line-height:1.75}
.sub{text-align:center;margin-top:24px}
.sbtn{background:linear-gradient(135deg,var(--gold),var(--coral),var(--violet));color:#fff;border:none;
  border-radius:999px;padding:13px 40px;font-size:1.18rem;cursor:pointer;box-shadow:0 8px 22px rgba(136,84,192,.45)}
.sbtn:hover{transform:translateY(-3px)}
.ov{position:fixed;inset:0;background:rgba(43,37,96,.68);z-index:99;display:none;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(5px)}
.ov.on{display:flex}
.mb{background:rgba(255,255,255,.96);border-radius:22px;box-shadow:0 14px 44px rgba(90,40,90,.4);padding:24px;
  width:420px;max-width:96%;text-align:center;border:2px solid #fff;max-height:90vh;overflow-y:auto}
.mb h2{font-size:1.3rem;color:var(--deep);margin-bottom:11px}
.mb input{width:100%;padding:11px;border:2px solid rgba(136,84,192,.4);border-radius:11px;font-family:'Nunito';
  font-weight:800;font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#FFE3E3;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Fredoka',sans-serif;font-size:1.2rem;color:var(--deep);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Fredoka',sans-serif;font-size:2.5rem;color:var(--coral)}
.mb .rt{font-weight:900;color:#6B21A8;font-size:1.05rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.92rem;line-height:1.65;margin-bottom:10px;color:#5A4A66}
.mb img{width:100%;max-width:250px;border-radius:13px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="sun"></div>
<div class="city2" id="city2"></div>
<div class="city" id="city"></div>
<div class="fly" id="fly"></div>
<div class="wrap">
  <div class="hdr gl">
    <h1>🌄 SECOND MIDTERM TEST 1</h1>
    <div class="sub">PART 1 · SUNRISE ADVENTURE</div>
    <p>🎓 Giáo viên tạo: Ms. Chí Nên &nbsp;·&nbsp; Phần <b>I–VII</b> + <b>X–XII</b><br>
    31 câu &nbsp;·&nbsp; <i>(bỏ phần VIII — đoạn văn điền từ &amp; IX — bài đọc hiểu theo yêu cầu)</i></p>
  </div>
  <div class="sb">🌅 <b><span id="sc">0</span>/<span id="tt">0</span></b>
    <div class="tr"><div class="fl" id="fb"></div></div><span id="md">💪</span></div>
  <div id="app"></div>
  <div class="sub"><button class="sbtn" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
</div>
<div class="ov" id="nOv"><div class="mb"><h2>✍️ Nhập tên của con</h2>
  <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="em" id="nEr">⚠️ Con chưa nhập tên kìa!</div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="showResult()">🚀 Xem kết quả</button></div></div>
<div class="ov" id="rOv"><div class="mb"><div class="gr" id="rG"></div>
  <div class="rs" id="rS"></div><div class="rt" id="rT"></div><img id="rI" alt=""><div class="rm" id="rM"></div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="location.reload()">🔄 Làm lại</button></div></div>

<script>
/* ══ ĐƯỜNG CHÂN TRỜI + CÂY + KHINH KHÍ CẦU + MÂY ══ */
(function(){
 function skyline(el,n,minH,maxH,minW,maxW){
  for(let i=0;i<n;i++){
   if(i%5===4){const t=document.createElement('div');t.className='tr2';
    t.style.height=(minH*0.55).toFixed(0)+'px';el.appendChild(t);continue}
   const b=document.createElement('div');b.className='bd'+(i%7===3?' spire':'');
   b.style.width=(minW+Math.random()*(maxW-minW)).toFixed(0)+'px';
   b.style.height=(minH+Math.random()*(maxH-minH)).toFixed(0)+'px';
   b.style.borderRadius=(i%4===0?'4px 4px 0 0':'2px 2px 0 0');
   el.appendChild(b);
  }
 }
 skyline(document.getElementById('city2'),24,40,96,26,58);
 skyline(document.getElementById('city'),20,52,150,30,64);
 const L=document.getElementById('fly');
 const C=[['#FF6B8B','#FDCB6E'],['#8854C0','#00C9A7'],['#FFA45C','#FFE29A'],
          ['#5AC8FA','#C77DFF'],['#FF8FB1','#B5EAD7']];
 for(let i=0;i<20;i++){
  const d=document.createElement('div');d.className='fo';
  const inner=document.createElement('i');
  if(i%7===6){inner.textContent=['🕊️','🐦'][i%2];
   inner.style.fontSize=(13+Math.random()*12).toFixed(0)+'px';}
  else if(i%5===4){inner.textContent='☁️';inner.style.fontSize=(22+Math.random()*20).toFixed(0)+'px';
   inner.style.opacity=.75;inner.style.filter='blur(.3px)';}
  else{const b=document.createElement('div');b.className='bal';
   b.style.setProperty('--s',(16+Math.random()*22).toFixed(0)+'px');
   b.style.setProperty('--c1',C[i%C.length][0]);b.style.setProperty('--c2',C[i%C.length][1]);
   inner.appendChild(b);}
  d.style.left=(Math.random()*93)+'%';
  d.style.animationDuration=(19+Math.random()*18).toFixed(1)+'s';
  d.style.animationDelay=(-Math.random()*32).toFixed(1)+'s';
  inner.style.animationDuration=(3+Math.random()*3).toFixed(1)+'s';
  d.appendChild(inner);L.appendChild(d);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#FDCB6E','#FF7B8A','#8854C0','#00C9A7','#FFA45C'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}

s6('19a','<span class="bl">?</span> Melinda <b>(compete)</b> in the swimming race now?','trợ động từ','Is',['is'],

 'Không dùng “Does” ✘ vì câu hỏi hiện tại tiếp diễn phải mượn TO BE (is/am/are), không mượn do/does như hiện tại đơn. '+

 'Không thể giữ nguyên “compete” ✘ hay chia thành “competes” ✘ vì sau trợ động từ “Is” của thì hiện tại tiếp diễn, '+

/* ═════ VII — SẮP XẾP CÂU/ĐOẠN VĂN (2) ═════ */
const s7=(n,intro,o,a,vn,c,r,w)=>mcq('S7',n,'<b>'+n+'.</b> Sắp xếp các câu sau thành đoạn văn/hội thoại có nghĩa:'+

s7(21,'📄 a. Second, don’t stand up. You might block the view of the person behind you.<br>'+
 'b. Finally, pick up any litter around your seat before leaving the stadium.<br>'+
 'c. First, you can cheer and clap for your team, but don’t make too much loud noise.<br>'+
 'd. There are some rules that everyone should follow when watching a football match at the stadium.',
 ['d – b – c – a','c – b – d – a','d – c – a – b','a – d – c – b'],
 'd – c – a – b',
 '<b>d.</b> Có một số quy tắc mà mọi người nên tuân theo khi xem một trận bóng đá tại sân vận động.<br>'+
 '<b>c.</b> Đầu tiên, bạn có thể hò reo và vỗ tay cổ vũ cho đội của mình, nhưng đừng gây ồn ào quá mức.<br>'+
 '<b>a.</b> Thứ hai, đừng đứng dậy. Bạn có thể che mất tầm nhìn của người ngồi phía sau.<br>'+
 '<b>b.</b> Cuối cùng, hãy nhặt rác quanh chỗ ngồi trước khi rời sân vận động.',
 T('d – b – c – a','order','Sai: câu giới thiệu (d) không thể đứng ngay trước “Finally” (b) – thiếu bước First/Second')+
 T('c – b – d – a','order','Sai: thiếu câu giới thiệu (d) ở ĐẦU đoạn văn')+
 TG('d – c – a – b','order','Đúng: d (giới thiệu) → c (First) → a (Second) → b (Finally)')+
 T('a – d – c – b','order','Sai: “Second” (a) không thể đứng trước cả câu giới thiệu (d) lẫn “First” (c)'),
 'Đoạn văn cần mở đầu bằng câu GIỚI THIỆU chủ đề (<b>d</b>: “There are some rules…”), sau đó đi theo đúng trình '+
 'tự từ nối: <b>First (c) → Second (a) → Finally (b)</b>.',
 'Các phương án khác đều phá vỡ trật tự logic của từ nối: hoặc thiếu câu giới thiệu ở đầu, hoặc đảo lộn thứ tự '+
 'First – Second – Finally.');

 '“because”.',

 TG('V2 before V1','structure','hãy làm V2 trước khi làm V1 (câu mới – mệnh lệnh khẳng định, đảo hành động)')+
 T('put on suncream','v','bôi kem chống nắng – trở thành hành động CẦN LÀM TRƯỚC'),

/* ══ DỰNG TRANG ══ */
const TOTAL=Q.length;let answered=0,score=0;const done={},maps={},sel={};
function bump(){document.getElementById('fb').style.width=(answered/TOTAL*100)+'%';
 document.getElementById('sc').textContent=score;
 const p=answered?score/answered:1;
 document.getElementById('md').textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){
 const d=document.createElement('div');d.className='sec gl';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+
  '</span><h2>'+title+'</h2></div><div class="si">'+ins+'</div>';
 APP.appendChild(d);CUR=d}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

sec('linear-gradient(135deg,#FF7B8A,#FDCB6E)','I','🔊 Chọn từ có phần gạch chân phát âm khác','(2 câu)');render('S1');
sec('linear-gradient(135deg,#FDCB6E,#FFA45C)','II','🔎 Chọn từ khác loại (odd one out)','(2 câu)');render('S2');
sec('linear-gradient(135deg,#8854C0,#FF7B8A)','III','✅ Chọn từ/cụm từ đúng nhất','(10 câu)');render('S3');
sec('linear-gradient(135deg,#00C9A7,#5AC8FA)','IV','🔍 Tìm &amp; sửa lỗi sai (A · B · C · D)',
 'Mỗi câu có ĐÚNG MỘT lỗi. <b>Bước 1:</b> bấm vào chữ cái con cho là sai. <b>Bước 2:</b> gõ phần đã sửa vào ô vừa '+
 'hiện ra rồi bấm KIỂM TRA. Phải đúng CẢ HAI mới được điểm. (2 câu)');render('S4');
sec('linear-gradient(135deg,#FFA45C,#FF7B8A)','V','🔧 Viết dạng đúng của từ trong ngoặc','(2 câu)');render('S5');
sec('linear-gradient(135deg,#8854C0,#00C9A7)','VI','🧱 Viết dạng đúng của động từ trong ngoặc',
 'Câu 19 có 2 chỗ trống nên cô tách thành <b>19a</b> và <b>19b</b>. (3 ô)');render('S6');
sec('linear-gradient(135deg,#5AC8FA,#8854C0)','VII','📜 Sắp xếp câu thành đoạn văn/hội thoại có nghĩa','(2 câu)');render('S7');
sec('linear-gradient(135deg,#FDCB6E,#00C9A7)','X','🔤 Sắp xếp từ/cụm từ thành câu có nghĩa','(2 câu)');render('S10');
sec('linear-gradient(135deg,#FF7B8A,#8854C0)','XI','✏️ Viết câu từ các từ gợi ý (cues)','(2 câu)');render('S11');
sec('linear-gradient(135deg,#FFA45C,#FDCB6E)','XII','✍️ Viết lại câu, nghĩa không đổi','(4 câu)');render('S12');
document.getElementById('tt').textContent=TOTAL;bump();

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="qt">'+h+'Tìm chữ cái chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="segs" id="sg_'+gid+'">'+(m.pre||'')+
   m.parts.map(p=>'<span class="sg" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     '<b>'+p[0]+'</b>'+p[1]+'</span>'+(p[2]||'')).join('')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào chữ cái con cho là SAI.</div>'+
   '<div class="fz" id="fz_'+gid+'"><span class="fzl" id="fl_'+gid+'"></span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  c.querySelector('#b_'+gid).onclick=()=>chkf(gid);
  c.querySelector('#i_'+gid).addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Đã chọn chữ <b>'+L+'</b>. <b>Bước 2:</b> gõ phần đã sửa rồi bấm '+
  '<b>KIỂM TRA</b>. (Bấm chữ khác nếu muốn đổi.)';
 document.getElementById('fz_'+gid).classList.add('open');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa chữ <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),
       inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),460);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter,okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>{
  s.classList.remove('sel');s.classList.add('dn');
  if(s.dataset.l===m.letter)s.classList.add('sgok');
  else if(s.dataset.l===sel[gid])s.classList.add('sgno');
  else s.classList.add('sgdim');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
  ? '🎉 <b>Tuyệt vời!</b> Đúng chữ <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
  : (okL?'⚠️ Đúng chữ <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
       :(okW?'⚠️ Sửa đúng từ nhưng chọn SAI chữ. Lỗi nằm ở chữ <b>'+m.letter+'</b>.'
            :'❌ Lỗi nằm ở chữ <b>'+m.letter+'</b>, phải sửa thành <b>'+m.corr+'</b>.'));
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 THIÊN TÀI, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu – xuất sắc tuyệt đối! 🌅';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ xem lại phần it’s/its và cụm “go + V-ing” nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại lời giải từng câu rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
