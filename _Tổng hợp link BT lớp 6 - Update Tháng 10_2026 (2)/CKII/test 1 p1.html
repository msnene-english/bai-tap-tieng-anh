<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✉️ SECOND TERM TEST 1 · P1 — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3B2F2A;--deep:#7A2330;--coral:#C0392B;--peach:#E8B04B;--violet:#1F4E8C;
  --gold:#D4A017;--teal:#2E6B5E;--good:#2E7D4F;--bad:#C0392B;--glass:rgba(252,246,232,.93)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,#FBF3DE 0%,#F5E8C8 30%,#EEDCAC 60%,#E4CD92 100%);
  background-size:100% 220%;background-attachment:fixed;animation:sky 30s ease-in-out infinite alternate}
@keyframes sky{from{background-position:50% 0%}to{background-position:50% 100%}}
/* ── VIỀN TEM AIRMAIL SỌC CHÉO ── */
.frame{position:fixed;inset:0;z-index:5;pointer-events:none}
.frame i{position:absolute;display:block;
  background:repeating-linear-gradient(45deg,#C0392B 0 14px,#FBF3DE 14px 20px,#1F4E8C 20px 34px,#FBF3DE 34px 40px)}
.frame .t,.frame .b{left:0;right:0;height:9px}.frame .t{top:0}.frame .b{bottom:0}
.frame .l,.frame .r{top:0;bottom:0;width:9px}.frame .l{left:0}.frame .r{right:0}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(circle,rgba(122,35,48,.25) 1px,transparent 1.4px);
  background-size:34px 34px}
/* ── DẤU BƯU ĐIỆN TRÒN (POSTMARK) ── */
.sun{position:fixed;left:50%;top:4vh;transform:translateX(-50%) rotate(-8deg);width:190px;height:190px;
  border-radius:50%;z-index:0;pointer-events:none;opacity:.5;
  border:3px dashed rgba(122,35,48,.4);
  background:radial-gradient(circle,rgba(232,176,75,.18) 0%,transparent 70%);
  animation:glow 8s ease-in-out infinite}
.sun::before{content:'★ NEN ★';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;color:rgba(122,35,48,.4);letter-spacing:2px}
@keyframes glow{0%,100%{opacity:.4;transform:translateX(-50%) rotate(-8deg) scale(1)}
  50%{opacity:.6;transform:translateX(-50%) rotate(-8deg) scale(1.04)}}
/* ── HÀNG THƯ & TEM XẾP CHỒNG ── */
.city{position:fixed;left:0;right:0;bottom:0;height:22vh;min-height:130px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:6px;opacity:.5;filter:sepia(.2)}
.bd{position:relative;flex:0 0 auto;background:linear-gradient(180deg,#EFDFC0,#D8C093);border-radius:3px;
  border:1.5px solid rgba(122,35,48,.25)}
.bd::before{content:'';position:absolute;left:6px;right:6px;top:6px;bottom:60%;
  border:1px dashed rgba(31,78,140,.4)}
.bd.spire{background:linear-gradient(180deg,#F3D9A0,#DDBA6E)}
.bd.spire2{background:linear-gradient(180deg,#DCEAE4,#B9D6CB)}
.tr2{position:relative;flex:0 0 auto;align-self:flex-end;font-size:26px;line-height:1;
  animation:sway 3.6s ease-in-out infinite alternate;transform-origin:bottom center;opacity:.85}
.city2{position:fixed;left:0;right:0;bottom:0;height:14vh;min-height:80px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:6px;opacity:.3;filter:blur(.5px)}
.city2 .bd{background:linear-gradient(180deg,#F0E2C6,#DECDA0)}
.city2 .tr2{font-size:18px;opacity:.7}
/* ── MÁY BAY GIẤY & THƯ BAY ── */
.swf{position:fixed;bottom:2vh;z-index:0;pointer-events:none;font-size:22px;
  animation:swim linear infinite;filter:drop-shadow(0 2px 3px rgba(59,47,42,.2))}
@keyframes swim{0%{transform:translateX(-10vw) scaleX(1)}49%{transform:translateX(100vw) scaleX(1)}
  50%{transform:translateX(100vw) scaleX(-1)}99%{transform:translateX(-10vw) scaleX(-1)}
  100%{transform:translateX(-10vw) scaleX(1)}}
.fly{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;opacity:.85}
.fo{position:absolute;bottom:-90px;animation:up linear infinite}
.fo i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes up{0%{transform:translateY(0);opacity:0}9%{opacity:.9}86%{opacity:.7}
  100%{transform:translateY(-118vh);opacity:0}}
@keyframes sway{from{transform:translateX(-16px) rotate(-7deg)}to{transform:translateX(16px) rotate(7deg)}}
.bal{position:relative;width:var(--s);height:var(--s);border-radius:3px;
  background:linear-gradient(135deg,rgba(252,246,232,.95),color-mix(in srgb, var(--c1) 40%, transparent));
  border:1.5px solid rgba(122,35,48,.4);
  box-shadow:0 2px 5px rgba(59,47,42,.25)}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:22px 20px 30vh}
h1,h2,.pill,.qn,.sbtn,.ck{font-family:'Fredoka',sans-serif;font-weight:700}
.gl{background:var(--glass);border:2px solid rgba(122,35,48,.3);border-radius:8px;
  box-shadow:0 10px 26px rgba(59,47,42,.22),inset 0 0 0 1px rgba(255,255,255,.5)}
.hdr{padding:22px 24px 18px;text-align:center;margin:0 0 18px;position:relative}
.hdr::before{content:'✉️';position:absolute;top:-16px;left:24px;font-size:34px;
  filter:drop-shadow(0 3px 3px rgba(59,47,42,.3));transform:rotate(-8deg)}
.hdr::after{content:'PAR AVION';position:absolute;top:14px;right:20px;font-family:'Fredoka',sans-serif;
  font-size:.68rem;font-weight:700;letter-spacing:2px;color:#fff;background:var(--violet);
  padding:3px 10px;border-radius:2px;transform:rotate(3deg);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.hdr h1{font-size:clamp(17px,4vw,27px);line-height:1.25;color:var(--deep);letter-spacing:.5px}
.hdr .sub{display:inline-block;margin-top:9px;font-family:'Fredoka',sans-serif;font-size:.9rem;color:#fff;
  background:linear-gradient(135deg,var(--coral),var(--violet));padding:3px 16px;border-radius:3px}
.hdr p{font-size:.8rem;font-weight:700;color:var(--ink);margin-top:10px;line-height:1.75}
.sb{position:sticky;top:12px;z-index:9;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:18px;
  border-radius:6px;background:rgba(252,246,232,.94);border:2px solid rgba(122,35,48,.3);
  box-shadow:0 6px 16px rgba(59,47,42,.2)}
.sb b{font-family:'Fredoka',sans-serif;font-size:1.14rem;color:var(--deep)}
.tr{flex:1;height:10px;background:rgba(31,78,140,.15);border-radius:4px;overflow:hidden}
.fl{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--coral) 0 6px,var(--violet) 6px 12px);transition:width .45s}
.sec{padding:20px 20px 19px;margin-bottom:22px;position:relative}
.sec::before{content:attr(data-tag);position:absolute;top:-11px;left:20px;font-family:'Fredoka',sans-serif;
  font-size:.72rem;font-weight:700;color:#fff;background:var(--coral);padding:2px 11px;border-radius:2px;
  box-shadow:0 2px 4px rgba(0,0,0,.18)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px;margin-top:6px}
.pill{color:#fff;border-radius:4px;padding:3px 15px;font-size:.9rem;box-shadow:0 3px 8px rgba(59,47,42,.25)}
.st h2{font-size:1.06rem;color:var(--deep);font-family:'Fredoka',sans-serif}
.si{font-size:.85rem;font-weight:700;color:#7A5A46;font-style:italic;margin:2px 0 15px;line-height:1.8}
.q{background:#FEFAF0;border-radius:4px;padding:18px 18px 19px;margin-bottom:18px;position:relative;
  box-shadow:0 4px 12px rgba(59,47,42,.16);border-left:5px solid var(--violet);
  border-top:1px solid rgba(122,35,48,.15);border-right:1px solid rgba(122,35,48,.15);
  border-bottom:1px solid rgba(122,35,48,.15)}
.q::after{content:'';position:absolute;top:0;right:0;width:0;height:0;
  border-style:solid;border-width:0 16px 16px 0;border-color:transparent rgba(122,35,48,.12) transparent transparent}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:linear-gradient(135deg,var(--violet),var(--coral));color:#fff;
  border-radius:4px;min-width:32px;text-align:center;padding:1px 8px;margin-right:8px;font-size:.92rem}
.qt{font-weight:700;font-size:1.15rem;line-height:2.05}
.qt .bl{display:inline-block;min-width:100px;border-bottom:3px solid var(--violet);text-align:center;
  color:var(--deep);font-weight:900}
.src{background:#FBF0DC;border-left:4px solid var(--violet);border-radius:0 6px 6px 0;padding:10px 13px;
  margin-top:9px;font-weight:800;font-size:1.05rem;line-height:1.9}
.cue{background:#FCF3D9;border:2px dashed var(--gold);border-radius:6px;padding:10px 13px;margin-top:9px;
  font-weight:800;font-size:1.05rem;line-height:1.9;color:#8A5A00}
.tg{display:inline-block;background:#E9EFF7;border:1.5px solid var(--violet);color:#1F4E8C;border-radius:4px;
  padding:0 9px;font-size:.78rem;margin-left:6px;font-weight:800}
u{background:#F5DCA8;border-radius:3px;padding:0 4px;text-decoration:none;font-weight:800}
.ob u,.og u,.qt u{background:#EFC880;border-radius:2px;padding:0 1px;margin:0 -1px;font-weight:900;
  text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;text-decoration-color:var(--deep)}
/* ── TÌM & SỬA LỖI ── */
.segs{margin-top:13px;font-weight:700;font-size:1.08rem;line-height:2.6;
  background:#FBF0DC;border-left:4px solid var(--violet);border-radius:0 6px 6px 0;padding:12px 15px}
.sg{display:inline-block;background:#FEFAF0;border:2px solid var(--violet);border-radius:4px;padding:2px 9px;
  margin:0 2px;font-weight:800;font-size:1.02rem;cursor:pointer;transition:.14s;color:#1F4E8C;
  box-shadow:0 2px 4px rgba(31,78,140,.2)}
.sg b{display:inline-block;background:var(--violet);color:#fff;border-radius:3px;padding:0 6px;margin-right:6px;
  font-size:.75rem;font-family:'Fredoka',sans-serif}
.sg:hover:not(.dn){transform:translateY(-2px);background:#F1F5FB}
.sg.sel{border-color:var(--gold);background:#FCF3D9;box-shadow:0 0 0 3px rgba(212,160,23,.35)}
.sg.dn{cursor:default;transform:none}
.sg.sgok{background:#DEF0E2;border-color:var(--good);color:#1E5A34}.sg.sgok b{background:var(--good)}
.sg.sgno{background:#F7DEDA;border-color:var(--bad);color:#7A1F14}.sg.sgno b{background:var(--bad)}
.sg.sgdim{opacity:.4}
.fz{max-height:0;overflow:hidden;transition:max-height .32s ease;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fz.open{max-height:220px;margin-top:12px}
.fzl{font-weight:900;color:#8A5A00;font-size:.95rem;width:100%}
.hint{margin-top:10px;background:#FCF3D9;border:2px dashed var(--gold);border-radius:6px;padding:8px 12px;
  font-size:.91rem;font-weight:700;color:#8A5A00;line-height:1.8}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:680px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.og{grid-template-columns:1fr}}
.ob{background:#FEFAF0;border:2px solid rgba(31,78,140,.35);border-radius:6px;padding:12px 14px;
  font-family:'Nunito';font-size:1.08rem;font-weight:800;cursor:pointer;transition:.15s;text-align:center;
  line-height:1.6;color:var(--ink);box-shadow:0 3px 7px rgba(31,78,140,.13)}
.ob:hover:not(.dn){transform:translateY(-2px) scale(1.02);background:#F1F5FB;border-color:var(--violet)}
.ob.ok{background:#DEF0E2;border-color:var(--good);color:#1E5A34}
.ob.no{background:#F7DEDA;border-color:var(--bad);color:#7A1F14}
.ob.dim{opacity:.42}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ti{flex:1;min-width:200px;padding:10px 14px;border:2px solid rgba(31,78,140,.35);border-radius:6px;
  font-family:'Nunito';font-size:1rem;font-weight:800;outline:none;background:#FEFAF0;color:var(--ink)}
.ti::placeholder{color:#B8A78C}
.ti:focus{border-color:var(--violet);background:#fff}
.ti.ok{border-color:var(--good);background:#DEF0E2}.ti.no{border-color:var(--bad);background:#F7DEDA}
.ck{background:linear-gradient(135deg,var(--violet),var(--coral));color:#fff;border:none;border-radius:6px;
  padding:10px 20px;font-size:.97rem;cursor:pointer;box-shadow:0 4px 10px rgba(31,78,140,.35);white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.42;cursor:default}
.ex{display:none;margin-top:13px;background:#FEFAF0;border:1.5px solid rgba(31,78,140,.25);border-radius:6px;
  padding:15px 16px;font-size:1rem;line-height:1.85}
.ex.show{display:block}
.kb{background:#DEF0E2;border:1.5px solid var(--good);border-radius:5px;padding:8px 12px;margin-bottom:10px;
  font-weight:900;color:#1E5A34;line-height:1.75}
.vnt{background:#FBEBCB;border-left:4px solid var(--peach);border-radius:0 6px 6px 0;padding:9px 13px;
  margin-bottom:11px;font-weight:800;color:#7A5300;line-height:1.85}
.ex ol{padding-left:20px}
.ex ol li{margin-bottom:12px;line-height:1.9}
.ex ol li:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#fff;border:1.5px solid #EADFC4;border-radius:5px;padding:8px 11px;line-height:1.7;font-weight:700}
.p-word{color:#1F4E8C;font-weight:800}
.hl-green{color:var(--good);font-weight:900}
.hl-red{color:var(--bad);font-weight:900}
.wt{background:#E9EFF7;color:#1F4E8C;padding:1px 6px;border-radius:3px;font-size:.79em;font-weight:800;margin:0 4px}
.p-mean{color:#A15A1C;font-weight:700}
.p-phonetic{color:#7A2330;background:rgba(122,35,48,.09);border-radius:3px;padding:1px 6px;
  font-family:'Courier New',monospace;font-size:.9em;font-weight:800}
.p-grammar{text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2.5px;
  text-underline-offset:3px;font-weight:700}
.note{background:#EFEAE0;border-left:4px solid #8C7A5E;border-radius:0 6px 6px 0;padding:8px 12px;margin-top:9px;
  font-size:.9rem;font-weight:700;color:#4A3D2A;line-height:1.75}
.sub{text-align:center;margin-top:24px}
.sbtn{background:linear-gradient(135deg,var(--coral),var(--violet));color:#fff;border:none;
  border-radius:999px;padding:13px 40px;font-size:1.18rem;cursor:pointer;box-shadow:0 8px 20px rgba(31,78,140,.35)}
.sbtn:hover{transform:translateY(-3px)}
.ov{position:fixed;inset:0;background:rgba(59,47,42,.7);z-index:99;display:none;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.mb{background:#FEFAF0;border-radius:8px;box-shadow:0 14px 40px rgba(59,47,42,.4);padding:24px;
  width:420px;max-width:96%;text-align:center;border:2px solid rgba(122,35,48,.3);max-height:90vh;overflow-y:auto}
.mb h2{font-size:1.3rem;color:var(--deep);margin-bottom:11px}
.mb input{width:100%;padding:11px;border:2px solid rgba(31,78,140,.35);border-radius:6px;font-family:'Nunito';
  font-weight:800;font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#F7DEDA;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Fredoka',sans-serif;font-size:1.2rem;color:var(--deep);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Fredoka',sans-serif;font-size:2.5rem;color:var(--coral)}
.mb .rt{font-weight:900;color:#1F4E8C;font-size:1.05rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.92rem;line-height:1.65;margin-bottom:10px;color:#5A4A38}
.mb img{width:100%;max-width:250px;border-radius:6px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:1px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="frame"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
<div class="stars"></div>
<div class="sun"></div>
<div class="city2" id="city2"></div>
<div class="city" id="city"></div>
<div class="fly" id="fly"></div>
<div class="wrap">
  <div class="hdr gl">
    <h1>THE SECOND TERM TESTS</h1>
    <div class="sub">TEST 1 · PART 1 · AIRMAIL EDITION</div>
    <p>🎓 Giáo viên tạo: Ms. Chí Nên<br>
    28 câu &nbsp;·&nbsp; <i>(bỏ phần VII — đoạn văn điền từ &amp; VIII — bài đọc hiểu theo yêu cầu)</i></p>
  </div>
  <div class="sb">📮 <b><span id="sc">0</span>/<span id="tt">0</span></b>
    <div class="tr"><div class="fl" id="fb"></div></div><span id="md">💪</span></div>
  <div id="app"></div>
  <div class="sub"><button class="sbtn" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
</div>
<div class="ov" id="nOv"><div class="mb"><h2>✍️ Nhập tên của con</h2>
  <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="em" id="nEr">⚠️ Con chưa nhập tên kìa!</div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="showResult()">🚀 Xem kết quả</button></div></div>
<div class="ov" id="rOv"><div class="mb"><div class="gr" id="rG"></div>
  <div class="rs" id="rS"></div><div class="rt" id="rT"></div><img id="rI" alt=""><div class="rm" id="rM"></div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="location.reload()">🔄 Làm lại</button></div></div>

<script>
/* ══ HÀNG THƯ + MÁY BAY GIẤY + TEM BAY ══ */
(function(){
 function line(el,n,minH,maxH,minW,maxW,treeSize){
  for(let i=0;i<n;i++){
   if(i%5===4){const t=document.createElement('div');t.className='tr2';
    t.textContent=['✉️','📮'][i%2];t.style.fontSize=treeSize+'px';
    t.style.animationDelay=(-Math.random()*3).toFixed(1)+'s';el.appendChild(t);continue}
   const b=document.createElement('div');b.className='bd'+(i%9===3?' spire':(i%9===7?' spire2':''));
   b.style.width=(minW+Math.random()*(maxW-minW)).toFixed(0)+'px';
   b.style.height=(minH+Math.random()*(maxH-minH)).toFixed(0)+'px';
   el.appendChild(b);
  }
 }
 line(document.getElementById('city2'),20,24,60,22,46,16);
 line(document.getElementById('city'),16,34,120,26,54,24);
 for(let i=0;i<4;i++){
  const s=document.createElement('div');s.className='swf';
  s.textContent=['✈️','📬','🌍','🖋️'][i%4];
  s.style.bottom=(4+Math.random()*22)+'vh';
  s.style.animationDuration=(24+Math.random()*20).toFixed(1)+'s';
  s.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  document.body.appendChild(s);
 }
 const L=document.getElementById('fly');
 const C=[['#C0392B','#1F4E8C'],['#D4A017','#2E6B5E'],['#1F4E8C','#C0392B'],
          ['#2E6B5E','#D4A017'],['#C0392B','#D4A017']];
 for(let i=0;i<20;i++){
  const d=document.createElement('div');d.className='fo';
  const inner=document.createElement('i');
  if(i%6===5){inner.textContent=['✈️','💌'][i%2];
   inner.style.fontSize=(14+Math.random()*12).toFixed(0)+'px';}
  else if(i%9===4){inner.textContent=['📮','⭐','✒️'][i%3];inner.style.fontSize=(15+Math.random()*10).toFixed(0)+'px';}
  else{const b=document.createElement('div');b.className='bal';
   b.style.setProperty('--s',(9+Math.random()*14).toFixed(0)+'px');
   b.style.setProperty('--c1',C[i%C.length][0]);b.style.setProperty('--c2',C[i%C.length][1]);
   inner.appendChild(b);}

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="qt">'+h+'Tìm chữ cái chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="segs" id="sg_'+gid+'">'+(m.pre||'')+
   m.parts.map(p=>'<span class="sg" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     '<b>'+p[0]+'</b>'+p[1]+'</span>'+(p[2]||'')).join('')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào chữ cái con cho là SAI.</div>'+
   '<div class="fz" id="fz_'+gid+'"><span class="fzl" id="fl_'+gid+'"></span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  c.querySelector('#b_'+gid).onclick=()=>chkf(gid);
  c.querySelector('#i_'+gid).addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Đã chọn chữ <b>'+L+'</b>. <b>Bước 2:</b> gõ phần đã sửa rồi '+
  'bấm <b>KIỂM TRA</b>. (Bấm chữ khác nếu muốn đổi.)';
 document.getElementById('fz_'+gid).classList.add('open');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa chữ <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),
       inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),460);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter,okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>{
  s.classList.remove('sel');s.classList.add('dn');
  if(s.dataset.l===m.letter)s.classList.add('sgok');
  else if(s.dataset.l===sel[gid])s.classList.add('sgno');
  else s.classList.add('sgdim');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
  ? '🎉 <b>Tuyệt vời!</b> Đúng chữ <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
  : (okL?'⚠️ Đúng chữ <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
       :(okW?'⚠️ Sửa đúng từ nhưng chọn SAI chữ. Lỗi nằm ở chữ <b>'+m.letter+'</b>.'
            :'❌ Lỗi nằm ở chữ <b>'+m.letter+'</b>, phải sửa thành <b>'+m.corr+'</b>.'));
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 THIÊN TÀI, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu – lá thư điểm 10 đã sẵn '+
  'sàng gửi đi! 💌';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ xem lại mạo từ a/an và cụm "look '+
  'like" nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại lời giải từng câu rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
