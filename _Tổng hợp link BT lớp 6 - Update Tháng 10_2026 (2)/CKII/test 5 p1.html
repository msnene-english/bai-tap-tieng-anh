<!DOCTYPE html>
<html lang="vi">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ocean1:#010d1f;--ocean2:#031226;--ocean3:#061a40;--ocean4:#092454;
 --glow1:#00d4ff;--glow2:#00fff0;--glow3:#0068ff;--coral:#ff6b6b;--gold:#ffd166;
 --biolum:#7affdb;--violet:#b06aff;--good:#00D26A;--bad:#FF4757;
 --ink:#dff0fa;--dim:#6ea5c9;--glass:rgba(3,18,38,.72);--glass-border:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
 background:linear-gradient(135deg,var(--ocean1),var(--ocean3),var(--ocean4),var(--ocean2),var(--ocean1));
 background-size:400% 400%;animation:oceanShift 22s ease infinite}
@keyframes oceanShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#ocean{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(0,212,255,.2),rgba(0,100,255,.04));
 border:1px solid rgba(0,212,255,.18);animation:bubbleRise linear infinite}
@keyframes bubbleRise{0%{transform:translateY(110vh);opacity:0}10%{opacity:.8}90%{opacity:.4}100%{transform:translateY(-10vh) translateX(25px);opacity:0}}
.fish{position:absolute;animation:fishSwim linear infinite;filter:drop-shadow(0 0 5px rgba(0,212,255,.6))}
@keyframes fishSwim{0%{transform:translateX(-120px) scaleX(1)}49%{transform:translateX(48vw) scaleX(1)}50%{transform:translateX(50vw) scaleX(-1)}100%{transform:translateX(110vw) scaleX(-1)}}
.seaweed{position:absolute;bottom:0;animation:sway ease-in-out infinite alternate;filter:drop-shadow(0 0 6px rgba(0,255,157,.4))}
@keyframes sway{from{transform:rotate(-14deg) translateX(-3px)}to{transform:rotate(14deg) translateX(3px)}}
.jelly{position:absolute;animation:jellyFloat ease-in-out infinite alternate;filter:drop-shadow(0 0 10px rgba(176,106,255,.5))}
@keyframes jellyFloat{from{transform:translateY(0) scale(1)}to{transform:translateY(-28px) scale(1.06)}}
.star{position:absolute;border-radius:50%;background:var(--glow2);animation:twinkle ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.1;transform:scale(.7)}to{opacity:.85;transform:scale(1.3)}}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:20px 16px 30vh}
h1,h2,.pill,.qn,.sbtn,.ck{font-family:'Quicksand',sans-serif;font-weight:700}
.gl{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(16px);border-radius:20px;
 box-shadow:0 8px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.hdr{padding:24px 22px 18px;text-align:center;margin:14px 0 20px}
.hdr::before{content:'🐠';display:block;font-size:30px;margin-bottom:6px}
.hdr h1{font-size:clamp(17px,4vw,25px);line-height:1.35;font-family:'Quicksand',sans-serif;font-weight:700;
 background:linear-gradient(90deg,var(--glow1),var(--biolum),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .sub{display:inline-block;margin-top:10px;font-family:'Quicksand',sans-serif;font-size:.82rem;color:#001a2e;
 background:linear-gradient(90deg,var(--glow1),var(--biolum));padding:5px 18px;border-radius:999px;
 box-shadow:0 3px 12px rgba(0,212,255,.35);font-weight:700}

.sb{position:sticky;top:12px;z-index:9;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:18px;
 border-radius:16px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(14px);
 box-shadow:0 6px 18px rgba(0,0,0,.4)}
.sb b{font-family:'Quicksand',sans-serif;font-size:1.1rem;color:var(--glow2)}
.tr{flex:1;height:10px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;border:1px solid rgba(0,212,255,.18)}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--glow1),var(--biolum));border-radius:4px;transition:width .45s;box-shadow:0 0 10px var(--glow1)}
.sec{padding:20px 18px 18px;margin-bottom:38px;position:relative}
.sec::before{content:attr(data-tag);position:absolute;top:-13px;left:16px;font-family:'Quicksand',sans-serif;
 font-size:.7rem;font-weight:700;color:#001a2e;background:var(--gold);padding:3px 14px;border-radius:999px;
 box-shadow:0 2px 5px rgba(0,0,0,.35)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px;margin-top:8px}
.pill{color:#001a2e;border-radius:999px;padding:3px 15px;font-size:.9rem;box-shadow:0 3px 7px rgba(0,0,0,.35)}
.st h2{font-size:1.02rem;color:var(--gold);font-family:'Quicksand',sans-serif;text-transform:uppercase;letter-spacing:.5px}
.si{font-size:.84rem;font-weight:700;color:var(--dim);font-style:italic;margin:2px 0 15px;line-height:1.8}

 padding:18px 18px 20px;margin-bottom:26px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}

@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.4);color:var(--glow2);
 border-radius:8px;min-width:32px;text-align:center;padding:1px 8px;margin-right:8px;font-size:.85rem;

.qt{font-weight:700;font-size:1.12rem;line-height:2.05;color:var(--ink)}
.qt .bl{display:inline-block;min-width:100px;border-bottom:2px dashed var(--glow1);text-align:center;
 color:var(--biolum);font-weight:900}
.src{background:rgba(0,212,255,.06);border-left:3px solid var(--violet);border-radius:0 12px 12px 0;padding:10px 13px;
 margin-top:9px;font-weight:800;font-size:1.03rem;line-height:1.9}
.cue{background:rgba(0,212,255,.06);border:2px dashed var(--gold);border-radius:12px;padding:10px 13px;margin-top:9px;

.tg{display:inline-block;background:rgba(255,255,255,.08);border:1.5px solid var(--violet);color:#e4ccff;

u{background:rgba(0,212,255,.12);border-radius:3px;padding:0 4px;text-decoration:none;font-weight:800;color:var(--biolum)}
.ob u,.og u,.qt u{background:rgba(0,212,255,.18);border-radius:3px;padding:0 2px;margin:0 -1px;font-weight:900;

 padding:2px 9px;margin:0 2px;font-weight:800;font-size:1rem;cursor:pointer;transition:.14s;color:var(--ink)}
.sg b{display:inline-block;background:var(--violet);color:#fff;border-radius:5px;padding:0 6px;margin-right:6px;
 font-size:.75rem;font-family:'Quicksand',sans-serif}
.sg:hover:not(.dn){transform:translateY(-2px);border-color:var(--glow1);background:rgba(0,212,255,.2)}
.sg.sel{border-color:var(--gold);background:rgba(255,209,102,.22);box-shadow:0 0 0 3px rgba(255,209,102,.25)}
.sg.dn{cursor:default;transform:none}
.sg.sgok{background:rgba(0,210,106,.25);border-color:var(--good);color:#8effc4}.sg.sgok b{background:var(--good)}
.sg.sgno{background:rgba(255,71,87,.25);border-color:var(--bad);color:#ffb3ba}.sg.sgno b{background:var(--bad)}
.sg.sgdim{opacity:.35}
.fz{max-height:0;overflow:hidden;transition:max-height .32s ease;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.fzl{font-weight:900;color:var(--gold);font-size:.94rem;width:100%}

 font-size:.9rem;font-weight:700;color:#ffe5a0;line-height:1.8}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}

@media(max-width:680px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.og{grid-template-columns:1fr}}
.ob{background:rgba(0,104,255,.1);border:2px solid rgba(0,212,255,.22);border-radius:15px;padding:12px 14px;
 font-family:'Nunito';font-size:1.05rem;font-weight:700;cursor:pointer;transition:.2s cubic-bezier(.34,1.56,.64,1);
 text-align:center;line-height:1.6;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ob:hover:not(.dn){transform:scale(1.04) translateY(-2px);border-color:var(--glow1);box-shadow:0 8px 22px rgba(0,212,255,.22)}
.ob.ok{background:rgba(0,210,106,.22);border-color:var(--good);box-shadow:0 0 16px rgba(0,210,106,.3)}
.ob.no{background:rgba(255,71,87,.22);border-color:var(--bad)}
.ob.dim{opacity:.38}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ti{flex:1;min-width:200px;padding:10px 14px;border-radius:12px;border:2px solid rgba(0,212,255,.25);
 font-family:'Nunito';font-size:1rem;font-weight:700;outline:none;background:rgba(255,255,255,.07);color:var(--ink)}
.ti::placeholder{color:#4d7a99}
.ti:focus{border-color:var(--glow1);background:rgba(255,255,255,.1)}
.ti.ok{border-color:var(--good);background:rgba(0,210,106,.12)}.ti.no{border-color:var(--bad);background:rgba(255,71,87,.12)}
.ck{background:linear-gradient(135deg,var(--glow3),var(--glow1));color:#001a2e;border:none;border-radius:12px;
 padding:10px 20px;font-size:.95rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,128,255,.35);white-space:nowrap;
 font-weight:900;font-family:'Nunito'}
.ck:hover:not(:disabled){transform:scale(1.05)}
.ck:disabled{opacity:.4;cursor:default;transform:none}
/* ── SẮP XẾP TỪ ── */
.arrans{min-height:56px;border:2px dashed var(--violet);border-radius:14px;padding:10px 12px;margin-top:12px;
 display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(255,255,255,.04)}
.arrans.ok{border-color:var(--good);background:rgba(0,210,106,.08)}
.arrans.no{border-color:var(--bad);background:rgba(255,71,87,.08)}
.arrph{color:var(--dim);font-weight:700;font-size:.9rem;font-style:italic}
.arrpool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-block;background:rgba(0,104,255,.15);border:2px solid rgba(0,212,255,.32);border-radius:12px;
 padding:7px 13px;font-weight:800;font-size:1rem;cursor:pointer;transition:.16s;color:var(--ink);font-family:'Nunito'}
.chip:hover{transform:translateY(-2px);border-color:var(--glow1);background:rgba(0,212,255,.24)}
.chip.ans{background:rgba(255,209,102,.2);border-color:var(--gold)}
.ex{display:none;margin-top:13px;background:rgba(0,0,0,.34);border:1px solid rgba(0,212,255,.14);border-radius:14px;
 padding:15px 16px;font-size:.98rem;line-height:1.85}
.ex.show{display:block}
.kb{background:rgba(0,210,106,.16);border:1.5px solid rgba(0,210,106,.5);border-radius:11px;padding:8px 12px;
 margin-bottom:10px;font-weight:800;color:#8effc4;line-height:1.75}
.vnt{background:rgba(255,209,102,.09);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:8px 13px;
 margin-bottom:11px;font-weight:700;color:#ffe5a0;line-height:1.85}
.note{background:rgba(0,212,255,.05);border-left:3px solid var(--glow1);border-radius:0 10px 10px 0;padding:9px 13px;
 margin-top:9px;font-size:.9rem;font-weight:700;color:#9fe9ff;line-height:1.75}
.ex ol{padding-left:20px}
.ex ol li{margin-bottom:12px;line-height:1.9}
.ex ol li:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(0,0,0,.3);border:1px solid rgba(0,212,255,.14);border-radius:9px;padding:7px 10px;line-height:1.7;font-weight:700;font-size:.93rem}
.p-word{color:#4dd8ff;font-weight:800}
.hl-green{color:var(--good);font-weight:900}
.hl-red{color:#ff7b87;font-weight:800}
.wt{background:rgba(0,128,255,.18);color:#7dc9ff;padding:1px 6px;border-radius:5px;font-size:.76em;font-weight:700;margin:0 4px}
.p-mean{color:#e8956d;font-weight:700}
.p-phonetic{color:var(--violet);background:rgba(176,106,255,.1);border-radius:5px;padding:1px 6px;
 font-family:'Courier New',monospace;font-size:.88em;font-weight:800}
.p-grammar{font-weight:700;color:#dff0fa}
.sub{text-align:center;margin-top:24px}
.sbtn{background:linear-gradient(135deg,var(--glow3),var(--glow1));color:#001a2e;border:none;border-radius:50px;
 padding:15px 42px;font-size:1.08rem;cursor:pointer;box-shadow:0 8px 28px rgba(0,212,255,.45);font-weight:900;
 font-family:'Quicksand';letter-spacing:1px}
.sbtn:hover{transform:scale(1.05) translateY(-3px)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:99;display:none;align-items:center;
 justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(10px)}
.ov.on{display:flex}
.mb{background:linear-gradient(145deg,#031226,#061a40);border:1px solid rgba(0,212,255,.28);border-radius:22px;
 padding:28px 24px;width:420px;max-width:96%;text-align:center;box-shadow:0 20px 56px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto}
.mb h2{font-size:1.28rem;font-family:'Quicksand';color:var(--glow1);margin-bottom:11px}
.mb input{width:100%;padding:11px;border-radius:11px;border:2px solid rgba(0,212,255,.28);background:rgba(255,255,255,.07);
 font-family:'Nunito';font-weight:700;font-size:1rem;text-align:center;outline:none;margin-bottom:10px;color:var(--ink)}
.mb input.er{border-color:var(--bad);animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Quicksand';font-size:1.15rem;color:var(--gold);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Quicksand';font-size:2.6rem;font-weight:900;background:linear-gradient(90deg,var(--gold),var(--glow1));
 -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mb .rt{font-weight:900;color:var(--biolum);font-size:1.05rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.92rem;line-height:1.65;margin-bottom:10px;color:var(--dim)}
.mb img{width:100%;max-width:250px;border-radius:14px;margin:10px auto;display:block;border:2px solid rgba(0,212,255,.3)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:1px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div id="ocean"></div>
<div class="wrap">
 <div class="hdr gl">
 <h1>THE SECOND TERM TESTS</h1>

 <p>🎓 Giáo viên tạo: Ms. Chí Nên<br>
 30 câu &nbsp;·&nbsp; <i>(bỏ phần VIII — đoạn văn điền từ &amp; IX — bài đọc hiểu theo yêu cầu)</i></p>
 </div>
 <div class="sb">🫧 <b><span id="sc">0</span>/<span id="tt">0</span></b>
 <div class="tr"><div class="fl" id="fb"></div></div><span id="md">💪</span></div>
 <div id="app"></div>

</div>

 <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">

<script>
/* ══ ĐẠI DƯƠNG ══ */
(function(){
 const L=document.getElementById('ocean');
 for(let i=0;i<18;i++){const b=document.createElement('div');b.className='bubble';
 const s=6+Math.random()*26;b.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;'+
 'animation-duration:'+(9+Math.random()*13)+'s;animation-delay:'+(-Math.random()*18)+'s';L.appendChild(b)}
 for(let i=0;i<26;i++){const s=document.createElement('div');s.className='star';
 const z=1.5+Math.random()*2.5;s.style.cssText='width:'+z+'px;height:'+z+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;'+
 'animation-duration:'+(1.6+Math.random()*2.6)+'s;animation-delay:'+(-Math.random()*3)+'s';L.appendChild(s)}
 ['🐠','🐟','🐡','🦑','🐙','🦀','🐚','🦐'].forEach((f,i)=>{const el=document.createElement('div');el.className='fish';
 el.textContent=f;el.style.cssText='top:'+(8+Math.random()*80)+'%;font-size:'+(1.1+Math.random()*1.5)+'rem;'+
 'animation-duration:'+(24+Math.random()*26)+'s;animation-delay:'+(-i*5)+'s';L.appendChild(el)});
 ['🌿','🌱','🪸','🌿','🪸'].forEach((w,i)=>{const sw=document.createElement('div');sw.className='seaweed';
 sw.textContent=w;sw.style.cssText='left:'+(4+i*22)+'%;font-size:'+(1.8+Math.random()*1.4)+'rem;'+
 'animation-duration:'+(3+Math.random()*2.5)+'s';L.appendChild(sw)});
 ['🪼','✨','💫','🌟'].forEach((j,i)=>{const el=document.createElement('div');el.className='jelly';
 el.textContent=j;el.style.cssText='left:'+(10+i*24)+'%;top:'+(18+Math.random()*55)+'%;font-size:'+(1.3+Math.random()*1.2)+'rem;'+
 'animation-duration:'+(3.4+Math.random()*2.6)+'s';L.appendChild(el)});
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#00d4ff','#7affdb','#ffd166','#b06aff','#ff6b6b','#00D26A'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
 d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
 d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fil(sec,num,q,correct,accept,ex,ph){Q.push({t:'fill',sec,num,q,correct,accept,ex,ph:ph||'Điền...'})}
function fxq(sec,num,pre,parts,letter,corr,accept,ex){Q.push({t:'fix',sec,num,pre,parts,letter,corr,accept,ex})}
function arq(sec,num,instr,chunks,ex){Q.push({t:'arr',sec,num,instr,chunks,ex})}
function T(w,ty,m){return "<div><span class='p-word'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TG(w,ty,m){return "<div><span class='hl-green'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TP(w,ipa,m){return "<div><span class='p-word'>"+w+"</span> <span class='p-phonetic'>"+ipa+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TPG(w,ipa,m){return "<div><span class='hl-green'>"+w+"</span> <span class='p-phonetic'>"+ipa+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function EX(kb,vn,cells,right,wrong){
 return '<div class="kb">✅ '+kb+'</div><div class="vnt">💬 <b>Dịch:</b> '+vn+'</div>'+
 '<ol><li><b>🔎 Phân tích đáp án:</b><div class="grid2">'+cells+'</div></li>'+
 '<li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class="p-grammar">'+right+'</span></li>'+
 '<li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class="p-grammar">'+wrong+'</span></li></ol>'}

/* ═════ I — PHÁT ÂM (2) ═════ */
const s1=(n,o,a,vn,c,r,w)=>mcq('S1',n,'<b>'+n+'.</b> Chọn từ có phần gạch chân phát âm KHÁC 3 từ còn lại:',a,o,
 EX(a.replace(/<\/?u>/g,''),vn,c,r,w),'c4');
s1(1,['expl<u>ai</u>n','w<u>ai</u>t','h<u>ai</u>r','str<u>ai</u>ght'],'h<u>ai</u>r',
 'Chọn từ có phần “ai” được gạch chân phát âm khác 3 từ còn lại. (explain, wait, hair, straight)',
 TP('expl<u>ai</u>n','/ɪkˈspleɪn/','giải thích')+TP('w<u>ai</u>t','/weɪt/','chờ đợi')+
 TPG('h<u>ai</u>r','/heə(r)/','tóc')+TP('str<u>ai</u>ght','/streɪt/','thẳng'),
 '<b>explain, wait, straight</b> đều đọc “ai” là <b>/eɪ/</b>. Riêng <b>hair</b> đọc “ai” là <b>/eə/</b> → khác 3 từ còn lại.',
 'Bẫy: “hair” là một trong số ít từ có “ai” đọc /eə/ (giống “fair, chair”), khác hẳn với /eɪ/ phổ biến ở '+
 'explain/wait/straight.');
s1(2,['profe<u>ss</u>ional','me<u>ss</u>age','le<u>ss</u>on','nece<u>ss</u>ary'],'profe<u>ss</u>ional',
 'Chọn từ có phần “ss” được gạch chân phát âm khác 3 từ còn lại. (professional, message, lesson, necessary)',
 TPG('profe<u>ss</u>ional','/prəˈfeʃənl/','chuyên nghiệp')+TP('me<u>ss</u>age','/ˈmesɪdʒ/','tin nhắn')+
 TP('le<u>ss</u>on','/ˈlesn/','bài học')+TP('nece<u>ss</u>ary','/ˈnesəsəri/','cần thiết'),
 '<b>message, lesson, necessary</b> đều đọc “ss” là <b>/s/</b>. Riêng <b>professional</b> đọc “ss” là '+
 '<b>/ʃ/</b> (do đứng trước “ion”) → khác 3 từ còn lại.',
 'Bẫy: hậu tố “-ssion/-ssional” thường biến “ss” thành /ʃ/, khác với “ss” đọc /s/ bình thường ở 3 từ còn lại.');

/* ═════ II — ODD ONE OUT (2) ═════ */
const s2=(n,o,a,vn,c,r,w)=>mcq('S2',n,'<b>'+n+'.</b> Chọn từ KHÔNG cùng nhóm nghĩa với 3 từ còn lại:',a,o,
 EX(a,vn,c,r,w),'c4');
s2(3,['suburbs','town','countryside','newspaper'],'newspaper',
 'Chọn từ không cùng nhóm nghĩa với 3 từ còn lại. (suburbs, town, countryside, newspaper)',
 T('suburbs','n','vùng ngoại ô — một loại KHU VỰC dân cư')+T('town','n','thị trấn — một loại KHU VỰC dân cư')+
 T('countryside','n','vùng nông thôn — một loại KHU VỰC dân cư')+TG('newspaper','n','tờ báo — một ẤN PHẨM, không phải khu vực'),
 '<b>suburbs, town, countryside</b> đều là các KHU VỰC/vùng đất nơi người ta sinh sống. Riêng '+
 '<b>newspaper</b> là một ẤN PHẨM in ấn → khác nhóm.',
 'Bẫy: cả 4 từ đều có thể xuất hiện trong bài về “nơi ở/cộng đồng”, nhưng chỉ “newspaper” không phải một '+
 'KHU VỰC địa lý.');
s2(4,['villa','container','cottage','flat'],'container',
 'Chọn từ không cùng nhóm nghĩa với 3 từ còn lại. (villa, container, cottage, flat)',
 T('villa','n','biệt thự — một loại NHÀ Ở')+TG('container','n','hộp/thùng chứa — không phải NHÀ Ở')+
 T('cottage','n','nhà tranh nhỏ — một loại NHÀ Ở')+T('flat','n','căn hộ — một loại NHÀ Ở'),
 '<b>villa, cottage, flat</b> đều là các LOẠI NHÀ Ở. Riêng <b>container</b> là vật dụng chứa đồ, không '+
 'phải nhà ở → khác nhóm.',
 'Bẫy: “container” đôi khi khiến ta liên tưởng đến “container home” (nhà làm từ công-ten-nơ), nhưng bản '+
 'thân từ “container” chỉ mang nghĩa VẬT CHỨA thông thường.');

/* ═════ III — TRẮC NGHIỆM (10) ═════ */
const s3=(n,s,a,o,vn,c,r,w,cl)=>mcq('S3',n,'<b>'+n+'.</b> '+s,a,o,EX(a,vn,c,r,w),cl||'c4');
s3(5,'Did you <span class="bl">?</span> any email from me yesterday? It was about our project.','receive',
 ['send','receive','rent','prepare'],
 'Bạn có nhận được email nào từ tôi hôm qua không? Nó về dự án của chúng ta.',
 T('send','v','gửi đi (ngược nghĩa với NHẬN)')+TG('receive','v','nhận được (khớp với “any email…from me”)')+
 T('rent','v','thuê')+T('prepare','v','chuẩn bị'),
 '“Did you ___ any email FROM me” → hành động NHẬN email từ người khác → <b>receive</b>.',
 '“send” ✘ nghĩa ngược lại (gửi, không phải nhận). “rent/prepare” ✘ không đúng nghĩa.');
s3(6,'Cairo is a <span class="bl">?</span> city with very little rain during the year.','dry',
 ['dry','rainy','royal','stormy'],
 'Cairo là một thành phố khô hạn với rất ít mưa trong năm.',
 TG('dry','adj','khô hạn — khớp với “very little rain”')+T('rainy','adj','nhiều mưa — ngược nghĩa')+
 T('royal','adj','thuộc hoàng gia — không liên quan đến thời tiết')+T('stormy','adj','có bão — không khớp với “little rain”'),
 '“very little rain during the year” (rất ít mưa) → thành phố <b>dry</b> (khô hạn).',
 '“rainy/stormy” ✘ đều ngược nghĩa với “very little rain”. “royal” ✘ không liên quan đến khí hậu.');
s3(7,'These crayons aren’t mine. <span class="bl">?</span> are they?','Whose',
 ['Who','Where','Whose','whom'],
 'Những cây bút sáp này không phải của tớ. Chúng là của ai vậy?',
 T('Who','wh-word','ai (chủ ngữ, hỏi về NGƯỜI thực hiện hành động)')+T('Where','wh-word','ở đâu (không phù hợp)')+
 TG('Whose','wh-word','của ai (hỏi về CHỦ SỞ HỮU, khớp với “aren’t mine”)')+T('whom','wh-word','ai (tân ngữ, không đúng ngữ pháp ở đây)'),
 'Câu trước nói về SỞ HỮU (“aren’t mine”) → câu hỏi về CHỦ SỞ HỮU dùng <b>Whose</b>.',
 '“Who/whom” ✘ hỏi về NGƯỜI thực hiện hành động, không phải chủ sở hữu. “Where” ✘ không phù hợp.');
s3(8,'Their robot looks strong, but I think <span class="bl">?</span> is stronger.','ours',
 ['my','it','their','ours'],
 'Rô-bốt của họ trông có vẻ khỏe, nhưng tôi nghĩ rô-bốt của chúng tôi khỏe hơn.',
 T('my','det','của tôi (tính từ sở hữu, phải đi kèm danh từ)')+T('it','pron','nó (đại từ nhân xưng, không mang nghĩa sở hữu)')+
 T('their','det','của họ (tính từ sở hữu, đã dùng ở vế trước)')+TG('ours','pron','của chúng tôi (đại từ sở hữu, đứng MỘT MÌNH thay cho “our robot”)'),
 'Vị trí này đứng MỘT MÌNH (không kèm danh từ) và mang nghĩa “robot của CHÚNG TÔI” → dùng đại từ sở hữu <b>ours</b>.',
 '“my/their” ✘ là tính từ sở hữu, phải đi kèm danh từ. “it” ✘ không mang nghĩa sở hữu.');
s3(9,'The ISS is a space <span class="bl">?</span> that goes around the Earth.','station',
 ['gallery','building','station','post'],
 'ISS là một trạm không gian bay quanh Trái Đất.',
 T('gallery','n','phòng trưng bày')+T('building','n','tòa nhà — không bay được')+
 TG('station','n','trạm (space station = trạm không gian)')+T('post','n','bưu điện; cột'),
 'Cụm cố định <b>space station</b> = trạm không gian (ISS – International Space Station).',
 '“gallery/building/post” ✘ đều không tạo thành cụm cố định “space ___” đúng nghĩa.');
s3(10,'Luis: “I think students shouldn’t bring phones to school.” Barbara: “<span class="bl">?</span> '+
 'Phones can be useful for learning.”','I totally disagree!',
 ['No problem at all.','I see, thank you!','I totally disagree!','I’m not sure I can.'],
 'Luis: “Tớ nghĩ học sinh không nên mang điện thoại đến trường.” Barbara: “___ Điện thoại có thể hữu ích '+
 'cho việc học.”',
 T('No problem at all.','answer','Không vấn đề gì cả. (không phải phản hồi ý kiến)')+
 T('I see, thank you!','answer','Tớ hiểu rồi, cảm ơn! (thể hiện đồng ý/tiếp nhận, không khớp câu sau)')+
 TG('I totally disagree!','answer','Tớ hoàn toàn không đồng ý! (khớp với câu tiếp theo phản bác ý kiến của Luis)')+
 T('I’m not sure I can.','answer','Tớ không chắc là tớ có thể. (không phù hợp ngữ cảnh tranh luận)'),
 'Câu tiếp theo “Phones can be useful for learning” phản bác ý kiến của Luis → Barbara phải thể hiện sự '+
 'KHÔNG ĐỒNG Ý trước: <b>I totally disagree!</b>',
 '“No problem at all./I see, thank you!/I’m not sure I can.” ✘ đều không dẫn dắt tự nhiên đến câu phản '+
 'bác tiếp theo.','c1');
s3(11,'At the recycling fair, you can exchange used clothes <span class="bl">?</span> other people.','with',
 ['for','by','with','from'],
 'Tại hội chợ tái chế, bạn có thể trao đổi quần áo đã qua sử dụng với người khác.',
 T('for','prep','để đổi lấy (dùng cho VẬT, không phải NGƯỜI)')+T('by','prep','bởi (chỉ tác nhân, không phù hợp)')+
 TG('with','prep','với (exchange st WITH sb = trao đổi gì đó VỚI ai)')+T('from','prep','từ (chỉ nguồn gốc, không đúng cấu trúc)'),
 'Cụm cố định <b>exchange st with sb</b> = trao đổi gì đó VỚI ai đó → “with”.',
 '“for/by/from” ✘ đều không tạo thành cụm cố định đúng nghĩa “trao đổi VỚI người khác”.');
s3(12,'Surfing is a popular summer <span class="bl">?</span> at the beach.','sport',
 ['break','action','sport','camp'],
 'Lướt sóng là một môn thể thao mùa hè phổ biến ở bãi biển.',
 T('break','n','kỳ nghỉ')+T('action','n','hành động')+TG('sport','n','môn thể thao (surfing = một MÔN THỂ THAO)')+T('camp','n','trại'),
 '“Surfing” là một MÔN THỂ THAO (sport) được chơi vào mùa hè.',
 '“break/action/camp” ✘ đều không đúng nghĩa để mô tả bản chất của “surfing”.');
s3(13,'Laura is tired this morning because she <span class="bl">?</span> much sleep last night.','didn’t get',
 ['gets','isn’t getting','didn’t get','got'],
 'Laura mệt mỏi sáng nay vì cô ấy đã không ngủ đủ giấc tối qua.',
 T('gets','v','ngủ (hiện tại đơn, sai thì)')+T('isn’t getting','v','không đang ngủ (hiện tại tiếp diễn, sai thì)')+
 TG('didn’t get','v','đã không có được — quá khứ đơn phủ định, khớp với “last night”')+
 T('got','v','đã có được (khẳng định, sai vì cần PHỦ ĐỊNH do “tired”)'),
 '“last night” là dấu hiệu QUÁ KHỨ ĐƠN; Laura “tired” (mệt) → PHỦ ĐỊNH: <b>didn’t get</b>.',
 '“gets/isn’t getting” ✘ sai thì (không phải quá khứ). “got” ✘ thiếu phủ định, mâu thuẫn với việc “tired”.');
s3(14,'Ruby is three years <span class="bl">?</span> her little brother.','older than',
 ['older than','the older','the oldest','more old than'],
 'Ruby lớn hơn em trai nhỏ của mình ba tuổi.',
 TG('older than','adj (so sánh hơn)','lớn tuổi hơn — cấu trúc “số lượng + so sánh hơn”')+
 T('the older','adj','sai vì có “three years” chỉ mức độ hơn cụ thể, không dùng “the”')+
 T('the oldest','adj','so sánh NHẤT, sai vì chỉ so sánh giữa 2 người')+
 T('more old than','adj','sai vì “old” là tính từ ngắn, so sánh hơn phải thêm “-er” chứ không dùng “more”'),
 'Cấu trúc “số lượng + so sánh hơn” (three years older than) diễn tả chênh lệch tuổi cụ thể.',
 '“the older/the oldest” ✘ sai vì có mạo từ “the” không cần thiết/sai loại so sánh. “more old than” ✘ '+
 'sai vì “old” là tính từ NGẮN, phải thêm “-er”.');

/* ═════ IV — TÌM & SỬA LỖI (2) ═════ */
const s4=(n,pre,parts,aL,corr,accept,vn,pk,r,w)=>fxq('S4',n,pre,parts,aL,corr,accept,
 EX('Lỗi ở chữ <b>'+aL+'</b> ➔ '+pk.k,vn,pk.c,r,w));
s4(15,'',[['A','I have',' a few '],['B','homework to do today, so',' I '],['C','shouldn’t',' spend '],
 ['D','too',' much time watching TV.']]/*keep*/,'A','a little',['a little'],
 'Tôi có một ít bài tập phải làm hôm nay, vì vậy tôi không nên dành quá nhiều thời gian xem TV.',
 {k:'<span class="hl-red">a few</span> ➔ <span class="hl-green">a little</span>',
 c:TG('a little homework','det + n','một ít bài tập — “homework” là danh từ KHÔNG ĐẾM ĐƯỢC, dùng “a little”')+
 T('a few','×','SAI — “a few” chỉ dùng cho danh từ ĐẾM ĐƯỢC số nhiều')+
 T('so / shouldn’t / too','conj / modal / adv','ĐÚNG, giữ nguyên')},
 '“homework” là danh từ KHÔNG ĐẾM ĐƯỢC → phải dùng “a little”, không dùng “a few” (chỉ dùng cho đếm được).',
 'Lỗi nằm ở ô A “a few” ✘ — sai loại từ định lượng. Ba ô B, C, D đều đúng.');
s4(16,'',[['A','Charles will come',' to the stadium '],['B','last weekend',' to cheer '],
 ['C','for',' his '],['D','his','favourite team.']],'B','next weekend',['next weekend'],
 'Charles sẽ đến sân vận động vào cuối tuần tới để cổ vũ cho đội bóng yêu thích của cậu ấy.',
 {k:'<span class="hl-red">last weekend</span> ➔ <span class="hl-green">next weekend</span>',
 c:T('will come','v (tương lai)','sẽ đến — ĐÚNG, giữ nguyên, chỉ hành động TƯƠNG LAI')+
 TG('next weekend','time phrase','cuối tuần tới — phải khớp với thì TƯƠNG LAI của “will come”')+
 T('last weekend','×','SAI — mâu thuẫn thì: “last weekend” là QUÁ KHỨ, không thể đi cùng “will” (tương lai)')+
 T('for / his','prep / det','ĐÚNG, giữ nguyên')},
 'Động từ “will come” chia ở thì TƯƠNG LAI ĐƠN → trạng từ thời gian phải là TƯƠNG LAI: “next weekend”, '+
 'không phải “last weekend” (quá khứ).',
 'Lỗi nằm ở ô B “last weekend” ✘ — mâu thuẫn thì với “will come”. Ba ô A, C, D đều đúng.');

/* ═════ V — DẠNG CỦA ĐỘNG TỪ (2) ═════ */
const s5=(n,s,root,a,acc,vn,c,r,w)=>fil('S5',n,'<b>'+n+'.</b> '+s+' <span class="tg">('+root+')</span>',
 a,acc,EX(a,vn,c,r,w),'Điền dạng đúng của động từ...');
s5(17,'My family <span class="bl">?</span> to a bigger house next year.','move','will move',['will move'],
 'Gia đình tôi sẽ chuyển đến một ngôi nhà lớn hơn vào năm sau.',
 T('next year','adv phrase','năm sau — dấu hiệu THÌ TƯƠNG LAI ĐƠN')+
 TG('will move','v (tương lai)','sẽ chuyển đến — tương lai đơn với “will”'),
 '“next year” là dấu hiệu THÌ TƯƠNG LAI ĐƠN → <b>will move</b>.',
 'Không dùng “move/moves/moved” ✘ vì câu diễn tả một dự định trong TƯƠNG LAI.');
s5(18,'Children should drink lots of water instead of <span class="bl">?</span> soda.','drink','drinking',
 ['drinking'],
 'Trẻ em nên uống nhiều nước thay vì uống soda.',
 T('instead of','prep','thay vì — giới từ, theo sau LUÔN là V-ing')+
 TG('drinking','v-ing','uống — V-ing sau giới từ “instead of”'),
 'Sau giới từ “instead of” luôn dùng V-ing → <b>drinking</b>.',
 'Không dùng “drink/drank” ✘ — vị trí sau giới từ bắt buộc dùng danh động từ (V-ing), không phải động từ '+
 'nguyên thể hay quá khứ.');

/* ═════ VI — DẠNG CỦA TỪ (2) ═════ */
const s6=(n,s,root,a,acc,vn,c,r,w)=>fil('S6',n,'<b>'+n+'.</b> '+s+' <span class="tg">('+root+')</span>',
 a,acc,EX(a,vn,c,r,w),'Điền dạng đúng của từ...');

function renderArr(gid){
 const st=arrSt[gid],m=Q[+gid.slice(1)];
 const ans=document.getElementById('ans_'+gid),pool=document.getElementById('pool_'+gid);
 ans.innerHTML = st.order.length ? st.order.map(i=>'<span class="chip ans" onclick="unpickArr(\''+gid+'\','+i+')">'+m.chunks[i]+'</span>').join(' ')
 : '<span class="arrph">👆 Bấm vào các mảnh ghép bên dưới theo đúng thứ tự để ghép câu...</span>';
 pool.innerHTML = st.shuffled.filter(i=>st.order.indexOf(i)<0).map(i=>'<span class="chip" onclick="pickArr(\''+gid+'\','+i+')">'+m.chunks[i]+'</span>').join('');
}
function pickArr(gid,i){if(done[gid])return;arrSt[gid].order.push(i);renderArr(gid)}
function unpickArr(gid,i){if(done[gid])return;const st=arrSt[gid];const idx=st.order.indexOf(i);if(idx>-1)st.order.splice(idx,1);renderArr(gid)}
function chkArr(gid){
 if(done[gid])return;
 const st=arrSt[gid],m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid);
 if(st.order.length!==m.chunks.length){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 done[gid]=true;answered++;
 const ok=st.order.every((v,i)=>v===i);
 document.getElementById('ans_'+gid).classList.add(ok?'ok':'no');
 document.querySelectorAll('#pool_'+gid+' .chip').forEach(ch=>ch.style.pointerEvents='none');
 document.querySelectorAll('#ans_'+gid+' .chip').forEach(ch=>ch.onclick=null);
 document.getElementById('b_'+gid).disabled=true;document.getElementById('rb_'+gid).disabled=true;
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
 const so=shuffle(m.opts);maps[gid]=so;
 c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
 so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
 '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
 c.innerHTML='<div class="qt">'+h+'Tìm chữ cái chứa lỗi rồi sửa lại cho đúng:</div>'+
 '<div class="segs" id="sg_'+gid+'">'+(m.pre||'')+
 m.parts.map(p=>'<span class="sg" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
 '<b>'+p[0]+'</b>'+p[1]+'</span>'+(p[2]||'')).join('')+'</div>'+
 '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào chữ cái con cho là SAI.</div>'+
 '<div class="fz" id="fz_'+gid+'"><span class="fzl" id="fl_'+gid+'"></span>'+
 '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
 '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
 '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 c.querySelector('#b_'+gid).onclick=()=>chkf(gid);
 c.querySelector('#i_'+gid).addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else if(m.t==='arr'){
 arrSt[gid]={shuffled:shuffle(m.chunks.map((_,i)=>i)),order:[]};
 c.innerHTML='<div class="qt">'+h+m.instr+'</div>'+
 '<div class="arrans" id="ans_'+gid+'"></div><div class="arrpool" id="pool_'+gid+'"></div>'+
 '<div class="fr"><button class="ck" id="rb_'+gid+'" type="button" style="background:rgba(255,255,255,.12);color:#dff0fa">↺ LÀM LẠI</button>'+
 '<button class="ck" id="b_'+gid+'" type="button">KIỂM TRA</button></div>'+
 '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 c.querySelector('#b_'+gid).onclick=()=>chkArr(gid);
 c.querySelector('#rb_'+gid).onclick=()=>{if(done[gid])return;arrSt[gid]={shuffled:arrSt[gid].shuffled,order:[]};renderArr(gid)};
 setTimeout(()=>renderArr(gid),0);
 } else {
 c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
 '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
 '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
 const go=()=>{
 if(done[gid])return;
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');c.classList.add('shk');
 setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
 done[gid]=true;answered++;
 const ok=m.accept.map(norm).indexOf(v)>-1;
 inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
 };
 bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Đã chọn chữ <b>'+L+'</b>. <b>Bước 2:</b> gõ phần đã sửa rồi '+
 'bấm <b>KIỂM TRA</b>. (Bấm chữ khác nếu muốn đổi.)';
 document.getElementById('fz_'+gid).classList.add('open');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa chữ <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),
 inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),460);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter,okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>{
 s.classList.remove('sel');s.classList.add('dn');
 if(s.dataset.l===m.letter)s.classList.add('sgok');
 else if(s.dataset.l===sel[gid])s.classList.add('sgno');
 else s.classList.add('sgdim');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
 ? '🎉 <b>Tuyệt vời!</b> Đúng chữ <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
 : (okL?'⚠️ Đúng chữ <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
 :(okW?'⚠️ Sửa đúng từ nhưng chọn SAI chữ. Lỗi nằm ở chữ <b>'+m.letter+'</b>.'
 :'❌ Lỗi nằm ở chữ <b>'+m.letter+'</b>, phải sửa thành <b>'+m.corr+'</b>.'));
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
 if(maps[gid][j]===m.correct)el.classList.add('ok');
 else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 THIÊN TÀI, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu – lặn sâu tới đáy đại '+
 'dương kiến thức rồi đó! ⭐';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ xem lại collocation "exchange... '+
 'with" và câu điều kiện loại 1 nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại lời giải từng câu rồi làm lại nhé! 📚';
 gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
