<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 UNIT 10 · TEST 1 · P1 — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1035;--deep:#3A2472;--coral:#FF6EC7;--peach:#FFD166;--violet:#8B5CF6;
  --gold:#FFD166;--teal:#00E5C7;--good:#0E9F6E;--bad:#E63946;--glass:rgba(255,255,255,.9)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,#07051A 0%,#1B1035 20%,#3A2472 40%,#6B3FA0 60%,#B15FC9 80%,#FFC6E0 100%);
  background-size:100% 220%;background-attachment:fixed;animation:sky 30s ease-in-out infinite alternate}
@keyframes sky{from{background-position:50% 0%}to{background-position:50% 100%}}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.8;
  background-image:radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.4px),
   radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1.4px);
  background-size:60px 70px,90px 100px;background-position:10px 15px,40px 60px;animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{0%{opacity:.5}100%{opacity:1}}
/* ── HÀNH TINH / MẶT TRĂNG ── */
.sun{position:fixed;left:50%;top:4vh;transform:translateX(-50%);width:170px;height:170px;border-radius:50%;
  z-index:0;pointer-events:none;
  background:radial-gradient(circle at 40% 35%,#F3F0FF 6%,#C9BBFF 32%,#8B5CF6 62%,rgba(139,92,246,0) 76%);
  box-shadow:0 0 60px rgba(139,92,246,.5);animation:glow 7s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.85;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
/* ── THÀNH PHỐ TƯƠNG LAI ── */
.city{position:fixed;left:0;right:0;bottom:0;height:30vh;min-height:190px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:4px;opacity:.95}
.bd{position:relative;flex:0 0 auto;background:linear-gradient(180deg,#5B3FA8,#28184F);border-radius:8px 8px 0 0}
.bd::before{content:'';position:absolute;left:0;right:0;top:0;height:100%;
  background-image:radial-gradient(circle,rgba(0,229,199,.9) 1.6px,transparent 1.8px);
  background-size:13px 16px;background-position:5px 9px;opacity:.55;animation:win 4s steps(2) infinite}
@keyframes win{0%,100%{opacity:.4}50%{opacity:.85}}
.bd.spire{background:linear-gradient(180deg,#FF6EC7,#B23E8A);border-radius:50% 50% 8px 8px}
.bd.spire2{background:linear-gradient(180deg,#00E5C7,#0E8F7D);border-radius:8px 8px 8px 8px}
.tr2{position:relative;flex:0 0 auto;align-self:flex-end;font-size:26px;line-height:1;
  animation:sway 3.2s ease-in-out infinite alternate;transform-origin:bottom center;
  filter:drop-shadow(0 0 6px rgba(0,229,199,.6))}
.city2{position:fixed;left:0;right:0;bottom:0;height:20vh;min-height:110px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:4px;opacity:.5;filter:blur(.6px)}
.city2 .bd{background:linear-gradient(180deg,#8B5CF6,#3A2472)}
.city2 .tr2{font-size:18px;filter:none;opacity:.75}
/* ── UFO, DRONE & SAO BĂNG ── */
.swf{position:fixed;bottom:2vh;z-index:0;pointer-events:none;font-size:22px;
  animation:swim linear infinite;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
@keyframes swim{0%{transform:translateX(-10vw) scaleX(1)}49%{transform:translateX(100vw) scaleX(1)}
  50%{transform:translateX(100vw) scaleX(-1)}99%{transform:translateX(-10vw) scaleX(-1)}
  100%{transform:translateX(-10vw) scaleX(1)}}
.fly{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fo{position:absolute;bottom:-90px;animation:up linear infinite}
.fo i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes up{0%{transform:translateY(0);opacity:0}9%{opacity:.95}86%{opacity:.75}
  100%{transform:translateY(-118vh);opacity:0}}
@keyframes sway{from{transform:translateX(-16px) rotate(-7deg)}to{transform:translateX(16px) rotate(7deg)}}
.bal{position:relative;width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.05) 45%,
   color-mix(in srgb, var(--c1) 55%, transparent) 70%);
  border:1.5px solid rgba(255,255,255,.6);box-shadow:0 0 12px rgba(255,255,255,.5),inset 0 0 8px rgba(255,255,255,.5)}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:16px 14px 30vh}
h1,h2,.pill,.qn,.sbtn,.ck{font-family:'Fredoka',sans-serif;font-weight:700}
.gl{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:2px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 10px 30px rgba(15,5,40,.35)}
.hdr{padding:20px 20px 17px;text-align:center;margin:8px 0 18px}
.hdr h1{font-size:clamp(17px,4vw,28px);line-height:1.25;
  background:linear-gradient(90deg,var(--deep),var(--coral),var(--violet),var(--deep));
  background-size:280% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:shim 6s linear infinite}
@keyframes shim{0%{background-position:0%}100%{background-position:280%}}
.hdr .sub{display:inline-block;margin-top:8px;font-family:'Fredoka',sans-serif;font-size:.92rem;color:#fff;
  background:linear-gradient(135deg,var(--violet),var(--coral));padding:3px 16px;border-radius:999px}
.hdr p{font-size:.8rem;font-weight:700;color:var(--deep);margin-top:9px;line-height:1.75}
.sb{position:sticky;top:8px;z-index:9;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:18px;
  border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border:2px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(15,5,40,.24)}
.sb b{font-family:'Fredoka',sans-serif;font-size:1.14rem;color:var(--deep)}
.tr{flex:1;height:11px;background:rgba(139,92,246,.18);border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--violet),var(--coral));transition:width .45s}
.sec{padding:20px 17px 19px;margin-bottom:24px}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.pill{color:#fff;border-radius:999px;padding:3px 15px;font-size:.9rem;box-shadow:0 3px 10px rgba(15,5,40,.3)}
.st h2{font-size:1.08rem;color:var(--deep);font-family:'Fredoka',sans-serif}
.si{font-size:.85rem;font-weight:700;color:#6B4F9E;font-style:italic;margin:2px 0 15px;line-height:1.8}
.q{background:rgba(255,255,255,.9);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  border-radius:16px;padding:18px 18px 19px;margin-bottom:18px;
  box-shadow:0 4px 14px rgba(15,5,40,.18);border-left:5px solid var(--violet)}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:linear-gradient(135deg,var(--violet),var(--coral));color:#fff;
  border-radius:10px;min-width:32px;text-align:center;padding:1px 8px;margin-right:8px;font-size:.92rem}
.qt{font-weight:700;font-size:1.15rem;line-height:2.05}
.qt .bl{display:inline-block;min-width:100px;border-bottom:3px solid var(--violet);text-align:center;
  color:var(--deep);font-weight:900}
.src{background:#F1EBFF;border-left:4px solid var(--violet);border-radius:0 11px 11px 0;padding:10px 13px;
  margin-top:9px;font-weight:800;font-size:1.05rem;line-height:1.9}
.cue{background:#FFF6E3;border:2px dashed var(--gold);border-radius:11px;padding:10px 13px;margin-top:9px;
  font-weight:800;font-size:1.05rem;line-height:1.9;color:#8A5A00}
.tg{display:inline-block;background:#E4FBF6;border:1.5px solid var(--teal);color:#0B7A6A;border-radius:8px;
  padding:0 9px;font-size:.78rem;margin-left:6px;font-weight:800}
u{background:#E0D4FF;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800}
.ob u,.og u,.qt u{background:#CBB6FF;border-radius:3px;padding:0 1px;margin:0 -1px;font-weight:900;
  text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;text-decoration-color:var(--deep)}
/* ── TÌM & SỬA LỖI ── */
.segs{margin-top:13px;font-weight:700;font-size:1.08rem;line-height:2.6;
  background:#F1EBFF;border-left:4px solid var(--violet);border-radius:0 11px 11px 0;padding:12px 15px}
.sg{display:inline-block;background:#fff;border:2px solid var(--violet);border-radius:10px;padding:2px 9px;
  margin:0 2px;font-weight:800;font-size:1.02rem;cursor:pointer;transition:.14s;color:#5B3FA8;
  box-shadow:0 2px 5px rgba(139,92,246,.2)}
.sg b{display:inline-block;background:var(--violet);color:#fff;border-radius:6px;padding:0 6px;margin-right:6px;
  font-size:.75rem;font-family:'Fredoka',sans-serif}
.sg:hover:not(.dn){transform:translateY(-2px);background:#F6F1FF}
.sg.sel{border-color:var(--gold);background:#FFF6E3;box-shadow:0 0 0 3px rgba(255,210,102,.4)}
.sg.dn{cursor:default;transform:none}
.sg.sgok{background:#D6F5E6;border-color:var(--good);color:#08663f}.sg.sgok b{background:var(--good)}
.sg.sgno{background:#FFE3E3;border-color:var(--bad);color:#96140f}.sg.sgno b{background:var(--bad)}
.sg.sgdim{opacity:.4}
.fz{max-height:0;overflow:hidden;transition:max-height .32s ease;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fz.open{max-height:220px;margin-top:12px}
.fzl{font-weight:900;color:#8A5A00;font-size:.95rem;width:100%}
.hint{margin-top:10px;background:#FFF6E3;border:2px dashed var(--gold);border-radius:10px;padding:8px 12px;
  font-size:.91rem;font-weight:700;color:#8A5A00;line-height:1.8}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:680px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.og{grid-template-columns:1fr}}
.ob{background:#FFFDFE;border:2px solid rgba(139,92,246,.4);border-radius:14px;padding:12px 14px;
  font-family:'Nunito';font-size:1.08rem;font-weight:800;cursor:pointer;transition:.15s;text-align:center;
  line-height:1.6;color:var(--ink);box-shadow:0 3px 8px rgba(139,92,246,.14)}
.ob:hover:not(.dn){transform:translateY(-2px) scale(1.02);background:#F6F1FF;border-color:var(--violet)}
.ob.ok{background:#D6F5E6;border-color:var(--good);color:#08663f}
.ob.no{background:#FFE3E3;border-color:var(--bad);color:#96140f}
.ob.dim{opacity:.42}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ti{flex:1;min-width:200px;padding:10px 14px;border:2px solid rgba(139,92,246,.4);border-radius:11px;
  font-family:'Nunito';font-size:1rem;font-weight:800;outline:none;background:#FFFDFE;color:var(--ink)}
.ti::placeholder{color:#B8AEDD}
.ti:focus{border-color:var(--violet);background:#fff}
.ti.ok{border-color:var(--good);background:#D6F5E6}.ti.no{border-color:var(--bad);background:#FFE3E3}
.ck{background:linear-gradient(135deg,var(--violet),var(--coral));color:#fff;border:none;border-radius:11px;
  padding:10px 20px;font-size:.97rem;cursor:pointer;box-shadow:0 4px 12px rgba(139,92,246,.4);white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.42;cursor:default}
.ex{display:none;margin-top:13px;background:#FFFDFE;border:1.5px solid rgba(139,92,246,.3);border-radius:14px;
  padding:15px 16px;font-size:1rem;line-height:1.85}
.ex.show{display:block}
.kb{background:#D6F5E6;border:1.5px solid var(--good);border-radius:9px;padding:8px 12px;margin-bottom:10px;
  font-weight:900;color:#08663f;line-height:1.75}
.vnt{background:#FFF1DE;border-left:4px solid var(--peach);border-radius:0 10px 10px 0;padding:9px 13px;
  margin-bottom:11px;font-weight:800;color:#8A4B00;line-height:1.85}
.ex ol{padding-left:20px}
.ex ol li{margin-bottom:12px;line-height:1.9}
.ex ol li:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#fff;border:1.5px solid #E7DEFF;border-radius:10px;padding:8px 11px;line-height:1.7;font-weight:700}
.p-word{color:#1D6FB8;font-weight:800}
.hl-green{color:var(--good);font-weight:900}
.hl-red{color:var(--bad);font-weight:900}
.wt{background:#E4FBF6;color:#0B7A6A;padding:1px 6px;border-radius:5px;font-size:.79em;font-weight:800;margin:0 4px}
.p-mean{color:#C2410C;font-weight:700}
.p-phonetic{color:#5B3FA8;background:rgba(91,63,168,.09);border-radius:4px;padding:1px 6px;
  font-family:'Courier New',monospace;font-size:.9em;font-weight:800}
.p-grammar{text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2.5px;
  text-underline-offset:3px;font-weight:700}
.note{background:#EEF2F7;border-left:4px solid #7A8FA6;border-radius:0 8px 8px 0;padding:8px 12px;margin-top:9px;
  font-size:.9rem;font-weight:700;color:#3D5166;line-height:1.75}
.sub{text-align:center;margin-top:24px}
.sbtn{background:linear-gradient(135deg,var(--teal),var(--violet),var(--coral));color:#fff;border:none;
  border-radius:999px;padding:13px 40px;font-size:1.18rem;cursor:pointer;box-shadow:0 8px 22px rgba(139,92,246,.45)}
.sbtn:hover{transform:translateY(-3px)}
.ov{position:fixed;inset:0;background:rgba(10,5,30,.72);z-index:99;display:none;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(5px)}
.ov.on{display:flex}
.mb{background:rgba(255,255,255,.96);border-radius:22px;box-shadow:0 14px 44px rgba(15,5,40,.4);padding:24px;
  width:420px;max-width:96%;text-align:center;border:2px solid #fff;max-height:90vh;overflow-y:auto}
.mb h2{font-size:1.3rem;color:var(--deep);margin-bottom:11px}
.mb input{width:100%;padding:11px;border:2px solid rgba(139,92,246,.4);border-radius:11px;font-family:'Nunito';
  font-weight:800;font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#FFE3E3;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Fredoka',sans-serif;font-size:1.2rem;color:var(--deep);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Fredoka',sans-serif;font-size:2.5rem;color:var(--violet)}
.mb .rt{font-weight:900;color:#5B3FA8;font-size:1.05rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.92rem;line-height:1.65;margin-bottom:10px;color:#5A4A66}
.mb img{width:100%;max-width:250px;border-radius:13px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="sun"></div>
<div class="city2" id="city2"></div>
<div class="city" id="city"></div>
<div class="fly" id="fly"></div>
<div class="wrap">
  <div class="hdr gl">
    <h1>🚀 OUR HOUSES IN THE FUTURE</h1>
    <div class="sub">UNIT 10 · TEST 1 · P1 · SMART HOME 2099</div>
    <p>🎓 Giáo viên tạo: Ms. Chí Nên &nbsp;·&nbsp; <b>A. LANGUAGE FOCUS (I–VI)</b> + <b>C. WRITING (I–III)</b><br>

</div>
<div class="ov" id="nOv"><div class="mb"><h2>✍️ Nhập tên của con</h2>
  <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">

<script>
/* ══ THÀNH PHỐ TƯƠNG LAI + UFO + DRONE + SAO ══ */
(function(){
 function skyline(el,n,minH,maxH,minW,maxW,antSize){
  for(let i=0;i<n;i++){
   if(i%5===4){const t=document.createElement('div');t.className='tr2';
    t.textContent='📡';t.style.fontSize=antSize+'px';
    t.style.animationDelay=(-Math.random()*3).toFixed(1)+'s';el.appendChild(t);continue}
   const b=document.createElement('div');b.className='bd'+(i%9===3?' spire':(i%9===7?' spire2':''));
   b.style.width=(minW+Math.random()*(maxW-minW)).toFixed(0)+'px';
   b.style.height=(minH+Math.random()*(maxH-minH)).toFixed(0)+'px';
   el.appendChild(b);
  }
 }
 skyline(document.getElementById('city2'),22,34,86,24,52,16);
 skyline(document.getElementById('city'),18,50,175,28,62,24);
 for(let i=0;i<4;i++){
  const s=document.createElement('div');s.className='swf';
  s.textContent=['🛸','🚁','🛰️','✨'][i%4];
  s.style.bottom=(4+Math.random()*24)+'vh';
  s.style.animationDuration=(22+Math.random()*20).toFixed(1)+'s';
  s.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  document.body.appendChild(s);
 }
 const L=document.getElementById('fly');
 const C=[['#8B5CF6','#FF6EC7'],['#00E5C7','#8B5CF6'],['#FFD166','#FF6EC7'],
          ['#00E5C7','#FFD166'],['#FF6EC7','#8B5CF6']];
 for(let i=0;i<22;i++){
  const d=document.createElement('div');d.className='fo';
  const inner=document.createElement('i');
  if(i%6===5){inner.textContent=['✨','⭐'][i%2];
   inner.style.fontSize=(13+Math.random()*11).toFixed(0)+'px';}
  else if(i%9===4){inner.textContent=['🛸','🛰️','🚀'][i%3];inner.style.fontSize=(16+Math.random()*12).toFixed(0)+'px';}
  else{const b=document.createElement('div');b.className='bal';
   b.style.setProperty('--s',(8+Math.random()*16).toFixed(0)+'px');
   b.style.setProperty('--c1',C[i%C.length][0]);b.style.setProperty('--c2',C[i%C.length][1]);
   inner.appendChild(b);}
  d.style.left=(Math.random()*93)+'%';
  d.style.animationDuration=(15+Math.random()*16).toFixed(1)+'s';
  d.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  inner.style.animationDuration=(3+Math.random()*3).toFixed(1)+'s';
  d.appendChild(inner);L.appendChild(d);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#FFD166','#FF6EC7','#8B5CF6','#00E5C7','#B98BFF'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fil(sec,num,q,correct,accept,ex,ph){Q.push({t:'fill',sec,num,q,correct,accept,ex,ph:ph||'Điền...'})}
function fxq(sec,num,pre,parts,letter,corr,accept,ex){Q.push({t:'fix',sec,num,pre,parts,letter,corr,accept,ex})}
function T(w,ty,m){return "<div><span class='p-word'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TG(w,ty,m){return "<div><span class='hl-green'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TP(w,ipa,m){return "<div><span class='p-word'>"+w+"</span> <span class='p-phonetic'>"+ipa+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TPG(w,ipa,m){return "<div><span class='hl-green'>"+w+"</span> <span class='p-phonetic'>"+ipa+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function EX(kb,vn,cells,right,wrong){
 return '<div class="kb">✅ '+kb+'</div><div class="vnt">💬 <b>Dịch:</b> '+vn+'</div>'+
  '<ol><li><b>🔎 Phân tích đáp án:</b><div class="grid2">'+cells+'</div></li>'+

  '<li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class="p-grammar">'+wrong+'</span></li></ol>'}

 'Con của cô Black có giúp cô ấy làm việc nhà không?',
 T('homework','n','bài tập về nhà (làm ở trường giao, không phải việc NHÀ)')+
 T('teamwork','n','làm việc nhóm (không liên quan đến việc nhà)')+
 T('classwork','n','bài tập trên lớp (không liên quan)')+
 TG('housework','n','việc nhà (house + work — đúng ngữ cảnh “at home”)'),

s3(17,'Emily: “Look at my new smartwatch.” – Richard: “___”','Wow! It looks so cool.',
 ['Wow! It looks so cool.','Great idea!','Sorry, I can’t.','I’d love to. When shall we meet?'],
 'Emily: “Nhìn đồng hồ thông minh mới của tớ này.” – Richard: “___”',
 TG('Wow! It looks so cool.','answer','Ồ! Trông ngầu quá! (lời khen phù hợp khi được khoe đồ mới)')+
 T('Great idea!','answer','Ý kiến hay đấy! (dùng để phản hồi một ĐỀ XUẤT, không phải khi xem đồ vật)')+
 T('Sorry, I can’t.','answer','Xin lỗi, tớ không thể. (từ chối lời mời, không liên quan)')+
 T('I’d love to. When shall we meet?','answer','Tớ rất muốn. Khi nào gặp nhau nhỉ? (đáp lại lời RỦ, không phải khoe đồ)'),
 'Khi ai đó khoe một món đồ mới, phản hồi tự nhiên nhất là một LỜI KHEN → “Wow! It looks so cool.”',
 '“Great idea!” ✘ dùng để phản hồi một Ý TƯỞNG/ĐỀ XUẤT. “Sorry, I can’t.” và “I’d love to…” ✘ đều là phản '+
 'hồi cho một LỜI MỜI/RỦ, không phù hợp khi ai đó chỉ đang khoe đồng hồ.');

/* ═════ IV — TÌM & SỬA LỖI (3) ═════ */
const s4=(n,pre,parts,aL,corr,accept,vn,pk,r,w)=>fxq('S4',n,pre,parts,aL,corr,accept,
 EX('Lỗi ở chữ <b>'+aL+'</b> ➔ '+pk.k,vn,pk.c,r,w));
s4(18,'Michael ',[['A','thinks',' we '],['B','will',' travel '],['C','at',' Neptune '],['D','one day','.']],
 'C','to',['to'],
 'Michael nghĩ chúng ta sẽ du hành đến Sao Hải Vương một ngày nào đó.',
 {k:'<span class="hl-red">at</span> ➔ <span class="hl-green">to</span>',
  c:T('thinks / will / one day','v / modal / adv','ĐÚNG, giữ nguyên')+
    TG('to','prep','travel TO + nơi chốn = du hành ĐẾN nơi nào')+
    T('at','prep','SAI vì "travel at" không diễn tả điểm ĐẾN của chuyến đi')},
 'Cụm cố định <b>travel TO + nơi chốn</b> = du hành đến một nơi nào đó → phải sửa “at” thành “to”.',
 'Lỗi nằm ở ô C: “at Neptune” ✘ không diễn tả đúng ý ĐẾN một hành tinh — phải dùng giới từ chỉ điểm đến “to”. '+
 'Ba ô A, B, D đều đúng.');
s4(19,'The lights ',[['A','aren’t',' on, '],['B','so',' there '],['C','doesn’t might be',' anyone in '],
 ['D','the','office right now.']],'C','might not be',['might not be'],
 'Đèn không sáng, vì vậy có lẽ không có ai trong văn phòng ngay bây giờ.',
 {k:'<span class="hl-red">doesn’t might be</span> ➔ <span class="hl-green">might not be</span>',
  c:T('aren’t / so / the','v / conj / art','ĐÚNG, giữ nguyên')+
    TG('might not be','modal (phủ định)','có lẽ không có (phủ định của động từ khiếm khuyết “might”)')+
    T('doesn’t might be','×','SAI — không được dùng “doesn’t” cùng với động từ khiếm khuyết “might”')},
 'Phủ định của động từ khiếm khuyết (might, can, must…) chỉ cần thêm <b>not</b> ngay sau nó → “might NOT be”, '+
 'không mượn thêm “doesn’t”.',
 'Lỗi nằm ở ô C: “doesn’t might be” ✘ là lỗi CHIA ĐỘNG TỪ SAI — động từ khiếm khuyết không bao giờ đi cùng '+
 '“do/does/did”. Ba ô A, B, D đều đúng.');
s4(20,'',[['A','All',' the members '],['B','of',' our team '],['C','are excited',' to get '],
 ['D','his','new uniforms.']],'D','their',['their'],
 'Tất cả các thành viên trong đội của chúng tôi đều rất phấn khích khi nhận đồng phục mới.',
 {k:'<span class="hl-red">his</span> ➔ <span class="hl-green">their</span>',
  c:T('All / of / are excited','det / prep / v','ĐÚNG, giữ nguyên')+
    TG('their','det','của họ (tính từ sở hữu số nhiều, khớp với “all the members” — nhiều người)')+
    T('his','det','SAI — chỉ MỘT người, không khớp với “all the members” (nhiều người)')},
 '“All the members of our team” (tất cả thành viên trong đội) là số NHIỀU → tính từ sở hữu phải là <b>their</b>, '+
 'không phải “his” (của một người).',
 'Lỗi nằm ở ô D: “his” ✘ chỉ dùng cho MỘT người, trong khi chủ ngữ “all the members” chỉ NHIỀU người. Ba ô '+
 'A, B, C đều đúng.');

/* ═════ V — DẠNG CỦA ĐỘNG TỪ (5) ═════ */
const s5=(n,s,root,a,acc,vn,c,r,w)=>fil('S5',n,'<b>'+n+'.</b> '+s+' <span class="tg">('+root+')</span>',

s5(21,'<span class="bl">?</span> she <span class="bl">?</span> her grandparents every summer?','visit',
 'Does...visit',['does she visit','does...visit'],
 'Cô ấy có ghé thăm ông bà mỗi mùa hè không?',
 T('every summer','adv','mỗi mùa hè → dấu hiệu THÌ HIỆN TẠI ĐƠN (thói quen)')+
 TG('Does…visit','structure','trợ động từ “Does” (chủ ngữ “she” số ít) + động từ nguyên thể “visit”')+
 T('visit','v','ghé thăm (từ gốc đề cho)'),
 '“every summer” là dấu hiệu thói quen lặp lại → THÌ HIỆN TẠI ĐƠN; câu hỏi với chủ ngữ “she” mượn trợ động '+
 'từ <b>Does</b>, động từ giữ nguyên thể “visit”.',
 'Không dùng “Is she visiting” ✘ vì đây là THÓI QUEN lặp lại (every summer), không phải hành động đang diễn '+
 'ra. Không quên đổi “visits” về nguyên thể sau khi đã mượn “Does”.');
s5(22,'He thinks the weather <span class="bl">?</span> sunny tomorrow.','be','will be',['will be'],
 'Cậu ấy nghĩ thời tiết sẽ nắng vào ngày mai.',
 T('tomorrow','adv','ngày mai → dấu hiệu THÌ TƯƠNG LAI ĐƠN')+
 TG('will be','v (tương lai đơn)','sẽ là (dự đoán không có căn cứ chắc chắn, chỉ là suy nghĩ cá nhân)')+
 T('be','v','là, thì (từ gốc đề cho)'),
 '“tomorrow” (ngày mai) + đây là một DỰ ĐOÁN dựa trên suy nghĩ cá nhân (“He thinks”) → dùng tương lai đơn '+
 '<b>will be</b>.',
 'Không dùng “is” ✘ (hiện tại đơn, sai vì đang nói về ngày MAI) hay “is being” ✘ — với dự đoán về tương lai '+
 'dựa trên ý kiến cá nhân, cấu trúc chuẩn là “will + V”.');
s5(23,'We bought a new car because the old one <span class="bl">?</span> too much noise.','make','made',['made'],
 'Chúng tôi đã mua một chiếc xe mới vì chiếc cũ gây ra quá nhiều tiếng ồn.',
 T('bought','v (quá khứ)','đã mua → khẳng định vế sau cũng ở QUÁ KHỨ')+
 TG('made','v (quá khứ đơn)','đã gây ra (tiếng ồn) — quá khứ BẤT QUY TẮC của “make”')+
 T('make','v','làm, gây ra (từ gốc đề cho)'),
 'Vế trước “bought” đã ở QUÁ KHỨ ĐƠN, nêu lý do → vế sau cũng chia quá khứ: “make” bất quy tắc → <b>made</b>.',
 'Không thêm “-ed” thành “maked” ✘ vì “make” không theo quy tắc — cần nhớ cột quá khứ: make – made – made.');
s5(24,'<span class="bl">?</span> you <span class="bl">?</span> to the Halloween party next weekend?','come',

 'Bạn có đến bữa tiệc Halloween vào cuối tuần tới không?',
 T('next weekend','adv','cuối tuần tới → dấu hiệu THÌ TƯƠNG LAI ĐƠN')+
 TG('Will…come','structure','trợ động từ “Will” + chủ ngữ “you” + động từ nguyên thể “come”')+
 T('come','v','đến (từ gốc đề cho)'),
 '“next weekend” (cuối tuần tới) là dấu hiệu THÌ TƯƠNG LAI ĐƠN → câu hỏi đảo <b>Will</b> lên đầu, động từ giữ '+
 'nguyên thể “come”.',
 'Không dùng “Do you come” ✘ (hiện tại đơn, sai thì) hay “Are you coming” ✘ (không sai hẳn nhưng không khớp '+
 'với đáp án yêu cầu cấu trúc “will”).');
s5(25,'Connor <span class="bl">?</span> the dishwasher in the kitchen at present.','fix','is fixing',
 ['is fixing'],

 TG('is fixing','v (hiện tại tiếp diễn)','đang sửa (is + V-ing, chủ ngữ “Connor” số ít)')+
 T('fix','v','sửa chữa (từ gốc đề cho)'),
 '“at present” là dấu hiệu HIỆN TẠI TIẾP DIỄN; chủ ngữ số ít “Connor” → dùng “is” + V-ing: <b>is fixing</b>.',
 'Không chia “fixes” ✘ (hiện tại đơn) vì “at present” chỉ rõ đây là việc đang diễn ra NGAY LÚC NÀY, không '+

const s6=(n,s,root,a,acc,vn,c,r,w)=>fil('S6',n,'<b>'+n+'.</b> '+s+' <span class="tg">('+root+')</span>',

s6(26,'These <span class="bl">?</span> headphones connect to my phone via Bluetooth.','wire','wireless',
 ['wireless'],
 'Chiếc tai nghe không dây này kết nối với điện thoại của tôi qua Bluetooth.',
 T('wire','n','dây điện (từ gốc đề cho, DANH TỪ)')+TG('wireless','adj','không dây (wire + less = KHÔNG có dây)')+
 T('These ___ headphones','structure','đứng giữa “These” và danh từ “headphones” → cần TÍNH TỪ'),
 'Chỗ trống đứng trước danh từ “headphones” → cần TÍNH TỪ; đuôi “-less” mang nghĩa PHỦ ĐỊNH (không có) → '+
 '“wireless” (không dây), khớp với việc kết nối qua Bluetooth.',
 'Không dùng “wire” ✘ (danh từ) ở vị trí bổ nghĩa cho danh từ khác. Đuôi “-less” (wireless, careless) khác '+
 'hẳn đuôi “-ful” (mang nghĩa CÓ) — cần phân biệt rõ hai đuôi này.');
s6(27,'We found a great <span class="bl">?</span> to film our video.','locate','location',['location'],
 'Chúng tôi đã tìm được một địa điểm tuyệt vời để quay video của mình.',
 T('locate','v','xác định vị trí, đặt tại (từ gốc đề cho, ĐỘNG TỪ)')+
 TG('location','n','địa điểm (locate + ion)')+
 T('a great ___','structure','đứng sau mạo từ “a” + tính từ “great” → cần DANH TỪ'),
 'Chỗ trống đứng sau “a great” và làm tân ngữ của “found” → cần DANH TỪ, thêm đuôi “-ion” vào “locate” để '+
 'được “location”.',
 'Không dùng “locate” ✘ (động từ) ở vị trí tân ngữ sau mạo từ “a” — vị trí này bắt buộc là danh từ.');
s6(28,'Pretty flowers <span class="bl">?</span> the small cottage.','surroundings','surround',['surround'],
 'Những bông hoa xinh đẹp bao quanh ngôi nhà nhỏ.',

 TG('surround','v','bao quanh (ĐỘNG TỪ, chia theo chủ ngữ số nhiều “flowers”)')+
 T('Pretty flowers ___ the cottage','structure','câu chưa có ĐỘNG TỪ chính'),
 'Câu chưa có động từ chính, chủ ngữ “Pretty flowers” số nhiều cần một ĐỘNG TỪ → “surround” (bao quanh), '+
 'không phải danh từ “surroundings”.',
 'Không dùng “surroundings” ✘ (danh từ) làm vị ngữ của câu — câu cần một ĐỘNG TỪ để diễn tả hành động '+
 '“bao quanh”.');
s6(29,'Will our <span class="bl">?</span> change a lot in 500 years?','appear','appearance(s)',

 T('our ___','structure','đứng sau tính từ sở hữu “our” và làm CHỦ NGỮ → cần DANH TỪ'),
 'Chỗ trống đứng sau “our” và làm CHỦ NGỮ của câu hỏi → cần DANH TỪ: “appearance” (số ít) hoặc '+
 '“appearances” (số nhiều) — cô nhận cả hai.',
 'Không dùng “appear” ✘ (động từ) làm chủ ngữ — vị trí này bắt buộc là danh từ, thêm đuôi “-ance” vào '+
 '“appear”.');
s6(30,'My dream house will only use <span class="bl">?</span> energy to power everything.','sun','solar',
 ['solar'],
 'Ngôi nhà mơ ước của tôi sẽ chỉ sử dụng năng lượng mặt trời để cấp điện cho mọi thứ.',
 T('sun','n','mặt trời (từ gốc đề cho, DANH TỪ)')+TG('solar','adj','thuộc về mặt trời (solar energy = năng lượng mặt trời)')+
 T('___ energy','structure','đứng trước danh từ “energy” → cần TÍNH TỪ'),
 'Chỗ trống đứng trước danh từ “energy” → cần TÍNH TỪ; “sun” chuyển thành tính từ là “solar” (không phải '+
 'thêm đuôi thông thường, đây là dạng đặc biệt cần nhớ).',
 'Không dùng “sun” ✘ (danh từ) để bổ nghĩa cho “energy” — phải dùng dạng tính từ đặc biệt “solar”, không '+
 'phải “sunny” (nghĩa là “có nắng”, dùng cho thời tiết).');

c1(44,'They / move / modern flat / the city / last year / .','They moved to a modern flat in the city last year.',

 'đều khiến câu sai ngữ pháp.');

  'we wont need to buy curtains because these smart windows will change colours'],

/* ══ DỰNG TRANG ══ */
const TOTAL=Q.length;let answered=0,score=0;const done={},maps={},sel={};
function bump(){document.getElementById('fb').style.width=(answered/TOTAL*100)+'%';
 document.getElementById('sc').textContent=score;
 const p=answered?score/answered:1;
 document.getElementById('md').textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){
 const d=document.createElement('div');d.className='sec gl';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+
  '</span><h2>'+title+'</h2></div><div class="si">'+ins+'</div>';
 APP.appendChild(d);CUR=d}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

sec('linear-gradient(135deg,#8B5CF6,#FF6EC7)','I','🔊 Chọn từ có phần gạch chân phát âm khác','(3 câu)');render('S1');
sec('linear-gradient(135deg,#FFD166,#8B5CF6)','II','🎯 Chọn từ có trọng âm khác','(2 câu)');render('S2');
sec('linear-gradient(135deg,#FF6EC7,#00E5C7)','III','✅ Chọn từ/cụm từ đúng nhất','(12 câu)');render('S3');
sec('linear-gradient(135deg,#00E5C7,#8B5CF6)','IV','🔍 Tìm &amp; sửa lỗi sai (A · B · C · D)',
 'Mỗi câu có ĐÚNG MỘT lỗi. <b>Bước 1:</b> bấm vào chữ cái con cho là sai. <b>Bước 2:</b> gõ phần đã sửa vào '+
 'ô vừa hiện ra rồi bấm KIỂM TRA. Phải đúng CẢ HAI mới được điểm. (3 câu)');render('S4');
sec('linear-gradient(135deg,#FF6EC7,#FFD166)','V','🔧 Viết dạng đúng của động từ trong ngoặc','(5 câu)');render('S5');
sec('linear-gradient(135deg,#8B5CF6,#00E5C7)','VI','🧱 Viết dạng đúng của từ trong ngoặc','(5 câu)');render('S6');
sec('linear-gradient(135deg,#00E5C7,#FFD166)','C · I','✏️ Viết câu từ các từ gợi ý (cues)','(3 câu)');render('C1');
sec('linear-gradient(135deg,#FFD166,#FF6EC7)','C · II','❓ Đặt câu hỏi cho phần gạch chân','(3 câu)');render('C2');
sec('linear-gradient(135deg,#FF6EC7,#8B5CF6)','C · III','✍️ Viết lại câu, nghĩa không đổi','(3 câu)');render('C3');
document.getElementById('tt').textContent=TOTAL;bump();

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="qt">'+h+'Tìm chữ cái chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="segs" id="sg_'+gid+'">'+(m.pre||'')+
   m.parts.map(p=>'<span class="sg" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     '<b>'+p[0]+'</b>'+p[1]+'</span>'+(p[2]||'')).join('')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào chữ cái con cho là SAI.</div>'+
   '<div class="fz" id="fz_'+gid+'"><span class="fzl" id="fl_'+gid+'"></span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  c.querySelector('#b_'+gid).onclick=()=>chkf(gid);
  c.querySelector('#i_'+gid).addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Đã chọn chữ <b>'+L+'</b>. <b>Bước 2:</b> gõ phần đã sửa rồi '+
  'bấm <b>KIỂM TRA</b>. (Bấm chữ khác nếu muốn đổi.)';
 document.getElementById('fz_'+gid).classList.add('open');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa chữ <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),
       inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),460);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter,okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>{
  s.classList.remove('sel');s.classList.add('dn');
  if(s.dataset.l===m.letter)s.classList.add('sgok');
  else if(s.dataset.l===sel[gid])s.classList.add('sgno');
  else s.classList.add('sgdim');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
  ? '🎉 <b>Tuyệt vời!</b> Đúng chữ <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
  : (okL?'⚠️ Đúng chữ <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
       :(okW?'⚠️ Sửa đúng từ nhưng chọn SAI chữ. Lỗi nằm ở chữ <b>'+m.letter+'</b>.'
            :'❌ Lỗi nằm ở chữ <b>'+m.letter+'</b>, phải sửa thành <b>'+m.corr+'</b>.'));
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 THIÊN TÀI, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu – ngôi nhà tương lai của con '+
  'quá đỉnh! 🚀';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ xem lại “will/might” và cụm “travel '+
  'TO” nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại lời giải từng câu rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
