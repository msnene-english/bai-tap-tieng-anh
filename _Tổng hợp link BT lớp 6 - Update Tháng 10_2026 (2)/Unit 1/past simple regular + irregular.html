<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Past simple: regular and irregular — 60 câu | Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0D0722;--blossom:#FFB7C5;--blossom2:#FF8FAD;--teal:#1AFFD5;--purple:#C77DFF;--gold:#FFD700;--rose:#FF6B9D;
  --correct:#4ADE80;--wrong:#F87171;--text:#E8D5F5;--soft:#9B7BC4;--card:rgba(30,10,60,.72)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;min-height:100vh;color:var(--text);overflow-x:hidden;background:var(--bg1)}
.sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(80,30,120,.55) 0%,transparent 60%),
  radial-gradient(ellipse 60% 50% at 80% 10%,rgba(20,40,100,.5) 0%,transparent 60%),
  radial-gradient(ellipse 100% 60% at 50% 100%,rgba(40,10,80,.4) 0%,transparent 60%),
  linear-gradient(170deg,#0D0722 0%,#1A0D38 35%,#0F1628 65%,#0D0722 100%);animation:skyBreath 16s ease-in-out infinite alternate}
@keyframes skyBreath{0%{filter:brightness(1) hue-rotate(0deg)}100%{filter:brightness(1.07) hue-rotate(8deg)}}
.moon{position:fixed;top:6%;right:8%;width:80px;height:80px;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 35% 35%,#FFFACD,#FFE87C,#FFD700);
  box-shadow:0 0 40px rgba(255,215,0,.35),0 0 80px rgba(255,215,0,.12);animation:moonGlow 5s ease-in-out infinite alternate}
@keyframes moonGlow{0%{box-shadow:0 0 40px rgba(255,215,0,.35),0 0 80px rgba(255,215,0,.12)}100%{box-shadow:0 0 60px rgba(255,215,0,.5),0 0 120px rgba(255,215,0,.2)}}
#star-canvas{position:fixed;inset:0;z-index:1;pointer-events:none}
#petal-canvas{position:fixed;inset:0;z-index:2;pointer-events:none}
.lantern{position:fixed;z-index:2;pointer-events:none;width:22px;height:30px;border-radius:40% 40% 35% 35%;
  box-shadow:0 0 20px currentColor;animation:lanternSway ease-in-out infinite alternate}
@keyframes lanternSway{0%{transform:rotate(-6deg) translateY(0)}100%{transform:rotate(6deg) translateY(-4px)}}
.wrapper{position:relative;z-index:10;max-width:920px;margin:0 auto;padding:20px 16px 120px}
.hdr{text-align:center;padding:22px 24px 18px;margin-bottom:22px;background:rgba(20,5,45,.82);backdrop-filter:blur(20px);
  border:1px solid rgba(255,183,197,.2);border-radius:26px;position:relative;overflow:hidden;
  box-shadow:0 0 60px rgba(199,125,255,.07),0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,183,197,.1)}
.hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,transparent,#FFB7C5,#C77DFF,#1AFFD5,#FFD700,transparent)}
.hdr-title{font-family:'Comfortaa',sans-serif;font-size:1.28rem;font-weight:700;line-height:1.6;
  background:linear-gradient(135deg,#FFB7C5,#C77DFF,#1AFFD5,#FFD700,#FFB7C5);background-size:300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 6s linear infinite;letter-spacing:1px;margin-bottom:5px}
@keyframes shimmer{0%{background-position:0%}100%{background-position:300%}}
.hdr-sub{font-size:.8rem;color:var(--soft);font-weight:700;letter-spacing:1.2px}
.teacher-tag{display:inline-block;margin-top:8px;background:rgba(255,183,197,.08);border:1px solid rgba(255,183,197,.25);
  border-radius:20px;padding:3px 16px;font-size:.73rem;color:#FFCCD8;font-weight:800}
.score-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.sc-chip{background:rgba(20,5,45,.75);border:1px solid rgba(199,125,255,.2);border-radius:14px;padding:8px 20px;text-align:center;font-weight:800;backdrop-filter:blur(10px)}
.sc-chip .lbl{font-size:.65rem;color:var(--soft);letter-spacing:1px;display:block}
.sc-chip .val{font-size:1.25rem}
.sec-hdr{display:flex;align-items:flex-start;gap:14px;margin:30px 0 14px;padding:14px 20px;background:rgba(20,5,45,.78);
  border-radius:18px;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.sec-hdr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;background:var(--purple)}
.sec-icon{font-size:1.5rem;flex-shrink:0}
.sec-title{font-family:'Comfortaa',sans-serif;font-size:.98rem;font-weight:700;margin-bottom:3px;color:var(--gold);line-height:1.55}
.sec-desc{font-size:.82rem;color:var(--soft);font-weight:600;line-height:1.7}
.theory{background:rgba(20,5,45,.72);border:1px dashed rgba(255,215,0,.4);border-radius:18px;padding:16px 18px;margin-bottom:16px;backdrop-filter:blur(12px)}
.theory h3{font-family:'Comfortaa',sans-serif;font-size:.98rem;font-weight:700;color:var(--gold);margin-bottom:10px;line-height:1.55}
.trow{background:rgba(255,255,255,.035);border-left:3px solid var(--blossom);border-radius:0 11px 11px 0;padding:8px 13px;margin-bottom:8px;font-size:.94rem;line-height:1.85;font-weight:600}
.trow b{color:var(--blossom)}
.trow .eg{display:inline-block;background:rgba(26,255,213,.09);border:1px solid rgba(26,255,213,.3);border-radius:9px;padding:1px 10px;font-weight:800;color:#8FF5E4;margin:2px 2px 0 0}
.ttab{width:100%;border-collapse:collapse;margin:8px 0;font-size:.89rem}
.ttab th{background:rgba(199,125,255,.25);color:#EBD9FF;padding:6px 8px;border:1px solid rgba(199,125,255,.3);font-weight:800;font-size:.81rem}
.ttab td{background:rgba(0,0,0,.3);padding:6px 8px;border:1px solid rgba(199,125,255,.18);font-weight:700;line-height:1.65}
.ttab td b{color:var(--teal)}
.ttab td s{color:#FCA5A5}
.ttip{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.35);border-radius:12px;padding:9px 13px;font-size:.92rem;font-weight:700;line-height:1.85;color:#A7F3D0}
.twarn{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.35);border-radius:12px;padding:9px 13px;font-size:.92rem;font-weight:700;line-height:1.85;color:#FCA5A5;margin-top:8px}
.twarn s{color:#FCA5A5}
.q-card{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(255,183,197,.1);border-radius:20px;
  padding:18px 18px 14px;margin-bottom:14px;box-shadow:0 4px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04)}
.q-num{font-size:.64rem;font-weight:900;letter-spacing:2px;margin-bottom:9px;color:var(--purple)}
.q-text{font-size:1.03rem;font-weight:700;line-height:1.85;color:var(--text);margin-bottom:12px}
.q-text b{color:var(--gold)}
.q-text i{color:var(--soft)}
.q-text .gap{display:inline-block;min-width:96px;border-bottom:2px dashed var(--teal)}
.q-text .cue{display:inline-block;background:rgba(255,110,180,.18);border:1px solid rgba(255,110,180,.5);border-radius:9px;padding:0 10px;font-weight:900;color:#FFC2E0;font-size:.92rem}
.prompt{background:rgba(0,0,0,.32);border-left:4px solid var(--teal);border-radius:0 12px 12px 0;padding:9px 14px;margin-bottom:10px;
  font-size:1.02rem;font-weight:800;line-height:1.75;color:#8FF5E4}
.mcq-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px}
.mcq-grid.c1{grid-template-columns:1fr}
.mcq-grid.c2{grid-template-columns:1fr 1fr}
@media(max-width:620px){.mcq-grid,.mcq-grid.c2{grid-template-columns:1fr}}
.mcq-btn{background:rgba(40,10,80,.7);border:1.5px solid rgba(199,125,255,.18);border-radius:14px;padding:11px 14px;
  font-family:'Nunito',sans-serif;font-size:.96rem;font-weight:700;color:var(--text);cursor:pointer;text-align:center;transition:all .22s;line-height:1.6}
.mcq-btn:hover:not(:disabled){border-color:rgba(199,125,255,.5);background:rgba(60,15,110,.8);transform:translateY(-2px)}
.mcq-btn.ok{border-color:var(--correct);background:rgba(5,40,20,.8);color:#A7F3D0}
.mcq-btn.no{border-color:var(--wrong);background:rgba(40,5,10,.8);color:#FCA5A5;animation:shk .4s}
.mcq-btn.dim{opacity:.28;cursor:default}
.mcq-btn:disabled{cursor:default}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* SỬA LỖI */
.efline{font-size:1.02rem;font-weight:700;line-height:2.15;margin-bottom:9px;color:var(--text)}
.efline .up{display:inline-block;text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--gold);text-underline-offset:5px;padding:0 3px;font-weight:800}
.efline sup{color:var(--gold);font-weight:900;font-size:.75em;margin-left:2px}
.ltrs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ltr{width:50px;height:50px;border-radius:13px;border:2px solid rgba(199,125,255,.35);background:rgba(40,10,80,.6);
  color:var(--text);font-family:'Nunito',sans-serif;font-weight:900;font-size:1.16rem;cursor:pointer;transition:all .18s}
.ltr:hover:not(.lk){transform:translateY(-3px);border-color:var(--teal);background:rgba(26,255,213,.18)}
.ltr.sel{background:rgba(255,215,0,.22);border-color:var(--gold);color:var(--gold)}
.ltr.ok{background:rgba(74,222,128,.22);border-color:var(--correct);color:#A7F3D0}
.ltr.no{background:rgba(248,113,113,.22);border-color:var(--wrong);color:#FCA5A5}
.ltr.lk{cursor:default}
.fixzone{display:none;margin-top:12px;background:rgba(0,0,0,.3);border:2px dashed rgba(26,255,213,.35);border-radius:13px;padding:11px 13px}
.fixzone.on{display:block;animation:slideDown .3s ease}
.fixzone .lb{font-size:.9rem;font-weight:800;color:var(--gold);margin-bottom:8px;line-height:1.65}
/* SẮP XẾP */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 8px}
.chip{background:rgba(40,10,80,.7);border:2px solid rgba(199,125,255,.3);border-radius:12px;padding:8px 14px;
  font-weight:800;font-size:.97rem;color:var(--text);cursor:pointer;transition:all .16s;font-family:'Nunito',sans-serif}
.chip:hover:not(.used):not(.lk){transform:translateY(-3px);border-color:var(--teal);background:rgba(26,255,213,.2)}
.chip.used{opacity:.26;cursor:default;text-decoration:line-through}
.chip.lk{cursor:default}
.slot{min-height:52px;background:rgba(0,0,0,.4);border:2px solid rgba(26,255,213,.28);border-radius:13px;padding:10px 13px;
  font-size:1.01rem;font-weight:800;line-height:1.75;color:#8FF5E4;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.slot .ph{color:var(--soft);font-weight:600;font-style:italic;font-size:.9rem}
.slot.ok{border-color:var(--correct);background:rgba(74,222,128,.12)}
.slot.no{border-color:var(--wrong);background:rgba(248,113,113,.12);animation:shk .4s}
.undo{background:transparent;border:2px solid rgba(255,110,180,.5);border-radius:12px;padding:9px 17px;color:var(--rose);
  font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:800;cursor:pointer;transition:.2s}
.undo:hover:not(:disabled){background:rgba(255,110,180,.15)}
.undo:disabled{opacity:.35;cursor:default}
/* INPUT */
.action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:9px}
.tinp{flex:1;min-width:200px;background:rgba(30,10,60,.6);border:1.5px dashed rgba(26,255,213,.5);border-radius:11px;
  color:var(--teal);font-family:'Nunito',sans-serif;font-size:1.01rem;font-weight:800;padding:10px 14px;outline:none;transition:all .2s}
.tinp::placeholder{color:rgba(26,255,213,.3);font-size:.9rem;font-weight:600}
.tinp:focus{border-style:solid;border-color:var(--teal);box-shadow:0 0 12px rgba(26,255,213,.25)}
.tinp.ok{border-style:solid;border-color:var(--correct);color:#A7F3D0;background:rgba(5,40,20,.8)}
.tinp.no{border-style:solid;border-color:var(--wrong);color:#FCA5A5;background:rgba(40,5,10,.8)}
.tinp:disabled{opacity:.9;cursor:default}
.btn-check{background:rgba(255,183,197,.1);border:1.5px solid rgba(255,183,197,.3);border-radius:50px;padding:10px 22px;color:#FFCCD8;
  font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:800;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-check:hover:not(:disabled){background:rgba(255,183,197,.18);transform:translateY(-2px)}
.btn-check:disabled{opacity:.35;cursor:default;transform:none}
.hintb{font-size:.85rem;color:#FDE68A;font-weight:700;background:rgba(255,215,0,.06);border:1px dashed rgba(255,215,0,.35);
  border-radius:11px;padding:7px 12px;margin-top:9px;line-height:1.7}
/* GIẢI THÍCH */
.exp-wrap{max-height:0;overflow:hidden;opacity:0;transition:max-height .55s ease,opacity .4s}
.exp-wrap.open{max-height:2000px;opacity:1}
.exp-box{margin-top:12px;background:rgba(8,3,25,.9);border:1px solid rgba(255,183,197,.12);border-radius:16px;padding:16px 18px;
  font-size:.94rem;line-height:1.85;color:#C8B8E8;box-shadow:0 4px 24px rgba(0,0,0,.45)}
.key-box{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.25);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-weight:800;color:#A7F3D0;line-height:1.7}
.vn-box{background:rgba(255,215,0,.06);border-left:3px solid rgba(255,215,0,.5);border-radius:0 10px 10px 0;padding:8px 13px;margin:8px 0;font-weight:700;color:#FDE68A;font-size:.93rem;line-height:1.75}
.stepb{background:rgba(26,255,213,.04);border:1px solid rgba(26,255,213,.12);border-radius:11px;padding:8px 13px;margin-bottom:8px;line-height:1.85}
.stepb b{color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:7px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(0,0,0,.32);border:1px solid rgba(199,125,255,.14);border-radius:9px;padding:7px 10px;font-size:.91rem;line-height:1.7;font-weight:700}
.pw{color:#7DD3FC;font-weight:800}
.pm{color:#FCD34D;font-weight:700}
.hg{color:#4ADE80;font-weight:900}
.hr{color:#F87171;font-weight:700}
.pt{background:rgba(26,255,213,.1);border:1px solid rgba(26,255,213,.18);border-radius:4px;padding:1px 5px;font-size:.74rem;color:#5EEAD4;font-style:italic;margin-right:3px}
/* KHÔNG dùng gạch chân đỏ */
.pg{background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.28);border-radius:8px;padding:2px 8px;font-weight:700;color:#FDE68A;line-height:2.1;display:inline-block}
.submit-wrap{text-align:center;padding:34px 0 12px}
.submit-btn{background:linear-gradient(135deg,#FF6B9D,#C77DFF,#1AFFD5);border:none;border-radius:50px;padding:16px 46px;
  font-family:'Comfortaa',sans-serif;font-size:1.02rem;font-weight:700;color:#fff;cursor:pointer;letter-spacing:1px;
  box-shadow:0 8px 32px rgba(199,125,255,.3),0 4px 0 rgba(50,0,80,.3);transition:all .25s}
.submit-btn:hover{transform:translateY(-4px) scale(1.03)}
.modal-ov{position:fixed;inset:0;background:rgba(10,0,30,.85);backdrop-filter:blur(10px);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.modal-ov.active{display:flex}
.modal-box{background:linear-gradient(135deg,rgba(20,5,50,.98),rgba(10,3,30,.98));border:1px solid rgba(255,183,197,.2);
  border-radius:28px;padding:34px 28px;max-width:470px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 80px rgba(199,125,255,.08)}
.modal-title{font-family:'Comfortaa',sans-serif;font-size:1.2rem;color:#FFB7C5;margin-bottom:14px;line-height:1.5}
.modal-inp{width:100%;background:rgba(30,10,60,.8);border:2px solid rgba(255,183,197,.25);border-radius:14px;padding:12px 16px;
  color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;outline:none;margin-bottom:8px;text-align:center}
.modal-inp.err{border-color:var(--wrong)}
.modal-err{color:var(--wrong);font-size:.84rem;margin-bottom:12px;min-height:20px;font-weight:700}
.modal-btn{background:linear-gradient(135deg,#FF6B9D,#C77DFF);border:none;border-radius:50px;padding:12px 34px;
  font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 6px 22px rgba(199,125,255,.35);transition:all .2s;margin-top:8px}
.modal-btn:hover{transform:scale(1.04)}
.r-name{font-family:'Comfortaa',sans-serif;font-size:1.15rem;color:#FFB7C5;margin-bottom:8px;line-height:1.5}
.r-score{font-size:2.8rem;font-weight:900;color:var(--purple);margin:10px 0 4px;font-family:'Comfortaa',sans-serif}
.r-pts{font-size:1.2rem;color:var(--teal);font-weight:800;margin-bottom:10px}
.r-note{font-size:.87rem;color:var(--soft);margin-bottom:14px;line-height:1.6}
.r-img{width:190px;border-radius:16px;margin:10px auto;display:block;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.retry-btn{background:linear-gradient(135deg,#1AFFD5,#C77DFF);border:none;border-radius:50px;padding:11px 28px;
  font-family:'Nunito',sans-serif;font-size:.94rem;font-weight:800;color:#fff;cursor:pointer;margin-top:12px}
#cnf{position:fixed;inset:0;pointer-events:none;z-index:9999}
</style>
</head>
<body>
<div class="sky"></div><div class="moon"></div>
<canvas id="star-canvas"></canvas>
<canvas id="petal-canvas"></canvas>
<canvas id="cnf"></canvas>

<div class="wrapper">
  <div class="hdr">
    <div class="hdr-title">🌸 Use of English — Past simple: regular and irregular<br>Bài 1 · 2 · 3 · 4 + 40 câu luyện thêm</div>
    <div class="hdr-sub">CAMBRIDGE GLOBAL ENGLISH — STAGE 7 · UNIT 1 MAKING CONNECTIONS</div>
    <div class="teacher-tag">🌸 Giáo viên tạo: Ms MS Chí Nên</div>
  </div>
  <div class="score-bar">
    <div class="sc-chip"><span class="lbl">ĐÚNG</span><span class="val" id="scN">0</span></div>
    <div class="sc-chip"><span class="lbl">ĐÃ LÀM</span><span class="val" id="anN">0</span></div>
    <div class="sc-chip"><span class="lbl">TỔNG</span><span class="val" id="tlN">0</span></div>
  </div>
  <div id="quiz"></div>
  <div class="submit-wrap"><button class="submit-btn" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
</div>

<div class="modal-ov" id="nameOv"><div class="modal-box">
  <div class="modal-title">✍️ Con tên là gì nhỉ?</div>
  <input class="modal-inp" id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="modal-err" id="nameErr"></div>
  <button class="modal-btn" onclick="showResult()">🚀 Xem kết quả!</button>
</div></div>
<div class="modal-ov" id="resOv"><div class="modal-box">
  <div class="r-name" id="rGreet"></div>
  <div class="r-score" id="rScore"></div>
  <div class="r-pts" id="rTen"></div>
  <img class="r-img" id="rImg" alt="">
  <div class="r-note" id="rMsg"></div>
  <button class="retry-btn" onclick="location.reload()">🔄 Làm lại từ đầu</button>
</div></div>

<script>
/* ══ ĐÈN LỒNG ══ */
[{top:'12%',left:'3%',color:'#FF6B9D',dur:3.2},{top:'22%',right:'4%',color:'#FFD700',dur:4.1},
 {top:'35%',left:'1.5%',color:'#C77DFF',dur:3.7},{top:'55%',right:'2%',color:'#1AFFD5',dur:5},
 {top:'70%',left:'2.5%',color:'#FF8FAD',dur:4.5}].forEach(d=>{
  const el=document.createElement('div');el.className='lantern';
  el.style.cssText='top:'+d.top+';'+(d.left?'left:'+d.left:'')+';'+(d.right?'right:'+d.right:'')+
    ';color:'+d.color+';background:'+d.color+'22;animation-duration:'+d.dur+'s;';
  document.body.appendChild(el)});
/* ══ SAO & CÁNH HOA BAY ══ */
(function(){
  const sc=document.getElementById('star-canvas'),sx=sc.getContext('2d');
  const pc=document.getElementById('petal-canvas'),px=pc.getContext('2d');
  let W,H;function rs(){W=sc.width=pc.width=innerWidth;H=sc.height=pc.height=innerHeight}
  addEventListener('resize',rs);rs();
  const stars=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,ph:Math.random()*6.3,sp:Math.random()*.024+.006}));

function build(m,gid){
  const card=document.createElement('div');card.className='q-card';card.id='c_'+gid;
  const head='<div class="q-num">✦ CÂU '+m.num+'</div>';
  if(m.t==='mcq'){
    const so=shuffle(m.opts);maps[gid]=so;
    const mx=Math.max.apply(null,so.map(o=>o.length));
    const cls=(mx>26||m.cols===1)?' c1':(mx>13?' c2':'');
    card.innerHTML=head+'<div class="q-text">'+m.q+'</div>'+
      '<div class="mcq-grid'+cls+'" id="o_'+gid+'">'+
      so.map((o,i)=>'<button class="mcq-btn" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
      '</div><div class="exp-wrap" id="e_'+gid+'"><div class="exp-box">'+m.ex+'</div></div>';
  } else if(m.t==='fix'){
    card.innerHTML=head+'<div class="efline">'+m.line+'</div>'+
      '<div class="ltrs" id="L_'+gid+'">'+['A','B','C','D'].map(L=>
        '<button class="ltr" data-l="'+L+'">'+L+'</button>').join('')+'</div>'+
      '<div class="fixzone" id="Z_'+gid+'"><div class="lb" id="lb_'+gid+'"></div>'+
      '<div class="action-row"><input class="tinp" id="i_'+gid+'" placeholder="Gõ từ ĐÚNG..." autocomplete="off" spellcheck="false">'+
      '<button class="btn-check" id="b_'+gid+'">✅ KIỂM TRA</button></div></div>'+
      '<div class="exp-wrap" id="e_'+gid+'"><div class="exp-box">'+m.ex+'</div></div>';
    const zone=card.querySelector('#Z_'+gid),lb=card.querySelector('#lb_'+gid),
          inp=card.querySelector('#i_'+gid),bt=card.querySelector('#b_'+gid);
    card.querySelectorAll('.ltr').forEach(b=>{b.onclick=()=>{
      if(done[gid])return;
      card.querySelectorAll('.ltr').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');picked[gid]=b.dataset.l;
      lb.innerHTML='✍️ Con chọn <b>'+b.dataset.l+'</b> = “<b>'+m.parts[b.dataset.l]+'</b>”. Giờ gõ <b>từ ĐÚNG</b> để thay thế nhé!';
      zone.classList.add('on');inp.focus()}});
    const go=()=>{
      if(done[gid]||!picked[gid])return;
      const v=norm(inp.value);
      if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),480);return}
      done[gid]=true;answered++;
      const okL=(picked[gid]===m.letter),okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
      inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
      card.querySelectorAll('.ltr').forEach(x=>{x.classList.add('lk');x.classList.remove('sel');
        if(x.dataset.l===m.letter)x.classList.add('ok');
        else if(x.dataset.l===picked[gid])x.classList.add('no')});
      if(ok){score++;ding();confetti()}else buzz();
      document.getElementById('e_'+gid).classList.add('open');bump();
    };
    bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  } else if(m.t==='ord'){
    const sw=shuffle(m.words);maps[gid]=sw;built[gid]=[];
    card.innerHTML=head+'<div class="hintb">'+H_ORD+'</div>'+
      '<div class="slot" id="s_'+gid+'"><span class="ph">Câu của con sẽ hiện ở đây...</span></div>'+
      '<div class="chips" id="w_'+gid+'">'+sw.map((w,i)=>'<button class="chip" data-i="'+i+'">'+w+'</button>').join('')+'</div>'+
      '<div class="action-row"><button class="undo" id="u_'+gid+'">🗑️ XOÁ HẾT</button>'+
      '<button class="btn-check" id="b_'+gid+'">✅ KIỂM TRA</button></div>'+
      '<div class="exp-wrap" id="e_'+gid+'"><div class="exp-box">'+m.ex+'</div></div>';
    const slot=card.querySelector('#s_'+gid),bt=card.querySelector('#b_'+gid),ub=card.querySelector('#u_'+gid);
    function draw(){slot.innerHTML=built[gid].length?built[gid].map(i=>maps[gid][i]).join(' '):'<span class="ph">Câu của con sẽ hiện ở đây...</span>'}
    card.querySelectorAll('.chip').forEach(b=>{b.onclick=()=>{
      if(done[gid]||b.classList.contains('used'))return;
      b.classList.add('used');built[gid].push(+b.dataset.i);draw()}});
    ub.onclick=()=>{if(done[gid])return;built[gid]=[];
      card.querySelectorAll('.chip').forEach(x=>x.classList.remove('used'));draw()};
    bt.onclick=()=>{
      if(done[gid])return;
      if(!built[gid].length){slot.classList.add('no');setTimeout(()=>slot.classList.remove('no'),450);return}
      done[gid]=true;answered++;
      const got=norm(built[gid].map(i=>maps[gid][i]).join(' '));
      const ok=m.accept.map(norm).indexOf(got)>-1;
      bt.disabled=true;ub.disabled=true;
      card.querySelectorAll('.chip').forEach(x=>x.classList.add('lk'));
      slot.classList.add(ok?'ok':'no');
      if(ok){score++;ding();confetti()}else buzz();
      document.getElementById('e_'+gid).classList.add('open');bump();
    };
  } else {
    card.innerHTML=head+'<div class="q-text">'+m.q+'</div>'+
      (m.hint?'<div class="hintb">'+m.hint+'</div>':'')+
      '<div class="action-row"><input class="tinp" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
      '<button class="btn-check" id="b_'+gid+'">✅ KIỂM TRA</button></div>'+
      '<div class="exp-wrap" id="e_'+gid+'"><div class="exp-box">'+m.ex+'</div></div>';
    const inp=card.querySelector('#i_'+gid),bt=card.querySelector('#b_'+gid);
    const go=()=>{
      if(done[gid])return;
      const v=norm(inp.value);
      if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),480);return}
      done[gid]=true;answered++;
      const ok=m.accept.map(norm).indexOf(v)>-1;
      inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
      if(ok){score++;ding();confetti()}else buzz();
      document.getElementById('e_'+gid).classList.add('open');bump();
    };
    bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  }
  return card;
}
function pick(gid,i){
  if(done[gid])return;done[gid]=true;answered++;
  const m=Q[+gid.slice(1)],box=document.getElementById('o_'+gid);
  const ok=maps[gid][i]===m.correct;
  [...box.children].forEach((el,j)=>{el.disabled=true;
    if(maps[gid][j]===m.correct)el.classList.add('ok');
    else if(j===i)el.classList.add('no');else el.classList.add('dim')});
  if(ok){score++;ding();confetti()}else buzz();
  document.getElementById('e_'+gid).classList.add('open');bump();
}
function openName(){document.getElementById('nameOv').classList.add('active');setTimeout(()=>document.getElementById('nameIn').focus(),200)}
function showResult(){
  const inp=document.getElementById('nameIn'),er=document.getElementById('nameErr');
  const nm=inp.value.trim();
  if(!nm){inp.classList.add('err');er.textContent='⚠️ Con chưa nhập tên kìa!';setTimeout(()=>inp.classList.remove('err'),450);return}
  er.textContent='';document.getElementById('nameOv').classList.remove('active');
  const pct=score/TOTAL,ten=(pct*10).toFixed(2);
  let greet,msg,gif;
  if(score===TOTAL){greet='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — quá khứ đơn nắm chắc rồi! 🎉';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=.6){greet='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Học thuộc bảng động từ bất quy tắc rồi làm lại nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
  else{greet='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Nhớ quy tắc vàng: khẳng định dùng V2 · sau did/didn’t dùng NGUYÊN THỂ. 📚';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent=score+' / '+TOTAL;
  document.getElementById('rTen').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
  document.getElementById('rImg').src=gif;
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('resOv').classList.add('active');
  if(pct>=.6){confetti();ding()}
}
</script>
