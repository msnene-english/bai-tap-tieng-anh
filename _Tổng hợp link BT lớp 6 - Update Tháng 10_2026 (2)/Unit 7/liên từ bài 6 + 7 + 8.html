<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIÊN TỪ – Bài 6 · 7 · 8 – Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF5D6C; --amber:#FFB020; --teal:#12C2B0; --indigo:#4C6FFF; --violet:#8B4DE8;
  --ink:#181433; --paper:#FFF7EC; --card:#ffffff; --bad:#FF3B4E; --good:#08A24B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;
  background:linear-gradient(-45deg,#FF5D6C,#FFB020,#12C2B0,#4C6FFF,#8B4DE8);background-size:400% 400%;animation:bg 22s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(0,0,0,.12) 1.4px,transparent 1.6px);background-size:16px 16px}
.pattern{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.pattern span{position:absolute;font-family:'Bangers',cursive;color:#fff;opacity:.5;-webkit-text-stroke:2px var(--ink);animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(112vh) rotate(-12deg)}100%{transform:translateY(-25vh) rotate(12deg)}}
@media (prefers-reduced-motion:reduce){body,.pattern span{animation:none!important}}
.wrap{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:14px 14px 80px}
/* header */
.teacher{display:inline-block;font-family:'Bangers',cursive;letter-spacing:1px;font-size:1rem;color:var(--ink);
  background:var(--amber);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;box-shadow:3px 3px 0 var(--ink);margin:2px 0 10px}
header.top{text-align:center;margin-bottom:16px}
header.top h1{font-family:'Bangers',cursive;font-size:clamp(30px,6.4vw,54px);line-height:.95;letter-spacing:2px;color:#fff;
  -webkit-text-stroke:2.5px var(--ink);text-shadow:5px 5px 0 var(--coral),8px 8px 0 rgba(0,0,0,.18)}
header.top .unit{display:inline-block;margin-top:8px;font-family:'Bangers',cursive;font-size:1.05rem;letter-spacing:1px;color:#fff;
  background:var(--violet);border:3px solid var(--ink);border-radius:12px;padding:3px 16px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg)}
/* score bar */
.scorebar{position:sticky;top:8px;z-index:6;margin:0 auto 18px;max-width:520px;
  background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);
  display:flex;align-items:center;gap:12px;padding:9px 14px}
.scorebar b{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.15rem}
.track{flex:1;height:14px;background:#eee;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .5s cubic-bezier(.2,.9,.3,1.3)}
.star{font-size:1.2rem}
/* section */
.section{background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);
  padding:16px 15px 18px;margin-bottom:20px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.chip{font-family:'Bangers',cursive;letter-spacing:1px;color:#fff;background:var(--indigo);border:3px solid var(--ink);
  border-radius:10px;padding:3px 12px;box-shadow:2px 2px 0 var(--ink);font-size:.95rem}
.sec-head h2{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.3rem}
.sec-instruct{font-style:italic;font-weight:700;color:#5b5570;margin:2px 0 12px;font-size:.95rem}
/* ── SCAFFOLD LÝ THUYẾT ── */
.theory{background:#FFFDF3;border:3px dashed var(--amber);border-radius:16px;box-shadow:3px 3px 0 rgba(24,20,51,.18);
  padding:14px 14px 16px;margin-bottom:16px}
.theory h3{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.15rem;color:var(--violet);margin-bottom:10px}
.rule{background:#fff;border:2.5px solid var(--ink);border-left:8px solid var(--coral);border-radius:10px;
  padding:8px 12px;margin-bottom:9px;font-size:.97rem;line-height:1.75;font-weight:700;box-shadow:2px 2px 0 rgba(24,20,51,.15)}
.rule b{color:var(--indigo)}
.eg{display:inline-block;background:#EAF0FF;border:2px solid var(--indigo);border-radius:8px;padding:0 9px;font-weight:800;color:#123a9e;margin:2px 3px 0 0}
.ttab{width:100%;border-collapse:collapse;margin:9px 0;font-size:.92rem}
.ttab th{background:var(--indigo);color:#fff;padding:7px 8px;border:2px solid var(--ink);font-family:'Bangers',cursive;letter-spacing:.8px;font-size:.95rem}
.ttab td{background:#fff;padding:7px 9px;border:2px solid var(--ink);font-weight:700;line-height:1.65}
.ttab td b{color:var(--good)}
.ttab td s{color:var(--bad)}
.ttab tr:nth-child(even) td{background:#F7F5FF}
.ttip{background:#DFF7E8;border:2.5px solid var(--good);border-radius:12px;padding:9px 13px;font-size:.95rem;font-weight:700;line-height:1.8;box-shadow:2px 2px 0 rgba(24,20,51,.15)}
.twarn{background:#FFE1E5;border:2.5px solid var(--bad);border-radius:12px;padding:9px 13px;font-size:.95rem;font-weight:700;line-height:1.8;margin-top:9px;box-shadow:2px 2px 0 rgba(24,20,51,.15)}
.twarn s{color:#b91c1c}
/* question card */
.q{border:2.5px dashed #cfc9de;border-radius:14px;padding:12px 12px 13px;margin-bottom:12px;background:#fff;transition:transform .12s}
.q.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.qnum{display:inline-block;font-family:'Bangers',cursive;background:var(--coral);color:#fff;border:2.5px solid var(--ink);
  border-radius:9px;min-width:34px;text-align:center;padding:1px 8px;box-shadow:2px 2px 0 var(--ink);margin-right:8px;font-size:1rem}
.stem{display:inline;font-weight:700;font-size:1.02rem;line-height:1.85}
.stem .bl{display:inline-block;min-width:74px;border-bottom:3px solid var(--indigo);text-align:center;color:var(--indigo);font-weight:900}
.src{background:#F7F5FF;border:2.5px solid var(--ink);border-left:8px solid var(--violet);border-radius:10px;
  padding:9px 12px;margin-top:9px;font-weight:800;font-size:1rem;line-height:1.8;box-shadow:2px 2px 0 rgba(24,20,51,.15)}
.src .kw{display:inline-block;background:var(--amber);border:2px solid var(--ink);border-radius:8px;padding:0 9px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.05rem}
/* mcq options - NO ABCD */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.opts.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:520px){.opts,.opts.c3{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);border-radius:11px;background:#fff;
  padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,background .15s;font-size:1.02rem}
.opt:hover:not(.done){transform:translate(-1px,-1px);background:#FFF8DF}
.opt.ok{background:#C9F7DB;border-color:var(--good)}
.opt.no{background:#FFD6DB;border-color:var(--bad)}
.opt.dim{opacity:.45}
/* text inputs */
.blankwrap{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input.ans{font-family:'Nunito';font-weight:800;font-size:1rem;padding:9px 12px;border:2.5px solid var(--ink);border-radius:10px;
  min-width:200px;box-shadow:2px 2px 0 var(--ink);background:#FFFDF6;flex:1}
input.ans:focus{outline:none;border-color:var(--indigo);background:#fff}
input.ans.ok{border-color:var(--good);background:#DFF7E8}
input.ans.no{border-color:var(--bad);background:#FFE1E5}
input.ans:disabled{cursor:default}
.hintb{margin-top:9px;background:#FFF3CD;border:2px dashed #ffc94d;border-radius:10px;padding:7px 11px;font-size:.9rem;font-weight:700;color:#7a5300;line-height:1.7}
/* buttons */
.btn{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.2rem;color:#fff;background:var(--teal);border:3px solid var(--ink);
  border-radius:12px;padding:10px 24px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .1s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:7px 16px;font-size:1rem;border-width:2.5px;box-shadow:3px 3px 0 var(--ink)}
/* explanation */
.exp{margin-top:11px;border-radius:12px;padding:15px 13px;font-weight:600;line-height:1.7;font-size:.99rem;display:none;
  border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff}
.exp.show{display:block;animation:pop .3s}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.exp.ok{border-color:var(--good)}
.exp.no{border-color:var(--bad)}
.keyb{background:#DFF7E8;border:2.5px solid var(--good);border-radius:10px;padding:9px 12px;margin-bottom:11px;font-weight:900;color:#04663a;line-height:1.7}
.vnt{background:#FFF3CD;font-weight:800;padding:9px 13px;border-radius:9px;color:#856404;margin-bottom:11px;border:2px dashed #ffc94d;line-height:1.7}
.stp{background:#F7F9FF;border:2px solid #d6ddf5;border-radius:10px;padding:8px 12px;margin-bottom:9px;line-height:1.8}
.stp .lb{display:inline-block;font-family:'Bangers',cursive;letter-spacing:1px;background:var(--indigo);color:#fff;
  border:2px solid var(--ink);border-radius:7px;padding:0 9px;font-size:.9rem;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:8px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#f8fafc;border:2px solid #e2e8f0;border-radius:8px;padding:7px 11px;line-height:1.7}
.wt{background:#e2e8f0;color:#475569;padding:2px 6px;border-radius:4px;font-size:.84em;font-weight:800;margin:0 4px}
.p-word{color:#2563eb;font-weight:800}
.p-mean{color:#c2410c;font-weight:700}
.hl-green{color:#16a34a;font-weight:900}
.hl-red{color:#ef4444;font-weight:900}
/* KHÔNG dùng gạch chân đỏ trong giải thích */
.pg{background:#FFF3CD;border:2px solid #ffc94d;border-radius:7px;padding:1px 8px;font-weight:800;color:#7a5300;line-height:2.05;display:inline-block}
.rel{display:inline-block;font-family:'Bangers',cursive;letter-spacing:1px;border:2.5px solid var(--ink);border-radius:9px;
  padding:1px 11px;box-shadow:2px 2px 0 var(--ink);font-size:1rem;margin:3px 4px 3px 0}
.rel.add{background:#C9F7DB;color:#04663a}
.rel.con{background:#FFD6DB;color:#9f1239}
.rel.cho{background:#E0F2FE;color:#075985}
.rel.res{background:#FEF3C7;color:#78350f}
.rel.cau{background:#EDE9FE;color:#4c1d95}
/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-box{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink);padding:24px;max-width:96%;width:420px;text-align:center;position:relative;animation:pop .4s}
.modal-box h2{font-family:'Bangers',cursive;font-size:1.85rem;letter-spacing:1px;color:var(--indigo);margin-bottom:12px}
.modal-box input{width:100%;font-family:'Nunito';font-weight:800;font-size:1.05rem;padding:12px;border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);margin-bottom:14px;outline:none}
.modal-box input.error{border-color:var(--bad);background:#FFE1E5;animation:shake .45s}
.modal-box .err-msg{color:var(--bad);font-weight:800;font-size:.9rem;margin-top:-8px;margin-bottom:12px;display:none}
.modal-box .greet{font-family:'Bangers',cursive;font-size:1.35rem;letter-spacing:1px;color:var(--violet);margin-bottom:6px;line-height:1.3}
.modal-box .res-score{font-family:'Bangers',cursive;font-size:2.9rem;color:var(--coral);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 rgba(0,0,0,.1);line-height:1}
.modal-box .res-scale{font-weight:900;color:var(--violet);font-size:1.25rem;margin-top:8px}
.modal-box .res-msg{font-weight:700;font-size:.97rem;line-height:1.7;margin-bottom:14px}
.modal-box img{width:100%;max-width:290px;border-radius:16px;border:3px solid var(--ink);margin:14px auto;display:block;box-shadow:4px 4px 0 var(--ink)}
.confetti{position:fixed;top:0;left:0;width:11px;height:16px;z-index:50;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.submit-bar{text-align:center;margin-top:26px;padding-bottom:20px}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>
<div class="wrap">
  <header class="top">
    <div class="teacher">★ Giáo viên tạo: Ms MS Chí Nên ★</div>
    <h1>LIÊN TỪ</h1>
    <div class="unit">CONJUNCTIONS · BÀI 6 · 7 · 8 · 38 CÂU</div>
  </header>
  <div class="scorebar">
    <span class="star">⭐</span>
    <b><span id="score">0</span> / <span id="total">0</span></b>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="star" id="mood">💪</span>
  </div>
  <div id="app"></div>
  <div class="submit-bar"><button class="btn" onclick="openName()">🎯 NỘP BÀI</button></div>
</div>

<div class="modal-overlay" id="nameOv"><div class="modal-box">
  <h2>✍️ NHẬP TÊN CỦA CON</h2>
  <input id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="err-msg" id="nameErr">⚠️ Con chưa nhập tên kìa!</div>
  <button class="btn" style="width:100%" onclick="showResult()">🚀 XEM KẾT QUẢ</button>
</div></div>
<div class="modal-overlay" id="resOv"><div class="modal-box">
  <div class="greet" id="rGreet"></div>
  <div class="res-score" id="rScore"></div>
  <div class="res-scale" id="rTen"></div>
  <img id="rImg" alt="">
  <div class="res-msg" id="rMsg"></div>
  <button class="btn" style="width:100%;background:var(--indigo)" onclick="location.reload()">🔄 LÀM LẠI TỪ ĐẦU</button>
</div></div>

<script>
/* ══ CHỮ BAY COMIC ══ */
(function(){
  const words=['AND','BUT','OR','SO','BECAUSE','ALTHOUGH','HOWEVER','POW!','BAM!'];
  const p=document.getElementById('pattern');
  for(let i=0;i<9;i++){const s=document.createElement('span');
    s.textContent=words[i%words.length];
    s.style.left=(Math.random()*92)+'%';
    s.style.fontSize=(24+Math.random()*30)+'px';
    s.style.animationDuration=(16+Math.random()*14)+'s';
    s.style.animationDelay=(-Math.random()*18)+'s';
    p.appendChild(s)}
})();
/* ══ ÂM THANH — Web Audio API tự sinh (KHÔNG dùng file mp3) ══ */
let AC;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
  o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
  o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const cols=['#FF5D6C','#FFB020','#12C2B0','#4C6FFF','#8B4DE8','#08A24B'];
  for(let i=0;i<40;i++){const d=document.createElement('div');d.className='confetti';
    d.style.background=cols[i%cols.length];
    d.style.left=(Math.random()*100)+'vw';
    d.style.animation='fall '+(1.5+Math.random()*1.4)+'s linear forwards';
    d.style.animationDelay=(Math.random()*.35)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
/* ══════════════════ DỮ LIỆU ══════════════════ */
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cols){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cols:cols||2})}
function fil(sec,num,q,correct,accept,ex,ph,hint){Q.push({t:'fill',sec,num,q,correct,accept,ex,ph:ph||'Viết câu...',hint:hint||''})}
function C(w,ty,m){return "<div><span class='p-word'>"+w+"</span><span class='wt'>"+ty+"</span>= <span class='p-mean'>"+m+"</span></div>"}
function G(w,ty,m){return "<div><span class='hl-green'>"+w+"</span><span class='wt'>"+ty+"</span>= <span class='p-mean'>"+m+"</span></div>"}
function EX(key,vn,cells,rel,why,trap){
 return '<div class="keyb">✅ '+key+'</div>'+
  '<div class="vnt">💬 <b>Dịch:</b> '+vn+'</div>'+
  '<div class="stp"><span class="lb">① PHÂN TÍCH TỪ</span><div class="grid2">'+cells+'</div></div>'+
  '<div class="stp"><span class="lb">② QUAN HỆ 2 VẾ</span><br>'+rel+'</div>'+
  '<div class="stp"><span class="lb">③ TẠI SAO ĐÚNG</span><br><span class="pg">'+why+'</span></div>'+
  '<div class="stp"><span class="lb">④ ĐÁP ÁN SAI / BẪY</span><br><span class="pg">'+trap+'</span></div>'
}
const R_ADD='<span class="rel add">BỔ SUNG ➔ AND</span>';
const R_CON='<span class="rel con">TRÁI NGƯỢC ➔ BUT / ALTHOUGH</span>';
const R_CHO='<span class="rel cho">LỰA CHỌN ➔ OR</span>';
const R_RES='<span class="rel res">KẾT QUẢ ➔ SO</span>';
const R_CAU='<span class="rel cau">NGUYÊN NHÂN ➔ BECAUSE</span>';

/* ═════════ BÀI 6 — KHOANH LIÊN TỪ (3 lựa chọn) ═════════ */
function b6(num,left,right,correct,opts,ex){
  mcq('A',num,'<b>'+num+'.</b> '+left+' <span class="bl">?</span> '+right,correct,opts,ex,3);
}
b6(1,"I'd love to stay","I have to catch my bus.",'but',['so','and','but'],
 EX('<b>but</b> — I’d love to stay <b>but</b> I have to catch my bus.',
  'Tớ rất muốn ở lại <b>nhưng</b> tớ phải ra bắt xe buýt.',
  C('would love to','v','rất muốn làm gì')+C('catch a bus','v','bắt kịp xe buýt')+
  G('but','conj','nhưng — nối 2 ý ĐỐI LẬP')+C('have to','modal','phải (bắt buộc)'),
  R_CON+'<br>Vế 1: <b>MUỐN</b> ở lại ➔ Vế 2: <b>PHẢI ĐI</b>. Hai ý ngược chiều nhau.',
  'Muốn ở lại nhưng buộc phải đi — đây là quan hệ <b>đối lập</b> ➔ dùng <b>but</b>.',
  '<s>so</s> ✘ vì “phải bắt xe buýt” không phải KẾT QUẢ của việc muốn ở lại · '+
  '<s>and</s> ✘ vì hai ý không cùng chiều để bổ sung cho nhau.'));
b6(2,'His hot chocolate was too hot','he put some cold milk in it.','so',['so','and','but'],
 EX('<b>so</b> — His hot chocolate was too hot <b>so</b> he put some cold milk in it.',

const O4=['and','but','or','so'];
function b7(num,sent,correct,ex){
  mcq('B',num,'<b>'+num+'.</b> '+sent,correct,O4,ex,2);
}

const TOTAL=Q.length;let answered=0,score=0;
const done={},maps={};
function bump(){document.getElementById('fill').style.width=(answered/TOTAL*100)+'%';
  document.getElementById('score').textContent=score;
  const m=document.getElementById('mood');
  const p=answered?score/answered:1;
  m.textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');
let CUR=null;
function sec(chip,title,instruct){
  const d=document.createElement('div');d.className='section';
  d.innerHTML='<div class="sec-head"><span class="chip">'+chip+'</span><h2>'+title+'</h2></div>'+
    '<div class="sec-instruct">'+instruct+'</div>';
  APP.appendChild(d);CUR=d;
}
function put(h){CUR.insertAdjacentHTML('beforeend',h)}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

/* ══════════════════ RENDER ══════════════════ */
function build(m,gid){
  const card=document.createElement('div');card.className='q';card.id='c_'+gid;
  const head='<span class="qnum">'+m.num+'</span>';
  if(m.t==='mcq'){
    const so=shuffle(m.opts);maps[gid]=so;
    card.innerHTML='<div><span class="stem">'+head+m.q+'</span></div>'+
      '<div class="opts'+(m.cols===3?' c3':'')+'" id="o_'+gid+'">'+
      so.map((o,i)=>'<button class="opt" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
      '</div><div class="exp" id="e_'+gid+'">'+m.ex+'</div>';
  } else {
    card.innerHTML='<div><span class="stem">'+head+m.q+'</span></div>'+
      (m.hint?'<div class="hintb">'+m.hint+'</div>':'')+
      '<div class="blankwrap"><input class="ans" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
      '<button class="btn small" id="b_'+gid+'">KIỂM TRA</button></div>'+
      '<div class="exp" id="e_'+gid+'">'+m.ex+'</div>';
    const inp=card.querySelector('#i_'+gid),bt=card.querySelector('#b_'+gid);
    const go=()=>{
      if(done[gid])return;
      const v=norm(inp.value);
      if(!v){inp.classList.add('no');card.classList.add('shake');
        setTimeout(()=>{inp.classList.remove('no');card.classList.remove('shake')},480);return}
      done[gid]=true;answered++;
      const ok=m.accept.map(norm).indexOf(v)>-1;
      inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
      const e=document.getElementById('e_'+gid);e.classList.add('show',ok?'ok':'no');
      if(ok){score++;ding();confetti()}else{buzz();card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),480)}
      bump();
    };
    bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  }
  return card;
}
function pick(gid,i){
  if(done[gid])return;done[gid]=true;answered++;
  const m=Q[+gid.slice(1)],box=document.getElementById('o_'+gid),card=document.getElementById('c_'+gid);
  const ok=maps[gid][i]===m.correct;
  [...box.children].forEach((el,j)=>{el.disabled=true;el.classList.add('done');
    if(maps[gid][j]===m.correct)el.classList.add('ok');
    else if(j===i)el.classList.add('no');else el.classList.add('dim')});
  const e=document.getElementById('e_'+gid);e.classList.add('show',ok?'ok':'no');
  if(ok){score++;ding();confetti()}else{buzz();card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),480)}
  bump();
}
function openName(){document.getElementById('nameOv').classList.add('show');setTimeout(()=>document.getElementById('nameIn').focus(),200)}
function showResult(){
  const inp=document.getElementById('nameIn'),er=document.getElementById('nameErr');
  const nm=inp.value.trim();
  if(!nm){inp.classList.add('error');er.style.display='block';setTimeout(()=>inp.classList.remove('error'),480);return}
  er.style.display='none';document.getElementById('nameOv').classList.remove('show');
  const pct=score/TOTAL,ten=(pct*10).toFixed(2);
  let greet,msg,gif;
  if(score===TOTAL){greet='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — liên từ and/but/or/so/because/although quá vững! 🎉';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=.6){greet='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ mẹo cho điểm (+) (–) cho từng vế để chọn and hay but nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
  else{greet='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại bảng 7 liên từ và mẹo phân biệt SO ↔ BECAUSE rồi làm lại nhé! 📚';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent=score+' / '+TOTAL;
  document.getElementById('rTen').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
  document.getElementById('rImg').src=gif;
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('resOv').classList.add('show');
  if(pct>=.6){confetti();ding()}
}
