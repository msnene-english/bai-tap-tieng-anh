<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms MS Chí Nên - Stress Quiz Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #8854C0;
            --secondary-color: #00C9A7;
            --correct-color: #00D26A;
            --wrong-color: #FF4757;
            --bg-color: #f0f7ff;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        header {
            width: 100%;
            background: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .teacher-label {
            font-size: 0.9rem;
            color: var(--primary-color);
            margin: 0;
            font-weight: 700;
        }

        h1 {
            font-family: 'Nunito', sans-serif;
            margin: 5px 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .game-container {
            width: 95%;
            max-width: 600px;
            perspective: 1000px;
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            position: relative;
            transition: transform 0.3s;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.5s ease;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 480px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: white;
            border: 3px solid #e2e8f0;
            border-bottom: 8px solid #cbd5e0;
            border-radius: 20px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
            font-family: 'Quicksand', sans-serif;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:hover {
            transform: scale(1.02);
            background-color: #f8fafc;
        }

        .option-btn:active {
            transform: translateY(4px);
            border-bottom-width: 4px;
        }

        .option-btn.correct {
            background-color: var(--correct-color) !important;
            border-color: #00b35a !important;
            border-bottom-color: #008f48 !important;
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color) !important;
            border-color: #e63946 !important;
            border-bottom-color: #cc333f !important;
            color: white;
        }

        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-left: 5px solid var(--primary-color);
            border-radius: 15px;
            display: none;
            animation: slideIn 0.4s ease-out;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .explanation-box h4 {
            margin-top: 0;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .next-btn {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-bottom: 6px solid #00a88b;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            display: none;
            font-family: 'Nunito', sans-serif;
        }

        .next-btn:active {
            transform: translateY(2px);
            border-bottom-width: 4px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake { animation: shake 0.3s ease-in-out 2; }

        .result-screen {
            display: none;
            text-align: center;
            animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: white;
            border: 10px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 20px auto;
            color: var(--primary-color);
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.2);
        }

        .badge-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .analysis-item {
            padding: 10px;
            border-radius: 10px;
            background: #f1f2f6;
            font-weight: 700;
        }

        .btn-restart {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-bottom: 6px solid #6c429c;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
        }

        /* Specific styles for options rationale */
        .option-detail {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ddd;
        }
        .option-detail:last-child { border: none; }
        .correct-answer-text { color: var(--correct-color); font-weight: 800; }
    </style>
</head>
<body>

    <header>
        <p class="teacher-label">Giáo viên tạo: Ms MS Chí Nên 🎓</p>
        <h1>Trọng âm Tiếng Anh - Exercise III</h1>
    </header>

    <div class="game-container">
        <!-- Quiz Section -->
        <div id="quiz-section">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>

            <div class="card" id="question-card">
                <div id="q-number" style="font-weight: 800; color: #a4b0be; margin-bottom: 10px;">CÂU 1/10</div>
                <div class="question-text" id="question-text">Đang tải câu hỏi...</div>
                
                <div class="options-grid" id="options-grid">
                    <!-- Options generate here -->
                </div>

                <div class="explanation-box" id="explanation-box">
                    <h4 id="expl-title">Cô MS Chí Nên giải thích:</h4>
                    <div id="expl-content"></div>
                </div>

                <button class="next-btn" id="next-btn">CÂU TIẾP THEO ➜</button>
            </div>
        </div>

        <!-- Result Section -->
        <div class="card result-screen" id="result-screen">
            <h2 id="result-greeting">Tuyệt vời!</h2>
            <div class="score-circle" id="score-display">0/0</div>
            <p id="result-comment">Bạn đã hoàn thành bài thi xuất sắc!</p>
            <div class="badge-grid">
                <div class="analysis-item">Đúng: <span id="correct-count" style="color:var(--correct-color)">0</span></div>
                <div class="analysis-item">Sai: <span id="wrong-count" style="color:var(--wrong-color)">0</span></div>
            </div>
            <button class="btn-restart" onclick="location.reload()">LÀM LẠI BÀI ⟲</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["programme", "habit", "answer", "compare"],
                correct: 3,
                rationale: {
                    translations: [
                        "A. programme (n): /ˈprəʊɡræm/ - chương trình",
                        "B. habit (n): /ˈhæbɪt/ - thói quen",
                        "C. answer (n/v): /ˈɑːnsər/ - câu trả lời",
                        "D. compare (v): /kəmˈpeər/ - so sánh"
                    ],
                    mainReason: "Đáp án D có trọng âm rơi vào âm tiết thứ 2 (động từ 2 âm tiết thường nhấn âm 2). Các từ còn lại là danh từ 2 âm tiết (hoặc trường hợp đặc biệt) nhấn vào âm tiết đầu.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            },
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["favourite", "weatherman", "comedian", "theatre"],
                correct: 2,
                rationale: {
                    translations: [
                        "A. favourite (adj): /ˈfeɪvərɪt/ - yêu thích",
                        "B. weatherman (n): /ˈweðəmæn/ - người dẫn bản tin thời tiết",
                        "C. comedian (n): /kəˈmiːdiən/ - diễn viên hài",
                        "D. theatre (n): /ˈθɪətər/ - nhà hát"
                    ],
                    mainReason: "Đáp án C trọng âm rơi vào âm tiết thứ 2 (quy tắc: từ kết thúc bằng đuôi '-ian' trọng âm rơi vào âm trước đó). Các từ còn lại nhấn âm tiết thứ 1.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            },
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["anything", "project", "remote", "weather"],
                correct: 2,
                rationale: {
                    translations: [
                        "A. anything (pron): /ˈeniθɪŋ/ - bất cứ cái gì",
                        "B. project (n): /ˈprɒdʒekt/ - dự án",
                        "C. remote (adj): /rɪˈməʊt/ - xa xôi / điều khiển",
                        "D. weather (n): /ˈweðər/ - thời tiết"
                    ],
                    mainReason: "Đáp án C trọng âm rơi vào âm tiết thứ 2. Các từ còn lại đều là từ 2 âm tiết nhấn vào âm đầu tiên.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            },
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["broadcast", "favourite", "national", "educational"],
                correct: 3,
                rationale: {
                    translations: [
                        "A. broadcast (v/n): /ˈbrɔːdkɑːst/ - phát sóng",
                        "B. favourite (adj): /ˈfeɪvərɪt/ - yêu thích",
                        "C. national (adj): /ˈnæʃnəl/ - thuộc quốc gia",
                        "D. educational (adj): /ˌedʒuˈkeɪʃənl/ - mang tính giáo dục"
                    ],
                    mainReason: "Đáp án D trọng âm rơi vào âm tiết thứ 3 (trước đuôi -tion). Các từ còn lại trọng âm rơi vào âm tiết đầu tiên.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            },
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["comedy", "cartoon", "writer", "channel"],
                correct: 1,
                rationale: {
                    translations: [
                        "A. comedy (n): /ˈkɒmədi/ - hài kịch",
                        "B. cartoon (n): /kɑːˈtuːn/ - phim hoạt hình",
                        "C. writer (n): /ˈraɪtər/ - nhà văn",
                        "D. channel (n): /ˈtʃænl/ - kênh truyền hình"
                    ],
                    mainReason: "Đáp án B trọng âm rơi vào âm tiết thứ 2 (đặc biệt các từ kết thúc 'oon' thường nhấn chính nó). Các từ còn lại nhấn âm 1.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            },
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["talent", "viewer", "person", "instruct"],
                correct: 3,
                rationale: {
                    translations: [
                        "A. talent (n): /ˈtælənt/ - tài năng",
                        "B. viewer (n): /ˈvjuːər/ - người xem",
                        "C. person (n): /ˈpɜːsn/ - con người",
                        "D. instruct (v): /ɪnˈstrʌkt/ - hướng dẫn"
                    ],
                    mainReason: "Đáp án D là động từ 2 âm tiết nhấn âm 2. Các từ còn lại là danh từ nhấn âm tiết đầu.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            },
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["programme", "today", "channel", "happy"],
                correct: 1,
                rationale: {
                    translations: [
                        "A. programme (n): /ˈprəʊɡræm/ - chương trình",
                        "B. today (adv): /təˈdeɪ/ - hôm nay",
                        "C. channel (n): /ˈtʃænl/ - kênh",
                        "D. happy (adj): /ˈhæpi/ - hạnh phúc"
                    ],
                    mainReason: "Đáp án B nhấn âm 2 (vì âm đầu là /ə/ không bao giờ nhận trọng âm). Các từ còn lại nhấn âm 1.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            },
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["boring", "happen", "depend", "football"],
                correct: 2,
                rationale: {
                    translations: [
                        "A. boring (adj): /ˈbɔːrɪŋ/ - nhàm chán",
                        "B. happen (v): /ˈhæpən/ - xảy ra (ngoại lệ nhấn âm 1)",
                        "C. depend (v): /dɪˈpend/ - phụ thuộc",
                        "D. football (n): /ˈfʊtbɔːl/ - bóng đá"
                    ],
                    mainReason: "Đáp án C nhấn âm 2. Các từ còn lại nhấn âm tiết đầu. Lưu ý 'happen' là động từ nhưng nhấn âm 1.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            },
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["number", "reason", "question", "compete"],
                correct: 3,
                rationale: {
                    translations: [
                        "A. number (n): /ˈnʌmbər/ - con số",
                        "B. reason (n): /ˈriːzn/ - lý do",
                        "C. question (n): /ˈkwestʃən/ - câu hỏi",
                        "D. compete (v): /kəmˈpiːt/ - thi đấu, cạnh tranh"
                    ],
                    mainReason: "Đáp án D nhấn âm 2. Các từ còn lại đều là danh từ 2 âm tiết thông dụng nhấn âm 1.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            },
            {
                q: "Choose the word that has a different stressed syllable from the others.",
                options: ["outdoor", "cartoon", "busy", "little"],
                correct: 1,
                rationale: {
                    translations: [
                        "A. outdoor (adj): /ˈaʊtdɔːr/ - ngoài trời",
                        "B. cartoon (n): /kɑːˈtuːn/ - phim hoạt hình",
                        "C. busy (adj): /ˈbɪzi/ - bận rộn",
                        "D. little (adj): /ˈlɪtl/ - nhỏ bé"
                    ],
                    mainReason: "Đáp án B nhấn âm 2. Các từ còn lại nhấn âm tiết đầu.",
                    fullTranslate: "Chọn từ có vị trí trọng âm khác với các từ còn lại."
                }
            }
        ];

        let currentQ = 0;
        let score = 0;
        let answered = false;

        const qText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const explBox = document.getElementById('explanation-box');
        const explContent = document.getElementById('expl-content');
        const nextBtn = document.getElementById('next-btn');
        const progFill = document.getElementById('progress-fill');
        const qNumLabel = document.getElementById('q-number');

        // Audio Context for Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function loadQuestion() {
            answered = false;
            const data = quizData[currentQ];
            qNumLabel.innerText = `CÂU ${currentQ + 1}/${quizData.length}`;
            qText.innerText = data.q;
            optionsGrid.innerHTML = '';
            explBox.style.display = 'none';
            nextBtn.style.display = 'none';
            
            progFill.style.width = `${((currentQ) / quizData.length) * 100}%`;

            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(idx, btn) {
            if (answered) return;
            answered = true;
            const data = quizData[currentQ];
            const allBtns = document.querySelectorAll('.option-btn');
            
            // Hiện phần giải thích chi tiết
            explBox.style.display = 'block';
            
            let rationaleHTML = `<div style="margin-bottom:10px;"><strong>1. Dịch câu hỏi:</strong> ${data.rationale.fullTranslate}</div>`;
            rationaleHTML += `<strong>2. Phân tích 4 đáp án:</strong><br>`;
            data.rationale.translations.forEach((t, i) => {
                const isCorrect = i === data.correct;
                rationaleHTML += `<div class="option-detail ${isCorrect ? 'correct-answer-text' : ''}">${t} ${isCorrect ? '✔' : ''}</div>`;
            });
            rationaleHTML += `<strong>3. Cô MS Chí Nên kết luận:</strong> ${data.rationale.mainReason}`;
            explContent.innerHTML = rationaleHTML;

            if (idx === data.correct) {
                btn.classList.add('correct');
                score++;
                playSound('correct');
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#8854C0', '#00C9A7', '#FFD700']
                });
            } else {
                btn.classList.add('wrong');
                allBtns[data.correct].classList.add('correct');
                document.getElementById('question-card').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('question-card').classList.remove('shake');
                }, 500);
                playSound('wrong');
            }

            nextBtn.style.display = 'block';
            if (currentQ === quizData.length - 1) {
                nextBtn.innerText = "XEM KẾT QUẢ TỔNG KẾT";
            }
        }

        nextBtn.onclick = () => {
            currentQ++;
            if (currentQ < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('quiz-section').style.display = 'none';
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'block';
            
            document.getElementById('score-display').innerText = `${score}/${quizData.length}`;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = quizData.length - score;

            const comment = document.getElementById('result-comment');
            const greeting = document.getElementById('result-greeting');
            
            if (score === quizData.length) {
                greeting.innerText = "XUẤT SẮC! 🎉";
                comment.innerText = "Ms MS Chí Nên tự hào về bạn! Bạn là bậc thầy trọng âm!";
            } else if (score >= 7) {
                greeting.innerText = "KHÁ GIỎI! 👍";
                comment.innerText = "Bạn làm rất tốt, chỉ cần chú ý một chút nữa thôi!";
            } else {
                greeting.innerText = "CỐ GẮNG LÊN! 💪";
                comment.innerText = "Đừng nản chí nhé, hãy xem lại phần giải thích và thử lại lần nữa!";
            }

            // Pháo giấy mừng kết thúc
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
              confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#8854C0', '#00C9A7']
              });
              confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#8854C0', '#00C9A7']
              });

              if (Date.now() < end) {
                requestAnimationFrame(frame);
              }
            }());
        }

        // Khởi tạo
        window.onload = loadQuestion;
    </script>
</body>
