<style>

.stem{display:inline;font-weight:700;font-size:1.02rem;line-height:1.75}

.opt.dim{opacity:.45}
.opt .ipa{font-family:'Courier New',monospace;font-weight:900;font-size:1.12rem}

.exp.no{border-color:var(--bad)}

.grid2>div{background:#f8fafc;border:2px solid #e2e8f0;border-radius:8px;padding:6px 10px;line-height:1.7;font-weight:700}
.pw{color:#2563eb;font-weight:800}
.hg{color:#16a34a;font-weight:900}
.pm{color:#c2410c;font-weight:700}
.wt{background:#e2e8f0;color:#475569;padding:2px 6px;border-radius:4px;font-size:.78em;font-weight:800;margin:0 3px}

.sT{background:#FFE6C7;border:2px solid var(--ink);border-radius:6px;padding:0 6px;color:#B35C00;font-weight:900;font-family:'Courier New',monospace}
.sD{background:#C9F7DB;border:2px solid var(--ink);border-radius:6px;padding:0 6px;color:#04663a;font-weight:900;font-family:'Courier New',monospace}

.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.submit-bar{text-align:center;margin-top:26px;padding-bottom:20px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);padding:16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-box{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink);padding:24px;
  max-width:96%;width:430px;text-align:center;animation:pop .4s}
.modal-box h2{font-family:'Bangers',cursive;font-size:1.8rem;letter-spacing:1px;color:var(--indigo);margin-bottom:12px;line-height:1.2}
.modal-box input{width:100%;font-family:'Nunito';font-weight:800;font-size:1.05rem;padding:12px;border:3px solid var(--ink);
  border-radius:12px;box-shadow:3px 3px 0 var(--ink);margin-bottom:14px;outline:none;text-align:center}
.modal-box input.error{border-color:var(--bad);background:#FFE1E5;animation:shake .45s}
.modal-box .err-msg{color:var(--bad);font-weight:800;font-size:.9rem;margin-top:-8px;margin-bottom:12px;display:none}
.modal-box .greet{font-family:'Bangers',cursive;font-size:1.35rem;letter-spacing:1px;color:var(--violet);margin-bottom:6px;line-height:1.3}
.modal-box .res-score{font-family:'Bangers',cursive;font-size:2.9rem;color:var(--coral);-webkit-text-stroke:2px var(--ink);
  text-shadow:4px 4px 0 rgba(0,0,0,.1);line-height:1}
.modal-box .res-scale{font-weight:900;color:var(--violet);font-size:1.25rem;margin-top:8px}
.modal-box .res-msg{font-weight:700;font-size:.96rem;line-height:1.7;margin-bottom:14px}
.modal-box img{width:100%;max-width:280px;border-radius:16px;border:3px solid var(--ink);margin:14px auto;display:block;box-shadow:4px 4px 0 var(--ink)}
.confetti{position:fixed;top:0;left:0;width:11px;height:16px;z-index:50;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}

/* ══ ÂM THANH — Web Audio API tự sinh (KHÔNG dùng file mp3) ══ */
let AC;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
  o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
  o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const cols=['#FF5D6C','#FFB020','#12C2B0','#4C6FFF','#8B4DE8','#08A24B'];
  for(let i=0;i<36;i++){const d=document.createElement('div');d.className='confetti';
    d.style.background=cols[i%cols.length];
    d.style.left=(Math.random()*100)+'vw';
    d.style.animation='fall '+(1.5+Math.random()*1.4)+'s linear forwards';
    d.style.animationDelay=(Math.random()*.35)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function build(m,gid){
  const card=document.createElement('div');card.className='q';card.id='c_'+gid;
  const head='<span class="qnum">'+m.num+'</span>';
  const so=shuffle(m.opts);maps[gid]=so;
  card.innerHTML='<div><span class="stem">'+head+m.q+'</span></div>'+
    '<div class="opts'+(m.cols===4?' c4':'')+'" id="o_'+gid+'">'+
    so.map((o,i)=>'<button class="opt" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
    '</div><div class="exp" id="e_'+gid+'">'+m.ex+'</div>';
  return card;
}
function pick(gid,i){
  if(done[gid])return;done[gid]=true;answered++;
  const m=Q[+gid.slice(1)],box=document.getElementById('o_'+gid),card=document.getElementById('c_'+gid);
  const ok=maps[gid][i]===m.correct;
  [...box.children].forEach((el,j)=>{el.disabled=true;el.classList.add('done');
    if(maps[gid][j]===m.correct)el.classList.add('ok');
    else if(j===i)el.classList.add('no');else el.classList.add('dim')});
  if(m.grp&&m.sec==='A'){
    const b=document.getElementById(m.grp==='T'?'binT':'binD');
    const ph=b.querySelector('.ph');if(ph)ph.remove();
    const c=document.createElement('span');c.className='wchip '+(ok?'ok':'no');c.textContent=m.bw;
    b.appendChild(c);
    document.getElementById(m.grp==='T'?'cT':'cD').textContent=b.querySelectorAll('.wchip').length;
  }
  const e=document.getElementById('e_'+gid);e.classList.add('show',ok?'ok':'no');
  if(ok){score++;ding();confetti()}else{buzz();card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),480)}
  bump();
}
function openName(){document.getElementById('nameOv').classList.add('show');setTimeout(()=>document.getElementById('nameIn').focus(),200)}
function showResult(){
  const inp=document.getElementById('nameIn'),er=document.getElementById('nameErr');
  const nm=inp.value.trim();
  if(!nm){inp.classList.add('error');er.style.display='block';setTimeout(()=>inp.classList.remove('error'),480);return}
  er.style.display='none';document.getElementById('nameOv').classList.remove('show');
  const pct=score/TOTAL,ten=(pct*10).toFixed(2);
  let greet,msg,gif;
  if(score===TOTAL){greet='🏆 XUẤT SẮC, '+nm+'!';
    msg='Con đúng TOÀN BỘ '+TOTAL+' câu — phân biệt /θ/ và /ð/ quá đỉnh! 🎉';
    gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=.6){greet='🌟 GIỎI LẮM, '+nm+'!';
    msg='Con làm rất tốt rồi. Nhớ mẹo đặt tay lên cổ để thử độ rung, và đọc to từng câu nhé!';
    gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
  else{greet='🌱 CỐ LÊN NÀO, '+nm+'!';
    msg='Đừng buồn! Đọc lại 4 bước luyện đọc câu rồi làm lại nhé! 📚';
    gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent=score+' / '+TOTAL;
  document.getElementById('rTen').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
  document.getElementById('rImg').src=gif;
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('resOv').classList.add('show');
  if(pct>=.6){confetti();ding()}
}
