<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIT 7 TELEVISION · TEST 1 — A (I–VI) &amp; C (I–III) — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#4A3B2A;--amber:#F59E0B;--deep:#B45309;--rose:#FB7185;--mint:#34D399;--sky:#38BDF8;
  --lilac:#A78BFA;--sun:#FDE047;--good:#10B981;--bad:#EF4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);
  background:linear-gradient(140deg,#FFFBF0,#FFF4DE 38%,#FFEFE2 66%,#FDF2FF);
  background-size:280% 280%;background-attachment:fixed;animation:bgmove 32s ease-in-out infinite alternate}
@keyframes bgmove{from{background-position:0% 50%}to{background-position:100% 50%}}
/* bảng ghim kiểu giấy kraft — hạt lấm tấm cho ấm áp */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(180,83,9,.13) 1.4px,transparent 1.5px),
   radial-gradient(rgba(180,83,9,.07) 1.4px,transparent 1.5px);
  background-size:26px 26px,26px 26px;background-position:0 0,13px 13px}
/* ── LỚP TRANG TRÍ BAY LƠ LỬNG ── */
.dz{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.dd{position:absolute;bottom:-60px;animation:rise linear infinite}
.dd i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes rise{0%{transform:translateY(0);opacity:0}8%{opacity:.85}88%{opacity:.85}
  100%{transform:translateY(-118vh);opacity:0}}
@keyframes sway{from{transform:translateX(-15px) rotate(-14deg)}to{transform:translateX(15px) rotate(14deg)}}
/* ngôi sao 5 cánh vẽ bằng CSS */
.stt{width:var(--s);height:var(--s);background:var(--c);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
/* tờ giấy nhớ tí hon bay bay */
.mini{width:calc(var(--s) * 1.15);height:var(--s);background:var(--c);border-radius:2px 2px 6px 2px;
  box-shadow:1px 2px 4px rgba(120,70,10,.25);position:relative}
.mini::after{content:'';position:absolute;right:0;bottom:0;width:6px;height:6px;
  background:linear-gradient(135deg,transparent 50%,rgba(120,70,10,.22) 50%)}
/* bong bóng tròn mềm */
.bub{width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:.75}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:16px 14px 80px}
h1,h2,h3,.pill,.qn,.sbtn,.ck,.lb,.l,.tg{font-family:'Baloo 2',sans-serif;font-weight:700}
/* ── TỜ GIẤY NHỚ (sticky note) ── */
.note{position:relative;background:var(--nt,#FEF3C7);border-radius:2px 2px 20px 2px;
  box-shadow:3px 6px 16px rgba(146,84,14,.20),0 1px 0 rgba(255,255,255,.7) inset}
.note::after{content:'';position:absolute;right:0;bottom:0;width:30px;height:30px;
  background:linear-gradient(135deg,transparent 50%,rgba(146,84,14,.18) 50%);border-radius:0 0 18px 0}
/* băng dính washi dán góc trên */
.tape{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2.5deg);
  width:118px;height:26px;border-radius:3px;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.85) 0 7px,var(--tp,#FBBF24) 7px 14px);
  opacity:.9;box-shadow:0 2px 5px rgba(146,84,14,.22)}
.tape::before,.tape::after{content:'';position:absolute;top:0;bottom:0;width:5px;
  background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.12))}
.tape::before{left:0}.tape::after{right:0}
.hdr{--nt:#FEF08A;--tp:#FCA5A5;padding:22px 18px 16px;text-align:center;margin:14px 0 20px;transform:rotate(-.7deg)}
.hdr h1{font-size:clamp(18px,4vw,28px);line-height:1.28;color:#92400E}
.hdr p{font-size:.84rem;font-weight:800;color:#A16207;margin-top:7px;line-height:1.6;font-family:'Nunito'}
.sb{position:sticky;top:8px;z-index:9;background:#fff;border-radius:999px;box-shadow:0 4px 14px rgba(146,84,14,.22);
  display:flex;align-items:center;gap:10px;padding:8px 16px;margin-bottom:20px;border:2px solid #FDE68A}
.sb b{font-family:'Baloo 2',sans-serif;font-size:1.14rem;color:var(--deep)}
.tr{flex:1;height:11px;background:#FEF3C7;border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--amber),var(--rose),var(--lilac));transition:width .45s}
.sec{padding:20px 14px 18px;margin-bottom:26px}
.sec:nth-child(odd){transform:rotate(-.45deg)}.sec:nth-child(even){transform:rotate(.4deg)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:2px 0 5px}
.pill{color:#fff;border-radius:999px;padding:2px 15px;font-size:.97rem;box-shadow:0 3px 8px rgba(146,84,14,.28)}
.st h2{font-size:1.08rem;line-height:1.35;color:#7C2D12}
.si{font-size:.89rem;font-weight:700;color:#92400E;font-style:italic;margin:2px 0 13px;line-height:1.65}
/* ── KHỐI LÝ THUYẾT: tờ giấy kẻ dòng ── */
.th{background:#FFFDF5;background-image:linear-gradient(#FDE68A 1px,transparent 1px);background-size:100% 30px;
  background-position:0 12px;padding:13px 14px 15px;margin-bottom:15px;border-radius:2px 2px 16px 2px;
  box-shadow:2px 4px 12px rgba(146,84,14,.16);position:relative;border-left:4px solid #FCA5A5}
.th::after{content:'';position:absolute;right:0;bottom:0;width:24px;height:24px;
  background:linear-gradient(135deg,transparent 50%,rgba(146,84,14,.16) 50%);border-radius:0 0 14px 0}
.th h3{font-size:1.02rem;color:#B45309;margin-bottom:10px;line-height:1.4}
.ru{background:#fff;border-left:6px solid var(--amber);border-radius:0 11px 11px 0;padding:7px 11px;margin-bottom:7px;
  font-size:.93rem;line-height:1.75;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.ru b{color:var(--deep)}
.eg{display:inline-block;background:#FFFBEB;border:1.5px solid var(--amber);border-radius:8px;padding:0 8px;
  font-weight:800;color:var(--deep);margin:2px 3px 0 0}
.tb{width:100%;border-collapse:collapse;margin:8px 0;font-size:.87rem}
.tb th{background:var(--amber);color:#fff;padding:6px 8px;border:1.5px solid #fff;font-family:'Baloo 2',sans-serif;font-size:.92rem}
.tb td{background:#fff;padding:6px 8px;border:1.5px solid #FDE68A;font-weight:700;line-height:1.65}
.tb tr:nth-child(even) td{background:#FFFBEB}
.tb td b{color:var(--good)}.tb td s{color:var(--bad)}
.tip{background:#ECFDF5;border:2px solid var(--good);border-radius:12px;padding:8px 12px;font-size:.92rem;
  font-weight:700;line-height:1.78;color:#065F46}
.wn{background:#FEF2F2;border:2px solid var(--bad);border-radius:12px;padding:8px 12px;font-size:.92rem;
  font-weight:700;line-height:1.78;color:#991B1B;margin-top:8px}
.wn s{color:#DC2626}
.q{background:#fff;border-radius:2px 2px 14px 2px;padding:11px 12px 12px;margin-bottom:11px;
  box-shadow:2px 3px 9px rgba(146,84,14,.14);border-left:5px solid #FDE68A}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:var(--amber);color:#fff;border-radius:9px;min-width:32px;text-align:center;
  padding:0 8px;margin-right:7px;font-size:.94rem;box-shadow:0 2px 5px rgba(245,158,11,.4)}
.qt{font-weight:700;font-size:1rem;line-height:1.9}
.qt .bl{display:inline-block;min-width:96px;border-bottom:3px solid var(--amber);text-align:center;color:var(--deep);font-weight:900}
.cue{background:#FFFBEB;border:2px dashed var(--amber);border-radius:11px;padding:8px 12px;margin-top:8px;
  font-weight:800;font-size:1rem;line-height:1.8;color:#92400E}
.src{background:#FFFDF5;border-left:5px solid var(--lilac);border-radius:0 11px 11px 0;padding:8px 12px;margin-top:8px;
  font-weight:800;font-size:1rem;line-height:1.8}
.tg{display:inline-block;background:#EDE9FE;color:#5B21B6;border-radius:7px;padding:0 8px;font-size:.86rem;margin-left:5px}
/* nhấn mạnh trong lý thuyết & lời giải: tô vàng nhạt, KHÔNG gạch chân cho đỡ rối mắt */
u{background:#FEF08A;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800;color:#78350F}
/* phần gạch chân của bài phát âm — tô vàng + gạch chân đậm cho thật rõ */
.ob u,.g2 u,.qt u{background:var(--sun);border-radius:3px;padding:0 1px;margin:0 -1px;font-weight:900;color:var(--ink);
  text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;text-decoration-color:var(--deep)}
.ob.ok u,.ob.no u{background:rgba(255,255,255,.7)}
/* phần cần sửa lỗi — đánh dấu A·B·C·D ngay trong câu */
.pt{display:inline-block;background:#FFF7ED;border:1.5px solid #FDBA74;border-radius:8px;padding:0 7px 0 3px;
  margin:0 2px;font-weight:800;color:#9A3412}
.pt b{display:inline-block;background:#FB923C;color:#fff;border-radius:5px;padding:0 5px;margin-right:5px;
  font-size:.8rem;font-family:'Baloo 2',sans-serif}
/* ── SẮP XẾP TỪ ── */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.cp{background:#FFFBEB;border:2px solid var(--lilac);border-radius:11px;padding:6px 13px;font-weight:800;font-size:.97rem;
  cursor:pointer;box-shadow:0 2px 6px rgba(139,92,246,.18);transition:.14s;color:#5B21B6}
.cp:hover:not(.gone){transform:translateY(-2px);background:#F5F3FF}
.cp.gone{opacity:.25;pointer-events:none;text-decoration:line-through}
.built{margin-top:9px;min-height:44px;background:#FFFDF5;border:2px dashed var(--amber);border-radius:12px;
  padding:9px 12px;font-weight:800;font-size:1.02rem;line-height:1.7;color:#92400E}
.built.ok{border-style:solid;border-color:var(--good);background:#D1FAE5;color:#065F46}
.built.no{border-style:solid;border-color:var(--bad);background:#FEE2E2;color:#991B1B}
.built .ph{color:#C4A484;font-weight:700;font-style:italic}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:640px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.og{grid-template-columns:1fr}}
.ob{background:#FFFBEB;border:2px solid #FDE68A;border-radius:11px;padding:9px 12px;font-family:'Nunito';
  font-size:.96rem;font-weight:800;cursor:pointer;box-shadow:0 3px 7px rgba(146,84,14,.13);transition:.14s;
  text-align:center;line-height:1.55;color:var(--ink)}
.ob:hover:not(.dn){transform:translateY(-2px);background:#FEF3C7;border-color:var(--amber)}
.ob.ok{background:#D1FAE5;border-color:var(--good);color:#065F46}
.ob.no{background:#FEE2E2;border-color:var(--bad);color:#991B1B}
.ob.dim{opacity:.42}
.ob b{display:inline-block;background:#FB923C;color:#fff;border-radius:5px;padding:0 6px;margin-right:5px;
  font-size:.82rem;font-family:'Baloo 2',sans-serif}
.ob.ok b{background:var(--good)}.ob.no b{background:var(--bad)}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.ti{flex:1;min-width:190px;padding:9px 13px;border:2px solid #FDE68A;border-radius:11px;font-family:'Nunito';
  font-size:.98rem;font-weight:800;outline:none;background:#FFFDF5}
.ti:focus{border-color:var(--amber);background:#fff}
.ti.ok{border-color:var(--good);background:#D1FAE5}.ti.no{border-color:var(--bad);background:#FEE2E2}
.ck{background:var(--amber);color:#fff;border:none;border-radius:11px;padding:9px 18px;font-size:.98rem;cursor:pointer;
  box-shadow:0 4px 10px rgba(245,158,11,.4);white-space:nowrap}
.ck.gh{background:#fff;color:var(--deep);border:2px solid var(--amber);box-shadow:none}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.4;cursor:default}
.ex{display:none;margin-top:10px;background:#FFFDF5;border-radius:12px;padding:12px;font-size:.94rem;line-height:1.75;
  box-shadow:0 3px 10px rgba(146,84,14,.14);border:1.5px solid #FDE68A}
.ex.show{display:block}
.kb{background:#D1FAE5;border:1.5px solid var(--good);border-radius:9px;padding:7px 11px;margin-bottom:8px;
  font-weight:900;color:#065F46;line-height:1.7}
.vi{background:#FFF7E0;border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:6px 11px;margin-bottom:8px;
  font-weight:700;color:#92400E;line-height:1.7}
.sp{background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:9px;padding:7px 11px;margin-bottom:7px;line-height:1.75}
.sp .l{display:inline-block;background:var(--lilac);color:#fff;border-radius:6px;padding:0 8px;font-size:.85rem;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:5px 0}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
.g2>div{background:#fff;border:1.5px solid #FDE9B5;border-radius:8px;padding:5px 9px;line-height:1.65;font-weight:700}
.w{color:#1D4ED8;font-weight:800}.m{color:#C2410C;font-weight:700}.g{color:var(--good);font-weight:900}
.t{background:#FEF3C7;color:#92400E;padding:1px 5px;border-radius:4px;font-size:.78em;font-weight:800;margin:0 3px}
.pg{background:linear-gradient(transparent 54%,var(--sun) 54%);font-weight:800;line-height:2}
.ipa{color:#7B1FA2;background:rgba(123,31,162,.09);border-radius:4px;padding:1px 5px;font-family:'Courier New',monospace;font-size:.88em;font-weight:800}
.fx{display:inline-block;background:#FEE2E2;color:#991B1B;border-radius:6px;padding:0 6px;font-weight:900;text-decoration:line-through}
.fy{display:inline-block;background:#D1FAE5;color:#065F46;border-radius:6px;padding:0 6px;font-weight:900}
.sub{text-align:center;margin-top:24px}
.sbtn{background:var(--amber);color:#fff;border:none;border-radius:999px;padding:13px 40px;font-size:1.22rem;cursor:pointer;
  box-shadow:0 6px 16px rgba(245,158,11,.45)}
.sbtn:hover{transform:translateY(-2px)}
.ov{position:fixed;inset:0;background:rgba(74,59,42,.72);z-index:99;display:none;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.mb{--nt:#FEF08A;--tp:#FCA5A5;padding:26px 22px 22px;width:415px;max-width:96%;text-align:center;position:relative}
.mb h2{font-size:1.36rem;color:#92400E;margin-bottom:10px;line-height:1.25}
.mb input{width:100%;padding:11px;border:2px solid #FCD34D;border-radius:11px;font-family:'Nunito';font-weight:800;
  font-size:1rem;text-align:center;outline:none;margin-bottom:10px;background:#FFFDF5}
.mb input.er{border-color:var(--bad);background:#FEE2E2;animation:shk .42s}
.mb .em{color:#B91C1C;font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.24rem;color:#92400E;line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.5rem;color:var(--deep)}
.mb .rt{font-weight:900;color:#5B21B6;font-size:1.08rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.93rem;line-height:1.65;margin-bottom:10px;color:#78350F}
.mb img{width:100%;max-width:250px;border-radius:13px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="dz" id="dz"></div>
<div class="wrap">
  <div class="hdr note"><span class="tape"></span>
    <h1>📺 UNIT 7 · TELEVISION — TEST 1</h1>
    <p>🎓 Giáo viên tạo: Ms. Chí Nên<br>
    <b>A. LANGUAGE FOCUS (I → VI)</b> &nbsp;+&nbsp; <b>C. WRITING (I → III)</b> &nbsp;·&nbsp; 41 câu &nbsp;·&nbsp; có lý thuyết trước mỗi bài</p>
  </div>
  <div class="sb">🌟 <b><span id="sc">0</span>/<span id="tt">0</span></b>
    <div class="tr"><div class="fl" id="fb"></div></div><span id="md">💪</span></div>
  <div id="app"></div>
  <div class="sub"><button class="sbtn" onclick="openName()">🎯 NỘP BÀI</button></div>
</div>
<div class="ov" id="nOv"><div class="mb note"><span class="tape"></span><h2>✍️ Nhập tên của con</h2>
  <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="em" id="nEr">⚠️ Con chưa nhập tên kìa!</div>
  <button class="sbtn" style="width:100%;font-size:1.05rem;padding:10px" onclick="showResult()">🚀 Xem kết quả</button></div></div>
<div class="ov" id="rOv"><div class="mb note"><span class="tape"></span><div class="gr" id="rG"></div>
  <div class="rs" id="rS"></div><div class="rt" id="rT"></div><img id="rI" alt=""><div class="rm" id="rM"></div>
  <button class="sbtn" style="width:100%;font-size:1.05rem;padding:10px;background:var(--lilac)" onclick="location.reload()">🔄 Làm lại</button></div></div>

<script>
/* ══ LỚP TRANG TRÍ: 26 hình bay lơ lửng — sao · giấy nhớ tí hon · bong bóng · emoji ══ */
(function(){
  const L=document.getElementById('dz');
  const emo=['⭐','✨','📺','🌸','💛','🎬','🌼','🧸','🍀','☁️','🎈','🌈'];
  const col=['#FDE047','#FCA5A5','#6EE7B7','#93C5FD','#C4B5FD','#FDBA74','#F9A8D4','#A7F3D0','#FEF08A'];
  for(let i=0;i<26;i++){
    const d=document.createElement('div');d.className='dd';
    const inner=document.createElement('i');
    const kind=i%4;
    if(kind===0){
      inner.textContent=emo[i%emo.length];
      inner.style.fontSize=(13+Math.random()*19)+'px';
    }else{
      const s=document.createElement('div');
      s.className=kind===1?'stt':kind===2?'mini':'bub';
      s.style.setProperty('--s',(9+Math.random()*12).toFixed(0)+'px');
      s.style.setProperty('--c',col[i%col.length]);
      inner.appendChild(s);
    }
    d.style.left=(Math.random()*96)+'%';
    d.style.animationDuration=(14+Math.random()*16)+'s';
    d.style.animationDelay=(-Math.random()*26)+'s';
    inner.style.animationDuration=(2.3+Math.random()*2.9)+'s';
    d.appendChild(inner);L.appendChild(d);
  }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#FDE047','#FB923C','#FCA5A5','#6EE7B7','#A78BFA','#93C5FD'];
 for(let i=0;i<32;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}

/* ══ RENDER ══ */
function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='ord'){
  const so=shuffle(m.words);maps[gid]=so;built[gid]=[];
  c.innerHTML='<div class="qt">'+h+'Sắp xếp thành câu hoàn chỉnh:</div>'+
   '<div class="chips" id="p_'+gid+'">'+
   so.map((w,i)=>'<button class="cp" data-i="'+i+'" onclick="tap(\''+gid+'\','+i+')">'+w+'</button>').join('')+'</div>'+
   '<div class="built" id="s_'+gid+'"><span class="ph">Bấm vào các thẻ từ ở trên…</span></div>'+
   '<div class="acts"><button class="ck" id="b_'+gid+'">Kiểm tra</button>'+
   '<button class="ck gh" id="r_'+gid+'">✕ Xoá hết</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  c.querySelector('#b_'+gid).onclick=()=>chk(gid);
  c.querySelector('#r_'+gid).onclick=()=>{
   if(done[gid])return;built[gid]=[];
   document.querySelectorAll('#p_'+gid+' .cp').forEach(b=>b.classList.remove('gone'));
   document.getElementById('s_'+gid).innerHTML='<span class="ph">Bấm vào các thẻ từ ở trên…</span>';
  };
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">Kiểm tra</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function tap(gid,i){
 if(done[gid])return;
 const b=document.querySelector('#p_'+gid+' .cp[data-i="'+i+'"]');
 if(!b||b.classList.contains('gone'))return;
 b.classList.add('gone');built[gid].push(maps[gid][i]);
 document.getElementById('s_'+gid).textContent=built[gid].join(' ')+' '+Q[+gid.slice(1)].end;
}
function chk(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],s=document.getElementById('s_'+gid),c=document.getElementById('c_'+gid);
 if(!built[gid].length){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 done[gid]=true;answered++;
 const ok=m.accept.map(norm).indexOf(norm(built[gid].join(' ')))>-1;
 s.classList.add(ok?'ok':'no');
 document.getElementById('b_'+gid).disabled=true;document.getElementById('r_'+gid).disabled=true;
 document.querySelectorAll('#p_'+gid+' .cp').forEach(b=>b.style.pointerEvents='none');
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — Test 1 Unit 7 hoàn hảo! 🎉';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ mẹo đếm 3–1 khi làm phát âm và quy trình soi lỗi 4 bước nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại bảng đuôi từ và bảng hai thì hiện tại rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
