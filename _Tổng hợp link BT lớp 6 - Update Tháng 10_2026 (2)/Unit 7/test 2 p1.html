<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 UNIT 7 TELEVISION · TEST 2 — A (I–VI) &amp; C (I–III) — Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--void:#04001a;--glass:rgba(255,255,255,.06);--gb:rgba(130,90,255,.3);
  --blue:#00d9ff;--pink:#ff6eb4;--green:#00ff88;--yellow:#ffe600;--violet:#a78bfa;
  --good:#00ff88;--bad:#ff4757;--ink:#e8e0ff;--dim:#9580c0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:var(--void);color:var(--ink);min-height:100vh;overflow-x:hidden}
/* ── TRỜI ĐÊM ── */
.sky{position:fixed;inset:0;z-index:-4;
  background:linear-gradient(125deg,#04001a,#110030,#050d2a,#0d0028,#010820,#1a0033);
  background-size:500% 500%;animation:skyShift 20s ease infinite}
@keyframes skyShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.neb{position:fixed;inset:0;z-index:-3;
  background:radial-gradient(ellipse 70% 50% at 20% 28%,rgba(100,30,200,.20),transparent 62%),
   radial-gradient(ellipse 52% 60% at 82% 68%,rgba(0,100,200,.17),transparent 62%),
   radial-gradient(ellipse 42% 40% at 48% 92%,rgba(200,0,150,.13),transparent 62%)}
/* ── MẶT TRĂNG ── */
.moon{position:fixed;top:38px;right:34px;width:104px;height:104px;border-radius:50%;z-index:-2;pointer-events:none;
  background:radial-gradient(circle at 34% 30%,#fffdf2 4%,#f4ecd0 42%,#d9cfae 78%,#b8ad8a 100%);
  box-shadow:0 0 34px 10px rgba(255,247,214,.30),0 0 90px 34px rgba(255,240,190,.14),
   inset -12px -10px 26px rgba(90,80,50,.28);
  animation:moonGlow 9s ease-in-out infinite}
@keyframes moonGlow{0%,100%{box-shadow:0 0 34px 10px rgba(255,247,214,.28),0 0 90px 34px rgba(255,240,190,.12),
   inset -12px -10px 26px rgba(90,80,50,.28)}
 50%{box-shadow:0 0 46px 16px rgba(255,247,214,.42),0 0 120px 46px rgba(255,240,190,.20),
   inset -12px -10px 26px rgba(90,80,50,.28)}}
/* hố trăng */
.moon::before,.moon::after{content:'';position:absolute;border-radius:50%;background:rgba(120,108,78,.20)}
.moon::before{width:22px;height:22px;top:24px;left:20px;box-shadow:26px 34px 0 -3px rgba(120,108,78,.16),
  8px 62px 0 -8px rgba(120,108,78,.14)}
.moon::after{width:14px;height:14px;top:58px;left:48px;box-shadow:16px -30px 0 -2px rgba(120,108,78,.13)}
@media(max-width:640px){.moon{width:72px;height:72px;top:26px;right:16px}}
/* ── SAO & CHÒM SAO ── */
.stars{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:twk var(--d,3s) ease-in-out var(--dl,0s) infinite}
@keyframes twk{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:1;transform:scale(1.45)}}
.cons{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.cons svg{position:absolute;overflow:visible;animation:consPulse var(--cd,11s) ease-in-out infinite}
@keyframes consPulse{0%,100%{opacity:.34}50%{opacity:.9}}
.cons line{stroke:rgba(0,217,255,.55);stroke-width:1;stroke-linecap:round}
.cons circle{fill:#fff}
/* ── SAO BĂNG ── */
.met{position:fixed;top:-70px;border-radius:2px;z-index:-1;
  background:linear-gradient(180deg,transparent,var(--blue),rgba(255,255,255,.95));
  animation:metFall linear infinite}
@keyframes metFall{0%{opacity:1;transform:translateY(-70px) translateX(0) rotate(35deg)}
 100%{opacity:0;transform:translateY(112vh) translateX(-320px) rotate(35deg)}}
/* ── KHUNG ── */
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:18px 14px 90px}
h1,h2,h3,.pill,.qn,.sbtn,.ck,.lb,.l,.tg{font-family:'Orbitron',sans-serif;font-weight:700}
.glass{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--gb);border-radius:22px;
  box-shadow:0 8px 32px rgba(80,30,200,.14),inset 0 1px 0 rgba(255,255,255,.08)}
.hdr{padding:22px 20px 18px;text-align:center;margin:8px 0 20px}
.hdr h1{font-size:clamp(15px,3.1vw,21px);line-height:1.5;letter-spacing:1.4px;
  background:linear-gradient(90deg,#00d9ff,#ff6eb4,#ffe600,#00d9ff);background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shim 5s linear infinite}
@keyframes shim{0%{background-position:0%}100%{background-position:300%}}
.hdr p{font-size:.84rem;font-weight:700;color:var(--dim);margin-top:9px;line-height:1.75}
.hdr p b{color:var(--blue)}
.sb{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:20px;
  border-radius:999px;background:rgba(8,4,30,.82);backdrop-filter:blur(14px);border:1px solid var(--gb)}
.sb b{font-family:'Orbitron',sans-serif;font-size:1.02rem;color:var(--green)}
.tr{flex:1;height:9px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--pink),var(--yellow));transition:width .45s}
.sec{padding:22px 16px 20px;margin-bottom:28px}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:2px 0 6px}
.pill{color:#fff;border-radius:999px;padding:3px 15px;font-size:.82rem;letter-spacing:1.3px;
  box-shadow:0 0 16px rgba(0,0,0,.4)}
.st h2{font-size:1.03rem;line-height:1.45;color:#fff;font-family:'Nunito';font-weight:900}
.si{font-size:.85rem;font-weight:600;color:var(--dim);font-style:italic;margin:3px 0 16px;line-height:1.75}
/* ── LÝ THUYẾT ── */
.th{background:rgba(8,4,30,.62);border:1px solid rgba(0,217,255,.26);border-radius:16px;padding:14px 14px 16px;
  margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.th h3{font-size:.82rem;letter-spacing:1.4px;color:var(--blue);margin-bottom:11px;line-height:1.6;
  border-bottom:1px solid rgba(0,217,255,.2);padding-bottom:7px;text-transform:uppercase}
.ru{background:rgba(255,255,255,.035);border-left:4px solid var(--violet);border-radius:0 11px 11px 0;
  padding:8px 12px;margin-bottom:8px;font-size:.92rem;line-height:1.8;font-weight:600;color:#d9cffb}
.ru b{color:var(--yellow)}
.eg{display:inline-block;background:rgba(0,217,255,.12);border:1px solid rgba(0,217,255,.35);border-radius:8px;
  padding:1px 9px;font-weight:800;color:#7fe9ff;margin:3px 4px 0 0;font-size:.9rem}
.tb{width:100%;border-collapse:collapse;margin:9px 0;font-size:.86rem}
.tb th{background:linear-gradient(135deg,#7c3aed,#0ea5e9);color:#fff;padding:7px 9px;
  border:1px solid rgba(130,90,255,.35);font-family:'Orbitron',sans-serif;font-size:.76rem;letter-spacing:.8px}
.tb td{background:rgba(255,255,255,.03);padding:7px 9px;border:1px solid rgba(130,90,255,.22);
  font-weight:600;line-height:1.7;color:#ddd4fb}
.tb tr:nth-child(even) td{background:rgba(255,255,255,.055)}
.tb td b{color:var(--green)}.tb td s{color:#ff8090}
.tip{background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.35);border-radius:12px;padding:9px 13px;
  font-size:.91rem;font-weight:600;line-height:1.85;color:#9dffcd}
.tip b{color:var(--green)}
.wn{background:rgba(255,71,87,.08);border:1px solid rgba(255,71,87,.38);border-radius:12px;padding:9px 13px;
  font-size:.91rem;font-weight:600;line-height:1.85;color:#ffb3bc;margin-top:9px}
.wn b{color:#ff8fa0}.wn s{color:#ff6070}
/* ── CÂU HỎI ── */
.q{background:rgba(255,255,255,.028);border:1px solid rgba(130,90,255,.18);border-radius:16px;
  padding:14px 14px 15px;margin-bottom:14px;transition:border-color .3s}
.q.dn{border-color:rgba(130,90,255,.4)}
.q.shk{animation:shk .42s ease}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
 60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.qn{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7c3aed,#4f46e5);
  color:#fff;min-width:30px;height:26px;padding:0 8px;border-radius:13px;font-size:.74rem;font-weight:800;
  margin-right:9px;font-family:'Orbitron',sans-serif}
.qt{font-size:1rem;font-weight:700;color:#fff;line-height:1.9}
.qt .bl{display:inline-block;min-width:96px;border-bottom:2px solid var(--blue);text-align:center;
  color:var(--blue);font-weight:900}
.src{background:rgba(0,0,0,.3);border-left:4px solid var(--violet);border-radius:0 11px 11px 0;padding:9px 13px;
  margin-top:9px;font-weight:700;font-size:1rem;line-height:1.85;color:#e9e2ff}
.cue{background:rgba(255,230,0,.07);border:1px dashed rgba(255,230,0,.42);border-radius:11px;padding:9px 13px;
  margin-top:9px;font-weight:800;font-size:1rem;line-height:1.85;color:#ffe98a}
.quote{background:rgba(0,217,255,.07);border-left:4px solid var(--blue);border-radius:0 11px 11px 0;padding:9px 13px;
  margin-top:9px;font-weight:700;font-size:1rem;line-height:1.85;color:#a8ecff;font-style:italic}
.tg{display:inline-block;background:rgba(167,139,250,.16);border:1px solid rgba(167,139,250,.45);color:#c9b6ff;
  border-radius:8px;padding:0 9px;font-size:.76rem;margin-left:6px;letter-spacing:.6px}
/* nhấn mạnh chung — tô sáng, KHÔNG gạch chân cho đỡ rối */
u{background:rgba(255,230,0,.16);border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800;color:var(--yellow)}
/* riêng bài phát âm: tô vàng + gạch chân đậm cho thật rõ */
.ob u,.g2 u,.qt u{background:rgba(255,230,0,.24);border-radius:3px;padding:0 1px;margin:0 -1px;color:var(--yellow);
  font-weight:900;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;
  text-decoration-color:var(--yellow)}
/* dấu nhấn âm (trọng âm) */
.ss{color:var(--yellow);font-weight:900;font-size:1.06em;text-shadow:0 0 10px rgba(255,230,0,.6)}
/* phần cần sửa lỗi A·B·C·D */
.pt{display:inline-block;background:rgba(255,110,180,.12);border:1px solid rgba(255,110,180,.45);border-radius:9px;
  padding:0 8px 0 3px;margin:0 2px;font-weight:800;color:#ffc2e0}
.pt b{display:inline-block;background:linear-gradient(135deg,#ff6eb4,#a855f7);color:#fff;border-radius:6px;
  padding:0 6px;margin-right:6px;font-size:.74rem;font-family:'Orbitron',sans-serif}
/* ── PHƯƠNG ÁN ── */
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:660px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.og{grid-template-columns:1fr}}
.ob{background:rgba(90,40,180,.22);border:2px solid rgba(130,90,255,.3);border-radius:15px;padding:11px 14px;
  color:#ddd0ff;font-family:'Nunito',sans-serif;font-size:.97rem;font-weight:700;cursor:pointer;text-align:center;
  transition:all .18s ease;box-shadow:0 4px 14px rgba(80,30,180,.18);line-height:1.55;word-break:break-word}
.ob:hover:not(.dn){transform:translateY(-2px) scale(1.02);background:rgba(90,40,180,.42);border-color:var(--blue);
  box-shadow:0 8px 22px rgba(0,200,255,.24)}
.ob.ok{background:rgba(0,255,136,.18);border-color:var(--good);color:#00ff88;box-shadow:0 0 20px rgba(0,255,136,.3)}
.ob.no{background:rgba(255,71,87,.18);border-color:var(--bad);color:#ff8090}
.ob.dim{opacity:.35}
.ob b{display:inline-block;background:linear-gradient(135deg,#ff6eb4,#a855f7);color:#fff;border-radius:6px;
  padding:0 7px;margin-right:6px;font-size:.76rem;font-family:'Orbitron',sans-serif}
.ob.ok b{background:linear-gradient(135deg,#00ff88,#0ea5e9);color:#04001a}
.ob.no b{background:var(--bad)}
.fr{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:11px}
.ti{flex:1;min-width:200px;background:rgba(0,0,0,.4);border:2px solid rgba(130,90,255,.36);border-radius:12px;
  padding:10px 14px;color:#fff;font-family:'Nunito',sans-serif;font-size:.98rem;font-weight:700;outline:none;
  transition:border-color .25s}
.ti::placeholder{color:#7a6aa8}
.ti:focus{border-color:var(--blue);box-shadow:0 0 16px rgba(0,217,255,.22)}
.ti.ok{border-color:var(--good);background:rgba(0,255,136,.12);color:#b6ffd8}
.ti.no{border-color:var(--bad);background:rgba(255,71,87,.12);color:#ffc0c7}
.ck{background:linear-gradient(135deg,#7c3aed,#0ea5e9);border:none;border-radius:20px;color:#fff;
  font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.9px;padding:11px 22px;
  cursor:pointer;transition:all .2s;white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(100,50,200,.45)}
.ck:disabled{opacity:.4;cursor:default}
/* ── GIẢI THÍCH ── */
.ex{display:none;background:rgba(8,4,30,.9);border:1px solid rgba(80,180,255,.3);border-radius:14px;padding:16px;
  margin-top:13px;font-size:.93rem;line-height:1.85;animation:sd .35s ease}
.ex.show{display:block}
@keyframes sd{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:translateY(0)}}
.kb{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.4);border-radius:10px;padding:8px 12px;
  margin-bottom:10px;font-weight:900;color:#8dffc4;line-height:1.75}
.vi{background:rgba(255,200,80,.09);border-left:3px solid #fdcb6e;border-radius:0 9px 9px 0;padding:7px 12px;
  color:#ffd580;margin-bottom:10px;font-weight:600;line-height:1.75}
.sp{background:rgba(255,255,255,.03);border:1px solid rgba(130,90,255,.2);border-radius:10px;padding:8px 12px;
  margin-bottom:8px;line-height:1.85;color:#ddd4fb}
.sp .l{display:inline-block;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border-radius:20px;
  padding:2px 10px;font-size:.66rem;font-weight:800;letter-spacing:.9px;margin-bottom:5px;
  font-family:'Orbitron',sans-serif}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:6px 0}
@media(max-width:620px){.g2{grid-template-columns:1fr}}
.g2>div{background:rgba(0,0,0,.28);border:1px solid rgba(130,90,255,.2);border-radius:9px;padding:6px 10px;
  line-height:1.7;font-weight:600;color:#d6ccf7}
.w{color:#60a5fa;font-weight:800}.m{color:#fb923c;font-weight:700}.g{color:#4ade80;font-weight:900}
.t{background:rgba(100,200,255,.14);color:#67e8f9;padding:1px 6px;border-radius:4px;font-size:.78em;
  font-weight:700;font-style:italic;margin:0 4px}
.pg{color:#fff5b8;font-weight:700}
.ipa{color:#c084fc;background:rgba(192,132,252,.15);padding:1px 6px;border-radius:5px;
  font-family:'Courier New',monospace;font-size:.88em;font-weight:800}
.fx{display:inline-block;background:rgba(255,71,87,.2);color:#ff9aa5;border-radius:6px;padding:0 7px;
  font-weight:900;text-decoration:line-through}
.fy{display:inline-block;background:rgba(0,255,136,.18);color:#8dffc4;border-radius:6px;padding:0 7px;font-weight:900}
/* ── NỘP BÀI & MODAL ── */
.sub{text-align:center;padding:26px 10px}
.sbtn{background:linear-gradient(135deg,#7c3aed,#4f46e5,#0ea5e9);border:none;border-radius:28px;color:#fff;
  font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:1.1px;padding:15px 42px;
  cursor:pointer;box-shadow:0 8px 28px rgba(100,50,200,.5);transition:all .3s}
.sbtn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 15px 40px rgba(100,50,200,.68)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:1000;display:none;align-items:center;
  justify-content:center;backdrop-filter:blur(6px);padding:16px;overflow-y:auto}
.ov.on{display:flex}
.mb{background:linear-gradient(135deg,rgba(18,8,55,.97),rgba(5,1,18,.97));border:1px solid rgba(130,90,255,.5);
  border-radius:26px;padding:30px 26px;max-width:460px;width:94%;text-align:center;
  box-shadow:0 20px 60px rgba(100,50,255,.4);max-height:90vh;overflow-y:auto}
.mb h2{font-size:1rem;letter-spacing:1.2px;margin-bottom:16px;
  background:linear-gradient(90deg,#00d9ff,#ff6eb4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text}
.mb input{width:100%;background:rgba(0,0,0,.45);border:2px solid rgba(130,90,255,.4);border-radius:12px;
  padding:12px 15px;color:#fff;font-family:'Nunito',sans-serif;font-size:.98rem;font-weight:700;text-align:center;
  margin-bottom:12px;outline:none;transition:border-color .3s}
.mb input::placeholder{color:#7a6aa8}
.mb input:focus{border-color:var(--blue)}
.mb input.er{border-color:var(--bad);animation:shk .42s ease}
.mb .em{color:#ff6070;font-size:.82rem;margin-bottom:10px;display:none;font-weight:700}
.mb .gr{font-family:'Orbitron',sans-serif;font-size:.92rem;color:var(--yellow);margin-bottom:8px;line-height:1.5}
.mb .rs{font-family:'Orbitron',sans-serif;font-size:2.7rem;font-weight:900;margin:12px 0 4px;
  background:linear-gradient(90deg,#00ff88,#00d9ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text}
.mb .rt{font-size:1.06rem;font-weight:800;color:var(--yellow);margin:4px 0 8px}
.mb .rm{font-size:.92rem;font-weight:600;color:#cfc4f2;line-height:1.75;margin-bottom:12px}
.mb img{width:100%;max-width:250px;border-radius:14px;margin:12px auto;display:block;
  border:1px solid rgba(130,90,255,.4)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:1100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="sky"></div><div class="neb"></div><div class="moon"></div>
<div class="stars" id="stars"></div><div class="cons" id="cons"></div>

<div class="wrap">
  <div class="hdr glass">
    <h1>🌙 UNIT 7 · TELEVISION — TEST 2</h1>
    <p>🎓 Giáo viên tạo: Ms MS Chí Nên<br>
    <b>A. LANGUAGE FOCUS (I → VI)</b> &nbsp;+&nbsp; <b>C. WRITING (I → III)</b><br>
    40 câu &nbsp;·&nbsp; có lý thuyết trước mỗi bài &nbsp;·&nbsp; <i>(bỏ phần B. READING theo yêu cầu)</i></p>
  </div>
  <div class="sb">🌟 <b><span id="sc">0</span>/<span id="tt">0</span></b>
    <div class="tr"><div class="fl" id="fb"></div></div><span id="md">💪</span></div>
  <div id="app"></div>
  <div class="sub"><button class="sbtn" onclick="openName()">🚀 NỘP BÀI</button></div>
</div>

<div class="ov" id="nOv"><div class="mb"><h2>✍️ NHẬP TÊN CỦA CON</h2>
  <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="em" id="nEr">⚠️ Con chưa nhập tên kìa!</div>
  <button class="sbtn" style="width:100%;font-size:.86rem;padding:12px" onclick="showResult()">XEM KẾT QUẢ</button></div></div>
<div class="ov" id="rOv"><div class="mb"><div class="gr" id="rG"></div>
  <div class="rs" id="rS"></div><div class="rt" id="rT"></div><img id="rI" alt=""><div class="rm" id="rM"></div>
  <button class="sbtn" style="width:100%;font-size:.86rem;padding:12px" onclick="location.reload()">🔄 LÀM LẠI</button></div></div>

<script>
/* ══ SAO NHÁY · CHÒM SAO · SAO BĂNG ══ */
(function(){
  const S=document.getElementById('stars');
  for(let i=0;i<130;i++){
    const s=document.createElement('div');s.className='star';
    const z=(Math.random()*2.1+.8).toFixed(1);
    s.style.width=z+'px';s.style.height=z+'px';

function a4(num,sent,ansL,ansW,parts,vn,pack,why,trap){
 mcq('S4',num,'<b>'+num+'.</b> Chọn phần được đánh dấu CẦN SỬA:<div class="src">'+sent+'</div>',

}

const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){
 const d=document.createElement('div');d.className='sec glass';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+
  '</span><h2>'+title+'</h2></div><div class="si">'+ins+'</div>';
 APP.appendChild(d);CUR=d}

/* ══ RENDER ══ */
function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');c.classList.add('dn');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 c.classList.add('dn');
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — Test 2 Unit 7 hoàn hảo! 🌙✨';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ quy tắc trọng âm đuôi -tion và mẹo gán dấu (+/–) cho liên từ nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại bảng đuôi từ và bảng hai thì hiện tại rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
