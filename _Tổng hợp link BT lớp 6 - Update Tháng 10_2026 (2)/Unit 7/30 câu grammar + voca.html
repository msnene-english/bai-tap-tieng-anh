<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms MS Chí Nên - English 6: TV Vocabulary</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #00C9A7;
            --correct: #00D26A;
            --wrong: #FF4757;
            --bg-color: #f0f7ff;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2d3436;
            overflow-x: hidden;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 0 #e2e8f0;
            transition: all 0.3s ease;
        }

        .option-btn {
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 6px 0 #e2e8f0;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 8px 0 #733fa1;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #733fa1;
        }

        .option-btn.correct {
            background-color: var(--correct) !important;
            border-color: #00a352 !important;
            box-shadow: 0 6px 0 #008141 !important;
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong) !important;
            border-color: #d63031 !important;
            box-shadow: 0 6px 0 #a9242f !important;
            color: white;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .explanation-box {
            background: #f8f1ff;
            border-left: 6px solid var(--primary);
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), #00e0ba);
            transition: width 0.5s ease;
        }

        .glossary-table th {
            background-color: var(--primary);
            color: white;
        }

        .glossary-table td {
            border-bottom: 1px solid #edf2f7;
        }

        /* Phone UI for specific Qs */
        .phone-mockup {
            border: 8px solid #2d3436;
            border-radius: 20px;
            padding: 10px;
            background: #fff;
            max-width: 250px;
            margin: auto;
        }
        .message-bubble {
            background: #e9e9eb;
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        /* Sale Sign UI */
        .sale-sign {
            background: #ff4757;
            color: white;
            padding: 15px;
            border: 4px dashed white;
            text-align: center;
            font-weight: 900;
            transform: rotate(-2deg);
        }
    </style>
</head>

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('quiz-container');
            answered = false;

            // Update Progress
            const progPercent = (currentQuestion / questions.length) * 100;
            document.getElementById('progress').style.width = progPercent + '%';
            document.getElementById('progress-text').innerText = `${currentQuestion}/${questions.length}`;

            let optionsHtml = '';
            q.options.forEach((opt, index) => {
                optionsHtml += `
                    <button onclick="checkAnswer(${index})" id="opt-${index}" 
                        class="option-btn p-5 w-full bg-white text-lg font-bold text-gray-700">
                        <span class="inline-block w-8 h-8 rounded-full border-2 border-gray-200 text-center leading-7 mr-3">${String.fromCharCode(65 + index)}</span>
                        ${opt}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="card p-6 md:p-10 mb-8 transition-all">
                    <div class="flex justify-between items-center mb-6">
                        <span class="bg-primary/10 text-primary px-4 py-1 rounded-full font-black text-sm">CÂU HỎI ${q.id}</span>
                    </div>
                    
                    <h2 class="text-xl md:text-2xl font-extrabold text-gray-800 mb-8 leading-relaxed">
                        ${q.question}
                    </h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        ${optionsHtml}
                    </div>

                    <div id="explanation" class="explanation-box p-6">
                        <div class="flex items-center gap-2 mb-4">
                            <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white">👩‍🏫</div>
                            <h3 class="font-black text-primary text-lg">Cô MS Chí Nên Giải Thích:</h3>
                        </div>
                        
                        <div class="space-y-4 text-gray-700">
                            <div>
                                <p class="font-bold text-sm uppercase text-gray-400 mb-1">1. Phân tích từ vựng:</p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    ${q.explanation.analysis.map((item, idx) => `
                                        <p><strong>${String.fromCharCode(65+idx)}. ${item.word}</strong> (${item.type}): ${item.meaning}</p>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div>
                                <p class="font-bold text-sm uppercase text-gray-400 mb-1">2. Dịch nghĩa toàn câu:</p>
                                <p class="italic text-gray-600">"${q.explanation.fullTranslation}"</p>
                            </div>

                            <div>
                                <p class="font-bold text-sm uppercase text-gray-400 mb-1">3. Tại sao chọn đáp án này?</p>
                                <p class="mb-2"><span class="text-green-600 font-bold">✓ Đúng:</span> ${q.explanation.whyCorrect}</p>
                                <p><span class="text-red-500 font-bold">✗ Loại trừ:</span> ${q.explanation.whyWrong}</p>
                            </div>
                        </div>

                        <div class="mt-8 flex justify-center">
                            <button onclick="nextQuestion()" class="bg-secondary text-white px-10 py-3 rounded-2xl font-black shadow-[0_6px_0_#00a388] hover:translate-y-[-2px] active:translate-y-[4px] active:shadow-none transition-all">
                                CÂU TIẾP THEO ➜
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function checkAnswer(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const btn = document.getElementById(`opt-${index}`);
            const explanation = document.getElementById('explanation');
            const soundCorrect = document.getElementById('sound-correct');
            const soundWrong = document.getElementById('sound-wrong');

            if (index === q.correct) {
                btn.classList.add('correct');
                score++;
                soundCorrect.play();
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#8854C0', '#00C9A7', '#FFD700']
                });
            } else {
                btn.classList.add('wrong');
                document.getElementById(`opt-${q.correct}`).classList.add('correct');
                btn.parentElement.classList.add('shake');
                soundWrong.play();
            }

            explanation.style.display = 'block';
            
            // Scroll to explanation smoothly
            setTimeout(() => {
                explanation.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('finish-area').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score}/${questions.length}`;
            
            // Update full progress
            document.getElementById('progress').style.width = '100%';
            document.getElementById('progress-text').innerText = `${questions.length}/${questions.length}`;

            let msg = "";
            const percent = (score / questions.length) * 100;
            if (percent === 100) msg = "SIÊU NHÂN TIẾNG ANH! Cô MS Chí Nên tự hào về em vô cùng! 🎉";
            else if (percent >= 80) msg = "TUYỆT VỜI! Em nắm từ vựng TV rất tốt đấy! 🌟";
            else if (percent >= 50) msg = "KHÁ LẮM! Em hãy ôn lại các từ chưa thuộc nhé! 💪";
            else msg = "CỐ GẮNG LÊN! Đọc kỹ phần giải thích của cô để tiến bộ hơn nha! ❤️";
            
            document.getElementById('feedback-msg').innerText = msg;

            if(percent >= 80) {
                confetti({
                    particleCount: 200,
                    spread: 100,
                    origin: { y: 0.6 }
                });
            }
        }

        // Initialize
        window.onload = renderQuestion;
    </script>
