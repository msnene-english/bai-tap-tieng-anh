<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Tím hồng */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2f3542;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Chống copy để tập trung làm bài */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E0EAFC;
            background-image: radial-gradient(#8854C0 1px, transparent 1px), radial-gradient(#00C9A7 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
        }

        .header-badge {
            background: linear-gradient(45deg, var(--primary), #a29bfe);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(136, 84, 192, 0.4);
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
            border: 3px solid white;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding-bottom: 80px;
        }

        /* CARD STYLES */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1); /* 3D effect */
            border: 2px solid #eee;
            position: relative;
            transition: transform 0.3s;
        }

        .question-number {
            background: var(--secondary);
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .question-text u {
            text-decoration: none;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 2px;
        }

        /* OPTIONS STYLES */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #e1e1e1;
            text-align: left;
            position: relative;
        }

        .option-btn:hover:not(.disabled) {
            transform: scale(1.02);
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* STATE STYLES */
        .option-btn.correct {
            background: var(--correct);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 4px 0 #00b85c;
            animation: pop 0.4s ease;
        }

        .option-btn.wrong {
            background: var(--wrong);
            color: white;
            border-color: #e03b49;
            box-shadow: 0 4px 0 #e03b49;
            animation: shake 0.5s ease;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
            pointer-events: none;
        }

        /* EXPLANATION BOX */
        .explanation-box {
            margin-top: 20px;
            background: #F8F0FF;
            border: 2px dashed var(--primary);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: var(--primary);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .exp-section {
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .exp-label {
            font-weight: 800;
            color: #57606f;
            display: block;
            margin-bottom: 3px;
        }

        .exp-text {
            color: #2f3542;
        }

        .highlight-green { color: var(--correct); font-weight: bold; }
        .highlight-red { color: var(--wrong); font-weight: bold; }

        /* ANIMATIONS */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            50% { transform: translateX(5px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FOOTER & SUBMIT */
        .floating-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 12px 40px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #6c4299;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* RESULT MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            animation: pop 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--secondary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 0 0 5px var(--secondary);
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }

    </style>
</head>
<body>

    <div class="header-badge">
        👑 Giáo viên tạo: Ms. Chí Nên

    <canvas id="confetti-canvas"></canvas>

    <script>
        // SOUND EFFECTS (Base64 encoded to keep single file)
        const sndCorrect = new Audio("data:audio/wav;base64,UklGRi4AAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="); // Placeholder structure
        // Simple Web Audio API for cleaner sounds without large strings
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // CONFETTI EFFECT
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let confetti = [];

        function fireConfetti() {
            confetti = [];
            for (let i = 0; i < 100; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: ['#8854C0', '#00C9A7', '#FF4757', '#FFD700'][Math.floor(Math.random() * 4)],
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 5 + 2
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            confetti.forEach(p => {
                p.y += p.speed;
                p.x += Math.sin(p.y / 20);
                if (p.y < canvas.height) active = true;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            if (active) requestAnimationFrame(animateConfetti);
        }

        let score = 0;
        let answeredCount = 0;
        const totalQuestions = quizData.length;

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-${index}`;

                // Question Header
                let qTitle = "";
                if (item.type === 'phonetics') qTitle = `PHONETICS: ${item.q}`;
                else if (item.type === 'stress') qTitle = `STRESS: ${item.q}`;
                else qTitle = `QUESTION ${index + 1}`;

                // HTML structure for question text
                // Handle underlining for phonetics if needed in Q text, though logic handles options mostly
                let qTextDisplay = item.q;
                if(item.type === 'phonetics') {
                    // Highlight the word in the question if it matches? 
                    // Actually prompts are "Choose word...", the question text is usually the word itself in simple list, but here we structured nicely.
                    // For Phonetics I, Q is the word list. The provided Q field is just a label or one word.
                    // Let's refine display for Phonetics type 1: "Choose word... different"
                    if(item.id <= 10) qTextDisplay = `Find the word with different sound in underlined part: <b>'${item.underline}'</b>`;
                    if(item.id > 10 && item.id <= 20) qTextDisplay = `Find the word with different stress position.`;
                }

                const optionsHtml = item.options.map((opt, i) => `
                    <button class="option-btn" onclick="checkAnswer(${index}, ${i}, this)">
                        ${String.fromCharCode(65 + i)}. ${opt}
                    </button>
                `).join('');

                card.innerHTML = `
                    <div class="question-number">Câu ${index + 1}</div>
                    <div class="question-text">${qTextDisplay}</div>
                    <div class="options-grid">
                        ${optionsHtml}
                    </div>
                    
                    <div class="explanation-box" id="exp-${index}">
                        <div class="explanation-header">
                            <div class="teacher-avatar">👩‍🏫</div>
                            <span>Ms. Chí Nên giải thích:</span>
                        </div>
                        <div class="exp-section">
                            <span class="exp-label">🚩 Dịch câu hỏi:</span>
                            <span class="exp-text">${item.exp.q_trans}</span>
                        </div>
                        <div class="exp-section">
                            <span class="exp-label">📖 Phân tích đáp án:</span>
                            <span class="exp-text">${item.exp.ops_trans}</span>
                        </div>
                        <div class="exp-section">
                            <span class="exp-label highlight-green">✅ Tại sao ĐÚNG:</span>
                            <span class="exp-text">${item.exp.why_correct}</span>
                        </div>
                        <div class="exp-section">
                            <span class="exp-label highlight-red">❌ Tại sao SAI:</span>
                            <span class="exp-text">${item.exp.why_wrong}</span>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function checkAnswer(qIndex, selectedOptIndex, btnElement) {
            const questionObj = quizData[qIndex];
            const card = document.getElementById(`q-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            
            // Prevent re-answering
            if (btnElement.classList.contains('disabled')) return;

            // Disable all buttons in this card
            buttons.forEach(btn => btn.classList.add('disabled'));

            // Check Correct/Wrong
            if (selectedOptIndex === questionObj.correct) {
                btnElement.classList.add('correct');
                score++;
                playSound('correct');
                fireConfetti();
            } else {
                btnElement.classList.add('wrong');
                // Highlight the correct one
                buttons[questionObj.correct].classList.add('correct');
                playSound('wrong');
            }

            answeredCount++;

            // Show explanation immediately
            const expBox = document.getElementById(`exp-${qIndex}`);
            expBox.style.display = 'block';
            
            // Auto scroll slightly if needed? No, can be annoying.
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const scoreEl = document.getElementById('final-score');
            const feedbackEl = document.getElementById('feedback-msg');

            scoreEl.innerText = `${score}/${totalQuestions}`;
            
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                feedbackEl.innerText = "Xuất sắc! Bạn là thiên tài tiếng Anh! 🌟🏆";
                fireConfetti();
            } else if (percentage >= 80) {
                feedbackEl.innerText = "Giỏi lắm! Chỉ sai một xíu thôi! 💪";
            } else if (percentage >= 50) {
                feedbackEl.innerText = "Khá tốt! Cố gắng xem lại phần giải thích nhé! 📚";
            } else {
                feedbackEl.innerText = "Đừng buồn! Hãy ôn lại kỹ hơn nhé! ❤";
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // Initialize
        renderQuiz();

    </script>
</body>
</html>
