<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-pink: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #fdf2f8;
            --card-shadow: 0 10px 0px rgba(0,0,0,0.1);
            --btn-shadow: 0 5px 0px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#8854c0 1.5px, transparent 1.5px), radial-gradient(#00c9a7 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            border: 3px solid var(--primary-pink);
        }

        .header h1 {
            color: var(--primary-pink);
            font-weight: 800;
            margin: 0;
            font-size: 2.2rem;
            text-transform: uppercase;
        }

        .header p {
            color: #666;
            font-weight: 700;
            margin-top: 5px;
            font-size: 1.1rem;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
            border: 2px solid #eee;
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .section-title {
            background-color: var(--primary-teal);
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-block;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Reading Layout Styles */
        .reading-box {
            background: #f8f9fa;
            border: 2px dashed var(--primary-pink);
            padding: 20px;
            border-radius: 15px;
            line-height: 1.8;
            font-size: 1.1rem;
            margin-bottom: 20px;
            white-space: pre-line; /* Giữ nguyên xuống dòng */
        }

        .gap-number {
            background: var(--primary-pink);
            color: white;
            padding: 2px 8px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 0 5px;
        }

        /* Glossary Table */
        .glossary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        
        .glossary-table th {
            background: var(--primary-pink);
            color: white;
            padding: 10px;
        }
        
        .glossary-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .glossary-title {
            font-weight: 800;
            color: var(--primary-pink);
            margin-top: 10px;
            display: block;
        }

        /* Question Layout */
        .question-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .question-item {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid transparent;
        }

        .question-text {
            font-weight: 700;
            margin-bottom: 10px;
            color: #444;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-option {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            color: #555;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #ddd;
            text-align: left;
        }

        .btn-option:hover:not(:disabled) {
            transform: scale(1.05);
            border-color: var(--primary-pink);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ddd;
        }

        .btn-option.correct {
            background-color: var(--correct-green);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 4px 0 #009e4f;
        }

        .btn-option.wrong {
            background-color: var(--wrong-red);
            color: white;
            border-color: #e03e4d;
            box-shadow: 0 4px 0 #c23642;
        }

        /* Writing Section Input */
        .writing-input {
            width: 95%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
        }
        
        .writing-input:focus {
            border-color: var(--primary-teal);
        }

        .btn-check-write {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #6a4196;
            transition: all 0.2s;
        }

        .btn-check-write:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Explanation Box */
        .explanation {
            display: none; /* Hidden by default */
            margin-top: 15px;
            background: #fff8e1;
            border-left: 5px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            animation: slideDown 0.3s ease-out;
        }

        .explanation.visible {
            display: block;
        }

        .teacher-avatar {
            font-weight: 800;
            color: var(--primary-pink);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .expl-step {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .expl-label {
            font-weight: bold;
            color: #444;
        }

        .expl-correct { color: var(--correct-green); font-weight: bold; }
        .expl-wrong { color: var(--wrong-red); font-weight: bold; }

        /* Animations */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .shake-element {
            animation: shake 0.4s ease-in-out;
        }

        /* Footer / Submit */
        .footer-controls {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .btn-submit {
            background: var(--primary-teal);
            color: white;
            font-size: 1.5rem;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 0 #009e82;
            transition: transform 0.2s;
        }

        .btn-submit:active {
            transform: translateY(8px);
            box-shadow: none;
        }

        /* Popup Score */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--primary-pink);
        }

        @keyframes popUp {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-teal);
            margin: 20px 0;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Bài Kiểm Tra Tiếng Anh</h1>
        <p>Giáo viên: Ms. Chí Nên </p>
    </div>

    <div class="quiz-container" id="quiz-container">
        </div>

    <div class="footer-controls">
        <button class="btn-submit" onclick="finishQuiz()">Nộp Bài & Xem Điểm</button>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2>Kết Quả Của Bạn</h2>
            <div class="score-display" id="finalScore">0/0</div>
            <p id="feedbackText" style="font-size: 1.2rem; font-weight: 600;">Bạn làm tốt lắm!</p>
            <button class="btn-submit" style="font-size: 1rem; padding: 10px 30px;" onclick="closeModal()">Xem lại bài làm</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const quizData = [
            {
                type: "reading",
                title: "IV. Reading A - Movie Trip Announcement",
                text: `Announcement
Dear students,
We are excited to invite you to a movie trip as part of our fun entertainment activities! This is a great chance to (1)______, enjoy a fantastic film, and spend time with friends.
📅 Date: Friday, March 15th
🕒 Time: 3:00 PM – 6:00 PM
📍 Venue: City Cinema
🎬 Movie: The Adventures of Tom and Jerry
👉 Why join?
Watch (2)______ .
Have a wonderful experience with classmates.
Enjoy delicious snacks and a fun time together.
📢 Important notes:
Please (3) ______ 15 minutes early to get your tickets.
The cinema is very crowded, so you should (4)______ your seats in advance.`,
                glossary: [
                    { word: "Announcement", type: "n", meaning: "Thông báo" },
                    { word: "Entertainment", type: "n", meaning: "Sự giải trí" },
                    { word: "Venue", type: "n", meaning: "Địa điểm" },
                    { word: "Crowded", type: "adj", meaning: "Đông đúc" },
                    { word: "In advance", type: "adv", meaning: "Trước" }
                ],
                questions: [
                    {
                        id: "A1", num: 1, 
                        options: ["relax", "relaxing", "relaxed", "relaxes"],
                        correct: 0,
                        expl: {
                            q_trans: "Đây là cơ hội tuyệt vời để (1) thư giãn, tận hưởng bộ phim...",
                            opts: ["A. relax (v): thư giãn", "B. relaxing (V-ing)", "C. relaxed (V-ed/adj)", "D. relaxes (V-s)"],
                            why_correct: "Cấu trúc 'chance + to V' (cơ hội để làm gì). Sau 'to' ta dùng động từ nguyên thể.",
                            why_wrong: "Các đáp án B, C, D đều chia đuôi sai ngữ pháp."
                        }
                    },
                    {
                        id: "A2", num: 2, 
                        options: ["a interesting movie", "an interesting movie", "a interesting movies", "an interesting movies"],
                        correct: 1,
                        expl: {
                            q_trans: "Xem (2) một bộ phim thú vị.",
                            opts: ["A. sai mạo từ", "B. một bộ phim thú vị", "C. sai ngữ pháp (a + số nhiều)", "D. sai ngữ pháp (an + số nhiều)"],
                            why_correct: "Tính từ 'interesting' bắt đầu bằng nguyên âm /ɪ/ nên dùng mạo từ 'an'. 'Movie' ở đây là danh từ đếm được số ít.",
                            why_wrong: "A sai vì dùng 'a' trước nguyên âm. C, D sai vì 'movies' số nhiều không dùng a/an."
                        }
                    },
                    {
                        id: "A3", num: 3, 
                        options: ["arriving", "arrived", "to arrive", "arrive"],
                        correct: 3,
                        expl: {
                            q_trans: "Làm ơn (3) đến sớm 15 phút...",
                            opts: ["A. V-ing", "B. V-ed", "C. To V", "D. Arrive (V-inf): đến"],
                            why_correct: "Đây là câu mệnh lệnh (Imperative sentence) bắt đầu bằng 'Please' + Động từ nguyên thể.",
                            why_wrong: "Không dùng V-ing hay To V sau Please trong câu mệnh lệnh."
                        }
                    },
                    {
                        id: "A4", num: 4, 
                        options: ["book", "booking", "to booking", "booked"],
                        correct: 0,
                        expl: {
                            q_trans: "...vì vậy bạn nên (4) đặt chỗ trước.",
                            opts: ["A. book (v): đặt vé", "B. V-ing", "C. sai cấu trúc", "D. V-ed"],
                            why_correct: "Sau động từ khuyết thiếu 'should' (nên) luôn là động từ nguyên thể (V-inf).",
                            why_wrong: "B, C, D sai dạng động từ."
                        }
                    }
                ]
            },
            {
                type: "reading",
                title: "IV. Reading B - Mid-Autumn Festival Announcement",
                text: `Announcement
Dear students,
Join us for the Mid-Autumn Festival to enjoy lanterns, mooncakes, and performances while celebrating our culture!
📅 Date: Friday, September 20th
🕒 Time: 6:30 PM – 9:00 PM
📍 Venue: School Yard
🎭 Activities: Lantern parade, lion dance, storytelling, and games
✨ How to register?
Students who want to join should (1)______ their names with their class monitors before September 15th.
Each participant will receive (2)______ small gift.
The event will be held (3)______ the school yard, so please arrive on time.
Remember to bring (4)______ for the parade.
For more details, please contact your English teacher or class monitor. We look forward to seeing you there!
🎉 Let's celebrate the festival together! 🎉
School Events Committee`,
                glossary: [
                    { word: "Lantern", type: "n", meaning: "Đèn lồng" },
                    { word: "Parade", type: "n", meaning: "Cuộc diễu hành" },
                    { word: "Register", type: "v", meaning: "Đăng ký" },
                    { word: "Participant", type: "n", meaning: "Người tham gia" },
                    { word: "Monitor", type: "n", meaning: "Lớp trưởng" }
                ],
                questions: [
                    {
                        id: "B1", num: 1, 
                        options: ["register", "registers", "registering", "registered"],
                        correct: 0,
                        expl: {
                            q_trans: "Học sinh muốn tham gia nên (1) đăng ký tên...",
                            opts: ["A. register (v): đăng ký", "B. V-s", "C. V-ing", "D. V-ed"],
                            why_correct: "Sau 'should' là động từ nguyên thể (V-inf).",
                            why_wrong: "Các dạng chia động từ khác đều sai sau modal verb."
                        }
                    },
                    {
                        id: "B2", num: 2, 
                        options: ["a", "an", "the", "no article"],
                        correct: 0,
                        expl: {
                            q_trans: "Mỗi người tham gia sẽ nhận (2) một món quà nhỏ.",
                            opts: ["A. một (trước phụ âm)", "B. một (trước nguyên âm)", "C. xác định", "D. không mạo từ"],
                            why_correct: "'small' bắt đầu bằng phụ âm /s/ nên dùng 'a'. Đây là lần đầu nhắc đến món quà (chưa xác định).",
                            why_wrong: "B sai vì 's' là phụ âm. C không dùng vì chưa xác định."
                        }
                    },
                    {
                        id: "B3", num: 3, 
                        options: ["on", "in", "between", "above"],
                        correct: 1,
                        expl: {
                            q_trans: "Sự kiện sẽ được tổ chức (3) trong sân trường...",
                            opts: ["A. trên", "B. trong/tại", "C. giữa", "D. phía trên"],
                            why_correct: "Cụm từ chỉ địa điểm: 'in the school yard' (trong sân trường).",
                            why_wrong: "'On' thường dùng cho bề mặt (on the table), nhưng sân trường là không gian bao quanh nên dùng 'in' phổ biến hơn trong ngữ cảnh này (hoặc 'at'). Trong 4 đáp án, 'in' hợp lý nhất."
                        }
                    },
                    {
                        id: "B4", num: 4, 
                        options: ["your lantern", "my lantern", "her lantern", "their lantern"],
                        correct: 0,
                        expl: {
                            q_trans: "Nhớ mang theo (4) đèn lồng của bạn...",
                            opts: ["A. của bạn", "B. của tôi", "C. của cô ấy", "D. của họ"],
                            why_correct: "Thông báo đang nói trực tiếp với học sinh ('Dear students', 'you'), nên dùng tính từ sở hữu 'your'.",
                            why_wrong: "Sai ngôi giao tiếp."
                        }
                    }
                ]
            },
            {
                type: "writing",
                title: "D.I. Rearrange the words",
                questions: [
                    {
                        q: "Do/ you/ have/ your/ a/ festival/ harvest/ in/ country/ ?",
                        ans: "Do you have a harvest festival in your country?",
                        expl: "Cấu trúc câu hỏi Yes/No thì hiện tại đơn: Do + S + V + O + Place?"
                    },
                    {
                        q: "their/ put/ pumpkin/ lanterns/ outside/ homes/ They/ ?",
                        ans: "Do they put pumpkin lanterns outside their homes?",
                        expl: "Câu hỏi (có dấu ? ở đề bài): Do + S + V + O + Place?"
                    },
                    {
                        q: "from/ Hien’s/ house/ is/ far/ it/ to the bakery/ How/ ?",
                        ans: "How far is it from Hien’s house to the bakery?",
                        expl: "Cấu trúc hỏi khoảng cách: How far is it from [Place A] to [Place B]?"
                    },
                    {
                        q: "you/ How/ do/ go/ school/ to/ every morning/ ?",
                        ans: "How do you go to school every morning?",
                        expl: "Hỏi phương tiện: How + do + S + go to...?"
                    },
                    {
                        q: "this/ can’t/ in/ fast/ You/ drive/ area/.",
                        ans: "You can’t drive fast in this area.",
                        expl: "Câu mệnh lệnh/cấm đoán với modal verb: S + can't + V + adv + place."
                    },
                    {
                        q: "is/ horror/ “A Nightmare”/ film/ a/.",
                        ans: "“A Nightmare” is a horror film.",
                        expl: "Câu giới thiệu: Subject + to be + a/an + Adj + Noun."
                    },
                    {
                        q: "and producer/ He/ the/is/ main actor/ the/ of/ film/.",
                        ans: "He is the main actor and producer of the film.",
                        expl: "Giới thiệu chức danh: S + be + Noun Phrase."
                    },
                    {
                        q: "want/ I/ to/ a/ watch/ film,/ but/ don’t/ I/ want/ go/ the/ to/ cinema/.",
                        ans: "I want to watch a film, but I don’t want to go to the cinema.",
                        expl: "Câu ghép với liên từ 'but'. Want + to V."
                    }
                ]
            },
            {
                type: "writing",
                title: "D.II. Make correct sentences",
                questions: [
                    {
                        q: "My favourite/ kind/ of/ film/ action film/.",
                        ans: "My favourite kind of film is action film.",
                        expl: "Thêm động từ 'is' để liên kết chủ ngữ và vị ngữ."
                    },
                    {
                        q: "It/ about/ 5 km/ my village/ nearest town/.",
                        ans: "It is about 5 km from my village to the nearest town.",
                        expl: "Cấu trúc khoảng cách: It is + distance + from A to B."
                    },
                    {
                        q: "they/ hold/ the festival/ every year/?",
                        ans: "Do they hold the festival every year?",
                        expl: "Câu hỏi thì hiện tại đơn với 'they' -> Mượn trợ động từ 'Do'."
                    },
                    {
                        q: "My friends/ and/ I / usually/ go/ school/ foot/.",
                        ans: "My friends and I usually go to school on foot.",
                        expl: "Cụm từ chỉ phương tiện: 'on foot' (đi bộ)."
                    },
                    {
                        q: "We/ go /Flower Festival/ Da Lat/ last year/.",
                        ans: "We went to the Flower Festival in Da Lat last year.",
                        expl: "Quá khứ đơn (last year) -> go thành went. Thêm giới từ 'to' (đi đến đâu) và 'in' (tại Đà Lạt)."
                    },
                    {
                        q: "the Perfume Pagoda Festival/ Viet Nam/ take place/ January/?",
                        ans: "Does the Perfume Pagoda Festival in Viet Nam take place in January?",
                        expl: "Câu hỏi hiện tại đơn, chủ ngữ số ít -> Trợ động từ 'Does'. Thêm giới từ 'in'."
                    },
                    {
                        q: "How long/ it/ take/ go/ Ha Noi/ Dien Bien/ plane/?",
                        ans: "How long does it take to go from Ha Noi to Dien Bien by plane?",
                        expl: "Cấu trúc: How long does it take to V...?"
                    },
                    {
                        q: "About/ 60,000 people/ attend/ this festival/ last year/.",
                        ans: "About 60,000 people attended this festival last year.",
                        expl: "Quá khứ đơn (last year) -> attend thêm 'ed'."
                    }
                ]
            },
            {
                type: "writing",
                title: "D.III. Rewrite sentences",
                questions: [
                    {
                        q: "The distance from Ha Noi to Hue City is about 540 km. (It)",
                        ans: "It is about 540 km from Ha Noi to Hue City.",
                        expl: "Dùng chủ ngữ giả 'It' chỉ khoảng cách."
                    },
                    {
                        q: "What is the distance between your house and your school? (How)",
                        ans: "How far is it from your house to your school?",
                        expl: "Chuyển từ 'What is the distance' sang 'How far is it'."
                    },
                    {
                        q: "Some people said the film was terrible. I found it quite gripping. (Although)",
                        ans: "Although some people said the film was terrible, I found it quite gripping.",
                        expl: "Mệnh đề nhượng bộ với 'Although' + S + V."
                    },
                    {
                        q: "It was a horror film. It wasn’t frightening at all. (however)",
                        ans: "It was a horror film; however, it wasn’t frightening at all.",
                        expl: "Liên từ 'however' đứng sau dấu chấm phẩy hoặc dấu chấm để nối 2 ý tương phản."
                    },
                    {
                        q: "Take part in the event this time, or you’ll have to wait for next year. (If)",
                        ans: "If you don't take part in the event this time, you’ll have to wait for next year.",
                        expl: "Câu điều kiện loại 1: If + S + V(hiện tại), S + will + V."
                    },
                    {
                        q: "Why don’t we go out for dinner? (Let)",
                        ans: "Let's go out for dinner.",
                        expl: "Đề nghị: Why don't we + V = Let's + V."
                    },
                    {
                        q: "The weather was bad. However, we had a wonderful holiday. (but)",
                        ans: "The weather was bad, but we had a wonderful holiday.",
                        expl: "Nối 2 câu bằng 'but'."
                    },
                    {
                        q: "It's not a good for you to stay up too late. (shouldn’t)",
                        ans: "You shouldn’t stay up too late.",
                        expl: "Khuyên bảo: should/shouldn't + V."
                    }
                ]
            }
        ];

        // --- SOUNDS ---
        // Using generic accessible sounds
        const soundCorrect = new Audio('https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/pause.wav'); // High pitch ping
        const soundWrong = new Audio('https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/player_shoot.wav'); // Low pitch thud

        // --- RENDER LOGIC ---
        const container = document.getElementById('quiz-container');

        quizData.forEach((section, sIndex) => {
            const card = document.createElement('div');
            card.className = 'card';

            let html = `<div class="section-title">${section.title}</div>`;

            // Render Reading Text if exists
            if (section.text) {
                html += `<div class="reading-box">${section.text}</div>`;
                
                // Glossary
                if(section.glossary) {
                    html += `<span class="glossary-title">📚 Glossary (Từ vựng nâng cao):</span>
                             <table class="glossary-table">
                                <tr><th>Word</th><th>Type</th><th>Meaning</th></tr>`;
                    section.glossary.forEach(g => {
                        html += `<tr><td>${g.word}</td><td><em>${g.type}</em></td><td>${g.meaning}</td></tr>`;
                    });
                    html += `</table><hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">`;
                }

                // Reading Multiple Choice Questions
                html += `<div class="question-group">`;
                section.questions.forEach((q, qIndex) => {
                    html += `
                        <div class="question-item" id="q-${sIndex}-${qIndex}">
                            <div class="question-text">Question ${q.num}:</div>
                            <div class="options-grid">
                                ${q.options.map((opt, oIndex) => `
                                    <button class="btn-option" onclick="checkMCAnswer(${sIndex}, ${qIndex}, ${oIndex}, this)">
                                        ${opt}
                                    </button>
                                `).join('')}
                            </div>
                            <div class="explanation" id="expl-${sIndex}-${qIndex}">
                                <div class="teacher-avatar">👩‍🏫 Ms. Chí Nên giải thích:</div>
                                <div class="expl-step"><span class="expl-label">Dịch:</span> ${q.expl.q_trans}</div>
                                <div class="expl-step"><span class="expl-label">Đáp án:</span><br> ${q.expl.opts.join('<br>')}</div>
                                <div class="expl-step expl-correct">✅ Tại sao đúng: ${q.expl.why_correct}</div>
                                <div class="expl-step expl-wrong">❌ Tại sao sai: ${q.expl.why_wrong}</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            } 
            // Render Writing Questions
            else if (section.type === "writing") {
                html += `<div class="question-group">`;
                section.questions.forEach((q, qIndex) => {
                    html += `
                        <div class="question-item">
                            <div class="question-text" style="color: var(--primary-pink);">${q.q}</div>
                            <input type="text" class="writing-input" id="write-input-${sIndex}-${qIndex}" placeholder="Nhập câu trả lời của bạn vào đây...">
                            <button class="btn-check-write" onclick="checkWriting(${sIndex}, ${qIndex})">Kiểm tra</button>
                            
                            <div class="explanation" id="expl-write-${sIndex}-${qIndex}">
                                <div class="teacher-avatar">👩‍🏫 Ms. Chí Nên chấm bài:</div>
                                <div class="expl-step"><span class="expl-label" style="color:var(--correct-green)">Đáp án mẫu:</span> <strong>${q.ans}</strong></div>
                                <div class="expl-step">💡 <span class="expl-label">Giải thích:</span> ${q.expl}</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            card.innerHTML = html;
            container.appendChild(card);
        });

        // --- INTERACTION FUNCTIONS ---

        let correctCount = 0;
        let totalQuestions = 0;
        // Calculate total questions
        quizData.forEach(s => {
            if(s.questions) totalQuestions += s.questions.length;
        });

        function checkMCAnswer(sIndex, qIndex, oIndex, btn) {
            const q = quizData[sIndex].questions[qIndex];
            const parent = document.getElementById(`q-${sIndex}-${qIndex}`);
            const buttons = parent.querySelectorAll('.btn-option');
            const expl = document.getElementById(`expl-${sIndex}-${qIndex}`);

            // Disable clicks after first selection
            buttons.forEach(b => {
                b.disabled = true;
                b.style.cursor = "default";
            });

            if (oIndex === q.correct) {
                // Correct
                btn.classList.add('correct');
                soundCorrect.play();
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.6 }
                });
                correctCount++;
            } else {
                // Wrong
                btn.classList.add('wrong');
                // Highlight correct answer
                buttons[q.correct].classList.add('correct');
                soundWrong.play();
                parent.classList.add('shake-element');
            }

            // Show explanation immediately
            expl.classList.add('visible');
        }

        function checkWriting(sIndex, qIndex) {
            const input = document.getElementById(`write-input-${sIndex}-${qIndex}`);
            const expl = document.getElementById(`expl-write-${sIndex}-${qIndex}`);
            const q = quizData[sIndex].questions[qIndex];

            // Normalize strings for rough comparison (remove case and extra spaces)
            const userAns = input.value.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,?!]/g, '');
            const correctAns = q.ans.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,?!]/g, '');

            if (userAns === correctAns) {
                soundCorrect.play();
                confetti({ particleCount: 30, spread: 50 });
                input.style.borderColor = "var(--correct-green)";
                input.style.backgroundColor = "#e8f5e9";
                correctCount++; // Simple scoring for writing
            } else {
                soundWrong.play();
                input.style.borderColor = "var(--wrong-red)";
                input.style.backgroundColor = "#ffebee";
            }

            expl.classList.add('visible');
        }

        function finishQuiz() {
            const modal = document.getElementById('resultModal');
            const scoreText = document.getElementById('finalScore');
            const feedback = document.getElementById('feedbackText');

            scoreText.innerText = `${correctCount}/${totalQuestions}`;
            
            const percentage = (correctCount / totalQuestions) * 100;
            if (percentage === 100) feedback.innerText = "Xuất sắc! Bạn là thiên tài tiếng Anh! 🌟";
            else if (percentage >= 80) feedback.innerText = "Giỏi lắm! Chỉ sai một chút xíu thôi. 🎉";
            else if (percentage >= 50) feedback.innerText = "Cố gắng lên! Hãy xem lại phần giải thích nhé. 💪";
            else feedback.innerText = "Đừng buồn! Ms. Chí Nên đã giải thích chi tiết, hãy ôn tập lại nha! 📚";

            modal.style.display = "flex";
            
            // Big Confetti
            var duration = 3000;
            var end = Date.now() + duration;

            (function frame() {
            var timeLeft = end - Date.now();
            if (timeLeft <= 0) return;
            confetti({
                particleCount: 5,
                angle: 60,
                spread: 55,
                origin: { x: 0 }
            });
            confetti({
                particleCount: 5,
                angle: 120,
                spread: 55,
                origin: { x: 1 }
            });
            requestAnimationFrame(frame);
            }());
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = "none";
        }

    </script>
</body>
</html>
