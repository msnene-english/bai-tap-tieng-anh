<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Hồng nhạt / Tím Pastel */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --correct-shadow: #00A653;
            --wrong: #FF4757; /* Đỏ cam */
            --wrong-shadow: #D83A46;
            --btn-shadow: #00A085;
            --bg-color: #F8F9FA;
            --text-dark: #2D3436;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: #f0e6ff;
            background-image: radial-gradient(#d5bbf2 20%, transparent 20%), radial-gradient(#d5bbf2 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 3px solid var(--primary);
        }

        .header h5 {
            margin: 0;
            color: var(--primary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header h1 {
            margin: 5px 0 0 0;
            color: var(--text-dark);
            font-size: 28px;
            font-weight: 900;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
        }

        .section-title {
            background: var(--primary);
            color: white;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 20px;
            box-shadow: 0 6px 0 #6A3A9E;
            text-align: center;
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.05);
            border: 2px solid #E2E8F0;
            position: relative;
        }

        .question-text {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 25px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 18px 25px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 0 var(--btn-shadow);
            transition: all 0.15s ease;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 10px 0 var(--btn-shadow);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 2px 0 var(--btn-shadow);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .option-btn.correct {
            background-color: var(--correct) !important;
            box-shadow: 0 6px 0 var(--correct-shadow) !important;
            transform: translateY(2px);
        }

        .option-btn.wrong {
            background-color: var(--wrong) !important;
            box-shadow: 0 6px 0 var(--wrong-shadow) !important;
            transform: translateY(2px);
        }

        /* Input for Rewrite Sentences */
        .type-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            border: 3px solid #E2E8F0;
            border-radius: 15px;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
        }

        .type-input:focus {
            border-color: var(--primary);
        }

        .check-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #6A3A9E;
            margin-top: 15px;
            transition: all 0.1s;
        }

        .check-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #6A3A9E;
        }

        /* Explanation Box */
        .explanation {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #FFFBEA;
            border: 2px dashed #F1C40F;
            border-radius: 15px;
            font-size: 16px;
            line-height: 1.6;
            animation: fadeIn 0.5s;
        }

        .explanation h4 {
            color: #E67E22;
            margin-top: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation ul {
            padding-left: 20px;
            margin-bottom: 0;
        }

        .explanation li {
            margin-bottom: 8px;
        }

        .submit-btn {
            background-color: #FDCB6E;
            color: #2D3436;
            border: none;
            border-radius: 20px;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 0 #E1B12C;
            margin: 20px auto 50px auto;
            display: block;
            transition: all 0.1s;
        }
        
        .submit-btn:hover {
            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #E1B12C;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-content h2 {
            font-size: 32px;
            color: var(--primary);
            margin-top: 0;
        }
        .modal-content .score {
            font-size: 60px;
            font-weight: 900;
            color: var(--secondary);
            margin: 10px 0;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            z-index: 999;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h5>Giáo viên tạo: Ms. Chí Nên </h5>
        <h1>English Challenge! 🚀</h1>
    </div>

    <div class="quiz-container" id="quiz-container">
        </div>

    <button class="submit-btn" onclick="submitQuiz()">Nộp Bài & Xem Điểm</button>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2>Hoàn thành! 🎉</h2>
            <div class="score" id="score-display">0/30</div>
            <p id="praise-message" style="font-size: 20px; font-weight: bold; color: var(--text-dark);"></p>
            <button class="option-btn" style="width: 100%; margin-top: 20px; text-align: center;" onclick="closeModal()">Xem lại bài</button>
        </div>
    </div>

<script>
// --- AUDIO SYSTEM (Web Audio API - No external files needed) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playDing() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

function playBuzzer() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

// --- CONFETTI SYSTEM ---
function fireConfetti() {
    const colors = ['#00D26A', '#FF4757', '#FDCB6E', '#00C9A7', '#8854C0'];
    for (let i = 0; i < 40; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
        confetti.style.top = '-10px';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
    }
}

// --- DATA ---
const quizData = [
    { section: "Part 2: Choose the correct answer." },
    {
        id: 1, type: "mcq",
        question: "My aunt and uncle are going to Ho Chi Minh City _________ March.",
        options: [
            { text: "on", trans: "vào (dùng cho thứ/ngày)", isCorrect: false },
            { text: "in", trans: "vào (dùng cho tháng/năm/mùa)", isCorrect: true },
            { text: "at", trans: "lúc (dùng cho giờ/dịp lễ)", isCorrect: false },
            { text: "to", trans: "đến (chỉ phương hướng)", isCorrect: false }
        ],
        explanation: "<b>Dịch câu hỏi:</b> Cô chú của tôi sẽ đi TP.HCM vào tháng Ba.<br><b>Tại sao ĐÚNG:</b> Đáp án 'in'. Trong tiếng Anh, đi với 'tháng' (March) ta luôn dùng giới từ 'in' (Ví dụ: in March, in 2023).<br><b>Tại sao SAI:</b> 'on' dùng cho ngày cụ thể (on Monday); 'at' dùng cho giờ (at 6 AM); 'to' không phải giới từ chỉ thời gian trong trường hợp này."
    },
    {
        id: 2, type: "mcq",
        question: "My father _________ on a farm when he was a young boy.",
        options: [
            { text: "lives", trans: "sống (Hiện tại đơn)", isCorrect: false },
            { text: "lived", trans: "đã sống (Quá khứ đơn)", isCorrect: true },
            { text: "uses to live", trans: "sai ngữ pháp (phải là used to)", isCorrect: false },
            { text: "was living", trans: "đang sống (Quá khứ tiếp diễn)", isCorrect: false }
        ],
        explanation: "<b>Dịch câu hỏi:</b> Bố tôi đã sống ở một nông trại khi ông còn là một cậu bé.<br><b>Tại sao ĐÚNG:</b> Đáp án 'lived'. Mệnh đề 'when he was a young boy' chỉ một sự việc đã xảy ra và chấm dứt trong quá khứ, nên ta dùng thì Quá khứ đơn.<br><b>Tại sao SAI:</b> 'lives' là hiện tại; 'uses to live' sai cấu trúc (chính xác là used to live); 'was living' nhấn mạnh tính tiếp diễn tại 1 thời điểm cụ thể trong QK, không phù hợp bằng QK đơn ở đây."
    },
    {
        id: 3, type: "mcq",
        question: "How far _________ from her house to his shops?",
        options: [
            { text: "is it", trans: "là nó (chủ ngữ giả chỉ khoảng cách)", isCorrect: true },
            { text: "are they", trans: "là chúng (số nhiều)", isCorrect: false },
            { text: "is he", trans: "là anh ấy", isCorrect: false },
            { text: "is she", trans: "là cô ấy", isCorrect: false }
        ],
        explanation: "<b>Dịch câu hỏi:</b> Khoảng cách từ nhà cô ấy đến cửa hàng của anh ấy là bao xa?<br><b>Tại sao ĐÚNG:</b> Đáp án 'is it'. Cấu trúc hỏi khoảng cách cố định trong tiếng Anh là: 'How far is it from A to B?'. 'It' ở đây là chủ ngữ giả chỉ khoảng cách.<br><b>Tại sao SAI:</b> Không dùng đại từ nhân xưng (he/she/they) để hỏi về khoảng cách không gian."
    },
    {
        id: 4, type: "mcq",
        question: "Many people are walking _________ the weather is bad these day.",
        options: [
            { text: "so", trans: "vì vậy (chỉ kết quả)", isCorrect: false },
            { text: "since", trans: "bởi vì (chỉ nguyên nhân)", isCorrect: false },
            { text: "although", trans: "mặc dù (chỉ sự nhượng bộ)", isCorrect: true },
            { text: "because", trans: "bởi vì (chỉ nguyên nhân)", isCorrect: false }
        ],
        explanation: "<b>Dịch câu hỏi:</b> Nhiều người đang đi bộ mặc dù thời tiết những ngày này rất xấu.<br><b>Tại sao ĐÚNG:</b> Đáp án 'although'. Hai vế câu mang ý nghĩa đối lập nhau (đi bộ ngoài trời >< thời tiết xấu). 'Although' + mệnh đề là cấu trúc chuẩn xác.<br><b>Tại sao SAI:</b> Nếu dùng 'since/because' (bởi vì) hoặc 'so' (vì vậy) thì câu sẽ trở nên vô lý về mặt ý nghĩa."
    },
    {
        id: 5, type: "mcq",
        question: "The film was made many years ago. _________, many people have enjoyed seeing it.",
        options: [
            { text: "However", trans: "Tuy nhiên", isCorrect: false },
            { text: "Nevertheless", trans: "Tuy nhiên / Dẫu vậy", isCorrect: false },
            { text: "A & B are correct", trans: "Cả A và B đều đúng", isCorrect: true },
            { text: "A & B are incorrect", trans: "Cả A và B đều sai", isCorrect: false }
        ],
        explanation: "<b>Dịch câu hỏi:</b> Bộ phim được làm từ nhiều năm trước. Tuy nhiên, nhiều người vẫn thích xem nó.<br><b>Tại sao ĐÚNG:</b> Đáp án 'A & B are correct'. Cả 'However' và 'Nevertheless' đều là trạng từ liên kết mang nghĩa 'tuy nhiên', dùng để nối 2 câu có ý nghĩa trái ngược nhau, thường đứng sau dấu chấm và trước dấu phẩy.<br><b>Tại sao SAI:</b> Vì cả A và B đều sử dụng đúng ngữ pháp và ngữ nghĩa nên chọn C."
    },
    {
        id: 6, type: "mcq",
        question: "_________ you need two kilos of pork, Madam?",
        options: [
            { text: "How much", trans: "Bao nhiêu (hỏi số lượng)", isCorrect: false },
            { text: "Do", trans: "Trợ động từ (cho I/you/we/they)", isCorrect: true },
            { text: "Does", trans: "Trợ động từ (cho he/she/it)", isCorrect: false },
            { text: "Are", trans: "Động từ to-be", isCorrect: false }
        ],
        explanation: "<b>Dịch câu hỏi:</b> Bà có cần 2 cân thịt lợn không, thưa bà?<br><b>Tại sao ĐÚNG:</b> Đáp án 'Do'. Đây là câu hỏi Yes/No ở thì Hiện tại đơn. Động từ chính là 'need' (động từ thường), chủ ngữ là 'you', nên ta mượn trợ động từ 'Do' đảo lên đầu câu.<br><b>Tại sao SAI:</b> 'How much' không hợp vì câu đã có số lượng (two kilos); 'Does' sai chủ ngữ; 'Are' là to-be, không đi với động từ thường 'need' (trừ khi là V-ing)."
    },
    {
        id: 7, type: "mcq",
        question: "How did he feel _________ first?",
        options: [
            { text: "at", trans: "tại", isCorrect: true },
            { text: "in", trans: "trong", isCorrect: false },
            { text: "on", trans: "trên", isCorrect: false },
            { text: "from", trans: "từ", isCorrect: false }
        ],
        explanation: "<b>Dịch câu hỏi:</b> Ban đầu anh ấy cảm thấy thế nào?<br><b>Tại sao ĐÚNG:</b> Đáp án 'at'. Ta có cụm thành ngữ (collocation) cố định: <b>at first</b> = ban đầu, lúc đầu.<br><b>Tại sao SAI:</b> Các giới từ 'in, on, from' không kết hợp với 'first' để tạo thành nghĩa 'ban đầu' trong ngữ cảnh này."
    },
    {
        id: 8, type: "mcq",
        question: "A lot of people like watching Titanic _________ it has an unhappy ending.",
        options: [
            { text: "however", trans: "tuy nhiên (+ dấu phẩy)", isCorrect: false },
            { text: "despite", trans: "mặc dù (+ Noun/V-ing)", isCorrect: false },
            { text: "although", trans: "mặc dù (+ Mệnh đề)", isCorrect: true },
            { text: "nevertheless", trans: "tuy nhiên (+ dấu phẩy)", isCorrect: false }
        ],
        explanation: "<b>Dịch câu hỏi:</b> Nhiều người thích xem Titanic mặc dù nó có một cái kết buồn.<br><b>Tại sao ĐÚNG:</b> Đáp án 'although'. Phía sau là một mệnh đề hoàn chỉnh (S = it, V = has), và hai vế có ý nghĩa nhượng bộ (thích xem >< kết buồn) nên dùng although.<br><b>Tại sao SAI:</b> 'despite' + Danh từ/V-ing (ở đây là mệnh đề nên sai); 'however/nevertheless' là trạng từ, phải đứng sau dấu chấm và trước dấu phẩy."
    },
    {
        id: 9, type: "mcq",
        question: "_________ does the festival take place? – Every April.",
        options: [
            { text: "How long", trans: "Bao lâu (hỏi khoảng thời gian)", isCorrect: false },
            { text: "How far", trans: "Bao xa (hỏi khoảng cách)", isCorrect: false },
            { text: "How many", trans: "Bao nhiêu (hỏi số lượng đếm được)", isCorrect: false },
            { text: "How often", trans: "Thường xuyên thế nào (hỏi tần suất)", isCorrect: true }
        ],
        explanation: "<b>Dịch câu hỏi:</b> Lễ hội diễn ra thường xuyên như thế nào? - Mỗi tháng Tư.<br><b>Tại sao ĐÚNG:</b> Đáp án 'How often'. Câu trả lời là 'Every April' (Mỗi tháng 4 - chỉ tần suất lặp lại), do đó câu hỏi phải dùng 'How often'.<br><b>Tại sao SAI:</b> Dựa vào câu trả lời, ta loại trừ ngay các từ để hỏi về thời gian (how long), khoảng cách (how far), số lượng (how many)."
    },
    {
        id: 10, type: "mcq",
        question: "We should wait here _________ our teacher comes back.",

// --- RENDER LOGIC ---
let score = 0;
const container = document.getElementById('quiz-container');

// Fisher-Yates Shuffle Function for Options
function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function renderQuiz() {
    quizData.forEach((item, index) => {
        if (item.section) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'section-title';
            sectionDiv.innerText = item.section;
            container.appendChild(sectionDiv);
            return;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `q${item.id}`;

        let content = `<div class="question-text">Câu ${item.id}: ${item.question}</div>`;

        if (item.type === 'mcq') {
            content += `<div class="options-grid">`;
            const shuffledOptions = shuffle([...item.options]); // Shuffle options here
            
            shuffledOptions.forEach((opt, optIndex) => {
                const letter = String.fromCharCode(65 + optIndex); // A, B, C, D
                content += `
                    <button class="option-btn" onclick="handleMCQ(this, ${item.id}, ${opt.isCorrect})">
                        <b>${letter}.</b> ${opt.text}
                    </button>
                `;
            });
            content += `</div>`;
        } else if (item.type === 'rewrite') {
            content += `
                <input type="text" class="type-input" id="input-${item.id}" placeholder="Viết lại câu hỏi vào đây...">
                <button class="check-btn" onclick="handleRewrite(${item.id})">Kiểm tra đáp án</button>
            `;
        }

        // Explanation Box (Hidden initially)
        content += `
            <div class="explanation" id="expl-${item.id}">
                <h4><span style="font-size:24px">💡</span> Giải thích chi tiết:</h4>
                ${item.explanation}
            </div>
        `;

        card.innerHTML = content;
        container.appendChild(card);
    });
}

// --- INTERACTION LOGIC ---

function handleMCQ(btn, qId, isCorrect) {
    const card = document.getElementById(`q${qId}`);
    const buttons = card.querySelectorAll('.option-btn');
    const expl = document.getElementById(`expl-${qId}`);

    // Disable all buttons in this question
    buttons.forEach(b => b.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct');
        playDing();
        fireConfetti();
        score++;
    } else {
        btn.classList.add('wrong');
        btn.classList.add('shake');
        playBuzzer();
        // Highlight correct answer
        const qData = quizData.find(q => q.id === qId);
        // We need to find which button holds the correct text since we shuffled
        buttons.forEach(b => {
            const correctOpt = qData.options.find(o => o.isCorrect);
            if(b.innerHTML.includes(correctOpt.text)) {
                b.classList.add('correct'); // Show correct one
            }
        });
    }

    // Show explanation
    expl.style.display = 'block';
}

function normalizeStr(str) {
    return str.toLowerCase().replace(/[.?,]/g, '').replace(/\s+/g, ' ').trim();
}

function handleRewrite(qId) {
    const inputEl = document.getElementById(`input-${qId}`);
    const btn = inputEl.nextElementSibling;
    const expl = document.getElementById(`expl-${qId}`);
    const userAns = normalizeStr(inputEl.value);
    
    if(!userAns) {
        alert("Em hãy gõ đáp án vào nhé!");
        return;
    }

    const qData = quizData.find(q => q.id === qId);
    const ans1 = normalizeStr(qData.answer);
    const ans2 = qData.altAnswer ? normalizeStr(qData.altAnswer) : null;

    inputEl.disabled = true;
    btn.disabled = true;

    if (userAns === ans1 || userAns === ans2) {
        inputEl.style.borderColor = "var(--correct)";
        inputEl.style.backgroundColor = "#E6FFF0";
        playDing();
        fireConfetti();
        score++;
    } else {
        inputEl.style.borderColor = "var(--wrong)";
        inputEl.style.backgroundColor = "#FFE6E8";
        inputEl.classList.add('shake');
        playBuzzer();
    }

    // Append correct answer to explanation for visibility
    expl.innerHTML = `<h4><span style="font-size:24px">🎯</span> Đáp án đúng:</h4> <p style="font-size: 18px; color: var(--primary); font-weight:bold; margin-top:0;">${qData.answer}</p>` + expl.innerHTML;
    expl.style.display = 'block';
}

function submitQuiz() {
    const totalQ = quizData.filter(q => q.type).length;
    document.getElementById('score-display').innerText = `${score}/${totalQ}`;
    
    let praise = "";
    const percentage = score / totalQ;
    if (percentage === 1) praise = "Tuyệt đỉnh Kungfu! Em làm đúng hết luôn! 🏆";
    else if (percentage >= 0.8) praise = "Rất xuất sắc! Cô khen ngợi em! 🌟";
    else if (percentage >= 0.5) praise = "Làm tốt lắm, nhưng cố gắng cẩn thận hơn chút nhé! 💪";
    else praise = "Đừng nản chí! Hãy xem kỹ phần giải thích của cô nhé! ❤️";
    
    document.getElementById('praise-message').innerText = praise;
    document.getElementById('result-modal').style.display = 'flex';
    playDing();
    fireConfetti();
}

function closeModal() {
    document.getElementById('result-modal').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize
window.onload = renderQuiz;

</script>
