<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #FDCB6E;
            --tertiary: #00C9A7;
            --correct: #00D26A;
            --wrong: #FF4757;
            --text-main: #333;
            --bg-card: #ffffff;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, #8854C0, #FDCB6E, #00C9A7, #FF9A9E);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* SVG Pattern Background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 5 L55 40 L90 45 L55 50 L50 85 L45 50 L10 45 L45 40 Z" fill="rgba(255,255,255,0.2)"/></svg>');
            background-size: 150px 150px;
            animation: floatPattern 40s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatPattern {
            0% { background-position: 0px 0px; }
            100% { background-position: 300px 300px; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: inline-block;
            left: 50%;
            position: relative;
            transform: translateX(-50%);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 900;
        }

        .header p { margin: 5px 0 0; font-weight: 700; color: #666; font-size: 14px; }

        .section-title {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            margin: 30px 0 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: 800;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        .q-text { font-size: 18px; font-weight: 700; margin-bottom: 15px; line-height: 1.5; }

        /* Options for ABCD */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: #fff;
            border: 3px solid #eee;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: #444;
            cursor: pointer;
            text-align: left;
            box-shadow: 0 6px 0 #eee;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 0 #ddd;
            border-color: #ddd;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ddd;
        }

        .option-btn.correct {
            background: #e6f9f0;
            border-color: var(--correct);
            box-shadow: 0 6px 0 var(--correct);
            color: #008a45;
        }

        .option-btn.wrong {
            background: #ffebee;
            border-color: var(--wrong);
            box-shadow: 0 6px 0 var(--wrong);
            color: #d63031;
        }

        /* Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.4s; }

        /* Input Fields for Gap Fill */
        .input-group {
            display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
        }
        .text-input {
            flex: 1; min-width: 200px;
            padding: 12px 20px;
            border: 3px solid #eee;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 700;
            outline: none;
            transition: 0.3s;
        }
        .text-input:focus { border-color: var(--tertiary); }
        .check-btn {
            background: var(--tertiary); color: white;
            border: none; border-radius: 15px;
            padding: 12px 25px; font-weight: 800; font-size: 16px; cursor: pointer;
            box-shadow: 0 6px 0 #00a085; transition: 0.2s;
        }
        .check-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #00a085; }
        .check-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #00a085; }
        .check-btn:disabled { background: #ccc; box-shadow: 0 6px 0 #999; cursor: not-allowed; transform: none; }

        /* Explanations */
        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-left: 5px solid var(--tertiary);
            border-radius: 10px;
            display: none;
            animation: slideDown 0.3s ease-out;
            font-size: 15px;
            line-height: 1.6;
        }
        .explanation h4 { margin: 0 0 10px 0; color: #2c3e50; font-size: 16px; text-transform: uppercase; }
        .explanation p { margin: 5px 0; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom CSS for Signs (Part IV) */
        .sign-container { margin: 15px 0; display: flex; justify-content: center; }
        .sign-ticket { border: 3px dashed #555; padding: 15px; border-radius: 10px; background: #fffdf0; max-width: 300px; text-align: center; font-weight: bold; position: relative;}
        .sign-ticket::before { content: "★★"; display: block; text-align: left; }
        .sign-ticket::after { content: "★★"; display: block; text-align: right; }
        .sign-cinema { background: #111; color: #fff; padding: 20px; border-top: 8px dotted #fff; border-bottom: 8px dotted #fff; text-align: center; max-width: 250px; font-weight: bold;}
        .sign-cinema span { color: #FDCB6E; }
        .sign-drink { border: 3px solid #333; padding: 10px 20px; display: flex; align-items: center; gap: 15px; background: #fff; max-width: 300px; font-weight: 900; font-size: 18px; border-radius: 5px;}
        .sign-drink-icon { position: relative; width: 60px; height: 60px; border: 5px solid #e74c3c; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .sign-drink-icon::after { content: ""; position: absolute; width: 100%; height: 5px; background: #e74c3c; transform: rotate(-45deg); }
        .sign-speed { border: 4px solid #000; padding: 10px; background: #fff; text-align: center; border-radius: 8px; width: 120px; font-family: 'Arial Black', sans-serif;}
        .sign-speed div:nth-child(1) { font-size: 20px; line-height: 1; }
        .sign-speed div:nth-child(2) { font-size: 45px; line-height: 1; margin-top: 5px; }

        /* Submit Button */
        .submit-container { text-align: center; margin: 40px 0; }
        .submit-btn {
            background: #0984e3; color: white; font-size: 22px; padding: 15px 40px;
            border: none; border-radius: 20px; font-weight: 900; cursor: pointer;
            box-shadow: 0 8px 0 #074b83; transition: 0.2s; font-family: 'Nunito', sans-serif;
        }
        .submit-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #074b83; }

        /* Confetti Container */
        #confetti-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
        .confetti { position: absolute; width: 10px; height: 10px; background: #f00; opacity: 0; }
        @keyframes fall { 0% { opacity: 1; transform: translateY(-10vh) rotate(0deg); } 100% { opacity: 0; transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

<div id="confetti-container"></div>

<div class="container">
    <div class="header">
        <h1>BÀI KIỂM TRA TIẾNG ANH</h1>
        <p>Giáo viên tạo: Ms. Chí Nên </p>
    </div>

    <div id="quiz-container">
        </div>

    <div class="submit-container">
        <button class="submit-btn" onclick="submitTest()">NỘP BÀI & XEM ĐIỂM</button>
    </div>
</div>

<script>
// --- WEB AUDIO API CHO ÂM THANH GAMIFICATION ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.4);
    }
}

function fireConfetti() {
    const container = document.getElementById('confetti-container');
    const colors = ['#00D26A', '#FDCB6E', '#8854C0', '#00C9A7', '#FF4757', '#0984e3'];
    for (let i = 0; i < 40; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animation = `fall ${Math.random() * 2 + 1.5}s linear forwards`;
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3500);
    }
}

// --- DỮ LIỆU CÂU HỎI & GIẢI THÍCH CHI TIẾT ---
const quizData = [
    { sectionTitle: "I. Choose the word that has the underlined part pronounced differently from the rest." },
    {
        type: "mcq",
        qText: "1. A. p<u>ai</u>n &nbsp; B. s<u>ai</u>d &nbsp; C. afr<u>ai</u>d &nbsp; D. str<u>ai</u>ght",
        options: ["A. pain", "B. said", "C. afraid", "D. straight"],
        correctAnswer: 1,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có phần gạch chân phát âm khác với các từ còn lại.</p>
        <p><b>Bước 2:</b> Phân tích từ vựng:<br>
        A. pain (n): nỗi đau.<br>
        B. said (v): đã nói (quá khứ của say).<br>
        C. afraid (adj): sợ hãi.<br>
        D. straight (adj/adv): thẳng.</p>
        <p><b>Bước 3:</b> Tại sao chọn B? Đáp án đúng là B vì phần gạch chân "ai" được phát âm là âm ngắn <b>/e/</b>.</p>
        <p><b>Bước 4:</b> Tại sao 3 đáp án còn lại sai? Các đáp án A, C, D đều có phần gạch chân phát âm là nguyên âm đôi <b>/eɪ/</b>. Do đó B là từ khác biệt nhất.</p>`
    },
    {
        type: "mcq",
        qText: "2. A. r<u>a</u>ilway &nbsp; B. st<u>a</u>tion &nbsp; C. p<u>a</u>vement &nbsp; D. tr<u>a</u>ffic",
        options: ["A. railway", "B. station", "C. pavement", "D. traffic"],
        correctAnswer: 3,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có chữ 'a' phát âm khác.</p>
        <p><b>Bước 2:</b> Dịch nghĩa:<br>
        A. railway (n): đường sắt.<br>
        B. station (n): nhà ga, trạm.<br>
        C. pavement (n): vỉa hè.<br>
        D. traffic (n): giao thông.</p>
        <p><b>Bước 3:</b> Tại sao chọn D? Từ "traffic" có chữ 'a' được phát âm là <b>/æ/</b> (âm a bẹt).</p>
        <p><b>Bước 4:</b> Tại sao các đáp án khác sai? Chữ 'a' trong A, B, C đều được phát âm là nguyên âm đôi <b>/eɪ/</b>.</p>`
    },
    {
        type: "mcq",
        qText: "3. A. s<u>ea</u>tbelt &nbsp; B. <u>e</u>nter &nbsp; C. v<u>e</u>hicle &nbsp; D. pr<u>e</u>sent",
        options: ["A. seatbelt", "B. enter", "C. vehicle", "D. present"],
        correctAnswer: 0,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có phần gạch chân (chữ e/ea) phát âm khác.</p>
        <p><b>Bước 2:</b> Dịch nghĩa:<br>
        A. seatbelt (n): dây an toàn.<br>
        B. enter (v): đi vào.<br>
        C. vehicle (n): phương tiện.<br>
        D. present (n/v/adj): món quà/hiện tại.</p>
        <p><b>Bước 3:</b> Tại sao chọn A? "Seatbelt" phần 'ea' được phát âm là âm <b>/i:/</b> kéo dài.</p>
        <p><b>Bước 4:</b> Các từ còn lại sai vì: "enter" và "present" chữ 'e' đọc là /e/. Chú ý từ "vehicle" đọc là /ˈviː.ə.kəl/ nhưng âm 'e' đầu tiên (vi:) thường không gạch chân chữ e mà xét cả âm tiết. Đề bài có chút bẫy, nhưng "seatbelt" (/i:/) khác biệt so với âm /e/ chung của phần còn lại.</p>`
    },
    {
        type: "mcq",
        qText: "4. A. s<u>a</u>tisfy &nbsp; B. p<u>a</u>rade &nbsp; C. f<u>a</u>mily &nbsp; D. c<u>a</u>lculate",
        options: ["A. satisfy", "B. parade", "C. family", "D. calculate"],
        correctAnswer: 1,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có âm 'a' đọc khác.</p>
        <p><b>Bước 2:</b> Dịch nghĩa:<br>
        A. satisfy (v): làm hài lòng.<br>
        B. parade (n): cuộc diễu hành.<br>
        C. family (n): gia đình.<br>
        D. calculate (v): tính toán.</p>
        <p><b>Bước 3:</b> Chọn B vì chữ 'a' đầu tiên trong "parade" không mang trọng âm, bị biến âm thành âm schwa <b>/ə/</b>.</p>
        <p><b>Bước 4:</b> A, C, D đều có chữ 'a' nằm ở âm tiết nhận trọng âm (hoặc trọng âm phụ), được phát âm là âm bẹt <b>/æ/</b>.</p>`
    },
    {
        type: "mcq",
        qText: "5. A. prep<u>are</u> &nbsp; B. rep<u>air</u> &nbsp; C. b<u>ear</u>ish &nbsp; D. pion<u>eer</u>",
        options: ["A. prepare", "B. repair", "C. bearish", "D. pioneer"],
        correctAnswer: 3,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có âm gạch chân đọc khác.</p>
        <p><b>Bước 2:</b> Dịch nghĩa:<br>
        A. prepare (v): chuẩn bị.<br>
        B. repair (v): sửa chữa.<br>
        C. bearish (adj): (thị trường) giá xuống, thuộc về gấu.<br>
        D. pioneer (n): người tiên phong.</p>
        <p><b>Bước 3:</b> Chọn D vì đuôi "-eer" trong "pioneer" được phát âm là <b>/ɪə(r)/</b>.</p>
        <p><b>Bước 4:</b> Các đáp án A, B, C đều có chứa âm <b>/eə(r)/</b> (prepare, repair, bearish).</p>`
    },
    { sectionTitle: "II. Circle the word with a different stress position" },
    {
        type: "mcq",
        qText: "1. A. poster B. tourist C. distance D. Japan",
        options: ["A. poster", "B. tourist", "C. distance", "D. Japan"],
        correctAnswer: 3,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có trọng âm khác vị trí với các từ còn lại.</p>
        <p><b>Bước 2:</b> Từ vựng:<br>A. poster (n): áp phích; B. tourist (n): du khách; C. distance (n): khoảng cách; D. Japan (n): Nhật Bản.</p>
        <p><b>Bước 3:</b> Chọn D vì "Japan" /dʒəˈpæn/ có trọng âm rơi vào âm tiết thứ 2.</p>
        <p><b>Bước 4:</b> Các đáp án A, B, C đều là danh từ 2 âm tiết và trọng âm rơi vào âm tiết thứ 1 theo quy tắc chung.</p>`
    },
    {
        type: "mcq",
        qText: "2. A. costume B. feature C. parade D. Holland",
        options: ["A. costume", "B. feature", "C. parade", "D. Holland"],
        correctAnswer: 2,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có trọng âm khác.</p>
        <p><b>Bước 2:</b> Từ vựng:<br>A. costume (n): trang phục; B. feature (n): đặc điểm; C. parade (n): diễu hành; D. Holland (n): Hà Lan.</p>
        <p><b>Bước 3:</b> Chọn C vì "parade" /pəˈreɪd/ có trọng âm rơi vào âm tiết 2 (do âm đầu tiên là âm schwa /ə/ yếu).</p>
        <p><b>Bước 4:</b> Các đáp án A, B, D là danh từ 2 âm tiết, trọng âm rơi vào âm tiết 1.</p>`
    },
    {
        type: "mcq",
        qText: "3. A. performance B. festival C. celebrate D. seasonal",
        options: ["A. performance", "B. festival", "C. celebrate", "D. seasonal"],
        correctAnswer: 0,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Tìm từ có trọng âm khác biệt.</p>
        <p><b>Bước 2:</b> Từ vựng:<br>A. performance (n): màn trình diễn; B. festival (n): lễ hội; C. celebrate (v): ăn mừng; D. seasonal (adj): thuộc về mùa vụ.</p>
        <p><b>Bước 3:</b> Chọn A vì "performance" /pəˈfɔːməns/ có trọng âm rơi vào âm tiết 2 (đuôi -ance không ảnh hưởng, âm đầu là /ə/).</p>
        <p><b>Bước 4:</b> Các từ B, C, D đều có 3 âm tiết và trọng âm rơi vào âm tiết 1.</p>`
    },
    {
        type: "mcq",
        qText: "4. A. decorate B. religious C. unusual D. enjoyable",
        options: ["A. decorate", "B. religious", "C. unusual", "D. enjoyable"],

        qText: "1. Many people came to enjoy the program in spite of the expensive entrance tickets. (although)<br><i>(Gợi ý: Nhập câu viết lại bắt đầu bằng Although...)</i><br><input type='text' id='inp_rw1' class='text-input' style='width: 100%' placeholder='Although...'>",

        - Chủ ngữ: the entrance tickets.<br>
        - Động từ to-be (vì quá khứ): were.<br>

        <p><b>Bước 4:</b> Nếu bạn vẫn giữ cụm danh từ sau Although là sai cấu trúc hoàn toàn.</p>`

        <p><b>Bước 1:</b> Dịch: Mặc dù không phải giờ cao điểm, nhưng bây giờ có rất nhiều xe cộ.</p>
        <p><b>Bước 2 & 3:</b> Chuyển từ mệnh đề phụ thuộc (Although) sang câu ghép dùng trạng từ nối (However).<br>
        Quy tắc dấu câu: <b>S + V ; however, S + V.</b> (Hoặc chấm rồi viết hoa However,)<br>

        => <b>Câu đúng:</b> My brother prepared carefully for the casting; nevertheless, he wasn't chosen.</p>

        <p><b>Bước 4:</b> Nếu viết "We are terrifying" là sai hoàn toàn vì nghĩa là "chúng tôi thật đáng sợ".</p>`

        correctAnswers: ["we were tired of flying from vietnam to australia.", "we felt tired when flying from vietnam to australia.", "we were tired when flying from vietnam to australia."],
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>

];

let totalScore = 0;
let answeredCount = 0;

// Init Quiz
function initQuiz() {
    const container = document.getElementById('quiz-container');
    quizData.forEach((item, index) => {
        if (item.sectionTitle) {
            const title = document.createElement('div');
            title.className = 'section-title';
            title.innerHTML = item.sectionTitle;
            container.appendChild(title);
            return;
        }

        const card = document.createElement('div');
        card.className = 'question-card';

        // Trắc nghiệm ABCD
        if (item.type === 'mcq') {
            let optionsHTML = '';
            
            // Xáo trộn đáp án
            let shuffledOptions = item.options.map((opt, i) => ({ text: opt, isCorrect: i === item.correctAnswer }));
            shuffledOptions.sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                optionsHTML += `<button class="option-btn" onclick="checkMCQ(this, ${opt.isCorrect}, 'exp_${index}')">${opt.text}</button>`;
            });

            card.innerHTML = `
                <div class="q-text">${item.qText}</div>
                <div class="options-grid">${optionsHTML}</div>
                <div class="explanation" id="exp_${index}">${item.explanation}</div>
            `;
        } 
        // Điền từ / Viết lại câu
        else if (item.type === 'input' || item.type === 'input_long') {
            card.innerHTML = `
                <div class="q-text">${item.qText}</div>
                <div class="input-group">
                    <button class="check-btn" onclick="checkInput(this, ${index}, 'exp_${index}')">Kiểm tra ngay</button>
                </div>
                <div class="explanation" id="exp_${index}">${item.explanation}</div>
            `;
        }

        container.appendChild(card);
    });
}

// Check MCQ
function checkMCQ(btn, isCorrect, expId) {
    // Disable all siblings
    const parent = btn.parentElement;
    Array.from(parent.children).forEach(child => child.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct');
        playSound('correct');
        fireConfetti();
        totalScore++;
    } else {
        btn.classList.add('wrong');
        btn.classList.add('shake');
        playSound('wrong');
        // Show correct answer automatically
        Array.from(parent.children).forEach(child => {
            if(child.onclick.toString().includes('true')) child.classList.add('correct');
        });
    }

    document.getElementById(expId).style.display = 'block';
    answeredCount++;
}

// Check Input (Gap fill / Rewrite)
function checkInput(btn, itemIndex, expId) {
    const card = btn.closest('.question-card');
    const inputs = card.querySelectorAll('.text-input');
    const correctAnswers = quizData[itemIndex].correctAnswers;
    
    let isAllCorrect = true;
    
    // Simple logic: if it's a multi-blank, check all. If rewrite, check string match.
    if(inputs.length > 1) { // Multi-blanks
        inputs.forEach((input, i) => {
            if (input.value.trim().toLowerCase() === correctAnswers[i].toLowerCase()) {
                input.style.borderColor = "var(--correct)";
                input.style.backgroundColor = "#e6f9f0";
            } else {
                input.style.borderColor = "var(--wrong)";
                input.style.backgroundColor = "#ffebee";
                isAllCorrect = false;
            }
            input.disabled = true;
        });
    } else { // Single blank or Rewrite
        let userVal = inputs[0].value.trim().toLowerCase().replace(/[.]$/, ''); // remove trailing dot
        
        let match = correctAnswers.some(ans => ans.toLowerCase().replace(/[.]$/, '') === userVal);
        
        if (match) {
            inputs[0].style.borderColor = "var(--correct)";
            inputs[0].style.backgroundColor = "#e6f9f0";
        } else {
            inputs[0].style.borderColor = "var(--wrong)";
            inputs[0].style.backgroundColor = "#ffebee";
            isAllCorrect = false;
        }
        inputs[0].disabled = true;
    }

    if (isAllCorrect) {
        playSound('correct');
        fireConfetti();
        totalScore++;
    } else {
        playSound('wrong');
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 500);
    }

    btn.disabled = true;
    document.getElementById(expId).style.display = 'block';
    answeredCount++;
}

function submitTest() {
    let totalQuestions = quizData.filter(i => i.type).length;
    let percent = Math.round((totalScore / totalQuestions) * 100);
    
    let message = "";
    if (percent === 100) message = "CHÚC MỪNG! BẠN LÀ MỘT THIÊN TÀI TIẾNG ANH! 🏆";
    else if (percent >= 80) message = "RẤT XUẤT SẮC! TIẾP TỤC PHÁT HUY NHÉ! 🌟";
    else if (percent >= 50) message = "KHÁ LẮM! BẠN CỐ GẮNG ÔN THÊM CHÚT NỮA LÀ ĐỈNH! 👍";
    else message = "KHÔNG SAO ĐÂU! HÃY ĐỌC KỸ PHẦN GIẢI THÍCH VÀ THỬ LẠI NHÉ! 💪";

    alert(`BẠN ĐÃ LÀM XONG BÀI!\n\nSố điểm: ${totalScore} / ${totalQuestions} (${percent}%)\n\n${message}`);
    if (percent >= 50) {
        fireConfetti();
        fireConfetti();
    }
}

// Start
window.onload = initQuiz;
</script>
