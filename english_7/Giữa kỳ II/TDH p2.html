<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF9A9E;
            --secondary: #FECFEF;
            --tertiary: #A18CD1;
            --quaternary: #FBC2EB;
            --correct: #00D26A;
            --wrong: #FF4757;
            --text-main: #2d3436;
            --bg-card: #ffffff;
            --btn-text: #444;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, var(--primary), var(--secondary), var(--tertiary), var(--quaternary));
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* SVG Pattern Background: Apple, Star, Cloud */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"><path d="M30 40 C 20 25, 0 30, 0 50 C 0 70, 30 90, 30 90 C 30 90, 60 70, 60 50 C 60 30, 40 25, 30 40 Z" fill="rgba(255,107,129,0.3)"/><path d="M30 40 Q 35 30, 40 25" stroke="rgba(46,213,115,0.4)" stroke-width="4" fill="none"/><polygon points="100,10 105,25 120,25 108,35 113,50 100,40 87,50 92,35 80,25 95,25" fill="rgba(254,202,87,0.4)"/><path d="M 70 110 A 15 15 0 0 1 70 80 A 20 20 0 0 1 110 80 A 15 15 0 0 1 110 110 Z" fill="rgba(72,219,251,0.3)"/></svg>');
            background-size: 200px 200px;
            animation: floatPattern 50s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatPattern {
            0% { background-position: 0px 0px; }
            100% { background-position: 400px 400px; }
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: inline-block;
            left: 50%;
            position: relative;
            transform: translateX(-50%);
            border: 3px solid #fff;
        }

        .header h1 {
            margin: 0; font-size: 26px; color: var(--tertiary);
            text-transform: uppercase; font-weight: 900; letter-spacing: 1px;
        }

        .header p { margin: 5px 0 0; font-weight: 700; color: #666; font-size: 15px; }

        .section-title {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 25px;
            border-radius: 15px;
            margin: 35px 0 20px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.1);
            font-size: 20px;
            font-weight: 900;
            color: #2c3e50;
            border-left: 8px solid var(--tertiary);
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.06);
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .question-card:hover { border-color: rgba(161, 140, 209, 0.3); }

        .q-text { font-size: 19px; font-weight: 700; margin-bottom: 20px; line-height: 1.6; }
        .q-text u { text-decoration-color: var(--wrong); text-decoration-thickness: 3px; }

        /* Options for ABCD */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }

        .option-btn {
            background: #fff; border: 3px solid #eee; border-radius: 18px;
            padding: 16px 20px; font-size: 17px; font-family: 'Quicksand', sans-serif;
            font-weight: 700; color: var(--btn-text); cursor: pointer; text-align: left;
            box-shadow: 0 6px 0 #eee; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-4px); box-shadow: 0 10px 0 #dfe6e9; border-color: #dfe6e9;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px); box-shadow: 0 2px 0 #dfe6e9;
        }

        .option-btn.correct {
            background: #eaffea; border-color: var(--correct);
            box-shadow: 0 6px 0 var(--correct); color: #00944a;
        }

        .option-btn.wrong {
            background: #ffebee; border-color: var(--wrong);
            box-shadow: 0 6px 0 var(--wrong); color: #c0392b;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px) rotate(-1deg); }
            40%, 80% { transform: translateX(6px) rotate(1deg); }
        }
        .shake { animation: shake 0.4s; }

        /* Inputs for Gap Fill & Rewrite */
        .input-group { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .text-input {
            flex: 1; min-width: 250px; padding: 14px 20px;
            border: 3px solid #eee; border-radius: 15px;
            font-family: 'Quicksand', sans-serif; font-size: 17px; font-weight: 700;
            outline: none; transition: 0.3s; box-shadow: inset 0 3px 5px rgba(0,0,0,0.02);
        }
        .text-input:focus { border-color: var(--tertiary); box-shadow: 0 0 0 4px rgba(161, 140, 209, 0.2); }
        
        .check-btn {
            background: var(--tertiary); color: white; border: none; border-radius: 15px;
            padding: 14px 28px; font-weight: 800; font-size: 17px; cursor: pointer;
            box-shadow: 0 6px 0 #8972b6; transition: 0.2s; font-family: 'Quicksand', sans-serif;
        }
        .check-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 9px 0 #8972b6; }
        .check-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 #8972b6; }
        .check-btn:disabled { background: #b2bec3; box-shadow: 0 6px 0 #636e72; cursor: not-allowed; transform: none; }

        /* Explanations */
        .explanation {
            margin-top: 25px; padding: 25px; background: #f8f9fa;
            border-left: 6px solid var(--tertiary); border-radius: 15px;
            display: none; animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 16px; line-height: 1.7; color: #2d3436;
        }
        .explanation h4 { margin: 0 0 15px 0; color: #2c3e50; font-size: 18px; text-transform: uppercase; display: flex; align-items: center; gap: 8px;}
        .explanation h4::before { content: "💡"; font-size: 22px; }
        .explanation p { margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

        /* Submit Button */
        .submit-container { text-align: center; margin: 50px 0; }
        .submit-btn {
            background: linear-gradient(135deg, #00C9A7, #00D26A); color: white;
            font-size: 24px; padding: 18px 50px; border: none; border-radius: 25px;
            font-weight: 900; cursor: pointer; box-shadow: 0 8px 0 #00944a;
            transition: 0.2s; font-family: 'Quicksand', sans-serif; letter-spacing: 1px;
        }
        .submit-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #00944a; }

        /* Confetti Container */
        #confetti-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
        .confetti { position: absolute; width: 12px; height: 12px; opacity: 0; border-radius: 3px; }
        @keyframes fall { 0% { opacity: 1; transform: translateY(-10vh) rotate(0deg); } 100% { opacity: 0; transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

<div id="confetti-container"></div>

<div class="container">
    <div class="header">
        <h1>BÀI KIỂM TRA TIẾNG ANH</h1>
        <p>Giáo viên tạo: Ms. Chí Nên </p>
    </div>

    <div id="quiz-container">
        </div>

    <div class="submit-container">
        <button class="submit-btn" onclick="submitTest()">NỘP BÀI & XEM ĐIỂM</button>
    </div>
</div>

<script>
// --- WEB AUDIO API CHO ÂM THANH GAMIFICATION ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.4);
    }
}

function fireConfetti() {
    const container = document.getElementById('confetti-container');
    const colors = ['#00D26A', '#FDCB6E', '#8854C0', '#00C9A7', '#FF4757', '#0984e3'];
    for (let i = 0; i < 40; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animation = `fall ${Math.random() * 2 + 1.5}s linear forwards`;
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3500);
    }
}

// --- DỮ LIỆU ĐỀ BÀI (TUÂN THỦ 100% TOÀN VẸN VĂN BẢN VÀ YÊU CẦU GIẢI THÍCH 4 BƯỚC) ---
const quizData = [
    { sectionTitle: "I. Choose the word that has the underlined part pronounced differently from the rest." },
    {

        qText: "1. A. play<u>ed</u> &nbsp;&nbsp; B. frighten<u>ed</u> &nbsp;&nbsp; C. excit<u>ed</u> &nbsp;&nbsp; D. bor<u>ed</u>",

        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>

        <p><b>Bước 2:</b> Phân tích từ vựng:<br>
        A. played (v): đã chơi.<br>
        B. frightened (adj): hoảng sợ.<br>
        C. excited (adj): hào hứng.<br>
        D. bored (adj): buồn chán.</p>
        <p><b>Bước 3:</b> Tại sao chọn C? Đuôi "-ed" trong "excited" đứng sau âm /t/, nên được phát âm là <b>/ɪd/</b>.</p>
        <p><b>Bước 4:</b> Tại sao 3 đáp án kia sai? Các từ còn lại (played, frightened, bored) đều tận cùng bằng âm hữu thanh nên đuôi "-ed" được phát âm là <b>/d/</b>.</p>`
    },
    {
        type: "mcq",
        qText: "2. A. br<u>ea</u>k &nbsp;&nbsp; B. br<u>ea</u>d &nbsp;&nbsp; C. inst<u>ea</u>d &nbsp;&nbsp; D. h<u>ea</u>lth",
        options: ["A. break", "B. bread", "C. instead", "D. health"],
        correctAnswer: 0,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có phần "ea" phát âm khác.</p>
        <p><b>Bước 2:</b> Phân tích từ vựng:<br>

        <p><b>Bước 3:</b> Tại sao chọn A? Phần "ea" trong "break" được phát âm là nguyên âm đôi <b>/eɪ/</b>.</p>
        <p><b>Bước 4:</b> Tại sao 3 đáp án kia sai? Các từ còn lại đều có "ea" phát âm là âm ngắn <b>/e/</b>.</p>`
    },
    {
        type: "mcq",
        qText: "3. A. c<u>a</u>r &nbsp;&nbsp; B. d<u>ea</u>r &nbsp;&nbsp; C. p<u>ea</u>r &nbsp;&nbsp; D. cl<u>ea</u>r",
        options: ["A. car", "B. dear", "C. pear", "D. clear"],
        correctAnswer: 0,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có phần âm chính phát âm khác.</p>
        <p><b>Bước 2:</b> Phân tích từ vựng:<br>
        A. car (n): xe hơi.<br>
        B. dear (adj): thân mến.<br>
        C. pear (n): quả lê.<br>
        D. clear (adj): rõ ràng.</p>
        <p><b>Bước 3:</b> Tại sao chọn A? Từ "car" có nguyên âm phát âm là âm A dài <b>/ɑːr/</b>. Đây là từ khác biệt hoàn toàn về cụm âm.</p>
        <p><b>Bước 4:</b> Tại sao 3 đáp án kia sai? Các từ B, D chứa âm <b>/ɪər/</b>, và C chứa âm <b>/eər/</b>. Mặc dù có sự khác biệt giữa B/D và C, nhưng A (car) là từ "lạc quẻ" nhất không hề chứa chữ 'e' và âm sắc hoàn toàn xa lạ so với nhóm đuôi "-ear".</p>`
    },
    {
        type: "mcq",
        qText: "4. A. th<u>ei</u>r &nbsp;&nbsp; B. h<u>ei</u>r &nbsp;&nbsp; C. th<u>e</u>re &nbsp;&nbsp; D. h<u>e</u>re",

        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>

        <p><b>Bước 2:</b> Phân tích từ vựng:<br>

        <p><b>Bước 4:</b> Tại sao 3 đáp án kia sai? Các từ A, B, C đều có chứa âm <b>/eər/</b> (lưu ý chữ 'h' trong 'heir' bị câm: /eər/).</p>`
    },
    {

        qText: "5. A. c<u>a</u>re &nbsp;&nbsp; B. b<u>a</u>re &nbsp;&nbsp; C. <u>a</u>re &nbsp;&nbsp; D. sh<u>a</u>re",
        options: ["A. care", "B. bare", "C. are", "D. share"],
        correctAnswer: 2,

        <p><b>Bước 2:</b> Phân tích từ vựng:<br>

    {

        <p><b>Bước 2:</b> Phân tích từ vựng:<br>

        <p><b>Bước 4:</b> Tại sao 3 đáp án kia sai? Các từ B, C, D đều kết thúc bằng âm /t/ hoặc /d/ (attend, decide, disappoint) nên đuôi -ed bắt buộc phải phát âm là <b>/ɪd/</b>.</p>`
    },

    { sectionTitle: "II. Circle the word with a different stress position." },
    {
        type: "mcq",
        qText: "1. A. fasten &nbsp;&nbsp; B. traffic &nbsp;&nbsp; C. gather &nbsp;&nbsp; D. invest",
        options: ["A. fasten", "B. traffic", "C. gather", "D. invest"],
        correctAnswer: 3,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>

        <p><b>Bước 2:</b> Từ vựng:<br>A. fasten (v): thắt, buộc chặt.<br>B. traffic (n): giao thông.<br>C. gather (v): tụ tập.<br>D. invest (v): đầu tư.</p>
        <p><b>Bước 3:</b> Tại sao chọn D? "invest" /ɪnˈvest/ là động từ 2 âm tiết, trọng âm rơi vào âm tiết thứ <b>2</b>.</p>
        <p><b>Bước 4:</b> Tại sao kia sai? Các từ A, B, C đều có trọng âm rơi vào âm tiết <b>1</b>.</p>`
    },
    {
        type: "mcq",

        options: ["A. traditional", "B. decoration", "C. prohibitive", "D. predictable"],
        correctAnswer: 1,
        explanation: `<h4>GIẢI THÍCH CHI TIẾT:</h4>
        <p><b>Bước 1:</b> Dịch: Chọn từ có trọng âm khác.</p>
        <p><b>Bước 2:</b> Từ vựng:<br>A. traditional (adj): truyền thống.<br>B. decoration (n): sự trang trí.<br>C. prohibitive (adj): cấm đoán, đắt đỏ.<br>D. predictable (adj): có thể đoán được.</p>
        <p><b>Bước 3:</b> Tại sao chọn B? "decoration" /ˌdekəˈreɪʃn/ có trọng âm chính rơi vào âm tiết thứ <b>3</b> (do trước đuôi -tion).</p>
        <p><b>Bước 4:</b> Tại sao kia sai? Các từ A, C, D đều có trọng âm rơi vào âm tiết thứ <b>2</b> (tra'ditional, pro'hibitive, pre'dictable).</p>`
    },
    {

        qText: "3. A. attend &nbsp;&nbsp; B. harvest &nbsp;&nbsp; C. poster &nbsp;&nbsp; D. festive",

            title.className = 'section-title';
            title.innerHTML = item.sectionTitle;
            container.appendChild(title);
            return;
        }

        const card = document.createElement('div');
        card.className = 'question-card';

        // Trắc nghiệm ABCD
        if (item.type === 'mcq') {
            let optionsHTML = '';
            let shuffledOptions = item.options.map((opt, i) => ({ text: opt, isCorrect: i === item.correctAnswer }));
            shuffledOptions.sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                optionsHTML += `<button class="option-btn" onclick="checkMCQ(this, ${opt.isCorrect}, 'exp_${index}')">${opt.text}</button>`;
            });

            card.innerHTML = `
                <div class="q-text">${item.qText}</div>
                <div class="options-grid">${optionsHTML}</div>
                <div class="explanation" id="exp_${index}">${item.explanation}</div>
            `;
        } 
        // Điền từ / Viết lại câu
        else if (item.type === 'input' || item.type === 'input_long') {
            card.innerHTML = `
                <div class="q-text">${item.qText}</div>
                <div class="input-group">
                    <button class="check-btn" onclick="checkInput(this, ${index}, 'exp_${index}')">Kiểm tra ngay</button>
                </div>
                <div class="explanation" id="exp_${index}">${item.explanation}</div>
            `;
        }

        container.appendChild(card);
    });
}

// Check MCQ
function checkMCQ(btn, isCorrect, expId) {
    const parent = btn.parentElement;
    Array.from(parent.children).forEach(child => child.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct');
        playSound('correct');
        fireConfetti();
        totalScore++;
    } else {
        btn.classList.add('wrong');
        btn.classList.add('shake');
        playSound('wrong');
        Array.from(parent.children).forEach(child => {
            if(child.onclick.toString().includes('true')) child.classList.add('correct');
        });
    }

    document.getElementById(expId).style.display = 'block';
    answeredCount++;
}

// Check Input
function checkInput(btn, itemIndex, expId) {
    const card = btn.closest('.question-card');
    const inputs = card.querySelectorAll('.text-input');
    const correctAnswers = quizData[itemIndex].correctAnswers;
    
    let isAllCorrect = true;
    
    inputs.forEach((input, i) => {
        let userVal = input.value.trim().toLowerCase().replace(/[.]$/, '').replace(/\s+/g, ' '); // Clean space/dot
        
        let match = correctAnswers.some(ans => ans.toLowerCase().replace(/[.]$/, '').replace(/\s+/g, ' ') === userVal);
        
        if (match) {
            input.style.borderColor = "var(--correct)";
            input.style.backgroundColor = "#eaffea";
        } else {
            input.style.borderColor = "var(--wrong)";
            input.style.backgroundColor = "#ffebee";
            isAllCorrect = false;
        }
        input.disabled = true;
    });

    if (isAllCorrect) {
        playSound('correct');
        fireConfetti();
        totalScore++;
    } else {
        playSound('wrong');
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 400);
    }

    btn.disabled = true;
    document.getElementById(expId).style.display = 'block';
    answeredCount++;
}

function submitTest() {
    let totalQuestions = quizData.filter(i => i.type).length;
    let percent = Math.round((totalScore / totalQuestions) * 100);
    
    let message = "";
    if (percent === 100) message = "CHÚC MỪNG! BẠN LÀ MỘT THIÊN TÀI TIẾNG ANH! 🏆";
    else if (percent >= 80) message = "RẤT XUẤT SẮC! TIẾP TỤC PHÁT HUY NHÉ! 🌟";
    else if (percent >= 50) message = "KHÁ LẮM! BẠN CỐ GẮNG ÔN THÊM CHÚT NỮA LÀ ĐỈNH! 👍";
    else message = "KHÔNG SAO ĐÂU! HÃY ĐỌC KỸ PHẦN GIẢI THÍCH VÀ THỬ LẠI NHÉ! 💪";

    alert(`BẠN ĐÃ LÀM XONG BÀI!\n\nSố điểm: ${totalScore} / ${totalQuestions} (${percent}%)\n\n${message}`);
    if (percent >= 50) {
        fireConfetti();
        setTimeout(fireConfetti, 500);
    }
}

window.onload = initQuiz;
</script>
