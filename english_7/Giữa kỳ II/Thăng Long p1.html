<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #FDCB6E;
            --accent: #00C9A7;
            --correct: #00D26A;
            --wrong: #FF4757;
            --text-dark: #2d3436;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #8854C0, #FDCB6E, #00C9A7, #ff9a9e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating SVG Pattern */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg"><text x="20" y="40" font-size="24">⭐</text><text x="120" y="80" font-size="24">🌸</text><text x="40" y="150" font-size="24">🐱</text><text x="160" y="180" font-size="24">☁️</text><text x="90" y="30" font-size="24">🍓</text></svg>');
            background-size: 250px 250px;
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
            animation: floatPattern 40s linear infinite;
        }

        @keyframes floatPattern {
            from { background-position: 0 0; }
            to { background-position: 500px 500px; }
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border: 4px solid var(--white);
        }

        .header h1 {
            color: var(--primary);
            font-weight: 900;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .header h3 {
            color: var(--accent);
            margin-top: 10px;
            font-weight: 700;
        }

        .section-title {
            background: var(--white);
            display: inline-block;
            padding: 10px 25px;
            border-radius: 15px;
            font-weight: 900;
            color: var(--primary);
            box-shadow: 0 5px 0 rgba(0,0,0,0.1);
            margin: 30px 0 15px 0;
            font-size: 1.5rem;
            border: 3px solid var(--primary);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 12px 0 rgba(0,0,0,0.15);
            border: 3px solid rgba(255,255,255,0.8);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        /* 3D Buttons */
        .btn-option {
            background: var(--white);
            border: 3px solid #e0e0e0;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 #d1d1d1;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: left;
            position: relative;
        }

        .btn-option:hover:not(:disabled) {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 13px 0 #d1d1d1;
            border-color: var(--secondary);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #d1d1d1;
        }

        .btn-option.correct {
            background: var(--correct);
            border-color: #00a855;
            color: white;
            box-shadow: 0 8px 0 #00a855;
        }

        .btn-option.wrong {
            background: var(--wrong);
            border-color: #d63031;
            color: white;
            box-shadow: 0 8px 0 #d63031;
        }

        /* Sort Drag/Click styling for Ex 2 */
        .sort-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f4f8;
            border-radius: 15px;
            border: 2px dashed var(--primary);
        }

        .word-badge {
            background: var(--secondary);
            color: #333;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #e6b150;
            transition: transform 0.2s;
        }
        .word-badge:hover { transform: scale(1.1); }
        .word-badge.placed { opacity: 0.5; cursor: not-allowed; transform: scale(0.9); box-shadow: none;}

        .drop-zones {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .drop-zone {
            background: #fff;
            border: 3px solid var(--accent);
            border-radius: 20px;
            min-height: 150px;
            padding: 15px;
            box-shadow: 0 8px 0 var(--accent);
            text-align: center;
        }
        .drop-zone h4 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 10px;
            border-bottom: 2px dashed var(--accent);
            padding-bottom: 5px;
        }
        .placed-word {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            margin: 5px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Sorting Popup */
        #sort-popup {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;
        }
        .sort-popup-content {
            background: white; padding: 30px; border-radius: 25px; text-align: center;
            box-shadow: 0 15px 0 rgba(0,0,0,0.2);
            border: 5px solid var(--primary);
        }
        .sort-btn {
            margin: 10px; padding: 15px 30px; font-size: 1.5rem; border-radius: 15px;
            border: none; background: var(--accent); color: white; cursor: pointer; font-weight: bold;
            box-shadow: 0 8px 0 #009980; transition: transform 0.1s;
        }
        .sort-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #009980; }

        /* Explanation Box */
        .explanation {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-left: 6px solid var(--accent);
            border-radius: 15px;
            font-size: 1.1rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }

        .explanation.show { display: block; }
        .explanation h4 { color: var(--primary); margin-bottom: 10px; font-size: 1.2rem; }
        .explanation b { color: var(--text-dark); }
        .step { margin-bottom: 10px; }
        .step-title { display: inline-block; background: var(--secondary); padding: 3px 8px; border-radius: 8px; font-size: 0.9rem; margin-right: 5px; box-shadow: 0 2px 0 rgba(0,0,0,0.1); }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }

        /* Confetti Canvas */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            z-index: 9999;
            pointer-events: none;
            animation: fall 2.5s linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .submit-btn {
            display: block; width: 100%; max-width: 400px; margin: 40px auto;
            padding: 20px; font-size: 1.5rem; font-weight: 900;
            background: var(--correct); color: white; border: none;
            border-radius: 20px; box-shadow: 0 10px 0 #00a855; cursor: pointer;
            text-transform: uppercase; transition: all 0.2s;
        }
        .submit-btn:hover { transform: scale(1.05); }
        .submit-btn:active { transform: translateY(5px); box-shadow: 0 5px 0 #00a855; }

        /* Underline logic for Ex 1 */
        u { text-decoration-color: var(--wrong); text-decoration-thickness: 3px; }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div class="container">
        <div class="header">
            <h1>Fun English Challenge 🚀</h1>
            <h3>Giáo viên tạo: Ms. Chí Nên </h3>
            <p style="margin-top:10px; font-weight:600;">Làm bài trực tiếp, xem giải thích siêu chi tiết ngay sau khi chọn!</p>
        </div>

        <div id="quiz-container"></div>
        
        <button class="submit-btn" onclick="submitQuiz()">🏆 Nộp bài & Xem điểm</button>
    </div>

    <div id="sort-popup">
        <div class="sort-popup-content">
            <h3 style="margin-bottom: 15px; font-size: 1.5rem; color: var(--primary);">Từ <span id="current-sort-word" style="color:var(--wrong);"></span> có âm đuôi là gì?</h3>
            <button class="sort-btn" onclick="checkSort('t')">/t/</button>
            <button class="sort-btn" onclick="checkSort('d')">/d/</button>
            <button class="sort-btn" onclick="checkSort('id')">/id/</button>
            <br>
            <button style="margin-top:15px; padding:8px 15px; border-radius:10px; border:none; background:#ccc; cursor:pointer;" onclick="document.getElementById('sort-popup').style.display='none'">Hủy</button>
        </div>
    </div>

<script>
// ==================== DỮ LIỆU ĐỀ BÀI & GIẢI THÍCH CHI TIẾT ====================
const quizData = [
    // --- EX 1 ---
    {
        type: "mcq",
        section: "Ex 1. Find the word which has a different sound in the underlined part in each line.",
        q: "1.",
        options: [
            { text: "br<u>ai</u>nstorm", correct: false, reason: "Phát âm là /eɪ/" },
            { text: "s<u>ai</u>ling", correct: false, reason: "Phát âm là /eɪ/" },
            { text: "r<u>ai</u>lway", correct: false, reason: "Phát âm là /eɪ/" },
            { text: "c<u>a</u>ptain", correct: true, reason: "Phát âm là /ɪ/ hoặc /ə/" }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tìm từ có phần gạch chân phát âm khác với các từ còn lại.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích từ vựng:</b><br>
               - A. brainstorm (v/n): động não - Phát âm là /eɪ/<br>
               - B. sailing (n): việc chèo thuyền - Phát âm là /eɪ/<br>
               - C. railway (n): đường sắt - Phát âm là /eɪ/<br>
               - D. captain (n): đội trưởng, thuyền trưởng - Phần gạch chân (ai) phát âm là /ɪ/ (hoặc /ə/).</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn D?</b> Vì phần được phát âm của từ 'captain' là /ɪ/, tạo ra âm khác hoàn toàn.</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao còn lại sai?</b> Vì A, B, C đều có nguyên âm đôi là /eɪ/.</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "2.",
        options: [
            { text: "pl<u>a</u>ne", correct: false },
            { text: "s<u>a</u>fety", correct: false },
            { text: "tr<u>a</u>ffic", correct: true },
            { text: "st<u>a</u>tion", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tìm từ có phần gạch chân 'a' phát âm khác.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích từ vựng:</b><br>
               - A. plane (n): máy bay (/eɪ/)<br>- B. safety (n): sự an toàn (/eɪ/)<br>- C. traffic (n): giao thông (/æ/)<br>- D. station (n): trạm, nhà ga (/eɪ/)</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn C?</b> 'traffic' có âm /æ/ (a bẹt).</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> 3 đáp án kia đều phát âm là nguyên âm đôi /eɪ/.</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "3.",
        options: [
            { text: "v<u>e</u>hicle", correct: true },
            { text: "m<u>e</u>ntion", correct: false },
            { text: "<u>e</u>nter", correct: false },
            { text: "h<u>e</u>licopter", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tìm từ có phần gạch chân 'e' phát âm khác.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích từ vựng:</b><br>
               - A. vehicle (n): phương tiện (/iː/)<br>- B. mention (v): đề cập (/e/)<br>- C. enter (v): đi vào (/e/)<br>- D. helicopter (n): trực thăng (/e/)</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn A?</b> 'vehicle' có chữ 'e' đọc là /iː/ (âm i dài).</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> 3 từ còn lại đều có 'e' đọc là /e/ (âm e ngắn).</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "4.",
        options: [
            { text: "h<u>ey</u>", correct: false },
            { text: "hon<u>ey</u>", correct: true },
            { text: "ob<u>ey</u>", correct: false },
            { text: "gr<u>ey</u>", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tìm từ có đuôi 'ey' phát âm khác.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích từ vựng:</b><br>
               - A. hey (excl): này (/eɪ/)<br>- B. honey (n): mật ong, cưng (/i/)<br>- C. obey (v): vâng lời (/eɪ/)<br>- D. grey (adj): màu xám (/eɪ/)</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn B?</b> 'honey' có đuôi -ey đọc là /i/ (âm i ngắn).</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> Các từ kia đều đọc là /eɪ/.</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "5.",
        options: [
            { text: "h<u>ea</u>lthy", correct: false },
            { text: "br<u>ea</u>d", correct: false },
            { text: "s<u>ea</u>tbelt", correct: true },
            { text: "ah<u>ea</u>d", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tìm từ có phần 'ea' phát âm khác.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích từ vựng:</b><br>
               - A. healthy (adj): khỏe mạnh (/e/)<br>- B. bread (n): bánh mì (/e/)<br>- C. seatbelt (n): dây an toàn (/iː/)<br>- D. ahead (adv): phía trước (/e/)</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn C?</b> 'seatbelt' có 'ea' đọc là /iː/.</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> Các từ còn lại đọc là /e/.</div>`
    },

    // --- EX 3 ---
    {
        type: "mcq",
        section: "Ex 3. Choose the word which has a different stress pattern from the others. Say them aloud.",
        q: "1. Trọng âm khác biệt:",
        options: [
            { text: "silent", correct: false },
            { text: "noisy", correct: false },
            { text: "pretty", correct: false },
            { text: "polite", correct: true }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tìm từ có trọng âm chính rơi vào âm tiết khác.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích:</b><br>
               - A. SIlent (âm 1): yên tĩnh<br>- B. NOIsy (âm 1): ồn ào<br>- C. PREtty (âm 1): xinh đẹp<br>- D. poLITE (âm 2): lịch sự</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn D?</b> 'polite' là tính từ 2 âm tiết nhưng âm thứ 2 là nguyên âm đôi /aɪ/ nên nhận trọng âm.</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> Các từ còn lại trọng âm rơi vào âm thứ 1.</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "2. Trọng âm khác biệt:",
        options: [
            { text: "station", correct: false },
            { text: "season", correct: false },
            { text: "police", correct: true },
            { text: "sandal", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tìm từ có trọng âm chính rơi vào âm tiết khác.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích:</b><br>
               - A. STAtion (âm 1): nhà ga<br>- B. SEAson (âm 1): mùa<br>- C. poLICE (âm 2): cảnh sát<br>- D. SANdal (âm 1): dép</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn C?</b> 'police' có trọng âm 2.</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> Danh từ 2 âm tiết thông thường (A, B, D) nhận trọng âm âm 1.</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "3. Trọng âm khác biệt:",
        options: [
            { text: "agree", correct: true },
            { text: "hungry", correct: false },
            { text: "enter", correct: false },
            { text: "visit", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tìm từ có trọng âm chính rơi vào âm tiết khác.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích:</b><br>

        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime); // Âm trầm buzz
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3); // Vuốt xuống
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// 2. Confetti System (Pháo giấy)
function shootConfetti() {
    const colors = ['#00D26A', '#FDCB6E', '#FF4757', '#8854C0', '#00C9A7'];
    for(let i=0; i<40; i++) {
        let conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 4000);
    }
}

// 3. Shuffle Array (Thuật toán xáo trộn Fisher-Yates)
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// 4. Render UI
let totalScore = 0;
let totalQuestions = quizData.length + wordsEx2.length;
let answeredMCQ = 0;

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSection = "";

    // A. Render MCQ (Ex 1, 3, 5)
    quizData.forEach((qData, index) => {
        if (qData.section && qData.section !== currentSection) {
            currentSection = qData.section;
            let sectionHTML = `<div class="section-title">${currentSection}</div>`;
            container.insertAdjacentHTML('beforeend', sectionHTML);
            
            // Chèn Bài Sorting Ex 2 vào giữa Ex 1 và Ex 3 (Theo đề bài gốc)
            if(currentSection.includes("Ex 3")) {
                renderSortingEx2(container);
            }
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `mcq-${index}`;

        const question = document.createElement('div');
        question.className = 'question-text';
        question.innerHTML = qData.q;
        card.appendChild(question);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';
        
        // Shuffle options clone to not mutate original
        let shuffledOptions = shuffleArray([...qData.options]);
        let letters = ['A', 'B', 'C', 'D'];

        shuffledOptions.forEach((opt, oIdx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerHTML = `<b>${letters[oIdx]}.</b> ${opt.text}`;
            btn.onclick = () => handleMCQ(btn, opt.correct, index, optionsGrid);
            optionsGrid.appendChild(btn);
        });
        card.appendChild(optionsGrid);

        const explBox = document.createElement('div');
        explBox.className = 'explanation';
        explBox.id = `expl-${index}`;
        explBox.innerHTML = `<h4>💡 Lời giải chi tiết từ Ms. Chí Nên :</h4>${qData.expl}`;
        card.appendChild(explBox);

        container.appendChild(card);
    });
}

// B. Render Sorting Ex 2
function renderSortingEx2(container) {
    let sectionHTML = `<div class="section-title">Ex 2. Phân loại âm đuôi -ed (Bấm vào từ để xếp)</div>`;
    container.insertAdjacentHTML('beforeend', sectionHTML);

    const card = document.createElement('div');
    card.className = 'card';
    card.id = `sorting-card`;
    
    // Khay chứa từ
    const wordBank = document.createElement('div');
    wordBank.className = 'sort-container';
    wordBank.id = 'word-bank';
    
    // Xáo trộn mảng từ
    let shuffledWords = shuffleArray([...wordsEx2]);
    shuffledWords.forEach((item, idx) => {
        let badge = document.createElement('span');
        badge.className = 'word-badge';
        badge.innerText = item.word;
        badge.id = `wb-${idx}`;
        badge.onclick = () => openSortPopup(item.word, item.ans, badge.id);
        wordBank.appendChild(badge);
    });
    card.appendChild(wordBank);

    // Khu vực Drop
    const dropZones = document.createElement('div');
    dropZones.className = 'drop-zones';
    dropZones.innerHTML = `
        <div class="drop-zone" id="dz-t"><h4>/t/</h4></div>
        <div class="drop-zone" id="dz-d"><h4>/d/</h4></div>
        <div class="drop-zone" id="dz-id"><h4>/id/</h4></div>
    `;
    card.appendChild(dropZones);

    const explBox = document.createElement('div');
    explBox.className = 'explanation';
    explBox.id = `expl-ex2`;
    explBox.innerHTML = `<h4>💡 Quy tắc phát âm đuôi -ed (Ms. Chí Nên ):</h4>
    <div class="step"><b>1. Đọc là /id/:</b> Khi động từ tận cùng bằng âm /t/ hoặc /d/ (Mẹo: Tiền Đô). VD: needed, wanted...</div>
    <div class="step"><b>2. Đọc là /t/:</b> Khi động từ tận cùng bằng âm vô thanh /p/, /k/, /f/, /s/, /ʃ/, /tʃ/ (Mẹo: Thôi phanh kít sợ sập sàn). VD: washed, looked, laughed...</div>
    <div class="step"><b>3. Đọc là /d/:</b> Các âm hữu thanh và nguyên âm còn lại. VD: played, moved, delivered...</div>`;
    card.appendChild(explBox);

    container.appendChild(card);
}

// 5. Logic Xử lý Trắc nghiệm
function handleMCQ(btn, isCorrect, qIndex, grid) {
    // Ngăn chọn lại
    const buttons = grid.querySelectorAll('.btn-option');
    buttons.forEach(b => b.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct');
        playSound('correct');
        shootConfetti();
        totalScore++;
    } else {
        btn.classList.add('wrong');
        btn.classList.add('shake');
        playSound('wrong');
        // Tìm đáp án đúng để hiện xanh
        buttons.forEach(b => {
            let originalData = quizData[qIndex].options.find(o => b.innerHTML.includes(o.text));
            if(originalData && originalData.correct) b.classList.add('correct');
        });
    }

    // HIỆN GIẢI THÍCH NGAY LẬP TỨC
    document.getElementById(`expl-${qIndex}`).classList.add('show');
    answeredMCQ++;
}

// 6. Logic Xử lý Sorting (Ex 2)
let currentSortData = { word: '', ans: '', badgeId: '' };

function openSortPopup(word, ans, badgeId) {
    if(document.getElementById(badgeId).classList.contains('placed')) return;
    currentSortData = { word, ans, badgeId };
    document.getElementById('current-sort-word').innerText = word;
    document.getElementById('sort-popup').style.display = 'flex';
}

function checkSort(selectedAns) {
    document.getElementById('sort-popup').style.display = 'none';
    const badge = document.getElementById(currentSortData.badgeId);
    
    if (selectedAns === currentSortData.ans) {
        playSound('correct');
        shootConfetti();
        badge.classList.add('placed');
        
        // Di chuyển vào Drop Zone
        let placedEl = document.createElement('span');
        placedEl.className = 'placed-word';
        placedEl.innerText = currentSortData.word;
        document.getElementById(`dz-${selectedAns}`).appendChild(placedEl);
        totalScore++;
        
        // Hiện giải thích Ex2 nếu vừa làm đúng 1 câu đầu tiên
        document.getElementById('expl-ex2').classList.add('show');
    } else {
        playSound('wrong');
        const popupContent = document.querySelector('.sort-popup-content');
        popupContent.classList.remove('shake');
        void popupContent.offsetWidth; // trigger reflow
        popupContent.classList.add('shake');
        alert(`Rất tiếc! Từ '${currentSortData.word}' KHÔNG có đuôi phát âm là /${selectedAns}/. Hãy thử lại theo quy tắc nhé!`);
    }
}

// 7. Nộp bài
function submitQuiz() {
    // Đếm số câu hỏi thực tế (Trắc nghiệm + số từ sorting)
    let percentage = Math.round((totalScore / totalQuestions) * 100);
    let message = "";
    if (percentage === 100) message = "Tuyệt đỉnh! Con là thiên tài Tiếng Anh thực sự! 🏆";
    else if (percentage >= 80) message = "Quá xuất sắc! Ms. Chí Nên rất tự hào về con! 🌟";
    else if (percentage >= 50) message = "Cố gắng rất tốt! Nhớ đọc kỹ phần giải thích siêu chi tiết của cô nhé! 👍";
    else message = "Không sao đâu, sai ở đâu mình học ở đó. Đọc kỹ phần giải thích bên dưới để rút kinh nghiệm nhé! 💪";

    alert(`BÁO CÁO KẾT QUẢ:\n\n- Điểm số của bạn: ${totalScore} / ${totalQuestions} (${percentage}%)\n- Lời khen: ${message}\n\nHãy kéo lên xem lại các câu sai cùng phần Giải Thích Chi Tiết nhé!`);
}

// Khởi tạo
window.onload = () => {
    renderQuiz();
};

</script>
