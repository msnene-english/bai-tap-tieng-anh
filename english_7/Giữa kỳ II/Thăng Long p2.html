<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0;
            --secondary: #FDCB6E;
            --accent: #00C9A7;
            --correct: #00D26A;
            --wrong: #FF4757;
            --text-dark: #2d3436;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            /* Animated Gradient Background Pastel + Neon */
            background: linear-gradient(-45deg, #8854C0, #FDCB6E, #00C9A7, #FF9A9E);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* SVG Pattern lơ lửng */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg width="250" height="250" xmlns="http://www.w3.org/2000/svg"><text x="20" y="40" font-size="28">⭐</text><text x="140" y="90" font-size="28">🌸</text><text x="50" y="180" font-size="28">🐱</text><text x="190" y="210" font-size="28">☁️</text><text x="100" y="40" font-size="28">🍎</text></svg>');
            background-size: 300px 300px;
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
            animation: floatPattern 50s linear infinite;
        }

        @keyframes floatPattern {
            from { background-position: 0 0; }
            to { background-position: 600px 600px; }
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 12px 0 rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border: 4px solid var(--white);
        }

        .header h1 {
            color: var(--primary);
            font-weight: 900;
            font-size: 2.8rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
        }

        .header h3 {
            color: var(--accent);
            margin-top: 10px;
            font-weight: 700;
            font-size: 1.5rem;
        }

        .section-title {
            background: var(--white);
            display: inline-block;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: 900;
            color: var(--primary);
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            margin: 35px 0 20px 0;
            font-size: 1.5rem;
            border: 3px solid var(--primary);
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 12px 0 rgba(0,0,0,0.12);
            border: 3px solid rgba(255,255,255,0.8);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        /* Nút Trắc nghiệm 3D */
        .btn-option {
            background: var(--white);
            border: 3px solid #e0e0e0;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 #d1d1d1;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: left;
            color: var(--text-dark);
        }

        .btn-option:hover:not(:disabled) {
            transform: scale(1.03) translateY(-5px);
            box-shadow: 0 13px 0 #d1d1d1;
            border-color: var(--secondary);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #d1d1d1;
        }

        .btn-option.correct {
            background: var(--correct);
            border-color: #00a855;
            color: white;
            box-shadow: 0 8px 0 #00a855;
        }

        .btn-option.wrong {
            background: var(--wrong);
            border-color: #d63031;
            color: white;
            box-shadow: 0 8px 0 #d63031;
        }

        /* Duolingo Style Builder cho Ex 14 */
        .build-area {
            background: #f0f4f8;
            border: 3px dashed var(--accent);
            border-radius: 20px;
            padding: 20px;
            min-height: 80px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        
        .build-area:empty::before {
            content: "Bấm vào các từ bên dưới để xếp thành câu...";
            color: #a0aec0;
            font-weight: 600;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .word-chip {
            background: var(--white);
            border: 2px solid #cbd5e0;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #cbd5e0;
            transition: transform 0.1s;
            user-select: none;
        }

        .word-chip:hover { transform: translateY(-3px); }
        .word-chip:active { transform: translateY(2px); box-shadow: 0 3px 0 #cbd5e0; }
        .word-chip.hidden { visibility: hidden; }

        .btn-check-build {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            box-shadow: 0 6px 0 #5f368e;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-check-build:active { transform: translateY(4px); box-shadow: 0 2px 0 #5f368e; }

        /* Hộp Giải thích SIÊU CHI TIẾT */
        .explanation {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-left: 8px solid var(--accent);
            border-radius: 15px;
            font-size: 1.15rem;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .explanation.show { display: block; }
        .explanation h4 { color: var(--primary); margin-bottom: 15px; font-size: 1.3rem; border-bottom: 2px dashed #ccc; padding-bottom: 10px;}
        .step { margin-bottom: 12px; }
        .step-title { 
            display: inline-block; 
            background: var(--secondary); 
            color: #2d3436;
            padding: 4px 10px; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            font-weight: 900;
            margin-right: 8px; 
            box-shadow: 0 3px 0 rgba(0,0,0,0.1); 
        }
        u { text-decoration-color: var(--wrong); text-decoration-thickness: 3px; font-weight: 900;}

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }

        /* Pháo giấy Confetti */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            z-index: 9999;
            pointer-events: none;
            animation: fall 2.5s linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .submit-btn {
            display: block; width: 100%; max-width: 450px; margin: 50px auto;
            padding: 20px; font-size: 1.6rem; font-weight: 900;
            background: var(--correct); color: white; border: none;
            border-radius: 20px; box-shadow: 0 10px 0 #00a855; cursor: pointer;
            text-transform: uppercase; transition: all 0.2s;
            position: relative; z-index: 10;
        }
        .submit-btn:hover { transform: scale(1.05); }
        .submit-btn:active { transform: translateY(5px); box-shadow: 0 5px 0 #00a855; }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div class="container">
        <div class="header">
            <h1>Fun English Challenge 🚀</h1>
            <h3>Giáo viên tạo: Ms. Chí Nên </h3>
            <p style="margin-top:15px; font-weight:700; font-size:1.1rem; color:#555;">Làm bài trực tiếp, xem giải thích siêu chi tiết ngay sau khi chọn!</p>
        </div>

        <div id="quiz-container"></div>
        
        <button class="submit-btn" onclick="submitQuiz()">🏆 Nộp bài & Xem điểm</button>
    </div>

<script>
// ==================== DỮ LIỆU ĐỀ BÀI & GIẢI THÍCH CHI TIẾT ====================
const quizData = [
    // --- III. SYNONYM AND ANTONYM --- Ex 6 ---
    {
        type: "mcq",
        section: "III. SYNONYM AND ANTONYM<br><br>Ex 6. Mark the letter A, B, C or D to indicate the word that is CLOSEST in meaning to the underlined part.",
        q: "1. We were stuck in a <u>traffic jam</u> on the freeway for two hours.",
        options: [
            { text: "traffic congestion", correct: true },
            { text: "traffic rules", correct: false },
            { text: "situation", correct: false },
            { text: "highway", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Chúng tôi bị kẹt trong một vụ <u>tắc đường</u> trên đường cao tốc suốt hai giờ đồng hồ. (Tìm từ đồng nghĩa với "traffic jam").</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>
               - A. traffic congestion (n): sự ách tắc giao thông.<br>
               - B. traffic rules (n): luật giao thông.<br>
               - C. situation (n): tình huống.<br>
               - D. highway (n): đường quốc lộ.</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn A?</b> "traffic jam" (kẹt xe) đồng nghĩa hoàn toàn với "traffic congestion".</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> Các đáp án B, C, D có nghĩa hoàn toàn khác, không liên quan đến việc bị kẹt xe.</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "2. The end of the film was so <u>moving</u> that many people cried.",
        options: [
            { text: "scary", correct: false },
            { text: "shocking", correct: false },
            { text: "exciting", correct: false },
            { text: "touching", correct: true }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Kết thúc của bộ phim quá <u>cảm động</u> đến nỗi nhiều người đã khóc.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>
               - A. scary (adj): đáng sợ.<br>
               - B. shocking (adj): gây sốc.<br>
               - C. exciting (adj): thú vị, hào hứng.<br>
               - D. touching (adj): cảm động, chạm đến trái tim.</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn D?</b> Từ gạch chân "moving" có nghĩa là làm cảm động, đồng nghĩa với "touching". Phản ứng "nhiều người khóc" cũng xác nhận điều này.</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> Các từ đáng sợ (A), gây sốc (B) hay hào hứng (C) đều không tạo ra cảm xúc rơi nước mắt do cảm động.</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "3. I’ll take the new job whose salary is <u>fantastic</u>.",
        options: [
            { text: "reasonable", correct: false },
            { text: "acceptable", correct: false },
            { text: "pretty high", correct: false },
            { text: "wonderful", correct: true }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tôi sẽ nhận công việc mới mà mức lương của nó thật <u>tuyệt vời</u>.</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>
               - A. reasonable (adj): hợp lý.<br>
               - B. acceptable (adj): có thể chấp nhận được.<br>
               - C. pretty high (adj): khá cao.<br>
               - D. wonderful (adj): tuyệt vời.</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn D?</b> "fantastic" là một tính từ mang nghĩa cực kỳ tốt, tuyệt vời. Đồng nghĩa mạnh nhất với nó là "wonderful".</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> A, B chỉ mang nghĩa mức độ trung bình (tạm ổn). C (khá cao) vẫn chưa lột tả được sắc thái cảm xúc mạnh mẽ của từ "fantastic".</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "4. The festial is held <u>once a year</u> at the end of August.",
        options: [
            { text: "weekly", correct: false },
            { text: "monthy", correct: false },
            { text: "annually", correct: true },
            { text: "every day", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Lễ hội được tổ chức <u>mỗi năm một lần</u> vào cuối tháng Tám. (Lưu ý: từ 'festial' trong đề gốc có lỗi đánh máy của 'festival', cô giữ nguyên tôn trọng đề).</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>
               - A. weekly (adv): hàng tuần.<br>
               - B. monthy (adv): hàng tháng (lỗi type gốc 'monthly').<br>
               - C. annually (adv): hàng năm, thường niên.<br>
               - D. every day (adv): mỗi ngày.</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn C?</b> "once a year" (1 lần 1 năm) chính là định nghĩa của từ "annually" (thường niên).</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> A, B, D sai hoàn toàn về chu kỳ thời gian.</div>`
    },

    // --- Ex 7 ---
    {
        type: "mcq",
        section: "Ex 7. Mark the letter A, B, C or D to indicate the word that is OPPOSITE in meaning to the underlined part.",
        q: "1. Signs with red circles are mostly <u>prohibitive</u> – that means you can’t do something.",
        options: [
            { text: "banned", correct: false },
            { text: "allowed", correct: true },
            { text: "warning", correct: false },
            { text: "informative", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Biển báo có vòng tròn đỏ thường mang tính <u>cấm đoán</u> - điều đó có nghĩa là bạn không được làm gì đó. (Yêu cầu tìm từ TRÁI NGHĨA).</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>
               - A. banned (adj): bị cấm.<br>
               - B. allowed (adj): được cho phép.<br>
               - C. warning (n/adj): cảnh báo.<br>
               - D. informative (adj): cung cấp thông tin.</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn B?</b> Từ "prohibitive" nghĩa là cấm đoán. Vì đề bài yêu cầu tìm từ TRÁI NGHĨA (Opposite), nên đáp án phải là "allowed" (được phép).</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> Học sinh rất dễ bị lừa chọn A (banned) vì nó là từ ĐỒNG NGHĨA. C và D sai ngữ cảnh.</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "2. I found the plot of the film <u>exciting</u>.",
        options: [
            { text: "moving", correct: false },
            { text: "hilarious", correct: false },
            { text: "boring", correct: true },
            { text: "gripping", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Tôi thấy cốt truyện của bộ phim rất <u>thú vị/hào hứng</u>. (Tìm từ TRÁI NGHĨA).</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>
               - A. moving (adj): cảm động.<br>
               - B. hilarious (adj): cực kỳ hài hước.<br>
               - C. boring (adj): nhàm chán.<br>
               - D. gripping (adj): lôi cuốn.</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn C?</b> "exciting" là thú vị. Trái nghĩa với thú vị chắc chắn là "boring" (nhàm chán).</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> A, B, D đều là những từ mang tính chất khen ngợi, tích cực, không phải từ trái nghĩa.</div>`
    },
    {
        type: "mcq",
        section: "",
        q: "3. Although he spent much money on the film, it wasn’t a big <u>success</u>.",
        options: [
            { text: "failure", correct: true },
            { text: "victory", correct: false },
            { text: "false", correct: false },
            { text: "advance", correct: false }
        ],
        expl: `<div class="step"><span class="step-title">Bước 1</span> <b>Dịch câu hỏi:</b> Mặc dù anh ấy đã chi rất nhiều tiền cho bộ phim, nó không phải là một <u>sự thành công</u> lớn. (Tìm từ TRÁI NGHĨA).</div>
               <div class="step"><span class="step-title">Bước 2</span> <b>Phân tích 4 đáp án:</b><br>
               - A. failure (n): sự thất bại.<br>
               - B. victory (n): sự chiến thắng.<br>
               - C. false (adj): sai lệch, giả.<br>
               - D. advance (n/v): sự tiến bộ, tiến lên.</div>
               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn A?</b> Trái nghĩa với "success" (thành công) hiển nhiên là "failure" (thất bại).</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> Victory là từ đồng nghĩa. False là tính từ sai từ loại và ngữ nghĩa. Advance không liên quan.</div>`
    },
    {
        type: "mcq",
        section: "",

               <div class="step"><span class="step-title">Bước 3</span> <b>Tại sao chọn A?</b> Dùng tính từ đuôi -ed "tired" để diễn tả cảm xúc của con người "We" là chính xác. Cấu trúc "be tired to V" được sử dụng trong bài thi này để thể hiện "mệt mỏi khi phải làm gì".</div>
               <div class="step"><span class="step-title">Bước 4</span> <b>Tại sao sai?</b> B sai vì dùng "tiring" miêu tả cảm xúc con người. C sai cấu trúc "to V-ing". D thiếu chữ "to" trước động từ fly.</div>`
    }
];

// Dữ liệu cho bài Sentence Building (Ex 14)
const buildData = [
    {
        section: "Ex 14. Rewrite the sentences (Sentence Builder Game). <br><span style='font-size:1rem; color:#555;'>Hãy chạm vào các từ bên dưới để sắp xếp thành câu viết lại chính xác!</span>",
        q: "1. I couldn’t sleep. I was tired. <i>(in spite of)</i>",
        words: ["I", "couldn't", "sleep", "in", "spite", "of", "being", "tired", "."],
        target: "I couldn't sleep in spite of being tired .",
        expl: "Cấu trúc <b>in spite of + V-ing</b>. Vì chủ ngữ 2 vế giống nhau (I), động từ 'was' được biến thành V-ing là 'being'. -> Tôi không thể ngủ bất chấp việc bị mệt."
    },
    {
        section: "",
        q: "2. They have little money. They are happy. <i>(despite)</i>",
        words: ["They", "are", "happy", "despite", "having", "little", "money", "."],
        target: "They are happy despite having little money .",
        expl: "Cấu trúc <b>despite + V-ing</b>. Chủ ngữ giống nhau, lấy vế nguyên nhân (have little money) chuyển động từ thành V-ing (having). -> Họ rất vui vẻ mặc dù có ít tiền."
    },
    {
        section: "",
        q: "3. My foot was hurt. I managed to walk to the nearest village. <i>(although)</i>",
        words: ["Although", "my", "foot", "was", "hurt", ",", "I", "managed", "to", "walk", "to", "the", "nearest", "village", "."],
        target: "Although my foot was hurt , I managed to walk to the nearest village .",
        expl: "<b>Although + Mệnh đề</b>. Chỉ cần đặt Although lên đầu câu chỉ sự nhượng bộ, đổi dấu chấm thành dấu phẩy để nối 2 vế. -> Mặc dù chân tôi bị đau, tôi đã cố gắng đi bộ đến ngôi làng gần nhất."
    },
    {
        section: "",
        q: "4. We planned to visit Petronas in the afternoon. We could not afford the fee. <i>(however)</i>",
        words: ["We", "planned", "to", "visit", "Petronas", "in", "the", "afternoon", ".", "However", ",", "we", "could", "not", "afford", "the", "fee", "."],
        target: "We planned to visit Petronas in the afternoon . However , we could not afford the fee .",
        expl: "<b>However</b> đứng đầu câu thứ hai, ngăn cách bởi dấu chấm (.) và dấu phẩy (,) để thể hiện sự trái ngược. -> Chúng tôi định thăm tháp Petronas vào chiều. Tuy nhiên, chúng tôi không đủ tiền trả phí."
    },
    {
        section: "",
        q: "9. Mr. Nam often went to work by motorbike, but now he goes to work by bus. <i>(used to)</i>",
        words: ["Mr.", "Nam", "used", "to", "go", "to", "work", "by", "motorbike", "."],
        target: "Mr. Nam used to go to work by motorbike .",
        expl: "Cấu trúc <b>used to + V(nguyên thể)</b> diễn tả một thói quen trong quá khứ nay không còn nữa. Chuyển 'went' thành 'go'. -> Ông Nam đã từng đi làm bằng xe máy."
    },
    {
        section: "",
        q: "10. There were traffic jams in this street during rush hours, but now the street becomes (clear). <i>(used to)</i>",
        words: ["There", "used", "to", "be", "traffic", "jams", "in", "this", "street", "during", "rush", "hours", "."],
        target: "There used to be traffic jams in this street during rush hours .",
        expl: "Cấu trúc <b>There used to be + Noun</b> (Đã từng có...). Chuyển 'There were' thành 'There used to be'. -> Đã từng có những vụ tắc đường trên con phố này vào giờ cao điểm."
    }

// ==================== LOGIC ỨNG DỤNG ====================

// 1. Audio System (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); 
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3); 
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// 2. Confetti System
function shootConfetti() {
    const colors = ['#00D26A', '#FDCB6E', '#FF4757', '#8854C0', '#00C9A7'];
    for(let i=0; i<40; i++) {
        let conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 4000);
    }
}

// 3. Xáo trộn ngẫu nhiên
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Biến tính điểm
let totalScore = 0;
let totalQuestions = quizData.length + buildData.length;

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSection = "";

    // ---------------- RENDER MCQ ----------------
    quizData.forEach((qData, index) => {
        if (qData.section && qData.section !== currentSection) {
            currentSection = qData.section;
            let sectionHTML = `<div class="section-title">${currentSection}</div>`;
            container.insertAdjacentHTML('beforeend', sectionHTML);
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `mcq-${index}`;

        const question = document.createElement('div');
        question.className = 'question-text';
        question.innerHTML = qData.q;
        card.appendChild(question);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';
        
        let shuffledOptions = shuffleArray(qData.options);

        shuffledOptions.forEach((opt, oIdx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerHTML = opt.text;
            btn.onclick = () => handleMCQ(btn, opt.correct, index, optionsGrid, qData.options);
            optionsGrid.appendChild(btn);
        });
        card.appendChild(optionsGrid);

        const explBox = document.createElement('div');
        explBox.className = 'explanation';
        explBox.id = `expl-${index}`;
        explBox.innerHTML = `<h4>💡 Giải thích chi tiết từ Ms. Chí Nên :</h4>${qData.expl}`;
        card.appendChild(explBox);

        container.appendChild(card);
    });

    // ---------------- RENDER SENTENCE BUILDER ----------------
    buildData.forEach((bData, bIdx) => {
        if (bData.section) {
            let sectionHTML = `<div class="section-title">${bData.section}</div>`;
            container.insertAdjacentHTML('beforeend', sectionHTML);
        }

        const card = document.createElement('div');
        card.className = 'card';

        const question = document.createElement('div');
        question.className = 'question-text';
        question.innerHTML = bData.q;
        card.appendChild(question);

        // Vùng đích để xếp từ
        const buildArea = document.createElement('div');
        buildArea.className = 'build-area';
        buildArea.id = `build-area-${bIdx}`;
        card.appendChild(buildArea);

        // Nơi chứa từ xáo trộn
        const wordBank = document.createElement('div');
        wordBank.className = 'word-bank';
        wordBank.id = `word-bank-${bIdx}`;
        
        let shuffledWords = shuffleArray(bData.words);
        shuffledWords.forEach((word, wIdx) => {
            let chip = document.createElement('div');
            chip.className = 'word-chip';
            chip.innerText = word;
            chip.id = `chip-${bIdx}-${wIdx}`;
            chip.onclick = () => moveWord(chip, bIdx);
            wordBank.appendChild(chip);
        });
        card.appendChild(wordBank);

        // Nút check
        const btnCheck = document.createElement('button');
        btnCheck.className = 'btn-check-build';
        btnCheck.innerText = 'Kiểm tra câu';
        btnCheck.onclick = () => checkBuiltSentence(bIdx, bData.target, btnCheck);
        card.appendChild(btnCheck);

        // Lời giải
        const explBox = document.createElement('div');
        explBox.className = 'explanation';
        explBox.id = `expl-build-${bIdx}`;
        explBox.innerHTML = `<h4>💡 Lời giải chi tiết:</h4><div class="step"><b>Câu hoàn chỉnh:</b> <span style="color:var(--correct); font-weight:bold;">${bData.target.replace(/ \./g, '.').replace(/ ,/g, ',')}</span></div><div class="step"><b>Giải thích:</b> ${bData.expl}</div>`;
        card.appendChild(explBox);

        container.appendChild(card);
    });
}

// ---------------- LOGIC TRẮC NGHIỆM ----------------
function handleMCQ(btn, isCorrect, qIndex, grid, originalOptions) {
    const buttons = grid.querySelectorAll('.btn-option');
    buttons.forEach(b => b.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct');
        playSound('correct');
        shootConfetti();
        totalScore++;
    } else {
        btn.classList.add('wrong');
        btn.classList.add('shake');
        playSound('wrong');
        // Hiện đáp án đúng
        buttons.forEach(b => {
            let originalData = originalOptions.find(o => o.text === b.innerHTML);
            if(originalData && originalData.correct) b.classList.add('correct');
        });
    }

    document.getElementById(`expl-${qIndex}`).classList.add('show');
}

// ---------------- LOGIC SENTENCE BUILDER ----------------
function moveWord(chip, bIdx) {
    const buildArea = document.getElementById(`build-area-${bIdx}`);
    const wordBank = document.getElementById(`word-bank-${bIdx}`);
    
    if (chip.parentElement === wordBank) {
        // Chuyển lên vùng ghép câu
        buildArea.appendChild(chip);
    } else {
        // Chuyển về kho từ
        wordBank.appendChild(chip);
    }
}

function checkBuiltSentence(bIdx, targetPhrase, btnCheck) {
    const buildArea = document.getElementById(`build-area-${bIdx}`);
    const chips = buildArea.querySelectorAll('.word-chip');
    
    // Gộp các từ đã xếp lại với khoảng trắng
    let builtArr = [];
    chips.forEach(c => builtArr.push(c.innerText));
    let builtSentence = builtArr.join(" ");

    // So sánh với target
    if (builtSentence === targetPhrase) {
        playSound('correct');
        shootConfetti();
        buildArea.style.borderColor = "var(--correct)";
        buildArea.style.backgroundColor = "#e8f9f0";
        btnCheck.innerText = "Tuyệt vời!";
        btnCheck.style.background = "var(--correct)";
        btnCheck.disabled = true;
        totalScore++;
    } else {
        playSound('wrong');
        buildArea.classList.remove('shake');
        void buildArea.offsetWidth; // trigger reflow
        buildArea.classList.add('shake');
        buildArea.style.borderColor = "var(--wrong)";
        alert("Chưa đúng thứ tự rồi con ơi! Hãy gỡ từ ra và thử xếp lại xem sao nhé.");
        return; // Dừng lại cho học sinh thử lại
    }

    // Hiện giải thích khi làm đúng
    document.getElementById(`expl-build-${bIdx}`).classList.add('show');
}

// ---------------- SUBMIT FORM ----------------
function submitQuiz() {
    let percentage = Math.round((totalScore / totalQuestions) * 100);
    let message = "";
    if (percentage === 100) message = "Tuyệt đỉnh! Con là thiên tài Tiếng Anh thực sự! 🏆";
    else if (percentage >= 80) message = "Quá xuất sắc! Ms. Chí Nên rất tự hào về con! 🌟";
    else if (percentage >= 50) message = "Cố gắng rất tốt! Nhớ đọc kỹ phần giải thích chi tiết của cô nhé! 👍";
    else message = "Không sao đâu, sai ở đâu mình học ở đó. Kéo lên xem lời giải để nhớ lâu hơn nhé! 💪";

    alert(`BÁO CÁO KẾT QUẢ:\n\n- Điểm số của bạn: ${totalScore} / ${totalQuestions} (${percentage}%)\n- Lời khen: ${message}\n\nHãy kéo lên xem lại các câu sai cùng phần Giải Thích Chi Tiết nhé!`);
}

// Khởi chạy khi tải trang
window.onload = () => {
    renderQuiz();
};

</script>
