<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Tiếng Anh - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A2980;
            --secondary: #26D0CE;
            --correct: #00D26A;
            --wrong: #FF4757;
            --text-main: #2d3436;
            --bg-card: #ffffff;
            --btn-text: #333;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(-45deg, #1A2980, #26D0CE, #8E2DE2, #4A00E0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* SVG Space Pattern Background */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg width="250" height="250" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg"><path d="M 40 40 Q 50 20 60 40 L 80 50 Q 60 60 50 80 Q 40 60 20 50 Z" fill="rgba(255,234,167,0.3)"/><circle cx="180" cy="60" r="15" fill="rgba(255,118,117,0.3)"/><path d="M 160 60 Q 180 40 200 60 Q 180 80 160 60" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/><path d="M 100 180 L 115 150 L 130 180 L 122 195 L 108 195 Z" fill="rgba(116,185,255,0.3)"/><path d="M 108 195 L 122 195 L 115 210 Z" fill="rgba(255,159,67,0.4)"/></svg>');
            background-size: 300px 300px;
            animation: floatPattern 50s linear infinite;
            pointer-events: none; z-index: 0;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes floatPattern { 0% { background-position: 0px 0px; } 100% { background-position: 600px 600px; } }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }

        .header {
            text-align: center; background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px; border-radius: 25px; box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            margin-bottom: 40px; border: 4px solid #FFEAA7; display: inline-block;
            left: 50%; position: relative; transform: translateX(-50%);
        }
        .header h1 { margin: 0; font-size: 26px; color: #4A00E0; text-transform: uppercase; font-weight: 900; }
        .header p { margin: 5px 0 0; font-weight: 700; color: #666; font-size: 15px; }

        .section-title {
            background: rgba(255, 255, 255, 0.95); padding: 12px 25px; border-radius: 15px;
            margin: 40px 0 20px; box-shadow: 0 5px 0 rgba(0,0,0,0.1); font-size: 20px;
            font-weight: 900; color: #1A2980; border-left: 8px solid #26D0CE; text-transform: uppercase;
        }

        .question-card {
            background: var(--bg-card); border-radius: 20px; padding: 25px;
            margin-bottom: 25px; box-shadow: 0 10px 0 rgba(0,0,0,0.1);
            transition: 0.3s; border: 2px solid transparent;
        }
        .question-card:hover { border-color: rgba(38, 208, 206, 0.4); }
        .q-text { font-size: 18px; font-weight: 700; margin-bottom: 15px; line-height: 1.6; }
        .q-text u { text-decoration-color: var(--wrong); text-decoration-thickness: 3px; }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .option-btn {
            background: #fff; border: 3px solid #eee; border-radius: 15px;
            padding: 15px 20px; font-size: 16px; font-family: 'Nunito', sans-serif;
            font-weight: 700; color: var(--btn-text); cursor: pointer; text-align: left;
            box-shadow: 0 6px 0 #eee; transition: 0.2s;
        }
        .option-btn:hover:not(:disabled) { transform: translateY(-4px); box-shadow: 0 10px 0 #dfe6e9; border-color: #dfe6e9; }
        .option-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #dfe6e9; }
        .option-btn.correct { background: #eaffea; border-color: var(--correct); box-shadow: 0 6px 0 var(--correct); color: #00944a; }
        .option-btn.wrong { background: #ffebee; border-color: var(--wrong); box-shadow: 0 6px 0 var(--wrong); color: #c0392b; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.4s; }

        .explanation {
            margin-top: 20px; padding: 20px; background: #f8f9fa;
            border-left: 6px solid #FFEAA7; border-radius: 12px; display: none;
            animation: slideDown 0.3s ease-out; font-size: 15px; line-height: 1.6;
        }
        .explanation h4 { margin: 0 0 10px 0; color: #1A2980; font-size: 17px; display: flex; align-items: center; gap: 8px;}
        .explanation h4::before { content: "💡"; font-size: 20px; }
        .explanation p { margin: 6px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .submit-container { text-align: center; margin: 50px 0; }
        .submit-btn {
            background: linear-gradient(135deg, #FF416C, #FF4B2B); color: white;
            font-size: 22px; padding: 18px 40px; border: none; border-radius: 25px;
            font-weight: 900; cursor: pointer; box-shadow: 0 8px 0 #c0392b; transition: 0.2s; font-family: 'Nunito', sans-serif;
        }
        .submit-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #c0392b; }

        #confetti-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
        .confetti { position: absolute; width: 10px; height: 10px; opacity: 0; border-radius: 50%; }
        @keyframes fall { 0% { opacity: 1; transform: translateY(-10vh) rotate(0deg); } 100% { opacity: 0; transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'correct') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.5);
    } else {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.4);
    }
}

function fireConfetti() {
    const container = document.getElementById('confetti-container');
    const colors = ['#00D26A', '#FFEAA7', '#FF4757', '#26D0CE', '#8E2DE2'];
    for (let i = 0; i < 40; i++) {
        const c = document.createElement('div'); c.classList.add('confetti');
        c.style.left = Math.random() * 100 + 'vw'; c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        c.style.animation = `fall ${Math.random() * 2 + 1.5}s linear forwards`;
        container.appendChild(c); setTimeout(() => c.remove(), 3500);
    }
}

let totalScore = 0;
let answeredCount = 0;

function initQuiz() {
    const container = document.getElementById('quiz-container');
    quizData.forEach((item, index) => {
        if (item.sectionTitle) {
            const title = document.createElement('div');
            title.className = 'section-title'; title.innerHTML = item.sectionTitle;
            container.appendChild(title); return;
        }

        const card = document.createElement('div');
        card.className = 'question-card';

        let optionsHTML = '';
        let shuffledOptions = item.opt.map((text, i) => ({ text, isCorrect: i === item.ans }));
        shuffledOptions.sort(() => Math.random() - 0.5); 

        shuffledOptions.forEach(o => {
            optionsHTML += `<button class="option-btn" onclick="checkMCQ(this, ${o.isCorrect}, 'exp_${index}')">${o.text}</button>`;
        });

        card.innerHTML = `
            <div class="q-text">${item.q}</div>
            <div class="options-grid">${optionsHTML}</div>
            <div class="explanation" id="exp_${index}">${item.exp}</div>
        `;
        container.appendChild(card);
    });
}

function checkMCQ(btn, isCorrect, expId) {
    const parent = btn.parentElement;
    Array.from(parent.children).forEach(child => child.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct'); playSound('correct'); fireConfetti(); totalScore++;
    } else {
        btn.classList.add('wrong'); btn.classList.add('shake'); playSound('wrong');
        Array.from(parent.children).forEach(child => {
            if(child.onclick.toString().includes('true')) child.classList.add('correct');
        });
    }
    document.getElementById(expId).style.display = 'block';
    answeredCount++;
}

function submitTest() {
    let totalQuestions = quizData.filter(i => i.q).length;
    let percent = Math.round((totalScore / totalQuestions) * 100);
    
    let message = "";
    if (percent === 100) message = "BẠN ĐỈNH QUÁ! 100 ĐIỂM XUẤT SẮC! 🏆🚀";
    else if (percent >= 80) message = "RẤT XUẤT SẮC! TIẾP TỤC PHÁT HUY NHÉ! 🌟🚀";
    else if (percent >= 50) message = "KHÁ LẮM! ÔN THÊM CHÚT NỮA LÀ BAY VÀO VŨ TRỤ LUN! 🛸👍";
    else message = "KHÔNG SAO ĐÂU! ĐỌC KỸ GIẢI THÍCH VÀ LÀM LẠI NHÉ! 💪";

    alert(`BẠN ĐÃ LÀM XONG BÀI!\n\nSố điểm: ${totalScore} / ${totalQuestions} (${percent}%)\n\n${message}`);
    if (percent >= 50) { fireConfetti(); setTimeout(fireConfetti, 500); setTimeout(fireConfetti, 1000); }
}

window.onload = initQuiz;
</script>
