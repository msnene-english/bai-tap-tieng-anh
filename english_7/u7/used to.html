<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm: Cấu trúc Used to (Thói quen trong quá khứ)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #8854C0;
            --secondary: #00C9A7;
            --success: #00D26A;
            --error: #FF4757;
            --bg-pattern: #f0f2f5;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#8854c033 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .gamified-card {
            border-bottom: 6px solid rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .option-btn {
            background: white;
            border: 2px solid #e2e8f0;
            border-bottom: 5px solid #cbd5e1;
            transition: all 0.2s;
            cursor: pointer;
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-3px) scale(1.02);
            border-color: var(--primary);
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .option-correct {
            background-color: var(--success) !important;
            color: white !important;
            border-color: #00a854 !important;
            border-bottom: 5px solid #008a45 !important;
        }

        .option-wrong {
            background-color: var(--error) !important;
            color: white !important;
            border-color: #d63031 !important;
            border-bottom: 5px solid #b32425 !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        .explanation-box {
            border-left: 8px solid var(--primary);
            background: #f8f4ff;
            display: none;
        }

        .progress-bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            transition: width 0.5s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #8854C0;
            border-radius: 10px;
        }

        .floating-obj {
            position: fixed;
            z-index: -1;
            opacity: 0.1;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center">

    <!-- Elements Background -->
    <i class="fa-solid fa-star floating-obj text-6xl top-10 left-10 text-yellow-500 rotate-12"></i>
    <i class="fa-solid fa-cloud floating-obj text-8xl bottom-20 right-10 text-blue-400"></i>
    <i class="fa-solid fa-pencil floating-obj text-6xl top-40 right-20 text-pink-400 -rotate-45"></i>

    <div id="app" class="w-full max-w-3xl">
        <!-- Start Screen -->
        <div id="start-screen" class="bg-white rounded-3xl p-8 shadow-2xl text-center gamified-card border-2 border-purple-100">
            <h1 class="text-4xl md:text-5xl font-extrabold text-[#8854C0] mb-2">Used To Mastery</h1>
            <p class="text-gray-500 font-semibold mb-6">Trắc nghiệm: Cấu trúc Used to (Thói quen trong quá khứ)</p>
            
            <div class="mb-8 inline-block p-4 bg-purple-50 rounded-2xl">
                <p class="text-sm text-purple-600 font-bold uppercase tracking-widest">Giáo viên tạo</p>
                <p class="text-xl font-bold text-gray-800">Ms. Chí Nên </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 text-left">
                <div class="bg-blue-50 p-4 rounded-xl flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-500 text-white rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div>
                        <p class="text-xs text-blue-500 font-bold">SỐ CÂU HỎI</p>
                        <p class="text-lg font-bold">30 Câu</p>
                    </div>
                </div>
                <div class="bg-green-50 p-4 rounded-xl flex items-center gap-4">
                    <div class="w-12 h-12 bg-green-500 text-white rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                        <p class="text-xs text-green-500 font-bold">CẤP ĐỘ</p>
                        <p class="text-lg font-bold">Cơ bản - Trung cấp</p>
                    </div>
                </div>
            </div>

            <button onclick="quizApp.start()" class="w-full py-4 bg-[#8854C0] hover:bg-[#7241a1] text-white text-2xl font-black rounded-2xl border-b-8 border-purple-900 transition-all active:transform active:translate-y-1 active:border-b-2">
                BẮT ĐẦU NGAY <i class="fa-solid fa-play ml-2"></i>
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="flex items-center justify-between mb-4 bg-white p-3 rounded-2xl shadow-sm border-2 border-purple-50">
                <div class="flex items-center gap-3">
                    <button onclick="location.reload()" class="text-gray-400 hover:text-red-500 transition-colors">
                        <i class="fa-solid fa-circle-xmark text-2xl"></i>
                    </button>
                    <div class="w-32 md:w-64">
                        <div class="progress-bar">
                            <div id="progress-inner" class="progress-inner" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="q-counter" class="bg-purple-100 text-[#8854C0] font-black px-4 py-1 rounded-full text-sm">1/30</span>
                </div>
                <div class="bg-yellow-100 text-yellow-700 font-black px-4 py-1 rounded-full text-sm">
                    <i class="fa-solid fa-fire mr-1"></i> <span id="score-display">0</span>
                </div>
            </div>

            <div class="bg-white rounded-3xl p-6 md:p-10 shadow-xl gamified-card relative border-2 border-purple-50 overflow-hidden">
                <div id="question-container" class="relative z-10">
                    <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-gray-800 mb-8">
                        Đang tải câu hỏi...
                    </h2>

                    <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Options will be injected here -->
                    </div>

                    <!-- Explanation Area -->
                    <div id="explanation-area" class="explanation-box mt-8 p-6 rounded-2xl">
                        <div class="flex items-center gap-2 text-[#8854C0] mb-4">
                            <i class="fa-solid fa-lightbulb text-xl"></i>
                            <h4 class="font-black uppercase tracking-wider">Ms. Chí Nên giải thích:</h4>
                        </div>
                        <div id="explanation-content" class="text-gray-700 leading-relaxed text-sm md:text-base">
                            <!-- Content injected by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex justify-end">
                <button id="next-btn" onclick="quizApp.nextQuestion()" class="hidden py-3 px-10 bg-[#00C9A7] hover:bg-[#00b093] text-white text-xl font-black rounded-2xl border-b-6 border-[#008f76] transition-all active:transform active:translate-y-1 active:border-b-2">
                    TIẾP THEO <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
                <button id="finish-btn" onclick="quizApp.showResult()" class="hidden py-3 px-10 bg-orange-500 hover:bg-orange-600 text-white text-xl font-black rounded-2xl border-b-6 border-orange-700 transition-all active:transform active:translate-y-1 active:border-b-2">
                    KẾT THÚC <i class="fa-solid fa-flag-checkered ml-2"></i>
                </button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden bg-white rounded-3xl p-10 shadow-2xl text-center gamified-card">
            <div id="trophy-icon" class="text-7xl mb-6 text-yellow-400">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-3xl font-black text-gray-800 mb-2">CHÚC MỪNG BẠN!</h2>
            <p id="result-comment" class="text-gray-500 font-bold mb-8">Bạn đã hoàn thành xuất sắc bài tập.</p>
            
            <div class="flex justify-center gap-8 mb-10">
                <div class="text-center">
                    <p class="text-4xl font-black text-green-500" id="final-score">0</p>
                    <p class="text-sm font-bold text-gray-400 uppercase">Câu đúng</p>
                </div>
                <div class="h-12 w-px bg-gray-200"></div>
                <div class="text-center">
                    <p class="text-4xl font-black text-purple-500" id="final-accuracy">0%</p>
                    <p class="text-sm font-bold text-gray-400 uppercase">Chính xác</p>
                </div>
            </div>

            <button onclick="location.reload()" class="w-full py-4 bg-[#8854C0] hover:bg-[#7241a1] text-white text-2xl font-black rounded-2xl border-b-8 border-purple-900 transition-all active:transform active:translate-y-1 active:border-b-2">
                LÀM LẠI BÀI <i class="fa-solid fa-rotate-left ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Audio Effects -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2021/2021-preview.mp3"></audio>

    <script>
        const quizData = [
            {
                question: "I _______ play football when I was young, but now I don't.",
                options: ["use to", "used to", "used", "using to"],
                correct: 1,
                explanation: {
                    translation: "Tôi đã từng chơi bóng đá khi còn trẻ, nhưng bây giờ thì không.",
                    analysis: [
                        "A. use to (v): Sai ngữ pháp ở thì khẳng định.",
                        "B. used to (phrase): đã từng.",
                        "C. used (v): đã sử dụng (nghĩa khác).",
                        "D. using to (v-ing): Sai cấu trúc."
                    ],
                    whyCorrect: "Cấu trúc khẳng định diễn tả thói quen trong quá khứ là: <b>S + used to + V-infinitive</b>. Vì câu đang ở dạng khẳng định nên 'used' phải có 'd'.",
                    whyIncorrect: "Các đáp án khác sai cấu trúc hoặc không phù hợp ý nghĩa 'đã từng' trong quá khứ."
                }
            },
            {
                question: "My father used to _______ to work by bus.",
                options: ["go", "went", "going", "goes"],
                correct: 0,
                explanation: {
                    translation: "Bố tôi từng đi làm bằng xe buýt.",
                    analysis: [
                        "A. go (v): đi (động từ nguyên mẫu).",
                        "B. went (v): đi (quá khứ).",
                        "C. going (v): đi (V-ing).",
                        "D. goes (v): đi (chia số ít hiện tại)."
                    ],
                    whyCorrect: "Sau cấu trúc 'used to', chúng ta luôn luôn sử dụng <b>động từ nguyên mẫu không 'to' (V-infinitive)</b>.",
                    whyIncorrect: "went, going, và goes đều là các dạng chia của động từ go, không đúng ngữ pháp sau used to."
                }
            },
            {
                question: "She didn't _______ eat vegetables, but now she loves them.",
                options: ["used to", "use to", "uses to", "using to"],
                correct: 1,
                explanation: {
                    translation: "Cô ấy từng không ăn rau, nhưng giờ cô ấy rất thích.",
                    analysis: [
                        "A. used to: đã từng (khẳng định).",
                        "B. use to: đã từng (nguyên mẫu).",
                        "C. uses to: (sai ngữ pháp).",
                        "D. using to: (sai ngữ pháp)."
                    ],
                    whyCorrect: "Trong câu phủ định đã có trợ động từ <b>'didn't'</b>, động từ chính 'used to' phải đưa về nguyên mẫu là <b>'use to'</b> (bỏ 'd').",
                    whyIncorrect: "used to có 'd' là sai khi đi cùng didn't. C và D không tồn tại trong cấu trúc này."
                }
            },
            {
                question: "_______ you use to go to the beach every summer?",
                options: ["Do", "Did", "Are", "Were"],
                correct: 1,
                explanation: {
                    translation: "Bạn có thường đi biển vào mỗi mùa hè không?",
                    analysis: [
                        "A. Do: Trợ động từ hiện tại.",
                        "B. Did: Trợ động từ quá khứ.",
                        "C. Are: Động từ tobe hiện tại.",
                        "D. Were: Động từ tobe quá khứ."
                    ],
                    whyCorrect: "Để đặt câu hỏi cho thói quen trong quá khứ với 'used to', ta mượn trợ động từ <b>Did</b>. Cấu trúc: <b>Did + S + use to + V?</b>",
                    whyIncorrect: "Do dùng cho hiện tại. Are/Were là tobe không đi kèm với động từ thường 'use' theo cách này."
                }
            },
            {
                question: "We _______ live in a small village before moving to the city.",
                options: ["used to", "use to", "are used to", "get used to"],
                correct: 0,
                explanation: {
                    translation: "Chúng tôi từng sống ở một ngôi làng nhỏ trước khi chuyển đến thành phố.",
                    analysis: [
                        "A. used to: đã từng.",
                        "B. use to: (thiếu 'd').",
                        "C. are used to: quen với (hiện tại).",
                        "D. get used to: dần quen với."
                    ],
                    whyCorrect: "Câu khẳng định diễn tả một trạng thái kéo dài trong quá khứ đã kết thúc. Đáp án A đúng cấu trúc <b>S + used to + V</b>.",
                    whyIncorrect: "B sai chính tả. C và D diễn tả việc thích nghi với cái gì đó ở hiện tại, không phù hợp ngữ cảnh."
                }
            }
            // ... Dữ liệu tiếp tục (để ngắn gọn tôi sẽ xử lý logic shuffle cho 30 câu dựa trên dữ liệu gốc)
        ];

        // Mở rộng dữ liệu cho đủ 30 câu dựa trên đề bài bạn cung cấp
        const fullQuizData = [
            ...quizData,
            { question: "Did he _______ long hair?", options: ["used to have", "use to have", "use to has", "used to having"], correct: 1, explanation: { translation: "Anh ấy đã từng để tóc dài phải không?", analysis: ["A. used to have: thừa 'd'.", "B. use to have: đúng.", "C. use to has: sai 'has'.", "D. used to having: sai V-ing."], whyCorrect: "Câu hỏi: Did + S + use to + V(nguyên mẫu).", whyIncorrect: "Các phương án khác vi phạm quy tắc bỏ 'd' hoặc chia động từ 'have'." } },
            { question: "There _______ be a cinema here, but it closed down.", options: ["used to", "use to", "is used to", "was used to"], correct: 0, explanation: { translation: "Đã từng có một rạp chiếu phim ở đây, nhưng nó đã đóng cửa.", analysis: ["A. used to: đã từng.", "B. use to: sai chính tả.", "C. is used to: quen với.", "D. was used to: đã quen với."], whyCorrect: "There used to be = Đã từng có (trong quá khứ).", whyIncorrect: "Chỉ thói quen/trạng thái cũ dùng used to." } },
            { question: "I _______ like coffee, but now I drink it every day.", options: ["didn't used to", "didn't use to", "not used to", "don't use to"], correct: 1, explanation: { translation: "Tôi đã từng không thích cà phê, nhưng giờ tôi uống mỗi ngày.", analysis: ["A. didn't used to: thừa 'd'.", "B. didn't use to: đúng.", "C. not used to: thiếu trợ động từ.", "D. don't use to: sai thì."], whyCorrect: "Phủ định quá khứ: didn't use to.", whyIncorrect: "Phải bỏ 'd' khi có didn't." } },
            { question: "What did you _______ do in your free time when you were a child?", options: ["used to", "use to", "uses to", "using to"], correct: 1, explanation: { translation: "Bạn thường làm gì vào thời gian rảnh khi còn nhỏ?", analysis: ["A. used to: thừa 'd'.", "B. use to: đúng.", "C. uses to: sai.", "D. using to: sai."], whyCorrect: "Câu hỏi có Did -> use to.", whyIncorrect: "Tương tự quy tắc câu hỏi Yes/No." } },
            { question: "My brother _______ smoke, but he quit last year.", options: ["is used to", "used to", "was used to", "use to"], correct: 1, explanation: { translation: "Anh trai tôi từng hút thuốc, nhưng anh ấy đã bỏ năm ngoái.", analysis: ["A. is used to: quen với.", "B. used to: đã từng.", "C. was used to: đã quen.", "D. use to: thiếu 'd'."], whyCorrect: "Thói quen quá khứ đã chấm dứt.", whyIncorrect: "Không dùng be used to ở đây." } },
            { question: "Which sentence is correct?", options: ["I used to go swimming yesterday.", "I used to go swimming when I was a child.", "I didn't used to go swimming.", "Did you used to go swimming?"], correct: 1, explanation: { translation: "Câu nào sau đây là đúng?", analysis: ["A. yesterday: sai mốc thời gian cụ thể.", "B. Correct.", "C. didn't used to: thừa 'd'.", "D. Did you used: thừa 'd'."], whyCorrect: "Used to dùng cho thói quen lâu dài, không dùng cho 1 ngày cụ thể như yesterday.", whyIncorrect: "Lỗi phổ biến là thừa 'd' trong câu phủ định/nghi vấn." } },
            { question: "Mr. Nam _______ play marbles when he was young.", options: ["never used to", "never use to", "not used to", "don't use to"], correct: 0, explanation: { translation: "Ông Nam chưa từng chơi bi khi ông ấy còn trẻ.", analysis: ["A. never used to: đúng.", "B. never use to: sai.", "C. not used to: thiếu trợ động từ.", "D. don't use to: sai thì."], whyCorrect: "Sau 'never', used to vẫn giữ nguyên 'd' vì không có trợ động từ Did mượn đi.", whyIncorrect: "Never + used to là cấu trúc phủ định không dùng didn't." } },
            { question: "_______ you use to cry a lot when you were a baby?", options: ["Were", "Did", "Do", "Are"], correct: 1, explanation: { translation: "Bạn có thường hay khóc nhè khi còn bé không?", analysis: ["A. Were: sai.", "B. Did: đúng.", "C. Do: sai thì.", "D. Are: sai."], whyCorrect: "Câu hỏi thói quen quá khứ mượn Did.", whyIncorrect: "Use là động từ thường nên mượn Did." } },
            { question: "We _______ ride buffalos when we visited our grandparents.", options: ["used to", "use to", "using to", "are used to"], correct: 0, explanation: { translation: "Chúng tôi từng cưỡi trâu khi đi thăm ông bà.", analysis: ["A. used to: đúng.", "B. use to: sai chính tả.", "C. using to: sai.", "D. are used to: quen với."], whyCorrect: "Hành động lặp lại trong quá khứ: used to + V.", whyIncorrect: "Dạng khẳng định cần có 'd'." } },
            { question: "She _______ have long hair, but she cut it yesterday.", options: ["used to", "use to", "didn't use to", "doesn't use to"], correct: 0, explanation: { translation: "Cô ấy từng để tóc dài, nhưng hôm qua cô ấy đã cắt nó.", analysis: ["A. used to: từng.", "B. use to: thiếu 'd'.", "C. didn't use to: từng không.", "D. doesn't use to: sai thì."], whyCorrect: "Trạng thái cũ đã thay đổi: used to.", whyIncorrect: "Cô ấy từng có (khẳng định) mới đúng ngữ cảnh." } },
            { question: "Did you _______ cartoons when you were small?", options: ["used to watch", "use to watch", "use to watching", "used to watching"], correct: 1, explanation: { translation: "Bạn có thường xem hoạt hình khi còn nhỏ không?", analysis: ["A. used: thừa 'd'.", "B. use to watch: đúng.", "C. watching: sai.", "D. watching: sai."], whyCorrect: "Did + S + use to + V(bare).", whyIncorrect: "Sau used to là V nguyên mẫu." } },
            { question: "People _______ travel by horse, but now they use cars.", options: ["used to", "use to", "are used to", "get used to"], correct: 0, explanation: { translation: "Mọi người từng di chuyển bằng ngựa, nhưng giờ họ dùng ô tô.", analysis: ["A. used to: đúng.", "B. use to: thiếu 'd'.", "C. are used to: quen với.", "D. get used to: dần quen."], whyCorrect: "So sánh quá khứ và hiện tại.", whyIncorrect: "Chỉ used to mới hợp nghĩa 'đã từng'." } },
            { question: "I _______ play video games, but I stopped two years ago.", options: ["used to", "use to", "was used to", "am used to"], correct: 0, explanation: { translation: "Tôi từng chơi điện tử, nhưng tôi đã dừng 2 năm trước.", analysis: ["A. used to: đúng.", "B. use to: thiếu 'd'.", "C. was used to: đã quen.", "D. am used to: đang quen."], whyCorrect: "Hành động đã kết thúc trong quá khứ.", whyIncorrect: "Dạng khẳng định S + used to + V." } },
            { question: "We _______ go to that school, but then we moved.", options: ["used to", "use to", "didn't used to", "don't use to"], correct: 0, explanation: { translation: "Chúng tôi từng đi học ở trường đó, nhưng sau đó chúng tôi chuyển đi.", analysis: ["A. used to: đúng.", "B. use to: thiếu 'd'.", "C. didn't used: thừa 'd'.", "D. don't use: sai thì."], whyCorrect: "Thói quen quá khứ.", whyIncorrect: "Đáp án A đúng ngữ pháp nhất." } },
            { question: "Did your mom _______ cook for you?", options: ["use to", "used to", "uses to", "using to"], correct: 0, explanation: { translation: "Mẹ bạn có thường nấu ăn cho bạn không?", analysis: ["A. use to: đúng.", "B. used: thừa 'd'.", "C. uses: sai.", "D. using: sai."], whyCorrect: "Câu hỏi mượn Did bỏ 'd'.", whyIncorrect: "Các dạng chia khác đều sai." } },
            { question: "He _______ stay up late, but now he goes to bed early.", options: ["used to", "use to", "is used to", "didn't use to"], correct: 0, explanation: { translation: "Anh ấy từng thức khuya, nhưng giờ anh ấy đi ngủ sớm.", analysis: ["A. used to: đúng.", "B. use to: thiếu 'd'.", "C. is used to: quen với.", "D. didn't use to: đã không từng."], whyCorrect: "Thói quen trái ngược với hiện tại.", whyIncorrect: "Cần dạng khẳng định 'đã từng'." } },
            { question: "What games _______ you use to play?", options: ["did", "do", "were", "had"], correct: 0, explanation: { translation: "Bạn từng chơi trò chơi gì?", analysis: ["A. did: đúng.", "B. do: hiện tại.", "C. were: tobe.", "D. had: quá khứ hoàn thành."], whyCorrect: "Wh-word + did + S + use to + V?", whyIncorrect: "Chỉ Did mới đi với use to." } },
            { question: "I didn't _______ like classical music, but I do now.", options: ["use to", "used to", "used", "use"], correct: 0, explanation: { translation: "Tôi đã từng không thích nhạc cổ điển, nhưng bây giờ thì có.", analysis: ["A. use to: đúng.", "B. used to: thừa 'd'.", "C. used: sai.", "D. use: thiếu 'to'."], whyCorrect: "Phủ định mượn didn't bỏ 'd'.", whyIncorrect: "Phải có 'to' sau 'use'." } },
            { question: "They _______ have a lot of money, but they lost it all.", options: ["used to", "use to", "didn't use to", "are used to"], correct: 0, explanation: { translation: "Họ từng có rất nhiều tiền, nhưng họ đã mất tất cả.", analysis: ["A. used to: từng.", "B. use to: thiếu 'd'.", "C. didn't use: đã không từng.", "D. are used: quen với."], whyCorrect: "Trạng thái quá khứ đã chấm dứt.", whyIncorrect: "Dạng khẳng định là chính xác nhất." } },
            { question: "Did you use to _______ glasses?", options: ["wear", "wearing", "wore", "wears"], correct: 0, explanation: { translation: "Bạn từng đeo kính phải không?", analysis: ["A. wear: nguyên mẫu.", "B. wearing: V-ing.", "C. wore: quá khứ.", "D. wears: số ít."], whyCorrect: "Sau use to là V nguyên mẫu.", whyIncorrect: "Không chia động từ sau use to." } },
            { question: "My grandfather never _______ travel by plane.", options: ["used to", "use to", "uses to", "using to"], correct: 0, explanation: { translation: "Ông tôi chưa bao giờ đi máy bay.", analysis: ["A. used to: đúng.", "B. use to: sai.", "C. uses: sai.", "D. using: sai."], whyCorrect: "Sau never vẫn dùng used to có 'd'.", whyIncorrect: "Quy tắc đặc biệt với trạng từ phủ định." } },
            { question: "Where did you _______ live before you came here?", options: ["use to", "used to", "uses to", "used"], correct: 0, explanation: { translation: "Bạn từng sống ở đâu trước khi đến đây?", analysis: ["A. use to: đúng.", "B. used: thừa 'd'.", "C. uses: sai.", "D. used: thiếu 'to'."], whyCorrect: "Câu hỏi mượn Did bỏ 'd'.", whyIncorrect: "Cần giữ cấu trúc use + to." } },
            { question: "I _______ be shy, but now I'm confident.", options: ["used to", "use to", "was used to", "didn't use to"], correct: 0, explanation: { translation: "Tôi từng nhút nhát, nhưng giờ tôi rất tự tin.", analysis: ["A. used to: từng.", "B. use to: thiếu 'd'.", "C. was used to: quen với.", "D. didn't use: từng không."], whyCorrect: "Used to be = Từng là.", whyIncorrect: "Đối lập với hiện tại tự tin." } },
            { question: "They didn't _______ go to the cinema very often.", options: ["use to", "used to", "uses to", "used"], correct: 0, explanation: { translation: "Họ từng không hay đi xem phim thường xuyên.", analysis: ["A. use to: đúng.", "B. used: thừa 'd'.", "C. uses: sai.", "D. used: thiếu 'to'."], whyCorrect: "Didn't + use to + V.", whyIncorrect: "Bỏ 'd' khi phủ định." } },
            { question: "Did you use to _______ a buffalo?", options: ["ride", "rode", "ridden", "riding"], correct: 0, explanation: { translation: "Bạn từng cưỡi trâu phải không?", analysis: ["A. ride: nguyên mẫu.", "B. rode: quá khứ.", "C. ridden: phân từ.", "D. riding: V-ing."], whyCorrect: "Sau use to dùng động từ nguyên mẫu.", whyIncorrect: "Không chia ride ở bất kỳ dạng nào khác." } }
        ];

        const quizApp = {
            questions: [],
            currentIdx: 0,
            score: 0,
            isAnswered: false,

            shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            },

            start() {
                this.questions = this.shuffle([...fullQuizData]);
                this.currentIdx = 0;
                this.score = 0;
                this.isAnswered = false;
                
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                this.loadQuestion();
            },

            loadQuestion() {
                this.isAnswered = false;
                const q = this.questions[this.currentIdx];
                
                // UI updates
                document.getElementById('progress-inner').style.width = `${(this.currentIdx / this.questions.length) * 100}%`;
                document.getElementById('q-counter').innerText = `${this.currentIdx + 1}/${this.questions.length}`;
                document.getElementById('score-display').innerText = this.score;
                document.getElementById('question-text').innerText = q.question;
                document.getElementById('explanation-area').style.display = 'none';
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('finish-btn').classList.add('hidden');

                const optionsGrid = document.getElementById('options-grid');
                optionsGrid.innerHTML = '';

                q.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn p-4 text-left rounded-2xl font-bold text-lg flex items-center gap-3';
                    btn.innerHTML = `
                        <span class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-sm border-2 border-gray-200">${String.fromCharCode(65 + index)}</span>
                        <span>${opt}</span>
                    `;
                    btn.onclick = () => this.handleAnswer(index, btn);
                    optionsGrid.appendChild(btn);
                });
            },

            handleAnswer(selectedIdx, btnElement) {
                if (this.isAnswered) return;
                this.isAnswered = true;

                const q = this.questions[this.currentIdx];
                const isCorrect = selectedIdx === q.correct;

                // Disable all buttons
                const allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.classList.add('disabled', 'opacity-60', 'cursor-not-allowed'));

                if (isCorrect) {
                    this.score += 10;
                    btnElement.classList.remove('opacity-60');
                    btnElement.classList.add('option-correct');
                    this.playAudio('correct');
                    this.triggerConfetti();
                } else {
                    btnElement.classList.remove('opacity-60');
                    btnElement.classList.add('option-wrong', 'shake');
                    this.playAudio('wrong');
                    // Show correct one
                    allBtns[q.correct].classList.remove('opacity-60');
                    allBtns[q.correct].classList.add('option-correct');
                }

                this.showExplanation(q.explanation);

                if (this.currentIdx < this.questions.length - 1) {
                    document.getElementById('next-btn').classList.remove('hidden');
                } else {
                    document.getElementById('finish-btn').classList.remove('hidden');
                }
            },

            showExplanation(exp) {
                const area = document.getElementById('explanation-area');
                const content = document.getElementById('explanation-content');
                
                content.innerHTML = `
                    <div class="mb-3"><span class="font-bold text-gray-800">Dịch nghĩa:</span> "${exp.translation}"</div>
                    <div class="mb-3">
                        <span class="font-bold text-gray-800">Phân tích đáp án:</span>
                        <ul class="list-none mt-1 space-y-1">
                            ${exp.analysis.map(a => `<li class="pl-4 border-l-2 border-gray-200">${a}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="mb-3"><span class="font-bold text-green-600">Tại sao ĐÚNG:</span> ${exp.whyCorrect}</div>
                    <div><span class="font-bold text-red-500">Tại sao SAI:</span> ${exp.whyIncorrect}</div>
                `;
                
                area.style.display = 'block';
                area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            },

            nextQuestion() {
                this.currentIdx++;
                this.loadQuestion();
            },

            playAudio(type) {
                const audio = document.getElementById(`sound-${type}`);
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio error:', e));
            },

            triggerConfetti() {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#8854C0', '#00C9A7', '#00D26A']
                });
            },

            showResult() {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                
                const correctCount = this.score / 10;
                const accuracy = Math.round((correctCount / this.questions.length) * 100);
                
                document.getElementById('final-score').innerText = correctCount;
                document.getElementById('final-accuracy').innerText = `${accuracy}%`;

                let comment = "";
                let trophy = "";
                if (accuracy === 100) {
                    comment = "Tuyệt vời! Bạn là thiên tài tiếng Anh! 🌟";
                    trophy = '<i class="fa-solid fa-crown text-yellow-400"></i>';
                } else if (accuracy >= 80) {
                    comment = "Giỏi quá! Cố gắng phát huy nhé con! 👏";
                    trophy = '<i class="fa-solid fa-trophy text-yellow-400"></i>';
                } else if (accuracy >= 50) {
                    comment = "Khá tốt! Đọc kỹ giải thích của cô để làm tốt hơn nhé! 👍";
                    trophy = '<i class="fa-solid fa-medal text-orange-400"></i>';
                } else {
                    comment = "Đừng buồn! Hãy ôn lại bài cùng Ms. Chí Nên nhé con! 💪";
                    trophy = '<i class="fa-solid fa-book-open text-blue-400"></i>';
                }
                
                document.getElementById('result-comment').innerText = comment;
                document.getElementById('trophy-icon').innerHTML = trophy;

                if (accuracy >= 70) {
                    this.triggerConfetti();
                    setTimeout(() => this.triggerConfetti(), 1000);
                }
            }
        };
    </script>
