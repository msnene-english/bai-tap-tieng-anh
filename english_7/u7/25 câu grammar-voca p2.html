<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Trắc nghiệm Tiếng Anh - Unit 7: Traffic (Ms. Chí Nên )</title>
    <!-- Google Fonts: Nunito for rounded, friendly look -->

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-pastel: #f0f4f8;
            --card-shadow: 0 8px 0 rgba(0,0,0,0.15);
            --btn-shadow: 0 5px 0 rgba(0,0,0,0.2);
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E0F7FA;
            background-image: radial-gradient(#00C9A7 15%, transparent 16%), radial-gradient(#8854C0 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .header-gv {
            text-align: center;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto 30px;
            border: 3px solid var(--primary-purple);
        }

        .header-gv h2 {
            margin: 0;
            color: var(--primary-purple);
            font-size: 1.2rem;
            font-weight: 800;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Card Style */
        .question-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
            border: 2px solid #e0e0e0;
            position: relative;
            transition: transform 0.3s ease;
        }

        .question-number {
            background: var(--primary-purple);
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 3px solid #dfe6e9;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #dfe6e9;
            text-align: left;
            position: relative;
            color: #636e72;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: var(--primary-teal);
            box-shadow: 0 4px 0 var(--primary-teal);
            color: var(--primary-teal);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* States */
        .option-btn.correct {
            background-color: #dbfef0;
            border-color: var(--correct-green) !important;
            box-shadow: 0 4px 0 var(--correct-green) !important;
            color: #00944a !important;
        }

        .option-btn.incorrect {
            background-color: #ffeaa7;
            border-color: var(--wrong-red) !important;
            box-shadow: 0 4px 0 var(--wrong-red) !important;
            color: var(--wrong-red) !important;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #f1f2f6;
            border-left: 5px solid var(--primary-teal);
            padding: 20px;
            border-radius: 10px;
            display: none; /* Hidden by default */
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation-title {
            font-weight: 800;
            color: var(--primary-purple);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .explanation-content {
            white-space: pre-wrap; /* Preserve line breaks from JSON */
            font-size: 1rem;
            line-height: 1.6;
            color: #2d3436;
        }

        .hint-text {
            font-style: italic;
            color: #636e72;
            margin-top: 10px;
            font-size: 0.9rem;
            border-top: 1px dashed #b2bec3;
            padding-top: 10px;
        }

        /* Footer / Submit */
        .footer-controls {
            text-align: center;
            margin-top: 40px;
        }

        .submit-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #5f2a96;
            transition: transform 0.2s;
            font-family: 'Nunito', sans-serif;
        }

        .submit-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .result-modal {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 5px solid var(--primary-teal);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary-purple);
            margin: 20px 0;
        }

        .feedback-text {
            font-size: 1.2rem;
            color: #636e72;
            margin-bottom: 30px;
        }

    </style>
</head>

        let userAnswers = {};
        const quizContainer = document.getElementById('quizContainer');

        // --- AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // High pitch "Ding"
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else {
                // Low pitch "Buzz"
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- SHUFFLE UTILITY ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // --- RENDER QUIZ ---
        function renderQuiz() {
            // Shuffle questions
            shuffleArray(quizData.questions);

            quizData.questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                // Create options structure
                const optsHtml = q.answerOptions.map((opt, optIndex) => `
                    <button class="option-btn" 
                        onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect})" 
                        id="q${index}-opt${optIndex}"
                        data-correct="${opt.isCorrect}">
                        ${String.fromCharCode(65 + optIndex)}. ${opt.text}
                    </button>
                `).join('');

                // Explanation text
                // We find the rationale from the first correct option (usually they are consistent) or just take the one from the clicked answer. 
                // Since the JSON structure repeats rationale for each option, we can just grab it from the correct one for simplicity or passed from click.
                const rationaleText = q.answerOptions[0].rationale; // All options have same rationale in JSON

                card.innerHTML = `
                    <div class="question-number">Câu ${q.questionNumber}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid">
                        ${optsHtml}
                    </div>
                    <div class="explanation-box" id="explain-${index}">
                        <div class="explanation-title">
                            <span>💡 Ms. Chí Nên giải thích:</span>
                        </div>
                        <div class="explanation-content">${rationaleText}</div>
                        ${q.hint ? `<div class="hint-text">Gợi ý: ${q.hint}</div>` : ''}
                    </div>
                `;

                quizContainer.appendChild(card);
            });
        }

        // --- CHECK ANSWER ---
        function checkAnswer(qIndex, optIndex, isCorrect) {
            const card = document.getElementById(`q-card-${qIndex}`);
            // Disable all buttons in this card
            const btns = card.querySelectorAll('.option-btn');
            btns.forEach(btn => btn.disabled = true);

            const selectedBtn = document.getElementById(`q${qIndex}-opt${optIndex}`);
            const explanationBox = document.getElementById(`explain-${qIndex}`);

            // Mark user answer
            userAnswers[qIndex] = isCorrect;

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                playSound('correct');
                // Confetti
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00D26A', '#00C9A7', '#F1C40F']
                });
            } else {
                selectedBtn.classList.add('incorrect');
                playSound('incorrect');
                
                // Highlight the correct answer automatically
                btns.forEach(btn => {
                    if (btn.dataset.correct === "true") {
                        btn.classList.add('correct');
                    }
                });
            }

            // Show explanation
            explanationBox.style.display = 'block';
        }

        // --- SUBMIT & SCORE ---
        function submitQuiz() {
            let score = 0;
            const total = quizData.questions.length;

            Object.values(userAnswers).forEach(isCorrect => {
                if (isCorrect) score++;
            });

            const scoreDisplay = document.getElementById('finalScore');
            const feedbackDisplay = document.getElementById('finalFeedback');
            const modal = document.getElementById('resultModal');

            scoreDisplay.innerText = `${score}/${total}`;
            
            // Random Praise
            const praises = [
                "Xuất sắc! Con là thiên tài Tiếng Anh! 🌟",
                "Làm tốt lắm! Cố gắng phát huy nhé! 💪",
                "Khá lắm! Luyện tập thêm một chút nữa là tuyệt vời! 📚",
                "Đừng buồn nhé, làm lại để nhớ lâu hơn nào! 🔥"
            ];
            
            let praiseIndex = 0;
            if (score === total) praiseIndex = 0;
            else if (score > total * 0.7) praiseIndex = 1;
            else if (score > total * 0.4) praiseIndex = 2;
            else praiseIndex = 3;

            feedbackDisplay.innerText = praises[praiseIndex];
            
            modal.style.display = 'flex';
            
            if (score > total * 0.5) {
                 confetti({
                    particleCount: 200,
                    spread: 100,
                    origin: { y: 0.6 }
                });
            }
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
            // Reload page to reset
            location.reload();
        }

        // Init
        window.onload = renderQuiz;

    </script>
