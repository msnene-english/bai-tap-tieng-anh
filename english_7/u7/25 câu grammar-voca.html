<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Tiếng Anh - Unit 7: Traffic (Ms. Chí Nên )</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Hồng tím nhạt */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --accent-color: #FF9F43; /* Cam */
            --text-color: #2d3436;
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f3f5;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Ngăn bôi đen để trải nghiệm giống app */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#dcdde1 15%, transparent 16%), radial-gradient(#dcdde1 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            background: white;
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 3px solid var(--primary-color);
            position: relative;
            z-index: 10;
        }

        h2 {
            font-family: 'Quicksand', sans-serif;
            color: var(--primary-color);
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Main Game Container --- */
        .game-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-bottom: 8px solid #dfe6e9;
            position: relative;
            transition: transform 0.3s;
        }

        /* --- Progress Bar --- */
        .progress-wrapper {
            width: 100%;
            height: 20px;
            background-color: #dfe6e9;
            border-radius: 15px;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            border-radius: 15px;
            transition: width 0.5s ease-in-out;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1);
        }

        .question-count {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8rem;
            font-weight: 800;
            color: #636e72;
        }

        /* --- Question --- */
        .question-box {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.5;
        }

        /* --- Options Grid --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--text-color);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 5px 0 #b2bec3; /* 3D effect */
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b2bec3;
        }

        .option-circle {
            width: 30px;
            height: 30px;
            background: #f1f2f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: 800;
            color: #a4b0be;
            flex-shrink: 0;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: var(--correct-color);
            box-shadow: 0 5px 0 #00944a;
        }
        .option-btn.correct .option-circle {
            background: white;
            color: var(--correct-color);
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: var(--wrong-color);
            box-shadow: 0 5px 0 #c23616;
            animation: shake 0.5s;
        }
        .option-btn.wrong .option-circle {
            background: white;
            color: var(--wrong-color);
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }
        
        .option-btn.dimmed {
            opacity: 0.5;
        }

        /* --- Explanation Box --- */
        .explanation-box {
            margin-top: 30px;
            background: #f8f9fa;
            border: 2px dashed var(--primary-color);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .explanation-header {
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2d3436;
            white-space: pre-wrap; /* Preserve line breaks */
        }
        
        .explanation-content strong {
            color: #d63031;
        }

        /* --- Next Button --- */
        .next-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #e58e26;
            margin-top: 25px;
            display: none; /* Hidden */
            width: 100%;
            font-family: 'Quicksand', sans-serif;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .next-btn:hover {
            transform: scale(1.02);
            background-color: #ffaf40;
        }
        
        .next-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #e58e26;
        }

        /* --- Result Modal --- */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: zoomIn 0.5s;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            border: 5px solid white;
            box-shadow: 0 0 0 5px var(--primary-color);
        }

        .message {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 20px;
        }
        
        .restart-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #00944a;
        }
        
        .restart-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 transparent;
        }

        /* --- Animations --- */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* --- Confetti Canvas --- */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <header>
        <h2>Giáo viên tạo: Ms. Chí Nên </h2>
    </header>

    <div class="game-container">
        <div class="progress-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
            <div class="question-count" id="question-count">1/25</div>
        </div>

        <div class="question-box" id="question-text">
            Loading Question...
        </div>

        <div class="options-grid" id="options-container">
            <!-- Options will be generated here -->
        </div>

        <div class="explanation-box" id="explanation-box">
            <div class="explanation-header">
                <span>💡 Giải thích chi tiết (Ms. Chí Nên)</span>
            </div>
            <div class="explanation-content" id="explanation-text">
                <!-- Explanation text -->
            </div>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➜</button>
    </div>

    <!-- Result Modal -->
    <div class="result-overlay" id="result-overlay">
        <div class="result-card">
            <div class="score-circle" id="final-score">0/25</div>
            <h2 id="final-title" style="color:var(--primary-color); margin-bottom:10px;">Hoàn thành!</h2>
            <p class="message" id="final-message">Bạn đã làm rất tốt!</p>
            <button class="restart-btn" onclick="restartGame()">Làm lại bài thi ↺</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        // --- DATA SOURCE (From User Context) ---
        const rawData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "Drivers have to __________ their seatbelt whenever they drive.",
              "answerOptions": [
                { "text": "put", "rationale": "Phân tích:\n- A. put (v): đặt, để\n- B. tie (v): buộc, thắt (dây giày, cà vạt)\n- C. fasten (v): thắt, cài (dây an toàn)\n- D. put on (v): mặc vào (quần áo)\n\nGiải thích: Cụm từ cố định 'fasten one's seatbelt' nghĩa là thắt dây an toàn.\n\nDịch câu: Các tài xế phải thắt dây an toàn bất cứ khi nào họ lái xe.", "isCorrect": false },
                { "text": "tie", "rationale": "", "isCorrect": false },
                { "text": "fasten", "rationale": "Phân tích:\n- A. put (v): đặt, để\n- B. tie (v): buộc, thắt (dây giày, cà vạt)\n- C. fasten (v): thắt, cài (dây an toàn)\n- D. put on (v): mặc vào (quần áo)\n\nGiải thích: Cụm từ cố định 'fasten one's seatbelt' nghĩa là thắt dây an toàn.\n\nDịch câu: Các tài xế phải thắt dây an toàn bất cứ khi nào họ lái xe.", "isCorrect": true },
                { "text": "put on", "rationale": "", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 2,
              "question": "We should wait for the traffic lights __________ before we cross the street.",
              "answerOptions": [
                { "text": "turn green", "rationale": "", "isCorrect": false },
                { "text": "to turn green", "rationale": "Phân tích:\n- A. turn green (v): chuyển xanh\n- B. to turn green (to v): chuyển xanh\n- C. turn yellow (v): chuyển vàng\n- D. to turn yellow (to v): chuyển vàng\n\nGiải thích: Cấu trúc 'wait for sb/sth to do sth' (chờ ai/cái gì làm gì). Để qua đường an toàn thì đèn phải chuyển xanh.\n\nDịch câu: Chúng ta nên chờ đèn giao thông chuyển sang màu xanh trước khi băng qua đường.", "isCorrect": true },

            {

              "answerOptions": [

                { "text": "mask", "rationale": "", "isCorrect": false },
                { "text": "helmet", "rationale": "Phân tích:\n- A. hard hat (n): mũ bảo hộ (công trường)\n- B. cap (n): mũ lưỡi trai\n- C. mask (n): khẩu trang/mặt nạ\n- D. helmet (n): mũ bảo hiểm\n\nGiải thích: Khi đi xe máy/xe đạp, vật dụng bảo vệ đầu bắt buộc là 'helmet'.\n\nDịch câu: Người đi xe đạp và người đi xe máy phải đội mũ bảo hiểm khi họ lái xe.", "isCorrect": true }
              ]
            },
            {

                { "text": "signal", "rationale": "Phân tích:\n- A. signal (n): tín hiệu (xi nhan)\n- B. sign (n): biển báo/ký hiệu\n- C. light (n): đèn\n- D. hand (n): bàn tay\n\nGiải thích: Cụm từ 'give a signal' nghĩa là ra tín hiệu (xi nhan) xin đường.\n\nDịch câu: Anh ấy quên ra tín hiệu trước khi rẽ trái và đã bị phạt.", "isCorrect": true },

              ]
            },
            {

            },
            {
              "questionNumber": 13,

                { "text": "remember", "rationale": "", "isCorrect": false }
              ]
            },
            {

              "question": "You should __________ right and left when you go across the roads.",
              "answerOptions": [

                { "text": "look", "rationale": "Phân tích:\n- A. see (v): nhìn thấy (thụ động)\n- B. look (v): nhìn (chủ động)\n- C. be (v): thì, là\n- D. take (v): cầm, lấy\n\nGiải thích: 'Look right and left' (Nhìn trái nhìn phải) là hành động chủ động quan sát.\n\nDịch câu: Bạn nên nhìn bên phải và bên trái khi băng qua đường.", "isCorrect": true },
                { "text": "be", "rationale": "", "isCorrect": false },
                { "text": "take", "rationale": "", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 20,
              "question": "Hurry up or we can’t __________ the last bus home.",
              "answerOptions": [
                { "text": "keep", "rationale": "", "isCorrect": false },
                { "text": "follow", "rationale": "", "isCorrect": false },
                { "text": "go", "rationale": "", "isCorrect": false },

              ]
            },
            {
              "questionNumber": 21,
              "question": "There used to be fewer people and __________ on the roads.",
              "answerOptions": [
                { "text": "roofs", "rationale": "", "isCorrect": false },
                { "text": "helmets", "rationale": "", "isCorrect": false },
                { "text": "helicopters", "rationale": "", "isCorrect": false },

            {

                { "text": "traffic light", "rationale": "", "isCorrect": false },

              ]
            },
            {

              "question": "It is dangerous to ride a motorbike without a __________",
              "answerOptions": [
                { "text": "helmet", "rationale": "Phân tích:\n- A. helmet (n): mũ bảo hiểm\n- B. triangle (n): hình tam giác\n- C. tricycle (n): xe ba bánh\n- D. circle (n): hình tròn\n\nGiải thích: Lái xe máy cần đội mũ bảo hiểm để an toàn.\n\nDịch câu: Thật nguy hiểm khi lái xe máy mà không có mũ bảo hiểm.", "isCorrect": true },
                { "text": "triangle", "rationale": "", "isCorrect": false },

              "question": "In Hanoi, during rush hour, some road users ride their motorbikes on the __________",
              "answerOptions": [
                { "text": "pavement", "rationale": "Phân tích:\n- A. driving licence (n): bằng lái xe\n- B. lane (n): làn đường\n- C. pavement (n): vỉa hè\n- D. seat belt (n): dây an toàn\n\nGiải thích: Hành động sai trái thường thấy khi tắc đường là đi xe lên vỉa hè (pavement).\n\nDịch câu: Ở Hà Nội, trong giờ cao điểm, một số người tham gia giao thông lái xe máy lên vỉa hè.", "isCorrect": true },

              ]
            },
            {
              "questionNumber": 25,
              "question": "Traffic is terrible during the __________ when everyone is in a hurry to get to work or come back home.",
              "answerOptions": [
                { "text": "rush hour", "rationale": "Phân tích:\n- A. traffic light (n): đèn giao thông\n- B. road sign (n): biển báo giao thông\n- C. traffic rule (n): luật giao thông\n- D. rush hour (n): giờ cao điểm\n\nGiải thích: Khoảng thời gian mọi người vội vã đi làm hoặc về nhà gọi là 'rush hour'.\n\nDịch câu: Giao thông rất tệ trong giờ cao điểm khi mọi người vội vã đi làm hoặc trở về nhà.", "isCorrect": true },
                { "text": "traffic light", "rationale": "", "isCorrect": false },
                { "text": "road sign", "rationale": "", "isCorrect": false },
                { "text": "traffic rule", "rationale": "", "isCorrect": false }
              ]
            }
          ]
        };

        // --- GAME LOGIC ---
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];
        let audioCtx;

        // Initialize Audio Context (Standard Web Audio API for internal sounds)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Sound Synthesis Functions (No external files needed)
        function playSound(type) {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // High pitch Ding
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Low pitch Buzz
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'end') {
                // Celebration melody
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gn = audioCtx.createGain();
                    osc.connect(gn);
                    gn.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gn.gain.setValueAtTime(0.1, now + i*0.1);
                    gn.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.4);
                    osc.start(now + i*0.1);
                    osc.stop(now + i*0.1 + 0.4);
                });
            }
        }

        // Shuffle Function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            // Clone and shuffle questions
            shuffledQuestions = JSON.parse(JSON.stringify(rawData.questions));
            shuffleArray(shuffledQuestions);
            
            // Shuffle options within each question
            shuffledQuestions.forEach(q => {
                shuffleArray(q.answerOptions);
            });

            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('result-overlay').style.display = 'none';
            renderQuestion();
        }

        function renderQuestion() {
            const currentQ = shuffledQuestions[currentQuestionIndex];
            
            // Update UI text
            document.getElementById('question-count').innerText = `${currentQuestionIndex + 1}/${shuffledQuestions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / shuffledQuestions.length) * 100}%`;
            document.getElementById('question-text').innerText = currentQ.question;
            
            // Reset Explanation & Next Button
            document.getElementById('explanation-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            // Generate Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const letters = ['A', 'B', 'C', 'D'];
            
            currentQ.answerOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <div class="option-circle">${letters[index]}</div>
                    <span>${opt.text}</span>
                `;
                btn.onclick = () => checkAnswer(opt, btn, currentQ);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedOpt, btnElement, currentQData) {
            // Disable all buttons
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            // Find correct answer data for explanation logic
            // Note: The structure has 'rationale' in specific items. 
            // We need to find the item that HAS the explanation or aggregate them.
            // In the provided JSON, only the correct answer or the first option usually carries the full rationale text.
            // We will look for the non-empty rationale from the original question set (before shuffle options logic might have moved it).
            
            // Actually, in the provided JSON, usually only ONE option has the big text block, or they share it.
            // Let's find the rationale text from the options.
            let explanationText = "";
            const correctOption = currentQData.answerOptions.find(o => o.isCorrect);
            const explanationOption = currentQData.answerOptions.find(o => o.rationale && o.rationale.length > 10); // Find the one with text
            
            if (explanationOption) {
                explanationText = explanationOption.rationale;
            } else {
                 explanationText = "Đang cập nhật giải thích...";
            }

            // Highlighting logic
            if (selectedOpt.isCorrect) {
                score++;
                btnElement.classList.add('correct');
                playSound('correct');
                fireConfetti();
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                // Find and highlight correct button
                buttons.forEach(b => {
                    if (b.innerText.includes(correctOption.text)) { // Simple check
                        b.classList.add('correct');
                    } else {
                        b.classList.add('dimmed');
                    }
                });
            }

            // Show Explanation
            const expBox = document.getElementById('explanation-box');
            const expText = document.getElementById('explanation-text');
            
            // Formatting text for better readability
            let formattedExp = explanationText
                .replace(/\n/g, '<br>')
                .replace(/(Phân tích:)/g, '<strong>$1</strong>')
                .replace(/(Giải thích:)/g, '<br><strong>$1</strong>')
                .replace(/(Dịch câu:)/g, '<br><strong>$1</strong>');

            expText.innerHTML = formattedExp;
            expBox.style.display = 'block';

            // Show Next Button
            document.getElementById('next-btn').style.display = 'block';
            
            // Scroll to explanation on mobile
            if(window.innerWidth < 600) {
                setTimeout(() => expBox.scrollIntoView({behavior: "smooth"}), 100);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            playSound('end');
            const overlay = document.getElementById('result-overlay');
            const scoreEl = document.getElementById('final-score');
            const messageEl = document.getElementById('final-message');
            const titleEl = document.getElementById('final-title');
            
            scoreEl.innerText = `${score}/${shuffledQuestions.length}`;
            
            const percentage = (score / shuffledQuestions.length) * 100;
            if (percentage === 100) {
                titleEl.innerText = "TUYỆT VỜI!";
                messageEl.innerText = "Bạn là thiên tài Tiếng Anh! Điểm tuyệt đối!";
                fireConfetti();
            } else if (percentage >= 80) {
                titleEl.innerText = "RẤT TỐT!";
                messageEl.innerText = "Kiến thức của bạn rất vững chắc!";
            } else if (percentage >= 50) {
                titleEl.innerText = "CỐ LÊN NHÉ!";
                messageEl.innerText = "Bạn đã vượt qua bài kiểm tra, hãy ôn tập thêm nhé.";
            } else {
                titleEl.innerText = "CẦN CỐ GẮNG!";
                messageEl.innerText = "Đừng nản lòng, hãy xem lại phần giải thích và thử lại nhé!";
            }
            
            overlay.style.display = 'flex';
        }

        function restartGame() {
            initGame();
        }

        // --- CONFETTI LOGIC (Simple implementation) ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confetti = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            for (let i = 0; i < 100; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 10 + 5,
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 4 - 2,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            confetti.forEach((p, index) => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotationSpeed;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) {
                    confetti.splice(index, 1);
                }
            });

            if (confetti.length > 0) {
                requestAnimationFrame(animateConfetti);
            }
        }

        // --- START ---
        window.onload = initGame;

    </script>
