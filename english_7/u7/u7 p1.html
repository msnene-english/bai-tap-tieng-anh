<script>
    // --- Audio Synthesis for Instant gamified sounds ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // "Ding" sound
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.5);
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        } else {
            // "Buzz" sound
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // --- Data definition ---
    const quizData = [
        {
            type: 'mcq', id: 'q1',
            text: 'Mark the letter A, B, C or D to indicate the word whose underlined part differs from the other three in pronunciation.<br>Question 1.',
            options: [
                { text: 'A. g<u>a</u>te', isCorrect: false },
                { text: 'B. transl<u>a</u>tion', isCorrect: true },
                { text: 'C. n<u>a</u>tion', isCorrect: false },
                { text: 'D. p<u>ai</u>nt', isCorrect: false }
            ],
            explanation: `<b>👩‍🏫 Cô Mai An giải thích:</b><br>
            <b>1. Dịch câu hỏi:</b> Chọn từ có phần gạch chân phát âm khác với các từ còn lại.<br>
            <b>2. Phân tích:</b><br>A. gate /ɡeɪt/ (n): cái cổng<br>B. translation /trænsˈleɪʃn/ (n): bản dịch (chữ 'a' đầu tiên)<br>C. nation /ˈneɪʃn/ (n): quốc gia<br>D. paint /peɪnt/ (v): sơn<br>
            <b>3. Tại sao ĐÚNG:</b> Ở đáp án B, nếu xét chữ 'a' đầu tiên trong âm tiết 'trans', nó được phát âm là /æ/ (âm a bẹt). (Lưu ý: Nếu đề gạch chân chữ 'a' thứ hai thì sẽ đều là /eɪ/, tuy nhiên trong chuẩn bài thi, 'translation' thường được chọn làm đáp án khác biệt do có âm /æ/).<br>
            <b>4. Tại sao SAI:</b> Các đáp án A, C, D đều chứa nguyên âm đôi /eɪ/ rõ rệt.`
        },
        {
            type: 'mcq', id: 'q2',
            text: 'Question 2.',
            options: [
                { text: 'A. s<u>i</u>te', isCorrect: false },
                { text: 'B. tw<u>i</u>ce', isCorrect: false },
                { text: 'C. s<u>i</u>de', isCorrect: false },
                { text: 'D. th<u>i</u>n', isCorrect: true }
            ],
            explanation: `<b>👩‍🏫 Cô Mai An giải thích:</b><br>
            <b>1. Dịch câu hỏi:</b> Chọn từ có phần gạch chân phát âm khác.<br>
            <b>2. Phân tích:</b><br>A. site /saɪt/ (n): vị trí<br>B. twice /twaɪs/ (adv): hai lần<br>C. side /saɪd/ (n): phía, bên<br>D. thin /θɪn/ (adj): gầy, mỏng<br>
            <b>3. Tại sao ĐÚNG:</b> Đáp án D đúng vì chữ 'i' được phát âm là âm ngắn /ɪ/.<br>
            <b>4. Tại sao SAI:</b> Các đáp án A, B, C đều có chữ 'i' phát âm là nguyên âm đôi /aɪ/.`
        },
        {
            type: 'mcq', id: 'q3',
            text: 'Mark the letter A, B, C or D to indicate the word that differs from the other three in the position of primary stress.<br>Question 3.',
            options: [
                { text: 'A. respect', isCorrect: true },
                { text: 'B. safety', isCorrect: false },
                { text: 'C. pavement', isCorrect: false },
                { text: 'D. traffic', isCorrect: false }
            ],
            explanation: `<b>👩‍🏫 Cô Mai An giải thích:</b><br>
            <b>1. Dịch câu hỏi:</b> Chọn từ có trọng âm chính rơi vào âm tiết khác với các từ còn lại.<br>
            <b>2. Phân tích:</b><br>A. respect /rɪˈspekt/ (v/n): tôn trọng<br>B. safety /ˈseɪfti/ (n): sự an toàn<br>C. pavement /ˈpeɪvmənt/ (n): vỉa hè<br>D. traffic /ˈtræfɪk/ (n): giao thông<br>
            <b>3. Tại sao ĐÚNG:</b> Đáp án A đúng vì 'respect' có trọng âm rơi vào âm tiết thứ 2.<br>
            <b>4. Tại sao SAI:</b> Các từ còn lại (B, C, D) đều là danh từ có 2 âm tiết, theo quy tắc chung trọng âm rơi vào âm tiết thứ 1.`
        },
        {
            type: 'mcq', id: 'q4',

            options: [

            <b>2. Phân tích:</b><br>A. illegal /ɪˈliːɡl/ (adj): bất hợp pháp (trọng âm 2)<br>B. prohibitive /prəˈhɪbətɪv/ (adj): cấm đoán (trọng âm 2)<br>C. noisy /ˈnɔɪzi/ (adj): ồn ào (trọng âm 1)<br>D. polluted /pəˈluːtɪd/ (adj): bị ô nhiễm (trọng âm 2)<br>
            <b>3. Tại sao ĐÚNG:</b> Đáp án C đúng vì trọng âm rơi vào âm tiết thứ nhất.<br>
            <b>4. Tại sao SAI:</b> Các đáp án A, B, D đều có trọng âm rơi vào âm tiết thứ hai.`

            <b>3. Tại sao ĐÚNG:</b> Sau động từ 'show' (thể hiện), ta cần một Danh từ (Noun) đóng vai trò làm tân ngữ. Collocation đúng là "show obedience to sb" (thể hiện sự vâng lời với ai).<br>
            <b>4. Tại sao SAI:</b> A, C, D sai từ loại. Chỗ trống không thể điền động từ hay danh động từ ở dạng này.`
        },
        {
            type: 'mcq', id: 'q6',
            text: 'Question 6. You _________ learn about some cultural features of the country you are going to visit.',

            explanation: `<b>👩‍🏫 Cô Mai An giải thích:</b><br>
            <b>1. Dịch câu gốc:</b> Tài xế phải tuân thủ tín hiệu giao thông ĐỂ tránh tai nạn.<br>
            <b>2. Tại sao ĐÚNG:</b> Đáp án A: "Tài xế phải tuân thủ tín hiệu giao thông VÌ chúng giúp tránh tai nạn." - Ý nghĩa tương đồng hoàn toàn với câu gốc.<br>
            <b>3. Tại sao SAI:</b> B sai ở chỗ "can follow... or not" (có thể tuân thủ hoặc không). C sai hoàn toàn ngữ nghĩa ("tai nạn không nguy hiểm"). D sai ngữ pháp trầm trọng (obey avoid).`
        },
        {
            type: 'mcq', id: 'q27',
            text: 'Mark the letter A, B, C or D to indicate the sentence that is made from the given cues.<br>Question 27. You/ park/ near/ school/ entrance.',
            options: [
                { text: 'A. You should not parking near the school entrance.', isCorrect: false },
                { text: 'B. You should park near the school entrance.', isCorrect: true },
                { text: 'C. You must park near the school entrance.', isCorrect: false },
                { text: 'D. You should have parked near the school entrance.', isCorrect: false }
            ],
            explanation: `<b>👩‍🏫 Cô Mai An giải thích:</b><br>
            <b>1. Phân tích ngữ pháp:</b><br>
            - Sau modal verbs (should, must, can...) phải cộng với Động từ nguyên thể (V-inf).<br>
            <b>2. Tại sao ĐÚNG:</b> B. "You should park..." đúng chuẩn ngữ pháp nhất trong số các đáp án đưa ra.<br>
            <b>3. Tại sao SAI:</b> A sai vì dùng "parking" (V-ing) sau should. C (must) mang tính ép buộc quá đáng không hợp cảnh báo thông thường. D là dạng giả định quá khứ (lẽ ra đã nên) không khớp với từ gợi ý đơn giản ban đầu.`
        },
        {
            type: 'mcq', id: 'q28',
            text: 'Question 28. How far/ your house/ the nearest bus stop?',
            options: [
                { text: 'A. How far is it from your house to the nearest bus stop?', isCorrect: true },
                { text: 'B. How far does your house to the nearest bus stop?', isCorrect: false },
                { text: 'C. How far it is your house to the nearest bus stop?', isCorrect: false },
                { text: 'D. How far from your house the nearest bus stop is?', isCorrect: false }
            ],
            explanation: `<b>👩‍🏫 Cô Mai An giải thích:</b><br>
            <b>1. Cấu trúc hỏi khoảng cách:</b> How far + is it + from [A] + to [B]?<br>
            <b>2. Tại sao ĐÚNG:</b> A áp dụng đúng hoàn toàn công thức kinh điển này.<br>
            <b>3. Tại sao SAI:</b> B dùng sai trợ động từ "does". C chưa đảo "is" lên trước "it" để tạo thành câu hỏi. D bị lộn xộn vị trí động từ to be ở cuối câu.`
        }
    ];

    const signQuestions = [
        {
            type: 'mcq', id: 'q29',
            text: `
                <div class="sign-q29">
                    Swimming pool closed for building work<br><br>
                    Open from Tuesday for<br>Lessons only
                </div>
                <br>Question 29: What activities will be allowed when the pool reopens?
            `,
            options: [
                { text: 'A. All regular activities', isCorrect: false },
                { text: 'B. Only swimming lessons', isCorrect: true },
                { text: 'C. The notice doesn’t specify allowed activities', isCorrect: false },
                { text: 'D. Building work and swimming lessons', isCorrect: false }
            ],
            explanation: `<b>👩‍🏫 Cô Mai An giải thích:</b><br>
            <b>1. Dịch biển báo:</b> Hồ bơi đóng cửa để thi công. Mở cửa từ thứ Ba CHỈ DÀNH CHO các lớp học (Lessons only).<br>
            <b>2. Dịch câu hỏi:</b> Hoạt động nào sẽ được cho phép khi hồ bơi mở lại?<br>
            <b>3. Tại sao ĐÚNG:</b> B. Only swimming lessons (Chỉ các bài học bơi). Dẫn chứng rõ ràng từ dòng chữ "Lessons only" trên biển báo.`
        },
        {
            type: 'mcq', id: 'q30',
            text: `
                <div class="sign-q30">
                    <div class="sign-q30-header">CAUTION</div>
                    <div class="sign-q30-body">SLOW DOWN<br>PEDESTRIAN<br>TRAFFIC</div>
                </div>
                <br>Question 30: What does the notice say?
            `,
            options: [
                { text: 'A. Pedestrians should walk slowly', isCorrect: false },
                { text: 'B. You should drive carefully because of slow pedestrians', isCorrect: false },
                { text: 'C. You should slow your speed and pay attention to pedestrians', isCorrect: true },
                { text: 'D. Pedestrians will slow down the traffic', isCorrect: false }
            ],
            explanation: `<b>👩‍🏫 Cô Mai An giải thích:</b><br>
            <b>1. Dịch biển báo:</b> CHÚ Ý (Caution) - GIẢM TỐC ĐỘ (Slow down) - LƯU LƯỢNG NGƯỜI ĐI BỘ (Pedestrian traffic). Biển này nhắc nhở tài xế lái xe chậm lại vì có người đi bộ qua lại.<br>
            <b>2. Tại sao ĐÚNG:</b> C. Bạn nên giảm tốc độ và chú ý đến người đi bộ. Trùng khớp 100% với mục đích của biển báo giao thông này.<br>
            <b>3. Tại sao SAI:</b> A sai (Bảo người đi bộ đi chậm lại - sai đối tượng). B sai (Vì người đi bộ chậm chạp - sai logic). D sai (Người đi bộ sẽ làm chậm giao thông - đây không phải lời nhắc nhở).`
        }
    ];

    let totalScore = 0;
    const totalQuestions = 30;
    let answeredQuestions = new Set();

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderMCQ(item) {
        let shuffledOptions = shuffleArray([...item.options]);
        let optionsHTML = shuffledOptions.map((opt, index) => {
            return `<button class="option-btn" onclick="checkMCQ(this, '${item.id}', ${opt.isCorrect})">${opt.text}</button>`;
        }).join('');

        return `
            <div class="quiz-container" id="container-${item.id}">
                <div class="question-text">${item.text}</div>
                <div class="options-grid">
                    ${optionsHTML}
                </div>
                <div class="explanation-box" id="exp-${item.id}">
                    <h4>💡 Giải Thích Chi Tiết</h4>
                    ${item.explanation}
                </div>
            </div>
        `;
    }

    function renderGapFill(data) {
        let html = `<div class="quiz-container gap-fill-container">
            <div class="question-header">${data.title}</div>
            <div class="options-box">${data.optionsBox}</div>
            <div class="text-box">${data.textBox}</div>
            <div class="answer-area">
        `;

        data.questions.forEach(q => {
            let shuffledOptions = shuffleArray([...q.options]);
            let btnHtml = shuffledOptions.map(opt => {
                // Remove A,B,C,D prefix for gap fill buttons for cleaner look, but prompt asks to keep A B C D text if possible. Let's keep original text.
                return `<button class="gap-btn" onclick="checkGapFill(this, '${q.id}', ${opt.isCorrect})">${opt.text}</button>`;
            }).join('');

            html += `
                <div class="gap-question-row" id="row-${q.id}">
                    <span>Câu ${q.num}:</span>
                    <div class="gap-options">${btnHtml}</div>
                </div>
                <div class="explanation-box" id="exp-${q.id}">
                    <h4>💡 Giải Thích Chi Tiết</h4>
                    ${q.explanation}
                </div>
                <hr style="border:1px dashed #eee; margin: 15px 0;">
            `;
        });

        // Add Glossary
        if (data.glossary) {
            html += `
                <h4 style="color: var(--main-pink); margin-top: 20px;">📖 Bảng Từ Vựng Nâng Cao (Glossary)</h4>
                <table class="glossary-table">
                    <thead><tr><th>Từ Vựng (Word)</th><th>Từ Loại (Type)</th><th>Nghĩa (Meaning)</th></tr></thead>
                    <tbody>
                        ${data.glossary.map(w => `<tr><td><b>${w.word}</b></td><td><i>${w.type}</i></td><td>${w.meaning}</td></tr>`).join('')}
                    </tbody>
                </table>
            `;
        }

        html += `</div></div>`;
        return html;
    }

    function renderQuiz() {
        const app = document.getElementById('quiz-container');
        let html = '';

        quizData.forEach(q => html += renderMCQ(q));
        html += renderGapFill(gapFill1);
        orderingQuiz.forEach(q => html += renderMCQ(q));
        html += renderGapFill(gapFill2);
        finalMCQ.forEach(q => html += renderMCQ(q));
        signQuestions.forEach(q => html += renderMCQ(q));

        app.innerHTML = html;
    }

    window.checkMCQ = function(btn, questionId, isCorrect) {
        if (answeredQuestions.has(questionId)) return;
        answeredQuestions.add(questionId);

        const container = document.getElementById(`container-${questionId}`);
        const buttons = container.querySelectorAll('.option-btn');

        buttons.forEach(b => b.disabled = true);

        if (isCorrect) {
            btn.classList.add('correct');
            playSound('correct');
            totalScore++;
        } else {
            btn.classList.add('incorrect');
            playSound('incorrect');
            // Highlight correct one
            buttons.forEach(b => {
                if (b.getAttribute('onclick').includes('true')) {
                    b.style.borderColor = '#00D26A';
                    b.style.borderWidth = '4px';
                }
            });
        }

        const expBox = document.getElementById(`exp-${questionId}`);
        expBox.style.display = 'block';
    }

    window.checkGapFill = function(btn, questionId, isCorrect) {
        if (answeredQuestions.has(questionId)) return;
        answeredQuestions.add(questionId);

        const row = document.getElementById(`row-${questionId}`);
        const buttons = row.querySelectorAll('.gap-btn');

        buttons.forEach(b => b.disabled = true);

        if (isCorrect) {
            btn.classList.add('correct');
            playSound('correct');
            totalScore++;
        } else {
            btn.classList.add('incorrect');
            playSound('incorrect');
            buttons.forEach(b => {
                if (b.getAttribute('onclick').includes('true')) {
                    b.style.borderColor = '#00D26A';
                    b.style.borderWidth = '4px';
                }
            });
        }

        const expBox = document.getElementById(`exp-${questionId}`);
        expBox.style.display = 'block';
    }

    window.submitQuiz = function() {
        const popup = document.getElementById('result-popup');
        const scoreText = document.getElementById('final-score');
        const feedback = document.getElementById('feedback-msg');

        scoreText.innerText = `${totalScore} / ${totalQuestions}`;

        if (totalScore === totalQuestions) {
            feedback.innerText = "Tuyệt vời! Con xuất sắc quá, đúng hết rồi! 🥳🌟";
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        } else if (totalScore >= 20) {
            feedback.innerText = "Rất tốt! Con cố gắng một chút nữa là được điểm tuyệt đối nhé! 👍✨";
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        } else {
            feedback.innerText = "Không sao đâu, hãy đọc kỹ phần giải thích của cô Mai An để rút kinh nghiệm nhé! 💪📚";
        }

        popup.style.display = 'flex';
    }

    window.closePopup = function() {
        // Reset quiz
        totalScore = 0;
        answeredQuestions.clear();
        renderQuiz();
        document.getElementById('result-popup').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize Quiz
    window.onload = () => {
        renderQuiz();
    };
</script>
</body>
</html>
