<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Câu Trọng Âm Unit 7: Traffic - Ms. Chí Nên </title>
    <!-- Nhúng Font Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Tím hồng nhạt */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #f0f3f5;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Chống bôi đen để tạo cảm giác app */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dcdde1 15%, transparent 16%), radial-gradient(#dcdde1 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--primary-color);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        .teacher-name {
            color: var(--secondary-color);
            font-weight: 700;
            font-size: 1rem;
            margin-top: 5px;
        }

        /* --- QUIZ CONTAINER --- */
        #quiz-container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        /* --- PROGRESS BAR --- */
        .progress-container {
            width: 100%;
            height: 15px;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .progress-bar {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        /* --- QUESTION CARD --- */
        .question-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 0 #dfe6e9, 0 15px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #fff;
            position: relative;
            overflow: hidden;
        }

        .question-number {
            font-size: 1.2rem;
            font-weight: 800;
            color: #b2bec3;
            margin-bottom: 10px;
            display: block;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-color);
            line-height: 1.4;
        }

        /* --- OPTIONS GRID --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .question-text {
                font-size: 1.2rem;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 #e0e0e0;
            position: relative;
            font-family: 'Nunito', sans-serif;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 7px 0 #d1d8e0;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00b85b;
            box-shadow: 0 5px 0 #00b85b;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #e03b49;
            box-shadow: 0 5px 0 #e03b49;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* --- EXPLANATION BOX --- */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 25px;
            background: #fff0f6;
            border: 2px dashed var(--primary-color);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            animation: slideDown 0.3s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2d3436;
        }
        
        .explanation-content strong {
            color: var(--primary-color);
        }

        .explanation-content .ipa {
            color: #636e72;
            font-style: italic;
            font-family: 'Arial', sans-serif;
        }

        .next-btn-container {
            margin-top: 20px;
            display: none;
            justify-content: flex-end;
        }

        .next-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #6c4299;
            transition: transform 0.1s;
        }

        .next-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* --- ANIMATIONS --- */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CONFETTI CANVAS --- */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* --- RESULT SCREEN --- */
        #result-screen {
            display: none;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 0 #dfe6e9;
            max-width: 600px;
            width: 90%;
            border: 3px solid var(--secondary-color);
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 20px 0;
        }
        
        .feedback-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .restart-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #00a388;
        }
        
        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <h1>Bài Tập Trọng Âm Unit 7: Traffic</h1>
        <div class="teacher-name">Giáo viên: Ms. Chí Nên </div>
    </header>

    <div id="quiz-container">
        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- Question Card -->
        <div class="question-card" id="question-card">
            <span class="question-number" id="question-number">Question 1/30</span>
            <div class="question-text" id="question-text">
                Choose the word which has a different stress pattern from the others:
            </div>

            <div class="options-grid" id="options-grid">
                <!-- Options will be injected here via JS -->
            </div>

            <!-- Explanation Box -->
            <div class="explanation-box" id="explanation-box">
                <div class="explanation-header">
                    <span>💡 Ms. Chí Nên giải thích chi tiết:</span>
                </div>
                <div class="explanation-content" id="explanation-content">
                    <!-- Explanation content goes here -->
                </div>
            </div>

            <!-- Next Button -->
            <div class="next-btn-container" id="next-btn-container">
                <button class="next-btn" onclick="nextQuestion()">Câu tiếp theo ➜</button>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen">
        <h2 style="color: var(--secondary-color);">Tổng Kết Kết Quả</h2>
        <div class="score-display" id="final-score">0/30</div>
        <p class="feedback-text" id="feedback-text">Bạn làm rất tốt!</p>
        <button class="restart-btn" onclick="restartQuiz()">Làm lại bài thi</button>
    </div>

    <!-- Audio Effects -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
    <audio id="sound-finish" src="https://assets.mixkit.co/active_storage/sfx/1997/1997-preview.mp3"></audio>

    <script>
        // --- DATA ---
        // 30 Câu hỏi Trọng âm Unit 7 - Dữ liệu đầy đủ từ yêu cầu
        const quizData = [
            {
                id: 1,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["traffic", "cycle", "obey", "noisy"],
                correctIndex: 2, // C (0,1,2,3)
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>traffic</strong> /ˈtræf.ɪk/ (n): giao thông ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    B. <strong>cycle</strong> /ˈsaɪ.kəl/ (v/n): đạp xe ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    C. <strong>obey</strong> /əˈbeɪ/ (v): tuân thủ ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    D. <strong>noisy</strong> /ˈnɔɪ.zi/ (adj): ồn ào ➜ <span style="color:#d63031">Trọng âm 1</span>.<br><br>
                    <strong>Tại sao C đúng?</strong><br>
                    "Obey" là động từ 2 âm tiết nhưng trọng âm rơi vào âm tiết thứ 2. Các từ còn lại đều có trọng âm 1.
                `
            },
            {
                id: 2,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["safety", "pavement", "allow", "zebra"],
                correctIndex: 2,
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>safety</strong> /ˈseɪf.ti/ (n): sự an toàn ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    B. <strong>pavement</strong> /ˈpeɪv.mənt/ (n): vỉa hè ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    C. <strong>allow</strong> /əˈlaʊ/ (v): cho phép ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    D. <strong>zebra</strong> /ˈzeb.rə/ (n): ngựa vằn ➜ <span style="color:#d63031">Trọng âm 1</span>.<br><br>
                    <strong>Tại sao C đúng?</strong><br>
                    "Allow" bắt đầu bằng nguyên âm yếu /ə/ nên trọng âm rơi vào âm tiết thứ 2. Các từ còn lại trọng âm 1.
                `
            },
            {
                id: 3,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["illegal", "prohibitive", "bicycle", "recycle"],
                correctIndex: 2,
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>illegal</strong> /ɪˈliː.ɡəl/ (adj): bất hợp pháp ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    B. <strong>prohibitive</strong> /prəˈhɪb.ɪ.tɪv/ (adj): cấm đoán ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    C. <strong>bicycle</strong> /ˈbaɪ.sɪ.kəl/ (n): xe đạp ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    D. <strong>recycle</strong> /ˌriːˈsaɪ.kəl/ (v): tái chế ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br><br>
                    <strong>Tại sao C đúng?</strong><br>
                    "Bicycle" là danh từ 3 âm tiết nhấn âm đầu. Các từ còn lại nhấn âm 2.
                `
            },
            {
                id: 4,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["station", "intersection", "population", "indication"],
                correctIndex: 0,
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>station</strong> /ˈsteɪ.ʃən/ (n): nhà ga ➜ <span style="color:#d63031">Trọng âm 1</span> (2 âm tiết).<br>
                    B. <strong>intersection</strong> /ˌɪn.təˈsek.ʃən/ (n): giao lộ ➜ <span style="color:#0984e3">Trọng âm 3</span>.<br>
                    C. <strong>population</strong> /ˌpɒp.jəˈleɪ.ʃən/ (n): dân số ➜ <span style="color:#0984e3">Trọng âm 3</span>.<br>
                    D. <strong>indication</strong> /ˌɪn.dɪˈkeɪ.ʃən/ (n): sự chỉ dẫn ➜ <span style="color:#0984e3">Trọng âm 3</span>.<br><br>
                    <strong>Tại sao A đúng?</strong><br>
                    "Station" chỉ có 2 âm tiết và nhấn âm 1. Các từ còn lại đều có đuôi -tion và nhấn vào âm tiết thứ 3 từ dưới lên (hoặc âm trước -tion trong từ đa âm).
                `
            },
            {
                id: 5,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["vehicle", "tricycle", "helicopter", "pollution"],
                correctIndex: 3,
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>vehicle</strong> /ˈviː.ə.kəl/ (n): phương tiện ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    B. <strong>tricycle</strong> /ˈtraɪ.sɪ.kəl/ (n): xe ba bánh ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    C. <strong>helicopter</strong> /ˈhel.ɪˌkɒp.tər/ (n): trực thăng ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    D. <strong>pollution</strong> /pəˈluː.ʃən/ (n): sự ô nhiễm ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br><br>
                    <strong>Tại sao D đúng?</strong><br>
                    Từ có đuôi "-tion" trọng âm rơi vào âm tiết ngay trước nó (pollUtion). Các từ còn lại nhấn âm 1.
                `
            },
            {
                id: 6,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["license", "reverse", "listen", "enter"],
                correctIndex: 1,
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>license</strong> /ˈlaɪ.səns/ (n): giấy phép ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    B. <strong>reverse</strong> /rɪˈvɜːs/ (v): lùi xe/đảo ngược ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    C. <strong>listen</strong> /ˈlɪs.ən/ (v): nghe ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    D. <strong>enter</strong> /ˈen.tər/ (v): đi vào ➜ <span style="color:#d63031">Trọng âm 1</span>.<br><br>
                    <strong>Tại sao B đúng?</strong><br>
                    "Reverse" có âm đầu /rɪ/ ngắn nhẹ, trọng âm rơi vào âm sau /vɜːs/ dài hơn.
                `
            },
            {
                id: 7,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["crowded", "bumpy", "secure", "dusty"],
                correctIndex: 2,
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>crowded</strong> /ˈkraʊ.dɪd/ (adj): đông đúc ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    B. <strong>bumpy</strong> /ˈbʌm.pi/ (adj): gập ghềnh ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    C. <strong>secure</strong> /sɪˈkjʊər/ (adj): an toàn/đảm bảo ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    D. <strong>dusty</strong> /ˈdʌs.ti/ (adj): bụi bặm ➜ <span style="color:#d63031">Trọng âm 1</span>.<br><br>
                    <strong>Tại sao C đúng?</strong><br>
                    "Secure" có âm đầu là /sɪ/ (âm yếu), nên trọng âm nhấn vào âm 2.
                `
            },
            {
                id: 8,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["pedestrian", "impossible", "community", "helicopter"],
                correctIndex: 3,
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>pedestrian</strong> /pəˈdes.tri.ən/ (n): người đi bộ ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    B. <strong>impossible</strong> /ɪmˈpɒs.ə.bəl/ (adj): không thể ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    C. <strong>community</strong> /kəˈmjuː.nə.ti/ (n): cộng đồng ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    D. <strong>helicopter</strong> /ˈhel.ɪˌkɒp.tər/ (n): trực thăng ➜ <span style="color:#d63031">Trọng âm 1</span>.<br><br>
                    <strong>Tại sao D đúng?</strong><br>
                    Đây là câu phân loại các từ đa âm tiết. "Helicopter" nhấn âm đầu tiên, các từ còn lại nhấn âm 2.
                `
            },
            {
                id: 9,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["distance", "transport", "arrive", "journey"],
                correctIndex: 2,
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>distance</strong> /ˈdɪs.təns/ (n): khoảng cách ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    B. <strong>transport</strong> /ˈtræn.spɔːt/ (n): giao thông vận tải ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    C. <strong>arrive</strong> /əˈraɪv/ (v): đến nơi ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br>
                    D. <strong>journey</strong> /ˈdʒɜː.ni/ (n): hành trình ➜ <span style="color:#d63031">Trọng âm 1</span>.<br><br>
                    <strong>Tại sao C đúng?</strong><br>
                    "Arrive" là động từ 2 âm tiết bắt đầu bằng nguyên âm yếu /ə/, trọng âm rơi vào âm 2.
                `
            },
            {
                id: 10,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["seatbelt", "road sign", "rush hour", "ahead"],
                correctIndex: 3,
                explanation: `
                    <strong>Phân tích từ vựng & Trọng âm:</strong><br>
                    A. <strong>seatbelt</strong> /ˈsiːt.belt/ (n): dây an toàn ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    B. <strong>road sign</strong> /ˈrəʊd saɪn/ (n): biển báo ➜ <span style="color:#d63031">Trọng âm 1</span> (Danh từ ghép).<br>
                    C. <strong>rush hour</strong> /ˈrʌʃ aʊər/ (n): giờ cao điểm ➜ <span style="color:#d63031">Trọng âm 1</span> (Danh từ ghép).<br>
                    D. <strong>ahead</strong> /əˈhed/ (adv): phía trước ➜ <span style="color:#0984e3">Trọng âm 2</span>.<br><br>
                    <strong>Tại sao D đúng?</strong><br>
                    Các danh từ ghép (A, B, C) thường nhấn trọng âm vào từ đầu tiên. "Ahead" nhấn âm 2.
                `
            },
            {
                id: 11,
                question: "Choose the word which has a different stress pattern from the others:",
                options: ["police", "signal", "driver", "handle"],
                correctIndex: 0,

                    C. <strong>mirror</strong> /ˈmɪr.ər/ (n): gương ➜ <span style="color:#d63031">Trọng âm 1</span>.<br>
                    D. <strong>standard</strong> /ˈstæn.dəd/ (n/adj): tiêu chuẩn ➜ <span style="color:#d63031">Trọng âm 1</span>.<br><br>
                    <strong>Tại sao A đúng?</strong><br>
                    "Exhaust" có âm đầu /ɪg/ (âm ngắn), trọng âm rơi vào âm sau.
                `
            }
        ];

        // --- GAME LOGIC ---
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuizData = [];

        // Shuffle Function (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Initialize Quiz
        function initQuiz() {
            shuffledQuizData = shuffleArray([...quizData]);
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            loadQuestion();
        }

        // Load Question UI
        function loadQuestion() {
            const data = shuffledQuizData[currentQuestionIndex];
            
            // Update Text
            document.getElementById('question-number').innerText = `Câu ${currentQuestionIndex + 1}/${shuffledQuizData.length}`;
            document.getElementById('question-text').innerText = data.question;
            
            // Update Progress Bar
            const progress = ((currentQuestionIndex) / shuffledQuizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Render Options
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = ''; // Clear old buttons

            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, data.correctIndex, btn);
                optionsGrid.appendChild(btn);
            });

            // Reset Explanation Area
            document.getElementById('explanation-box').style.display = 'none';
            document.getElementById('next-btn-container').style.display = 'none';
        }

        // Check Answer
        function checkAnswer(selectedIndex, correctIndex, btnElement) {
            const data = shuffledQuizData[currentQuestionIndex];
            const btns = document.querySelectorAll('.option-btn');
            
            // Disable all buttons
            btns.forEach(b => b.disabled = true);

            if (selectedIndex === correctIndex) {
                // Correct
                btnElement.classList.add('correct');
                playSound('correct');
                score++;
                triggerConfetti();
            } else {
                // Wrong
                btnElement.classList.add('wrong');
                btns[correctIndex].classList.add('correct'); // Show correct one
                playSound('wrong');
            }

            // Show Explanation
            const explanationContent = document.getElementById('explanation-content');
            explanationContent.innerHTML = data.explanation;
            document.getElementById('explanation-box').style.display = 'block';

            // Show Next Button
            document.getElementById('next-btn-container').style.display = 'flex';
        }

        // Next Question
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // Show Result
        function showResult() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `${score}/${shuffledQuizData.length}`;
            playSound('finish');

            // Dynamic feedback
            const percentage = (score / shuffledQuizData.length) * 100;
            let feedback = "";
            if (percentage === 100) feedback = "Tuyệt vời! Bạn là thiên tài trọng âm! 🏆";
            else if (percentage >= 80) feedback = "Làm tốt lắm! Chỉ sai một xíu thôi! 🌟";
            else if (percentage >= 50) feedback = "Khá tốt, nhưng cần ôn luyện thêm nhé! 💪";
            else feedback = "Đừng nản chí! Hãy xem lại phần giải thích và thử lại nhé! 😊";
            
            document.getElementById('feedback-text').innerText = feedback;
            triggerConfetti();
        }

        function restartQuiz() {
            initQuiz();
        }

        function playSound(type) {
            const sound = document.getElementById(`sound-${type}`);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play blocked by browser policy"));
            }
        }

        // --- CONFETTI LOGIC (Simple JS Canvas Implementation) ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FDCB6E', '#00D26A'];

        function triggerConfetti() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    gravity: 0.5
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                if (p.y > canvas.height) particles.splice(index, 1);
            });
            if (particles.length > 0) requestAnimationFrame(updateConfetti);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start App
        initQuiz();

    </script>
</body>
</html>
