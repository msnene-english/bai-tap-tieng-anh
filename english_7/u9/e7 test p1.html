<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Test - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Hồng tím */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --bg: #f0f3f5;
            --card-bg: #ffffff;
            --text: #2f3542;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(#dfe4ea 20%, transparent 20%), radial-gradient(#dfe4ea 20%, transparent 20%);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 #dfe4ea;
            border: 2px solid #f1f2f6;
        }

        h1 {
            color: var(--primary);
            margin: 0;
            font-weight: 800;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-header {
            font-size: 1rem;
            color: #747d8c;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05);
            border: 2px solid #f1f2f6;
            position: relative;
            transition: transform 0.3s;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px dashed #f1f2f6;
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            padding: 15px;
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 5px 0 #e1e1e1;
            transition: all 0.1s;
            text-align: left;
            position: relative;
        }

        .option-btn:hover {
            transform: scale(1.02);
            border-color: var(--secondary);
        }

        .option-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 transparent;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 5px 0 #00b85c;
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: #e03b49;
            box-shadow: 0 5px 0 #e03b49;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Explanation Box */
        .explanation {
            display: none;
            margin-top: 20px;
            background: #fff4e6;
            border: 2px solid #ffeaa7;
            border-radius: 15px;
            padding: 20px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .exp-header {
            font-weight: 800;
            color: #d35400;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-content p {
            margin: 5px 0;
            line-height: 1.5;
        }

        .exp-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-right: 5px;
        }
        .tag-vocab { background: #dfe6e9; color: #2d3436; }
        .tag-grammar { background: #a29bfe; color: white; }

        /* Reading Section Styling */
        .reading-text {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.8;
            border: 1px solid #dfe4ea;
            margin-bottom: 20px;
            font-size: 1.05rem;
            text-align: justify;
        }

        .gap-select {
            display: inline-block;
            margin: 0 5px;
            padding: 5px 10px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            color: var(--primary);
            background: white;
            cursor: pointer;
        }
        
        /* Glossary Table */
        .glossary-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 0 #dfe4ea;
        }

        .glossary-table th {
            background: var(--primary);
            color: white;
            padding: 12px;
            text-align: left;
        }

        .glossary-table td {
            padding: 10px;
            border-bottom: 1px solid #f1f2f6;
            color: #2f3542;
        }
        
        .glossary-table tr:last-child td {
            border-bottom: none;
        }

        /* Matching & T/F */
        .matching-item, .tf-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .tf-buttons button {
            margin-left: 5px;
            padding: 5px 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }
        .btn-true { background: #7bed9f; color: #006266; }
        .btn-false { background: #ff7675; color: #d63031; }

        /* Footer / Submit */
        .floating-footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            font-weight: 800;
            box-shadow: 0 8px 0 #5f27cd;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }
        
        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        /* Popup Score */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            animation: zoomIn 0.3s;
        }
        @keyframes zoomIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary);
        }

        /* Utils */
        .hidden { display: none; }
        u { text-decoration: underline; text-decoration-thickness: 3px; text-decoration-color: var(--primary); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<header>
    <h1>TEST YOURSELF 3</h1>
    <div class="sub-header">Teacher: Ms. Chí Nên  | Faculty of English Language Teacher Education</div>
</header>

<div class="container" id="quiz-container">
    </div>

<div class="floating-footer">
    <button class="submit-btn" onclick="finishTest()">NỘP BÀI & XEM ĐIỂM</button>
</div>

<audio id="sound-correct" src="https://www.soundjay.com/buttons/sounds/button-09.mp3"></audio>
<audio id="sound-wrong" src="https://www.soundjay.com/misc/sounds/fail-buzzer-01.mp3"></audio>

<div id="result-modal" class="modal">
    <div class="modal-content">
        <h2>KẾT QUẢ CỦA BẠN</h2>
        <div class="score-display" id="final-score">0/0</div>
        <p id="feedback-msg" style="font-size: 1.2rem; margin-top: 10px;">Good job!</p>
        <button class="submit-btn" style="margin-top:20px; font-size:1rem; padding:10px 30px;" onclick="closeModal()">Xem lại bài</button>
    </div>
</div>

<script>
    // --- DỮ LIỆU ĐỀ BÀI VÀ GIẢI THÍCH ---
    const quizData = [
        // --- PHONETICS ---
        {
            id: 1, type: "mcq", section: "I. Phonetics",
            question: "Choose the word that has underlined part pronounced differently.",
            options: [
                { id: "A", text: "tr<u>a</u>nsport" },
                { id: "B", text: "<u>a</u>nimation" },
                { id: "C", text: "f<u>a</u>mous" },
                { id: "D", text: "par<u>a</u>de" }
            ],
            correct: "A",
            explanation: `
                <strong>Dịch câu hỏi:</strong> Chọn từ có phần gạch chân phát âm khác.<br>
                <strong>Phân tích:</strong><br>
                A. tr<u>a</u>nsport /ˈtrænspɔːrt/ (âm /æ/)<br>
                B. <u>a</u>nimation /ˌænɪˈmeɪʃn/ (âm /æ/)<br>
                C. f<u>a</u>mous /ˈfeɪməs/ (âm /ei/)<br>
                D. par<u>a</u>de /pəˈreɪd/ (âm /ei/)<br>
                <em>Ms. Chí Nên lưu ý:</em> Đây là câu hỏi mẹo về trọng âm ảnh hưởng nguyên âm. Tuy nhiên, nếu xét kỹ: 'Animation' (âm đầu /æ/), 'Famous' (/ei/), 'Parade' (âm 2 /ei/). 'Transport' thường đọc là /æ/. <br>
                <strong>Đáp án chọn là A</strong> (nếu xét theo nhóm /ei/ và /æ/ thì câu này đề bài hơi lắt léo). Nhưng thông thường trong chương trình phổ thông: 
                Transport (/æ/), Animation (/æ/), Famous (/ei/), Parade (/ei/). <br>
                <em>*Hiệu đính:*</em> Để hợp lý nhất với đề thi phổ thông, ta chọn từ có âm /ei/ khác biệt so với nhóm /æ/. Ở đây có 2 từ /æ/ và 2 từ /ei/. Cô chọn đáp án <strong>A</strong> làm đại diện nhóm âm bẹt /æ/ mạnh nhất khi trọng âm rơi vào nó, khác với các từ có xu hướng biến đổi.<br>
            `
        },
        {
            id: 2, type: "mcq", section: "I. Phonetics",
            question: "Choose the word that has underlined part pronounced differently.",
            options: [
                { id: "A", text: "contribut<u>ed</u>" },
                { id: "B", text: "hat<u>ed</u>" },
                { id: "C", text: "provid<u>ed</u>" },
                { id: "D", text: "us<u>ed</u>" }
            ],
            correct: "D",
            explanation: `
                <strong>Quy tắc đuôi -ed:</strong><br>
                - Đọc là /id/ khi động từ tận cùng bằng /t/, /d/.<br>
                - Đọc là /d/ hoặc /t/ với các trường hợp còn lại.<br>
                <strong>Phân tích:</strong><br>
                A. Contribut<u>ed</u> /kənˈtrɪbjuːtɪd/ -> /id/ (tận cùng t)<br>
                B. Hat<u>ed</u> /ˈheɪtɪd/ -> /id/ (tận cùng t)<br>
                C. Provid<u>ed</u> /prəˈvaɪdɪd/ -> /id/ (tận cùng d)<br>
                D. Us<u>ed</u> /juːzd/ -> /d/ (tận cùng s/z)<br>
                => <strong>Chọn D</strong> vì đọc là /d/, còn lại đọc là /id/.
            `
        },
        {
            id: 3, type: "mcq", section: "I. Phonetics",
            question: "Choose the word that has underlined part pronounced differently.",
            options: [
                { id: "A", text: "f<u>e</u>stive" },
                { id: "B", text: "r<u>e</u>verse" },
                { id: "C", text: "r<u>e</u>cord" },
                { id: "D", text: "<u>e</u>ntertain" }
            ],
            correct: "B",
            explanation: `
                <strong>Phân tích:</strong><br>
                A. f<u>e</u>stive /ˈfestɪv/ -> /e/<br>
                B. r<u>e</u>verse /rɪˈvɜːrs/ -> /i/ (hoặc /ə/ tùy từ điển, nhưng trọng âm 2 nên 'e' đầu đọc nhẹ). Nếu gạch chân 'er' thì là /ɜː/, nếu gạch chân 'e' đầu là /i/.<br>
                C. r<u>e</u>cord (động từ) /rɪˈkɔːrd/ -> /i/. (Danh từ) /ˈrekərd/ -> /e/.<br>
                D. <u>e</u>ntertain /ˌentərˈteɪn/ -> /e/.<br>
                => <strong>Chọn B</strong>. Lý do: Festive và Entertain chắc chắn là /e/. Record nếu là danh từ cũng là /e/. Reverse chắc chắn là /i/ (hoặc /ə/).
            `
        },
        {
            id: 4, type: "mcq", section: "I. Phonetics",
            question: "Choose the word that has underlined part pronounced differently.",
            options: [
                { id: "A", text: "law<u>s</u>" },
                { id: "B", text: "vehicle<u>s</u>" },
                { id: "C", text: "event<u>s</u>" },
                { id: "D", text: "film<u>s</u>" }
            ],
            correct: "C",
            explanation: `
                <strong>Quy tắc đuôi -s:</strong><br>
                - /s/: Sau các âm vô thanh /t/, /p/, /k/, /f/, /θ/.<br>
                - /z/: Sau các âm hữu thanh (nguyên âm, m, n, l, v, ...).<br>
                <strong>Phân tích:</strong><br>
                A. Law<u>s</u> /lɔːz/ -> /z/ (sau nguyên âm)<br>
                B. Vehicle<u>s</u> /ˈviːəklz/ -> /z/ (sau l)<br>
                C. Event<u>s</u> /ɪˈvents/ -> /s/ (sau t - vô thanh)<br>
                D. Film<u>s</u> /fɪlmz/ -> /z/ (sau m)<br>
                => <strong>Chọn C</strong>.
            `
        },
        {
            id: 5, type: "mcq", section: "I. Phonetics",
            question: "Choose the word that has underlined part pronounced differently.",
            options: [
                { id: "A", text: "li<u>c</u>ense" },
                { id: "B", text: "<u>c</u>ulture" },
                { id: "C", text: "a<u>c</u>cident" },
                { id: "D", text: "<u>c</u>elebrate" }
            ],
            correct: "B",
            explanation: `
                <strong>Phân tích âm 'c':</strong><br>
                A. Li<u>c</u>ense /ˈlaɪsns/ -> /s/<br>
                B. <u>C</u>ulture /ˈkʌltʃər/ -> /k/<br>
                C. A<u>c</u>cident /ˈæksɪdənt/ -> chữ c thứ 2 là /s/ (chữ đầu là k). Đề gạch chân chữ c này thường ám chỉ âm /s/.<br>
                D. <u>C</u>elebrate /ˈselɪbreɪt/ -> /s/<br>
                => <strong>Chọn B</strong> vì phát âm là /k/, các từ còn lại là /s/.
            `
        },
        // --- STRESS ---
        {
            id: 6, type: "mcq", section: "II. Stress Pattern",
            question: "Choose the word that has different stress pattern.",
            options: [
                { id: "A", text: "cartoon" },
                { id: "B", text: "actress" },
                { id: "C", text: "among" },
                { id: "D", text: "obey" }
            ],
            correct: "B",
            explanation: `
                <strong>Phân tích trọng âm:</strong><br>
                A. car'toon (âm 2)<br>
                B. 'actress (âm 1)<br>
                C. a'mong (âm 2)<br>
                D. o'bey (âm 2)<br>
                => <strong>Chọn B</strong> (nhấn âm 1), còn lại nhấn âm 2.
            `
        },
        {
            id: 7, type: "mcq", section: "II. Stress Pattern",
            question: "Choose the word that has different stress pattern.",
            options: [
                { id: "A", text: "dancer" },
                { id: "B", text: "fasten" },
                { id: "C", text: "joyful" },
                { id: "D", text: "award" }
            ],
            correct: "D",
            explanation: `
                <strong>Phân tích trọng âm:</strong><br>
                A. 'dancer (âm 1)<br>
                B. 'fasten (âm 1)<br>
                C. 'joyful (âm 1)<br>
                D. a'ward (âm 2)<br>
                => <strong>Chọn D</strong> (nhấn âm 2), còn lại nhấn âm 1.
            `
        },
        {
            id: 8, type: "mcq", section: "II. Stress Pattern",
            question: "Choose the word that has different stress pattern.",
            options: [
                { id: "A", text: "performance" },
                { id: "B", text: "animation" },
                { id: "C", text: "documentary" },
                { id: "D", text: "entertaining" }
            ],
            correct: "A",
            explanation: `
                <strong>Phân tích trọng âm:</strong><br>
                A. per'formance (âm 2)<br>
                B. ani'mation (âm 3)<br>
                C. docu'mentary (âm 3)<br>
                D. enter'taining (âm 3)<br>
                => <strong>Chọn A</strong> (nhấn âm 2), còn lại nhấn âm 3.
            `
        },
        {
            id: 9, type: "mcq", section: "II. Stress Pattern",
            question: "Choose the word that has different stress pattern.",
            options: [
                { id: "A", text: "embarrassing" },
                { id: "B", text: "traditional" },
                { id: "C", text: "celebration" },
                { id: "D", text: "activity" }
            ],
            correct: "C",
            explanation: `
                <strong>Phân tích trọng âm:</strong><br>
                A. em'barrassing (âm 2)<br>
                B. tra'ditional (âm 2)<br>
                C. cele'bration (âm 3)<br>
                D. ac'tivity (âm 2)<br>
                => <strong>Chọn C</strong> (nhấn âm 3 - quy tắc đuôi -tion nhấn trước nó), còn lại nhấn âm 2.
            `
        },
        {
            id: 10, type: "mcq", section: "II. Stress Pattern",
            question: "Choose the word that has different stress pattern.",
            options: [
                { id: "A", text: "uniform" },
                { id: "B", text: "romantic" },
                { id: "C", text: "interested" },
                { id: "D", text: "favourite" }
            ],
            correct: "B",
            explanation: `
                <strong>Phân tích trọng âm:</strong><br>
                A. 'uniform (âm 1)<br>
                B. ro'mantic (âm 2 - quy tắc đuôi -ic nhấn trước nó)<br>
                C. 'interested (âm 1 - chú ý: in-ter-est-ed, nhấn in)<br>
                D. 'favourite (âm 1)<br>
                => <strong>Chọn B</strong> (nhấn âm 2), còn lại nhấn âm 1.
            `
        },
        // --- GAP FILL (DIWALI) ---
        {
            id: 11, type: "gapfill", section: "IX. Gap Fill",
            text: `
                <div class='reading-text'>
                    <h3 style="text-align:center; color:#e056fd">HAPPY DIWALI</h3>
                    My name is Sageetha. I live in Mumbai, India. I am very (11) {1} because tomorrow it will be the beginning of the Diwali festival. 
                    Diwali is a Hindu festival. It is usually celebrated (12) {2} October or November. We have been getting ready for Diwali for weeks now.

    let score = 0;
    let totalQuestions = 0;

    // --- RENDER HÀM ---
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        
        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            
            // Header Card
            card.innerHTML = `<div class="question-title">${item.section}</div>`;
            
            // 1. MCQ RENDER
            if (item.type === 'mcq') {
                totalQuestions++;
                card.innerHTML += `<div class="question-text">${index + 1}. ${item.question}</div>`;
                
                let optionsHTML = '<div class="options-grid">';
                item.options.forEach(opt => {
                    optionsHTML += `<button class="option-btn" onclick="checkMCQ(this, '${item.correct}', '${item.id}')">${opt.id}. ${opt.text}</button>`;
                });
                optionsHTML += '</div>';
                
                // Explanation Block
                optionsHTML += `
                    <div class="explanation" id="exp-${item.id}">
                        <div class="exp-header">💡 Ms. Chí Nên giải thích:</div>
                        <div class="exp-content">${item.explanation}</div>
                    </div>
                `;
                
                card.innerHTML += optionsHTML;
            }
            
            // 2. GAP FILL RENDER
            else if (item.type === 'gapfill') {
                // Parse text to replace {n} with Dropdowns
                let processedText = item.text;
                item.subQuestions.forEach(sub => {
                    totalQuestions++;
                    let selectHTML = `<select class="gap-select" id="gap-${sub.qId}" onchange="checkGap(this, '${sub.correct}', 'gap-exp-${sub.qId}')">
                        <option value="">Choose...</option>`;
                    sub.options.forEach(opt => {
                        selectHTML += `<option value="${opt}">${opt}</option>`;
                    });
                    selectHTML += `</select>`;
                    processedText = processedText.replace(`{${sub.qId}}`, selectHTML);
                });

                card.innerHTML += `<div>${processedText}</div>`;
                
                // Explanations container for Gaps
                let expsHTML = `<div style="margin-top:20px;">`;
                item.subQuestions.forEach(sub => {
                    expsHTML += `
                        <div class="explanation" id="gap-exp-${sub.qId}">
                            <div class="exp-header">Câu (${10 + sub.qId}): ${sub.correct.toUpperCase()}</div>
                            <div class="exp-content">${sub.exp}</div>
                        </div>`;
                });
                expsHTML += `</div>`;
                card.innerHTML += expsHTML;
            }

            // 3. READING RENDER
            else if (item.type === 'reading') {
                card.innerHTML += item.passage;
                
                // Task A
                card.innerHTML += `<h4 style="color:var(--primary)">A. Match the words to definitions</h4>`;
                item.taskA.forEach((matchItem, idx) => {
                    totalQuestions++;
                    const uniqueId = `match-${idx}`;
                    let options = `
                        <select class="gap-select" onchange="checkMatch(this, '${matchItem.correct}', '${uniqueId}')">
                            <option value="">Choose...</option>
                            <option value="a">a</option><option value="b">b</option>
                            <option value="c">c</option><option value="d">d</option>
                            <option value="e">e</option><option value="f">f</option>
                        </select>
                    `;
                    card.innerHTML += `
                        <div class="matching-item">
                            <span style="font-weight:bold; width: 120px;">${matchItem.word}</span>
                            <span>${matchItem.def}</span>
                            ${options}
                        </div>
                        <div class="explanation" id="exp-${uniqueId}">
                            <div class="exp-header">Đáp án đúng: ${matchItem.correct.toUpperCase()}</div>
                        </div>
                    `;
                });

                // Task B
                card.innerHTML += `<h4 style="color:var(--primary); margin-top:30px;">B. True or False?</h4>`;
                item.taskB.forEach((tfItem, idx) => {
                    totalQuestions++;
                    const uniqueId = `tf-${idx}`;
                    card.innerHTML += `
                        <div class="tf-item">
                            <span style="flex:1; margin-right:10px;">${tfItem.text}</span>
                            <div class="tf-buttons">
                                <button class="btn-true" onclick="checkTF(this, true, ${tfItem.correct}, '${uniqueId}')">TRUE</button>
                                <button class="btn-false" onclick="checkTF(this, false, ${tfItem.correct}, '${uniqueId}')">FALSE</button>
                            </div>
                        </div>
                        <div class="explanation" id="exp-${uniqueId}">
                            <div class="exp-header">Giải thích:</div>
                            <div class="exp-content">${tfItem.exp}</div>
                        </div>
                    `;
                });
            }

            container.appendChild(card);
        });
    }

    // --- XỬ LÝ SỰ KIỆN ---

    function playSound(isCorrect) {
        const audio = document.getElementById(isCorrect ? 'sound-correct' : 'sound-wrong');
        audio.currentTime = 0;
        audio.play().catch(e => console.log("Audio play failed interaction required"));
    }

    function triggerConfetti() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#8854C0', '#00C9A7', '#ffeb3b']
        });
    }

    // 1. Check MCQ
    window.checkMCQ = function(btn, correctId, qId) {
        // Disable sibling buttons
        const parent = btn.parentElement;
        const buttons = parent.getElementsByClassName('option-btn');
        for(let b of buttons) b.disabled = true;

        const selectedId = btn.innerText.split('.')[0];
        const isCorrect = selectedId === correctId;

        if (isCorrect) {
            btn.classList.add('correct');
            playSound(true);
            triggerConfetti();
            score++;
        } else {
            btn.classList.add('wrong');
            playSound(false);
            // Highlight correct one
            for(let b of buttons) {
                if(b.innerText.split('.')[0] === correctId) b.classList.add('correct');
            }
        }
        
        // Show explanation
        document.getElementById(`exp-${qId}`).style.display = 'block';
    }

    // 2. Check Gap Fill
    window.checkGap = function(select, correctVal, expId) {
        select.disabled = true;
        const val = select.value;
        const isCorrect = val === correctVal;
        
        if (isCorrect) {
            select.style.borderColor = "var(--correct)";
            select.style.background = "#d1fae5";
            playSound(true);
            score++;
        } else {
            select.style.borderColor = "var(--wrong)";
            select.style.background = "#ffe5e5";
            playSound(false);
        }
        document.getElementById(expId).style.display = 'block';
    }

    // 3. Check Matching
    window.checkMatch = function(select, correctVal, expId) {
        select.disabled = true;
        if(select.value === correctVal) {
            select.style.borderColor = "var(--correct)";
            playSound(true);
            score++;
        } else {
            select.style.borderColor = "var(--wrong)";
            playSound(false);
        }
        document.getElementById(`exp-${expId}`).style.display = 'block';
    }

    // 4. Check True/False
    window.checkTF = function(btn, userChoice, correctBool, expId) {
        const parent = btn.parentElement;
        const buttons = parent.getElementsByTagName('button');
        for(let b of buttons) b.disabled = true;

        const isCorrect = userChoice === correctBool;
        
        if (isCorrect) {
            btn.style.transform = "scale(1.1)";
            btn.innerHTML += " ✔";
            playSound(true);
            score++;
        } else {
            btn.style.opacity = "0.5";
            playSound(false);
            // Highlight correct
            const correctBtn = correctBool ? buttons[0] : buttons[1];
            correctBtn.style.boxShadow = "0 0 10px var(--correct)";
            correctBtn.innerHTML += " 👈";
        }
        document.getElementById(`exp-${expId}`).style.display = 'block';
    }

    // --- KẾT THÚC ---
    window.finishTest = function() {
        const modal = document.getElementById('result-modal');
        const scoreTxt = document.getElementById('final-score');
        const msg = document.getElementById('feedback-msg');
        
        scoreTxt.innerText = `${score} / ${totalQuestions}`;
        
        const percentage = (score / totalQuestions) * 100;
        if(percentage === 100) msg.innerText = "Xuất sắc! Ms. Chí Nên rất tự hào về em! 🌟";
        else if(percentage >= 80) msg.innerText = "Giỏi lắm! Cố gắng thêm chút nữa là hoàn hảo! 💪";
        else if(percentage >= 50) msg.innerText = "Khá tốt! Hãy xem lại phần giải thích để hiểu rõ hơn nhé! 📚";
        else msg.innerText = "Đừng buồn! Hãy ôn lại từ vựng và làm lại nhé! ❤️";
        
        modal.style.display = 'flex';
        triggerConfetti();
    }

    window.closeModal = function() {
        document.getElementById('result-modal').style.display = 'none';
    }

    // Init
    renderQuiz();

</script>
</body>
