<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Tiếng Anh Tổng Hợp - Ms. Chí Nên </title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #F0F3F8;
            --card-bg: #FFFFFF;
            --text-color: #2F3542;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d4c3e9 1px, transparent 1px), radial-gradient(#d4c3e9 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Styles */
        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-color), #A29BFE);
            padding: 20px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.3);
            position: relative;
            overflow: hidden;
        }

        .quiz-header h1 {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-header h2 {
            margin: 10px 0 0;
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .progress-container {
            background-color: #dfe6e9;
            border-radius: 15px;
            height: 15px;
            width: 100%;
            margin-top: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            background-color: #FDcb6E;
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 15px;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 30px var(--shadow-color);
            position: relative;
            margin-bottom: 30px;
            border: 2px solid #fff;
        }

        .question-number {
            display: inline-block;
            background: var(--secondary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #2d3436;
        }

        .hint-text {
            font-size: 0.95rem;
            color: #636e72;
            font-style: italic;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hint-text::before {
            content: '💡';
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background-color: white;
            border: 2px solid #dfe6e9;
            border-bottom: 6px solid #dfe6e9;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            position: relative;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #b2bec3;
            border-bottom-color: #b2bec3;
            background-color: #f7f9fc;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-top: 4px;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color);
            border-color: #00B85C;
            border-bottom-color: #008C46;
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            border-color: #FF2E43;
            border-bottom-color: #D61B2E;
            color: white;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Area */
        .explanation-box {
            margin-top: 25px;
            background-color: #eefbf5;
            border: 2px solid #c3e6cb;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideIn 0.4s ease-out;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: #155724;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px dashed #c3e6cb;
            padding-bottom: 10px;
        }

        .explanation-avatar {
            width: 40px;
            height: 40px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border: 2px solid #155724;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2f3542;
            white-space: pre-wrap; /* Preserve line breaks */
        }
        
        .explanation-content strong {
            color: var(--primary-color);
        }

        /* Navigation */
        .nav-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-bottom: 5px solid #6c429c;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            display: none; /* Hidden until answered */
        }

        .next-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .next-btn:active {
            transform: translateY(4px);
            border-bottom-width: 1px;
        }

        /* Animations */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Result Modal */
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .result-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--correct-color) 0%, #dfe6e9 0%);
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-color);
            position: relative;
        }

        .score-circle::before {
            content: '';
            position: absolute;
            width: 130px;
            height: 130px;
            background: white;
            border-radius: 50%;
        }
        
        .score-text {
            position: relative;
            z-index: 1;
        }

        .praise-text {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .restart-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-bottom: 5px solid #009e83;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="quiz-header">
            <h2>Giáo viên: Ms. Chí Nên ()</h2>
            <h1>Ôn Tập Tổng Hợp: Word Form - Error Correction - Writing</h1>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div style="margin-top: 10px; font-size: 0.9rem;">
                Câu <span id="currentQuestionNum">1</span> / <span id="totalQuestions">0</span>
            </div>
        </div>

        <!-- Question Card -->
        <div class="question-card" id="quizContainer">
            <div class="question-number">Question <span id="qNumDisplay">1</span></div>
            <div class="question-text" id="questionText">
                Loading...
            </div>
            <div class="hint-text" id="hintText">
                <!-- Hint goes here -->
            </div>

            <!-- Options -->
            <div class="options-grid" id="optionsGrid">
                <!-- Buttons generated by JS -->
            </div>

            <!-- Explanation -->
            <div class="explanation-box" id="explanationBox">
                <div class="explanation-header">
                    <div class="explanation-avatar">👩‍🏫</div>
                    <div>Ms. Chí Nên giải thích chi tiết:</div>
                </div>
                <div class="explanation-content" id="explanationContent">
                    <!-- Explanation content goes here -->
                </div>
            </div>

            <!-- Navigation -->
            <div class="nav-buttons">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Câu Tiếp Theo ➜</button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <h2 style="color: var(--text-color);">Kết Quả Của Bạn</h2>
            <div class="score-circle" id="scoreCircle">
                <span class="score-text" id="finalScore">0/0</span>
            </div>
            <div class="praise-text" id="praiseText">Xuất sắc!</div>
            <button class="restart-btn" onclick="location.reload()">Làm Lại Bài</button>
        </div>
    </div>

    <script>
        // DATA TỪ BÀI QUIZ GỐC (Được nhúng trực tiếp để đảm bảo Single File)
        const quizData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "VI. _______ from all around the world display their ice artwork at Snow & Ice Festival. (art)",
              "answerOptions": [
                { "text": "Artists", "rationale": "1. Phân tích từ vựng:\n- Artists (n - số nhiều): Các nghệ sĩ.\n- Art (n): Nghệ thuật.\n- Artistic (adj): Thuộc về nghệ thuật.\n- Artistically (adv): Một cách nghệ thuật.\n2. Dịch nghĩa: \"Các nghệ sĩ từ khắp nơi trên thế giới trưng bày các tác phẩm băng nghệ thuật của họ tại Lễ hội Băng tuyết.\"\n3. Giải thích: Chỗ trống đứng đầu câu làm chủ ngữ cho động từ \"display\" (trưng bày). Cần danh từ chỉ người thực hiện hành động này. Dùng số nhiều vì \"display\" không chia số ít.", "isCorrect": true },
                { "text": "Art", "rationale": "...", "isCorrect": false },
                { "text": "Artistic", "rationale": "...", "isCorrect": false },
                { "text": "Artistically", "rationale": "...", "isCorrect": false }
              ],
              "hint": "Cần một danh từ chỉ người (số nhiều) để làm chủ ngữ."
            },
            {
              "questionNumber": 2,
              "question": "He has such an _______ lifestyle - smoking, drinking, eating too much. (health)",
              "answerOptions": [
                { "text": "healthy", "rationale": "...", "isCorrect": false },
                { "text": "unhealthy", "rationale": "1. Phân tích từ vựng:\n- healthy (adj): lành mạnh.\n- unhealthy (adj): không lành mạnh.\n- healthily (adv): một cách lành mạnh.\n- health (n): sức khỏe.\n2. Dịch nghĩa: \"Anh ấy có một lối sống không lành mạnh - hút thuốc, uống rượu, ăn quá nhiều.\"\n3. Giải thích: Cần tính từ bổ nghĩa cho \"lifestyle\". Dựa vào ngữ cảnh tiêu cực phía sau -> dùng \"unhealthy\".", "isCorrect": true },
                { "text": "healthily", "rationale": "...", "isCorrect": false },
                { "text": "health", "rationale": "...", "isCorrect": false }
              ],
              "hint": "Hút thuốc và uống rượu là thói quen tốt hay xấu?"
            },
            {
              "questionNumber": 3,
              "question": "The films provide great _______ value for kids. (entertain)",
              "answerOptions": [
                { "text": "entertaining", "rationale": "...", "isCorrect": false },
                { "text": "entertainment", "rationale": "1. Phân tích từ vựng:\n- entertaining (adj): có tính giải trí.\n- entertainment (n): sự giải trí.\n- entertainer (n): người làm giải trí.\n- entertains (v): giải trí.\n2. Dịch nghĩa: \"Các bộ phim mang lại giá trị giải trí tuyệt vời cho trẻ em.\"\n3. Giải thích: Ta cần một danh từ để tạo thành danh từ ghép với \"value\". Cụm \"entertainment value\" rất phổ biến.", "isCorrect": true },
                { "text": "entertainer", "rationale": "...", "isCorrect": false },
                { "text": "entertains", "rationale": "...", "isCorrect": false }
              ],
              "hint": "Cụm danh từ ghép: _______ value."
            },
            {
              "questionNumber": 4,
              "question": "You should always look _______ when you cross the street. (careful)",
              "answerOptions": [
                { "text": "carefully", "rationale": "1. Phân tích từ vựng:\n- carefully (adv): một cách cẩn thận.\n- careful (adj): cẩn thận.\n- careless (adj): bất cẩn.\n- carelessly (adv): một cách bất cẩn.\n2. Dịch nghĩa: \"Bạn nên luôn quan sát cẩn thận khi băng qua đường.\"\n3. Giải thích: Động từ \"look\" ở đây mang nghĩa hành động (quan sát/nhìn), không phải linking verb (trông có vẻ). Do đó cần Trạng từ (Adv) để bổ nghĩa.", "isCorrect": true },
                { "text": "careful", "rationale": "...", "isCorrect": false },
                { "text": "careless", "rationale": "...", "isCorrect": false },
                { "text": "carelessly", "rationale": "...", "isCorrect": false }
              ],
              "hint": "Động từ 'look' (quan sát) cần một trạng từ đi kèm."
            },
            {
              "questionNumber": 5,
              "question": "It's important to obey traffic rules when you are a road _______. (use)",
              "answerOptions": [
                { "text": "user", "rationale": "1. Phân tích từ vựng:\n- user (n): người dùng.\n- users (n - số nhiều): những người dùng.\n- useful (adj): hữu ích.\n- useless (adj): vô dụng.\n2. Dịch nghĩa: \"Việc tuân thủ luật giao thông là quan trọng khi bạn là một người tham gia giao thông.\"\n3. Giải thích: Có mạo từ \"a\" phía trước -> Cần danh từ số ít chỉ người.", "isCorrect": true },
                { "text": "users", "rationale": "...", "isCorrect": false },
                { "text": "useful", "rationale": "...", "isCorrect": false },
                { "text": "useless", "rationale": "...", "isCorrect": false }
              ],
              "hint": "Cụm từ 'road user' nghĩa là người tham gia giao thông. Chú ý mạo từ 'a'."
            },
            {
              "questionNumber": 6,
              "question": "Is it _______ to drive through a red traffic light? (legal)",
              "answerOptions": [
                { "text": "illegal", "rationale": "1. Phân tích từ vựng:\n- illegal (adj): bất hợp pháp/phạm luật.\n- legal (adj): hợp pháp.\n- legally (adv): một cách hợp pháp.\n- legality (n): tính hợp pháp.\n2. Dịch nghĩa: \"Vượt đèn đỏ có phải là phạm luật không?\"\n3. Giải thích: Vượt đèn đỏ là hành vi sai trái, nên cần tính từ mang nghĩa phủ định \"illegal\". Cấu trúc: Is it + adj + to V?", "isCorrect": true },
                { "text": "legal", "rationale": "...", "isCorrect": false },
                { "text": "legally", "rationale": "...", "isCorrect": false },
                { "text": "legality", "rationale": "...", "isCorrect": false }
              ],
              "hint": "Vượt đèn đỏ là đúng luật hay trái luật? Cần thêm tiền tố phủ định 'il-'."
            },
            {
              "questionNumber": 7,
              "question": "Annette's _______ as Eliza Doolittle in \"Pygmalion\" was truly memorable. (perform)",
              "answerOptions": [
                { "text": "performance", "rationale": "1. Phân tích từ vựng:\n- performance (n): màn trình diễn/diễn xuất.\n- performer (n): người biểu diễn.\n- performing (v-ing): đang biểu diễn.\n- performed (v-ed): đã biểu diễn.\n2. Dịch nghĩa: \"Màn trình diễn của Annette trong vai Eliza Doolittle vở 'Pygmalion' thực sự đáng nhớ.\"\n3. Giải thích: Sau sở hữu cách \"Annette's\" cần một danh từ. Ngữ cảnh khen ngợi diễn xuất -> performance.", "isCorrect": true },
                { "text": "performer", "rationale": "...", "isCorrect": false },
                { "text": "performing", "rationale": "...", "isCorrect": false },
                { "text": "performed", "rationale": "...", "isCorrect": false }
              ],
              "hint": "Cần danh từ chỉ 'màn trình diễn' sau sở hữu cách."
            },
            {
              "questionNumber": 8,
              "question": "People flew down streets to join in _______ activities on New Year's Eve. (celebrate)",
              "answerOptions": [
                { "text": "celebratory", "rationale": "1. Phân tích từ vựng:\n- celebratory (adj): mang tính ăn mừng/chúc mừng.\n- celebration (n): sự ăn mừng.\n- celebrity (n): người nổi tiếng.\n- celebrated (adj): nổi tiếng/được ca tụng.\n2. Dịch nghĩa: \"Mọi người đổ ra đường để tham gia các hoạt động chào mừng vào đêm Giao thừa.\"\n3. Giải thích: Cần tính từ bổ nghĩa cho danh từ \"activities\". \"Celebratory activities\" = các hoạt động mang tính ăn mừng.", "isCorrect": true },
                { "text": "celebration", "rationale": "...", "isCorrect": false },
                { "text": "celebrity", "rationale": "...", "isCorrect": false },
                { "text": "celebrated", "rationale": "...", "isCorrect": false }
              ],
              "hint": "Cần một tính từ bổ nghĩa cho 'activities'."
            },
            {
              "questionNumber": 9,
              "question": "VII. Find the mistake: \"The bands parade through the streets, play traditional samba music.\"",
              "answerOptions": [
                { "text": "play -> playing", "rationale": "1. Phân tích lỗi:\n- Lỗi nằm ở động từ \"play\".\n- Câu có động từ chính là \"parade\". Phần sau dấu phẩy là mệnh đề quan hệ rút gọn hoặc cụm phân từ chỉ hành động diễn ra song song.\n2. Dịch nghĩa: \"Các ban nhạc diễu hành qua các con phố, chơi nhạc samba truyền thống.\"\n3. Giải thích: Phải dùng V-ing (playing) để chỉ hành động chủ động đi kèm.", "isCorrect": true },
                { "text": "parade -> parading", "rationale": "...", "isCorrect": false },
                { "text": "through -> on", "rationale": "...", "isCorrect": false },
                { "text": "traditional -> tradition", "rationale": "...", "isCorrect": false }
              ],
              "hint": "Hai hành động diễn ra cùng lúc, hành động thứ hai sau dấu phẩy phải dùng V-ing."
            },
            {
              "questionNumber": 10,
              "question": "VII. Find the mistake: \"Traffic jams happen nearly every day, but drivers have to spend a lot of time on the road.\"",
              "answerOptions": [

              ],
              "hint": "Người bị làm cho sợ hãi -> Dùng tính từ đuôi -ed."
            }
          ]
        };

        // --- GAME LOGIC ---
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // Elements
        const totalQuestionsSpan = document.getElementById('totalQuestions');
        const currentQuestionNumSpan = document.getElementById('currentQuestionNum');
        const progressBar = document.getElementById('progressBar');
        const questionText = document.getElementById('questionText');
        const hintText = document.getElementById('hintText');
        const qNumDisplay = document.getElementById('qNumDisplay');
        const optionsGrid = document.getElementById('optionsGrid');
        const explanationBox = document.getElementById('explanationBox');
        const explanationContent = document.getElementById('explanationContent');
        const nextBtn = document.getElementById('nextBtn');
        const resultModal = document.getElementById('resultModal');
        const finalScore = document.getElementById('finalScore');
        const scoreCircle = document.getElementById('scoreCircle');
        const praiseText = document.getElementById('praiseText');

        // Initialize
        totalQuestionsSpan.textContent = quizData.questions.length;

        function loadQuestion() {
            const currentQ = quizData.questions[currentQuestionIndex];
            
            // Reset state
            answered = false;
            explanationBox.style.display = 'none';
            nextBtn.style.display = 'none';
            optionsGrid.innerHTML = '';
            
            // Render text
            currentQuestionNumSpan.textContent = currentQuestionIndex + 1;
            qNumDisplay.textContent = currentQ.questionNumber;
            questionText.textContent = currentQ.question;
            hintText.innerHTML = currentQ.hint ? `Tip: ${currentQ.hint}` : '';
            
            // Update Progress
            const progress = ((currentQuestionIndex) / quizData.questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Render Options
            currentQ.answerOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${String.fromCharCode(65 + idx)}. ${opt.text}`;
                btn.onclick = () => checkAnswer(idx);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            if (answered) return;
            answered = true;

            const currentQ = quizData.questions[currentQuestionIndex];
            const options = document.querySelectorAll('.option-btn');
            
            // Correct answer index
            const correctIndex = currentQ.answerOptions.findIndex(o => o.isCorrect);

            if (selectedIndex === correctIndex) {
                // Correct
                score++;
                options[selectedIndex].classList.add('correct');
                playAudio('correct');
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                // Wrong
                options[selectedIndex].classList.add('wrong');
                options[correctIndex].classList.add('correct'); // Show correct one
                playAudio('wrong');
            }

            // Disable all buttons
            options.forEach(btn => btn.disabled = true);

            // Show Explanation
            let rationale = currentQ.answerOptions[correctIndex].rationale || "Đang cập nhật giải thích...";
            // Simple formatting for cleaner text if needed, or rely on pre-wrap
            if (rationale === "...") {
                rationale = "Đáp án sai không có giải thích chi tiết trong dữ liệu nguồn. Hãy xem giải thích của đáp án đúng.";
                // Try to find the detailed one if current selected was wrong but had explanation
                const detailedOpt = currentQ.answerOptions.find(o => o.rationale && o.rationale.length > 20);
                if (detailedOpt) rationale = detailedOpt.rationale;
            }
            
            explanationContent.innerHTML = rationale.replace(/\n/g, '<br>').replace(/- /g, '• ');
            explanationBox.style.display = 'block';

            // Show Next Button
            nextBtn.style.display = 'inline-block';
            
            // If last question, change text
            if (currentQuestionIndex === quizData.questions.length - 1) {
                nextBtn.textContent = "Xem Kết Quả 🏆";
            } else {
                nextBtn.textContent = "Câu Tiếp Theo ➜";
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            const percentage = Math.round((score / quizData.questions.length) * 100);
            
            finalScore.textContent = `${score}/${quizData.questions.length}`;
            scoreCircle.style.background = `conic-gradient(#00D26A ${percentage}%, #dfe6e9 0%)`;
            
            let message = "";
            if (percentage === 100) message = "Tuyệt đỉnh! Con là thiên tài! 🌟";
            else if (percentage >= 80) message = "Làm tốt lắm! Cô rất tự hào! 🎉";
            else if (percentage >= 50) message = "Cố gắng thêm chút nữa nhé! 💪";
            else message = "Lần sau sẽ tốt hơn thôi! Cố lên! 🌱";
            
            praiseText.textContent = message;
            resultModal.style.display = 'flex';
            
            // Audio for result
            if (percentage >= 50) playAudio('correct');
        }

        // Web Audio API for simple sounds without external files
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playAudio(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // High Ding
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else {
                // Low Buzz
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Start
        loadQuestion();

    </script>
</body>
</html>
