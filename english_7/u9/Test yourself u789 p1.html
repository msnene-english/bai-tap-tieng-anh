<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Tiếng Anh Tổng Hợp - Ms. Chí Nên </title>
    <!-- Nhúng Font chữ dễ thương -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Thư viện Confetti (Pháo giấy) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #8854C0; /* Tím mộng mơ */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --accent-color: #FF9F43; /* Cam nhạt */
            --correct-color: #00D26A; /* Xanh lá chuẩn */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #f0f3f8;
            --text-color: #2f3542;
            --card-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E0C3FC;
            background-image: radial-gradient(#8854C0 1.5px, transparent 1.5px), radial-gradient(#8854C0 1.5px, #E0C3FC 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* HEADER STYLE */
        header {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            border: 4px solid var(--primary-color);
        }

        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            margin: 5px 0 0;
            font-size: 1.1rem;
            color: #747d8c;
            font-weight: 700;
        }

        .badge {
            background: var(--accent-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 4px 0 #E67E22;
        }

        /* QUESTION CARD STYLE */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px var(--shadow-color);
            position: relative;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
        }

        .question-number {
            background: var(--secondary-color);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            position: absolute;
            top: -20px;
            left: -10px;
            box-shadow: 0 4px 0 #009688;
            z-index: 10;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 25px;
            margin-left: 20px;
            line-height: 1.5;
        }

        .question-text u {
            text-decoration: none;
            border-bottom: 3px dashed var(--primary-color);
            padding-bottom: 2px;
        }

        /* ANSWERS GRID */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .answers-grid {
                grid-template-columns: 1fr;
            }
            .question-text {
                font-size: 1.2rem;
                margin-left: 0;
                margin-top: 15px;
            }
        }

        .answer-btn {
            background: white;
            border: 2px solid #dfe4ea;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #57606f;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 5px 0 #ced6e0;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 7px 0 #ced6e0;
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #ced6e0;
        }

        /* CORRECT / WRONG STYLES */
        .answer-btn.correct {
            background-color: var(--correct-color);
            border-color: var(--correct-color);
            color: white;
            box-shadow: 0 5px 0 #00B85C;
        }

        .answer-btn.wrong {
            background-color: var(--wrong-color);
            border-color: var(--wrong-color);
            color: white;
            box-shadow: 0 5px 0 #E04050;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .answer-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        .answer-btn:disabled:not(.correct):not(.wrong) {
            background: #f1f2f6;
            box-shadow: none;
            border: 2px solid #f1f2f6;
            transform: translateY(5px);
        }

        /* EXPLANATION BOX */
        .explanation-box {
            margin-top: 25px;
            background: #FFF4E6; /* Màu kem nhạt */
            border: 2px solid #FFEAA7;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.5s ease-out;
            position: relative;
        }

        .explanation-box::before {
            content: '💡 Ms. Chí Nên giải thích:';
            display: block;
            font-weight: 800;
            color: #E67E22;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 2px dashed #ffce9e;
            padding-bottom: 5px;
        }

        .explanation-content {
            font-size: 1rem;
            color: #2d3436;
            line-height: 1.6;
            white-space: pre-line; /* Giữ xuống dòng từ dữ liệu */
        }
        
        .explanation-content strong {
            color: var(--primary-color);
        }

        /* ANIMATIONS */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SCORE & FLOATING BUTTON */
        .floating-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            font-size: 1.2rem;
            padding: 12px 40px;
            border: none;
            border-radius: 30px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #6c4299;
            transition: all 0.3s;
            font-family: 'Quicksand', sans-serif;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            background: #9b59b6;
        }

        .submit-btn:active {
            transform: scale(0.95) translateY(5px);
            box-shadow: 0 0 0 transparent;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            transform: scale(0.7);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--secondary-color);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .score-circle {
            width: 150px;
            height: 150px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 0 auto 20px;
            border: 8px solid #E0C3FC;
        }

        .modal-msg {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .close-btn {
            background: #ff7675;
            color: white;
            padding: 10px 30px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #d63031;
        }
        
        .close-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

    </style>
</head>
<body>

    <header>
        <h1>Ms. Chí Nên </h1>
        <p>Ôn tập Tiếng Anh Tổng Hợp: Từ vựng & Ngữ pháp</p>
        <div class="badge">Lớp luyện thi siêu cấp</div>
    </header>

    <div class="container" id="quiz-container">
        <!-- Questions will be rendered here by JS -->
    </div>

    <div class="floating-footer">
        <button class="submit-btn" onclick="finishQuiz()">✨ Nộp Bài & Xem Điểm ✨</button>
    </div>

    <!-- Modal Score -->
    <div class="modal-overlay" id="score-modal">
        <div class="modal-content">
            <div class="score-circle" id="final-score">0/0</div>
            <div class="modal-msg" id="final-msg">Bạn làm rất tốt!</div>
            <button class="close-btn" onclick="closeModal()">Làm lại bài này nha!</button>
        </div>
    </div>

<script>
    // ================= DỮ LIỆU ĐỀ BÀI (TỪ FILE GỐC CỦA BẠN) =================
    const quizData = {
      "questions": [
        {
          "questionNumber": 1,
          "question": "When you see a \"_______\" sign, you must slow down and watch for children.",
          "answerOptions": [
            { "text": "school ahead", "isCorrect": true },
            { "text": "traffic jam", "isCorrect": false },
            { "text": "no cycling", "isCorrect": false },
            { "text": "seasonal festival", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- school ahead (n phrase): trường học phía trước.\n- traffic jam (n phrase): tắc đường.\n- no cycling (n phrase): cấm xe đạp.\n- seasonal festival (n phrase): lễ hội theo mùa.\n2. Dịch nghĩa: \"Khi bạn thấy biển báo 'trường học phía trước', bạn phải giảm tốc độ và chú ý trẻ em.\"\n3. Giải thích: Cụm từ \"slow down and watch for children\" (giảm tốc và coi chừng trẻ em) là dấu hiệu nhận biết khu vực có trường học."
        },
        {
          "questionNumber": 2,
          "question": "I enjoy watching _______ films about aliens from space.",
          "answerOptions": [
            { "text": "special effects", "isCorrect": false },
            { "text": "science fiction", "isCorrect": true },
            { "text": "traditional costume", "isCorrect": false },
            { "text": "school ahead", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- special effects (n phrase): kỹ xảo điện ảnh.\n- science fiction (n phrase): khoa học viễn tưởng.\n- traditional costume (n phrase): trang phục truyền thống.\n- school ahead (n phrase): trường học phía trước.\n2. Dịch nghĩa: \"Tôi thích xem phim khoa học viễn tưởng về người ngoài hành tinh đến từ không gian.\"\n3. Giải thích: Từ khóa \"aliens from space\" (người ngoài hành tinh) là đặc trưng của thể loại phim \"science fiction\"."
        },
        {
          "questionNumber": 3,
          "question": "The dancers in the festival wore _______.",
          "answerOptions": [
            { "text": "seasonal festival", "isCorrect": false },
            { "text": "traditional costume", "isCorrect": true },
            { "text": "special effects", "isCorrect": false },
            { "text": "negative reviews", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- seasonal festival (n phrase): lễ hội theo mùa.\n- traditional costume (n phrase): trang phục truyền thống.\n- special effects (n phrase): kỹ xảo điện ảnh.\n- negative reviews (n phrase): đánh giá tiêu cực.\n2. Dịch nghĩa: \"Các vũ công trong lễ hội đã mặc trang phục truyền thống.\"\n3. Giải thích: Động từ \"wore\" (mặc) đi với danh từ chỉ quần áo/trang phục. \"Traditional costume\" là phù hợp nhất cho các vũ công."
        },
        {
          "questionNumber": 4,
          "question": "Look! There is a \"_______\" sign. You can't ride your bike here.",
          "answerOptions": [
            { "text": "school ahead", "isCorrect": false },
            { "text": "no cycling", "isCorrect": true },
            { "text": "traffic jam", "isCorrect": false },
            { "text": "zebra crossing", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- school ahead (n phrase): trường học phía trước.\n- no cycling (n phrase): cấm xe đạp.\n- traffic jam (n phrase): tắc đường.\n- zebra crossing (n phrase): vạch qua đường.\n2. Dịch nghĩa: \"Nhìn kìa! Có biển báo 'cấm xe đạp'. Bạn không được đi xe đạp ở đây.\"\n3. Giải thích: Câu sau giải thích \"You can't ride your bike here\" (Bạn không thể đi xe đạp ở đây) -> Đồng nghĩa với biển báo \"No cycling\"."
        },
        {
          "questionNumber": 5,
          "question": "The film got _______ from critics due to its underperformance.",
          "answerOptions": [
            { "text": "special effects", "isCorrect": false },
            { "text": "negative reviews", "isCorrect": true },
            { "text": "science fiction", "isCorrect": false },
            { "text": "traditional costume", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- special effects (n phrase): kỹ xảo điện ảnh.\n- negative reviews (n phrase): đánh giá tiêu cực.\n- science fiction (n phrase): khoa học viễn tưởng.\n- traditional costume (n phrase): trang phục truyền thống.\n2. Dịch nghĩa: \"Bộ phim đã nhận những đánh giá tiêu cực từ các nhà phê bình do sự thể hiện kém cỏi của nó.\"\n3. Giải thích: Từ khóa \"underperformance\" (thể hiện kém/dưới mức kỳ vọng) dẫn đến kết quả là nhận \"negative reviews\" (lời chê)."
        },
        {
          "questionNumber": 6,
          "question": "We were stuck in a _______ for over two hours yesterday afternoon.",
          "answerOptions": [
            { "text": "school ahead", "isCorrect": false },
            { "text": "traffic jam", "isCorrect": true },
            { "text": "seasonal festival", "isCorrect": false },
            { "text": "zebra crossing", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- school ahead (n phrase): trường học phía trước.\n- traffic jam (n phrase): tắc đường.\n- seasonal festival (n phrase): lễ hội theo mùa.\n- zebra crossing (n phrase): vạch qua đường.\n2. Dịch nghĩa: \"Chúng tôi bị kẹt trong một vụ tắc đường hơn hai tiếng đồng hồ chiều hôm qua.\"\n3. Giải thích: Cụm từ \"stuck in a...\" (bị kẹt trong...) thường đi đôi với \"traffic jam\" (tắc đường)."
        },
        {
          "questionNumber": 7,
          "question": "They use computers to create all the _______ these days.",
          "answerOptions": [
            { "text": "special effects", "isCorrect": true },
            { "text": "science fiction", "isCorrect": false },
            { "text": "negative reviews", "isCorrect": false },
            { "text": "traffic jam", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- special effects (n phrase): kỹ xảo điện ảnh.\n- science fiction (n phrase): khoa học viễn tưởng.\n- negative reviews (n phrase): đánh giá tiêu cực.\n- traffic jam (n phrase): tắc đường.\n2. Dịch nghĩa: \"Ngày nay họ dùng máy tính để tạo ra tất cả các kỹ xảo điện ảnh.\"\n3. Giải thích: Máy tính (Computers) là công cụ chính để tạo ra CGI/Visual effects (kỹ xảo)."
        },
        {
          "questionNumber": 8,
          "question": "La Tomatina is a _______ to celebrate the tomato harvest.",
          "answerOptions": [
            { "text": "seasonal festival", "isCorrect": true },
            { "text": "traditional costume", "isCorrect": false },
            { "text": "traffic jam", "isCorrect": false },
            { "text": "science fiction", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- seasonal festival (n phrase): lễ hội theo mùa.\n- traditional costume (n phrase): trang phục truyền thống.\n- traffic jam (n phrase): tắc đường.\n- science fiction (n phrase): khoa học viễn tưởng.\n2. Dịch nghĩa: \"La Tomatina là một lễ hội theo mùa để ăn mừng vụ thu hoạch cà chua.\"\n3. Giải thích: La Tomatina là tên riêng của một lễ hội nổi tiếng. \"Celebrate\" (ăn mừng) và \"harvest\" (mùa vụ) gợi ý đến Festival."
        },
        {
          "questionNumber": 9,
          "question": "_______ New Year's Eve, many people go to Times Square to watch the ball drop.",
          "answerOptions": [
            { "text": "At", "isCorrect": false },
            { "text": "On", "isCorrect": true },
            { "text": "In", "isCorrect": false },
            { "text": "By", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- At (prep): tại, vào lúc (dùng cho giờ giấc, địa điểm nhỏ).\n- On (prep): vào (dùng cho ngày cụ thể, ngày lễ).\n- In (prep): trong (dùng cho tháng, năm, mùa).\n- By (prep): bởi, trước.\n2. Dịch nghĩa: \"Vào đêm Giao thừa, nhiều người đến Quảng trường Thời đại để xem quả cầu rơi.\"\n3. Giải thích: Quy tắc giới từ chỉ thời gian: Dùng \"On\" trước các ngày cụ thể hoặc các ngày lễ có chứa chữ \"Day\" hoặc \"Eve\" (On Christmas Day, On New Year's Eve)."
        },
        {
          "questionNumber": 10,
          "question": "As far as I know, this film is _______ a true story of Oskar Schindler.",
          "answerOptions": [
            { "text": "set in", "isCorrect": false },
            { "text": "based on", "isCorrect": true },
            { "text": "gathered", "isCorrect": false },
            { "text": "taken on", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- set in (phrasal verb): lấy bối cảnh tại (thời gian/địa điểm).\n- based on (phrasal verb): dựa trên.\n- gathered (verb): tụ tập.\n- taken on (phrasal verb): đảm nhận.\n2. Dịch nghĩa: \"Theo tôi biết thì bộ phim này được dựa trên một câu chuyện có thật về Oskar Schindler.\"\n3. Giải thích: Cụm từ cố định \"based on a true story\" (dựa trên một câu chuyện có thật)."
        },
        {
          "questionNumber": 11,
          "question": "You should walk across the street at the _______.",
          "answerOptions": [
            { "text": "road sign", "isCorrect": false },
            { "text": "traffic lights", "isCorrect": false },
            { "text": "parking area", "isCorrect": false },
            { "text": "zebra crossing", "isCorrect": true }
          ],
          "rationale": "1. Phân tích từ vựng:\n- road sign (n): biển báo đường bộ.\n- traffic lights (n): đèn giao thông.\n- parking area (n): bãi đỗ xe.\n- zebra crossing (n): vạch kẻ đường cho người đi bộ.\n2. Dịch nghĩa: \"Bạn nên băng qua đường tại vạch kẻ đường cho người đi bộ.\"\n3. Giải thích: \"Zebra crossing\" là nơi quy định để người đi bộ sang đường."
        },
        {
          "questionNumber": 12,
          "question": "Thousands of people _______ for an annual cheese-chasing competition on Cooper's Hill.",
          "answerOptions": [
            { "text": "gathered", "isCorrect": true },
            { "text": "watched", "isCorrect": false },
            { "text": "participated", "isCorrect": false },
            { "text": "appeared", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- gathered (v): tụ tập, tập trung.\n- watched (v): xem.\n- participated (v): tham gia (thường đi với 'in').\n- appeared (v): xuất hiện.\n2. Dịch nghĩa: \"Hàng ngàn người đã tụ tập cho cuộc thi lăn pho mát hàng năm trên đồi Cooper.\"\n3. Giải thích: \"Gathered for\" (tụ tập cho sự kiện gì)."
        },
        {
          "questionNumber": 13,
          "question": "Paris is becoming a livable city _______ there are many bike-only and pedestrian-only streets.",
          "answerOptions": [
            { "text": "although", "isCorrect": false },
            { "text": "because", "isCorrect": true },
            { "text": "however", "isCorrect": false },
            { "text": "whereas", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- although (conj): mặc dù (chỉ sự tương phản).\n- because (conj): bởi vì (chỉ nguyên nhân).\n- however (adv): tuy nhiên (thường đứng đầu câu hoặc sau dấu chấm phẩy).\n- whereas (conj): trong khi (chỉ sự đối lập).\n2. Dịch nghĩa: \"Paris đang trở thành một thành phố đáng sống bởi vì có nhiều đường dành riêng cho xe đạp và người đi bộ.\"\n3. Giải thích: Việc có nhiều đường cho người đi bộ là NGUYÊN NHÂN làm thành phố đáng sống -> Dùng \"because\"."
        },
        {
          "questionNumber": 14,
          "question": "Although the film was _______, Jack fell asleep in the middle.",
          "answerOptions": [
            { "text": "violent", "isCorrect": false },
            { "text": "boring", "isCorrect": false },
            { "text": "gripping", "isCorrect": true },
            { "text": "frightening", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- violent (adj): bạo lực.\n- boring (adj): nhàm chán.\n- gripping (adj): lôi cuốn, hấp dẫn.\n- frightening (adj): đáng sợ.\n2. Dịch nghĩa: \"Mặc dù bộ phim rất lôi cuốn, Jack lại ngủ gật giữa chừng.\"\n3. Giải thích: Cấu trúc \"Although\" chỉ sự tương phản. Phim hay/hấp dẫn (gripping) >< nhưng lại ngủ (fell asleep)."
        },
        {
          "questionNumber": 15,
          "question": "The Samba Parade is a _______ for all who have journeyed to Rio for Carnival.",
          "answerOptions": [
            { "text": "must-see", "isCorrect": true },
            { "text": "sight", "isCorrect": false },
            { "text": "scene", "isCorrect": false },
            { "text": "visual", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- must-see (n): điều nhất định phải xem.\n- sight (n): cảnh tượng, thị lực.\n- scene (n): cảnh (trong phim), hiện trường.\n- visual (n/adj): hình ảnh trực quan.\n2. Dịch nghĩa: \"Cuộc diễu hành Samba là một điều nhất định phải xem đối với tất cả những ai đã đến Rio dự lễ hội Carnival.\"\n3. Giải thích: \"A must-see\" là danh từ ghép thông dụng chỉ một địa điểm/sự kiện không thể bỏ lỡ."
        },
        {
          "questionNumber": 16,
          "question": "_______, we all enjoyed the hard rock Louder Than Life festival.",
          "answerOptions": [
            { "text": "After raining heavily", "isCorrect": false },
            { "text": "When it rains heavily", "isCorrect": false },
            { "text": "Due to heavy rain", "isCorrect": false },
            { "text": "Although it rained heavily", "isCorrect": true }
          ],
          "rationale": "1. Phân tích từ vựng:\n- After raining heavily: Sau khi mưa to.\n- When it rains heavily: Khi trời mưa to.\n- Due to heavy rain: Do mưa to.\n- Although it rained heavily: Mặc dù trời mưa to.\n2. Dịch nghĩa: \"Mặc dù trời mưa to, tất cả chúng tôi đều thích thú với lễ hội nhạc rock Louder Than Life.\"\n3. Giải thích: Dùng \"Although\" + mệnh đề (S + V) để chỉ sự nhượng bộ/tương phản (Mưa to >< Vẫn vui). Thì quá khứ (rained) phù hợp với \"enjoyed\"."
        },
        {
          "questionNumber": 17,
          "question": "According to traffic laws, we all _______ wear a helmet when riding on a motorcycle.",
          "answerOptions": [
            { "text": "mustn't", "isCorrect": false },
            { "text": "must", "isCorrect": true },
            { "text": "should", "isCorrect": false },
            { "text": "shouldn't", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- must (modal verb): phải (bắt buộc).\n- mustn't (modal verb): cấm/không được phép.\n- should (modal verb): nên.\n- shouldn't (modal verb): không nên.\n2. Dịch nghĩa: \"Theo luật giao thông, tất cả chúng ta phải đội mũ bảo hiểm khi đi xe máy.\"\n3. Giải thích: Khi nói về luật lệ (traffic laws), dùng \"must\" để chỉ sự bắt buộc."
        },
        {
          "questionNumber": 18,
          "question": "'Would you like to go to the cinema this weekend?' '_______'",
          "answerOptions": [
            { "text": "I don't care.", "isCorrect": false },
            { "text": "OK. You did it!", "isCorrect": false },
            { "text": "Great! I can't wait.", "isCorrect": true },
            { "text": "Sorry! I don't like.", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- I don't care: Tôi không quan tâm.\n- OK. You did it!: Được rồi. Bạn làm được rồi!.\n- Great! I can't wait.: Tuyệt! Tôi không thể chờ được nữa.\n- Sorry! I don't like.: Xin lỗi! Tôi không thích.\n2. Dịch nghĩa: \"'Bạn có muốn đi xem phim cuối tuần này không?' - 'Tuyệt! Tôi nóng lòng quá.'\"\n3. Giải thích: Đây là cách đáp lại lời mời nhiệt tình và lịch sự nhất."
        },
        {
          "questionNumber": 19,
          "question": "Come out for a drink. ~ No, I _______ (miss) the film on TV if I do.",
          "answerOptions": [
            { "text": "will miss", "isCorrect": true },
            { "text": "miss", "isCorrect": false },
            { "text": "missed", "isCorrect": false },
            { "text": "would miss", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- will miss (Tương lai đơn).\n- miss (Hiện tại đơn).\n- missed (Quá khứ đơn).\n- would miss (Câu điều kiện loại 2).\n2. Dịch nghĩa: \"Ra ngoài uống nước đi. ~ Không, tớ sẽ lỡ bộ phim trên TV nếu tớ đi mất.\"\n3. Giải thích: Cấu trúc câu điều kiện loại 1 (If I do -> Vế chính dùng Will + V). Diễn tả sự việc có thể xảy ra ở tương lai."
        },
        {
          "questionNumber": 20,
          "question": "Every year thousands of people _______ (visit) Buñol in Spain to take part in La Tomatina.",
          "answerOptions": [
            { "text": "visits", "isCorrect": false },
            { "text": "visit", "isCorrect": true },
            { "text": "visited", "isCorrect": false },
            { "text": "are visiting", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- visit (v): thăm (số nhiều).\n- visits (v): thăm (số ít).\n- visited (v): thăm (quá khứ).\n- are visiting (v): đang thăm.\n2. Dịch nghĩa: \"Mỗi năm hàng ngàn người đến thăm Buñol ở Tây Ban Nha để tham gia La Tomatina.\"\n3. Giải thích: Dấu hiệu \"Every year\" -> Thì hiện tại đơn. Chủ ngữ số nhiều \"people\" -> Động từ giữ nguyên."
        },
        {
          "questionNumber": 21,
          "question": "When I was in England I _______ (go) to Glastonbury Festival almost every year.",
          "answerOptions": [
            { "text": "go", "isCorrect": false },
            { "text": "went", "isCorrect": true },
            { "text": "have gone", "isCorrect": false },
            { "text": "was going", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- go (v): đi (hiện tại).\n- went (v): đi (quá khứ).\n- have gone (v): đã đi (hiện tại hoàn thành).\n- was going (v): đang đi.\n2. Dịch nghĩa: \"Khi tôi còn ở Anh, tôi đã đi dự Lễ hội Glastonbury gần như mỗi năm.\"\n3. Giải thích: Kể về thói quen trong quá khứ (\"When I was...\") -> Dùng Quá khứ đơn."
        },
        {
          "questionNumber": 22,
          "question": "Look! The dancers _______ (perform) traditional Spanish dances.",
          "answerOptions": [
            { "text": "perform", "isCorrect": false },
            { "text": "are performing", "isCorrect": true },
            { "text": "performed", "isCorrect": false },
            { "text": "have performed", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- perform (v): biểu diễn (thường xuyên).\n- are performing (v): đang biểu diễn.\n- performed (v): đã biểu diễn.\n- have performed (v): đã biểu diễn xong.\n2. Dịch nghĩa: \"Nhìn kìa! Các vũ công đang biểu diễn những điệu nhảy truyền thống Tây Ban Nha.\"\n3. Giải thích: Từ \"Look!\" (Nhìn kìa!) là dấu hiệu nhận biết thì Hiện tại tiếp diễn (đang diễn ra ngay lúc nói)."
        },
        {
          "questionNumber": 23,
          "question": "These pine trees _______ (be) on sale soon and would make an ideal Christmas gift.",
          "answerOptions": [
            { "text": "will be", "isCorrect": true },
            { "text": "are", "isCorrect": false },
            { "text": "were", "isCorrect": false },
            { "text": "have been", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- will be (future): sẽ là/sẽ ở.\n- are (present): là/ở.\n- were (past): đã là/đã ở.\n- have been (perfect): đã từng là.\n2. Dịch nghĩa: \"Những cây thông này sẽ sớm được giảm giá và sẽ là món quà Giáng sinh lý tưởng.\"\n3. Giải thích: Từ \"soon\" (sớm thôi) chỉ tương lai -> Dùng \"will be\"."
        },
        {
          "questionNumber": 24,
          "question": "You didn't use to like horror films! When _______ (you/ start) watching them?",
          "answerOptions": [
            { "text": "do you start", "isCorrect": false },
            { "text": "did you start", "isCorrect": true },
            { "text": "have you started", "isCorrect": false },
            { "text": "were you starting", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- do you start: bạn bắt đầu (thường xuyên).\n- did you start: bạn đã bắt đầu (quá khứ).\n- have you started: bạn vừa bắt đầu.\n- were you starting: bạn đang bắt đầu.\n2. Dịch nghĩa: \"Cậu từng không thích phim kinh dị mà! Cậu bắt đầu xem chúng từ khi nào vậy?\"\n3. Giải thích: Câu hỏi với \"When\" hỏi về thời điểm khởi đầu trong quá khứ -> Quá khứ đơn (Simple Past)."
        },
        {
          "questionNumber": 25,
          "question": "_______ (you/ go) to the Rock In Rio festival tomorrow?",
          "answerOptions": [
            { "text": "Are you going", "isCorrect": true },
            { "text": "Do you go", "isCorrect": false },
            { "text": "Did you go", "isCorrect": false },
            { "text": "Have you gone", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- Are you going (Present Continuous): Bạn có định đi (kế hoạch).\n- Do you go (Present Simple): Bạn có đi (thói quen).\n- Did you go (Past Simple): Bạn đã đi.\n- Have you gone (Present Perfect): Bạn đã đi chưa.\n2. Dịch nghĩa: \"Ngày mai bạn có đi lễ hội Rock In Rio không?\"\n3. Giải thích: \"Tomorrow\" là tương lai. Dùng Hiện tại tiếp diễn (Are you going) để diễn tả một kế hoạch/dự định đã sắp xếp trong tương lai gần."
        },
        {
          "questionNumber": 26,
          "question": "'Let's _______ (see) a romantic comedy tonight.' 'OK. Why not?'",
          "answerOptions": [
            { "text": "seeing", "isCorrect": false },
            { "text": "see", "isCorrect": true },
            { "text": "to see", "isCorrect": false },
            { "text": "saw", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- seeing (V-ing).\n- see (V-bare).\n- to see (to V).\n- saw (V-past).\n2. Dịch nghĩa: \"'Tối nay chúng ta xem phim hài lãng mạn đi.' 'Ừ. Tại sao không nhỉ?'\"\n3. Giải thích: Cấu trúc câu đề nghị: Let's + Động từ nguyên thể (Bare infinitive)."
        },
        {
          "questionNumber": 27,
          "question": "In the morning of the festival, many people tried _______ (climb) up the pole to get the ham.",
          "answerOptions": [
            { "text": "to climb", "isCorrect": true },
            { "text": "climbing", "isCorrect": false },
            { "text": "climb", "isCorrect": false },
            { "text": "climbed", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- to climb (cố gắng làm gì - khó khăn).\n- climbing (thử làm gì - xem kết quả).\n- climb (nguyên thể).\n- climbed (quá khứ).\n2. Dịch nghĩa: \"Vào buổi sáng lễ hội, nhiều người đã cố trèo lên cây cột để lấy miếng thịt giăm bông.\"\n3. Giải thích: Cấu trúc \"try + to V\": cố gắng làm gì (thường là việc khó). Việc leo cột mỡ để lấy phần thưởng là một thử thách khó khăn cần nỗ lực."
        },
        {
          "questionNumber": 28,
          "question": "After one hour, people stopped _______ (throw) tomatoes and tried tomato Paella.",
          "answerOptions": [
            { "text": "throwing", "isCorrect": true },
            { "text": "to throw", "isCorrect": false },
            { "text": "throw", "isCorrect": false },
            { "text": "threw", "isCorrect": false }
          ],
          "rationale": "1. Phân tích từ vựng:\n- throwing (dừng việc đang làm lại).\n- to throw (dừng lại để ném).\n- throw (nguyên thể).\n- threw (quá khứ).\n2. Dịch nghĩa: \"Sau một giờ, mọi người ngừng ném cà chua và thử món Paella cà chua.\"\n3. Giải thích: Cấu trúc \"Stop + V-ing\": ngừng hẳn việc đang làm. (Stop throwing = Ngừng ném)."
        }
      ]
    };

    // ================= LOGIC XỬ LÝ (JAVASCRIPT) =================
    
    let score = 0;
    const totalQuestions = quizData.questions.length;
    const answeredState = new Array(totalQuestions).fill(false); // Track answered questions

    // AUDIO CONTEXT (Để tạo âm thanh không cần file ngoài)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // Âm thanh Ding (High pitch sine wave)
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            oscillator.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1); // C6
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        } else {
            // Âm thanh Buzz (Sawtooth wave)
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    // RENDER QUESTIONS
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        
        quizData.questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `q-${index}`;

            // Create HTML structure
            let optionsHTML = '';
            q.answerOptions.forEach((opt, i) => {
                optionsHTML += `
                    <button class="answer-btn" onclick="checkAnswer(${index}, ${i}, this, ${opt.isCorrect})">
                        ${String.fromCharCode(65 + i)}. ${opt.text}
                    </button>
                `;
            });

            // Format Rationale (bolding numbering)
            let formattedRationale = q.rationale
                .replace(/(\d+\.)/g, '<br><strong>$1</strong>')
                .replace(/^\<br\>/, ''); // Remove first br

            card.innerHTML = `
                <div class="question-number">${q.questionNumber}</div>
                <div class="question-text">${q.question}</div>
                <div class="answers-grid">
                    ${optionsHTML}
                </div>
                <div class="explanation-box" id="expl-${index}">
                    <div class="explanation-content">${formattedRationale}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // CHECK ANSWER LOGIC
    function checkAnswer(qIndex, optIndex, btn, isCorrect) {
        if (answeredState[qIndex]) return; // Prevent clicking again
        
        answeredState[qIndex] = true;
        const explanationBox = document.getElementById(`expl-${qIndex}`);
        const cardButtons = document.querySelectorAll(`#q-${qIndex} .answer-btn`);

        if (isCorrect) {
            btn.classList.add('correct');
            playSound('correct');
            score++;
            
            // Fire Confetti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        } else {
            btn.classList.add('wrong');
            playSound('wrong');
            // Highlight the correct one
            cardButtons.forEach((b, i) => {
                const isThisOptCorrect = quizData.questions[qIndex].answerOptions[i].isCorrect;
                if (isThisOptCorrect) {
                    b.classList.add('correct');
                }
            });
        }

        // Disable all buttons in this card
        cardButtons.forEach(b => b.disabled = true);

        // Show Explanation
        explanationBox.style.display = 'block';
    }

    // FINISH QUIZ
    function finishQuiz() {
        const modal = document.getElementById('score-modal');
        const scoreDisplay = document.getElementById('final-score');
        const msgDisplay = document.getElementById('final-msg');
        
        scoreDisplay.innerText = `${score}/${totalQuestions}`;
        
        const percentage = (score / totalQuestions) * 100;
        if (percentage === 100) msgDisplay.innerText = "Tuyệt đối! Em là thiên tài Tiếng Anh! 🌟";
        else if (percentage >= 80) msgDisplay.innerText = "Giỏi lắm! Cố gắng thêm chút nữa nhé! 🎉";
        else if (percentage >= 50) msgDisplay.innerText = "Khá tốt! Hãy xem lại phần giải thích nha. 💪";
        else msgDisplay.innerText = "Đừng buồn, hãy ôn tập kỹ hơn nhé! 📚";

        modal.classList.add('active');
        
        // Final celebration sound
        playSound('correct');
        confetti({
            particleCount: 200,
            spread: 100,
            origin: { y: 0.6 }
        });
    }

    function closeModal() {
        location.reload();
    }

    // INITIALIZE
    window.onload = function() {
        renderQuiz();
    }

</script>
