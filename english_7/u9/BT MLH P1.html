<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 9: Festivals Around The World - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f3f5;
            --card-bg: #ffffff;
            --text-color: #2f3542;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e3e8ff;
            background-image: radial-gradient(#8854c0 1.5px, transparent 1.5px), radial-gradient(#8854c0 1.5px, #e3e8ff 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 3px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--primary-color);
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 2.2em;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .teacher-name {
            background: var(--secondary-color);
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 700;
            margin-top: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Score Board */
        .score-board {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px 20px;
            border-radius: 15px;
            border: 3px solid var(--primary-color);
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Question Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.2);
            border: 2px solid #fff;
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .quiz-card:hover {
            transform: translateY(-5px);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed #eee;
            padding-bottom: 10px;
        }

        .q-number {
            background: var(--primary-color);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        .question-text {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #2d3436;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe6e9;
            padding: 15px 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            box-shadow: 0 4px 0 #dfe6e9;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            box-shadow: 0 6px 0 var(--primary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 var(--primary-color);
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color) !important;
            color: white;
            border-color: #00b85c !important;
            box-shadow: 0 4px 0 #00b85c !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color) !important;
            color: white;
            border-color: #eb3b49 !important;
            box-shadow: 0 4px 0 #eb3b49 !important;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #f1f9fe;
            border: 2px solid #bce0fd;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.show {
            display: block;
        }

        .teacher-avatar {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .exp-header {
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #bce0fd;
            padding-bottom: 10px;
        }

        .exp-translation {
            font-style: italic;
            color: #576574;
            margin-bottom: 15px;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        .exp-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .exp-item {
            padding: 8px;
            border-radius: 8px;
            font-size: 0.95em;
            line-height: 1.4;
        }
        
        .exp-item.is-correct-explanation {
            background-color: #e6fffa;
            border-left: 4px solid var(--secondary-color);
        }

        .exp-item strong {
            color: var(--primary-color);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* Footer */
        .footer-controls {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #6c4299;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }
        
        .submit-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 0 #6c4299;
        }

        /* Result Popup */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .result-box {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: zoomIn 0.3s;
            border: 5px solid var(--secondary-color);
        }

        .result-score {
            font-size: 3em;
            color: var(--primary-color);
            font-weight: 900;
            margin: 20px 0;
        }

        @keyframes zoomIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
</head>

                "question": "________ you interested in watching fireworks display?",
                "answerOptions": [
                    { "text": "Do", "rationale": "(Aux Verb). Sai.", "isCorrect": false },
                    { "text": "Have", "rationale": "(Aux Verb). Sai.", "isCorrect": false },
                    { "text": "Are", "rationale": "(To be) Thì/là. Đúng: Cấu trúc 'Be interested in' (quan tâm/hứng thú). Dịch câu: Bạn có hứng thú xem bắn pháo hoa không?",
                    "isCorrect": true },
                    { "text": "Will", "rationale": "(Modal verb). Sai.", "isCorrect": false }
                ],
                "hint": "Đi với tính từ 'interested'."
            },
            {
                "questionNumber": 38,
                "question": "________ the lanterns fly up if I light the candles?",
                "answerOptions": [
                    { "text": "Do", "rationale": "(Aux Verb). Sai.", "isCorrect": false },
                    { "text": "Will", "rationale": "(Modal verb) Sẽ. Đúng: Câu điều kiện loại 1 (if I light...). Dịch câu: Những chiếc đèn lồng sẽ bay lên nếu tôi thắp nến chứ?", "isCorrect": true },
                    { "text": "Are", "rationale": "(To be). Sai.", "isCorrect": false },
                    { "text": "Did", "rationale": "(Aux Verb). Sai.", "isCorrect": false }
                ],
                "hint": "Câu hỏi về kết quả trong tương lai (Nếu... thì...)."
            }
        ];

        let score = 0;
        const scoreEl = document.getElementById('current-score');
        const quizContainer = document.getElementById('quiz-container');

        // --- RENDER LOGIC ---
        function renderQuiz() {
            quizContainer.innerHTML = '';
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `q-${index}`;

                // Create HTML for options
                let optionsHtml = '';
                item.answerOptions.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <button class="option-btn" 
                                onclick="checkAnswer(this, ${index}, ${optIndex}, ${opt.isCorrect})">
                            ${String.fromCharCode(65 + optIndex)}. ${opt.text}
                        </button>
                    `;
                });

                // Create Explanation HTML (Detailed breakdown of ALL options)
                let explanationDetails = '';
                let questionTranslation = '';

                // Loop through options to build the explanation
                item.answerOptions.forEach((opt, optIndex) => {
                    const label = String.fromCharCode(65 + optIndex);
                    const isRight = opt.isCorrect;
                    
                    // Extract Translation if usually embedded in rationale of correct answer
                    if(isRight && opt.rationale.includes("Dịch câu:")) {
                        const parts = opt.rationale.split("Dịch câu:");
                        if(parts.length > 1) {
                            questionTranslation = parts[1].trim();
                        }
                    }

                    explanationDetails += `
                        <div class="exp-item ${isRight ? 'is-correct-explanation' : ''}">
                            <strong>${label}. ${opt.text}</strong>: ${opt.rationale}
                        </div>
                    `;
                });
                
                // Fallback translation if not found
                if(!questionTranslation) questionTranslation = "Xem chi tiết bên dưới.";

                const explanationHtml = `
                    <div class="explanation-box" id="exp-${index}">
                        <div class="exp-header">
                            <span class="teacher-avatar">👩‍🏫</span>
                            Ms. Chí Nên giải thích chi tiết:
                        </div>
                        <div class="exp-translation">
                            <strong>Dịch câu:</strong> "${questionTranslation}"
                        </div>
                        <div class="exp-details">
                            ${explanationDetails}
                        </div>
                        <div style="margin-top:10px; font-size:0.9em; color:#666;">
                            💡 <strong>Gợi ý:</strong> ${item.hint}
                        </div>
                    </div>
                `;

                card.innerHTML = `
                    <div class="question-header">
                        <div class="q-number">${item.questionNumber}</div>
                    </div>
                    <div class="question-text">${item.question}</div>
                    <div class="options-grid">
                        ${optionsHtml}
                    </div>
                    ${explanationHtml}
                `;

                quizContainer.appendChild(card);
            });
        }

        // --- INTERACTION LOGIC ---
        function checkAnswer(btn, qIndex, optIndex, isCorrect) {
            // Prevent multiple clicks
            const card = document.getElementById(`q-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            
            // If already answered, do nothing
            if (card.getAttribute('data-answered') === 'true') return;
            
            card.setAttribute('data-answered', 'true'); // Mark as answered

            // Disable all buttons
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
                playSound('correct');
                score++;
                scoreEl.innerText = score;
                triggerConfetti();
            } else {
                btn.classList.add('wrong');
                playSound('wrong');
                // Highlight the correct answer automatically
                const data = quizData[qIndex];
                data.answerOptions.forEach((opt, i) => {
                    if (opt.isCorrect) {
                        buttons[i].classList.add('correct');
                    }
                });
            }

            // Show explanation immediately
            const expBox = document.getElementById(`exp-${qIndex}`);
            expBox.classList.add('show');
        }

        function showFinalResult() {
            const overlay = document.getElementById('result-overlay');
            const scoreDisplay = document.getElementById('final-score-display');
            const feedback = document.getElementById('feedback-text');
            
            scoreDisplay.innerText = `${score} / ${quizData.length}`;
            
            const percentage = (score / quizData.length) * 100;
            if (percentage === 100) {
                feedback.innerText = "Xuất sắc! Bạn là thiên tài tiếng Anh! 🌟";
                triggerConfetti();
            } else if (percentage >= 80) {
                feedback.innerText = "Giỏi lắm! Cố gắng thêm chút nữa là hoàn hảo! 💪";
            } else if (percentage >= 50) {
                feedback.innerText = "Khá tốt! Hãy xem lại phần giải thích để hiểu rõ hơn nhé! 📚";
            } else {
                feedback.innerText = "Đừng buồn! Hãy đọc kỹ giải thích của Ms. Chí Nên và làm lại nhé! 🌱";
            }

            overlay.style.display = 'flex';
        }

        function closeResult() {
            document.getElementById('result-overlay').style.display = 'none';
        }

        // --- AUDIO ENGINE (Web Audio API) ---
        // Simple synth sounds to avoid external file dependencies
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // "Ding" sound (High pitch sine wave)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1); // C6
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                // "Buzz" sound (Low pitch sawtooth)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- CONFETTI ENGINE ---
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFA502', '#2ED573'];

            for (let i = 0; i < 100; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vy: Math.random() * 5 + 2,
                    vx: Math.random() * 4 - 2
                });
            }

            let animationId;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                pieces.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    if (p.y < canvas.height) active = true;
                });
                
                if (active) {
                    animationId = requestAnimationFrame(animate);
                }
            }
            animate();
            
            // Stop after 2 seconds
            setTimeout(() => cancelAnimationFrame(animationId), 2000);
            setTimeout(() => ctx.clearRect(0, 0, canvas.width, canvas.height), 2000);
        }

        // Initialize
        renderQuiz();

    </script>
</body>
