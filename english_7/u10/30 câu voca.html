<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Sources: Vocabulary & Grammar Practice - Ms. Chí Nên</title>
    <!-- Import Google Fonts: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Import Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f3f8;
            --text-color: #2d3436;
            --card-shadow: 0 8px 0 rgba(0,0,0,0.1);
            --btn-shadow: 0 5px 0 rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E0EAFC; /* Fallback */
            background-image: radial-gradient(#8854C0 0.8px, transparent 0.8px), radial-gradient(#00C9A7 0.8px, #E0EAFC 0.8px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Header Styles */
        header {
            text-align: center;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.2);
            margin-bottom: 30px;
            border-bottom: 5px solid var(--primary-purple);
        }

        h1 {
            color: var(--primary-purple);
            margin: 0;
            font-weight: 800;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-header {
            color: #636e72;
            font-weight: 600;
            margin-top: 5px;
            font-size: 1rem;
        }

        /* Question Card Styles */
        .question-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.05);
            border: 2px solid #f1f2f6;
            position: relative;
            transition: transform 0.3s ease;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .q-number {
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe6e9;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #636e72;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 0 #dfe6e9;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            border-color: var(--primary-purple);
            color: var(--primary-purple);
            box-shadow: 0 7px 0 #dcdde1;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #dfe6e9;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background-color: var(--correct-green) !important;
            color: white !important;
            border-color: #00b85c !important;
            box-shadow: 0 4px 0 #00944a !important;
            transform: none !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            color: white !important;
            border-color: #eb3b49 !important;
            box-shadow: 0 4px 0 #c0392b !important;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            background: #f0fff4; /* Light green bg */
            border: 2px dashed var(--primary-teal);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: var(--primary-teal);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #444;
            white-space: pre-wrap; /* Preserve line breaks */
        }
        
        .explanation-content strong {
            color: var(--primary-purple);
        }

        /* Floating Score */
        .score-board {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            font-weight: 800;
            color: var(--primary-purple);
            font-size: 1.2rem;
            z-index: 100;
            border: 3px solid var(--primary-purple);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Submit Button */
        .submit-section {
            text-align: center;
            margin-top: 40px;
        }

        .submit-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 0 #6c429c;
            transition: transform 0.2s;
            font-family: 'Nunito', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 0 #6c429c;
            background: #9b59b6;
        }
        
        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #6c429c;
        }

        /* Animations */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--primary-teal);
        }
        
        .modal-score {
            font-size: 3rem;
            color: var(--primary-purple);
            font-weight: 900;
            margin: 20px 0;
        }
        
        .modal-praise {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Energy Sources</h1>
            <div class="sub-header">Vocabulary & Grammar Practice • Ms. Chí Nên </div>
        </header>

        <div id="quiz-container">
            <!-- Questions will be injected here via JavaScript -->
        </div>

        <div class="submit-section">
            <button class="submit-btn" onclick="finishQuiz()">NỘP BÀI</button>
        </div>
    </div>

    <!-- Sticky Score -->
    <div class="score-board">
        <span>🏆</span>
        <span id="score-display">0</span> / <span id="total-display">30</span>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2>Kết Quả Của Con</h2>
            <div class="modal-score" id="final-score">0/30</div>
            <p class="modal-praise" id="final-praise">Làm tốt lắm!</p>
            <button class="submit-btn" onclick="closeModal()" style="font-size: 1rem; padding: 10px 30px;">Xem lại bài</button>
        </div>
    </div>

    <script>
        // --- DATA SOURCE ---
        const quizData = [
            {
              "questionNumber": 1,
              "question": "We should rely much more on ______ sources of energy. (Ex 5)",
              "answerOptions": [
                { "text": "alternative", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- limited (adj): có hạn.\n- expensive (adj): đắt đỏ.\n- alternative (adj): thay thế (thường chỉ năng lượng sạch thay cho nhiên liệu hóa thạch).\n2. Dịch nghĩa: \"Chúng ta nên dựa nhiều hơn vào các nguồn năng lượng thay thế.\"\n3. Tại sao chọn đáp án này?\n- Ngữ cảnh khuyên bảo \"should rely much more\" (nên dựa vào nhiều hơn) -> Cần một tính từ mang nghĩa tích cực/giải pháp." },
                { "text": "limited", "isCorrect": false, "rationale": "Không ai khuyên dựa vào nguồn có hạn." },
                { "text": "expensive", "isCorrect": false, "rationale": "Không ai khuyên dựa vào nguồn đắt đỏ." }
              ]
            },
            {
              "questionNumber": 2,
              "question": "The river provides a ______ supply of clean water to nearby villages - they don’t worry about water supply any more. (Ex 5)",
              "answerOptions": [
                { "text": "plentiful", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- limited (adj): hạn chế.\n- plentiful (adj): dồi dào, phong phú.\n- polluting (adj): gây ô nhiễm.\n2. Dịch nghĩa: \"Con sông cung cấp nguồn nước sạch dồi dào cho các ngôi làng gần đó - họ không còn lo lắng về nguồn cấp nước nữa.\"\n3. Tại sao chọn đáp án này?\n- Cụm \"don't worry... any more\" (không còn lo lắng nữa) chứng tỏ nguồn nước phải nhiều/đủ dùng -> plentiful." },
                { "text": "limited", "isCorrect": false, "rationale": "Nếu hạn chế thì phải lo lắng." },
                { "text": "polluting", "isCorrect": false, "rationale": "Nước sạch (clean water) không thể gây ô nhiễm." }
              ]
            },
            {
              "questionNumber": 3,
              "question": "The problem with fossil fuels is that they are not ______. (Ex 5)",
              "answerOptions": [
                { "text": "renewable", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- non-renewable (adj): không thể tái tạo.\n- renewable (adj): có thể tái tạo.\n- dangerous (adj): nguy hiểm.\n2. Dịch nghĩa: \"Vấn đề với nhiên liệu hóa thạch là chúng không thể tái tạo.\"\n3. Tại sao chọn đáp án này?\n- Fossil fuels (nhiên liệu hóa thạch) bản chất là non-renewable. Câu văn có chữ \"not\" (không) -> They are NOT renewable (Chúng không tái tạo được)." },
                { "text": "non-renewable", "isCorrect": false, "rationale": "Sai logic (They are not non-renewable = They are renewable -> Sai sự thật)." },
                { "text": "dangerous", "isCorrect": false, "rationale": "Sai logic (Nhiên liệu hóa thạch thực tế có gây nguy hại môi trường, nên nói chúng 'không nguy hiểm' là sai)." }
              ]
            },
            {
              "questionNumber": 4,
              "question": "The public have more concerns about ______ energy because of waste and accidents. (Ex 5)",
              "answerOptions": [
                { "text": "nuclear", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- water (n): nước (thủy điện).\n- nuclear (n/adj): hạt nhân.\n- solar (n/adj): mặt trời.\n2. Dịch nghĩa: \"Công chúng quan ngại nhiều hơn về năng lượng hạt nhân do chất thải và tai nạn.\"\n3. Tại sao chọn đáp án này?\n- Từ khóa \"waste\" (chất thải phóng xạ) và \"accidents\" (tai nạn nhà máy) là đặc trưng rủi ro của năng lượng hạt nhân." },
                { "text": "water", "isCorrect": false, "rationale": "Ít khi lo về chất thải." },
                { "text": "solar", "isCorrect": false, "rationale": "Rất an toàn, không có tai nạn lớn." }
              ]
            },
            {
              "questionNumber": 5,
              "question": "He seems not to ______, so he can work for hours without stopping. (Ex 5)",
              "answerOptions": [
                { "text": "run out of energy", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- run up (phrasal verb): kéo cờ lên/tích lũy nợ.\n- run away (phrasal verb): chạy trốn.\n- run out of (phrasal verb): cạn kiệt/hết sạch.\n2. Dịch nghĩa: \"Anh ấy dường như không bao giờ hết năng lượng, vì vậy anh ấy có thể làm việc hàng giờ không nghỉ.\"\n3. Tại sao chọn đáp án này?\n- \"Work for hours without stopping\" -> Không bị hết sức -> not run out of energy." },
                { "text": "run up", "isCorrect": false, "rationale": "Sai nghĩa." },
                { "text": "run away", "isCorrect": false, "rationale": "Sai nghĩa." }
              ]
            },
            {
              "questionNumber": 6,
              "question": "Strawberries are ______ and cheap in summer. (Ex 5)",
              "answerOptions": [
                { "text": "plentiful", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- plentiful (adj): nhiều, dồi dào.\n- limited (adj): hạn chế.\n- renewable (adj): tái tạo được (thường nói về năng lượng).\n2. Dịch nghĩa: \"Dâu tây thì dồi dào và rẻ vào mùa hè.\"\n3. Tại sao chọn đáp án này?\n- Quy luật cung cầu: Hàng nhiều (plentiful) thì giá rẻ (cheap)." },
                { "text": "limited", "isCorrect": false, "rationale": "Nếu hiếm (limited) thì phải đắt." },
                { "text": "renewable", "isCorrect": false, "rationale": "Không dùng từ này cho hoa quả trong ngữ cảnh mua bán." }
              ]
            },
            {
              "questionNumber": 7,
              "question": "Our ______ natural resources will run out soon. (Ex 5)",
              "answerOptions": [
                { "text": "available", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- harmful (adj): có hại.\n- available (adj): có sẵn/hiện có.\n- nuclear (adj): hạt nhân.\n2. Dịch nghĩa: \"Các nguồn tài nguyên thiên nhiên sẵn có của chúng ta sẽ sớm cạn kiệt.\"\n3. Tại sao chọn đáp án này?\n- Nói về trữ lượng tài nguyên đang khai thác -> available natural resources." },
                { "text": "harmful", "isCorrect": false, "rationale": "Không hợp lý." },
                { "text": "nuclear", "isCorrect": false, "rationale": "Nuclear resources (uranium) là một loại cụ thể, nhưng ngữ cảnh 'natural resources' chung chung thường đi với available." }
              ]
            },
            {
              "questionNumber": 8,
              "question": "Using green sources of energy can make the air ______. (Ex 5)",
              "answerOptions": [
                { "text": "clean", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- cheap (adj): rẻ.\n- unlimited (adj): vô hạn.\n- clean (adj): sạch.\n2. Dịch nghĩa: \"Sử dụng nguồn năng lượng xanh có thể làm cho không khí trong sạch.\"\n3. Tại sao chọn đáp án này?\n- Green energy (năng lượng xanh) -> giảm ô nhiễm -> air clean." },
                { "text": "cheap", "isCorrect": false, "rationale": "Không khí không mua bán nên không dùng 'cheap'." },
                { "text": "unlimited", "isCorrect": false, "rationale": "Không khí vốn dĩ nhiều, vấn đề là chất lượng (sạch/bẩn)." }
              ]
            },
            {
              "questionNumber": 9,
              "question": "Solar energy seems to be ______ - we can rely on it for a very long time. (Ex 5)",
              "answerOptions": [
                { "text": "unlimited", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- limited (adj): có hạn.\n- unlimited (adj): vô hạn.\n- harmful (adj): có hại.\n2. Dịch nghĩa: \"Năng lượng mặt trời dường như là vô hạn - chúng ta có thể dựa vào nó trong một thời gian rất dài.\"\n3. Tại sao chọn đáp án này?\n- \"Rely on it for a very long time\" -> Nguồn cung không bao giờ hết -> unlimited." },
                { "text": "limited", "isCorrect": false, "rationale": "Ngược nghĩa." },
                { "text": "harmful", "isCorrect": false, "rationale": "Sai kiến thức (năng lượng mặt trời thân thiện môi trường)." }
              ]
            },
            {
              "questionNumber": 10,
              "question": "The air becomes worse because of ______ gases from that factory. (Ex 5)",
              "answerOptions": [
                { "text": "polluting", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- polluted (adj): bị ô nhiễm (bị động).\n- polluting (adj): gây ô nhiễm (chủ động).\n- pollution (noun): sự ô nhiễm.\n2. Dịch nghĩa: \"Không khí trở nên tồi tệ hơn vì các khí thải gây ô nhiễm từ nhà máy đó.\"\n3. Tại sao chọn đáp án này?\n- Khí thải là tác nhân GÂY RA ô nhiễm cho không khí -> dùng tính từ chủ động 'polluting'." },
                { "text": "polluted", "isCorrect": false, "rationale": "Polluted air (không khí bị bẩn) thì đúng, nhưng polluted gases (khí bị bẩn) thì sai nghĩa." },
                { "text": "pollution", "isCorrect": false, "rationale": "Pollution gases là danh từ ghép không chuẩn bằng tính từ polluting bổ nghĩa cho gases." }
              ]
            },
            {
              "questionNumber": 11,
              "question": "______ energy is the energy that comes from the sun. (Ex 6)",
              "answerOptions": [
                { "text": "Solar", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- Solar (adj): thuộc mặt trời.\n- Hydro (adj/prefix): thuộc về nước.\n2. Dịch nghĩa: \"Năng lượng mặt trời là năng lượng đến từ mặt trời.\"\n3. Tại sao chọn đáp án này?\n- Sun (mặt trời) -> Solar." },
                { "text": "Hydro", "isCorrect": false, "rationale": "Sai nguồn gốc." }
              ]
            },
            {
              "questionNumber": 12,
              "question": "Some types of energy are ______ and hard to find. (Ex 6)",
              "answerOptions": [
                { "text": "expensive", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- cheap (adj): rẻ.\n- expensive (adj): đắt.\n2. Dịch nghĩa: \"Một số loại năng lượng thì đắt đỏ và khó tìm.\"\n3. Tại sao chọn đáp án này?\n- \"Hard to find\" (khan hiếm) thường dẫn đến giá thành cao (expensive)." },
                { "text": "cheap", "isCorrect": false, "rationale": "Hiếm thì không thể rẻ." }
              ]
            },
            {
              "questionNumber": 13,
              "question": "We are ______ a project on energy sources. (Ex 6)",
              "answerOptions": [
                { "text": "doing", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- doing (verb): làm/thực hiện.\n- running (verb): chạy/vận hành.\n2. Dịch nghĩa: \"Chúng tôi đang thực hiện một dự án về các nguồn năng lượng.\"\n3. Tại sao chọn đáp án này?\n- Collocation (Kết hợp từ): 'do a project' là cụm từ phổ biến nhất trong môi trường học đường." },
                { "text": "running", "isCorrect": false, "rationale": "'Run a project' thiên về quản lý dự án trong kinh doanh, nhưng 'doing' tự nhiên hơn với học sinh." }
              ]
            },
            {
              "questionNumber": 14,
              "question": "Energy is the power that we use to provide us with light, heat, or ______. (Ex 6)",
              "answerOptions": [
                { "text": "electricity", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- food (n): thức ăn.\n- electricity (n): điện năng.\n2. Dịch nghĩa: \"Năng lượng là sức mạnh chúng ta dùng để cung cấp ánh sáng, nhiệt, hoặc điện.\"\n3. Tại sao chọn đáp án này?\n- Light, heat, electricity cùng nhóm các dạng năng lượng đầu ra." },

                { "text": "unlimited", "isCorrect": false, "rationale": "Sai." },
                { "text": "abundant", "isCorrect": false, "rationale": "Sai logic câu." },
                { "text": "dangerous", "isCorrect": false, "rationale": "Sai logic câu (câu đang nói về khả năng xây dựng, không nói về rủi ro)." }
              ]
            },
            {
              "questionNumber": 30,
              "question": "Coal, natural gas and oil are called _________. (Ex 7)",
              "answerOptions": [
                { "text": "fossil fuels", "isCorrect": true, "rationale": "1. Phân tích từ vựng:\n- solar energy: năng lượng mặt trời.\n- fossil fuels: nhiên liệu hóa thạch.\n- biogas: khí sinh học.\n- nuclear energy: năng lượng hạt nhân.\n2. Dịch nghĩa: \"Than đá, khí tự nhiên và dầu mỏ được gọi là nhiên liệu hóa thạch.\"\n3. Tại sao chọn B?\n- Đây là tên gọi chung cho nhóm này." },
                { "text": "solar energy", "isCorrect": false, "rationale": "Sai." },
                { "text": "biogas", "isCorrect": false, "rationale": "Sai." },
                { "text": "nuclear energy", "isCorrect": false, "rationale": "Sai." }
              ]
            }
        ];

        // --- STATE ---
        let currentScore = 0;
        let answeredQuestions = new Set();

        // --- SOUNDS ---
        const correctSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3'); // Ding
        const wrongSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3'); // Pop/Failureish
        
        // Preload sounds
        correctSound.volume = 0.5;
        wrongSound.volume = 0.4;

        // --- RENDER LOGIC ---
        function initQuiz() {
            const container = document.getElementById('quiz-container');
            const totalDisplay = document.getElementById('total-display');
            totalDisplay.textContent = quizData.length;

            quizData.forEach((q, index) => {
                // Ensure options are shuffled or not? The prompt doesn't specify shuffling options, keep original order for consistency with explanation
                // But generally shuffling is good. However, rationale sometimes refers to "A, B, C". 
                // Wait, logic in provided data has options in array. I will keep them as is.
                
                // Card
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${index}`;

                // Header
                const header = document.createElement('div');
                header.className = 'question-header';
                header.innerHTML = `<span class="q-number">Câu ${q.questionNumber}</span>`;
                
                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = q.question;

                // Options
                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                // Find Correct Rationale text (combining all options logic)
                // The provided JSON has specific rationale for each option sometimes, or one big one?
                // The provided JSON structure has 'rationale' INSIDE 'answerOptions'.
                // TeacherMs. Chí Nên's requirement: "Analyze ALL 4 options".
                // I need to find the correct option to get the MAIN explanation, 
                // but the JSON structure actually has rationales distributed.
                // Strategy: When showing explanation, I will combine the Correct Option's detailed rationale (which seems to contain the main analysis in this dataset) 
                // AND list the rationales of the other options if they exist.
                
                // Let's identify the Correct Option first to grab the main rationale block
                const correctOptionData = q.answerOptions.find(opt => opt.isCorrect);
                
                q.answerOptions.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `${String.fromCharCode(65 + optIndex)}. ${opt.text}`;
                    btn.onclick = () => handleAnswer(index, optIndex, opt.isCorrect, btn);
                    optionsGrid.appendChild(btn);
                });

                // Explanation Box
                const explanation = document.createElement('div');
                explanation.className = 'explanation-box';
                explanation.id = `explanation-${index}`;
                
                // Constructing the full explanation content
                // Main rationale from the correct answer usually contains "1. Phân tích...", "2. Dịch nghĩa..." in this dataset.
                let explanationHTML = correctOptionData.rationale.replace(/\n/g, '<br>');
                
                // Add specific rationales for wrong answers if they add value and aren't covered
                q.answerOptions.forEach((opt, idx) => {
                    if (!opt.isCorrect && opt.rationale && opt.rationale !== "Sai." && opt.rationale !== "Sai nghĩa.") {
                        // Check if the main rationale already covers it. 
                        // For this specific dataset, the correct option usually has the full "Teacher explanation".
                        // The wrong options have short reasons like "Sai logic".
                        // Let's append them nicely.
                        explanationHTML += `<br><br><strong>➢ Tại sao đáp án ${String.fromCharCode(65 + idx)} sai:</strong> ${opt.rationale}`;
                    }
                });

                explanation.innerHTML = `
                    <div class="explanation-header">🎓 Ms. Chí Nên giải thích chi tiết:</div>
                    <div class="explanation-content">${explanationHTML}</div>
                `;

                // Assemble
                card.appendChild(header);
                card.appendChild(qText);
                card.appendChild(optionsGrid);
                card.appendChild(explanation);
                container.appendChild(card);
            });
        }

        function handleAnswer(qIndex, optIndex, isCorrect, btnElement) {
            // Check if already answered
            if (answeredQuestions.has(qIndex)) return;
            answeredQuestions.add(qIndex);

            const card = document.getElementById(`card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const explanation = document.getElementById(`explanation-${qIndex}`);

            // Visual Feedback
            if (isCorrect) {
                btnElement.classList.add('correct');
                correctSound.currentTime = 0;
                correctSound.play();
                triggerConfetti();
                currentScore++;
                updateScore();
            } else {
                btnElement.classList.add('wrong');
                wrongSound.currentTime = 0;
                wrongSound.play();
                
                // Highlight the correct answer automatically
                const correctBtnIndex = quizData[qIndex].answerOptions.findIndex(o => o.isCorrect);
                buttons[correctBtnIndex].classList.add('correct');
            }

            // Disable all buttons for this question
            buttons.forEach(b => b.disabled = true);

            // Show explanation
            explanation.style.display = 'block';
        }

        function updateScore() {
            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.textContent = currentScore;
            
            // Animation for score
            scoreDisplay.parentElement.style.transform = "scale(1.2)";
            setTimeout(() => {
                scoreDisplay.parentElement.style.transform = "scale(1)";
            }, 200);
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#FF4757', '#F1C40F']
            });
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const finalScoreEl = document.getElementById('final-score');
            const praiseEl = document.getElementById('final-praise');
            
            finalScoreEl.textContent = `${currentScore}/${quizData.length}`;
            
            const percentage = (currentScore / quizData.length) * 100;
            if (percentage === 100) praiseEl.textContent = "Xuất sắc! Con là thiên tài tiếng Anh! 🌟";
            else if (percentage >= 80) praiseEl.textContent = "Giỏi lắm! Con nắm bài rất chắc! 🎉";
            else if (percentage >= 50) praiseEl.textContent = "Khá lắm! Cố gắng đọc kỹ giải thích thêm nhé! 💪";
            else praiseEl.textContent = "Cố lên nhé! Hãy xem kỹ phần giải thích của Ms. Chí Nên! 📚";

            modal.style.display = 'flex';
            triggerConfetti();
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // Initialize
        window.onload = initQuiz;

    </script>
