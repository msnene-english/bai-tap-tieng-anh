    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #F0F3F8;
            --text-dark: #2C3E50;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--primary-purple) 15%, transparent 16%), radial-gradient(var(--primary-teal) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary-purple), #a29bfe);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.3);
            margin-bottom: 30px;
            border: 4px solid #fff;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            color: white;
            font-weight: 800;
            font-size: 2rem;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            color: #fff;
            font-size: 1.1rem;
            margin-top: 5px;
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            background: var(--primary-teal);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Quiz Card Styles */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05), 0 15px 20px rgba(0,0,0,0.1);
            border: 2px solid #fff;
            transition: transform 0.3s ease;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .q-number {
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #E0E0E0;
            padding: 15px 20px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #E0E0E0;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-purple);
            color: var(--primary-purple);
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #E0E0E0;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-green);
            color: white;
            border-color: #00B85C;
            box-shadow: 0 5px 0 #00B85C;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red);
            color: white;
            border-color: #E63B4B;
            box-shadow: 0 5px 0 #E63B4B;
            animation: shake 0.5s;
        }

        .disabled {
            pointer-events: none;
        }

        /* Explanation Box */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 20px;
            padding: 20px;
            background-color: #F8F9FA;
            border-radius: 15px;
            border-left: 5px solid var(--primary-teal);
            animation: slideDown 0.4s ease-out;
        }

        .exp-title {
            font-weight: 800;
            color: var(--primary-purple);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .exp-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #444;
            white-space: pre-wrap; /* Keeps formatting from data */
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Control Panel */
        .control-panel {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .submit-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            font-weight: 800;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 0 #6c429c;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 2px 0 #6c429c;
        }

        /* Result Popup */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .result-modal {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 5px solid var(--primary-purple);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-teal);
            margin: 10px 0;
        }

        .score-text {
            font-size: 1.2rem;
            color: #666;
        }

        .feedback-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-purple);
            margin: 15px 0;
        }

        .close-btn {
            background: #E0E0E0;
            color: #333;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

    </style>
</head>

                    { "text": "am looking", "rationale": "1. Phân tích từ vựng:\n- A. am look (sai cấu trúc).\n- B. am looking (v): đang tìm.\n- C. look (v): tìm.\n- D. are looking (sai ngữ pháp).\n\n2. Dịch nghĩa toàn câu: Tôi **đang tìm** một món quà nhưng tôi không thể tìm thấy cái nào ưng ý.\n\n3. Giải thích chi tiết:\nNgữ cảnh 'can't find' (không thể tìm thấy) ám chỉ việc tìm kiếm đang diễn ra ngay lúc đó -> Dùng Hiện tại tiếp diễn.\nChủ ngữ 'I' -> 'am looking'.", "isCorrect": true },
                    { "text": "am look", "isCorrect": false },
                    { "text": "look", "isCorrect": false },
                    { "text": "are looking", "isCorrect": false }
                ]
            },
            {
                "questionNumber": 40,
                "question": "Do you want to play football? - Not now. I am _________dinner.",
                "answerOptions": [
                    { "text": "having", "rationale": "1. Phân tích từ vựng:\n- A. having (v-ing): ăn.\n- B. have (v): ăn.\n- C. to have (v): để ăn.\n- D. has (v): ăn (số ít).\n\n2. Dịch nghĩa toàn câu: Bạn có muốn chơi bóng đá không? - Không phải lúc này. Tôi đang **ăn** tối.\n\n3. Giải thích chi tiết:\nCâu trả lời có 'I am...' -> yêu cầu V-ing để tạo thành thì Hiện tại tiếp diễn.\nCụm 'have dinner' (ăn tối).", "isCorrect": true },
                    { "text": "have", "isCorrect": false },
                    { "text": "to have", "isCorrect": false },
                    { "text": "has", "isCorrect": false }
                ]
            }
        ];

        let score = 0;
        let answeredCount = 0;

        // Render Questions
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            let html = '';

            quizData.forEach((item, index) => {
                const qNum = item.questionNumber;
                
                // Find correct answer object for explanation (if user picks wrong, we still show the correct logic)
                const correctOption = item.answerOptions.find(opt => opt.isCorrect);
                const explanationText = correctOption && correctOption.rationale ? correctOption.rationale : "Chưa có giải thích cho câu này.";

                let optionsHtml = '';
                // Randomize options? No, keeping order A, B, C, D as usually preferred in exams unless specified.
                // But data provided is just a list. We will assign A, B, C, D labels.
                const labels = ['A', 'B', 'C', 'D'];
                
                item.answerOptions.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <div class="option-btn" 
                             onclick="checkAnswer(this, ${index}, ${opt.isCorrect}, '${labels[optIndex]}')" 
                             data-question="${index}">
                            <b>${labels[optIndex]}.</b> ${opt.text}
                        </div>
                    `;
                });

                html += `
                    <div class="quiz-card" id="card-${index}">
                        <div class="question-header">
                            <span class="q-number">Question ${qNum}</span>
                        </div>
                        <div class="question-text">${item.question}</div>
                        <div class="options-grid">
                            ${optionsHtml}
                        </div>
                        <div class="explanation-box" id="exp-${index}">
                            <div class="exp-title">
                                <span style="font-size:1.5rem">💡</span> GIẢI THÍCH CHI TIẾT - Ms. Chí Nên:
                            </div>
                            <div class="exp-content">${explanationText}</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Handle Answer Selection
        function checkAnswer(btn, qIndex, isCorrect, label) {
            // Prevent re-answering
            const card = document.getElementById(`card-${qIndex}`);
            if (card.classList.contains('answered')) return;
            card.classList.add('answered');
            answeredCount++;

            // Visual Feedback
            const options = card.querySelectorAll('.option-btn');
            options.forEach(opt => opt.classList.add('disabled'));

            if (isCorrect) {
                btn.classList.add('correct');
                score++;
                playSound('correct');
                fireConfetti(btn);
            } else {
                btn.classList.add('wrong');
                playSound('wrong');
                // Highlight the correct one automatically
                // We need to find which button was correct based on data logic, 
                // but since we passed isCorrect in onclick, we iterate to find the one that yields true in logic
                // Actually easier: In render, we didn't store isCorrect in DOM. Let's find it via data.
                const correctOptIndex = quizData[qIndex].answerOptions.findIndex(o => o.isCorrect);
                options[correctOptIndex].classList.add('correct'); // Show correct answer
            }

            // Show Explanation
            const expBox = document.getElementById(`exp-${qIndex}`);
            expBox.style.display = 'block';
        }

        // Audio Functions
        function playSound(type) {
            const sound = document.getElementById(type === 'correct' ? 'sound-correct' : 'sound-wrong');
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Audio autoplay policy blocked sound"));
        }

        // Confetti Effect
        function fireConfetti(element) {
            const rect = element.getBoundingClientRect();
            // Calculate position relative to viewport
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { x: x, y: y },
                colors: ['#8854C0', '#00C9A7', '#FF4757', '#FFD700'],
                disableForReducedMotion: true
            });
        }

        // Show Results
        function showResults() {
            const total = quizData.length;
            document.getElementById('finalScore').innerText = `${score}/${total}`;
            
            let msg = "";
            const percentage = score / total;
            if (percentage === 1) msg = "Xuất sắc! Đỉnh của chóp! 🏆";
            else if (percentage >= 0.8) msg = "Rất giỏi! Cố gắng giữ phong độ nhé! 🌟";
            else if (percentage >= 0.5) msg = "Khá tốt! Ôn lại bài một chút là điểm 10 ngay! 💪";
            else msg = "Đừng buồn nhé! Hãy xem kỹ phần giải thích để tiến bộ hơn! 🌱";
            
            document.getElementById('feedbackText').innerText = msg;
            document.getElementById('resultOverlay').style.display = 'flex';
            
            // Big confetti for result
            if (percentage >= 0.5) {
                const duration = 3000;
                const end = Date.now() + duration;

                (function frame() {
                    confetti({
                        particleCount: 5,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: ['#8854C0', '#00C9A7']
                    });
                    confetti({
                        particleCount: 5,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: ['#8854C0', '#00C9A7']
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
            }
        }

        function closeModal() {
            document.getElementById('resultOverlay').style.display = 'none';
        }

        // Initialize
        renderQuiz();

    </script>
</body>
</html>
