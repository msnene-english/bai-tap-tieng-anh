<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sắp xếp & Viết câu chủ đề Năng lượng - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8854C0; /* Tím hồng nhạt */
            --secondary-color: #00C9A7; /* Xanh ngọc */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #f0f3f8;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --btn-shadow: 0px 6px 0px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e1e1e1 10%, transparent 10%), radial-gradient(#e1e1e1 10%, transparent 10%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 40px;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px var(--shadow-color);
            border-bottom: 5px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-family: 'Quicksand', sans-serif;
            color: var(--primary-color);
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 2px 2px 0px #eee;
        }

        .subtitle {
            color: #7f8fa6;
            font-size: 1.1rem;
            margin-top: 5px;
            font-weight: 700;
        }

        .teacher-badge {
            display: inline-block;
            background: var(--secondary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Question Card Styles */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(136, 84, 192, 0.1);
            border: 2px solid #eee;
            transition: transform 0.3s ease;
            position: relative;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .question-number {
            background: var(--primary-color);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            margin-right: 15px;
            flex-shrink: 0;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2f3542;
            line-height: 1.5;
            flex-grow: 1;
        }

        .question-text span.highlight {
            color: var(--primary-color);
            background: #f3e5f5;
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* Options Styles */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: #f7f9fc;
            border: 2px solid #e1e8ed;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.05rem;
            color: #57606f;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 4px 0 #e1e8ed;
            outline: none;
            display: flex;
            align-items: flex-start;
        }

        .option-btn .label {
            font-weight: 800;
            margin-right: 10px;
            min-width: 25px;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #d1d8dd;
            background: white;
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d1d8dd;
        }

        /* Correct/Wrong States */
        .option-btn.correct {
            background-color: #d1fae5;
            border-color: var(--correct-color);
            color: #065f46;
            box-shadow: 0 4px 0 #34d399;
        }
        
        .option-btn.correct::after {
            content: '✔';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--correct-color);
        }

        .option-btn.wrong {
            background-color: #ffe5e7;
            border-color: var(--wrong-color);
            color: #9b1c1c;
            box-shadow: 0 4px 0 #ff7675;
            animation: shake 0.5s;
        }

        .option-btn.wrong::after {
            content: '✘';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--wrong-color);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 25px;
            background: #fff8e1;
            border: 2px dashed #ffc107;
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-header {
            font-weight: 800;
            color: #d35400;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #2d3436;
            white-space: pre-line; /* Respect new lines from text */
        }
        
        .explanation-content strong {
            color: var(--primary-color);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Submit Button */
        .submit-container {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #5f2a9e;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 0 #5f2a9e;
            background: #9b59b6;
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #5f2a9e;
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .result-modal {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top: 10px solid var(--secondary-color);
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 20px 0;
            text-shadow: 3px 3px 0px #eee;
        }

        .message-display {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 30px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
        }

        .close-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #009688;
        }
        
        .close-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #009688;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <header>
            <div class="teacher-badge">Giáo viên: Ms. Chí Nên </div>
            <h1>Sắp xếp & Viết câu</h1>
            <div class="subtitle">Chủ đề: Năng lượng (Energy) - 25 Câu hỏi</div>
        </header>

        <div id="quiz-container">
            <!-- Questions will be injected here via JavaScript -->
        </div>

        <div class="submit-container">
            <button class="submit-btn" onclick="submitQuiz()">Nộp bài</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="result-modal">
            <h2 style="color: var(--secondary-color); margin: 0;">KẾT QUẢ CỦA EM</h2>
            <div class="score-display" id="finalScore">0/25</div>
            <div class="message-display" id="resultMessage">Làm tốt lắm!</div>
            <button class="close-btn" onclick="closeModal()">Xem lại bài làm</button>
        </div>
    </div>

    <script>
        // --- QUIZ DATA ---
        const quizData = [
            {
                "id": 1,
                "question": "Exercise 1. Q1: is/ renewable/ Hydro power/ a/ of/ source/ because/ energy/ it/ from/ water/ comes",
                "options": [
                    { "text": "Hydro power is a renewable source of energy because it comes from water.", "correct": true },
                    { "text": "Hydro power is a source of renewable energy because it comes from water.", "correct": false },
                    { "text": "Hydro power comes from water because it is a renewable source of energy.", "correct": false },
                    { "text": "Hydro power is a renewable energy of source because it comes from water.", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- Hydro power (n): Thủy điện.\n- renewable source of energy (np): nguồn năng lượng tái tạo.\n- comes from (vp): đến từ/xuất phát từ.\n\n2. Dịch nghĩa: Thủy điện là một nguồn năng lượng tái tạo bởi vì nó đến từ nước.\n\n3. Giải thích chi tiết:\n- Chủ ngữ 1: 'Hydro power' + động từ 'is' + cụm danh từ 'a renewable source of energy'.\n- Liên từ 'because' nối hai mệnh đề.\n- Mệnh đề 2: Chủ ngữ 'it' + động từ 'comes from' + tân ngữ 'water'."
            },
            {
                "id": 2,
                "question": "Exercise 1. Q2: non-renewable/ fuels/ Fossil/ sources/ energy/ are",
                "options": [
                    { "text": "Fossil fuels are non-renewable energy sources.", "correct": true },
                    { "text": "Fossil fuels are energy sources non-renewable.", "correct": false },
                    { "text": "Energy sources are non-renewable fossil fuels.", "correct": false },
                    { "text": "Non-renewable fuels are fossil energy sources.", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- Fossil fuels (n): Nhiên liệu hóa thạch.\n- non-renewable (adj): không tái tạo.\n- energy sources (n): nguồn năng lượng.\n\n2. Dịch nghĩa: Nhiên liệu hóa thạch là các nguồn năng lượng không thể tái tạo.\n\n3. Giải thích chi tiết:\n- Chủ ngữ: 'Fossil fuels' (số nhiều).\n- Động từ: 'are'.\n- Bổ ngữ: Cụm danh từ 'non-renewable energy sources' (Tính từ 'non-renewable' đứng trước danh từ ghép 'energy sources')."
            },
            {
                "id": 3,
                "question": "Exercise 1. Q3: are/ We/ looking for/ sources of energy/ cheap, / clean/ and effective",
                "options": [
                    { "text": "We are looking for cheap, clean and effective sources of energy.", "correct": true },
                    { "text": "We are looking for sources of energy cheap, clean and effective.", "correct": false },
                    { "text": "We are looking for effective, clean and cheap sources of energy.", "correct": false },
                    { "text": "We are looking for sources of cheap, clean and effective energy.", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- looking for (vp): tìm kiếm.\n- cheap, clean and effective (adj): rẻ, sạch và hiệu quả.\n- sources of energy (n): nguồn năng lượng.\n\n2. Dịch nghĩa: Chúng tôi đang tìm kiếm các nguồn năng lượng rẻ, sạch và hiệu quả.\n\n3. Giải thích chi tiết:\n- Chủ ngữ 'We' + 'are looking for'.\n- Sau đó là cụm tân ngữ: Chuỗi tính từ 'cheap, clean and effective' bổ nghĩa cho danh từ 'sources of energy'."
            },
            {
                "id": 4,
                "question": "Exercise 1. Q4: will/ We/ solar energy/use/ solve/ to/ the problem/ of energy shortage",
                "options": [
                    { "text": "We will use solar energy to solve the problem of energy shortage.", "correct": true },
                    { "text": "We will solve the problem of energy shortage to use solar energy.", "correct": false },
                    { "text": "We will use the problem of energy shortage to solve solar energy.", "correct": false },
                    { "text": "We will use solar energy of the problem to solve energy shortage.", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- solar energy (n): năng lượng mặt trời.\n- solve (v): giải quyết.\n- energy shortage (n): sự thiếu hụt năng lượng.\n\n2. Dịch nghĩa: Chúng ta sẽ sử dụng năng lượng mặt trời để giải quyết vấn đề thiếu hụt năng lượng.\n\n3. Giải thích chi tiết:\n- Cấu trúc: S + will use + O (solar energy) + to V (mục đích) + O.\n- 'the problem of energy shortage' là cụm danh từ cố định."
            },
            {
                "id": 5,
                "question": "Exercise 1. Q5: will/ They/ a/ build/ hydro power station/ next year/ in/ area/ this",
                "options": [
                    { "text": "They will build a hydro power station in this area next year.", "correct": true },
                    { "text": "They will build a hydro power station next year in this area.", "correct": false },
                    { "text": "They will build a station hydro power in this area next year.", "correct": false },
                    { "text": "They will build this hydro power station in a area next year.", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- build (v): xây dựng.\n- hydro power station (n): trạm thủy điện.\n- in this area (adv): ở khu vực này.\n- next year (adv): năm sau.\n\n2. Dịch nghĩa: Họ sẽ xây một trạm thủy điện ở khu vực này vào năm sau.\n\n3. Giải thích chi tiết:\n- Trật tự trạng từ: Nơi chốn (in this area) đứng trước Thời gian (next year)."
            },
            {
                "id": 6,
                "question": "Exercise 1. Q6: about / She / is / types / talking / of/ energy sources / renewable/.",
                "options": [
                    { "text": "She is talking about types of renewable energy sources.", "correct": true },
                    { "text": "She is talking about renewable types of energy sources.", "correct": false },
                    { "text": "She is talking about renewable energy sources of types.", "correct": false },
                    { "text": "She is about talking types of renewable energy sources.", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- talking about (v): nói về.\n- types of (n): các loại.\n- renewable energy sources (n): các nguồn năng lượng tái tạo.\n\n2. Dịch nghĩa: Cô ấy đang nói về các loại nguồn năng lượng tái tạo.\n\n3. Giải thích chi tiết:\n- Cấu trúc tiếp diễn: S + is talking + about + O.\n- Cụm danh từ: types of + (adj) renewable + (n) energy sources."
            },
            {
                "id": 7,
                "question": "Exercise 1. Q7: project / they / doing / Are / a/ protecting / on / environment /?",
                "options": [
                    { "text": "Are they doing a project on protecting environment?", "correct": true },
                    { "text": "Are they doing a protecting project on environment?", "correct": false },
                    { "text": "Are they protecting a project on doing environment?", "correct": false },
                    { "text": "Doing they are a project on protecting environment?", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- doing a project (vp): làm một dự án.\n- on (prep): về (chủ đề gì).\n- protecting environment (np): bảo vệ môi trường.\n\n2. Dịch nghĩa: Có phải họ đang làm một dự án về bảo vệ môi trường không?\n\n3. Giải thích chi tiết:\n- Câu hỏi Yes/No thì hiện tại tiếp diễn: Are + S + V-ing...?\n- Cấu trúc: project on + V-ing (dự án về việc gì)."
            },
            {
                "id": 8,
                "question": "Exercise 1. Q8: Does / wind / come / from / wind energy /?",
                "options": [
                    { "text": "Does wind energy come from wind?", "correct": true },
                    { "text": "Does wind come from wind energy?", "correct": false },
                    { "text": "Does come wind form wind energy?", "correct": false },
                    { "text": "Does wind energy from come wind?", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- wind energy (n): năng lượng gió.\n- come from (v): đến từ.\n- wind (n): gió.\n\n2. Dịch nghĩa: Có phải năng lượng gió đến từ gió không?\n\n3. Giải thích chi tiết:\n- Câu hỏi hiện tại đơn: Does + S (wind energy) + V (come) + from + O (wind)?"
            },
            {
                "id": 9,
                "question": "Exercise 1. Q9: going out / He / turns off / always / the lights / before /.",
                "options": [
                    { "text": "He always turns off the lights before going out.", "correct": true },
                    { "text": "He turns always off the lights before going out.", "correct": false },
                    { "text": "He always turns off the lights going out before.", "correct": false },
                    { "text": "Before going out he always turns off the lights.", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- always (adv): luôn luôn.\n- turns off (v): tắt.\n- before going out: trước khi ra ngoài.\n\n2. Dịch nghĩa: Anh ấy luôn tắt đèn trước khi ra ngoài.\n\n3. Giải thích chi tiết:\n- Trạng từ tần suất 'always' đứng trước động từ thường 'turns off'.\n- 'Before' + V-ing (going out)."
            },
            {
                "id": 10,
                "question": "Exercise 1. Q10: hydro energy / The / is / teacher / right now / teaching / about/ us/.",
                "options": [
                    { "text": "The teacher is teaching us about hydro energy right now.", "correct": true },
                    { "text": "The teacher is teaching about hydro energy us right now.", "correct": false },
                    { "text": "Right now the teacher is teaching us about hydro energy.", "correct": false },
                    { "text": "The teacher is teaching us about right now hydro energy.", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- teacher (n): giáo viên.\n- teaching us (vp): dạy chúng tôi.\n- about (prep): về.\n- right now (adv): ngay lúc này.\n\n2. Dịch nghĩa: Giáo viên đang dạy chúng tôi về năng lượng thủy điện ngay lúc này.\n\n3. Giải thích chi tiết:\n- Cấu trúc: S (The teacher) + is teaching + O (us) + about + O (hydro energy) + Time (right now)."
            },
            {
                "id": 11,
                "question": "Exercise 1. Q11: often / My father / water / other / uses / for / recycled / purposes.",
                "options": [
                    { "text": "My father often uses recycled water for other purposes.", "correct": true },
                    { "text": "My father uses often recycled water for other purposes.", "correct": false },
                    { "text": "My father often uses water recycled for other purposes.", "correct": false },
                    { "text": "My father often uses other water for recycled purposes.", "correct": false }
                ],
                "explanation": "1. Phân tích từ vựng:\n- often (adv): thường.\n- recycled water (n): nước tái chế.\n- other purposes (n): các mục đích khác.\n\n2. Dịch nghĩa: Bố tôi thường sử dụng nước tái chế cho các mục đích khác.\n\n3. Giải thích chi tiết:\n- S (My father) + adv (often) + V (uses) + O (recycled water) + prep (for) + O (other purposes)."
            },
            {
                "id": 12,
                "question": "Exercise 1. Q12: use / Do / you / in / energy / your house? / solar",
                "options": [
                    { "text": "Do you use solar energy in your house?", "correct": true },
                    { "text": "Do you use energy solar in your house?", "correct": false },
                    { "text": "Do you in your house use solar energy?", "correct": false },

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // Ding sound (High pitch sine wave sequence)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else {
                // Buzz sound (Low pitch sawtooth)
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- CONFETTI ENGINE ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    vx: Math.random() * 6 - 3,
                    vy: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    rotation: Math.random() * 360,
                    scale: Math.random() * 0.5 + 0.5
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += 2;
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-5 * p.scale, -5 * p.scale, 10 * p.scale, 10 * p.scale);
                ctx.restore();

                if (p.y > canvas.height) particles.splice(index, 1);
            });
            if (particles.length > 0) requestAnimationFrame(updateConfetti);
        }

        function fireConfetti() {
            createConfetti();
            updateConfetti();
        }

        // --- QUIZ LOGIC ---
        let score = 0;
        const totalQuestions = quizData.length;
        const userAnswers = new Array(totalQuestions).fill(null);

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `card-${index}`;

                // Create options HTML
                const optionsHtml = item.options.map((opt, optIndex) => `
                    <button class="option-btn" 
                            onclick="checkAnswer(${index}, ${optIndex}, ${opt.correct}, this)">
                        <span class="label">${String.fromCharCode(65 + optIndex)}.</span>
                        ${opt.text}
                    </button>
                `).join('');

                card.innerHTML = `
                    <div class="question-header">
                        <div class="question-number">${index + 1}</div>
                        <div class="question-text">${item.question}</div>
                    </div>
                    <div class="options-grid" id="options-${index}">
                        ${optionsHtml}
                    </div>
                    <div class="explanation-box" id="explanation-${index}">
                        <div class="explanation-header">📚 Giải thích chi tiết:</div>
                        <div class="explanation-content">${item.explanation}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswer(questionIndex, optIndex, isCorrect, btnElement) {
            // Prevent changing answer if already answered (optional, currently allowing retries for learning but highlighting first attempt logic usually locks)
            // Requirement: "Ngay khi học sinh chọn đáp án... hiện ra khung giải thích".
            
            const optionsContainer = document.getElementById(`options-${questionIndex}`);
            const buttons = optionsContainer.getElementsByClassName('option-btn');
            
            // Disable all buttons in this question to prevent multi-guessing for scoring purpose
            // But for learning, seeing the right answer is important.
            // Let's mark the clicked one.
            
            // If this question is already answered/locked, do nothing
            if (userAnswers[questionIndex] !== null) return;
            
            userAnswers[questionIndex] = isCorrect;
            
            if (isCorrect) {
                btnElement.classList.add('correct');
                playSound('correct');
                fireConfetti();
                score++;
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                
                // Highlight the correct answer automatically if wrong
                Array.from(buttons).forEach((btn, idx) => {
                    if (quizData[questionIndex].options[idx].correct) {
                        setTimeout(() => btn.classList.add('correct'), 600); // Small delay
                    }
                });
            }

            // Lock buttons style
            Array.from(buttons).forEach(btn => {
                btn.disabled = true;
                btn.style.cursor = 'default';
            });

            // Show explanation
            const expBox = document.getElementById(`explanation-${questionIndex}`);
            expBox.classList.add('show');
        }

        function submitQuiz() {
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                const confirmSubmit = confirm(`Em còn ${unanswered} câu chưa làm. Em có chắc chắn muốn nộp bài không?`);
                if (!confirmSubmit) return;
            }

            const finalScore = userAnswers.filter(a => a === true).length;
            document.getElementById('finalScore').innerText = `${finalScore}/${totalQuestions}`;
            
            let msg = "";
            if (finalScore === totalQuestions) msg = "Xuất sắc! Em là thiên tài ngữ pháp! 🌟";
            else if (finalScore >= totalQuestions * 0.8) msg = "Rất tốt! Cố gắng thêm chút nữa là hoàn hảo! 🎉";
            else if (finalScore >= totalQuestions * 0.5) msg = "Khá tốt, nhưng cần ôn lại phần giải thích nhé! 💪";
            else msg = "Đừng buồn, hãy xem kỹ phần giải thích để tiến bộ hơn nhé! 📚";
            
            document.getElementById('resultMessage').innerText = msg;
            document.getElementById('resultModal').style.display = 'flex';
            
            // Play winning sound if score is good
            if (finalScore > 0) playSound('correct');
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        // Start
        initQuiz();

    </script>
