<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Nâng Cao: Word Form, Error Correction & Writing - Ms. Chí Nên </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-gradient: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%); /* Fallback */
            --bg-fancy: radial-gradient(circle at 10% 20%, rgb(139, 100, 235) 0%, rgb(11, 203, 175) 90%);
            --card-bg: #ffffff;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --shadow-btn: 0px 5px 0px 0px;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Prevent text selection for game feel */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-fancy);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: var(--text-dark);
            background-attachment: fixed;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* Header */
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            margin: 0;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.4);
        }

        header p {
            font-size: 1.2rem;
            margin-top: 10px;
            font-weight: 600;
        }

        /* Question Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 4px solid white;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
        }

        .question-badge {
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #2d3436;
        }

        .question-text strong {
            color: var(--primary-purple);
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Option Button Styling */
        .btn-option {
            background: #f1f2f6;
            border: 2px solid #dfe4ea;
            border-bottom: 5px solid #ced6e0; /* 3D effect */
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: left;
            position: relative;
            outline: none;
            display: flex;
            align-items: center;
        }

        .btn-option:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .btn-option:hover:not(:disabled) {
            background: white;
            border-color: var(--primary-purple);
        }

        /* Correct State */
        .btn-option.correct {
            background: var(--correct-green) !important;
            color: white !important;
            border-color: #00b85c !important;
            border-bottom-color: #008f47 !important;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Wrong State */
        .btn-option.wrong {
            background: var(--wrong-red) !important;
            color: white !important;
            border-color: #ff2e40 !important;
            border-bottom-color: #d63031 !important;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .btn-option:disabled {
            cursor: default;
            opacity: 0.8;
        }

        /* Explanation Box */
        .explanation-box {
            background: #f0fff4; /* Light green tint */
            border: 2px dashed var(--correct-green);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none; /* Hidden by default */
            animation: fadeIn 0.5s ease;
        }
        
        .explanation-box.show {
            display: block;
        }

        .explanation-header {
            font-weight: 800;
            color: var(--primary-purple);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #4a4a4a;
            white-space: pre-wrap; /* Preserve newlines from data */
        }

        /* Submit Button */
        #submit-container {
            text-align: center;
            margin-top: 40px;
        }

        .btn-submit {
            background: #ffeaa7;
            color: #d35400;
            border: none;
            border-bottom: 6px solid #e67e22;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-submit:hover {
            background: #fff;
            transform: scale(1.05);
        }

        .btn-submit:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        /* Modal Score */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: zoomIn 0.4s ease;
            border: 5px solid var(--primary-purple);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary-teal);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; margin-top: 0; }
            to { opacity: 1; margin-top: 20px; }
        }
        
        /* Canvas for confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <h1>⚡ ENERGY ADVANCED QUIZ</h1>
        <p>Giáo viên: Ms. Chí Nên ()</p>
    </header>

    <div class="container" id="quiz-container">
        <!-- Questions will be injected here via JS -->
    </div>

    <div id="submit-container">
        <button class="btn-submit" onclick="showResult()">NỘP BÀI & XEM ĐIỂM 🏆</button>
    </div>

    <!-- Modal Result -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div class="score-circle" id="score-display">0/0</div>
            <h2 id="feedback-title" style="color: var(--primary-purple); margin: 10px 0;">Tuyệt vời!</h2>
            <p id="feedback-text" style="color: #636e72; font-size: 1.1rem;">Bạn đã hoàn thành bài kiểm tra.</p>
            <button class="btn-submit" style="font-size: 1rem; padding: 10px 30px; margin-top: 20px;" onclick="closeModal()">Xem lại bài</button>
        </div>
    </div>

    <script>
        // --- DATA SOURCE ---
        const quizData = [
  {
   "questionNumber": 1,
   "question": "Solar, wind, and hydro are ____________ and inexhaustible. (renew)",
   "answerOptions": [
    {
     "text": "renewable",
     "rationale": "1. Phân tích từ vựng:\n- Renew (v): làm mới.\n- Renewable (adj): có thể tái tạo.\n- Renewal (n): sự đổi mới.\n\n2. Dịch nghĩa toàn câu: \"Năng lượng mặt trời, gió và thủy điện là có thể tái tạo và vô tận.\"\n\n3. Giải thích chi tiết:\n- Vị trí sau động từ to be \"are\" cần một tính từ (Adjective).\n- Cấu trúc song song với tính từ \"inexhaustible\" (vô tận).\n- \"Renewable\" là đáp án chính xác.",
     "isCorrect": true
    },
    {
     "text": "renewal",
     "rationale": "Đây là danh từ (Noun), không đứng sau to be để miêu tả đặc điểm trong ngữ cảnh này.",
     "isCorrect": false
    },
    {
     "text": "renewed",
     "rationale": "Mang nghĩa \"được làm mới\" (bị động/quá khứ), không phải tính chất \"có khả năng tái tạo\".",
     "isCorrect": false
    },
    {
     "text": "new",
     "rationale": "Sai từ gốc đề bài yêu cầu.",
     "isCorrect": false
    }
   ],
   "hint": "Cần một tính từ mang nghĩa 'có thể tái tạo'."
  },
  {
   "questionNumber": 2,
   "question": "Coal is also ____________; there is a large reserve globally. (plenty)",
   "answerOptions": [
    {
     "text": "plentiful",
     "rationale": "1. Phân tích từ vựng:\n- Plenty (n/pronoun): sự phong phú, nhiều.\n- Plentiful (adj): dồi dào, phong phú.\n\n2. Dịch nghĩa toàn câu: \"Than đá cũng rất dồi dào; có một trữ lượng lớn trên toàn cầu.\"\n\n3. Giải thích chi tiết:\n- Sau \"is\" cần một tính từ bổ nghĩa cho chủ ngữ \"Coal\".\n- \"Plentiful\" nghĩa là có số lượng lớn, phù hợp với vế sau \"large reserve\".",
     "isCorrect": true
    },
    {
     "text": "plenty",
     "rationale": "Đây là danh từ hoặc đại từ, không dùng làm tính từ miêu tả than đá.",
     "isCorrect": false
    },
    {
     "text": "plentifully",
     "rationale": "Đây là trạng từ (Adverb).",
     "isCorrect": false
    },
    {
     "text": "plenties",
     "rationale": "Từ này không tồn tại dạng số nhiều như vậy trong ngữ cảnh này.",
     "isCorrect": false
    }
   ],
   "hint": "Tính từ của 'plenty' nghĩa là dồi dào."
  },
  {
   "questionNumber": 3,
   "question": "The movement of waves and tides can be used to generate ____________. (electric)",
   "answerOptions": [
    {
     "text": "electricity",
     "rationale": "1. Phân tích từ vựng:\n- Electric (adj): thuộc về điện.\n- Electricity (n): điện năng.\n- Electrical (adj): liên quan đến thiết bị điện.\n\n2. Dịch nghĩa toàn câu: \"Sự chuyển động của sóng và thủy triều có thể được sử dụng để tạo ra điện.\"\n\n3. Giải thích chi tiết:\n- Sau động từ \"generate\" (tạo ra) cần một danh từ (Noun) làm tân ngữ.\n- \"Electricity\" là danh từ chỉ điện năng.",
     "isCorrect": true
    },
    {
     "text": "electric",
     "rationale": "Đây là tính từ.",
     "isCorrect": false
    },
    {
     "text": "electrical",
     "rationale": "Đây cũng là tính từ.",
     "isCorrect": false
    },
    {
     "text": "electrician",
     "rationale": "Đây là danh từ chỉ người (thợ điện).",
     "isCorrect": false
    }
   ],
   "hint": "Danh từ chỉ 'điện năng'."
  },
  {
   "questionNumber": 4,
   "question": "Scientists are looking for clean and ____________ sources of energy. (effect)",
   "answerOptions": [
    {
     "text": "effective",
     "rationale": "1. Phân tích từ vựng:\n- Effect (n): hiệu ứng/tác động.\n- Effective (adj): hiệu quả.\n- Effectively (adv): một cách hiệu quả.\n\n2. Dịch nghĩa toàn câu: \"Các nhà khoa học đang tìm kiếm các nguồn năng lượng sạch và hiệu quả.\"\n\n3. Giải thích chi tiết:\n- Cấu trúc song song: \"clean\" (tính từ) and [tính từ].\n- Cần tính từ bổ nghĩa cho danh từ \"sources\".",
     "isCorrect": true
    },
    {
     "text": "effect",
     "rationale": "Đây là danh từ.",
     "isCorrect": false
    },
    {
     "text": "affect",
     "rationale": "Đây là động từ (tác động).",
     "isCorrect": false
    },
    {
     "text": "effectively",
     "rationale": "Đây là trạng từ.",
     "isCorrect": false
    }
   ],
   "hint": "Tính từ mang nghĩa 'hiệu quả'."
  },
  {
   "questionNumber": 5,
   "question": "Non-renewable sources are not ____________ friendly and can have serious effect on our health. (environment)",
   "answerOptions": [
    {
     "text": "environmentally",
     "rationale": "1. Phân tích từ vựng:\n- Environment (n): môi trường.\n- Environmental (adj): thuộc về môi trường.\n- Environmentally (adv): về mặt môi trường.\n\n2. Dịch nghĩa toàn câu: \"Các nguồn không tái tạo không thân thiện với môi trường và có thể gây ảnh hưởng nghiêm trọng đến sức khỏe.\"\n\n3. Giải thích chi tiết:\n- Cụm từ cố định: \"Environmentally friendly\" (thân thiện với môi trường).\n- Ở đây \"friendly\" là tính từ, nên cần một TRẠNG TỪ (Adverb) đứng trước để bổ nghĩa cho nó.",
     "isCorrect": true
    },
    {
     "text": "environmental",
     "rationale": "Tính từ không bổ nghĩa cho tính từ khác (\"friendly\") trong cụm này.",
     "isCorrect": false
    },
    {
     "text": "environment",
     "rationale": "Danh từ không đứng ở vị trí này.",
     "isCorrect": false
    },
    {
     "text": "environmentalist",
     "rationale": "Danh từ chỉ nhà môi trường học.",
     "isCorrect": false
    }
   ],
   "hint": "Cụm '... friendly' cần một trạng từ."
  },
  {
   "questionNumber": 6,
   "question": "Natural gas is less ____________ than coal or crude oil. (pollute)",
   "answerOptions": [
    {
     "text": "polluting",
     "rationale": "1. Phân tích từ vựng:\n- Pollute (v): làm ô nhiễm.\n- Polluting (adj): gây ô nhiễm.\n- Pollution (n): sự ô nhiễm.\n\n2. Dịch nghĩa toàn câu: \"Khí tự nhiên ít gây ô nhiễm hơn than đá hoặc dầu thô.\"\n\n3. Giải thích chi tiết:\n- So sánh hơn với \"less\" + tính từ dài.\n- Cần tính từ mang nghĩa chủ động (gây ra sự ô nhiễm) -> Polluting.",
     "isCorrect": true
    },
    {
     "text": "pollution",
     "rationale": "Đây là danh từ.",
     "isCorrect": false
    },
    {
     "text": "polluted",
     "rationale": "Đây là tính từ bị động (bị ô nhiễm), ví dụ \"polluted water\". Ở đây gas GÂY RA ô nhiễm nên dùng V-ing.",
     "isCorrect": false
    },
    {
     "text": "pollutant",
     "rationale": "Danh từ chỉ chất gây ô nhiễm.",
     "isCorrect": false
    }
   ],
   "hint": "Tính từ chủ động (V-ing) chỉ đặc tính gây ô nhiễm."
  },
  {
   "questionNumber": 7,
   "question": "A greenhouse stays warm because the glass traps the ____________ of the sun. (hot)",
   "answerOptions": [
    {
     "text": "heat",
     "rationale": "1. Phân tích từ vựng:\n- Hot (adj): nóng.\n- Heat (n): sức nóng/nhiệt.\n- Heat (v): làm nóng.\n\n2. Dịch nghĩa toàn câu: \"Nhà kính giữ ấm vì lớp kính giữ lại nhiệt của mặt trời.\"\n\n3. Giải thích chi tiết:\n- Sau mạo từ \"the\" cần một danh từ.\n- Danh từ của \"hot\" là \"heat\".",
     "isCorrect": true
    },
    {
     "text": "hotness",
     "rationale": "Mặc dù là danh từ nhưng ít dùng trong ngữ cảnh vật lý/khoa học này. \"Heat\" là từ chính xác chỉ nhiệt năng.",
     "isCorrect": false
    },
    {
     "text": "hotter",
     "rationale": "So sánh hơn.",
     "isCorrect": false
    },
    {
     "text": "heating",
     "rationale": "Danh động từ/hệ thống sưởi.",
     "isCorrect": false
    }
   ],
   "hint": "Danh từ của 'hot' (nhiệt)."
  },
  {
   "questionNumber": 8,
   "question": "Turning off electrical appliances when they are not in use is a great way to reduce energy ____________. (consume)",
   "answerOptions": [
    {
     "text": "consumption",
     "rationale": "1. Phân tích từ vựng:\n- Consume (v): tiêu thụ.\n- Consumption (n): sự tiêu thụ.\n- Consumer (n): người tiêu dùng.\n\n2. Dịch nghĩa toàn câu: \"Tắt thiết bị điện khi không sử dụng là cách tuyệt vời để giảm sự tiêu thụ năng lượng.\"\n\n3. Giải thích chi tiết:\n- Cụm danh từ ghép \"Energy consumption\" (sự tiêu thụ năng lượng).\n- Cần danh từ sau động từ \"reduce\".",
     "isCorrect": true
    },
    {
     "text": "consumer",
     "rationale": "Sai nghĩa (người tiêu dùng).",
     "isCorrect": false
    },
    {
     "text": "consuming",
     "rationale": "Thường dùng làm tính từ (time-consuming).",
     "isCorrect": false
    },
    {
     "text": "consumed",
     "rationale": "Động từ quá khứ.",
     "isCorrect": false
    }
   ],
   "hint": "Danh từ chỉ 'sự tiêu thụ'."
  },
  {
   "questionNumber": 9,
   "question": "FIND THE MISTAKE: The burning of fossil fuels is harmful **for** the environment and public health.",
   "answerOptions": [
    {
     "text": "for -> to",
     "rationale": "1. Phân tích lỗi sai:\n- Cấu trúc tính từ: \"Harmful\" đi với giới từ \"to\".\n- Harmful to something/somebody (Có hại cho cái gì/ai).\n\n2. Sửa lỗi: Thay \"for\" bằng \"to\".\n\n3. Dịch nghĩa: \"Việc đốt nhiên liệu hóa thạch có hại cho môi trường và sức khỏe cộng đồng.\"",
     "isCorrect": true
    },
    {
     "text": "burning -> burn",
     "rationale": "Sai. \"The burning\" là danh từ đóng vai trò chủ ngữ là đúng.",
     "isCorrect": false
    },
    {
     "text": "is -> are",
     "rationale": "Sai. Chủ ngữ chính là \"The burning\" (số ít) nên dùng \"is\".",
     "isCorrect": false
    },
    {
     "text": "and -> or",
     "rationale": "Sai. \"And\" dùng để liệt kê cả 2 đối tượng bị ảnh hưởng là đúng.",
     "isCorrect": false
    }
   ],
   "hint": "Giới từ đi sau 'harmful'."
  },

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'success') {
                // Ding sound
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'error') {
                // Buzz sound
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();

        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');

        let confetti = [];
        const confettiColors = ['#f2d74e', '#95c3de', '#ff9a91', '#f2d74e', '#5aadf0'];

        function triggerConfetti() {
            for (let i = 0; i < 100; i++) {
                confetti.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    size: Math.random() * 5 + 5,
                    speed: Math.random() * 5 + 2,
                    angle: Math.random() * 6.28
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confetti.forEach((p, index) => {
                p.y += p.speed;
                p.x += Math.sin(p.angle) * 2;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.y > confettiCanvas.height) confetti.splice(index, 1);
            });
            if (confetti.length > 0) requestAnimationFrame(animateConfetti);
        }

            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                
                // Determine Section Title (Logic based on question content patterns)
                let sectionTitle = "Question";
                if(item.question.includes("(renew)") || item.question.includes("(plenty)")) sectionTitle = "Word Form";
                else if(item.question.includes("FIND THE MISTAKE")) sectionTitle = "Error Correction";
                else if(item.question.includes("Build sentence")) sectionTitle = "Writing";
                
                // Format Question (Markdown to HTML basics)
                const formattedQuestion = item.question.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                let html = `
                    <div class="question-badge">Câu ${item.questionNumber} - ${sectionTitle}</div>
                    <div class="question-text">${formattedQuestion}</div>
                    <div class="options-grid">
                `;

                // Add Options
                item.answerOptions.forEach((opt, optIndex) => {
                    const isCorrect = opt.isCorrect;
                    html += `<button class="btn-option" onclick="checkAnswer(this, ${isCorrect}, 'explanation-${index}', ${index})">
                        ${String.fromCharCode(65 + optIndex)}. ${opt.text}
                    </button>`;
                });

                html += `</div>`;
                
                // Explanation Box (Hidden)
                // Need to find the correct rationale logic. In the data, each option has a rationale.
                // But the requirement says "Show explanation for correct choice" and analyze others.
                // The dataset provides specific rationales for specific options in some cases, or a general rationale attached to the correct one.
                // We will consolidate all rationales into one display block.
                
                // Find correct option for Main Explanation
                const correctOpt = item.answerOptions.find(o => o.isCorrect);
                let explanationText = correctOpt.rationale; 

                // If specific options have specific rationales (like "Wrong because..."), append them?
                // The current data structure has the FULL rationale in the correct answer for most questions (based on the sample data provided).
                // Let's rely on the Correct Option's rationale as the main source of truth as it follows the "1. Analysis... 2. Translation... 3. Explain" format in the sample.

                html += `
                    <div id="explanation-${index}" class="explanation-box">
                        <div class="explanation-header">
                            <span>👩‍🏫</span> Ms. Chí Nên giải thích:
                        </div>
                        <div class="explanation-content">${explanationText}</div>
                    </div>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // --- INTERACTION LOGIC ---
        function checkAnswer(btn, isCorrect, explanationId, qIndex) {
            // Prevent multiple clicks
            const card = btn.closest('.quiz-card');
            const buttons = card.querySelectorAll('.btn-option');
            buttons.forEach(b => b.disabled = true);

            const explanationBox = document.getElementById(explanationId);

            if (isCorrect) {
                btn.classList.add('correct');
                playSound('success');
                triggerConfetti();
                correctCount++;
            } else {
                btn.classList.add('wrong');
                playSound('error');
                // Find and highlight correct answer
                const correctBtn = Array.from(buttons).find(b => b.textContent.includes(quizData[qIndex].answerOptions.find(o => o.isCorrect).text));
                if (correctBtn) correctBtn.classList.add('correct');
            }

            // Show explanation
            explanationBox.classList.add('show');
        }

        // --- RESULT LOGIC ---
        function showResult() {
            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('score-display');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');

            scoreDisplay.textContent = `${correctCount}/${quizData.length}`;
            modal.style.display = 'flex';
            
            const percentage = (correctCount / quizData.length) * 100;
            
            if (percentage === 100) {
                feedbackTitle.textContent = "Xuất sắc! 🌟";
                feedbackText.textContent = "Em đã nắm vững kiến thức rồi đấy. Tự hào về em!";
                triggerConfetti();
            } else if (percentage >= 70) {
                feedbackTitle.textContent = "Làm tốt lắm! 👍";
                feedbackText.textContent = "Em hãy xem lại phần giải thích các câu sai để đạt điểm tối đa nhé!";
            } else {
                feedbackTitle.textContent = "Cố gắng thêm nhé! 💪";
                feedbackText.textContent = "Đừng nản lòng, hãy đọc kỹ phần giải thích của Ms. Chí Nên để hiểu bài hơn.";
            }
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // Initialize
        renderQuiz();

    </script>
</body>
</html>
