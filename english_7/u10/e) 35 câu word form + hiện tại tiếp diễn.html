<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 10: Word Forms & Present Continuous Tense - Ms. Chí Nên </title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f3f5;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Prevent text selection for game feel */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFDEE9;
            background-image: linear-gradient(0deg, #FFDEE9 0%, #B5FFFC 100%);
            /* Zigzag pattern overlay */
            background-image:  linear-gradient(135deg, #8854c0 25%, transparent 25%), linear-gradient(225deg, #8854c0 25%, transparent 25%), linear-gradient(45deg, #8854c0 25%, transparent 25%), linear-gradient(315deg, #8854c0 25%, #e5e5f7 25%);
            background-position:  10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            background-repeat: repeat;
            opacity: 1;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text-color);
        }

        /* Container styled like a game board */
        #game-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15), 0 0 0 10px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            position: relative;
            margin-top: 20px;
            margin-bottom: 50px;
            border: 4px solid var(--primary-purple);
        }

        /* Header */
        header {
            background-color: var(--primary-purple);
            color: white;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 4px solid #6c429c;
            position: relative;
        }

        h1 {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .sub-header {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* Progress Bar */
        .progress-container {
            background: #dfe6e9;
            height: 12px;
            width: 100%;
            border-radius: 0;
        }

        .progress-bar {
            background: var(--primary-teal);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 0 6px 6px 0;
        }

        /* Question Area */
        .question-card {
            padding: 30px;
            text-align: center;
        }

        .question-number {
            display: inline-block;
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 #6c429c;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #2d3436;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 3D Button Style */
        .option-btn {
            background: white;
            border: 2px solid #dfe6e9;
            border-bottom: 6px solid #dfe6e9;
            border-radius: 15px;
            padding: 15px 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-purple);
            border-bottom-color: var(--primary-purple);
            background-color: #f8f0ff;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-top: 4px; /* to keep layout stable */
            margin-bottom: -4px;
        }

        /* Correct State */
        .option-btn.correct {
            background-color: var(--correct-green);
            color: white;
            border-color: #00b85c;
            border-bottom-color: #008f47;
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        /* Wrong State */
        .option-btn.wrong {
            background-color: var(--wrong-red);
            color: white;
            border-color: #e63b49;
            border-bottom-color: #c0392b;
            animation: shake 0.5s;
        }

        /* Disabled State */
        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
            transform: none !important;
        }

        /* Shake Animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Explanation Box */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 25px;
            background: #fff;
            border: 3px solid var(--primary-teal);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .teacher-avatar {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 2px dashed #dfe6e9;
            padding-bottom: 10px;
        }

        .teacher-avatar i {
            font-size: 1.5rem;
            color: var(--primary-purple);
            margin-right: 10px;
            background: #e9d5ff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .teacher-name {
            font-weight: 800;
            color: var(--primary-purple);
            font-family: 'Quicksand', sans-serif;
        }

        .explanation-content {
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap; /* Keeps formatting from JSON */
            color: #444;
        }

        .explanation-content strong {
            color: var(--primary-purple);
        }

        /* Navigation Buttons */
        .nav-area {
            display: flex;
            justify-content: space-between; /* Space out buttons */
            align-items: center;
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
        }

        .nav-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            border-bottom: 4px solid #6c429c;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-btn.prev-btn {
            background: #a4b0be; /* Grey for back button */
            border-bottom: 4px solid #747d8c;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .nav-btn:active {
            transform: translateY(2px);
            border-bottom-width: 0px;
            margin-top: 4px;
            margin-bottom: -4px;
        }

        .nav-btn:disabled {
            background: #ccc;
            border-bottom-color: #999;
            cursor: not-allowed;
            transform: none;
        }

        /* Score Badge */
        .score-badge {
            background: var(--primary-teal);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 3px 0 #009e82;
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 5px solid var(--primary-purple);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .final-score {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-teal);
            margin: 10px 0;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }

        .result-message {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #636e72;
        }

        /* Custom Scrollbar for lengthy explanations */
        .explanation-box::-webkit-scrollbar {
            width: 8px;
        }
        .explanation-box::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .explanation-box::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <h1><i class="fas fa-graduation-cap"></i> Ms. Chí Nên </h1>
            <div class="sub-header">Unit 10: Word Forms & Present Continuous Tense</div>
        </header>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="quiz-area">
            <!-- Questions will be injected here via JS -->
        </div>

        <div class="nav-area">
            <div class="score-badge"><i class="fas fa-star"></i> <span id="current-score">0</span></div>
            <div style="display: flex; gap: 10px;">
                <button id="prev-btn" class="nav-btn prev-btn" onclick="prevQuestion()" disabled><i class="fas fa-arrow-left"></i> Câu trước</button>
                <button id="next-btn" class="nav-btn" onclick="nextQuestion()" style="display: none;">Câu tiếp theo <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color: var(--primary-purple); margin:0;">TỔNG KẾT</h2>
            <div class="final-score" id="final-score-display">0/0</div>
            <p class="result-message" id="result-message">Bạn đã làm rất tốt!</p>
            <button class="nav-btn" onclick="location.reload()" style="width: 100%; justify-content: center;">Làm lại bài thi <i class="fas fa-redo"></i></button>
        </div>
    </div>

    <script>
        // --- DATA SOURCE ---
        const quizData = [
    {
      "questionNumber": 1,
      "question": "Tidal energy is renewable, ______ (plenty), and clean. (Ex 10)",
      "answerOptions": [
        {
          "text": "plentiful",
          "rationale": "1. Phân tích từ vựng:\n- plenty (noun): sự phong phú.\n- plentiful (adj): phong phú, dồi dào.\n- plentitude (noun): sự sung túc.\n- plentifully (adv): một cách phong phú.\n2. Dịch nghĩa: \"Năng lượng thủy triều thì có thể tái tạo, dồi dào và sạch.\"\n3. Tại sao chọn đáp án này?\n- Cấu trúc liệt kê: renewable (adj), ______ , and clean (adj). Vị trí cần một Tính từ (Adjective) để tương đồng với các từ còn lại.",
          "isCorrect": true
        },
        { "text": "plenty", "rationale": "Danh từ/Đại từ -> Sai từ loại.", "isCorrect": false },
        { "text": "plentitude", "rationale": "Danh từ -> Sai từ loại.", "isCorrect": false },
        { "text": "plentifully", "rationale": "Trạng từ -> Sai từ loại.", "isCorrect": false }
      ]
    },
    {
      "questionNumber": 2,
      "question": "Wind will be used as an ______ (environment) friendly source of energy. (Ex 10)",
      "answerOptions": [
        {
          "text": "environmentally",
          "rationale": "1. Phân tích từ vựng:\n- environment (noun): môi trường.\n- environmental (adj): thuộc về môi trường.\n- environmentally (adv): về mặt môi trường.\n- environmentalist (noun): nhà môi trường học.\n2. Dịch nghĩa: \"Gió sẽ được sử dụng như một nguồn năng lượng thân thiện với môi trường.\"\n3. Tại sao chọn đáp án này?\n- Cụm từ ghép: 'environmentally friendly' (thân thiện với môi trường). Trạng từ 'environmentally' bổ nghĩa cho tính từ 'friendly'.",
          "isCorrect": true
        },
        { "text": "environmental", "rationale": "Tính từ không bổ nghĩa cho tính từ theo cách này trong cụm từ ghép.", "isCorrect": false },
        { "text": "environment", "rationale": "Danh từ.", "isCorrect": false },
        { "text": "environmentalist", "rationale": "Danh từ chỉ người.", "isCorrect": false }

    },
    {
      "questionNumber": 3,
      "question": "There are many ways will be used to solve the problem of ______ (pollute). (Ex 10)",

          "isCorrect": true
        },
        { "text": "pollute", "rationale": "Động từ.", "isCorrect": false },
        { "text": "pollutant", "rationale": "Chất gây ô nhiễm (đếm được), ngữ cảnh này nói về hiện tượng ô nhiễm chung.", "isCorrect": false },
        { "text": "polluted", "rationale": "Tính từ.", "isCorrect": false }

    },
    {

      ]
    },
    {
      "questionNumber": 9,
      "question": "We should reduce the use of ______ (electrical) at home. (Ex 10)",
      "answerOptions": [

        let answersState = new Array(quizData.length).fill(null); // Track if question is answered

        const quizArea = document.getElementById('quiz-area');
        const progressBar = document.getElementById('progress-bar');
        const currentScoreEl = document.getElementById('current-score');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Sounds (Base64 placeholders - replaced with actual short beeps for portability)
        // Correct: Ding
        const correctSound = new Audio("data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="); 
        // Note: Browsers block autoplay/Audio without interaction. Using a real buzzer/chime data URI is too long for this snippet, so we simulate visual effects heavily.

        function initQuiz() {
            renderQuestion(0);
        }

        function renderQuestion(index) {
            currentQuestionIndex = index;
            const q = quizData[index];
            
            // Update Progress Bar
            const progress = ((index + 1) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Update Buttons
            prevBtn.disabled = index === 0;
            if (index === quizData.length - 1) {
                nextBtn.innerHTML = 'Nộp bài <i class="fas fa-flag-checkered"></i>';
                nextBtn.onclick = finishQuiz;
            } else {
                nextBtn.innerHTML = 'Câu tiếp theo <i class="fas fa-arrow-right"></i>';
                nextBtn.onclick = nextQuestion;
            }
            // Only show Next button if answered or browsing back
            nextBtn.style.display = answersState[index] ? 'flex' : 'none';

            // HTML Construction
            let html = `
                <div class="question-card">
                    <div class="question-number">Câu hỏi ${index + 1}/${quizData.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid">
            `;

            q.answerOptions.forEach((opt, i) => {
                let btnClass = "option-btn";
                let disabledAttr = "";
                let icon = "";
                
                // If already answered, apply styling state
                if (answersState[index]) {
                    disabledAttr = "disabled";
                    if (opt.isCorrect) {
                        btnClass += " correct";
                        icon = '<i class="fas fa-check-circle" style="margin-left:auto; color:white;"></i>';
                    } else if (answersState[index].selected === i) {
                        btnClass += " wrong";
                        icon = '<i class="fas fa-times-circle" style="margin-left:auto; color:white;"></i>';
                    }
                }

                html += `
                    <button class="${btnClass}" onclick="checkAnswer(${index}, ${i})" ${disabledAttr}>
                        <span style="background:var(--primary-purple); color:white; width:25px; height:25px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; margin-right:10px; font-size:0.8rem;">${String.fromCharCode(65+i)}</span>
                        ${opt.text}
                        ${icon}
                    </button>
                `;
            });

            html += `</div>`; // End options-grid

            // Explanation Section
            if (answersState[index]) {
                const selectedOpt = q.answerOptions[answersState[index].selected];
                const correctOpt = q.answerOptions.find(o => o.isCorrect);
                
                html += `
                    <div class="explanation-box" style="display:block;">
                        <div class="teacher-avatar">
                            <i class="fas fa-user-graduate"></i>
                            <span class="teacher-name">Ms. Chí Nên giải thích:</span>
                        </div>
                        <div class="explanation-content">
                            ${correctOpt.rationale.replace(/\n/g, '<br>')}
                            <br><br>
                            ${selectedOpt.isCorrect ? 
                                '<strong style="color:var(--correct-green)">Chúc mừng em! Em đã chọn chính xác.</strong>' : 
                                '<strong style="color:var(--wrong-red)">Đừng buồn nhé! Hãy xem kỹ giải thích bên trên.</strong>'}
                        </div>
                    </div>
                `;
            }

            html += `</div>`; // End question-card
            quizArea.innerHTML = html;
        }

        function checkAnswer(qIndex, optIndex) {
            const q = quizData[qIndex];
            const isCorrect = q.answerOptions[optIndex].isCorrect;

            // Save State
            answersState[qIndex] = { selected: optIndex, isCorrect: isCorrect };

            // Update Score
            if (isCorrect) {
                score++;
                currentScoreEl.innerText = score;
                triggerConfetti();
                playSound('ding');
            } else {
                playSound('buzz');
            }

            // Re-render to show feedback and explanation immediately
            renderQuestion(qIndex);
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                renderQuestion(currentQuestionIndex + 1);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                renderQuestion(currentQuestionIndex - 1);
            }
        }

        function finishQuiz() {
            document.getElementById('result-modal').style.display = 'flex';
            document.getElementById('final-score-display').innerText = `${score}/${quizData.length}`;
            
            const msg = document.getElementById('result-message');
            const percentage = (score / quizData.length) * 100;
            
            if (percentage === 100) {
                msg.innerText = "Tuyệt vời! Em là thiên tài tiếng Anh! 🌟";
                triggerConfetti();
                setTimeout(triggerConfetti, 500);
            } else if (percentage >= 80) {
                msg.innerText = "Rất tốt! Em nắm bài rất chắc chắn! 🎉";
            } else if (percentage >= 50) {
                msg.innerText = "Cố gắng lên! Em đã làm khá tốt. 💪";
            } else {
                msg.innerText = "Hãy ôn tập thêm và thử lại nhé! Cô tin em làm được! 📚";
            }
        }

        function playSound(type) {
            // Simple oscillator beeps since external files can be unreliable in single HTML
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'ding') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.1); // C6
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#FF4757', '#F1C40F']
            });
        }

        // Start
        initQuiz();

    </script>
</body>
</html>
