<style>
:root{
  --blue:#3DA5FF; --orange:#FF9F45; --grn:#36D399; --red:#FF6B81; --ylw:#FFD23F; --pur:#A88BFA; --teal:#2DD4BF;

  --c-word:#3DA5FF; --c-mean:#FFB066; --c-grammar:#FF6B81; --c-phon:#A88BFA;
  --ink:#E9F0F8; --glass:rgba(255,255,255,.055); --glass-strong:rgba(255,255,255,.09);
  --stroke:rgba(255,255,255,.16);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  min-height:100vh; position:relative; overflow-x:hidden;
  background:linear-gradient(-45deg,#0b1626,#102132,#0a3540,#122a44,#0d1d33,#0b1626);
  background-size:400% 400%; animation:flow 22s ease infinite;
}
body::before{content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none; opacity:.4;
  background-image:
    repeating-linear-gradient(60deg, transparent 0 78px, var(--blue) 78px 82px, transparent 82px 160px),
    repeating-linear-gradient(-60deg, transparent 0 120px, var(--orange) 120px 124px, transparent 124px 240px),

@media (prefers-reduced-motion:reduce){body{animation:none}.float-layer{display:none}body::before{opacity:.18}}

.float-layer{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.float-layer span{position:absolute; opacity:.5; animation:rise linear infinite;}
@keyframes rise{0%{transform:translateY(20px) rotate(0deg); opacity:0}10%{opacity:.55}90%{opacity:.55}100%{transform:translateY(-115vh) rotate(20deg); opacity:0}}

.wrap{position:relative; z-index:2; max-width:860px; margin:0 auto; padding:18px 16px 120px;}

header.top{text-align:center; padding:24px 18px; margin-bottom:22px; border-radius:22px; position:relative; overflow:hidden;

header.top::before{content:""; position:absolute; top:0; left:0; right:0; height:6px;

.teacher-tag{display:inline-block; font-size:.78rem; font-weight:900; letter-spacing:.5px;

header.top h1{margin:6px 0 6px; font-size:1.7rem; font-weight:900; line-height:1.15; color:#fff; letter-spacing:.5px;}
header.top p{margin:0; font-weight:700; color:#a9c2dd; font-size:.98rem;}
.lantern-row{font-size:1.5rem; margin-top:10px; letter-spacing:8px;}

.progress-bar{position:sticky; top:8px; z-index:30; margin:0 auto 20px; max-width:860px;}
.progress-shell{height:16px; border-radius:999px; background:rgba(5,12,22,.7); overflow:hidden; border:1px solid var(--stroke);}
.progress-fill{height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--blue),var(--grn)); transition:width .4s ease;}
.progress-txt{text-align:center; font-weight:800; color:#cfe0f1; font-size:.85rem; margin-top:4px;}

section.ex{margin-bottom:26px; padding:18px 16px 6px; border-radius:20px;

  border:1px solid var(--stroke); box-shadow:0 10px 26px rgba(0,0,0,.35);}
.ex-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.ex-badge{flex:0 0 auto; font-weight:900; color:#04121f; padding:8px 14px; border-radius:11px;

.ex-head h2{margin:0; font-size:1.1rem; font-weight:800; color:#eaf2fb;}
.ex-instruct{font-weight:700; color:#a9c2dd; margin:2px 2px 14px; font-size:.95rem;}

.q-card{margin-bottom:16px; padding:16px 16px 16px 20px; border-radius:16px; position:relative;
  background:var(--glass-strong); border:1px solid var(--stroke); box-shadow:0 6px 16px rgba(0,0,0,.3);}
.q-card::before{content:""; position:absolute; left:0; top:14px; bottom:14px; width:5px; border-radius:5px;
  background:linear-gradient(var(--blue),var(--teal));}
.q-num{display:inline-block; font-weight:900; color:#04121f; background:#fff; border:3px solid var(--blue);
  width:30px; height:30px; line-height:26px; text-align:center; border-radius:50%; margin-right:8px; box-shadow:0 0 0 3px rgba(61,165,255,.25);}
.q-text{font-size:1.15rem; font-weight:700; color:#eef4fb; line-height:1.5; display:inline;}
.q-text u{text-decoration-color:var(--orange); text-decoration-thickness:3px; text-underline-offset:3px; color:#ffd9b3;}

.sign-card{display:flex; justify-content:center; margin:10px 0 14px;}
.sign-card .sign-box{background:#fff; border-radius:18px; padding:14px;}
.arrange-box{font-weight:600; color:#dce8f5; background:rgba(5,12,22,.5); border-left:4px solid var(--blue); padding:12px 14px; border-radius:12px; margin:10px 0; font-size:1rem; line-height:1.7;}
.arrange-box b{color:var(--blue);}
.wb{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.wb span{background:rgba(61,165,255,.16); border:1px solid var(--blue); color:#cfe7ff; font-weight:800; padding:5px 12px; border-radius:999px; font-size:.95rem;}

.options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
@media(max-width:560px){.options{grid-template-columns:1fr;}}
.opt{cursor:pointer; padding:13px 16px; border-radius:13px; font-size:1.05rem; font-weight:800;
  color:#eef4fb; text-align:left; border:2px solid var(--stroke); border-left:5px solid var(--blue);
  background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  transition:transform .15s ease, box-shadow .2s ease, border-color .2s; user-select:none;}
.opt:hover{transform:translateX(3px) scale(1.01); border-left-color:var(--orange); box-shadow:0 6px 16px rgba(0,0,0,.3);}
.opt:active{transform:scale(.99);}
.opt.correct{background:linear-gradient(135deg,rgba(54,211,153,.28),rgba(54,211,153,.1)); color:#d6ffe9; border-color:var(--grn); border-left-color:var(--grn);}
.opt.wrong{background:linear-gradient(135deg,rgba(255,107,129,.28),rgba(255,107,129,.1)); color:#ffd9e0; border-color:var(--red); border-left-color:var(--red);}
.opt.locked{cursor:default;}
.opt.dim{opacity:.4;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .45s ease;}

.clue-box{font-weight:800; color:#fff; background:rgba(5,12,22,.5); border-left:5px solid var(--ylw); padding:10px 13px; border-radius:10px; margin:10px 0; font-size:1.02rem; line-height:1.5;}
.orig-line{font-weight:700; color:#eef4fb; font-size:1.08rem; line-height:1.5; margin:2px 0;}
.rewrite-line{font-size:1.08rem; font-weight:700; color:#eef4fb; margin:10px 0 6px;}
.given-start{font-weight:900; color:var(--blue); background:rgba(61,165,255,.14); padding:2px 8px; border-radius:8px;}
.note{font-weight:700; color:#bda3ff; font-size:.86rem; margin-top:6px; font-style:italic;}
textarea.blank-area{width:100%; font-family:'Nunito',sans-serif; font-weight:700; font-size:1.05rem; color:#eef4fb;
  border:2px solid var(--stroke); border-radius:12px; padding:10px 12px; outline:none; resize:vertical; min-height:46px;
  background:rgba(5,12,22,.5); transition:.2s; margin-top:6px;}
textarea.blank-area:focus{border-color:var(--blue);}
textarea.blank-area.ok{border-color:var(--grn);}
textarea.blank-area.no{border-color:var(--red);}

.check-btn{font-family:'Nunito'; font-weight:900; cursor:pointer; border:none; color:#04121f; font-size:.92rem;
  background:linear-gradient(135deg,var(--blue),var(--teal)); padding:8px 16px; border-radius:11px; margin-top:12px; transition:transform .12s;}
.check-btn:hover{transform:translateY(-1px);}
.check-btn:active{transform:translateY(2px);}
.check-btn:disabled{opacity:.5; cursor:default;}

.explain{max-height:0; overflow:hidden; transition:max-height .5s ease, opacity .4s; opacity:0; margin-top:0;}
.explain.open{max-height:1600px; opacity:1; margin-top:14px;}
.explain-inner{padding:14px; border-radius:14px; background:rgba(5,12,22,.55); border:1px solid var(--stroke); font-size:1rem; line-height:1.55; color:#dce8f5;}
.explain-inner ol{margin:8px 0 2px; padding-left:20px;}
.explain-inner li{margin-bottom:10px; font-weight:600;}
.correct-ans{margin-bottom:10px; font-weight:800; color:#04121f; background:var(--grn); padding:8px 12px; border-radius:9px; font-size:1rem;}

.vnt{font-weight:800; color:#fff; background:rgba(61,165,255,.18); border-left:5px solid var(--ylw); padding:9px 13px; border-radius:10px; margin-bottom:10px; font-size:1.02rem;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin:6px 0;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}
.grid2>div{background:rgba(5,12,22,.5); padding:7px 10px; border-radius:9px; font-weight:700; font-size:.98rem;}
.p-word{color:var(--c-word); font-weight:900;}
.hl-green{color:var(--grn); font-weight:900;}
.hl-red{color:var(--c-grammar); font-weight:900;}
.wt{display:inline-block; font-size:.78rem; font-weight:800; color:#04121f; background:var(--blue); padding:1px 7px; border-radius:6px; margin:0 2px;}
.p-phonetic{color:#fff; background:rgba(168,139,250,.45); padding:1px 6px; border-radius:6px; font-weight:800;}
.p-mean{color:var(--c-mean); font-weight:800;}
.p-grammar{text-decoration:underline; text-decoration-color:var(--c-grammar); text-decoration-thickness:2px; text-underline-offset:2px; font-weight:700; color:#eef4fb;}

.submit-zone{text-align:center; margin-top:10px;}
.submit-btn{font-family:'Nunito'; font-weight:900; font-size:1.25rem; color:#04121f; cursor:pointer; border:none; letter-spacing:.5px;
  padding:18px 34px; border-radius:16px; background:linear-gradient(135deg,var(--orange),var(--ylw));
  box-shadow:0 10px 24px rgba(255,159,69,.35); transition:transform .14s;}
.submit-btn:hover{transform:scale(1.05);}
.submit-btn:active{transform:translateY(4px);}

.overlay{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
  background:rgba(4,10,18,.72); backdrop-filter:blur(7px); padding:18px;}
.overlay.show{display:flex; animation:fadein .3s;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{width:100%; max-width:440px; background:linear-gradient(160deg,#122a44,#0a1726); border-radius:22px; position:relative; overflow:hidden;
  padding:28px 24px 26px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.55); border:1px solid var(--stroke); animation:pop .35s cubic-bezier(.2,1.3,.5,1);}
.modal::before{content:""; position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg,var(--red),var(--orange),var(--ylw),var(--grn),var(--blue),var(--pur));}
@keyframes pop{from{transform:scale(.8); opacity:0}to{transform:scale(1); opacity:1}}
.modal h3{margin:6px 0 14px; font-size:1.4rem; color:#fff; font-weight:900;}
.name-input{width:100%; font-family:'Nunito'; font-weight:700; font-size:1.05rem; padding:13px 15px; border-radius:12px; border:2px solid var(--stroke); outline:none; text-align:center; color:#eef4fb; background:rgba(5,12,22,.6);}
.name-input.err{border-color:var(--red); animation:shake .4s;}
.warn{color:var(--red); font-weight:800; font-size:.9rem; height:18px; margin:8px 0 4px;}
.modal-btn{font-family:'Nunito'; font-weight:900; font-size:1.05rem; color:#04121f; cursor:pointer; border:none; padding:13px 26px; border-radius:13px; background:linear-gradient(135deg,var(--blue),var(--teal)); margin-top:10px;}
.modal-btn:active{transform:translateY(3px);}
.greet{font-size:1.3rem; font-weight:900; margin:4px 0 10px; line-height:1.3; color:#fff;}
.score-big{font-size:2.6rem; font-weight:900; color:#fff; line-height:1;}
.score-sub{font-weight:800; color:var(--grn); font-size:1.1rem; margin:6px 0 4px;}
.score-ten{font-weight:900; font-size:1.5rem; color:var(--ylw); margin:2px 0 14px;}
.meme{width:100%; max-width:320px; border-radius:16px; margin:6px auto 14px; display:block; box-shadow:0 10px 24px rgba(0,0,0,.4);}
.meme-fallback{width:100%; max-width:320px; aspect-ratio:4/3; margin:6px auto 14px; border-radius:16px; display:none; align-items:center; justify-content:center; font-size:5rem; background:linear-gradient(135deg,#122a44,#0a3540);}
.bounce{animation:bnc 1s ease infinite;}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.retry{background:linear-gradient(135deg,var(--ylw),var(--orange));}
.confetti{position:fixed; top:-12px; z-index:200; width:11px; height:14px; border-radius:2px; pointer-events:none;}
</style>

const WB_VI=`<div class="wb"><span>meet</span><span>go</span><span>take</span><span>buy</span><span>work</span><span>spend</span><span>tell</span><span>be</span><span>switch off</span><span>listen</span><span>change</span><span>ban</span><span>earn</span></div>`;

const QUIZ=[
{
  id:"v", badge:"V • CHỌN DẠNG ĐÚNG", type:"mcq",
  title:"Chọn dạng đúng của động từ (to V hay V-ing)",
  instruct:"Chọn dạng đúng để hoàn thành câu. Mẹo: nhớ động từ nào đi với to-V, động từ nào đi với V-ing.",
  questions:[
    { qhtml:"She agreed ______ anyone about what had happened.",
      options:["not to tell","not telling"], answer:"not to tell",
      explain:`<div class="vnt">💬 Dịch: Cô ấy đồng ý không kể với ai về chuyện đã xảy ra.</div>
      <ol><li><span class='hl-green'>agree + to V</span> → phủ định "not to V".</li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"agreed not to tell".</span></li>
        <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"not telling" sai — agree không đi với V-ing.</span></li></ol>` },
    { qhtml:"He disliked ______ with committees and avoided it whenever possible.",
      options:["working","to work"], answer:"working",
      explain:`<div class="vnt">💬 Dịch: Anh ấy không thích làm việc với các ủy ban và tránh nó bất cứ khi nào có thể.</div>
      <ol><li><span class='hl-green'>dislike + V-ing</span>.</li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"disliked working".</span></li>
        <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"to work" sai — dislike đi với V-ing.</span></li></ol>` },
    { qhtml:"She suggested ______ the old lights with energy-efficient light bulbs.",
      options:["replacing","to replace"], answer:"replacing",
      explain:`<div class="vnt">💬 Dịch: Cô ấy đề xuất thay bóng đèn cũ bằng bóng tiết kiệm năng lượng.</div>
      <ol><li><span class='hl-green'>suggest + V-ing</span>.</li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"suggested replacing".</span></li>
        <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"to replace" sai — suggest đi với V-ing.</span></li></ol>` },
    { qhtml:"They chose ______ in a cheap hotel but spend more money on meals.",
      options:["to stay","staying"], answer:"to stay",
      explain:`<div class="vnt">💬 Dịch: Họ chọn ở khách sạn rẻ nhưng chi nhiều tiền hơn cho ăn uống.</div>
      <ol><li><span class='hl-green'>choose + to V</span>.</li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"chose to stay".</span></li>
        <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"staying" sai — choose đi với to V.</span></li></ol>` },
    { qhtml:"I regretted ______ to play the piano when I was younger.",
      options:["not learning","not to learn"], answer:"not learning",
      explain:`<div class="vnt">💬 Dịch: Tôi tiếc vì đã không học chơi piano khi còn nhỏ.</div>
      <ol><li><span class='hl-green'>regret + V-ing</span> = hối tiếc việc ĐÃ làm/không làm.</li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"regretted not learning" (tiếc đã không học).</span></li>
        <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"regret to V" = tiếc phải báo tin (nghĩa khác).</span></li></ol>` },
    { qhtml:"Never rely on someone else's memory. Learn ______ your own.",
      options:["to trust","trusting"], answer:"to trust",
      explain:`<div class="vnt">💬 Dịch: Đừng dựa vào trí nhớ người khác. Hãy học cách tin vào trí nhớ của mình.</div>
      <ol><li><span class='hl-green'>learn + to V</span>.</li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"Learn to trust".</span></li>
        <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"trusting" sai — learn đi với to V.</span></li></ol>` },
    { qhtml:"Please, avoid ______ the wires with wet hands.",
      options:["touching","to touch"], answer:"touching",
      explain:`<div class="vnt">💬 Dịch: Xin đừng chạm vào dây điện khi tay ướt.</div>
      <ol><li><span class='hl-green'>avoid + V-ing</span>.</li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"avoid touching".</span></li>
        <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"to touch" sai — avoid đi với V-ing.</span></li></ol>` },
    { qhtml:"Gina tried ______ the door, but it seemed ______ stuck.",
      options:["to open - to be","to open - being","opening - to be","opening - being"], answer:"to open - to be",
      explain:`<div class="vnt">💬 Dịch: Gina cố mở cửa, nhưng nó có vẻ bị kẹt.</div>
      <ol><li><span class='hl-green'>try + to V</span> (cố gắng làm) ; <span class='hl-green'>seem + to be</span>.</li>
        <li><span class="hl-green">✅ ĐÚNG:</span> <span class='p-grammar'>"tried to open ... seemed to be stuck".</span></li>
        <li><span class="hl-red">❌ SAI:</span> <span class='p-grammar'>"opening/being" sai dạng sau try/seem ở đây.</span></li></ol>` },

/* ===== HELPERS ===== */
function shuffleArray(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function norm(s){return (s||"").toLowerCase().replace(/[\u2019]/g,"'").replace(/[.,;:!?"]/g,"").replace(/\s+/g," ").trim();}

/* ===== AUDIO ===== */
let actx=null;
function audio(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx; }
function playChime(){const c=audio(); if(!c) return; if(c.state==="suspended") c.resume();
  const now=c.currentTime; [660,880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(c.destination); const t=now+i*0.10;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
  o.start(t); o.stop(t+0.4);});}
function playBuzz(){const c=audio(); if(!c) return; if(c.state==="suspended") c.resume();
  const now=c.currentTime; [300,230,170].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type="square"; o.frequency.value=f; o.connect(g); g.connect(c.destination); const t=now+i*0.13;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.start(t); o.stop(t+0.2);});}

/* ===== CONFETTI ===== */
function confetti(){const colors=["#8854C0","#FDCB6E","#00C9A7","#FF7AA2","#5AC8FA","#00D26A"];
  for(let i=0;i<70;i++){const d=document.createElement("div"); d.className="confetti";
  d.style.left=Math.random()*100+"vw"; d.style.background=colors[Math.floor(Math.random()*colors.length)];
  d.style.transform="rotate("+Math.random()*360+"deg)"; const dur=2+Math.random()*1.6;
  d.style.transition="transform "+dur+"s linear, top "+dur+"s linear, opacity "+dur+"s";
  document.body.appendChild(d);
  requestAnimationFrame(()=>{ d.style.top=(100+Math.random()*15)+"vh";
    d.style.transform="translateX("+(Math.random()*200-100)+"px) rotate("+(Math.random()*720)+"deg)"; d.style.opacity="0"; });
  setTimeout(()=>d.remove(), dur*1000+200);}}

/* ===== FLOATING MOTIFS ===== */
(function(){const layer=document.getElementById("floatLayer");
  const icons=["🚇","🚆","🚲","🚌","🚊","🛤️","🎫","🚏","🧭","🚉","🛵","🚎"];
  for(let i=0;i<22;i++){const s=document.createElement("span");
  s.textContent=icons[Math.floor(Math.random()*icons.length)];
  s.style.left=Math.random()*100+"vw"; s.style.bottom="-60px";
  s.style.fontSize=(22+Math.random()*30)+"px"; s.style.animationDuration=(14+Math.random()*16)+"s";
  s.style.animationDelay=(-Math.random()*20)+"s"; layer.appendChild(s);}})();

/* ===== STATE ===== */
const results={};
let totalQuestions=0;

/* ===== RENDER ===== */
const root=document.getElementById("quizRoot");
let counter=0;
QUIZ.forEach(sec=>{
  const sEl=document.createElement("section"); sEl.className="ex";
  sEl.innerHTML=`<div class="ex-head"><span class="ex-badge">${sec.badge}</span><h2>${sec.title}</h2></div>
                 <div class="ex-instruct">${sec.instruct}</div>`;
  sec.questions.forEach((q)=>{
    counter++; totalQuestions++;
    const qid=sec.id+"_"+counter; q._qid=qid; results[qid]=false;
    const card=document.createElement("div"); card.className="q-card";

    if(sec.type==="mcq"){
      const svgHtml=q.svg?`<div class="sign-card"><div class="sign-box">${q.svg}</div></div>`:"";
      const blockHtml=q.block?`<div class="arrange-box">${q.block}</div>`:"";
      card.innerHTML=`<div><span class="q-num">${counter}</span><span class="q-text">${q.qhtml||""}</span></div>
        ${svgHtml}${blockHtml}
        <div class="options" id="opts_${qid}"></div>
        <div class="explain" id="exp_${qid}"><div class="explain-inner">${q.explain}</div></div>`;
      sEl.appendChild(card);
      const optWrap=card.querySelector("#opts_"+qid);
      shuffleArray(q.options).forEach(opt=>{
        const o=document.createElement("div"); o.className="opt"; o.textContent=opt;
        o.addEventListener("click",()=>{
          if(card.dataset.locked) return; card.dataset.locked="1";
          const correct=norm(opt)===norm(q.answer); results[qid]=correct;
          optWrap.querySelectorAll(".opt").forEach(el=>{ el.classList.add("locked");
            if(norm(el.textContent)===norm(q.answer)) el.classList.add("correct");
            else if(el===o) el.classList.add("wrong"); else el.classList.add("dim"); });
          if(correct){ playChime(); confetti(); }
          else{ playBuzz(); o.classList.add("shake"); setTimeout(()=>o.classList.remove("shake"),500); }
          card.querySelector("#exp_"+qid).classList.add("open"); updateProgress();
        });
        optWrap.appendChild(o);
      });
    } else { // fill
      let body, correctLabel;
      if(q.clue){
        body=`<div><span class="q-num">${counter}</span><span class="q-text">Viết thành câu hoàn chỉnh:</span></div>
          <div class="clue-box">🧩 ${q.clue}</div>
          <textarea class="blank-area" id="in_${qid}" placeholder="Gõ câu hoàn chỉnh của em..."></textarea>`;
        correctLabel=q.answer;
      } else if(q.tail!==undefined){
        body=`<div><span class="q-num">${counter}</span><span class="q-text">${q.orig}</span></div>
          <div class="rewrite-line">→ <span class="given-start">${q.given}</span> <span style="opacity:.5">______</span> <span class="given-start">${q.tail}</span></div>
          <textarea class="blank-area" id="in_${qid}" placeholder="Gõ phần Ở GIỮA..."></textarea>
          <div class="note">✏️ (Chỉ gõ phần Ở GIỮA, KHÔNG gõ lại "${q.given}" đầu câu và "${q.tail}" cuối câu)</div>`;
        correctLabel=q.given+" "+q.answer+" "+q.tail;
      } else {
        body=`<div><span class="q-num">${counter}</span><span class="q-text">${q.orig}</span></div>
          <div class="rewrite-line">→ <span class="given-start">${q.given}</span> <span style="opacity:.5">______</span></div>
          <textarea class="blank-area" id="in_${qid}" placeholder="Gõ phần còn lại..."></textarea>
          <div class="note">✏️ (Chỉ gõ phần CÒN LẠI, KHÔNG gõ lại "${q.given}")</div>`;
        correctLabel=q.given+" "+q.answer;
      }
      card.innerHTML=body+`<button class="check-btn" id="btn_${qid}">✓ Kiểm tra</button>
        <div class="explain" id="exp_${qid}"><div class="explain-inner">
          <div class="correct-ans">✅ Đáp án gợi ý: ${correctLabel}</div>${q.explain}</div></div>`;
      sEl.appendChild(card);
      const inp=card.querySelector("#in_"+qid);
      const btn=card.querySelector("#btn_"+qid);
      function matches(val){
        let v=norm(val);
        if(q.given!==undefined){ const g=norm(q.given);
          if(v.startsWith(g+" ")) v=v.slice(g.length+1); else if(v===g) v=""; }
        if(q.tail!==undefined){ const t=norm(q.tail);
          if(t && v.endsWith(" "+t)) v=v.slice(0,v.length-t.length-1); else if(v===t) v=""; }
        const cands=[q.answer].concat(q.accept||[]);
        return cands.some(c=>norm(c)===v);
      }
      function check(){
        if(card.dataset.locked) return;
        if(inp.value.trim()===""){ inp.focus(); inp.classList.remove("ok"); inp.classList.add("no");
          setTimeout(()=>inp.classList.remove("no"),500); return; }
        card.dataset.locked="1";
        const correct=matches(inp.value); results[qid]=correct;
        inp.disabled=true; btn.disabled=true;
        if(correct){ inp.classList.add("ok"); playChime(); confetti(); }
        else{ inp.classList.add("no"); playBuzz(); card.classList.add("shake"); setTimeout(()=>card.classList.remove("shake"),500); }
        card.querySelector("#exp_"+qid).classList.add("open"); updateProgress();
      }
      btn.addEventListener("click",check);
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); }});
    }
  });
  root.appendChild(sEl);
});

/* ===== PROGRESS ===== */
function updateProgress(){
  const answered=document.querySelectorAll(".q-card[data-locked='1']").length;
  const pct=Math.round(answered/totalQuestions*100);
  document.getElementById("pFill").style.width=pct+"%";
  document.getElementById("pTxt").textContent=answered+" / "+totalQuestions+" câu đã làm";
}
document.getElementById("pTxt").textContent="0 / "+totalQuestions+" câu đã làm";

/* ===== SUBMIT ===== */
const nameOverlay=document.getElementById("nameOverlay");
const resultOverlay=document.getElementById("resultOverlay");
const nameInput=document.getElementById("nameInput");
const nameWarn=document.getElementById("nameWarn");

document.getElementById("submitBtn").addEventListener("click",()=>{
  audio(); nameWarn.textContent=""; nameInput.classList.remove("err");
  nameOverlay.classList.add("show"); setTimeout(()=>nameInput.focus(),150);
});
function submitName(){
  if(nameInput.value.trim()===""){ nameInput.classList.add("err"); nameWarn.textContent="⚠️ Em hãy nhập tên trước nhé!"; return; }
  nameOverlay.classList.remove("show"); showResult(nameInput.value.trim());
}
document.getElementById("nameOk").addEventListener("click",submitName);
nameInput.addEventListener("keydown",e=>{ if(e.key==="Enter") submitName(); });

const MEMES={
  perfect:"https://media.giphy.com/media/g9582DNuQppxC/giphy.gif",
  good:"https://media.giphy.com/media/111ebonMs90YLu/giphy.gif",
  low:"https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"
};
function showResult(name){
  const correct=Object.values(results).filter(Boolean).length;
  const pct=correct/totalQuestions; const ten=(correct/totalQuestions*10).toFixed(2);
  let greet, key, emoji;
  if(pct===1){ greet="🌟 THIÊN TÀI! "+name+" xuất sắc tuyệt đối!"; key="perfect"; emoji="🏆"; }
  else if(pct>=0.6){ greet="🎉 GIỎI LẮM! "+name+" làm rất tốt!"; key="good"; emoji="👍"; }
  else { greet="💪 CỐ LÊN! "+name+" ơi, làm lại sẽ tiến bộ ngay!"; key="low"; emoji="😭"; }
  document.getElementById("greetText").textContent=greet;
  document.getElementById("scoreBig").textContent=correct+" / "+totalQuestions;
  document.getElementById("scoreSub").textContent="câu đúng 🎯";
  document.getElementById("scoreTen").textContent="📊 Điểm quy đổi: "+ten+" / 10";
  const img=document.getElementById("memeImg"); const fb=document.getElementById("memeFb");
  fb.style.display="none"; img.style.display="block";
  img.onerror=()=>{ img.style.display="none"; fb.style.display="flex"; fb.innerHTML='<span class="bounce">'+emoji+'</span>'; };
  img.src=MEMES[key];
  resultOverlay.classList.add("show");
  if(pct>=0.6){ confetti(); setTimeout(confetti,400); if(pct===1) setTimeout(confetti,800); }
}
document.getElementById("retryBtn").addEventListener("click",()=>{ location.reload(); });
