<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💥 GERUND &amp; INFINITIVE – Phần 5 · Ex 17→20 · 40 câu gõ tay – Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff7e8; --ink:#1a1a2e; --red:#ef3e36; --blue:#2d6cdf; --yellow:#ffd23f;
  --green:#1f9d57; --green-bg:#c8f5d8; --redx:#ef3e36; --pink:#ff5d8f; --purple:#7b3fe4; --terra:#c1440e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Baloo 2',sans-serif; color:var(--ink); min-height:100vh; overflow-x:hidden;
  background-color:#ffe680;
  background-image:radial-gradient(rgba(239,62,54,.18) 2px, transparent 2.2px), radial-gradient(rgba(45,108,223,.14) 2px, transparent 2.2px);
  background-size:26px 26px, 26px 26px; background-position:0 0, 13px 13px; background-attachment:fixed;
}
#pattern{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.cstar{position:absolute; bottom:-10px; opacity:.55; animation:floatup linear infinite; text-shadow:1px 1px 0 var(--ink);}
@keyframes floatup{0%{transform:translateY(0) rotate(0); opacity:0}10%{opacity:.6}100%{transform:translateY(-105vh) rotate(220deg); opacity:0}}

.wrap{position:relative; z-index:2; max-width:860px; margin:0 auto; padding:14px 14px 90px;}

#sticky{position:sticky; top:8px; z-index:50; margin:0 auto 16px; max-width:860px;
  background:var(--yellow); color:var(--ink); border-radius:14px; padding:9px 14px;
  border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); font-weight:600; font-size:.85rem; line-height:1.45; display:flex; gap:10px; align-items:flex-start;}
#sticky .bell{font-size:1.3rem; flex-shrink:0;}
#sticky b{color:var(--red);}
#sticky .close{margin-left:auto; background:var(--ink); border:none; color:#fff; width:24px;height:24px;border-radius:6px; cursor:pointer; font-weight:900; flex-shrink:0;}

header.top{text-align:center; padding:22px 14px 16px;}
header.top .eyebrow{font-family:'Bangers'; letter-spacing:3px; font-size:1rem; color:var(--blue); -webkit-text-stroke:.5px var(--ink);}
header.top h1{font-family:'Bangers'; font-weight:400; font-size:3rem; line-height:1; margin:6px 0 8px; letter-spacing:2px;
  color:var(--red); text-shadow:3px 3px 0 var(--ink), -1px -1px 0 #fff; transform:rotate(-2deg);}
header.top .teacher{display:inline-block; margin-top:4px; font-family:'Bangers'; font-size:.95rem; letter-spacing:1px; color:#fff; background:var(--blue); padding:5px 16px; border-radius:8px; border:2.5px solid var(--ink); box-shadow:3px 3px 0 var(--ink);}
header.top .sub{margin-top:10px; color:#3a2e1a; font-weight:600; font-size:.92rem;}

.section-title{font-family:'Bangers'; font-weight:400; color:#fff; font-size:1.5rem; margin:30px 2px 14px; letter-spacing:1px;
  display:inline-flex; align-items:center; gap:9px; background:var(--ink); padding:6px 16px; border-radius:10px; box-shadow:4px 4px 0 var(--red); transform:rotate(-1deg);}
.section-title .sicon{font-size:1.1rem;}

.rulebox{background:#fff; border:3px solid var(--ink); border-radius:14px; padding:11px 15px; margin:0 2px 16px; font-size:.92rem; line-height:1.6; color:var(--ink); box-shadow:4px 4px 0 rgba(26,26,46,.25); font-weight:600;}
.rulebox b{color:var(--red);}

.qcard{position:relative; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:15px 15px 17px; margin-bottom:18px; box-shadow:6px 6px 0 var(--ink);}
.qhead{display:flex; gap:11px; align-items:flex-start;}
.qnum{flex-shrink:0; width:32px;height:32px; border-radius:50%; background:var(--red); color:#fff; font-family:'Bangers'; display:flex; align-items:center; justify-content:center; font-size:1.05rem; border:2.5px solid var(--ink); box-shadow:2px 2px 0 var(--ink);}
.qtext{font-weight:700; font-size:1.12rem; line-height:1.8; color:var(--ink);}
.qtext u{color:var(--red); text-decoration-thickness:3px; text-underline-offset:3px;}

.tiles{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:13px;}
@media(max-width:520px){.tiles{grid-template-columns:1fr;}}
.tile{display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.05rem; color:var(--ink); cursor:pointer;
  background:#fff; border:2.5px solid var(--ink); border-radius:12px; padding:11px 13px; box-shadow:3px 3px 0 var(--ink);
  transition:transform .1s, box-shadow .1s; user-select:none;}
.tile .lett{font-family:'Bangers'; width:25px;height:25px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--yellow); color:var(--ink); font-size:.9rem; border:2px solid var(--ink); text-transform:uppercase;}
.tile:hover:not(.locked){transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink);}
.tile:active:not(.locked){transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
.tile.correct{background:var(--green-bg); border-color:var(--green); box-shadow:3px 3px 0 var(--green);}
.tile.correct .lett{background:var(--green); color:#fff; border-color:var(--green);}
.tile.wrong{background:#ffd7d5; border-color:var(--red); box-shadow:3px 3px 0 var(--red); animation:shake .4s;}
.tile.dim{opacity:.4;}
.tile.locked{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* blank (Ex6) */
.blank{display:inline-block; min-width:110px; width:120px; font-family:'Baloo 2'; font-weight:700; font-size:1.02rem; text-align:center; vertical-align:middle; margin:0 3px;
  border:none; border-bottom:3px dashed var(--blue); background:#fffbe8; border-radius:8px 8px 4px 4px; color:var(--ink); outline:none; padding:4px 10px; transition:all .12s;}
.blank::placeholder{color:#c0aa66;}
.blank:focus{background:#fff; border-bottom-color:var(--red); box-shadow:2px 2px 0 rgba(26,26,46,.2);}
.blank.correct{background:var(--green-bg); border-bottom:3px solid var(--green); color:#0c5a30; font-weight:800;}
.blank.wrong{background:#ffd7d5; border-bottom:3px solid var(--red); color:#8a1a14; animation:shake .4s;}

/* circle (Ex7) */
.cgroup{font-weight:800;}
.cchip{display:inline-block; cursor:pointer; font-weight:800; color:var(--ink); background:#fff; border:2px solid var(--ink); border-radius:20px; padding:1px 12px; margin:0 1px; transition:all .1s; user-select:none;}
.cchip:hover:not(.locked){background:var(--yellow);}
.cslash{color:#999; font-weight:700; margin:0 1px;}
.cchip.correct{background:var(--green); color:#fff; border-color:var(--green);}
.cchip.wrong{background:var(--red); color:#fff; border-color:var(--red); animation:shake .4s;}
.cchip.locked{cursor:default;}

.explain{max-height:0; overflow:hidden; transition:max-height .5s ease, margin .3s; margin-top:0;}
.explain.open{max-height:1400px; margin-top:14px;}
.exp-inner{position:relative; background:#fffdf5; border:2.5px solid var(--ink); border-radius:14px; padding:13px 15px; font-size:.98rem; color:var(--ink); box-shadow:3px 3px 0 rgba(26,26,46,.2);}
.vnt{background:var(--yellow); border:2px solid var(--ink); color:#5a3000; font-weight:700; padding:8px 12px; border-radius:9px; margin-bottom:10px; line-height:1.5;}
.exp-inner ol{margin:0 0 0 18px; display:flex; flex-direction:column; gap:9px;}
.exp-inner li{line-height:1.6;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin:8px 0;}
@media(max-width:520px){.grid2{grid-template-columns:1fr;}}
.grid2 > div{font-size:.92rem; line-height:1.5;}
.p-word{color:var(--blue); font-weight:800;}
.hl-green{color:var(--green); font-weight:800;}
.hl-red{color:var(--red); font-weight:800;}
.wt{display:inline-block; font-size:.72rem; font-weight:700; color:#555; background:rgba(26,26,46,.08); border:1px solid rgba(26,26,46,.18); border-radius:5px; padding:0 6px; margin:0 2px;}
.p-phonetic{color:var(--purple); background:rgba(123,63,228,.12); border-radius:5px; padding:0 5px;}
.p-mean{color:var(--terra); font-weight:700;}
.p-grammar{color:#2a2a40; border-bottom:2px solid var(--red); padding-bottom:1px; font-weight:600;}

.submit-btn{display:block; width:100%; margin:30px auto 0; font-family:'Bangers'; font-weight:400; font-size:1.5rem; letter-spacing:1.5px;
  color:#fff; background:var(--red); border:3px solid var(--ink); border-radius:14px; padding:16px; cursor:pointer; box-shadow:6px 6px 0 var(--ink); transition:transform .1s, box-shadow .1s;}
.submit-btn:hover{transform:translate(-1px,-1px); box-shadow:8px 8px 0 var(--ink);}
.submit-btn:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink);}

.progress-wrap{position:sticky; bottom:10px; z-index:40; margin-top:18px; background:#fff; border:3px solid var(--ink); border-radius:30px; padding:7px 14px; display:flex; align-items:center; gap:10px; box-shadow:4px 4px 0 var(--ink);}
.progress-wrap .lbl{font-family:'Bangers'; font-size:1rem; letter-spacing:.5px; color:var(--ink); white-space:nowrap;}
.bar{flex:1; height:13px; background:#eee; border-radius:30px; overflow:hidden; border:2px solid var(--ink);}
.bar > i{display:block; height:100%; width:0; background:repeating-linear-gradient(45deg,var(--red) 0 8px,var(--yellow) 8px 16px); border-radius:30px; transition:width .4s;}

.modal{position:fixed; inset:0; z-index:100; background:rgba(26,26,46,.55); display:none; align-items:center; justify-content:center; padding:18px;}
.modal.show{display:flex;}
.sheet{background:var(--paper); border-radius:18px; padding:24px 22px; max-width:420px; width:100%; text-align:center; box-shadow:8px 8px 0 var(--ink); border:3px solid var(--ink); animation:pop .3s cubic-bezier(.2,1.3,.5,1); color:var(--ink);}
@keyframes pop{0%{transform:scale(.7) rotate(-4deg); opacity:0}100%{transform:scale(1) rotate(0); opacity:1}}
.sheet h2{font-family:'Bangers'; font-weight:400; color:var(--red); font-size:1.7rem; margin-bottom:6px; letter-spacing:1px;}
.sheet p{color:#3a2e1a; font-weight:600; margin-bottom:14px;}
.sheet input{width:100%; padding:13px 14px; border-radius:11px; border:2.5px solid var(--ink); background:#fff; font-family:'Baloo 2'; font-weight:700; font-size:1.05rem; text-align:center; outline:none; color:var(--ink);}
.sheet input:focus{border-color:var(--blue);}
.sheet input.err{border-color:var(--red); animation:shake .4s;}
.warn{color:var(--red); font-weight:700; font-size:.85rem; margin-top:8px; min-height:18px;}
.go-btn{margin-top:14px; width:100%; font-family:'Bangers'; font-weight:400; font-size:1.2rem; letter-spacing:1px; color:#fff; background:var(--blue); border:3px solid var(--ink); border-radius:12px; padding:13px; cursor:pointer; box-shadow:4px 4px 0 var(--ink);}
.go-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
.greet{font-family:'Bangers'; font-weight:400; font-size:1.6rem; margin-bottom:6px; line-height:1.2; color:var(--red); letter-spacing:1px;}
.score-big{font-size:2.5rem; font-weight:800; color:var(--blue); margin:4px 0; font-family:'Bangers';}
.score-10{display:inline-block; font-family:'Bangers'; background:var(--yellow); color:var(--ink); padding:5px 18px; border-radius:8px; font-size:1.3rem; margin:6px 0 12px; border:2.5px solid var(--ink); box-shadow:3px 3px 0 var(--ink); letter-spacing:1px;}
.meme{width:100%; max-width:320px; border-radius:12px; margin:8px auto; display:block; border:2.5px solid var(--ink); box-shadow:4px 4px 0 var(--ink); background:#fff; min-height:160px; object-fit:cover;}
.meme-fallback{width:100%; max-width:320px; min-height:170px; margin:8px auto; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:5rem; background:var(--yellow); border:2.5px solid var(--ink); box-shadow:4px 4px 0 var(--ink); animation:bob 1.3s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.retry{margin-top:14px; background:#fff; border:2.5px solid var(--ink); color:var(--ink); font-weight:800; padding:10px 22px; border-radius:11px; cursor:pointer; font-family:'Baloo 2'; font-size:1rem; box-shadow:3px 3px 0 var(--ink);}
.retry:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:90;}
.mute{position:fixed; right:12px; bottom:12px; z-index:60; width:46px;height:46px;border-radius:50%; border:2.5px solid var(--ink); background:#fff; font-size:1.3rem; cursor:pointer; box-shadow:3px 3px 0 var(--ink); color:var(--ink);}

@media (prefers-reduced-motion: reduce){ .cstar,.submit-btn,.meme-fallback{animation:none!important;} }
</style>
<style>.gopt{display:inline-block;background:#ffe86b;color:#241a00;border:2px solid #e0a80f;border-radius:9px;padding:1px 10px;margin:0 3px;font-weight:900;box-shadow:0 2px 0 #b9860a}</style>
</head>
<body>
<div id="pattern"><div id="particles"></div></div>
<canvas id="confetti"></canvas>
<button class="mute" id="mute" title="Bật/tắt âm thanh">🔊</button>

<div id="sticky">
  <span class="bell">💥</span>
  <span id="sticky-text">Ms đang tải lời nhắn…</span>
  <button class="close" id="sticky-close" title="Ẩn">✕</button>
</div>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">★ Exercise 17 · 18 · 19 · 20 — 40 câu GÕ TAY ★</div>
    <h1>GERUND &amp; INFINITIVE — PHẦN 5</h1>
    <div class="teacher">★ Giáo viên tạo: Ms. Chí Nên ★</div>
    <div class="sub">Từ vựng · Đồng nghĩa · Trái nghĩa · Chia dạng từ · Đối đáp. Chọn &amp; gõ đúng để tung POW! 💥</div>
  </header>

  <div id="quiz"></div>

  <button class="submit-btn" id="submit">💥 NỘP BÀI &amp; XEM SCORE 💥</button>

  <div class="progress-wrap">
    <span class="lbl">⭐ <span id="done">0</span>/<span id="total">0</span></span>
    <div class="bar"><i id="barfill"></i></div>
  </div>
</div>

<div class="modal" id="name-modal">
  <div class="sheet">
    <h2>★ NHẬP TÊN ANH HÙNG ★</h2>
    <p>Nhập tên của em để cô chấm điểm nhé!</p>
    <input id="name-input" placeholder="Ví dụ: Nguyễn Văn A..." autocomplete="off">
    <div class="warn" id="name-warn"></div>
    <button class="go-btn" id="name-go">XEM SCORE 💥</button>
  </div>
</div>

<div class="modal" id="result-modal">
  <div class="sheet">
    <div class="greet" id="greet"></div>
    <div class="score-big" id="score-big"></div>
    <div class="score-10" id="score-10"></div>
    <img class="meme" id="meme" alt="kết quả">
    <div class="meme-fallback" id="meme-fallback" style="display:none;"></div>
    <div id="res-msg" style="font-weight:600;color:#3a2e1a;margin-top:8px;"></div>
    <button class="retry" id="retry">🔄 CHƠI LẠI</button>
  </div>
</div>

<script>
/* ====== HEALTH & LIFESTYLE — Ex3 (21-35), Ex4 (đồng nghĩa), Ex5 (trái nghĩa), Ex6 (chia từ), Ex7 (đối đáp) ====== */

function EX(viet, opts, why, wrong){
  const cells=opts.map(o=>{
    const cls=o.c?'hl-green':'p-word';
    const wt=o.wt?` <span class='wt'>${o.wt}</span>`:'';
    return `<div><span class='${cls}'>${o.w}</span>${wt} = <span class='p-mean'>${o.m}</span></div>`;
  }).join('');
  return `<div class="vnt">💬 ${viet}</div>
  <ol>
    <li>Phân tích đáp án:<div class="grid2">${cells}</div></li>
    <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>${why}</span></li>
    <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>${wrong}</span></li>
  </ol>`;
}
function M(q, options, answer, exp){ return {type:'mcq', q, options:options.map((label,i)=>({v:'abcd'[i],label})), answer, exp}; }
function F(pre, post, answers, key, exp){ return {type:'fill', segs:[pre, {answers, key}, post], exp}; }


/* ══ HELPER: câu gõ tay dạng gerund / infinitive ══ */
function FMT(x){var t=x.trim();
 if(/^to /i.test(t))return 'to V';
 if(/'s\s|&#39;s\s/.test(t))return "sở hữu + V-ing";
 if(/^(my|our|his|her|their|your)\s/i.test(t))return "sở hữu + V-ing";
 if(/\bto\s+\w/i.test(t))return "tân ngữ + to V";
 if(/^(me|us|him|them|you)\s/i.test(t))return "tân ngữ + V-ing";
 return 'V-ing';}
function GT(sent,opts,ci,vn,why,trap){
 var ans=opts[ci],k=sent.indexOf('______');
 var pre=sent.slice(0,k),post=sent.slice(k+6)+
   ' &nbsp;<span class="gopt">( '+opts.join(' &nbsp;/&nbsp; ')+' )</span>';
 var cells=opts.map(function(o){
   return {w:o,wt:FMT(o),m:(o===ans?'ĐÚNG — gõ từ này vào ô':'SAI ở câu này'),c:(o===ans?1:0)};});
 return F(pre,post,[ans.toLowerCase()],ans,EX(vn,cells,why,trap));}

const SEC17=[
GT('Simone was talking about ______ up in Tanzania. She has had such an interesting life!',['to grow','growing'],1,
 'Simone đang kể về chuyện lớn lên ở Tanzania. Cuộc đời cô ấy thật thú vị!',
 'Sau <b>giới từ</b> luôn là <b>V-ing</b>. Ở đây có <i>about</i> ➜ <b>growing</b>.',
 'Đây là quy tắc vàng: thấy about · of · for · in · at · on là chọn ngay V-ing, không cần phân vân.'),
GT('I need him ______ me lift this heavy box.',['helping','to help'],1,
 'Tôi cần anh ấy giúp tôi khiêng cái hộp nặng này.',
 '<b>need</b> khi nhờ người khác thì dùng <b>tân ngữ + to V</b>: <i>need somebody to do</i>.',
 '<i>need + V-ing</i> có tồn tại nhưng mang nghĩa <b>bị động</b> (<i>The car needs washing</i>), không hợp ở đây.'),
GT('Thank you for ______ to the meeting on such short notice.',['to come','coming'],1,
 'Cảm ơn bạn đã tới họp dù được báo gấp như vậy.',
 'Cụm <b>Thank you for + V-ing</b> — sau giới từ <i>for</i> bắt buộc là gerund.',
 'Không bao giờ có <i>Thank you for to come</i>. Đây là cụm cố định phải thuộc.'),
GT('I suggest ______ Japan when the cherry trees are in bloom.',['visiting','to visit'],0,
 'Tôi gợi ý nên tới Nhật khi hoa anh đào đang nở.',
 '<b>suggest</b> luôn đi với <b>V-ing</b>: <i>suggest doing something</i>.',
 'Muốn nêu người thì đổi cấu trúc: <i>suggest that you visit</i>. Không có <i>suggest to visit</i>.'),
GT('We hired professional translators ______ the documents into Arabic and Chinese.',['translating','to translate'],1,
 'Chúng tôi đã thuê phiên dịch chuyên nghiệp để dịch tài liệu sang tiếng Ả Rập và tiếng Trung.',
 '<b>hire somebody to do something</b> = thuê ai để làm gì. To V ở đây chỉ <b>mục đích</b> của việc thuê.',
 'Dạng <i>translators translating</i> chỉ mô tả người đang dịch, không nói được mục đích thuê.'),
GT('After work, I always go ______. I am a fitness freak!',['to jog','jogging'],1,
 'Sau giờ làm, tôi luôn đi chạy bộ. Tôi mê tập luyện lắm!',
 'Cấu trúc <b>go + V-ing</b> dùng cho hoạt động thể thao: <i>go jogging · go swimming · go fishing</i>.',
 'Không bao giờ có <i>go to jog</i>. Sau <b>go</b> chỉ tay là V-ing.'),
GT('His interest in ______ languages is very impressive.',['to learn','learning'],1,
 'Niềm hứng thú của anh ấy với việc học ngôn ngữ thật đáng nể.',
 'Sau <b>giới từ in</b> phải là <b>V-ing</b>: <i>interest in doing something</i>.',
 'Chữ <i>in</i> nhỏ xíu nhưng quyết định tất cả. Đừng để cụm danh từ dài phía trước làm em quên nó.'),
GT('I do not mind your friend ______ along with us. Why do not you invite her?',['Sally to come',"Sally's coming"],1,

<script>
/* ============ ÂM THANH (Web Audio API) ============ */
let audioCtx=null, muted=false;
function ac(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return audioCtx; }
function ding(){
  if(muted) return; const c=ac(); if(!c) return; if(c.state==='suspended') c.resume();
  const now=c.currentTime;
  [[660,0],[990,0.07],[1320,0.14]].forEach(([f,d])=>{ const o=c.createOscillator(), g=c.createGain();
    o.type='square'; o.frequency.value=f; o.connect(g); g.connect(c.destination);
    const t=now+d; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.14,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.start(t); o.stop(t+0.18); });
}
function buzz(){
  if(muted) return; const c=ac(); if(!c) return; if(c.state==='suspended') c.resume();
  const now=c.currentTime; const o=c.createOscillator(), g=c.createGain();
  o.type='square'; o.frequency.setValueAtTime(180,now); o.frequency.exponentialRampToValueAtTime(90,now+0.22);
  o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(0.16,now+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,now+0.25); o.start(now); o.stop(now+0.27);
}

/* ============ CONFETTI (ngôi sao comic) ============ */
const cvs=document.getElementById('confetti'), cx=cvs.getContext('2d');
let parts=[]; function sizeCanvas(){cvs.width=innerWidth;cvs.height=innerHeight;}
sizeCanvas(); addEventListener('resize',sizeCanvas);
const COLORS=['#ef3e36','#2d6cdf','#ffd23f','#2ecc71','#ff5d8f','#1a1a2e'];
function star(g,r){ g.beginPath(); for(let i=0;i<10;i++){ const ang=Math.PI/5*i; const rad=i%2?r*0.45:r; g.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad);} g.closePath(); }
function burst(x,y,n){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=2+Math.random()*8;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,g:0.2+Math.random()*0.1,
      s:5+Math.random()*6, rot:Math.random()*6, vr:(Math.random()-0.5)*0.5, c:COLORS[Math.floor(Math.random()*COLORS.length)], life:55+Math.random()*25}); }
  if(!raf) loop();
}
let raf=null;
function loop(){
  cx.clearRect(0,0,cvs.width,cvs.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.life--;
    cx.save(); cx.globalAlpha=Math.max(0,p.life/70); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.fillStyle=p.c; cx.strokeStyle='#1a1a2e'; cx.lineWidth=1.2; star(cx,p.s); cx.fill(); cx.stroke(); cx.restore();});
  parts=parts.filter(p=>p.life>0 && p.y<cvs.height+30);
  if(parts.length){raf=requestAnimationFrame(loop);}else{raf=null;cx.clearRect(0,0,cvs.width,cvs.height);}
}
function burstAt(el,n){ const r=el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, n||45); }

    layer.appendChild(s); }

/* ============ THƯỜNG HÓA ============ */
function norm(s){
  let v=(s||'').toLowerCase().trim().replace(/[’‘´`]/g,"'");
  v=v.replace(/[.,!?;:"“”\/()]/g,' ').replace(/\s+/g,' ').trim();
  return v;
}

function buildQuestions(){
  QUESTIONS=[];

    if(q.type==='fill') QUESTIONS.push({ref:q,type:'fill',blanks:q.segs.filter(s=>typeof s==='object').map(b=>({answers:b.answers.map(norm),done:false,ok:false})),answered:false,correct:false});
    else if(q.type==='circle') QUESTIONS.push({ref:q,type:'circle',points:q.segs.filter(s=>typeof s==='object').map(p=>({opts:p.opts,ans:norm(p.ans),done:false,ok:false})),answered:false,correct:false});
    else QUESTIONS.push({ref:q,type:'mcq',answer:(q.answer||'').toLowerCase(),answered:false,correct:false});
  }));
}

  SECTIONS.forEach(sec=>{
    const st=document.createElement('div'); st.className='section-title';
    st.innerHTML=`<span class="sicon">${sec.icon}</span> ${sec.title}`; root.appendChild(st);
    if(sec.rule){ const rb=document.createElement('div'); rb.innerHTML=sec.rule; root.appendChild(rb.firstChild); }
    sec.questions.forEach((qref,localIdx)=>{
      const idx=qIndex;
      const card=document.createElement('div'); card.className='qcard'; card.id='qcard-'+idx;
      let body='';
      if(qref.type==='fill'){
        let bi=0,t='';
        qref.segs.forEach(s=>{ if(typeof s==='string') t+=s;
          else { t+=`<input class="blank" type="text" data-q="${idx}" data-b="${bi}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="?">`; bi++; } });
        body=`<div class="qtext fill">${t}</div>`;
      }else if(qref.type==='circle'){
        let pi=0,t='';
        qref.segs.forEach(s=>{ if(typeof s==='string') t+=s;
          else { const chips=s.opts.map(o=>`<span class="cchip" data-q="${idx}" data-p="${pi}" data-opt="${o}">${o}</span>`).join('<span class="cslash">/</span>');
            t+=`<span class="cgroup">(${chips})</span>`; pi++; } });
        body=`<div class="qtext fill">${t}</div>`;
      }else{
        const qt = qref.q ? `<div class="qtext">${qref.q}</div>` : '';
        const opts=qref.options.map(o=>`<div class="tile" data-q="${idx}" data-opt="${o.v}"><span class="lett">${o.v}</span><span class="lab">${o.label}</span></div>`).join('');
        body=`${qt}<div class="tiles">${opts}</div>`;
      }
      card.innerHTML=`<div class="qhead"><div class="qnum">${localIdx+1}</div><div style="flex:1">${body}</div></div>
        <div class="explain"><div class="exp-inner">${qref.exp}</div></div>`;
      root.appendChild(card); qIndex++;
    });
  });
  root.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>onMcq(t)));
  root.querySelectorAll('.blank').forEach(inp=>{
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); checkBlank(inp,false); }});
    inp.addEventListener('blur',()=>checkBlank(inp,false));
  });
  root.querySelectorAll('.cchip').forEach(ch=>ch.addEventListener('click',()=>onCircle(ch)));
}
function openExp(qi){ document.getElementById('qcard-'+qi).querySelector('.explain').classList.add('open'); }
function updateProgress(){
  document.getElementById('done').textContent=answeredCount;
  document.getElementById('barfill').style.width=(answeredCount/QUESTIONS.length*100)+'%';
}
function onMcq(tile){
  const qi=+tile.dataset.q; const Q=QUESTIONS[qi]; if(Q.answered) return;
  const card=document.getElementById('qcard-'+qi); const tiles=card.querySelectorAll('.tile');
  tiles.forEach(t=>t.classList.add('locked'));
  const ok=tile.dataset.opt.toLowerCase()===Q.answer;
  Q.answered=true; answeredCount++; Q.correct=ok;
  if(ok){ tile.classList.add('correct'); ding(); burstAt(tile,55); }
  else{ tile.classList.add('wrong'); buzz();
    tiles.forEach(t=>{ if(t.dataset.opt.toLowerCase()===Q.answer) t.classList.add('correct'); else if(t!==tile) t.classList.add('dim'); }); }
  openExp(qi); updateProgress();
}
function checkBlank(inp, force){
  const qi=+inp.dataset.q, bi=+inp.dataset.b; const Q=QUESTIONS[qi]; if(Q.answered) return;
  const bl=Q.blanks[bi]; if(bl.done) return;
  const v=norm(inp.value); if(!v && !force) return;
  bl.done=true; inp.classList.add('locked'); inp.readOnly=true; bl.ok=bl.answers.includes(v);
  if(bl.ok){ inp.classList.add('correct'); ding(); burstAt(inp,40); }
  else{ inp.classList.add('wrong'); buzz(); if(!inp.value.trim()) inp.value='( trống )'; }
  if(Q.blanks.every(b=>b.done)){ Q.answered=true; answeredCount++; Q.correct=Q.blanks.every(b=>b.ok); openExp(qi); updateProgress(); }
}
function onCircle(chip){
  const qi=+chip.dataset.q, pi=+chip.dataset.p; const Q=QUESTIONS[qi]; if(Q.answered) return;
  const pt=Q.points[pi]; if(pt.done) return;
  const card=document.getElementById('qcard-'+qi);
  const groupChips=card.querySelectorAll(`.cchip[data-p="${pi}"]`);
  groupChips.forEach(c=>c.classList.add('locked'));
  pt.done=true; const ok=norm(chip.dataset.opt)===pt.ans; pt.ok=ok;
  if(ok){ chip.classList.add('correct'); ding(); burstAt(chip,40); }
  else{ chip.classList.add('wrong'); buzz();
    groupChips.forEach(c=>{ if(norm(c.dataset.opt)===pt.ans) c.classList.add('correct'); }); }
  if(Q.points.every(p=>p.done)){ Q.answered=true; answeredCount++; Q.correct=Q.points.every(p=>p.ok); openExp(qi); updateProgress(); }
}

/* ============ NỘP BÀI ============ */
const nameModal=document.getElementById('name-modal');
const resultModal=document.getElementById('result-modal');
const nameInput=document.getElementById('name-input');
const nameWarn=document.getElementById('name-warn');
document.getElementById('submit').addEventListener('click',()=>{
  ac(); nameWarn.textContent=''; nameInput.classList.remove('err');
  document.querySelectorAll('.blank').forEach(inp=>checkBlank(inp,true));
  QUESTIONS.forEach((Q,qi)=>{
    if(Q.answered) return;
    const card=document.getElementById('qcard-'+qi);
    if(Q.type==='mcq'){
      card.querySelectorAll('.tile').forEach(t=>{ t.classList.add('locked'); if(t.dataset.opt.toLowerCase()===Q.answer) t.classList.add('correct'); else t.classList.add('dim'); });
      Q.answered=true; answeredCount++; Q.correct=false; openExp(qi);
    }else if(Q.type==='circle'){
      Q.points.forEach((pt,pi)=>{ if(!pt.done){ pt.done=true; pt.ok=false;
        card.querySelectorAll(`.cchip[data-p="${pi}"]`).forEach(c=>{ c.classList.add('locked'); if(norm(c.dataset.opt)===pt.ans) c.classList.add('correct'); }); } });
      Q.answered=true; answeredCount++; Q.correct=Q.points.every(p=>p.ok); openExp(qi);
    }
  });
  updateProgress(); nameModal.classList.add('show'); nameInput.focus();
});
document.getElementById('name-go').addEventListener('click',submitName);
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
function submitName(){
  const name=nameInput.value.trim();
  if(!name){ nameInput.classList.add('err'); nameWarn.textContent='⚠️ Em chưa nhập tên kìa! Nhập tên để cô chấm nhé.'; nameInput.focus(); return; }
  showResult(name);
}
function showResult(name){
  const correct=QUESTIONS.filter(q=>q.correct).length;
  const total=QUESTIONS.length; const pct=correct/total; const score10=Math.round(pct*10*100)/100;
  nameModal.classList.remove('show');
  let greet,msg,gif,emoji;
  if(pct>=1){ greet=`💥 SIÊU ANH HÙNG! ${name} hoàn hảo!`; msg=`Đúng cả ${total} câu — POW! Bất bại! 🦸`; emoji='💥'; gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif'; }
  else if(pct>=0.6){ greet=`⭐ TUYỆT VỜI, ${name}!`; msg='Phong độ rất tốt — xem lại vài câu sai để lên đỉnh nhé! 🚀'; emoji='⭐'; gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif'; }
  else{ greet=`💢 LÀM LẠI NÀO, ${name}!`; msg='Chưa sao! Đọc kỹ giải thích, ghi quy tắc giới từ vào sổ tay rồi thử lại — sẽ mạnh lên! 🌱'; emoji='😵'; gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif'; }
  document.getElementById('greet').textContent=greet;
  document.getElementById('score-big').textContent=`${correct}/${total} câu đúng`;
  document.getElementById('score-10').textContent=`💯 SCORE: ${score10.toFixed(2)}/10`;
  document.getElementById('res-msg').textContent=msg;
  const memeImg=document.getElementById('meme'); const fb=document.getElementById('meme-fallback');
  fb.style.display='none'; memeImg.style.display='block';
  memeImg.onerror=()=>{ memeImg.style.display='none'; fb.style.display='flex'; fb.textContent=emoji; };
  memeImg.src=gif; resultModal.classList.add('show');
  if(pct>=0.6){ let t=0; const iv=setInterval(()=>{ burst(Math.random()*innerWidth, innerHeight*0.3, 34); if(++t>=(pct>=1?6:3)) clearInterval(iv); },330); }
}
document.getElementById('retry').addEventListener('click',()=>{ resultModal.classList.remove('show'); nameInput.value=''; render(); scrollTo({top:0,behavior:'smooth'}); });
[nameModal,resultModal].forEach(m=>{ m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('show'); }); });
document.getElementById('sticky-close').addEventListener('click',()=>{ document.getElementById('sticky').style.display='none'; });
document.getElementById('mute').addEventListener('click',function(){ muted=!muted; this.textContent=muted?'🔇':'🔊'; if(!muted) ac(); });
render();

</script>
