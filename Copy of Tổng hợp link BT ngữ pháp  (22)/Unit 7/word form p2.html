<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Form Exercise - Ms. MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #8854C0;
            --secondary-color: #00C9A7;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --correct-color: #00D26A;
            --wrong-color: #FF4757;
            --text-color: #2d3436;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#8854c022 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .teacher-name {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-title {
            font-size: 1.8rem;
            margin: 5px 0;
            color: var(--text-color);
        }

        .progress-container {
            width: 100%;
            max-width: 600px;
            height: 15px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
            transition: width 0.3s ease;
        }

        .quiz-container {
            width: 100%;
            max-width: 650px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 0 #bdc3c7, 0 20px 30px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.2s;
        }

        .question-num {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        .option-btn {
            background: white;
            border: 3px solid #dfe6e9;
            padding: 15px;
            border-radius: 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #dfe6e9;
            position: relative;
            top: 0;
        }

        .option-btn:hover {
            transform: scale(1.03);
            border-color: var(--primary-color);
        }

        .option-btn:active {
            top: 4px;
            box-shadow: 0 2px 0 #dfe6e9;
        }

        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #009432;
            box-shadow: 0 6px 0 #009432;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #b33939;
            box-shadow: 0 6px 0 #b33939;
        }

        .explanation-box {
            margin-top: 25px;
            padding: 20px;
            background: #f1f2f6;
            border-left: 8px solid var(--primary-color);
            border-radius: 15px;
            display: none;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation-title {
            color: var(--primary-color);
            font-weight: 900;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .explanation-title::before {
            content: "💡";
            margin-right: 10px;
        }

        .nav-buttons {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 650px;
        }

        .nav-btn {
            padding: 12px 25px;
            border-radius: 15px;
            border: none;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #bdc3c7;
        }

        .next-btn {
            background: var(--secondary-color);
            color: white;
            box-shadow: 0 5px 0 #009688;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #009688;
        }

        .result-screen {
            display: none;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .highlight-blue { color: #0984e3; font-weight: bold; }
        .highlight-green { color: #27ae60; font-weight: bold; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        
        th { background-color: var(--primary-color); color: white; }

        .analysis-step {
            margin-bottom: 15px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
        }

        .analysis-step:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="header">
        <p class="teacher-name">Giáo viên: Ms. MS Chí Nên</p>
        <h1 class="quiz-title">Word Form Exercise (Part 2)</h1>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="quiz" class="quiz-container">
        <div class="card" id="questionCard">
            <div id="qNum" class="question-num">Question 30</div>
            <div id="qText" class="question-text">Loading question...</div>
            <div id="options" class="options-grid"></div>
            
            <div id="explanation" class="explanation-box">
                <div class="explanation-title">Cô MS Chí Nên giải thích nè:</div>
                <div id="explanationContent"></div>
            </div>
        </div>
    </div>

    <div class="nav-buttons">
        <div style="width: 50px;"></div> <!-- Spacer -->
        <button id="nextBtn" class="nav-btn next-btn" style="display:none;">Câu tiếp theo ➔</button>
    </div>

    <div id="resultScreen" class="result-screen">
        <h1 style="font-size: 3rem;">🎉</h1>
        <h2 id="scoreText">Tuyệt vời! Bạn đạt được 20/21 câu!</h2>
        <p id="feedbackText">Bạn rất chăm chỉ, hãy phát huy nhé!</p>
        <button onclick="location.reload()" class="nav-btn next-btn" style="margin-top: 20px;">Làm lại từ đầu</button>
    </div>

    <!-- Audio elements -->
    <audio id="soundCorrect" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bbd15144f3.mp3"></audio>
    <audio id="soundWrong" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c35278d35a.mp3"></audio>

    <script>
        const questions = [
            {
                number: 30,
                question: "You should take the double-decker bus. It's the best way to visit famous tourist ________ in Hà Nội. (ATTRACT)",
                options: ["attractions", "attractive", "attraction", "attract"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. attractions (n - số nhiều): các điểm tham quan/sức hút.",
                        "B. attractive (adj): hấp dẫn, lôi cuốn.",
                        "C. attraction (n - số ít): sự thu hút/điểm thu hút.",
                        "D. attract (v): thu hút."
                    ],
                    sentenceTrans: "Bạn nên đi xe buýt hai tầng. Đó là cách tốt nhất để ghé thăm các điểm tham quan du lịch nổi tiếng ở Hà Nội.",
                    reason: "Ở đây chúng ta cần một danh từ đứng sau cụm 'famous tourist' (tính từ). Cụm 'tourist attractions' là một cụm danh từ ghép cố định chỉ 'các địa điểm tham quan du lịch'. Vì Hà Nội có nhiều địa điểm, ta chọn dạng số nhiều 'attractions'.",
                    whyOthers: "Loại B vì là tính từ. Loại D vì là động từ. Loại C là danh từ số ít, không phù hợp khi nói về việc đi tham quan nhiều nơi ở một thành phố lớn."
                }
            },
            {
                number: 31,
                question: "The ________ exam is very difficult and few students can finish it. (ENTER)",
                options: ["entrance", "entry", "enter", "entering"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. entrance (n): lối vào/kỳ thi tuyển sinh.",
                        "B. entry (n): sự đi vào/mục ghi chép.",
                        "C. enter (v): đi vào.",
                        "D. entering (v-ing): việc đi vào."
                    ],
                    sentenceTrans: "Kỳ thi tuyển sinh rất khó và rất ít học sinh có thể hoàn thành nó.",
                    reason: "Cụm danh từ cố định 'entrance exam' có nghĩa là 'kỳ thi tuyển sinh' hoặc 'kỳ thi đầu vào'.",
                    whyOthers: "Loại B 'entry exam' không phổ biến bằng. C và D là động từ không phù hợp đứng trước danh từ 'exam' để tạo thành cụm từ này."
                }
            },
            {
                number: 32,
                question: "There are ________ ways that you can do to help the community. (DIFFER)",
                options: ["different", "difference", "differ", "differently"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. different (adj): khác nhau.",
                        "B. difference (n): sự khác biệt.",
                        "C. differ (v): khác/khác biệt.",
                        "D. differently (adv): một cách khác biệt."
                    ],
                    sentenceTrans: "Có nhiều cách khác nhau mà bạn có thể làm để giúp đỡ cộng đồng.",
                    reason: "Trước danh từ 'ways' (các cách) chúng ta cần một tính từ (Adjective) để bổ nghĩa cho nó.",
                    whyOthers: "B là danh từ. C là động từ. D là trạng từ. Chỉ có tính từ mới đứng trước danh từ để miêu tả tính chất."
                }
            },
            {
                number: 33,
                question: "The hover scooter is our new ________. (create)",
                options: ["creation", "creator", "creative", "create"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. creation (n): sản phẩm sáng tạo/sự tạo ra.",
                        "B. creator (n): người sáng tạo/người tạo ra.",
                        "C. creative (adj): đầy sáng tạo.",
                        "D. create (v): sáng tạo/tạo ra."
                    ],
                    sentenceTrans: "Xe trượt bay là sản phẩm sáng tạo mới của chúng tôi.",
                    reason: "Sau tính từ 'new' cần một danh từ. Vì 'hover scooter' là một đồ vật (sản phẩm), nên ta dùng 'creation'.",
                    whyOthers: "B 'creator' chỉ người, không hợp ngữ cảnh. C là tính từ. D là động từ."
                }
            },
            {
                number: 34,
                question: "If we don't stop ________, more than half of our plants and animal species will disappear. (FOREST)",
                options: ["deforestation", "forestry", "forest", "afforestation"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. deforestation (n): nạn phá rừng.",
                        "B. forestry (n): lâm nghiệp.",
                        "C. forest (n): khu rừng.",
                        "D. afforestation (n): sự trồng rừng."
                    ],
                    sentenceTrans: "Nếu chúng ta không ngăn chặn nạn phá rừng, hơn một nửa số loài thực vật và động vật của chúng ta sẽ biến mất.",
                    reason: "Ngữ cảnh nói về việc các loài sẽ biến mất (disappear) nên hành động cần 'stop' (dừng lại) phải là một hành động xấu: phá rừng.",
                    whyOthers: "B, C, D không mang nghĩa phá rừng. Đặc biệt D mang nghĩa ngược lại (trồng rừng)."
                }
            },
            {
                number: 35,
                question: "Vietnam's New Year is ________ according to the Lunar calendar. (celebrate)",
                options: ["celebrated", "celebration", "celebrate", "celebrating"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. celebrated (v-ed): được tổ chức/ăn mừng.",
                        "B. celebration (n): lễ kỷ niệm.",
                        "C. celebrate (v): tổ chức.",
                        "D. celebrating (v-ing): đang tổ chức."
                    ],
                    sentenceTrans: "Tết (Năm mới) của Việt Nam được tổ chức theo Âm lịch.",
                    reason: "Cấu trúc bị động (Passive Voice): S + be + V3/ed. 'New Year' không thể tự tổ chức mà phải 'được tổ chức'.",
                    whyOthers: "B là danh từ. C là động từ nguyên mẫu. D là dạng chủ động."
                }
            },
            {
                number: 36,
                question: "We sat on the beach ________ a spectacular sunset. (watch)",
                options: ["watching", "watched", "watch", "watcher"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. watching (v-ing): đang xem/ngắm.",
                        "B. watched (v-ed): đã xem.",
                        "C. watch (v): xem.",
                        "D. watcher (n): người xem."
                    ],
                    sentenceTrans: "Chúng tôi đã ngồi trên bãi biển ngắm cảnh hoàng hôn ngoạn mục.",
                    reason: "Rút gọn mệnh đề quan hệ hoặc diễn tả hai hành động xảy ra đồng thời cùng một chủ ngữ. Chúng tôi ngồi VÀ chúng tôi ngắm -> dùng V-ing.",
                    whyOthers: "B không đúng thì. C không đúng cấu trúc sau động từ 'sat'. D là danh từ."
                }
            },
            {
                number: 37,
                question: "Yok Đôn is one of the biggest ________ parks in Vietnam. (NATION)",
                options: ["national", "nation", "nationality", "nationally"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. national (adj): thuộc về quốc gia.",
                        "B. nation (n): quốc gia.",
                        "C. nationality (n): quốc tịch.",
                        "D. nationally (adv): trên quy mô toàn quốc."
                    ],
                    sentenceTrans: "Yok Đôn là một trong những vườn quốc gia lớn nhất Việt Nam.",
                    reason: "Trước danh từ 'parks' cần một tính từ. Cụm từ 'national park' là Vườn quốc gia.",
                    whyOthers: "B và C là danh từ. D là trạng từ."
                }
            },
            {
                number: 38,
                question: "Lucas doesn't like snorkeling. He thinks it's ________. (DANGER)",
                options: ["dangerous", "danger", "dangerously", "endanger"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. dangerous (adj): nguy hiểm.",
                        "B. danger (n): sự nguy hiểm.",
                        "C. dangerously (adv): một cách nguy hiểm.",
                        "D. endanger (v): gây nguy hiểm."
                    ],
                    sentenceTrans: "Lucas không thích lặn với ống thở. Anh ấy nghĩ việc đó nguy hiểm.",
                    reason: "Sau động từ to be 'is' cần một tính từ (Adjective) để miêu tả đặc điểm của sự vật (it - việc lặn).",
                    whyOthers: "B là danh từ. C là trạng từ (thường bổ nghĩa cho động từ). D là động từ."
                }
            },
            {
                number: 39,
                question: "The hotel shuttle service is ________. It leaves from here every 30 minutes. (RELY)",
                options: ["reliable", "rely", "reliability", "reliably"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. reliable (adj): đáng tin cậy.",
                        "B. rely (v): dựa vào/tin cậy.",
                        "C. reliability (n): sự đáng tin cậy.",
                        "D. reliably (adv): một cách đáng tin cậy."
                    ],
                    sentenceTrans: "Dịch vụ xe đưa đón của khách sạn rất đáng tin cậy. Xe khởi hành cứ mỗi 30 phút.",
                    reason: "Sau 'is' cần tính từ. Ngữ cảnh xe chạy rất đúng giờ, đều đặn nên nó 'đáng tin'.",
                    whyOthers: "B là động từ. C là danh từ. D là trạng từ."
                }
            },
            {
                number: 40,
                question: "________, this dish is cooked with coconut and beans. (TRADITION)",
                options: ["Traditionally", "Traditional", "Tradition", "Traditionalist"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. Traditionally (adv): theo truyền thống.",
                        "B. Traditional (adj): thuộc về truyền thống.",
                        "C. Tradition (n): truyền thống.",
                        "D. Traditionalist (n): người theo chủ nghĩa truyền thống."
                    ],
                    sentenceTrans: "Theo truyền thống, món ăn này được nấu với dừa và đậu.",
                    reason: "Vị trí đứng đầu câu và ngăn cách bởi dấu phẩy cần một trạng từ (Adverb) để bổ nghĩa cho toàn bộ mệnh đề phía sau.",
                    whyOthers: "B là tính từ (phải đi kèm danh từ). C và D là danh từ không đứng ở vị trí này để bổ nghĩa cho câu."
                }
            },
            {
                number: 41,
                question: "The river in my hometown is heavily ________. (POLLUTE)",
                options: ["polluted", "pollution", "pollute", "pollutant"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. polluted (adj): bị ô nhiễm.",
                        "B. pollution (n): sự ô nhiễm.",
                        "C. pollute (v): làm ô nhiễm.",
                        "D. pollutant (n): chất gây ô nhiễm."
                    ],
                    sentenceTrans: "Con sông ở quê tôi bị ô nhiễm nặng.",
                    reason: "Cấu trúc bị động hoặc dùng tính từ sau to be 'is'. Trạng từ 'heavily' (nặng nề) bổ nghĩa cho tính từ/động từ phân từ 2 'polluted'.",
                    whyOthers: "B là danh từ. C là động từ nguyên mẫu. D là danh từ chỉ chất gây hại."
                }
            },
            {
                number: 42,
                question: "Last summer holiday, my family went to Da Nang and Hoi An. We had a ________ time there. (wonder)",
                options: ["wonderful", "wonder", "wonderfully", "wondering"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. wonderful (adj): tuyệt vời.",
                        "B. wonder (n/v): kỳ quan/tự hỏi.",
                        "C. wonderfully (adv): một cách tuyệt vời.",
                        "D. wondering (v-ing): đang tự hỏi."
                    ],
                    sentenceTrans: "Kỳ nghỉ hè năm ngoái, gia đình tôi đã đi Đà Nẵng và Hội An. Chúng tôi đã có một khoảng thời gian tuyệt vời ở đó.",
                    reason: "Trước danh từ 'time' cần một tính từ bổ nghĩa.",
                    whyOthers: "B là danh từ/động từ. C là trạng từ. D là dạng V-ing."
                }
            },
            {
                number: 43,
                question: "The team has many talented ________. (play)",
                options: ["players", "player", "play", "playful"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. players (n-số nhiều): các cầu thủ/người chơi.",
                        "B. player (n-số ít): cầu thủ.",
                        "C. play (v): chơi.",
                        "D. playful (adj): ham chơi."
                    ],
                    sentenceTrans: "Đội bóng có nhiều cầu thủ tài năng.",
                    reason: "Sau 'many' (nhiều) bắt buộc phải là danh từ số nhiều.",
                    whyOthers: "B là số ít (sai ngữ pháp sau many). C là động từ. D là tính từ."
                }
            },
            {
                number: 44,
                question: "Solar power can be used to ________ or cool our houses. (hot)",
                options: ["heat", "hot", "heater", "heating"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. heat (v): làm nóng/sưởi ấm.",
                        "B. hot (adj): nóng.",
                        "C. heater (n): máy sưởi.",
                        "D. heating (n): hệ thống sưởi."
                    ],

            },
            {

                    ],

                    whyOthers: "C chỉ người. D là động từ. B là số ít ít phù hợp hơn số nhiều trong ngữ cảnh lễ hội."

                    ],

                    whyOthers: "Giống câu 38, B là danh từ, C là trạng từ, D là động từ."
                }
            },

            },
            {
                number: 50,
                question: "Eating more fruit will help us study ________ and feel healthier. (GOOD)",
                options: ["better", "well", "good", "best"],
                correct: 0,
                analysis: {
                    translations: [
                        "A. better (adv-so sánh hơn): tốt hơn.",
                        "B. well (adv): tốt.",
                        "C. good (adj): tốt.",

                    ],
                    sentenceTrans: "Ăn nhiều trái cây hơn sẽ giúp chúng ta học tập tốt hơn và cảm thấy khỏe mạnh hơn.",
                    reason: "Cần trạng từ bổ nghĩa cho động từ 'study'. Do vế sau là 'feel healthier' (so sánh hơn) nên vế trước cũng dùng so sánh hơn 'better'.",
                    whyOthers: "B là trạng từ thường. C là tính từ. D là so sánh nhất."
                }
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        let shuffledQuestions = [];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initQuiz() {
            shuffledQuestions = shuffle([...questions]);
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            const q = shuffledQuestions[currentQuestionIndex];
            document.getElementById('qNum').innerText = `Question ${q.number}`;
            document.getElementById('qText').innerText = q.question;
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            // Shuffle options for each question
            let optionsWithIndices = q.options.map((opt, index) => ({ text: opt, originalIndex: index }));
            optionsWithIndices = shuffle(optionsWithIndices);

            optionsWithIndices.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => checkAnswer(opt.originalIndex, q.correct, btn);
                optionsContainer.appendChild(btn);
            });

            updateProgressBar();
        }

        function checkAnswer(selectedIndex, correctIndex, btn) {
            if (answered) return;
            answered = true;

            const q = shuffledQuestions[currentQuestionIndex];
            const allBtns = document.querySelectorAll('.option-btn');
            
            if (selectedIndex === correctIndex) {
                btn.classList.add('correct');
                score++;
                playCorrect();
                showConfetti();
            } else {
                btn.classList.add('wrong');
                document.getElementById('questionCard').classList.add('shake');
                setTimeout(() => document.getElementById('questionCard').classList.remove('shake'), 500);
                playWrong();
                // Highlight correct one
                allBtns.forEach(b => {
                    const optObj = q.options.find(o => o === b.innerText);
                    if (q.options.indexOf(b.innerText) === correctIndex) {
                        b.classList.add('correct');
                    }
                });
            }

            showExplanation(q);
            document.getElementById('nextBtn').style.display = 'block';
            if (currentQuestionIndex === shuffledQuestions.length - 1) {
                document.getElementById('nextBtn').innerText = 'Xem kết quả ➔';
            }
        }

        function showExplanation(q) {
            const content = document.getElementById('explanationContent');
            content.innerHTML = `
                <div class="analysis-step">
                    <strong>1. Dịch nghĩa câu:</strong><br>
                    <em>"${q.analysis.sentenceTrans}"</em>
                </div>
                <div class="analysis-step">
                    <strong>2. Phân tích 4 đáp án:</strong><br>
                    ${q.analysis.translations.join('<br>')}
                </div>
                <div class="analysis-step">
                    <strong>3. Tại sao chọn đáp án này?</strong><br>
                    ${q.analysis.reason}
                </div>
                <div class="analysis-step">
                    <strong>4. Tại sao các phương án kia sai?</strong><br>
                    ${q.analysis.whyOthers}
                </div>
                <p style="text-align:right; font-weight:bold; color:var(--correct-color)">Đáp án đúng: ${q.options[q.correct]}</p>
            `;
            document.getElementById('explanation').style.display = 'block';
        }

        function updateProgressBar() {
            const progress = ((currentQuestionIndex) / shuffledQuestions.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('progressBar').parentElement.style.display = 'none';
            
            const resultScreen = document.getElementById('resultScreen');
            resultScreen.style.display = 'block';
            
            const percent = (score / shuffledQuestions.length) * 100;
            document.getElementById('scoreText').innerText = `Bạn đúng được ${score}/${shuffledQuestions.length} câu!`;
            
            let feedback = "";
            if (percent === 100) feedback = "Xuất sắc! Bạn là thiên tài Word Form rồi đấy! 🌟";
            else if (percent >= 80) feedback = "Tuyệt vời! Kiến thức của bạn rất vững chắc! 🔥";
            else if (percent >= 50) feedback = "Khá tốt! Đọc kỹ giải thích của cô để tiến bộ hơn nhé! 👍";
            else feedback = "Đừng nản chí! Hãy xem lại các cấu trúc cô đã giải thích và thử lại nhé! 💪";
            
            document.getElementById('feedbackText').innerText = feedback;
            showConfetti();
        }

        function showConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#8854C0', '#00C9A7', '#FFD700']
            });
        }

        function playCorrect() {
            const sound = document.getElementById('soundCorrect');
            sound.currentTime = 0;
            sound.play();
        }

        function playWrong() {
            const sound = document.getElementById('soundWrong');
            sound.currentTime = 0;
            sound.play();
        }

        document.getElementById('nextBtn').onclick = nextQuestion;

        window.onload = initQuiz;
    </script>
</body>
