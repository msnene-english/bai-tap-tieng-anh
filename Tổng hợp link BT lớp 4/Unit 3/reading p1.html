<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English 4 · Unit 3 My Week — Ex12+Ex13 | Ms MS Chí Nên</title>

<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moss:#cdb4db; --leaf:#7b2cbf; --sky:#a2d2ff; --sun:#ffd6a5; --clay:#ff8fab; --cream:#fff7f0;
  --ink:#3c1642;
  --p-word:#c1121f; --p-mean:#1d6fb8; --p-gram:#6a4c93;
  --green:#2a9d8f; --red:#e5383b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:19px}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#cdb4db,#a2d2ff,#ffd6a5,#ff8fab,#7b2cbf);background-size:400% 400%;animation:bg 18s ease infinite;}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.3) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:50px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(17px,2.5vw,27px);margin:0;letter-spacing:1.5px;color:#fff;-webkit-text-stroke:1.8px var(--ink);text-shadow:2px 2px 0 var(--clay),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:13px;margin-top:1px;display:inline-block;background:rgba(255,255,255,.7);border:1.5px solid var(--ink);border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(247,244,234,.45);border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(60,22,66,.25)}
.pane::-webkit-scrollbar{width:10px}.pane::-webkit-scrollbar-thumb{background:var(--leaf);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:24px;letter-spacing:1px;position:sticky;top:0;z-index:2;margin:0 -10px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--clay),var(--leaf));border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:24px;letter-spacing:1px;margin:16px 0 8px;color:var(--ink);background:var(--sun);display:inline-block;padding:2px 14px;border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.rd{background:rgba(255,255,255,.6);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:3px 3px 0 rgba(60,22,66,.2)}
.rd p{margin:8px 0;line-height:1.9;font-size:17.5px}
.gap{font-family:'Bangers',cursive;background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:0 9px;margin:0 3px;font-size:16px}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--leaf);color:#fff;font-weight:800;font-size:14.5px;border-radius:20px;padding:3px 12px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#f8f0ff;border-left:5px solid var(--leaf);border-radius:8px;padding:10px 12px;font-size:16.5px;line-height:1.85;color:#3c1642}
.q{background:rgba(255,255,255,.62);border:3px solid var(--ink);border-radius:18px;padding:13px 15px;margin:13px 0;box-shadow:5px 5px 0 rgba(60,22,66,.2)}
.q .qtxt{font-weight:800;font-size:18px;margin-bottom:12px;display:flex;gap:8px;line-height:1.5}
.q .badge{font-family:'Bangers',cursive;background:var(--clay);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:18px;line-height:1.5;background:rgba(255,255,255,.92);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf5;border:2.5px dashed var(--ink);border-radius:14px;padding:14px;font-size:16.5px;line-height:1.8}
.exp h4{margin:0 0 8px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:22px}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#efe4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(247,244,234,.55);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sky),var(--clay));transition:width .3s}
.progtxt{font-weight:800;font-size:14px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#f4a261,#74c69d);border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(60,22,66,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#f7f4ea);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(60,22,66,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:44px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:30px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sun);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--sky);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){body{overflow:auto}.wrap{height:auto;min-height:100%}.split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}.float{font-size:36px}footer{position:sticky;bottom:0}}
/* ── thanh nhac nho (bo sung, dung theo phong cach comic) ── */
.note{position:sticky;top:0;z-index:5;margin:0 0 4px;padding:4px 12px;text-align:center;
  background:linear-gradient(90deg,var(--clay),var(--leaf));border-bottom:3px solid var(--ink);
  font-weight:800;font-size:13.5px;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
</style>
</head>

<script>
function opt(en){return {en}}
const PARTS = [
{
 title:"📅 Ex12 — My Weekly Activities (Câu 1–7)",
 left:`
 <div class="rd"><p>In the morning, I go to school from Monday to Friday.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Vào buổi sáng, mình đi học từ thứ Hai đến thứ Sáu.</div></div>

 <div class="rd"><p>On Wednesday afternoons, I have a Maths class. I play chess with my friends on Tuesdays and Thursdays.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Vào chiều thứ Tư, mình học môn Toán. Mình chơi cờ vua với bạn bè vào thứ Ba và thứ Năm.</div></div>

 <div class="rd"><p>On Friday afternoons, I play badminton with my friends.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Vào chiều thứ Sáu, mình chơi cầu lông với bạn bè.</div></div>

 <div class="rd"><p>On Sundays, I help my parents with the housework in the morning and in the afternoon, I visit my grandparents.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Vào Chủ Nhật, buổi sáng mình giúp bố mẹ làm việc nhà và buổi chiều mình đi thăm ông bà.</div></div>

 <div class="rd"><b>📚 Glossary</b>
 <table class="gtb" style="width:100%;table-layout:fixed;border-collapse:collapse;font-size:14.5px">
 <colgroup><col style="width:38%"><col style="width:62%"></colgroup>
 <tr><th style="background:var(--clay);color:#fff;border:2px solid var(--ink);padding:4px 7px;text-align:left">Word</th><th style="background:var(--clay);color:#fff;border:2px solid var(--ink);padding:4px 7px;text-align:left">Nghĩa</th></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">weekday</td><td style="border:2px solid var(--ink);padding:4px 7px">ngày trong tuần</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">weekend</td><td style="border:2px solid var(--ink);padding:4px 7px">cuối tuần</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">housework</td><td style="border:2px solid var(--ink);padding:4px 7px">việc nhà</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">badminton</td><td style="border:2px solid var(--ink);padding:4px 7px">cầu lông</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">chess</td><td style="border:2px solid var(--ink);padding:4px 7px">cờ vua</td></tr>
 </table></div>`,
 qs:[
  {n:"1",q:"What does the writer do from Monday to Friday in the morning?",
   opts:[opt("go to school"),opt("play chess"),opt("do housework"),opt("visit grandparents")],a:"go to school",
   exp:`<h4>🧠 Câu 1</h4>
   <b>① Dịch cả câu:</b> "Bạn ấy làm gì vào buổi sáng từ thứ Hai đến thứ Sáu?"<br>
   <b>② Các phương án và nghĩa:</b>
   <ul><li><span class="p-word">go to school</span> ➔ <span class="p-mean">đi học</span></li>
   <li><span class="p-word">play chess</span> ➔ <span class="p-mean">chơi cờ vua</span></li>
   <li><span class="p-word">do housework</span> ➔ <span class="p-mean">làm việc nhà</span></li>
   <li><span class="p-word">visit grandparents</span> ➔ <span class="p-mean">thăm ông bà</span></li></ul>
   <b>③ <span class="hl-green">Vì sao đúng:</span></b> Bài đọc nói rõ ngay câu đầu: buổi sáng bạn ấy <span class="p-grammar">đi học</span> từ thứ Hai đến thứ Sáu.<br>
   <b>④ <span class="hl-red">Vì sao sai:</span></b> <span class="hl-red">play chess</span>, <span class="hl-red">do housework</span>, <span class="hl-red">visit grandparents</span> đều là hoạt động của những ngày/buổi khác trong tuần, không phải buổi sáng các ngày trong tuần.<br>
   <b>⑤ 🔍 Dẫn chứng:</b> <span class="p-word">In the morning, I go to school from Monday to Friday.</span> 👉 <span class="p-mean">Vào buổi sáng, mình đi học từ thứ Hai đến thứ Sáu.</span>`},
  {n:"2",q:"What does the writer do on Tuesday afternoons?",
   opts:[opt("have a Maths class"),opt("play chess with friends"),opt("play badminton"),opt("visit grandparents")],a:"play chess with friends",
   exp:`<h4>🧠 Câu 2</h4>
   <b>① Dịch cả câu:</b> "Bạn ấy làm gì vào chiều thứ Ba?"<br>
   <b>② Các phương án và nghĩa:</b>
   <ul><li><span class="p-word">have a Maths class</span> ➔ <span class="p-mean">học môn Toán</span></li>
   <li><span class="p-word">play chess with friends</span> ➔ <span class="p-mean">chơi cờ vua với bạn</span></li>
   <li><span class="p-word">play badminton</span> ➔ <span class="p-mean">chơi cầu lông</span></li>
   <li><span class="p-word">visit grandparents</span> ➔ <span class="p-mean">thăm ông bà</span></li></ul>
   <b>③ <span class="hl-green">Vì sao đúng:</span></b> Bài đọc nói bạn ấy chơi cờ vua với bạn bè vào <span class="p-grammar">thứ Ba và thứ Năm</span>.<br>
   <b>④ <span class="hl-red">Vì sao sai:</span></b> <span class="hl-red">have a Maths class</span> là hoạt động thứ Tư; <span class="hl-red">play badminton</span> là hoạt động thứ Sáu; <span class="hl-red">visit grandparents</span> là hoạt động Chủ Nhật.<br>
   <b>⑤ 🔍 Dẫn chứng:</b> <span class="p-word">I play chess with my friends on Tuesdays and Thursdays.</span> 👉 <span class="p-mean">Mình chơi cờ vua với bạn bè vào thứ Ba và thứ Năm.</span>`},
  {n:"3",q:"What does the writer do on Wednesday afternoons?",
   opts:[opt("play chess"),opt("have a Maths class"),opt("play badminton"),opt("go to school")],a:"have a Maths class",
   exp:`<h4>🧠 Câu 3</h4>
   <b>① Dịch cả câu:</b> "Bạn ấy làm gì vào chiều thứ Tư?"<br>
   <b>② Các phương án và nghĩa:</b>
   <ul><li><span class="p-word">play chess</span> ➔ <span class="p-mean">chơi cờ vua</span></li>
   <li><span class="p-word">have a Maths class</span> ➔ <span class="p-mean">học môn Toán</span></li>
   <li><span class="p-word">play badminton</span> ➔ <span class="p-mean">chơi cầu lông</span></li>
   <li><span class="p-word">go to school</span> ➔ <span class="p-mean">đi học (buổi sáng)</span></li></ul>
   <b>③ <span class="hl-green">Vì sao đúng:</span></b> Bài đọc nói rõ: <span class="p-grammar">chiều thứ Tư</span> bạn ấy học môn Toán.<br>
   <b>④ <span class="hl-red">Vì sao sai:</span></b> <span class="hl-red">play chess</span> là thứ Ba/Năm; <span class="hl-red">play badminton</span> là thứ Sáu; <span class="hl-red">go to school</span> là hoạt động BUỔI SÁNG, không phải buổi chiều.<br>
   <b>⑤ 🔍 Dẫn chứng:</b> <span class="p-word">On Wednesday afternoons, I have a Maths class.</span> 👉 <span class="p-mean">Vào chiều thứ Tư, mình học môn Toán.</span>`},
  {n:"4",q:"What does the writer do on Thursday afternoons?",
   opts:[opt("play badminton"),opt("have a Maths class"),opt("play chess with friends"),opt("help with housework")],a:"play chess with friends",
   exp:`<h4>🧠 Câu 4</h4>
   <b>① Dịch cả câu:</b> "Bạn ấy làm gì vào chiều thứ Năm?"<br>
   <b>② Các phương án và nghĩa:</b>
   <ul><li><span class="p-word">play badminton</span> ➔ <span class="p-mean">chơi cầu lông</span></li>
   <li><span class="p-word">have a Maths class</span> ➔ <span class="p-mean">học môn Toán</span></li>
   <li><span class="p-word">play chess with friends</span> ➔ <span class="p-mean">chơi cờ vua với bạn</span></li>
   <li><span class="p-word">help with housework</span> ➔ <span class="p-mean">giúp việc nhà</span></li></ul>
   <b>③ <span class="hl-green">Vì sao đúng:</span></b> Bài đọc nói bạn ấy chơi cờ vua vào <span class="p-grammar">thứ Ba và thứ Năm</span>.<br>

function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#cdb4db','#a2d2ff','#ffd6a5','#ff8fab','#7b2cbf','#fff7f0'];

function tg(btn){const t=btn.nextElementSibling;const open=t.classList.contains('show')||t.style.display==='block';t.style.display=open?'none':'block';t.classList.toggle('show',!open);btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Con giỏi quá, đúng trọn '+TOTAL+' câu về My Week! Ms MS Chí Nên rất tự hào về con! ☎️ 0852639652 để đăng ký khoá học cùng Ms nhé.';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Con giỏi lắm! Chỉ cần cẩn thận thêm chút là hoàn hảo rồi! ☎️ 0852639652 để đăng ký khoá học cùng Ms.';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Con làm khá tốt rồi! Đọc kỹ phần giải thích để hiểu sâu hơn nhé con! ☎️ 0852639652 để đăng ký khoá học cùng Ms.';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Không sao đâu con ơi! Con đọc lại phần giải thích rồi làm lại nhé — Ms tin con sẽ làm tốt hơn! ☎️ 0852639652 để đăng ký khoá học cùng Ms.';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms MS Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
