<head>

<title>UNIT 8 · MY FAVOURITE SUBJECTS — Ex12,15 | Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Caveat:wght@600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#4EA8DE; --sky-d:#2C6E9E; --sun:#FFD23F; --sun-d:#C99A0E; --coral:#FF6B6B; --coral-d:#D94848;
  --mint:#06D6A0; --mint-d:#03976F; --grape:#7B61FF; --grape-d:#5A42D6;
  --cream:#FFFDF7; --ink:#1B263B;
  --p-word:#D62839; --p-mean:#1D6FB8; --p-gram:#6A4C93;
  --green:#2a9d8f; --red:#e5383b;
  /* legacy aliases kept so inline references still resolve */
  --wood:var(--sun-d); --wood-d:var(--sun-d); --paper:var(--cream); --line:var(--sky); --margin:var(--coral);
  --accent:var(--grape); --accent-d:var(--grape-d);
  --sticky:var(--sun); --sticky-d:var(--sun-d); --mint-d2:var(--mint-d);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:19px}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,var(--sky),var(--grape),var(--sun),var(--coral));background-size:400% 400%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.3) 1.5px,transparent 1.6px);background-size:22px 22px}
.float{position:absolute;font-size:48px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
/* ── sticky note bar ── */
.note{position:sticky;top:0;z-index:40;margin:0;padding:6px 14px;text-align:center;font-weight:800;font-size:14.5px;
  color:#fff;background:linear-gradient(90deg,var(--grape),var(--coral),var(--sun));text-shadow:0 1px 3px rgba(0,0,0,.3);
  box-shadow:0 3px 10px rgba(0,0,0,.2)}
/* ── header: comic sign board ── */
header{padding:6px 14px 4px;text-align:center}
header h1{font-family:'Baloo 2',cursive;font-size:clamp(17px,2.5vw,27px);margin:0;letter-spacing:1px;color:#fff;
  -webkit-text-stroke:1.6px var(--ink);text-shadow:2px 2px 0 var(--coral),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:13px;margin-top:3px;display:inline-block;background:rgba(255,255,255,.75);
  border:1.5px solid var(--ink);border-radius:16px;padding:2px 12px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
/* ── glass pane ── */
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(255,253,247,.5);border:3px solid var(--ink);
  backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(27,38,59,.25)}
.pane::-webkit-scrollbar{width:10px}.pane::-webkit-scrollbar-thumb{background:var(--grape);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Baloo 2',cursive;font-size:23px;letter-spacing:1px;position:sticky;top:0;z-index:2;margin:0 -10px 8px;
  padding:5px 12px;background:linear-gradient(90deg,var(--sky),var(--grape));border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1px var(--ink)}
h2.sec{font-family:'Baloo 2',cursive;font-size:22px;letter-spacing:1px;margin:16px 0 8px;color:var(--ink);background:var(--sun);
  display:inline-block;padding:2px 14px;border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.rd{background:rgba(255,255,255,.65);border:2.5px solid var(--ink);border-radius:16px;padding:11px 14px;margin:10px 0;box-shadow:3px 3px 0 rgba(27,38,59,.2)}
.rd p{margin:0;line-height:1.9;font-size:17px}
.gap{font-family:'Baloo 2',cursive;background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:0 9px;margin:0 3px;font-size:15.5px}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--grape);color:#fff;font-weight:800;font-size:13.5px;
  border-radius:20px;padding:3px 13px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#eaf6ff;border-left:5px solid var(--sky-d);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.8;color:var(--ink)}
.voc{margin:14px 0 4px;background:rgba(255,255,255,.85);border:2.5px solid var(--ink);border-radius:14px;padding:10px 13px}
.voc b{font-family:'Baloo 2';color:var(--grape-d)}
table.gtb{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;margin-top:6px}
.gtb th{background:var(--sky);color:#fff;border:2px solid var(--ink);padding:4px 7px;text-align:left}
.gtb td{border:2px solid var(--ink);padding:4px 7px}
.gtb .gw{font-weight:800;color:var(--p-word)}
/* ── comic question card ── */
.q{background:rgba(255,255,255,.68);border:3px solid var(--ink);border-radius:18px;padding:13px 15px;margin:13px 0;box-shadow:5px 5px 0 rgba(27,38,59,.2)}
.q .qtxt{font-weight:800;font-size:18px;margin-bottom:12px;display:flex;gap:8px;line-height:1.5}
.q .badge{font-family:'Baloo 2',cursive;background:var(--coral);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.5px var(--ink);
  border-radius:12px;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:17px;line-height:1.5;background:rgba(255,255,255,.92);border:2.5px solid var(--ink);
  border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf5;border:2.5px dashed var(--ink);border-radius:14px;padding:14px;font-size:16px;line-height:1.8}
.exp h4{margin:0 0 8px;font-family:'Baloo 2',cursive;letter-spacing:1px;font-size:21px;color:var(--grape-d)}
.p-word{color:var(--p-word);font-weight:800}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#efe4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
/* ── footer: comic progress ── */
footer{display:flex;align-items:center;gap:10px;padding:5px 14px;background:rgba(255,253,247,.55);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--grape),var(--sky),var(--coral));transition:width .3s}
.progtxt{font-weight:800;font-size:13.5px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Baloo 2',cursive;font-size:15px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.5px var(--ink);
  background:linear-gradient(90deg,var(--sun-d),var(--mint));border:2.5px solid var(--ink);border-radius:14px;padding:5px 15px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:0 0 0}
.overlay{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(27,38,59,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,var(--cream));border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;
  text-align:center;box-shadow:10px 10px 0 rgba(27,38,59,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Baloo 2',cursive;font-size:28px;letter-spacing:1px;margin:4px 0;color:var(--grape-d)}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Baloo 2',cursive;font-size:19px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.5px var(--ink);
  background:var(--mint);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Baloo 2',cursive;font-size:42px;color:var(--p-mean);-webkit-text-stroke:1.3px var(--ink);margin:6px 0}
.score-10{font-family:'Baloo 2',cursive;font-size:28px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:250px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sun);min-height:115px;
  display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:#DCEEFB;border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0;font-size:15px}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:90;pointer-events:none;border-radius:2px}
@media(max-width:820px){body{overflow:auto}.wrap{height:auto;min-height:100%}.split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}.float{font-size:34px}footer{position:sticky;bottom:0}}
.fin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fin input{font-family:'Nunito';font-weight:700;font-size:16px;padding:9px 12px;border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);min-width:160px;flex:1}
.fin input.correct{background:#8ce99a;border-color:#2b8a3e}
.fin input.wrong{background:#ffa8a8;border-color:#c92a2a}
.checkbtn{cursor:pointer;font-family:'Baloo 2',cursive;font-size:15px;letter-spacing:.4px;color:#fff;-webkit-text-stroke:.4px var(--ink);
  background:var(--grape);border:2.5px solid var(--ink);border-radius:12px;padding:7px 16px;box-shadow:3px 3px 0 var(--ink)}
.checkbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
</style>
</head>

  <header>
    <h1>🔢 UNIT 8 · MY FAVOURITE SUBJECTS 📖</h1>
    <div class="sub">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên &nbsp;·&nbsp; Ex12,15 · 9 câu &nbsp;·&nbsp; 📞 0852639652</div>

</div></div>
<script>
const PARTS = [
{
 title:"📘 Ex12. Andy and Maths (5 câu — Trả lời câu hỏi)",
 left:`
 <div class="rd"><p>My name is Andy. Maths is one of my favourite subjects. I like it because I want to become an excellent Maths teacher. I am keen on Maths.</p></div>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Tên tôi là Andy. Toán là một trong những môn học yêu thích của tôi. Tôi thích môn này vì tôi muốn trở thành một giáo viên Toán xuất sắc. Tôi rất đam mê môn Toán.</div>

 <div class="rd"><p>Mathematics helps me to develop my ability to think logically and to train for reflection. I can think faster and react better to numbers thanks to Maths.</p></div>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Toán học giúp tôi phát triển khả năng tư duy logic và rèn luyện khả năng suy ngẫm. Nhờ môn Toán, tôi có thể suy nghĩ nhanh hơn và phản ứng tốt hơn với các con số.</div>

 <div class="rd"><p>I always spend a lot of time reading books about Mathematics. I also join the Maths club at school so I can improve my knowledge. On the other hand, I want to exchange knowledge of Mathematics with people who love this subject like me.</p></div>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Tôi luôn dành nhiều thời gian đọc sách về Toán học. Tôi cũng tham gia câu lạc bộ Toán ở trường để có thể nâng cao kiến thức của mình. Mặt khác, tôi muốn trao đổi kiến thức Toán học với những người yêu thích môn học này giống tôi.</div>

 <div class="voc"><b>📚 Từ vựng cần nhớ</b>
 <table class="gtb">
 <tr><th style="width:32%">Word</th><th style="width:28%">Phiên âm</th><th>Nghĩa</th></tr>
 <tr><td class="gw">excellent</td><td>/ˈeksələnt/</td><td>xuất sắc</td></tr>
 <tr><td class="gw">keen on</td><td>/kiːn ɒn/</td><td>đam mê, thích thú</td></tr>
 <tr><td class="gw">logically</td><td>/ˈlɒdʒɪkli/</td><td>một cách logic</td></tr>
 <tr><td class="gw">reflection</td><td>/rɪˈflekʃn/</td><td>sự suy ngẫm</td></tr>
 <tr><td class="gw">improve</td><td>/ɪmˈpruːv/</td><td>cải thiện, nâng cao</td></tr>
 <tr><td class="gw">exchange</td><td>/ɪksˈtʃeɪndʒ/</td><td>trao đổi</td></tr>
 </table></div>`,
 qs:[
  {n:"1",type:"choice",q:"What is his name?",opts:["Andy","Peter","Jenny","Amy"],a:"Andy",
   exp:`<h4>🧠 Câu 1 ➔ Andy</h4>
   <b>① Dịch câu:</b> "Tên của cậu ấy là gì?"<br>
   <b>② <span class="hl-green">Vì sao đúng:</span></b> Bài đọc mở đầu bằng câu tự giới thiệu <span class="p-word">"My name is Andy"</span> — tên nhân vật là Andy.<br>
   <b>③ <span class="hl-red">Vì sao các đáp án khác sai:</span></b> "Peter", "Jenny", "Amy" không xuất hiện ở đây — đây là tên của các nhân vật khác trong sách, không phải bài đọc này.<br>
   <b>④ 🔍 Dẫn chứng:</b> <span class="p-word">My name is Andy.</span> 👉 <span class="p-mean">Tên tôi là Andy.</span>`},

  {n:"2",type:"choice",q:"What is his favourite subject?",opts:["Maths","English","Science","Music"],a:"Maths",
   exp:`<h4>🧠 Câu 2 ➔ Maths</h4>
   <b>① Dịch câu:</b> "Môn học yêu thích của cậu ấy là gì?"<br>
   <b>② <span class="hl-green">Vì sao đúng:</span></b> Bài đọc nói: <span class="p-word">"Maths is one of my favourite subjects"</span> — môn yêu thích là Toán.<br>
   <b>③ <span class="hl-red">Vì sao các đáp án khác sai:</span></b> Bài đọc không hề nhắc đến English, Science hay Music là môn yêu thích của Andy.<br>
   <b>④ 🔍 Dẫn chứng:</b> <span class="p-word">Maths is one of my favourite subjects.</span> 👉 <span class="p-mean">Toán là một trong những môn học yêu thích của tôi.</span>`},

  {n:"3",type:"choice",q:"Why does he like Maths?",
   opts:["Because he wants to become an excellent Maths teacher.","Because he wants to become a doctor.","Because his friends like Maths too.","Because Maths is easy for everyone."],
   a:"Because he wants to become an excellent Maths teacher.",
   exp:`<h4>🧠 Câu 3 ➔ Because he wants to become an excellent Maths teacher.</h4>
   <b>① Dịch câu:</b> "Tại sao cậu ấy thích môn Toán?"<br>
   <b>② <span class="hl-green">Vì sao đúng:</span></b> Bài đọc nói rõ lý do: <span class="p-grammar">"I like it because I want to become an excellent Maths teacher"</span> — vì muốn trở thành giáo viên Toán xuất sắc.<br>
   <b>③ <span class="hl-red">Vì sao các đáp án khác sai:</span></b> Bài đọc không hề nhắc đến việc muốn làm bác sĩ, bạn bè thích Toán, hay việc Toán dễ với mọi người — đây đều là thông tin bịa, không có trong bài.<br>
   <b>④ 🔍 Dẫn chứng:</b> <span class="p-word">I like it because I want to become an excellent Maths teacher.</span> 👉 <span class="p-mean">Tôi thích môn này vì tôi muốn trở thành một giáo viên Toán xuất sắc.</span>`},

  {n:"4",type:"choice",q:"Does he spend lots of time reading books about Maths?",
   opts:["Yes, he does.","No, he doesn't.","Yes, he did.","No, he does."],a:"Yes, he does.",
   exp:`<h4>🧠 Câu 4 ➔ Yes, he does.</h4>
   <b>① Dịch câu:</b> "Cậu ấy có dành nhiều thời gian đọc sách về Toán không?"<br>
   <b>② <span class="hl-green">Vì sao đúng:</span></b> Bài đọc xác nhận: <span class="p-word">"I always spend a lot of time reading books about Mathematics"</span> — luôn dành nhiều thời gian đọc sách Toán, nên trả lời là "Yes, he does."<br>
   <b>③ <span class="hl-red">Vì sao các đáp án khác sai:</span></b> "No, he doesn't." ngược nghĩa với bài đọc; "Yes, he did." và "No, he does." sai thì (câu hỏi chia ở hiện tại đơn "Does", nên trả lời phải khớp "does"/"doesn't", không dùng "did").<br>
   <b>④ 🔍 Dẫn chứng:</b> <span class="p-word">I always spend a lot of time reading books about Mathematics.</span> 👉 <span class="p-mean">Tôi luôn dành nhiều thời gian đọc sách về Toán học.</span>`},

  {n:"5",type:"choice",q:"Does he join the Maths club at school?",
   opts:["Yes, he does.","No, he doesn't.","Yes, he did.","No, he does."],a:"Yes, he does.",
   exp:`<h4>🧠 Câu 5 ➔ Yes, he does.</h4>
   <b>① Dịch câu:</b> "Cậu ấy có tham gia câu lạc bộ Toán ở trường không?"<br>

let TOTAL=0;const answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    TOTAL++;
    if(q.type==='fill'){
      const fin=document.createElement('div'); fin.className='fin';
      const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Gõ câu trả lời vào đây';
      const cb=document.createElement('button'); cb.className='checkbtn'; cb.textContent='Kiểm tra ✓';
      cb.onclick=()=>checkFill(inp,cb,card,qid,q.accept);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')cb.click();});
      fin.appendChild(inp); fin.appendChild(cb); card.appendChild(fin);
    } else {
      const box=document.createElement('div'); box.className='opts';
      shuffle(q.opts).forEach(o=>{
        const b=document.createElement('button'); b.className='opt'; b.type='button';
        b.textContent=o; b.dataset.val=o; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
      });
      card.appendChild(box);
    }
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#5C6BAF','#D9A05B','#C6EAD6','#FFE08A','#E4677E','#233142'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.classList.contains('show')||t.style.display==='block';t.style.display=open?'none':'block';t.classList.toggle('show',!open);btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function checkFill(inp,btn,card,qid,accept){
  if(qid in answered) return;
  const val=inp.value.trim().toLowerCase().replace(/[.,;:'"]/g,'');
  const ok=accept.includes(val); answered[qid]=ok;
  inp.disabled=true; btn.disabled=true;
  if(ok){inp.classList.add('correct');ding();confetti();}
  else{inp.classList.add('wrong');card.classList.add('shake');buzz();
    const hint=document.createElement('div');hint.style.marginTop='6px';hint.style.fontWeight='800';
    hint.innerHTML='✅ Đáp án đúng: <span class="hl-green">'+accept[0]+'</span>';
    card.querySelector('.fin').after(hint);
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').innerHTML=correct+'/'+TOTAL;
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Đúng trọn '+TOTAL+' câu — con đọc bài rất kỹ và hiểu sâu về nội dung! Cô MS Chí Nên cực kỳ tự hào! 🌟 ☎️ 0852639652 để đăng ký khoá học cùng cô nhé.';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏 ☎️ 0852639652 để đăng ký khoá học cùng cô.';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — đọc kỹ phần giải thích để hiểu sâu hơn nhé! 💪 ☎️ 0852639652 để đăng ký khoá học cùng cô.';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé con ơi! Con đọc lại phần giải thích và làm lại. Cô tin con làm được! 💖 ☎️ 0852639652 để đăng ký khoá học cùng cô.';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms MS Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
