<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIT 6 · OUR SCHOOL FACILITIES — Ex13,14 | Ms. Chí Nên</title>

<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moss:#cdb4db; --leaf:#7b2cbf; --sky:#a2d2ff; --sun:#ffd6a5; --clay:#ff8fab; --cream:#fff7f0;
  --ink:#3c1642;
  --p-word:#c1121f; --p-mean:#1d6fb8; --p-gram:#6a4c93;
  --green:#2a9d8f; --red:#e5383b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:19px}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#cdb4db,#a2d2ff,#ffd6a5,#ff8fab,#7b2cbf);background-size:400% 400%;animation:bg 18s ease infinite;}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.3) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:50px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(17px,2.5vw,27px);margin:0;letter-spacing:1.5px;color:#fff;-webkit-text-stroke:1.8px var(--ink);text-shadow:2px 2px 0 var(--clay),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:13px;margin-top:1px;display:inline-block;background:rgba(255,255,255,.7);border:1.5px solid var(--ink);border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(247,244,234,.45);border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(60,22,66,.25)}
.pane::-webkit-scrollbar{width:10px}.pane::-webkit-scrollbar-thumb{background:var(--leaf);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:24px;letter-spacing:1px;position:sticky;top:0;z-index:2;margin:0 -10px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--clay),var(--leaf));border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:24px;letter-spacing:1px;margin:16px 0 8px;color:var(--ink);background:var(--sun);display:inline-block;padding:2px 14px;border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.rd{background:rgba(255,255,255,.6);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:3px 3px 0 rgba(60,22,66,.2)}
.rd p{margin:8px 0;line-height:1.9;font-size:17.5px}
.gap{font-family:'Bangers',cursive;background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:0 9px;margin:0 3px;font-size:16px}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--leaf);color:#fff;font-weight:800;font-size:14.5px;border-radius:20px;padding:3px 12px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#f8f0ff;border-left:5px solid var(--leaf);border-radius:8px;padding:10px 12px;font-size:16.5px;line-height:1.85;color:#3c1642}
.q{background:rgba(255,255,255,.62);border:3px solid var(--ink);border-radius:18px;padding:13px 15px;margin:13px 0;box-shadow:5px 5px 0 rgba(60,22,66,.2)}
.q .qtxt{font-weight:800;font-size:18px;margin-bottom:12px;display:flex;gap:8px;line-height:1.5}
.q .badge{font-family:'Bangers',cursive;background:var(--clay);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:18px;line-height:1.5;background:rgba(255,255,255,.92);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf5;border:2.5px dashed var(--ink);border-radius:14px;padding:14px;font-size:16.5px;line-height:1.8}
.exp h4{margin:0 0 8px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:22px}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#efe4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(247,244,234,.55);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sky),var(--clay));transition:width .3s}
.progtxt{font-weight:800;font-size:14px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#f4a261,#74c69d);border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(60,22,66,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#f7f4ea);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(60,22,66,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:44px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:30px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sun);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--sky);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){body{overflow:auto}.wrap{height:auto;min-height:100%}.split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}.float{font-size:36px}footer{position:sticky;bottom:0}}
.fin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fin input{font-family:'Nunito';font-weight:700;font-size:16px;padding:9px 12px;border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);min-width:160px}
.fin input.correct{background:#8ce99a;border-color:#2b8a3e}
.fin input.wrong{background:#ffa8a8;border-color:#c92a2a}
.checkbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:.5px;color:#fff;-webkit-text-stroke:.5px var(--ink);background:var(--green);border:2.5px solid var(--ink);border-radius:12px;padding:7px 16px;box-shadow:3px 3px 0 var(--ink)}
.checkbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.note{position:sticky;top:0;z-index:40;margin:4px 14px 0;padding:6px 13px;text-align:center;
  background:var(--sun);border:2.5px solid var(--ink);border-radius:14px;font-weight:800;font-size:15px;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
</style>
</head>
<body>
<div id="bgart">
  <span class="float" style="left:6%;top:14%;animation-delay:0s">🏫</span>
  <span class="float" style="left:82%;top:10%;animation-delay:1.2s">📚</span>
  <span class="float" style="left:14%;top:74%;animation-delay:2s">✏️</span>

</div>
<div class="wrap">
  <div class="note" id="note">🏫 Chào các con lớp 4! Ms. Chí Nên ở đây cùng ôn tập Unit 6 - Our School Facilities nhé!</div>

    <div class="sub">👩‍🏫 Giáo viên tạo: Ms. Chí Nên &nbsp;·&nbsp; 10 câu &nbsp;·&nbsp; 📞 0852639652 để đăng ký khoá học tiếng Anh từ lớp 1 đến lớp 12</div>
  </header>
  <div class="split">
    <div class="pane" id="leftPane"><div class="pane-title">📖 Passages</div></div>

  <h2 id="hi"></h2><div class="score-big" id="scoreRaw"></div><div class="score-10" id="score10"></div>

<script>
function opt(en){return {en}}
const PARTS = [
{
 title:"🏫 Ex13. Our School (5 câu — Đúng/Sai)",
 left:`
 <div class="rd"><p>Our school is in a small village. It's big and beautiful. There are four buildings and a garden at our school.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Trường của chúng tôi ở một ngôi làng nhỏ. Trường to và đẹp. Có bốn tòa nhà và một khu vườn ở trường chúng tôi.</div></div>

 <div class="rd"><p>During break time, we play sports in the playground. We can play badminton, football, and other sports.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Trong giờ giải lao, chúng tôi chơi thể thao ở sân chơi. Chúng tôi có thể chơi cầu lông, bóng đá, và các môn thể thao khác.</div></div>

 <div class="rd"><p>Moreover, we also have a small library and two computer rooms in the new building. I love my school so much.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Hơn nữa, chúng tôi còn có một thư viện nhỏ và hai phòng máy tính trong tòa nhà mới. Tôi yêu trường của mình rất nhiều.</div></div>

 <div class="rd"><b>📚 Glossary</b>
 <table class="gtb" style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:14.5px">
 <tr><th style="background:var(--clay);color:#fff;border:2px solid var(--ink);padding:4px 7px;text-align:left;width:35%">Word</th><th style="background:var(--clay);color:#fff;border:2px solid var(--ink);padding:4px 7px;text-align:left">Nghĩa</th></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">village</td><td style="border:2px solid var(--ink);padding:4px 7px">làng</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">building</td><td style="border:2px solid var(--ink);padding:4px 7px">tòa nhà</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">garden</td><td style="border:2px solid var(--ink);padding:4px 7px">vườn</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">break time</td><td style="border:2px solid var(--ink);padding:4px 7px">giờ giải lao</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">playground</td><td style="border:2px solid var(--ink);padding:4px 7px">sân chơi</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">library</td><td style="border:2px solid var(--ink);padding:4px 7px">thư viện</td></tr>
 <tr><td style="border:2px solid var(--ink);padding:4px 7px;font-weight:800;color:var(--p-word)">computer room</td><td style="border:2px solid var(--ink);padding:4px 7px">phòng máy tính</td></tr>
 </table></div>`,
 qs:[
  {n:"1",q:'"There are three buildings at their school."',
   opts:[opt("Đúng (True)"),opt("Sai (False)")],a:"Sai (False)",
   exp:`<h4>🧠 Câu 1</h4>
   <b>① Dịch câu:</b> "Có ba tòa nhà ở trường họ."<br>
   <b>② Đáp án:</b> <span class="p-word">Sai (False)</span> — bài đọc nói trường có <span class="p-mean">BỐN</span> tòa nhà, không phải ba.<br>
   <b>③ <span class="hl-green">Vì sao Sai:</span></b> Bài đọc nói rõ số lượng là <span class="p-grammar">four buildings</span> (bốn tòa nhà), khác với "three" (ba) trong câu hỏi.<br>
   <b>④ <span class="hl-red">Lưu ý:</span></b> Đây là bẫy đổi số liệu — học sinh cần đọc kỹ con số chính xác trong bài, không đoán mò.<br>
   <b>⑤ 🔍 Dẫn chứng:</b> <span class="p-word">There are four buildings and a garden at our school.</span> 👉 <span class="p-mean">Có bốn tòa nhà và một khu vườn ở trường chúng tôi.</span>`},

  {n:"2",q:'"There are two gardens."',
   opts:[opt("Đúng (True)"),opt("Sai (False)")],a:"Sai (False)",
   exp:`<h4>🧠 Câu 2</h4>
   <b>① Dịch câu:</b> "Có hai khu vườn."<br>
   <b>② Đáp án:</b> <span class="p-word">Sai (False)</span> — bài đọc chỉ nói có <span class="p-mean">MỘT</span> khu vườn ("a garden"), không phải hai.<br>
   <b>③ <span class="hl-green">Vì sao Sai:</span></b> "a garden" là mạo từ số ít, nghĩa là CHỈ MỘT khu vườn — câu hỏi nói "two gardens" (hai vườn) là sai.<br>
   <b>④ <span class="hl-red">Lưu ý:</span></b> Bài không hề nhắc đến số lượng "two" (hai) cho từ "garden" ở bất kỳ đâu.<br>
   <b>⑤ 🔍 Dẫn chứng:</b> <span class="p-word">There are four buildings and a garden at our school.</span> 👉 <span class="p-mean">Có bốn tòa nhà và MỘT khu vườn ở trường chúng tôi.</span>`},

  {n:"3",q:'"Their school is in the big city."',
   opts:[opt("Đúng (True)"),opt("Sai (False)")],a:"Sai (False)",
   exp:`<h4>🧠 Câu 3</h4>
   <b>① Dịch câu:</b> "Trường của họ ở thành phố lớn."<br>
   <b>② Đáp án:</b> <span class="p-word">Sai (False)</span> — bài đọc nói trường ở <span class="p-mean">một ngôi làng nhỏ</span>, không phải thành phố lớn.<br>
   <b>③ <span class="hl-green">Vì sao Sai:</span></b> Bài đọc mở đầu: <span class="p-grammar">"in a small village"</span> (ở một ngôi làng nhỏ) — hoàn toàn trái ngược với "the big city" (thành phố lớn).<br>
   <b>④ <span class="hl-red">Lưu ý:</span></b> Đây là bẫy đảo ngược địa điểm — cần phân biệt rõ "village" (làng) và "city" (thành phố).<br>
   <b>⑤ 🔍 Dẫn chứng:</b> <span class="p-word">Our school is in a small village.</span> 👉 <span class="p-mean">Trường của chúng tôi ở một ngôi làng nhỏ.</span>`},

  {n:"4",q:'"There is a large library in the old building."',
   opts:[opt("Đúng (True)"),opt("Sai (False)")],a:"Sai (False)",
   exp:`<h4>🧠 Câu 4</h4>
   <b>① Dịch câu:</b> "Có một thư viện lớn trong tòa nhà cũ."<br>
   <b>② Đáp án:</b> <span class="p-word">Sai (False)</span> — bài đọc nói thư viện <span class="p-mean">NHỎ</span> ("a small library") và nằm trong tòa nhà <span class="p-mean">MỚI</span> ("the new building"), không phải lớn và cũ.<br>
   <b>③ <span class="hl-green">Vì sao Sai:</span></b> Cả hai chi tiết trong câu hỏi đều SAI: "large" (lớn) ngược với "small" (nhỏ), và "old building" (tòa cũ) ngược với "new building" (tòa mới) trong bài.<br>
   <b>④ <span class="hl-red">Lưu ý:</span></b> Đây là bẫy đảo ngược tính từ kép — cần đọc kỹ cả hai chi tiết, không chỉ một.<br>
   <b>⑤ 🔍 Dẫn chứng:</b> <span class="p-word">We also have a small library and two computer rooms in the new building.</span> 👉 <span class="p-mean">Chúng tôi còn có một thư viện nhỏ và hai phòng máy tính trong tòa nhà mới.</span>`},

  {n:"5",q:'"Their school has two computer rooms."',
   opts:[opt("Đúng (True)"),opt("Sai (False)")],a:"Đúng (True)",
   exp:`<h4>🧠 Câu 5</h4>
   <b>① Dịch câu:</b> "Trường của họ có hai phòng máy tính."<br>
   <b>② Đáp án:</b> <span class="p-word">Đúng (True)</span> — bài đọc xác nhận trực tiếp có <span class="p-mean">hai phòng máy tính</span>.<br>
   <b>③ <span class="hl-green">Vì sao Đúng:</span></b> Bài đọc nói: <span class="p-grammar">"two computer rooms in the new building"</span> — khớp chính xác với câu hỏi.<br>

let TOTAL=0;const answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);

    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    TOTAL++;
    if(q.type==='fill'){
      const fin=document.createElement('div'); fin.className='fin';

document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#cdb4db','#a2d2ff','#ffd6a5','#ff8fab','#7b2cbf','#fff7f0'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.classList.contains('show')||t.style.display==='block';t.style.display=open?'none':'block';t.classList.toggle('show',!open);btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function checkFill(inp,btn,card,qid,accept){
  if(qid in answered) return;
  const val=inp.value.trim().toLowerCase().replace(/[.,;:'"]/g,'');
  const ok=accept.includes(val); answered[qid]=ok;
  inp.disabled=true; btn.disabled=true;
  if(ok){inp.classList.add('correct');ding();confetti();}
  else{inp.classList.add('wrong');card.classList.add('shake');buzz();
    const hint=document.createElement('div');hint.style.marginTop='6px';hint.style.fontWeight='800';
    hint.innerHTML='✅ Đáp án đúng: <span class="hl-green">'+accept.join(' / ')+'</span>';
    card.querySelector('.fin').after(hint);
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}

function grade(){

  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Đúng trọn '+TOTAL+' câu — con đọc bài rất kỹ và hiểu sâu về trường học! Ms. Chí Nên cực kỳ tự hào! 🌟 ☎️ 0852639652 để đăng ký khoá học cùng cô nhé.';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏 ☎️ 0852639652 để đăng ký khoá học cùng cô.';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — đọc kỹ phần giải thích để hiểu sâu hơn nhé! 💪 ☎️ 0852639652 để đăng ký khoá học cùng cô.';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé con ơi! Con đọc lại phần giải thích và làm lại. Cô tin con làm được! 💖 ☎️ 0852639652 để đăng ký khoá học cùng cô.';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms. Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
