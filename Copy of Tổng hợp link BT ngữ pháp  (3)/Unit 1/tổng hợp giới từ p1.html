<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📔 TỔNG HỢP GIỚI TỪ — 50 CÂU | Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFDF6;--paper2:#FFF7E8;--line:#BFD7EA;--margin:#F2A6B2;
  --ink:#2C3A4F;--ink-soft:#5B6B82;--highlight:#FFF3A0;
  --tab1:#FF8FA3;--tab2:#8ECAE6;--tab3:#FFD166;--tab4:#95D5B2;
  --good:#2E7D4F;--bad:#D64545;--card:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;color:var(--ink);
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);
  position:relative}
body::before{content:'';position:fixed;top:0;bottom:0;left:44px;width:2px;background:var(--margin);opacity:.45;z-index:1;pointer-events:none}
@media(max-width:600px){body::before{left:22px}}
#doodles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.doodle{position:absolute;opacity:.28;animation:doodleUp linear infinite}
@keyframes doodleUp{0%{transform:translateY(105vh) rotate(0deg);opacity:0}8%{opacity:.3}92%{opacity:.24}100%{transform:translateY(-15vh) rotate(340deg);opacity:0}}
.wrap{position:relative;z-index:10;max-width:880px;margin:0 auto;padding:40px 16px 120px}
.spiral{display:flex;justify-content:center;gap:16px;margin-bottom:-16px;position:relative;z-index:5}
.spiral span{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d8dee5 55%,#9aa3ad);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.3),0 2px 3px rgba(0,0,0,.18);display:block}
.header{background:var(--paper2);border:2px solid var(--ink);border-radius:6px;padding:26px 24px 18px;
  text-align:center;position:relative;box-shadow:6px 6px 0 rgba(44,58,79,.14);margin-bottom:20px}
.washi{position:absolute;top:-15px;left:50%;transform:translateX(-50%) rotate(-2deg);width:190px;height:30px;
  background:repeating-linear-gradient(45deg,var(--tab1) 0 10px,var(--tab3) 10px 20px);opacity:.9;
  box-shadow:0 3px 8px rgba(0,0,0,.22)}
.header h1{font-family:'Kalam',cursive;font-weight:700;font-size:1.5rem;color:var(--ink);line-height:1.4;margin-top:6px}
.header .sub{font-size:.85rem;color:var(--ink-soft);font-weight:700;margin-top:6px}
.teacher-tag{display:inline-block;margin-top:9px;background:var(--highlight);border-radius:20px;padding:3px 16px;
  font-size:.74rem;font-weight:800;color:#7A5C00}
.prog-wrap{margin:14px auto 20px;max-width:880px}
.prog-label{font-size:.82rem;font-weight:800;color:var(--ink-soft);margin-bottom:4px}
.prog-track{height:9px;background:rgba(44,58,79,.12);border-radius:20px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--tab1),var(--tab3),var(--tab2));border-radius:20px;width:0%;transition:width .5s ease}
.section-label{position:relative;margin:32px 0 14px;display:flex;align-items:center;gap:10px}
.section-label span{font-family:'Kalam',cursive;font-weight:700;font-size:1rem;color:#fff;padding:7px 20px 7px 16px;
  border-radius:0 20px 20px 0;box-shadow:2px 3px 8px rgba(0,0,0,.18);position:relative}
.section-label span::before{content:'📌';position:absolute;left:-8px;top:-11px;font-size:15px}
.section-label::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,rgba(44,58,79,.25),transparent);border-radius:2px}
.sec-note{background:var(--card);border-left:5px solid var(--tab2);border-radius:0 10px 10px 0;padding:10px 15px;
  margin-bottom:14px;font-size:.9rem;font-weight:700;color:var(--ink-soft);line-height:1.7;box-shadow:2px 2px 6px rgba(0,0,0,.06)}
.theory-box{background:var(--card);border:2px dashed var(--ink-soft);border-radius:10px;padding:18px 20px;margin-bottom:20px;
  box-shadow:4px 4px 0 rgba(44,58,79,.08)}
.theory-box h2{font-family:'Kalam',cursive;font-size:1.15rem;color:var(--ink);text-align:center;margin-bottom:12px}
.rule{background:var(--highlight);border-left:4px solid var(--bad);border-radius:0 10px 10px 0;padding:8px 13px;
  margin-bottom:9px;font-size:.93rem;line-height:1.85;font-weight:700;color:#5C4400}
.rule b{color:var(--bad)}
.rule .eg{display:inline-block;background:#fff;border:1px solid var(--tab2);border-radius:8px;padding:1px 10px;
  font-weight:800;color:#0f6b64;margin:2px 2px 0 0}
.ttab{width:100%;border-collapse:collapse;margin:8px 0;font-size:.88rem}
.ttab th{background:var(--ink);color:#fff;padding:6px 8px;border:1px solid #fff;font-weight:800;font-size:.82rem}
.ttab td{background:#fff;padding:6px 8px;border:1px solid var(--line);font-weight:700;line-height:1.6}
.ttab td b{color:var(--good)}
.ttip{background:#DFF3E4;border:2px solid var(--good);border-radius:10px;padding:9px 13px;font-size:.92rem;
  font-weight:700;line-height:1.8;color:#1B5E3A;margin-top:8px}
.q-card{background:var(--card);border:1px solid #E5DDC5;border-radius:8px;padding:20px 20px 16px;margin-bottom:20px;
  box-shadow:3px 4px 12px rgba(44,58,79,.08);position:relative}
.q-card::before{content:'📎';position:absolute;top:-13px;left:18px;font-size:20px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.q-num{display:inline-block;font-family:'Kalam',cursive;font-weight:700;font-size:.95rem;color:var(--bad);
  border:2px solid var(--bad);border-radius:50%;padding:4px 12px;transform:rotate(-6deg);margin-bottom:11px}
.q-text{font-size:1.03rem;font-weight:700;color:var(--ink);margin-bottom:12px;line-height:1.85}
.q-text b{background:var(--highlight);padding:0 4px;border-radius:3px}
.q-text i{color:var(--ink-soft)}
.q-text .gap{display:inline-block;min-width:96px;border-bottom:2.5px dashed var(--bad)}
.sentence-box{background:var(--highlight);border-left:5px solid var(--tab3);border-radius:0 10px 10px 0;padding:9px 14px;
  margin-bottom:10px;font-weight:700;font-size:1rem;line-height:1.7;color:#5C4400}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
.options.c1{grid-template-columns:1fr}
.options.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:600px){.options.c4{grid-template-columns:repeat(2,1fr)}}
.opt-btn{background:#fff;border:2px dashed var(--line);border-radius:9px;padding:11px 14px;font-family:'Nunito';
  font-size:1rem;font-weight:800;color:var(--ink);cursor:pointer;text-align:center;line-height:1.55;transition:.2s}
.opt-btn:hover:not(:disabled){border-color:var(--ink);background:var(--highlight);transform:translateY(-2px)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{background:#DFF3E4!important;border-color:var(--good)!important;border-style:solid!important;color:#1B5E3A!important}
.opt-btn.wrong{background:#FBE2E2!important;border-color:var(--bad)!important;border-style:solid!important;color:#8B1D1D!important;animation:shake .45s ease}
.opt-btn.dim{opacity:.35}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* SỬA LỖI */
.efline{font-size:1.02rem;font-weight:700;line-height:2.2;margin-bottom:9px;color:var(--ink)}
.efline .up{display:inline-block;text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--bad);
  text-underline-offset:5px;padding:0 3px;font-weight:800}
.efline sup{color:var(--bad);font-weight:900;font-size:.75em;margin-left:2px}
.ltrs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ltr{width:48px;height:48px;border-radius:50%;border:2px solid var(--ink-soft);background:#fff;
  color:var(--ink);font-family:'Kalam',cursive;font-weight:700;font-size:1.12rem;cursor:pointer;transition:.18s}
.ltr:hover:not(.lk){transform:translateY(-3px) scale(1.05);border-color:var(--bad)}
.ltr.sel{border-color:var(--bad);color:var(--bad);border-style:solid;transform:scale(1.1)}
.ltr.ok{background:#DFF3E4;border-color:var(--good);color:#1B5E3A}
.ltr.no{background:#FBE2E2;border-color:var(--bad);color:#8B1D1D}
.ltr.lk{cursor:default}
.fixzone{display:none;margin-top:12px;background:var(--paper2);border:2px dashed var(--bad);border-radius:10px;padding:11px 13px}
.fixzone.on{display:block;animation:fadeSlide .3s ease}
.fixzone .lb{font-size:.9rem;font-weight:800;color:var(--bad);margin-bottom:8px;line-height:1.65}
/* INPUT */
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:9px}
.tinp{flex:1;min-width:200px;padding:11px 15px;border-radius:9px;border:2px dashed var(--ink-soft);background:#fff;
  color:var(--ink);font-size:1.02rem;font-family:'Nunito';font-weight:700;outline:none;transition:.22s}
.tinp:focus{border-style:solid;border-color:var(--tab2);box-shadow:0 0 0 3px rgba(142,202,230,.3)}
.tinp.ok{border-style:solid;border-color:var(--good);background:#f2fff8}
.tinp.no{border-style:solid;border-color:var(--bad);background:#fff4f5}
.tinp:disabled{opacity:.9;cursor:default}
.ckbtn{background:var(--ink);border:none;border-radius:20px;padding:11px 22px;font-family:'Nunito';font-size:.92rem;
  font-weight:800;color:#fff;cursor:pointer;box-shadow:2px 3px 8px rgba(44,58,79,.35);transition:.18s;white-space:nowrap}
.ckbtn:hover:not(:disabled){transform:scale(1.05)}
.ckbtn:disabled{opacity:.45;cursor:default;transform:none}
.hintb{font-size:.85rem;color:#5C4400;font-weight:700;background:var(--highlight);border:1.5px dashed var(--tab3);
  border-radius:9px;padding:8px 12px;margin-top:9px;line-height:1.7}
/* GIẢI THÍCH */
.explain-box{display:none;margin-top:13px;background:#FFFDEE;border:1.5px dashed var(--bad);border-radius:10px;
  padding:15px 17px;font-size:.96rem;line-height:1.85;color:var(--ink);animation:fadeSlide .4s ease}
.explain-box.show{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.keyb{background:#DFF3E4;border:2px solid var(--good);border-radius:9px;padding:9px 13px;margin-bottom:10px;
  font-weight:800;color:#1B5E3A;line-height:1.7}
.vi-trans{display:block;background:var(--highlight);border-left:4px solid var(--tab3);border-radius:0 8px 8px 0;
  padding:8px 14px;margin:8px 0 10px;font-weight:700;color:#5C4400;font-size:.95rem;line-height:1.75}
.stepb{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:8px;line-height:1.85}
.stepb b{color:#1A6B7D}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:7px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.92rem;
  line-height:1.7;font-weight:700}
.p-word{color:#0066CC;font-weight:800}
.p-mean{color:#B5651D;font-weight:700}
.hl-green{color:#1B5E3A;font-weight:900}
.hl-red{color:#8B1D1D;font-weight:700}
.wt{background:#E8F1F8;border:1px solid var(--tab2);border-radius:5px;padding:1px 6px;font-size:.75rem;
  color:#1A6B7D;font-weight:800;margin-right:3px}
.pg{background:var(--highlight);border:1px solid var(--tab3);border-radius:8px;padding:2px 8px;font-weight:700;
  color:#5C4400;line-height:2.1;display:inline-block}
#submit-wrap{text-align:center;margin-top:24px;padding-bottom:20px}
.submit-btn{background:var(--bad);color:#fff;border:3px solid #fff;border-radius:10px;padding:14px 40px;
  font-family:'Kalam',cursive;font-weight:700;font-size:1.12rem;cursor:pointer;transform:rotate(-1.5deg);
  box-shadow:0 8px 22px rgba(214,69,69,.4);transition:.2s}
.submit-btn:hover{transform:rotate(0deg) scale(1.05) translateY(-3px)}
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(44,58,79,.55);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal-box{background:var(--paper2);border:3px solid var(--ink);border-radius:12px;padding:30px 26px;max-width:460px;
  width:94%;text-align:center;box-shadow:8px 8px 0 rgba(44,58,79,.25);animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h2{font-family:'Kalam',cursive;font-size:1.4rem;color:var(--ink);margin-bottom:11px}
.modal-box input{width:100%;padding:12px 16px;border-radius:9px;border:2px dashed var(--ink-soft);background:#fff;
  color:var(--ink);font-family:'Nunito';font-size:1rem;outline:none;margin-bottom:6px;text-align:center;font-weight:700}
.modal-box input.err{border-color:var(--bad);border-style:solid;animation:shake .4s}
.err-msg{color:var(--bad);font-size:.85rem;min-height:20px;margin-bottom:10px;font-weight:800}
.modal-btn{background:var(--ink);border:none;border-radius:20px;padding:12px 34px;font-family:'Nunito';font-size:1rem;
  font-weight:800;color:#fff;cursor:pointer;box-shadow:2px 4px 10px rgba(44,58,79,.35);transition:.2s}
.modal-btn:hover{transform:scale(1.06)}
.res-greeting{font-family:'Kalam',cursive;font-size:1.3rem;font-weight:700;color:var(--bad);margin-bottom:10px}
.res-score{font-size:3rem;font-weight:900;color:var(--ink);line-height:1;margin:10px 0 6px;transform:rotate(-3deg);
  display:inline-block;border:4px solid var(--bad);border-radius:12px;padding:4px 22px}
.res-sub{color:var(--ink-soft);font-size:.88rem;margin-bottom:6px;font-weight:700}
.res-10{display:inline-block;background:var(--good);color:#fff;font-weight:800;font-size:1.04rem;padding:6px 22px;
  border-radius:10px;margin-bottom:12px;box-shadow:2px 3px 8px rgba(46,125,79,.4)}
.res-gif{width:200px;height:150px;border-radius:10px;margin:10px auto;display:block;object-fit:cover;border:3px solid var(--ink)}
.retry-btn{margin-top:12px;background:transparent;border:2px solid var(--bad);border-radius:18px;padding:9px 26px;
  color:var(--bad);font-family:'Nunito';font-size:.93rem;font-weight:700;cursor:pointer}
.retry-btn:hover{background:var(--bad);color:#fff}
.cfp{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:9999;animation:cfFall var(--cd) ease-out forwards}
@keyframes cfFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(80vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div id="doodles"></div>
<div class="wrap">
  <div class="spiral"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="header">
    <div class="washi"></div>
    <h1>📔 TỔNG HỢP GIỚI TỪ<br>Vị trí · Thời gian · Nơi chốn · Chuyển động · Cách thức</h1>
    <div class="sub">UNIT 1: MY WORLD — Cambridge Global English Stage 6</div>
    <div class="teacher-tag">✍ Biên soạn: Ms MS Chí Nên</div>
  </div>
  <div class="prog-wrap">
    <div class="prog-label">⭐ Điểm: <b id="scN">0</b> / <b id="tlN">0</b> &nbsp;·&nbsp; Đã làm: <b id="anN">0</b></div>
    <div class="prog-track"><div class="prog-fill" id="pFill"></div></div>
  </div>
  <div id="main"></div>
  <div id="submit-wrap"><button class="submit-btn" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
</div>

<div class="modal-overlay" id="nameOv"><div class="modal-box">
  <h2>✍️ Con tên là gì nhỉ?</h2>
  <input id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="err-msg" id="nameErr"></div>
  <button class="modal-btn" onclick="showResult()">Xem kết quả 🚀</button>
</div></div>
<div class="modal-overlay" id="resOv"><div class="modal-box">
  <div class="res-greeting" id="rGreet"></div>
  <div class="res-score" id="rScore"></div>
  <div class="res-sub">câu đúng</div>

  <button class="retry-btn" onclick="location.reload()">🔄 Làm lại từ đầu</button>
</div></div>

<script>
/* ══ NÉT VẼ TAY TRÔI TRÊN TRANG ══ */
(function(){
  const ico=['✏️','📎','📌','🖇️','✂️','🔖','⭐','📝','🧷','📐'];
  const layer=document.getElementById('doodles');
  for(let i=0;i<14;i++){const s=document.createElement('div');s.className='doodle';
    s.textContent=ico[i%ico.length];
    s.style.left=(Math.random()*95)+'%';
    s.style.fontSize=(1.3+Math.random()*1.5)+'rem';
    s.style.animationDuration=(16+Math.random()*16)+'s';
    s.style.animationDelay=(-Math.random()*22)+'s';
    layer.appendChild(s)}
})();
/* ══ ÂM THANH — Web Audio API tự sinh ══ */
let AC;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
  o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
  o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(n){const cols=['#FF8FA3','#8ECAE6','#FFD166','#95D5B2','#D64545','#2C3A4F'];
  for(let i=0;i<(n||36);i++){const d=document.createElement('div');d.className='cfp';
    d.style.left=(Math.random()*100)+'vw';d.style.top='-14px';d.style.background=cols[i%cols.length];
    d.style.setProperty('--cd',(1.3+Math.random()*1.2)+'s');
    document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
/* ══════════════════ DỮ LIỆU ══════════════════ */
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cols){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cols:cols||2})}
function fil(sec,num,q,correct,accept,ex,ph,hint){Q.push({t:'fill',sec,num,q,correct,accept,ex,ph:ph||'Gõ đáp án...',hint:hint||''})}
function fix(sec,num,line,parts,letter,accept,ex){Q.push({t:'fix',sec,num,line,parts,letter,accept,ex})}
function C(w,ty,m){return "<div><span class='p-word'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function G(w,ty,m){return "<div><span class='hl-green'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function EX(key,vn,cells,why,trap){
 return '<div class="keyb">✅ '+key+'</div>'+
  '<span class="vi-trans">💬 <b>Dịch:</b> '+vn+'</span>'+
  '<div class="stepb"><b>1️⃣ PHÂN TÍCH ĐÁP ÁN</b><div class="grid2">'+cells+'</div></div>'+
  '<div class="stepb"><b>2️⃣ TẠI SAO ĐÚNG?</b><br><span class="pg">'+why+'</span></div>'+
  '<div class="stepb"><b>3️⃣ TẠI SAO SAI / BẪY</b><br><span class="pg">'+trap+'</span></div>'
}

/* ═════════ PHẦN A — GIỚI TỪ THỜI GIAN (14) ═════════ */
function A(num,q,c,o,ex){mcq('A',num,'<b>'+num+'.</b> '+q,c,o,ex,4)}
A(1,'I usually get up <span class="gap"></span> 6 o’clock.','at',['in','on','at','for'],
 EX('I usually get up <b>at</b> 6 o’clock.','Tôi thường thức dậy lúc 6 giờ.',
  C('in','prep','dùng cho tháng/năm/mùa/buổi trong ngày — không dùng cho GIỜ cụ thể')+
  C('on','prep','dùng cho thứ/ngày cụ thể — không dùng cho giờ')+
  G('at','prep','dùng cho GIỜ chính xác')+C('for','prep','trong khoảng thời gian — không phải mốc giờ'),
  '“6 o’clock” là một GIỜ CHÍNH XÁC → theo quy tắc “từ rộng đến hẹp”, điểm giờ cụ thể luôn dùng <b>at</b>.',
  '“in” dùng cho khoảng rộng (in the morning), “on” dùng cho ngày/thứ, “for” dùng cho khoảng thời gian kéo dài — không cái nào đúng cho một GIỜ cụ thể.'));
A(2,'My brother was born <span class="gap"></span> 1998.','in',['at','on','in','by'],
 EX('My brother was born <b>in</b> 1998.','Em trai tôi sinh năm 1998.',
  C('at','prep','dùng cho giờ/mốc — không dùng cho NĂM')+C('on','prep','dùng cho ngày/thứ cụ thể — không dùng cho năm')+
  G('in','prep','dùng cho năm, tháng, mùa, thế kỷ')+C('by','prep','không muộn hơn — sai nghĩa ở đây'),
  '“1998” là một NĂM → dùng <b>in</b> theo quy tắc “IN cho khoảng thời gian rộng”.',
  '“at/on” dùng cho mốc HẸP hơn (giờ, ngày). “by” mang nghĩa “không muộn hơn”, sai hoàn toàn với năm sinh.'));
A(3,'We have English lessons <span class="gap"></span> Monday morning.','on',['in','on','at','to'],
 EX('We have English lessons <b>on</b> Monday morning.','Chúng tôi có tiết tiếng Anh vào sáng thứ Hai.',
  C('in','prep','dùng riêng cho buổi (in the morning) — nhưng có THỨ đi kèm buổi phải dùng "on"')+
  G('on','prep','thứ + buổi → luôn dùng ON (on Monday morning)')+C('at','prep','dùng cho giờ — không dùng cho thứ+buổi')+
  C('to','prep','không phải giới từ thời gian ở đây'),
  'Quy tắc đặc biệt: “in the morning” nhưng khi có THỨ đi kèm buổi (Monday morning) → luôn dùng <b>on</b>.',
  'Bẫy kinh điển: thấy “morning” liền chọn “in” theo phản xạ — phải nhìn cả cụm “Monday morning” để chọn “on”.'));
A(4,'She has lived in this town <span class="gap"></span> 2015.','since',['for','since','in','at'],
 EX('She has lived in this town <b>since</b> 2015.','Cô ấy đã sống ở thị trấn này từ năm 2015 đến nay.',
  C('for','prep','trong một KHOẢNG thời gian — không phải MỐC bắt đầu')+G('since','prep','từ một MỐC trong quá khứ đến nay')+
  C('in','prep','dùng cho năm nói chung, không diễn tả "từ...đến nay"')+C('at','prep','dùng cho điểm giờ, không phù hợp'),
  '“2015” là một MỐC quá khứ, động từ hiện tại hoàn thành (has lived) cho thấy hành động vẫn tiếp diễn → dùng <b>since</b>.',
  '“for” chỉ dùng khi có một KHOẢNG thời gian (for 5 years), không phải một MỐC như “2015”. Nhớ: since + MỐC, for + KHOẢNG.'));
A(5,'They waited for the bus <span class="gap"></span> two hours.','for',['since','for','in','at'],
 EX('They waited for the bus <b>for</b> two hours.','Họ đã đợi xe buýt trong hai giờ.',
  G('for','prep','trong một KHOẢNG thời gian (for two hours)')+
  C('since','prep','từ một MỐC quá khứ — "two hours" là khoảng thời gian, không phải mốc')+
  C('in','prep','không đúng nghĩa ở đây')+C('at','prep','không đúng nghĩa ở đây'),
  '“two hours” là một KHOẢNG THỜI GIAN → dùng <b>for</b>.',
  '“since” chỉ dùng với một MỐC cụ thể (since 2015, since Monday), không dùng với một khoảng thời gian như “two hours”.'));
A(6,'Please hand in the report <span class="gap"></span> Friday.','by',['by','since','during','of'],
 EX('Please hand in the report <b>by</b> Friday.','Hãy nộp báo cáo không muộn hơn thứ Sáu.',
  G('by','prep','vào lúc/không muộn hơn — mang nghĩa DEADLINE')+
  C('since','prep','từ một mốc quá khứ đến nay — không đúng nghĩa deadline')+
  C('during','prep','trong suốt (during the lesson) — không đúng nghĩa deadline')+C('of','prep','không phải giới từ thời gian'),
  'Câu yêu cầu nộp báo cáo trước một thời hạn (không muộn hơn thứ Sáu) → dùng <b>by</b> (deadline).',
  '“since/during/of” đều không mang nghĩa “hạn cuối, không muộn hơn” như “by”.'));
function B(num,sent,answer,accept,ex,hint){
  fil('A',num,'<b>'+num+'.</b> '+sent,answer,accept,ex,'Gõ giới từ...',hint||'');
}
B(7,'Bats hunt for food <span class="gap"></span> a cold night.','on',['on'],
 EX('Bats hunt for food <b>on</b> a cold night.','Dơi kiếm ăn vào một đêm lạnh.',
  G('on a cold night/evening','phr','cụm cố định — dùng ON khi có TÍNH TỪ miêu tả kèm theo đêm/tối')+
  C('at night','phr','ban đêm nói chung (không có tính từ) — dùng AT'),
  'Khi có TÍNH TỪ miêu tả cụ thể (a cold night) → dùng <b>on</b>, khác với “at night” nói chung.',
  'Đừng nhầm với quy tắc “at night” — khi có tính từ miêu tả kèm theo (a cold night) thì đổi sang “on”.'));
B(8,'The manager is busy <span class="gap"></span> the moment.','at',['at'],
 EX('The manager is busy <b>at</b> the moment.','Người quản lý đang bận vào lúc này.',
  G('at the moment','phr','cụm cố định = ngay lúc này, hiện giờ'),
  '“at the moment” là cụm cố định nghĩa “ngay lúc này” — luôn dùng <b>at</b>.',
  'Không dùng “in” hay “on” — cụm này CỐ ĐỊNH, không thể thay đổi giới từ.'));
B(9,'I have a class <span class="gap"></span> Monday afternoon.','on',['on'],
 EX('I have a class <b>on</b> Monday afternoon.','Tôi có một lớp học vào chiều thứ Hai.',
  G('on + thứ + buổi','rule','khi có THỨ đi kèm buổi trong ngày → luôn dùng ON'),
  '“Monday afternoon” = thứ + buổi → dùng <b>on</b> (không dùng “in the afternoon” khi có thứ kèm theo).',
  'Đừng chọn “in” theo phản xạ vì thấy “afternoon” — quy tắc “thứ + buổi luôn dùng ON” áp dụng bất kể buổi nào.'));
B(10,'I got a lot of presents <span class="gap"></span> my birthday.','on',['on'],
 EX('I got a lot of presents <b>on</b> my birthday.','Tôi nhận được rất nhiều quà vào ngày sinh nhật của tôi.',
  G('on + ngày cụ thể/dịp riêng','rule','sinh nhật, ngày lễ có “Day” đều dùng ON'),
  '“my birthday” là một NGÀY cụ thể → dùng <b>on</b>, giống quy tắc “on + ngày lễ có Day”.',
  'Không dùng “at” hay “in” — cả hai không phù hợp với một NGÀY cụ thể như sinh nhật.'));
function D(num,line,parts,letter,accept,ex){fix('A',num,line,parts,letter,accept,ex)}
D(11,'We <span class="up">first</span><sup>A</sup> <span class="up">visited</span><sup>B</sup> China <span class="up">on</span><sup>C</sup> <span class="up">2006</span><sup>D</sup>.',
 {A:'first',B:'visited',C:'on',D:'2006'},'C',['in'],
 EX('Lỗi ở <b>C</b>: <span class="hl-red">on</span> ➔ <span class="hl-green">in</span>',
  'Chúng tôi đã đến thăm Trung Quốc lần đầu vào năm 2006.',
  G('in + năm','rule','năm luôn dùng IN')+C('on','×','SAI — dùng cho ngày/thứ cụ thể, không dùng cho NĂM')+
  C('first / visited / 2006','ĐÚNG, giữ nguyên'),
  '“2006” là một NĂM → phải dùng <b>in</b>, không dùng “on”.',
  'Lỗi ở ô C: “on” ✘ chỉ dùng cho ngày/thứ cụ thể (on Monday, on May 5th), không dùng cho một NĂM.'));
D(12,'School <span class="up">starts</span><sup>A</sup> <span class="up">again</span><sup>B</sup> <span class="up">at</span><sup>C</sup> <span class="up">September</span><sup>D</sup>.',
 {A:'starts',B:'again',C:'at',D:'September'},'C',['in'],
 EX('Lỗi ở <b>C</b>: <span class="hl-red">at</span> ➔ <span class="hl-green">in</span>',
  'Trường học lại bắt đầu vào tháng Chín.',
  G('in + tháng','rule','tháng luôn dùng IN')+C('at','×','SAI — dùng cho giờ, không dùng cho THÁNG')+
  C('starts / again / September','ĐÚNG, giữ nguyên'),
  '“September” là một THÁNG → phải dùng <b>in</b>, không dùng “at”.',
  'Lỗi ở ô C: “at” ✘ chỉ dùng cho giờ/điểm mốc cụ thể, không dùng cho THÁNG.'));
D(13,'<span class="up">Let’s</span><sup>A</sup> <span class="up">go and see Grandma</span><sup>B</sup> <span class="up">on</span><sup>C</sup> <span class="up">Easter.</span><sup>D</sup>',
 {A:'Let’s',B:'go and see Grandma',C:'on',D:'Easter.'},'C',['at'],
 EX('Lỗi ở <b>C</b>: <span class="hl-red">on</span> ➔ <span class="hl-green">at</span>',
  'Hãy đi thăm bà vào lễ Phục Sinh.',
  G('at + kỳ nghỉ lễ (nói chung)','rule','Easter/Christmas/the weekend đều dùng AT')+
  C('on','×','SAI — "on" dùng cho ngày lễ có chữ "Day" cụ thể, không dùng cho TÊN kỳ nghỉ lễ chung'),
  'Easter là một KỲ NGHỈ LỄ nói chung (không có “Day”) → dùng <b>at</b>, giống “at Christmas/at the weekend”.',
  'Dễ nhầm với “on Christmas Day” (có chữ Day, dùng ON) — nhưng nói chung về cả kỳ nghỉ lễ phải dùng AT.'));
D(14,'Please <span class="up">hand in</span><sup>A</sup> <span class="up">your homework</span><sup>B</sup> <span class="up">at</span><sup>C</sup> <span class="up">Friday</span><sup>D</sup>. It’s deadline.',
 {A:'hand in',B:'your homework',C:'at',D:'Friday'},'C',['by','on'],
 EX('Lỗi ở <b>C</b>: <span class="hl-red">at</span> ➔ <span class="hl-green">by</span> (hoặc "on")',
  'Hãy nộp bài tập về nhà của con không muộn hơn thứ Sáu. Đó là hạn cuối.',
  G('by + deadline','rule','không muộn hơn — khớp với “It’s deadline”')+
  C('on + thứ','rule','cách khác cũng chấp nhận: đơn thuần chỉ NGÀY nộp')+C('at','×','SAI — không dùng cho THỨ trong tuần'),
  '“at” không bao giờ đi với THỨ trong tuần. Vì câu nhấn mạnh “It’s deadline” → nên dùng <b>by</b> (không muộn hơn); “on” cũng được chấp nhận.',
  '“at” chỉ dùng cho GIỜ/điểm mốc (at 7 o’clock), tuyệt đối không dùng cho THỨ trong tuần như Friday.'));

/* ═════════ PHẦN B — GIỚI TỪ NƠI CHỐN (14) ═════════ */
function E(num,q,c,o,ex){mcq('B',num,'<b>'+num+'.</b> '+q,c,o,ex,4)}
E(15,'She lives <span class="gap"></span> Paris.','in',['at','in','on','from'],
 EX('She lives <b>in</b> Paris.','Cô ấy sống ở Paris.',
  C('at','prep','điểm cụ thể nhỏ — không dùng cho cả một THÀNH PHỐ')+G('in','prep','thành phố/quốc gia/châu lục')+
  C('on','prep','trên bề mặt/đảo/tên đường — không đúng cho thành phố')+C('from','prep','nguồn gốc — không diễn tả nơi đang sống'),
  'Paris là một THÀNH PHỐ → dùng <b>in</b>.',
  '“at” chỉ dùng cho điểm nhỏ cụ thể. “from” chỉ nguồn gốc, không phải nơi hiện đang sống.'));
E(16,'We are flying <span class="gap"></span> Tokyo tomorrow.','to',['at','in','to','from'],
 EX('We are flying <b>to</b> Tokyo tomorrow.','Ngày mai chúng tôi sẽ bay đến Tokyo.',
  C('at','prep','không dùng cho chuyển động đến một nơi')+C('in','prep','dùng cho VỊ TRÍ, không dùng cho HƯỚNG di chuyển đến')+
  G('to','prep','động từ chỉ chuyển động (fly, go, come…) luôn dùng TO')+C('from','prep','nguồn gốc — ngược nghĩa với "đến"'),
  'Động từ chỉ CHUYỂN ĐỘNG “fly” luôn đi với <b>to</b> khi nói đến ĐÍCH.',
  'Lỗi phổ biến: quen “in Tokyo” (vị trí) rồi áp dụng nhầm cho câu có ĐỘNG TỪ CHUYỂN ĐỘNG — phải dùng "to".'));
E(17,'He’s <span class="gap"></span> the train right now.','on',['in','on','at','from'],
 EX('He’s <b>on</b> the train right now.','Anh ấy đang ở trên tàu ngay bây giờ.',
  C('in','prep','dùng cho ô tô/taxi (nhỏ, riêng) — không dùng cho tàu')+G('on','prep','phương tiện công cộng (bus/train/plane) → ON')+
  C('at','prep','điểm cụ thể — không đúng khi đang ở TRÊN phương tiện')+C('from','prep','không đúng nghĩa'),
  'Tàu hỏa là phương tiện CÔNG CỘNG → dùng <b>on</b> (on the train/bus/plane).',
  '“in” chỉ dùng cho xe NHỎ, cá nhân (in a car/taxi) — tàu hỏa luôn là “on”.'));
E(18,'We come <span class="gap"></span> Thailand.','from',['at','on','from','in'],
 EX('We come <b>from</b> Thailand.','Chúng tôi đến từ Thái Lan.',
  C('at','prep','không đúng nghĩa nguồn gốc')+C('on','prep','không đúng nghĩa nguồn gốc')+G('from','prep','nguồn gốc, xuất xứ')+
  C('in','prep','dùng cho vị trí hiện tại, không phải nguồn gốc'),
  'Cụm “come from” = đến từ, nói về NGUỒN GỐC/xuất xứ → dùng <b>from</b>.',
  '“in” chỉ mô tả VỊ TRÍ hiện tại (I live in Thailand), khác với “from” mô tả XUẤT XỨ.'));
E(19,'I met him <span class="gap"></span> a concert last weekend.','at',['at','in','on','from'],
 EX('I met him <b>at</b> a concert last weekend.','Tôi đã gặp anh ấy tại một buổi hoà nhạc vào cuối tuần trước.',
  G('at + sự kiện','rule','buổi hòa nhạc, tiệc, cuộc họp → luôn dùng AT')+C('in','prep','không đúng cho SỰ KIỆN')+
  C('on','prep','không đúng cho SỰ KIỆN')+C('from','prep','không đúng nghĩa'),
  '“a concert” là một SỰ KIỆN → dùng <b>at</b> (at the party/at the meeting/at a concert).',
  '“in/on” không dùng cho SỰ KIỆN — chỉ “at” mới đúng theo quy tắc này.'));
E(20,'There are many tourists <span class="gap"></span> the island.','on',['in','from','at','on'],
 EX('There are many tourists <b>on</b> the island.','Có nhiều khách du lịch trên đảo.',
  C('in','prep','dùng cho thành phố/quốc gia — không dùng cho ĐẢO')+C('from','prep','nguồn gốc — không đúng nghĩa')+
  C('at','prep','điểm cụ thể nhỏ — không đúng cho cả một ĐẢO')+G('on','prep','đảo/núi/bãi biển → luôn dùng ON'),
  '“island” (đảo) luôn đi với <b>on</b> theo quy tắc đặc biệt.',
  'Nhiều bạn nhầm đảo với “khu vực bao quanh” nên chọn “in” — nhưng tiếng Anh CỐ ĐỊNH dùng “on” cho island/beach/mountain.'));
function F(num,sent,answer,accept,ex,hint){
  fil('B',num,'<b>'+num+'.</b> '+sent,answer,accept,ex,'Gõ giới từ...',hint||'');
}
F(21,'Hanoi is located <span class="gap"></span> the North of Vietnam.','in',['in'],
 EX('Hanoi is located <b>in</b> the North of Vietnam.','Hà Nội nằm ở phía Bắc của Việt Nam.',
  G('in the North/South/East/West','phr','dùng IN cho PHƯƠNG HƯỚNG rộng'),
  '“the North” là một PHƯƠNG HƯỚNG/khu vực rộng → dùng <b>in</b>.',
  'Không dùng “on” — “on” chỉ dùng cho bề mặt/đảo/đường, không dùng cho phương hướng rộng như “the North”.'));
F(22,'Last summer, my family had a vacation <span class="gap"></span> Phu Quoc Island.','on',['on'],
 EX('...had a vacation <b>on</b> Phu Quoc Island.','Mùa hè trước, gia đình tôi đã có một kỳ nghỉ ở đảo Phú Quốc.',
  G('on + tên đảo','rule','island luôn đi với ON'),
  'Phu Quoc là một ĐẢO (Island) → dùng <b>on</b>.',
  'Đừng nhầm với “in Vietnam” (quốc gia dùng IN) — “đảo” là ngoại lệ CỐ ĐỊNH luôn dùng ON.'));
F(23,'My English teacher lives <span class="gap"></span> 123 Tran Hung Dao Street.','at',['at'],
 EX('...lives <b>at</b> 123 Tran Hung Dao Street.','Giáo viên tiếng Anh của tôi sống ở số 123 đường Trần Hưng Đạo.',
  G('at + số nhà cụ thể','rule','địa chỉ có SỐ NHÀ luôn dùng AT')+C('on + tên đường (không số)','rule','chỉ tên đường, không có số nhà → dùng ON'),
  'Có SỐ NHÀ cụ thể (123) đi kèm → dùng <b>at</b>.',
  'Nếu câu CHỈ có tên đường (không có số) thì mới dùng "on" (on Tran Hung Dao Street) — có số nhà thì luôn là "at".'));
F(24,'Where is your sister? – She is studying <span class="gap"></span> school right now.','at',['at'],
 EX('She is studying <b>at</b> school right now.','Chị/em bạn ở đâu? – Chị/em ấy đang học ở trường ngay bây giờ.',
  G('at school/work','phr','cụm cố định nơi học tập/làm việc'),
  'Cụm cố định <b>at school</b> = ở trường (đang học tập) → dùng <b>at</b>.',
  'Không dùng “in school” — tiếng Anh chuẩn dùng cụm cố định “at school” khi nói về việc học tập nói chung.'));
function H(num,q,c,o,ex){mcq('B',num,'<b>'+num+'.</b> '+q,c,o,ex,1)}
H(25,'Have you seen the new building (at / in) front of the school?','in',['at','in'],
 EX('...building <b>in</b> front of the school?','Bạn đã thấy tòa nhà mới ở phía trước trường chưa?',
  G('in front of','phr','cụm cố định = ở phía trước')+C('at front of','×','không tồn tại cụm này trong tiếng Anh'),

put('<div class="theory-box"><h2>📚 ÔN NHANH TRƯỚC KHI LÀM BÀI</h2>'+
 '<div class="rule"><b>① VỊ TRÍ GIỚI TỪ:</b> đứng trước danh từ/đại từ · đứng sau động từ (arrive AT) · đứng sau tính từ (rich IN, friendly TO)</div>'+
 '<table class="ttab"><tr><th colspan="3">② GIỚI TỪ THỜI GIAN — IN (rộng) → ON → AT (hẹp)</th></tr>'+
 '<tr><th>IN</th><td>tháng/năm/mùa/thế kỷ, buổi trong ngày</td><td>in May, in the morning</td></tr>'+
 '<tr><th>ON</th><td>thứ, ngày cụ thể, ngày lễ có "Day", thứ+buổi</td><td>on Monday, on Christmas Day</td></tr>'+

 '<tr><th colspan="3">since (từ mốc) · for (khoảng) · by (deadline) · during (trong suốt) · between…and</th></tr></table>'+
 '<table class="ttab"><tr><th colspan="3">③ GIỚI TỪ NƠI CHỐN — IN (trong) · ON (trên) · AT (điểm)</th></tr>'+
 '<tr><th>IN</th><td>thành phố/quốc gia, phòng/tòa nhà, phương hướng</td><td>in Hanoi, in the room</td></tr>'+
 '<tr><th>ON</th><td>bề mặt, đường/trang/tầng, đảo/núi/biển/xe công cộng</td><td>on the wall, on the bus</td></tr>'+
 '<tr><th>AT</th><td>điểm cụ thể, địa chỉ có số nhà, sự kiện</td><td>at home, at the party</td></tr></table>'+
 '<div class="rule"><b>④ GIỚI TỪ CHUYỂN ĐỘNG:</b> động từ chỉ chuyển động (go/come/walk) luôn dùng <b>TO</b>, KHÔNG dùng in/on/at — '+
 '<span class="eg">go TO school</span> <span class="eg">arrive IN + thành phố</span> <span class="eg">arrive AT + điểm nhỏ</span></div>'+
 '<div class="rule"><b>⑤ GIỚI TỪ CÁCH THỨC:</b> <span class="eg">with = công cụ cụ thể</span> <span class="eg">by = phương thức chung</span> '+
 '<span class="eg">despite/in spite of = mặc dù + danh từ/V-ing</span></div>'+
 '<div class="ttip">💡 <b>4 DẠNG BÀI trong đề:</b> ① Trắc nghiệm chọn giới từ · ② Điền giới từ (tự gõ) · '+
 '③ <b>Tìm &amp; sửa lỗi sai (A/B/C/D)</b> · ④ 50 câu trải đều 4 mảng kiến thức: Thời gian · Nơi chốn · Chuyển động · Cách thức.</div></div>');

label('PHẦN A · Giới từ thời gian (câu 1–14)','var(--tab1)');
put('<div class="sec-note">⏰ <b>Ghi nhớ:</b> IN (rộng) → ON → AT (hẹp). Chú ý các cụm cố định: on a cold night, at the moment, on Monday afternoon.</div>');
render('A');
label('PHẦN B · Giới từ nơi chốn (câu 15–28)','var(--tab2)');
put('<div class="sec-note">📍 <b>Ghi nhớ:</b> IN = bên trong không gian · ON = trên bề mặt/đảo/núi/xe công cộng · AT = điểm cụ thể/sự kiện.</div>');
render('B');
label('PHẦN C · Giới từ chuyển động (câu 29–40)','var(--tab3)');
put('<div class="sec-note">🧭 <b>Ghi nhớ:</b> across/into/out of/towards/along/through/over/past/(a)round/up-down/from…to — chú ý các cặp dễ nhầm across↔along↔through.</div>');
render('C');
label('PHẦN D · Giới từ cách thức (câu 41–50)','var(--tab4)');
put('<div class="sec-note">🛠️ <b>Ghi nhớ:</b> with (công cụ) · by (phương thức chung) · like (so sánh) · according to (dẫn nguồn) · instead of (thay vì) · in spite of/despite (mặc dù).</div>');
render('D');

document.getElementById('tlN').textContent=TOTAL;bump();

/* ══════════════════ RENDER ══════════════════ */
function build(m,gid){
  const card=document.createElement('div');card.className='q-card';card.id='c_'+gid;
  const head='<div class="q-num">✦ '+m.num+'</div>';
  if(m.t==='mcq'){
    const so=shuffle(m.opts);maps[gid]=so;
    const cls=m.cols===4?' c4':(m.cols===1?' c1':'');
    card.innerHTML=head+'<div class="q-text">'+m.q+'</div>'+
      '<div class="options'+cls+'" id="o_'+gid+'">'+
      so.map((o,i)=>'<button class="opt-btn" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
      '</div><div class="explain-box" id="e_'+gid+'">'+m.ex+'</div>';
  } else if(m.t==='fix'){
    card.innerHTML=head+'<div class="efline">'+m.line+'</div>'+
      '<div class="ltrs" id="L_'+gid+'">'+['A','B','C','D'].map(L=>
        '<button class="ltr" data-l="'+L+'">'+L+'</button>').join('')+'</div>'+
      '<div class="fixzone" id="Z_'+gid+'"><div class="lb" id="lb_'+gid+'"></div>'+
      '<div class="frow"><input class="tinp" id="i_'+gid+'" placeholder="Gõ giới từ ĐÚNG..." autocomplete="off" spellcheck="false">'+
      '<button class="ckbtn" id="b_'+gid+'">✅ KIỂM TRA</button></div></div>'+
      '<div class="explain-box" id="e_'+gid+'">'+m.ex+'</div>';
    const zone=card.querySelector('#Z_'+gid),lb=card.querySelector('#lb_'+gid),
          inp=card.querySelector('#i_'+gid),bt=card.querySelector('#b_'+gid);
    card.querySelectorAll('.ltr').forEach(b=>{b.onclick=()=>{
      if(done[gid])return;
      card.querySelectorAll('.ltr').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');picked[gid]=b.dataset.l;
      lb.innerHTML='✍️ Con chọn <b>'+b.dataset.l+'</b> = “<b>'+m.parts[b.dataset.l]+'</b>”. Giờ gõ <b>giới từ ĐÚNG</b> để thay thế nhé!';
      zone.classList.add('on');inp.focus()}});
    const go=()=>{
      if(done[gid]||!picked[gid])return;
      const v=norm(inp.value);
      if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),480);return}
      done[gid]=true;answered++;
      const okL=(picked[gid]===m.letter),okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
      inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
      card.querySelectorAll('.ltr').forEach(x=>{x.classList.add('lk');x.classList.remove('sel');
        if(x.dataset.l===m.letter)x.classList.add('ok');
        else if(x.dataset.l===picked[gid])x.classList.add('no')});
      if(ok){score++;ding();confetti()}else buzz();
      document.getElementById('e_'+gid).classList.add('show');bump();
    };
    bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  } else {
    card.innerHTML=head+'<div class="q-text">'+m.q+'</div>'+
      (m.hint?'<div class="hintb">'+m.hint+'</div>':'')+
      '<div class="frow"><input class="tinp" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
      '<button class="ckbtn" id="b_'+gid+'">✅ KIỂM TRA</button></div>'+
      '<div class="explain-box" id="e_'+gid+'">'+m.ex+'</div>';
    const inp=card.querySelector('#i_'+gid),bt=card.querySelector('#b_'+gid);
    const go=()=>{
      if(done[gid])return;
      const v=norm(inp.value);
      if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),480);return}
      done[gid]=true;answered++;
      const ok=m.accept.map(norm).indexOf(v)>-1;
      inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
      if(ok){score++;ding();confetti()}else buzz();
      document.getElementById('e_'+gid).classList.add('show');bump();
    };
    bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  }
  return card;
}
function pick(gid,i){
  if(done[gid])return;done[gid]=true;answered++;
  const m=Q[+gid.slice(1)],box=document.getElementById('o_'+gid);
  const ok=maps[gid][i]===m.correct;
  [...box.children].forEach((el,j)=>{el.disabled=true;
    if(maps[gid][j]===m.correct)el.classList.add('correct');
    else if(j===i)el.classList.add('wrong');else el.classList.add('dim')});
  if(ok){score++;ding();confetti()}else buzz();
  document.getElementById('e_'+gid).classList.add('show');bump();
}
function openName(){document.getElementById('nameOv').classList.add('active');setTimeout(()=>document.getElementById('nameIn').focus(),200)}
function showResult(){
  const inp=document.getElementById('nameIn'),er=document.getElementById('nameErr');
  const nm=inp.value.trim();
  if(!nm){inp.classList.add('err');er.textContent='⚠️ Con chưa nhập tên kìa!';setTimeout(()=>inp.classList.remove('err'),450);return}
  er.textContent='';document.getElementById('nameOv').classList.remove('active');
  const pct=score/TOTAL,ten=(pct*10).toFixed(2);
  let greet,msg,gif;
  if(score===TOTAL){greet='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — nắm chắc cả 4 mảng giới từ rồi! 🎉';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=.6){greet='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Đọc kỹ giải thích những câu sai rồi ghi vào vở nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
  else{greet='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Ôn lại bảng IN-ON-AT và các cụm cố định rồi làm lại nhé! 📚';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent=score+' / '+TOTAL;
  document.getElementById('rTen').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
  document.getElementById('rImg').src=gif;
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('resOv').classList.add('active');
  if(pct>=.6){confetti(70);ding()}
}
</script>
