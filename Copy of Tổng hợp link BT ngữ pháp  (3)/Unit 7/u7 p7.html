<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Thách Giới Từ Part 2 - Ms MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7; /* Tím đậm hơn chút */
            --secondary: #00cec9; /* Xanh ngọc sáng */
            --correct: #00b894; /* Xanh mint đậm */
            --wrong: #ff7675; /* Đỏ hồng */
            --bg-pattern: #dfe6e9;
            --text-main: #2d3436;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffeaa7; /* Nền vàng nhạt ấm áp */
            background-image: radial-gradient(#6c5ce7 15%, transparent 16%), radial-gradient(#00cec9 15%, transparent 16%);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Header */
        .teacher-header {
            background: #fff;
            color: var(--primary);
            padding: 8px 20px;
            font-size: 0.95rem;
            font-weight: 800;
            border-bottom: 4px solid #fab1a0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .container { max-width: 800px; margin: 70px auto 0; padding: 20px; }

        h1 {
            text-align: center;
            color: #d63031;
            font-family: 'Quicksand', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-shadow: 3px 3px 0px #fff;
            background: rgba(255,255,255,0.8);
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed #d63031;
        }

        /* Quiz Cards */
        .quiz-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 0 #b2bec3; /* Bóng đổ dày hơn */
            transition: transform 0.3s;
            position: relative;
            border: 3px solid #fff;
        }

        .quiz-card:hover { transform: translateY(-5px); border-color: var(--secondary); }

        .question-number {
            background: var(--primary);
            color: white;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 1rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #2d3436;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

        .option-btn {
            background: #fff;
            border: 2px solid #b2bec3;
            border-bottom: 6px solid #b2bec3;
            padding: 18px;
            border-radius: 18px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: all 0.1s;
            color: #636e72;
        }

        .option-btn:active { transform: translateY(4px); border-bottom: 2px solid #b2bec3; }
        .option-btn:hover:not(.disabled) { background-color: #f1f2f6; color: var(--primary); }

        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: #00947e;
            border-bottom-color: #007560;
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: #d63031;
            border-bottom-color: #c0392b;
            animation: shake 0.5s;
        }

        /* Giải thích */
        .explanation {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #e3fcf7;
            border-left: 5px solid var(--secondary);
            border-radius: 10px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #2d3436;
        }
        
        .explanation.visible { display: block; animation: slideDown 0.4s ease-out; }
        .explanation b { color: var(--primary); }
        .explanation u { text-decoration: none; border-bottom: 2px solid #fab1a0; }

        /* Submit Button */
        .submit-section { text-align: center; margin: 50px 0; }
        .submit-btn {
            background: #fd79a8;
            color: white;
            border: none;
            border-bottom: 8px solid #e84393;
            padding: 20px 60px;
            font-size: 1.6rem;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 900;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.2s;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(253, 121, 168, 0.3);
        }
        .submit-btn:active { transform: translateY(6px); border-bottom-width: 2px; }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 52, 54, 0.9);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: white; padding: 40px; border-radius: 30px; text-align: center;
            max-width: 500px; width: 90%; animation: popIn 0.4s; border: 5px solid var(--primary);
        }
        .score-display { font-size: 4.5rem; font-weight: 900; color: var(--primary); margin: 20px 0; }
        
        /* Canvas */
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

    </style>
</head>
<body>

    <div class="teacher-header">
        <span><i class="fas fa-star"></i> Ms MS Chí Nên - English Class</span>
        <span>LEVEL 2: CONTEXT MASTER</span>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <h1>PREPOSITIONS (PART 2)<br><span style="font-size: 0.6em; color: #636e72;">Tech, Events & Advanced Locations</span></h1>

        <div id="quiz-container">
            </div>

        <div class="submit-section">
            <button class="submit-btn" onclick="submitQuiz()">Nộp Bài</button>
        </div>
    </div>

    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2 style="color: var(--text-main)">Kết Quả Bài Làm</h2>
            <div class="score-display" id="final-score">0/30</div>
            <p id="feedback-msg" style="font-size: 1.2rem; color: #636e72; margin-bottom: 20px;">...</p>
            <button class="submit-btn" style="font-size: 1rem; padding: 12px 30px;" onclick="closeModal()">Xem lại đáp án</button>
        </div>
    </div>

    <script>
        // --- DATA BỘ CÂU HỎI MỚI (30 Câu - Đổi ngữ cảnh) ---
        const questions = [
            // GROUP 1: TECHNOLOGY & MEDIA (ON)
            {
                id: 1,
                text: "I found this interesting information _______ the Internet.",
                options: ["in", "at", "on", "to"],
                answer: 2, // on
                explain: "<b>1. Phân tích:</b><br>The Internet (n): Mạng Internet (Không gian số/Bề mặt ảo).<br><b>2. Dịch nghĩa:</b> Tôi tìm thấy thông tin thú vị này trên Internet.<br><b>3. Tại sao chọn ON?</b> Quy tắc 'Digital Surfaces': Với Internet, Website, Facebook, Youtube, TV, Radio -> Luôn dùng 'ON'.<br><b>4. Tại sao sai?</b> Ta không thể chui vào 'trong' (in) dây mạng, cũng không đứng 'tại' (at) điểm Internet."
            },
            {
                id: 2,
                text: "Don't spend too much time _______ the computer screen.",
                options: ["at", "on", "in", "by"],
                answer: 1, // on
                explain: "<b>1. Phân tích:</b><br>Screen (n): Màn hình (Bề mặt phẳng hiển thị).<br><b>2. Dịch nghĩa:</b> Đừng dành quá nhiều thời gian trên màn hình máy tính.<br><b>3. Tại sao chọn ON?</b> Hình ảnh hiển thị 'trên' bề mặt màn hình -> Dùng 'on the screen'.<br><b>4. Tại sao sai?</b> Nếu nói 'at the computer' (ngồi tại vị trí đặt máy tính) thì đúng, nhưng đây là 'screen' (màn hình) nên phải là 'on'."
            },
            {
                id: 3,
                text: "I heard the news _______ the radio this morning.",
                options: ["in", "on", "at", "from"],
                answer: 1, // on
                explain: "<b>1. Phân tích:</b><br>Radio (n): Đài phát thanh (Thiết bị truyền thông).<br><b>2. Dịch nghĩa:</b> Tôi đã nghe tin tức trên đài sáng nay.<br><b>3. Tại sao chọn ON?</b> Quy tắc truyền thông: On TV, On the radio, On the phone.<br><b>4. Tại sao sai?</b> 'In the radio' nghĩa là linh kiện nằm bên trong cái vỏ máy đài."
            },
            {
                id: 4,
                text: "Please visit our website _______ the link below.",
                options: ["in", "to", "at", "on"],
                answer: 2, // at
                explain: "<b>1. Phân tích:</b><br>Link/Website address: Một địa chỉ ảo cụ thể.<br><b>2. Dịch nghĩa:</b> Vui lòng ghé thăm website của chúng tôi tại đường dẫn bên dưới.<br><b>3. Tại sao chọn AT?</b> Khi chỉ một địa chỉ (URL) cụ thể, ta dùng 'at'. (Lưu ý: On the website, nhưng At the link/address).<br><b>4. Tại sao sai?</b> 'On' dùng cho bề mặt trang web, nhưng với 'link' (điểm kết nối) thì 'at' chính xác hơn trong ngữ cảnh chỉ dẫn."
            },

            // GROUP 2: EVENTS & ACTIVITIES (AT)
            {
                id: 5,
                text: "We met _______ a wedding last year.",
                options: ["in", "on", "at", "to"],
                answer: 2, // at
                explain: "<b>1. Phân tích:</b><br>Wedding (n): Đám cưới (Sự kiện xã hội).<br><b>2. Dịch nghĩa:</b> Chúng tôi đã gặp nhau tại một đám cưới năm ngoái.<br><b>3. Tại sao chọn AT?</b> Quy tắc sự kiện: Dùng 'at' cho các hoạt động tụ tập đông người (at a party, at a concert, at a conference, at a wedding).<br><b>4. Tại sao sai?</b> Không dùng 'in' vì không nhấn mạnh không gian kín."
            },
            {
                id: 6,
                text: "My mom is _______ the supermarket buying food.",
                options: ["on", "in", "at", "from"],
                answer: 2, // at
                explain: "<b>1. Phân tích:</b><br>Supermarket (n): Siêu thị (Địa điểm công cộng/Chức năng đi mua sắm).<br><b>2. Dịch nghĩa:</b> Mẹ tôi đang ở siêu thị mua đồ ăn.<br><b>3. Tại sao chọn AT?</b> Khi nói về địa điểm với mục đích thực hiện chức năng của nó (mua sắm), ta dùng 'at'.<br><b>4. Tại sao sai?</b> Dùng 'in' khi muốn nhấn mạnh người đó đang ở bên trong tòa nhà (Ví dụ: Trời mưa, tôi đang trốn *trong* siêu thị)."
            },
            {
                id: 7,
                text: "Turn left _______ the traffic lights.",
                options: ["in", "on", "at", "by"],
                answer: 2, // at
                explain: "<b>1. Phân tích:</b><br>Traffic lights (n): Đèn giao thông (Một điểm mốc trên đường).<br><b>2. Dịch nghĩa:</b> Rẽ trái tại chỗ đèn giao thông.<br><b>3. Tại sao chọn AT?</b> Dùng 'at' để chỉ một vị trí/cột mốc cụ thể trên hành trình (at the bridge, at the roundabout, at the traffic lights).<br><b>4. Tại sao sai?</b> Đèn giao thông là cái cột, không đứng 'trên' (on) hay 'trong' (in) nó được."
            },

            // GROUP 3: HOUSEHOLD & DAILY OBJECTS
            {
                id: 8,
                text: "There is some milk _______ the fridge.",
                options: ["at", "on", "in", "into"],
                answer: 2, // in
                explain: "<b>1. Phân tích:</b><br>Fridge (n): Tủ lạnh (Vật chứa/Hộp kín).<br><b>2. Dịch nghĩa:</b> Có ít sữa ở trong tủ lạnh.<br><b>3. Tại sao chọn IN?</b> Tủ lạnh là không gian kín chứa đồ -> Dùng 'in'.<br><b>4. Tại sao sai?</b> 'On the fridge' là để đồ trên nóc tủ lạnh."
            },
            {
                id: 9,
                text: "Look at your face _______ the mirror!",
                options: ["on", "at", "in", "to"],
                answer: 2, // in
                explain: "<b>1. Phân tích:</b><br>Mirror (n): Cái gương.<br><b>2. Dịch nghĩa:</b> Hãy nhìn mặt bạn trong gương đi!<br><b>3. Tại sao chọn IN?</b> Đây là trường hợp thú vị. Ảnh phản chiếu nằm 'bên trong' thế giới của cái gương -> Dùng 'in the mirror'.<br><b>4. Tại sao sai?</b> 'On the mirror' nghĩa là có vết bẩn/con ruồi đậu trên bề mặt kính."
            },
            {
                id: 10,
                text: "I keep my keys _______ my pocket.",
                options: ["on", "at", "in", "of"],
                answer: 2, // in
                explain: "<b>1. Phân tích:</b><br>Pocket (n): Túi quần/áo (Vật chứa).<br><b>2. Dịch nghĩa:</b> Tôi giữ chìa khóa trong túi quần.<br><b>3. Tại sao chọn IN?</b> Túi là không gian rỗng để chứa đồ -> Dùng 'in'.<br><b>4. Tại sao sai?</b> Không dùng 'at' hay 'on' với túi."
            },
            {
                id: 11,
                text: "Dinner is served _______ the table.",
                options: ["in", "at", "on", "above"],
                answer: 2, // on
                explain: "<b>1. Phân tích:</b><br>Table (n): Cái bàn (Bề mặt phẳng).<br><b>2. Dịch nghĩa:</b> Bữa tối đã được bày trên bàn.<br><b>3. Tại sao chọn ON?</b> Đồ ăn đặt trên mặt bàn -> Dùng 'on'.<br><b>4. Tại sao sai?</b> Lưu ý: 'Sit at the table' (Ngồi tại bàn để ăn) khác với 'Food on the table' (Đồ ăn trên bàn)."
            },

            // GROUP 4: TEXT & PRINTED MATTER
            {
                id: 12,
                text: "Can you see the boat _______ the picture?",
                options: ["on", "at", "in", "to"],
                answer: 2, // in
                explain: "<b>1. Phân tích:</b><br>Picture/Photo (n): Bức tranh/ảnh (Không gian hình ảnh).<br><b>2. Dịch nghĩa:</b> Bạn có thấy chiếc thuyền trong bức tranh không?<br><b>3. Tại sao chọn IN?</b> Các vật thể nằm trong khung cảnh của bức tranh -> Dùng 'in the picture'.<br><b>4. Tại sao sai?</b> 'On the picture' nghĩa là vết mực hoặc bụi bám trên bề mặt tờ giấy ảnh."
            },
            {
                id: 13,
                text: "The answer is _______ the bottom of the page.",
                options: ["in", "on", "at", "under"],
                answer: 2, // at
                explain: "<b>1. Phân tích:</b><br>Bottom (n): Phần dưới cùng.<br><b>2. Dịch nghĩa:</b> Đáp án nằm ở cuối trang.<br><b>3. Tại sao chọn AT?</b> Cụm cố định: At the top (ở trên cùng), At the bottom (ở dưới cùng).<br><b>4. Tại sao sai?</b> Dùng 'on' cho số trang (On page 5), nhưng dùng 'at' cho vị trí top/bottom của trang đó."
            },
            {
                id: 14,
                text: "There are many mountains _______ the world.",
                options: ["on", "at", "in", "from"],
                answer: 2, // in
                explain: "<b>1. Phân tích:</b><br>The world (n): Thế giới (Không gian rộng lớn nhất).<br><b>2. Dịch nghĩa:</b> Có rất nhiều ngọn núi trên thế giới.<br><b>3. Tại sao chọn IN?</b> Tiếng Việt nói 'trên thế giới' nhưng Tiếng Anh tư duy thế giới là không gian bao trùm -> Dùng 'in the world'.<br><b>4. Tại sao sai?</b> 'On the earth' (trên trái đất - bề mặt hành tinh) thì dùng On, nhưng 'World' (xã hội/không gian sống) dùng In."
            },

            // GROUP 5: GEOGRAPHY & TRAVEL
            {
                id: 15,
                text: "Tokyo is _______ Japan.",
                options: ["at", "on", "in", "to"],
                answer: 2, // in
                explain: "<b>1. Phân tích:</b><br>Japan (n): Nhật Bản (Quốc gia).<br><b>2. Dịch nghĩa:</b> Tokyo ở Nhật Bản.<br><b>3. Tại sao chọn IN?</b> Quy tắc cơ bản: In + Country/City.<br><b>4. Tại sao sai?</b> Không dùng At/On cho quốc gia."
            },
            {
                id: 16,
                text: "I am standing _______ the queue waiting for tickets.",
                options: ["on", "at", "in", "to"],
                answer: 2, // in
                explain: "<b>1. Phân tích:</b><br>Queue (Anh-Anh) / Line (Anh-Mỹ): Hàng người.<br><b>2. Dịch nghĩa:</b> Tôi đang đứng trong hàng đợi mua vé.<br><b>3. Tại sao chọn IN?</b> Bạn là một phần của hàng người đó, bạn đứng 'trong' đội hình -> Dùng 'in a queue' / 'in a line'.<br><b>4. Tại sao sai?</b> 'At the line' (ở vạch kẻ đường)."
            },
            {
                id: 17,
                text: "Let's meet _______ the entrance of the cinema.",
                options: ["on", "in", "at", "into"],
                answer: 2, // at
                explain: "<b>1. Phân tích:</b><br>Entrance (n): Lối vào (Điểm mốc).<br><b>2. Dịch nghĩa:</b> Gặp nhau ở lối vào rạp phim nhé.<br><b>3. Tại sao chọn AT?</b> Lối vào, cổng (gate), cửa (door) là các điểm tiếp cận cụ thể -> Dùng 'at'.<br><b>4. Tại sao sai?</b> 'In the entrance' (đứng chắn ngay giữa lối đi vào) - ít dùng trong ngữ cảnh hẹn gặp."
            },
            {
                id: 18,
                text: "The man is sitting _______ the grass.",
                options: ["in", "at", "on", "under"],
                answer: 2, // on
                explain: "<b>1. Phân tích:</b><br>Grass (n): Bãi cỏ (Bề mặt).<br><b>2. Dịch nghĩa:</b> Người đàn ông đang ngồi trên bãi cỏ.<br><b>3. Tại sao chọn ON?</b> Cỏ tạo thành một bề mặt để ngồi lên -> Dùng 'on the grass'.<br><b>4. Tại sao sai?</b> 'In the grass' thường dùng cho côn trùng hoặc động vật nhỏ ẩn nấp bên trong bụi cỏ cao."
            },

            // GROUP 6: TRICKY ONES (DIRECTION & POSITION)
            {
                id: 19,
                text: "My office is _______ the left side of the building.",
                options: ["in", "at", "on", "to"],
                answer: 2, // on

        // --- SOUNDS & LOGIC (GIỮ NGUYÊN TỪ PART 1) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Shuffle
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let currentScore = 0;

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            const shuffled = shuffle([...questions]);
            
            shuffled.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.innerHTML = `
                    <span class="question-number">Question ${index + 1}</span>
                    <div class="question-text">${q.text}</div>
                    <div class="options-grid">
                        ${q.options.map((opt, i) => `
                            <button class="option-btn" onclick="checkAnswer(this, ${q.id}, ${i})">${String.fromCharCode(65+i)}. ${opt}</button>
                        `).join('')}
                    </div>
                    <div id="exp-${q.id}" class="explanation">
                        ${q.explain}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswer(btn, qId, selectedIndex) {
            const card = btn.closest('.quiz-card');
            if (card.classList.contains('answered')) return;
            card.classList.add('answered');

            const q = questions.find(i => i.id === qId);
            const explanation = document.getElementById(`exp-${qId}`);
            const allBtns = card.querySelectorAll('.option-btn');

            if (selectedIndex === q.answer) {
                btn.classList.add('correct');
                playSound('correct');
                fireConfetti();
                currentScore++;
            } else {
                btn.classList.add('wrong');
                allBtns[q.answer].classList.add('correct');
                playSound('wrong');
            }
            
            allBtns.forEach(b => b.classList.add('disabled'));
            explanation.classList.add('visible');
        }

        function submitQuiz() {
            document.getElementById('final-score').innerText = `${currentScore}/30`;
            const msg = currentScore > 25 ? "Quá đỉnh! Bạn là trùm giới từ! 🎉" : 
                        currentScore > 15 ? "Làm tốt lắm! Cố gắng thêm chút nữa nhé! 🔥" : "Đừng buồn, hãy xem kỹ lại phần giải thích nha! 🍀";
            document.getElementById('feedback-msg').innerText = msg;
            document.getElementById('result-modal').style.display = 'flex';
            fireConfetti();
        }

        function closeModal() { document.getElementById('result-modal').style.display = 'none'; }
        
        // Confetti
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const p = [];
            for(let i=0; i<80; i++) p.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height-canvas.height, c: ['#6c5ce7','#00cec9','#fd79a8'][Math.floor(Math.random()*3)], s: Math.random()*8+4, v: Math.random()*5+2});
            function anim() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                let a = false;
                p.forEach(k => { k.y+=k.v; if(k.y<canvas.height) a=true; ctx.fillStyle=k.c; ctx.fillRect(k.x,k.y,k.s,k.s); });
                if(a) requestAnimationFrame(anim);
            }
            anim();
        }

        window.onload = renderQuiz;
    </script>
