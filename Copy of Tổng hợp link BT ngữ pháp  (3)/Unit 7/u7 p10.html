<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Giới Từ Cùng Ms MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8854C0; /* Tím hồng */
            --secondary: #00C9A7; /* Xanh ngọc */
            --correct: #00D26A; /* Xanh lá */
            --wrong: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2f3542;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(var(--primary) 1px, transparent 1px), radial-gradient(var(--secondary) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            text-shadow: 2px 2px 0px #fff;
            font-weight: 900;
            margin-bottom: 10px;
            font-size: 2.2rem;
            background: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 3px solid var(--primary);
        }

        .teacher-badge {
            background: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 30px;
            box-shadow: 0 4px 0 #009e82;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            border: 2px solid #e1e1e1;
            position: relative;
            transition: transform 0.3s ease;
        }

        .question-number {
            position: absolute;
            top: -15px;
            left: 20px;
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 800;
            box-shadow: 0 4px 0 #6c429c;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-bottom: 5px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            background-color: #f9f9f9;
        }

        .option-btn:active:not(:disabled) {
            border-bottom: 2px solid #e0e0e0;
            transform: translateY(3px);
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: #00a352;
            border-bottom-color: #00a352;
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: #d63030;
            border-bottom-color: #d63030;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            background: #f0f9ff;
            border: 2px dashed var(--primary);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-header {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-section {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .exp-label {
            font-weight: 700;
            color: #444;
            text-decoration: underline;
            text-decoration-color: var(--secondary);
            margin-right: 5px;
        }

        .vocab-list {
            background: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.95rem;
            border: 1px solid #ddd;
        }

        .vocab-item {
            display: block;
            margin-bottom: 5px;
        }

        .highlight-green { color: var(--correct); font-weight: bold; }
        .highlight-red { color: var(--wrong); font-weight: bold; }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Submit Button */
        .submit-section {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .submit-btn {
            background: var(--secondary);
            color: white;
            font-size: 1.5rem;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            border-bottom: 6px solid #009e82;
            cursor: pointer;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0, 201, 167, 0.3);
        }

        .submit-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .submit-btn:active {
            border-bottom: 2px solid #009e82;
            transform: translateY(4px);
        }

        /* Result Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 5px solid var(--primary);
            animation: zoomIn 0.5s;
        }

        @keyframes zoomIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .score-display {
            font-size: 3rem;
            font-weight: 900;
            color: var(--secondary);
            margin: 20px 0;
        }

        .feedback-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #555;
        }

        /* Canvas for Confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <h1>BÀI KIỂM TRA GIỚI TỪ IN/ON/AT</h1>
    <div class="teacher-badge">Biên soạn bởi: Ms MS Chí Nên</div>

    <div class="quiz-container" id="quiz-container">
        </div>

    <div class="submit-section">
        <button class="submit-btn" onclick="submitQuiz()">NỘP BÀI & XEM ĐIỂM</button>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary);">KẾT QUẢ CỦA BẠN</h2>
            <div class="score-display" id="final-score">0/30</div>
            <p class="feedback-text" id="feedback-msg">Bạn làm tốt lắm!</p>
            <button class="submit-btn" onclick="location.reload()" style="font-size: 1rem; padding: 10px 30px;">Làm lại bài</button>
        </div>
    </div>

    <script>
        // --- DỮ LIỆU CÂU HỎI (30 Câu bao phủ toàn bộ lý thuyết) ---
        const quizData = [
            // --- TIME (THỜI GIAN) ---
            {
                id: 1,
                question: "I always go for a run ______ the morning.",
                options: { A: "at", B: "on", C: "in", D: "to" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. at (prep): dùng cho giờ/dịp lễ",
                        "B. on (prep): dùng cho ngày",
                        "C. in (prep): dùng cho buổi trong ngày/tháng/năm",
                        "D. to (prep): đến (hướng đi)"
                    ],
                    trans: "Tôi luôn đi chạy bộ vào buổi sáng.",
                    why_correct: "Dùng <b>'in'</b> cho các buổi trong ngày: <i>in the morning, in the afternoon, in the evening</i>.",
                    why_wrong: "Các đáp án khác sai quy tắc: 'at' + giờ, 'on' + ngày."
                }
            },
            {
                id: 2,
                question: "My grandfather was born ______ 1950.",
                options: { A: "on", B: "at", C: "in", D: "from" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. on (prep): trên/vào ngày",
                        "B. at (prep): tại",
                        "C. in (prep): trong/vào năm",
                        "D. from (prep): từ"
                    ],
                    trans: "Ông của tôi sinh năm 1950.",
                    why_correct: "Dùng <b>'in'</b> trước năm (years). Ví dụ: <i>in 1990, in 2025</i>.",
                    why_wrong: "'On' dùng cho ngày cụ thể, 'At' dùng cho giờ."
                }
            },
            {
                id: 3,
                question: "We usually go to the beach ______ summer.",
                options: { A: "at", B: "on", C: "in", D: "of" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. at (prep): tại",
                        "B. on (prep): trên",
                        "C. in (prep): trong/vào mùa",
                        "D. of (prep): của"
                    ],
                    trans: "Chúng tôi thường đi biển vào mùa hè.",
                    why_correct: "Dùng <b>'in'</b> trước các mùa: <i>in summer, in winter, in spring, in autumn</i>.",
                    why_wrong: "Không dùng 'on summer' hay 'at summer'."
                }
            },
            {
                id: 4,
                question: "The meeting starts ______ 9 a.m.",
                options: { A: "in", B: "on", C: "at", D: "about" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. in (prep): trong",
                        "B. on (prep): trên",
                        "C. at (prep): lúc (giờ cụ thể)",
                        "D. about (prep): khoảng"
                    ],
                    trans: "Cuộc họp bắt đầu lúc 9 giờ sáng.",
                    why_correct: "Dùng <b>'at'</b> trước giờ cụ thể: <i>at 7 o'clock, at 9 a.m.</i>",
                    why_wrong: "'In' và 'On' không dùng cho giờ đồng hồ."
                }
            },
            {
                id: 5,
                question: "I have an English class ______ Monday.",
                options: { A: "in", B: "at", C: "on", D: "by" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. in (prep): trong",
                        "B. at (prep): tại",
                        "C. on (prep): vào (thứ)",
                        "D. by (prep): bởi/trước"
                    ],
                    trans: "Tôi có lớp tiếng Anh vào thứ Hai.",
                    why_correct: "Dùng <b>'on'</b> trước các thứ trong tuần: <i>on Monday, on Sunday</i>.",
                    why_wrong: "Sai quy tắc: 'in Monday' hay 'at Monday' là sai."
                }
            },
            {
                id: 6,
                question: "Ho Chi Minh was born ______ May 19th, 1890.",
                options: { A: "in", B: "on", C: "at", D: "since" },
                correct: "B",
                explanation: {
                    vocab: [
                        "A. in (prep): tháng/năm",
                        "B. on (prep): ngày cụ thể",
                        "C. at (prep): giờ",
                        "D. since (prep): kể từ"
                    ],
                    trans: "Hồ Chí Minh sinh ngày 19 tháng 5 năm 1890.",
                    why_correct: "Dùng <b>'on'</b> trước ngày tháng năm cụ thể (đầy đủ ngày).",
                    why_wrong: "Nếu chỉ có tháng/năm mới dùng 'in' (in May, in 1890). Nhưng có ngày 19 -> Phải dùng 'On'."
                }
            },
            {
                id: 7,
                question: "We give gifts to each other ______ Christmas Day.",
                options: { A: "at", B: "in", C: "on", D: "for" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. at (prep): tại",
                        "B. in (prep): trong",
                        "C. on (prep): vào ngày",
                        "D. for (prep): cho"
                    ],
                    trans: "Chúng tôi tặng quà cho nhau vào Ngày Giáng Sinh.",
                    why_correct: "Có chữ <b>'Day'</b> thì phải dùng <b>'On'</b>: <i>On Christmas Day</i>.",
                    why_wrong: "Lưu ý: Nếu nói về dịp lễ chung chung không có chữ 'Day' thì dùng 'At Christmas'. Nhưng ở đây có 'Day' nên 'On' là đáp án đúng duy nhất."
                }
            },
            {
                id: 8,
                question: "I often read books ______ night.",
                options: { A: "in", B: "on", C: "at", D: "to" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. in (prep): trong",
                        "B. on (prep): trên",
                        "C. at (prep): vào (ban đêm)",
                        "D. to (prep): đến"
                    ],
                    trans: "Tôi thường đọc sách vào ban đêm.",
                    why_correct: "Cụm cố định: <b>at night</b>, <b>at noon</b>.",
                    why_wrong: "Ta nói 'in the evening' nhưng lại nói 'at night'. Đây là ngoại lệ phải nhớ."
                }
            },
            {
                id: 9,
                question: "The bus will arrive ______ 10 minutes.",
                options: { A: "at", B: "on", C: "in", D: "for" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. at (prep): lúc",
                        "B. on (prep): trên",
                        "C. in (prep): trong (khoảng thời gian tới)",
                        "D. for (prep): khoảng (đã qua)"
                    ],
                    trans: "Xe buýt sẽ đến trong 10 phút nữa.",
                    why_correct: "Dùng <b>'in' + khoảng thời gian</b> để chỉ tương lai (trong bao lâu nữa): <i>in a minute, in two weeks</i>.",
                    why_wrong: "'For' chỉ độ dài hành động (đã xảy ra), 'At/On' không kết hợp với khoảng thời gian theo nghĩa này."
                }
            },
            {
                id: 10,
                question: "She is busy ______ the moment.",
                options: { A: "in", B: "on", C: "with", D: "at" },
                correct: "D",
                explanation: {
                    vocab: [
                        "A. in (prep): trong",
                        "B. on (prep): trên",
                        "C. with (prep): với",
                        "D. at (prep): tại"
                    ],
                    trans: "Cô ấy đang bận ngay lúc này.",
                    why_correct: "Cụm cố định: <b>at the moment</b> (ngay lúc này) = now.",
                    why_wrong: "Không dùng in/on the moment."
                }
            },
            // --- PLACE (NƠI CHỐN) ---
            {
                id: 11,
                question: "My uncle lives ______ Hanoi.",
                options: { A: "at", B: "on", C: "in", D: "to" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. at (prep): tại điểm nhỏ",
                        "B. on (prep): trên bề mặt",
                        "C. in (prep): trong (thành phố/quốc gia)",
                        "D. to (prep): tới"
                    ],
                    trans: "Chú tôi sống ở Hà Nội.",
                    why_correct: "Dùng <b>'in'</b> trước thành phố, quốc gia, châu lục: <i>in Hanoi, in Vietnam, in Asia</i>.",
                    why_wrong: "'At' chỉ dùng cho địa chỉ cụ thể hoặc điểm nhỏ. Hanoi là thành phố lớn nên dùng 'In'."
                }
            },
            {
                id: 12,
                question: "There is a beautiful picture ______ the wall.",
                options: { A: "in", B: "at", C: "on", D: "above" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. in (prep): trong",
                        "B. at (prep): tại",
                        "C. on (prep): trên bề mặt",
                        "D. above (prep): phía trên (không chạm)"
                    ],
                    trans: "Có một bức tranh đẹp ở trên tường.",
                    why_correct: "Dùng <b>'on'</b> khi vật nằm trên một bề mặt: <i>on the wall, on the table, on the floor</i>.",
                    why_wrong: "'In' là ở bên trong. 'At' là tại một điểm."
                }
            },
            {
                id: 13,
                question: "They are waiting ______ the bus stop.",
                options: { A: "in", B: "on", C: "at", D: "under" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. in (prep): trong",
                        "B. on (prep): trên",
                        "C. at (prep): tại (điểm)",
                        "D. under (prep): dưới"
                    ],
                    trans: "Họ đang đợi ở trạm xe buýt.",
                    why_correct: "Dùng <b>'at'</b> cho một điểm dừng cụ thể, nơi công cộng nhỏ: <i>at the bus stop, at the door, at the airport</i>.",
                    why_wrong: "Không dùng 'in' (không phải không gian kín) hay 'on'."
                }
            },
            {
                id: 14,
                question: "Don't sit ______ the floor! It's dirty.",
                options: { A: "in", B: "at", C: "to", D: "on" },
                correct: "D",
                explanation: {
                    vocab: [
                        "A. in (prep): trong",
                        "B. at (prep): tại",
                        "C. to (prep): tới",
                        "D. on (prep): trên"
                    ],
                    trans: "Đừng ngồi trên sàn nhà! Nó bẩn lắm.",
                    why_correct: "Sàn nhà (floor) là một bề mặt -> Dùng <b>'on'</b>.",
                    why_wrong: "Các giới từ khác không chỉ vị trí tiếp xúc bề mặt."
                }
            },
            {
                id: 15,
                question: "Her house is ______ 25 Tran Phu Street.",
                options: { A: "in", B: "on", C: "at", D: "by" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. in (prep): trong",
                        "B. on (prep): trên",
                        "C. at (prep): tại (địa chỉ)",
                        "D. by (prep): bên cạnh"
                    ],
                    trans: "Nhà cô ấy ở số 25 đường Trần Phú.",
                    why_correct: "Khi có **số nhà cụ thể**, ta dùng <b>'at'</b>: <i>at 25 Tran Phu Street</i>.",
                    why_wrong: "Lưu ý: Nếu chỉ có tên đường (Tran Phu Street) thì dùng 'On'. Nhưng có số nhà thì bắt buộc dùng 'At'."
                }
            },
            {
                id: 16,
                question: "I think I left my phone ______ the box.",
                options: { A: "at", B: "on", C: "in", D: "of" },
                correct: "C",
                explanation: {
                    vocab: [
                        "A. at (prep): tại",
                        "B. on (prep): trên",
                        "C. in (prep): trong (không gian kín)",
                        "D. of (prep): của"
                    ],
                    trans: "Tôi nghĩ tôi đã để quên điện thoại trong hộp.",
                    why_correct: "Hộp (box) là không gian chứa đựng bên trong -> Dùng <b>'in'</b>.",
                    why_wrong: "'On' là để trên nắp hộp. Câu này ý nói để bên trong."
                }
            },
            {

        // --- ÂM THANH (Base64 để chạy Single File) ---
        // Ding (Correct)
        const soundCorrect = new Audio("data:audio/mp3;base64,//uQRAAAAWMSLwUIYAAsYkXgoQwAEaYLWfkWgAI0wWs/ItAAAG84n418AAoAAIv4+bL//uQRAAAAWMSLwUIYAAsYkXgoQwAEaYLWfkWgAI0wWs/ItAAAG84n418AAoAAIv4+bL//uQRAAAAWMSLwUIYAAsYkXgoQwAEaYLWfkWgAI0wWs/ItAAAG84n418AAoAAIv4+bL//uQRAAAAWMSLwUIYAAsYkXgoQwAEaYLWfkWgAI0wWs/ItAAAG84n418AAoAAIv4+bL"); // Placeholder short beep (thực tế cần file xịn hơn, ở đây giả lập)
        // Dùng link online cho âm thanh hay hơn
        const audioDing = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3');

        // --- TRẠNG THÁI GAME ---
        let score = 0;
        let answeredCount = 0;

        // --- HÀM KHỞI TẠO ---
        function initQuiz() {
            const container = document.getElementById('quiz-container');
            // Shuffle câu hỏi
            shuffleArray(quizData);
            
            quizData.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-${q.id}`;
                
                // Tạo HTML cho từng câu
                let optionsHtml = '';
                ['A', 'B', 'C', 'D'].forEach(opt => {
                    optionsHtml += `<button class="option-btn" onclick="checkAnswer(${q.id}, '${opt}', this)">${opt}. ${q.options[opt]}</button>`;
                });

                // Tạo Vocabulary List HTML
                let vocabHtml = q.explanation.vocab.map(v => `<span class="vocab-item">• ${v}</span>`).join('');

                card.innerHTML = `
                    <div class="question-number">Câu ${index + 1}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-grid">
                        ${optionsHtml}
                    </div>
                    <div class="explanation-box" id="exp-${q.id}">
                        <div class="explanation-header">📝 GIẢI THÍCH CHI TIẾT (Cô MS Chí Nên):</div>
                        
                        <div class="exp-section">
                            <span class="exp-label">1. Phân tích từ vựng:</span>
                            <div class="vocab-list">${vocabHtml}</div>
                        </div>

                        <div class="exp-section">
                            <span class="exp-label">2. Dịch nghĩa:</span>
                            "${q.explanation.trans}"
                        </div>

                        <div class="exp-section">
                            <span class="exp-label">3. Tại sao ĐÚNG?</span>
                            <span class="highlight-green">${q.explanation.why_correct}</span>
                        </div>

                        <div class="exp-section">
                            <span class="exp-label">4. Tại sao SAI?</span>
                            <span class="highlight-red">${q.explanation.why_wrong}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- HÀM XỬ LÝ CHỌN ĐÁP ÁN ---
        function checkAnswer(qId, selectedOpt, btnElement) {
            const questionObj = quizData.find(q => q.id === qId);
            const card = document.getElementById(`q-${qId}`);
            const allBtns = card.querySelectorAll('.option-btn');
            const expBox = document.getElementById(`exp-${qId}`);

            // Chặn click lại
            if (btnElement.disabled) return;
            
            // Disable tất cả nút trong câu này
            allBtns.forEach(btn => btn.disabled = true);

            if (selectedOpt === questionObj.correct) {
                // ĐÚNG
                btnElement.classList.add('correct');
                score++;
                audioDing.currentTime = 0;
                audioDing.play();
                fireConfetti();
            } else {
                // SAI
                btnElement.classList.add('wrong');
                // Tìm nút đúng để bôi xanh
                allBtns.forEach(btn => {
                    if (btn.innerText.startsWith(questionObj.correct)) {
                        btn.classList.add('correct');
                    }
                });
                audioBuzz.currentTime = 0;
                audioBuzz.play();
            }

            answeredCount++;
            // Hiện giải thích
            expBox.style.display = 'block';
        }

        // --- HÀM NỘP BÀI ---
        function submitQuiz() {
            if (answeredCount < quizData.length) {
                if(!confirm(`Bạn mới làm ${answeredCount}/${quizData.length} câu. Bạn có chắc muốn nộp bài không?`)) {
                    return;
                }
            }

            const modal = document.getElementById('resultModal');
            const scoreDisplay = document.getElementById('final-score');
            const feedback = document.getElementById('feedback-msg');

            scoreDisplay.innerText = `${score}/${quizData.length}`;
            
            // Lời khen ngẫu nhiên
            const percentage = (score / quizData.length) * 100;
            if (percentage === 100) feedback.innerText = "Xuất sắc! Bạn là thiên tài ngữ pháp! 🌟🏆";
            else if (percentage >= 80) feedback.innerText = "Giỏi quá! Cô MS Chí Nên rất tự hào về bạn! 🎉";
            else if (percentage >= 50) feedback.innerText = "Khá lắm! Cố gắng ôn thêm xíu nữa là điểm 10 nha! 💪";
            else feedback.innerText = "Đừng buồn nhé! Hãy xem kỹ phần giải thích để tiến bộ hơn! ❤️";

            modal.style.display = 'flex';
            fireConfetti();
        }

        // --- UTILS: SHUFFLE ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // --- CONFETTI EFFECT (Simple Implementation) ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const numberOfPieces = 100;
            const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD700'];

            for (let i = 0; i < numberOfPieces; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 5 + 2,
                    angle: Math.random() * 360
                });
            }

            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                pieces.forEach(p => {
                    p.y += p.speed;
                    p.angle += 2;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                    if (p.y < canvas.height) active = true;
                });

                if (active) requestAnimationFrame(update);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            update();
        }

        // Start Quiz on Load
        window.onload = initQuiz;
