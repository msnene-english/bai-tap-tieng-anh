<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài Tập Giới Từ Chỉ Vị Trí - Ms. Chí Nên</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>

        :root {

            --primary-purple: #8854C0;

            --primary-teal: #00C9A7;

            --correct-green: #00D26A;

            --wrong-red: #FF4757;

            --bg-color: #f0f3fa;

            --card-bg: #ffffff;

            --text-color: #2c3e50;

        }



        body {

            font-family: 'Nunito', sans-serif;

            background-color: var(--bg-color);

            background-image: radial-gradient(var(--primary-purple) 1px, transparent 1px), radial-gradient(var(--primary-teal) 1px, transparent 1px);

            background-size: 20px 20px;

            background-position: 0 0, 10px 10px;

            margin: 0;

            padding: 20px;

            color: var(--text-color);

            overflow-x: hidden;

        }



        .container {

            max-width: 800px;

            margin: 0 auto;

        }



        header {

            text-align: center;

            margin-bottom: 30px;

            background: white;

            padding: 20px;

            border-radius: 20px;

            box-shadow: 0 8px 0 rgba(0,0,0,0.1);

            border: 2px solid var(--primary-purple);

        }



        h1 {

            color: var(--primary-purple);

            margin: 0;

            font-family: 'Quicksand', sans-serif;

            font-weight: 800;

            font-size: 2rem;

            text-transform: uppercase;

        }



        .sub-header {

            font-size: 1rem;

            color: #777;

            margin-top: 5px;

            font-weight: 600;

        }



        /* Question Card Style */

        .question-card {

            background: var(--card-bg);

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 30px;

            box-shadow: 0 6px 0 #e0e0e0, 0 10px 10px rgba(0,0,0,0.1);

            position: relative;

            transition: transform 0.3s ease;

            border: 2px solid #eee;

        }



        .question-number {

            display: inline-block;

            background: var(--primary-purple);

            color: white;

            padding: 5px 15px;

            border-radius: 15px;

            font-weight: bold;

            font-size: 0.9rem;

            margin-bottom: 15px;

            box-shadow: 0 3px 0 rgba(0,0,0,0.2);

        }



        .question-text {

            font-size: 1.3rem;

            font-weight: 700;

            margin-bottom: 25px;

            line-height: 1.5;

        }



        .options-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

        }



        @media (max-width: 600px) {

            .options-grid {

                grid-template-columns: 1fr;

            }

        }



        .option-btn {

            background: white;

            border: 2px solid #e0e0e0;

            border-radius: 15px;

            padding: 15px 20px;

            font-size: 1.1rem;

            font-family: 'Nunito', sans-serif;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s;

            text-align: left;

            position: relative;

            box-shadow: 0 4px 0 #ccc;

            color: var(--text-color);

        }



        .option-btn:hover:not(:disabled) {

            transform: scale(1.02);

            border-color: var(--primary-teal);

            background-color: #f0fffa;

        }



        .option-btn:active:not(:disabled) {

            transform: translateY(4px);

            box-shadow: 0 0 0 #ccc;

        }



        /* Correct/Wrong States */

        .option-btn.correct {

            background-color: var(--correct-green) !important;

            color: white !important;

            border-color: var(--correct-green) !important;

            box-shadow: 0 4px 0 #008f48 !important;

        }



        .option-btn.wrong {

            background-color: var(--wrong-red) !important;

            color: white !important;

            border-color: var(--wrong-red) !important;

            box-shadow: 0 4px 0 #b3202d !important;

            animation: shake 0.5s;

        }



        /* Explanation Section */

        .explanation-box {

            display: none; /* Hidden by default */

            margin-top: 20px;

            background: #fff9e6;

            border: 2px solid #ffd700;

            border-radius: 15px;

            padding: 20px;

            animation: slideDown 0.4s ease-out;

        }



        .explanation-box.visible {

            display: block;

        }



        .exp-header {

            display: flex;

            align-items: center;

            gap: 10px;

            font-weight: 800;

            color: #d35400;

            margin-bottom: 10px;

            font-size: 1.1rem;

        }



        .exp-content {

            font-size: 1rem;

            line-height: 1.6;

        }



        .exp-step {

            margin-bottom: 10px;

        }



        .exp-label {

            font-weight: 700;

            color: var(--primary-purple);

            text-decoration: underline;

        }



        /* Animations */

        @keyframes shake {

            0% { transform: translateX(0); }

            25% { transform: translateX(-5px) rotate(-2deg); }

            50% { transform: translateX(5px) rotate(2deg); }

            75% { transform: translateX(-5px) rotate(-2deg); }

            100% { transform: translateX(0); }

        }



        @keyframes slideDown {

            from { opacity: 0; transform: translateY(-10px); }

            to { opacity: 1; transform: translateY(0); }

        }



        /* Submit Button */

        #submit-btn {

            display: block;

            width: 100%;

            background: var(--primary-teal);

            color: white;

            border: none;

            padding: 20px;

            font-size: 1.5rem;

            font-weight: 800;

            border-radius: 20px;

            box-shadow: 0 6px 0 #00917c;

            cursor: pointer;

            margin-top: 40px;

            transition: all 0.2s;

            font-family: 'Quicksand', sans-serif;

            text-transform: uppercase;

        }



        #submit-btn:hover {

            filter: brightness(1.1);

            transform: translateY(-2px);

        }



        #submit-btn:active {

            transform: translateY(4px);

            box-shadow: 0 0 0 #00917c;

        }



        /* Result Modal */

        .modal-overlay {

            display: none;

            position: fixed;

            top: 0; left: 0; width: 100%; height: 100%;

            background: rgba(0,0,0,0.7);

            z-index: 1000;

            justify-content: center;

            align-items: center;

            backdrop-filter: blur(5px);

        }



        .modal-content {

            background: white;

            padding: 40px;

            border-radius: 30px;

            text-align: center;

            max-width: 500px;

            width: 90%;

            border: 5px solid var(--primary-purple);

            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        }



        @keyframes popUp {

            from { transform: scale(0.5); opacity: 0; }

            to { transform: scale(1); opacity: 1; }

        }



        .score-display {

            font-size: 3rem;

            font-weight: 900;

            color: var(--primary-teal);

            margin: 20px 0;

        }



        /* Confetti Canvas */

        #confetti-canvas {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            pointer-events: none;

            z-index: 999;

        }



        /* Phonetics Underline */

        u {

            text-decoration: none;

            border-bottom: 2px solid var(--primary-purple);

            padding-bottom: 2px;

        }

    </style>

</head>

<body>



    <div class="container">

        <header>

            <div class="sub-header">Giáo viên tạo: Ms. Chí Nên</div>

            <h1>BÀI TẬP GIỚI TỪ (IN/ON/AT)</h1>

        </header>



        <div id="quiz-container">

            </div>



        <button id="submit-btn" onclick="submitQuiz()">NỘP BÀI 🚀</button>

    </div>



    <div class="modal-overlay" id="result-modal">

        <div class="modal-content">

            <h2>KẾT QUẢ CỦA CON</h2>

            <div class="score-display" id="final-score">0/30</div>

            <p id="feedback-text" style="font-size: 1.2rem; color: #555;">...</p>

            <button class="option-btn" style="background: var(--primary-purple); color: white; border-color: #6c429c; margin-top: 20px; width: 100%; text-align: center;" onclick="location.reload()">Làm lại bài</button>

        </div>

    </div>



    <canvas id="confetti-canvas"></canvas>



<script>

    // --- DATABASE: 30 Questions based on provided theory ---

    const quizData = [

        // GROUP 1: IN (Thành phố, quốc gia, phòng, không gian kín)

        {

            question: "We are spending our summer holiday _____ Vietnam.",

            options: [

                { text: "A. on", type: "prep", meaning: "trên" },

                { text: "B. at", type: "prep", meaning: "tại" },

                { text: "C. in", type: "prep", meaning: "trong/ở" },

                { text: "D. to", type: "prep", meaning: "tới" }

            ],

            correct: 2, // Index of C

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Chúng tôi đang trải qua kỳ nghỉ hè ở Việt Nam.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong>

                    <br>A. on (giới từ): trên (bề mặt).

                    <br>B. at (giới từ): tại (điểm cụ thể).

                    <br>C. in (giới từ): trong/ở (khu vực rộng lớn).

                    <br>D. to (giới từ): tới (phương hướng).

                </div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> "Vietnam" là tên một <strong>quốc gia</strong>. Theo quy tắc, trước tên quốc gia, châu lục, thành phố lớn ta dùng giới từ <strong>"in"</strong>.</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> Các giới từ còn lại không đi với tên quốc gia để chỉ vị trí địa lý tổng quát.</div>

            `

        },

        {

            question: "My father is working _____ the garden.",

            options: [

                { text: "A. at", type: "prep", meaning: "tại" },

                { text: "B. in", type: "prep", meaning: "trong" },

                { text: "C. on", type: "prep", meaning: "trên" },

                { text: "D. between", type: "prep", meaning: "ở giữa" }

            ],

            correct: 1, // B

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Bố tôi đang làm việc trong vườn.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong>

                    <br>A. at: tại (điểm).

                    <br>B. in: trong (không gian bao quanh).

                    <br>C. on: trên (bề mặt).

                    <br>D. between: ở giữa.

                </div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (B):</strong> "The garden" (khu vườn) được xem là một <strong>không gian kín/có phạm vi</strong> bao quanh. Ta dùng <strong>"in"</strong> để chỉ việc ở bên trong không gian đó.</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "On the garden" sai vì không đứng trên bề mặt khu vườn; "At" thường dùng cho địa điểm công cộng hoặc số nhà cụ thể hơn.</div>

            `

        },

        {

            question: "There are many beautiful islands _____ Asia.",

            options: [

                { text: "A. on", type: "prep", meaning: "trên" },

                { text: "B. in", type: "prep", meaning: "trong/ở" },

                { text: "C. at", type: "prep", meaning: "tại" },

                { text: "D. of", type: "prep", meaning: "của" }

            ],

            correct: 1,

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Có rất nhiều hòn đảo xinh đẹp ở châu Á.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong>

                   <br>Asia (Châu Á) là danh từ chỉ <strong>châu lục</strong>.

                </div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (B):</strong> Trước tên các châu lục (Asia, Europe, Africa...), ta luôn dùng giới từ <strong>"in"</strong>.</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> Không dùng "on Asia" hay "at Asia".</div>

            `

        },

        {

            question: "Put your toys _____ the box, please!",

            options: [

                { text: "A. at", type: "prep", meaning: "tại" },

                { text: "B. on", type: "prep", meaning: "trên" },

                { text: "C. in", type: "prep", meaning: "trong" },

                { text: "D. above", type: "prep", meaning: "phía trên" }

            ],

            correct: 2,

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Làm ơn cất đồ chơi của con vào trong hộp đi!</div>

                <div class="exp-step"><strong>2. Phân tích:</strong> "The box" (cái hộp) là vật thể chứa đựng (container).</div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Dùng <strong>"in"</strong> cho các vật có lòng chứa như hộp, túi, ngăn kéo...</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "On the box" nghĩa là để lên nắp hộp (bề mặt), không đúng ý nghĩa cất gọn đồ chơi vào trong.</div>

            `

        },

        {

            question: "Hanoi is located _____ the North of Vietnam.",

            options: [

                { text: "A. on", type: "prep", meaning: "trên" },

                { text: "B. at", type: "prep", meaning: "tại" },

                { text: "C. from", type: "prep", meaning: "từ" },

                { text: "D. in", type: "prep", meaning: "trong/ở" }

            ],

            correct: 3,

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Hà Nội nằm ở phía Bắc của Việt Nam.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong> Cụm từ chỉ phương hướng (The North, The South, The East, The West).</div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (D):</strong> Với phương hướng, ta dùng cấu trúc: <strong>in + the + hướng</strong> (in the North).</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> Không dùng "on the North" (trừ khi nói 'on the north coast' - bờ biển phía bắc).</div>

            `

        },



        // GROUP 2: ON (Bề mặt, tên đường, số trang, đảo)

        {

            question: "The clock is hanging _____ the wall.",

            options: [

                { text: "A. in", type: "prep", meaning: "trong" },

                { text: "B. at", type: "prep", meaning: "tại" },

                { text: "C. on", type: "prep", meaning: "trên" },

                { text: "D. under", type: "prep", meaning: "dưới" }

            ],

            correct: 2, // C

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Chiếc đồng hồ đang treo trên tường.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong> "The wall" (bức tường) là một <strong>bề mặt</strong> (surface).</div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Bất cứ thứ gì tiếp xúc với bề mặt (dù là mặt ngang hay mặt đứng), ta đều dùng <strong>"on"</strong>. (on the wall, on the floor, on the ceiling).</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "In the wall" là nằm sâu bên trong kết cấu tường; "At the wall" là đứng cạnh tường.</div>

            `

        },

        {

            question: "Her house is _____ Le Loi Street.",

            options: [

                { text: "A. in", type: "prep", meaning: "trong" },

                { text: "B. on", type: "prep", meaning: "trên" },

                { text: "C. at", type: "prep", meaning: "tại" },

                { text: "D. by", type: "prep", meaning: "bởi/cạnh" }

            ],

            correct: 1, // B

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Nhà cô ấy ở trên đường Lê Lợi.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong> "Le Loi Street" là <strong>tên đường</strong> (không có số nhà cụ thể).</div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (B):</strong> Quy tắc: Trước tên đường/phố (Street, Road, Avenue...), ta dùng <strong>"on"</strong>.</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "At" chỉ dùng khi có số nhà cụ thể (Ví dụ: At 10 Le Loi Street). "In" dùng cho thành phố/quốc gia.</div>

            `

        },

        {

            question: "Please open your book _____ page 33.",

            options: [

                { text: "A. at", type: "prep", meaning: "tại" },

                { text: "B. in", type: "prep", meaning: "trong" },

                { text: "C. on", type: "prep", meaning: "trên" },

                { text: "D. to", type: "prep", meaning: "tới" }

            ],

            correct: 2, // C

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Hãy mở sách của bạn ở trang 33.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong> "Page 33" là chỉ số trang.</div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Cụm cố định: <strong>on page + số</strong>. Chúng ta coi trang giấy là một bề mặt chứa thông tin.</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "At page" hay "in page" đều sai collocations trong trường hợp này.</div>

            `

        },

        {

            question: "We had a wonderful vacation _____ Phu Quoc Island.",

            options: [

                { text: "A. in", type: "prep", meaning: "trong" },

                { text: "B. on", type: "prep", meaning: "trên" },

                { text: "C. at", type: "prep", meaning: "tại" },

                { text: "D. into", type: "prep", meaning: "vào trong" }

            ],

            correct: 1, // B

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Chúng tôi đã có một kỳ nghỉ tuyệt vời trên đảo Phú Quốc.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong> "Phu Quoc Island" là một hòn đảo.</div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (B):</strong> Trước tên các hòn đảo (island), ta dùng giới từ <strong>"on"</strong>. (Nghĩa là sống trên bề mặt hòn đảo đó).</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "In" thường dùng cho quốc gia hoặc thành phố lớn trong đất liền hơn.</div>

            `

        },

        {

            question: "Don't leave your phone _____ the table.",

            options: [

                { text: "A. in", type: "prep", meaning: "trong" },

                { text: "B. at", type: "prep", meaning: "tại" },

                { text: "C. to", type: "prep", meaning: "tới" },

                { text: "D. on", type: "prep", meaning: "trên" }

            ],

            correct: 3, // D

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Đừng để điện thoại của bạn trên bàn.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong> "The table" là một mặt phẳng.</div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (D):</strong> Vật nằm trên bề mặt bàn -> Dùng <strong>"on"</strong>.</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> "In the table" (trong ngăn bàn - phải nói rõ là drawer), "At the table" (ngồi tại bàn để ăn/làm việc). Ngữ cảnh "để điện thoại" hợp lý nhất là "on".</div>

            `

        },



        // GROUP 3: AT (Điểm cụ thể, địa chỉ nhà, tòa nhà, sự kiện)

        {

            question: "She lives _____ 25 Tran Phu Street.",

            options: [

                { text: "A. in", type: "prep", meaning: "trong" },

                { text: "B. on", type: "prep", meaning: "trên" },

                { text: "C. at", type: "prep", meaning: "tại" },

                { text: "D. from", type: "prep", meaning: "từ" }

            ],

            correct: 2, // C

            explanation: `

                <div class="exp-step"><strong>1. Dịch câu:</strong> Cô ấy sống tại số 25 đường Trần Phú.</div>

                <div class="exp-step"><strong>2. Phân tích:</strong> Đây là một <strong>địa chỉ cụ thể</strong> (có số nhà + tên đường).</div>

                <div class="exp-step"><strong>3. Tại sao ĐÚNG (C):</strong> Quy tắc: Có số nhà -> Dùng <strong>"at"</strong>. Chỉ có tên đường -> Dùng "on".</div>

                <div class="exp-step"><strong>4. Tại sao SAI:</strong> Rất nhiều bạn chọn B (on) vì thấy "Street", nhưng nhớ là có "25" (số nhà) thì "at" mới chính xác nhất vì nó là một điểm chính xác.</div>

            `

        },

        {

            question: "I will meet you _____ the cinema.",

            options: [

                { text: "A. on", type: "prep", meaning: "trên" },

                { text: "B. in", type: "prep", meaning: "trong" },

                { text: "C. at", type: "prep", meaning: "tại" },

                { text: "D. to", type: "prep", meaning: "tới" }

            ],

            correct: 2, // C

            explanation: `

    let currentScore = 0;

    // Shuffle Array Function

    function shuffleArray(array) {

        for (let i = array.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [array[i], array[j]] = [array[j], array[i]];

        }

    }



    // Audio Context for Sounds (Single File Safe)

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();



    function playSound(type) {

        if (audioCtx.state === 'suspended') audioCtx.resume();

        const oscillator = audioCtx.createOscillator();

        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);

        gainNode.connect(audioCtx.destination);



        if (type === 'correct') {

            // Ding sound (High pitch, decays)

            oscillator.type = 'sine';

            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);

            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            oscillator.start();

            oscillator.stop(audioCtx.currentTime + 0.5);

        } else {

            // Wrong sound (Low pitch, wobble)

            oscillator.type = 'sawtooth';

            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);

            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);

            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            oscillator.start();

            oscillator.stop(audioCtx.currentTime + 0.3);

        }

    }



    // Render Quiz

    function renderQuiz() {

        const container = document.getElementById('quiz-container');

        shuffleArray(quizData); // Shuffle questions



        quizData.forEach((item, index) => {

            // Create Card

            const card = document.createElement('div');

            card.className = 'question-card';

            card.id = `q-${index}`;



            // Create original indices array to track correct answer after shuffle

            let optionIndices = [0, 1, 2, 3];

            shuffleArray(optionIndices); // Shuffle options



            // Store the mapped correct index for this specific card

            let mappedCorrectIndex = optionIndices.indexOf(item.correct);

            

            let optionsHtml = '';

            optionIndices.forEach((originalIndex, displayIndex) => {

                const opt = item.options[originalIndex];

                optionsHtml += `

                    <button class="option-btn" onclick="checkAnswer(${index}, ${displayIndex}, ${mappedCorrectIndex}, this)">

                        ${opt.text} <br> <span style="font-size:0.8rem; color:#666; font-weight:normal;">(${opt.type} - ${opt.meaning})</span>

                    </button>

                `;

            });



            card.innerHTML = `

                <div class="question-number">Câu ${index + 1}</div>

                <div class="question-text">${item.question}</div>

                <div class="options-grid">

                    ${optionsHtml}

                </div>

                <div class="explanation-box" id="exp-${index}">

                    <div class="exp-header">

                        <span>💡 GIẢI THÍCH CHI TIẾT (Ms. Chí Nên)</span>

                    </div>

                    <div class="exp-content">

                        ${item.explanation}

                    </div>

                </div>

            `;

            container.appendChild(card);

        });

    }



    // Check Answer Logic

    window.checkAnswer = function(qIndex, selectedIndex, correctIndex, btnElement) {

        // Prevent re-answering

        const card = document.getElementById(`q-${qIndex}`);

        const buttons = card.querySelectorAll('.option-btn');

        if (card.getAttribute('data-answered') === 'true') return;



        card.setAttribute('data-answered', 'true');

        answeredCount++;



        // Show Explanation immediately

        document.getElementById(`exp-${qIndex}`).classList.add('visible');



        if (selectedIndex === correctIndex) {

            // CORRECT

            btnElement.classList.add('correct');

            currentScore++;

            playSound('correct');

            triggerConfetti(btnElement);

        } else {

            // WRONG

            btnElement.classList.add('wrong');

            // Highlight the correct one

            buttons[correctIndex].classList.add('correct');

            playSound('wrong');

        }



        // Disable all buttons in this card

        buttons.forEach(btn => btn.disabled = true);

    };



    // Submit & Result

    window.submitQuiz = function() {

        const modal = document.getElementById('result-modal');

        const scoreText = document.getElementById('final-score');

        const feedback = document.getElementById('feedback-text');



        modal.style.display = 'flex';

        scoreText.innerText = `${currentScore}/${totalQuestions}`;



        if (currentScore === totalQuestions) {

            feedback.innerText = "🌟 Xuất sắc! Con là bậc thầy giới từ rồi!";

            startConfettiLoop();

        } else if (currentScore >= totalQuestions * 0.8) {

            feedback.innerText = "👏 Rất giỏi! Con chỉ sai một chút xíu thôi.";

        } else if (currentScore >= totalQuestions * 0.5) {

            feedback.innerText = "💪 Cố lên! Con cần ôn lại lý thuyết In/On/At nhé.";

        } else {

            feedback.innerText = "📚 Con hãy xem kỹ lại phần giải thích và làm lại nhé!";

        }

    };



    // --- CONFETTI EFFECT (Canvas) ---

    const canvas = document.getElementById('confetti-canvas');

    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;



    let particles = [];

    const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD700', '#00D26A'];



    function triggerConfetti(element) {

        const rect = element.getBoundingClientRect();

        const x = rect.left + rect.width / 2;

        const y = rect.top + rect.height / 2;



        for (let i = 0; i < 30; i++) {

            particles.push({

                x: x,

                y: y,

                vx: (Math.random() - 0.5) * 10,

                vy: (Math.random() - 0.5) * 10 - 5,

                color: colors[Math.floor(Math.random() * colors.length)],

                size: Math.random() * 8 + 4,

                life: 100

            });

        }

        requestAnimationFrame(updateConfetti);

    }



    function startConfettiLoop() {

        setInterval(() => {

            const x = Math.random() * canvas.width;

            const y = -10;

            for (let i = 0; i < 10; i++) {

                particles.push({

                    x: x,

                    y: y,

                    vx: (Math.random() - 0.5) * 5,

                    vy: Math.random() * 5 + 2,

                    color: colors[Math.floor(Math.random() * colors.length)],

                    size: Math.random() * 8 + 4,

                    life: 200

                });

            }

        }, 100);

        updateConfetti();

    }



    function updateConfetti() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        

        for (let i = 0; i < particles.length; i++) {

            let p = particles[i];

            p.x += p.vx;

            p.y += p.vy;

            p.vy += 0.2; // gravity

            p.life--;

            p.size *= 0.98;



            ctx.fillStyle = p.color;

            ctx.fillRect(p.x, p.y, p.size, p.size);



            if (p.life <= 0) {

                particles.splice(i, 1);

                i--;

            }

        }



        if (particles.length > 0) {

            requestAnimationFrame(updateConfetti);

        }

    }



    // Init

    window.onload = renderQuiz;



</script>
