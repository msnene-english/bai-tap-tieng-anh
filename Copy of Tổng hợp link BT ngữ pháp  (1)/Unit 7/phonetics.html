<html lang="vi">
<head>
<meta charset="UTF-8">

<title>UNIT 7 · PHONETICS I · II · III — /θ/ &amp; /ð/ — Ms. Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF5D6C; --amber:#FFB020; --teal:#12C2B0; --indigo:#4C6FFF; --violet:#8B4DE8;
  --ink:#181433; --paper:#FFF7EC; --card:#ffffff; --bad:#FF3B4E; --good:#08A24B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;
  background:linear-gradient(-45deg,#FF5D6C,#FFB020,#12C2B0,#4C6FFF,#8B4DE8);background-size:400% 400%;animation:bg 22s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(0,0,0,.12) 1.4px,transparent 1.6px);background-size:16px 16px}
.pattern{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.pattern span{position:absolute;font-family:'Bangers',cursive;color:#fff;opacity:.5;-webkit-text-stroke:2px var(--ink);
  animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(112vh) rotate(-12deg)}100%{transform:translateY(-25vh) rotate(12deg)}}
@media (prefers-reduced-motion:reduce){body,.pattern span{animation:none!important}}
.wrap{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:14px 14px 80px}
header.top{text-align:center;margin-bottom:16px}
.teacher{display:inline-block;font-family:'Bangers',cursive;letter-spacing:1px;font-size:1rem;color:var(--ink);
  background:var(--amber);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;box-shadow:3px 3px 0 var(--ink);margin:2px 0 10px}
header.top h1{font-family:'Bangers',cursive;font-size:clamp(26px,5.6vw,46px);line-height:1.05;letter-spacing:2px;color:#fff;
  -webkit-text-stroke:2.5px var(--ink);text-shadow:5px 5px 0 var(--coral),8px 8px 0 rgba(0,0,0,.18)}
header.top .unit{display:inline-block;margin-top:10px;font-family:'Bangers',cursive;font-size:1rem;letter-spacing:1px;color:#fff;
  background:var(--violet);border:3px solid var(--ink);border-radius:12px;padding:3px 16px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg)}
.scorebar{position:sticky;top:8px;z-index:6;margin:0 auto 18px;max-width:540px;background:var(--card);border:3px solid var(--ink);
  border-radius:16px;box-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;gap:12px;padding:9px 14px}
.scorebar b{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.15rem}
.track{flex:1;height:14px;background:#eee;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .5s cubic-bezier(.2,.9,.3,1.3)}
.star{font-size:1.2rem}
.section{background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);
  padding:16px 15px 18px;margin-bottom:20px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.chip{font-family:'Bangers',cursive;letter-spacing:1px;color:#fff;background:var(--indigo);border:3px solid var(--ink);
  border-radius:10px;padding:3px 12px;box-shadow:2px 2px 0 var(--ink);font-size:.95rem}
.sec-head h2{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.24rem;line-height:1.3}
.sec-instruct{font-style:italic;font-weight:700;color:#5b5570;margin:2px 0 12px;font-size:.94rem;line-height:1.6}
/* ── SCAFFOLD LÝ THUYẾT ── */
.theory{background:#FFFDF3;border:3px dashed var(--amber);border-radius:16px;box-shadow:3px 3px 0 rgba(24,20,51,.18);
  padding:14px 14px 16px;margin-bottom:16px}
.theory h3{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.1rem;color:var(--violet);margin-bottom:10px;line-height:1.4}
.rule{background:#fff;border:2.5px solid var(--ink);border-left:8px solid var(--coral);border-radius:10px;padding:8px 12px;
  margin-bottom:9px;font-size:.95rem;line-height:1.8;font-weight:700;box-shadow:2px 2px 0 rgba(24,20,51,.15)}
.rule b{color:var(--indigo)}
.eg{display:inline-block;background:#EAF0FF;border:2px solid var(--indigo);border-radius:8px;padding:0 9px;
  font-weight:800;color:#123a9e;margin:2px 3px 0 0}
.ttab{width:100%;border-collapse:collapse;margin:9px 0;font-size:.89rem}
.ttab th{background:var(--indigo);color:#fff;padding:7px 8px;border:2px solid var(--ink);font-family:'Bangers',cursive;
  letter-spacing:.8px;font-size:.92rem}
.ttab td{background:#fff;padding:7px 9px;border:2px solid var(--ink);font-weight:700;line-height:1.68}
.ttab td b{color:var(--good)}
.ttab td s{color:var(--bad)}
.ttab tr:nth-child(even) td{background:#F7F5FF}
.ttip{background:#DFF7E8;border:2.5px solid var(--good);border-radius:12px;padding:9px 13px;font-size:.93rem;font-weight:700;

.twarn{background:#FFE1E5;border:2.5px solid var(--bad);border-radius:12px;padding:9px 13px;font-size:.93rem;font-weight:700;

.twarn s{color:#b91c1c}

.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:620px){.bins{grid-template-columns:1fr}}
.bin{border:3px solid var(--ink);border-radius:14px;padding:10px 12px 12px;min-height:120px;box-shadow:3px 3px 0 var(--ink)}
.bin.t{background:#FFF4E2}
.bin.d{background:#E8FBF3}
.bin h4{font-family:'Bangers',cursive;font-size:1.02rem;letter-spacing:1px;margin-bottom:8px;line-height:1.4}
.bin.t h4{color:#B35C00}
.bin.d h4{color:#04663a}
.bin .cnt{font-family:'Nunito';font-size:.76rem;font-weight:800;opacity:.75;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .ph{font-size:.82rem;font-style:italic;color:#7b7590;font-weight:700}
.wchip{display:inline-block;background:#fff;border:2.5px solid var(--ink);border-radius:9px;padding:2px 9px;font-weight:800;
  font-size:.9rem;box-shadow:2px 2px 0 rgba(24,20,51,.18);animation:pop .3s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.wchip.ok{border-color:var(--good);color:#04663a;background:#DFF7E8}
.wchip.no{border-color:var(--bad);color:#9f1239;background:#FFE1E5}
/* question card */
.q{border:2.5px dashed #cfc9de;border-radius:14px;padding:12px 12px 13px;margin-bottom:12px;background:#fff}
.q.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.qnum{display:inline-block;font-family:'Bangers',cursive;background:var(--coral);color:#fff;border:2.5px solid var(--ink);
  border-radius:9px;min-width:34px;text-align:center;padding:1px 8px;box-shadow:2px 2px 0 var(--ink);margin-right:8px;font-size:1rem}
.stem{display:inline;font-weight:700;font-size:1.02rem;line-height:1.75}
.bigw{font-family:'Bangers',cursive;font-size:1.55rem;letter-spacing:1.5px;color:var(--violet)}
.bigw .th{background:var(--amber);border:2px solid var(--ink);border-radius:5px;padding:0 3px}
/* câu luyện đọc */
.sent{background:#F0FFF7;border:3px solid var(--ink);border-left:9px solid var(--teal);border-radius:12px;padding:11px 14px;

.sent .lbl{display:inline-block;font-family:'Bangers',cursive;background:var(--teal);color:#fff;border:2px solid var(--ink);
  border-radius:7px;padding:0 10px;font-size:.85rem;letter-spacing:1px;margin-bottom:6px}
.sent .en{font-size:1.12rem;font-weight:800;line-height:1.85;color:#123a9e}
.sent .en u{text-decoration:none;background:var(--amber);border:2px solid var(--ink);border-radius:5px;padding:0 4px;color:var(--ink)}
.sent .vi{font-size:.95rem;font-weight:700;color:#c2410c;line-height:1.7;margin-top:5px}
.sent .note{font-size:.86rem;font-weight:700;color:#7b7590;font-style:italic;margin-top:5px;line-height:1.65}
/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.opts.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.opts.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);border-radius:11px;background:#fff;
  padding:11px 14px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,background .15s;
  font-size:1.01rem;line-height:1.55;text-align:center}
.opt:hover:not(.done){transform:translate(-1px,-1px);background:#FFF8DF}
.opt.ok{background:#C9F7DB;border-color:var(--good)}
.opt.no{background:#FFD6DB;border-color:var(--bad)}
.opt.dim{opacity:.45}
.opt .ipa{font-family:'Courier New',monospace;font-weight:900;font-size:1.12rem}
/* explanation */
.exp{margin-top:11px;border-radius:12px;padding:14px 13px;font-weight:600;line-height:1.72;font-size:.98rem;display:none;
  border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff}
.exp.show{display:block;animation:pop .3s}
.exp.ok{border-color:var(--good)}
.exp.no{border-color:var(--bad)}
.keyb{background:#DFF7E8;border:2.5px solid var(--good);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-weight:900;
  color:#04663a;line-height:1.72}
.stp{background:#F7F9FF;border:2px solid #d6ddf5;border-radius:10px;padding:9px 12px;margin-bottom:9px;line-height:1.8}
.stp .lb{display:inline-block;font-family:'Bangers',cursive;letter-spacing:1px;background:var(--indigo);color:#fff;
  border:2px solid var(--ink);border-radius:7px;padding:0 9px;font-size:.88rem;margin-bottom:6px}
.qt{background:#fff;border:2px solid var(--ink);border-radius:9px;padding:7px 11px;margin-bottom:7px;box-shadow:2px 2px 0 rgba(24,20,51,.13)}
.qt .lt{display:inline-block;background:var(--violet);color:#fff;border:1.5px solid var(--ink);border-radius:5px;width:22px;
  text-align:center;font-family:'Bangers',cursive;font-size:.8rem;margin-right:6px}
.qt .en{color:#123a9e;font-weight:800;line-height:1.7}
.qt .vi{color:#c2410c;font-weight:700;font-size:.93rem;line-height:1.7;margin-top:2px}
.qt.good{background:#F3FFF8;border-color:var(--good)}
.qt.badq{background:#FFF6F7;border-color:var(--bad)}
.qt .tag{display:inline-block;font-family:'Bangers',cursive;font-size:.76rem;letter-spacing:.8px;border-radius:5px;padding:0 7px;
  border:1.5px solid var(--ink);margin-left:5px;vertical-align:2px}
.qt .tag.y{background:#C9F7DB;color:#04663a}
.qt .tag.n{background:#FFD6DB;color:#9f1239}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:7px 0}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#f8fafc;border:2px solid #e2e8f0;border-radius:8px;padding:6px 10px;line-height:1.7;font-weight:700}
.pw{color:#2563eb;font-weight:800}
.hg{color:#16a34a;font-weight:900}
.pm{color:#c2410c;font-weight:700}
.wt{background:#e2e8f0;color:#475569;padding:2px 6px;border-radius:4px;font-size:.78em;font-weight:800;margin:0 3px}
.ipa2{color:#7b1fa2;background:rgba(123,31,162,.09);border-radius:4px;padding:1px 5px;font-family:'Courier New',monospace;font-size:.88em;font-weight:800}
.sT{background:#FFE6C7;border:2px solid var(--ink);border-radius:6px;padding:0 6px;color:#B35C00;font-weight:900;font-family:'Courier New',monospace}
.sD{background:#C9F7DB;border:2px solid var(--ink);border-radius:6px;padding:0 6px;color:#04663a;font-weight:900;font-family:'Courier New',monospace}
.no-x{background:#FFD6DB;border:1.5px solid var(--bad);border-radius:6px;padding:0 6px;color:#9f1239;font-weight:800}
.ys-x{background:#C9F7DB;border:1.5px solid var(--good);border-radius:6px;padding:0 6px;color:#04663a;font-weight:900}
/* KHÔNG dùng gạch chân đỏ trong giải thích */
.pg{background:#FFF3CD;border:2px solid #ffc94d;border-radius:7px;padding:2px 8px;font-weight:800;color:#7a5300;line-height:2.05;display:inline-block}
.btn{font-family:'Bangers',cursive;letter-spacing:1px;font-size:1.2rem;color:#fff;background:var(--teal);border:3px solid var(--ink);
  border-radius:12px;padding:10px 24px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .1s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.submit-bar{text-align:center;margin-top:26px;padding-bottom:20px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);padding:16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-box{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink);padding:24px;
  max-width:96%;width:430px;text-align:center;animation:pop .4s}
.modal-box h2{font-family:'Bangers',cursive;font-size:1.8rem;letter-spacing:1px;color:var(--indigo);margin-bottom:12px;line-height:1.2}
.modal-box input{width:100%;font-family:'Nunito';font-weight:800;font-size:1.05rem;padding:12px;border:3px solid var(--ink);
  border-radius:12px;box-shadow:3px 3px 0 var(--ink);margin-bottom:14px;outline:none;text-align:center}
.modal-box input.error{border-color:var(--bad);background:#FFE1E5;animation:shake .45s}
.modal-box .err-msg{color:var(--bad);font-weight:800;font-size:.9rem;margin-top:-8px;margin-bottom:12px;display:none}
.modal-box .greet{font-family:'Bangers',cursive;font-size:1.35rem;letter-spacing:1px;color:var(--violet);margin-bottom:6px;line-height:1.3}
.modal-box .res-score{font-family:'Bangers',cursive;font-size:2.9rem;color:var(--coral);-webkit-text-stroke:2px var(--ink);
  text-shadow:4px 4px 0 rgba(0,0,0,.1);line-height:1}
.modal-box .res-scale{font-weight:900;color:var(--violet);font-size:1.25rem;margin-top:8px}
.modal-box .res-msg{font-weight:700;font-size:.96rem;line-height:1.7;margin-bottom:14px}
.modal-box img{width:100%;max-width:280px;border-radius:16px;border:3px solid var(--ink);margin:14px auto;display:block;box-shadow:4px 4px 0 var(--ink)}
.confetti{position:fixed;top:0;left:0;width:11px;height:16px;z-index:50;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
</style>

<script>
/* ══ CHỮ BAY COMIC ══ */
(function(){
  const words=['/θ/','/ð/','TH!','THINK','THAT','POW!','BREATHE','BAM!','MONTH'];
  const p=document.getElementById('pattern');
  for(let i=0;i<9;i++){const s=document.createElement('span');
    s.textContent=words[i%words.length];
    s.style.left=(Math.random()*90)+'%';
    s.style.fontSize=(22+Math.random()*28)+'px';
    s.style.animationDuration=(16+Math.random()*14)+'s';
    s.style.animationDelay=(-Math.random()*18)+'s';
    p.appendChild(s)}
})();
/* ══ ÂM THANH — Web Audio API tự sinh (KHÔNG dùng file mp3) ══ */
let AC;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
  o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
  o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const cols=['#FF5D6C','#FFB020','#12C2B0','#4C6FFF','#8B4DE8','#08A24B'];
  for(let i=0;i<36;i++){const d=document.createElement('div');d.className='confetti';
    d.style.background=cols[i%cols.length];
    d.style.left=(Math.random()*100)+'vw';
    d.style.animation='fall '+(1.5+Math.random()*1.4)+'s linear forwards';
    d.style.animationDelay=(Math.random()*.35)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
</script>

<script>
/* ══════════════════ DỮ LIỆU ══════════════════ */
const Q=[];
function mcq(sec,num,q,correct,opts,ex,extra){
  const o={t:'mcq',sec,num,q,correct,opts,ex};if(extra)Object.assign(o,extra);Q.push(o)}
function P(w,ipa,s,m){return "<div><span class='pw'>"+w+"</span> <span class='ipa2'>"+ipa+"</span> "+
  "<b class='"+(s==='θ'?'sT':'sD')+"'>/"+s+"/</b> = <span class='pm'>"+m+"</span></div>"}
function G(w,ty,m){return "<div><span class='hg'>"+w+"</span><span class='wt'>"+ty+"</span>= <span class='pm'>"+m+"</span></div>"}
function T(en,vi,cls,ltr,tag){
  return '<div class="qt'+(cls?' '+cls:'')+'">'+(ltr?'<span class="lt">'+ltr+'</span>':'')+
   '<span class="en">'+en+'</span>'+(tag?tag:'')+'<div class="vi">➜ '+vi+'</div></div>'}
const TY='<span class="tag y">ĐÚNG</span>', TN='<span class="tag n">SAI</span>';
function EX(key,quotes,cells,why,trap){

function p3(sec,num,w,ipa,grp,mean,rule,extra){
  mcq(sec,num,'<b>'+num+'.</b> <span class="bigw">'+w+'</span>',opt(grp),[OT,OD],
   EX('<b>'+w+'</b> '+ipa+' ➔ âm <b>/'+(grp==='T'?'θ':'ð')+'/</b> — '+mean,null,
    P(w,ipa,grp==='T'?'θ':'ð',mean)+rule,
    'Trong câu này, <b>'+w+'</b> đọc <b>/'+(grp==='T'?'θ':'ð')+'/</b> vì '+
    (grp==='T'?'đây là <b>từ nội dung</b> hoặc “th” ở <b>cuối từ</b> / đi với <b>phụ âm</b> ➔ chỉ đẩy hơi, cổ KHÔNG rung.'
              :'đây là <b>từ chức năng</b> hoặc có đuôi <b>-ther / -the</b> ➔ thanh quản RUNG.'),
    extra),
   {grp:grp,bw:w});
}

function sec(chip,title,instruct){
  const d=document.createElement('div');d.className='section';
  d.innerHTML='<div class="sec-head"><span class="chip">'+chip+'</span><h2>'+title+'</h2></div>'+
    '<div class="sec-instruct">'+instruct+'</div>';
  APP.appendChild(d);CUR=d;
}
function put(h){CUR.insertAdjacentHTML('beforeend',h)}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

/* ---------- PHẦN I ---------- */
sec('PHẦN I','🔊 How is <b>th</b> pronounced in the following words?',
 'Chọn <b>/θ/</b> hoặc <b>/ð/</b> cho mỗi từ. Từ sẽ tự bay vào bảng phân loại phía trên. (20 từ)');

 '<span class="eg">that /ðæt/</span><span class="eg">mother /ˈmʌðə(r)/</span><span class="eg">there /ðeə(r)/</span>'+

/* ══════════════════ RENDER ══════════════════ */
function build(m,gid){
  const card=document.createElement('div');card.className='q';card.id='c_'+gid;
  const head='<span class="qnum">'+m.num+'</span>';
  const so=shuffle(m.opts);maps[gid]=so;
  card.innerHTML='<div><span class="stem">'+head+m.q+'</span></div>'+
    '<div class="opts'+(m.cols===4?' c4':'')+'" id="o_'+gid+'">'+
    so.map((o,i)=>'<button class="opt" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
    '</div><div class="exp" id="e_'+gid+'">'+m.ex+'</div>';
  return card;
}
function pick(gid,i){
  if(done[gid])return;done[gid]=true;answered++;
  const m=Q[+gid.slice(1)],box=document.getElementById('o_'+gid),card=document.getElementById('c_'+gid);
  const ok=maps[gid][i]===m.correct;
  [...box.children].forEach((el,j)=>{el.disabled=true;el.classList.add('done');
    if(maps[gid][j]===m.correct)el.classList.add('ok');
    else if(j===i)el.classList.add('no');else el.classList.add('dim')});
  if(m.grp&&m.sec==='A'){
    const b=document.getElementById(m.grp==='T'?'binT':'binD');
    const ph=b.querySelector('.ph');if(ph)ph.remove();
    const c=document.createElement('span');c.className='wchip '+(ok?'ok':'no');c.textContent=m.bw;
    b.appendChild(c);
    document.getElementById(m.grp==='T'?'cT':'cD').textContent=b.querySelectorAll('.wchip').length;
  }
  const e=document.getElementById('e_'+gid);e.classList.add('show',ok?'ok':'no');
  if(ok){score++;ding();confetti()}else{buzz();card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),480)}
  bump();
}
function openName(){document.getElementById('nameOv').classList.add('show');setTimeout(()=>document.getElementById('nameIn').focus(),200)}
function showResult(){
  const inp=document.getElementById('nameIn'),er=document.getElementById('nameErr');
  const nm=inp.value.trim();
  if(!nm){inp.classList.add('error');er.style.display='block';setTimeout(()=>inp.classList.remove('error'),480);return}
  er.style.display='none';document.getElementById('nameOv').classList.remove('show');
  const pct=score/TOTAL,ten=(pct*10).toFixed(2);
  let greet,msg,gif;
  if(score===TOTAL){greet='🏆 XUẤT SẮC, '+nm+'!';
    msg='Con đúng TOÀN BỘ '+TOTAL+' câu — phân biệt /θ/ và /ð/ quá đỉnh! 🎉';
    gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
  else if(pct>=.6){greet='🌟 GIỎI LẮM, '+nm+'!';
    msg='Con làm rất tốt rồi. Nhớ mẹo đặt tay lên cổ để thử độ rung, và học kỹ các cặp breath/breathe · cloth/clothe nhé!';
    gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
  else{greet='🌱 CỐ LÊN NÀO, '+nm+'!';
    msg='Đừng buồn! Đọc lại bảng 7 dấu hiệu nhận biết /θ/ /ð/ rồi làm lại nhé! 📚';
    gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent=score+' / '+TOTAL;
  document.getElementById('rTen').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
  document.getElementById('rImg').src=gif;
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('resOv').classList.add('show');
  if(pct>=.6){confetti();ding()}
}
