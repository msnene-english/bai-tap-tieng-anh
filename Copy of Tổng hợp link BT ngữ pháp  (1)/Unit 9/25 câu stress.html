<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts: Nunito & Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #8854C0; /* Tím Pastel */
            --primary-dark: #6c429c;
            --secondary: #00C9A7; /* Xanh ngọc */
            --secondary-dark: #009e82;
            --accent: #FF9F43; /* Cam */
            --correct: #00D26A; /* Xanh lá */
            --correct-dark: #00b359;
            --wrong: #FF4757; /* Đỏ cam */
            --wrong-dark: #e03b4b;
            --bg-color: #f0f4f8;
            --text-color: #2f3542;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Ngăn bôi đen để trải nghiệm giống app */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--primary) 15%, transparent 16%),
            radial-gradient(var(--secondary) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 40px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 4px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            margin: 0;
            color: var(--primary);
            font-weight: 800;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            margin: 10px 0 0;
            color: #747d8c;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .teacher-badge {
            background: var(--accent);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 4px 0 #e67e22;
        }

        /* PROGRESS BAR */
        .progress-container {
            background: #dfe4ea;
            height: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* QUESTION CARD */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.08);
            border: 3px solid #f1f2f6;
            position: relative;
            transition: transform 0.3s ease;
        }

        .question-number {
            font-family: 'Quicksand', sans-serif;
            color: #a4b0be;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* OPTIONS GRID */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-bottom: 6px solid #e1e1e1;
            border-radius: 15px;
            padding: 20px;
            font-size: 1.2rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background-color: #f7f9fc;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-top: 4px; /* Giữ vị trí không bị nhảy */
        }

        /* OPTION STATES */
        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: var(--correct-dark);
            border-bottom-color: var(--correct-dark);
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            color: white;
            border-color: var(--wrong-dark);
            border-bottom-color: var(--wrong-dark);
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }
        
        /* Hiển thị đáp án đúng khi chọn sai */
        .option-btn.show-correct {
             background-color: #d1f7e4; /* Màu xanh nhạt */
             color: var(--correct-dark);
             border-color: var(--correct);
             border-bottom-color: var(--correct);
        }

        /* EXPLANATION BOX */
        .explanation-box {
            margin-top: 25px;
            background: #fdf6e3; /* Màu vàng nhạt giống giấy note */
            border-left: 6px solid var(--accent);
            padding: 20px;
            border-radius: 10px;
            display: none; /* Mặc định ẩn */
            animation: slideDown 0.4s ease-out;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #4b4b4b;
        }

        .explanation-header {
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        .explanation-content {
            white-space: pre-line; /* Giữ xuống dòng của data gốc */
        }
        
        .explanation-content strong {
            color: var(--primary);
        }

        /* SUBMIT BUTTON */
        .submit-section {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            border-bottom: 6px solid var(--primary-dark);
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Nunito', sans-serif;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        /* ANIMATIONS */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            50% { transform: scale(1.1); }
        }

        /* MODAL RESULT */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 0 rgba(0,0,0,0.1);
            border: 5px solid var(--primary);
            animation: pop 0.5s ease-out;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary);
            margin: 20px 0;
        }

        .message-display {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #57606f;
        }
        
        .question-badge {
            display: inline-flex;
            width: 30px;
            height: 30px;
            background: #eee;
            color: #555;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 10px;
            font-weight: bold;
        }

    </style>
</head>

            <h1>BÀI TẬP TRỌNG ÂM</h1>

        </header>

        </div>

        </div>

        <div class="submit-section">

        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="result-card">

            <button class="btn-submit" onclick="location.reload()" style="background: var(--accent); border-bottom-color: #d35400; font-size: 1.2rem; margin-top: 10px;">Làm lại</button>
        </div>
    </div>

        // LOGIC TRÌNH BÀY & XỬ LÝ
        let userScore = 0;
        let answeredQuestions = new Set();
        const quizContainer = document.getElementById('quiz-container');
        const labels = ['A', 'B', 'C', 'D'];

        // Âm thanh sử dụng Web Audio API (Không cần file ngoài)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Âm thanh Ding (High pitch)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else {
                // Âm thanh Buzz (Low pitch wobble)
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Render câu hỏi
        function renderQuiz() {
            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                
                // Tiêu đề câu hỏi
                let optionsHtml = '';
                item.options.forEach((opt, i) => {
                    optionsHtml += `
                        <button class="option-btn" onclick="checkAnswer(this, ${item.id}, ${i}, ${opt.isCorrect})">
                            <span class="question-badge">${labels[i]}</span>
                            ${opt.text}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-number">Question ${index + 1} / 25</div>
                    <div class="question-text">${item.question}</div>
                    <div class="options-grid" id="options-${item.id}">
                        ${optionsHtml}
                    </div>
                    <div class="explanation-box" id="explain-${item.id}">
                        <div class="explanation-header">
                            <i class="fas fa-lightbulb"></i> Giải thích chi tiết của Ms. Chí Nên:
                        </div>
                        <div class="explanation-content">${item.rationale}</div>
                    </div>
                `;
                quizContainer.appendChild(card);
            });
        }

        function checkAnswer(btn, questionId, optionIndex, isCorrect) {
            // Ngăn chọn lại
            if (answeredQuestions.has(questionId)) return;
            answeredQuestions.add(questionId);

            const optionsContainer = document.getElementById(`options-${questionId}`);
            const buttons = optionsContainer.getElementsByClassName('option-btn');
            
            // Xử lý đúng/sai
            if (isCorrect) {
                btn.classList.add('correct');
                playSound('correct');
                userScore++;
                
                // Hiệu ứng pháo giấy
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00D26A', '#8854C0', '#FF9F43']
                });
            } else {
                btn.classList.add('wrong');
                playSound('wrong');
                // Tìm và hiện đáp án đúng
                for (let b of buttons) {
                    // Logic tìm đáp án đúng dựa trên dữ liệu gốc (đây là cách đơn giản thông qua DOM check)
                    // Vì ta truyền isCorrect vào hàm onclick, ta cần tìm nút đúng trong mảng data
                    // Cách tốt hơn: lưu index đúng trong data.
                    // Ở đây ta duyệt lại data:
                    const qData = quizData.find(q => q.id === questionId);
                    if (qData.options[Array.from(buttons).indexOf(b)].isCorrect) {
                         b.classList.add('show-correct');
                    }
                }
            }

            // Disable tất cả nút của câu này
            for (let b of buttons) {
                b.disabled = true;
            }

            // Hiện giải thích
            const explainBox = document.getElementById(`explain-${questionId}`);
            explainBox.style.display = 'block';

            updateProgress();
        }

        function updateProgress() {
            const percent = (answeredQuestions.size / quizData.length) * 100;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        function submitQuiz() {
            if (answeredQuestions.size < quizData.length) {
                const confirmSubmit = confirm(`Bạn mới làm ${answeredQuestions.size}/25 câu. Bạn có chắc chắn muốn nộp bài không?`);
                if (!confirmSubmit) return;
            }

            const modal = document.getElementById('resultModal');
            const scoreDisplay = document.getElementById('finalScore');
            const msgDisplay = document.getElementById('finalMessage');

            scoreDisplay.innerText = `${userScore}/25`;
            
            let message = "";
            const percentage = (userScore / 25) * 100;

            if (percentage === 100) message = "Xuất sắc! Bạn là thiên tài trọng âm! 🏆";
            else if (percentage >= 80) message = "Làm rất tốt! Cố gắng thêm chút nữa là hoàn hảo! 🌟";
            else if (percentage >= 50) message = "Khá tốt, nhưng hãy xem kỹ lại phần giải thích nhé! 💪";
            else message = "Đừng buồn, hãy ôn lại kiến thức và thử lại nào! 📚";

            msgDisplay.innerText = message;
            modal.style.display = 'flex';
            
            // Pháo giấy lớn nếu điểm cao
            if (percentage >= 50) {
                var duration = 3 * 1000;
                var animationEnd = Date.now() + duration;
                var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 2000 };

                function randomInRange(min, max) {
                  return Math.random() * (max - min) + min;
                }

                var interval = setInterval(function() {
                  var timeLeft = animationEnd - Date.now();

                  if (timeLeft <= 0) {
                    return clearInterval(interval);
                  }

                  var particleCount = 50 * (timeLeft / duration);
                  confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                  confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        // Khởi chạy
        renderQuiz();
