<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếng Anh 7: Pronunciation Challenge - Ms. Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #F0F4F8;
            --main-pink: #FF9FF3;
            --main-purple: #8854C0;
            --main-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --text-color: #2C3A47;
            --card-shadow: 0 10px 25px rgba(136, 84, 192, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Ngăn bôi đen để trải nghiệm giống App */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e0f7fa;
            background-image: 
                radial-gradient(#00C9A7 15%, transparent 16%),
                radial-gradient(#8854C0 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            border: 4px solid #fff;
            position: relative;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--main-purple), #a29bfe);
            padding: 20px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 6px 0 #5f27cd;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-weight: 800;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .score-board {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 800;
            color: var(--main-purple);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 100;
            border: 2px solid var(--main-purple);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Question Card */
        .question-card {
            background: white;
            border-radius: 20px;
            margin-bottom: 40px;
            padding: 20px;
            border: 2px solid #eee;
            transition: all 0.3s ease;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--main-purple);
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .question-number {
            background: var(--main-teal);
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 0 #d1d1d1;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            border-color: var(--main-purple);
            color: var(--main-purple);
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #d1d1d1;
        }

        /* States */
        .option-btn.correct {
            background: var(--correct-green);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 4px 0 #009e4f;
            animation: pop 0.4s ease;
        }

        .option-btn.wrong {
            background: var(--wrong-red);
            color: white;
            border-color: #ff3344;
            box-shadow: 0 4px 0 #d63031;
            animation: shake 0.5s ease;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
            pointer-events: none;
        }

        /* Explanation Box */
        .explanation-box {
            display: none;
            margin-top: 20px;
            background: #fff0f6; /* Hồng rất nhạt */
            border: 2px dashed var(--main-pink);
            border-radius: 15px;
            padding: 20px;
            position: relative;
        }

        .explanation-header {
            font-weight: 800;
            color: var(--main-purple);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation-header i {
            font-size: 1.5rem;
        }

        .explanation-content {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .vocab-list {
            list-style: none;
            margin: 10px 0;
            background: white;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ffdde1;
        }

        .vocab-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding: 5px 0;
        }
        .vocab-item:last-child { border-bottom: none; }
        .vocab-word { font-weight: 700; color: var(--main-purple); }
        .vocab-mean { color: #555; font-style: italic; }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-5deg); }
            40% { transform: translateX(10px) rotate(5deg); }
            60% { transform: translateX(-10px) rotate(-5deg); }
            80% { transform: translateX(10px) rotate(5deg); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Underline style for Phonetics */
        u {
            text-decoration: none;
            border-bottom: 3px solid var(--main-purple);
            padding-bottom: 2px;
        }

        /* Submit Section */
        .submit-section {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }

        .btn-submit {
            background: var(--main-purple);
            color: white;
            font-family: 'Nunito', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #5f27cd;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 #5f27cd;
        }
        
        .btn-submit:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #5f27cd;
        }

        /* Popup Result */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid var(--main-teal);
        }

        .final-score {
            font-size: 4rem;
            font-weight: 900;
            color: var(--main-purple);
            margin: 20px 0;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

    </style>
</head>

        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // Ding sound (High sine wave)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1); // C6
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else {
            // Buzz sound (Low saw wave)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // CONFETTI EFFECT
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];

    function createParticles(x, y) {
        for(let i=0; i<30; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 1) * 10,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                life: 100
            });
        }
    }

    function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Gravity
            p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 6, 6);
            if(p.life <= 0) particles.splice(index, 1);
        });
        requestAnimationFrame(animateConfetti);
    }
    animateConfetti();

    // RENDER QUIZ
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        
        quizData.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${index}`;

            // Header of Card
            const title = document.createElement('div');
            title.className = 'question-title';
            title.innerHTML = `
                <span class="question-number">Question ${index + 1}</span>
                <span>${q.question}</span>
            `;

            // Options Grid
            const grid = document.createElement('div');
            grid.className = 'options-grid';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `${opt.id}. ${opt.text}`;
                btn.onclick = (e) => checkAnswer(index, opt, btn, e);
                grid.appendChild(btn);
            });

            // Explanation Box
            const expl = document.createElement('div');
            expl.className = 'explanation-box';
            expl.id = `expl-${index}`;
            
            // Build Explanation Content (Ms. Chí Nên Style)
            let vocabListHTML = `<ul class="vocab-list">`;
            q.options.forEach(o => {
                vocabListHTML += `
                    <li class="vocab-item">
                        <div><span class="vocab-word">${o.id}. ${o.text.replace(/<\/?u>/g, '')}</span> <small>${o.ipa}</small></div>
                        <span class="vocab-mean">${o.mean}</span>
                    </li>
                `;
            });
            vocabListHTML += `</ul>`;

            const correctOpt = q.options.find(o => o.correct);
            const othersType = q.options.find(o => !o.correct).type; // Assuming other 3 are same

            expl.innerHTML = `
                <div class="explanation-header">
                    <i>👩‍🏫</i> <span>Ms. Chí Nên giải thích chi tiết:</span>
                </div>
                <div class="explanation-content">
                    <p><strong>1. Phân tích từ vựng & Phiên âm:</strong></p>
                    ${vocabListHTML}
                    <p style="margin-top: 10px;"><strong>2. Tại sao chọn đáp án ${correctOpt.id}?</strong></p>
                    <p>Đáp án <strong>${correctOpt.text}</strong> có phần gạch chân phát âm là <strong style="color:var(--correct-green); font-size:1.2em">/${correctOpt.type}/</strong>.</p>
                    <p>Trong khi đó, 3 đáp án còn lại đều phát âm là <strong style="color:var(--wrong-red)">/${othersType}/</strong>.</p>
                    <p><em>💡 Mẹo nhỏ: ${q.hint}</em></p>
                </div>
            `;

            card.appendChild(title);
            card.appendChild(grid);
            card.appendChild(expl);
            container.appendChild(card);
        });
    }

    // CHECK ANSWER LOGIC
    function checkAnswer(qIndex, selectedOpt, btnElement, event) {
        if (answeredQuestions.has(qIndex)) return; // Prevent re-answering
        answeredQuestions.add(qIndex);

        const card = document.getElementById(`q-${qIndex}`);
        const allBtns = card.querySelectorAll('.option-btn');
        const explanation = document.getElementById(`expl-${qIndex}`);

        // Disable all buttons
        allBtns.forEach(btn => btn.classList.add('disabled'));

        if (selectedOpt.correct) {
            // CORRECT
            btnElement.classList.add('correct');
            currentScore++;
            playSound('correct');
            createParticles(event.clientX, event.clientY); // Confetti at click
            document.getElementById('current-score').innerText = currentScore;
        } else {
            // WRONG
            btnElement.classList.add('wrong');
            playSound('wrong');
            // Highlight the correct one automatically
            const correctBtn = Array.from(allBtns).find(btn => 
                btn.innerText.includes(quizData[qIndex].options.find(o => o.correct).text.replace(/<\/?u>/g, ''))
            );
            if(correctBtn) correctBtn.classList.add('correct'); // Show correct answer even if wrong
        }

        // Show Explanation with animation
        explanation.style.display = 'block';
        explanation.animate([
            { opacity: 0, transform: 'translateY(-10px)' },
            { opacity: 1, transform: 'translateY(0)' }
        ], { duration: 300 });
    }

    // SHOW FINAL RESULT
    function showFinalResult() {
        const modal = document.getElementById('result-modal');
        const scoreDisplay = document.getElementById('final-score-display');
        const feedback = document.getElementById('final-feedback');

        scoreDisplay.innerText = `${currentScore} / ${totalQuestions}`;
        
        const percentage = (currentScore / totalQuestions) * 100;
        if (percentage === 100) {
            feedback.innerText = "🏆 Xuất sắc! Em là thiên tài ngữ âm!";
            playSound('correct');
            createParticles(window.innerWidth/2, window.innerHeight/2);
        } else if (percentage >= 80) {
            feedback.innerText = "🎉 Rất tốt! Chỉ sai một chút xíu thôi.";
        } else if (percentage >= 50) {
            feedback.innerText = "💪 Cố gắng lên! Em cần ôn lại các từ vựng nhé.";
        } else {
            feedback.innerText = "📚 Cần luyện tập thêm nhiều nha!";
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
    }

    // Initialize
    renderQuiz();

</script>
</body>
</html>
