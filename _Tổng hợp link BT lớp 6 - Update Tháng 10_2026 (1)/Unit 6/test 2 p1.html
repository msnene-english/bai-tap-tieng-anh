<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#d62828;--p4:#f4a261;--p5:#ff8fab;--green:#00D26A;--red:#FF4757;--ink:#5a1414;--glow:#ffd60a;--glow2:#d62828}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;line-height:1.55;overflow-x:hidden;position:relative;
  background:linear-gradient(-45deg,#e63946,#f4a261,#ffd166,#ff8fab,#ef476f);background-size:400% 400%;animation:bgmove 18s ease infinite}

.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}
.topbar{text-align:center;background:rgba(255,255,255,.28);backdrop-filter:blur(12px);border:1.5px solid rgba(255,214,10,.75);border-radius:22px;padding:14px 16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(90,20,20,.24)}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(214,40,40,.7);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:0 2px 10px rgba(90,20,20,.4)}
.topbar p{font-size:.78rem;color:#fff;opacity:.97;margin-top:2px}
.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(120,20,20,.26);backdrop-filter:blur(10px);border-radius:30px;padding:5px;border:1.5px solid rgba(255,214,10,.5);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.45);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s}

.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p4));color:#fff;font-weight:900;min-width:40px;height:40px;padding:0 8px;border-radius:14px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 6px 14px rgba(214,40,40,.4)}
.sec h2{color:#fff;font-size:1.0rem;font-weight:800;text-shadow:0 1px 6px rgba(90,20,20,.4);flex:1}

.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#f7b731);color:#7a4a00;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:linear-gradient(135deg,#fff,#fff3f0);border:2px solid rgba(214,40,40,.22);border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(214,40,40,.2),0 8px 14px rgba(90,20,20,.1);transition:transform .12s,box-shadow .12s;text-align:center;user-select:none}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(214,40,40,.28),0 0 18px rgba(255,214,10,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#00b894);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.tin:focus{border-color:var(--glow2);box-shadow:0 0 0 4px rgba(214,40,40,.18)}
.tin.ok{border-color:var(--green);background:#eafff3}.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.05rem;font-weight:800;color:var(--p1)}
.btn-check{font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--glow2),var(--p4));padding:11px 18px;border-radius:14px;box-shadow:0 5px 0 rgba(214,40,40,.4);transition:transform .1s}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(214,40,40,.4)}
.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{width:46px;height:46px;border-radius:14px;border:2px solid rgba(214,40,40,.3);background:linear-gradient(135deg,#fff,#fff3f0);font-weight:900;font-size:1.1rem;cursor:pointer;color:var(--p1);box-shadow:0 5px 0 rgba(214,40,40,.2);transition:transform .12s}
.lbtn:hover:not(.locked){transform:scale(1.08)}
.lbtn.sel{background:linear-gradient(135deg,var(--glow2),var(--p4));color:#fff}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#00b894);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}.corrbox.show{display:block}
.exp{max-height:0;overflow:hidden;transition:max-height .5s,margin .3s,padding .3s;background:rgba(214,40,40,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2600px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(214,40,40,.3)}
.exp ol{margin:6px 0 2px 18px}.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#fff0f2,#fff6e6);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#b02a2a;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.stp{color:#b02a2a;font-weight:800}
.p-word{color:#2563eb;font-weight:800}.hl-green{color:#0a9d54;font-weight:900}.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(214,40,40,.15);color:#b02a2a;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}
.credit{margin-top:10px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.13);font-size:.78rem;font-weight:800;color:#9a6b2f;text-align:right;font-style:italic}
.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--glow2),var(--p4),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(214,40,40,.4);transition:transform .1s}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(214,40,40,.4)}
.mask{position:fixed;inset:0;background:rgba(80,15,15,.6);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:#fff;border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(80,15,15,.4);border:2px solid rgba(255,214,10,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#7a4a4a;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(214,40,40,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:fb 2s ease-in-out infinite}
@keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p5),var(--p1));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(214,40,40,.4)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fff;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>

<script>
const DATA=[
/* ===== A.I PHONETICS ===== */
{sec:"I",head:"A. NGỮ ÂM — Chọn từ có phần gạch chân đọc khác các từ còn lại.",num:1,type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["<u>c</u>elebrate","bi<u>c</u>ycle","<u>c</u>inema","de<u>c</u>orate"],answer:"de<u>c</u>orate",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "c" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>celebrate</span> <span class='p-phonetic'>/ˈselɪbreɪt/</span> = <span class='p-mean'>kỷ niệm → c /s/</span></div>
 <div><span class='p-word'>bicycle</span> <span class='p-phonetic'>/ˈbaɪsɪkl/</span> = <span class='p-mean'>xe đạp → c /s/</span></div>
 <div><span class='p-word'>cinema</span> <span class='p-phonetic'>/ˈsɪnəmə/</span> = <span class='p-mean'>rạp phim → c /s/</span></div>
 <div><span class='hl-green'>decorate</span> <span class='p-phonetic'>/ˈdekəreɪt/</span> = <span class='p-mean'>trang trí → c /k/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"decorate" có "c" đứng trước "o" nên đọc /k/; ba từ kia có "c" trước e/i/y nên đọc /s/.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>celebrate, bicycle, cinema đều có "c" đọc /s/.</span></li></ol>
 <div class="tip">🧠 Mẹo: "c" trước e/i/y đọc /s/; "c" trước a/o/u đọc /k/ (cat, decorate, cup).</div>`},
{sec:"I",num:2,type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["<u>s</u>ure","<u>s</u>trike","<u>s</u>andy","<u>s</u>upermarket"],answer:"<u>s</u>ure",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "s" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>sure</span> <span class='p-phonetic'>/ʃʊə/</span> = <span class='p-mean'>chắc chắn → s /ʃ/</span></div>
 <div><span class='p-word'>strike</span> <span class='p-phonetic'>/straɪk/</span> = <span class='p-mean'>gõ/đánh → s /s/</span></div>
 <div><span class='p-word'>sandy</span> <span class='p-phonetic'>/ˈsændi/</span> = <span class='p-mean'>đầy cát → s /s/</span></div>
 <div><span class='p-word'>supermarket</span> <span class='p-phonetic'>/ˈsuːpəmɑːkɪt/</span> = <span class='p-mean'>siêu thị → s /s/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"sure" có "s" đọc /ʃ/ (âm sh), khác ba từ kia đọc /s/.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>strike, sandy, supermarket đều có "s" đọc /s/.</span></li></ol>
 <div class="tip">🧠 Mẹo: "s" đọc /ʃ/ trong sure, sugar.</div>`},
{sec:"I",num:3,type:"mcq",
 q:"3. Choose the word whose underlined part is pronounced differently.",
 disp:["w<u>e</u>lcome","t<u>e</u>mple","b<u>e</u>have","r<u>e</u>lative"],answer:"b<u>e</u>have",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "e" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>welcome</span> <span class='p-phonetic'>/ˈwelkəm/</span> = <span class='p-mean'>chào đón → e /e/</span></div>
 <div><span class='p-word'>temple</span> <span class='p-phonetic'>/ˈtempl/</span> = <span class='p-mean'>ngôi đền → e /e/</span></div>
 <div><span class='hl-green'>behave</span> <span class='p-phonetic'>/bɪˈheɪv/</span> = <span class='p-mean'>cư xử → e /ɪ/</span></div>
 <div><span class='p-word'>relative</span> <span class='p-phonetic'>/ˈrelətɪv/</span> = <span class='p-mean'>họ hàng → e /e/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"behave" có "e" (âm không nhấn đầu) đọc /ɪ/, khác ba từ kia đọc /e/.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>welcome, temple, relative đều có "e" đọc /e/.</span></li></ol>`},
/* ===== A.II ODD ONE OUT ===== */
{sec:"II",head:"A. TỪ KHÁC LOẠI — Chọn từ KHÁC LOẠI so với nhóm.",num:4,type:"mcq",
 q:"4. Choose the odd one out.",
 disp:["peach flower","lucky money","flower market","national park"],answer:"national park",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ không cùng nhóm với các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>peach flower</span> = <span class='p-mean'>hoa đào (gắn với Tết)</span></div><div><span class='p-word'>lucky money</span> = <span class='p-mean'>tiền lì xì (gắn với Tết)</span></div>
 <div><span class='p-word'>flower market</span> = <span class='p-mean'>chợ hoa (gắn với Tết)</span></div><div><span class='hl-green'>national park</span> = <span class='p-mean'>vườn quốc gia (không gắn với Tết)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>peach flower, lucky money, flower market đều gắn với ngày TẾT; còn "national park" không liên quan đến Tết → khác loại.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Ba từ kia đều là hình ảnh quen thuộc của Tết.</span></li></ol>`},
{sec:"II",num:5,type:"mcq",
 q:"5. Choose the odd one out.",
 disp:["cathedral","waterfall","pagoda","temple"],answer:"waterfall",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ không cùng nhóm với các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>cathedral</span> = <span class='p-mean'>nhà thờ lớn (nơi thờ cúng)</span></div><div><span class='hl-green'>waterfall</span> = <span class='p-mean'>thác nước (thiên nhiên)</span></div>
 <div><span class='p-word'>pagoda</span> = <span class='p-mean'>chùa (nơi thờ cúng)</span></div><div><span class='p-word'>temple</span> = <span class='p-mean'>đền (nơi thờ cúng)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>cathedral, pagoda, temple đều là NƠI THỜ CÚNG (công trình tôn giáo); còn "waterfall" là cảnh vật THIÊN NHIÊN → khác loại.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Ba từ kia cùng là nơi thờ cúng.</span></li></ol>`},
{sec:"II",num:6,type:"mcq",
 q:"6. Choose the odd one out.",
 disp:["faraway","cheer","wish","celebrate"],answer:"faraway",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ không cùng nhóm với các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>faraway</span> <span class='wt'>adj</span> = <span class='p-mean'>xa xôi (tính từ)</span></div><div><span class='p-word'>cheer</span> <span class='wt'>v</span> = <span class='p-mean'>cổ vũ</span></div>
 <div><span class='p-word'>wish</span> <span class='wt'>v</span> = <span class='p-mean'>chúc/ước</span></div><div><span class='p-word'>celebrate</span> <span class='wt'>v</span> = <span class='p-mean'>kỷ niệm</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>cheer, wish, celebrate đều là ĐỘNG TỪ; còn "faraway" là TÍNH TỪ → khác loại.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Ba từ kia cùng là động từ.</span></li></ol>`},
/* ===== A.III MCQ ===== */
{sec:"III",head:"A. CHỌN ĐÁP ÁN — Chọn từ/cụm từ thích hợp nhất.",num:7,type:"mcq",
 q:"7. In Denmark, people jump off chairs ______ midnight to welcome the new year.",
 disp:["in","at","on","from"],answer:"at",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Ở Đan Mạch, người ta nhảy khỏi ghế vào lúc nửa đêm để chào đón năm mới.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>in</span> = <span class='p-mean'>vào (in + buổi/tháng)</span></div><div><span class='hl-green'>at</span> = <span class='p-mean'>vào (at midnight)</span></div>
 <div><span class='p-word'>on</span> = <span class='p-mean'>vào (on + ngày)</span></div><div><span class='p-word'>from</span> = <span class='p-mean'>từ</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"midnight" (nửa đêm – một mốc giờ) → dùng "AT midnight".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>in + buổi/tháng; on + ngày; from (từ) không hợp với "midnight".</span></li></ol>
 <div class="tip">🧠 Nhớ: at midnight, at noon, at night, at + giờ.</div>`},
{sec:"III",num:8,type:"mcq",
 q:"8. Timmy always ______ fun playing board games with his grandparents.",
 disp:["has","gets","is","does"],answer:"has",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Timmy luôn chơi vui vẻ khi chơi cờ bàn với ông bà.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>has</span> = <span class='p-mean'>có (have fun = vui vẻ)</span></div><div><span class='p-word'>gets</span> = <span class='p-mean'>lấy/trở nên</span></div>
 <div><span class='p-word'>is</span> = <span class='p-mean'>thì/là</span></div><div><span class='p-word'>does</span> = <span class='p-mean'>làm</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Cụm cố định "have fun (doing sth)" = vui vẻ (làm gì). Chủ ngữ "Timmy" (He) → "has fun".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>get/is/does không đi với "fun" theo nghĩa "vui vẻ".</span></li></ol>
 <div class="tip">🧠 Nhớ: have fun = vui vẻ (have a good time).</div>`},
{sec:"III",num:9,type:"mcq",
 q:"9. There is ______ bread in the cupboard. You can make a sandwich with it.",
 disp:["any","a few","some","many"],answer:"some",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Có một ít bánh mì trong tủ. Bạn có thể làm bánh sandwich với nó.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>any</span> = <span class='p-mean'>nào (câu hỏi/phủ định)</span></div><div><span class='p-word'>a few</span> = <span class='p-mean'>một vài (đếm được)</span></div>
 <div><span class='hl-green'>some</span> = <span class='p-mean'>một ít (khẳng định)</span></div><div><span class='p-word'>many</span> = <span class='p-mean'>nhiều (đếm được)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Câu KHẲNG ĐỊNH + "bread" (không đếm được) → dùng "some bread" (một ít bánh mì).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>any (câu hỏi/phủ định); a few/many dùng cho danh từ đếm được, còn bread không đếm được.</span></li></ol>
 <div class="tip">🧠 Nhớ: câu khẳng định → some; câu hỏi/phủ định → any.</div>`},
{sec:"III",num:10,type:"mcq",

 disp:["envelopes","notebooks","letters","postcards"],answer:"envelopes",

 <div><span class='p-word'>letters</span> = <span class='p-mean'>thư</span></div><div><span class='p-word'>postcards</span> = <span class='p-mean'>bưu thiếp</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"red envelopes" = phong bao lì xì đỏ — thứ trẻ em thích nhận vào Tết.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>notebooks/letters/postcards không phải "red ..." đặc trưng của Tết.</span></li></ol>

{sec:"III",num:11,type:"mcq",
 q:"11. Before making a wish at a Japanese temple, you have to ______ a coin into a box.",
 disp:["hit","throw","strike","fly"],answer:"throw",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Trước khi ước nguyện ở một ngôi đền Nhật Bản, bạn phải ném một đồng xu vào hộp.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">

 <div><span class='p-word'>strike</span> = <span class='p-mean'>gõ/đánh</span></div><div><span class='p-word'>fly</span> = <span class='p-mean'>bay</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"throw a coin INTO a box" = ném đồng xu vào hộp. Hành động bỏ tiền vào hộp là "throw".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>hit/strike (đánh), fly (bay) không hợp với "a coin into a box".</span></li></ol>`},
{sec:"III",num:12,type:"mcq",
 q:"12. Mila, do you have ______ this Friday to go to the library with me?",
 disp:["a time","times","time","many time"],answer:"time",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Mila, thứ Sáu này bạn có thời gian đi thư viện với mình không?</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>a time</span> = <span class='p-mean'>một lần (đếm được)</span></div><div><span class='p-word'>times</span> = <span class='p-mean'>nhiều lần</span></div>
 <div><span class='hl-green'>time</span> = <span class='p-mean'>thời gian (không đếm được)</span></div><div><span class='p-word'>many time</span> = <span class='p-mean'>sai (many + số nhiều)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"have time" = có thời gian (rảnh). "time" ở đây là danh từ KHÔNG đếm được → không có mạo từ.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>a time/times (lần); "many time" sai ngữ pháp (many + danh từ số nhiều).</span></li></ol>
 <div class="tip">🧠 Nhớ: have time = có thời gian (không đếm được); a time = một lần.</div>`},
{sec:"III",num:13,type:"mcq",
 q:"13. ______ flowers can you buy at the flower market during Tet?",
 disp:["Whose","What","Why","When"],answer:"What",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Bạn có thể mua những loại hoa nào ở chợ hoa trong dịp Tết?</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>Whose</span> = <span class='p-mean'>của ai</span></div><div><span class='hl-green'>What</span> = <span class='p-mean'>gì/loại nào (What + N)</span></div>
 <div><span class='p-word'>Why</span> = <span class='p-mean'>tại sao</span></div><div><span class='p-word'>When</span> = <span class='p-mean'>khi nào</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Hỏi LOẠI hoa (đi kèm danh từ "flowers") → "What flowers" (những loại hoa nào).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Whose (của ai), Why (lý do), When (thời gian) không hợp với "flowers ... buy".</span></li></ol>
 <div class="tip">🧠 Nhớ: What + danh từ = ... loại nào (What flowers/colour/kind).</div>`},
{sec:"III",num:14,type:"mcq",
 q:"14. My family always cook ______ special dishes for New Year's Eve.",
 disp:["a little","lots","a few","any"],answer:"a few",

 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>a little</span> = <span class='p-mean'>một chút (không đếm được)</span></div><div><span class='p-word'>lots</span> = <span class='p-mean'>nhiều (thiếu "of")</span></div>
 <div><span class='hl-green'>a few</span> = <span class='p-mean'>một vài (đếm được)</span></div><div><span class='p-word'>any</span> = <span class='p-mean'>nào (câu hỏi/phủ định)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"dishes" là danh từ ĐẾM ĐƯỢC số nhiều, câu khẳng định → "a few special dishes".</span></li>

{sec:"III",num:15,type:"mcq",
 q:"15. You ______ break things at Tet because it's not lucky.",
 disp:["should","shouldn't","must","mustn't"],answer:"shouldn't",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Bạn không nên làm vỡ đồ vào dịp Tết vì điều đó không may mắn.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>should</span> = <span class='p-mean'>nên</span></div><div><span class='hl-green'>shouldn't</span> = <span class='p-mean'>không nên (lời khuyên)</span></div>
 <div><span class='p-word'>must</span> = <span class='p-mean'>phải</span></div><div><span class='p-word'>mustn't</span> = <span class='p-mean'>không được (cấm)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"it's not lucky" (không may mắn – theo quan niệm) → lời KHUYÊN "không nên" → "shouldn't break things".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>should (ngược); must (phải); mustn't (cấm tuyệt đối – quá mạnh cho quan niệm may rủi).</span></li></ol>
 <div class="tip">🧠 Nhớ: shouldn't = không nên (lời khuyên).</div>`},
{sec:"III",num:16,type:"mcq",

 <div><span class='p-word'>opening</span> = <span class='p-mean'>mở</span></div><div><span class='hl-green'>planting</span> = <span class='p-mean'>trồng (cây)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"flowers in the garden" (hoa trong vườn) → hành động "planting" (trồng hoa).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>making/showing/opening không hợp với "flowers in the garden".</span></li></ol>

{sec:"III",num:17,type:"mcq",

 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>natural</span> = <span class='p-mean'>tự nhiên</span></div><div><span class='hl-green'>special</span> = <span class='p-mean'>đặc biệt</span></div>
 <div><span class='p-word'>boring</span> = <span class='p-mean'>nhàm chán</span></div><div><span class='p-word'>quiet</span> = <span class='p-mean'>yên tĩnh</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Với người Việt, Tết là dịp quan trọng nhất → "more special than" (đặc biệt hơn).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>natural/boring/quiet không hợp lời khen về Tết đối với gia đình Việt.</span></li></ol>`},
{sec:"III",num:18,type:"mcq",
 q:'18. Alvin: "Is it okay to play loud music at night?" – Millie: "______ It\'s really rude."',
 disp:["It sounds so interesting.","I hope you play it all night.","No, I'm fine with that.","You shouldn't do that."],answer:"You shouldn't do that.",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Alvin: "Bật nhạc to vào ban đêm có ổn không?" – Millie: "Bạn không nên làm vậy. Nó thật sự bất lịch sự."</div>

 <div><span class='p-word'>B. I hope you play it all night.</span> = <span class='p-mean'>Mong bạn bật cả đêm. (mâu thuẫn)</span></div>

 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"It's really rude" (thật bất lịch sự) → khuyên KHÔNG NÊN → "You shouldn't do that."</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>A, B, C đều ĐỒNG TÌNH với việc bật nhạc to — trái với "It's really rude".</span></li></ol>`},

 q:"20. He sometimes <u>goes</u> shopping <u>with</u> <u>her</u> friends at <u>weekends</u>.",

{sec:"IV",num:21,type:"error",
 q:"21. <u>At</u> night, <u>the</u> city is much <u>more livelier</u> than <u>our</u> hometown.",
 parts:["At","the","more livelier","our"],correctLetter:2,corrAccept:["livelier","more lively"],
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Vào ban đêm, thành phố nhộn nhịp hơn nhiều so với quê chúng tôi.</div>

  card.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  const zone=document.createElement('div');card.appendChild(zone);
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=it.exp+'<div class="credit">✍️ Biên soạn & giải thích: Ms. Chí Nên · NEN</div>';card.appendChild(exp);
  quiz.appendChild(card);
  if(it.type==='mcq')renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange')renderFill(it,idx,zone,exp);
  else if(it.type==='rewrite')renderRewrite(it,idx,zone,exp);
  else if(it.type==='error')renderError(it,idx,zone,exp);
});
updateProg();
function markDone(idx,ok){if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg()}}
function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div');wrap.className='opts';
  shuffle(it.disp).forEach(txt=>{
    const b=document.createElement('div');b.className='opt';b.innerHTML=txt;
    b.onclick=()=>{if(state[idx])return;const all=wrap.querySelectorAll('.opt');all.forEach(x=>x.classList.add('locked'));
      if(txt===it.answer){b.classList.add('correct');ding();confetti();markDone(idx,true)}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim')});setTimeout(()=>b.classList.remove('shake'),450)}
      exp.classList.add('open')};
    wrap.appendChild(b)});
  zone.appendChild(wrap);
}
function renderFill(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  const acc=it.accept.map(norm);
  function check(){if(state[idx])return;const ok=acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderRewrite(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const pre=document.createElement('span');pre.className='prefix';pre.textContent=it.prefix+' ...';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Gõ tiếp phần còn lại...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(pre);row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  const contN=it.accept.map(norm),preN=norm(it.prefix),fullN=it.accept.map(a=>norm(it.prefix+' '+a));
  function check(){if(state[idx])return;let inN=norm(inp.value),stripped=inN;
    if(inN.startsWith(preN+' '))stripped=inN.slice(preN.length).trim();else if(inN===preN)stripped='';
    const ok=contN.includes(inN)||contN.includes(stripped)||fullN.includes(inN);inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderError(it,idx,zone,exp){
  const q=document.createElement('div');q.className='err-parts';let lb=it.q.replace(/^\d+\.\s*/,'');let li=0;const L=['A','B','C','D'];
  lb=lb.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);q.innerHTML=lb;zone.appendChild(q);
  const letters=document.createElement('div');letters.className='letters';
  const corr=document.createElement('div');corr.className='corrbox';const acc=it.corrAccept.map(norm);let chosen=null;
  L.forEach((lab,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=lab;
    b.onclick=()=>{if(state[idx])return;letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');chosen=i;corr.classList.add('show');corr.querySelector('input').focus()};letters.appendChild(b)});
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div>`;
  zone.appendChild(corr);const inp=corr.querySelector('input'),btn=corr.querySelector('button');
  function check(){if(state[idx])return;if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return}
    const ok=(chosen===it.correctLetter)&&acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel')});letters.children[it.correctLetter].classList.add('correct');if(chosen!==it.correctLetter)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
/* ===== SUBMIT ===== */
function openName(){document.getElementById('nameMask').classList.add('show');setTimeout(()=>document.getElementById('nameInput').focus(),100)}
function doSubmit(){const inp=document.getElementById('nameInput'),w=document.getElementById('nameWarn'),name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return}inp.classList.remove('err');w.textContent='';document.getElementById('nameMask').classList.remove('show');showResult(name)}
function showResult(name){let correct=0;for(let i=0;i<TOTAL;i++)if(state[i]==='ok')correct++;const pct=correct/TOTAL,s10=(pct*10).toFixed(2);let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Chúc con một năm mới học giỏi! 🧧';fb='🏆🧧🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif'}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa nhé! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif'}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi làm lại nha! 🧧';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif'}
  document.getElementById('resGreet').textContent=greet;document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'),fbEl=document.getElementById('resFallback');fbEl.textContent=fb;fbEl.style.display='none';im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none'};im.onerror=()=>{im.style.display='none';fbEl.style.display='block'};im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block'}},2500);
  document.getElementById('resMask').classList.add('show');if(pct>=0.6){confetti();ding()}}
/* ===== FLOATS ===== */
(function(){const icons=['🧧','🏮','🌸','🎆','🍊','🐉','🎋','💰','🎇','🎊'];const p=document.getElementById('pattern');
  for(let i=0;i<11;i++){const s=document.createElement('span');s.className='float';s.textContent=icons[i%icons.length];s.style.left=Math.random()*100+'%';s.style.animationDuration=(18+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*24)+'s';s.style.fontSize=(1.5+Math.random()*1.6)+'rem';p.appendChild(s)}})();
</script>
