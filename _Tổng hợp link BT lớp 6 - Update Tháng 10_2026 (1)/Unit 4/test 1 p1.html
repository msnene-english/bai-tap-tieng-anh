<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIT 4 · TEST 1 · Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#2f80ed;--p4:#27ae60;--p5:#56ccf2;--green:#00D26A;--red:#FF4757;--ink:#1e3a5f;--glow:#f2c94c;--glow2:#2f80ed}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;line-height:1.55;overflow-x:hidden;position:relative;
  background:linear-gradient(-45deg,#56ccf2,#5b8def,#6fcf97,#f2c94c,#4facfe);background-size:400% 400%;animation:bgmove 18s ease infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.1rem;opacity:.38;animation:floaty linear infinite;filter:drop-shadow(0 4px 6px rgba(20,50,90,.22))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0)}50%{transform:translateY(50vh) translateX(22px)}100%{transform:translateY(-15vh) translateX(-8px)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}
.topbar{text-align:center;background:rgba(255,255,255,.26);backdrop-filter:blur(12px);border:1.5px solid rgba(242,201,76,.7);border-radius:22px;padding:14px 16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(20,50,90,.22)}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(47,128,237,.65);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:0 2px 10px rgba(20,50,90,.35)}
.topbar p{font-size:.78rem;color:#fff;opacity:.97;margin-top:2px}
.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(30,70,120,.24);backdrop-filter:blur(10px);border-radius:30px;padding:5px;border:1.5px solid rgba(242,201,76,.5);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.45);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(20,50,90,.4)}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p4));color:#fff;font-weight:900;min-width:40px;height:40px;padding:0 8px;border-radius:14px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 6px 14px rgba(47,128,237,.4)}
.sec h2{color:#fff;font-size:1.0rem;font-weight:800;text-shadow:0 1px 6px rgba(20,50,90,.4);flex:1}
.card{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:20px;padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(242,201,76,.5);box-shadow:0 12px 26px rgba(20,50,90,.16)}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#f7b731);color:#7a5a00;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:linear-gradient(135deg,#fff,#eef6ff);border:2px solid rgba(47,128,237,.22);border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(47,128,237,.2),0 8px 14px rgba(20,50,90,.1);transition:transform .12s,box-shadow .12s;text-align:center;user-select:none}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(47,128,237,.28),0 0 18px rgba(242,201,76,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#27ae60);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;border:2px solid rgba(47,128,237,.35);background:#fff;outline:none;flex:1;min-width:190px;color:var(--ink)}
.tin:focus{border-color:var(--glow2);box-shadow:0 0 0 4px rgba(47,128,237,.18)}
.tin.ok{border-color:var(--green);background:#eafff3}.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.05rem;font-weight:800;color:var(--p1)}
.btn-check{font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--glow2),var(--p4));padding:11px 18px;border-radius:14px;box-shadow:0 5px 0 rgba(47,128,237,.4);transition:transform .1s}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(47,128,237,.4)}
.hint{font-size:.82rem;color:#2f6ac0;font-weight:600;margin-top:7px;font-style:italic}
.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{width:46px;height:46px;border-radius:14px;border:2px solid rgba(47,128,237,.3);background:linear-gradient(135deg,#fff,#eef6ff);font-weight:900;font-size:1.1rem;cursor:pointer;color:var(--p1);box-shadow:0 5px 0 rgba(47,128,237,.2);transition:transform .12s}
.lbtn:hover:not(.locked){transform:scale(1.08)}
.lbtn.sel{background:linear-gradient(135deg,var(--glow2),var(--p4));color:#fff}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#27ae60);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}.corrbox.show{display:block}
.exp{max-height:0;overflow:hidden;transition:max-height .5s,margin .3s,padding .3s;background:rgba(47,128,237,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2600px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(47,128,237,.3)}
.exp ol{margin:6px 0 2px 18px}.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#eaf3ff,#e9fff2);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#2f6ac0;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.stp{color:#1f7a55;font-weight:800}
.p-word{color:#2563eb;font-weight:800}.hl-green{color:#0a9d54;font-weight:900}.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(47,128,237,.15);color:#2f6ac0;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}
.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--glow2),var(--p4),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(47,128,237,.4);transition:transform .1s}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(47,128,237,.4)}
.mask{position:fixed;inset:0;background:rgba(20,45,80,.6);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:#fff;border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(20,45,80,.4);border:2px solid rgba(242,201,76,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#557;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(47,128,237,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:fb 2s ease-in-out infinite}
@keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p5),var(--p1));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(47,128,237,.4)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fff;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>
<div class="wrap">
  <div class="topbar">
    <div class="tag">🏘️ Giáo viên tạo: Ms. Chí Nên</div>
    <h1>🏙️ UNIT 4 · TEST 1</h1>
    <p>My Neighbourhood · English 6</p>
  </div>
  <div class="prog"><div class="txt" id="progtxt">0 / 39</div><div class="bar"><div class="fill" id="progfill"></div></div></div>
  <div id="quiz"></div>
  <div class="submit-wrap"><button class="btn-submit" onclick="openName()">🏆 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
  <div class="footer">✨ Made with love for young learners · Ms. Chí Nên ✨</div>
</div>
<div class="mask" id="nameMask"><div class="modal">

  <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
  <div class="warn" id="nameWarn"></div>

</div></div>
<div class="mask" id="resMask"><div class="modal">
  <h2 id="resGreet"></h2><div class="score-big" id="resScore"></div><div class="score-10" id="resScore10"></div>
  <img class="meme" id="resMeme" alt="meme" style="display:none"><div class="meme-fallback" id="resFallback"></div>
  <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
  <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
</div></div>
<script>
const DATA=[
/* ===== A.I PHONETICS ===== */
{sec:"I",head:"A. NGỮ ÂM — Chọn từ có phần gạch chân đọc khác các từ còn lại.",num:1,type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["r<u>ea</u>dy","ch<u>ea</u>p","t<u>ea</u>","<u>ea</u>sy"],answer:"r<u>ea</u>dy",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "ea" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>ready</span> <span class='p-phonetic'>/ˈredi/</span> = <span class='p-mean'>sẵn sàng → ea /e/</span></div>
 <div><span class='p-word'>cheap</span> <span class='p-phonetic'>/tʃiːp/</span> = <span class='p-mean'>rẻ → ea /iː/</span></div>
 <div><span class='p-word'>tea</span> <span class='p-phonetic'>/tiː/</span> = <span class='p-mean'>trà → ea /iː/</span></div>
 <div><span class='p-word'>easy</span> <span class='p-phonetic'>/ˈiːzi/</span> = <span class='p-mean'>dễ → ea /iː/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"ready" có "ea" đọc /e/ (âm e ngắn), khác ba từ kia đọc /iː/ (âm i dài).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>cheap, tea, easy đều /iː/ nên giống nhau.</span></li></ol>
 <div class="tip">🧠 Mẹo: "ea" thường đọc /iː/ (tea, sea, easy); một số ít đọc /e/ (ready, bread, head, heavy).</div>`},
{sec:"I",num:2,type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["n<u>a</u>rrow","b<u>a</u>nk","<u>a</u>long","m<u>a</u>p"],answer:"<u>a</u>long",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "a" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>narrow</span> <span class='p-phonetic'>/ˈnærəʊ/</span> = <span class='p-mean'>hẹp → a /æ/</span></div>
 <div><span class='p-word'>bank</span> <span class='p-phonetic'>/bæŋk/</span> = <span class='p-mean'>ngân hàng → a /æ/</span></div>
 <div><span class='hl-green'>along</span> <span class='p-phonetic'>/əˈlɒŋ/</span> = <span class='p-mean'>dọc theo → a /ə/</span></div>
 <div><span class='p-word'>map</span> <span class='p-phonetic'>/mæp/</span> = <span class='p-mean'>bản đồ → a /æ/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"along" có "a" ở âm không nhấn nên đọc nhẹ /ə/ (âm ơ mờ), khác ba từ kia đọc rõ /æ/.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>narrow, bank, map đều có "a" đọc /æ/.</span></li></ol>
 <div class="tip">🧠 Mẹo: nguyên âm ở âm KHÔNG nhấn thường "lười" thành /ə/ (along, about, again).</div>`},
{sec:"I",num:3,type:"mcq",
 q:"3. Choose the word whose underlined part is pronounced differently.",
 disp:["cro<u>ss</u>","bu<u>s</u>y","di<u>s</u>like","hou<u>s</u>e"],answer:"bu<u>s</u>y",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "s" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>cross</span> <span class='p-phonetic'>/krɒs/</span> = <span class='p-mean'>băng qua → s /s/</span></div>
 <div><span class='hl-green'>busy</span> <span class='p-phonetic'>/ˈbɪzi/</span> = <span class='p-mean'>bận rộn → s /z/</span></div>
 <div><span class='p-word'>dislike</span> <span class='p-phonetic'>/dɪsˈlaɪk/</span> = <span class='p-mean'>không thích → s /s/</span></div>
 <div><span class='p-word'>house</span> <span class='p-phonetic'>/haʊs/</span> = <span class='p-mean'>ngôi nhà → s /s/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"busy" có "s" đọc /z/ (rung), khác ba từ kia đọc /s/ (không rung).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>cross, dislike, house đều có "s" đọc /s/.</span></li></ol>
 <div class="tip">🧠 Mẹo: "s" giữa hai nguyên âm thường đọc /z/ (busy, easy, music).</div>`},
/* ===== A.II STRESS ===== */
{sec:"II",head:"A. TRỌNG ÂM — Chọn từ có trọng âm khác các từ còn lại.",num:4,type:"mcq",
 q:"4. Choose the word whose stress pattern is different.",
 disp:["advice","result","office","around"],answer:"office",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có trọng âm rơi khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>advice</span> <span class='p-phonetic'>/ədˈvaɪs/</span> = <span class='p-mean'>lời khuyên → âm 2</span></div>
 <div><span class='p-word'>result</span> <span class='p-phonetic'>/rɪˈzʌlt/</span> = <span class='p-mean'>kết quả → âm 2</span></div>
 <div><span class='hl-green'>office</span> <span class='p-phonetic'>/ˈɒfɪs/</span> = <span class='p-mean'>văn phòng → âm 1</span></div>
 <div><span class='p-word'>around</span> <span class='p-phonetic'>/əˈraʊnd/</span> = <span class='p-mean'>xung quanh → âm 2</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"OF-fice" nhấn âm tiết ĐẦU, ba từ kia nhấn âm tiết thứ HAI.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>advice, result, around đều nhấn âm 2.</span></li></ol>`},
{sec:"II",num:5,type:"mcq",
 q:"5. Choose the word whose stress pattern is different.",
 disp:["gallery","cinema","factory","cathedral"],answer:"cathedral",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có trọng âm khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>gallery</span> <span class='p-phonetic'>/ˈɡæləri/</span> = <span class='p-mean'>phòng trưng bày → âm 1</span></div>
 <div><span class='p-word'>cinema</span> <span class='p-phonetic'>/ˈsɪnəmə/</span> = <span class='p-mean'>rạp phim → âm 1</span></div>
 <div><span class='p-word'>factory</span> <span class='p-phonetic'>/ˈfæktəri/</span> = <span class='p-mean'>nhà máy → âm 1</span></div>
 <div><span class='hl-green'>cathedral</span> <span class='p-phonetic'>/kəˈθiːdrəl/</span> = <span class='p-mean'>nhà thờ lớn → âm 2</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"ca-THE-dral" nhấn âm tiết thứ HAI, ba từ kia nhấn âm tiết ĐẦU.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>gallery, cinema, factory đều nhấn âm 1.</span></li></ol>`},
/* ===== A.III MCQ ===== */
{sec:"III",head:"A. CHỌN ĐÁP ÁN — Chọn từ/cụm từ thích hợp nhất.",num:6,type:"mcq",
 q:"6. Go ______ the street for about 100 metres and the post office is on your left.",
 disp:["into","between","along","out of"],answer:"along",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Đi dọc theo con đường khoảng 100 mét và bưu điện nằm bên trái bạn.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>into</span> = <span class='p-mean'>vào trong</span></div><div><span class='p-word'>between</span> = <span class='p-mean'>giữa</span></div>
 <div><span class='hl-green'>along</span> = <span class='p-mean'>dọc theo</span></div><div><span class='p-word'>out of</span> = <span class='p-mean'>ra khỏi</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Chỉ đường "đi DỌC THEO con đường" → "go along the street".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>into/between/out of không hợp với "đi bộ dọc theo đường để đến bưu điện".</span></li></ol>
 <div class="tip">🧠 Chỉ đường: go along/down/up the street; turn left/right; go straight.</div>`},
{sec:"III",num:7,type:"mcq",
 q:"7. They took the wrong ______ at the crossroad and got lost.",
 disp:["corner","turning","traffic","building"],answer:"turning",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Họ rẽ nhầm chỗ ở ngã tư và bị lạc.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>corner</span> = <span class='p-mean'>góc</span></div><div><span class='hl-green'>turning</span> = <span class='p-mean'>chỗ rẽ, lối rẽ</span></div>
 <div><span class='p-word'>traffic</span> = <span class='p-mean'>giao thông</span></div><div><span class='p-word'>building</span> = <span class='p-mean'>tòa nhà</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"take the wrong turning" = rẽ nhầm lối → bị lạc. Cụm cố định chỉ chỗ rẽ.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>corner/traffic/building không tạo cụm "take the wrong ..." theo nghĩa rẽ nhầm đường.</span></li></ol>
 <div class="tip">🧠 Nhớ: take the first/second/wrong TURNING = rẽ ở lối thứ nhất/hai/nhầm.</div>`},
{sec:"III",num:8,type:"mcq",
 q:"8. The bus is always ______ in the morning when lots of people go to school or work.",
 disp:["modern","beautiful","cheap","crowded"],answer:"crowded",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Xe buýt luôn đông đúc vào buổi sáng khi nhiều người đi học hoặc đi làm.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>modern</span> = <span class='p-mean'>hiện đại</span></div><div><span class='p-word'>beautiful</span> = <span class='p-mean'>đẹp</span></div>
 <div><span class='p-word'>cheap</span> = <span class='p-mean'>rẻ</span></div><div><span class='hl-green'>crowded</span> = <span class='p-mean'>đông đúc</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"nhiều người đi học/đi làm buổi sáng" → xe buýt "crowded" (đông đúc) là hợp nhất.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>modern/beautiful/cheap không liên quan đến việc "nhiều người" khiến xe đông.</span></li></ol>`},
{sec:"III",num:9,type:"mcq",
 q:"9. The city centre is often ______ the suburbs.",
 disp:["noisy than","noisier","more noisy","noisier than"],answer:"noisier than",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Trung tâm thành phố thường ồn ào hơn vùng ngoại ô.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>noisy than</span> = <span class='p-mean'>thiếu "-er" (sai)</span></div><div><span class='p-word'>noisier</span> = <span class='p-mean'>thiếu "than" (sai)</span></div>
 <div><span class='p-word'>more noisy</span> = <span class='p-mean'>sai (noisy dùng -er, không "more")</span></div><div><span class='hl-green'>noisier than</span> = <span class='p-mean'>ồn ào hơn ✔</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>So sánh hơn của "noisy" (2 âm tiết tận cùng -y) là "noisier", và có vế so sánh nên cần "than" → "noisier than".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>"noisy than" thiếu -er; "noisier" thiếu than; "more noisy" sai (tính từ -y đổi thành -ier, không dùng "more").</span></li></ol>
 <div class="tip">🧠 Nhớ: tính từ -y → bỏ y thêm -ier + than (happy→happier, noisy→noisier, easy→easier).</div>`},
{sec:"III",num:10,type:"mcq",
 q:"10. Josh ______ exercise at the gym near his flat every day after work.",
 disp:["do","does","is doing","are doing"],answer:"does",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Josh tập thể dục ở phòng gym gần căn hộ mỗi ngày sau giờ làm.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>do</span> = <span class='p-mean'>(chủ ngữ số ít không dùng)</span></div><div><span class='hl-green'>does</span> = <span class='p-mean'>hiện tại đơn, He/She/It</span></div>
 <div><span class='p-word'>is doing</span> = <span class='p-mean'>tiếp diễn (sai)</span></div><div><span class='p-word'>are doing</span> = <span class='p-mean'>tiếp diễn số nhiều (sai)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Dấu hiệu "every day" (mỗi ngày – thói quen) → hiện tại đơn. Chủ ngữ "Josh" (số ít) → "does exercise".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>"do" dùng cho I/you/we/they; "is/are doing" là tiếp diễn (không hợp "every day").</span></li></ol>
 <div class="tip">🧠 Nhớ: every day/always/usually → hiện tại đơn. He/She/It + V-s/es (does).</div>`},
{sec:"III",num:11,type:"mcq",
 q:"11. We're going by train, so let's meet in front of the ______.",
 disp:["art gallery","temple","railway station","library"],answer:"railway station",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chúng ta đi bằng tàu hỏa, nên hãy gặp nhau trước ga tàu.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>art gallery</span> = <span class='p-mean'>phòng tranh</span></div><div><span class='p-word'>temple</span> = <span class='p-mean'>ngôi đền</span></div>
 <div><span class='hl-green'>railway station</span> = <span class='p-mean'>ga tàu hỏa</span></div><div><span class='p-word'>library</span> = <span class='p-mean'>thư viện</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"đi bằng tàu hỏa" (by train) → hẹn gặp ở "railway station" (ga tàu) là hợp logic.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>art gallery/temple/library không phải nơi đi tàu.</span></li></ol>`},
{sec:"III",num:12,type:"mcq",
 q:"12. I ______ living near the city centre because it's too noisy.",
 disp:["start","like","dislike","enjoy"],answer:"dislike",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Tôi không thích sống gần trung tâm thành phố vì nó quá ồn ào.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>start</span> = <span class='p-mean'>bắt đầu</span></div><div><span class='p-word'>like</span> = <span class='p-mean'>thích</span></div>
 <div><span class='hl-green'>dislike</span> = <span class='p-mean'>không thích</span></div><div><span class='p-word'>enjoy</span> = <span class='p-mean'>tận hưởng</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Lý do "vì quá ồn ào" (tiêu cực) → phải là "dislike" (không thích) mới hợp logic.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>like/enjoy (thích) trái với lý do "quá ồn ào"; start không hợp nghĩa.</span></li></ol>
 <div class="tip">🧠 Nhớ: like/dislike/enjoy/start + V-ing (dislike living...).</div>`},
{sec:"III",num:13,type:"mcq",
 q:"13. My new neighbourhood is ______ than my old one.",
 disp:["more peaceful","peaceful","much peaceful","very peaceful"],answer:"more peaceful",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Khu phố mới của tôi yên bình hơn khu cũ.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>more peaceful</span> = <span class='p-mean'>yên bình hơn (so sánh hơn) ✔</span></div><div><span class='p-word'>peaceful</span> = <span class='p-mean'>yên bình (không so sánh)</span></div>
 <div><span class='p-word'>much peaceful</span> = <span class='p-mean'>sai (thiếu "more")</span></div><div><span class='p-word'>very peaceful</span> = <span class='p-mean'>rất yên bình (không so sánh)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Có "than" → so sánh hơn. "peaceful" là tính từ DÀI (3 âm tiết) → dùng "more + adj + than" → "more peaceful than".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>peaceful/very peaceful không phải dạng so sánh; "much peaceful" thiếu "more".</span></li></ol>
 <div class="tip">🧠 Nhớ: tính từ DÀI (≥3 âm tiết) → more + adj + than (more peaceful, more modern, more expensive).</div>`},
{sec:"III",num:14,type:"mcq",
 q:"14. The air in the countryside is fresher because there ______ much traffic.",
 disp:["is","are","isn't","aren't"],answer:"isn't",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Không khí ở nông thôn trong lành hơn vì không có nhiều xe cộ.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>is</span> = <span class='p-mean'>có (khẳng định – sai logic)</span></div><div><span class='p-word'>are</span> = <span class='p-mean'>có, số nhiều</span></div>
 <div><span class='hl-green'>isn't</span> = <span class='p-mean'>không có (số ít/không đếm được)</span></div><div><span class='p-word'>aren't</span> = <span class='p-mean'>không có, số nhiều</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Không khí trong lành hơn VÌ ÍT xe → "there ISN'T much traffic". "traffic" là danh từ KHÔNG đếm được → dùng "is/isn't" (số ít).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>"is" (khẳng định) trái logic "trong lành hơn"; are/aren't dùng cho số nhiều, nhưng traffic không đếm được.</span></li></ol>
 <div class="tip">🧠 Nhớ: traffic/water/money... không đếm được → there IS/ISN'T much + N.</div>`},
{sec:"III",num:15,type:"mcq",
 q:"15. ______ one would you like for lunch, chicken sandwiches or burgers?",
 disp:["What","Which","Whose","Where"],answer:"Which",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Bạn muốn ăn món nào cho bữa trưa, bánh mì kẹp gà hay burger?</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>What</span> = <span class='p-mean'>cái gì (lựa chọn mở)</span></div><div><span class='hl-green'>Which</span> = <span class='p-mean'>cái nào (lựa chọn giới hạn)</span></div>
 <div><span class='p-word'>Whose</span> = <span class='p-mean'>của ai</span></div><div><span class='p-word'>Where</span> = <span class='p-mean'>ở đâu</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Có 2 lựa chọn cụ thể (chicken sandwiches OR burgers) → dùng "Which one" (cái nào trong số đã cho).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>"What" hỏi khi KHÔNG giới hạn lựa chọn; Whose (của ai), Where (ở đâu) lạc nghĩa.</span></li></ol>
 <div class="tip">🧠 Nhớ: Which + one (chọn trong số ít đã nêu: A or B?); What (lựa chọn không giới hạn).</div>`},
{sec:"III",num:16,type:"mcq",
 q:"16. Cars cannot go into this street because it is too ______.",
 disp:["narrow","peaceful","clean","noisy"],answer:"narrow",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Ô tô không thể đi vào con đường này vì nó quá hẹp.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>narrow</span> = <span class='p-mean'>hẹp</span></div><div><span class='p-word'>peaceful</span> = <span class='p-mean'>yên bình</span></div>
 <div><span class='p-word'>clean</span> = <span class='p-mean'>sạch sẽ</span></div><div><span class='p-word'>noisy</span> = <span class='p-mean'>ồn ào</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Ô tô không vào được vì đường "too narrow" (quá HẸP) là lý do hợp lý nhất.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>peaceful/clean/noisy không phải lý do khiến ô tô "không thể đi vào".</span></li></ol>`},
{sec:"III",num:17,type:"mcq",
 q:'17. Calvin: "Excuse me. Can you tell me the way to the park?" – Vicky: "______"',
 disp:["It's called Greentree Park.","Yes, there is a park.","That's a great idea.","Turn left, then go straight."],answer:"Turn left, then go straight.",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Calvin: "Xin lỗi. Bạn chỉ đường đến công viên giúp mình được không?" – Vicky: "Rẽ trái, rồi đi thẳng."</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="gcol">
 <div><span class='p-word'>A.</span> <span class='p-mean'>Nó tên là công viên Greentree. (lạc – hỏi TÊN)</span></div>
 <div><span class='p-word'>B.</span> <span class='p-mean'>Vâng, có một công viên. (không chỉ đường)</span></div>
 <div><span class='p-word'>C.</span> <span class='p-mean'>Đó là ý hay. (lạc)</span></div>
 <div><span class='hl-green'>D.</span> <span class='p-mean'>Rẽ trái, rồi đi thẳng. ✔ (chỉ đường)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Calvin HỎI ĐƯỜNG ("the way to the park") → phải trả lời bằng câu CHỈ ĐƯỜNG → "Turn left, then go straight."</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>A nói về tên, B xác nhận có công viên, C khen ý tưởng — đều không chỉ đường.</span></li></ol>`},
/* ===== A.IV ERROR ===== */
{sec:"IV",head:"A. TÌM LỖI SAI — Bấm chữ cái chứa lỗi, rồi gõ từ SỬA ĐÚNG.",num:18,type:"error",
 q:"18. Henry's <u>little sister</u> is <u>much</u> <u>short</u> than <u>he is</u>.",
 parts:["little sister","much","short","he is"],correctLetter:2,corrAccept:["shorter"],
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Em gái của Henry thấp hơn nhiều so với cậu ấy.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Lỗi:</span> ở <b>C. short</b> → sửa thành <span class='hl-green'>shorter</span>.</li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Có "than" → so sánh HƠN. "short" (tính từ ngắn) phải thành "shorter". "much" đứng trước để nhấn "hơn nhiều" (much shorter than).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>little sister (em gái nhỏ – đúng), much (bổ nghĩa so sánh – đúng), he is (đúng). Chỉ "short" thiếu "-er".</span></li></ol>
 <div class="tip">🧠 Nhớ: much/far + so sánh hơn (much shorter, far bigger).</div>`},
{sec:"IV",num:19,type:"error",
 q:"19. Take <u>the third</u> turning <u>in</u> your right, <u>then</u> keep <u>straight</u>.",
 parts:["the third","in","then","straight"],correctLetter:1,corrAccept:["on"],
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Rẽ ở lối thứ ba bên phải bạn, rồi cứ đi thẳng.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Lỗi:</span> ở <b>B. in</b> → sửa thành <span class='hl-green'>on</span>.</li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"bên phải/bên trái của bạn" dùng "ON your right/left" (không phải "in"). → "on your right".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>the third turning (lối rẽ thứ ba – đúng), then (rồi – đúng), keep straight (đi thẳng – đúng). Chỉ "in" sai.</span></li></ol>
 <div class="tip">🧠 Nhớ: ON your right/left (bên phải/trái của bạn).</div>`},
{sec:"IV",num:20,type:"error",
 q:"20. <u>At</u> Christmas, <u>peoples</u> decorate the cathedral with <u>beautiful</u> <u>lights</u>.",
 parts:["At","peoples","beautiful","lights"],correctLetter:1,corrAccept:["people"],
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Vào dịp Giáng sinh, người ta trang trí nhà thờ lớn bằng những ánh đèn đẹp đẽ.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Lỗi:</span> ở <b>B. peoples</b> → sửa thành <span class='hl-green'>people</span>.</li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"people" (con người) ĐÃ là số nhiều, không thêm "-s". → "people decorate".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>At Christmas (vào dịp Giáng sinh – đúng), beautiful (đẹp – đúng), lights (đèn – đúng). Chỉ "peoples" sai.</span></li></ol>
 <div class="tip">🧠 Nhớ: "people" đã là số nhiều (không "peoples"). Tương tự: children, men, women.</div>`},
/* ===== A.V VERB FORM ===== */
{sec:"V",head:"A. CHIA ĐỘNG TỪ — Chia đúng dạng động từ trong ngoặc. (Gõ vào ô)",num:21,type:"fill",
 q:"21. I ______ (look) for the art gallery on the map, but I can't see it.",
 accept:["am looking","im looking"],hint:"Đang tìm ngay lúc này → hiện tại tiếp diễn (am + V-ing)",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Tôi đang tìm phòng tranh trên bản đồ, nhưng không thấy nó.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> hành động đang diễn ra NGAY LÚC NÓI.</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>am looking</span>. <span class='p-grammar'>Chủ ngữ "I" + hiện tại tiếp diễn → "am + looking". "I am looking for..." = tôi đang tìm.</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> "but I can't see it (now)" cho thấy đang tìm ngay lúc này.</li></ol>
 <div class="tip">🧠 Hiện tại tiếp diễn: am/is/are + V-ing (việc đang xảy ra bây giờ).</div>`},
{sec:"V",num:22,type:"fill",
 q:"22. This bus ______ (always / not arrive) on time.",
 accept:["doesnt always arrive","does not always arrive"],hint:"Thói quen phủ định + 'always': doesn't + always + V (VD: doesn't always arrive)",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chiếc xe buýt này không phải lúc nào cũng đến đúng giờ.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> thói quen (hiện tại đơn) + phủ định + trạng từ "always".</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>doesn't always arrive</span>. <span class='p-grammar'>Chủ ngữ "This bus" (số ít) → doesn't; "always" đứng giữa "doesn't" và động từ chính "arrive".</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> vị trí trạng từ tần suất: S + don't/doesn't + always + V.</li></ol>
 <div class="tip">🧠 Nhớ: doesn't always = không phải lúc nào cũng (trạng từ tần suất đặt sau trợ động từ).</div>`},
{sec:"V",num:23,type:"fill",
 q:'23. "What ______ your little brother ______ (draw)?" – "I think it\'s a plane."',
 accept:["is drawing"],hint:"Đang vẽ ngay lúc này → is + V-ing. Gõ 2 từ: VD 'is drawing'",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: "Em trai của bạn đang vẽ gì thế?" – "Mình nghĩ đó là một chiếc máy bay."</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> câu hỏi hiện tại tiếp diễn (đang vẽ ngay lúc này).</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> What <span class='hl-green'>is</span> your little brother <span class='hl-green'>drawing</span>? <span class='p-grammar'>Chủ ngữ "your little brother" (số ít) → "is"; động từ chính thêm -ing → "drawing".</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> câu hỏi tiếp diễn: Wh- + is/are + S + V-ing?</li></ol>
 <div class="tip">🧠 Nhớ: What is he doing? (đang làm gì ngay lúc này).</div>`},
{sec:"V",num:24,type:"fill",
 q:"24. My dad and my uncle ______ (fix) the swing in the garden right now.",
 accept:["are fixing"],hint:"'right now' → hiện tại tiếp diễn; chủ ngữ số nhiều → are + V-ing",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Bố và chú của tôi đang sửa cái xích đu trong vườn ngay bây giờ.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> "right now" → hiện tại tiếp diễn.</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>are fixing</span>. <span class='p-grammar'>Chủ ngữ "My dad and my uncle" (SỐ NHIỀU) → "are"; động từ + -ing → "fixing".</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> "right now / at the moment" là dấu hiệu của hiện tại tiếp diễn.</li></ol>
 <div class="tip">🧠 Nhớ: two people (A and B) → chủ ngữ số nhiều → are + V-ing.</div>`},
{sec:"V",num:25,type:"fill",
 q:"25. Let's ______ (meet) at the library and ______ (study) together.",
 accept:["meet study","meet and study"],hint:"Sau 'Let's' dùng động từ NGUYÊN MẪU. Gõ 2 động từ: VD 'meet study'",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chúng ta hãy gặp nhau ở thư viện và học cùng nhau nhé.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> cấu trúc "Let's + động từ nguyên mẫu".</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> Let's <span class='hl-green'>meet</span> ... and <span class='hl-green'>study</span>. <span class='p-grammar'>Sau "Let's" dùng động từ nguyên mẫu KHÔNG chia → "meet" và "study".</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> "Let's + V (bare)" = hãy cùng làm gì.</li></ol>
 <div class="tip">🧠 Nhớ: Let's + V nguyên mẫu (Let's go, Let's meet and study).</div>`},
/* ===== A.VI WORD FORM ===== */
{sec:"VI",head:"A. CHIA DẠNG TỪ — Chia đúng dạng của từ trong ngoặc. (Gõ vào ô)",num:26,type:"fill",
 q:"26. Every weekend night, the city square becomes ______ with lots of outdoor events. (live)",
 accept:["lively"],hint:"sau 'becomes' cần TÍNH TỪ → live đổi thành tính từ",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Mỗi tối cuối tuần, quảng trường thành phố trở nên sôi động với nhiều sự kiện ngoài trời.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> sau động từ nối "becomes" cần TÍNH TỪ.</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>lively</span> (tính từ). <span class='p-grammar'>"become lively" = trở nên sôi động, náo nhiệt.</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> đừng nhầm "lively" (adj: sôi động) với "live" (v: sống / adj: trực tiếp).</li></ol>
 <div class="tip">🧠 Sau become/get/be + TÍNH TỪ (become lively/famous/crowded).</div>`},
{sec:"VI",num:27,type:"fill",
 q:"27. That book is so ______. I fall asleep every time I read it. (bore)",
 accept:["boring"],hint:"so + TÍNH TỪ; tả VẬT gây chán → đuôi -ing",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Cuốn sách đó chán đến mức tôi ngủ gật mỗi lần đọc nó.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> "so + TÍNH TỪ"; tả tính chất của VẬT (cuốn sách).</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>boring</span> (tính từ đuôi -ing). <span class='p-grammar'>"boring" tả VẬT gây chán (cuốn sách nhàm chán). "so boring" = chán đến mức...</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> -ing tả VẬT (boring book); -ed tả NGƯỜI (I am bored).</li></ol>
 <div class="tip">🧠 Nhớ: interesting/boring/exciting (tả vật) ≠ interested/bored/excited (tả người).</div>`},
{sec:"VI",num:28,type:"fill",
 q:"28. Can you give me the ______ to the nearest bus station? (direct)",
 accept:["directions"],hint:"sau 'the' cần DANH TỪ; chỉ đường (số nhiều) → directions",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Bạn chỉ đường đến bến xe buýt gần nhất giúp tôi được không?</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> sau "the" cần DANH TỪ.</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>directions</span> (danh từ, số nhiều). <span class='p-grammar'>"give sb directions" = chỉ đường cho ai (thường ở số nhiều "directions").</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> direct (v/adj) → direction(s) (n: phương hướng, lời chỉ đường).</li></ol>
 <div class="tip">🧠 Nhớ: give/ask for directions = chỉ đường / hỏi đường.</div>`},
{sec:"VI",num:29,type:"fill",
 q:"29. The Crazy House Hotel is a ______ building in Da Lat. (fame)",
 accept:["famous"],hint:"trước danh từ 'building' cần TÍNH TỪ → fame đổi thành tính từ",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Khách sạn Crazy House là một tòa nhà nổi tiếng ở Đà Lạt.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> trước danh từ "building" cần TÍNH TỪ.</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>famous</span> (tính từ). <span class='p-grammar'>"famous building" = tòa nhà nổi tiếng. Danh từ "fame" → tính từ "famous".</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> fame (n: danh tiếng) → famous (adj: nổi tiếng).</li></ol>
 <div class="tip">🧠 Nhớ: be famous FOR sth = nổi tiếng vì cái gì.</div>`},
{sec:"VI",num:30,type:"fill",
 q:"30. ______, we found a good café after walking for hours. (final)",
 accept:["finally"],hint:"đứng đầu câu bổ nghĩa cả câu → TRẠNG TỪ (đuôi -ly)",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Cuối cùng, chúng tôi cũng tìm được một quán cà phê ngon sau nhiều giờ đi bộ.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> từ đứng đầu câu (có dấu phẩy) bổ nghĩa cả câu → TRẠNG TỪ.</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>Finally</span> (trạng từ). <span class='p-grammar'>"Finally, ..." = Cuối cùng thì... (trạng từ chỉ trình tự, đứng đầu câu).</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> final (adj) → finally (adv).</li></ol>
 <div class="tip">🧠 Nhớ: First, ... Then, ... Finally, ... (các trạng từ chỉ trình tự đứng đầu câu).</div>`},
/* ===== C.I MAKE QUESTION ===== */
{sec:"①",head:"C. VIẾT (I) — Đặt câu hỏi cho phần gạch chân. (Gõ cả câu hỏi vào ô)",num:42,type:"rearrange",
 q:"42. <u>Yes</u>, the streets in my neighbourhood are clean.",
 accept:["are the streets in your neighbourhood clean","are the streets in your neighborhood clean"],
 hint:"Gạch chân 'Yes' → câu hỏi Yes/No (bắt đầu bằng Are...). Nhớ đổi 'my' → 'your'.",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Vâng, những con đường ở khu phố của tôi sạch sẽ.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> gạch chân "Yes" → cần câu hỏi Yes/No.</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>Are the streets in your neighbourhood clean?</span> <span class='p-grammar'>Đưa động từ "are" lên đầu; đổi "my" → "your".</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> câu hỏi Yes/No với "to be": Are/Is + S + ...?</li></ol>
 <div class="tip">🧠 Nhớ đổi đại từ: my → your, I → you khi đặt câu hỏi cho người khác.</div>`},
{sec:"①",num:43,type:"rearrange",
 q:"43. The cinema is <u>in Pine Street</u>.",
 accept:["where is the cinema"],
 hint:"Gạch chân chỉ ĐỊA ĐIỂM (in Pine Street) → hỏi bằng 'Where'.",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Rạp chiếu phim nằm ở phố Pine.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> gạch chân "in Pine Street" chỉ NƠI CHỐN → hỏi "Where".</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>Where is the cinema?</span> <span class='p-grammar'>Where + is + chủ ngữ (the cinema)?</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> hỏi nơi chốn → Where; hỏi thời gian → When.</li></ol>
 <div class="tip">🧠 Nhớ: Where is/are + S? (hỏi vị trí).</div>`},
{sec:"①",num:44,type:"rearrange",
 q:"44. There are <u>three</u> corner shops near Josh's flat.",
 accept:["how many corner shops are there near joshs flat","how many corner shops are there near josh's flat"],
 hint:"Gạch chân SỐ LƯỢNG (three) → hỏi 'How many + N + are there...?'",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Có ba cửa hàng ở góc phố gần căn hộ của Josh.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> gạch chân "three" (số lượng) → hỏi "How many".</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>How many corner shops are there near Josh's flat?</span> <span class='p-grammar'>How many + danh từ số nhiều (corner shops) + are there + ...?</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> "There are X..." → "How many ... are there?"</li></ol>
 <div class="tip">🧠 Nhớ: How many + N (số nhiều) + are there? (hỏi số lượng).</div>`},
/* ===== C.II MAKE SENTENCE ===== */
{sec:"②",head:"C. VIẾT (II) — Viết câu hoàn chỉnh từ gợi ý. (Gõ cả câu vào ô)",num:45,type:"rearrange",
 q:"45. The black bike / expensive / than / the yellow bike / .",
 accept:["the black bike is more expensive than the yellow bike"],
 hint:"So sánh hơn tính từ DÀI: is + more + expensive + than.",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chiếc xe đạp màu đen đắt hơn chiếc xe đạp màu vàng.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> so sánh hơn với "than"; "expensive" là tính từ dài.</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>The black bike is more expensive than the yellow bike.</span> <span class='p-grammar'>Thêm "is", "more ... than": more expensive than.</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> tính từ dài → more + adj + than.</li></ol>
 <div class="tip">🧠 Nhớ: expensive/beautiful/modern → more + adj + than.</div>`},
{sec:"②",num:46,type:"rearrange",
 q:"46. Da Nang City / have / beautiful beaches / delicious food / .",
 accept:["da nang city has beautiful beaches and delicious food"],
 hint:"Chủ ngữ số ít → have đổi thành 'has'; nối 2 danh từ bằng 'and'.",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Thành phố Đà Nẵng có những bãi biển đẹp và đồ ăn ngon.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> hiện tại đơn, chủ ngữ số ít + liệt kê 2 danh từ.</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>Da Nang City has beautiful beaches and delicious food.</span> <span class='p-grammar'>"Da Nang City" (số ít) → "has"; nối "beautiful beaches" và "delicious food" bằng "and".</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> He/She/It/tên riêng số ít → have đổi thành "has".</li></ol>
 <div class="tip">🧠 Nhớ: nối hai danh từ cùng vai trò bằng "and".</div>`},
{sec:"②",num:47,type:"rearrange",
 q:"47. Summer this year / hot / than / last year / ?",
 accept:["is summer this year hotter than last year"],
 hint:"Câu hỏi so sánh hơn tính từ NGẮN: Is ... hotter than ...? (hot → hotter, gấp đôi 't')",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Mùa hè năm nay có nóng hơn năm ngoái không?</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> câu hỏi so sánh hơn; "hot" là tính từ ngắn (gấp đôi phụ âm cuối).</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> <span class='hl-green'>Is summer this year hotter than last year?</span> <span class='p-grammar'>Đưa "Is" lên đầu (câu hỏi); "hot" → "hotter" (gấp đôi "t" + er).</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> tính từ ngắn tận cùng phụ âm-nguyên âm-phụ âm → gấp đôi phụ âm (hot→hotter, big→bigger).</li></ol>
 <div class="tip">🧠 Nhớ: hot→hotter, big→bigger, thin→thinner (gấp đôi phụ âm cuối).</div>`},
/* ===== C.III REWRITE ===== */
{sec:"③",head:"C. VIẾT (III) — Viết lại câu, nghĩa KHÔNG đổi. (Chỉ gõ TIẾP phần sau gợi ý — không cần gõ lại chữ đã cho; gõ cả câu cũng được, chấm linh hoạt.)",num:48,type:"rewrite",
 q:"48. My hometown is quieter than the city.",
 prefix:"The city is",
 accept:["noisier than my hometown","louder than my hometown"],
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Quê tôi yên tĩnh hơn thành phố. → Thành phố ồn ào hơn quê tôi.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> đảo so sánh (quieter ⇄ noisier).</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> The city is <span class='hl-green'>noisier than my hometown.</span> <span class='p-grammar'>"Quê YÊN TĨNH hơn thành phố" ⇔ "Thành phố ỒN ÀO hơn quê". quiet → noisy → noisier than.</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> đảo chủ ngữ thì đổi tính từ sang nghĩa ngược (quieter ⇄ noisier).</li></ol>
 <div class="tip">🧠 Nhớ: "A quieter than B" ⇔ "B noisier than A".</div>`},
{sec:"③",num:49,type:"rewrite",
 q:"49. Our school is near the Central Post Office.",
 prefix:"Our school isn't",
 accept:["far from the central post office"],
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Trường chúng tôi ở gần Bưu điện Trung tâm. → Trường chúng tôi không xa Bưu điện Trung tâm.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> "near" (gần) ⇔ "not far from" (không xa).</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> Our school isn't <span class='hl-green'>far from the Central Post Office.</span> <span class='p-grammar'>"near X" = "not far from X". Dùng "isn't far from".</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> near ⇔ not far from (đều nghĩa "ở gần").</li></ol>
 <div class="tip">🧠 Nhớ: be near = không ở xa = isn't far from.</div>`},
{sec:"③",num:50,type:"rewrite",
 q:"50. Let's ride the roller coaster first.",
 prefix:"Shall",
 accept:["we ride the roller coaster first"],
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chúng ta hãy chơi tàu lượn siêu tốc trước nhé. → Chúng ta chơi tàu lượn trước nhé?</div>
 <ol><li><span class="stp">🔹 Bước 2 – Kiến thức:</span> "Let's + V" ⇔ "Shall we + V?".</li>
 <li><span class="stp">🔹 Bước 3 – Đáp án:</span> Shall <span class='hl-green'>we ride the roller coaster first?</span> <span class='p-grammar'>Câu rủ "Let's ride..." đổi thành "Shall we ride...?" (giữ nguyên phần sau).</span></li>
 <li><span class="stp">🔹 Bước 4 – Mẹo:</span> Let's + V ⇔ Shall we + V? (đều là lời rủ/đề nghị).</li></ol>
 <div class="tip">🧠 Nhớ: Let's go! = Shall we go? (rủ cùng làm gì).</div>`}
];

/* ===== AUDIO ===== */
let AC;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function ding(){const c=ac(),n=c.currentTime;[880,1320,1760].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,n+i*.08);g.gain.linearRampToValueAtTime(.25,n+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.4);o.start(n+i*.08);o.stop(n+i*.08+.42)})}
function buzz(){const c=ac(),n=c.currentTime;[300,220,160].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,n+i*.13);g.gain.exponentialRampToValueAtTime(.001,n+i*.13+.12);o.start(n+i*.13);o.stop(n+i*.13+.13)})}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d'),cols=['#f2c94c','#2f80ed','#27ae60','#00D26A','#56ccf2','#6fcf97'],P=[];for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});let t=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);t++;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore()});if(t<130)requestAnimationFrame(loop);else cv.remove()})()}

/* ===== HELPERS ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return(s||'').toLowerCase().replace(/won['’]t/g,'will not').replace(/can['’]t/g,'can not').replace(/n['’]t/g,' not').replace(/['’]/g,'').replace(/[.,!?;:"…\/–-]/g,' ').replace(/\s+/g,' ').trim()}
const state={};let answered=0;const TOTAL=DATA.length;
function updateProg(){document.getElementById('progtxt').textContent=answered+' / '+TOTAL;document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%'}

/* ===== RENDER ===== */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){const s=document.createElement('div');s.className='sec';s.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;quiz.appendChild(s)}
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  const zone=document.createElement('div');card.appendChild(zone);
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=it.exp;card.appendChild(exp);
  quiz.appendChild(card);
  if(it.type==='mcq')renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange')renderFill(it,idx,zone,exp);
  else if(it.type==='rewrite')renderRewrite(it,idx,zone,exp);
  else if(it.type==='error')renderError(it,idx,zone,exp);
});
updateProg();
function markDone(idx,ok){if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg()}}
function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div');wrap.className='opts';
  shuffle(it.disp).forEach(txt=>{
    const b=document.createElement('div');b.className='opt';b.innerHTML=txt;
    b.onclick=()=>{if(state[idx])return;const all=wrap.querySelectorAll('.opt');all.forEach(x=>x.classList.add('locked'));
      if(txt===it.answer){b.classList.add('correct');ding();confetti();markDone(idx,true)}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim')});setTimeout(()=>b.classList.remove('shake'),450)}
      exp.classList.add('open')};
    wrap.appendChild(b)});
  zone.appendChild(wrap);
}
function renderFill(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  const acc=it.accept.map(norm);
  function check(){if(state[idx])return;const ok=acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderRewrite(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const pre=document.createElement('span');pre.className='prefix';pre.textContent=it.prefix+' ...';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Gõ tiếp phần còn lại...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(pre);row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  const contN=it.accept.map(norm),preN=norm(it.prefix),fullN=it.accept.map(a=>norm(it.prefix+' '+a));
  function check(){if(state[idx])return;let inN=norm(inp.value),stripped=inN;
    if(inN.startsWith(preN+' '))stripped=inN.slice(preN.length).trim();else if(inN===preN)stripped='';
    const ok=contN.includes(inN)||contN.includes(stripped)||fullN.includes(inN);inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderError(it,idx,zone,exp){
  const q=document.createElement('div');q.className='err-parts';let lb=it.q.replace(/^\d+\.\s*/,'');let li=0;const L=['A','B','C','D'];
  lb=lb.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);q.innerHTML=lb;zone.appendChild(q);
  const letters=document.createElement('div');letters.className='letters';
  const corr=document.createElement('div');corr.className='corrbox';const acc=it.corrAccept.map(norm);let chosen=null;
  L.forEach((lab,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=lab;
    b.onclick=()=>{if(state[idx])return;letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');chosen=i;corr.classList.add('show');corr.querySelector('input').focus()};letters.appendChild(b)});
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div>`;
  zone.appendChild(corr);const inp=corr.querySelector('input'),btn=corr.querySelector('button');
  function check(){if(state[idx])return;if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return}
    const ok=(chosen===it.correctLetter)&&acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel')});letters.children[it.correctLetter].classList.add('correct');if(chosen!==it.correctLetter)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
/* ===== SUBMIT ===== */
function openName(){document.getElementById('nameMask').classList.add('show');setTimeout(()=>document.getElementById('nameInput').focus(),100)}
function doSubmit(){const inp=document.getElementById('nameInput'),w=document.getElementById('nameWarn'),name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return}inp.classList.remove('err');w.textContent='';document.getElementById('nameMask').classList.remove('show');showResult(name)}
function showResult(name){let correct=0;for(let i=0;i<TOTAL;i++)if(state[i]==='ok')correct++;const pct=correct/TOTAL,s10=(pct*10).toFixed(2);let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con thuộc khu phố như lòng bàn tay! 🏆';fb='🏆🏙️🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif'}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa nhé! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif'}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi làm lại nha! 🏠';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif'}
  document.getElementById('resGreet').textContent=greet;document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'),fbEl=document.getElementById('resFallback');fbEl.textContent=fb;fbEl.style.display='none';im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none'};im.onerror=()=>{im.style.display='none';fbEl.style.display='block'};im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block'}},2500);
  document.getElementById('resMask').classList.add('show');if(pct>=0.6){confetti();ding()}}
/* ===== FLOATS ===== */
(function(){const icons=['🏙️','🏠','🏢','🌳','🚌','🚦','🏬','🛣️','🚏','🏘️'];const p=document.getElementById('pattern');
  for(let i=0;i<11;i++){const s=document.createElement('span');s.className='float';s.textContent=icons[i%icons.length];s.style.left=Math.random()*100+'%';s.style.animationDuration=(18+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*24)+'s';s.style.fontSize=(1.5+Math.random()*1.6)+'rem';p.appendChild(s)}})();
</script>
</body>
