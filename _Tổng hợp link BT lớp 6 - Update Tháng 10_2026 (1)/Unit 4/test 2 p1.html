<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIT 4 · TEST 2 · Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#2f80ed;--p4:#27ae60;--p5:#56ccf2;--green:#00D26A;--red:#FF4757;--ink:#1e3a5f;--glow:#f2c94c;--glow2:#2f80ed}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;line-height:1.55;overflow-x:hidden;position:relative;
  background:linear-gradient(-45deg,#56ccf2,#5b8def,#6fcf97,#f2c94c,#4facfe);background-size:400% 400%;animation:bgmove 18s ease infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.1rem;opacity:.38;animation:floaty linear infinite;filter:drop-shadow(0 4px 6px rgba(20,50,90,.22))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0)}50%{transform:translateY(50vh) translateX(22px)}100%{transform:translateY(-15vh) translateX(-8px)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}
.topbar{text-align:center;background:rgba(255,255,255,.26);backdrop-filter:blur(12px);border:1.5px solid rgba(242,201,76,.7);border-radius:22px;padding:14px 16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(20,50,90,.22)}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(47,128,237,.65);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:0 2px 10px rgba(20,50,90,.35)}
.topbar p{font-size:.78rem;color:#fff;opacity:.97;margin-top:2px}
.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(30,70,120,.24);backdrop-filter:blur(10px);border-radius:30px;padding:5px;border:1.5px solid rgba(242,201,76,.5);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.45);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(20,50,90,.4)}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p4));color:#fff;font-weight:900;min-width:40px;height:40px;padding:0 8px;border-radius:14px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 6px 14px rgba(47,128,237,.4)}
.sec h2{color:#fff;font-size:1.0rem;font-weight:800;text-shadow:0 1px 6px rgba(20,50,90,.4);flex:1}
.card{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:20px;padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(242,201,76,.5);box-shadow:0 12px 26px rgba(20,50,90,.16)}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#f7b731);color:#7a5a00;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:linear-gradient(135deg,#fff,#eef6ff);border:2px solid rgba(47,128,237,.22);border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(47,128,237,.2),0 8px 14px rgba(20,50,90,.1);transition:transform .12s,box-shadow .12s;text-align:center;user-select:none}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(47,128,237,.28),0 0 18px rgba(242,201,76,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#27ae60);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;border:2px solid rgba(47,128,237,.35);background:#fff;outline:none;flex:1;min-width:190px;color:var(--ink)}
.tin:focus{border-color:var(--glow2);box-shadow:0 0 0 4px rgba(47,128,237,.18)}
.tin.ok{border-color:var(--green);background:#eafff3}.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.05rem;font-weight:800;color:var(--p1)}
.btn-check{font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--glow2),var(--p4));padding:11px 18px;border-radius:14px;box-shadow:0 5px 0 rgba(47,128,237,.4);transition:transform .1s}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(47,128,237,.4)}
.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{width:46px;height:46px;border-radius:14px;border:2px solid rgba(47,128,237,.3);background:linear-gradient(135deg,#fff,#eef6ff);font-weight:900;font-size:1.1rem;cursor:pointer;color:var(--p1);box-shadow:0 5px 0 rgba(47,128,237,.2);transition:transform .12s}
.lbtn:hover:not(.locked){transform:scale(1.08)}
.lbtn.sel{background:linear-gradient(135deg,var(--glow2),var(--p4));color:#fff}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#27ae60);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}.corrbox.show{display:block}
.exp{max-height:0;overflow:hidden;transition:max-height .5s,margin .3s,padding .3s;background:rgba(47,128,237,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2600px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(47,128,237,.3)}
.exp ol{margin:6px 0 2px 18px}.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#eaf3ff,#e9fff2);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#2f6ac0;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.stp{color:#1f7a55;font-weight:800}
.p-word{color:#2563eb;font-weight:800}.hl-green{color:#0a9d54;font-weight:900}.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(47,128,237,.15);color:#2f6ac0;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}
.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--glow2),var(--p4),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(47,128,237,.4);transition:transform .1s}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(47,128,237,.4)}
.mask{position:fixed;inset:0;background:rgba(20,45,80,.6);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:#fff;border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(20,45,80,.4);border:2px solid rgba(242,201,76,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#557;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(47,128,237,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:fb 2s ease-in-out infinite}
@keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p5),var(--p1));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(47,128,237,.4)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fff;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>
<div class="wrap">
  <div class="topbar">
    <div class="tag">🏘️ Giáo viên tạo: Ms MS Chí Nên</div>
    <h1>🏙️ UNIT 4 · TEST 2</h1>
    <p>My Neighbourhood · English 6</p>
  </div>
  <div class="prog"><div class="txt" id="progtxt">0 / 40</div><div class="bar"><div class="fill" id="progfill"></div></div></div>
  <div id="quiz"></div>
  <div class="submit-wrap"><button class="btn-submit" onclick="openName()">🏆 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
  <div class="footer">✨ Made with love for young learners · Ms MS Chí Nên ✨</div>
</div>
<div class="mask" id="nameMask"><div class="modal">
  <h2>🏠 Bé tên là gì nào?</h2><p>Nhập tên của con để xem kết quả nhé!</p>
  <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
  <div class="warn" id="nameWarn"></div>
  <button class="btn-again" style="background:linear-gradient(135deg,var(--glow2),var(--p4))" onclick="doSubmit()">Xem kết quả 🎉</button>
</div></div>
<div class="mask" id="resMask"><div class="modal">
  <h2 id="resGreet"></h2><div class="score-big" id="resScore"></div><div class="score-10" id="resScore10"></div>
  <img class="meme" id="resMeme" alt="meme" style="display:none"><div class="meme-fallback" id="resFallback"></div>
  <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
  <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
</div></div>
<script>
const DATA=[
/* ===== A.I PHONETICS ===== */
{sec:"I",head:"A. NGỮ ÂM — Chọn từ có phần gạch chân đọc khác các từ còn lại.",num:1,type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["booksh<u>e</u>lf","cath<u>e</u>dral","cl<u>e</u>ver","t<u>e</u>mple"],answer:"cath<u>e</u>dral",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "e" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>bookshelf</span> <span class='p-phonetic'>/ˈbʊkʃelf/</span> = <span class='p-mean'>kệ sách → e /e/</span></div>
 <div><span class='hl-green'>cathedral</span> <span class='p-phonetic'>/kəˈθiːdrəl/</span> = <span class='p-mean'>nhà thờ lớn → e /iː/</span></div>
 <div><span class='p-word'>clever</span> <span class='p-phonetic'>/ˈklevə/</span> = <span class='p-mean'>thông minh → e /e/</span></div>
 <div><span class='p-word'>temple</span> <span class='p-phonetic'>/ˈtempl/</span> = <span class='p-mean'>ngôi đền → e /e/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"cathedral" có "e" ở âm được nhấn đọc /iː/ (i dài), khác ba từ kia đọc /e/ (e ngắn).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>bookshelf, clever, temple đều có "e" đọc /e/.</span></li></ol>
 <div class="tip">🧠 Mẹo: "e" thường đọc /e/ (temple, clever); nhưng "e" ở âm nhấn của cathedral đọc /iː/.</div>`},
{sec:"I",num:2,type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["traff<u>i</u>c","v<u>i</u>llage","conf<u>i</u>dent","l<u>i</u>brary"],answer:"l<u>i</u>brary",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "i" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>traffic</span> <span class='p-phonetic'>/ˈtræfɪk/</span> = <span class='p-mean'>giao thông → i /ɪ/</span></div>
 <div><span class='p-word'>village</span> <span class='p-phonetic'>/ˈvɪlɪdʒ/</span> = <span class='p-mean'>ngôi làng → i /ɪ/</span></div>
 <div><span class='p-word'>confident</span> <span class='p-phonetic'>/ˈkɒnfɪdənt/</span> = <span class='p-mean'>tự tin → i /ɪ/</span></div>
 <div><span class='hl-green'>library</span> <span class='p-phonetic'>/ˈlaɪbrəri/</span> = <span class='p-mean'>thư viện → i /aɪ/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"library" có "i" đọc /aɪ/ (âm ai), khác ba từ kia đọc /ɪ/ (âm i ngắn).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>traffic, village, confident đều có "i" đọc /ɪ/.</span></li></ol>`},
{sec:"I",num:3,type:"mcq",
 q:"3. Choose the word whose underlined part is pronounced differently.",
 disp:["<u>g</u>uide","<u>g</u>allery","<u>g</u>ym","<u>g</u>arden"],answer:"<u>g</u>ym",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "g" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>guide</span> <span class='p-phonetic'>/ɡaɪd/</span> = <span class='p-mean'>hướng dẫn viên → g /ɡ/</span></div>
 <div><span class='p-word'>gallery</span> <span class='p-phonetic'>/ˈɡæləri/</span> = <span class='p-mean'>phòng tranh → g /ɡ/</span></div>
 <div><span class='hl-green'>gym</span> <span class='p-phonetic'>/dʒɪm/</span> = <span class='p-mean'>phòng gym → g /dʒ/</span></div>
 <div><span class='p-word'>garden</span> <span class='p-phonetic'>/ˈɡɑːdn/</span> = <span class='p-mean'>khu vườn → g /ɡ/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"gym" có "g" đọc /dʒ/ (vì đứng trước "y"), khác ba từ kia đọc /ɡ/ (g cứng).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>guide, gallery, garden có "g" trước u/a nên đọc /ɡ/.</span></li></ol>
 <div class="tip">🧠 Mẹo: "g" đọc /dʒ/ khi trước e, i, y (gym, giant); đọc /ɡ/ khi trước a, o, u (garden, go, guide).</div>`},
/* ===== A.II ODD ONE OUT ===== */
{sec:"II",head:"A. TỪ KHÁC LOẠI — Chọn từ KHÁC LOẠI so với nhóm.",num:4,type:"mcq",
 q:"4. Choose the odd one out.",
 disp:["workshop","supermarket","hospital","traffic"],answer:"traffic",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ không cùng nhóm với các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>workshop</span> = <span class='p-mean'>xưởng (nơi chốn)</span></div><div><span class='p-word'>supermarket</span> = <span class='p-mean'>siêu thị (nơi chốn)</span></div>
 <div><span class='p-word'>hospital</span> = <span class='p-mean'>bệnh viện (nơi chốn)</span></div><div><span class='hl-green'>traffic</span> = <span class='p-mean'>giao thông (không phải nơi chốn)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>workshop, supermarket, hospital đều là NƠI CHỐN (địa điểm) trong khu phố; còn "traffic" (giao thông) không phải một địa điểm → khác loại.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Ba từ kia đều là công trình/địa điểm nên cùng nhóm.</span></li></ol>`},
{sec:"II",num:5,type:"mcq",
 q:"5. Choose the odd one out.",
 disp:["fashionable","hill","intelligent","dangerous"],answer:"hill",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ không cùng nhóm với các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>fashionable</span> <span class='wt'>adj</span> = <span class='p-mean'>hợp thời trang</span></div><div><span class='hl-green'>hill</span> <span class='wt'>n</span> = <span class='p-mean'>ngọn đồi (danh từ)</span></div>
 <div><span class='p-word'>intelligent</span> <span class='wt'>adj</span> = <span class='p-mean'>thông minh</span></div><div><span class='p-word'>dangerous</span> <span class='wt'>adj</span> = <span class='p-mean'>nguy hiểm</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>fashionable, intelligent, dangerous đều là TÍNH TỪ; còn "hill" là DANH TỪ → khác loại.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Ba từ kia cùng là tính từ nên cùng nhóm.</span></li></ol>`},
{sec:"II",num:6,type:"mcq",
 q:"6. Choose the odd one out.",
 disp:["direction","modern","quiet","convenient"],answer:"direction",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ không cùng nhóm với các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">

 <div><span class='p-word'>quiet</span> <span class='wt'>adj</span> = <span class='p-mean'>yên tĩnh</span></div><div><span class='p-word'>convenient</span> <span class='wt'>adj</span> = <span class='p-mean'>tiện lợi</span></div></div></li>

 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Ba từ kia cùng là tính từ nên cùng nhóm.</span></li></ol>`},
/* ===== A.III MCQ ===== */
{sec:"III",head:"A. CHỌN ĐÁP ÁN — Chọn từ/cụm từ thích hợp nhất.",num:7,type:"mcq",
 q:"7. How about going to that café ______ the park?",
 disp:["next","opposite","between","on"],answer:"opposite",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Đi đến quán cà phê đối diện công viên thì sao?</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>next</span> = <span class='p-mean'>bên cạnh (phải có "to")</span></div><div><span class='hl-green'>opposite</span> = <span class='p-mean'>đối diện</span></div>
 <div><span class='p-word'>between</span> = <span class='p-mean'>ở giữa (phải có "and")</span></div><div><span class='p-word'>on</span> = <span class='p-mean'>trên</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"opposite + nơi chốn" = đối diện với. "opposite the park" = đối diện công viên (đứng trực tiếp trước danh từ).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>"next" cần "to" (next to the park); "between" cần "and" (between A and B); "on" sai nghĩa.</span></li></ol>
 <div class="tip">🧠 Nhớ: opposite + N (đối diện); next TO + N; between A AND B.</div>`},

 <div><span class='p-word'>learns</span> = <span class='p-mean'>học</span></div><div><span class='p-word'>begins</span> = <span class='p-mean'>bắt đầu</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"favourite thing" (việc YÊU THÍCH) → phải là "enjoys" (thích). "enjoy + V-ing" = thích làm gì.</span></li>

 <div><span class='hl-green'>see</span> = <span class='p-mean'>xem (nguyên mẫu)</span></div><div><span class='p-word'>sees</span> = <span class='p-mean'>sai (không chia -s)</span></div></div></li>

/* ===== AUDIO ===== */
let AC;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function ding(){const c=ac(),n=c.currentTime;[880,1320,1760].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,n+i*.08);g.gain.linearRampToValueAtTime(.25,n+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.4);o.start(n+i*.08);o.stop(n+i*.08+.42)})}
function buzz(){const c=ac(),n=c.currentTime;[300,220,160].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,n+i*.13);g.gain.exponentialRampToValueAtTime(.001,n+i*.13+.12);o.start(n+i*.13);o.stop(n+i*.13+.13)})}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d'),cols=['#f2c94c','#2f80ed','#27ae60','#00D26A','#56ccf2','#6fcf97'],P=[];for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});let t=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);t++;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore()});if(t<130)requestAnimationFrame(loop);else cv.remove()})()}

/* ===== HELPERS ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return(s||'').toLowerCase().replace(/won['’]t/g,'will not').replace(/can['’]t/g,'can not').replace(/n['’]t/g,' not').replace(/['’]/g,'').replace(/[.,!?;:"…\/–-]/g,' ').replace(/\s+/g,' ').trim()}
const state={};let answered=0;const TOTAL=DATA.length;
function updateProg(){document.getElementById('progtxt').textContent=answered+' / '+TOTAL;document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%'}

/* ===== RENDER ===== */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){const s=document.createElement('div');s.className='sec';s.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;quiz.appendChild(s)}
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  const zone=document.createElement('div');card.appendChild(zone);
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=it.exp;card.appendChild(exp);
  quiz.appendChild(card);
  if(it.type==='mcq')renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange')renderFill(it,idx,zone,exp);
  else if(it.type==='rewrite')renderRewrite(it,idx,zone,exp);
  else if(it.type==='error')renderError(it,idx,zone,exp);
});
updateProg();
function markDone(idx,ok){if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg()}}
function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div');wrap.className='opts';
  shuffle(it.disp).forEach(txt=>{
    const b=document.createElement('div');b.className='opt';b.innerHTML=txt;
    b.onclick=()=>{if(state[idx])return;const all=wrap.querySelectorAll('.opt');all.forEach(x=>x.classList.add('locked'));
      if(txt===it.answer){b.classList.add('correct');ding();confetti();markDone(idx,true)}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim')});setTimeout(()=>b.classList.remove('shake'),450)}
      exp.classList.add('open')};
    wrap.appendChild(b)});
  zone.appendChild(wrap);
}
function renderFill(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  const acc=it.accept.map(norm);
  function check(){if(state[idx])return;const ok=acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderRewrite(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const pre=document.createElement('span');pre.className='prefix';pre.textContent=it.prefix+' ...';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Gõ tiếp phần còn lại...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(pre);row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  const contN=it.accept.map(norm),preN=norm(it.prefix),fullN=it.accept.map(a=>norm(it.prefix+' '+a));
  function check(){if(state[idx])return;let inN=norm(inp.value),stripped=inN;
    if(inN.startsWith(preN+' '))stripped=inN.slice(preN.length).trim();else if(inN===preN)stripped='';
    const ok=contN.includes(inN)||contN.includes(stripped)||fullN.includes(inN);inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderError(it,idx,zone,exp){
  const q=document.createElement('div');q.className='err-parts';let lb=it.q.replace(/^\d+\.\s*/,'');let li=0;const L=['A','B','C','D'];
  lb=lb.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);q.innerHTML=lb;zone.appendChild(q);
  const letters=document.createElement('div');letters.className='letters';
  const corr=document.createElement('div');corr.className='corrbox';const acc=it.corrAccept.map(norm);let chosen=null;
  L.forEach((lab,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=lab;
    b.onclick=()=>{if(state[idx])return;letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');chosen=i;corr.classList.add('show');corr.querySelector('input').focus()};letters.appendChild(b)});
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div>`;
  zone.appendChild(corr);const inp=corr.querySelector('input'),btn=corr.querySelector('button');
  function check(){if(state[idx])return;if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return}
    const ok=(chosen===it.correctLetter)&&acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel')});letters.children[it.correctLetter].classList.add('correct');if(chosen!==it.correctLetter)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
/* ===== SUBMIT ===== */
function openName(){document.getElementById('nameMask').classList.add('show');setTimeout(()=>document.getElementById('nameInput').focus(),100)}
function doSubmit(){const inp=document.getElementById('nameInput'),w=document.getElementById('nameWarn'),name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return}inp.classList.remove('err');w.textContent='';document.getElementById('nameMask').classList.remove('show');showResult(name)}
function showResult(name){let correct=0;for(let i=0;i<TOTAL;i++)if(state[i]==='ok')correct++;const pct=correct/TOTAL,s10=(pct*10).toFixed(2);let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con thuộc khu phố như lòng bàn tay! 🏆';fb='🏆🏙️🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif'}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa nhé! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif'}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi làm lại nha! 🏠';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif'}
  document.getElementById('resGreet').textContent=greet;document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'),fbEl=document.getElementById('resFallback');fbEl.textContent=fb;fbEl.style.display='none';im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none'};im.onerror=()=>{im.style.display='none';fbEl.style.display='block'};im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block'}},2500);
  document.getElementById('resMask').classList.add('show');if(pct>=0.6){confetti();ding()}}
/* ===== FLOATS ===== */
(function(){const icons=['🏙️','🏠','🏢','🌳','🚌','🚦','🏬','🛣️','🚏','🏘️'];const p=document.getElementById('pattern');
  for(let i=0;i<11;i++){const s=document.createElement('span');s.className='float';s.textContent=icons[i%icons.length];s.style.left=Math.random()*100+'%';s.style.animationDuration=(18+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*24)+'s';s.style.fontSize=(1.5+Math.random()*1.6)+'rem';p.appendChild(s)}})();
</script>
</body>
