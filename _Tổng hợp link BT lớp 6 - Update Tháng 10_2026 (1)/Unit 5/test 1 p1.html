<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIT 5 · TEST 1 · Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#0e9f6e;--p4:#0891b2;--p5:#43e97b;--green:#00D26A;--red:#FF4757;--ink:#123c2e;--glow:#a3e635;--glow2:#0891b2}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;line-height:1.55;overflow-x:hidden;position:relative;
  background:linear-gradient(-45deg,#43e97b,#38f9d7,#4facfe,#00b09b,#96e6a1);background-size:400% 400%;animation:bgmove 18s ease infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.pattern{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pattern .float{position:absolute;font-size:2.1rem;opacity:.36;animation:floaty linear infinite;filter:drop-shadow(0 4px 6px rgba(10,60,40,.22))}
@keyframes floaty{0%{transform:translateY(112vh) translateX(0)}50%{transform:translateY(50vh) translateX(22px)}100%{transform:translateY(-15vh) translateX(-8px)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 14px 90px}
.topbar{text-align:center;background:rgba(255,255,255,.26);backdrop-filter:blur(12px);border:1.5px solid rgba(163,230,53,.7);border-radius:22px;padding:14px 16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(10,60,40,.22)}
.topbar .tag{font-family:'Quicksand';font-size:.82rem;font-weight:700;color:#fff;background:rgba(14,159,110,.7);display:inline-block;padding:3px 12px;border-radius:30px;margin-bottom:6px}
.topbar h1{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:0 2px 10px rgba(10,60,40,.35)}
.topbar p{font-size:.78rem;color:#fff;opacity:.97;margin-top:2px}
.prog{position:sticky;top:6px;z-index:5;margin:0 0 14px;background:rgba(12,80,60,.24);backdrop-filter:blur(10px);border-radius:30px;padding:5px;border:1.5px solid rgba(163,230,53,.5);display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:14px;background:rgba(255,255,255,.45);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--glow2));border-radius:20px;transition:width .4s}
.prog .txt{font-size:.8rem;font-weight:800;color:#fff;padding-right:8px;white-space:nowrap;text-shadow:0 1px 4px rgba(10,60,40,.4)}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec .num{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff;font-weight:900;min-width:40px;height:40px;padding:0 8px;border-radius:14px;display:grid;place-items:center;font-size:.9rem;box-shadow:0 6px 14px rgba(8,145,178,.4)}
.sec h2{color:#fff;font-size:1.0rem;font-weight:800;text-shadow:0 1px 6px rgba(10,60,40,.4);flex:1}
.card{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:20px;padding:16px 16px 14px;margin-bottom:16px;border:1.5px solid rgba(163,230,53,.5);box-shadow:0 12px 26px rgba(10,60,40,.16)}
.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qnum{flex-shrink:0;background:linear-gradient(135deg,var(--glow),#84cc16);color:#365314;font-weight:900;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.9rem}
.qtext{font-size:1.15rem;font-weight:700;padding-top:2px}
.qtext u{text-underline-offset:3px;text-decoration-thickness:2.5px;text-decoration-color:var(--glow2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:linear-gradient(135deg,#fff,#effdf4);border:2px solid rgba(14,159,110,.22);border-radius:16px;padding:13px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(14,159,110,.2),0 8px 14px rgba(10,60,40,.1);transition:transform .12s,box-shadow .12s;text-align:center;user-select:none}
.opt:hover:not(.locked){transform:scale(1.04) translateY(-2px);box-shadow:0 9px 0 rgba(14,159,110,.28),0 0 18px rgba(163,230,53,.5)}
.opt.correct{background:linear-gradient(135deg,#00D26A,#0e9f6e);color:#fff;border-color:#00b85c;box-shadow:0 6px 0 #009b4e}
.opt.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#e63947;box-shadow:0 6px 0 #cc2f3d}
.opt.locked{cursor:default}.opt.dim{opacity:.5}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fillrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tin{font-family:'Nunito';font-size:1.08rem;font-weight:700;padding:11px 14px;border-radius:14px;border:2px solid rgba(14,159,110,.35);background:#fff;outline:none;flex:1;min-width:190px;color:var(--ink)}
.tin:focus{border-color:var(--glow2);box-shadow:0 0 0 4px rgba(8,145,178,.18)}
.tin.ok{border-color:var(--green);background:#eafff3}.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{font-size:1.05rem;font-weight:800;color:var(--p1)}
.btn-check{font-family:'Quicksand';font-weight:700;font-size:.98rem;border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--glow2),var(--p1));padding:11px 18px;border-radius:14px;box-shadow:0 5px 0 rgba(8,145,178,.4);transition:transform .1s}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(8,145,178,.4)}
.letters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lbtn{width:46px;height:46px;border-radius:14px;border:2px solid rgba(14,159,110,.3);background:linear-gradient(135deg,#fff,#effdf4);font-weight:900;font-size:1.1rem;cursor:pointer;color:var(--p1);box-shadow:0 5px 0 rgba(14,159,110,.2);transition:transform .12s}
.lbtn:hover:not(.locked){transform:scale(1.08)}
.lbtn.sel{background:linear-gradient(135deg,var(--glow2),var(--p1));color:#fff}
.lbtn.correct{background:linear-gradient(135deg,#00D26A,#0e9f6e);color:#fff;border-color:#009b4e}
.lbtn.wrong{background:linear-gradient(135deg,#FF4757,#ff6b7d);color:#fff;border-color:#cc2f3d}
.err-parts{font-size:1.05rem;font-weight:700;margin-bottom:10px}.err-parts b{color:var(--p1)}
.corrbox{margin-top:10px;display:none}.corrbox.show{display:block}
.exp{max-height:0;overflow:hidden;transition:max-height .5s,margin .3s,padding .3s;background:rgba(14,159,110,.06);border-radius:14px;padding:0 14px;margin-top:0;font-size:1rem}
.exp.open{max-height:2600px;padding:12px 14px;margin-top:12px;border:1.5px dashed rgba(14,159,110,.3)}
.exp ol{margin:6px 0 2px 18px}.exp li{margin-bottom:8px}
.vnt{background:linear-gradient(135deg,#FFF3E0,#ffe6c7);border-left:5px solid #FDCB6E;border-radius:10px;padding:9px 12px;font-weight:800;color:#8a5a1b;margin-bottom:8px}
.tip{background:linear-gradient(135deg,#eafff2,#e6fbff);border-left:5px solid var(--glow2);border-radius:10px;padding:8px 12px;color:#0e7490;font-weight:700;margin-top:8px;font-size:.96rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(255,255,255,.65);border-radius:9px;padding:6px 9px;font-size:.96rem}
.gcol{display:flex;flex-direction:column;gap:7px;margin:6px 0}
.gcol>div{background:rgba(255,255,255,.65);border-radius:9px;padding:7px 11px;font-size:.98rem;line-height:1.5}
.stp{color:#0e7490;font-weight:800}
.p-word{color:#2563eb;font-weight:800}.hl-green{color:#0a9d54;font-weight:900}.hl-red{color:var(--red);font-weight:900}
.wt{background:rgba(14,159,110,.15);color:#0e7490;font-size:.78rem;font-weight:800;padding:1px 7px;border-radius:20px;margin:0 2px}
.p-phonetic{color:#8b5cf6;background:rgba(139,92,246,.12);padding:1px 6px;border-radius:6px;font-weight:700}
.p-mean{color:#c0562b;font-weight:700}.p-grammar{border-bottom:2px solid var(--red);font-weight:700;padding-bottom:1px}
.submit-wrap{text-align:center;margin:26px 0 8px}
.btn-submit{font-family:'Quicksand';font-weight:700;font-size:1.25rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--glow2),var(--p1),var(--glow));background-size:200% 200%;animation:bgmove 6s ease infinite;padding:16px 34px;border-radius:22px;box-shadow:0 10px 0 rgba(14,159,110,.4);transition:transform .1s}
.btn-submit:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(14,159,110,.4)}
.mask{position:fixed;inset:0;background:rgba(10,50,38,.6);backdrop-filter:blur(6px);z-index:50;display:none;place-items:center;padding:16px}
.mask.show{display:grid}
.modal{background:#fff;border-radius:26px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(10,50,38,.4);border:2px solid rgba(163,230,53,.6);animation:pop .4s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:1.4rem;font-weight:900;color:var(--p1);margin-bottom:6px}
.modal p{font-size:.95rem;color:#557;margin-bottom:14px}
.modal input{font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:13px;border-radius:14px;border:2px solid rgba(14,159,110,.35);width:100%;outline:none;text-align:center;margin-bottom:6px}
.modal input:focus{border-color:var(--glow2)}.modal input.err{border-color:var(--red);animation:shk .4s}
.warn{color:var(--red);font-weight:700;font-size:.85rem;min-height:18px;margin-bottom:8px}
.score-big{font-size:2.6rem;font-weight:900;color:var(--p1);line-height:1}
.score-10{font-size:1.3rem;font-weight:800;color:#00a85a;margin:4px 0 10px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:6px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.meme-fallback{font-size:4.5rem;margin:10px 0;animation:fb 2s ease-in-out infinite}
@keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.btn-again{font-family:'Quicksand';font-weight:700;font-size:1rem;color:#fff;border:none;cursor:pointer;background:linear-gradient(135deg,var(--p5),var(--p1));padding:12px 24px;border-radius:16px;margin-top:12px;box-shadow:0 6px 0 rgba(14,159,110,.4)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.footer{text-align:center;color:#fff;font-size:.75rem;opacity:.92;margin-top:20px;font-weight:600}
</style>
</head>
<body>
<div class="pattern" id="pattern"></div>
<div class="wrap">
  <div class="topbar">
    <div class="tag">🌿 Giáo viên tạo: Ms MS Chí Nên</div>
    <h1>🏞️ UNIT 5 · TEST 1</h1>
    <p>Natural Wonders of Viet Nam · English 6</p>
  </div>
  <div class="prog"><div class="txt" id="progtxt">0 / 40</div><div class="bar"><div class="fill" id="progfill"></div></div></div>
  <div id="quiz"></div>
  <div class="submit-wrap"><button class="btn-submit" onclick="openName()">🏆 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
  <div class="footer">✨ Made with love for young explorers · Ms MS Chí Nên ✨</div>
</div>
<div class="mask" id="nameMask"><div class="modal">
  <h2>🏔️ Nhà thám hiểm nhí tên gì?</h2><p>Nhập tên của con để xem kết quả nhé!</p>
  <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')doSubmit()">
  <div class="warn" id="nameWarn"></div>
  <button class="btn-again" style="background:linear-gradient(135deg,var(--glow2),var(--p1))" onclick="doSubmit()">Xem kết quả 🎉</button>
</div></div>
<div class="mask" id="resMask"><div class="modal">
  <h2 id="resGreet"></h2><div class="score-big" id="resScore"></div><div class="score-10" id="resScore10"></div>
  <img class="meme" id="resMeme" alt="meme" style="display:none"><div class="meme-fallback" id="resFallback"></div>
  <p id="resMsg" style="font-weight:700;color:var(--p1)"></p>
  <button class="btn-again" onclick="location.reload()">🔄 Làm lại bài</button>
</div></div>
<script>
const DATA=[
/* ===== A.I PHONETICS ===== */
{sec:"I",head:"A. NGỮ ÂM — Chọn từ có phần gạch chân đọc khác các từ còn lại.",num:1,type:"mcq",
 q:"1. Choose the word whose underlined part is pronounced differently.",
 disp:["boa<u>t</u>","si<u>t</u>e","na<u>t</u>ure","ac<u>t</u>ive"],answer:"na<u>t</u>ure",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "t" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>boat</span> <span class='p-phonetic'>/bəʊt/</span> = <span class='p-mean'>thuyền → t /t/</span></div>
 <div><span class='p-word'>site</span> <span class='p-phonetic'>/saɪt/</span> = <span class='p-mean'>địa điểm → t /t/</span></div>
 <div><span class='hl-green'>nature</span> <span class='p-phonetic'>/ˈneɪtʃə/</span> = <span class='p-mean'>thiên nhiên → t /tʃ/</span></div>
 <div><span class='p-word'>active</span> <span class='p-phonetic'>/ˈæktɪv/</span> = <span class='p-mean'>năng động → t /t/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"nature" có "t" trong đuôi "-ture" đọc /tʃ/ (âm ch), khác ba từ kia đọc /t/.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>boat, site, active đều có "t" đọc /t/.</span></li></ol>
 <div class="tip">🧠 Mẹo: đuôi "-ture" thường đọc /tʃə/ (nature, picture, future, adventure).</div>`},
{sec:"I",num:2,type:"mcq",
 q:"2. Choose the word whose underlined part is pronounced differently.",
 disp:["san<u>d</u>wich","san<u>d</u>y","<u>d</u>esert","frien<u>d</u>"],answer:"san<u>d</u>wich",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "d" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>sandwich</span> <span class='p-phonetic'>/ˈsænwɪtʃ/</span> = <span class='p-mean'>bánh mì kẹp → d CÂM</span></div>
 <div><span class='p-word'>sandy</span> <span class='p-phonetic'>/ˈsændi/</span> = <span class='p-mean'>đầy cát → d /d/</span></div>
 <div><span class='p-word'>desert</span> <span class='p-phonetic'>/ˈdezət/</span> = <span class='p-mean'>sa mạc → d /d/</span></div>
 <div><span class='p-word'>friend</span> <span class='p-phonetic'>/frend/</span> = <span class='p-mean'>bạn bè → d /d/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Trong "sandwich", chữ "d" thường CÂM (không phát âm) → /ˈsænwɪtʃ/. Ba từ kia đều đọc /d/ rõ → sandwich khác.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>sandy, desert, friend đều có "d" đọc /d/.</span></li></ol>
 <div class="tip">🧠 Mẹo: "d" trong "sandwich" thường bị lược bỏ khi nói (giống Wednesday, handsome).</div>`},
{sec:"I",num:3,type:"mcq",
 q:"3. Choose the word whose underlined part is pronounced differently.",
 disp:["p<u>a</u>ss","pl<u>a</u>ster","ch<u>a</u>rming","<u>a</u>rea"],answer:"<u>a</u>rea",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ có "a" gạch chân đọc khác các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>pass</span> <span class='p-phonetic'>/pɑːs/</span> = <span class='p-mean'>đi qua → a /ɑː/</span></div>
 <div><span class='p-word'>plaster</span> <span class='p-phonetic'>/ˈplɑːstə/</span> = <span class='p-mean'>băng dán → a /ɑː/</span></div>
 <div><span class='p-word'>charming</span> <span class='p-phonetic'>/ˈtʃɑːmɪŋ/</span> = <span class='p-mean'>quyến rũ → a /ɑː/</span></div>
 <div><span class='hl-green'>area</span> <span class='p-phonetic'>/ˈeəriə/</span> = <span class='p-mean'>khu vực → a /eə/</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"area" có "a" đầu đọc /eə/ (âm e-ơ), khác ba từ kia đọc /ɑː/ (âm a dài).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>pass, plaster, charming đều có "a" đọc /ɑː/.</span></li></ol>`},
/* ===== A.II ODD ONE OUT ===== */
{sec:"II",head:"A. TỪ KHÁC LOẠI — Chọn từ KHÁC LOẠI so với nhóm.",num:4,type:"mcq",
 q:"4. Choose the odd one out.",
 disp:["compass","map","backpack","station"],answer:"station",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ không cùng nhóm với các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>compass</span> = <span class='p-mean'>la bàn (đồ dùng)</span></div><div><span class='p-word'>map</span> = <span class='p-mean'>bản đồ (đồ dùng)</span></div>
 <div><span class='p-word'>backpack</span> = <span class='p-mean'>ba lô (đồ dùng)</span></div><div><span class='hl-green'>station</span> = <span class='p-mean'>nhà ga (nơi chốn)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>compass, map, backpack đều là ĐỒ DÙNG mang theo khi đi; còn "station" là NƠI CHỐN → khác loại.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Ba từ kia cùng là vật dụng nên cùng nhóm.</span></li></ol>`},
{sec:"II",num:5,type:"mcq",
 q:"5. Choose the odd one out.",
 disp:["island","suncream","mountain","waterfall"],answer:"suncream",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ không cùng nhóm với các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>island</span> = <span class='p-mean'>hòn đảo (thiên nhiên)</span></div><div><span class='hl-green'>suncream</span> = <span class='p-mean'>kem chống nắng (đồ dùng)</span></div>
 <div><span class='p-word'>mountain</span> = <span class='p-mean'>núi (thiên nhiên)</span></div><div><span class='p-word'>waterfall</span> = <span class='p-mean'>thác nước (thiên nhiên)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>island, mountain, waterfall đều là KỲ QUAN THIÊN NHIÊN; còn "suncream" là SẢN PHẨM do con người làm ra → khác loại.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Ba từ kia cùng là cảnh vật thiên nhiên.</span></li></ol>`},
{sec:"II",num:6,type:"mcq",
 q:"6. Choose the odd one out.",
 disp:["scissors","amazing","fantastic","famous"],answer:"scissors",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Chọn từ không cùng nhóm với các từ còn lại.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>scissors</span> <span class='wt'>n</span> = <span class='p-mean'>cái kéo (danh từ)</span></div><div><span class='p-word'>amazing</span> <span class='wt'>adj</span> = <span class='p-mean'>tuyệt vời</span></div>
 <div><span class='p-word'>fantastic</span> <span class='wt'>adj</span> = <span class='p-mean'>tuyệt hảo</span></div><div><span class='p-word'>famous</span> <span class='wt'>adj</span> = <span class='p-mean'>nổi tiếng</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>amazing, fantastic, famous đều là TÍNH TỪ; còn "scissors" là DANH TỪ → khác loại.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Ba từ kia cùng là tính từ.</span></li></ol>`},
/* ===== A.III MCQ ===== */
{sec:"III",head:"A. CHỌN ĐÁP ÁN — Chọn từ/cụm từ thích hợp nhất.",num:7,type:"mcq",
 q:"7. Wow, you know so much ______ desert animals!",
 disp:["in","for","around","about"],answer:"about",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Ồ, bạn biết nhiều về động vật sa mạc thật đấy!</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>in</span> = <span class='p-mean'>trong</span></div><div><span class='p-word'>for</span> = <span class='p-mean'>cho</span></div>
 <div><span class='p-word'>around</span> = <span class='p-mean'>xung quanh</span></div><div><span class='hl-green'>about</span> = <span class='p-mean'>về (know about)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"know about sth" = biết VỀ điều gì → "know so much about desert animals".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>in/for/around không đi với "know" theo nghĩa "biết về".</span></li></ol>
 <div class="tip">🧠 Nhớ: know/talk/learn ABOUT sth = biết/nói/học về cái gì.</div>`},
{sec:"III",num:8,type:"mcq",
 q:"8. There are ______ apples on the table. You can eat them if you're hungry.",
 disp:["a little","much","a few","a lot"],answer:"a few",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Có một vài quả táo trên bàn. Bạn có thể ăn chúng nếu đói.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>a little</span> = <span class='p-mean'>một chút (không đếm được)</span></div><div><span class='p-word'>much</span> = <span class='p-mean'>nhiều (không đếm được)</span></div>
 <div><span class='hl-green'>a few</span> = <span class='p-mean'>một vài (đếm được)</span></div><div><span class='p-word'>a lot</span> = <span class='p-mean'>nhiều (thiếu "of")</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"apples" là danh từ ĐẾM ĐƯỢC số nhiều → dùng "a few apples" (một vài quả táo).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>a little/much dùng cho danh từ KHÔNG đếm được; "a lot" phải có "of" (a lot of apples).</span></li></ol>
 <div class="tip">🧠 Nhớ: a few + N đếm được (a few apples); a little + N không đếm được (a little water).</div>`},
{sec:"III",num:9,type:"mcq",
 q:"9. There isn't much sunlight inside the ______, so it feels dark and cold.",
 disp:["bay","beach","cave","lake"],answer:"cave",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Không có nhiều ánh nắng bên trong hang động, nên nó tối và lạnh.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>bay</span> = <span class='p-mean'>vịnh</span></div><div><span class='p-word'>beach</span> = <span class='p-mean'>bãi biển</span></div>
 <div><span class='hl-green'>cave</span> = <span class='p-mean'>hang động</span></div><div><span class='p-word'>lake</span> = <span class='p-mean'>hồ</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"dark and cold, không có ánh nắng bên trong" → mô tả HANG ĐỘNG (cave). "inside the cave".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>bay/beach/lake đều là nơi ngoài trời, có ánh nắng — không "tối và lạnh bên trong".</span></li></ol>`},
{sec:"III",num:10,type:"mcq",
 q:"10. At night, campers sleep ______ their sleeping bags inside the tent.",
 disp:["at","in","under","behind"],answer:"in",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Vào ban đêm, những người cắm trại ngủ trong túi ngủ bên trong lều.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>at</span> = <span class='p-mean'>tại</span></div><div><span class='hl-green'>in</span> = <span class='p-mean'>trong (in sleeping bags)</span></div>
 <div><span class='p-word'>under</span> = <span class='p-mean'>dưới</span></div><div><span class='p-word'>behind</span> = <span class='p-mean'>phía sau</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Ngủ TRONG túi ngủ → "sleep IN their sleeping bags".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>at/under/behind sai nghĩa với việc chui vào trong túi ngủ.</span></li></ol>`},
{sec:"III",num:11,type:"mcq",
 q:"11. ______ place do you want to visit next summer?",
 disp:["Where","Which","Who","When"],answer:"Which",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Bạn muốn đến thăm nơi nào vào mùa hè tới?</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>Where</span> = <span class='p-mean'>ở đâu (không đi với danh từ)</span></div><div><span class='hl-green'>Which</span> = <span class='p-mean'>nào (Which + N)</span></div>
 <div><span class='p-word'>Who</span> = <span class='p-mean'>ai</span></div><div><span class='p-word'>When</span> = <span class='p-mean'>khi nào</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Ngay sau chỗ trống là danh từ "place" → dùng "Which + danh từ" (Which place = nơi nào).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Where/Who/When đứng một mình, không đi kèm danh từ "place".</span></li></ol>
 <div class="tip">🧠 Nhớ: Which + danh từ (Which place/city/one).</div>`},
{sec:"III",num:12,type:"mcq",
 q:"12. Sally ______ packs suncream before travelling. She never forgets to bring it.",
 disp:["often","always","sometimes","usually"],answer:"always",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Sally luôn mang theo kem chống nắng trước khi đi du lịch. Cô ấy không bao giờ quên mang nó.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>often</span> = <span class='p-mean'>thường xuyên</span></div><div><span class='hl-green'>always</span> = <span class='p-mean'>luôn luôn</span></div>
 <div><span class='p-word'>sometimes</span> = <span class='p-mean'>thỉnh thoảng</span></div><div><span class='p-word'>usually</span> = <span class='p-mean'>thường lệ</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"never forgets to bring it" (không bao giờ quên mang) = LUÔN LUÔN mang theo → "always packs".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>often/sometimes/usually không mạnh bằng "always" — không khớp với "không bao giờ quên".</span></li></ol>`},
{sec:"III",num:13,type:"mcq",
 q:"13. It's very wrong to ______ in public places like parks or squares.",
 disp:["visit","walk","join","litter"],answer:"litter",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Xả rác ở những nơi công cộng như công viên hay quảng trường là rất sai trái.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>visit</span> = <span class='p-mean'>thăm</span></div><div><span class='p-word'>walk</span> = <span class='p-mean'>đi bộ</span></div>
 <div><span class='p-word'>join</span> = <span class='p-mean'>tham gia</span></div><div><span class='hl-green'>litter</span> = <span class='p-mean'>xả rác</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"very wrong" (rất sai trái) → hành động xấu → "litter" (xả rác) ở nơi công cộng.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>visit/walk/join không phải hành động "sai trái" ở nơi công cộng.</span></li></ol>`},
{sec:"III",num:14,type:"mcq",
 q:"14. Many people do paintings at this hill because of its beautiful ______.",
 disp:["country","wonder","landscape","island"],answer:"landscape",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Nhiều người vẽ tranh ở ngọn đồi này vì phong cảnh đẹp của nó.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>country</span> = <span class='p-mean'>đất nước</span></div><div><span class='p-word'>wonder</span> = <span class='p-mean'>kỳ quan</span></div>
 <div><span class='hl-green'>landscape</span> = <span class='p-mean'>phong cảnh</span></div><div><span class='p-word'>island</span> = <span class='p-mean'>hòn đảo</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Vẽ tranh ở ngọn đồi vì "beautiful landscape" (phong cảnh đẹp) → hợp nhất.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>country/wonder/island không phải lý do trực tiếp để "vẽ tranh ở một ngọn đồi".</span></li></ol>`},
{sec:"III",num:15,type:"mcq",
 q:"15. During the festival, you can ______ in lots of fun activities.",
 disp:["go","look","make","join"],answer:"join",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Trong lễ hội, bạn có thể tham gia vào rất nhiều hoạt động vui nhộn.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='p-word'>go</span> = <span class='p-mean'>đi</span></div><div><span class='p-word'>look</span> = <span class='p-mean'>nhìn</span></div>
 <div><span class='p-word'>make</span> = <span class='p-mean'>làm</span></div><div><span class='hl-green'>join</span> = <span class='p-mean'>tham gia (join in)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"join IN + hoạt động" = tham gia vào hoạt động. "join in lots of fun activities".</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>go/look/make không đi với "in ... activities" theo nghĩa tham gia.</span></li></ol>
 <div class="tip">🧠 Nhớ: join IN + activities = tham gia vào các hoạt động.</div>`},
{sec:"III",num:16,type:"mcq",
 q:"16. Visitors ______ the animals in the zoo. It's not good for them.",
 disp:["mustn't feed","must feed","mustn't feeding","must feeding"],answer:"mustn't feed",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Du khách không được cho động vật trong sở thú ăn. Điều đó không tốt cho chúng.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>mustn't feed</span> = <span class='p-mean'>không được cho ăn ✔</span></div><div><span class='p-word'>must feed</span> = <span class='p-mean'>phải cho ăn (ngược)</span></div>
 <div><span class='p-word'>mustn't feeding</span> = <span class='p-mean'>sai (must + V-ing)</span></div><div><span class='p-word'>must feeding</span> = <span class='p-mean'>sai</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"It's not good for them" (không tốt cho chúng) → CẤM → "mustn't feed". Sau "must/mustn't" dùng động từ nguyên mẫu.</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>"must feed" (phải cho ăn) ngược nghĩa; "mustn't feeding/must feeding" sai vì sau must không dùng V-ing.</span></li></ol>
 <div class="tip">🧠 Nhớ: must/mustn't + V nguyên mẫu (mustn't feed).</div>`},
{sec:"III",num:17,type:"mcq",
 q:"17. The weather today is great for a(n) ______ picnic.",
 disp:["outdoor","active","natural","faraway"],answer:"outdoor",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Thời tiết hôm nay rất tuyệt cho một buổi dã ngoại ngoài trời.</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="grid2">
 <div><span class='hl-green'>outdoor</span> = <span class='p-mean'>ngoài trời</span></div><div><span class='p-word'>active</span> = <span class='p-mean'>năng động</span></div>
 <div><span class='p-word'>natural</span> = <span class='p-mean'>tự nhiên</span></div><div><span class='p-word'>faraway</span> = <span class='p-mean'>xa xôi</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"picnic" (dã ngoại) thường diễn ra ở ngoài trời, và "thời tiết đẹp" → "outdoor picnic" (dã ngoại ngoài trời).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>active/natural/faraway không phải cách mô tả tự nhiên cho "picnic" khi trời đẹp.</span></li></ol>`},
{sec:"III",num:18,type:"mcq",
 q:'18. Robert: "What time can we meet?" – Abby: "______"',
 disp:["How about 4 o'clock?","That's fine.","Yes, let's.","Sure, we can go there."],answer:"How about 4 o'clock?",
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Robert: "Mấy giờ chúng ta gặp nhau được?" – Abby: "Khoảng 4 giờ nhé?"</div>
 <ol><li><span class="stp">🔹 Bước 2 – Phân tích:</span><div class="gcol">
 <div><span class='hl-green'>A. How about 4 o'clock?</span> = <span class='p-mean'>Khoảng 4 giờ nhé? (đề xuất GIỜ) ✔</span></div>
 <div><span class='p-word'>B. That's fine.</span> = <span class='p-mean'>Được đấy. (không nêu giờ)</span></div>
 <div><span class='p-word'>C. Yes, let's.</span> = <span class='p-mean'>Ừ, làm thôi. (đáp lời rủ)</span></div>
 <div><span class='p-word'>D. Sure, we can go there.</span> = <span class='p-mean'>Chắc rồi, ta đến đó được. (nói về nơi chốn)</span></div></div></li>
 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>Robert hỏi "What time?" (mấy giờ) → phải trả lời bằng một MỐC GIỜ → "How about 4 o'clock?"</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>B, C, D không nêu ra thời gian cụ thể như câu hỏi yêu cầu.</span></li></ol>`},

 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>This area (đúng), is (đúng), seafood (hải sản – đúng). Chỉ "by" sai giới từ.</span></li></ol>

{sec:"IV",num:20,type:"error",
 q:"20. <u>When</u> we go <u>hiking</u>, a backpack is <u>more</u> convenient <u>then</u> a suitcase.",
 parts:["When","hiking","more","then"],correctLetter:3,corrAccept:["than"],

 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>When (đúng), hiking (đi bộ đường dài – đúng), more convenient (tiện hơn – đúng). Chỉ "then" sai.</span></li></ol>

 parts:["Can","get","a milk","from"],correctLetter:2,corrAccept:["some milk","some","milk"],

 <li><span class="stp">🔹 Bước 3 – Vì sao ĐÚNG:</span> <span class='p-grammar'>"milk" là danh từ KHÔNG đếm được → không dùng "a milk". Phải dùng "some milk" (một ít sữa).</span></li>
 <li><span class="stp">🔹 Bước 4 – Loại SAI:</span> <span class='p-grammar'>Can you (đúng), get (lấy – đúng), from the fridge (từ tủ lạnh – đúng). Chỉ "a milk" sai.</span></li></ol>

/* ===== A.V WORD FORM ===== */
{sec:"V",head:"A. CHIA DẠNG TỪ — Chia đúng dạng của từ trong ngoặc. (Gõ vào ô)",num:22,type:"fill",
 q:"22. Being in ______ sunlight in the morning is good for your health. (nature)",
 accept:["natural"],
 exp:`<div class="vnt">🔹 Bước 1 – Dịch: Tắm ánh nắng tự nhiên vào buổi sáng thì tốt cho sức khỏe.</div>

/* ===== AUDIO ===== */
let AC;function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function ding(){const c=ac(),n=c.currentTime;[880,1320,1760].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,n+i*.08);g.gain.linearRampToValueAtTime(.25,n+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.4);o.start(n+i*.08);o.stop(n+i*.08+.42)})}
function buzz(){const c=ac(),n=c.currentTime;[300,220,160].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,n+i*.13);g.gain.exponentialRampToValueAtTime(.001,n+i*.13+.12);o.start(n+i*.13);o.stop(n+i*.13+.13)})}
function confetti(){const cv=document.createElement('canvas');cv.className='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const ctx=cv.getContext('2d'),cols=['#a3e635','#0891b2','#0e9f6e','#00D26A','#43e97b','#38f9d7'],P=[];for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,r:6+Math.random()*7,c:cols[i%cols.length],vy:3+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4});let t=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);t++;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore()});if(t<130)requestAnimationFrame(loop);else cv.remove()})()}

/* ===== HELPERS ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return(s||'').toLowerCase().replace(/won['’]t/g,'will not').replace(/can['’]t/g,'can not').replace(/n['’]t/g,' not').replace(/['’]/g,'').replace(/[.,!?;:"…\/–-]/g,' ').replace(/\s+/g,' ').trim()}
const state={};let answered=0;const TOTAL=DATA.length;
function updateProg(){document.getElementById('progtxt').textContent=answered+' / '+TOTAL;document.getElementById('progfill').style.width=(answered/TOTAL*100)+'%'}

/* ===== RENDER ===== */
const quiz=document.getElementById('quiz');
DATA.forEach((it,idx)=>{
  if(it.head){const s=document.createElement('div');s.className='sec';s.innerHTML=`<div class="num">${it.sec}</div><h2>${it.head}</h2>`;quiz.appendChild(s)}
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">${it.q.replace(/^\d+\.\s*/,'')}</div></div>`;
  const zone=document.createElement('div');card.appendChild(zone);
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=it.exp;card.appendChild(exp);
  quiz.appendChild(card);
  if(it.type==='mcq')renderMCQ(it,idx,zone,exp);
  else if(it.type==='fill'||it.type==='rearrange')renderFill(it,idx,zone,exp);
  else if(it.type==='rewrite')renderRewrite(it,idx,zone,exp);
  else if(it.type==='error')renderError(it,idx,zone,exp);
});
updateProg();
function markDone(idx,ok){if(!state[idx]){state[idx]=ok?'ok':'no';answered++;updateProg()}}
function renderMCQ(it,idx,zone,exp){
  const wrap=document.createElement('div');wrap.className='opts';
  shuffle(it.disp).forEach(txt=>{
    const b=document.createElement('div');b.className='opt';b.innerHTML=txt;
    b.onclick=()=>{if(state[idx])return;const all=wrap.querySelectorAll('.opt');all.forEach(x=>x.classList.add('locked'));
      if(txt===it.answer){b.classList.add('correct');ding();confetti();markDone(idx,true)}
      else{b.classList.add('wrong','shake');buzz();markDone(idx,false);all.forEach(x=>{if(x.innerHTML===it.answer)x.classList.add('correct');else if(x!==b)x.classList.add('dim')});setTimeout(()=>b.classList.remove('shake'),450)}
      exp.classList.add('open')};
    wrap.appendChild(b)});
  zone.appendChild(wrap);
}
function renderFill(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Nhập đáp án...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  const acc=it.accept.map(norm);
  function check(){if(state[idx])return;const ok=acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderRewrite(it,idx,zone,exp){
  const row=document.createElement('div');row.className='fillrow';
  const pre=document.createElement('span');pre.className='prefix';pre.textContent=it.prefix+' ...';
  const inp=document.createElement('input');inp.className='tin';inp.placeholder='Gõ tiếp phần còn lại...';
  const btn=document.createElement('button');btn.className='btn-check';btn.textContent='Kiểm tra';
  row.appendChild(pre);row.appendChild(inp);row.appendChild(btn);zone.appendChild(row);
  const contN=it.accept.map(norm),preN=norm(it.prefix),fullN=it.accept.map(a=>norm(it.prefix+' '+a));
  function check(){if(state[idx])return;let inN=norm(inp.value),stripped=inN;
    if(inN.startsWith(preN+' '))stripped=inN.slice(preN.length).trim();else if(inN===preN)stripped='';
    const ok=contN.includes(inN)||contN.includes(stripped)||fullN.includes(inN);inp.disabled=true;btn.disabled=true;
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');row.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>row.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
function renderError(it,idx,zone,exp){
  const q=document.createElement('div');q.className='err-parts';let lb=it.q.replace(/^\d+\.\s*/,'');let li=0;const L=['A','B','C','D'];
  lb=lb.replace(/<u>(.*?)<\/u>/g,(m,g)=>`<b>(${L[li++]})</b> <u>${g}</u>`);q.innerHTML=lb;zone.appendChild(q);
  const letters=document.createElement('div');letters.className='letters';
  const corr=document.createElement('div');corr.className='corrbox';const acc=it.corrAccept.map(norm);let chosen=null;
  L.forEach((lab,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=lab;
    b.onclick=()=>{if(state[idx])return;letters.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');chosen=i;corr.classList.add('show');corr.querySelector('input').focus()};letters.appendChild(b)});
  zone.appendChild(letters);
  corr.innerHTML=`<div class="fillrow"><span class="prefix">Sửa thành:</span><input class="tin" placeholder="Gõ từ đúng..."><button class="btn-check">Kiểm tra</button></div>`;
  zone.appendChild(corr);const inp=corr.querySelector('input'),btn=corr.querySelector('button');
  function check(){if(state[idx])return;if(chosen===null){corr.classList.add('shake');buzz();setTimeout(()=>corr.classList.remove('shake'),450);return}
    const ok=(chosen===it.correctLetter)&&acc.includes(norm(inp.value));inp.disabled=true;btn.disabled=true;
    letters.querySelectorAll('.lbtn').forEach(x=>{x.classList.add('locked');x.classList.remove('sel')});letters.children[it.correctLetter].classList.add('correct');if(chosen!==it.correctLetter)letters.children[chosen].classList.add('wrong');
    if(ok){inp.classList.add('ok');ding();confetti();markDone(idx,true)}else{inp.classList.add('no');corr.classList.add('shake');buzz();markDone(idx,false);setTimeout(()=>corr.classList.remove('shake'),450)}exp.classList.add('open')}
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
}
/* ===== SUBMIT ===== */
function openName(){document.getElementById('nameMask').classList.add('show');setTimeout(()=>document.getElementById('nameInput').focus(),100)}
function doSubmit(){const inp=document.getElementById('nameInput'),w=document.getElementById('nameWarn'),name=inp.value.trim();
  if(!name){inp.classList.add('err');w.textContent='⚠️ Con hãy nhập tên trước nhé!';return}inp.classList.remove('err');w.textContent='';document.getElementById('nameMask').classList.remove('show');showResult(name)}
function showResult(name){let correct=0;for(let i=0;i<TOTAL;i++)if(state[i]==='ok')correct++;const pct=correct/TOTAL,s10=(pct*10).toFixed(2);let greet,msg,fb,gif;
  if(pct===1){greet='🌟 THIÊN TÀI! '+name+' xuất sắc tuyệt đối!';msg='Hoàn hảo 100%! Con là nhà thám hiểm cừ khôi! 🏆';fb='🏆🏔️🥳';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif'}
  else if(pct>=0.6){greet='👏 GIỎI LẮM, '+name+'!';msg='Con làm rất tốt, cố thêm chút nữa nhé! ✨';fb='😄👍🙌';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif'}
  else{greet='💪 CỐ LÊN NHÉ, '+name+'!';msg='Đừng buồn, xem lại giải thích rồi làm lại nha! 🌿';fb='😢🥺💧';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif'}
  document.getElementById('resGreet').textContent=greet;document.getElementById('resScore').textContent=correct+' / '+TOTAL+' câu đúng';
  document.getElementById('resScore10').textContent='📊 Điểm quy đổi: '+s10+' / 10';document.getElementById('resMsg').textContent=msg;
  const im=document.getElementById('resMeme'),fbEl=document.getElementById('resFallback');fbEl.textContent=fb;fbEl.style.display='none';im.style.display='none';
  im.onload=()=>{im.style.display='block';fbEl.style.display='none'};im.onerror=()=>{im.style.display='none';fbEl.style.display='block'};im.src=gif;
  setTimeout(()=>{if(!im.complete||im.naturalWidth===0){im.style.display='none';fbEl.style.display='block'}},2500);
  document.getElementById('resMask').classList.add('show');if(pct>=0.6){confetti();ding()}}
/* ===== FLOATS ===== */
(function(){const icons=['🏞️','🏔️','🌊','💧','🏝️','🌴','🦋','🍃','🗻','🏕️'];const p=document.getElementById('pattern');
  for(let i=0;i<10;i++){const s=document.createElement('span');s.className='float';s.textContent=icons[i%icons.length];s.style.left=Math.random()*100+'%';s.style.animationDuration=(18+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*24)+'s';s.style.fontSize=(1.5+Math.random()*1.6)+'rem';p.appendChild(s)}})();
</script>
