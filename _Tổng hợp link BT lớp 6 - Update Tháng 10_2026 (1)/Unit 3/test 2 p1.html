<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 3 · My Friends — TEST 2</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pur:#8b5cf6; --pink:#ec4899; --sky:#60a5fa; --mint:#34d399; --lav:#c4b5fd; --sun:#fcd34d;
  --green:#12b76a; --wrong:#ef4444; --blue:#2563eb; --purpleT:#6a3fd6; --terra:#c2410c; --grammar:#e11d48; --ink:#3a2b52;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(-45deg,#c4b5fd,#f9a8d4,#a5b4fc,#a7f3d0,#fbcfe8);
  background-size:400% 400%;animation:bgmove 22s ease infinite;overflow-x:hidden;}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaties span{position:absolute;font-size:1.7rem;opacity:.6;animation:float linear infinite,tw 3s ease-in-out infinite}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.85}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 80px}
.head{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:rgba(255,255,255,.85);border:2px solid var(--pur);color:var(--pur);font-weight:800;font-size:.8rem;padding:5px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(139,92,246,.3)}
.title{margin-top:12px;font-family:'Comfortaa';font-weight:700;font-size:1.7rem;color:#fff;text-shadow:0 0 10px rgba(236,72,153,.7),0 0 22px rgba(139,92,246,.6)}
.sub{display:inline-block;margin-top:8px;background:rgba(255,255,255,.85);border:2px solid var(--pink);border-radius:12px;padding:3px 12px;font-weight:800;color:var(--pink)}
.progbar{height:14px;background:rgba(255,255,255,.75);border:2px solid var(--pur);border-radius:20px;margin:16px 0;overflow:hidden}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--pur),var(--pink),var(--sun));transition:width .4s}
.sec{margin:26px 0 12px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border-radius:14px;padding:10px 16px;font-family:'Comfortaa';font-weight:700;font-size:1rem;box-shadow:0 6px 18px rgba(139,92,246,.4)}
.card{background:rgba(255,255,255,.95);border:2px solid #e6dcff;border-radius:18px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 8px 24px rgba(139,92,246,.22)}
.qnum{display:inline-block;background:linear-gradient(135deg,var(--pur),var(--pink));color:#fff;font-family:'Comfortaa';font-weight:700;border-radius:11px;padding:2px 10px;font-size:.82rem;margin-right:8px}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.5;display:inline}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px}
.hint{font-size:.85rem;color:#7c3aed;font-weight:800;margin-top:8px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:#fbf7ff;border:2px solid #ddd0f7;border-radius:14px;padding:13px 12px;font-family:'Nunito';font-size:1.08rem;font-weight:800;color:#5b3a9e;cursor:pointer;box-shadow:0 5px 0 #e8dffb;transition:transform .12s;text-align:center}
.opt:nth-child(2n){background:#fff5fa;border-color:#fbc9e2;box-shadow:0 5px 0 #fcdcec;color:#b3327a}
.opt:hover:not(:disabled){transform:scale(1.04)}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green)!important;border-color:#0a8a4f!important;color:#fff!important;box-shadow:0 5px 0 #0a8a4f!important}
.opt.wrong{background:var(--wrong)!important;border-color:#b91c1c!important;color:#fff!important;box-shadow:0 5px 0 #b91c1c!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.tin{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tin input{flex:1;min-width:180px;font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:11px 14px;border-radius:12px;border:2px solid #ddd0f7;background:#fdfbff;color:var(--ink)}
.tin input:focus{outline:none;border-color:var(--pur)}
.tin input.ok{border-color:var(--green);background:#e7fff1}
.tin input.no{border-color:var(--wrong);background:#ffecee}
.btnc{background:linear-gradient(135deg,var(--pur),var(--pink));color:#fff;border:none;border-radius:12px;padding:11px 20px;font-family:'Comfortaa';font-weight:700;font-size:.95rem;cursor:pointer;box-shadow:0 5px 0 #6d28d9;transition:transform .12s}
.btnc:hover:not(:disabled){transform:scale(1.05)} .btnc:disabled{opacity:.55;cursor:default}
.letters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lbtn{width:48px;height:48px;border-radius:12px;border:2px solid #ddd0f7;font-family:'Comfortaa';font-weight:700;font-size:1.1rem;cursor:pointer;background:#f3ecff;color:var(--pur);box-shadow:0 4px 0 #e8dffb;transition:transform .12s}
.lbtn:hover:not(:disabled){transform:scale(1.08)}
.lbtn.sel{background:var(--sun);color:#7a5a00}
.lbtn.correct{background:var(--green);color:#fff;border-color:#0a8a4f}
.lbtn.wrong{background:var(--wrong);color:#fff;border-color:#b91c1c}
.lbtn:disabled{cursor:default}
.mark{background:#fce7f3;border-radius:6px;padding:0 4px;font-weight:800}
.mark sup{color:var(--pink);font-family:'Comfortaa';font-size:.7rem}
.exp{margin-top:14px;max-height:0;overflow:hidden;transition:max-height .5s ease;font-size:1rem}
.exp.open{max-height:1700px}
.expin{background:#fdfbff;border:2px dashed #d3c4f5;border-radius:12px;padding:14px}
.exp ol{margin:6px 0 0 20px} .exp li{margin:8px 0;line-height:1.55}
.vnt{background:#fff2e0;border-left:5px solid var(--terra);border-radius:10px;padding:8px 12px;font-weight:800;color:#7a3e00;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0}
.grid2>div{line-height:1.5}
.p-word{color:var(--blue);font-weight:800}
.hl-green{color:#088a3c;font-weight:900}
.hl-red{color:var(--wrong);font-weight:900}
.wt{background:#ece3ff;color:var(--purpleT);border-radius:6px;padding:0 6px;font-size:.78rem;font-weight:800}
.p-phonetic{color:var(--purpleT);background:#f0e9ff;border-radius:6px;padding:0 6px;font-weight:700}
.p-mean{color:var(--terra);font-weight:800}
.p-grammar{border-bottom:2.5px solid var(--grammar);color:#7a1030;font-weight:800}
.keyline{background:#e7fff1;border:2px solid #a7e0bd;border-radius:10px;padding:8px 12px;font-weight:800;color:#066b34;margin-bottom:8px}
.submit{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,var(--pur),var(--pink));color:#fff;border:none;border-radius:18px;padding:18px;font-family:'Comfortaa';font-weight:700;font-size:1.2rem;cursor:pointer;box-shadow:0 8px 0 #6d28d9}
.submit:hover{transform:scale(1.02)}
.overlay{position:fixed;inset:0;background:rgba(40,20,60,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border:2px solid var(--pur);border-radius:22px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 44px rgba(139,92,246,.6);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Comfortaa';font-weight:700;font-size:1.35rem;color:var(--pur);margin-bottom:12px}
.modal input{width:100%;padding:14px;border-radius:12px;border:2px solid #ddd0f7;font-size:1.05rem;font-family:'Nunito';font-weight:700;margin-bottom:6px}
.modal input.err{border-color:var(--wrong);background:#ffecee}
.errmsg{color:var(--wrong);font-weight:800;font-size:.9rem;min-height:20px;margin-bottom:8px}
.modal button{background:linear-gradient(135deg,var(--pur),var(--pink));color:#fff;border:none;border-radius:12px;padding:12px 26px;font-family:'Comfortaa';font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 #6d28d9}
.rgreet{font-family:'Comfortaa';font-weight:700;font-size:1.3rem;color:var(--pur);line-height:1.4}
.rscore{font-family:'Comfortaa';font-weight:700;font-size:2.2rem;color:var(--ink);margin:8px 0}
.rten{font-size:1.5rem;font-weight:900;color:var(--pink);margin-bottom:12px}
.rmeme{width:100%;max-width:280px;border-radius:14px;margin:0 auto 14px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2);min-height:120px;object-fit:cover}
.memefall{font-size:5rem}
@media(max-width:560px){.opts,.grid2{grid-template-columns:1fr}.title{font-size:1.4rem}}
</style>
</head>
<body>
<div class="floaties" id="floaties"></div>
<div class="wrap">
  <div class="head">
    <div class="badge">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên</div>
    <div class="title">✨ My Friends</div>
    <div><span class="sub">UNIT 3 · TEST 2 — Phần A (I–VI) &amp; C (I–III)</span></div>
    <div class="progbar"><div class="progfill" id="prog"></div></div>
  </div>
  <div id="quiz"></div>
  <button class="submit" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="overlay" id="nameOv">
  <div class="modal">
    <h2>✍️ Nhập tên của em nhé!</h2>
    <input id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
    <div class="errmsg" id="nameErr"></div>
    <button onclick="showResult()">Xem kết quả 🚀</button>
  </div>
</div>
<div class="overlay" id="resOv">
  <div class="modal">
    <div class="rgreet" id="rGreet"></div>
    <div class="rscore" id="rScore"></div>
    <div class="rten" id="rTen"></div>
    <img class="rmeme" id="rMeme" alt="result">
    <div class="memefall" id="rFall" style="display:none"></div>
    <button onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
(function(){
  const ico=['👫','👭','👬','🤝','😄','🎈','⭐','🌈','💛','😎','🎉','👋'];
  const f=document.getElementById('floaties');
  for(let i=0;i<18;i++){const s=document.createElement('span');
    s.textContent=ico[i%ico.length];s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(15+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(1.4+Math.random()*1.7)+'rem';f.appendChild(s);}
})();
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=i?1318:988;o.connect(g);g.connect(c.destination);
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);
  g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.4);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function confetti(){const cols=['#8b5cf6','#ec4899','#60a5fa','#34d399','#fcd34d','#c4b5fd'];
  for(let i=0;i<70;i++){const d=document.createElement('div');
    d.style.cssText='position:fixed;z-index:99;width:10px;height:14px;top:-20px;pointer-events:none;border-radius:2px;';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1500+Math.random()*1500,x=(Math.random()-.5)*300;
    d.animate([{transform:d.style.transform,opacity:1},
      {transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:0}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[.,?!;:'"’\-]/g,' ').replace(/\s+/g,' ').trim();}
function matchWriting(input,answers){const ni=norm(input);if(!ni)return false;
  for(const a of answers){const na=norm(a);if(ni===na)return true;
    if(na.includes(ni)&&ni.length>=na.length*0.5)return true;if(ni.includes(na))return true;}return false;}
let TOTAL=0,correctCount=0,answered=0;
function updateProg(){document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';}

/* ============================================================
   DATA — Unit 3 · MY FRIENDS · TEST 2 · A(I–VI) + C(I–III)
   ============================================================ */
const Q=[];
function sec(t){Q.push({sec:t});}
function mcq(num,q,opts,correctIdx,exp){Q.push({type:'mcq',num,q,opts,correctIdx,exp});}
function txt(num,q,ans,exp,hint){Q.push({type:'txt',num,q,ans,exp,hint});}
function cor(num,q,parts,cIdx,corr,exp){Q.push({type:'cor',num,q,parts,cIdx,corr,exp});}

/* ---------- A. I. Pronunciation ---------- */
sec("A. LANGUAGE FOCUS · I. Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại");
mcq(1,"Chọn từ có phần gạch chân được phát âm khác:",
 ["thum<u>b</u>","year<u>b</u>ook","clu<u>b</u>","<u>b</u>ring"],0,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "b" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>thumb</span> <span class='p-phonetic'>/θʌm/</span> = <span class='p-mean'>ngón cái</span> → b CÂM (∅)</div>
 <div><span class='p-word'>yearbook</span> <span class='p-phonetic'>/ˈjɪəbʊk/</span> = <span class='p-mean'>kỷ yếu</span> → /b/</div>
 <div><span class='p-word'>club</span> <span class='p-phonetic'>/klʌb/</span> = <span class='p-mean'>câu lạc bộ</span> → /b/</div>
 <div><span class='p-word'>bring</span> <span class='p-phonetic'>/brɪŋ/</span> = <span class='p-mean'>mang đến</span> → /b/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"thumb" có "b" CÂM (không đọc): /θʌm/. Ba từ kia "b" đọc /b/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>yearbook, club, bring đều phát âm /b/ rõ ràng.</span></li></ol>`);
mcq(2,"Chọn từ có phần gạch chân được phát âm khác:",
 ["<u>e</u>mail","l<u>e</u>g","h<u>e</u>lp","cl<u>e</u>ver"],0,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "e" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>email</span> <span class='p-phonetic'>/ˈiːmeɪl/</span> = <span class='p-mean'>thư điện tử</span> → /iː/</div>
 <div><span class='p-word'>leg</span> <span class='p-phonetic'>/leɡ/</span> = <span class='p-mean'>chân</span> → /e/</div>
 <div><span class='p-word'>help</span> <span class='p-phonetic'>/help/</span> = <span class='p-mean'>giúp đỡ</span> → /e/</div>
 <div><span class='p-word'>clever</span> <span class='p-phonetic'>/ˈklevə/</span> = <span class='p-mean'>thông minh</span> → /e/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"email" có "e" đọc dài /iː/. Ba từ kia "e" đọc ngắn /e/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>leg, help, clever đều /e/ nên giống nhau.</span></li></ol>`);
mcq(3,"Chọn từ có phần gạch chân được phát âm khác:",
 ["l<u>a</u>zy","p<u>a</u>tient","sh<u>a</u>pe","h<u>a</u>nd"],3,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "a" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>lazy</span> <span class='p-phonetic'>/ˈleɪzi/</span> = <span class='p-mean'>lười biếng</span> → /eɪ/</div>
 <div><span class='p-word'>patient</span> <span class='p-phonetic'>/ˈpeɪʃnt/</span> = <span class='p-mean'>kiên nhẫn</span> → /eɪ/</div>
 <div><span class='p-word'>shape</span> <span class='p-phonetic'>/ʃeɪp/</span> = <span class='p-mean'>hình dạng</span> → /eɪ/</div>
 <div><span class='hl-green'>hand</span> <span class='p-phonetic'>/hænd/</span> = <span class='p-mean'>bàn tay</span> → /æ/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"hand" có "a" đọc /æ/ (ngắn). Ba từ kia "a" đọc /eɪ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>lazy, patient, shape đều /eɪ/ nên giống nhau.</span></li></ol>`);

/* ---------- A. II. Stress ---------- */
sec("A. LANGUAGE FOCUS · II. Chọn từ có TRỌNG ÂM khác các từ còn lại");
mcq(4,"Chọn từ có trọng âm khác:",
 ["shoulder","pretty","curly","canteen"],3,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>SHOUL-der</span> <span class='wt'>n</span> = <span class='p-mean'>vai</span> → âm 1</div>
 <div><span class='p-word'>PRET-ty</span> <span class='wt'>adj</span> = <span class='p-mean'>xinh xắn</span> → âm 1</div>
 <div><span class='p-word'>CUR-ly</span> <span class='wt'>adj</span> = <span class='p-mean'>xoăn</span> → âm 1</div>
 <div><span class='hl-green'>can-TEEN</span> <span class='wt'>n</span> = <span class='p-mean'>căng tin</span> → âm 2</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"canteen" nhấn âm tiết THỨ HAI. Ba từ kia nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>shoulder, pretty, curly đều nhấn âm tiết 1.</span></li></ol>`);
mcq(5,"Chọn từ có trọng âm khác:",
 ["personality","badminton","confident","generous"],0,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>per-so-NA-li-ty</span> <span class='wt'>n</span> = <span class='p-mean'>tính cách</span> → âm 3</div>
 <div><span class='p-word'>BAD-min-ton</span> <span class='wt'>n</span> = <span class='p-mean'>cầu lông</span> → âm 1</div>
 <div><span class='p-word'>CON-fi-dent</span> <span class='wt'>adj</span> = <span class='p-mean'>tự tin</span> → âm 1</div>
 <div><span class='p-word'>GEN-er-ous</span> <span class='wt'>adj</span> = <span class='p-mean'>hào phóng</span> → âm 1</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"personality" nhấn âm tiết THỨ BA. Ba từ kia nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>badminton, confident, generous đều nhấn âm tiết 1.</span></li></ol>`);

/* ---------- A. III. ---------- */
sec("A. LANGUAGE FOCUS · III. Chọn từ/cụm từ phù hợp nhất");
mcq(6,"She's playing with her brother _____ the moment.",
 ["on","at","of","in"],1,
 `<div class="vnt">💬 Dịch: Cô ấy đang chơi với anh trai vào lúc này.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2"><div><span class='p-word'>on</span></div><div><span class='hl-green'>at</span></div><div><span class='p-word'>of</span></div><div><span class='p-word'>in</span></div></div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định: AT the moment = vào lúc này (dấu hiệu hiện tại tiếp diễn).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>on/of/in the moment đều sai giới từ.</span></li></ol>`);
mcq(7,"Mrs Golds always _____ attention to what she wears.",
 ["lends","makes","pays","does"],2,
 `<div class="vnt">💬 Dịch: Bà Golds luôn chú ý đến trang phục mình mặc.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>lends</span> = <span class='p-mean'>cho mượn</span></div><div><span class='p-word'>makes</span> = <span class='p-mean'>làm/tạo ra</span></div>
 <div><span class='hl-green'>pays</span> = <span class='p-mean'>trả/chú ý</span></div><div><span class='p-word'>does</span> = <span class='p-mean'>làm</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cụm cố định "pay attention to" = chú ý đến.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>lend/make/do không đi với "attention".</span></li></ol>`);
mcq(8,"My aunt Helen has _____ eyes.",
 ["big blue","blue big","big blonde","blonde big"],0,
 `<div class="vnt">💬 Dịch: Dì Helen của tôi có đôi mắt to màu xanh.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>big blue</span> = <span class='p-mean'>kích cỡ + màu (đúng thứ tự)</span></div>
 <div><span class='p-word'>blue big</span> = <span class='p-mean'>sai thứ tự</span></div>
 <div><span class='p-word'>big blonde</span> = <span class='p-mean'>"blonde" tả tóc, không tả mắt</span></div>

 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trật tự tính từ: KÍCH CỠ trước MÀU SẮC → "big blue eyes".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"blue big" sai thứ tự; "blonde" (vàng hoe) chỉ tả tóc.</span></li></ol>`);
mcq(9,"What do you think are the _____ of a good friend?",
 ["types","grades","interests","qualities"],3,
 `<div class="vnt">💬 Dịch: Bạn nghĩ những phẩm chất của một người bạn tốt là gì?</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>types</span> = <span class='p-mean'>loại</span></div><div><span class='p-word'>grades</span> = <span class='p-mean'>điểm số</span></div>
 <div><span class='p-word'>interests</span> = <span class='p-mean'>sở thích</span></div><div><span class='hl-green'>qualities</span> = <span class='p-mean'>phẩm chất</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"qualities of a good friend" = phẩm chất của một người bạn tốt.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>types/grades/interests không hợp nghĩa "phẩm chất của bạn tốt".</span></li></ol>`);
mcq(10,"My grandpa _____ home right now. He _____ some friends at the café.",
 ["isn't – meets","isn't – is meeting","isn't being – meets","isn't being – meeting"],1,
 `<div class="vnt">💬 Dịch: Ông tôi hiện không có ở nhà. Ông ấy đang gặp vài người bạn ở quán cà phê.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>isn't – meets</span> = <span class='p-mean'>"meets" sai (đang xảy ra)</span></div>
 <div><span class='hl-green'>isn't – is meeting</span> = <span class='p-mean'>đúng</span></div>
 <div><span class='p-word'>isn't being – meets</span> = <span class='p-mean'>"isn't being" sai</span></div>
 <div><span class='p-word'>isn't being – meeting</span> = <span class='p-mean'>sai cả hai</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"right now" → hành động đang diễn ra: "isn't (at) home" + "is meeting" (đang gặp). "be" ở dạng "isn't", không dùng "isn't being".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"meets" (hiện tại đơn) sai với "right now"; "isn't being" sai dạng.</span></li></ol>`);
mcq(11,"“What does your best friend look like?” – “He's tall and _____.”",
 ["slim","short","long","small"],0,
 `<div class="vnt">💬 Dịch: “Bạn thân của bạn trông như thế nào?” – “Cậu ấy cao và mảnh khảnh.”</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>slim</span> = <span class='p-mean'>mảnh khảnh (tả dáng)</span></div>
 <div><span class='p-word'>short</span> = <span class='p-mean'>thấp (mâu thuẫn với "tall")</span></div>
 <div><span class='p-word'>long</span> = <span class='p-mean'>dài (tả vật)</span></div>
 <div><span class='p-word'>small</span> = <span class='p-mean'>nhỏ</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Tả dáng người đi cùng "tall" → "slim" (cao và mảnh khảnh).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"short" mâu thuẫn với "tall"; long/small không tả dáng người phù hợp.</span></li></ol>`);
mcq(12,"Leo is a _____ student. He always finishes all his homework early.",
 ["hard-working","helpful","kind","confident"],0,
 `<div class="vnt">💬 Dịch: Leo là một học sinh chăm chỉ. Cậu ấy luôn làm xong bài tập sớm.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>hard-working</span> = <span class='p-mean'>chăm chỉ</span></div>
 <div><span class='p-word'>helpful</span> = <span class='p-mean'>hay giúp đỡ</span></div>
 <div><span class='p-word'>kind</span> = <span class='p-mean'>tốt bụng</span></div>
 <div><span class='p-word'>confident</span> = <span class='p-mean'>tự tin</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"luôn làm xong bài tập sớm" → "hard-working" (chăm chỉ).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>helpful/kind/confident không liên quan trực tiếp tới việc chăm làm bài.</span></li></ol>`);
mcq(13,"Lisa and her brother Jim _____ curly hair.",
 ["has","have","are having","is having"],1,
 `<div class="vnt">💬 Dịch: Lisa và anh trai Jim có mái tóc xoăn.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>has</span> = <span class='p-mean'>số ít</span></div>
 <div><span class='hl-green'>have</span> = <span class='p-mean'>số nhiều</span></div>
 <div><span class='p-word'>are having</span> = <span class='p-mean'>sai (have chỉ sở hữu không dùng tiếp diễn)</span></div>
 <div><span class='p-word'>is having</span> = <span class='p-mean'>sai</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chủ ngữ số nhiều "Lisa and Jim" → "have"; "have" chỉ sự sở hữu KHÔNG chia tiếp diễn.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"has" (số ít) sai chủ ngữ; are having/is having sai vì "have" (sở hữu) không dùng tiếp diễn.</span></li></ol>`);
mcq(14,"Ian is friendly, but his sister is very _____. She doesn't talk much.",
 ["confident","shy","loving","kind"],1,
 `<div class="vnt">💬 Dịch: Ian thân thiện, nhưng em gái cậu ấy lại rất nhút nhát. Cô bé ít nói.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>confident</span> = <span class='p-mean'>tự tin</span></div>
 <div><span class='hl-green'>shy</span> = <span class='p-mean'>nhút nhát</span></div>
 <div><span class='p-word'>loving</span> = <span class='p-mean'>yêu thương</span></div>
 <div><span class='p-word'>kind</span> = <span class='p-mean'>tốt bụng</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"doesn't talk much" (ít nói) + "but" (tương phản với friendly) → "shy" (nhút nhát).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>confident/loving/kind không phù hợp với "ít nói".</span></li></ol>`);
mcq(15,"“_____ do you like that book?” – “It has a cool story.”",
 ["How","Who","When","Why"],3,
 `<div class="vnt">💬 Dịch: “Tại sao bạn thích cuốn sách đó?” – “Vì nó có một cốt truyện hay.”</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>How</span> = <span class='p-mean'>như thế nào</span></div><div><span class='p-word'>Who</span> = <span class='p-mean'>ai</span></div>
 <div><span class='p-word'>When</span> = <span class='p-mean'>khi nào</span></div><div><span class='hl-green'>Why</span> = <span class='p-mean'>tại sao</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu trả lời nêu LÝ DO ("It has a cool story") → câu hỏi "Why?" (tại sao).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>How/Who/When không dẫn tới câu trả lời nêu lý do.</span></li></ol>`);
mcq(16,"My _____ favourite thing is this toy carrot. She loves playing with it.",
 ["cats","cat's","cats'","cats's"],1,
 `<div class="vnt">💬 Dịch: Món đồ yêu thích của con mèo nhà tôi là củ cà rốt đồ chơi này. Nó thích chơi với nó lắm.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>cats</span> = <span class='p-mean'>số nhiều (không sở hữu)</span></div>
 <div><span class='hl-green'>cat's</span> = <span class='p-mean'>của con mèo (1 con)</span></div>
 <div><span class='p-word'>cats'</span> = <span class='p-mean'>của nhiều con mèo</span></div>
 <div><span class='p-word'>cats's</span> = <span class='p-mean'>sai dạng</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"She" (một con mèo cái) → sở hữu số ít "cat's" (của con mèo).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"cats" không có sở hữu; "cats'" là nhiều con; "cats's" sai quy tắc.</span></li></ol>`);
mcq(17,"Alex: “_____” – Bobby: “He's eleven.”",
 ["How is your cousin?","Who is your cousin?","How old is your cousin?","What is your cousin like?"],2,
 `<div class="vnt">💬 Dịch: Alex: “Anh/em họ của bạn bao nhiêu tuổi?” – Bobby: “Cậu ấy mười một tuổi.”</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>How is...?</span> = <span class='p-mean'>hỏi sức khỏe</span></div>
 <div><span class='p-word'>Who is...?</span> = <span class='p-mean'>hỏi là ai</span></div>
 <div><span class='hl-green'>How old is...?</span> = <span class='p-mean'>hỏi tuổi</span></div>
 <div><span class='p-word'>What is...like?</span> = <span class='p-mean'>hỏi tính cách</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu trả lời "He's eleven" (11 tuổi) → câu hỏi "How old...?" (bao nhiêu tuổi).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>How (sức khỏe)/Who (là ai)/What...like (tính cách) không dẫn tới câu trả lời về tuổi.</span></li></ol>`);

/* ---------- A. IV. Error correction ---------- */
sec("A. LANGUAGE FOCUS · IV. Tìm lỗi sai — Bấm chọn chữ cái (A–D) của phần SAI, rồi GÕ chữ đúng để sửa");
cor(18,"{There's} a garden {in front of} our house {and} a pool {between} it.",
 ["There's","in front of","and","between"],3,["behind","next to","beside","near"],
 `<div class="vnt">💬 Dịch: Có một khu vườn phía trước nhà chúng tôi và một hồ bơi phía sau nó.</div>
 <div class="keyline">🔑 SỬA: between → <span class="hl-green">behind</span> (a pool behind it)</div>
 <ol>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"between" (ở giữa) cần HAI đối tượng ("between A and B"), nhưng ở đây chỉ có "it" (ngôi nhà).</span></li>
 <li><span class="hl-green">✅ SỬA ĐÚNG:</span> <span class='p-grammar'>Dùng giới từ chỉ một vị trí, ví dụ "behind it" (phía sau nó) / "next to it".</span></li></ol>`);
cor(19,"Suzie {doesn't rarely} play sport, {but} she {is playing} football with her brother {today}.",
 ["doesn't rarely","but","is playing","today"],0,["rarely plays","rarely"],
 `<div class="vnt">💬 Dịch: Suzie hiếm khi chơi thể thao, nhưng hôm nay cô ấy đang chơi bóng đá với anh trai.</div>
 <div class="keyline">🔑 SỬA: doesn't rarely play → <span class="hl-green">rarely plays</span></div>
 <ol>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>"rarely" (hiếm khi) đã mang nghĩa PHỦ ĐỊNH → không dùng thêm "doesn't" (phủ định kép).</span></li>
 <li><span class="hl-green">✅ SỬA ĐÚNG:</span> <span class='p-grammar'>"Suzie rarely plays sport" — trạng từ tần suất "rarely" đứng trước động từ chia hiện tại đơn.</span></li></ol>`);
cor(20,"I love {playing} with {my} cousins when I {visiting} my {grandparents} at weekends.",
 ["playing","my","visiting","grandparents"],2,["visit"],
 `<div class="vnt">💬 Dịch: Tôi thích chơi với anh chị em họ khi tôi thăm ông bà vào cuối tuần.</div>
 <div class="keyline">🔑 SỬA: visiting → <span class="hl-green">visit</span></div>
 <ol>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>Sau "when I" cần động từ chia thì (thói quen → hiện tại đơn), không để "visiting" trơ trọi.</span></li>
 <li><span class="hl-green">✅ SỬA ĐÚNG:</span> <span class='p-grammar'>"...when I visit my grandparents" (khi tôi thăm ông bà — hiện tại đơn).</span></li></ol>`);

/* ---------- A. V. Verb form ---------- */
sec("A. LANGUAGE FOCUS · V. Chia dạng đúng của động từ trong ngoặc (GÕ đáp án)");
txt(21,"Hi Sarah! Where _____ you _____? <b>(go)</b>",
 ["are going","are you going"],
 `<div class="vnt">💬 Dịch: Chào Sarah! Bạn đang đi đâu vậy?</div>
 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">are ... going</span> (Where are you going?)</div>
 <ol>
 <li>Phân tích: <span class='p-word'>are going</span> <span class='wt'>v (present cont.)</span> = <span class='p-mean'>đang đi</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Hỏi việc đang xảy ra → HIỆN TẠI TIẾP DIỄN: Where + are + you + going?</span></li></ol>
 <div class="hint">(Gõ 2 chỗ: are ... going)</div>`,"2 chỗ: Where are you going?");
txt(22,"George usually _____ playing the trumpet after dinner. <b>(practise)</b>",
 ["practises","practices"],
 `<div class="vnt">💬 Dịch: George thường luyện thổi kèn trumpet sau bữa tối.</div>
 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">practises</span></div>
 <ol>
 <li>Phân tích: <span class='p-word'>practises</span> <span class='wt'>v (present simple)</span> = <span class='p-mean'>luyện tập</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "usually" → HIỆN TẠI ĐƠN. "George" (số ít) → thêm -s: practises.</span></li></ol>`,"Chia động từ: practise");
txt(23,"She _____ her mother in the kitchen now. <b>(help)</b>",
 ["is helping"],
 `<div class="vnt">💬 Dịch: Cô ấy đang giúp mẹ trong bếp lúc này.</div>
 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">is helping</span></div>
 <ol>
 <li>Phân tích: <span class='p-word'>is helping</span> <span class='wt'>v (present cont.)</span> = <span class='p-mean'>đang giúp</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "now" → HIỆN TẠI TIẾP DIỄN. "She" → is + V-ing.</span></li></ol>`,"Chia động từ: help");
txt(24,"How often _____ Mrs Black _____ cakes for her child? <b>(make)</b>",
 ["does make","does mrs black make"],
 `<div class="vnt">💬 Dịch: Bà Black bao lâu làm bánh cho con một lần?</div>
 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">does ... make</span> (How often does Mrs Black make...?)</div>
 <ol>
 <li>Phân tích: <span class='p-word'>does make</span> <span class='wt'>v (present simple, câu hỏi)</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"How often" hỏi tần suất → HIỆN TẠI ĐƠN. Chủ ngữ số ít → "does + S + make (nguyên thể)".</span></li></ol>
 <div class="hint">(Gõ 2 chỗ: does ... make)</div>`,"2 chỗ: does ... make");
txt(25,"The children _____ TV at the moment. <b>(not watch)</b>",
 ["aren't watching","are not watching","arent watching"],
 `<div class="vnt">💬 Dịch: Bọn trẻ hiện không xem TV.</div>
 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">aren't watching</span></div>
 <ol>
 <li>Phân tích: <span class='p-word'>aren't watching</span> <span class='wt'>v (present cont. neg)</span></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "at the moment" → HIỆN TẠI TIẾP DIỄN. "The children" (số nhiều) → aren't + V-ing.</span></li></ol>`,"Chia động từ: not watch");

/* ---------- A. VI. Word form ---------- */
sec("A. LANGUAGE FOCUS · VI. Chia dạng đúng của từ trong ngoặc (GÕ đáp án)");
txt(26,"My dad is a _____ driver. He never drives too fast. <b>(care)</b>",
 ["careful"],
 `<div class="vnt">💬 Dịch: Bố tôi là một tài xế cẩn thận. Ông ấy không bao giờ lái quá nhanh.</div>
 <div class="keyline">🔑 ĐÁP ÁN: <span class="hl-green">careful</span></div>

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const quiz=document.getElementById('quiz');
Q.forEach((it)=>{
  if(it.sec){const d=document.createElement('div');d.className='sec';d.textContent=it.sec;quiz.appendChild(d);return;}
  TOTAL++;
  const card=document.createElement('div');card.className='card';card.id='c'+it.num;
  card.innerHTML=`<div><span class="qnum">Câu ${it.num}</span><span class="qtext">${render(it)}</span></div>`;
  if(it.type==='mcq'){
    const wrap=document.createElement('div');wrap.className='opts';
    const arr=it.opts.map((t,i)=>({t,correct:i===it.correctIdx}));shuffle(arr);
    arr.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>pickMcq(it,card,wrap,b,o.correct);wrap.appendChild(b);});
    card.appendChild(wrap);
  }else if(it.type==='txt'){
    if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='('+it.hint+')';card.appendChild(h);}
    const box=document.createElement('div');box.className='tin';
    const inp=document.createElement('input');inp.placeholder='Gõ đáp án của em...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    const act=()=>checkTxt(it,card,inp,btn);
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    box.appendChild(inp);box.appendChild(btn);card.appendChild(box);
  }else if(it.type==='cor'){
    const letters=document.createElement('div');letters.className='letters';
    const L=['A','B','C','D'];let selIdx=-1;
    const inBox=document.createElement('div');inBox.className='tin';inBox.style.display='none';
    const inp=document.createElement('input');inp.placeholder='Gõ chữ ĐÚNG để sửa...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    inBox.appendChild(inp);inBox.appendChild(btn);
    const lbtns=[];
    L.forEach((L_,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=L_;
      b.onclick=()=>{if(card.dataset.done)return;selIdx=i;lbtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        inBox.style.display='flex';inp.focus();};
      lbtns.push(b);letters.appendChild(b);});
    const act=()=>{if(selIdx<0){inp.placeholder='Hãy chọn chữ cái A–D trước!';return;}checkCor(it,card,lbtns,selIdx,inp,btn);};
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    card.appendChild(letters);card.appendChild(inBox);
  }
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=`<div class="expin">${it.exp}</div>`;
  card.appendChild(exp);quiz.appendChild(card);
});
function render(it){
  if(it.type==='cor'){const L=['A','B','C','D'];let s=it.q;
    it.parts.forEach((p,i)=>{s=s.replace('{'+p+'}',`<span class="mark">${p}<sup>${L[i]}</sup></span>`);});return s;}
  return it.q;
}
function openExp(card){card.querySelector('.exp').classList.add('open');}
function lock(card){card.dataset.done='1';answered++;updateProg();}
function pickMcq(it,card,wrap,btn,correct){
  if(card.dataset.done)return;lock(card);
  [...wrap.children].forEach(b=>{b.disabled=true;if(b.innerHTML===it.opts[it.correctIdx])b.classList.add('correct');});
  if(correct){correctCount++;btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong','shake');buzz();}
  openExp(card);
}
function checkTxt(it,card,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;
  const ok=matchWriting(inp.value,it.ans);
  if(ok){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function checkCor(it,card,lbtns,selIdx,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;lbtns.forEach(b=>b.disabled=true);
  const letterOk=selIdx===it.cIdx, textOk=matchWriting(inp.value,it.corr);
  lbtns[it.cIdx].classList.add('correct');
  if(selIdx!==it.cIdx)lbtns[selIdx].classList.add('wrong');
  if(letterOk&&textOk){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function openName(){document.getElementById('nameOv').classList.add('show');document.getElementById('nameIn').focus();}
function showResult(){
  const n=document.getElementById('nameIn').value.trim();
  const err=document.getElementById('nameErr'),inp=document.getElementById('nameIn');
  if(!n){inp.classList.add('err');err.textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('nameOv').classList.remove('show');
  const pct=correctCount/TOTAL, ten=(correctCount/TOTAL*10).toFixed(2);
  let greet,meme;
  if(pct===1){greet='🌟 THIÊN TÀI! '+n+' xuất sắc tuyệt đối!';meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+n+' làm rất tốt, cố thêm chút nữa nhé!';meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN '+n+'! Ôn lại phần giải thích rồi làm lại nha!';meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent='✅ '+correctCount+' / '+TOTAL+' câu đúng';
  document.getElementById('rTen').textContent='📊 Điểm quy đổi: '+ten+' / 10';
  const img=document.getElementById('rMeme'),fall=document.getElementById('rFall');
  img.style.display='block';fall.style.display='none';img.src=meme;
  img.onerror=()=>{img.style.display='none';fall.style.display='block';
    fall.textContent=pct===1?'🎉🏆🎉':(pct>=0.6?'😄👍':'😭💧');};
  document.getElementById('resOv').classList.add('show');
  if(pct>=0.6){confetti();setTimeout(confetti,400);}
}
updateProg();
</script>
