<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 3 · My Friends — TEST 1</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0d9488; --mint:#5eead4; --coral:#f43f5e; --sun:#fcd34d; --sky:#38bdf8;
  --green:#12b76a; --wrong:#ef4444; --blue:#2563eb; --purpleT:#6a3fd6; --terra:#c2410c; --grammar:#e11d48; --ink:#12403a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(-45deg,#a7f3d0,#5eead4,#7dd3fc,#fcd34d,#6ee7b7);
  background-size:400% 400%;animation:bgmove 20s ease infinite;overflow-x:hidden;}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaties span{position:absolute;font-size:2rem;opacity:.5;animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 80px}
.head{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:#f0fdfa;border:2px solid var(--teal);color:var(--teal);font-weight:800;font-size:.8rem;padding:5px 14px;border-radius:20px;box-shadow:0 4px 12px rgba(13,148,136,.2)}
.title{margin-top:12px;font-family:'Quicksand';font-weight:700;font-size:1.8rem;color:#fff;text-shadow:0 3px 0 #0d9488,0 6px 14px rgba(13,148,136,.4)}
.sub{display:inline-block;margin-top:6px;background:#f0fdfa;border:2px solid var(--coral);border-radius:12px;padding:3px 12px;font-weight:800;color:var(--coral)}
.progbar{height:14px;background:#f0fdfa;border:2px solid var(--teal);border-radius:20px;margin:16px 0;overflow:hidden}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--sun));transition:width .4s}
.sec{margin:26px 0 12px;background:linear-gradient(135deg,#0d9488,#0e7490);color:#fff;border-radius:14px;padding:10px 16px;font-family:'Quicksand';font-weight:700;font-size:1.02rem;box-shadow:0 6px 16px rgba(13,148,136,.35)}
.card{background:#f7fffd;border:2px solid #bff0e6;border-radius:18px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 8px 20px rgba(13,120,110,.15)}
.qnum{display:inline-block;background:linear-gradient(135deg,var(--teal),var(--mint));color:#fff;font-family:'Quicksand';font-weight:700;border-radius:11px;padding:2px 10px;font-size:.85rem;margin-right:8px}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.5;display:inline}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px}
.hint{font-size:.85rem;color:#0e7a6e;font-weight:800;margin-top:8px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid #b6ece0;border-radius:14px;padding:13px 12px;font-family:'Nunito';font-size:1.08rem;font-weight:800;color:#0e5a52;cursor:pointer;box-shadow:0 5px 0 #d0f3ea;transition:transform .12s;text-align:center}
.opt:nth-child(2n){background:#fff5f6;border-color:#fbcdd4;box-shadow:0 5px 0 #fcdde1;color:#b3324a}
.opt:hover:not(:disabled){transform:scale(1.04)}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green)!important;border-color:#0a8a4f!important;color:#fff!important;box-shadow:0 5px 0 #0a8a4f!important}
.opt.wrong{background:var(--wrong)!important;border-color:#b91c1c!important;color:#fff!important;box-shadow:0 5px 0 #b91c1c!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.tin{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tin input{flex:1;min-width:180px;font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:11px 14px;border-radius:12px;border:2px solid #b6ece0;background:#fbfffe;color:var(--ink)}
.tin input:focus{outline:none;border-color:var(--teal)}
.tin input.ok{border-color:var(--green);background:#e7fff1}
.tin input.no{border-color:var(--wrong);background:#ffecee}
.btnc{background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;border:none;border-radius:12px;padding:11px 20px;font-family:'Quicksand';font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 5px 0 #0a7268;transition:transform .12s}
.btnc:hover:not(:disabled){transform:scale(1.05)} .btnc:disabled{opacity:.55;cursor:default}
.letters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lbtn{width:48px;height:48px;border-radius:12px;border:2px solid #b6ece0;font-family:'Quicksand';font-weight:700;font-size:1.15rem;cursor:pointer;background:#e7fbf6;color:var(--teal);box-shadow:0 4px 0 #d0f3ea;transition:transform .12s}
.lbtn:hover:not(:disabled){transform:scale(1.08)}
.lbtn.sel{background:var(--sun);color:#7a5a00}
.lbtn.correct{background:var(--green);color:#fff;border-color:#0a8a4f}
.lbtn.wrong{background:var(--wrong);color:#fff;border-color:#b91c1c}
.lbtn:disabled{cursor:default}
.mark{background:#fef3c7;border-radius:6px;padding:0 4px;font-weight:800}
.mark sup{color:var(--coral);font-family:'Quicksand';font-size:.7rem}
.exp{margin-top:14px;max-height:0;overflow:hidden;transition:max-height .5s ease;font-size:1rem}
.exp.open{max-height:1700px}
.expin{background:#f7fffd;border:2px dashed #a7ddd2;border-radius:12px;padding:14px}
.exp ol{margin:6px 0 0 20px} .exp li{margin:8px 0;line-height:1.55}
.vnt{background:#fff2e0;border-left:5px solid var(--terra);border-radius:10px;padding:8px 12px;font-weight:800;color:#7a3e00;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0}
.grid2>div{line-height:1.5}
.p-word{color:var(--blue);font-weight:800}
.hl-green{color:#088a3c;font-weight:900}
.hl-red{color:var(--wrong);font-weight:900}
.wt{background:#ece3ff;color:var(--purpleT);border-radius:6px;padding:0 6px;font-size:.78rem;font-weight:800}
.p-phonetic{color:var(--purpleT);background:#f0e9ff;border-radius:6px;padding:0 6px;font-weight:700}
.p-mean{color:var(--terra);font-weight:800}
.p-grammar{border-bottom:2.5px solid var(--grammar);color:#7a1030;font-weight:800}
.keyline{background:#e7fff1;border:2px solid #a7e0bd;border-radius:10px;padding:8px 12px;font-weight:800;color:#066b34;margin-bottom:8px}
.submit{display:block;width:100%;margin-top:24px;background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;border:none;border-radius:18px;padding:18px;font-family:'Quicksand';font-weight:700;font-size:1.25rem;cursor:pointer;box-shadow:0 8px 0 #0a7268}
.submit:hover{transform:scale(1.02)}
.overlay{position:fixed;inset:0;background:rgba(10,50,45,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#f7fffd;border:2px solid var(--teal);border-radius:22px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Quicksand';font-weight:700;font-size:1.4rem;color:var(--teal);margin-bottom:12px}
.modal input{width:100%;padding:14px;border-radius:12px;border:2px solid #b6ece0;font-size:1.05rem;font-family:'Nunito';font-weight:700;margin-bottom:6px}
.modal input.err{border-color:var(--wrong);background:#ffecee}
.errmsg{color:var(--wrong);font-weight:800;font-size:.9rem;min-height:20px;margin-bottom:8px}
.modal button{background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;border:none;border-radius:12px;padding:12px 26px;font-family:'Quicksand';font-weight:700;font-size:1.1rem;cursor:pointer;box-shadow:0 5px 0 #0a7268}
.rgreet{font-family:'Quicksand';font-weight:700;font-size:1.35rem;color:var(--teal);line-height:1.35}
.rscore{font-family:'Quicksand';font-weight:700;font-size:2.3rem;color:var(--ink);margin:8px 0}
.rten{font-size:1.5rem;font-weight:900;color:var(--coral);margin-bottom:12px}
.rmeme{width:100%;max-width:280px;border-radius:14px;margin:0 auto 14px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2);min-height:120px;object-fit:cover}
.memefall{font-size:5rem}
@media(max-width:560px){.opts,.grid2{grid-template-columns:1fr}.title{font-size:1.5rem}}
</style>
</head>
<body>
<div class="floaties" id="floaties"></div>
<div class="wrap">
  <div class="head">
    <div class="badge">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên</div>
    <div class="title">👫 My Friends</div>
    <div><span class="sub">UNIT 3 · TEST 1 — Phần A (I–VI) &amp; C (I–III)</span></div>
    <div class="progbar"><div class="progfill" id="prog"></div></div>
  </div>
  <div id="quiz"></div>
  <button class="submit" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="overlay" id="nameOv">
  <div class="modal">
    <h2>✍️ Nhập tên của em nhé!</h2>
    <input id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
    <div class="errmsg" id="nameErr"></div>
    <button onclick="showResult()">Xem kết quả 🚀</button>
  </div>
</div>
<div class="overlay" id="resOv">
  <div class="modal">
    <div class="rgreet" id="rGreet"></div>
    <div class="rscore" id="rScore"></div>
    <div class="rten" id="rTen"></div>
    <img class="rmeme" id="rMeme" alt="result">
    <div class="memefall" id="rFall" style="display:none"></div>
    <button onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
(function(){
  const ico=['👫','👭','👬','🤝','😄','🎈','⭐','🌈','💛','😎','🎉','👋'];
  const f=document.getElementById('floaties');
  for(let i=0;i<16;i++){const s=document.createElement('span');
    s.textContent=ico[i%ico.length];s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(15+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(1.5+Math.random()*1.7)+'rem';f.appendChild(s);}
})();
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=i?1318:988;o.connect(g);g.connect(c.destination);
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);
  g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.4);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function confetti(){const cols=['#0d9488','#5eead4','#f43f5e','#fcd34d','#38bdf8','#12b76a'];
  for(let i=0;i<70;i++){const d=document.createElement('div');
    d.style.cssText='position:fixed;z-index:99;width:10px;height:14px;top:-20px;pointer-events:none;border-radius:2px;';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1500+Math.random()*1500,x=(Math.random()-.5)*300;
    d.animate([{transform:d.style.transform,opacity:1},
      {transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:0}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[.,?!;:'"’\-]/g,' ').replace(/\s+/g,' ').trim();}
function matchWriting(input,answers){const ni=norm(input);if(!ni)return false;
  for(const a of answers){const na=norm(a);if(ni===na)return true;
    if(na.includes(ni)&&ni.length>=na.length*0.5)return true;if(ni.includes(na))return true;}return false;}
let TOTAL=0,correctCount=0,answered=0;
function updateProg(){document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';}

/* ============================================================
   DATA — Unit 3 · MY FRIENDS · TEST 1 · A(I–VI) + C(I–III)
   ============================================================ */
const Q=[];
function sec(t){Q.push({sec:t});}
function mcq(num,q,opts,correctIdx,exp){Q.push({type:'mcq',num,q,opts,correctIdx,exp});}
function txt(num,q,ans,exp,hint){Q.push({type:'txt',num,q,ans,exp,hint});}
function cor(num,q,parts,cIdx,corr,exp){Q.push({type:'cor',num,q,parts,cIdx,corr,exp});}

/* ---------- A. I. Pronunciation ---------- */
sec("A. LANGUAGE FOCUS · I. Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại");
mcq(1,"Chọn từ có phần gạch chân được phát âm khác:",
 ["booksho<u>p</u>","cu<u>p</u>board","cam<u>p</u>","<u>p</u>illow"],1,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "p" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>bookshop</span> <span class='p-phonetic'>/ˈbʊkʃɒp/</span> = <span class='p-mean'>hiệu sách</span> → /p/</div>
 <div><span class='hl-green'>cupboard</span> <span class='p-phonetic'>/ˈkʌbəd/</span> = <span class='p-mean'>tủ chén</span> → p CÂM (∅)</div>
 <div><span class='p-word'>camp</span> <span class='p-phonetic'>/kæmp/</span> = <span class='p-mean'>trại</span> → /p/</div>
 <div><span class='p-word'>pillow</span> <span class='p-phonetic'>/ˈpɪləʊ/</span> = <span class='p-mean'>cái gối</span> → /p/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"cupboard" có "p" CÂM (không đọc): /ˈkʌbəd/. Ba từ kia "p" đọc /p/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>bookshop, camp, pillow đều phát âm /p/ rõ ràng.</span></li></ol>`);
mcq(2,"Chọn từ có phần gạch chân được phát âm khác:",
 ["gener<u>ou</u>s","playgr<u>ou</u>nd","m<u>ou</u>th","r<u>ou</u>nd"],0,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "ou" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>generous</span> <span class='p-phonetic'>/ˈdʒenərəs/</span> = <span class='p-mean'>hào phóng</span> → /ə/</div>
 <div><span class='p-word'>playground</span> <span class='p-phonetic'>/ˈpleɪɡraʊnd/</span> = <span class='p-mean'>sân chơi</span> → /aʊ/</div>
 <div><span class='p-word'>mouth</span> <span class='p-phonetic'>/maʊθ/</span> = <span class='p-mean'>miệng</span> → /aʊ/</div>
 <div><span class='p-word'>round</span> <span class='p-phonetic'>/raʊnd/</span> = <span class='p-mean'>tròn</span> → /aʊ/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"generous" có "ou" đọc âm mờ /ə/. Ba từ kia "ou" đọc /aʊ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>playground, mouth, round đều /aʊ/ nên giống nhau.</span></li></ol>`);
mcq(3,"Chọn từ có phần gạch chân được phát âm khác:",
 ["descri<u>b</u>e","<u>b</u>athroom","<u>b</u>londe","clim<u>b</u>"],3,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "b" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>describe</span> <span class='p-phonetic'>/dɪˈskraɪb/</span> = <span class='p-mean'>miêu tả</span> → /b/</div>
 <div><span class='p-word'>bathroom</span> <span class='p-phonetic'>/ˈbɑːθruːm/</span> = <span class='p-mean'>phòng tắm</span> → /b/</div>
 <div><span class='p-word'>blonde</span> <span class='p-phonetic'>/blɒnd/</span> = <span class='p-mean'>vàng hoe</span> → /b/</div>
 <div><span class='hl-green'>climb</span> <span class='p-phonetic'>/klaɪm/</span> = <span class='p-mean'>leo trèo</span> → b CÂM (∅)</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"climb" có "b" CÂM (không đọc): /klaɪm/. Ba từ kia "b" đọc /b/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>describe, bathroom, blonde đều phát âm /b/ rõ ràng.</span></li></ol>`);

/* ---------- A. II. Odd one out ---------- */
sec("A. LANGUAGE FOCUS · II. Chọn từ KHÁC NHÓM (không cùng loại) với các từ còn lại");
mcq(4,"Chọn từ khác nhóm:",
 ["eye","diary","foot","hand"],1,
 `<div class="vnt">💬 Dịch: Tìm từ không cùng nhóm nghĩa.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>eye</span> = <span class='p-mean'>mắt (bộ phận cơ thể)</span></div>
 <div><span class='hl-green'>diary</span> = <span class='p-mean'>nhật ký (đồ vật)</span></div>
 <div><span class='p-word'>foot</span> = <span class='p-mean'>bàn chân (bộ phận cơ thể)</span></div>
 <div><span class='p-word'>hand</span> = <span class='p-mean'>bàn tay (bộ phận cơ thể)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>eye/foot/hand đều là BỘ PHẬN CƠ THỂ; "diary" là đồ vật → khác nhóm.</span></li></ol>`);
mcq(5,"Chọn từ khác nhóm:",
 ["clever","slim","short","tall"],0,
 `<div class="vnt">💬 Dịch: Tìm từ không cùng nhóm nghĩa.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>clever</span> = <span class='p-mean'>thông minh (tính cách/khả năng)</span></div>
 <div><span class='p-word'>slim</span> = <span class='p-mean'>mảnh khảnh (ngoại hình)</span></div>
 <div><span class='p-word'>short</span> = <span class='p-mean'>thấp (ngoại hình)</span></div>
 <div><span class='p-word'>tall</span> = <span class='p-mean'>cao (ngoại hình)</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>slim/short/tall tả NGOẠI HÌNH; "clever" tả trí tuệ/tính cách → khác nhóm.</span></li></ol>`);
mcq(6,"Chọn từ khác nhóm:",
 ["confident","patient","caring","parent"],3,
 `<div class="vnt">💬 Dịch: Tìm từ không cùng nhóm nghĩa.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>confident</span> = <span class='p-mean'>tự tin (tính từ – tính cách)</span></div>
 <div><span class='p-word'>patient</span> = <span class='p-mean'>kiên nhẫn (tính từ – tính cách)</span></div>
 <div><span class='p-word'>caring</span> = <span class='p-mean'>quan tâm (tính từ – tính cách)</span></div>

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const quiz=document.getElementById('quiz');
Q.forEach((it)=>{
  if(it.sec){const d=document.createElement('div');d.className='sec';d.textContent=it.sec;quiz.appendChild(d);return;}
  TOTAL++;
  const card=document.createElement('div');card.className='card';card.id='c'+it.num;
  card.innerHTML=`<div><span class="qnum">Câu ${it.num}</span><span class="qtext">${render(it)}</span></div>`;
  if(it.type==='mcq'){
    const wrap=document.createElement('div');wrap.className='opts';
    const arr=it.opts.map((t,i)=>({t,correct:i===it.correctIdx}));shuffle(arr);
    arr.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>pickMcq(it,card,wrap,b,o.correct);wrap.appendChild(b);});
    card.appendChild(wrap);
  }else if(it.type==='txt'){
    if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='('+it.hint+')';card.appendChild(h);}
    const box=document.createElement('div');box.className='tin';
    const inp=document.createElement('input');inp.placeholder='Gõ đáp án của em...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    const act=()=>checkTxt(it,card,inp,btn);
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    box.appendChild(inp);box.appendChild(btn);card.appendChild(box);
  }else if(it.type==='cor'){
    const letters=document.createElement('div');letters.className='letters';
    const L=['A','B','C','D'];let selIdx=-1;
    const inBox=document.createElement('div');inBox.className='tin';inBox.style.display='none';
    const inp=document.createElement('input');inp.placeholder='Gõ chữ ĐÚNG để sửa...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    inBox.appendChild(inp);inBox.appendChild(btn);
    const lbtns=[];
    L.forEach((L_,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=L_;
      b.onclick=()=>{if(card.dataset.done)return;selIdx=i;lbtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        inBox.style.display='flex';inp.focus();};
      lbtns.push(b);letters.appendChild(b);});
    const act=()=>{if(selIdx<0){inp.placeholder='Hãy chọn chữ cái A–D trước!';return;}checkCor(it,card,lbtns,selIdx,inp,btn);};
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    card.appendChild(letters);card.appendChild(inBox);
  }
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=`<div class="expin">${it.exp}</div>`;
  card.appendChild(exp);quiz.appendChild(card);
});
function render(it){
  if(it.type==='cor'){const L=['A','B','C','D'];let s=it.q;
    it.parts.forEach((p,i)=>{s=s.replace('{'+p+'}',`<span class="mark">${p}<sup>${L[i]}</sup></span>`);});return s;}
  return it.q;
}
function openExp(card){card.querySelector('.exp').classList.add('open');}
function lock(card){card.dataset.done='1';answered++;updateProg();}
function pickMcq(it,card,wrap,btn,correct){
  if(card.dataset.done)return;lock(card);
  [...wrap.children].forEach(b=>{b.disabled=true;if(b.innerHTML===it.opts[it.correctIdx])b.classList.add('correct');});
  if(correct){correctCount++;btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong','shake');buzz();}
  openExp(card);
}
function checkTxt(it,card,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;
  const ok=matchWriting(inp.value,it.ans);
  if(ok){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function checkCor(it,card,lbtns,selIdx,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;lbtns.forEach(b=>b.disabled=true);
  const letterOk=selIdx===it.cIdx, textOk=matchWriting(inp.value,it.corr);
  lbtns[it.cIdx].classList.add('correct');
  if(selIdx!==it.cIdx)lbtns[selIdx].classList.add('wrong');
  if(letterOk&&textOk){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function openName(){document.getElementById('nameOv').classList.add('show');document.getElementById('nameIn').focus();}
function showResult(){
  const n=document.getElementById('nameIn').value.trim();
  const err=document.getElementById('nameErr'),inp=document.getElementById('nameIn');
  if(!n){inp.classList.add('err');err.textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('nameOv').classList.remove('show');
  const pct=correctCount/TOTAL, ten=(correctCount/TOTAL*10).toFixed(2);
  let greet,meme;
  if(pct===1){greet='🌟 THIÊN TÀI! '+n+' xuất sắc tuyệt đối!';meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+n+' làm rất tốt, cố thêm chút nữa nhé!';meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN '+n+'! Ôn lại phần giải thích rồi làm lại nha!';meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent='✅ '+correctCount+' / '+TOTAL+' câu đúng';
  document.getElementById('rTen').textContent='📊 Điểm quy đổi: '+ten+' / 10';
  const img=document.getElementById('rMeme'),fall=document.getElementById('rFall');
  img.style.display='block';fall.style.display='none';img.src=meme;
  img.onerror=()=>{img.style.display='none';fall.style.display='block';
    fall.textContent=pct===1?'🎉🏆🎉':(pct>=0.6?'😄👍':'😭💧');};
  document.getElementById('resOv').classList.add('show');
  if(pct>=0.6){confetti();setTimeout(confetti,400);}
}
updateProg();
</script>
