<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;min-height:100vh;color:#e0e0ff;overflow-x:hidden;background:#020213}
.space-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#020213 0%,#0a0a2e 25%,#150030 50%,#0d1a4a 75%,#020213 100%);background-size:400% 400%;animation:spaceFlow 18s ease infinite;z-index:-3}
@keyframes spaceFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#starsCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.space-objects{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:hidden}
.space-obj{position:absolute;user-select:none;animation:floatSpace linear infinite}
@keyframes floatSpace{0%{transform:translateY(0px) rotate(0deg)}25%{transform:translateY(-18px) rotate(4deg)}75%{transform:translateY(10px) rotate(-4deg)}100%{transform:translateY(0px) rotate(0deg)}}
.progress-bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#7c4dff,#00bcd4,#f48fb1);z-index:50;transition:width .5s ease;border-radius:0 4px 4px 0;box-shadow:0 0 10px rgba(124,77,255,.8)}
.header{text-align:center;padding:14px 20px 10px;background:rgba(255,255,255,.03);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:10}
.header h1{font-size:1.35rem;font-weight:900;background:linear-gradient(90deg,#64b5f6,#ce93d8,#80cbc4,#f48fb1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px}
.header p{font-size:.72rem;color:rgba(255,255,255,.4);margin-top:2px}
.container{max-width:820px;margin:0 auto;padding:22px 16px 140px}
.question-card{background:rgba(255,255,255,.04);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:26px;margin-bottom:28px;position:relative;overflow:hidden;transition:transform .2s}
.question-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#7c4dff,#00bcd4,#7c4dff);border-radius:22px 22px 0 0}
.q-number{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#7c4dff,#00bcd4);color:#fff;font-weight:900;font-size:.82rem;padding:4px 14px;border-radius:20px;margin-bottom:14px;letter-spacing:.5px}
.q-original{font-size:1.12rem;font-weight:800;color:#e8e8ff;line-height:1.55;margin-bottom:6px;padding:10px 14px;background:rgba(255,255,255,.04);border-radius:12px;border-left:3px solid #7c4dff}
.q-prompt{font-size:.88rem;color:rgba(255,255,255,.45);margin:8px 0 16px;font-style:italic}
.fill-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.stem-chip{background:rgba(124,77,255,.18);border:2px solid rgba(124,77,255,.5);border-radius:14px;padding:12px 16px;color:#d8d8ff;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;white-space:nowrap}
.answer-input{flex:1 1 220px;min-width:180px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:12px 16px;color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;outline:none;transition:border-color .25s,background .25s}
.answer-input:focus{border-color:#7c4dff}
.answer-input.ok{border-color:#00D26A!important;background:rgba(0,210,106,.16)!important;color:#a8ffcb!important}
.answer-input.bad{border-color:#FF4757!important;background:rgba(255,71,87,.14)!important;color:#ffaaaa!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.answer-input.shake{animation:shake .45s ease}
.check-btn{background:linear-gradient(135deg,#7c4dff,#00bcd4);border:none;border-radius:14px;padding:12px 22px;color:#fff;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;transition:transform .2s;white-space:nowrap}
.check-btn:hover:not(:disabled){transform:scale(1.05)}
.check-btn:disabled{opacity:.55;cursor:not-allowed}
.explanation{background:rgba(90,50,180,.1);border:1px solid rgba(124,77,255,.28);border-radius:16px;padding:18px 20px;margin-top:15px;display:none;font-size:.93rem;line-height:1.72;color:#cccaee}
.explanation.show{display:block;animation:fadeSlide .4s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.expl-title{font-size:.95rem;font-weight:800;color:#ce93d8;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.step{margin-bottom:12px;padding:10px 13px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.step-label{font-weight:800;font-size:.82rem;color:#80cbc4;margin-bottom:5px;display:block;letter-spacing:.3px}
.vi-translate{display:block;background:rgba(255,160,60,.12);border-left:3px solid #ffa040;padding:7px 12px;border-radius:0 8px 8px 0;color:#ffc87a;font-weight:700;margin:5px 0;font-size:.9rem}
.p-word{color:#64b5f6;font-weight:700}
.p-mean{color:#ff8a65;font-weight:600}
.p-grammar{color:#f48fb1;text-decoration:underline;text-decoration-color:#f44336;font-weight:700}
.hl-green{color:#69f0ae;font-weight:800}
.hl-red{color:#ff5252;text-decoration:line-through;font-weight:600}
.word-type{display:inline-block;background:rgba(0,188,212,.15);border:1px solid rgba(0,188,212,.3);color:#80deea;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:4px;vertical-align:middle}

/* ===== REMINDER BANNER ===== */
.reminder-fixed{position:fixed;bottom:18px;right:14px;width:272px;z-index:100;animation:reminderGlow 2.5s ease-in-out infinite alternate}
@keyframes reminderGlow{from{filter:drop-shadow(0 0 12px rgba(124,77,255,.5))}to{filter:drop-shadow(0 0 28px rgba(0,188,212,.7))}}
.reminder-inner{background:linear-gradient(135deg,rgba(20,10,60,.92),rgba(10,20,60,.92));border:2px solid transparent;background-clip:padding-box;border-radius:18px;padding:14px 15px 14px 14px;position:relative;overflow:hidden}
.reminder-inner::before{content:'';position:absolute;inset:-2px;background:linear-gradient(135deg,#7c4dff,#00bcd4,#f48fb1,#7c4dff);border-radius:18px;z-index:-1;animation:borderSpin 4s linear infinite}
@keyframes borderSpin{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.reminder-icons{display:flex;gap:7px;margin-bottom:8px;font-size:1.15rem}
.ri{animation:bobUp 2s ease-in-out infinite}
.ri:nth-child(2){animation-delay:.25s}
.ri:nth-child(3){animation-delay:.5s}
.ri:nth-child(4){animation-delay:.75s}
.ri:nth-child(5){animation-delay:1s}
@keyframes bobUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.reminder-title{font-size:.84rem;font-weight:900;color:#ffd54f;margin-bottom:6px;text-shadow:0 0 12px rgba(255,213,79,.6)}
.reminder-msg{font-size:.75rem;color:rgba(255,255,255,.82);line-height:1.55;min-height:62px;transition:opacity .5s}
.reminder-close{position:absolute;top:8px;right:9px;background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:.8rem;padding:2px;transition:color .2s}
.reminder-close:hover{color:rgba(255,255,255,.7)}
.reminder-dot{display:flex;gap:5px;margin-top:10px;justify-content:center}
.rdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .4s}
.rdot.active{background:#7c4dff}

/* ===== SUBMIT ===== */
.submit-area{text-align:center;margin:30px 0 20px;padding:20px}
.submit-btn{background:linear-gradient(135deg,#7c4dff,#00bcd4);border:none;border-radius:50px;padding:16px 44px;color:#fff;font-family:'Nunito',sans-serif;font-size:1.12rem;font-weight:900;cursor:pointer;box-shadow:0 8px 30px rgba(124,77,255,.55),0 0 0 0 rgba(124,77,255,0);transition:all .3s;letter-spacing:.8px;animation:pulseBtn 3s ease-in-out infinite}
@keyframes pulseBtn{0%,100%{box-shadow:0 8px 30px rgba(124,77,255,.55)}50%{box-shadow:0 8px 50px rgba(0,188,212,.7),0 0 40px rgba(124,77,255,.4)}}
.submit-btn:hover{transform:scale(1.06) translateY(-3px)}

/* ===== MODALS ===== */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:linear-gradient(160deg,rgba(15,10,45,.97),rgba(8,15,45,.97));border:2px solid rgba(124,77,255,.45);border-radius:26px;padding:36px 32px;max-width:430px;width:92%;text-align:center;box-shadow:0 20px 70px rgba(124,77,255,.45),0 0 100px rgba(0,188,212,.15);animation:modalIn .45s cubic-bezier(.175,.885,.32,1.275)}
@keyframes modalIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h2{font-size:1.5rem;font-weight:900;background:linear-gradient(90deg,#64b5f6,#ce93d8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.modal-box p{color:rgba(255,255,255,.65);margin-bottom:18px;font-size:.93rem}
.modal-input{width:100%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:13px 17px;color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;margin-bottom:10px;outline:none;transition:border-color .3s}
.modal-input:focus{border-color:#7c4dff}
.modal-input.error{border-color:#FF4757;animation:shake .45s ease}
.modal-btn{background:linear-gradient(135deg,#7c4dff,#00bcd4);border:none;border-radius:50px;padding:13px 34px;color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;transition:transform .2s;margin-top:5px}
.modal-btn:hover{transform:scale(1.05)}
.err-msg{color:#FF4757;font-size:.83rem;margin:-5px 0 10px;display:none}
.result-greeting{font-size:1.45rem;font-weight:900;color:#ffd54f;text-shadow:0 0 15px rgba(255,213,79,.5);margin-bottom:8px;line-height:1.3}
.result-score{font-size:3rem;font-weight:900;background:linear-gradient(90deg,#ffd54f,#ff6b6b,#64b5f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0 4px}
.result-10{font-size:1.1rem;color:#b39ddb;margin-bottom:14px;font-weight:700}
.result-gif{width:210px;height:155px;object-fit:cover;border-radius:14px;margin:10px auto 12px;display:block;border:2px solid rgba(255,255,255,.2)}
.result-msg{color:rgba(255,255,255,.68);font-size:.9rem;line-height:1.5;margin-bottom:14px}
.replay-btn{background:linear-gradient(135deg,#ff6b6b,#ffd54f);border:none;border-radius:50px;padding:13px 34px;color:#111;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;cursor:pointer;transition:transform .2s}
.replay-btn:hover{transform:scale(1.05)}
</style>
</head>
<body>
<div class="space-bg"></div>
<canvas id="starsCanvas"></canvas>
<div class="space-objects" id="spaceObjs"></div>
<div class="progress-bar" id="pBar" style="width:0%"></div>

<!-- Header -->
<div class="header">
  <h1>🚀 Exercise 22 · Rewrite the Sentences (Writing)</h1>
  <p>👩‍🏫 Giáo viên tạo: Ms MS Chí Nên &nbsp;·&nbsp; ☎️ 0852639652</p>
</div>

<!-- Reminder Banner -->
<div class="reminder-fixed" id="remBanner">
  <div class="reminder-inner">
    <button class="reminder-close" onclick="this.closest('.reminder-fixed').style.transform='scale(.4)';this.closest('.reminder-fixed').style.opacity='.25'">✕</button>
    <div class="reminder-icons">
      <span class="ri">✏️</span><span class="ri">📒</span><span class="ri">🌟</span><span class="ri">🪐</span><span class="ri">🚀</span>
    </div>
    <div class="reminder-title">🔥 BÍ KÍP HỌC THỰC SỰ GIỎI</div>
    <div class="reminder-msg" id="remMsg"></div>
    <div class="reminder-dot" id="remDots"></div>
  </div>
</div>

<!-- Quiz -->
<div class="container" id="quizDiv"></div>
<div class="submit-area">
  <button class="submit-btn" onclick="openNameModal()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<!-- Name Modal -->
<div class="modal-overlay" id="nameModal">
  <div class="modal-box">
    <h2>🌌 Nộp Bài</h2>
    <p>Nhập tên của bạn để xem kết quả nhé, phi hành gia! 🚀</p>
    <input class="modal-input" id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50">
    <div class="err-msg" id="nameErr">⚠️ Bạn chưa nhập tên!</div>
    <button class="modal-btn" onclick="doSubmit()">✅ Xem Kết Quả</button>
  </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="resModal">
  <div class="modal-box">
    <div class="result-greeting" id="rGreet"></div>
    <div class="result-score" id="rScore"></div>
    <div class="result-10" id="r10"></div>
    <img class="result-gif" id="rGif" src="" alt="result gif">
    <div class="result-msg" id="rMsg"></div>
    <button class="replay-btn" onclick="replay()">🔄 Làm Lại Từ Đầu</button>
  </div>
</div>

<!-- Audio -->
<audio id="introAudio" src="https://hoctienganhcungcoMSChíNên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/export_2rUjepgpwpTxnU6YGv6kmq.mp3" preload="auto"></audio>
<audio id="wrongAudio" src="https://hoctienganhcungcoMSChíNên.github.io/homework/%E1%BA%A2nh_File%20nghe/File%20nghe%20Ket%20A2/huh_sound_effect-www_tiengdong_com.mp3" preload="auto"></audio>

<script>
// ==================== DATA ====================
const QUESTIONS = [
  {
    id:1,
    orig:'My brother often drives to work.',
    stem:'My brother often goes ',
    correct:'My brother often goes to work by motorbike.',
    expl:`
      <div class="step"><span class="step-label">📖 DỊCH CÂU:</span>
        <span class="vi-translate">"Anh trai tôi thường lái xe đi làm."</span>
        <span class="vi-translate">→ Viết lại: "Anh trai tôi thường đi làm bằng xe máy."</span>
      </div>
      <div class="step"><span class="step-label">📚 PHÂN TÍCH 4 ĐÁP ÁN:</span>
        <p>✅ <span class="p-word">My brother often <b>goes to work by motorbike</b>.</span> — <span class="hl-green">ĐÚNG</span></p>
        <p style="margin-top:7px">❌ <span class="hl-red">often go to work</span> — Sai: chủ ngữ "My brother" (ngôi 3, số ít) → phải dùng <span class="p-grammar">goes</span> (thêm -es)</p>
        <p style="margin-top:7px">❌ <span class="hl-red">goes to work on motorbike</span> — Sai giới từ: phải dùng <span class="p-grammar">by + phương tiện</span>, không dùng "on"</p>
        <p style="margin-top:7px">❌ <span class="hl-red">goes to work by a motorbike</span> — Sai: sau <span class="p-grammar">by</span> khi chỉ phương tiện KHÔNG dùng mạo từ <span class="hl-red">a/an/the</span></p>
      </div>
      <div class="step"><span class="step-label">💡 CẤU TRÚC CẦN NHỚ:</span>
        <p><span class="p-grammar">go to (nơi) by (phương tiện)</span> <span class="word-type">cụm động từ</span> = đi đến (nơi) bằng (phương tiện)</p>
        <p style="margin-top:6px">⚠️ Sau <span class="p-grammar">by</span>: KHÔNG có mạo từ → <span class="hl-red">by a bus</span> ❌ → <span class="hl-green">by bus</span> ✅</p>
        <p style="margin-top:6px">📌 Chia động từ ngôi 3 số ít: <span class="p-word">go</span> <span class="word-type">v</span> → <span class="p-grammar">goes</span> (thêm -es vì tận cùng bằng "o")</p>
      </div>`
  },
  {
    id:2,
    orig:'We go to the supermarket on foot.',
    stem:'We walk ',
    correct:'We walk to the supermarket.',
    expl:`
      <div class="step"><span class="step-label">📖 DỊCH CÂU:</span>
        <span class="vi-translate">"Chúng tôi đi bộ đến siêu thị."</span>
        <span class="vi-translate">→ Viết lại: "Chúng tôi đi bộ đến siêu thị." (cùng nghĩa, dùng động từ khác)</span>
      </div>
      <div class="step"><span class="step-label">📚 PHÂN TÍCH 4 ĐÁP ÁN:</span>
        <p>✅ <span class="p-word">We <b>walk</b> to the supermarket.</span> — <span class="hl-green">ĐÚNG</span></p>
        <p style="margin-top:7px">❌ <span class="hl-red">We are walking</span> — Sai thì: câu gốc dùng thì <span class="p-grammar">Hiện tại đơn</span> (thói quen), không phải Hiện tại tiếp diễn</p>
        <p style="margin-top:7px">❌ <span class="hl-red">We walked</span> — Sai thì: câu gốc là <span class="p-grammar">hiện tại</span>, không phải <span class="hl-red">quá khứ</span></p>
        <p style="margin-top:7px">❌ <span class="hl-red">We walks</span> — Sai chia động từ: chủ ngữ "We" (ngôi 1, số nhiều) → KHÔNG thêm -s/-es</p>
      </div>
      <div class="step"><span class="step-label">💡 CẤU TRÚC CẦN NHỚ:</span>
        <p><span class="p-word">go on foot</span> <span class="word-type">cụm</span> = <span class="p-word">walk</span> <span class="word-type">v</span> = <span class="p-mean">đi bộ</span></p>
        <p style="margin-top:6px">📌 Hai cách diễn đạt cùng nghĩa — đây là dạng bài thay thế từ đồng nghĩa!</p>
      </div>`
  },
  {
    id:3,
    orig:'History and math are not interesting to me.',
    stem:'I am not ',
    correct:'I am not interested in history and math.',
    expl:`
      <div class="step"><span class="step-label">📖 DỊCH CÂU:</span>
        <span class="vi-translate">"Lịch sử và toán học không thú vị với tôi."</span>
        <span class="vi-translate">→ Viết lại: "Tôi không thích (không hứng thú với) lịch sử và toán học."</span>
      </div>
      <div class="step"><span class="step-label">📚 PHÂN TÍCH 4 ĐÁP ÁN:</span>
        <p>✅ <span class="p-word">I am not <b>interested in</b> history and math.</span> — <span class="hl-green">ĐÚNG</span></p>
        <p style="margin-top:7px">❌ <span class="hl-red">I am not interesting in</span> — Nhầm tính từ: <span class="hl-red">interesting</span> <span class="word-type">adj</span> = <span class="p-mean">thú vị</span> (mô tả sự vật) ≠ <span class="p-grammar">interested</span> <span class="word-type">adj</span> = <span class="p-mean">hứng thú</span> (cảm xúc của người)</p>
        <p style="margin-top:7px">❌ <span class="hl-red">I don't interested in</span> — Sai cấu trúc: sau "don't" phải là động từ nguyên thể, không dùng <span class="p-grammar">be + adj</span></p>
        <p style="margin-top:7px">❌ <span class="hl-red">interest to me</span> — Sai giới từ: <span class="p-word">interest</span> <span class="word-type">v</span> + <span class="p-grammar">sb</span> (không dùng "to" ở đây)</p>
      </div>
      <div class="step"><span class="step-label">💡 CẤU TRÚC CẦN NHỚ:</span>
        <p><span class="p-grammar">Sth be interesting to sb</span> = <span class="p-grammar">Sb be interested in sth</span></p>
        <p style="margin-top:6px">🔑 Phân biệt: <span class="p-word">interesting</span> <span class="word-type">adj</span> (nói về vật) vs <span class="p-word">interested</span> <span class="word-type">adj</span> (nói về người)</p>
        <p style="margin-top:6px">📌 <span class="hl-green">interested in</span> (giới từ "in" — không dùng "about" hay "to")</p>
      </div>`
  },
  {

// ==================== AUDIO ====================
let aCtx;
function getACtx(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();return aCtx}
function playCorrect(){
  try{
    const ctx=getACtx();
    [[523,.05],[659,.15],[784,.25],[1047,.35]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(.28,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.35);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.4);
    });
  }catch(e){}
}
function playWrong(){
  try{const a=document.getElementById('wrongAudio');a.currentTime=0;a.play().catch(()=>{})}catch(e){}
}

// ==================== CONFETTI ====================
function confetti(){
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999';
  document.body.appendChild(cv);
  const ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const cols=['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#ce93d8','#80cbc4','#f48fb1','#FFEAA7'];
  const ps=Array.from({length:90},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height,
    w:Math.random()*11+5,h:Math.random()*6+3,
    c:cols[Math.floor(Math.random()*cols.length)],
    sp:Math.random()*4+2,ang:Math.random()*Math.PI*2,
    rot:Math.random()*.22-.11,vx:Math.random()*2-1
  }));
  let fr=0;
  const anim=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.y+=p.sp;p.x+=p.vx;p.ang+=p.rot;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    if(++fr<160)requestAnimationFrame(anim);else cv.remove();
  };anim();
}

// ==================== STARS ====================
function initStars(){
  const cv=document.getElementById('starsCanvas');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const stars=Array.from({length:220},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:Math.random()*1.6+.4,al:Math.random(),sp:Math.random()*.025+.005,dir:1
  }));
  const draw=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    stars.forEach(s=>{
      s.al+=s.sp*s.dir;
      if(s.al>=1||s.al<=0)s.dir*=-1;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${Math.abs(s.al)})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  };draw();
  window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight});
}

// ==================== RENDER QUIZ ====================
function norm(s){return (s||'').toLowerCase().replace(/[‘’“”"'?.,!;:]/g,'').replace(/\s+/g,' ').trim();}
function renderQuiz(){
  const div=document.getElementById('quizDiv');
  div.innerHTML='';
  answers={};
  updatePbar();
  QUESTIONS.forEach((q,qi)=>{
    const card=document.createElement('div');
    card.className='question-card';card.id='qc'+qi;
    card.innerHTML=`
      <div class="q-number">🚀 Câu ${q.id} / ${QUESTIONS.length}</div>
      <div class="q-original">${q.orig}</div>
      <div class="q-prompt">Viết lại câu sao cho nghĩa không đổi, bắt đầu bằng các từ cho sẵn. <i>(Con chỉ cần gõ tiếp phần còn thiếu vào ô — không cần gõ lại các chữ đã cho sẵn. Nếu con quen tay gõ cả câu đầy đủ thì máy vẫn chấm đúng bình thường nhé!)</i></div>
      <div class="fill-row">
        <span class="stem-chip">${q.stem}</span>
        <input type="text" class="answer-input" id="inp${qi}" placeholder="Gõ tiếp phần còn thiếu..." autocomplete="off" spellcheck="false">
        <button class="check-btn" id="btn${qi}" onclick="checkAnswer(${qi})">Kiểm tra ✓</button>
      </div>
      <div class="explanation" id="ex${qi}">
        <div class="expl-title">🔍 GIẢI THÍCH CHI TIẾT</div>
        ${q.expl}
      </div>`;
    div.appendChild(card);
    const inp=card.querySelector('#inp'+qi);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer(qi);});
  });
}

function checkAnswer(qi){
  if(answers[qi]!==undefined)return;
  const q=QUESTIONS[qi];
  const inp=document.getElementById('inp'+qi);
  const val=inp.value.trim();
  if(!val){inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),450);return;}
  const contNorm=norm(q.correct.slice(q.stem.length));
  const fullNorm=norm(q.correct);
  const isOk=norm(val)===contNorm||norm(val)===fullNorm;
  answers[qi]=isOk;
  inp.disabled=true;
  document.getElementById('btn'+qi).disabled=true;
  if(isOk){inp.classList.add('ok');confetti();playCorrect();}
  else{inp.classList.add('bad');playWrong();}
  document.getElementById('ex'+qi).classList.add('show');
  updatePbar();
}

function updatePbar(){
  const pct=(Object.keys(answers).length/QUESTIONS.length)*100;
  document.getElementById('pBar').style.width=pct+'%';
}

  const sc10=((sc/tot)*10).toFixed(1);
  let greet,msg,gif;
  if(pct===1){greet=`🌠 THIÊN TÀI! ${nm} đỉnh của đỉnh!`;msg='Hoàn hảo tuyệt đối — 20/20! Bạn là ngôi sao sáng nhất vũ trụ! Hãy tiếp tục giữ phong độ nhé! 🌌';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=.8){greet=`⭐ XUẤT SẮC! ${nm} làm tốt lắm!`;msg='Kết quả rất ấn tượng! Xem lại giải thích những câu sai để đạt điểm tuyệt đối lần sau nhé! 💪';gif='https://media.giphy.com/media/3o7TKnCdBx5cwCqRao/giphy.gif';}
  else if(pct>=.6){greet=`🚀 KHÁ ĐẤY! ${nm} đang tiến bộ!`;msg='Không tệ! Đọc kỹ giải thích những câu chưa đúng và ghi chép vào vở. Cố lên! 📒';gif='https://media.giphy.com/media/xT9IgG50Lg7russbW8/giphy.gif';}
  else{greet=`🌙 CỐ LÊN ${nm}! Không bỏ cuộc nhé!`;msg='Đừng nản lòng! Đọc thật kỹ phần giải thích, ghi chép cẩn thận rồi thử lại — bạn chắc chắn sẽ làm tốt hơn! 🌟';gif='https://media.giphy.com/media/26ufnwz3wDUli7GU0/giphy.gif';}
  document.getElementById('rGreet').innerHTML=greet;
  document.getElementById('rScore').textContent=`${sc}/${tot}`;
  document.getElementById('r10').innerHTML=`Quy đổi điểm: <strong>${sc10} / 10 điểm</strong>`;
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('rGif').src=gif;
  document.getElementById('resModal').classList.add('show');
}
function replay(){
  document.getElementById('resModal').classList.remove('show');
  document.getElementById('nameIn').value='';
  document.getElementById('nameErr').style.display='none';
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ==================== INTRO AUDIO ====================
function tryIntroAudio(){
  const a=document.getElementById('introAudio');
  if(a){a.play().catch(()=>{
    const go=()=>{a.play().catch(()=>{});document.removeEventListener('click',go);document.removeEventListener('touchstart',go);};
    document.addEventListener('click',go,{once:true});
    document.addEventListener('touchstart',go,{once:true});
  });}
}

// ==================== INIT ====================
window.addEventListener('load',()=>{
  initStars();
  initSpaceObjs();
  initReminder();
  renderQuiz();
  setTimeout(tryIntroAudio,600);
});
</script>
