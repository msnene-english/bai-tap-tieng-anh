<style>
:root{--rose:#E91E63;--deep:#AD1457;--pink:#FFC2DC;--lilac:#B388FF;--mint:#12B886;--sun:#FFC93C;
  --bad:#F2455B;--ink:#3B1B2E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#FFF0F6,#FFE3EF 55%,#FDEBFF);background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(233,30,99,.10) 1.5px,transparent 1.6px);background-size:22px 22px}
.hs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.h{position:absolute;bottom:-60px;animation:rise linear infinite}
.h i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes rise{0%{transform:translateY(0);opacity:0}7%{opacity:.9}90%{opacity:.9}
  100%{transform:translateY(-116vh);opacity:0}}
@keyframes sway{from{transform:translateX(-16px) rotate(-16deg)}to{transform:translateX(16px) rotate(16deg)}}
.ch{position:relative;width:var(--s);height:var(--s);background:var(--c);transform:rotate(-45deg);
  border-radius:0 0 4px 0}
.ch::before,.ch::after{content:'';position:absolute;width:var(--s);height:var(--s);background:var(--c);border-radius:50%}
.ch::before{top:calc(var(--s)/-2);left:0}
.ch::after{top:0;left:calc(var(--s)/2)}
.ch.slim{border-radius:0 0 45% 0}
.ch.out{background:transparent;border:2.5px solid var(--c);border-top-color:transparent;border-left-color:transparent}
.ch.out::before,.ch.out::after{background:transparent;border:2.5px solid var(--c)}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px 14px 80px}
h1,h2,h3,.pill,.qn,.sbtn,.ck,.lb,.l{font-family:'Quicksand',sans-serif;font-weight:700}
.note{position:relative;border-radius:3px 3px 16px 3px;box-shadow:4px 6px 14px rgba(173,20,87,.18)}
.note::after{content:'';position:absolute;right:0;bottom:0;width:24px;height:24px;
  background:linear-gradient(135deg,transparent 50%,rgba(173,20,87,.16) 50%);border-radius:0 0 14px 0}
.pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 8%,var(--rose) 45%,var(--deep));box-shadow:0 2px 5px rgba(0,0,0,.25)}
.hdr{background:linear-gradient(180deg,#FFDCEA,var(--pink));padding:18px 18px 16px;text-align:center;
  margin:8px 0 18px;transform:rotate(-.5deg)}
.hdr h1{font-size:clamp(18px,4vw,27px);line-height:1.3;color:var(--deep)}
.hdr p{font-size:.83rem;font-weight:800;color:#8A2E56;margin-top:6px}
.sb{position:sticky;top:8px;z-index:9;background:#fff;border-radius:999px;box-shadow:0 4px 14px rgba(173,20,87,.2);
  display:flex;align-items:center;gap:10px;padding:8px 16px;margin-bottom:18px;border:2px solid var(--pink)}
.sb b{font-family:'Quicksand',sans-serif;font-size:1.1rem;color:var(--deep)}
.tr{flex:1;height:11px;background:#FCE4EF;border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--lilac),var(--mint));transition:width .45s}
.sec{background:linear-gradient(180deg,#FFF7FA,#FFEFF6);padding:16px 14px 18px;margin-bottom:24px}
.sec:nth-child(even){transform:rotate(.35deg)}.sec:nth-child(odd){transform:rotate(-.3deg)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:2px 0 5px}
.pill{color:#fff;border-radius:999px;padding:2px 14px;font-size:.95rem;box-shadow:0 3px 8px rgba(173,20,87,.25)}
.st h2{font-size:1.06rem;line-height:1.35;color:var(--deep)}
.si{font-size:.89rem;font-weight:700;color:#8A2E56;font-style:italic;margin:2px 0 12px;line-height:1.6}
.tip{background:#E4FBF4;border:2px solid var(--mint);border-radius:12px;padding:8px 12px;font-size:.92rem;
  font-weight:700;line-height:1.78;color:#065F46;margin-bottom:12px}
.q{background:#fff;border-radius:3px 3px 13px 3px;padding:11px 12px 12px;margin-bottom:11px;
  box-shadow:2px 3px 9px rgba(173,20,87,.13);border-left:5px solid var(--pink)}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:var(--rose);color:#fff;border-radius:8px;min-width:30px;text-align:center;
  padding:0 8px;margin-right:7px;font-size:.93rem;box-shadow:0 2px 5px rgba(233,30,99,.35)}
.qt{font-weight:700;font-size:1rem;line-height:1.85}
.qt .bl{display:inline-block;min-width:94px;border-bottom:3px solid var(--rose);text-align:center;color:var(--rose);font-weight:900}
.qt i{color:#7B1FA2}
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.og.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.og{grid-template-columns:1fr}}
.ob{background:#FFF7FA;border:2px solid var(--pink);border-radius:11px;padding:9px 12px;font-family:'Nunito';
  font-size:.96rem;font-weight:800;cursor:pointer;box-shadow:0 3px 7px rgba(173,20,87,.12);transition:.14s;
  text-align:center;line-height:1.5;color:var(--ink)}
.ob:hover:not(.dn){transform:translateY(-2px);background:#FFEAF3;border-color:var(--rose)}
.ob.ok{background:#D7F7EC;border-color:var(--mint);color:#065F46}
.ob.no{background:#FFE1E6;border-color:var(--bad);color:#9F1239}
.ob.dim{opacity:.4}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.ti{flex:1;min-width:190px;padding:9px 13px;border:2px solid var(--pink);border-radius:11px;font-family:'Nunito';
  font-size:.98rem;font-weight:800;outline:none;background:#FFFDFE}
.ti:focus{border-color:var(--rose);background:#fff}
.ti:disabled{opacity:.55}
.ti.ok{border-color:var(--mint);background:#D7F7EC}.ti.no{border-color:var(--bad);background:#FFE1E6}
.ck{background:var(--rose);color:#fff;border:none;border-radius:11px;padding:9px 18px;font-size:.98rem;cursor:pointer;
  box-shadow:0 4px 10px rgba(233,30,99,.35);white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.4;cursor:default}
.ex{display:none;margin-top:10px;background:#FFFDFE;border-radius:12px;padding:12px;font-size:.94rem;line-height:1.75;
  box-shadow:0 3px 10px rgba(173,20,87,.14);border:1.5px solid #FAD4E4}
.ex.show{display:block}
.kb{background:#D7F7EC;border:1.5px solid var(--mint);border-radius:9px;padding:7px 11px;margin-bottom:8px;
  font-weight:900;color:#065F46;line-height:1.7}
.vi{background:#FFF7E0;border-left:4px solid var(--sun);border-radius:0 8px 8px 0;padding:6px 11px;margin-bottom:8px;
  font-weight:700;color:#8A6100;line-height:1.7}
.sp{background:#FFF7FA;border:1.5px solid #FAD4E4;border-radius:9px;padding:7px 11px;margin-bottom:7px;line-height:1.75}
.sp .l{display:inline-block;background:var(--lilac);color:#fff;border-radius:6px;padding:0 8px;font-size:.85rem;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:5px 0}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
.g2>div{background:#fff;border:1.5px solid #FAE0EB;border-radius:8px;padding:5px 9px;line-height:1.65;font-weight:700}
.w{color:#1D4ED8;font-weight:800}.m{color:#C2410C;font-weight:700}.g{color:var(--mint);font-weight:900}
.t{background:#FCE7F1;color:#8A2E56;padding:1px 5px;border-radius:4px;font-size:.78em;font-weight:800;margin:0 3px}
.pg{background:linear-gradient(transparent 54%,#FFE066 54%);font-weight:800;line-height:2}
.ipa{color:#7B1FA2;background:rgba(123,31,162,.09);border-radius:4px;padding:1px 5px;font-family:'Courier New',monospace;font-size:.88em;font-weight:800}
.sub{text-align:center;margin-top:22px}
.sbtn{background:var(--rose);color:#fff;border:none;border-radius:999px;padding:13px 40px;font-size:1.2rem;cursor:pointer;
  box-shadow:0 6px 16px rgba(233,30,99,.4)}
.sbtn:hover{transform:translateY(-2px)}
.ov{position:fixed;inset:0;background:rgba(59,27,46,.7);z-index:99;display:none;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.mb{background:linear-gradient(180deg,#FFF7FA,#FFEAF3);border-radius:3px 3px 18px 3px;box-shadow:5px 7px 22px rgba(0,0,0,.35);
  padding:22px;width:410px;max-width:96%;text-align:center;position:relative}
.mb h2{font-size:1.35rem;color:var(--deep);margin-bottom:10px;line-height:1.25}
.mb input{width:100%;padding:11px;border:2px solid var(--pink);border-radius:11px;font-family:'Nunito';font-weight:800;
  font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#FFE1E6;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.22rem;color:var(--deep);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Quicksand',sans-serif;font-weight:700;font-size:2.5rem;color:var(--rose)}
.mb .rt{font-weight:900;color:#6D28D9;font-size:1.08rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.93rem;line-height:1.65;margin-bottom:10px}
.mb img{width:100%;max-width:250px;border-radius:13px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
/* ── MỚI: cơ chế "tìm & sửa lỗi" bấm chọn từ sai trong câu (Exercise V) ── */
.segs{margin-top:9px;font-weight:700;font-size:1.06rem;line-height:2.4;padding:10px 12px;
  background:#FFF7FA;border:2px dashed var(--pink);border-radius:12px;color:var(--ink)}
.sg{display:inline-block;border:2px solid var(--pink);background:#fff;border-radius:8px;
  padding:2px 9px;margin:0 2px;cursor:pointer;transition:.14s;font-weight:800;color:var(--deep)}
.sg:hover:not(.dn){background:#FFEAF3;border-color:var(--rose)}
.sg.pick{background:#FDE0EC;border-color:var(--rose);box-shadow:0 0 0 3px rgba(233,30,99,.2)}
.sg.ok{background:#D7F7EC;border-color:var(--mint);color:#065F46}
.sg.no{background:#FFE1E6;border-color:var(--bad);color:#9F1239}
</style>

<script>
(function(){
  const L=document.getElementById('hs');
  const emo=['💗','💖','💛','💙','💜','🧡','🤍','💚','❤️','💕','💞'];
  const col=['#FF4D8D','#FF80AB','#FFB300','#7C4DFF','#00BFA5','#FF6E40','#40C4FF','#EC407A','#AB47BC'];
  for(let i=0;i<22;i++){
    const h=document.createElement('div');h.className='h';
    const inner=document.createElement('i');
    const kind=i%5;
    if(kind===0||kind===1){
      inner.textContent=emo[i%emo.length];
      inner.style.fontSize=(13+Math.random()*20)+'px';
    }else{
      const d=document.createElement('div');
      d.className='ch'+(kind===3?' slim':kind===4?' out':'');
      d.style.setProperty('--s',(9+Math.random()*11).toFixed(0)+'px');
      d.style.setProperty('--c',col[i%col.length]);
      inner.appendChild(d);
    }
    h.style.left=(Math.random()*96)+'%';
    h.style.animationDuration=(13+Math.random()*15)+'s';
    h.style.animationDelay=(-Math.random()*24)+'s';
    inner.style.animationDuration=(2.2+Math.random()*2.8)+'s';
    h.appendChild(inner);L.appendChild(h);
  }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#E91E63','#FFC2DC','#B388FF','#12B886','#FFC93C'];
 for(let i=0;i<32;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fil(sec,num,q,correct,accept,ex,bw,ph){Q.push({t:'fill',sec,num,q,correct,accept,ex,bw:bw||'',ph:ph||'Điền...'})}
function fxq(sec,num,parts,ex){Q.push({t:'fix',sec,num,parts,ex})}
function W(w,ty,m){return "<div><span class='w'>"+w+"</span><span class='t'>"+ty+"</span>= <span class='m'>"+m+"</span></div>"}
function G(w,ty,m){return "<div><span class='g'>"+w+"</span><span class='t'>"+ty+"</span>= <span class='m'>"+m+"</span></div>"}
function EX(k,vn,cells,why,trap){
 return '<div class="kb">✅ '+k+'</div><div class="vi">💬 <b>Nghĩa:</b> '+vn+'</div>'+
  '<div class="sp"><span class="l">① PHÂN TÍCH</span><div class="g2">'+cells+'</div></div>'+
  '<div class="sp"><span class="l">② TẠI SAO ĐÚNG</span><br><span class="pg">'+why+'</span></div>'+
  '<div class="sp"><span class="l">③ MẸO / LƯU Ý</span><br><span class="pg">'+trap+'</span></div>'}

/* ═════ EXERCISE V — Find and correct the mistakes (8 câu, bấm chọn từ sai) ═════ */
function e5(num,parts,correctSentence,vi,cells,why,trap){
 fxq('V',num,parts,EX(correctSentence,vi,cells,why,trap));
}
e5(1,[{opt:'My',isWrong:false},{t:' father '},{opt:'work',isWrong:true,ans:['works']},{t:' '},
  {opt:'as',isWrong:false},{t:' a '},{opt:'teacher',isWrong:false},{t:'.'}],
 'My father works as a teacher.','Bố tôi làm giáo viên.',
 G('works','v','đúng — chủ ngữ "My father" ngôi 3 số ít, động từ thêm -s')+
 W('work','v','SAI — thiếu "-s" cho ngôi 3 số ít'),
 'Chủ ngữ "My father" (ngôi thứ 3 số ít) đi với động từ thường ở hiện tại đơn phải thêm "s". Cấu trúc: S (số ít) + V-s/es → works.',
 '"work" ở dạng nguyên thể là sai vì không hoà hợp với chủ ngữ số ít — đây là lỗi rất hay gặp khi quên chia động từ.');
e5(2,[{opt:'I',isWrong:false},{t:' '},{opt:'play football often',isWrong:true,ans:['often play football','often play']},
  {t:' '},{opt:'on',isWrong:false},{t:' '},{opt:'Saturdays',isWrong:false},{t:'.'}],
 'I often play football on Saturdays.','Tôi thường chơi bóng đá vào thứ Bảy.',
 G('often play football','adv+v','đúng — trạng từ tần suất đứng TRƯỚC động từ thường')+
 W('play football often','v+adv','SAI — trạng từ đặt sau động từ'),
 'Trạng từ chỉ tần suất (often: thường xuyên) phải đứng TRƯỚC động từ thường (play) → often play football.',
 '"play football often" đặt trạng từ sai vị trí trong câu khẳng định — luôn nhớ đặt trạng từ tần suất TRƯỚC động từ thường.');
e5(3,[{opt:'Do',isWrong:true,ans:['Does']},{t:' she '},{opt:'want',isWrong:false},{t:' to buy '},
  {opt:'a new',isWrong:false},{t:' '},{opt:'computer',isWrong:false},{t:'?'}],
 'Does she want to buy a new computer?','Cô ấy có muốn mua máy tính mới không?',
 G('Does','aux','đúng — chủ ngữ "she" ngôi 3 số ít')+
 W('Do','aux','SAI — Do chỉ dùng cho I/you/we/they hoặc danh từ số nhiều'),
 'Chủ ngữ "she" (ngôi thứ 3 số ít) trong câu hỏi nghi vấn hiện tại đơn phải mượn trợ động từ Does.',
 'Trợ động từ "Do" chỉ dùng cho I, you, we, they hoặc danh từ số nhiều.');
e5(4,[{opt:'My',isWrong:false},{t:' children '},{opt:"doesn't",isWrong:true,ans:["don't","do not"]},{t:' '},
  {opt:'like',isWrong:false},{t:' '},{opt:'reading',isWrong:false},{t:'.'}],
 "My children don't like reading.","Các con của tôi không thích đọc sách.",
 G("don't",'aux','đúng — "children" là danh từ số nhiều')+
 W("doesn't",'aux','SAI — chỉ dùng cho chủ ngữ số ít'),
 '"children" (những đứa trẻ) là danh từ số nhiều. Phải dùng trợ động từ số nhiều don’t.',
 'Trợ động từ "doesn’t" bị sai vì nó chỉ dùng cho chủ ngữ số ít.');
e5(5,[{opt:'We',isWrong:false},{t:' '},{opt:'have usually',isWrong:true,ans:['usually have']},{t:' '},
  {opt:'breakfast',isWrong:false},{t:' '},{opt:'at six',isWrong:false},{t:'.'}],
 'We usually have breakfast at six.','Chúng tôi thường ăn sáng lúc sáu giờ.',

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  let oi=0;
  const segHtml=m.parts.map(p=>{
   if(p.t!==undefined)return p.t;
   const idx=oi++;
   return '<span class="sg" data-i="'+idx+'" onclick="selg(\''+gid+'\','+idx+')">'+p.opt+'</span>';
  }).join('');
  c.innerHTML='<div class="qt">'+h+'Tìm từ/cụm từ SAI rồi gõ sửa lại:</div>'+
   '<div class="segs" id="sg_'+gid+'">'+segHtml+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="Chọn từ sai ở trên rồi gõ sửa lại..." disabled autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">Kiểm tra</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  bt.onclick=()=>{
   if(done[gid])return;
   if(sel[gid]===undefined||!norm(inp.value)){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
   done[gid]=true;answered++;
   const opts=m.parts.filter(p=>p.opt!==undefined);
   const chosen=opts[sel[gid]];
   const okSel=chosen.isWrong===true;
   const okTxt=okSel&&(chosen.ans||[]).map(norm).indexOf(norm(inp.value))>-1;
   const ok=okSel&&okTxt;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.querySelectorAll('#sg_'+gid+' .sg').forEach((s,i)=>{s.classList.add('dn');s.classList.remove('pick');
    if(opts[i].isWrong)s.classList.add('ok');else if(i===sel[gid])s.classList.add('no')});
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')bt.click()});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">Kiểm tra</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   if(m.bw)strike(m.bw);
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,i){
 if(done[gid])return;sel[gid]=i;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach((s,j)=>s.classList.toggle('pick',j===i));
 const inp=document.getElementById('i_'+gid);inp.disabled=false;inp.focus();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}

 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — con lớp 6 giỏi quá! 🎉';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Đọc kỹ phần giải thích những câu sai để nhớ lâu hơn nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn con nhé! Con là học sinh lớp 6 rồi, đọc kỹ phần giải thích rồi làm lại là sẽ tiến bộ ngay thôi, Ms tin con! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
