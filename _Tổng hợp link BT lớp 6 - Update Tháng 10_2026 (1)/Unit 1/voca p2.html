let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.44);
 o.start(t);o.stop(t+.47)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}

<script>
const Q=[];
function mcqw(sec,num,q,opts,correctIdx,ex){Q.push({t:'mcq',sec,num,q,opts,correctIdx,ex})}
function G(w,ty,m){return "<div><span class='g'>"+w+"</span><span class='t'>"+ty+"</span>= <span class='m'>"+m+"</span></div>"}
function W(w,ty,m){return "<div><span class='w'>"+w+"</span><span class='t'>"+ty+"</span>= <span class='m'>"+m+"</span></div>"}
function DICT(w){
 var s=w.replace(/ /g,'-');
 return '<div class="stp"><span class="l">TRA TỪ ĐIỂN CAMBRIDGE</span><br>'+
  'Con hãy bấm vào đây: <a href="https://dictionary.cambridge.org/vi/dictionary/english/'+s+
  '" target="_blank" style="color:#37D89A;font-weight:900">Cambridge Dictionary</a> — cô đã trích sẵn '+
  'link tra từ &ldquo;<b>'+w+'</b>&rdquo; cho con rồi đó, nhớ bấm loa 🔊 nghe và đọc theo cho chuẩn nhé!</div>';
}
function F4(key,de,cells,why,trap,dictWord){
 return '<div class="kb">✅ Đáp án: '+key+'</div>'+
  '<div class="stp"><span class="l">BƯỚC 1 · DỊCH</span><br>'+de+'</div>'+
  '<div class="stp"><span class="l">BƯỚC 2 · TỪ VỰNG</span><div class="g2">'+cells+'</div></div>'+
  '<div class="stp"><span class="l">BƯỚC 3 · TẠI SAO ĐÚNG</span><br><span class="pg">'+why+'</span></div>'+
  '<div class="stp"><span class="l">BƯỚC 4 · LƯU Ý</span><br><span class="pg">'+trap+'</span></div>'+
  (dictWord?DICT(dictWord):'');
}

/* ═════ EX IV — Collocations: do / play / have / study + noun (27 câu) ═════ */
const VERB_NOTE={do:'do = làm (hoạt động không dùng bóng/nhạc cụ, thường là việc lặt vặt hoặc môn võ)',
 play:'play = chơi (môn thể thao dùng bóng/dụng cụ, hoặc chơi nhạc cụ)',
 have:'have = có/ăn (dùng cho bữa ăn hoặc tiết học)',
 study:'study = học (một môn học cụ thể ở trường)'};
function e4(n,w,a,m){
 const opts=['play','do','have','study'];
 const correctIdx=opts.indexOf(a);
 mcqw('S4',n,'<b>'+n+'.</b> Which verb goes with <b>&lsquo;'+w+'&rsquo;</b>?',opts,correctIdx,
  F4('<b>'+a+' '+w+'</b>','Động từ nào đi với &lsquo;'+w+'&rsquo; ('+m+')?',
   opts.map(v=>v===a?G(v+' '+w,'✓ đúng',m):W(v+' '+w,'✗ sai','không phải cụm cố định')).join(''),
   'Cụm cố định (collocation) đúng là <b>'+a+' '+w+'</b> — '+VERB_NOTE[a]+'.',
   'Không thể suy luận theo nghĩa tiếng Việt — mỗi nhóm danh từ chỉ đi được với ĐÚNG MỘT động từ cố định trong 4 động từ trên, con cần học thuộc theo nhóm.',w));
}
const p4Words=[
 ['judo','do','võ judo'],['housework','do','việc nhà'],['homework','do','bài tập về nhà'],['aerobics','do','thể dục nhịp điệu'],
 ['exercise','do','bài tập thể dục'],['drawings','do','vẽ tranh (nét)'],['paintings','do','vẽ tranh (màu)'],['karate','do','võ karate'],
 ['football','play','bóng đá'],['the piano','play','đàn piano'],['sports','play','thể thao'],['badminton','play','cầu lông'],
 ['the violin','play','đàn violin'],['basketball','play','bóng rổ'],
 ['lessons','have','tiết học'],['lunch','have','bữa trưa'],['breakfast','have','bữa sáng'],['English lesson','have','tiết học tiếng Anh'],['dinner','have','bữa tối'],
 ['music','study','âm nhạc'],['history','study','lịch sử'],['English','study','tiếng Anh'],['vocabulary','study','từ vựng'],
 ['geography','study','địa lý'],['science','study','khoa học'],['subjects','study','các môn học'],['maths','study','toán học']
];
p4Words.forEach((it,i)=>e4(i+1,it[0],it[1],it[2]));

/* ═════ EX V — Vocabulary in context (8 câu) ═════ */
function e5(n,q,opts,a,vi,cells,why,trap,dictWord){
 const correctIdx=opts.indexOf(a);
 mcqw('S5',n,'<b>'+n+'.</b> '+q,opts,correctIdx,F4('<b>'+a+'</b>',vi,cells,why,trap,dictWord));
}
e5(1,'Duy looks very ______ in his new uniform.',['smart','classmates','uniforms','library'],'smart',
 'Duy trông rất bảnh bao trong bộ đồng phục mới.',
 G('smart','adj','gọn gàng, bảnh bao')+W('classmates','n','bạn cùng lớp')+W('uniforms','n','đồng phục (số nhiều)')+W('library','n','thư viện'),
 '<b>smart</b> ở đây nghĩa là gọn gàng, ưa nhìn khi mặc đồ mới — phù hợp với "in his new uniform".',
 'Ba đáp án còn lại đều là danh từ, không thể đứng sau "very" để bổ nghĩa cho "looks".','smart');
e5(2,'Phong and Duy are in the same class at school. They are ______.',['subjects','classmates','boarding','international'],'classmates',

const TOTAL=Q.length;let answered=0,score=0;const done={};
function bump(){document.getElementById('fbb').style.width=(answered/TOTAL*100)+'%';
 document.getElementById('sc').textContent=score;
 const p=answered?score/answered:1;
 document.getElementById('md').textContent=p>=.9?'🤩':p>=.7?'😃':p>=.5?'🙂':'💪'}
const APP=document.getElementById('app');let CUR=null;
function sec(col,pill,title,ins){
 const d=document.createElement('div');d.className='sec';
 d.innerHTML='<div class="st"><span class="pill" style="background:'+col+'">'+pill+
  '</span><h2>'+title+'</h2></div><div class="si">'+ins+'</div>';
 APP.appendChild(d);CUR=d}
function render(id){Q.forEach((m,i)=>{if(m.sec===id)CUR.appendChild(build(m,'g'+i))})}

sec('#FF8A5B','EX·IV','🤠 Collocations — do / play / have / study + noun',
 'Chọn đúng động từ đi cùng với từ/cụm từ cho sẵn. Mỗi câu đều có link tra Cambridge Dictionary. (27 câu)');
render('S4');

sec('#D9367E','EX·V','📖 Vocabulary in context',
 'Đọc kỹ câu rồi chọn từ đúng nhất để hoàn thành câu. (8 câu)');
render('S5');

document.getElementById('tt').textContent=TOTAL;bump();

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
  '<div class="opt-grid">'+m.opts.map((o,i)=>'<button class="opt" data-v="'+i+'"><span class="ol">'+String.fromCharCode(65+i)+'.</span>'+o+'</button>').join('')+
  '</div><div class="ex" id="e_'+gid+'" style="display:none;margin-top:12px;background:rgba(18,4,10,.6);border:1px solid rgba(255,209,102,.25);border-radius:5px;padding:13px;font-size:.94rem;line-height:1.82">'+m.ex+'</div>';
 c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(done[gid])return;done[gid]=true;answered++;
  const picked=+b.dataset.v,ok=(picked===m.correctIdx);
  c.querySelectorAll('.opt').forEach(x=>{x.disabled=true;
   if(+x.dataset.v===m.correctIdx)x.classList.add('ok');else if(+x.dataset.v===picked)x.classList.add('no');});
  document.getElementById('e_'+gid).style.display='block';
  if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),450)}
  bump();
 });
 return c;
}
function openName(){document.getElementById('nOv').classList.add('on');
 setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 XUẤT SẮC, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu — collocation quá vững rồi! 🎉';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 LÀM TỐT LẮM, '+nm+'!';msg='Điểm khá rồi! Đọc kỹ giải thích 4 bước ở những câu sai nhé!';
  gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🎞️ CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc kỹ giải thích rồi tra Cambridge Dictionary để nhớ lâu hơn nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
