<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Midterm — TEST 3</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --board:#2b4a3e; --board2:#20382e; --chalk:#f6f2e7; --pink:#ff9ec4; --yellow:#ffe08a; --blue:#9cd6ff; --cgreen:#a8e6a3;
  --paper:#fffdf6; --green:#16a34a; --wrong:#e5484d; --pblue:#2563eb; --purpleT:#6a3fd6; --terra:#b4530f; --grammar:#c81e4e; --ink:#2a2620; --wood:#8a5a2b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;
  background-color:var(--board);
  background-image:radial-gradient(circle at 18% 22%,rgba(255,255,255,.06),transparent 38%),
    radial-gradient(circle at 82% 68%,rgba(255,255,255,.05),transparent 42%),
    radial-gradient(circle at 50% 90%,rgba(255,255,255,.04),transparent 40%);
  border:12px solid var(--wood);}
.frame{position:fixed;inset:0;border:3px solid rgba(0,0,0,.25);pointer-events:none;z-index:2}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaties span{position:absolute;font-size:2rem;opacity:.4;animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 80px}
.head{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:var(--board2);border:2px dashed rgba(246,242,231,.6);color:var(--chalk);font-weight:800;font-size:.8rem;padding:5px 14px;border-radius:14px}
.title{margin-top:14px;font-family:'Patrick Hand';font-weight:400;font-size:2.6rem;color:var(--chalk);letter-spacing:1px;line-height:1;text-shadow:0 0 8px rgba(246,242,231,.35)}
.sub{display:inline-block;margin-top:8px;background:var(--board2);border:2px dashed var(--yellow);border-radius:12px;padding:4px 14px;font-family:'Patrick Hand';font-size:1.25rem;color:var(--yellow)}
.progbar{height:15px;background:var(--board2);border:2px solid rgba(246,242,231,.5);border-radius:20px;margin:16px 0;overflow:hidden}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--cgreen),var(--yellow),var(--pink));transition:width .4s}
.sec{margin:26px 0 12px;background:var(--board2);color:var(--chalk);border:2px dashed rgba(246,242,231,.55);border-radius:12px;padding:9px 16px;font-family:'Patrick Hand';font-size:1.4rem;letter-spacing:.5px;text-shadow:0 0 6px rgba(246,242,231,.25)}
.card{background:var(--paper);border:2px solid #e6ddc0;border-radius:14px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 10px 22px rgba(0,0,0,.28)}
.qnum{display:inline-block;background:var(--board);color:var(--chalk);font-family:'Patrick Hand';font-size:1.15rem;border-radius:10px;padding:0 12px;margin-right:8px;vertical-align:2px}
.qtext{font-size:1.15rem;font-weight:800;line-height:1.5;display:inline}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px}
.hint{font-size:.85rem;color:#8a6a1a;font-weight:800;margin-top:8px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid #e0d7ba;border-radius:12px;padding:13px 12px;font-family:'Nunito';font-size:1.08rem;font-weight:800;color:#4a4230;cursor:pointer;box-shadow:0 4px 0 #e9e1c6;transition:transform .12s;text-align:center}
.opt:nth-child(4n+1){background:#fffbe9}.opt:nth-child(4n+2){background:#eaf6ff}.opt:nth-child(4n+3){background:#ffeef5}.opt:nth-child(4n){background:#ecfbea}
.opt:hover:not(:disabled){transform:scale(1.04)}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green)!important;border-color:#0f7a37!important;color:#fff!important;box-shadow:0 4px 0 #0f7a37!important}
.opt.wrong{background:var(--wrong)!important;border-color:#b3181d!important;color:#fff!important;box-shadow:0 4px 0 #b3181d!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.tin{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tin input{flex:1;min-width:180px;font-family:'Nunito';font-size:1.05rem;font-weight:700;padding:11px 14px;border-radius:10px;border:2px solid #e0d7ba;background:#fffef9;color:var(--ink)}
.tin input:focus{outline:none;border-color:var(--board)}
.tin input.ok{border-color:var(--green);background:#ecfbea}
.tin input.no{border-color:var(--wrong);background:#ffeef0}
.btnc{background:var(--board);color:var(--chalk);border:2px solid #1a2f27;border-radius:10px;padding:11px 20px;font-family:'Patrick Hand';font-size:1.2rem;cursor:pointer;box-shadow:0 4px 0 #16281f;transition:transform .12s}
.btnc:hover:not(:disabled){transform:scale(1.05)} .btnc:disabled{opacity:.55;cursor:default}
.letters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lbtn{width:50px;height:50px;border-radius:10px;border:2px solid #e0d7ba;font-family:'Patrick Hand';font-size:1.5rem;cursor:pointer;background:#fffbe9;color:var(--board);box-shadow:0 4px 0 #e9e1c6;transition:transform .12s}
.lbtn:hover:not(:disabled){transform:scale(1.08)}
.lbtn.sel{background:var(--yellow);color:#6a4e00}
.lbtn.correct{background:var(--green);color:#fff;border-color:#0f7a37}
.lbtn.wrong{background:var(--wrong);color:#fff;border-color:#b3181d}
.lbtn:disabled{cursor:default}
.mark{background:#fff3c4;border:1px solid #e0c98a;border-radius:5px;padding:0 4px;font-weight:800}
.mark sup{color:var(--wrong);font-family:'Patrick Hand';font-size:.85rem}
.exp{margin-top:14px;max-height:0;overflow:hidden;transition:max-height .5s ease;font-size:1rem}
.exp.open{max-height:1700px}
.expin{background:#fffef8;border:2px dashed #cbbf95;border-radius:12px;padding:14px}
.exp ol{margin:6px 0 0 20px} .exp li{margin:8px 0;line-height:1.55}
.vnt{background:#fff2e0;border-left:5px solid var(--terra);border-radius:10px;padding:8px 12px;font-weight:800;color:#7a3e00;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0}
.grid2>div{line-height:1.5}
.p-word{color:var(--pblue);font-weight:800}
.hl-green{color:#0a7c34;font-weight:900}
.hl-red{color:var(--wrong);font-weight:900}
.wt{background:#ece3ff;color:var(--purpleT);border-radius:6px;padding:0 6px;font-size:.78rem;font-weight:800}
.p-phonetic{color:var(--purpleT);background:#f0e9ff;border-radius:6px;padding:0 6px;font-weight:700}
.p-mean{color:var(--terra);font-weight:800}
.p-grammar{border-bottom:2.5px solid var(--grammar);color:#7a1030;font-weight:800}
.keyline{background:#ecfbea;border:2px solid #9fe0a3;border-radius:10px;padding:8px 12px;font-weight:800;color:#0a5a28;margin-bottom:8px}
.submit{display:block;width:100%;margin-top:24px;background:var(--board2);color:var(--chalk);border:3px dashed var(--yellow);border-radius:16px;padding:18px;font-family:'Patrick Hand';font-size:1.7rem;letter-spacing:1px;cursor:pointer;text-shadow:0 0 6px rgba(246,242,231,.3)}
.submit:hover{transform:scale(1.02)}
.overlay{position:fixed;inset:0;background:rgba(15,30,25,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--paper);border:3px solid var(--board);border-radius:18px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Patrick Hand';font-size:1.7rem;color:var(--board);margin-bottom:12px}
.modal input{width:100%;padding:14px;border-radius:10px;border:2px solid #e0d7ba;font-size:1.05rem;font-family:'Nunito';font-weight:700;margin-bottom:6px}
.modal input.err{border-color:var(--wrong);background:#ffeef0}
.errmsg{color:var(--wrong);font-weight:800;font-size:.9rem;min-height:20px;margin-bottom:8px}
.modal button{background:var(--board);color:var(--chalk);border:none;border-radius:10px;padding:12px 26px;font-family:'Patrick Hand';font-size:1.3rem;cursor:pointer}
.rgreet{font-family:'Patrick Hand';font-size:1.7rem;color:var(--board);line-height:1.2}
.rscore{font-family:'Patrick Hand';font-size:2.6rem;color:var(--ink);margin:8px 0}
.rten{font-size:1.5rem;font-weight:900;color:var(--terra);margin-bottom:12px}
.rmeme{width:100%;max-width:280px;border-radius:12px;border:2px solid var(--board);margin:0 auto 14px;display:block;min-height:120px;object-fit:cover}
.memefall{font-size:5rem}
@media(max-width:560px){.opts,.grid2{grid-template-columns:1fr}.title{font-size:2rem}}
</style>
</head>
<body>
<div class="frame"></div>
<div class="floaties" id="floaties"></div>
<div class="wrap">
  <div class="head">
    <div class="badge">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên</div>
    <div class="title">📐 The First Midterm</div>
    <div><span class="sub">TEST 3 — Phần I–VI &amp; IX–XI (bỏ Reading VII, VIII)</span></div>
    <div class="progbar"><div class="progfill" id="prog"></div></div>
  </div>
  <div id="quiz"></div>
  <button class="submit" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="overlay" id="nameOv">
  <div class="modal">
    <h2>✍️ Nhập tên của em nhé!</h2>
    <input id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
    <div class="errmsg" id="nameErr"></div>
    <button onclick="showResult()">Xem kết quả 🚀</button>
  </div>
</div>
<div class="overlay" id="resOv">
  <div class="modal">
    <div class="rgreet" id="rGreet"></div>
    <div class="rscore" id="rScore"></div>
    <div class="rten" id="rTen"></div>
    <img class="rmeme" id="rMeme" alt="result">
    <div class="memefall" id="rFall" style="display:none"></div>
    <button onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
(function(){
  const ico=['✏️','📐','📏','🍎','⭐','✨','🔤','🧮','📖','💡','📚','📝'];
  const f=document.getElementById('floaties');
  for(let i=0;i<16;i++){const s=document.createElement('span');
    s.textContent=ico[i%ico.length];s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(15+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(1.4+Math.random()*1.6)+'rem';f.appendChild(s);}
})();
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=i?1318:988;o.connect(g);g.connect(c.destination);
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);
  g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.4);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function confetti(){const cols=['#a8e6a3','#ffe08a','#ff9ec4','#9cd6ff','#f6f2e7','#16a34a'];
  for(let i=0;i<70;i++){const d=document.createElement('div');
    d.style.cssText='position:fixed;z-index:99;width:10px;height:14px;top:-20px;pointer-events:none;border-radius:2px;';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1500+Math.random()*1500,x=(Math.random()-.5)*300;
    d.animate([{transform:d.style.transform,opacity:1},
      {transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:0}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[.,?!;:'"’\-]/g,' ').replace(/\s+/g,' ').trim();}
function matchWriting(input,answers){const ni=norm(input);if(!ni)return false;
  for(const a of answers){const na=norm(a);if(ni===na)return true;
    if(na.includes(ni)&&ni.length>=na.length*0.5)return true;if(ni.includes(na))return true;}return false;}
let TOTAL=0,correctCount=0,answered=0;
function updateProg(){document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';}

/* ============================================================
   DATA — THE FIRST MIDTERM · TEST 3 (bỏ Reading VII, VIII)
   ============================================================ */
const Q=[];
function sec(t){Q.push({sec:t});}
function mcq(num,q,opts,correctIdx,exp){Q.push({type:'mcq',num,q,opts,correctIdx,exp});}
function txt(num,q,ans,exp,hint){Q.push({type:'txt',num,q,ans,exp,hint});}
function cor(num,q,parts,cIdx,corr,exp){Q.push({type:'cor',num,q,parts,cIdx,corr,exp});}

/* ---------- I. Pronunciation ---------- */
sec("I. Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại");
mcq(1,"Chọn từ có phần gạch chân được phát âm khác:",
 ["sh<u>a</u>pe","str<u>a</u>nge","t<u>a</u>ble","h<u>a</u>ll"],3,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "a" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>shape</span> <span class='p-phonetic'>/ʃeɪp/</span> = <span class='p-mean'>hình dạng</span> → /eɪ/</div>
 <div><span class='p-word'>strange</span> <span class='p-phonetic'>/streɪndʒ/</span> = <span class='p-mean'>kỳ lạ</span> → /eɪ/</div>
 <div><span class='p-word'>table</span> <span class='p-phonetic'>/ˈteɪbl/</span> = <span class='p-mean'>cái bàn</span> → /eɪ/</div>
 <div><span class='hl-green'>hall</span> <span class='p-phonetic'>/hɔːl/</span> = <span class='p-mean'>sảnh</span> → /ɔː/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"hall" có "a" đọc /ɔː/. Ba từ kia "a" đọc /eɪ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>shape, strange, table đều /eɪ/ nên giống nhau.</span></li></ol>`);
mcq(2,"Chọn từ có phần gạch chân được phát âm khác:",
 ["cam<u>p</u>","cu<u>p</u>board","com<u>p</u>ass","<u>p</u>ainting"],1,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "p" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>camp</span> <span class='p-phonetic'>/kæmp/</span> = <span class='p-mean'>trại</span> → /p/</div>
 <div><span class='hl-green'>cupboard</span> <span class='p-phonetic'>/ˈkʌbəd/</span> = <span class='p-mean'>tủ chén</span> → p CÂM (∅)</div>
 <div><span class='p-word'>compass</span> <span class='p-phonetic'>/ˈkʌmpəs/</span> = <span class='p-mean'>com-pa</span> → /p/</div>
 <div><span class='p-word'>painting</span> <span class='p-phonetic'>/ˈpeɪntɪŋ/</span> = <span class='p-mean'>bức tranh</span> → /p/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"cupboard" có "p" CÂM (không đọc): /ˈkʌbəd/. Ba từ kia "p" đọc /p/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>camp, compass, painting đều phát âm /p/ rõ ràng.</span></li></ol>`);

/* ---------- II. Stress ---------- */
sec("II. Chọn từ có TRỌNG ÂM khác các từ còn lại");
mcq(3,"Chọn từ có trọng âm khác:",
 ["corner","hotel","behind","prepare"],0,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>COR-ner</span> <span class='wt'>n</span> = <span class='p-mean'>góc</span> → âm 1</div>
 <div><span class='p-word'>ho-TEL</span> <span class='wt'>n</span> = <span class='p-mean'>khách sạn</span> → âm 2</div>
 <div><span class='p-word'>be-HIND</span> <span class='wt'>prep</span> = <span class='p-mean'>phía sau</span> → âm 2</div>
 <div><span class='p-word'>pre-PARE</span> <span class='wt'>v</span> = <span class='p-mean'>chuẩn bị</span> → âm 2</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"corner" nhấn âm tiết ĐẦU. Ba từ kia nhấn âm tiết THỨ HAI.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>hotel, behind, prepare đều nhấn âm tiết 2.</span></li></ol>`);
mcq(4,"Chọn từ có trọng âm khác:",
 ["uniform","chemistry","badminton","attention"],3,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>U-ni-form</span> <span class='wt'>n</span> = <span class='p-mean'>đồng phục</span> → âm 1</div>
 <div><span class='p-word'>CHE-mis-try</span> <span class='wt'>n</span> = <span class='p-mean'>hóa học</span> → âm 1</div>
 <div><span class='p-word'>BAD-min-ton</span> <span class='wt'>n</span> = <span class='p-mean'>cầu lông</span> → âm 1</div>
 <div><span class='hl-green'>at-TEN-tion</span> <span class='wt'>n</span> = <span class='p-mean'>sự chú ý</span> → âm 2</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"attention" nhấn âm tiết THỨ HAI. Ba từ kia nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>uniform, chemistry, badminton đều nhấn âm tiết 1.</span></li></ol>`);

/* ---------- III. ---------- */
sec("III. Chọn từ/cụm từ phù hợp nhất");
mcq(5,"Derek _____ drinks coffee in the morning. He prefers milk.",
 ["always","usually","often","rarely"],3,
 `<div class="vnt">💬 Dịch: Derek hiếm khi uống cà phê buổi sáng. Cậu ấy thích sữa hơn.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>always</span> = <span class='p-mean'>luôn luôn</span></div><div><span class='p-word'>usually</span> = <span class='p-mean'>thường xuyên</span></div>
 <div><span class='p-word'>often</span> = <span class='p-mean'>hay</span></div><div><span class='hl-green'>rarely</span> = <span class='p-mean'>hiếm khi</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"He prefers milk" (thích sữa hơn) → hiếm khi uống cà phê → "rarely".</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>always/usually/often mâu thuẫn với việc "thích sữa hơn cà phê".</span></li></ol>`);
mcq(6,"_____ any funny comics on your bookshelf?",
 ["There is","There are","Are there","Is there"],2,
 `<div class="vnt">💬 Dịch: Trên giá sách của bạn có cuốn truyện tranh vui nào không?</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>There is</span> = <span class='p-mean'>câu khẳng định (số ít)</span></div>
 <div><span class='p-word'>There are</span> = <span class='p-mean'>câu khẳng định (số nhiều)</span></div>

  card.innerHTML=`<div><span class="qnum">Câu ${it.num}</span><span class="qtext">${render(it)}</span></div>`;
  if(it.type==='mcq'){
    const wrap=document.createElement('div');wrap.className='opts';
    const arr=it.opts.map((t,i)=>({t,correct:i===it.correctIdx}));shuffle(arr);
    arr.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>pickMcq(it,card,wrap,b,o.correct);wrap.appendChild(b);});
    card.appendChild(wrap);
  }else if(it.type==='txt'){
    if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='('+it.hint+')';card.appendChild(h);}
    const box=document.createElement('div');box.className='tin';
    const inp=document.createElement('input');inp.placeholder='Gõ đáp án của em...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    const act=()=>checkTxt(it,card,inp,btn);
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    box.appendChild(inp);box.appendChild(btn);card.appendChild(box);
  }else if(it.type==='cor'){
    const letters=document.createElement('div');letters.className='letters';
    const L=['A','B','C','D'];let selIdx=-1;
    const inBox=document.createElement('div');inBox.className='tin';inBox.style.display='none';
    const inp=document.createElement('input');inp.placeholder='Gõ chữ ĐÚNG để sửa...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    inBox.appendChild(inp);inBox.appendChild(btn);
    const lbtns=[];
    L.forEach((L_,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=L_;
      b.onclick=()=>{if(card.dataset.done)return;selIdx=i;lbtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        inBox.style.display='flex';inp.focus();};
      lbtns.push(b);letters.appendChild(b);});
    const act=()=>{if(selIdx<0){inp.placeholder='Hãy chọn chữ cái A–D trước!';return;}checkCor(it,card,lbtns,selIdx,inp,btn);};
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    card.appendChild(letters);card.appendChild(inBox);
  }
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=`<div class="expin">${it.exp}</div>`;
  card.appendChild(exp);quiz.appendChild(card);
});
function render(it){
  if(it.type==='cor'){const L=['A','B','C','D'];let s=it.q;
    it.parts.forEach((p,i)=>{s=s.replace('{'+p+'}',`<span class="mark">${p}<sup>${L[i]}</sup></span>`);});return s;}
  return it.q;
}
function openExp(card){card.querySelector('.exp').classList.add('open');}
function lock(card){card.dataset.done='1';answered++;updateProg();}
function pickMcq(it,card,wrap,btn,correct){
  if(card.dataset.done)return;lock(card);
  [...wrap.children].forEach(b=>{b.disabled=true;if(b.innerHTML===it.opts[it.correctIdx])b.classList.add('correct');});
  if(correct){correctCount++;btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong','shake');buzz();}
  openExp(card);
}
function checkTxt(it,card,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;
  const ok=matchWriting(inp.value,it.ans);
  if(ok){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function checkCor(it,card,lbtns,selIdx,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;lbtns.forEach(b=>b.disabled=true);
  const letterOk=selIdx===it.cIdx, textOk=matchWriting(inp.value,it.corr);
  lbtns[it.cIdx].classList.add('correct');
  if(selIdx!==it.cIdx)lbtns[selIdx].classList.add('wrong');
  if(letterOk&&textOk){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function openName(){document.getElementById('nameOv').classList.add('show');document.getElementById('nameIn').focus();}
function showResult(){
  const n=document.getElementById('nameIn').value.trim();
  const err=document.getElementById('nameErr'),inp=document.getElementById('nameIn');
  if(!n){inp.classList.add('err');err.textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('nameOv').classList.remove('show');
  const pct=correctCount/TOTAL, ten=(correctCount/TOTAL*10).toFixed(2);
  let greet,meme;
  if(pct===1){greet='🌟 THIÊN TÀI! '+n+' xuất sắc tuyệt đối!';meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+n+' làm rất tốt, cố thêm chút nữa nhé!';meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN '+n+'! Ôn lại phần giải thích rồi làm lại nha!';meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent='✅ '+correctCount+' / '+TOTAL+' câu đúng';
  document.getElementById('rTen').textContent='📊 Điểm quy đổi: '+ten+' / 10';
  const img=document.getElementById('rMeme'),fall=document.getElementById('rFall');
  img.style.display='block';fall.style.display='none';img.src=meme;
  img.onerror=()=>{img.style.display='none';fall.style.display='block';
    fall.textContent=pct===1?'🎉🏆🎉':(pct>=0.6?'😄👍':'😭💧');};
  document.getElementById('resOv').classList.add('show');
  if(pct>=0.6){confetti();setTimeout(confetti,400);}
}
updateProg();
</script>
