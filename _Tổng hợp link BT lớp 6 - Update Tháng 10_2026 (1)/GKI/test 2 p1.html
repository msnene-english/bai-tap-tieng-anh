<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Midterm — TEST 2</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ff3b3b; --blue:#2d9bf0; --yellow:#ffd23f; --cyan:#00c2d1; --ink:#111;
  --green:#16a34a; --wrong:#ef4444; --pblue:#1d4ed8; --purpleT:#6a3fd6; --terra:#b4530f; --grammar:#e11d48;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;
  background-color:#ffe66b;
  background-image:radial-gradient(rgba(0,0,0,.09) 2.2px, transparent 2.3px);
  background-size:20px 20px;}
.floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaties span{position:absolute;font-size:2rem;opacity:.55;animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:18px 14px 80px}
.head{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:#fff;border:3px solid var(--ink);color:var(--ink);font-weight:900;font-size:.8rem;padding:5px 14px;border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.title{margin-top:14px;font-family:'Bangers';font-weight:400;font-size:2.8rem;color:var(--red);letter-spacing:2px;line-height:1;
  text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.sub{display:inline-block;margin-top:10px;background:var(--blue);border:3px solid var(--ink);border-radius:12px;padding:4px 14px;font-family:'Bangers';letter-spacing:1px;font-size:1.05rem;color:#fff;box-shadow:3px 3px 0 var(--ink)}
.progbar{height:16px;background:#fff;border:3px solid var(--ink);border-radius:20px;margin:16px 0;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.progfill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--red),var(--red) 10px,var(--yellow) 10px,var(--yellow) 20px);transition:width .4s}
.sec{margin:26px 0 12px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:9px 16px;font-family:'Bangers';font-weight:400;letter-spacing:1px;font-size:1.25rem;box-shadow:5px 5px 0 var(--ink)}
.card{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:16px 16px 14px;margin-bottom:18px;box-shadow:6px 6px 0 var(--ink)}
.qnum{display:inline-block;background:var(--blue);color:#fff;font-family:'Bangers';letter-spacing:1px;border:2px solid var(--ink);border-radius:9px;padding:2px 11px;font-size:1rem;margin-right:8px}
.qtext{font-size:1.15rem;font-weight:800;line-height:1.5;display:inline}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px}
.hint{font-size:.85rem;color:#b4530f;font-weight:900;margin-top:8px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:13px 12px;font-family:'Nunito';font-size:1.08rem;font-weight:900;color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;text-align:center}
.opt:nth-child(4n+1){background:#fff5c2}.opt:nth-child(4n+2){background:#d6ecff}.opt:nth-child(4n+3){background:#ffe0e0}.opt:nth-child(4n){background:#d9fbe0}
.opt:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.opt:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--green)!important;color:#fff!important}
.opt.wrong{background:var(--wrong)!important;color:#fff!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.tin{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tin input{flex:1;min-width:180px;font-family:'Nunito';font-size:1.05rem;font-weight:800;padding:11px 14px;border-radius:10px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.tin input:focus{outline:none;box-shadow:3px 3px 0 var(--blue)}
.tin input.ok{background:#d9fbe0;border-color:var(--green)}
.tin input.no{background:#ffe0e0;border-color:var(--wrong)}
.btnc{background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px 20px;font-family:'Bangers';letter-spacing:1px;font-size:1.05rem;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
.btnc:hover:not(:disabled){transform:translate(-2px,-2px)} .btnc:disabled{opacity:.55;cursor:default}
.letters{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.lbtn{width:50px;height:50px;border-radius:10px;border:3px solid var(--ink);font-family:'Bangers';font-size:1.3rem;cursor:pointer;background:var(--yellow);color:var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
.lbtn:hover:not(:disabled){transform:translate(-2px,-2px)}
.lbtn.sel{background:var(--cyan);color:#fff}
.lbtn.correct{background:var(--green);color:#fff}
.lbtn.wrong{background:var(--wrong);color:#fff}
.lbtn:disabled{cursor:default}
.mark{background:var(--yellow);border:2px solid var(--ink);border-radius:5px;padding:0 4px;font-weight:900}
.mark sup{color:var(--red);font-family:'Bangers';font-size:.78rem}
.exp{margin-top:14px;max-height:0;overflow:hidden;transition:max-height .5s ease;font-size:1rem}
.exp.open{max-height:1700px}
.expin{background:#fffdf3;border:3px dashed var(--ink);border-radius:12px;padding:14px}
.exp ol{margin:6px 0 0 20px} .exp li{margin:8px 0;line-height:1.55}
.vnt{background:#fff2e0;border-left:5px solid var(--terra);border-radius:10px;padding:8px 12px;font-weight:800;color:#7a3e00;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0}
.grid2>div{line-height:1.5}
.p-word{color:var(--pblue);font-weight:800}
.hl-green{color:#0a7c34;font-weight:900}
.hl-red{color:var(--wrong);font-weight:900}
.wt{background:#ece3ff;color:var(--purpleT);border-radius:6px;padding:0 6px;font-size:.78rem;font-weight:800}
.p-phonetic{color:var(--purpleT);background:#f0e9ff;border-radius:6px;padding:0 6px;font-weight:700}
.p-mean{color:var(--terra);font-weight:800}
.p-grammar{border-bottom:2.5px solid var(--grammar);color:#7a1030;font-weight:800}
.keyline{background:#d9fbe0;border:2px solid var(--green);border-radius:10px;padding:8px 12px;font-weight:800;color:#0a5a28;margin-bottom:8px}
.submit{display:block;width:100%;margin-top:24px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:18px;font-family:'Bangers';letter-spacing:2px;font-size:1.6rem;cursor:pointer;box-shadow:6px 6px 0 var(--ink)}
.submit:hover{transform:translate(-2px,-2px)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:8px 8px 0 var(--ink);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Bangers';letter-spacing:1px;font-size:1.6rem;color:var(--red);margin-bottom:12px}
.modal input{width:100%;padding:14px;border-radius:10px;border:3px solid var(--ink);font-size:1.05rem;font-family:'Nunito';font-weight:800;margin-bottom:6px}
.modal input.err{border-color:var(--wrong);background:#ffe0e0}
.errmsg{color:var(--wrong);font-weight:800;font-size:.9rem;min-height:20px;margin-bottom:8px}
.modal button{background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:12px 26px;font-family:'Bangers';letter-spacing:1px;font-size:1.2rem;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.rgreet{font-family:'Bangers';letter-spacing:1px;font-size:1.6rem;color:var(--red);line-height:1.2}
.rscore{font-family:'Bangers';letter-spacing:1px;font-size:2.4rem;color:var(--ink);margin:8px 0}
.rten{font-size:1.5rem;font-weight:900;color:var(--blue);margin-bottom:12px}
.rmeme{width:100%;max-width:280px;border-radius:12px;border:3px solid var(--ink);margin:0 auto 14px;display:block;min-height:120px;object-fit:cover}
.memefall{font-size:5rem}
@media(max-width:560px){.opts,.grid2{grid-template-columns:1fr}.title{font-size:2.1rem}}
</style>
</head>
<body>
<div class="floaties" id="floaties"></div>
<div class="wrap">
  <div class="head">
    <div class="badge">👩‍🏫 Giáo viên tạo: Ms. Chí Nên</div>
    <div class="title">THE FIRST MIDTERM</div>
    <div><span class="sub">TEST 2 — Phần I–VI &amp; IX–XI (bỏ Reading VII, VIII)</span></div>
    <div class="progbar"><div class="progfill" id="prog"></div></div>
  </div>
  <div id="quiz"></div>
  <button class="submit" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="overlay" id="nameOv">
  <div class="modal">
    <h2>✍️ Nhập tên của em nhé!</h2>
    <input id="nameIn" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
    <div class="errmsg" id="nameErr"></div>
    <button onclick="showResult()">Xem kết quả 🚀</button>
  </div>
</div>
<div class="overlay" id="resOv">
  <div class="modal">
    <div class="rgreet" id="rGreet"></div>
    <div class="rscore" id="rScore"></div>
    <div class="rten" id="rTen"></div>
    <img class="rmeme" id="rMeme" alt="result">
    <div class="memefall" id="rFall" style="display:none"></div>
    <button onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
(function(){
  const ico=['💥','⭐','📚','✏️','💡','🎨','🌟','❗','📝','🎒','🔥','✨'];
  const f=document.getElementById('floaties');
  for(let i=0;i<16;i++){const s=document.createElement('span');
    s.textContent=ico[i%ico.length];s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(15+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.fontSize=(1.5+Math.random()*1.6)+'rem';f.appendChild(s);}
})();
let AC;function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=ac();[0,.12].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=i?1318:988;o.connect(g);g.connect(c.destination);
  const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);
  g.gain.exponentialRampToValueAtTime(.001,s+.4);o.start(s);o.stop(s+.4);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function confetti(){const cols=['#ff3b3b','#2d9bf0','#ffd23f','#00c2d1','#16a34a','#111'];
  for(let i=0;i<70;i++){const d=document.createElement('div');
    d.style.cssText='position:fixed;z-index:99;width:11px;height:15px;top:-20px;pointer-events:none;border:2px solid #111;border-radius:2px;';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);
    const dur=1500+Math.random()*1500,x=(Math.random()-.5)*300;
    d.animate([{transform:d.style.transform,opacity:1},
      {transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:0}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[.,?!;:'"’\-]/g,' ').replace(/\s+/g,' ').trim();}
function matchWriting(input,answers){const ni=norm(input);if(!ni)return false;
  for(const a of answers){const na=norm(a);if(ni===na)return true;
    if(na.includes(ni)&&ni.length>=na.length*0.5)return true;if(ni.includes(na))return true;}return false;}
let TOTAL=0,correctCount=0,answered=0;
function updateProg(){document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';}

/* ============================================================
   DATA — THE FIRST MIDTERM · TEST 2 (bỏ Reading VII, VIII)
   ============================================================ */
const Q=[];
function sec(t){Q.push({sec:t});}
function mcq(num,q,opts,correctIdx,exp){Q.push({type:'mcq',num,q,opts,correctIdx,exp});}
function txt(num,q,ans,exp,hint){Q.push({type:'txt',num,q,ans,exp,hint});}
function cor(num,q,parts,cIdx,corr,exp){Q.push({type:'cor',num,q,parts,cIdx,corr,exp});}

/* ---------- I. Pronunciation ---------- */
sec("I. Chọn từ có phần gạch chân phát âm KHÁC các từ còn lại");
mcq(1,"Chọn từ có phần gạch chân (đuôi -s) được phát âm khác:",
 ["bedroom<u>s</u>","flat<u>s</u>","librarie<u>s</u>","friend<u>s</u>"],1,
 `<div class="vnt">💬 Dịch: Tìm từ có đuôi "-s" phát âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>bedrooms</span> <span class='p-phonetic'>/-mz/</span> = <span class='p-mean'>các phòng ngủ</span> → /z/</div>
 <div><span class='hl-green'>flats</span> <span class='p-phonetic'>/flæts/</span> = <span class='p-mean'>các căn hộ</span> → /s/</div>
 <div><span class='p-word'>libraries</span> <span class='p-phonetic'>/-iz/</span> = <span class='p-mean'>các thư viện</span> → /z/</div>
 <div><span class='p-word'>friends</span> <span class='p-phonetic'>/-dz/</span> = <span class='p-mean'>bạn bè</span> → /z/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"flats" có "-s" đọc /s/ (sau âm vô thanh /t/). Ba từ kia "-s" đọc /z/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>bedrooms, libraries, friends đều /z/ nên giống nhau.</span></li></ol>`);
mcq(2,"Chọn từ có phần gạch chân được phát âm khác:",
 ["br<u>igh</u>t","m<u>i</u>crowave","h<u>i</u>story","t<u>i</u>dy"],2,
 `<div class="vnt">💬 Dịch: Tìm từ có âm "i" gạch chân khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>bright</span> <span class='p-phonetic'>/braɪt/</span> = <span class='p-mean'>sáng</span> → /aɪ/</div>
 <div><span class='p-word'>microwave</span> <span class='p-phonetic'>/ˈmaɪkrəweɪv/</span> = <span class='p-mean'>lò vi sóng</span> → /aɪ/</div>
 <div><span class='hl-green'>history</span> <span class='p-phonetic'>/ˈhɪstri/</span> = <span class='p-mean'>lịch sử</span> → /ɪ/</div>
 <div><span class='p-word'>tidy</span> <span class='p-phonetic'>/ˈtaɪdi/</span> = <span class='p-mean'>gọn gàng</span> → /aɪ/</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"history" có "i" đọc ngắn /ɪ/. Ba từ kia "i" đọc /aɪ/.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>bright, microwave, tidy đều /aɪ/ nên giống nhau.</span></li></ol>`);

/* ---------- II. Stress ---------- */
sec("II. Chọn từ có TRỌNG ÂM khác các từ còn lại");
mcq(3,"Chọn từ có trọng âm khác:",
 ["crazy","compass","between","friendly"],2,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>CRA-zy</span> <span class='wt'>adj</span> = <span class='p-mean'>điên rồ</span> → âm 1</div>
 <div><span class='p-word'>COM-pass</span> <span class='wt'>n</span> = <span class='p-mean'>com-pa</span> → âm 1</div>
 <div><span class='hl-green'>be-TWEEN</span> <span class='wt'>prep</span> = <span class='p-mean'>ở giữa</span> → âm 2</div>
 <div><span class='p-word'>FRIEND-ly</span> <span class='wt'>adj</span> = <span class='p-mean'>thân thiện</span> → âm 1</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"between" nhấn âm tiết THỨ HAI. Ba từ kia nhấn âm tiết ĐẦU.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>crazy, compass, friendly đều nhấn âm tiết 1.</span></li></ol>`);
mcq(4,"Chọn từ có trọng âm khác:",
 ["confident","appearance","remember","together"],0,
 `<div class="vnt">💬 Dịch: Tìm từ nhấn trọng âm khác biệt.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='hl-green'>CON-fi-dent</span> <span class='wt'>adj</span> = <span class='p-mean'>tự tin</span> → âm 1</div>
 <div><span class='p-word'>ap-PEAR-ance</span> <span class='wt'>n</span> = <span class='p-mean'>vẻ ngoài</span> → âm 2</div>
 <div><span class='p-word'>re-MEM-ber</span> <span class='wt'>v</span> = <span class='p-mean'>nhớ</span> → âm 2</div>
 <div><span class='p-word'>to-GE-ther</span> <span class='wt'>adv</span> = <span class='p-mean'>cùng nhau</span> → âm 2</div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"confident" nhấn âm tiết ĐẦU. Ba từ kia nhấn âm tiết THỨ HAI.</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>appearance, remember, together đều nhấn âm tiết 2.</span></li></ol>`);

/* ---------- III. ---------- */
sec("III. Chọn từ/cụm từ phù hợp nhất");
mcq(5,"In science class, students can visit the school _____ and water the plants.",
 ["workshop","garden","playground","library"],1,
 `<div class="vnt">💬 Dịch: Trong giờ khoa học, học sinh có thể ra vườn trường và tưới cây.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>workshop</span> = <span class='p-mean'>xưởng</span></div><div><span class='hl-green'>garden</span> = <span class='p-mean'>vườn</span></div>
 <div><span class='p-word'>playground</span> = <span class='p-mean'>sân chơi</span></div><div><span class='p-word'>library</span> = <span class='p-mean'>thư viện</span></div>
 </div></li>
 <li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"water the plants" (tưới cây) → nơi có cây là "garden" (vườn).</span></li>
 <li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class='p-grammar'>workshop/playground/library không phải nơi trồng cây để tưới.</span></li></ol>`);
mcq(6,"_____ pencil case is the pink one with a picture of a cat on it.",
 ["Mindy","Mindies","Mindy's","Mindys"],2,
 `<div class="vnt">💬 Dịch: Hộp bút của Mindy là cái màu hồng có hình con mèo.</div>
 <ol><li>Phân tích 4 đáp án:
 <div class="grid2">
 <div><span class='p-word'>Mindy</span> = <span class='p-mean'>thiếu sở hữu cách</span></div>
 <div><span class='p-word'>Mindies</span> = <span class='p-mean'>sai</span></div>
 <div><span class='hl-green'>Mindy's</span> = <span class='p-mean'>của Mindy</span></div>
 <div><span class='p-word'>Mindys</span> = <span class='p-mean'>sai</span></div>
 </div></li>

  TOTAL++;
  const card=document.createElement('div');card.className='card';card.id='c'+it.num;
  card.innerHTML=`<div><span class="qnum">Câu ${it.num}</span><span class="qtext">${render(it)}</span></div>`;
  if(it.type==='mcq'){
    const wrap=document.createElement('div');wrap.className='opts';
    const arr=it.opts.map((t,i)=>({t,correct:i===it.correctIdx}));shuffle(arr);
    arr.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;
      b.onclick=()=>pickMcq(it,card,wrap,b,o.correct);wrap.appendChild(b);});
    card.appendChild(wrap);
  }else if(it.type==='txt'){
    if(it.hint){const h=document.createElement('div');h.className='hint';h.textContent='('+it.hint+')';card.appendChild(h);}
    const box=document.createElement('div');box.className='tin';
    const inp=document.createElement('input');inp.placeholder='Gõ đáp án của em...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    const act=()=>checkTxt(it,card,inp,btn);
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    box.appendChild(inp);box.appendChild(btn);card.appendChild(box);
  }else if(it.type==='cor'){
    const letters=document.createElement('div');letters.className='letters';
    const L=['A','B','C','D'];let selIdx=-1;
    const inBox=document.createElement('div');inBox.className='tin';inBox.style.display='none';
    const inp=document.createElement('input');inp.placeholder='Gõ chữ ĐÚNG để sửa...';
    const btn=document.createElement('button');btn.className='btnc';btn.textContent='Kiểm tra ✅';
    inBox.appendChild(inp);inBox.appendChild(btn);
    const lbtns=[];
    L.forEach((L_,i)=>{const b=document.createElement('button');b.className='lbtn';b.textContent=L_;
      b.onclick=()=>{if(card.dataset.done)return;selIdx=i;lbtns.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
        inBox.style.display='flex';inp.focus();};
      lbtns.push(b);letters.appendChild(b);});
    const act=()=>{if(selIdx<0){inp.placeholder='Hãy chọn chữ cái A–D trước!';return;}checkCor(it,card,lbtns,selIdx,inp,btn);};
    btn.onclick=act;inp.onkeydown=e=>{if(e.key==='Enter')act();};
    card.appendChild(letters);card.appendChild(inBox);
  }
  const exp=document.createElement('div');exp.className='exp';exp.innerHTML=`<div class="expin">${it.exp}</div>`;
  card.appendChild(exp);quiz.appendChild(card);
});
function render(it){
  if(it.type==='cor'){const L=['A','B','C','D'];let s=it.q;
    it.parts.forEach((p,i)=>{s=s.replace('{'+p+'}',`<span class="mark">${p}<sup>${L[i]}</sup></span>`);});return s;}
  return it.q;
}
function openExp(card){card.querySelector('.exp').classList.add('open');}
function lock(card){card.dataset.done='1';answered++;updateProg();}
function pickMcq(it,card,wrap,btn,correct){
  if(card.dataset.done)return;lock(card);
  [...wrap.children].forEach(b=>{b.disabled=true;if(b.innerHTML===it.opts[it.correctIdx])b.classList.add('correct');});
  if(correct){correctCount++;btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong','shake');buzz();}
  openExp(card);
}
function checkTxt(it,card,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;
  const ok=matchWriting(inp.value,it.ans);
  if(ok){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function checkCor(it,card,lbtns,selIdx,inp,btn){
  if(card.dataset.done)return;lock(card);inp.disabled=true;btn.disabled=true;lbtns.forEach(b=>b.disabled=true);
  const letterOk=selIdx===it.cIdx, textOk=matchWriting(inp.value,it.corr);
  lbtns[it.cIdx].classList.add('correct');
  if(selIdx!==it.cIdx)lbtns[selIdx].classList.add('wrong');
  if(letterOk&&textOk){correctCount++;inp.classList.add('ok');ding();confetti();}
  else{inp.classList.add('no');card.classList.add('shake');buzz();setTimeout(()=>card.classList.remove('shake'),400);}
  openExp(card);
}
function openName(){document.getElementById('nameOv').classList.add('show');document.getElementById('nameIn').focus();}
function showResult(){
  const n=document.getElementById('nameIn').value.trim();
  const err=document.getElementById('nameErr'),inp=document.getElementById('nameIn');
  if(!n){inp.classList.add('err');err.textContent='⚠️ Em hãy nhập tên trước nhé!';return;}
  inp.classList.remove('err');err.textContent='';
  document.getElementById('nameOv').classList.remove('show');
  const pct=correctCount/TOTAL, ten=(correctCount/TOTAL*10).toFixed(2);
  let greet,meme;
  if(pct===1){greet='🌟 THIÊN TÀI! '+n+' xuất sắc tuyệt đối!';meme='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=0.6){greet='👏 GIỎI LẮM! '+n+' làm rất tốt, cố thêm chút nữa nhé!';meme='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{greet='💪 CỐ LÊN '+n+'! Ôn lại phần giải thích rồi làm lại nha!';meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('rGreet').textContent=greet;
  document.getElementById('rScore').textContent='✅ '+correctCount+' / '+TOTAL+' câu đúng';
  document.getElementById('rTen').textContent='📊 Điểm quy đổi: '+ten+' / 10';
  const img=document.getElementById('rMeme'),fall=document.getElementById('rFall');
  img.style.display='block';fall.style.display='none';img.src=meme;
  img.onerror=()=>{img.style.display='none';fall.style.display='block';
    fall.textContent=pct===1?'🎉🏆🎉':(pct>=0.6?'😄👍':'😭💧');};
  document.getElementById('resOv').classList.add('show');
  if(pct>=0.6){confetti();setTimeout(confetti,400);}
}
updateProg();
</script>
