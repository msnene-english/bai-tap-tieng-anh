<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEST 2 - Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#8854C0;--yellow:#FDCB6E;--teal:#00C9A7;--pink:#FF6B9D;--blue:#5B7FFF;--green:#00D26A;--red:#FF4757;--ink:#eae6ff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand','Nunito',sans-serif;color:var(--ink);min-height:100vh;padding:0 0 60px;background:linear-gradient(-45deg,#3a1a6e,#8854C0,#00C9A7,#5B7FFF,#FF6B9D,#2a1550);background-size:400% 400%;animation:grad 22s ease infinite;}
@keyframes grad{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.gems{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.gem{position:absolute;animation:tw 5s ease-in-out infinite,drift 18s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px}
header{text-align:center;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.35);border-radius:22px;padding:16px 18px;margin-bottom:18px;box-shadow:0 8px 30px rgba(20,0,50,.4)}
header h1{font-family:'Nunito';font-size:2rem;color:#fff;text-shadow:0 0 16px rgba(253,203,110,.9),0 0 30px rgba(0,201,167,.6);letter-spacing:1px}
.teacher{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:700;color:#fff;background:rgba(136,84,192,.6);padding:4px 14px;border-radius:20px}
.sub{color:#fff;font-size:.9rem;margin-top:8px;opacity:.95}
.sec{background:rgba(255,255,255,.12);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.3);border-radius:22px;padding:16px 18px;margin-bottom:16px;box-shadow:0 8px 26px rgba(20,0,50,.35)}
.sec-h{font-family:'Nunito';font-weight:800;font-size:1.15rem;color:#FDCB6E;margin-bottom:4px;text-shadow:0 0 10px rgba(253,203,110,.5)}
.sec-d{font-size:.85rem;color:#cbb6ff;margin-bottom:12px;font-style:italic}
.q{background:rgba(255,255,255,.1);border-radius:16px;padding:13px 15px;margin-bottom:14px;box-shadow:inset 0 0 20px rgba(136,84,192,.15)}
.q-t{font-size:1.15rem;font-weight:700;margin-bottom:11px;line-height:1.5;color:#fff}
.q-n{display:inline-block;background:linear-gradient(145deg,var(--teal),var(--blue));color:#fff;font-weight:800;border-radius:10px;padding:1px 9px;margin-right:7px;font-size:.95rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font-size:1.08rem;font-weight:600;cursor:pointer;text-align:center;padding:13px 10px;border-radius:16px;background:linear-gradient(145deg,#4b2e8a,#6a3fa0);color:#fff;border:2px solid rgba(255,255,255,.25);box-shadow:0 5px 0 #2e1a5e,0 8px 16px rgba(0,0,0,.3);transition:.15s;user-select:none}
.opt:hover{transform:scale(1.04);box-shadow:0 5px 0 #2e1a5e,0 0 18px rgba(253,203,110,.6)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #2e1a5e}
.opt.correct{background:linear-gradient(145deg,#0fd97a,#00D26A);color:#053b20;box-shadow:0 5px 0 #06a34f,0 0 20px rgba(0,210,106,.7)}
.opt.wrong{background:linear-gradient(145deg,#ff5e6c,#FF4757);color:#fff;box-shadow:0 5px 0 #c22733}
.opt.lock{cursor:default}.opt.lock:hover{transform:none;box-shadow:0 5px 0 #2e1a5e}
.tin{font-family:'Quicksand';font-size:1.05rem;font-weight:600;padding:9px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.9);color:#3a2f5b;outline:none;width:100%;transition:.15s}
.tin:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(253,203,110,.4)}
.tin.ok{border-color:var(--green);background:#eafff2}
.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{display:inline-block;font-weight:700;color:#fff;background:rgba(136,84,192,.55);padding:6px 10px;border-radius:10px;margin-right:6px}
.cue{font-family:'Nunito';font-weight:700;color:#3a2f5b;background:rgba(0,201,167,.55);padding:6px 10px;border-radius:10px;display:inline-block;margin-bottom:8px}
.note{background:rgba(253,203,110,.22);border-left:5px solid var(--yellow);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:700;color:#ffe9bf;font-size:.92rem}
.exp{display:none;margin-top:11px;background:rgba(255,255,255,.92);color:#3a2f5b;border-radius:14px;padding:12px 14px;font-size:1rem;line-height:1.65;border-left:5px solid var(--teal);animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.exp ol{margin:6px 0 0 20px}.exp li{margin-bottom:6px}
.vnt{background:rgba(253,203,110,.35);border-radius:10px;padding:8px 11px;font-weight:800;color:#a05a10;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:5px 0}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.p-word{color:#2a6fd6;font-weight:700}
.hl-green{color:var(--green);font-weight:800}
.hl-red{color:var(--red);font-weight:800}
.wt{font-size:.78rem;background:rgba(120,90,170,.15);color:#6a3fa0;padding:1px 6px;border-radius:6px;font-weight:700}
.p-phonetic{color:#8854C0;background:rgba(136,84,192,.12);padding:0 5px;border-radius:5px}
.p-mean{color:#c0562a;font-weight:600}
.p-grammar{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;color:#5a3a8a;font-weight:600}
u{text-decoration-color:var(--yellow);text-decoration-thickness:3px}
.exp u{text-decoration-color:var(--red)}
.submit{display:block;width:100%;font-family:'Nunito';font-weight:800;font-size:1.3rem;color:#fff;cursor:pointer;padding:16px;border:none;border-radius:20px;margin-top:6px;background:linear-gradient(145deg,var(--pink),var(--purple));box-shadow:0 7px 0 #4a2a7a,0 0 24px rgba(255,107,157,.5);transition:.15s}
.submit:hover{transform:scale(1.02)}.submit:active{transform:translateY(4px);box-shadow:0 3px 0 #4a2a7a}
.mask{display:none;position:fixed;inset:0;z-index:50;background:rgba(20,0,50,.65);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:rgba(40,20,80,.96);border:1px solid rgba(255,255,255,.25);border-radius:26px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .3s;color:#fff}
.modal h2{font-family:'Nunito';color:#FDCB6E;margin-bottom:14px;font-size:1.5rem;text-shadow:0 0 12px rgba(253,203,110,.6)}
.modal input{width:100%;font-family:'Quicksand';font-size:1.1rem;font-weight:600;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.95);color:#3a2f5b;outline:none;margin-bottom:6px}
.modal input.err{border-color:var(--red);background:#fff0f1}
.warn{color:#ff8a94;font-weight:700;font-size:.9rem;height:18px;margin-bottom:8px}
.mbtn{font-family:'Nunito';font-weight:800;font-size:1.1rem;color:#fff;cursor:pointer;border:none;border-radius:16px;padding:13px 22px;background:linear-gradient(145deg,var(--teal),var(--blue));box-shadow:0 5px 0 #2e4fbf;transition:.15s;margin:4px}
.mbtn:hover{transform:scale(1.04)}.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2e4fbf}
.mbtn.alt{background:linear-gradient(145deg,var(--yellow),var(--pink));box-shadow:0 5px 0 #c04a70}
.score-big{font-family:'Nunito';font-size:2.6rem;font-weight:800;color:#7dfab0;margin:6px 0;text-shadow:0 0 14px rgba(0,210,106,.5)}
.score-10{font-size:1.5rem;font-weight:800;color:#FDCB6E;margin-bottom:12px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:10px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.memoji{font-size:5rem;margin:10px 0}
.confetti{position:fixed;top:-20px;z-index:99;pointer-events:none;border-radius:2px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="gems" id="gems"></div>
<div class="wrap">
  <header>
    <h1>🌌 TEST 2 🌠</h1>
    <div class="teacher">Giáo viên tạo: Ms MS Chí Nên</div>
    <div class="sub">The First Term Tests · Đêm cực quang huyền ảo ✨</div>
  </header>
  <div id="test"></div>
  <button class="submit" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="mask" id="nameMask"><div class="modal">
  <h2>✨ Em tên là gì nào? ✨</h2>
  <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
  <div class="warn" id="warn"></div>
  <button class="mbtn" onclick="showResult()">Xem kết quả 🚀</button>
</div></div>

<div class="mask" id="resMask"><div class="modal">
  <h2 id="greet"></h2>
  <div class="score-big" id="scoreBig"></div>
  <div class="score-10" id="score10"></div>
  <img class="meme" id="meme" alt="ket qua" style="display:none">
  <div class="memoji" id="memoji"></div>
  <div><button class="mbtn alt" onclick="location.reload()">🔄 Làm lại</button>
  <button class="mbtn" onclick="closeRes()">📖 Xem lại bài</button></div>
</div></div>

<script>
const MQ={
1:{opts:["b<u>u</u>sy","s<u>u</u>burb","f<u>u</u>nny","b<u>u</u>s stop"],correct:"b<u>u</u>sy",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chọn từ có chữ "u" gạch chân phát âm khác các từ còn lại.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>busy</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈbɪzi/</span> = <span class='p-mean'>bận rộn</span> — "u" đọc /ɪ/</div><div><span class='p-word'>suburb</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈsʌbɜːb/</span> = <span class='p-mean'>vùng ngoại ô</span> — "u" đọc /ʌ/</div><div><span class='p-word'>funny</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈfʌni/</span> = <span class='p-mean'>buồn cười</span> — "u" đọc /ʌ/</div><div><span class='p-word'>bus stop</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈbʌs stɒp/</span> = <span class='p-mean'>trạm xe buýt</span> — "u" đọc /ʌ/</div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"busy" là từ bất quy tắc: chữ "u" được đọc thành /ɪ/, khác hẳn 3 từ kia.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>suburb, funny, bus stop đều có "u" đọc /ʌ/ → giống nhau nên không chọn.</span></li></ol>`},
2:{opts:["friend<u>s</u>","desert<u>s</u>","park<u>s</u>","landscape<u>s</u>"],correct:"friend<u>s</u>",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chọn từ có đuôi "-s" gạch chân phát âm khác các từ còn lại.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>friends</span> <span class='wt'>n</span> <span class='p-phonetic'>/frendz/</span> = <span class='p-mean'>những người bạn</span> — "-s" đọc /z/</div><div><span class='p-word'>deserts</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈdezəts/</span> = <span class='p-mean'>những sa mạc</span> — "-s" đọc /s/</div><div><span class='p-word'>parks</span> <span class='wt'>n</span> <span class='p-phonetic'>/pɑːks/</span> = <span class='p-mean'>những công viên</span> — "-s" đọc /s/</div><div><span class='p-word'>landscapes</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈlændskeɪps/</span> = <span class='p-mean'>những phong cảnh</span> — "-s" đọc /s/</div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Quy tắc: "-s" sau âm HỮU THANH (như /d/ trong friend) đọc là /z/ → khác 3 từ kia.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>deserts, parks, landscapes có "-s" sau âm VÔ THANH (/t/, /k/, /p/) nên đọc /s/ → giống nhau.</span></li></ol>`},
3:{opts:["bank","office","school","modern"],correct:"modern",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chọn từ KHÁC LOẠI với các từ còn lại trong nhóm.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>modern</span> <span class='wt'>adj</span> = <span class='p-mean'>hiện đại (tính từ)</span></div><div><span class='p-word'>bank</span> <span class='wt'>n</span> = <span class='p-mean'>ngân hàng (địa điểm)</span></div><div><span class='p-word'>office</span> <span class='wt'>n</span> = <span class='p-mean'>văn phòng (địa điểm)</span></div><div><span class='p-word'>school</span> <span class='wt'>n</span> = <span class='p-mean'>trường học (địa điểm)</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>bank, office, school đều là DANH TỪ chỉ địa điểm; còn "modern" là TÍNH TỪ → khác loại.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>Ba từ kia cùng là nơi chốn nên không thể là đáp án "khác nhóm".</span></li></ol>`},
4:{opts:["midnight","afternoon","weekend","evening"],correct:"weekend",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chọn từ KHÁC LOẠI với các từ còn lại trong nhóm.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>weekend</span> <span class='wt'>n</span> = <span class='p-mean'>cuối tuần (chỉ ngày)</span></div><div><span class='p-word'>midnight</span> <span class='wt'>n</span> = <span class='p-mean'>nửa đêm (mốc trong ngày)</span></div><div><span class='p-word'>afternoon</span> <span class='wt'>n</span> = <span class='p-mean'>buổi chiều (buổi trong ngày)</span></div><div><span class='p-word'>evening</span> <span class='wt'>n</span> = <span class='p-mean'>buổi tối (buổi trong ngày)</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>midnight, afternoon, evening đều chỉ THỜI ĐIỂM/BUỔI trong một ngày; "weekend" chỉ những NGÀY cuối tuần → khác nhóm.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>Ba từ kia cùng thuộc "các buổi trong ngày" nên không phải đáp án.</span></li></ol>`},
5:{opts:["about","to","at","for"],correct:"for",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Bạn có ước điều gì đặc biệt vào ngày sinh nhật không?</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>for</span> <span class='wt'>prep</span> = <span class='p-mean'>cho (đi với wish)</span></div><div><span class='p-word'>about</span> <span class='wt'>prep</span> = <span class='p-mean'>về</span></div><div><span class='p-word'>to</span> <span class='wt'>prep</span> = <span class='p-mean'>đến/để</span></div><div><span class='p-word'>at</span> <span class='wt'>prep</span> = <span class='p-mean'>tại</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Collocation "wish for something" = ước/mong muốn điều gì. Sau đó là danh từ "anything special".</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>wish không đi với about/at; "wish to" chỉ dùng khi theo sau là động từ, không phải danh từ.</span></li></ol>`},
6:{opts:["Mountain","Hill","Mount","Cave"],correct:"Mount",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: _____ Fansipan còn được gọi là "nóc nhà Đông Dương".</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>Mount</span> <span class='wt'>n</span> = <span class='p-mean'>Núi (đứng trước tên riêng)</span></div><div><span class='p-word'>Mountain</span> <span class='wt'>n</span> = <span class='p-mean'>ngọn núi (danh từ chung)</span></div><div><span class='p-word'>Hill</span> <span class='wt'>n</span> = <span class='p-mean'>ngọn đồi</span></div><div><span class='p-word'>Cave</span> <span class='wt'>n</span> = <span class='p-mean'>hang động</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trước TÊN RIÊNG của một ngọn núi ta dùng "Mount" (Mount Fansipan, Mount Everest).</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>"Mountain" là danh từ chung không đứng trước tên riêng; Hill/Cave sai nghĩa (Fansipan là núi).</span></li></ol>`},
7:{opts:["After","Then","Before","First"],correct:"Then",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Hãy rẽ ở chỗ rẽ đầu tiên bên trái. _____ đi thẳng khoảng năm phút.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>Then</span> <span class='wt'>adv</span> = <span class='p-mean'>sau đó</span></div><div><span class='p-word'>After</span> <span class='wt'>prep</span> = <span class='p-mean'>sau khi (cần mệnh đề theo sau)</span></div><div><span class='p-word'>Before</span> <span class='wt'>prep</span> = <span class='p-mean'>trước khi</span></div><div><span class='p-word'>First</span> <span class='wt'>adv</span> = <span class='p-mean'>đầu tiên</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Chỉ dẫn đường theo trình tự: làm việc 1 rồi "Then" (sau đó) làm việc tiếp theo.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>After/Before cần theo sau bởi mệnh đề/danh từ; "First" đã nói ở việc đầu nên không lặp lại.</span></li></ol>`},
8:{opts:["go","have","do","play"],correct:"have",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Bạn thường _____ các buổi học đàn piano khi nào?</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>have</span> <span class='wt'>v</span> = <span class='p-mean'>có/tham gia (buổi học)</span></div><div><span class='p-word'>go</span> <span class='wt'>v</span> = <span class='p-mean'>đi</span></div><div><span class='p-word'>do</span> <span class='wt'>v</span> = <span class='p-mean'>làm</span></div><div><span class='p-word'>play</span> <span class='wt'>v</span> = <span class='p-mean'>chơi</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Collocation "have lessons" = có/tham gia các buổi học.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>go/do/play không kết hợp với "piano lessons"; ta chỉ nói "play the piano" chứ không "play piano lessons".</span></li></ol>`},
9:{opts:["It's at the sports centre.","What is it like?","That's a great idea.","No, we aren't."],correct:"That's a great idea.",

10:{opts:["more pretty","prettier","pretty","more prettier"],correct:"prettier",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Tôi nghĩ hoa hồng đẹp hơn nhiều so với hoa loa kèn.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>prettier</span> <span class='wt'>adj</span> = <span class='p-mean'>đẹp hơn (so sánh hơn)</span></div><div><span class='p-word'>more pretty</span> = <span class='p-mean'>sai cách tạo so sánh</span></div><div><span class='p-word'>pretty</span> = <span class='p-mean'>đẹp (nguyên gốc)</span></div><div><span class='p-word'>more prettier</span> = <span class='p-mean'>thừa "more" (sai)</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Tính từ 2 âm tiết kết thúc bằng "-y" tạo so sánh hơn bằng cách đổi "y" → "ier": pretty → prettier. Có "than" phía sau.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>Không dùng "more pretty"; "more prettier" là lỗi so sánh kép; "pretty" trần không có nghĩa so sánh.</span></li></ol>`},
11:{opts:["Which","What","Where","Who"],correct:"Where",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Bạn muốn đi _____ vào kỳ nghỉ hè tới?</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>Where</span> <span class='wt'>wh</span> = <span class='p-mean'>Ở đâu (hỏi nơi chốn)</span></div><div><span class='p-word'>Which</span> <span class='wt'>wh</span> = <span class='p-mean'>Cái nào</span></div><div><span class='p-word'>What</span> <span class='wt'>wh</span> = <span class='p-mean'>Cái gì</span></div><div><span class='p-word'>Who</span> <span class='wt'>wh</span> = <span class='p-mean'>Ai</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"go on holiday" là đi đến một NƠI → hỏi nơi chốn dùng "Where".</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>Which cần lựa chọn cụ thể; What hỏi vật; Who hỏi người → không hợp câu hỏi về địa điểm.</span></li></ol>`},
12:{opts:["far","near","next","in"],correct:"near",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Izzy sống ở một làng chài _____ biển.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>near</span> <span class='wt'>prep</span> = <span class='p-mean'>gần</span></div><div><span class='p-word'>far</span> <span class='wt'>adj</span> = <span class='p-mean'>xa (cần "from")</span></div><div><span class='p-word'>next</span> <span class='wt'>prep</span> = <span class='p-mean'>bên cạnh (cần "to")</span></div><div><span class='p-word'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>ở trong</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"near + danh từ" = gần cái gì (near the sea). Làng chài thì ở gần biển.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>"far" phải đi với "from"; "next" phải đi với "to"; "in the sea" nghĩa là ở dưới biển (sai).</span></li></ol>`},
13:{opts:["plaster","helmet","uniform","suncream"],correct:"suncream",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Bạn nên bôi một ít _____ loại mạnh trước khi ra biển.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>suncream</span> <span class='wt'>n</span> = <span class='p-mean'>kem chống nắng</span></div><div><span class='p-word'>plaster</span> <span class='wt'>n</span> = <span class='p-mean'>băng cá nhân</span></div><div><span class='p-word'>helmet</span> <span class='wt'>n</span> = <span class='p-mean'>mũ bảo hiểm</span></div><div><span class='p-word'>uniform</span> <span class='wt'>n</span> = <span class='p-mean'>đồng phục</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Manh mối "before going to the beach" (ra biển) → cần bôi kem chống nắng suncream.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>plaster (băng dán), helmet (mũ bảo hiểm), uniform (đồng phục) không liên quan tới việc ra biển chống nắng.</span></li></ol>`},
14:{opts:["never","often","sometimes","usually"],correct:"never",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Bà White _____ đi làm muộn. Bà ấy luôn đúng giờ.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>never</span> <span class='wt'>adv</span> = <span class='p-mean'>không bao giờ</span></div><div><span class='p-word'>often</span> <span class='wt'>adv</span> = <span class='p-mean'>thường xuyên</span></div><div><span class='p-word'>sometimes</span> <span class='wt'>adv</span> = <span class='p-mean'>thỉnh thoảng</span></div><div><span class='p-word'>usually</span> <span class='wt'>adv</span> = <span class='p-mean'>thường lệ</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu sau "She is always on time" (luôn đúng giờ) → suy ra bà KHÔNG BAO GIỜ đi muộn: never.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>often/sometimes/usually đều ngụ ý có đi muộn → mâu thuẫn với "always on time".</span></li></ol>`},
15:{opts:["There is","big","on","Lisa"],correct:"Lisa",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Có một chú gấu bông màu nâu to trên giường của Lisa. (Chọn phần gạch chân SAI)</div><ol><li>Bước 2 – Phân tích 4 phần gạch chân:<div class="grid2"><div><span class='hl-green'>Lisa</span> <span class='wt'>n</span> = <span class='p-mean'>Lisa (PHẦN SAI – thiếu sở hữu)</span></div><div><span class='p-word'>There is</span> = <span class='p-mean'>có (đúng, số ít)</span></div><div><span class='p-word'>big</span> <span class='wt'>adj</span> = <span class='p-mean'>to (đúng)</span></div><div><span class='p-word'>on</span> <span class='wt'>prep</span> = <span class='p-mean'>ở trên (đúng)</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÂY LÀ LỖI?</span> <span class='p-grammar'>"giường của Lisa" phải dùng sở hữu cách → sửa "Lisa" thành "Lisa's" (Lisa's bed).</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO CÁC PHẦN KIA ĐÚNG?</span> <span class='p-grammar'>"There is" hợp với gấu bông (số ít), "big" bổ nghĩa danh từ, "on" chỉ vị trí trên giường → đều chuẩn.</span></li></ol>`},
16:{opts:["brother","because","doesn't like","it"],correct:"it",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Em trai tôi hiếm khi ăn cà rốt vì nó không thích chúng. (Chọn phần gạch chân SAI)</div><ol><li>Bước 2 – Phân tích 4 phần gạch chân:<div class="grid2"><div><span class='hl-green'>it</span> <span class='wt'>pron</span> = <span class='p-mean'>nó (PHẦN SAI – số ít)</span></div><div><span class='p-word'>brother</span> <span class='wt'>n</span> = <span class='p-mean'>em trai (đúng)</span></div><div><span class='p-word'>because</span> <span class='wt'>conj</span> = <span class='p-mean'>bởi vì (đúng)</span></div><div><span class='p-word'>doesn't like</span> <span class='wt'>v</span> = <span class='p-mean'>không thích (đúng)</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÂY LÀ LỖI?</span> <span class='p-grammar'>"carrots" (cà rốt) là danh từ SỐ NHIỀU → đại từ thay thế phải là "them", không phải "it".</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO CÁC PHẦN KIA ĐÚNG?</span> <span class='p-grammar'>brother, because, doesn't like đều đúng dạng và hợp ngữ pháp.</span></li></ol>`}
};

17:{ans:["are playing"],exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Bây giờ đã rất muộn rồi. Tại sao con vẫn đang chơi điện tử vậy Bob? (play)</div><ol><li>Bước 2 – Đáp án & phân tích: <span class='hl-green'>are ... playing</span> <span class='wt'>v</span> = <span class='p-mean'>đang chơi</span>. Dạng gốc: <span class='p-word'>play</span> <span class='wt'>v</span> = <span class='p-mean'>chơi</span>. (Điền: are / playing)</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"still + now" (vẫn đang, lúc này) → thì hiện tại tiếp diễn: are + V-ing. Chủ ngữ "you" dùng "are"; câu hỏi có "Why" nên đảo "are" lên trước "you".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Dễ dùng "do you play" (hiện tại đơn); "you" phải đi với "are" chứ không phải "is".</span></li></ol>`},

19:{ans:["helpful"],exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Mọi người ở đây rất tốt bụng/hay giúp đỡ. Họ chỉ đường cho chúng tôi khi lạc. (help)</div><ol><li>Bước 2 – Đáp án & phân tích: <span class='hl-green'>helpful</span> <span class='wt'>adj</span> = <span class='p-mean'>hay giúp đỡ, hữu ích</span>. Dạng gốc: <span class='p-word'>help</span> <span class='wt'>v/n</span> = <span class='p-mean'>giúp đỡ</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau động từ "are" cần một TÍNH TỪ để mô tả người → help + đuôi "-ful" = helpful.</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Không giữ nguyên "help" (động từ) hay dùng "helpless" (bất lực – ngược nghĩa).</span></li></ol>`},
20:{ans:["celebrate"],exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chúng tôi ra ngoài để ăn mừng vì Lucy đã đỗ kỳ thi cuối kỳ. (celebration)</div><ol><li>Bước 2 – Đáp án & phân tích: <span class='hl-green'>celebrate</span> <span class='wt'>v</span> = <span class='p-mean'>ăn mừng, tổ chức</span>. Dạng gốc: <span class='p-word'>celebration</span> <span class='wt'>n</span> = <span class='p-mean'>lễ kỷ niệm</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "to + động từ nguyên mẫu" chỉ mục đích (went out TO celebrate) → đổi danh từ celebration thành động từ celebrate.</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Không giữ nguyên "celebration" (danh từ) vì sau "to" cần động từ.</span></li></ol>`},
31:{ans:["What are Neil's family buying at the department store","What are Neils family buying at the department store"],full:"What are Neil's family buying at the department store?",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Đặt câu hỏi cho phần gạch chân: Gia đình Neil đang mua <u>vài đồ trang trí mới</u> ở cửa hàng bách hóa.</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>What are Neil's family buying at the department store?</span> — <span class='p-word'>decorations</span> <span class='wt'>n</span> = <span class='p-mean'>đồ trang trí</span>; <span class='p-word'>department store</span> <span class='wt'>n</span> = <span class='p-mean'>cửa hàng bách hóa</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Phần gạch chân là VẬT được mua (some new decorations) → hỏi bằng "What". Câu đang ở hiện tại tiếp diễn nên giữ "are ... buying", đảo "are" lên trước chủ ngữ.</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Quên đảo trợ động từ "are"; bỏ chữ "buying"; quên dấu "?".</span></li></ol>`},
32:{ans:["How does she prefer to go to the airport"],full:"How does she prefer to go to the airport?",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Đặt câu hỏi cho phần gạch chân: Cô ấy thích đi ra sân bay <u>bằng taxi</u>.</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>How does she prefer to go to the airport?</span> — <span class='p-word'>by taxi</span> = <span class='p-mean'>bằng taxi (phương tiện)</span>; <span class='p-word'>airport</span> <span class='wt'>n</span> = <span class='p-mean'>sân bay</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Phần gạch chân "by taxi" chỉ PHƯƠNG TIỆN → hỏi bằng "How". Chủ ngữ "she" thì hiện tại đơn nên mượn trợ động từ "does" + động từ nguyên mẫu "prefer".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Quên "does"; chia sai "prefers" sau "does"; quên dấu "?".</span></li></ol>`},
33:{ans:["His laptop is more expensive than my laptop"],full:"His laptop is more expensive than my laptop.",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Máy tính xách tay của anh ấy đắt hơn máy của tôi.</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>His laptop is more expensive than my laptop.</span> — <span class='p-word'>expensive</span> <span class='wt'>adj</span> = <span class='p-mean'>đắt tiền</span>; <span class='p-word'>laptop</span> <span class='wt'>n</span> = <span class='p-mean'>máy tính xách tay</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"expensive" là tính từ DÀI (3 âm tiết) → so sánh hơn dùng "more + adj + than": more expensive than.</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Không thêm "-er" (không viết "expensiver"); nhớ động từ "is".</span></li></ol>`},
34:{ans:["Do you live in the city or the suburbs"],full:"Do you live in the city or the suburbs?",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Bạn sống ở thành phố hay ở vùng ngoại ô?</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>Do you live in the city or the suburbs?</span> — <span class='p-word'>city</span> <span class='wt'>n</span> = <span class='p-mean'>thành phố</span>; <span class='p-word'>suburbs</span> <span class='wt'>n</span> = <span class='p-mean'>vùng ngoại ô</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu hỏi lựa chọn với "or" ở thì hiện tại đơn: Do + you + live in ... or ...? Dùng giới từ "in" chỉ nơi sống.</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Quên trợ động từ "Do"; thiếu giới từ "in"; quên dấu "?".</span></li></ol>`},
35:{ans:["Everyone should plant more trees around their neighbourhoods","Everyone should plant more trees around their neighborhoods"],full:"Everyone should plant more trees around their neighbourhoods.",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Mọi người nên trồng thêm nhiều cây xanh quanh khu phố của mình. (SHOULD)</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>Everyone should plant more trees around their neighbourhoods.</span> — <span class='p-word'>plant</span> <span class='wt'>v</span> = <span class='p-mean'>trồng</span>; <span class='p-word'>neighbourhood</span> <span class='wt'>n</span> = <span class='p-mean'>khu phố/khu dân cư</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"It's good for everyone to do" (điều tốt nên làm) = "Everyone should do" (nên làm). Sau "should" là động từ nguyên mẫu "plant".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Không thêm "to" sau "should"; giữ nguyên phần "more trees around their neighbourhoods".</span></li></ol>`},
36:{ans:["There are different kinds of flowers in Julia's garden","There are different kinds of flowers in Julias garden"],full:"There are different kinds of flowers in Julia's garden.",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Có nhiều loại hoa khác nhau trong khu vườn của Julia. (THERE)</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>There are different kinds of flowers in Julia's garden.</span> — <span class='p-word'>kinds of</span> = <span class='p-mean'>các loại</span>; <span class='p-word'>garden</span> <span class='wt'>n</span> = <span class='p-mean'>khu vườn</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Julia has ..." (Julia có) → chuyển sang cấu trúc "There are + N số nhiều + in Julia's garden". "kinds" số nhiều nên dùng "are".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Không dùng "There is"; giữ sở hữu cách "Julia's".</span></li></ol>`},
37:{ans:["Can you lend me your coloured pencils for a minute","Can you lend me your colored pencils for a minute"],full:"Can you lend me your coloured pencils for a minute?",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Bạn cho tôi mượn bút chì màu một lát được không? (LEND)</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>Can you lend me your coloured pencils for a minute?</span> — <span class='p-word'>lend</span> <span class='wt'>v</span> = <span class='p-mean'>cho mượn</span>; <span class='p-word'>borrow</span> <span class='wt'>v</span> = <span class='p-mean'>mượn</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Can I borrow ... from you?" (tôi mượn) = "Can you lend me ...?" (bạn cho tôi mượn). Cấu trúc "lend somebody something": lend me your pencils.</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Đảo chủ ngữ thành "you"; đúng trật tự "lend me your...".</span></li></ol>`},
38:{ans:["There's a gas station in front of a small park","There is a gas station in front of a small park","The gas station is in front of a small park"],full:"There's a gas station in front of a small park.",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Có một trạm xăng ở phía trước một công viên nhỏ. (FRONT)</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>There's a gas station in front of a small park.</span> — <span class='p-word'>gas station</span> <span class='wt'>n</span> = <span class='p-mean'>trạm xăng</span>; <span class='p-word'>in front of</span> = <span class='p-mean'>phía trước</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"park behind the gas station" (công viên sau trạm xăng) = "gas station in front of the park" (trạm xăng trước công viên). "behind" ↔ "in front of".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Phải đảo vị trí hai vật khi đổi "behind" thành "in front of".</span></li></ol>`}
};

const TOTAL=28;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const root=document.getElementById('test');let curSec=null;
ITEMS.forEach(it=>{
 if(it.t==='s'){curSec=document.createElement('div');curSec.className='sec';curSec.innerHTML='<div class="sec-h">'+it.r+'. '+it.ti+'</div><div class="sec-d">'+it.d+'</div>';root.appendChild(curSec);}
 else if(it.t==='note'){const d=document.createElement('div');d.className='note';d.innerHTML=it.html;curSec.appendChild(d);}
 else if(it.t==='m'){const d=MQ[it.n];const q=document.createElement('div');q.className='q';q.dataset.correct='0';q.dataset.type='m';const opts=shuffle([...d.opts]);let h='<div class="q-t"><span class="q-n">'+it.n+'</span>'+(it.q||'')+'</div><div class="opts">';opts.forEach(o=>{h+='<div class="opt" data-v="'+encodeURIComponent(o)+'">'+o+'</div>';});h+='</div><div class="exp">'+d.exp+'</div>';q.innerHTML=h;q.querySelectorAll('.opt').forEach(op=>op.onclick=()=>pickMcq(q,op,d.correct));curSec.appendChild(q);}
 else if(it.t==='x'){const d=TQ[it.n];const q=document.createElement('div');q.className='q';let top='<div class="q-t"><span class="q-n">'+it.n+'</span>'+(it.orig||it.q||'')+'</div>';if(it.cue)top+='<div class="cue">🧩 '+it.cue+'</div>';let inp=d.prefix?'<div>→ <span class="prefix">'+d.prefix+'</span><input class="tin" style="width:auto;min-width:60%" data-n="'+it.n+'" placeholder="...gõ tiếp phần còn lại"></div>':'<input class="tin" data-n="'+it.n+'" placeholder="Gõ câu trả lời...">';q.innerHTML=top+inp+'<div class="exp">'+d.exp+'</div>';curSec.appendChild(q);}
});

document.querySelectorAll('.tin').forEach(i=>{i.addEventListener('blur',()=>gradeText(i));i.addEventListener('keydown',e=>{if(e.key==='Enter')i.blur();});});

let AC;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function ding(){const c=ac();[0,.12,.24].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=[660,880,1175][i];o.connect(g);g.connect(c.destination);const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.25);o.start(s);o.stop(s+.26);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.36);}
function confetti(){const cols=['#8854C0','#FDCB6E','#00C9A7','#FF6B9D','#5B7FFF','#00D26A'];for(let i=0;i<50;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.width=c.style.height=(6+Math.random()*8)+'px';c.style.background=cols[i%cols.length];document.body.appendChild(c);const dur=1500+Math.random()*1200,x=(Math.random()-.5)*300;c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate('+(720*Math.random())+'deg)',opacity:.9}],{duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>c.remove();}}

function pickMcq(q,op,correct){if(q.dataset.done)return;q.dataset.done='1';ac();const chosen=decodeURIComponent(op.dataset.v);q.querySelectorAll('.opt').forEach(o=>{o.classList.add('lock');if(decodeURIComponent(o.dataset.v)===correct)o.classList.add('correct');});if(chosen===correct){q.dataset.correct='1';ding();confetti();}else{op.classList.add('wrong');buzz();op.classList.add('shake');setTimeout(()=>op.classList.remove('shake'),450);}q.querySelector('.exp').style.display='block';}

function norm(s){return (s||'').toLowerCase().replace(/[’]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();}
function textOk(val,d){const v=norm(val);if(!v)return false;const c=[];d.ans.forEach(a=>{c.push(norm(a));if(d.prefix)c.push(norm(d.prefix+' '+a));});if(d.full)c.push(norm(d.full));return c.includes(v);}
function gradeText(inp){const n=inp.dataset.n,d=TQ[n];if(!inp.value.trim())return;const ok=textOk(inp.value,d);inp.classList.remove('ok','no');inp.classList.add(ok?'ok':'no');inp.dataset.correct=ok?'1':'0';ac();if(ok){ding();confetti();}else{buzz();inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),450);}const e=inp.closest('.q').querySelector('.exp');if(e)e.style.display='block';}

function openName(){document.querySelectorAll('.tin').forEach(i=>{if(i.value.trim())gradeText(i);});document.getElementById('nameMask').classList.add('on');document.getElementById('nameInput').focus();ac();}
function showResult(){const ni=document.getElementById('nameInput'),nm=ni.value.trim();if(!nm){ni.classList.add('err');document.getElementById('warn').textContent='⚠️ Em hãy nhập tên nhé!';return;}
 document.querySelectorAll('.tin').forEach(i=>{const d=TQ[i.dataset.n];i.dataset.correct=textOk(i.value,d)?'1':'0';});
 let correct=0;document.querySelectorAll('.q').forEach(q=>{if(q.dataset.type==='m'&&q.dataset.correct==='1')correct++;});document.querySelectorAll('.tin').forEach(i=>{if(i.dataset.correct==='1')correct++;});
 const ten=Math.round(correct/TOTAL*1000)/100;document.getElementById('nameMask').classList.remove('on');
 const g=document.getElementById('greet'),mm=document.getElementById('meme'),mj=document.getElementById('memoji');const pct=correct/TOTAL*100;let gif='';
 if(pct===100){g.textContent='🌟 THIÊN TÀI! '+nm+' xuất sắc tuyệt đối!';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';mj.textContent='🏆🎉🥳';}
 else if(pct>=60){g.textContent='👍 GIỎI LẮM! '+nm+' làm rất tốt!';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';mj.textContent='😎✨👏';}
 else{g.textContent='💪 CỐ LÊN NHÉ, '+nm+'! Lần sau sẽ tốt hơn!';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';mj.textContent='😭📚';}
 document.getElementById('scoreBig').textContent='✅ '+correct+' / '+TOTAL+' câu đúng';document.getElementById('score10').textContent='📊 Điểm: '+ten.toFixed(2)+' / 10';
 mj.style.display='none';mm.style.display='block';mm.src=gif;mm.onerror=()=>{mm.style.display='none';mj.style.display='block';};
 document.getElementById('resMask').classList.add('on');if(pct>=60)confetti();}
function closeRes(){document.getElementById('resMask').classList.remove('on');}
document.getElementById('nameInput').addEventListener('input',function(){this.classList.remove('err');document.getElementById('warn').textContent='';});
