<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEST 1 - Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#8854C0;--yellow:#FDCB6E;--teal:#00C9A7;--pink:#FF6B9D;--blue:#5B7FFF;--green:#00D26A;--red:#FF4757;--ink:#3a2f5b;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand','Nunito',sans-serif;color:var(--ink);min-height:100vh;padding:0 0 60px;background:linear-gradient(-45deg,#8854C0,#FF6B9D,#FDCB6E,#00C9A7,#5B7FFF);background-size:400% 400%;animation:grad 20s ease infinite;}
@keyframes grad{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.gems{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.gem{position:absolute;opacity:.5;animation:float 14s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-40px) rotate(20deg)}}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px}
header{text-align:center;background:rgba(255,255,255,.28);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.5);border-radius:22px;padding:16px 18px;margin-bottom:18px;box-shadow:0 8px 30px rgba(80,40,120,.25)}
header h1{font-family:'Nunito';font-size:2rem;color:#fff;text-shadow:2px 2px 0 rgba(136,84,192,.6);letter-spacing:1px}
.teacher{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:700;color:#fff;background:rgba(136,84,192,.55);padding:4px 14px;border-radius:20px}
.sub{color:#fff;font-size:.9rem;margin-top:8px;opacity:.95}
.sec{background:rgba(255,255,255,.32);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:16px 18px;margin-bottom:16px;box-shadow:0 8px 26px rgba(80,40,120,.18)}
.sec-h{font-family:'Nunito';font-weight:800;font-size:1.15rem;color:#6a3fa0;margin-bottom:4px}
.sec-d{font-size:.85rem;color:#7a5fa0;margin-bottom:12px;font-style:italic}
.q{background:rgba(255,255,255,.55);border-radius:16px;padding:13px 15px;margin-bottom:14px;box-shadow:0 4px 14px rgba(120,80,160,.14)}
.q-t{font-size:1.15rem;font-weight:700;margin-bottom:11px;line-height:1.5}
.q-n{display:inline-block;background:var(--purple);color:#fff;font-weight:800;border-radius:10px;padding:1px 9px;margin-right:7px;font-size:.95rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font-size:1.08rem;font-weight:600;cursor:pointer;text-align:center;padding:13px 10px;border-radius:16px;background:linear-gradient(145deg,#fff,#f0e8ff);border:2px solid transparent;box-shadow:0 5px 0 #cbb6e8,0 8px 14px rgba(120,80,160,.2);transition:.15s;user-select:none}
.opt:hover{transform:scale(1.04)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #cbb6e8}
.opt.correct{background:linear-gradient(145deg,#7dfab0,#00D26A);color:#063d1f;box-shadow:0 5px 0 #06a34f,0 8px 14px rgba(0,180,90,.3)}
.opt.wrong{background:linear-gradient(145deg,#ffb3bb,#FF4757);color:#4d0510;box-shadow:0 5px 0 #c22733}
.opt.lock{cursor:default}.opt.lock:hover{transform:none}
.tin{font-family:'Quicksand';font-size:1.05rem;font-weight:600;padding:9px 12px;border-radius:12px;border:2px solid #c8b3e6;background:rgba(255,255,255,.85);outline:none;width:100%;transition:.15s}
.tin:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(136,84,192,.2)}
.tin.ok{border-color:var(--green);background:#eafff2}
.tin.no{border-color:var(--red);background:#fff0f1}
.prefix{display:inline-block;font-weight:700;color:#8a6ab0;background:rgba(253,203,110,.35);padding:6px 10px;border-radius:10px;margin-right:6px}
.cue{font-family:'Nunito';font-weight:700;color:#6a3fa0;background:rgba(0,201,167,.15);padding:6px 10px;border-radius:10px;display:inline-block;margin-bottom:8px}
.note{background:rgba(253,203,110,.3);border-left:5px solid var(--yellow);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:700;color:#8a5a10;font-size:.92rem}
.exp{display:none;margin-top:11px;background:rgba(255,255,255,.75);border-radius:14px;padding:12px 14px;font-size:1rem;line-height:1.65;border-left:5px solid var(--teal);animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.exp ol{margin:6px 0 0 20px}.exp li{margin-bottom:6px}
.vnt{background:rgba(253,203,110,.35);border-radius:10px;padding:8px 11px;font-weight:800;color:#a05a10;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:5px 0}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.p-word{color:#2a6fd6;font-weight:700}
.hl-green{color:var(--green);font-weight:800}
.hl-red{color:var(--red);font-weight:800}
.wt{font-size:.78rem;background:rgba(120,90,170,.15);color:#6a3fa0;padding:1px 6px;border-radius:6px;font-weight:700}
.p-phonetic{color:#8854C0;background:rgba(136,84,192,.12);padding:0 5px;border-radius:5px}
.p-mean{color:#c0562a;font-weight:600}
.p-grammar{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;color:#5a3a8a;font-weight:600}
u{text-decoration-color:var(--red);text-decoration-thickness:3px}
.submit{display:block;width:100%;font-family:'Nunito';font-weight:800;font-size:1.3rem;color:#fff;cursor:pointer;padding:16px;border:none;border-radius:20px;margin-top:6px;background:linear-gradient(145deg,var(--pink),var(--purple));box-shadow:0 7px 0 #6a3f9a,0 10px 20px rgba(136,84,192,.4);transition:.15s}
.submit:hover{transform:scale(1.02)}.submit:active{transform:translateY(4px);box-shadow:0 3px 0 #6a3f9a}
.mask{display:none;position:fixed;inset:0;z-index:50;background:rgba(60,30,90,.55);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:rgba(255,255,255,.95);border-radius:26px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(60,30,90,.5);animation:pop .3s}
.modal h2{font-family:'Nunito';color:#6a3fa0;margin-bottom:14px;font-size:1.5rem}
.modal input{width:100%;font-family:'Quicksand';font-size:1.1rem;font-weight:600;padding:12px;border-radius:14px;border:2px solid #c8b3e6;outline:none;margin-bottom:6px}
.modal input.err{border-color:var(--red);background:#fff0f1}
.warn{color:var(--red);font-weight:700;font-size:.9rem;height:18px;margin-bottom:8px}
.mbtn{font-family:'Nunito';font-weight:800;font-size:1.1rem;color:#fff;cursor:pointer;border:none;border-radius:16px;padding:13px 22px;background:linear-gradient(145deg,var(--teal),var(--blue));box-shadow:0 5px 0 #3a5fcf;transition:.15s;margin:4px}
.mbtn:hover{transform:scale(1.04)}.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #3a5fcf}
.mbtn.alt{background:linear-gradient(145deg,var(--yellow),var(--pink));box-shadow:0 5px 0 #c04a70}
.score-big{font-family:'Nunito';font-size:2.6rem;font-weight:800;color:var(--purple);margin:6px 0}
.score-10{font-size:1.5rem;font-weight:800;color:var(--pink);margin-bottom:12px}
.meme{width:100%;max-width:280px;border-radius:18px;margin:10px auto;display:block;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.memoji{font-size:5rem;margin:10px 0}
.confetti{position:fixed;top:-20px;z-index:99;pointer-events:none;border-radius:2px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="gems" id="gems"></div>
<div class="wrap">
  <header>
    <h1>💎 TEST 1 💎</h1>
    <div class="teacher">Giáo viên tạo: Ms MS Chí Nên</div>
    <div class="sub">The First Term Tests · Hang động pha lê 🔮</div>
  </header>
  <div id="test"></div>
  <button class="submit" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<div class="mask" id="nameMask"><div class="modal">
  <h2>✨ Em tên là gì nào? ✨</h2>
  <input id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." onkeydown="if(event.key==='Enter')showResult()">
  <div class="warn" id="warn"></div>
  <button class="mbtn" onclick="showResult()">Xem kết quả 🚀</button>
</div></div>

<div class="mask" id="resMask"><div class="modal">
  <h2 id="greet"></h2>
  <div class="score-big" id="scoreBig"></div>
  <div class="score-10" id="score10"></div>
  <img class="meme" id="meme" alt="ket qua" style="display:none">
  <div class="memoji" id="memoji"></div>
  <div><button class="mbtn alt" onclick="location.reload()">🔄 Làm lại</button>
  <button class="mbtn" onclick="closeRes()">📖 Xem lại bài</button></div>
</div></div>

<script>
const MQ={
1:{opts:["<u>c</u>ave","ne<u>c</u>essary","sun<u>c</u>ream","<u>c</u>afé"],correct:"ne<u>c</u>essary",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chọn từ có phần gạch chân (chữ "c") được phát âm khác với các từ còn lại.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>necessary</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈnesəsəri/</span> = <span class='p-mean'>cần thiết</span> — "c" đọc /s/</div><div><span class='p-word'>cave</span> <span class='wt'>n</span> <span class='p-phonetic'>/keɪv/</span> = <span class='p-mean'>hang động</span> — "c" đọc /k/</div><div><span class='p-word'>suncream</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈsʌnkriːm/</span> = <span class='p-mean'>kem chống nắng</span> — "c" đọc /k/</div><div><span class='p-word'>café</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈkæfeɪ/</span> = <span class='p-mean'>quán cà phê</span> — "c" đọc /k/</div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Quy tắc: chữ "c" đứng trước e, i, y sẽ đọc là /s/. Trong "necessary", "c" đứng trước "e" nên đọc /s/ → khác 3 từ kia.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>cave, suncream, café đều có "c" đứng trước a hoặc u nên đọc /k/ → giống nhau, không phải đáp án.</span></li></ol>`},
2:{opts:["p<u>a</u>rk","l<u>a</u>ke","f<u>a</u>mous","t<u>a</u>ble"],correct:"p<u>a</u>rk",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chọn từ có chữ "a" gạch chân phát âm khác các từ còn lại.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>park</span> <span class='wt'>n</span> <span class='p-phonetic'>/pɑːk/</span> = <span class='p-mean'>công viên</span> — "a" đọc /ɑː/</div><div><span class='p-word'>lake</span> <span class='wt'>n</span> <span class='p-phonetic'>/leɪk/</span> = <span class='p-mean'>hồ nước</span> — "a" đọc /eɪ/</div><div><span class='p-word'>famous</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈfeɪməs/</span> = <span class='p-mean'>nổi tiếng</span> — "a" đọc /eɪ/</div><div><span class='p-word'>table</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈteɪbl/</span> = <span class='p-mean'>cái bàn</span> — "a" đọc /eɪ/</div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"a" trong "park" đọc là /ɑː/ (nguyên âm dài), khác hẳn 3 từ còn lại.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>lake, famous, table đều có "a" ở âm tiết mở đọc thành /eɪ/ → giống nhau nên không chọn.</span></li></ol>`},
3:{opts:["direction","dangerous","convenient","delicious"],correct:"dangerous",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chọn từ có trọng âm (âm nhấn) khác các từ còn lại.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>dangerous</span> <span class='wt'>adj</span> <span class='p-phonetic'>/ˈdeɪndʒərəs/</span> = <span class='p-mean'>nguy hiểm</span> — nhấn âm 1</div><div><span class='p-word'>direction</span> <span class='wt'>n</span> <span class='p-phonetic'>/dɪˈrekʃn/</span> = <span class='p-mean'>phương hướng</span> — nhấn âm 2</div><div><span class='p-word'>convenient</span> <span class='wt'>adj</span> <span class='p-phonetic'>/kənˈviːniənt/</span> = <span class='p-mean'>tiện lợi</span> — nhấn âm 2</div><div><span class='p-word'>delicious</span> <span class='wt'>adj</span> <span class='p-phonetic'>/dɪˈlɪʃəs/</span> = <span class='p-mean'>ngon</span> — nhấn âm 2</div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"dangerous" nhấn vào âm tiết thứ NHẤT (DAN-ger-ous), khác với 3 từ kia.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>direction, convenient, delicious đều nhấn vào âm tiết thứ HAI → giống nhau nên loại.</span></li></ol>`},
4:{opts:["compass","scissors","balloon","mountain"],correct:"balloon",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chọn từ có trọng âm khác các từ còn lại.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>balloon</span> <span class='wt'>n</span> <span class='p-phonetic'>/bəˈluːn/</span> = <span class='p-mean'>bóng bay</span> — nhấn âm 2</div><div><span class='p-word'>compass</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈkʌmpəs/</span> = <span class='p-mean'>la bàn</span> — nhấn âm 1</div><div><span class='p-word'>scissors</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈsɪzəz/</span> = <span class='p-mean'>cái kéo</span> — nhấn âm 1</div><div><span class='p-word'>mountain</span> <span class='wt'>n</span> <span class='p-phonetic'>/ˈmaʊntɪn/</span> = <span class='p-mean'>ngọn núi</span> — nhấn âm 1</div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"balloon" nhấn vào âm tiết thứ HAI (ba-LLOON), khác với 3 từ kia.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>compass, scissors, mountain đều nhấn vào âm tiết ĐẦU → giống nhau nên loại.</span></li></ol>`},
5:{opts:["in","at","on","above"],correct:"on",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Những cuốn sách vật lý ở _____ kệ thứ hai bên trái.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>on</span> <span class='wt'>prep</span> = <span class='p-mean'>ở trên (tiếp xúc bề mặt)</span></div><div><span class='p-word'>in</span> <span class='wt'>prep</span> = <span class='p-mean'>ở trong</span></div><div><span class='p-word'>at</span> <span class='wt'>prep</span> = <span class='p-mean'>tại (một điểm)</span></div><div><span class='p-word'>above</span> <span class='wt'>prep</span> = <span class='p-mean'>ở phía trên (không chạm)</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sách được đặt NẰM TRÊN bề mặt của kệ → collocation "on the shelf".</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>"in/at" không kết hợp với "shelf"; "above" nghĩa là lơ lửng phía trên (không chạm vào kệ) → sai nghĩa.</span></li></ol>`},
6:{opts:["many – any","much – a little","some – a few","any – some"],correct:"any – some",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Trong bếp có _____ quả cam không? Tôi muốn làm _____ nước cam.</div><ol><li>Bước 2 – Phân tích 4 đáp án (chú ý loại danh từ đi kèm):<div class="grid2"><div><span class='hl-green'>any – some</span> = <span class='p-mean'>nào – một chút</span> (any: câu HỎI/phủ định + đếm được số nhiều & không đếm được; some: câu khẳng định/lời mời + cả hai loại)</div><div><span class='p-word'>many – any</span> = <span class='p-mean'>nhiều – nào</span> (many + danh từ ĐẾM ĐƯỢC số nhiều)</div><div><span class='p-word'>much – a little</span> = <span class='p-mean'>nhiều – một ít</span> (much & a little + danh từ KHÔNG ĐẾM ĐƯỢC)</div><div><span class='p-word'>some – a few</span> = <span class='p-mean'>một chút – một vài</span> (a few + danh từ ĐẾM ĐƯỢC số nhiều)</div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Vế 1 là câu HỎI với "oranges" (đếm được, số nhiều) → dùng "any". Vế 2 mang ý định/mong muốn với "orange juice" (KHÔNG đếm được) → dùng "some".</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>"much" chỉ đi với danh từ không đếm được nên sai với "oranges"; "a few" chỉ đi với danh từ đếm được nên sai với "juice"; "many" hiếm khi dùng trong câu hỏi kiểu này.</span></li></ol>`},
7:{opts:["next to","opposite","between","behind"],correct:"opposite",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Thư viện thành phố ở _____ bưu điện. Chúng ta phải băng qua đường từ đây.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>opposite</span> <span class='wt'>prep</span> = <span class='p-mean'>đối diện</span></div><div><span class='p-word'>next to</span> <span class='wt'>prep</span> = <span class='p-mean'>ngay bên cạnh</span></div><div><span class='p-word'>between</span> <span class='wt'>prep</span> = <span class='p-mean'>ở giữa (hai vật)</span></div><div><span class='p-word'>behind</span> <span class='wt'>prep</span> = <span class='p-mean'>ở phía sau</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Manh mối "cross the street" (băng qua đường) cho thấy hai nơi nằm ĐỐI DIỆN nhau qua đường → opposite.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>"next to/behind" thì cùng phía, không cần qua đường; "between" cần có hai vật ở hai bên nên không hợp ngữ cảnh.</span></li></ol>`},
8:{opts:["museum","workshop","cathedral","gallery"],correct:"cathedral",

9:{opts:["tidies","decorates","paints","washes"],correct:"decorates",

10:{opts:["sandy","final","busy","faraway"],correct:"faraway",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Họ muốn du lịch đến một ngôi làng miền núi _____ nằm sâu trong dãy Andes.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>faraway</span> <span class='wt'>adj</span> = <span class='p-mean'>xa xôi, hẻo lánh</span></div><div><span class='p-word'>sandy</span> <span class='wt'>adj</span> = <span class='p-mean'>đầy cát</span></div><div><span class='p-word'>final</span> <span class='wt'>adj</span> = <span class='p-mean'>cuối cùng</span></div><div><span class='p-word'>busy</span> <span class='wt'>adj</span> = <span class='p-mean'>đông đúc, bận rộn</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Manh mối "deep in the Andes" (sâu trong núi) → ngôi làng xa xôi, hẻo lánh faraway.</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>sandy (đầy cát) & busy (đông đúc) không hợp với làng núi hẻo lánh; final (cuối cùng) vô nghĩa ở đây.</span></li></ol>`},
11:{opts:["short black","big brown","brown big","black short"],correct:"short black",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Cậu ấy có khuôn mặt tròn với mái tóc _____.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>short black</span> = <span class='p-mean'>ngắn, màu đen</span> (độ dài + màu ✔)</div><div><span class='p-word'>big brown</span> = <span class='p-mean'>to, màu nâu</span> (không tả tóc)</div><div><span class='p-word'>brown big</span> = <span class='p-mean'>nâu, to</span> (sai thứ tự)</div><div><span class='p-word'>black short</span> = <span class='p-mean'>đen, ngắn</span> (sai thứ tự)</div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Trật tự tính từ trong tiếng Anh: kích cỡ/độ dài (short) đứng TRƯỚC màu sắc (black) → "short black hair".</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>"big brown" không tả độ dài tóc; "brown big" và "black short" đảo sai trật tự (màu đặt trước cỡ).</span></li></ol>`},
12:{opts:["Why","When","Who","Which"],correct:"Who",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: _____ đang sống trong ngôi nhà cũ gần con sông đó?</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>Who</span> <span class='wt'>wh</span> = <span class='p-mean'>Ai (hỏi người)</span></div><div><span class='p-word'>Why</span> <span class='wt'>wh</span> = <span class='p-mean'>Tại sao (hỏi lý do)</span></div><div><span class='p-word'>When</span> <span class='wt'>wh</span> = <span class='p-mean'>Khi nào (hỏi thời gian)</span></div><div><span class='p-word'>Which</span> <span class='wt'>wh</span> = <span class='p-mean'>Cái nào (hỏi lựa chọn)</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu hỏi về NGƯỜI làm chủ ngữ, theo sau là động từ "is living" → dùng "Who + V".</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>Why/When hỏi lý do/thời gian (không hợp); Which cần đưa ra các lựa chọn cụ thể để chọn.</span></li></ol>`},
13:{opts:["must wear","shouldn't wear","is wearing","don't wear"],correct:"must wear",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Bạn _____ kính bảo hộ để bảo vệ mắt khi làm thí nghiệm hóa học.</div><ol><li>Bước 2 – Phân tích 4 đáp án:<div class="grid2"><div><span class='hl-green'>must wear</span> = <span class='p-mean'>phải đeo (bắt buộc)</span></div><div><span class='p-word'>shouldn't wear</span> = <span class='p-mean'>không nên đeo</span></div><div><span class='p-word'>is wearing</span> = <span class='p-mean'>đang đeo</span></div><div><span class='p-word'>don't wear</span> = <span class='p-mean'>đừng đeo</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Đeo kính bảo hộ là quy tắc an toàn BẮT BUỘC → dùng "must" (phải).</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO SAI?</span> <span class='p-grammar'>shouldn't/don't mang nghĩa cấm (ngược nghĩa); "is wearing" sai vì chủ ngữ "You" phải dùng "are wearing".</span></li></ol>`},

15:{opts:["doesn't rarely","movies","because","are"],correct:"doesn't rarely",
exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Sally hiếm khi xem phim kinh dị vì chúng quá đáng sợ. (Chọn phần gạch chân SAI)</div><ol><li>Bước 2 – Phân tích 4 phần gạch chân:<div class="grid2"><div><span class='hl-green'>doesn't rarely</span> <span class='wt'>v</span> = <span class='p-mean'>không hiếm khi (PHẦN SAI)</span></div><div><span class='p-word'>movies</span> <span class='wt'>n</span> = <span class='p-mean'>những bộ phim (đúng)</span></div><div><span class='p-word'>because</span> <span class='wt'>conj</span> = <span class='p-mean'>bởi vì (đúng)</span></div><div><span class='p-word'>are</span> <span class='wt'>v</span> = <span class='p-mean'>thì/là (đúng)</span></div></div></li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÂY LÀ LỖI?</span> <span class='p-grammar'>"rarely" (hiếm khi) đã mang nghĩa phủ định, không dùng thêm "doesn't" (lỗi phủ định kép). Sửa thành "rarely watches".</span></li><li><span class="hl-red">❌ Bước 4 – TẠI SAO CÁC PHẦN KIA ĐÚNG?</span> <span class='p-grammar'>movies (danh từ số nhiều hợp lý), because (nối lý do), are (chia đúng với "they") đều chuẩn.</span></li></ol>`},
16:{opts:["one of","famous","nature","in"],correct:"nature",

17:{ans:["always has"],exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Cô ấy luôn vui vẻ khi đi chơi với bạn bè. (always/have)</div><ol><li>Bước 2 – Đáp án & phân tích: <span class='hl-green'>always has</span> <span class='wt'>adv + v</span> = <span class='p-mean'>luôn luôn có</span>. Dạng gốc: <span class='p-word'>always</span> = <span class='p-mean'>luôn luôn</span>, <span class='p-word'>have</span> <span class='wt'>v</span> = <span class='p-mean'>có</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Diễn tả thói quen → thì hiện tại đơn. Trạng từ tần suất "always" đứng TRƯỚC động từ thường; chủ ngữ "She" (số ít) nên "have" chia thành "has".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Dễ viết "have" (quên chia -s) hoặc đặt sai vị trí thành "has always".</span></li></ol>`},
18:{ans:["is wearing"],exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Nhìn Anthony kìa! Cậu ấy đang mặc trang phục Siêu nhân. (wear)</div><ol><li>Bước 2 – Đáp án & phân tích: <span class='hl-green'>is wearing</span> <span class='wt'>v</span> = <span class='p-mean'>đang mặc</span>. Dạng gốc: <span class='p-word'>wear</span> <span class='wt'>v</span> = <span class='p-mean'>mặc, đeo</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Mệnh lệnh "Look at ...!" báo hiệu hành động đang diễn ra ngay lúc nói → thì hiện tại tiếp diễn: is + V-ing (He → is wearing).</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Không dùng "wears" (hiện tại đơn) vì đây là hành động tức thời, không phải thói quen.</span></li></ol>`},
19:{ans:["creative"],exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Anh họ Jake của tôi rất sáng tạo. Anh ấy thích viết nhạc lúc rảnh. (create)</div><ol><li>Bước 2 – Đáp án & phân tích: <span class='hl-green'>creative</span> <span class='wt'>adj</span> = <span class='p-mean'>sáng tạo</span>. Dạng gốc: <span class='p-word'>create</span> <span class='wt'>v</span> = <span class='p-mean'>tạo ra, sáng tạo</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau động từ "to be (is)" cần một TÍNH TỪ để mô tả tính cách → create (v) chuyển thành creative (adj).</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Không giữ nguyên "create" (động từ) hay viết "creation" (danh từ - sự sáng tạo).</span></li></ol>`},
20:{ans:["turning"],exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Rẽ ở chỗ rẽ thứ hai bên trái, bạn sẽ thấy công viên bên phải. (turn)</div><ol><li>Bước 2 – Đáp án & phân tích: <span class='hl-green'>turning</span> <span class='wt'>n</span> = <span class='p-mean'>chỗ rẽ, khúc quẹo</span>. Dạng gốc: <span class='p-word'>turn</span> <span class='wt'>v</span> = <span class='p-mean'>rẽ, quay</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Sau "the second" (thứ hai) cần một DANH TỪ đếm được → "turning" (chỗ rẽ). Collocation: "take the second turning".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Không dùng "turn" trần vì ở đây cần danh từ chỉ "chỗ rẽ", không phải động từ.</span></li></ol>`},
31:{ans:["Do you have a wardrobe in your room","Have you got a wardrobe in your room"],full:"Do you have a wardrobe in your room?",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Trong phòng của em có tủ quần áo không?</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>Do you have a wardrobe in your room?</span> — <span class='p-word'>wardrobe</span> <span class='wt'>n</span> = <span class='p-mean'>tủ quần áo</span>; <span class='p-word'>room</span> <span class='wt'>n</span> = <span class='p-mean'>căn phòng</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu hỏi Yes/No thì hiện tại đơn với "you" → Do + you + động từ nguyên mẫu (have)...? Nhớ mạo từ "a" và dấu "?".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Quên trợ động từ "Do" ở đầu hoặc quên mạo từ "a" trước "wardrobe".</span></li></ol>`},
32:{ans:["Eddie is buying a present for his dad's birthday at the moment","Eddie is buying a present for his dads birthday at the moment"],full:"Eddie is buying a present for his dad's birthday at the moment.",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Eddie đang mua một món quà cho sinh nhật của bố ngay lúc này.</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>Eddie is buying a present for his dad's birthday at the moment.</span> — <span class='p-word'>present</span> <span class='wt'>n</span> = <span class='p-mean'>món quà</span>; <span class='p-word'>at the moment</span> = <span class='p-mean'>ngay lúc này</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Dấu hiệu "at the moment" → thì hiện tại tiếp diễn: is + buying. Dùng sở hữu cách "dad's birthday".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Chia sai thành "buys"; quên dấu sở hữu "'s" ở "dad's".</span></li></ol>`},
33:{ans:["There is a coffee table in the middle of the room"],full:"There is a coffee table in the middle of the room.",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Có một chiếc bàn cà phê ở chính giữa căn phòng.</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>There is a coffee table in the middle of the room.</span> — <span class='p-word'>coffee table</span> <span class='wt'>n</span> = <span class='p-mean'>bàn cà phê</span>; <span class='p-word'>in the middle of</span> = <span class='p-mean'>ở giữa</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Cấu trúc "There is + a + danh từ số ít" để nói có một vật; cụm giới từ "in the middle of the room" chỉ vị trí.</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Sắp sai thứ tự các cụm; quên mạo từ "a" trước "coffee table".</span></li></ol>`},
34:{ans:["What's the name of your favourite book","What is the name of your favourite book","What's the name of your favorite book"],full:"What's the name of your favourite book?",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Tên của cuốn sách yêu thích của bạn là gì?</div><ol><li>Bước 2 – Đáp án & từ khóa: <span class='hl-green'>What's the name of your favourite book?</span> — <span class='p-word'>favourite</span> <span class='wt'>adj</span> = <span class='p-mean'>yêu thích</span>; <span class='p-word'>name</span> <span class='wt'>n</span> = <span class='p-mean'>tên gọi</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>What's + the name of + your favourite book? — dùng "of" để chỉ sở hữu cho vật; tính từ "favourite" đứng trước danh từ "book".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Sắp sai trật tự cụm "the name of"; quên dấu "?".</span></li></ol>`},
35:{prefix:"I have a",ans:["lot of penfriends from all over the world"],full:"I have a lot of penfriends from all over the world.",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Tôi có rất nhiều bạn qua thư từ khắp nơi trên thế giới.</div><ol><li>Bước 2 – Đáp án & từ khóa: I have a <span class='hl-green'>lot of penfriends from all over the world.</span> — <span class='p-word'>penfriend</span> <span class='wt'>n</span> = <span class='p-mean'>bạn qua thư</span>; <span class='p-word'>a lot of</span> = <span class='p-mean'>rất nhiều</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"many" và "a lot of" đồng nghĩa (đều chỉ số nhiều) → thay "many" bằng "a lot of", giữ nguyên phần còn lại.</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Viết sai thành "a lots of" (đúng phải là "a lot of").</span></li></ol>`},
36:{prefix:"Shall",ans:["we have a party in the garden"],full:"Shall we have a party in the garden?",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Chúng ta tổ chức một bữa tiệc trong vườn nhé?</div><ol><li>Bước 2 – Đáp án & từ khóa: Shall <span class='hl-green'>we have a party in the garden?</span> — <span class='p-word'>party</span> <span class='wt'>n</span> = <span class='p-mean'>bữa tiệc</span>; <span class='p-word'>garden</span> <span class='wt'>n</span> = <span class='p-mean'>khu vườn</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"Let's + V" (lời rủ rê) = "Shall we + V?" → đổi thành câu hỏi rủ rê, nhớ dấu "?".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Sau "Shall we" phải là động từ nguyên mẫu "have" (không thêm -s, không "to").</span></li></ol>`},
37:{prefix:"Milo's brother",ans:["is taller than him","is taller than Milo"],full:"Milo's brother is taller than him.",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Anh trai của Milo cao hơn cậu ấy.</div><ol><li>Bước 2 – Đáp án & từ khóa: Milo's brother <span class='hl-green'>is taller than him.</span> — <span class='p-word'>tall</span> <span class='wt'>adj</span> = <span class='p-mean'>cao</span>; <span class='p-word'>taller</span> = <span class='p-mean'>cao hơn (so sánh hơn)</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>Câu gốc "Milo thấp hơn anh" → đảo lại nghĩa: "anh cao hơn Milo". So sánh hơn tính từ ngắn: adj + -er + than (tall → taller).</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Phải đổi "short" thành "tall" và đảo hai vế; dùng tân ngữ "him" sau "than".</span></li></ol>`},
38:{prefix:"Lilia always",ans:["remembers to tidy up her room at weekends"],full:"Lilia always remembers to tidy up her room at weekends.",exp:`<div class="vnt">💬 Bước 1 – Dịch đề: Lilia luôn nhớ dọn dẹp phòng của mình vào các dịp cuối tuần.</div><ol><li>Bước 2 – Đáp án & từ khóa: Lilia always <span class='hl-green'>remembers to tidy up her room at weekends.</span> — <span class='p-word'>tidy up</span> <span class='wt'>v</span> = <span class='p-mean'>dọn dẹp</span>; <span class='p-word'>remember to do</span> = <span class='p-mean'>nhớ làm việc gì</span>.</li><li><span class="hl-green">✅ Bước 3 – TẠI SAO ĐÚNG?</span> <span class='p-grammar'>"never forgets to do" (không bao giờ quên làm) = "always remembers to do" (luôn nhớ làm). Chủ ngữ "Lilia" → chia "remembers".</span></li><li><span class="hl-red">❌ Bước 4 – BẪY THƯỜNG GẶP:</span> <span class='p-grammar'>Quên chia -s ở "remembers"; giữ nguyên "to tidy up" (remember + to V).</span></li></ol>`}
};

const TOTAL=28;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const root=document.getElementById('test');let curSec=null;
ITEMS.forEach(it=>{
 if(it.t==='s'){curSec=document.createElement('div');curSec.className='sec';curSec.innerHTML='<div class="sec-h">'+it.r+'. '+it.ti+'</div><div class="sec-d">'+it.d+'</div>';root.appendChild(curSec);}
 else if(it.t==='note'){const d=document.createElement('div');d.className='note';d.innerHTML=it.html;curSec.appendChild(d);}
 else if(it.t==='m'){const d=MQ[it.n];const q=document.createElement('div');q.className='q';q.dataset.correct='0';q.dataset.type='m';const opts=shuffle([...d.opts]);let h='<div class="q-t"><span class="q-n">'+it.n+'</span>'+(it.q||'')+'</div><div class="opts">';opts.forEach(o=>{h+='<div class="opt" data-v="'+encodeURIComponent(o)+'">'+o+'</div>';});h+='</div><div class="exp">'+d.exp+'</div>';q.innerHTML=h;q.querySelectorAll('.opt').forEach(op=>op.onclick=()=>pickMcq(q,op,d.correct));curSec.appendChild(q);}
 else if(it.t==='x'){const d=TQ[it.n];const q=document.createElement('div');q.className='q';let top='<div class="q-t"><span class="q-n">'+it.n+'</span>'+(it.orig||it.q||'')+'</div>';if(it.cue)top+='<div class="cue">🧩 '+it.cue+'</div>';let inp=d.prefix?'<div>→ <span class="prefix">'+d.prefix+'</span><input class="tin" style="width:auto;min-width:60%" data-n="'+it.n+'" placeholder="...gõ tiếp phần còn lại"></div>':'<input class="tin" data-n="'+it.n+'" placeholder="Gõ câu trả lời...">';q.innerHTML=top+inp+'<div class="exp">'+d.exp+'</div>';curSec.appendChild(q);}
});

document.querySelectorAll('.tin').forEach(i=>{i.addEventListener('blur',()=>gradeText(i));i.addEventListener('keydown',e=>{if(e.key==='Enter')i.blur();});});

let AC;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function ding(){const c=ac();[0,.12,.24].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=[660,880,1175][i];o.connect(g);g.connect(c.destination);const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.25);o.start(s);o.stop(s+.26);});}
function buzz(){const c=ac();const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(120,c.currentTime+.3);o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.36);}
function confetti(){const cols=['#8854C0','#FDCB6E','#00C9A7','#FF6B9D','#5B7FFF','#00D26A'];for(let i=0;i<50;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.width=c.style.height=(6+Math.random()*8)+'px';c.style.background=cols[i%cols.length];document.body.appendChild(c);const dur=1500+Math.random()*1200,x=(Math.random()-.5)*300;c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate('+(720*Math.random())+'deg)',opacity:.9}],{duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>c.remove();}}

function pickMcq(q,op,correct){if(q.dataset.done)return;q.dataset.done='1';ac();const chosen=decodeURIComponent(op.dataset.v);q.querySelectorAll('.opt').forEach(o=>{o.classList.add('lock');if(decodeURIComponent(o.dataset.v)===correct)o.classList.add('correct');});if(chosen===correct){q.dataset.correct='1';ding();confetti();}else{op.classList.add('wrong');buzz();op.classList.add('shake');setTimeout(()=>op.classList.remove('shake'),450);}q.querySelector('.exp').style.display='block';}

function norm(s){return (s||'').toLowerCase().replace(/[’]/g,"'").replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();}
function textOk(val,d){const v=norm(val);if(!v)return false;const c=[];d.ans.forEach(a=>{c.push(norm(a));if(d.prefix)c.push(norm(d.prefix+' '+a));});if(d.full)c.push(norm(d.full));return c.includes(v);}
function gradeText(inp){const n=inp.dataset.n,d=TQ[n];if(!inp.value.trim())return;const ok=textOk(inp.value,d);inp.classList.remove('ok','no');inp.classList.add(ok?'ok':'no');inp.dataset.correct=ok?'1':'0';ac();if(ok){ding();confetti();}else{buzz();inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),450);}const e=inp.closest('.q').querySelector('.exp');if(e)e.style.display='block';}

function openName(){document.querySelectorAll('.tin').forEach(i=>{if(i.value.trim())gradeText(i);});document.getElementById('nameMask').classList.add('on');document.getElementById('nameInput').focus();ac();}
function showResult(){const ni=document.getElementById('nameInput'),nm=ni.value.trim();if(!nm){ni.classList.add('err');document.getElementById('warn').textContent='⚠️ Em hãy nhập tên nhé!';return;}
 document.querySelectorAll('.tin').forEach(i=>{const d=TQ[i.dataset.n];i.dataset.correct=textOk(i.value,d)?'1':'0';});
 let correct=0;document.querySelectorAll('.q').forEach(q=>{if(q.dataset.type==='m'&&q.dataset.correct==='1')correct++;});document.querySelectorAll('.tin').forEach(i=>{if(i.dataset.correct==='1')correct++;});
 const ten=Math.round(correct/TOTAL*1000)/100;document.getElementById('nameMask').classList.remove('on');
 const g=document.getElementById('greet'),mm=document.getElementById('meme'),mj=document.getElementById('memoji');const pct=correct/TOTAL*100;let gif='';
 if(pct===100){g.textContent='🌟 THIÊN TÀI! '+nm+' xuất sắc tuyệt đối!';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';mj.textContent='🏆🎉🥳';}
 else if(pct>=60){g.textContent='👍 GIỎI LẮM! '+nm+' làm rất tốt!';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';mj.textContent='😎✨👏';}
 else{g.textContent='💪 CỐ LÊN NHÉ, '+nm+'! Lần sau sẽ tốt hơn!';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';mj.textContent='😭📚';}
 document.getElementById('scoreBig').textContent='✅ '+correct+' / '+TOTAL+' câu đúng';document.getElementById('score10').textContent='📊 Điểm: '+ten.toFixed(2)+' / 10';
 mj.style.display='none';mm.style.display='block';mm.src=gif;mm.onerror=()=>{mm.style.display='none';mj.style.display='block';};
 document.getElementById('resMask').classList.add('on');if(pct>=60)confetti();}
function closeRes(){document.getElementById('resMask').classList.remove('on');}
document.getElementById('nameInput').addEventListener('input',function(){this.classList.remove('err');document.getElementById('warn').textContent='';});

(function(){const g=document.getElementById('gems');const cols=['#FDCB6E','#00C9A7','#FF6B9D','#fff','#c4a3ff'];for(let i=0;i<14;i++){const s=24+Math.random()*46;const c=cols[i%cols.length];const svg='<svg width="'+s+'" height="'+s+'" viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg"><path d="M20 0 L36 16 L20 52 L4 16 Z" fill="'+c+'" opacity=".9"/><path d="M20 0 L36 16 L20 52 Z" fill="#000" opacity=".08"/><path d="M4 16 L36 16" stroke="#fff" stroke-width="1.2" opacity=".5"/></svg>';const e=document.createElement('div');e.className='gem';e.innerHTML=svg;e.style.left=Math.random()*100+'vw';e.style.top=Math.random()*100+'vh';e.style.animationDelay=(-Math.random()*14)+'s';e.style.animationDuration=(11+Math.random()*8)+'s';g.appendChild(e);}})();
