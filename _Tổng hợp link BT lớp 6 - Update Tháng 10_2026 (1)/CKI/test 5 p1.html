<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST 5 · Ocean | Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ocean1:#0D1B2A;--ocean2:#1B4965;--ocean3:#2196B3;--teal:#06D6A0;--coral:#FF6B6B;--gold:#FFD166;--lavender:#C77DFF;--sky:#90E0EF;--correct:#06D6A0;--incorrect:#FF6B6B;--glass:rgba(255,255,255,0.10);--glassborder:rgba(255,255,255,0.22);--shadow:0 8px 32px rgba(0,0,0,0.3);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;background:var(--ocean1);}
.ocean-bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse at 20% 80%,#0a3d62 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,#1565c0 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,#0d2137 0%,#050d18 100%);}
.ocean-gradient{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(13,27,42,0.0) 0%,rgba(6,182,212,0.08) 40%,rgba(2,132,199,0.12) 70%,rgba(13,27,42,0.95) 100%);animation:oceanPulse 8s ease-in-out infinite;}
@keyframes oceanPulse{0%,100%{opacity:1}50%{opacity:0.7}}
.floaters-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.5),rgba(144,224,239,0.15));border:1.5px solid rgba(144,224,239,0.4);animation:bubbleRise linear infinite;}
@keyframes bubbleRise{0%{transform:translateY(0) translateX(0) scale(1);opacity:0.7;}25%{transform:translateY(-25vh) translateX(15px) scale(1.04);}50%{transform:translateY(-50vh) translateX(-10px) scale(0.97);}75%{transform:translateY(-75vh) translateX(12px) scale(1.03);}100%{transform:translateY(-105vh) translateX(0) scale(0.9);opacity:0;}}
.fish{position:absolute;font-size:1.6rem;animation:swimAcross linear infinite;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));}
@keyframes swimAcross{0%{transform:translateX(-80px) translateY(0);}30%{transform:translateX(30vw) translateY(-20px);}60%{transform:translateX(60vw) translateY(10px);}100%{transform:translateX(110vw) translateY(-5px);}}
.fish.rtl{animation:swimBack linear infinite;transform:scaleX(-1);}
@keyframes swimBack{0%{transform:scaleX(-1) translateX(-80px);}100%{transform:scaleX(-1) translateX(110vw);}}
.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:sparklePop ease-in-out infinite;}
@keyframes sparklePop{0%,100%{opacity:0;transform:scale(0);}50%{opacity:1;transform:scale(1.4);}}
.seaweed{position:absolute;bottom:0;font-size:2.2rem;animation:sway ease-in-out infinite;transform-origin:bottom center;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.3));}
@keyframes sway{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
.jellyfish{position:absolute;font-size:2rem;animation:jellyFloat ease-in-out infinite;}
@keyframes jellyFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-25px) scale(1.08);}}
.header{text-align:center;padding:8px 20px 6px;background:rgba(6,20,36,0.8);backdrop-filter:blur(12px);border-bottom:2px solid rgba(6,214,160,0.4);position:sticky;top:0;z-index:100;}
.header .test-title{font-family:'Baloo 2',sans-serif;font-size:1.15rem;color:var(--gold);letter-spacing:0.5px;text-shadow:0 0 14px rgba(255,209,102,0.6);}
.header .teacher-credit{font-size:0.72rem;color:rgba(144,224,239,0.75);margin-top:1px;}
.reminder-banner{position:sticky;top:52px;z-index:99;background:linear-gradient(90deg,#0d3b2e,#065f46,#0d3b2e);background-size:200% 100%;animation:bannerPulse 4s linear infinite;border-bottom:2px solid var(--teal);padding:6px 14px;display:flex;align-items:flex-start;gap:9px;box-shadow:0 4px 20px rgba(6,214,160,0.25);}
@keyframes bannerPulse{0%{background-position:0%}100%{background-position:200%}}
.reminder-banner .badge{background:var(--teal);color:#000;font-weight:900;font-size:0.6rem;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.reminder-banner .msg{font-size:0.73rem;font-weight:700;color:rgba(255,255,255,0.92);line-height:1.4;}
.reminder-banner .msg strong{color:var(--gold);}
.section-title{text-align:center;margin:28px 0 16px;font-family:'Baloo 2',sans-serif;font-size:1.15rem;font-weight:800;color:var(--sky);letter-spacing:1px;text-shadow:0 0 20px rgba(144,224,239,0.5);position:relative;}
.section-title::before,.section-title::after{content:'';display:inline-block;width:34px;height:2px;background:linear-gradient(90deg,transparent,var(--teal));vertical-align:middle;margin:0 10px;}
.section-title::after{background:linear-gradient(90deg,var(--teal),transparent);}
main{max-width:820px;margin:0 auto;padding:18px 14px 120px;}
.q-card{background:var(--glass);backdrop-filter:blur(16px);border:1.5px solid var(--glassborder);border-radius:22px;padding:20px 22px;margin-bottom:26px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,0.08);transition:transform 0.2s;}
.q-card:hover{transform:translateY(-2px);}
.q-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--teal),#0891b2);color:#000;font-weight:900;font-size:0.65rem;padding:3px 11px;border-radius:20px;margin-bottom:10px;box-shadow:0 3px 12px rgba(6,214,160,0.4);text-transform:uppercase;}
.q-text{font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:14px;line-height:1.6;text-shadow:0 1px 4px rgba(0,0,0,0.5);}
.q-text u{text-decoration-color:var(--gold);text-decoration-thickness:2px;}
.underline-part{background:rgba(255,209,102,0.18);color:var(--gold);padding:1px 5px;border-radius:5px;font-weight:800;border-bottom:2px solid var(--gold);display:inline;}
.error-label{font-size:0.7rem;color:rgba(144,224,239,0.7);font-weight:700;margin-left:2px;vertical-align:super;}
.sentence-box{background:rgba(0,0,0,0.35);border-left:3px solid var(--teal);border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:0.95rem;color:rgba(255,255,255,0.9);line-height:1.6;}
.sentence-box .key-word{background:rgba(6,214,160,0.25);color:var(--teal);padding:1px 6px;border-radius:5px;font-weight:900;}
.sentence-box .given-start{color:var(--gold);font-weight:800;}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:4px;}
@media(max-width:500px){.options-grid{grid-template-columns:1fr;}}
.opt-btn{background:rgba(255,255,255,0.08);border:1.5px solid rgba(144,224,239,0.3);border-radius:15px;padding:11px 14px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:0.98rem;font-weight:700;color:#fff;text-align:left;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.1);transition:all 0.15s;word-break:break-word;}
.opt-btn:hover:not(:disabled){transform:scale(1.03) translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.15);background:rgba(6,214,160,0.15);border-color:rgba(6,214,160,0.6);}
.opt-btn:disabled{cursor:default;}
.opt-btn.selected{background:rgba(255,209,102,0.2)!important;border-color:var(--gold)!important;box-shadow:0 0 15px rgba(255,209,102,0.4)!important;color:var(--gold)!important;}
.opt-btn.correct{background:linear-gradient(135deg,#06D6A0,#059669)!important;border-color:var(--correct)!important;color:#fff!important;box-shadow:0 6px 22px rgba(6,214,160,0.55)!important;}
.opt-btn.incorrect{background:linear-gradient(135deg,#FF6B6B,#dc2626)!important;border-color:var(--incorrect)!important;color:#fff!important;box-shadow:0 6px 22px rgba(255,107,107,0.5)!important;}
.opt-btn.shake,.q-input.shake{animation:shake 0.4s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.q-input{flex:1;width:100%;padding:12px 16px;border-radius:14px;border:2px solid rgba(144,224,239,0.3);background:rgba(0,0,0,0.25);color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;outline:none;transition:all 0.2s;box-shadow:inset 0 2px 6px rgba(0,0,0,0.2);}
.q-input:focus{border-color:var(--teal);background:rgba(0,0,0,0.4);}
.q-input::placeholder{color:rgba(255,255,255,0.4);font-weight:600;}
.q-input.correct{border-color:var(--correct);background:rgba(6,214,160,0.15);color:#6EE7B7;}
.q-input.incorrect{border-color:var(--incorrect);background:rgba(255,107,107,0.15);color:#FCA5A5;}
.check-btn{background:linear-gradient(135deg,var(--teal),#0891b2);color:#000;border:none;border-radius:14px;padding:12px 24px;font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 4px 14px rgba(6,214,160,0.3);white-space:nowrap;}
.check-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(6,214,160,0.4);}
.check-btn:disabled{opacity:0.5;cursor:not-allowed;}
.result-feedback{display:none;margin-top:8px;padding:6px 12px;border-radius:10px;font-size:0.84rem;font-weight:800;text-align:center;}
.result-feedback.show{display:block;}
.result-feedback.ok{background:rgba(6,214,160,0.15);color:#6EE7B7;}
.result-feedback.no{background:rgba(255,107,107,0.15);color:#FCA5A5;}
.explanation-box{display:none;margin-top:14px;background:rgba(0,0,0,0.45);backdrop-filter:blur(12px);border:1.5px solid rgba(6,214,160,0.3);border-radius:16px;padding:15px 17px;animation:slideDown 0.4s ease;}
.explanation-box.open{display:block;}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.exp-header{display:flex;align-items:center;gap:8px;font-size:0.78rem;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
.exp-section{margin-bottom:11px;}.exp-section:last-child{margin-bottom:0;}
.exp-section h4{font-size:0.76rem;font-weight:800;color:var(--sky);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;border-bottom:1px solid rgba(144,224,239,0.2);padding-bottom:3px;}
.exp-section p,.exp-section li{font-size:0.9rem;color:rgba(255,255,255,0.9);line-height:1.65;}
.exp-section ul{list-style:none;padding:0;}
.exp-section ul li{padding:2px 0 2px 20px;position:relative;}
.exp-section ul li::before{content:"🐟";position:absolute;left:0;font-size:0.75rem;top:4px;}
.p-word{color:#7DD3FC;font-weight:700;}
.p-mean{color:#FDBA74;font-weight:700;}
.p-grammar{color:#FCA5A5;text-decoration:underline wavy #FCA5A5;font-weight:700;}
.p-phonetic{color:#C77DFF;background:rgba(199,125,255,0.16);padding:0 5px;border-radius:5px;font-weight:700;}
.hl-green{color:#86EFAC;font-weight:800;}
.hl-red{color:#FCA5A5;text-decoration:line-through;font-weight:700;}
.vi-translate{background:rgba(253,186,116,0.18);color:#FCD34D;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block;border-left:3px solid #F59E0B;margin:3px 0;font-size:0.9rem;}
.word-class{background:rgba(125,211,252,0.18);color:#BAE6FD;font-size:0.7rem;padding:1px 6px;border-radius:10px;font-weight:700;vertical-align:middle;margin-left:3px;}
.progress-wrap{background:rgba(0,0,0,0.4);border-radius:20px;height:7px;margin:10px 0 6px;overflow:hidden;}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--teal),var(--sky),var(--lavender));transition:width 0.5s ease;box-shadow:0 0 12px rgba(6,214,160,0.6);}
.progress-text{font-size:0.73rem;color:rgba(144,224,239,0.7);text-align:right;margin-top:2px;}
.submit-area{text-align:center;margin-top:8px;padding-bottom:40px;}
.submit-btn{background:linear-gradient(135deg,#06D6A0,#0891b2,#6366f1);color:#fff;border:none;border-radius:50px;padding:15px 48px;font-family:'Baloo 2',sans-serif;font-size:1.2rem;cursor:pointer;font-weight:800;letter-spacing:0.5px;box-shadow:0 8px 30px rgba(6,214,160,0.45);transition:transform 0.2s,box-shadow 0.2s;text-shadow:0 2px 6px rgba(0,0,0,0.3);}
.submit-btn:hover{transform:scale(1.06) translateY(-3px);box-shadow:0 14px 40px rgba(6,214,160,0.6);}
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:linear-gradient(135deg,rgba(6,20,36,0.97),rgba(7,89,133,0.97));border:2px solid rgba(6,214,160,0.4);border-radius:24px;padding:28px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.7);animation:popIn 0.4s cubic-bezier(.175,.885,.32,1.275);text-align:center;}
@keyframes popIn{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
.modal-box h2{font-family:'Baloo 2',sans-serif;font-size:1.5rem;color:var(--gold);margin-bottom:12px;text-shadow:0 0 20px rgba(255,209,102,0.5);}
.modal-box p{color:rgba(255,255,255,0.82);font-size:0.93rem;margin-bottom:14px;}
.name-input{width:100%;padding:12px 16px;border-radius:14px;border:2px solid rgba(6,214,160,0.35);background:rgba(255,255,255,0.1);color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;outline:none;transition:border-color 0.2s;margin-bottom:6px;}
.name-input::placeholder{color:rgba(255,255,255,0.4);}
.name-input:focus{border-color:var(--teal);}
.name-input.error{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,107,107,0.3);}
.name-error{color:#FCA5A5;font-size:0.79rem;margin-bottom:10px;display:none;}
.name-error.show{display:block;}
.modal-confirm-btn{background:linear-gradient(135deg,var(--teal),#0891b2);color:#000;border:none;border-radius:40px;padding:12px 36px;font-family:'Baloo 2',sans-serif;font-size:1.05rem;cursor:pointer;font-weight:700;box-shadow:0 6px 20px rgba(6,214,160,0.4);transition:transform 0.2s;}
.modal-confirm-btn:hover{transform:scale(1.05);}
.score-display{background:rgba(6,214,160,0.1);border:2px solid rgba(6,214,160,0.3);border-radius:18px;padding:16px;margin-bottom:14px;}
.score-big{font-family:'Baloo 2',sans-serif;font-size:3rem;color:var(--gold);text-shadow:0 0 24px rgba(255,209,102,0.6);line-height:1;}
.score-sub{font-size:0.88rem;color:rgba(255,255,255,0.65);margin-top:3px;}
.score-ten{font-size:1.15rem;color:#86EFAC;font-weight:900;margin-top:5px;}
.result-gif{width:160px;height:160px;border-radius:14px;object-fit:cover;margin:8px auto 12px;display:block;border:3px solid rgba(6,214,160,0.4);box-shadow:0 8px 24px rgba(0,0,0,0.5);}
.retry-btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:40px;padding:11px 30px;font-family:'Baloo 2',sans-serif;font-size:0.97rem;cursor:pointer;margin-top:8px;box-shadow:0 6px 20px rgba(0,0,0,0.3);transition:transform 0.2s;font-weight:700;}
.retry-btn:hover{transform:scale(1.05);}
#confetti-canvas{position:fixed;inset:0;z-index:300;pointer-events:none;}
</style>
</head>
<body>
<div class="ocean-bg"></div><div class="ocean-gradient"></div>
<div class="floaters-layer" id="floaters-layer"></div>
<canvas id="confetti-canvas"></canvas>
<header class="header">
  <div class="test-title">🌊 TEST 5 — THE FIRST TERM TESTS</div>
  <div class="teacher-credit">🐠 Giáo viên tạo: Ms MS Chí Nên</div>
</header>
<div class="reminder-banner">
  <div class="badge">🐙 Alert!</div>
  <div class="msg"><strong>Explorer ơi!</strong> Hãy tự tra từ mới & phát âm, đọc kỹ <strong>giải thích 4 bước</strong> và ghi vào vở. Đừng chọn bừa nhé!</div>
</div>
<main id="quiz-container"></main>
<div class="submit-area"><button class="submit-btn" onclick="openNameModal()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
<div class="modal-overlay" id="name-modal"><div class="modal-box">
  <h2>🌊 Nộp Bài</h2><p>Nhập tên bạn để xem điểm số Explorer!</p>
  <input class="name-input" id="player-name" type="text" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="40"/>
  <div class="name-error" id="name-error">⚠️ Hãy nhập tên trước nhé Explorer!</div><br>
  <button class="modal-confirm-btn" onclick="submitQuiz()">🐬 XEM KẾT QUẢ</button>
</div></div>
<div class="modal-overlay" id="result-modal"><div class="modal-box">
  <div id="result-content"></div>
  <button class="retry-btn" onclick="retryQuiz()">🔄 Làm lại từ đầu</button>
</div></div>

<script>
const quizData=[
/* I – NGỮ ÂM */
{id:1,section:"I",type:"mcq",badge:"🔊 I · Câu 1",question:"Chọn từ có phần gạch chân (chữ 'e') phát âm KHÁC các từ còn lại.",
 options:[{text:"b<u>e</u>have",correct:false},{text:"t<u>e</u>mple",correct:true},{text:"<u>e</u>nvelope",correct:false},{text:"for<u>e</u>st",correct:false}],
 explanation:`<div class="exp-section"><h4>Bước 1 · Dịch đề</h4><p><span class="vi-translate">💬 Chọn từ có chữ "e" gạch chân phát âm khác.</span></p></div>
 <div class="exp-section"><h4>Bước 2 · Phân tích 4 đáp án</h4><ul>
 <li><span class="hl-green">temple</span> <span class="word-class">n</span> <span class="p-phonetic">/ˈtempl/</span> = <span class="p-mean">ngôi đền</span> — "e" đọc rõ /e/</li>
 <li><span class="p-word">behave</span> <span class="word-class">v</span> <span class="p-phonetic">/bɪˈheɪv/</span> = <span class="p-mean">cư xử</span> — "e" (be-) đọc /ɪ/</li>
 <li><span class="p-word">envelope</span> <span class="word-class">n</span> <span class="p-phonetic">/ˈenvələʊp/</span> = <span class="p-mean">phong bì</span> — "e" (giữa) đọc /ə/</li>
 <li><span class="p-word">forest</span> <span class="word-class">n</span> <span class="p-phonetic">/ˈfɒrɪst/</span> = <span class="p-mean">khu rừng</span> — "e" đọc /ɪ/</li></ul></div>
 <div class="exp-section"><h4>Bước 3 · Tại sao đúng</h4><p><span class="p-grammar">"temple" có "e" là nguyên âm rõ /e/; ba từ kia "e" đều bị giảm nhẹ thành /ɪ/ hoặc /ə/ → temple khác biệt.</span></p></div>
 <div class="exp-section"><h4>Bước 4 · Tại sao sai / Bẫy</h4><p><span class="p-grammar">behave, envelope, forest có "e" là âm yếu (/ɪ/, /ə/) → giống nhau nên không chọn.</span></p></div>`},
{id:2,section:"I",type:"mcq",badge:"🔊 I · Câu 2",question:"Chọn từ có phần gạch chân (chữ 'ch') phát âm KHÁC các từ còn lại.",
 options:[{text:"<u>ch</u>eer",correct:false},{text:"<u>ch</u>eek",correct:false},{text:"mo<u>ch</u>i",correct:false},{text:"s<u>ch</u>ool",correct:true}],
 explanation:`<div class="exp-section"><h4>Bước 1 · Dịch đề</h4><p><span class="vi-translate">💬 Chọn từ có "ch" gạch chân phát âm khác.</span></p></div>
 <div class="exp-section"><h4>Bước 2 · Phân tích 4 đáp án</h4><ul>
 <li><span class="hl-green">school</span> <span class="word-class">n</span> <span class="p-phonetic">/skuːl/</span> = <span class="p-mean">trường học</span> — "ch" đọc /k/</li>
 <li><span class="p-word">cheer</span> <span class="word-class">v</span> <span class="p-phonetic">/tʃɪə/</span> = <span class="p-mean">cổ vũ</span> — "ch" đọc /tʃ/</li>
 <li><span class="p-word">cheek</span> <span class="word-class">n</span> <span class="p-phonetic">/tʃiːk/</span> = <span class="p-mean">má</span> — "ch" đọc /tʃ/</li>
 <li><span class="p-word">mochi</span> <span class="word-class">n</span> <span class="p-phonetic">/ˈməʊtʃi/</span> = <span class="p-mean">bánh mochi</span> — "ch" đọc /tʃ/</li></ul></div>

{id:12,section:"III",type:"mcq",badge:"✍️ III · Câu 12",question:"The desert often has lots of sand and very ______ rain.",
 options:[{text:"little",correct:true},{text:"few",correct:false},{text:"many",correct:false},{text:"much",correct:false}],
 explanation:`<div class="exp-section"><h4>Bước 1 · Dịch đề</h4><p><span class="vi-translate">💬 Sa mạc thường có nhiều cát và rất ít mưa.</span></p></div>
 <div class="exp-section"><h4>Bước 2 · Phân tích 4 đáp án (chú ý loại danh từ)</h4><ul>
 <li><span class="hl-green">little</span> = <span class="p-mean">ít (+ danh từ KHÔNG đếm được)</span></li>
 <li><span class="p-word">few</span> = <span class="p-mean">ít (+ danh từ ĐẾM ĐƯỢC số nhiều)</span></li>
 <li><span class="p-word">many</span> = <span class="p-mean">nhiều (+ danh từ ĐẾM ĐƯỢC số nhiều)</span></li>
 <li><span class="p-word">much</span> = <span class="p-mean">nhiều (+ danh từ KHÔNG đếm được, thường trong câu hỏi/phủ định)</span></li></ul></div>
 <div class="exp-section"><h4>Bước 3 · Tại sao đúng</h4><p><span class="p-grammar">"rain" (mưa) là danh từ KHÔNG đếm được; muốn nói "rất ít mưa" → "very little rain".</span></p></div>
 <div class="exp-section"><h4>Bước 4 · Tại sao sai / Bẫy</h4><p><span class="p-grammar">few chỉ đi với danh từ đếm được (sai với rain); many cũng vậy; "much" mang nghĩa "nhiều" trái với ngữ cảnh "very ... rain" (ít).</span></p></div>`},
{id:13,section:"III",type:"mcq",badge:"✍️ III · Câu 13",question:"You ______ have dinner so late. It's not good for your stomach.",
 options:[{text:"mustn't",correct:false},{text:"don't",correct:false},{text:"shouldn't",correct:true},{text:"couldn't",correct:false}],
 explanation:`<div class="exp-section"><h4>Bước 1 · Dịch đề</h4><p><span class="vi-translate">💬 Bạn không nên ăn tối quá muộn. Nó không tốt cho dạ dày của bạn.</span></p></div>
 <div class="exp-section"><h4>Bước 2 · Phân tích 4 đáp án</h4><ul>
 <li><span class="hl-green">shouldn't</span> <span class="word-class">modal</span> = <span class="p-mean">không nên (lời khuyên)</span></li>
 <li><span class="p-word">mustn't</span> <span class="word-class">modal</span> = <span class="p-mean">không được phép (cấm)</span></li>
 <li><span class="p-word">don't</span> <span class="word-class">aux</span> = <span class="p-mean">không (trợ động từ)</span></li>

 <div class="exp-section"><h4>Bước 3 · Tại sao đúng</h4><p><span class="p-grammar">Đây là LỜI KHUYÊN (không tốt cho sức khỏe) → dùng "shouldn't" (không nên).</span></p></div>
 <div class="exp-section"><h4>Bước 4 · Tại sao sai / Bẫy</h4><p><span class="p-grammar">mustn't là cấm đoán (quá mạnh); "don't have" cần ngữ cảnh khác; couldn't chỉ quá khứ.</span></p></div>`},

 options:[{text:"more peaceful than",correct:false},{text:"more peaceful",correct:true},{text:"peaceful than",correct:false},{text:"very peaceful",correct:false}],
 explanation:`<div class="exp-section"><h4>Bước 1 · Dịch đề</h4><p><span class="vi-translate">💬 Nơi nào yên bình hơn, ngôi làng của bạn hay Thành phố Hồ Chí Minh?</span></p></div>

 <li><span class="p-word">peaceful than</span> = <span class="p-mean">thiếu "more"</span></li>

 correctInput:"make",

/* ═══ STATE ═══ */
let answers={},shuffledOpts={},selectedOpts={},selectedOptId={};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ═══ FLOATERS ═══ */
function initFloaters(){
  const layer=document.getElementById('floaters-layer');
  for(let i=0;i<18;i++){const b=document.createElement('div');b.className='bubble';const size=Math.random()*22+8;b.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${-Math.random()*20}%;animation-duration:${7+Math.random()*10}s;animation-delay:${Math.random()*10}s;`;layer.appendChild(b);}
  const fishEmoji=['🐟','🐠','🐡','🦈','🐬','🦑'];
  for(let i=0;i<5;i++){const f=document.createElement('div');f.className='fish'+(Math.random()>0.5?' rtl':'');f.textContent=fishEmoji[Math.floor(Math.random()*fishEmoji.length)];f.style.cssText=`top:${15+Math.random()*65}%;left:${-80+Math.random()*10}px;animation-duration:${20+Math.random()*20}s;animation-delay:${Math.random()*18}s;font-size:${1.2+Math.random()*1}rem;`;layer.appendChild(f);}
  const seaweedEmoji=['🌿','🌾','🪸'];
  for(let i=0;i<4;i++){const s=document.createElement('div');s.className='seaweed';s.textContent=seaweedEmoji[Math.floor(Math.random()*seaweedEmoji.length)];s.style.cssText=`left:${5+Math.random()*90}%;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*3}s;font-size:${1.5+Math.random()*1}rem;`;layer.appendChild(s);}
  const jellyEmoji=['🪼','⭐','💫','✨'];
  for(let i=0;i<6;i++){const j=document.createElement('div');j.className='jellyfish';j.textContent=jellyEmoji[Math.floor(Math.random()*jellyEmoji.length)];j.style.cssText=`left:${Math.random()*95}%;top:${5+Math.random()*80}%;animation-duration:${4+Math.random()*4}s;animation-delay:${Math.random()*5}s;font-size:${1.1+Math.random()*1.2}rem;opacity:${0.6+Math.random()*0.4};`;layer.appendChild(j);}
  for(let i=0;i<15;i++){const sp=document.createElement('div');sp.className='sparkle';sp.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*5}s;width:${3+Math.random()*4}px;height:${3+Math.random()*4}px;`;layer.appendChild(sp);}
}

/* ═══ RENDER ═══ */
const sectionLabels={
 'I':'🔊 Phần I — Ngữ âm (Pronunciation)',
 'II':'🧩 Phần II — Chọn từ khác nhóm',
 'III':'✍️ Phần III — Chọn đáp án đúng',
 'IV':'🔍 Phần IV — Tìm & Sửa Lỗi Sai',
 'V':'⚙️ Phần V — Chia động từ',
 'VI':'🔤 Phần VI — Chia từ loại',
 'VII':'🧭 Phần VII — Sắp xếp & chọn câu kết (chỉ đường)',
 'VIII':'💡 Phần VIII — Viết câu từ gợi ý',
 'IX':'🔀 Phần IX — Sắp xếp câu',
 'X':'🔁 Phần X — Viết lại câu (dùng từ gợi ý)'
};
function renderQuiz(){
  const container=document.getElementById('quiz-container');
  let html=`<div class="progress-wrap"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div><div class="progress-text" id="progress-text">Trả lời: 0 / ${quizData.length}</div>`;
  let lastSection='';
  quizData.forEach(q=>{
    if(q.section!==lastSection){html+=`<div class="section-title">${sectionLabels[q.section]||q.section}</div>`;lastSection=q.section;}
    if(q.type==='error_correction'||q.type==='mcq'){
      const opts=shuffle(q.options);shuffledOpts[q.id]=opts;
      const optsHtml=opts.map((opt,idx)=>{
        if(q.type==='error_correction'){return `<button class="opt-btn" id="opt-${q.id}-${idx}" onclick="selectOptionOnly(${q.id},${idx},${opt.correct})">${opt.text}</button>`;}
        return `<button class="opt-btn" id="opt-${q.id}-${idx}" onclick="selectAnswer(${q.id},${idx},${opt.correct})">${opt.text}</button>`;
      }).join('');
      html+=`<div class="q-card" id="card-${q.id}"><div class="q-badge">${q.badge}</div>${q.passageHTML||''}<div class="q-text">❓ ${q.question}</div><div class="options-grid" id="opts-${q.id}">${optsHtml}</div>`;
      if(q.type==='error_correction'){html+=`<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;"><input type="text" id="input-${q.id}" class="q-input" placeholder="Gõ chữ sửa lại đúng vào đây..." autocomplete="off"><button class="check-btn" id="btn-${q.id}" onclick="checkErrorCorrection(${q.id})">🎯 Check</button></div>`;}
    } else if(q.type==='typing'){
      html+=`<div class="q-card" id="card-${q.id}"><div class="q-badge">${q.badge}</div>${q.passageHTML||''}<div class="q-text">❓ ${q.question}</div><div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;"><input type="text" id="input-${q.id}" class="q-input" placeholder="Gõ câu trả lời..." autocomplete="off"><button class="check-btn" id="btn-${q.id}" onclick="checkTyping(${q.id})">🎯 Check</button></div>`;
    }
    html+=`<div class="result-feedback" id="feedback-${q.id}"></div><div class="explanation-box" id="exp-${q.id}"><div class="exp-header">🌊 GIẢI THÍCH CHI TIẾT — GHI VÀO VỞ NGAY!</div>${q.explanation}</div></div>`;
  });
  container.innerHTML=html;updateProgress();
  document.querySelectorAll('.q-input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const id=inp.id.replace('input-','');const q=quizData.find(x=>x.id==id);if(q.type==='typing')checkTyping(+id);else if(q.type==='error_correction')checkErrorCorrection(+id);}}));
}

function normalizeText(t){return t.toLowerCase().replace(/[’]/g,"'").replace(/[.,?!]+$/,"").trim().replace(/\s+/g," ");}

function selectAnswer(qId,optIdx,isCorrect){
  if(answers.hasOwnProperty(qId))return;answers[qId]=isCorrect;
  const allBtns=document.getElementById(`opts-${qId}`).querySelectorAll('.opt-btn');allBtns.forEach(b=>b.disabled=true);
  const clicked=document.getElementById(`opt-${qId}-${optIdx}`);
  if(isCorrect){clicked.classList.add('correct');playCorrect();launchConfetti();showFeedback(qId,true);}
  else{clicked.classList.add('incorrect','shake');shuffledOpts[qId].forEach((opt,i)=>{if(opt.correct)document.getElementById(`opt-${qId}-${i}`).classList.add('correct');});playWrong();showFeedback(qId,false);}
  document.getElementById(`exp-${qId}`).classList.add('open');updateProgress();
}
function selectOptionOnly(qId,optIdx,isCorrect){
  if(answers.hasOwnProperty(qId))return;
  document.getElementById(`opts-${qId}`).querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
  const clicked=document.getElementById(`opt-${qId}-${optIdx}`);clicked.classList.add('selected');selectedOpts[qId]=isCorrect;selectedOptId[qId]=clicked.id;
}
function checkErrorCorrection(qId){
  if(answers.hasOwnProperty(qId))return;
  const inputEl=document.getElementById(`input-${qId}`),userText=normalizeText(inputEl.value),qData=quizData.find(q=>q.id===qId),correctText=normalizeText(qData.correctInput);
  if(selectedOpts[qId]===undefined){alert("⚠️ Explorer ơi, hãy chọn 1 phần gạch chân bị sai (A, B, C hoặc D) trước nhé!");return;}
  if(!userText){inputEl.classList.add('shake');setTimeout(()=>inputEl.classList.remove('shake'),450);return;}
  const isFullyCorrect=(selectedOpts[qId]===true)&&(userText===correctText);answers[qId]=isFullyCorrect;
  document.getElementById(`opts-${qId}`).querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);document.getElementById(`btn-${qId}`).disabled=true;inputEl.readOnly=true;
  if(isFullyCorrect){document.getElementById(selectedOptId[qId]).classList.add('correct');inputEl.classList.add('correct');playCorrect();launchConfetti();showFeedback(qId,true);}
  else{document.getElementById(selectedOptId[qId]).classList.add('incorrect','shake');inputEl.classList.add('incorrect','shake');shuffledOpts[qId].forEach((opt,i)=>{if(opt.correct)document.getElementById(`opt-${qId}-${i}`).classList.add('correct');});inputEl.value=inputEl.value+` ❌ (Đúng: ${qData.correctInput})`;playWrong();showFeedback(qId,false);}
  document.getElementById(`exp-${qId}`).classList.add('open');updateProgress();
}
function checkTyping(qId){
  if(answers.hasOwnProperty(qId))return;
  const inputEl=document.getElementById(`input-${qId}`),userText=normalizeText(inputEl.value),qData=quizData.find(q=>q.id===qId);
  if(!userText){inputEl.classList.add('shake');setTimeout(()=>inputEl.classList.remove('shake'),450);return;}
  const isCorrect=qData.acceptedAnswers.some(ans=>normalizeText(ans)===userText);answers[qId]=isCorrect;
  document.getElementById(`btn-${qId}`).disabled=true;inputEl.readOnly=true;
  if(isCorrect){inputEl.classList.add('correct');playCorrect();launchConfetti();showFeedback(qId,true);}
  else{inputEl.classList.add('incorrect','shake');inputEl.value=inputEl.value+`  ❌ Đáp án: ${qData.acceptedAnswers[0]}`;playWrong();showFeedback(qId,false);}
  document.getElementById(`exp-${qId}`).classList.add('open');updateProgress();
}
function showFeedback(qId,ok){const fb=document.getElementById(`feedback-${qId}`);if(ok){fb.textContent='🐬 Xuất sắc! Perfect dive!';fb.className='result-feedback show ok';}else{fb.textContent='🦈 Miss! Đọc giải thích và ghi chép nhé!';fb.className='result-feedback show no';}}
function updateProgress(){const answered=Object.keys(answers).length,total=quizData.length,fill=document.getElementById('progress-fill'),text=document.getElementById('progress-text');if(total===0)return;if(fill)fill.style.width=(answered/total*100)+'%';if(text)text.textContent=`Trả lời: ${answered} / ${total}`;}

/* ═══ AUDIO ═══ */
let actx=null;function getActx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function playCorrect(){try{const ctx=getActx();[[523,0],[659,0.12],[784,0.24],[1046,0.36]].forEach(([f,t])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';const T=ctx.currentTime+t;g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(0.16,T+0.02);g.gain.exponentialRampToValueAtTime(0.001,T+0.28);o.start(T);o.stop(T+0.3);});}catch(e){}}
function playWrong(){try{const ctx=getActx();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(200,ctx.currentTime);o.frequency.linearRampToValueAtTime(100,ctx.currentTime+0.4);g.gain.setValueAtTime(0.13,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.42);o.start();o.stop(ctx.currentTime+0.43);}catch(e){}}

/* ═══ CONFETTI ═══ */
let confFrame;
function launchConfetti(){const canvas=document.getElementById('confetti-canvas'),ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;const colors=['#06D6A0','#00B4D8','#90E0EF','#C77DFF','#FFD166','#FF6B6B','#FDFFB6'];const pieces=Array.from({length:70},()=>({x:Math.random()*canvas.width,y:-20,w:Math.random()*9+4,h:Math.random()*7+3,color:colors[Math.floor(Math.random()*colors.length)],vx:(Math.random()-0.5)*4,vy:Math.random()*3+1.5,rot:Math.random()*360,rotV:(Math.random()-0.5)*7}));
 function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);let alive=false;pieces.forEach(p=>{if(p.y>canvas.height+20)return;alive=true;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;p.vy+=0.07;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,1-p.y/canvas.height*0.9);ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(alive)confFrame=requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height);}
 cancelAnimationFrame(confFrame);draw();setTimeout(()=>{cancelAnimationFrame(confFrame);ctx.clearRect(0,0,canvas.width,canvas.height);},3200);}

/* ═══ SUBMIT / RESULT ═══ */
function openNameModal(){document.getElementById('name-modal').classList.add('open');document.getElementById('player-name').focus();getActx();}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('name-modal').classList.contains('open'))submitQuiz();});
function submitQuiz(){const ni=document.getElementById('player-name'),name=ni.value.trim(),err=document.getElementById('name-error');if(!name){ni.classList.add('error');err.classList.add('show');ni.focus();return;}ni.classList.remove('error');err.classList.remove('show');document.getElementById('name-modal').classList.remove('open');showResults(name);}
function showResults(name){
  const correct=Object.values(answers).filter(Boolean).length,total=quizData.length;
  const pct=total>0?(correct/total):0;const ten=(Math.round(correct/total*1000)/100).toFixed(2);
  let title,gif;
  if(pct===1){title=`🌊 MASTER DIVER! ${name} đã chinh phục toàn bộ đại dương tri thức!`;gif='https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif';}
  else if(pct>=0.6){title=`🐬 Great Explorer! ${name} đang lặn sâu vào tri thức — tiếp tục nào!`;gif='https://media.giphy.com/media/ZdUnQS4AXEl5a/giphy.gif';}
  else{title=`🐙 ${name} — mực nước tri thức cần được nâng lên! Đọc lại giải thích nhé!`;gif='https://media.giphy.com/media/3ohfFhG5VDtDTzQv2o/giphy.gif';}
  const stars='⭐'.repeat(Math.max(1,Math.round(pct*5)));
  const secOrder=[...new Set(quizData.map(q=>q.section))],secBreak={};secOrder.forEach(s=>secBreak[s]={ok:0,total:0});
  quizData.forEach(q=>{secBreak[q.section].total++;if(answers[q.id])secBreak[q.section].ok++;});
  const cells=secOrder.map(s=>`<div style="background:rgba(6,214,160,0.1);border-radius:10px;padding:6px 4px;color:var(--sky);font-size:0.72rem;">${s}<br><strong style="font-size:0.95rem;color:var(--gold)">${secBreak[s].ok}/${secBreak[s].total}</strong></div>`).join('');
  document.getElementById('result-content').innerHTML=`
    <div style="font-family:'Baloo 2',sans-serif;font-size:1rem;color:var(--gold);margin-bottom:10px;">${title}</div>
    <div class="score-display">
      <div class="score-big">${correct} / ${total}</div>
      <div class="score-sub">${stars}</div>
      <div class="score-ten">📊 Điểm quy đổi: <strong>${ten} / 10</strong></div>
      <div style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:6px;">${cells}</div>
    </div>
    <img class="result-gif" src="${gif}" alt="result" onerror="this.style.display='none'">
    <div style="font-size:0.78rem;color:rgba(144,224,239,0.65);">${pct<1?'📖 Quay lại đọc phần giải thích và ghi chép vào vở nhé Explorer!':'🏆 Hoàn hảo — tiếp tục bơi xa hơn!'}</div>`;
  document.getElementById('result-modal').classList.add('open');if(pct>=0.8)launchConfetti();
}
function retryQuiz(){answers={};shuffledOpts={};selectedOpts={};selectedOptId={};document.getElementById('result-modal').classList.remove('open');renderQuiz();window.scrollTo({top:0,behavior:'smooth'});}

initFloaters();renderQuiz();
</script>
