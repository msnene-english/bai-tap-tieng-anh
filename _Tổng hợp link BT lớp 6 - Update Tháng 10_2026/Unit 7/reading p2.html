<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading · TV (X & XI) · Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moss:#95d5b2; --leaf:#74c69d; --sky:#89c2d9; --sun:#ffe066; --clay:#f4a261; --cream:#f7f4ea;
  --ink:#1b3a2f;
  --p-word:#c1121f; --p-mean:#1d6fb8; --p-gram:#6a4c93;
  --green:#2a9d8f; --red:#e5383b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#95d5b2,#89c2d9,#ffe066,#f4a261,#74c69d);background-size:400% 400%;animation:bg 18s ease infinite;}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.3) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:42px;opacity:.45;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-24px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
/* HEADER GỌN */
header{padding:2px 12px 1px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(14px,1.9vw,20px);margin:0;letter-spacing:1px;color:#fff;-webkit-text-stroke:1.4px var(--ink);text-shadow:1.5px 1.5px 0 var(--clay)}
header .sub{font-weight:800;font-size:10px;display:inline-block;background:rgba(255,255,255,.7);border:1.5px solid var(--ink);border-radius:14px;padding:0 8px;margin-left:6px}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:5px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 12px 30px;border-radius:20px;background:rgba(247,244,234,.45);border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(27,58,47,.25)}
.pane::-webkit-scrollbar{width:10px}.pane::-webkit-scrollbar-thumb{background:var(--leaf);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;position:sticky;top:0;z-index:2;margin:0 -12px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--clay),var(--leaf));border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;margin:14px 0 8px;color:var(--ink);background:var(--sun);display:inline-block;padding:2px 16px;border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.rd{background:rgba(255,255,255,.6);border:2.5px solid var(--ink);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:3px 3px 0 rgba(27,58,47,.2)}
/* CHỮ TO HƠN */
.rd p{margin:8px 0;line-height:1.95;font-size:17px}
.gap{font-family:'Bangers',cursive;background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:0 8px;margin:0 2px;font-size:15px}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--leaf);color:var(--ink);font-weight:800;font-size:13px;border-radius:20px;padding:4px 14px;margin-top:8px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:8px;background:#eefbf3;border-left:5px solid var(--leaf);border-radius:8px;padding:10px 12px;font-size:15.5px;color:#12503a;line-height:1.75}
.q{background:rgba(255,255,255,.62);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;margin:13px 0;box-shadow:5px 5px 0 rgba(27,58,47,.2)}
.q .qtxt{font-weight:800;margin-bottom:11px;display:flex;gap:9px;line-height:1.5;font-size:16.5px}
.q .badge{font-family:'Bangers',cursive;background:var(--clay);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:16.5px;background:rgba(255,255,255,.92);border:2.5px solid var(--ink);border-radius:14px;padding:11px 15px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf5;border:2.5px dashed var(--ink);border-radius:14px;padding:13px;font-size:15px;line-height:1.65}
.exp h4{margin:0 0 6px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:19px}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#efe4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(247,244,234,.55);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sky),var(--clay));transition:width .3s}
.progtxt{font-weight:800;font-size:13px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:17px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#f4a261,#74c69d);border:2.5px solid var(--ink);border-radius:14px;padding:5px 16px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(27,58,47,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#f7f4ea);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(27,58,47,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:44px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:30px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sun);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--sky);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){body{overflow:auto}.wrap{height:auto;min-height:100%}.split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}.float{font-size:34px}.rd p{font-size:16px}footer{position:sticky;bottom:0}}
</style>
</head>
<body>
<div id="bgart">
  <span class="float" style="left:6%;top:14%;animation-delay:0s">📺</span>
  <span class="float" style="left:82%;top:10%;animation-delay:1.2s">🛰️</span>
  <span class="float" style="left:14%;top:74%;animation-delay:2s">🎬</span>
  <span class="float" style="left:74%;top:66%;animation-delay:.6s">👨‍👩‍👧</span>
  <span class="float" style="left:46%;top:40%;animation-delay:1.8s">⭐</span>
  <span class="float" style="left:90%;top:44%;animation-delay:2.6s">📚</span>
</div>
<div class="wrap">
  <header>
    <h1>📺 READING · TV (X &amp; XI)</h1><span class="sub">👩‍🏫 Ms MS Chí Nên</span>
  </header>
  <div class="split">
    <div class="pane" id="leftPane"><div class="pane-title">📖 Passages</div></div>
    <div class="pane" id="rightPane"><div class="pane-title">✏️ Tasks</div></div>
  </div>
  <footer>
    <span class="progtxt" id="ptxt">0/12</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <button class="submit" onclick="openSubmit()">🎯 NỘP BÀI</button>
  </footer>
</div>
<div class="overlay" id="nameOv"><div class="modal">
  <h2>🏆 Nhập tên để nộp bài</h2><input id="nameIn" placeholder="Tên học sinh...">
  <div class="err" id="nameErr"></div><button class="mbtn" onclick="grade()">Nộp bài ➜</button>
</div></div>
<div class="overlay" id="scoreOv"><div class="modal">
  <h2 id="hi"></h2><div class="score-big" id="scoreRaw"></div><div class="score-10" id="score10"></div>
  <div class="gifbox" id="gifbox"></div><div class="comment" id="comment"></div>
  <button class="mbtn" onclick="document.getElementById('scoreOv').style.display='none'">Đóng</button>
</div></div>

<script>
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"🅧 X. Choose the correct answers",
 left:`
 <div class="rd">
 <p>Television is one of man's most important <span class="gap">1</span> of communication. It brings pictures and sounds from around the world into millions of homes. Through television, home viewers can see and learn <span class="gap">2</span> people, places and things in faraway lands. TV even takes its viewers out of this world. It brings them coverage of America's astronauts as the astronauts explore <span class="gap">3</span> space. In addition to all these things, television brings its viewers a steady stream of programmes that are <span class="gap">4</span> to entertain. In fact, TV provides many <span class="gap">5</span> entertainment programs than any other kind. The programmes include dramas, comedies, sports, and <span class="gap">6</span> pictures.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Truyền hình là một trong những (1) phương tiện giao tiếp quan trọng nhất của con người. Nó mang hình ảnh và âm thanh từ khắp thế giới vào hàng triệu ngôi nhà. Qua truyền hình, người xem tại nhà có thể thấy và tìm hiểu (2) về con người, địa điểm và sự vật ở những vùng đất xa xôi. TV thậm chí đưa người xem ra khỏi thế giới này. Nó mang đến phóng sự về các phi hành gia Mỹ khi họ khám phá (3) không gian vũ trụ. Ngoài tất cả những điều đó, truyền hình còn mang đến một dòng chương trình liên tục được (4) thiết kế để giải trí. Thực tế, TV cung cấp (5) nhiều chương trình giải trí hơn bất kỳ loại nào khác. Các chương trình gồm phim truyền hình, hài kịch, thể thao và phim (6) điện ảnh.</div></div>`,
 qs:[
  {n:"1",q:"(1) one of man's most important ______ of communication",
   opts:[opt("means"),opt("ways"),opt("ranges"),opt("shows")],a:"means",
   exp:`<h4>🧠 Câu 1 ➔ b. means</h4><b>Dịch cả câu:</b> "Truyền hình là một trong những ______ giao tiếp quan trọng nhất của con người."
   <ul><li><span class="p-word">means</span> ➔ <span class="p-mean">phương tiện</span></li><li><span class="p-word">ways</span> ➔ <span class="p-mean">cách thức</span></li><li><span class="p-word">ranges</span> ➔ <span class="p-mean">phạm vi/dãy</span></li><li><span class="p-word">shows</span> ➔ <span class="p-mean">buổi trình diễn</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Cụm cố định <span class="p-grammar">means of communication</span> = phương tiện giao tiếp.<br>
   <span class="hl-red">Tại sao sai:</span> "ways" đi với <span class="p-grammar">ways of + V-ing</span> (cách làm gì), không hợp "of communication" bằng "means"; "ranges/shows" <span class="hl-red">sai nghĩa</span>.</span>`},
  {n:"2",q:"(2) can see and learn ______ people, places and things",
   opts:[opt("about"),opt("at"),opt("in"),opt("for")],a:"about",
   exp:`<h4>🧠 Câu 2 ➔ d. about</h4><b>Dịch cả câu:</b> "Người xem có thể thấy và tìm hiểu ______ con người, địa điểm và sự vật ở những vùng đất xa xôi."
   <ul><li><span class="p-word">about</span> ➔ <span class="p-mean">về (điều gì)</span></li><li><span class="p-word">at</span> ➔ <span class="p-mean">tại</span></li><li><span class="p-word">in</span> ➔ <span class="p-mean">trong</span></li><li><span class="p-word">for</span> ➔ <span class="p-mean">cho</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">learn about sth</span> = tìm hiểu về cái gì.<br>
   <span class="hl-red">Tại sao sai:</span> "learn at/in/for" <span class="hl-red">không đúng giới từ</span> với nghĩa "tìm hiểu về".</span>`},
  {n:"3",q:"(3) astronauts explore ______ space",
   opts:[opt("outer"),opt("deep"),opt("large"),opt("open")],a:"outer",
   exp:`<h4>🧠 Câu 3 ➔ c. outer</h4><b>Dịch cả câu:</b> "Nó mang đến phóng sự về các phi hành gia Mỹ khi họ khám phá ______ vũ trụ."
   <ul><li><span class="p-word">outer</span> ➔ <span class="p-mean">bên ngoài (outer space = không gian vũ trụ)</span></li><li><span class="p-word">deep</span> ➔ <span class="p-mean">sâu</span></li><li><span class="p-word">large</span> ➔ <span class="p-mean">rộng lớn</span></li><li><span class="p-word">open</span> ➔ <span class="p-mean">mở</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Cụm cố định <span class="p-grammar">outer space</span> = không gian vũ trụ (ngoài Trái Đất).<br>
   <span class="hl-red">Tại sao sai:</span> "deep/large/open space" <span class="hl-red">không phải cụm chuẩn</span> cho vũ trụ mà phi hành gia khám phá.</span>`},
  {n:"4",q:"(4) programmes that are ______ to entertain",
   opts:[opt("designed"),opt("happened"),opt("composed"),opt("guided")],a:"designed",
   exp:`<h4>🧠 Câu 4 ➔ b. designed</h4><b>Dịch cả câu:</b> "...một dòng chương trình liên tục được ______ để giải trí."
   <ul><li><span class="p-word">designed</span> ➔ <span class="p-mean">được thiết kế</span></li><li><span class="p-word">happened</span> ➔ <span class="p-mean">xảy ra</span></li><li><span class="p-word">composed</span> ➔ <span class="p-mean">soạn (nhạc)</span></li><li><span class="p-word">guided</span> ➔ <span class="p-mean">dẫn dắt</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">designed to + V</span> = được thiết kế/tạo ra để làm gì. "designed to entertain".<br>
   <span class="hl-red">Tại sao sai:</span> "happen" là nội động từ (không bị động kiểu này); "composed" (soạn nhạc) và "guided" (dẫn dắt) <span class="hl-red">sai nghĩa</span>.</span>`},
  {n:"5",q:"(5) TV provides many ______ entertainment programs than any other kind",
   opts:[opt("more"),opt("even"),opt("most"),opt("hardly")],a:"more",
   exp:`<h4>🧠 Câu 5 ➔ a. more</h4><b>Dịch cả câu:</b> "TV cung cấp ______ chương trình giải trí hơn bất kỳ loại nào khác."
   <ul><li><span class="p-word">more</span> ➔ <span class="p-mean">nhiều hơn</span></li><li><span class="p-word">even</span> ➔ <span class="p-mean">thậm chí</span></li><li><span class="p-word">most</span> ➔ <span class="p-mean">nhiều nhất</span></li><li><span class="p-word">hardly</span> ➔ <span class="p-mean">hầu như không</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Có <span class="p-word">than</span> phía sau ➔ dạng so sánh hơn <span class="p-grammar">more ... than</span> = nhiều hơn.<br>
   <span class="hl-red">Tại sao sai:</span> "most" là so sánh nhất (không đi với "than"); "even/hardly" <span class="hl-red">không tạo cấu trúc so sánh hơn</span>.</span>`},
  {n:"6",q:"(6) dramas, comedies, sports, and ______ pictures",
   opts:[opt("motion"),opt("lovely"),opt("clear"),opt("full")],a:"motion",
   exp:`<h4>🧠 Câu 6 ➔ c. motion</h4><b>Dịch cả câu:</b> "Các chương trình gồm phim truyền hình, hài kịch, thể thao và phim ______."
   <ul><li><span class="p-word">motion</span> ➔ <span class="p-mean">chuyển động (motion pictures = phim điện ảnh)</span></li><li><span class="p-word">lovely</span> ➔ <span class="p-mean">đáng yêu</span></li><li><span class="p-word">clear</span> ➔ <span class="p-mean">rõ ràng</span></li><li><span class="p-word">full</span> ➔ <span class="p-mean">đầy</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Cụm cố định <span class="p-grammar">motion pictures</span> = phim điện ảnh.<br>
   <span class="hl-red">Tại sao sai:</span> "lovely/clear/full pictures" chỉ là "bức tranh/hình ảnh đẹp/rõ/đầy", <span class="hl-red">không phải một loại chương trình</span>.</span>`}
 ]
},
{
 title:"🅧🅘 XI. Read & answer",
 left:`
 <div class="rd">
 <p>Television viewing is a major activity and influence on children. Children in the United States watch an average of three to four hours of television a day.</p>
 <p>While television can entertain, inform, and keep our children company, it may also influence them in undesirable ways. Time spent watching television takes away from important activities such as reading, school work, playing, exercise, family interaction, and social development. Children who watch a lot of television are likely to have lower grades in school, read fewer books, exercise less, and be overweight.</p>
 <p>Parents can help by doing the following: ◆ Don't allow children to watch long blocks of TV. ◆ Help them choose suitable programmes. Children's shows on public TV are appropriate, but soap operas, adult sitcoms and adult talk shows are not. ◆ Set certain periods when the television will be off. Study times are for learning, not for sitting in front of the TV doing homework. Make TV viewing an active process for children and parents.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Xem truyền hình là một hoạt động và ảnh hưởng lớn đối với trẻ em. Trẻ em ở Mỹ xem trung bình ba đến bốn tiếng TV mỗi ngày.<br><br>Dù truyền hình có thể giải trí, cung cấp thông tin và bầu bạn với trẻ, nó cũng có thể ảnh hưởng tới trẻ theo những cách không mong muốn. Thời gian xem TV lấy đi thời gian cho các hoạt động quan trọng như đọc sách, làm bài, chơi đùa, vận động, giao tiếp gia đình và phát triển xã hội. Trẻ xem TV nhiều dễ có điểm thấp hơn ở trường, đọc ít sách hơn, ít vận động và bị thừa cân.<br><br>Cha mẹ có thể giúp bằng cách: ◆ Không cho trẻ xem TV liên tục quá lâu. ◆ Giúp trẻ chọn chương trình phù hợp — chương trình thiếu nhi trên TV công cộng thì phù hợp, còn phim dài tập, sitcom và talk show người lớn thì không. ◆ Đặt ra những khoảng thời gian tắt TV — giờ học là để học, không phải ngồi trước TV làm bài. Hãy biến việc xem TV thành quá trình chủ động cho cả trẻ và cha mẹ.</div></div>`,
 qs:[

   exp:`<h4>🧠 Câu 1 ➔ Three to four hours</h4><b>Dịch đề:</b> "Trẻ em ở Mỹ xem TV trung bình bao nhiêu mỗi ngày?"
   <ul><li>Three to four hours a day. ➔ <span class="p-mean">Ba đến bốn tiếng mỗi ngày.</span></li><li>One or two hours a day. ➔ <span class="p-mean">Một đến hai tiếng.</span></li><li>Five to six hours a day. ➔ <span class="p-mean">Năm đến sáu tiếng.</span></li></ul>

   <span class="hl-green">Tại sao đúng:</span> Bài nêu "television can <span class="p-word">entertain, inform, and keep our children company</span>".<br>

   <span class="hl-green">Tại sao đúng:</span> "Children who watch a lot of television are likely to have <span class="p-word">lower grades in school</span>".<br>
   <span class="hl-red">Tại sao sai:</span> Ngược lại, trẻ <span class="hl-red">đọc ít sách hơn</span>; và bài không nói làm bài nhanh hơn.</span>`},

   exp:`<h4>🧠 Câu 4 ➔ No, they shouldn't</h4><b>Dịch đề:</b> "Cha mẹ có nên để con xem TV trong thời gian dài không?"
   <ul><li>No, they shouldn't. ➔ <span class="p-mean">Không, không nên.</span></li><li>Yes, as long as it is educational. ➔ <span class="p-mean">Có, miễn là mang tính giáo dục.</span></li><li>Yes, TV is always good for children. ➔ <span class="p-mean">Có, TV luôn tốt cho trẻ.</span></li></ul>

   exp:`<h4>🧠 Câu 5 ➔ Children's shows yes, adult shows no</h4><b>Dịch đề:</b> "Chương trình nào phù hợp với trẻ và chương trình nào không?"
   <ul><li>Children's shows on public TV are appropriate; soap operas and adult shows are not. ➔ <span class="p-mean">Chương trình thiếu nhi trên TV công cộng thì phù hợp; phim dài tập và chương trình người lớn thì không.</span></li><li>All TV programmes are suitable for children. ➔ <span class="p-mean">Mọi chương trình đều phù hợp.</span></li><li>Only sports and the news are appropriate. ➔ <span class="p-mean">Chỉ thể thao và tin tức phù hợp.</span></li></ul>

   exp:`<h4>🧠 Câu 6 ➔ set periods when TV is off</h4><b>Dịch đề:</b> "Cha mẹ có thể làm gì để hạn chế thời gian xem màn hình của con?"

/* ===== ENGINE ===== */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    TOTAL++;
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    const box=document.createElement('div'); box.className='opts';
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.textContent=o.en; b.dataset.val=o.en; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
    });
    card.appendChild(box);
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#95d5b2','#89c2d9','#ffe066','#f4a261','#74c69d','#f7f4ea'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';t.style.display=open?'none':'block';btn.textContent=open?'🌟 Mở dịch đoạn này':'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms MS Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
