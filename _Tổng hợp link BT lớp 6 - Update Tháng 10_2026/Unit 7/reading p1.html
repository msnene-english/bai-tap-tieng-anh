<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading · TV & Entertainment · Ms MS Chí Nên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moss:#95d5b2; --leaf:#74c69d; --sky:#89c2d9; --sun:#ffe066; --clay:#f4a261; --cream:#f7f4ea;
  --ink:#1b3a2f;
  --p-word:#c1121f; --p-mean:#1d6fb8; --p-gram:#6a4c93;
  --green:#2a9d8f; --red:#e5383b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(-45deg,#95d5b2,#89c2d9,#ffe066,#f4a261,#74c69d);background-size:400% 400%;animation:bg 18s ease infinite;}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.3) 1.5px,transparent 1.6px);background-size:22px 22px;}
.float{position:absolute;font-size:48px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{padding:4px 14px 2px;text-align:center}
header h1{font-family:'Bangers',cursive;font-size:clamp(17px,2.5vw,27px);margin:0;letter-spacing:1.5px;color:#fff;-webkit-text-stroke:1.8px var(--ink);text-shadow:2px 2px 0 var(--clay),3px 3px 0 rgba(0,0,0,.2)}
header .sub{font-weight:800;font-size:11px;margin-top:1px;display:inline-block;background:rgba(255,255,255,.7);border:1.5px solid var(--ink);border-radius:16px;padding:1px 10px;backdrop-filter:blur(6px)}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 14px 4px;min-height:0}
.pane{overflow-y:auto;padding:4px 10px 30px;border-radius:22px;background:rgba(247,244,234,.45);border:3px solid var(--ink);backdrop-filter:blur(10px);box-shadow:6px 6px 0 rgba(27,58,47,.25)}
.pane::-webkit-scrollbar{width:10px}.pane::-webkit-scrollbar-thumb{background:var(--leaf);border-radius:10px;border:2px solid var(--ink)}
.pane-title{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;position:sticky;top:0;z-index:2;margin:0 -10px 8px;padding:5px 12px;background:linear-gradient(90deg,var(--clay),var(--leaf));border-bottom:3px solid var(--ink);color:#fff;-webkit-text-stroke:1.2px var(--ink)}
h2.sec{font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;margin:16px 0 8px;color:var(--ink);background:var(--sun);display:inline-block;padding:2px 14px;border:2.5px solid var(--ink);border-radius:14px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.box{background:var(--sun);border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;margin:6px 0;box-shadow:3px 3px 0 var(--ink);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.box span{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:2px 12px;font-weight:800;font-size:13.5px}
.rd{background:rgba(255,255,255,.6);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:3px 3px 0 rgba(27,58,47,.2)}
.rd p{margin:6px 0;line-height:1.75}
.who{font-family:'Bangers',cursive;letter-spacing:.5px;font-size:16px;color:var(--p-word)}
.gap{font-family:'Bangers',cursive;background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:0 7px;margin:0 2px;font-size:13px}
.tbtn{cursor:pointer;border:2px solid var(--ink);background:var(--leaf);color:var(--ink);font-weight:800;font-size:12px;border-radius:20px;padding:3px 12px;margin-top:6px;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.tbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.trans{display:none;margin-top:6px;background:#eefbf3;border-left:5px solid var(--leaf);border-radius:8px;padding:8px 10px;font-size:14px;color:#12503a}
.q{background:rgba(255,255,255,.62);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:5px 5px 0 rgba(27,58,47,.2)}
.q .qtxt{font-weight:800;margin-bottom:10px;display:flex;gap:8px;line-height:1.45}
.q .badge{font-family:'Bangers',cursive;background:var(--clay);border:2.5px solid var(--ink);color:#fff;-webkit-text-stroke:.6px var(--ink);border-radius:12px;min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;box-shadow:2px 2px 0 var(--ink);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:15px;background:rgba(255,255,255,.92);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}
.opt:disabled{cursor:default}
.opt.correct{background:#8ce99a;border-color:#2b8a3e;box-shadow:3px 3px 0 #2b8a3e}
.opt.wrong{background:#ffa8a8;border-color:#c92a2a;box-shadow:3px 3px 0 #c92a2a}
.fin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fin input{font-family:'Nunito';font-weight:700;font-size:15px;padding:9px 12px;border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);min-width:140px}
.fin input.correct{background:#8ce99a;border-color:#2b8a3e}
.fin input.wrong{background:#ffa8a8;border-color:#c92a2a}
.checkbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:.5px;color:#fff;-webkit-text-stroke:.5px var(--ink);background:var(--green);border:2.5px solid var(--ink);border-radius:12px;padding:7px 16px;box-shadow:3px 3px 0 var(--ink)}
.checkbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.revbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:15px;letter-spacing:.5px;color:var(--ink);background:var(--sky);border:2.5px solid var(--ink);border-radius:12px;padding:7px 16px;box-shadow:3px 3px 0 var(--ink)}
.revbtn:active{transform:translate(2px,2px);box-shadow:0 0 0}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake{animation:shk .5s}
.exp{display:none;margin-top:12px;background:#fffdf5;border:2.5px dashed var(--ink);border-radius:14px;padding:12px;font-size:14px;line-height:1.6}
.exp h4{margin:0 0 6px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:18px}
.exp ul{margin:6px 0;padding-left:18px}.exp li{margin:4px 0}
.p-word{color:var(--p-word);font-weight:800}
.p-mean{color:var(--p-mean);font-weight:700}
.p-grammar{color:var(--p-gram);font-weight:800;background:#efe4ff;border-radius:5px;padding:0 4px}
.hl-green{color:#fff;background:var(--green);font-weight:800;border-radius:5px;padding:1px 6px}
.hl-red{color:#fff;background:var(--red);font-weight:800;border-radius:5px;padding:1px 6px}
.model{background:#e7f3ff;border-left:5px solid var(--p-mean);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:4px}
footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(247,244,234,.55);border-top:2.5px solid var(--ink);backdrop-filter:blur(8px)}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sky),var(--clay));transition:width .3s}
.progtxt{font-weight:800;font-size:12px;white-space:nowrap}
.submit{cursor:pointer;font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:linear-gradient(90deg,#f4a261,#74c69d);border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink)}
.submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(27,58,47,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(160deg,#fff,#f7f4ea);border:4px solid var(--ink);border-radius:24px;max-width:440px;width:100%;padding:22px;text-align:center;box-shadow:10px 10px 0 rgba(27,58,47,.35);max-height:92vh;overflow:auto}
.modal h2{font-family:'Bangers',cursive;font-size:30px;letter-spacing:1px;margin:4px 0}
.modal input{font-family:'Nunito';font-weight:700;font-size:16px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;width:100%;margin:10px 0}
.modal .mbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;color:#fff;-webkit-text-stroke:.6px var(--ink);background:var(--green);border:3px solid var(--ink);border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.score-big{font-family:'Bangers',cursive;font-size:44px;color:var(--p-mean);-webkit-text-stroke:1.5px var(--ink);margin:6px 0}
.score-10{font-family:'Bangers',cursive;font-size:30px;color:var(--p-word);margin:2px 0}
.gifbox{margin:12px auto;max-width:260px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sun);min-height:120px;display:flex;align-items:center;justify-content:center}
.gifbox img{width:100%;display:block}
.comment{font-weight:800;background:var(--sky);border:2.5px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0}
.err{color:var(--red);font-weight:800;font-size:13px;height:16px}
.confetti{position:fixed;top:-12px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@media(max-width:820px){body{overflow:auto}.wrap{height:auto;min-height:100%}.split{grid-template-columns:1fr;padding:6px 10px}.pane{overflow:visible;max-height:none}.float{font-size:36px}footer{position:sticky;bottom:0}}
</style>
</head>
<body>
<div id="bgart">
  <span class="float" style="left:6%;top:14%;animation-delay:0s">📺</span>
  <span class="float" style="left:82%;top:10%;animation-delay:1.2s">🎬</span>
  <span class="float" style="left:14%;top:74%;animation-delay:2s">🐱</span>
  <span class="float" style="left:74%;top:66%;animation-delay:.6s">📰</span>
  <span class="float" style="left:46%;top:40%;animation-delay:1.8s">⭐</span>
  <span class="float" style="left:90%;top:44%;animation-delay:2.6s">🍿</span>
</div>
<div class="wrap">
  <header>
    <h1>📺 READING · TV & ENTERTAINMENT 📺</h1>
    <div class="sub">👩‍🏫 Giáo viên tạo: Ms MS Chí Nên</div>
  </header>
  <div class="split">
    <div class="pane" id="leftPane"><div class="pane-title">📖 Passages</div></div>
    <div class="pane" id="rightPane"><div class="pane-title">✏️ Tasks</div></div>
  </div>
  <footer>
    <span class="progtxt" id="ptxt">0/25</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <button class="submit" onclick="openSubmit()">🎯 NỘP BÀI</button>
  </footer>
</div>
<div class="overlay" id="nameOv"><div class="modal">
  <h2>🏆 Nhập tên để nộp bài</h2><input id="nameIn" placeholder="Tên học sinh...">
  <div class="err" id="nameErr"></div><button class="mbtn" onclick="grade()">Nộp bài ➜</button>
</div></div>
<div class="overlay" id="scoreOv"><div class="modal">
  <h2 id="hi"></h2><div class="score-big" id="scoreRaw"></div><div class="score-10" id="score10"></div>
  <div class="gifbox" id="gifbox"></div><div class="comment" id="comment"></div>
  <button class="mbtn" onclick="document.getElementById('scoreOv').style.display='none'">Đóng</button>
</div></div>

<script>
function opt(en,vi){return {en,vi}}
const PARTS = [
{
 title:"📝 I. Complete the passage (điền từ — gõ)",
 left:`
 <div class="box"><span>friends</span><span>because</span><span>crazy</span><span>enjoy</span><span>programme</span><span>entertainment</span><span>restrict</span><span>fond</span></div>
 <div class="rd">
 <p>For me TV is the best source of <span class="gap">1</span>. I can relax and have fun at the same time. My favourite TV <span class="gap">2</span> is "How I Met Your Mother". I like it <span class="gap">3</span> it is funny and I <span class="gap">4</span> myself a lot. I watch it every day. The series follows the main character Ted Mosby and his group of <span class="gap">5</span> in Manhattan. I am also very <span class="gap">6</span> of "Criminal Minds" and "CSI:NY". TV is indeed very important for me. I would go <span class="gap">7</span> if I couldn't watch it for a week. My parents sometimes have to <span class="gap">8</span> my television viewing, but that's okay.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Với tôi, TV là nguồn (1) giải trí tuyệt nhất. Tôi vừa có thể thư giãn vừa vui. Chương trình (2) TV yêu thích của tôi là "How I Met Your Mother". Tôi thích nó (3) vì nó hài hước và tôi (4) tận hưởng nó rất nhiều. Tôi xem mỗi ngày. Loạt phim theo chân nhân vật chính Ted Mosby và nhóm (5) bạn của anh ở Manhattan. Tôi cũng rất (6) thích "Criminal Minds" và "CSI:NY". TV thực sự rất quan trọng với tôi. Tôi sẽ (7) phát điên nếu không được xem trong một tuần. Bố mẹ tôi đôi khi phải (8) hạn chế việc xem TV của tôi, nhưng không sao cả.</div></div>`,
 qs:[
  {n:"1",type:"fill",q:"(1) TV is the best source of ______ .",accept:["entertainment"],
   exp:`<h4>🧠 Câu 1 ➔ entertainment</h4><b>Dịch cả câu:</b> "Với tôi, TV là nguồn ______ tuyệt nhất."<br>
   <span class="hl-green">Tại sao đúng:</span> Cụm <span class="p-grammar">source of entertainment</span> = nguồn <span class="p-word">giải trí</span>; hợp "relax and have fun".</span>`},
  {n:"2",type:"fill",q:"(2) My favourite TV ______ is 'How I Met Your Mother'.",accept:["programme","program"],
   exp:`<h4>🧠 Câu 2 ➔ programme</h4><b>Dịch cả câu:</b> "Chương trình TV ______ yêu thích của tôi là 'How I Met Your Mother'."<br>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">TV programme</span> = <span class="p-word">chương trình</span> truyền hình (một series cụ thể).</span>`},
  {n:"3",type:"fill",q:"(3) I like it ______ it is funny.",accept:["because"],
   exp:`<h4>🧠 Câu 3 ➔ because</h4><b>Dịch cả câu:</b> "Tôi thích nó ______ nó hài hước."<br>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-word">because</span> = <span class="p-mean">vì</span>, nêu lý do "thích vì nó vui".</span>`},
  {n:"4",type:"fill",q:"(4) ...and I ______ myself a lot.",accept:["enjoy"],
   exp:`<h4>🧠 Câu 4 ➔ enjoy</h4><b>Dịch cả câu:</b> "...và tôi ______ nó rất nhiều."<br>
   <span class="hl-green">Tại sao đúng:</span> Cụm <span class="p-grammar">enjoy oneself</span> = tận hưởng, vui vẻ. "I enjoy myself a lot".</span>`},
  {n:"5",type:"fill",q:"(5) ...his group of ______ in Manhattan.",accept:["friends"],
   exp:`<h4>🧠 Câu 5 ➔ friends</h4><b>Dịch cả câu:</b> "...nhóm ______ của anh ấy ở Manhattan."<br>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">a group of friends</span> = một nhóm <span class="p-word">bạn bè</span> (phim về Ted và bạn bè).</span>`},
  {n:"6",type:"fill",q:"(6) I am also very ______ of 'Criminal Minds'.",accept:["fond"],
   exp:`<h4>🧠 Câu 6 ➔ fond</h4><b>Dịch cả câu:</b> "Tôi cũng rất ______ 'Criminal Minds' và 'CSI:NY'."<br>
   <span class="hl-green">Tại sao đúng:</span> Cụm cố định <span class="p-grammar">be fond of</span> = <span class="p-mean">thích, mê</span>. "fond of Criminal Minds".</span>`},
  {n:"7",type:"fill",q:"(7) I would go ______ if I couldn't watch it.",accept:["crazy"],
   exp:`<h4>🧠 Câu 7 ➔ crazy</h4><b>Dịch cả câu:</b> "Tôi sẽ ______ nếu không được xem trong một tuần."<br>
   <span class="hl-green">Tại sao đúng:</span> Cụm <span class="p-grammar">go crazy</span> = <span class="p-mean">phát điên</span> (vì không được xem TV).</span>`},
  {n:"8",type:"fill",q:"(8) My parents have to ______ my television viewing.",accept:["restrict"],
   exp:`<h4>🧠 Câu 8 ➔ restrict</h4><b>Dịch cả câu:</b> "Bố mẹ tôi đôi khi phải ______ việc xem TV của tôi."<br>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-word">restrict</span> = <span class="p-mean">hạn chế</span>; bố mẹ hạn chế thời gian xem TV.</span>`}
 ]
},
{
 title:"🧑‍🤝‍🧑 II. Steve · Kate · Rachel",
 left:`
 <div class="rd"><p><span class="who">Steve, 13</span> — I love TV. The first thing I do when I wake up is to switch it on. My favourite channel is the Cartoon Network. I watch TV three or four hours a day. My parents think it is too much and are always telling me to study, read a little or do a sport. But TV is my favourite hobby. I'm addicted to my favourite programmes.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Dịch</button>
 <div class="trans">Steve, 13 — Tôi yêu TV. Việc đầu tiên khi thức dậy là bật nó lên. Kênh yêu thích của tôi là Cartoon Network. Tôi xem TV ba đến bốn tiếng mỗi ngày. Bố mẹ nghĩ vậy là quá nhiều và luôn bảo tôi học bài, đọc sách hoặc chơi thể thao. Nhưng TV là sở thích số một của tôi. Tôi nghiện các chương trình mình thích.</div></div>
 <div class="rd"><p><span class="who">Kate, 14</span> — I know most teens don't like watching the news, but I do. I like to know what is happening around our world. I also enjoy documentaries, especially about wildlife. I'm very curious about the way animals live and how to preserve their habitats. I also enjoy watching live shows and films, mostly comedies and thrillers. I watch TV two or three hours a day.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Dịch</button>
 <div class="trans">Kate, 14 — Tôi biết đa số thanh thiếu niên không thích xem tin tức, nhưng tôi thì có. Tôi thích biết chuyện gì đang xảy ra trên thế giới. Tôi cũng thích phim tài liệu, nhất là về động vật hoang dã. Tôi rất tò mò về cách động vật sống và cách bảo tồn môi trường sống của chúng. Tôi cũng thích xem chương trình trực tiếp và phim, chủ yếu là hài và giật gân. Tôi xem TV hai đến ba tiếng mỗi ngày.</div></div>
 <div class="rd"><p><span class="who">Rachel, 17</span> — I like TV as everybody else, but now that I'm older I am more selective about the programmes I watch. I used to watch cartoons all the time. Now I like watching the news and some game shows like "Who Wants to Be a Millionaire?", so I don't really spend too much time in front of the box, an hour or two a day... Some programmes are educational and help us to use our imagination, but many are full of violence.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Dịch</button>
 <div class="trans">Rachel, 17 — Tôi thích TV như mọi người, nhưng giờ lớn hơn tôi kén chọn chương trình hơn. Trước đây tôi xem hoạt hình suốt. Giờ tôi thích xem tin tức và vài gameshow như "Ai là triệu phú", nên tôi không dành quá nhiều thời gian trước màn hình, khoảng một hai tiếng mỗi ngày... Một số chương trình mang tính giáo dục và giúp ta dùng trí tưởng tượng, nhưng nhiều chương trình đầy bạo lực.</div></div>`,
 qs:[
  {n:"A1",q:"A1. Steve is obsessed about TV.",opts:[opt("True"),opt("False")],a:"True",
   exp:`<h4>🧠 A1 ➔ TRUE (Đúng)</h4><b>Dịch câu:</b> "Steve bị ám ảnh/nghiện TV."<br>

   <span class="hl-red">Tại sao sai:</span> Phim tài liệu về động vật là của <span class="hl-red">Kate</span>; gameshow "Ai là triệu phú" là của <span class="hl-red">Rachel</span>.</span>`},
  {n:"B2",q:"B2. Why does Kate like watching documentaries on wildlife?",

   <span class="hl-green">Tại sao đúng:</span> Kate nói "I'm very <span class="p-word">curious about the way animals live and how to preserve their habitats</span>".<br>
   <span class="hl-red">Tại sao sai:</span> Bài <span class="hl-red">không nhắc</span> việc muốn làm bác sĩ thú y; và cô nói "<span class="hl-red">most teens don't like watching the news</span>" — tức sở thích của cô khác với đa số bạn cùng tuổi.</span>`},
  {n:"B3",q:"B3. How much time does Rachel spend watching TV?",

   <span class="hl-red">Tại sao sai:</span> "Hai đến ba tiếng" là của <span class="hl-red">Kate</span>; "ba đến bốn tiếng" là của <span class="hl-red">Steve</span>.</span>`},
  {n:"B4",q:"B4. According to Rachel, what are the benefits of TV?",

   a:"Some programmes are educational and help us to use our imagination.",

   <ul>

   <li>It helps her relax and have fun with her friends. ➔ <span class="p-mean">Nó giúp cô thư giãn và vui vẻ với bạn bè.</span></li>
   <li>It keeps her informed about violence around the world. ➔ <span class="p-mean">Nó giúp cô cập nhật về bạo lực trên thế giới.</span></li></ul>
   <span class="hl-green">Tại sao đúng:</span> Rachel nói "Some programmes are <span class="p-word">educational and help us to use our imagination</span>".<br>
   <span class="hl-red">Tại sao sai:</span> Cô <span class="hl-red">không nói</span> gì về việc xem cùng bạn bè; và cô coi bạo lực là <span class="hl-red">mặt tiêu cực</span> ("many are full of violence"), không phải lợi ích.</span>`}
 ]

{
 title:"🐱 IV. Garfield (điền 1 từ — gõ)",
 left:`
 <div class="box"><span>on</span><span>watching</span><span>channel</span><span>while</span><span>television</span><span>likes</span><span>more</span></div>
 <div class="rd">
 <p>One of my favourite <span class="gap">1</span> programmes is Garfield. It is an American cartoon television series based <span class="gap">2</span> the comic strip Garfield by Jim Davis. The show was produced by Film Roman. It is programmed every day at half past seven on <span class="gap">3</span> six. The series follows the life of a fat, lazy orange cat who wants nothing <span class="gap">4</span> out of life than to eat and sleep. He loves to lie eating lasagna and <span class="gap">5</span> TV. My mother also <span class="gap">6</span> this programme and normally watches it with me, so we usually have something good to eat like popcorn, cheese, biscuits or pizza <span class="gap">7</span> we watch the show together.</p>
 <button class="tbtn" onclick="tg(this)">🌟 Mở dịch đoạn này</button>
 <div class="trans">Một trong những chương trình (1) truyền hình yêu thích của tôi là Garfield. Đó là một loạt phim hoạt hình truyền hình của Mỹ dựa (2) trên bộ truyện tranh Garfield của Jim Davis. Chương trình do Film Roman sản xuất. Nó được chiếu mỗi ngày lúc 7 giờ rưỡi trên (3) kênh số sáu. Loạt phim theo chân cuộc đời một chú mèo cam béo, lười, chẳng muốn gì (4) hơn trong đời ngoài ăn và ngủ. Nó thích nằm ăn lasagna và (5) xem TV. Mẹ tôi cũng (6) thích chương trình này và thường xem cùng tôi, nên chúng tôi hay có món ngon để ăn như bỏng ngô, phô mai, bánh quy hay pizza (7) trong khi cùng xem.</div></div>`,
 qs:[
  {n:"1",type:"fill",q:"(1) One of my favourite ______ programmes is Garfield.",accept:["television","tv"],
   exp:`<h4>🧠 Câu 1 ➔ television</h4><b>Dịch cả câu:</b> "Một trong những chương trình ______ yêu thích của tôi là Garfield."<br>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">television programmes</span> = chương trình <span class="p-word">truyền hình</span>.</span>`},
  {n:"2",type:"fill",q:"(2) ...based ______ the comic strip Garfield.",accept:["on"],
   exp:`<h4>🧠 Câu 2 ➔ on</h4><b>Dịch cả câu:</b> "...dựa ______ bộ truyện tranh Garfield của Jim Davis."<br>
   <span class="hl-green">Tại sao đúng:</span> Cụm cố định <span class="p-grammar">based on</span> = dựa trên.</span>`},
  {n:"3",type:"fill",q:"(3) ...at half past seven on ______ six.",accept:["channel"],
   exp:`<h4>🧠 Câu 3 ➔ channel</h4><b>Dịch cả câu:</b> "Nó được chiếu mỗi ngày lúc 7h30 trên ______ số sáu."<br>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-grammar">on channel six</span> = trên <span class="p-word">kênh</span> số sáu.</span>`},
  {n:"4",type:"fill",q:"(4) ...who wants nothing ______ out of life than to eat and sleep.",accept:["more"],
   exp:`<h4>🧠 Câu 4 ➔ more</h4><b>Dịch cả câu:</b> "...chú mèo chẳng muốn gì ______ trong đời ngoài ăn và ngủ."<br>
   <span class="hl-green">Tại sao đúng:</span> Cấu trúc so sánh <span class="p-grammar">nothing more ... than</span> = không gì hơn ngoài.</span>`},
  {n:"5",type:"fill",q:"(5) He loves to lie eating lasagna and ______ TV.",accept:["watching"],
   exp:`<h4>🧠 Câu 5 ➔ watching</h4><b>Dịch cả câu:</b> "Nó thích nằm ăn lasagna và ______ TV."<br>
   <span class="hl-green">Tại sao đúng:</span> Song song với "eating" là <span class="p-grammar">watching</span> (V-ing). "eating lasagna and watching TV".</span>`},
  {n:"6",type:"fill",q:"(6) My mother also ______ this programme.",accept:["likes","loves","enjoys"],
   exp:`<h4>🧠 Câu 6 ➔ likes / loves / enjoys</h4><b>Dịch cả câu:</b> "Mẹ tôi cũng ______ chương trình này và thường xem cùng tôi."<br>
   <span class="hl-green">Tại sao đúng:</span> Cần động từ chỉ sự yêu thích, chia ngôi 3 số ít (thêm -s): <span class="p-word">likes / loves / enjoys</span>.</span>`},
  {n:"7",type:"fill",q:"(7) ...pizza ______ we watch the show together.",accept:["while","when","as"],
   exp:`<h4>🧠 Câu 7 ➔ while</h4><b>Dịch cả câu:</b> "...pizza ______ chúng tôi cùng xem chương trình."<br>
   <span class="hl-green">Tại sao đúng:</span> <span class="p-word">while</span> = <span class="p-mean">trong khi</span> (hai việc xảy ra cùng lúc: vừa ăn vừa xem).</span>`}
 ]

/* ===== ENGINE ===== */
let TOTAL=0, answered={};
const leftPane=document.getElementById('leftPane');
const rightPane=document.getElementById('rightPane');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
PARTS.forEach((part,pi)=>{
  const ls=document.createElement('div'); ls.innerHTML=`<h2 class="sec">${part.title}</h2>`+part.left; leftPane.appendChild(ls);
  const rs=document.createElement('div'); rs.innerHTML=`<h2 class="sec">${part.title}</h2>`; rightPane.appendChild(rs);
  part.qs.forEach((q,qi)=>{
    const qid='q'+pi+'_'+qi;
    const card=document.createElement('div'); card.className='q'; card.id=qid;
    const head=document.createElement('div'); head.className='qtxt';
    head.innerHTML=`<span class="badge">${q.n}</span><span>${q.q}</span>`; card.appendChild(head);
    if(q.type==='reveal'){
      const rb=document.createElement('button'); rb.className='revbtn'; rb.textContent='Xem đáp án mẫu 👀';
      rb.onclick=()=>{card.querySelector('.exp').style.display='block';rb.disabled=true;rb.style.opacity=.5;};
      card.appendChild(rb);
    } else if(q.type==='fill'){
      TOTAL++;
      const fin=document.createElement('div'); fin.className='fin';
      const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Gõ từ...';
      const cb=document.createElement('button'); cb.className='checkbtn'; cb.textContent='Kiểm tra ✓';
      cb.onclick=()=>checkFill(inp,cb,card,qid,q.accept);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')cb.click();});
      fin.appendChild(inp); fin.appendChild(cb); card.appendChild(fin);
    } else {
      TOTAL++;
      const box=document.createElement('div'); box.className='opts';
      shuffle(q.opts).forEach(o=>{
        const b=document.createElement('button'); b.className='opt'; b.type='button';
        b.textContent=o.en; b.dataset.val=o.en; b.onclick=()=>choose(b,card,qid,q.a); box.appendChild(b);
      });
      card.appendChild(box);
    }
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=q.exp; card.appendChild(ex);
    rs.appendChild(card);
  });
});
document.getElementById('ptxt').textContent='0/'+TOTAL;
let AC=null;
function actx(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function ding(){const c=actx(),t=c.currentTime;[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t+i*.08);g.gain.linearRampToValueAtTime(.25,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);o.start(t+i*.08);o.stop(t+i*.08+.5);});}
function buzz(){const c=actx(),t=c.currentTime;[0,.13].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=196;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.01);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.start(t+d);o.stop(t+d+.1);});}
function confetti(){const cols=['#95d5b2','#89c2d9','#ffe066','#f4a261','#74c69d','#f7f4ea'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);const dur=1600+Math.random()*1200;d.animate([{top:'-12px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur,easing:'ease-in'});setTimeout(()=>d.remove(),dur);}}
function updateProg(){const done=Object.keys(answered).length;document.getElementById('ptxt').textContent=done+'/'+TOTAL;document.getElementById('fill').style.width=(done/TOTAL*100)+'%';}
function tg(btn){const t=btn.nextElementSibling;const open=t.style.display==='block';t.style.display=open?'none':'block';btn.textContent=open?(btn.textContent.includes('Dịch')&&!btn.textContent.includes('đoạn')?'🌟 Dịch':'🌟 Mở dịch đoạn này'):'🙈 Ẩn dịch';}
function choose(btn,card,qid,correct){
  if(qid in answered) return;
  const ok=btn.dataset.val===correct; answered[qid]=ok;
  card.querySelectorAll('.opt').forEach(o=>{o.disabled=true;});
  if(ok){btn.classList.add('correct');ding();confetti();}
  else{btn.classList.add('wrong');card.classList.add('shake');buzz();
    card.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===correct)o.classList.add('correct');});
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function checkFill(inp,btn,card,qid,accept){
  if(qid in answered) return;
  const val=inp.value.trim().toLowerCase().replace(/[.,;:'"]/g,'');
  const ok=accept.includes(val); answered[qid]=ok;
  inp.disabled=true; btn.disabled=true;
  if(ok){inp.classList.add('correct');ding();confetti();}
  else{inp.classList.add('wrong');card.classList.add('shake');buzz();
    const hint=document.createElement('div');hint.style.marginTop='6px';hint.style.fontWeight='800';
    hint.innerHTML='✅ Đáp án đúng: <span class="hl-green">'+accept.join(' / ')+'</span>';
    card.querySelector('.fin').after(hint);
    setTimeout(()=>card.classList.remove('shake'),600);}
  card.querySelector('.exp').style.display='block'; updateProg();
}
function openSubmit(){document.getElementById('nameErr').textContent='';document.getElementById('nameOv').style.display='flex';document.getElementById('nameIn').focus();}
function grade(){
  const name=document.getElementById('nameIn').value.trim();
  if(!name){document.getElementById('nameErr').textContent='⚠️ Vui lòng nhập tên trước khi nộp!';return;}
  document.getElementById('nameOv').style.display='none';
  let correct=0;for(const k in answered)if(answered[k])correct++;
  const pct=correct/TOTAL*100, ten=(correct/TOTAL*10).toFixed(2);
  document.getElementById('hi').textContent='🎉 Chúc mừng, '+name+'!';
  document.getElementById('scoreRaw').textContent=correct+'/'+TOTAL+' câu đúng';
  document.getElementById('score10').textContent='⭐ '+ten+'/10 điểm';
  let comment,gif;
  if(pct===100){comment='Xuất sắc! Con là THIÊN TÀI tiếng Anh của lớp! Cô cực kỳ tự hào! 🌟';gif='https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif';}
  else if(pct>=80){comment='Rất giỏi! Chỉ cần cẩn thận thêm chút xíu là hoàn hảo rồi! 👏';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else if(pct>=60){comment='Khá tốt! Con đang tiến bộ — ôn thêm từ vựng & đọc kỹ giải thích nhé! 💪';gif='https://media.giphy.com/media/111ebonMs90YLu/giphy.gif';}
  else{comment='Đừng nản nhé! Con đọc lại phần giải thích màu và làm lại. Cô tin con làm được! 💖';gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
  document.getElementById('comment').innerHTML='📝 <b>Lời phê của Ms MS Chí Nên:</b><br>'+comment;
  const fb = pct>=60 ? '🎊' : '🤗';
  const gb=document.getElementById('gifbox'); gb.innerHTML='';
  const im=document.createElement('img'); im.src=gif; im.alt='reaction';
  im.onerror=function(){gb.innerHTML='<div style="font-size:64px">'+fb+'</div>';};
  gb.appendChild(im);
  document.getElementById('scoreOv').style.display='flex';
  if(pct>=60){let n=0;const iv=setInterval(()=>{confetti();if(++n>=4)clearInterval(iv);},350);}
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')grade();});
</script>
