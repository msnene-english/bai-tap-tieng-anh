<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❄️ Bài 9 · 10 – Phonetics /θ/ /ð/ | Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#e8f5e9;--bg2:#e1f5fe;--bg3:#f9fbe7;
  --green:#43a047;--dgreen:#1b5e20;--teal:#00897b;
  --sky:#039be5;--yellow:#f9a825;--orange:#fb8c00;
  --card:#ffffff;--border:rgba(67,160,71,.28);
  --text:#1b3a1e;--text2:#2e7d32;
  --ok:#2e7d32;--bad:#c62828;
  --sh:0 4px 20px rgba(67,160,71,.18);
}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  background-size:300% 300%;animation:bgP 14s ease infinite;color:var(--text);min-height:100vh;overflow-x:hidden}
@keyframes bgP{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
/* FLOATS — lá bay */
.floats{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fo{position:absolute;animation:fUp linear infinite;opacity:.55}
@keyframes fUp{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-14vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:14px 16px 80px}
/* HEADER */
.hdr{background:linear-gradient(135deg,rgba(232,245,233,.97),rgba(225,245,254,.97));border-radius:22px;
  padding:15px 22px 13px;text-align:center;margin-bottom:18px;box-shadow:var(--sh);border:2px solid rgba(67,160,71,.3)}
.hdr h1{font-size:1.15rem;font-weight:900;background:linear-gradient(90deg,var(--dgreen),var(--teal),var(--sky));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.6}
.hdr p{font-size:.77rem;color:var(--text2);margin-top:4px}
/* SCORE */
.sbar{display:flex;align-items:center;gap:12px;background:#fff;border-radius:50px;padding:9px 20px;margin-bottom:20px;
  box-shadow:var(--sh);border:2px solid rgba(67,160,71,.25);font-weight:800;font-size:.95rem;position:sticky;top:8px;z-index:50}
.sbar .sc{color:var(--dgreen)}
.pw{flex:1;height:11px;background:rgba(67,160,71,.15);border-radius:50px;overflow:hidden}
.pb{height:100%;background:linear-gradient(90deg,var(--green),var(--teal));border-radius:50px;transition:width .5s}
.sc2{color:var(--sky)}
/* SECTION */
.exs{background:var(--card);border-radius:22px;padding:20px 18px 16px;margin-bottom:26px;box-shadow:var(--sh);
  border:2px solid rgba(67,160,71,.22)}
.ext{font-size:1.0rem;font-weight:900;color:var(--dgreen);margin-bottom:6px;line-height:1.6}
.exd{font-size:.85rem;font-weight:700;color:var(--text2);font-style:italic;margin-bottom:14px;padding-bottom:10px;
  border-bottom:2.5px dashed rgba(67,160,71,.25);line-height:1.7}
/* ── SCAFFOLD LÝ THUYẾT ── */
.theory{background:linear-gradient(135deg,#f7fce8,#eefaf3);border:2.5px dashed var(--yellow);border-radius:18px;
  padding:14px 15px 16px;margin-bottom:16px}
.theory h3{font-size:.98rem;font-weight:900;color:var(--orange);margin-bottom:10px;line-height:1.6}
.rule{background:#fff;border-left:5px solid var(--green);border-radius:0 11px 11px 0;padding:8px 12px;margin-bottom:8px;
  font-size:.94rem;line-height:1.8;font-weight:700;box-shadow:0 2px 8px rgba(67,160,71,.1)}
.rule b{color:var(--dgreen)}
.eg{display:inline-block;background:rgba(3,155,229,.1);border:1.5px solid rgba(3,155,229,.4);border-radius:8px;
  padding:0 9px;font-weight:800;color:#0277bd;margin:2px 3px 0 0}
.ttab{width:100%;border-collapse:collapse;margin:9px 0;font-size:.88rem}
.ttab th{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;padding:7px 8px;
  border:1.5px solid rgba(27,94,32,.3);font-weight:900;font-size:.83rem}
.ttab td{background:#fff;padding:6px 9px;border:1.5px solid rgba(67,160,71,.25);font-weight:700;line-height:1.7}
.ttab tr:nth-child(even) td{background:#f4fbf5}
.ttab td b{color:var(--dgreen)}
.ttip{background:rgba(67,160,71,.1);border:2px solid var(--green);border-radius:12px;padding:9px 13px;
  font-size:.92rem;font-weight:700;line-height:1.85;color:#14532d}
.twarn{background:rgba(198,40,40,.07);border:2px solid rgba(198,40,40,.45);border-radius:12px;padding:9px 13px;
  font-size:.92rem;font-weight:700;line-height:1.85;color:#8e1b1b;margin-top:8px}
.twarn s{color:#b91c1c}
/* BẢNG XẾP NHÓM */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:600px){.bins{grid-template-columns:1fr}}
.bin{border-radius:16px;padding:11px 13px 13px;border:2.5px solid;min-height:112px}
.bin.t{background:rgba(251,140,0,.07);border-color:var(--orange)}
.bin.d{background:rgba(67,160,71,.08);border-color:var(--green)}
.bin h4{font-size:.95rem;font-weight:900;margin-bottom:8px;line-height:1.5}
.bin.t h4{color:#e65100}
.bin.d h4{color:var(--dgreen)}
.bin .cnt{font-size:.76rem;font-weight:800;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .ph{font-size:.79rem;font-style:italic;color:var(--text2);opacity:.8;font-weight:700}
.chip{display:inline-block;background:#fff;border:2px solid rgba(67,160,71,.3);border-radius:9px;padding:3px 10px;
  font-weight:800;font-size:.9rem;animation:pop .3s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.chip.ok{border-color:var(--ok);color:var(--ok);background:rgba(67,160,71,.1)}
.chip.no{border-color:var(--bad);color:var(--bad);background:rgba(198,40,40,.08)}
/* Q CARD */
.qc{background:rgba(232,245,233,.45);border-radius:16px;padding:15px 16px;margin-bottom:13px;
  border:2px solid rgba(67,160,71,.18);transition:.2s}
.qc:hover{border-color:var(--green);box-shadow:0 3px 12px rgba(67,160,71,.18)}
.qc.shk{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qt{font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.7;margin-bottom:11px}
.qn{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green),var(--teal));
  color:#fff;border-radius:50%;width:27px;height:27px;font-size:.82rem;font-weight:900;margin-right:8px;flex-shrink:0}
.bigw{font-size:1.35rem;font-weight:900;color:var(--dgreen);letter-spacing:.5px}
.bigw u{text-decoration:none;background:rgba(249,168,37,.35);border-radius:5px;padding:0 3px}
/* OPTIONS */
.og{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.og.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.og{grid-template-columns:1fr}}
.ob{background:#fff;border:2.5px solid rgba(67,160,71,.25);border-radius:13px;padding:10px 13px;font-family:'Nunito',sans-serif;
  font-size:.97rem;font-weight:800;color:var(--text);cursor:pointer;box-shadow:0 3px 0 rgba(67,160,71,.2);
  transition:transform .12s,box-shadow .12s;text-align:center;line-height:1.5}
.ob:hover:not(:disabled){transform:scale(1.03) translateY(-2px);box-shadow:0 6px 0 rgba(67,160,71,.2);border-color:var(--green)}
.ob.correct{background:rgba(67,160,71,.12)!important;border-color:var(--ok)!important;color:var(--ok)!important}
.ob.wrong{background:rgba(198,40,40,.08)!important;border-color:var(--bad)!important;color:var(--bad)!important;animation:shake .4s}
.ob.dim{opacity:.42}
.ob:disabled{cursor:default}
/* EXPLANATION */
.ep{display:none;background:linear-gradient(135deg,rgba(241,248,233,.98),rgba(224,242,241,.98));
  border-left:4px solid var(--teal);border-radius:0 14px 14px 0;padding:13px 15px;margin-top:11px;
  font-size:.93rem;line-height:1.8;color:var(--text)}
.ep.show{display:block;animation:sld .35s ease}
@keyframes sld{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.keyb{background:rgba(67,160,71,.14);border:2px solid var(--ok);border-radius:10px;padding:8px 12px;margin-bottom:10px;
  font-weight:900;color:#14532d;line-height:1.7}
.vnt{background:rgba(249,168,37,.12);border-left:3px solid var(--yellow);border-radius:0 8px 8px 0;padding:7px 12px;
  margin-bottom:9px;font-size:.91rem;color:#c65a00;font-weight:700;line-height:1.75}
.stp{background:rgba(255,255,255,.72);border:1.5px solid rgba(0,137,123,.2);border-radius:10px;padding:8px 12px;
  margin-bottom:8px;line-height:1.8}
.stp .lb{display:inline-block;background:linear-gradient(135deg,var(--teal),var(--sky));color:#fff;border-radius:7px;
  padding:1px 10px;font-size:.82rem;font-weight:900;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:7px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#fff;border:1.5px solid rgba(67,160,71,.2);border-radius:8px;padding:5px 9px;line-height:1.7;font-weight:700}
.p-word{color:#1565c0;font-weight:800}
.hl-green{color:#2e7d32;font-weight:900}
.p-phonetic{color:#7b1fa2;background:rgba(123,31,162,.1);border-radius:4px;padding:1px 5px;font-family:monospace;font-size:.85rem}
.p-mean{color:#e64a19;font-weight:700}
.wt{background:rgba(67,160,71,.15);border:1px solid rgba(67,160,71,.35);border-radius:5px;padding:1px 5px;
  font-size:.75rem;font-weight:700;color:var(--dgreen)}
.sT{background:rgba(251,140,0,.16);border:1.5px solid var(--orange);color:#e65100;border-radius:6px;padding:0 6px;font-weight:900}
.sD{background:rgba(67,160,71,.16);border:1.5px solid var(--green);color:var(--dgreen);border-radius:6px;padding:0 6px;font-weight:900}
.stz{background:rgba(3,155,229,.14);border:1.5px solid var(--sky);color:#01579b;border-radius:6px;padding:0 6px;font-weight:900;font-size:.85em}
/* KHÔNG dùng gạch chân đỏ trong giải thích */
.pg{background:rgba(249,168,37,.14);border:1.5px solid rgba(249,168,37,.55);border-radius:8px;padding:2px 8px;
  font-weight:800;color:#8a5a00;line-height:2.05;display:inline-block}
/* SUBMIT */
.sub-a{text-align:center;margin-top:28px}
.sub-btn{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;border:none;border-radius:22px;
  padding:13px 44px;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:900;cursor:pointer;
  box-shadow:0 6px 0 rgba(46,125,50,.35);transition:.15s}
.sub-btn:hover{transform:scale(1.04) translateY(-3px)}
/* OVERLAYS */
.ov{display:none;position:fixed;inset:0;background:rgba(27,94,32,.35);backdrop-filter:blur(4px);z-index:3000;
  align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.ov.on{display:flex}
.npb,.rb{background:linear-gradient(135deg,#f1f8e9,#e8f5e9);border-radius:24px;padding:26px 22px 20px;max-width:440px;
  width:95%;box-shadow:0 0 50px rgba(67,160,71,.3);text-align:center;border:2px solid rgba(67,160,71,.35)}
.npb h2{font-size:1.18rem;font-weight:900;background:linear-gradient(90deg,var(--dgreen),var(--teal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.npb p{font-size:.87rem;color:var(--text2);margin-bottom:13px}
.ni{width:100%;background:#fff;border:2.5px solid rgba(67,160,71,.3);border-radius:12px;padding:10px 13px;
  font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;color:var(--text);outline:none;transition:.2s;text-align:center}
.ni:focus{border-color:var(--green)}
.ni.err{border-color:var(--bad);background:rgba(198,40,40,.06);animation:shake .4s}
.nerr{color:var(--bad);font-size:.85rem;font-weight:800;margin-top:6px;display:none}
.cfb{margin-top:13px;background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;border:none;border-radius:13px;
  padding:10px 32px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;cursor:pointer;width:100%}
.re{font-size:3rem;margin-bottom:7px}
.rt{font-size:1.3rem;font-weight:900;background:linear-gradient(90deg,var(--dgreen),var(--teal),var(--sky));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:5px;line-height:1.4}
.rs{font-size:2.1rem;font-weight:900;color:var(--dgreen);margin:9px 0}
.rn{font-size:1rem;font-weight:900;color:var(--teal);margin-bottom:6px}
.rc{font-size:.94rem;font-weight:700;color:var(--text2);margin-bottom:13px;line-height:1.7}
.rmm{width:100%;max-width:270px;border-radius:14px;margin:0 auto 13px;display:block;border:2px solid rgba(67,160,71,.4)}
.cf{position:fixed;top:-10px;width:10px;height:14px;border-radius:3px;opacity:0;animation:cfall 1.4s ease-in forwards;
  pointer-events:none;z-index:9999}
@keyframes cfall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(740deg)}}
</style>

function build(m,gid){
  const card=document.createElement('div');card.className='qc';card.id='c_'+gid;
  const so=shuffle(m.opts);maps[gid]=so;
  card.innerHTML='<div class="qt"><span class="qn">'+m.num+'</span>'+m.q+'</div>'+
    '<div class="og'+(m.cols===4?' c4':'')+'" id="o_'+gid+'">'+
    so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
    '</div><div class="ep" id="e_'+gid+'">'+m.ex+'</div>';
  return card;
}
function pick(gid,i){
  if(done[gid])return;done[gid]=true;answered++;
  const m=Q[+gid.slice(1)],box=document.getElementById('o_'+gid),card=document.getElementById('c_'+gid);
  const ok=maps[gid][i]===m.correct;
  [...box.children].forEach((el,j)=>{el.disabled=true;
    if(maps[gid][j]===m.correct)el.classList.add('correct');
    else if(j===i)el.classList.add('wrong');else el.classList.add('dim')});
  if(m.grp){
    const b=document.getElementById(m.grp==='T'?'binT':'binD');
    const ph=b.querySelector('.ph');if(ph)ph.remove();
    const c=document.createElement('span');c.className='chip '+(ok?'ok':'no');c.textContent=m.bw;
    b.appendChild(c);
    const lbl=document.getElementById(m.grp==='T'?'cT':'cD');
    lbl.textContent=b.querySelectorAll('.chip').length;
  }
  document.getElementById('e_'+gid).classList.add('show');
  if(ok){score++;ding();confetti()}else{buzz();card.classList.add('shk');setTimeout(()=>card.classList.remove('shk'),450)}
  bump();
}

  else{emo='🌱';greet='CỐ LÊN NÀO, '+nm+'!';
    msg='Đừng buồn! Đọc lại bảng dấu hiệu /θ/ /ð/ và 4 quy tắc trọng âm rồi làm lại nhé! 📚';
