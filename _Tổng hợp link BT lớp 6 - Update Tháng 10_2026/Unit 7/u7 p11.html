<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Câu Mệnh Lệnh - Ms MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-pink: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-color: #f0f3f5;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E0F7FA;
            background-image: radial-gradient(#00C9A7 15%, transparent 16%), radial-gradient(#8854C0 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--primary-pink);
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-pink);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            margin: 5px 0 0;
            color: #666;
            font-size: 0.9rem;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 3px solid #eee;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .question-number {
            font-weight: 800;
            color: var(--primary-teal);
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: block;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #333;
            line-height: 1.4;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 0 #cccccc;
            text-align: left;
            position: relative;
        }

        .option-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #cccccc;
        }

        .option-btn:hover:not(.disabled) {
            transform: scale(1.02);
            border-color: var(--primary-pink);
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-green);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 5px 0 #008f47;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red);
            color: white;
            border-color: #e03e4d;
            box-shadow: 0 5px 0 #c23642;
            animation: shake 0.5s;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation-box {
            display: none;
            margin-top: 25px;
            background: #f8f9fa;
            border-left: 5px solid var(--primary-pink);
            padding: 20px;
            border-radius: 10px;
            animation: slideDown 0.4s ease-out;
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary-pink);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-content p {
            margin: 8px 0;
            line-height: 1.6;
        }

        .exp-content strong {
            color: #2c3e50;
        }

        .vocab-list {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ccc;
            margin-top: 10px;
        }
        
        .vocab-item {
            display: block;
            margin-bottom: 5px;
        }

        /* Submit Button */
        .submit-section {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .submit-btn {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #6c429c;
            transition: transform 0.1s;
            font-family: 'Nunito', sans-serif;
        }

        .submit-btn:active {
            transform: translateY(8px);
            box-shadow: none;
        }

        /* Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 5px solid var(--primary-teal);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .score-display {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-pink);
            margin: 20px 0;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bài Tập Câu Mệnh Lệnh (Imperatives)</h1>
        <p>Giáo viên tạo: <strong>Ms MS Chí Nên</strong> | Thạc sỹ Ngôn ngữ Anh</p>
    </header>

    <div class="container" id="quiz-container">
        </div>

    <div class="submit-section">
        <button class="submit-btn" onclick="finishQuiz()">NỘP BÀI <i class="fas fa-paper-plane"></i></button>
    </div>

    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary-teal);">KẾT QUẢ BÀI LÀM</h2>
            <div class="score-display" id="final-score">0/30</div>
            <p id="feedback-msg" style="font-size: 1.2rem; color: #555;"></p>
            <button class="submit-btn" onclick="location.reload()" style="font-size: 1rem; padding: 10px 30px; margin-top:20px;">Làm lại bài</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        // --- DATA SOURCE (30 CÂU HỎI VỀ CÂU MỆNH LỆNH) ---
        const rawQuestions = [
            {
                q: "______ quiet, please! The baby is sleeping.",
                options: ["A. Be", "B. Being", "C. To be", "D. Are"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. Be (v): Hãy (dạng nguyên thể)",
                        "B. Being (V-ing): Đang là",
                        "C. To be (to V): Để là",
                        "D. Are (V-chia): Thì/là/ở (chia theo ngôi)"
                    ],
                    trans: "Xin hãy giữ im lặng! Em bé đang ngủ.",
                    right: "Câu mệnh lệnh khẳng định bắt đầu bằng Động từ nguyên thể (V-infinitive). Với tính từ 'quiet', ta dùng động từ 'Be'.",
                    wrong: "B, C, D sai vì câu mệnh lệnh không bắt đầu bằng V-ing, To V, hay động từ đã chia thì."
                }
            },
            {
                q: "______ talk during the exam.",
                options: ["A. No", "B. Not", "C. Don't", "D. Doesn't"],
                correct: 2,
                exp: {
                    vocab: [
                        "A. No: Không (thường đi với danh từ)",
                        "B. Not: Không (phủ định)",
                        "C. Don't: Đừng/Không được (trợ động từ mệnh lệnh)",
                        "D. Doesn't: Không (dùng cho thì hiện tại đơn ngôi thứ 3)"
                    ],
                    trans: "Không được nói chuyện trong giờ kiểm tra.",
                    right: "Cấu trúc câu mệnh lệnh phủ định (Cấm đoán): Don't + V-nguyên thể.",
                    wrong: "A và B không dùng làm trợ động từ đầu câu mệnh lệnh. D sai vì câu mệnh lệnh luôn dùng 'Don't', không bao giờ dùng 'Doesn't' dù nói với ai."
                }
            },
            {
                q: "______ your books to page 45.",
                options: ["A. Opening", "B. Open", "C. Opens", "D. To open"],
                correct: 1,
                exp: {
                    vocab: [
                        "A. Opening (V-ing): Đang mở",
                        "B. Open (v): Mở ra",
                        "C. Opens (V-s): Mở (chia ngôi 3)",
                        "D. To open (to V): Để mở"
                    ],
                    trans: "Hãy mở sách của các em ra trang 45.",
                    right: "Câu mệnh lệnh yêu cầu hành động: Bắt đầu bằng Động từ nguyên thể (V-inf).",
                    wrong: "A, C, D sai ngữ pháp câu mệnh lệnh (không chia s/es, không dùng V-ing hay to-V)."
                }
            },
            {
                q: "______ on the grass! It is forbidden.",
                options: ["A. Not step", "B. Don't step", "C. No step", "D. Step not"],
                correct: 1,
                exp: {
                    vocab: [
                        "A. Not step: (Sai cấu trúc)",
                        "B. Don't step: Đừng giẫm lên",
                        "C. No step: (Sai ngữ pháp)",
                        "D. Step not: (Sai trật tự từ)"
                    ],
                    trans: "Đừng giẫm lên cỏ! Điều đó bị cấm.",
                    right: "Câu mệnh lệnh cấm đoán: Don't + V-inf. Động từ 'step' nghĩa là bước/giẫm.",
                    wrong: "A, C, D đều sai cấu trúc ngữ pháp cơ bản của câu mệnh lệnh phủ định."
                }
            },
            {
                q: "Please ______ me the salt.",
                options: ["A. pass", "B. to pass", "C. passing", "D. passes"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. pass (v): đưa/chuyền",
                        "B. to pass: để đưa",
                        "C. passing: đang đưa",
                        "D. passes: đưa (chia ngôi 3)"
                    ],
                    trans: "Làm ơn đưa cho tôi lọ muối.",
                    right: "Dù có từ 'Please' (làm ơn) ở đầu hay cuối câu, động từ chính vẫn phải ở dạng Nguyên thể (V-inf).",
                    wrong: "B, C, D sai vì động từ trong câu mệnh lệnh không được chia hay thêm đuôi."
                }
            },
            {
                q: "______ up! It's time to go.",
                options: ["A. Standing", "B. Stands", "C. Stand", "D. Stood"],
                correct: 2,
                exp: {
                    vocab: [
                        "A. Standing (V-ing)",
                        "B. Stands (V-s)",
                        "C. Stand (V-inf): Đứng",
                        "D. Stood (V-ed): Đã đứng"
                    ],
                    trans: "Đứng lên nào! Đã đến giờ đi rồi.",
                    right: "Cụm từ 'Stand up' (đứng lên). Câu mệnh lệnh bắt đầu bằng V-nguyên thể.",
                    wrong: "A, B, D sai dạng động từ."
                }
            },
            {
                q: "______ late for school again.",
                options: ["A. Don't be", "B. Not be", "C. Don't", "D. Aren't"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. Don't be: Đừng (thì/là/ở)",
                        "B. Not be: (Sai ngữ pháp)",
                        "C. Don't: Đừng (thiếu động từ chính)",
                        "D. Aren't: (Sai ngữ pháp câu mệnh lệnh)"
                    ],
                    trans: "Đừng đi học muộn lần nữa nhé.",
                    right: "'Late' là tính từ, nên cần động từ tobe đi kèm. Cấu trúc cấm đoán: Don't + V(nguyên thể). Nguyên thể của tobe là 'Be'. => Don't be.",
                    wrong: "B sai cấu trúc. C thiếu động từ 'be'. D dùng dạng chia 'Aren't' là sai trong câu cầu khiến."
                }
            },
            {
                q: "______ your homework before watching TV.",
                options: ["A. Doing", "B. Do", "C. Does", "D. Did"],
                correct: 1,
                exp: {
                    vocab: [
                        "A. Doing (V-ing)",
                        "B. Do (v): Làm",
                        "C. Does (V-es)",
                        "D. Did (V-ed)"
                    ],
                    trans: "Hãy làm bài tập về nhà trước khi xem TV.",
                    right: "Câu mệnh lệnh khẳng định bắt đầu bằng V-nguyên thể: 'Do'.",
                    wrong: "A, C, D là các dạng đã chia của động từ, không đứng đầu câu mệnh lệnh."
                }
            },
            {
                q: "______ careful! The floor is wet.",
                options: ["A. Be", "B. Do", "C. Have", "D. Make"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. Be (v): Hãy (tobe)",
                        "B. Do (v): Làm",
                        "C. Have (v): Có",
                        "D. Make (v): Tạo ra/làm"
                    ],
                    trans: "Hãy cẩn thận! Sàn nhà đang ướt.",
                    right: "'Careful' là tính từ, nên bắt buộc phải dùng động từ 'Be' đằng trước để tạo thành câu mệnh lệnh. Cụm: Be careful (Cẩn thận đấy).",
                    wrong: "B, C, D không đi trực tiếp với tính từ 'careful' trong ngữ cảnh này."
                }
            },
            {
                q: "______ touch that dog. It's dangerous.",
                options: ["A. Not", "B. Doesn't", "C. Don't", "D. No"],
                correct: 2,
                exp: {
                    vocab: [
                        "A. Not: Không",
                        "B. Doesn't: Không (ngôi 3)",
                        "C. Don't: Đừng",
                        "D. No: Không"
                    ],
                    trans: "Đừng chạm vào con chó đó. Nó nguy hiểm đấy.",
                    right: "Câu cấm đoán: Don't + V(nguyên thể).",
                    wrong: "Chỉ có 'Don't' là trợ động từ đúng cho câu mệnh lệnh phủ định."
                }
            },
            {
                q: "______ me use your pen, please.",
                options: ["A. Let", "B. Lets", "C. Letting", "D. To let"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. Let (v): Để/cho phép",
                        "B. Lets (V-s)",
                        "C. Letting (V-ing)",
                        "D. To let (to V)"
                    ],
                    trans: "Làm ơn cho tớ dùng bút của cậu nhé.",
                    right: "Cấu trúc 'Let + O + V': Để ai làm gì. Câu mệnh lệnh dùng 'Let' nguyên thể đầu câu.",
                    wrong: "B, C, D sai dạng động từ."
                }
            },
            {
                q: "______ right at the corner.",
                options: ["A. Turning", "B. Turns", "C. Turned", "D. Turn"],
                correct: 3,
                exp: {
                    vocab: [
                        "A. Turning (V-ing)",
                        "B. Turns (V-s)",
                        "C. Turned (V-ed)",
                        "D. Turn (v): Rẽ/quẹo"
                    ],
                    trans: "Hãy rẽ phải ở góc đường.",
                    right: "Câu chỉ dẫn đường đi là câu mệnh lệnh -> Dùng V nguyên thể 'Turn'.",
                    wrong: "A, B, C sai vì động từ bị chia đuôi."
                }
            },
            {
                q: "______ forget to lock the door.",
                options: ["A. Not", "B. Don't", "C. No", "D. Won't"],
                correct: 1,
                exp: {
                    vocab: [
                        "A. Not: Không",
                        "B. Don't: Đừng",
                        "C. No: Không",
                        "D. Won't: Sẽ không"
                    ],
                    trans: "Đừng quên khóa cửa nhé.",
                    right: "Cấu trúc nhắc nhở/cấm đoán: Don't + V.",
                    wrong: "D (Won't) dùng cho thì tương lai, không dùng cho câu mệnh lệnh trực tiếp."
                }
            },
            {
                q: "______ nice to your friends.",
                options: ["A. Be", "B. Do", "C. Make", "D. Play"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. Be (v): Hãy (tobe)",
                        "B. Do (v): Làm",
                        "C. Make (v): Làm",
                        "D. Play (v): Chơi"
                    ],
                    trans: "Hãy đối xử tốt với bạn bè của con.",
                    right: "'Nice' là tính từ -> Cần động từ 'Be' đứng trước. Cụm: Be nice to someone.",
                    wrong: "B, C, D là động từ thường, không đi trực tiếp với tính từ 'nice' để tạo nghĩa này."
                }
            },
            {
                q: "______ litter in the park.",
                options: ["A. Don't", "B. Not", "C. No", "D. Aren't"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. Don't: Đừng",
                        "B. Not: Không",
                        "C. No: Không",
                        "D. Aren't: Không phải"
                    ],
                    trans: "Đừng xả rác trong công viên.",
                    right: "Câu cấm đoán: Don't + V (litter - xả rác).",
                    wrong: "Litter ở đây là động từ (xả rác), nên phải dùng trợ động từ Don't."
                }
            },
            {
                q: "______ your coat on; it's cold outside.",
                options: ["A. Putting", "B. Put", "C. Puts", "D. To put"],
                correct: 1,
                exp: {
                    vocab: [
                        "A. Putting (V-ing)",
                        "B. Put (v): Mặc vào/đặt",
                        "C. Puts (V-s)",
                        "D. To put (to V)"
                    ],
                    trans: "Hãy mặc áo khoác vào; bên ngoài lạnh lắm.",
                    right: "Câu yêu cầu: V nguyên thể 'Put'. Cụm: Put on (mặc vào).",
                    wrong: "A, C, D sai dạng động từ."
                }
            },
            {
                q: "______ smoke here. This is a non-smoking area.",
                options: ["A. No", "B. Not", "C. Don't", "D. Doesn't"],
                correct: 2,
                exp: {
                    vocab: [
                        "A. No",
                        "B. Not",
                        "C. Don't: Đừng",
                        "D. Doesn't"
                    ],
                    trans: "Đừng hút thuốc ở đây. Đây là khu vực cấm hút thuốc.",
                    right: "Cấm đoán hành động: Don't + V (smoke).",

                    right: "Yêu cầu lịch sự: V nguyên thể + please.",
                    wrong: "Các đáp án còn lại sai dạng thức của động từ đầu câu mệnh lệnh."
                }
            },
            {
                q: "______ eat in the library.",
                options: ["A. Not", "B. Don't", "C. Isn't", "D. Aren't"],
                correct: 1,
                exp: {

                    trans: "Hãy đóng cửa sổ lại; trời đang mưa.",

            },
            {

                options: ["A. No", "B. Not", "C. Don't", "D. Doesn't"],
                correct: 2,
                exp: {
                    vocab: [
                        "A. No",
                        "B. Not",
                        "C. Don't",
                        "D. Doesn't"
                    ],
                    trans: "Đừng lắng nghe anh ta!",
                    right: "Câu mệnh lệnh phủ định: Don't + V (listen).",

                        "B. Don't: Đừng (thiếu V)",
                        "C. Not be: (Sai)",
                        "D. No be: (Sai)"
                    ],
                    trans: "Đừng ngốc nghếch thế! Hãy suy nghĩ kỹ đi.",
                    right: "'Silly' là tính từ. Cần động từ 'be'. Cấu trúc: Don't + be + adj.",
                    wrong: "B thiếu 'be'. C và D sai ngữ pháp."

            },
            {
                q: "______ faster! We are late.",
                options: ["A. Running", "B. Run", "C. To run", "D. Runs"],
                correct: 1,
                exp: {
                    vocab: [
                        "A. Running",
                        "B. Run (v): Chạy",

                    ],
                    trans: "Chạy nhanh lên! Chúng ta muộn rồi.",
                    right: "Thúc giục hành động: V nguyên thể 'Run'.",

                }
            },
            {
                q: "______ give up!",
                options: ["A. No", "B. Not", "C. Don't", "D. Won't"],
                correct: 2,
                exp: {
                    vocab: [
                        "A. No",
                        "B. Not",
                        "C. Don't",
                        "D. Won't"
                    ],
                    trans: "Đừng bỏ cuộc!",
                    right: "Lời khuyên/động viên (phủ định): Don't + Give up.",
                    wrong: "Cấu trúc chuẩn là Don't + V."
                }
            },
            {
                q: "______ a look at this picture.",
                options: ["A. Take", "B. Takes", "C. Taking", "D. Took"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. Take (v): Cầm/lấy",
                        "B. Takes (V-s)",
                        "C. Taking (V-ing)",
                        "D. Took (V-ed)"
                    ],
                    trans: "Hãy nhìn vào bức tranh này.",
                    right: "Collocation: Take a look (nhìn/xem qua). Dùng V nguyên thể đầu câu.",
                    wrong: "B, C, D sai dạng động từ."
                }
            },
            {
                q: "______ shy! Come and say hello.",
                options: ["A. Don't", "B. Not", "C. Don't be", "D. No"],
                correct: 2,
                exp: {
                    vocab: [
                        "A. Don't: (Thiếu be)",
                        "B. Not: (Sai)",
                        "C. Don't be: Đừng có...",
                        "D. No: (Sai)"
                    ],
                    trans: "Đừng ngại ngùng! Hãy lại đây và chào hỏi đi.",
                    right: "'Shy' là tính từ -> Cần 'Don't be'.",
                    wrong: "A thiếu động từ tobe đi kèm tính từ."
                }
            },
            {
                q: "______ your shoes before entering the house.",
                options: ["A. Remove", "B. Removing", "C. Removed", "D. Removes"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. Remove (v): Tháo/cởi bỏ",
                        "B. Removing (V-ing)",
                        "C. Removed (V-ed)",
                        "D. Removes (V-s)"
                    ],
                    trans: "Hãy tháo giày ra trước khi vào nhà.",
                    right: "Yêu cầu hành động: V nguyên thể 'Remove'.",
                    wrong: "B, C, D sai dạng động từ."
                }
            },
            {
                q: "______ cross the street when the light is red.",
                options: ["A. No", "B. Not", "C. Don't", "D. Aren't"],
                correct: 2,
                exp: {
                    vocab: [
                        "A. No",
                        "B. Not",
                        "C. Don't",
                        "D. Aren't"
                    ],
                    trans: "Đừng băng qua đường khi đèn đang đỏ.",
                    right: "Cấm đoán nguy hiểm: Don't + V (cross).",
                    wrong: "C là đáp án duy nhất đúng ngữ pháp câu mệnh lệnh phủ định."
                }
            },
            {
                q: "______ polite to the teacher.",
                options: ["A. Do", "B. Be", "C. Have", "D. Get"],
                correct: 1,
                exp: {
                    vocab: [
                        "A. Do",
                        "B. Be: Hãy (tobe)",
                        "C. Have",
                        "D. Get"
                    ],
                    trans: "Hãy lễ phép với giáo viên.",
                    right: "'Polite' là tính từ -> Dùng động từ 'Be' đầu câu.",
                    wrong: "A, C, D không đi trực tiếp với tính từ 'polite' để tạo nghĩa này."
                }
            },
            {
                q: "______ wait for me!",
                options: ["A. Please", "B. Do", "C. Be", "D. Can"],
                correct: 0,
                exp: {
                    vocab: [
                        "A. Please: Làm ơn",
                        "B. Do: (Nhấn mạnh)",
                        "C. Be: (Sai)",
                        "D. Can: (Sai)"
                    ],
                    trans: "Làm ơn hãy đợi mình với!",
                    right: "Câu này 'Wait' đã là động từ chính. Ta thêm 'Please' để tăng sự lịch sự/van nài.",
                    wrong: "C sai (không dùng Be wait). D sai (Can wait là câu hỏi hoặc khẳng định khả năng, không phải mệnh lệnh)."
                }
            }
        ];

        // --- AUDIO ENGINE (Web Audio API - No external files needed) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding sound (High pitch sine wave)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Buzz sound (Sawtooth wave, lower pitch)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // --- LOGIC ---
        
        // Shuffle function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const questions = shuffleArray([...rawQuestions]); // Shuffle questions
        let score = 0;
        let answeredCount = 0;

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questions.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-${index}`;

                // Question Text
                const qNum = document.createElement('span');
                qNum.className = 'question-number';
                qNum.innerText = `Question ${index + 1}`;
                
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = item.q;

                // Options
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options-grid';

                item.options.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(index, optIndex, btn);
                    optionsDiv.appendChild(btn);
                });

                // Explanation Box
                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp-${index}`;
                expBox.innerHTML = `
                    <div class="exp-header"><i class="fas fa-chalkboard-teacher"></i> Cô MS Chí Nên giải thích:</div>
                    <div class="exp-content">
                        <div class="vocab-list">
                            <strong>1. Phân tích từ vựng:</strong><br>
                            ${item.exp.vocab.map(v => `<span class="vocab-item">${v}</span>`).join('')}
                        </div>
                        <p><strong>2. Dịch nghĩa:</strong> "${item.exp.trans}"</p>
                        <p style="color: var(--correct-green);"><strong>3. Tại sao ĐÚNG?</strong> ${item.exp.right}</p>
                        <p style="color: var(--wrong-red);"><strong>4. Tại sao SAI?</strong> ${item.exp.wrong}</p>
                    </div>
                `;

                card.appendChild(qNum);
                card.appendChild(qText);
                card.appendChild(optionsDiv);
                card.appendChild(expBox);
                container.appendChild(card);
            });
        }

        function checkAnswer(qIndex, optIndex, btn) {
            const currentQ = questions[qIndex];
            const card = document.getElementById(`q-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            
            // Prevent multiple clicks
            if (card.getAttribute('data-answered') === 'true') return;
            card.setAttribute('data-answered', 'true');

            // Check correct
            if (optIndex === currentQ.correct) {
                btn.classList.add('correct');
                playSound('correct');
                fireConfetti();
                score++;
            } else {
                btn.classList.add('wrong');
                playSound('wrong');
                // Highlight correct answer
                buttons[currentQ.correct].classList.add('correct');
            }

            // Disable all buttons
            buttons.forEach(b => b.classList.add('disabled'));

            // Show explanation
            const expBox = document.getElementById(`exp-${qIndex}`);
            expBox.style.display = 'block';

            answeredCount++;
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const scoreText = document.getElementById('final-score');
            const msg = document.getElementById('feedback-msg');

            scoreText.innerText = `${score} / ${questions.length}`;
            
            const percentage = (score / questions.length) * 100;
            if (percentage === 100) {
                msg.innerText = "Xuất sắc! Con là thiên tài Tiếng Anh! 🌟🏆";
            } else if (percentage >= 80) {
                msg.innerText = "Giỏi lắm! Con nắm bài rất chắc! 🎉";
            } else if (percentage >= 50) {
                msg.innerText = "Cố gắng thêm chút nữa nhé! Con làm tốt rồi! 👍";
            } else {
                msg.innerText = "Đừng buồn nhé, xem kỹ lại lời giải thích của cô là giỏi ngay! 💪";
            }

            modal.style.display = 'flex';
            if (percentage >= 80) fireConfetti();
        }

        // --- CONFETTI LOGIC ---
        const canvas = document.getElementById("confetti-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#8854C0', '#00C9A7', '#FF4757', '#FFD700', '#00D26A'];

        function fireConfetti() {
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 2,
                    d: Math.random() * 5 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.05,
                    tiltAngle: 0
                });
            }
        }

        function drawConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                ctx.stroke();

                p.y += p.d;
                p.tiltAngle += p.tiltAngleIncremental;
                p.tilt = Math.sin(p.tiltAngle) * 15;

                if (p.y > canvas.height) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(drawConfetti);
        }

        drawConfetti();
        renderQuiz();

    </script>
