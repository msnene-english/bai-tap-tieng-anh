<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 SECOND TERM TEST 4 · P1 — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3E2C1E;--deep:#5A3D24;--coral:#A13D2B;--peach:#D9A566;--violet:#6B7A4F;
  --gold:#C08A34;--teal:#8C6239;--good:#4A7C3F;--bad:#A13D2B;--glass:rgba(250,240,222,.96)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:radial-gradient(circle at 12% 10%,rgba(255,255,255,.1) 0,transparent 40%),
   radial-gradient(circle at 88% 25%,rgba(0,0,0,.05) 0,transparent 35%),
   linear-gradient(180deg,#E4CC9E 0%,#CBA46D 30%,#A9804D 60%,#7A5A34 100%);
  background-size:100% 100%,100% 100%,100% 220%;background-attachment:fixed;
  animation:sky 32s ease-in-out infinite alternate}
@keyframes sky{from{background-position:0 0,0 0,50% 0%}to{background-position:0 0,0 0,50% 100%}}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(circle,rgba(90,61,36,.35) 1.6px,transparent 2px),
   radial-gradient(circle,rgba(90,61,36,.25) 1px,transparent 1.4px);
  background-size:28px 28px,18px 18px;background-position:5px 8px,14px 16px}
/* ── DẤU NIÊM PHONG SÁP (WAX SEAL) ── */
.stamp{position:fixed;top:16px;right:16px;width:78px;height:78px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#C4553B,var(--coral) 70%);z-index:6;pointer-events:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 -4px 6px rgba(0,0,0,.25);
  transform:rotate(-6deg);border:2px solid #8A2E1F}
.stamp span{font-size:11px;font-weight:800;color:#FCEBC8;font-family:'Fredoka',sans-serif;text-align:center;
  line-height:1.15;letter-spacing:.5px}
/* ── CUỘN DÂY THỪNG (TWINE SPOOL) ── */
.sun{position:fixed;left:50%;top:2vh;transform:translateX(-50%);width:180px;height:180px;border-radius:50%;
  z-index:0;pointer-events:none;opacity:.35;border:4px dashed rgba(90,61,36,.4);
  display:flex;align-items:center;justify-content:center;animation:spin 70s linear infinite}
.sun::before{content:'✂ ULIS PARCEL SERVICE ✂';font-family:'Fredoka',sans-serif;font-size:12px;font-weight:700;
  color:rgba(90,61,36,.55);letter-spacing:1.5px;text-align:center;width:72%}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
/* ── DÃY KIỆN HÀNG (SKYLINE) ── */
.city{position:fixed;left:0;right:0;bottom:0;height:20vh;min-height:110px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:8px;opacity:.5}
.bd{position:relative;flex:0 0 auto;border-radius:3px;box-shadow:0 3px 6px rgba(60,40,20,.3)}
.bd:nth-child(6n+1){background:linear-gradient(180deg,#E8D2A6,#C4A06C)}
.bd:nth-child(6n+2){background:linear-gradient(180deg,#D8B98A,#A9804D)}
.bd:nth-child(6n+3){background:linear-gradient(180deg,#EAD9B8,#BE9A64)}
.bd:nth-child(6n+4){background:linear-gradient(180deg,#CDBEA0,#977A54)}
.bd:nth-child(6n+5){background:linear-gradient(180deg,#E3C79A,#B08752)}
.bd:nth-child(6n){background:linear-gradient(180deg,#D6AE78,#96703E)}
.tr2{position:relative;flex:0 0 auto;align-self:flex-end;font-size:24px;line-height:1;
  animation:sway 3.6s ease-in-out infinite alternate;transform-origin:bottom center;opacity:.9}
.city2{position:fixed;left:0;right:0;bottom:0;height:13vh;min-height:74px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:8px;opacity:.28;filter:blur(.5px)}
.city2 .bd{background:#E9D9BB!important}
.city2 .tr2{font-size:17px;opacity:.7}
/* ── XE TẢI, BĂNG DÍNH & NHÃN ── */
.swf{position:fixed;bottom:2vh;z-index:0;pointer-events:none;font-size:22px;
  animation:swim linear infinite;filter:drop-shadow(0 2px 3px rgba(60,40,20,.3))}
@keyframes swim{0%{transform:translateX(-10vw) scaleX(1)}49%{transform:translateX(100vw) scaleX(1)}
  50%{transform:translateX(100vw) scaleX(-1)}99%{transform:translateX(-10vw) scaleX(-1)}
  100%{transform:translateX(-10vw) scaleX(1)}}
.fly{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;opacity:.9}
.fo{position:absolute;bottom:-90px;animation:up linear infinite}
.fo i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes up{0%{transform:translateY(0);opacity:0}9%{opacity:.95}86%{opacity:.75}
  100%{transform:translateY(-118vh);opacity:0}}
@keyframes sway{from{transform:translateX(-16px) rotate(-7deg)}to{transform:translateX(16px) rotate(7deg)}}
.bal{position:relative;width:var(--s);height:var(--s);border-radius:50%;
  background:color-mix(in srgb, var(--c1) 55%, white);border:1px solid rgba(60,40,20,.35);
  box-shadow:0 2px 4px rgba(60,40,20,.3);transform:rotate(-5deg)}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:20px 16px 30vh}
h1,h2,.pill,.qn,.sbtn,.ck{font-family:'Fredoka',sans-serif;font-weight:700}
.gl{background:var(--glass);border-radius:6px;box-shadow:0 12px 30px rgba(40,25,10,.35);
  border:2px dashed var(--teal);position:relative}
.hdr{padding:26px 22px 18px;text-align:center;margin:14px 0 20px}
.hdr::before{content:'📦';display:block;font-size:30px;margin-bottom:6px}
.hdr h1{font-size:clamp(17px,4vw,26px);line-height:1.25;color:var(--deep);font-family:'Fredoka',sans-serif}
.hdr .sub{display:inline-block;margin-top:9px;font-family:'Fredoka',sans-serif;font-size:.85rem;color:#fff;
  background:var(--coral);padding:5px 18px;border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.25);transform:rotate(-1deg)}
.hdr::after{content:'✂️ HANDLE WITH CARE — ULIS PARCEL SERVICE ✂️';display:block;margin-top:10px;
  font-family:'Fredoka',sans-serif;font-size:.68rem;letter-spacing:1px;color:var(--teal);font-weight:700}
.hdr p{font-size:.8rem;font-weight:700;color:var(--ink);margin-top:11px;line-height:1.75}
.sb{position:sticky;top:12px;z-index:9;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:18px;
  border-radius:6px;background:var(--glass);border:2px dashed var(--teal);
  box-shadow:0 6px 16px rgba(40,25,10,.3)}
.sb b{font-family:'Fredoka',sans-serif;font-size:1.14rem;color:var(--deep)}
.tr{flex:1;height:10px;background:rgba(140,98,57,.15);border-radius:4px;overflow:hidden}
.fl{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--coral) 0 7px,var(--gold) 7px 14px);transition:width .45s}
.sec{padding:20px 18px 18px;margin-bottom:38px;position:relative}
.sec::before{content:attr(data-tag);position:absolute;top:-13px;left:16px;font-family:'Fredoka',sans-serif;
  font-size:.7rem;font-weight:700;color:#FCEBC8;background:var(--teal);padding:3px 14px;border-radius:3px;
  box-shadow:0 2px 5px rgba(0,0,0,.3)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px;margin-top:8px}
.pill{color:#fff;border-radius:3px;padding:3px 15px;font-size:.9rem;box-shadow:0 3px 7px rgba(40,25,10,.3)}
.st h2{font-size:1.04rem;color:var(--deep);font-family:'Fredoka',sans-serif}
.si{font-size:.84rem;font-weight:700;color:var(--deep);font-style:italic;margin:2px 0 15px;line-height:1.8}
.q{background:var(--glass);border-radius:5px;padding:18px 18px 20px;margin-bottom:26px;position:relative;
  box-shadow:0 6px 16px rgba(40,25,10,.25);border:2px dashed rgba(140,98,57,.5)}
.q::before{content:'🏷️';position:absolute;top:-13px;left:16px;font-size:20px;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.q::after{content:'✂';position:absolute;bottom:-11px;right:16px;font-size:16px;color:var(--teal);
  background:var(--glass);padding:0 4px;border-radius:50%}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:var(--teal);color:#FCEBC8;border-radius:3px;min-width:32px;text-align:center;
  padding:1px 8px;margin-right:8px;font-size:.92rem}
.qt{font-weight:700;font-size:1.15rem;line-height:2.05}
.qt .bl{display:inline-block;min-width:100px;border-bottom:3px solid var(--deep);text-align:center;
  color:var(--ink);font-weight:900}
.src{background:rgba(140,98,57,.1);border-left:4px solid var(--violet);border-radius:0 5px 5px 0;padding:10px 13px;
  margin-top:9px;font-weight:800;font-size:1.05rem;line-height:1.9}
.cue{background:rgba(140,98,57,.1);border:2px dashed var(--peach);border-radius:5px;padding:10px 13px;margin-top:9px;
  font-weight:800;font-size:1.05rem;line-height:1.9;color:#7A5300}
.tg{display:inline-block;background:rgba(255,255,255,.75);border:1.5px solid var(--violet);color:var(--deep);
  border-radius:3px;padding:0 9px;font-size:.78rem;margin-left:6px;font-weight:800}
u{background:rgba(255,255,255,.7);border-radius:3px;padding:0 4px;text-decoration:none;font-weight:800}
.ob u,.og u,.qt u{background:rgba(255,255,255,.85);border-radius:2px;padding:0 1px;margin:0 -1px;font-weight:900;
  text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;text-decoration-color:var(--ink)}
/* ── TÌM & SỬA LỖI ── */
.segs{margin-top:13px;font-weight:700;font-size:1.08rem;line-height:2.6;
  background:rgba(140,98,57,.1);border-left:4px solid var(--violet);border-radius:0 5px 5px 0;padding:12px 15px}
.sg{display:inline-block;background:#FFFCF4;border:2px solid var(--violet);border-radius:4px;padding:2px 9px;
  margin:0 2px;font-weight:800;font-size:1.02rem;cursor:pointer;transition:.14s;color:var(--deep);
  box-shadow:0 2px 4px rgba(107,122,79,.25)}
.sg b{display:inline-block;background:var(--violet);color:#fff;border-radius:3px;padding:0 6px;margin-right:6px;
  font-size:.75rem;font-family:'Fredoka',sans-serif}
.sg:hover:not(.dn){transform:translateY(-2px);background:#F0EEE2}
.sg.sel{border-color:var(--gold);background:#FBEBC8;box-shadow:0 0 0 3px rgba(192,138,52,.4)}
.sg.dn{cursor:default;transform:none}
.sg.sgok{background:#DEEBD9;border-color:var(--good);color:#28461F}.sg.sgok b{background:var(--good)}
.sg.sgno{background:#F2DAD2;border-color:var(--bad);color:#6E2314}.sg.sgno b{background:var(--bad)}
.sg.sgdim{opacity:.4}
.fz{max-height:0;overflow:hidden;transition:max-height .32s ease;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fz.open{max-height:220px;margin-top:12px}
.fzl{font-weight:900;color:#7A5300;font-size:.95rem;width:100%}
.hint{margin-top:10px;background:rgba(140,98,57,.1);border:2px dashed var(--peach);border-radius:5px;padding:8px 12px;
  font-size:.91rem;font-weight:700;color:#7A5300;line-height:1.8}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:680px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.og{grid-template-columns:1fr}}
.ob{background:#FFFCF4;border:2px solid rgba(107,122,79,.4);border-radius:5px;padding:12px 14px;
  font-family:'Nunito';font-size:1.08rem;font-weight:800;cursor:pointer;transition:.15s;text-align:center;
  line-height:1.6;color:var(--ink);box-shadow:0 3px 7px rgba(107,122,79,.18)}
.ob:hover:not(.dn){transform:translateY(-2px) scale(1.02);background:#F0EEE2;border-color:var(--violet)}
.ob.ok{background:#DEEBD9;border-color:var(--good);color:#28461F}
.ob.no{background:#F2DAD2;border-color:var(--bad);color:#6E2314}
.ob.dim{opacity:.42}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ti{flex:1;min-width:200px;padding:10px 14px;border:2px solid rgba(107,122,79,.4);border-radius:5px;
  font-family:'Nunito';font-size:1rem;font-weight:800;outline:none;background:#FFFCF4;color:var(--ink)}
.ti::placeholder{color:#B3A088}
.ti:focus{border-color:var(--violet);background:#fff}
.ti.ok{border-color:var(--good);background:#DEEBD9}.ti.no{border-color:var(--bad);background:#F2DAD2}
.ck{background:var(--deep);color:#FCEBC8;border:none;border-radius:5px;
  padding:10px 20px;font-size:.97rem;cursor:pointer;box-shadow:0 4px 9px rgba(40,25,10,.4);white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.42;cursor:default}
.ex{display:none;margin-top:13px;background:rgba(255,255,255,.65);border:1.5px solid rgba(107,122,79,.3);
  border-radius:5px;padding:15px 16px;font-size:1rem;line-height:1.85}
.ex.show{display:block}
.kb{background:#DEEBD9;border:1.5px solid var(--good);border-radius:4px;padding:8px 12px;margin-bottom:10px;
  font-weight:900;color:#28461F;line-height:1.75}
.vnt{background:rgba(255,255,255,.6);border-left:4px solid var(--peach);border-radius:0 5px 5px 0;padding:9px 13px;
  margin-bottom:11px;font-weight:800;color:#7A5300;line-height:1.85}
.note{background:rgba(140,98,57,.1);border-left:4px solid var(--teal);border-radius:0 5px 5px 0;padding:9px 13px;
  margin-top:9px;font-size:.9rem;font-weight:700;color:var(--deep);line-height:1.75}
.ex ol{padding-left:20px}
.ex ol li{margin-bottom:12px;line-height:1.9}
.ex ol li:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#FFFCF4;border:1.5px solid #E9D9BB;border-radius:4px;padding:8px 11px;line-height:1.7;font-weight:700}
.p-word{color:#6B4423;font-weight:800}
.hl-green{color:var(--good);font-weight:900}
.hl-red{color:var(--bad);font-weight:900}
.wt{background:#EFE6D4;color:var(--teal);padding:1px 6px;border-radius:3px;font-size:.79em;font-weight:800;margin:0 4px}
.p-mean{color:#8A5A1E;font-weight:700}
.p-phonetic{color:var(--violet);background:rgba(107,122,79,.1);border-radius:3px;padding:1px 6px;
  font-family:'Courier New',monospace;font-size:.9em;font-weight:800}
.p-grammar{text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2.5px;
  text-underline-offset:3px;font-weight:700}
.sub{text-align:center;margin-top:24px}
.sbtn{background:var(--coral);color:#FCEBC8;border:none;border-radius:999px;padding:13px 40px;font-size:1.18rem;
  cursor:pointer;box-shadow:0 8px 20px rgba(161,61,43,.4)}
.sbtn:hover{transform:translateY(-3px)}
.ov{position:fixed;inset:0;background:rgba(40,25,10,.72);z-index:99;display:none;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.mb{background:var(--glass);border-radius:6px;box-shadow:0 14px 40px rgba(40,25,10,.4);padding:24px;
  width:420px;max-width:96%;text-align:center;border:2px dashed var(--teal);max-height:90vh;overflow-y:auto}
.mb h2{font-size:1.3rem;color:var(--deep);margin-bottom:11px}
.mb input{width:100%;padding:11px;border:2px solid rgba(107,122,79,.4);border-radius:5px;font-family:'Nunito';
  font-weight:800;font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#F2DAD2;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Fredoka',sans-serif;font-size:1.2rem;color:var(--deep);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Fredoka',sans-serif;font-size:2.5rem;color:var(--coral)}
.mb .rt{font-weight:900;color:var(--violet);font-size:1.05rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.92rem;line-height:1.65;margin-bottom:10px;color:#5A4A38}
.mb img{width:100%;max-width:250px;border-radius:5px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:1px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="stamp"><span>ULIS<br>SEAL</span></div>
<div class="sun"></div>
<div class="city2" id="city2"></div>
<div class="city" id="city"></div>
<div class="fly" id="fly"></div>
<div class="wrap">
  <div class="hdr gl">
    <h1>THE SECOND TERM TESTS</h1>
    <div class="sub">TEST 4 · PART 1 · KRAFT PARCEL EDITION</div>
    <p>🎓 Giáo viên tạo: Ms. Chí Nên<br>
    28 câu &nbsp;·&nbsp; <i>(bỏ phần VII — đoạn văn điền từ &amp; VIII — bài đọc hiểu theo yêu cầu)</i></p>
  </div>
  <div class="sb">📦 <b><span id="sc">0</span>/<span id="tt">0</span></b>
    <div class="tr"><div class="fl" id="fb"></div></div><span id="md">💪</span></div>
  <div id="app"></div>
  <div class="sub"><button class="sbtn" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
</div>
<div class="ov" id="nOv"><div class="mb"><h2>✍️ Nhập tên của con</h2>
  <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="em" id="nEr">⚠️ Con chưa nhập tên kìa!</div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="showResult()">🚀 Xem kết quả</button></div></div>
<div class="ov" id="rOv"><div class="mb"><div class="gr" id="rG"></div>
  <div class="rs" id="rS"></div><div class="rt" id="rT"></div><img id="rI" alt=""><div class="rm" id="rM"></div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="location.reload()">🔄 Làm lại</button></div></div>

<script>
/* ══ KIỆN HÀNG + XE TẢI + NHÃN BAY ══ */
(function(){
 function line(el,n,minH,maxH,minW,maxW,treeSize){
  for(let i=0;i<n;i++){
   if(i%5===4){const t=document.createElement('div');t.className='tr2';
    t.textContent=['📦','🏷️'][i%2];t.style.fontSize=treeSize+'px';
    t.style.animationDelay=(-Math.random()*3).toFixed(1)+'s';el.appendChild(t);continue}
   const b=document.createElement('div');b.className='bd';
   b.style.width=(minW+Math.random()*(maxW-minW)).toFixed(0)+'px';
   b.style.height=(minH+Math.random()*(maxH-minH)).toFixed(0)+'px';
   b.style.transform='rotate('+(Math.random()*4-2).toFixed(1)+'deg)';
   el.appendChild(b);
  }
 }
 line(document.getElementById('city2'),18,22,54,20,42,15);
 line(document.getElementById('city'),15,32,110,24,50,22);
 for(let i=0;i<4;i++){
  const s=document.createElement('div');s.className='swf';
  s.textContent=['🚚','✂️','🏷️','📦'][i%4];
  s.style.bottom=(4+Math.random()*20)+'vh';
  s.style.animationDuration=(24+Math.random()*20).toFixed(1)+'s';
  s.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  document.body.appendChild(s);
 }
 const L=document.getElementById('fly');
 const C=[['#A13D2B','#D9A566'],['#6B7A4F','#8C6239'],['#C08A34','#D9A566'],
          ['#8C6239','#6B7A4F'],['#A13D2B','#6B7A4F']];
 for(let i=0;i<20;i++){
  const d=document.createElement('div');d.className='fo';
  const inner=document.createElement('i');
  if(i%6===5){inner.textContent=['🧵','📎'][i%2];
   inner.style.fontSize=(14+Math.random()*12).toFixed(0)+'px';}
  else if(i%9===4){inner.textContent=['✨','🏷️','⭐'][i%3];inner.style.fontSize=(15+Math.random()*10).toFixed(0)+'px';}
  else{const b=document.createElement('div');b.className='bal';

function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}

 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="qt">'+h+'Tìm chữ cái chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="segs" id="sg_'+gid+'">'+(m.pre||'')+
   m.parts.map(p=>'<span class="sg" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     '<b>'+p[0]+'</b>'+p[1]+'</span>'+(p[2]||'')).join('')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào chữ cái con cho là SAI.</div>'+
   '<div class="fz" id="fz_'+gid+'"><span class="fzl" id="fl_'+gid+'"></span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  c.querySelector('#b_'+gid).onclick=()=>chkf(gid);
  c.querySelector('#i_'+gid).addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Đã chọn chữ <b>'+L+'</b>. <b>Bước 2:</b> gõ phần đã sửa rồi '+
  'bấm <b>KIỂM TRA</b>. (Bấm chữ khác nếu muốn đổi.)';
 document.getElementById('fz_'+gid).classList.add('open');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa chữ <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),
       inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),460);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter,okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>{
  s.classList.remove('sel');s.classList.add('dn');
  if(s.dataset.l===m.letter)s.classList.add('sgok');
  else if(s.dataset.l===sel[gid])s.classList.add('sgno');
  else s.classList.add('sgdim');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
  ? '🎉 <b>Tuyệt vời!</b> Đúng chữ <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
  : (okL?'⚠️ Đúng chữ <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
       :(okW?'⚠️ Sửa đúng từ nhưng chọn SAI chữ. Lỗi nằm ở chữ <b>'+m.letter+'</b>.'
            :'❌ Lỗi nằm ở chữ <b>'+m.letter+'</b>, phải sửa thành <b>'+m.corr+'</b>.'));
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 THIÊN TÀI, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu – dán ngay con tem vàng lên '+
  'kiện hàng danh dự nhé! ⭐';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ xem lại collocation "go green" và '+
  'câu điều kiện loại 1 nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại lời giải từng câu rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
