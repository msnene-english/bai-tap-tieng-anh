<head>

<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0D0722;--bg2:#1A0D38;--bg3:#0D1A2E;--blossom:#FFB7C5;--moon:#FFF5D6;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;background:var(--bg1)}
.sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(80,30,120,.55) 0%,transparent 60%),
  radial-gradient(ellipse 60% 50% at 80% 10%,rgba(20,40,100,.5) 0%,transparent 60%),
  radial-gradient(ellipse 100% 60% at 50% 100%,rgba(40,10,80,.4) 0%,transparent 60%),

.moon{position:fixed;top:6%;right:8%;width:76px;height:76px;border-radius:50%;z-index:1;pointer-events:none;

@keyframes moonGlow{0%{box-shadow:0 0 40px rgba(255,215,0,.35),0 0 80px rgba(255,215,0,.12)}100%{box-shadow:0 0 60px rgba(255,215,0,.5),0 0 120px rgba(255,215,0,.2)}}
#star-canvas{position:fixed;inset:0;z-index:1;pointer-events:none}
#petal-canvas{position:fixed;inset:0;z-index:2;pointer-events:none}
.lantern{position:fixed;z-index:2;pointer-events:none;width:20px;height:28px;border-radius:40% 40% 35% 35%;

.st{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px;margin-top:8px}

u{background:rgba(26,255,213,.12);border-radius:3px;padding:0 4px;text-decoration:none;font-weight:800;color:var(--teal)}

.chip{display:inline-block;background:rgba(40,10,80,.7);border:2px solid rgba(199,125,255,.3);border-radius:12px;

.chip:hover{transform:translateY(-2px);border-color:var(--purple);background:rgba(199,125,255,.22)}
.chip.ans{background:rgba(255,215,0,.16);border-color:var(--gold)}
.ex{display:none;margin-top:13px;background:rgba(8,3,25,.9);border:1px solid rgba(255,183,197,.12);border-radius:16px;

.ex.show{display:block}
.kb{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);border-radius:12px;padding:8px 12px;

.vnt{background:rgba(255,215,0,.08);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:8px 13px;

.note{background:rgba(26,255,213,.06);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;padding:9px 13px;
  margin-top:9px;font-size:.9rem;font-weight:700;color:#8FF5E4;line-height:1.75}
.ex ol{padding-left:20px}
.ex ol li{margin-bottom:12px;line-height:1.9}
.ex ol li:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:rgba(0,0,0,.32);border:1px solid rgba(199,125,255,.14);border-radius:9px;padding:7px 10px;
  line-height:1.7;font-weight:700;font-size:.92rem}
.p-word{color:#7DD3FC;font-weight:800}
.hl-green{color:#4ADE80;font-weight:900}
.hl-red{color:#F87171;font-weight:800}
.wt{background:rgba(26,255,213,.1);color:#5EEAD4;padding:1px 6px;border-radius:5px;font-size:.76em;font-weight:700;margin:0 4px}
.p-mean{color:#FCD34D;font-weight:700}
.p-phonetic{color:var(--purple);background:rgba(199,125,255,.1);border-radius:5px;padding:1px 6px;
  font-family:'Courier New',monospace;font-size:.88em;font-weight:800}
.p-grammar{font-weight:700;color:#DCC9F0}
.sub{text-align:center;margin-top:24px}
.sbtn{background:linear-gradient(135deg,var(--rose),var(--purple),var(--teal));color:#fff;border:none;
  border-radius:50px;padding:15px 42px;font-size:1.02rem;cursor:pointer;box-shadow:0 8px 32px rgba(199,125,255,.35);
  font-weight:700;font-family:'Comfortaa';letter-spacing:1px}
.sbtn:hover{transform:translateY(-4px) scale(1.03)}
.ov{position:fixed;inset:0;background:rgba(10,0,30,.85);z-index:99;display:none;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(10px)}
.ov.on{display:flex}
.mb{background:linear-gradient(135deg,rgba(20,5,50,.98),rgba(10,3,30,.98));border:1px solid rgba(255,183,197,.2);
  border-radius:26px;padding:30px 26px;width:440px;max-width:96%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7);

.mb h2{font-size:1.18rem;font-family:'Comfortaa';color:var(--blossom);margin-bottom:11px}
.mb input{width:100%;padding:11px;border-radius:13px;border:2px solid rgba(255,183,197,.25);background:rgba(30,10,60,.7);

.mb input.er{border-color:var(--bad);animation:shk .42s}

.mb .gr{font-family:'Comfortaa';font-size:1.1rem;color:var(--blossom);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Comfortaa';font-size:2.6rem;font-weight:900;color:var(--purple)}

.mb img{width:100%;max-width:250px;border-radius:16px;margin:10px auto;display:block;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:1px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="sky"></div><div class="moon"></div>
<canvas id="star-canvas"></canvas>
<canvas id="petal-canvas"></canvas>
<div class="wrap">
  <div class="hdr gl">
    <div style="font-size:28px">🌌</div>
    <h1>THE SECOND TERM TESTS<br>TEST 6 · PART 1 · GALAXY NIGHT EDITION</h1>
    <div class="sub">🌸 GIÁO VIÊN TẠO: MS MS Chí Nên</div>
    <p>30 câu &nbsp;·&nbsp; <i>(bỏ phần VIII — đoạn văn điền từ &amp; IX — bài đọc hiểu theo yêu cầu)</i></p>
  </div>

  <button class="sbtn" style="width:100%;font-size:1rem;padding:10px" onclick="location.reload()">🔄 Làm lại từ đầu</button></div></div>

<script>
/* ══ ĐÈN LỒNG ══ */
[{top:'12%',left:'3%',color:'#FF6B9D',dur:3.2},{top:'22%',right:'4%',color:'#FFD700',dur:4.1},
 {top:'35%',left:'1.5%',color:'#C77DFF',dur:3.7},{top:'55%',right:'2%',color:'#1AFFD5',dur:5},
 {top:'70%',left:'2.5%',color:'#FF8FAD',dur:4.5}].forEach(d=>{
  const el=document.createElement('div');el.className='lantern';
  el.style.cssText='top:'+d.top+';'+(d.left?'left:'+d.left:'')+';'+(d.right?'right:'+d.right:'')+
    ';color:'+d.color+';background:'+d.color+'22;animation-duration:'+d.dur+'s;';
  document.body.appendChild(el)});
/* ══ SAO & CÁNH HOA ══ */
(function(){
  const sc=document.getElementById('star-canvas'),sx=sc.getContext('2d');
  const pc=document.getElementById('petal-canvas'),px=pc.getContext('2d');
  let W,H;function rs(){W=sc.width=pc.width=innerWidth;H=sc.height=pc.height=innerHeight}
  addEventListener('resize',rs);rs();
  const stars=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,ph:Math.random()*6.3,sp:Math.random()*.024+.006}));
  const pet=Array.from({length:22},()=>({x:Math.random()*innerWidth,y:Math.random()*-innerHeight,
    s:Math.random()*7+5,sp:Math.random()*.9+.35,dx:Math.random()*.7-.35,r:Math.random()*6.3,dr:(Math.random()-.5)*.04}));
  (function loop(){
    sx.clearRect(0,0,W,H);
    stars.forEach(s=>{s.ph+=s.sp;sx.fillStyle='rgba(255,245,214,'+(.25+.75*Math.abs(Math.sin(s.ph)))+')';
      sx.beginPath();sx.arc(s.x*W,s.y*H,s.r,0,6.3);sx.fill()});
    px.clearRect(0,0,W,H);
    pet.forEach(p=>{p.y+=p.sp;p.x+=p.dx;p.r+=p.dr;
      if(p.y>H+20){p.y=-20;p.x=Math.random()*W}
      px.save();px.translate(p.x,p.y);px.rotate(p.r);px.fillStyle='rgba(255,183,197,.55)';
      px.beginPath();px.ellipse(0,0,p.s,p.s*.6,0,0,6.3);px.fill();px.restore()});
    requestAnimationFrame(loop)})();
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#FFB7C5','#C77DFF','#1AFFD5','#FFD700','#FF6B9D','#4ADE80'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}

function renderArr(gid){
 const st=arrSt[gid],m=Q[+gid.slice(1)];
 const ans=document.getElementById('ans_'+gid),pool=document.getElementById('pool_'+gid);
 ans.innerHTML = st.order.length ? st.order.map(i=>'<span class="chip ans" onclick="unpickArr(\''+gid+'\','+i+')">'+m.chunks[i]+'</span>').join(' ')
  : '<span class="arrph">👆 Bấm vào các mảnh ghép bên dưới theo đúng thứ tự để ghép câu...</span>';
 pool.innerHTML = st.shuffled.filter(i=>st.order.indexOf(i)<0).map(i=>'<span class="chip" onclick="pickArr(\''+gid+'\','+i+')">'+m.chunks[i]+'</span>').join('');
}
function pickArr(gid,i){if(done[gid])return;arrSt[gid].order.push(i);renderArr(gid)}
function unpickArr(gid,i){if(done[gid])return;const st=arrSt[gid];const idx=st.order.indexOf(i);if(idx>-1)st.order.splice(idx,1);renderArr(gid)}
function chkArr(gid){
 if(done[gid])return;
 const st=arrSt[gid],m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid);
 if(st.order.length!==m.chunks.length){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 done[gid]=true;answered++;
 const ok=st.order.every((v,i)=>v===i);
 document.getElementById('ans_'+gid).classList.add(ok?'ok':'no');
 document.querySelectorAll('#pool_'+gid+' .chip').forEach(ch=>ch.style.pointerEvents='none');
 document.querySelectorAll('#ans_'+gid+' .chip').forEach(ch=>ch.onclick=null);
 document.getElementById('b_'+gid).disabled=true;document.getElementById('rb_'+gid).disabled=true;
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="qt">'+h+'Tìm chữ cái chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="segs" id="sg_'+gid+'">'+(m.pre||'')+
   m.parts.map(p=>'<span class="sg" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     '<b>'+p[0]+'</b>'+p[1]+'</span>'+(p[2]||'')).join('')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào chữ cái con cho là SAI.</div>'+
   '<div class="fz" id="fz_'+gid+'"><span class="fzl" id="fl_'+gid+'"></span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  c.querySelector('#b_'+gid).onclick=()=>chkf(gid);
  c.querySelector('#i_'+gid).addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else if(m.t==='arr'){
  arrSt[gid]={shuffled:shuffle(m.chunks.map((_,i)=>i)),order:[]};
  c.innerHTML='<div class="qt">'+h+m.instr+'</div>'+
   '<div class="arrans" id="ans_'+gid+'"></div><div class="arrpool" id="pool_'+gid+'"></div>'+
   '<div class="fr"><button class="ck" id="rb_'+gid+'" type="button" style="background:rgba(255,255,255,.1);color:#E8D5F5">↺ LÀM LẠI</button>'+
   '<button class="ck" id="b_'+gid+'" type="button">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  c.querySelector('#b_'+gid).onclick=()=>chkArr(gid);
  c.querySelector('#rb_'+gid).onclick=()=>{if(done[gid])return;arrSt[gid]={shuffled:arrSt[gid].shuffled,order:[]};renderArr(gid)};
  setTimeout(()=>renderArr(gid),0);
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Đã chọn chữ <b>'+L+'</b>. <b>Bước 2:</b> gõ phần đã sửa rồi '+
  'bấm <b>KIỂM TRA</b>. (Bấm chữ khác nếu muốn đổi.)';
 document.getElementById('fz_'+gid).classList.add('open');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa chữ <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),
       inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),460);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter,okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>{
  s.classList.remove('sel');s.classList.add('dn');
  if(s.dataset.l===m.letter)s.classList.add('sgok');
  else if(s.dataset.l===sel[gid])s.classList.add('sgno');
  else s.classList.add('sgdim');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
  ? '🎉 <b>Tuyệt vời!</b> Đúng chữ <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
  : (okL?'⚠️ Đúng chữ <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
       :(okW?'⚠️ Sửa đúng từ nhưng chọn SAI chữ. Lỗi nằm ở chữ <b>'+m.letter+'</b>.'
            :'❌ Lỗi nằm ở chữ <b>'+m.letter+'</b>, phải sửa thành <b>'+m.corr+'</b>.'));
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 THIÊN TÀI, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu – tỏa sáng như dải Ngân '+
  'Hà vậy! ⭐';gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ xem lại giới từ chỉ vị trí và '+
  'so sánh nhất nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại lời giải từng câu rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
