<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms MS Chí Nên - English Review Part 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #8854C0; /* Tím Pastel */
            --secondary: #00C9A7; /* Xanh ngọc */
            --accent: #FF9F43; /* Cam */
            --success: #00D26A; /* Xanh lá */
            --error: #FF4757; /* Đỏ cam */
            --bg-pattern: #f0f2f5;
            --text-dark: #2f3542;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Ngăn bôi đen text để trải nghiệm giống App */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E6E6FA;
            background-image: radial-gradient(#8854C0 1px, transparent 1px), radial-gradient(#8854C0 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 80px; /* Space for footer */
        }

        /* Header Styling */
        header {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.3);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            margin: 5px 0 0;
            opacity: 0.9;
            font-size: 1rem;
        }

        .badge-teacher {
            background: #FF9F43;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 4px 0 #E17055;
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Question Card */
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05), 0 20px 20px rgba(0,0,0,0.05);
            border: 2px solid rgba(136, 84, 192, 0.1);
            position: relative;
            transition: transform 0.3s;
        }

        .question-number {
            background: var(--secondary);
            color: white;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 #00997e;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #d1d1d1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 0 0 #d1d1d1;
        }

        /* Correct/Incorrect States */
        .option-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
            box-shadow: 0 5px 0 #00b85c;
        }

        .option-btn.wrong {
            background: var(--error);
            color: white;
            border-color: var(--error);
            box-shadow: 0 5px 0 #d63031;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }
        
        /* Force full opacity for correct answer when user is wrong */
        .option-btn.correct:disabled {
            opacity: 1 !important;
        }

        /* Icon indicators */
        .option-icon {
            margin-right: 15px;
            width: 24px;
            text-align: center;
        }

        /* Explanation Box */
        .explanation-box {
            background: #f8f9fa;
            border-left: 5px solid var(--primary);
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }
        
        .explanation-header {
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-step {
            margin-bottom: 12px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .exp-step b {
            color: #57606f;
            display: block;
            margin-bottom: 4px;
        }

        /* Hint Button */
        .hint-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .hint-content {
            display: none;
            margin-top: 5px;
            font-style: italic;
            color: #747d8c;
            font-size: 0.9rem;
        }

        /* Footer / Submit */
        .quiz-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-display {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .submit-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #00997e;
            transition: transform 0.2s;
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #00997e;
        }

        /* Summary Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 4px solid var(--primary);
        }

        .result-emoji {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal h2 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--secondary);
            margin: 20px 0;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Highlighting Phonetics/Errors */
        .highlight-text u {
            text-decoration: none;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 2px;
        }
        
        .highlight-text strong {
            color: var(--primary);
        }

    </style>
</head>
<body>

    <header>
        <span class="badge-teacher"><i class="fas fa-chalkboard-teacher"></i> Ms MS Chí Nên</span>
        <h1>PART 3: ERROR IDENTIFICATION & SENTENCE BUILDING</h1>
        <p>Làm bài cẩn thận và xem giải thích chi tiết em nhé!</p>
    </header>

    <div class="container" id="quiz-container">
        <!-- Questions will be injected here by JavaScript -->
    </div>

    <div class="quiz-footer">
        <div class="score-display">
            Điểm: <span id="current-score">0</span> / <span id="total-questions">0</span>
        </div>
        <button class="submit-btn" onclick="finishQuiz()">
            <i class="fas fa-flag-checkered"></i> Nộp bài
        </button>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <span class="result-emoji" id="result-emoji">🏆</span>
            <h2 id="result-title">Tuyệt vời!</h2>
            <p>Em đã hoàn thành bài kiểm tra.</p>
            <div class="final-score" id="final-score">0/0</div>
            <p id="result-message">Cố gắng phát huy nhé!</p>
            <button class="submit-btn" onclick="location.reload()">Làm lại bài</button>
        </div>
    </div>

    <!-- Audio Elements -->
    <!-- Sử dụng Audio nguồn mở hoặc base64 ngắn để đảm bảo chạy trên mọi trình duyệt -->
    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<script>
    // Dữ liệu bài thi (Data extracted and formatted)
    const quizData = [
        {
            id: 51,
            question: "Find the error: 'My sister’s pictures are exciting but she’s school marks are quite bad.'",
            options: [
                { text: "A. she’s -> her", correct: true },
                { text: "B. pictures -> picture", correct: false },
                { text: "C. exciting -> excited", correct: false },
                { text: "D. quite -> quiet", correct: false }
            ],
            hint: "Chú ý từ đứng trước 'school marks'. Điểm số 'của cô ấy' hay 'cô ấy là'?",
            explanation: `
                <div class="exp-step"><b>Bước 1: Phân tích lỗi sai</b>
                - <i>she’s</i> (viết tắt của 'she is' hoặc 'she has'): cô ấy là/có.<br>
                - <i>her</i> (tính từ sở hữu): của cô ấy.</div>
                <div class="exp-step"><b>Bước 2: Dịch nghĩa</b>
                "Những bức tranh của chị tôi rất thú vị nhưng điểm số ở trường của chị ấy lại khá tệ."</div>
                <div class="exp-step"><b>Bước 3: Tại sao chọn đáp án này? (ĐÚNG)</b>
                Trước danh từ "school marks" (điểm số), ta cần một Tính từ sở hữu để chỉ sự sở hữu. "She's" là sai ngữ pháp. Phải sửa thành "her".</div>
                <div class="exp-step"><b>Bước 4: Tại sao đáp án khác sai?</b>
                - Pictures (số nhiều) đúng với 'are'.<br>
                - Exciting (gây hứng thú) dùng cho vật là đúng.<br>
                - Quite (khá là) bổ nghĩa cho bad là đúng.</div>
            `
        },
        {
            id: 52,
            question: "Find the error: 'Tom forgot his homework, but his brother didn’t forget him.'",
            options: [
                { text: "A. him -> his", correct: true },
                { text: "B. forgot -> forget", correct: false },
                { text: "C. didn’t -> don't", correct: false },
                { text: "D. his -> he", correct: false }
            ],
            hint: "Anh trai không quên 'bài tập' chứ không phải không quên 'Tom'.",
            explanation: `
                <div class="exp-step"><b>Bước 1: Phân tích lỗi sai</b>
                - <i>him</i> (tân ngữ): anh ấy.<br>
                - <i>his</i> (đại từ sở hữu): cái của anh ấy (thay cho 'his homework').</div>
                <div class="exp-step"><b>Bước 2: Dịch nghĩa</b>
                "Tom quên bài tập về nhà, nhưng anh trai cậu ấy thì không quên (bài tập của mình)."</div>
                <div class="exp-step"><b>Bước 3: Tại sao chọn đáp án này? (ĐÚNG)</b>
                Trong ngữ cảnh so sánh về việc quên bài tập (homework), ta cần một đại từ sở hữu để thay thế cho cụm "his homework". Dùng "him" người nghe sẽ hiểu là "không quên Tom" (sai ý nghĩa ngữ cảnh).</div>
                <div class="exp-step"><b>Bước 4: Tại sao đáp án khác sai?</b>
                Các động từ 'forgot' và 'didn't' đều chia đúng thì quá khứ. Cụm 'his brother' đúng ngữ pháp.</div>
            `
        },
        {
            id: 53,
            question: "Find the error: 'In mine free time I play the piano with my mother.'",
            options: [
                { text: "A. mine -> my", correct: true },
                { text: "B. play -> playing", correct: false },
                { text: "C. with -> to", correct: false },
                { text: "D. mother -> mom", correct: false }
            ],
            hint: "Từ nào đứng trước danh từ 'free time' để chỉ sở hữu?",
            explanation: `
                <div class="exp-step"><b>Bước 1: Phân tích lỗi sai</b>
                - <i>mine</i> (đại từ sở hữu): cái của tôi (đứng một mình).<br>
                - <i>my</i> (tính từ sở hữu): của tôi (đứng trước danh từ).</div>
                <div class="exp-step"><b>Bước 2: Dịch nghĩa</b>
                "Vào thời gian rảnh của tôi, tôi chơi đàn piano với mẹ."</div>
                <div class="exp-step"><b>Bước 3: Tại sao chọn đáp án này? (ĐÚNG)</b>
                Trước danh từ "free time", bắt buộc phải dùng Tính từ sở hữu "my". "Mine" không bao giờ đứng trước danh từ.</div>
                <div class="exp-step"><b>Bước 4: Tại sao đáp án khác sai?</b>
                'Play' chia hiện tại đơn đúng. 'Play with' (chơi cùng) đúng. 'Mother' là danh từ đúng.</div>
            `
        },
        {
            id: 54,
            question: "Find the error: 'They have got a little dog but I don’t know it’s name.'",
            options: [
                { text: "A. it’s -> its", correct: true },
                { text: "B. have got -> has got", correct: false },
                { text: "C. little -> small", correct: false },
                { text: "D. don’t -> didn't", correct: false }
            ],
            hint: "Phân biệt giữa 'it's' (viết tắt) và 'its' (sở hữu).",
            explanation: `
                <div class="exp-step"><b>Bước 1: Phân tích lỗi sai</b>
                - <i>it’s</i> (viết tắt): nó là (it is) hoặc nó có (it has).<br>
                - <i>its</i> (tính từ sở hữu): của nó.</div>
                <div class="exp-step"><b>Bước 2: Dịch nghĩa</b>
                "Họ có một chú chó nhỏ nhưng tôi không biết tên của nó."</div>
                <div class="exp-step"><b>Bước 3: Tại sao chọn đáp án này? (ĐÚNG)</b>
                Ta cần tính từ sở hữu để bổ nghĩa cho danh từ "name" (tên của nó). Viết có dấu phẩy "it's" là sai ngữ pháp.</div>
                <div class="exp-step"><b>Bước 4: Tại sao đáp án khác sai?</b>
                'They have got' đúng chủ ngữ số nhiều. 'Little dog' dùng từ đúng. 'Don't know' phù hợp thì hiện tại.</div>
            `
        },
        {
            id: 55,
            question: "Find the error: 'If you lend me your novel. I will lend you my.'",
            options: [
                { text: "A. my -> mine", correct: true },
                { text: "B. lend -> borrow", correct: false },
                { text: "C. will -> would", correct: false },
                { text: "D. your -> yours", correct: false }
            ],
            hint: "Từ đứng cuối câu thay thế cho 'my novel'.",
            explanation: `
                <div class="exp-step"><b>Bước 1: Phân tích lỗi sai</b>
                - <i>my</i> (tính từ sở hữu): cần danh từ theo sau.<br>
                - <i>mine</i> (đại từ sở hữu): đứng một mình.</div>
                <div class="exp-step"><b>Bước 2: Dịch nghĩa</b>
                "Nếu bạn cho tôi mượn tiểu thuyết của bạn, tôi sẽ cho bạn mượn cuốn của tôi."</div>
                <div class="exp-step"><b>Bước 3: Tại sao chọn đáp án này? (ĐÚNG)</b>
                Từ "my" đứng cuối câu và không có danh từ nào theo sau là sai. Cần dùng Đại từ sở hữu "mine" để thay thế cho "my novel".</div>
                <div class="exp-step"><b>Bước 4: Tại sao đáp án khác sai?</b>
                'Lend' (cho mượn) dùng đúng nghĩa. Câu điều kiện loại 1 dùng 'will' đúng. 'Your novel' có danh từ nên dùng 'your' đúng.</div>
            `
        },
        {
            id: 56,
            question: "Rewrite: We have two brothers, Jack and Mike. <br>-> Jack and Mike ______",
            options: [
                { text: "A. are our brothers.", correct: true },
                { text: "B. is our brother.", correct: false },
                { text: "C. are their brothers.", correct: false },
                { text: "D. belong to us.", correct: false }
            ],
            hint: "Đổi từ 'chúng tôi có' sang 'họ là anh em CỦA CHÚNG TÔI'.",
            explanation: `
                <div class="exp-step"><b>Bước 1: Cấu trúc chuyển đổi</b>
                Câu gốc: Chủ ngữ (We) + have (có) + Tân ngữ (brothers).<br>
                Câu viết lại: Chủ ngữ mới (Jack and Mike) + tobe + Tính từ sở hữu + Danh từ.</div>
                <div class="exp-step"><b>Bước 2: Dịch nghĩa</b>
                "Jack và Mike là anh em của chúng tôi."</div>
                <div class="exp-step"><b>Bước 3: Tại sao đúng?</b>
                Jack và Mike là số nhiều nên dùng 'are brothers'. Của chúng tôi là 'our'.</div>
                <div class="exp-step"><b>Bước 4: Tại sao sai?</b>
                - B sai vì dùng 'is'.<br>
                - C sai vì dùng 'their' (của họ - sai nghĩa).<br>
                - D sai vì 'belong to' không dùng cho quan hệ anh em ruột thịt.</div>
            `
        },
        {
            id: 57,
            question: "Rewrite: Does that motorbike belong to him? <br>-> Is that ______?",
            options: [
                { text: "A. his motorbike", correct: true },
                { text: "B. he motorbike", correct: false },
                { text: "C. him motorbike", correct: false },
                { text: "D. motorbike his", correct: false }
            ],
            hint: "Chuyển 'belong to him' thành sở hữu cách với 'motorbike'.",
            explanation: `
                <div class="exp-step"><b>Bước 1: Cấu trúc chuyển đổi</b>
                Câu gốc: Belong to + Tân ngữ (him).<br>
                Câu viết lại: Tobe + Đại từ chỉ định + Tính từ sở hữu + Danh từ?</div>
                <div class="exp-step"><b>Bước 2: Dịch nghĩa</b>
                "Kia có phải là xe máy của anh ấy không?"</div>
                <div class="exp-step"><b>Bước 3: Tại sao đúng?</b>
                Ta cần tính từ sở hữu 'his' đứng trước danh từ 'motorbike'.</div>
                <div class="exp-step"><b>Bước 4: Tại sao sai?</b>
                - B: 'he' là chủ ngữ.<br>
                - C: 'him' là tân ngữ.<br>
                - D: Sai trật tự từ.</div>
            `
        },
        {
            id: 58,
            question: "Rewrite: These postcards are ours. <br>-> These are ______",
            options: [
                { text: "A. our postcards.", correct: true },

    let currentScore = 0;
    const totalQuestions = quizData.length;
    document.getElementById('total-questions').innerText = totalQuestions;

    // Render Quiz
    const container = document.getElementById('quiz-container');
    
    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${q.id}`;

        let optionsHtml = '';
        const labels = ['A', 'B', 'C', 'D'];
        
        q.options.forEach((opt, i) => {
            optionsHtml += `
                <button class="option-btn" onclick="checkAnswer(${q.id}, ${i}, this)">
                    <div class="option-icon"><i class="far fa-circle"></i></div>
                    ${opt.text.replace(/^[A-D]\.\s/, '')}
                </button>
            `;
        });

        card.innerHTML = `
            <div class="question-number">Question ${q.id}</div>
            <div class="question-text highlight-text">${q.question}</div>
            <div class="options-grid">
                ${optionsHtml}
            </div>
            <button class="hint-btn" onclick="toggleHint(${q.id})">
                <i class="far fa-lightbulb"></i> Gợi ý
            </button>
            <div id="hint-${q.id}" class="hint-content">${q.hint}</div>
            
            <div id="explanation-${q.id}" class="explanation-box">
                <div class="explanation-header">
                    <i class="fas fa-glasses"></i> Cô MS Chí Nên giải thích chi tiết:
                </div>
                ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });

    // Logic kiểm tra đáp án
    function checkAnswer(questionId, selectedIndex, btnElement) {
        const questionData = quizData.find(q => q.id === questionId);
        const card = document.getElementById(`card-${questionId}`);
        const allButtons = card.querySelectorAll('.option-btn');
        const explanationBox = document.getElementById(`explanation-${questionId}`);

        // Disable all buttons to prevent multiple clicks
        allButtons.forEach(btn => btn.disabled = true);

        const isCorrect = questionData.options[selectedIndex].correct;
        const iconContainer = btnElement.querySelector('.option-icon');

        if (isCorrect) {
            // Hiệu ứng ĐÚNG
            btnElement.classList.add('correct');
            iconContainer.innerHTML = '<i class="fas fa-check-circle"></i>';
            currentScore++;
            document.getElementById('current-score').innerText = currentScore;
            
            // Âm thanh
            playSound('correct');
            
            // Pháo giấy
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#00D26A', '#8854C0', '#FF9F43']
            });

        } else {
            // Hiệu ứng SAI
            btnElement.classList.add('wrong');
            iconContainer.innerHTML = '<i class="fas fa-times-circle"></i>';
            playSound('wrong');

            // Hiển thị đáp án đúng
            questionData.options.forEach((opt, index) => {
                if (opt.correct) {
                    const correctBtn = allButtons[index];
                    correctBtn.classList.add('correct');
                    correctBtn.querySelector('.option-icon').innerHTML = '<i class="fas fa-check-circle"></i>';
                }
            });
        }

        // Hiện giải thích
        explanationBox.style.display = 'block';
    }

    function toggleHint(id) {
        const hint = document.getElementById(`hint-${id}`);
        hint.style.display = hint.style.display === 'block' ? 'none' : 'block';
    }

    function finishQuiz() {
        const modal = document.getElementById('result-modal');
        const emoji = document.getElementById('result-emoji');
        const title = document.getElementById('result-title');
        const message = document.getElementById('result-message');
        const scoreText = document.getElementById('final-score');

        scoreText.innerText = `${currentScore} / ${totalQuestions}`;
        
        const percentage = (currentScore / totalQuestions) * 100;

        if (percentage === 100) {
            emoji.innerText = "🏆";
            title.innerText = "Xuất sắc tuyệt đối!";
            message.innerText = "Em là thiên tài tiếng Anh! Cô MS Chí Nên rất tự hào.";
            playSound('correct');
            confetti({ particleCount: 200, spread: 100 });
        } else if (percentage >= 80) {
            emoji.innerText = "🎉";
            title.innerText = "Làm tốt lắm!";
            message.innerText = "Kiến thức của em rất vững. Cố một chút nữa là được điểm tối đa!";
            playSound('correct');
        } else if (percentage >= 50) {
            emoji.innerText = "👍";
            title.innerText = "Cố gắng lên!";
            message.innerText = "Em đã hiểu bài cơ bản, nhưng cần ôn lại các cấu trúc câu nhé.";
        } else {
            emoji.innerText = "💪";
            title.innerText = "Đừng nản chí!";
            message.innerText = "Hãy xem kỹ lại phần giải thích chi tiết bên dưới từng câu em nhé.";
        }

        modal.style.display = 'flex';
    }

    function playSound(type) {
        const correctAudio = document.getElementById('sound-correct');
        const wrongAudio = document.getElementById('sound-wrong');
        
        // Reset time to allow rapid replay
        if (type === 'correct') {
            correctAudio.currentTime = 0;
            correctAudio.play().catch(e => console.log("Audio autoplay policy prevents sound"));
        } else {
            wrongAudio.currentTime = 0;
            wrongAudio.play().catch(e => console.log("Audio autoplay policy prevents sound"));
        }
    }
</script>
