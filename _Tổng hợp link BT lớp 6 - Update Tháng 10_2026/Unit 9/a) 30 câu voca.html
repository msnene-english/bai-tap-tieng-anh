        body {

        }

            box-shadow: 0 8px 0 #6b21a8;

            border-radius: 20px;

        }



        /* 3D Button Styles */

        .btn-option {

            transition: all 0.1s;

            border-bottom: 6px solid #e2e8f0;

            position: relative;

            top: 0;

        }



        .btn-option:hover:not(:disabled) {

            transform: scale(1.02);

            filter: brightness(105%);

        }



        .btn-option:active:not(:disabled) {

            top: 6px;

            border-bottom: 0px solid transparent;

            box-shadow: none;

        }



        /* Correct State */

        .btn-correct {

            background-color: var(--correct-green) !important;

            border-color: #00a352 !important; /* Darker green for border */

            color: white !important;

        }



        /* Wrong State */

        .btn-wrong {

            background-color: var(--wrong-red) !important;

            border-color: #d63031 !important; /* Darker red for border */

            color: white !important;

            animation: shake 0.5s;

        }



        @keyframes shake {

            0% { transform: translateX(0); }

            25% { transform: translateX(-10px) rotate(-5deg); }

            50% { transform: translateX(10px) rotate(5deg); }

            75% { transform: translateX(-10px) rotate(-5deg); }

            100% { transform: translateX(0); }

        }



        /* Explanation Box */

        .explanation-box {

            background-color: #fff;

            border-left: 5px solid var(--primary-purple);

            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

            animation: slideDown 0.4s ease-out;

        }



        @keyframes slideDown {

            from { opacity: 0; transform: translateY(-10px); }

            to { opacity: 1; transform: translateY(0); }

        }



        /* Teacher Avatar Area */

        .teacher-badge {

            background: #fff;

            border: 3px solid var(--primary-teal);

            box-shadow: 4px 4px 0 var(--primary-purple);

        }



        /* Vocabulary Table */

        .vocab-table {

            width: 100%;

            margin-top: 10px;

            font-size: 0.95rem;

        }

        .vocab-table th {

            background-color: #f3e8ff;

            color: #6b21a8;

            padding: 8px;

            text-align: left;

            border-bottom: 2px solid #d8b4fe;

        }

        .vocab-table td {

            padding: 8px;

            border-bottom: 1px solid #e9d5ff;

        }

"hint": "Tính từ sở hữu đi với danh từ 'new book'."

}

];



    let correctCount = 0;

    const totalQuestions = quizData.length;



    // --- RENDER LOGIC ---

    function renderQuiz() {

        const container = document.getElementById('quiz-container');

        quizData.forEach((item, index) => {

            // Create Card

            const card = document.createElement('div');

            card.className = "bg-white rounded-2xl shadow-lg overflow-hidden border border-purple-100 p-6";

            

            // Question Text

            const qTitle = `<div class="flex items-start gap-4 mb-6">

                <div class="bg-purple-100 text-purple-700 font-bold rounded-lg p-3 min-w-[50px] text-center shadow-sm">

                    Q${item.questionNumber}

                </div>

                <h3 class="text-xl font-bold text-gray-800 pt-1 leading-snug">${item.question}</h3>

            </div>`;



            // Options

            let optionsHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';

            const labels = ['A', 'B', 'C', 'D'];

            

            item.answerOptions.forEach((opt, optIndex) => {

                optionsHtml += `

                    <button id="q${index}_opt${optIndex}" 

                        onclick="checkAnswer(${index}, ${optIndex}, ${opt.isCorrect})"

                        class="btn-option bg-gray-50 text-left p-4 rounded-xl flex items-center gap-3 text-lg font-medium text-gray-700 hover:bg-white w-full">

                        <span class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center font-bold text-sm border-2 border-purple-200">

                            ${labels[optIndex]}

                        </span>

                        <span>${opt.text}</span>

                    </button>

                `;

            });

            optionsHtml += '</div>';



            // Explanation Section (Hidden by default)

            // Convert newline \n in rationale to <br> for HTML display

            const rationaleHtml = item.answerOptions.find(o => o.isCorrect)?.rationale.replace(/\n/g, '<br>') || "Giải thích đang cập nhật...";

            const explanationHtml = `

                <div id="explanation-${index}" class="explanation-box hidden mt-6 p-4 rounded-r-xl bg-purple-50">

                    <div class="flex items-center gap-2 mb-2 text-purple-700 font-bold uppercase text-sm tracking-wider">

                        <i class="fas fa-lightbulb text-yellow-500 text-xl"></i>

                        <span>Ms. Chí Nên giải thích:</span>

                    </div>

                    <div class="text-gray-700 leading-relaxed space-y-2 text-base">

                        ${rationaleHtml}

                    </div>

                    ${item.hint ? `<div class="mt-3 text-sm text-gray-500 italic bg-white p-2 rounded border border-gray-100"><i class="fas fa-key mr-1"></i> Mẹo: ${item.hint}</div>` : ''}

                </div>

            `;



            card.innerHTML = qTitle + optionsHtml + explanationHtml;

            container.appendChild(card);

        });

    }



    // --- INTERACTION LOGIC ---

    function checkAnswer(qIndex, optIndex, isCorrect) {

        const selectedBtn = document.getElementById(`q${qIndex}_opt${optIndex}`);

        const explanationDiv = document.getElementById(`explanation-${qIndex}`);

        const allButtons = document.querySelectorAll(`[id^='q${qIndex}_opt']`);

        

        // Prevent re-clicking

        if (selectedBtn.disabled) return;

        allButtons.forEach(btn => btn.disabled = true);



        // Update UI

        explanationDiv.classList.remove('hidden');

        

        if (isCorrect) {

            selectedBtn.classList.add('btn-correct');

            playSound('correct');

            triggerConfetti(selectedBtn);

            correctCount++;

            updateProgressBar();

        } else {

            selectedBtn.classList.add('btn-wrong');

            playSound('wrong');

            // Highlight the correct answer automatically if wrong

            const correctOptIndex = quizData[qIndex].answerOptions.findIndex(o => o.isCorrect);

            document.getElementById(`q${qIndex}_opt${correctOptIndex}`).classList.add('btn-correct', 'opacity-75');

        }

    }



    function updateProgressBar() {

        const percentage = (correctCount / totalQuestions) * 100;

        document.getElementById('progress-bar').style.width = `${percentage}%`;

    }



    function playSound(type) {

        const audio = document.getElementById(type === 'correct' ? 'sound-correct' : 'sound-wrong');

        audio.currentTime = 0;

        audio.play().catch(e => console.log("Audio play failed interaction required"));

    }



    function triggerConfetti(element) {

        const rect = element.getBoundingClientRect();

        // Calculate position relative to viewport

        const x = (rect.left + rect.width / 2) / window.innerWidth;

        const y = (rect.top + rect.height / 2) / window.innerHeight;



        confetti({

            particleCount: 60,

            spread: 70,

            origin: { x: x, y: y },

            colors: ['#00C9A7', '#8854C0', '#FFD700']

        });

    }



    function submitQuiz() {

        const modal = document.getElementById('score-modal');

        const scoreDisplay = document.getElementById('final-score');

        const feedback = document.getElementById('feedback-text');



        scoreDisplay.innerText = `${correctCount}/${totalQuestions}`;

        

        if (correctCount === totalQuestions) {

            feedback.innerText = "Tuyệt vời! Bạn là thiên tài tiếng Anh! 🌟";

        } else if (correctCount >= 20) {

            feedback.innerText = "Làm tốt lắm! Cố gắng thêm chút nữa nhé! 💪";

        } else {

            feedback.innerText = "Đừng nản chí! Hãy xem lại phần giải thích nhé! 📚";

        }



        modal.classList.remove('hidden');

        // Final celebration confetti

        if (correctCount > 15) {

            const duration = 3000;

            const end = Date.now() + duration;

            (function frame() {

                confetti({

                    particleCount: 5,

                    angle: 60,

                    spread: 55,

                    origin: { x: 0 },

                    colors: ['#8854C0', '#00C9A7']

                });

                confetti({

                    particleCount: 5,

                    angle: 120,

                    spread: 55,

                    origin: { x: 1 },

                    colors: ['#8854C0', '#00C9A7']

                });

                if (Date.now() < end) requestAnimationFrame(frame);

            }());

        }

    }



    function closeModal() {

        document.getElementById('score-modal').classList.add('hidden');

        window.scrollTo({ top: 0, behavior: 'smooth' });

    }



    // Initialize

    renderQuiz();



</script>

</body>
