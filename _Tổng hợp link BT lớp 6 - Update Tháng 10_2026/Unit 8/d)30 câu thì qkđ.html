<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Quá Khứ Đơn - Ms. Chí Nên</title>
    <!-- Import Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #8854C0; /* Tím Pastel */
            --secondary-color: #00C9A7; /* Xanh Ngọc */
            --accent-color: #FF9F43; /* Cam */
            --correct-color: #00D26A; /* Xanh lá */
            --wrong-color: #FF4757; /* Đỏ cam */
            --bg-color: #F0F3F8;
            --text-color: #2F3542;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none; /* Ngăn bôi đen text để trải nghiệm giống App */
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1d8e0 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 0;
            color: var(--text-color);
            padding-bottom: 80px;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, var(--primary-color), #a29bfe);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 20px rgba(136, 84, 192, 0.3);
            position: relative;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            margin: 5px 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* --- PROGRESS BAR --- */
        .progress-container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto 0;
            background-color: #dfe6e9;
            border-radius: 20px;
            height: 15px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .progress-bar {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 20px;
        }

        /* --- SCORE BOARD (Sticky) --- */
        .score-board {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-weight: 800;
            color: var(--primary-color);
            z-index: 100;
            border: 3px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- CONTAINER --- */
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        /* --- QUESTION CARD --- */
        .question-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 0 #dfe4ea, 0 15px 20px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.3s;
            border: 2px solid #f1f2f6;
        }

        .question-number {
            position: absolute;
            top: -15px;
            left: 20px;
            background: var(--accent-color);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 4px 0 #e67e22;
            font-size: 1rem;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #2d3436;
        }
        
        /* Phonetic/Underline style */
        u {
            text-decoration: none;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 2px;
        }

        /* --- OPTIONS GRID --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #dcdde1;
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #57606f;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #dcdde1;
            text-align: left;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 6px 0 #dcdde1;
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 #dcdde1;
        }

        .option-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 0.9rem;
            font-weight: 800;
            color: #a4b0be;
            flex-shrink: 0;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color);
            border-color: #00b894;
            color: white;
            box-shadow: 0 4px 0 #00b894;
        }
        .option-btn.correct .option-circle {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            border-color: #ff3f34;
            color: white;
            box-shadow: 0 4px 0 #ff3f34;
            animation: shake 0.5s;
        }
        .option-btn.wrong .option-circle {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        /* --- EXPLANATION BOX (Ms. Chí Nên style) --- */
        .explanation-box {
            margin-top: 25px;
            background: #f0fff4; /* Xanh rất nhạt */
            border: 2px dashed var(--secondary-color);
            border-radius: 15px;
            padding: 20px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.show {
            display: block;
        }

        .teacher-avatar {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 10px;
        }

        .teacher-avatar i {
            font-size: 2rem;
            color: var(--primary-color);
            margin-right: 10px;
            background: white;
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .teacher-name {
            font-weight: 800;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .exp-content {
            font-size: 1rem;
            line-height: 1.6;
        }

        .exp-section {
            margin-bottom: 10px;
        }
        
        .exp-label {
            font-weight: 800;
            color: #2d3436;
            text-transform: uppercase;
            font-size: 0.85rem;
            background: #dfe6e9;
            padding: 2px 8px;
            border-radius: 5px;
            margin-right: 5px;
        }

        .exp-translation {
            color: #2980b9;
            font-style: italic;
            margin-bottom: 10px;
            display: block;
        }

        .rationale-item {
            margin-bottom: 8px;
            padding-left: 10px;
            border-left: 3px solid #dfe6e9;
        }
        .rationale-item.correct-rationale {
            border-left-color: var(--correct-color);
            background-color: rgba(0, 210, 106, 0.05);
            padding: 8px;
            border-radius: 0 8px 8px 0;
        }

        /* --- SUBMIT BUTTON --- */
        .submit-section {
            text-align: center;
            margin-top: 40px;
        }

        .submit-btn {
            background-color: var(--accent-color);
            color: white;
            font-size: 1.5rem;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #e67e22, 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #e67e22, 0 15px 25px rgba(0,0,0,0.2);
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #e67e22;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid var(--primary-color);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .score-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary-color);
            margin: 20px 0;
            text-shadow: 3px 3px 0 #dfe6e9;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Canvas for Confetti */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <!-- Header -->
    <header>
        <h1><i class="fas fa-shapes"></i> 30 Câu Trắc Nghiệm Quá Khứ Đơn</h1>
        <p>Giáo viên: Ms. Chí Nên (Thạc sỹ)</p>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </header>

    <!-- Sticky Score -->
    <div class="score-board">
        <i class="fas fa-star" style="color: #f1c40f;"></i>
        <span id="score-text">0 / 30</span>
    </div>

    <!-- Quiz Container -->
    <div class="container" id="quiz-container">
        <!-- Questions will be injected here via JS -->
    </div>

    <!-- Submit Section -->
    <div class="submit-section">
        <button class="submit-btn" onclick="finishQuiz()">
            <i class="fas fa-flag-checkered"></i> Nộp Bài
        </button>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <h2 style="color: var(--secondary-color); font-size: 2rem; margin: 0;">Kết Quả</h2>
            <div class="score-display" id="final-score">0/30</div>
            <p id="feedback-text" style="font-size: 1.2rem; color: #57606f;">Bạn làm tốt lắm!</p>
            <button class="submit-btn" style="font-size: 1rem; padding: 10px 30px; margin-top: 20px;" onclick="location.reload()">Làm Lại</button>
        </div>
    </div>

    <script>
        // --- DATASET: 30 Questions ---
        const quizData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "My father ______ tired after work yesterday, so he went to bed early.",
              "answerOptions": [
                { "text": "was", "rationale": "Chính xác! Chủ ngữ 'My father' (số ít) đi với động từ to be quá khứ là 'was'. 'Tired' là tính từ nên cần to be. <br>• Dịch: Bố tôi đã rất mệt sau giờ làm ngày hôm qua, nên ông ấy đi ngủ sớm.", "isCorrect": true },
                { "text": "were", "rationale": "Sai. 'Were' dùng cho chủ ngữ số nhiều.", "isCorrect": false },
                { "text": "did", "rationale": "Sai. 'Did' không đi với tính từ 'tired'.", "isCorrect": false },
                { "text": "is", "rationale": "Sai. 'Is' là thì hiện tại, không dùng cho 'yesterday'.", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 2,
              "question": "______ you visit your grandparents last weekend?",
              "answerOptions": [
                { "text": "Do", "rationale": "Sai. 'Do' là trợ động từ hiện tại.", "isCorrect": false },
                { "text": "Were", "rationale": "Sai. 'Were' không đi với động từ thường nguyên thể 'visit'.", "isCorrect": false },
                { "text": "Did", "rationale": "Chính xác! Câu hỏi Yes/No với động từ thường (visit) ở quá khứ (last weekend) dùng trợ động từ 'Did'. <br>• Dịch: Bạn có đi thăm ông bà vào cuối tuần trước không?", "isCorrect": true },
                { "text": "Are", "rationale": "Sai. 'Are' là hiện tại và không đi với V-nguyên thể.", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 3,
              "question": "She ______ a beautiful dress to the party last night.",
              "answerOptions": [
                { "text": "wear", "rationale": "Sai. Đây là dạng nguyên thể/hiện tại.", "isCorrect": false },
                { "text": "wore", "rationale": "Chính xác! 'Wear' là động từ bất quy tắc, quá khứ là 'wore'. <br>• Dịch: Cô ấy đã mặc một chiếc váy đẹp đến bữa tiệc tối qua.", "isCorrect": true },
                { "text": "weared", "rationale": "Sai. 'Wear' là bất quy tắc, không thêm -ed.", "isCorrect": false },
                { "text": "wearing", "rationale": "Sai. V-ing cần có to be đi kèm và không dùng cho quá khứ đơn thuần túy.", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 4,
              "question": "I ______ hungry, so I ______ a sandwich.",
              "answerOptions": [
                { "text": "was / ate", "rationale": "Chính xác! Vế 1 dùng to be quá khứ 'was' với tính từ 'hungry'. Vế 2 dùng quá khứ của 'eat' là 'ate'. <br>• Dịch: Tôi đã đói, vì vậy tôi đã ăn một chiếc bánh mì kẹp.", "isCorrect": true },
                { "text": "was / eat", "rationale": "Sai. 'Eat' chưa chia quá khứ.", "isCorrect": false },
                { "text": "did / ate", "rationale": "Sai. Không dùng 'did' với tính từ 'hungry'.", "isCorrect": false },
                { "text": "were / ate", "rationale": "Sai. Chủ ngữ 'I' không đi với 'were' trong câu trần thuật.", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 5,
              "question": "They ______ at the cinema; they were at home.",
              "answerOptions": [
                { "text": "weren't", "rationale": "Chính xác! Câu phủ định. Vế sau nói 'họ ở nhà' -> Vế trước 'họ KHÔNG ở rạp chiếu phim'. Chủ ngữ 'They' dùng 'weren't'. <br>• Dịch: Họ đã không ở rạp chiếu phim; họ đã ở nhà.", "isCorrect": true },
                { "text": "wasn't", "rationale": "Sai. 'Wasn't' dùng cho số ít.", "isCorrect": false },
                { "text": "didn't", "rationale": "Sai. Chỉ địa điểm (at the cinema) dùng to be, không dùng 'didn't'.", "isCorrect": false },
                { "text": "aren't", "rationale": "Sai thì hiện tại.", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 6,
              "question": "What time ______ the film ______?",
              "answerOptions": [
                { "text": "did / start", "rationale": "Chính xác! Câu hỏi với động từ thường: Wh-word + did + S + V-inf. <br>• Dịch: Bộ phim đã bắt đầu lúc mấy giờ?", "isCorrect": true },
                { "text": "did / started", "rationale": "Sai. Sau 'did' động từ phải về nguyên mẫu.", "isCorrect": false },
                { "text": "was / start", "rationale": "Sai. To be không đi với động từ nguyên thể.", "isCorrect": false },
                { "text": "do / start", "rationale": "Sai thì hiện tại.", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 7,
              "question": "We ______ a lot of photos during our trip.",
              "answerOptions": [
                { "text": "taked", "rationale": "Sai. 'Take' là động từ bất quy tắc, không thêm -ed.", "isCorrect": false },
                { "text": "took", "rationale": "Chính xác! Quá khứ của 'take' (chụp ảnh) là 'took'. <br>• Dịch: Chúng tôi đã chụp rất nhiều ảnh trong chuyến đi.", "isCorrect": true },
                { "text": "take", "rationale": "Sai thì hiện tại.", "isCorrect": false },
                { "text": "taking", "rationale": "Sai ngữ pháp (thiếu to be).", "isCorrect": false }
              ]
            },
            {
              "questionNumber": 8,
              "question": "______ it rain yesterday?",
              "answerOptions": [
                { "text": "Did", "rationale": "Chính xác! 'Rain' ở đây là động từ (trời mưa). Câu hỏi Yes/No quá khứ dùng trợ động từ 'Did'. <br>• Dịch: Hôm qua trời có mưa không?", "isCorrect": true },

        // --- APP STATE ---
        let score = 0;
        let totalQuestions = quizData.questions.length;
        let answeredCount = 0;

        // --- INIT ---
        window.onload = function() {
            renderQuiz();
            updateScore();
            updateProgress();
        };

        // --- RENDER LOGIC ---
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            quizData.questions.forEach((q, index) => {
                // Main Card
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                // Question Number Badge
                const badge = document.createElement('div');
                badge.className = 'question-number';
                badge.innerText = `Câu ${index + 1}`;
                card.appendChild(badge);

                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = q.question; // Allow HTML for underlines if needed
                card.appendChild(qText);

                // Options Grid
                const grid = document.createElement('div');
                grid.className = 'options-grid';

                const optionLetters = ['A', 'B', 'C', 'D'];

                q.answerOptions.forEach((opt, optIndex) => {
                    const btn = document.createElement('div');
                    btn.className = 'option-btn';
                    btn.dataset.isCorrect = opt.isCorrect;
                    btn.dataset.index = optIndex;
                    btn.onclick = () => checkAnswer(index, optIndex, opt.isCorrect, btn);

                    const circle = document.createElement('div');
                    circle.className = 'option-circle';
                    circle.innerText = optionLetters[optIndex];

                    const textSpan = document.createElement('span');
                    textSpan.innerText = opt.text;

                    btn.appendChild(circle);
                    btn.appendChild(textSpan);
                    grid.appendChild(btn);
                });

                card.appendChild(grid);

                // Explanation Box (Hidden initially)
                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp-box-${index}`;
                
                // Build Detailed Explanation Content string
                let correctOpt = q.answerOptions.find(o => o.isCorrect);
                
                let expHTML = `
                    <div class="teacher-avatar">
                        <i class="fas fa-chalkboard-teacher"></i>
                        <span class="teacher-name">Ms. Chí Nên giải thích:</span>
                    </div>
                    <div class="exp-content">
                        <div class="exp-section">
                             <div class="rationale-item correct-rationale">
                                <strong><i class="fas fa-check-circle" style="color:var(--correct-color)"></i> Đáp án đúng: ${correctOpt.text}</strong>
                                <br>${correctOpt.rationale}
                             </div>
                        </div>
                        <div class="exp-section">
                            <span class="exp-label">Phân tích đáp án sai:</span>
                            <div style="margin-top:5px;">
                `;
                
                q.answerOptions.forEach((opt, idx) => {
                    if (!opt.isCorrect) {
                        expHTML += `
                            <div class="rationale-item">
                                <strong>${optionLetters[idx]}. ${opt.text}:</strong> ${opt.rationale}
                            </div>
                        `;
                    }
                });
                
                expHTML += `</div></div></div>`;
                
                expBox.innerHTML = expHTML;
                card.appendChild(expBox);

                container.appendChild(card);
            });
        }

        // --- INTERACTION LOGIC ---
        function checkAnswer(qIndex, optIndex, isCorrect, btnElement) {
            const card = document.getElementById(`q-card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            
            // Prevent re-answering
            if (card.classList.contains('answered')) return;
            card.classList.add('answered');

            answeredCount++;
            updateProgress();

            if (isCorrect) {
                // Correct Logic
                btnElement.classList.add('correct');
                score++;
                updateScore();
                playSound('correct');
                triggerConfetti();
                
                // Highlight correct styling
                const circle = btnElement.querySelector('.option-circle');
                circle.innerHTML = '<i class="fas fa-check"></i>';
            } else {
                // Wrong Logic
                btnElement.classList.add('wrong');
                playSound('wrong');
                
                const circle = btnElement.querySelector('.option-circle');
                circle.innerHTML = '<i class="fas fa-times"></i>';

                // Find and highlight the correct one automatically
                buttons.forEach(b => {
                    if (b.dataset.isCorrect === 'true') {
                        b.classList.add('correct');
                        b.querySelector('.option-circle').innerHTML = '<i class="fas fa-check"></i>';
                    }
                });
            }

            // Disable all buttons in this card
            buttons.forEach(b => b.classList.add('disabled'));

            // Show Explanation immediately
            const expBox = document.getElementById(`exp-box-${qIndex}`);
            expBox.classList.add('show');
        }

        // --- UTILS ---
        function updateScore() {
            document.getElementById('score-text').innerText = `${score} / ${totalQuestions}`;
        }

        function updateProgress() {
            const percent = (answeredCount / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function finishQuiz() {
            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('final-score');
            const feedback = document.getElementById('feedback-text');

            scoreDisplay.innerText = `${score} / ${totalQuestions}`;
            
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                feedback.innerText = "Xuất sắc! Bạn là thiên tài tiếng Anh! 🏆";
                triggerConfetti();
            } else if (percentage >= 80) {
                feedback.innerText = "Giỏi lắm! Cố gắng chút nữa là điểm tuyệt đối rồi! 🌟";
            } else if (percentage >= 50) {
                feedback.innerText = "Làm tốt lắm! Hãy ôn lại các câu sai nhé. 💪";
            } else {
                feedback.innerText = "Đừng buồn nhé! Hãy xem lại giải thích và thử lại nào. 📚";
            }

            modal.classList.add('active');
        }

        // --- SOUNDS ---
        function playSound(type) {
            const sound = document.getElementById(type === 'correct' ? 'sound-correct' : 'sound-wrong');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play blocked", e));
            }
        }

        // --- CONFETTI EFFECT (Simple JS Implementation) ---
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#f1c40f', '#e74c3c', '#3498db', '#9b59b6', '#2ecc71'];

            for (let i = 0; i < 150; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    rotation: Math.random() * 360,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 5 + 2,
                    oscillation: Math.random() * 20
                });
            }

            let animationId;
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let activePieces = 0;

                pieces.forEach(p => {
                    p.y += p.speed;
                    p.rotation += 2;
                    p.x += Math.cos(p.y / 50) * 1;

                    if (p.y < canvas.height) {
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation * Math.PI / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                        ctx.restore();
                        activePieces++;
                    }
                });

                if (activePieces > 0) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animate();
            
            // Stop after 3 seconds
            setTimeout(() => cancelAnimationFrame(animationId), 3000);
        }
    </script>
</body>
