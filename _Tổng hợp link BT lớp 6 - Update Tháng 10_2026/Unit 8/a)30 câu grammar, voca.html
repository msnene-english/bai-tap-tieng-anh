<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếng Anh 6 - Unit 8: Sports & Games | Ms MS Chí Nên</title>
    <!-- Google Fonts: Nunito for rounded, friendly text -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-color: #8854C0; /* Purple */
            --primary-dark: #6c429c;
            --secondary-color: #00C9A7; /* Teal */
            --secondary-dark: #009e82;
            --correct-color: #00D26A; /* Green */
            --correct-dark: #00a855;
            --wrong-color: #FF4757; /* Red/Orange */
            --wrong-dark: #d6303e;
            --bg-color: #f0f4f8;
            --text-color: #2f3542;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dfe4ea 15%, transparent 16%), radial-gradient(#dfe4ea 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid #eee;
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .teacher-name {
            font-size: 0.9rem;
            color: #747d8c;
            font-weight: 600;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Game Container */
        .game-container {
            width: 100%;
            max-width: 800px;
            perspective: 1000px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #dfe4ea;
            border-radius: 15px;
            height: 20px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 15px;
        }

        /* Question Card */
        .card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            margin-bottom: 20px;
            position: relative;
            border-bottom: 8px solid #e1e1e1;
            transition: transform 0.3s ease;
        }

        .question-number {
            position: absolute;
            top: -15px;
            left: 20px;
            background: var(--primary-color);
            color: white;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 4px 0 var(--primary-dark);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #2f3542;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: white;
            border: 2px solid #e1e1e1;
            border-bottom: 6px solid #e1e1e1;
            border-radius: 15px;
            padding: 15px 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: left;
            position: relative;
            display: flex;
            align-items: center;
        }

        .btn-option:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .btn-option:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .btn-option.correct {
            background-color: var(--correct-color);
            border-color: var(--correct-dark);
            border-bottom-color: var(--correct-dark);
            color: white;
        }

        .btn-option.wrong {
            background-color: var(--wrong-color);
            border-color: var(--wrong-dark);
            border-bottom-color: var(--wrong-dark);
            color: white;
            animation: shake 0.5s;
        }

        .option-letter {
            background: rgba(0,0,0,0.05);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin-right: 12px;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .btn-option.correct .option-letter,
        .btn-option.wrong .option-letter {
            background: rgba(255,255,255,0.3);
        }

        /* Explanation Box (Ms MS Chí Nên's Corner) */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 25px;
            background: #f8f0ff;
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            padding: 20px;
            animation: slideIn 0.4s ease-out;
            position: relative;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 1.2rem;
            box-shadow: 0 3px 0 var(--primary-dark);
        }

        .explanation-content h4 {
            margin: 10px 0 5px 0;
            color: #57606f;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        .explanation-content p {
            margin: 5px 0 10px 0;
            line-height: 1.5;
            font-size: 1rem;
        }

        /* Vocabulary Table */
        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            font-size: 0.95rem;
        }
        
        .vocab-table th {
            background: var(--secondary-color);
            color: white;
            padding: 8px;
            text-align: left;
            font-size: 0.85rem;
        }

        .vocab-table td {
            padding: 8px;
            border-bottom: 1px solid #eee;
            color: #2f3542;
        }

        .vocab-table td:first-child {
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn-nav {
            padding: 12px 25px;
            border-radius: 50px;
            border: none;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.1s;
            border-bottom: 4px solid rgba(0,0,0,0.2);
        }

        .btn-nav:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-next {
            background-color: var(--secondary-color);
            color: white;
            display: none; /* Hidden until answered */
            margin-left: auto;
        }

        /* Popup Summary */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .popup-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            background: var(--secondary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            font-weight: 800;
            margin: 0 auto 20px auto;
            border: 5px solid white;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1);
        }

        .popup-content h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .btn-retry {
            background-color: var(--primary-color);
            color: white;
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-2deg); }
            50% { transform: translateX(10px) rotate(2deg); }
            75% { transform: translateX(-10px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .hint-text {
            font-size: 0.9rem;
            color: #7f8c8d;
            font-style: italic;
            margin-top: 10px;
            display: flex;
            align-items: center;
        }
        
        .hint-text i {
            margin-right: 5px;
            color: #f1c40f;
        }

        /* Utility for underlined text in questions */
        u {
            text-decoration-color: var(--primary-color);
            text-decoration-thickness: 3px;
            text-underline-offset: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bài Tập Tiếng Anh 6 - Unit 8</h1>
        <div class="teacher-name">Giáo viên tạo: Ms MS Chí Nên</div>
    </header>

    <div class="game-container">
        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Question Card -->
        <div class="card" id="questionCard">
            <span class="question-number" id="questionNumber">Câu 1/30</span>
            <div class="question-text" id="questionText">
                Loading question...
            </div>

            <!-- Hint if available -->
            <div class="hint-text" id="hintBox" style="display:none;">
                <i class="fas fa-lightbulb"></i> <span id="hintText"></span>
            </div>

            <div class="options-grid" id="optionsGrid">
                <!-- Options injected by JS -->
            </div>

            <!-- Explanation Area (Initially Hidden) -->
            <div class="explanation-box" id="explanationBox">
                <div class="explanation-header">
                    <div class="teacher-avatar">👩‍🏫</div>
                    <span>Ms MS Chí Nên giải thích chi tiết:</span>
                </div>
                <div class="explanation-content" id="explanationContent">
                    <!-- Content injected by JS -->
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-buttons">
            <div style="flex:1"></div> <!-- Spacer -->
            <button class="btn-nav btn-next" id="nextBtn" onclick="nextQuestion()">
                Câu tiếp theo <i class="fas fa-arrow-right"></i>
            </button>
            <button class="btn-nav btn-next" id="finishBtn" onclick="showSummary()" style="display:none; background-color: var(--primary-color);">
                Nộp bài & Xem điểm <i class="fas fa-trophy"></i>
            </button>
        </div>
    </div>

    <!-- Summary Popup -->
    <div class="popup-overlay" id="summaryPopup">
        <div class="popup-content">
            <div class="score-circle" id="finalScore">0/30</div>
            <h2 id="finalTitle">Tuyệt vời!</h2>
            <p id="finalMessage">Bạn đã hoàn thành bài tập.</p>
            <button class="btn-nav btn-retry" onclick="location.reload()">Làm lại bài <i class="fas fa-redo"></i></button>
        </div>
    </div>

    <script>
        // --- DATA SOURCE ---
        const quizData = {
          "questions": [
            {
              "questionNumber": 1,
              "question": "You must learn the ___________ of the game before playing.",
              "answerOptions": [
                { "text": "rules", "rationale": "Chính xác! Rules (noun): Quy tắc, luật lệ. Ta cần một danh từ chỉ những quy định cần tuân thủ khi chơi game. Dịch: Bạn phải học luật chơi trước khi bắt đầu.", "isCorrect": true },
                { "text": "laws", "rationale": "Sai. Laws (noun): Luật pháp (của quốc gia/nhà nước). Từ này mang nghĩa trang trọng, pháp lý, không dùng cho trò chơi.", "isCorrect": false },
                { "text": "agreements", "rationale": "Sai. Agreements (noun): Sự thỏa thuận, hiệp định. Không phù hợp ngữ cảnh trò chơi.", "isCorrect": false },
                { "text": "sayings", "rationale": "Sai. Sayings (noun): Tục ngữ, câu nói. Không liên quan đến việc chơi game.", "isCorrect": false }
              ],
              "hint": "Đây là danh từ chỉ những điều bạn phải tuân theo khi chơi một trò chơi (bắt đầu bằng chữ 'r')."
            },
            {
              "questionNumber": 2,
              "question": "We ___________ to Ho Chi Minh for our last summer vacation.",
              "answerOptions": [
                { "text": "go", "rationale": "Sai. Go (verb): Đi (hiện tại đơn). Câu có 'last summer vacation' (kỳ nghỉ hè trước) nên không chia hiện tại.", "isCorrect": false },
                { "text": "went", "rationale": "Chính xác! Went (verb - past form): Đã đi. 'Last summer vacation' là dấu hiệu của thì Quá khứ đơn (Past Simple). Dịch: Chúng tôi đã đi TP. Hồ Chí Minh vào kỳ nghỉ hè năm ngoái.", "isCorrect": true },
                { "text": "goed", "rationale": "Sai. Goed: Không tồn tại (từ 'go' là động từ bất quy tắc, quá khứ là 'went').", "isCorrect": false },
                { "text": "will go", "rationale": "Sai. Will go (verb phrase): Sẽ đi (tương lai đơn). Không dùng cho sự kiện đã qua.", "isCorrect": false }
              ],
              "hint": "Chú ý cụm từ chỉ thời gian 'last summer vacation' (kỳ nghỉ hè trước)."
            },
            {
              "questionNumber": 3,
              "question": "___________ Liz buy a lot of souvenirs for her friends?",
              "answerOptions": [
                { "text": "Did", "rationale": "Chính xác! Did: Trợ động từ quá khứ. Cấu trúc câu hỏi thì quá khứ đơn: Did + S + V(nguyên thể)? Động từ chính là 'buy'. Dịch: Liz đã mua rất nhiều quà lưu niệm cho bạn bè phải không?", "isCorrect": true },
                { "text": "Do", "rationale": "Sai. Do: Trợ động từ hiện tại. 'Liz' là ngôi thứ 3 số ít, nếu dùng hiện tại phải là 'Does', nhưng ngữ cảnh mua quà lưu niệm thường kể về chuyến đi.", "isCorrect": false },
                { "text": "Were", "rationale": "Sai. Were (to be): Là/thì/ở. Động từ 'to be' không đi trực tiếp với động từ thường nguyên thể 'buy'.", "isCorrect": false },
                { "text": "Is", "rationale": "Sai. Is (to be): Là/thì/ở. Tương tự, 'to be' không đi với 'buy' nguyên thể.", "isCorrect": false }
              ],
              "hint": "Động từ chính trong câu là 'buy' (nguyên thể), đây là câu hỏi Yes/No."
            },
            {
              "questionNumber": 4,
              "question": "John ___________ return to America last week.",
              "answerOptions": [
                { "text": "doesn’t", "rationale": "Sai. Doesn't: Trợ động từ phủ định hiện tại. 'Last week' là quá khứ.", "isCorrect": false },
                { "text": "isn’t", "rationale": "Sai. Isn't: Không là. Không đi với động từ thường 'return' nguyên thể.", "isCorrect": false },
                { "text": "didn’t", "rationale": "Chính xác! Didn't: Trợ động từ phủ định quá khứ. Dấu hiệu 'last week' -> Quá khứ đơn. Dịch: John đã không trở về Mỹ vào tuần trước.", "isCorrect": true },
                { "text": "wasn’t", "rationale": "Sai. Wasn't: Đã không là. Không đi với động từ thường 'return' nguyên thể.", "isCorrect": false }
              ],
              "hint": "Câu có trạng từ thời gian 'last week', cần trợ động từ phủ định."
            },
            {
              "questionNumber": 5,
              "question": "Last weekend Phong and Lan ___________ their grandparents.",
              "answerOptions": [
                { "text": "visit", "rationale": "Sai. Visit: Thăm (hiện tại). Sai thì vì có 'Last weekend'.", "isCorrect": false },
                { "text": "is visiting", "rationale": "Sai. Is visiting: Đang thăm. Chủ ngữ số nhiều không dùng 'is', và sai thì.", "isCorrect": false },
                { "text": "will visit", "rationale": "Sai. Will visit: Sẽ thăm (tương lai). Sai thì.", "isCorrect": false },
                { "text": "visited", "rationale": "Chính xác! Visited: Đã thăm. 'Last weekend' -> Quá khứ đơn. Dịch: Cuối tuần trước Phong và Lan đã đi thăm ông bà.", "isCorrect": true }
              ],
              "hint": "Cụm từ 'Last weekend' yêu cầu động từ phải chia ở thì quá khứ đơn (V-ed)."
            },
            {
              "questionNumber": 6,
              "question": "All of us ___________ at home yesterday evening.",
              "answerOptions": [
                { "text": "were", "rationale": "Chính xác! Were: Thì/là/ở (quá khứ, số nhiều). 'All of us' là số nhiều, 'yesterday evening' là quá khứ. Dịch: Tất cả chúng tôi đều ở nhà tối qua.", "isCorrect": true },
                { "text": "was", "rationale": "Sai. Was: Quá khứ số ít. 'All of us' là số nhiều.", "isCorrect": false },
                { "text": "did", "rationale": "Sai. Did: Đã làm. Câu chỉ vị trí (at home) cần động từ to be.", "isCorrect": false },
                { "text": "are", "rationale": "Sai. Are: Hiện tại số nhiều. Sai thì vì có 'yesterday'.", "isCorrect": false }
              ],
              "hint": "Chủ ngữ 'All of us' là số nhiều và thời gian là quá khứ."
            },
            {
              "questionNumber": 7,
              "question": "You have to throw the ball into the net when you play ___________.",
              "answerOptions": [
                { "text": "basketball", "rationale": "Chính xác! Basketball: Bóng rổ. 'Throw into the net' (ném vào lưới) mô tả bóng rổ. Dịch: Bạn phải ném bóng vào rổ khi chơi bóng rổ.", "isCorrect": true },
                { "text": "football", "rationale": "Sai. Football: Bóng đá. Dùng chân đá (kick) vào khung thành (goal).", "isCorrect": false },
                { "text": "tennis", "rationale": "Sai. Tennis: Quần vợt. Dùng vợt đánh bóng qua lưới.", "isCorrect": false },
                { "text": "badminton", "rationale": "Sai. Badminton: Cầu lông. Đánh quả cầu qua lưới.", "isCorrect": false }
              ],
              "hint": "Môn thể thao nào mà người chơi dùng tay ném bóng vào lưới?"
            },
            {
              "questionNumber": 8,
              "question": "Thanh is a good badminton player. I cannot ___________ him.",
              "answerOptions": [
                { "text": "win", "rationale": "Sai. Win: Thắng. Dùng 'win a game/match', không dùng 'win somebody'.", "isCorrect": false },
                { "text": "defeat", "rationale": "Chính xác! Defeat: Đánh bại. 'Defeat + somebody' = Thắng ai đó. Dịch: Tôi không thể đánh bại cậu ấy.", "isCorrect": true },
                { "text": "control", "rationale": "Sai. Control: Kiểm soát. Không phù hợp ngữ cảnh.", "isCorrect": false },
                { "text": "hit", "rationale": "Sai. Hit: Đánh. Mang nghĩa tác động vật lý hoặc đánh bóng.", "isCorrect": false }
              ],
              "hint": "Bạn cần một động từ mang nghĩa 'đánh bại' một đối thủ."
            },
            {
              "questionNumber": 9,
              "question": "Karate is a form of martial ___________.",
              "answerOptions": [
                { "text": "fighting", "rationale": "Sai. Fighting: Sự chiến đấu. Không tạo thành cụm từ cố định.", "isCorrect": false },
                { "text": "skill", "rationale": "Sai. Skill: Kỹ năng. Cụm đúng là 'martial art'.", "isCorrect": false },
                { "text": "sports", "rationale": "Sai. Sports: Thể thao. Karate là môn võ.", "isCorrect": false },
                { "text": "art", "rationale": "Chính xác! Art: Nghệ thuật. 'Martial art' (Võ thuật). Dịch: Karate là một hình thức võ thuật.", "isCorrect": true }
              ],
              "hint": "Cụm từ tiếng Anh cho 'võ thuật' là 'Martial ...'."
            },
            {
              "questionNumber": 10,

        // --- STATE & AUDIO ---
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        // Sound Synthesis (No external files)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Ding sound (High pitch, sine wave)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                
                // Confetti Effect
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00D26A', '#00C9A7', '#8854C0']
                });

            } else if (type === 'wrong') {
                // Buzz sound (Low pitch, sawtooth)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- GAME LOGIC ---

        function renderQuestion() {
            isAnswered = false;
            const q = quizData.questions[currentQuestionIndex];
            
            // Update UI
            document.getElementById('questionNumber').innerText = `Câu ${currentQuestionIndex + 1}/${quizData.questions.length}`;
            document.getElementById('questionText').innerHTML = q.question.replace(/___________/g, "<u>&nbsp;&nbsp;&nbsp;?&nbsp;&nbsp;&nbsp;</u>");
            
            // Progress Bar
            const progress = ((currentQuestionIndex) / quizData.questions.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;

            // Hint
            const hintBox = document.getElementById('hintBox');
            if (q.hint) {
                hintBox.style.display = 'flex';
                document.getElementById('hintText').innerText = q.hint;
            } else {
                hintBox.style.display = 'none';
            }

            // Options
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            
            const letters = ['A', 'B', 'C', 'D'];
            
            q.answerOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerHTML = `<span class="option-letter">${letters[idx]}</span> ${opt.text}`;
                btn.onclick = () => checkAnswer(idx, btn, q);
                grid.appendChild(btn);
            });

            // Reset Explanation & Next Button
            document.getElementById('explanationBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('finishBtn').style.display = 'none';
        }

        function checkAnswer(selectedIndex, btnElement, questionData) {
            if (isAnswered) return;
            isAnswered = true;

            const options = document.querySelectorAll('.btn-option');
            const selectedOpt = questionData.answerOptions[selectedIndex];
            
            // Highlight options
            if (selectedOpt.isCorrect) {
                btnElement.classList.add('correct');
                playSound('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                // Highlight the correct one
                questionData.answerOptions.forEach((opt, idx) => {
                    if (opt.isCorrect) {
                        options[idx].classList.add('correct');
                    }
                });
            }

            // Show Navigation
            if (currentQuestionIndex < quizData.questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'block';
            } else {
                document.getElementById('finishBtn').style.display = 'block';
                document.getElementById('progressBar').style.width = '100%';
            }

            // Build Explanation Content (Ms MS Chí Nên's Corner)
            buildExplanation(questionData);
        }

        function buildExplanation(qData) {
            const expBox = document.getElementById('explanationBox');
            const contentDiv = document.getElementById('explanationContent');
            
            // 1. Phân tích đáp án (Vocab extraction)
            let vocabRows = '';
            let correctAnswerRationale = '';
            
            const letters = ['A', 'B', 'C', 'D'];
            
            qData.answerOptions.forEach((opt, idx) => {
                // Try to extract Meaning from Rationale (simple split by :)
                // Format usually "Word (type): Meaning. Explanation"
                let definition = opt.rationale.split('.')[0] || opt.rationale;
                // Remove "Chính xác! " or "Sai. " prefix
                definition = definition.replace(/^(Chính xác! |Sai. )/, '');

                vocabRows += `
                    <tr>
                        <td>${letters[idx]}. ${opt.text}</td>
                        <td>${definition}</td>
                    </tr>
                `;

                if (opt.isCorrect) {
                    correctAnswerRationale = opt.rationale.replace('Chính xác! ', '');
                }
            });

            // 2. Full Content
            contentDiv.innerHTML = `
                <h4>📝 Phân tích từ vựng:</h4>
                <table class="vocab-table">
                    <thead>
                        <tr>
                            <th>Đáp án</th>
                            <th>Giải nghĩa & Ngữ pháp</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${vocabRows}
                    </tbody>
                </table>

                <h4>✅ Tại sao chọn đáp án đúng?</h4>
                <p style="color: var(--primary-color); font-weight: 600;">${correctAnswerRationale}</p>
                
                <p style="margin-top: 10px; font-style: italic; font-size: 0.9rem; color: #7f8c8d;">
                    *Dịch câu hỏi: "${translateQuestion(qData.question)}"
                </p>
            `;

            expBox.style.display = 'block';
        }
        
        // Helper to guess translation (Mocking translation for this demo based on context)
        // In a real app, translation would be in the JSON. Here I assume the rationale contains translated context.
        function translateQuestion(qText) {
             // This is a placeholder since we don't have separate translation fields in JSON.
             // But the 'rationale' text usually contains the full translation "Dịch: ..."
             return "Xem phần dịch chi tiết ở mục giải thích trên.";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderQuestion();
        }

        function showSummary() {
            document.getElementById('summaryPopup').style.display = 'flex';
            document.getElementById('finalScore').innerText = `${score}/${quizData.questions.length}`;
            
            const percentage = (score / quizData.questions.length) * 100;
            const title = document.getElementById('finalTitle');
            const msg = document.getElementById('finalMessage');

            if (percentage === 100) {
                title.innerText = "Xuất sắc! 🌟";
                msg.innerText = "Bạn đã nắm vững toàn bộ kiến thức Unit 8!";
                confetti({ particleCount: 200, spread: 100 });
            } else if (percentage >= 80) {
                title.innerText = "Giỏi lắm! 🎉";
                msg.innerText = "Kết quả rất tốt, chỉ sai một chút xíu thôi.";
            } else if (percentage >= 50) {
                title.innerText = "Cố gắng lên! 💪";
                msg.innerText = "Bạn đã hiểu bài, nhưng cần ôn lại từ vựng nhé.";
            } else {
                title.innerText = "Cần luyện tập thêm 📚";
                msg.innerText = "Hãy xem lại phần giải thích của cô MS Chí Nên nhé.";
            }
        }

        // Initialize
        renderQuestion();

    </script>
