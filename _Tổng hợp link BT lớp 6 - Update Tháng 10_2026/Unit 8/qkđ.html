<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms MS Chí Nên - Unit 8: Sports & Games (Past Simple)</title>
    <!-- Google Fonts: Quicksand for friendliness -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-teal: #00C9A7;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-pastel: #F0F3F9;
            --text-dark: #2C3E50;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-pastel);
            background-image: radial-gradient(#dbe2ef 15%, transparent 16%), radial-gradient(#dbe2ef 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Style */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--primary-purple);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: var(--primary-purple);
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-header {
            color: #666;
            margin-top: 5px;
            font-size: 1rem;
        }

        /* Quiz Container */
        .quiz-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Question Card */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            position: relative;
            transition: transform 0.3s ease;
            border: 1px solid #eee;
        }

        .question-number {
            background: var(--primary-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .question-hint {
            color: var(--primary-teal);
            font-style: italic;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: block;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 5px 0 #dcdcdc;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary-purple);
            color: var(--primary-purple);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #dcdcdc;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-green) !important;
            color: white !important;
            border-color: #00b85c !important;
            box-shadow: 0 5px 0 #008f47 !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-red) !important;
            color: white !important;
            border-color: #ff2e40 !important;
            box-shadow: 0 5px 0 #c41e2e !important;
            animation: shake 0.5s;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            background: #e8fcf6;
            border-left: 5px solid var(--primary-teal);
            border-radius: 10px;
            display: none; /* Hidden by default */
            animation: slideDown 0.4s ease-out;
        }

        .explanation-box.visible {
            display: block;
        }

        .exp-title {
            font-weight: 800;
            color: var(--primary-teal);
            display: block;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .exp-content p {
            margin: 5px 0;
            line-height: 1.6;
        }

        .exp-label {
            font-weight: bold;
            color: var(--primary-purple);
        }

        /* Submit Section */
        .submit-section {
            text-align: center;
            margin: 40px 0;
        }

        .submit-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #5f368a;
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 4px 0 #5f368a;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Result Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: zoomIn 0.4s;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            background: var(--primary-purple);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 0 0 5px var(--primary-purple);
        }

        @keyframes zoomIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .question-text { font-size: 1.1rem; }
            .option-btn { font-size: 1rem; padding: 12px; }
        }
    </style>
</head>

    <header>
        <h1>Ms MS Chí Nên (ULIS)</h1>
        <div class="sub-header">Unit 8: Sports & Games - Past Simple (To Be vs Verb)</div>

    <div class="quiz-container" id="quiz-container">

    <div class="submit-section">

    <!-- Result Modal -->
    <div class="modal-overlay" id="result-modal">

            <div class="score-circle" id="score-display">0/30</div>

    <script>
        // --- DATA SOURCE ---
        const quizData = [
            {
                "questionNumber": 1,
                "question": "The football match ______ very exciting yesterday.",
                "hint": "Exciting (kịch tính) là tính từ. Trận đấu (số ít).",

                    { "text": "was", "isCorrect": true, "meaning": "đã (thì quá khứ, số ít)" },

                "explanationText": "Chính xác! 'Exciting' là TÍNH TỪ. 'The football match' là danh từ số ít -> Dùng 'was'.\n• Dịch: Trận bóng đá hôm qua rất kịch tính."
            },
            {

                "question": "______ you play badminton with Phong last Sunday?",

                    { "text": "Did", "isCorrect": true, "meaning": "đã (trợ động từ)" },
                    { "text": "Were", "isCorrect": false, "meaning": "đã (to be số nhiều)" },
                    { "text": "Was", "isCorrect": false, "meaning": "đã (to be số ít)" },
                    { "text": "Do", "isCorrect": false, "meaning": "làm (hiện tại)" }

                "explanationText": "Chính xác! Có động từ thường 'play' -> Dùng trợ động từ 'Did'.\n• Dịch: Bạn có chơi cầu lông với Phong chủ nhật trước không?"
            },
            {
                "questionNumber": 3,

                "options": [
                    { "text": "did", "isCorrect": false, "meaning": "đã (trợ động từ)" },
                    { "text": "was", "isCorrect": true, "meaning": "là (quá khứ, số ít)" },
                    { "text": "were", "isCorrect": false, "meaning": "là (quá khứ, số nhiều)" },
                    { "text": "is", "isCorrect": false, "meaning": "là (hiện tại - Pelé đã mất)" }

                "explanationText": "Chính xác! Giới thiệu nghề nghiệp/danh tính (football player) -> Dùng To Be. Pelé là 1 người -> 'was'.\n• Dịch: Pelé là một cầu thủ bóng đá nổi tiếng đến từ Brazil."
            },
            {

                    { "text": "didn't", "isCorrect": true, "meaning": "không (trợ động từ quá khứ)" },
                    { "text": "don't", "isCorrect": false, "meaning": "không (trợ động từ hiện tại)" },
                    { "text": "wasn't", "isCorrect": false, "meaning": "không (to be số ít)" }

                "explanationText": "Chính xác! Phủ định động từ 'go' -> Dùng 'didn't'.\n• Dịch: Chúng tôi đã không đi đến phòng tập hôm qua vì trời mưa."
            },
            {
                "questionNumber": 5,
                "question": "Where ______ your new racket?",
                "hint": "Hỏi về vị trí của cái vợt (số ít).",
                "options": [
                    { "text": "did", "isCorrect": false, "meaning": "đã (trợ động từ)" },
                    { "text": "was", "isCorrect": true, "meaning": "đã ở (quá khứ, số ít)" },
                    { "text": "were", "isCorrect": false, "meaning": "đã ở (quá khứ, số nhiều)" },

                "explanationText": "Chính xác! Racket (cái vợt) là số ít. Hỏi vị trí -> Dùng 'was'.\n• Dịch: Cái vợt mới của bạn đã ở đâu?"

            {

        let score = 0;
        const totalQuestions = quizData.length;

        // --- AUDIO SOUNDS ---
        const correctSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3');
        // A softer "error" sound to avoid scaring kids
        const wrongSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-bass-buzzer-948.mp3'); 

        // --- RENDER LOGIC ---
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            quizData.forEach((q, index) => {
                // Parse the rationale from the input to create structured parts
                // The input rationale usually comes as "Chính xác! ... \n• Dịch: ..."
                // We split it to format nicely.
                let rawExp = q.explanationText;
                let translation = "";
                let reasoning = "";

                if(rawExp.includes("• Dịch:")) {
                    const parts = rawExp.split("• Dịch:");
                    reasoning = parts[0].replace("Chính xác!", "").trim();
                    translation = parts[1].trim();
                } else {
                    reasoning = rawExp;
                    translation = "Dịch câu hỏi ở trên.";
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.id = `q-${index}`;

                let optionsHtml = '';
                q.options.forEach((opt, i) => {
                    optionsHtml += `
                        <button class="option-btn" onclick="checkAnswer(this, ${index}, ${opt.isCorrect})">
                            ${String.fromCharCode(65 + i)}. ${opt.text}
                        </button>
                    `;
                });

                // Prepare explanation HTML
                let optionsAnalysis = '<ul style="margin: 0; padding-left: 20px; color: #555;">';
                q.options.forEach((opt, i) => {
                    optionsAnalysis += `<li><b>${String.fromCharCode(65 + i)}. ${opt.text}</b>: ${opt.meaning}</li>`;
                });
                optionsAnalysis += '</ul>';

                card.innerHTML = `
                    <div class="question-number">Câu ${q.questionNumber}</div>
                    <div class="question-text">${q.question}</div>
                    <span class="question-hint">💡 Gợi ý: ${q.hint}</span>
                    <div class="options-grid">
                        ${optionsHtml}
                    </div>
                    
                    <div class="explanation-box" id="exp-${index}">
                        <span class="exp-title">👩‍🏫 Ms MS Chí Nên giải thích:</span>
                        <div class="exp-content">
                            <p><span class="exp-label">1. Dịch câu hỏi:</span> "${translation}"</p>
                            <p><span class="exp-label">2. Phân tích đáp án:</span></p>
                            ${optionsAnalysis}
                            <p><span class="exp-label">3. Tại sao chọn đáp án đúng?</span></p>
                            <p>${reasoning}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- INTERACTION LOGIC ---
        function checkAnswer(btn, qIndex, isCorrect) {
            const card = document.getElementById(`q-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const expBox = document.getElementById(`exp-${qIndex}`);

            // Prevent multiple clicks
            if (card.getAttribute('data-answered') === 'true') return;
            card.setAttribute('data-answered', 'true');

            // Disable all buttons in this card
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                // UI
                btn.classList.add('correct');
                score++;
                
                // Sound
                correctSound.currentTime = 0;
                correctSound.play().catch(e => console.log("Audio play failed interaction required"));
                
                // Confetti Effect
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00C9A7', '#8854C0', '#F39C12']
                });

            } else {
                // UI
                btn.classList.add('wrong');
                
                // Highlight correct answer
                const correctBtn = Array.from(buttons).find(b => 
                    quizData[qIndex].options.find(opt => opt.text === b.innerText.split('. ')[1]).isCorrect
                );
                if(correctBtn) correctBtn.classList.add('correct');

                // Sound & Shake
                wrongSound.currentTime = 0;
                wrongSound.play().catch(e => console.log("Audio play failed"));
            }

            // Show Explanation immediately
            expBox.classList.add('visible');
        }

        // --- FINISH & SCORE ---
        function finishQuiz() {
            // Check if all questions answered (Optional, but good for UX)
            // Here we just show the score regardless
            
            const modal = document.getElementById('result-modal');
            const scoreDisplay = document.getElementById('score-display');
            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-message');

            scoreDisplay.textContent = `${score}/${totalQuestions}`;
            modal.style.display = 'flex';

            // Custom messages based on score
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                title.textContent = "XUẤT SẮC! 🏆";
                msg.textContent = "Em đã nắm vững toàn bộ kiến thức!";
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
            } else if (percentage >= 80) {
                title.textContent = "GIỎI QUÁ! 🌟";
                msg.textContent = "Em làm bài rất tốt, chỉ sai một chút thôi.";
            } else if (percentage >= 50) {
                title.textContent = "CỐ LÊN NHÉ! 💪";
                msg.textContent = "Em đã hiểu bài nhưng cần ôn tập thêm phần ngữ pháp.";
            } else {
                title.textContent = "CẦN LUYỆN TẬP THÊM 📚";
                msg.textContent = "Đừng nản lòng, hãy xem lại phần giải thích chi tiết nhé!";
            }
        }

        // Initialize
        window.onload = renderQuiz;

    </script>
