<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐠 SECOND MIDTERM TEST 2 · P1 — Ms MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B2545;--deep:#023E73;--coral:#FF6B6B;--peach:#FFD166;--violet:#7B61FF;
  --gold:#FFD166;--teal:#06D6A0;--good:#0E9F6E;--bad:#E63946;--glass:rgba(255,255,255,.86)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,#BFEFFF 0%,#4CC9F0 16%,#4361EE 38%,#3A0CA3 60%,#170B3B 82%,#05001A 100%);
  background-size:100% 220%;background-attachment:fixed;animation:sky 28s ease-in-out infinite alternate}
@keyframes sky{from{background-position:50% 0%}to{background-position:50% 100%}}
/* ── TIA SÁNG XUYÊN MẶT NƯỚC ── */
.sun{position:fixed;left:50%;top:-6vh;transform:translateX(-50%);width:60vw;max-width:520px;height:78vh;
  z-index:0;pointer-events:none;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 55%,transparent 85%);
  animation:glow 7s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.85}}
/* ── RẠN SAN HÔ + RONG BIỂN ── */
.city{position:fixed;left:0;right:0;bottom:0;height:34vh;min-height:210px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:4px;opacity:.96}
.bd{position:relative;flex:0 0 auto;background:linear-gradient(180deg,#FF8FA3,#C9184A)}
.bd::before{content:'';position:absolute;left:0;right:0;top:0;height:100%;
  background-image:radial-gradient(circle,rgba(255,255,255,.85) 1.6px,transparent 1.8px);
  background-size:13px 16px;background-position:5px 9px;opacity:.5;animation:win 4s steps(2) infinite}
@keyframes win{0%,100%{opacity:.4}50%{opacity:.8}}
.bd.spire{background:linear-gradient(180deg,#FFD166,#EF8354)}
.bd.spire2{background:linear-gradient(180deg,#7B61FF,#4C2E96)}
.tr2{position:relative;flex:0 0 auto;width:10px;align-self:flex-end;
  background:linear-gradient(0deg,#06D6A0,#0B7A5C);border-radius:6px 6px 2px 2px;
  animation:sway 3.4s ease-in-out infinite alternate;transform-origin:bottom center}
.city2{position:fixed;left:0;right:0;bottom:0;height:24vh;min-height:130px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:4px;opacity:.55;filter:blur(.6px)}
.city2 .bd{background:linear-gradient(180deg,#4CC9F0,#3A86FF)}
.city2 .tr2{background:linear-gradient(0deg,#4CC9F0,#3A0CA3)}
.swf{position:fixed;bottom:2vh;z-index:0;pointer-events:none;font-size:20px;
  animation:swim linear infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
@keyframes swim{0%{transform:translateX(-10vw) scaleX(1)}49%{transform:translateX(100vw) scaleX(1)}
  50%{transform:translateX(100vw) scaleX(-1)}99%{transform:translateX(-10vw) scaleX(-1)}
  100%{transform:translateX(-10vw) scaleX(1)}}
/* ── BONG BÓNG, CÁ & SỨA PHÁT SÁNG ── */
.fly{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fo{position:absolute;bottom:-90px;animation:up linear infinite}
.fo i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes up{0%{transform:translateY(0);opacity:0}9%{opacity:.95}86%{opacity:.75}
  100%{transform:translateY(-118vh);opacity:0}}
@keyframes sway{from{transform:translateX(-16px) rotate(-7deg)}to{transform:translateX(16px) rotate(7deg)}}
.bal{position:relative;width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85),rgba(255,255,255,.05) 45%,
   color-mix(in srgb, var(--c1) 55%, transparent) 70%);
  border:1.5px solid rgba(255,255,255,.55);box-shadow:0 0 10px rgba(76,201,240,.5),inset 0 0 8px rgba(255,255,255,.4)}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:16px 14px 30vh}
h1,h2,.pill,.qn,.sbtn,.ck{font-family:'Fredoka',sans-serif;font-weight:700}
.gl{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:2px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 10px 30px rgba(3,20,50,.3)}
.hdr{padding:20px 20px 17px;text-align:center;margin:8px 0 18px}
.hdr h1{font-size:clamp(18px,4.1vw,29px);line-height:1.25;
  background:linear-gradient(90deg,var(--deep),var(--teal),var(--violet),var(--deep));
  background-size:280% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:shim 6s linear infinite}
@keyframes shim{0%{background-position:0%}100%{background-position:280%}}
.hdr .sub{display:inline-block;margin-top:8px;font-family:'Fredoka',sans-serif;font-size:.92rem;color:#fff;
  background:linear-gradient(135deg,var(--teal),var(--violet));padding:3px 16px;border-radius:999px}
.hdr p{font-size:.8rem;font-weight:700;color:var(--deep);margin-top:9px;line-height:1.75}
.sb{position:sticky;top:8px;z-index:9;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:18px;
  border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border:2px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(3,20,50,.24)}
.sb b{font-family:'Fredoka',sans-serif;font-size:1.14rem;color:var(--deep)}
.tr{flex:1;height:11px;background:rgba(6,214,160,.18);border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--violet),var(--coral));transition:width .45s}
.sec{padding:20px 17px 19px;margin-bottom:24px}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.pill{color:#fff;border-radius:999px;padding:3px 15px;font-size:.9rem;box-shadow:0 3px 10px rgba(3,20,50,.28)}
.st h2{font-size:1.08rem;color:var(--deep);font-family:'Fredoka',sans-serif}
.si{font-size:.85rem;font-weight:700;color:#4A6B8A;font-style:italic;margin:2px 0 15px;line-height:1.8}
.q{background:rgba(255,255,255,.9);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  border-radius:16px;padding:18px 18px 19px;margin-bottom:18px;
  box-shadow:0 4px 14px rgba(3,20,50,.16);border-left:5px solid var(--teal)}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff;
  border-radius:10px;min-width:32px;text-align:center;padding:1px 8px;margin-right:8px;font-size:.92rem}
.qt{font-weight:700;font-size:1.15rem;line-height:2.05}
.qt .bl{display:inline-block;min-width:100px;border-bottom:3px solid var(--violet);text-align:center;
  color:var(--deep);font-weight:900}
.src{background:#EAF7FF;border-left:4px solid var(--teal);border-radius:0 11px 11px 0;padding:10px 13px;
  margin-top:9px;font-weight:800;font-size:1.05rem;line-height:1.9}
.cue{background:#FFF8E6;border:2px dashed var(--gold);border-radius:11px;padding:10px 13px;margin-top:9px;
  font-weight:800;font-size:1.05rem;line-height:1.9;color:#8A5A00}
.tg{display:inline-block;background:#EEE9FF;border:1.5px solid var(--violet);color:#4B2FBF;border-radius:8px;
  padding:0 9px;font-size:.78rem;margin-left:6px;font-weight:800}
u{background:#B8F2E6;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800}
.ob u,.og u,.qt u{background:#9BE8D8;border-radius:3px;padding:0 1px;margin:0 -1px;font-weight:900;
  text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;text-decoration-color:var(--deep)}
/* ── TÌM & SỬA LỖI ── */
.segs{margin-top:13px;font-weight:700;font-size:1.08rem;line-height:2.6;
  background:#EAF7FF;border-left:4px solid var(--teal);border-radius:0 11px 11px 0;padding:12px 15px}
.sg{display:inline-block;background:#fff;border:2px solid var(--violet);border-radius:10px;padding:2px 9px;
  margin:0 2px;font-weight:800;font-size:1.02rem;cursor:pointer;transition:.14s;color:#4B2FBF;
  box-shadow:0 2px 5px rgba(123,97,255,.2)}
.sg b{display:inline-block;background:var(--violet);color:#fff;border-radius:6px;padding:0 6px;margin-right:6px;
  font-size:.75rem;font-family:'Fredoka',sans-serif}
.sg:hover:not(.dn){transform:translateY(-2px);background:#F1EEFF}
.sg.sel{border-color:var(--gold);background:#FFF8E6;box-shadow:0 0 0 3px rgba(255,209,102,.4)}
.sg.dn{cursor:default;transform:none}
.sg.sgok{background:#D6F5E6;border-color:var(--good);color:#08663f}.sg.sgok b{background:var(--good)}
.sg.sgno{background:#FFE3E3;border-color:var(--bad);color:#96140f}.sg.sgno b{background:var(--bad)}
.sg.sgdim{opacity:.4}
.fz{max-height:0;overflow:hidden;transition:max-height .32s ease;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fz.open{max-height:220px;margin-top:12px}
.fzl{font-weight:900;color:#8A5A00;font-size:.95rem;width:100%}
.hint{margin-top:10px;background:#FFF8E6;border:2px dashed var(--gold);border-radius:10px;padding:8px 12px;
  font-size:.91rem;font-weight:700;color:#8A5A00;line-height:1.8}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:680px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.og{grid-template-columns:1fr}}
.ob{background:#FFFDFE;border:2px solid rgba(123,97,255,.4);border-radius:14px;padding:12px 14px;
  font-family:'Nunito';font-size:1.08rem;font-weight:800;cursor:pointer;transition:.15s;text-align:center;
  line-height:1.6;color:var(--ink);box-shadow:0 3px 8px rgba(123,97,255,.14)}
.ob:hover:not(.dn){transform:translateY(-2px) scale(1.02);background:#F1EEFF;border-color:var(--violet)}
.ob.ok{background:#D6F5E6;border-color:var(--good);color:#08663f}
.ob.no{background:#FFE3E3;border-color:var(--bad);color:#96140f}
.ob.dim{opacity:.42}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ti{flex:1;min-width:200px;padding:10px 14px;border:2px solid rgba(123,97,255,.4);border-radius:11px;
  font-family:'Nunito';font-size:1rem;font-weight:800;outline:none;background:#FFFDFE;color:var(--ink)}
.ti::placeholder{color:#a8b8d8}
.ti:focus{border-color:var(--violet);background:#fff}
.ti.ok{border-color:var(--good);background:#D6F5E6}.ti.no{border-color:var(--bad);background:#FFE3E3}
.ck{background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff;border:none;border-radius:11px;
  padding:10px 20px;font-size:.97rem;cursor:pointer;box-shadow:0 4px 12px rgba(123,97,255,.4);white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.42;cursor:default}
.ex{display:none;margin-top:13px;background:#FFFDFE;border:1.5px solid rgba(123,97,255,.3);border-radius:14px;
  padding:15px 16px;font-size:1rem;line-height:1.85}
.ex.show{display:block}
.kb{background:#D6F5E6;border:1.5px solid var(--good);border-radius:9px;padding:8px 12px;margin-bottom:10px;
  font-weight:900;color:#08663f;line-height:1.75}
.vnt{background:#FFF1DE;border-left:4px solid var(--peach);border-radius:0 10px 10px 0;padding:9px 13px;
  margin-bottom:11px;font-weight:800;color:#8A4B00;line-height:1.85}
.ex ol{padding-left:20px}
.ex ol li{margin-bottom:12px;line-height:1.9}
.ex ol li:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#fff;border:1.5px solid #DCE9F7;border-radius:10px;padding:8px 11px;line-height:1.7;font-weight:700}
.p-word{color:#1D4ED8;font-weight:800}
.hl-green{color:var(--good);font-weight:900}
.hl-red{color:var(--bad);font-weight:900}
.wt{background:#EEE9FF;color:#4B2FBF;padding:1px 6px;border-radius:5px;font-size:.79em;font-weight:800;margin:0 4px}
.p-mean{color:#C2410C;font-weight:700}
.p-phonetic{color:#4B2FBF;background:rgba(75,47,191,.09);border-radius:4px;padding:1px 6px;
  font-family:'Courier New',monospace;font-size:.9em;font-weight:800}
.p-grammar{text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2.5px;
  text-underline-offset:3px;font-weight:700}
.note{background:#EEF2F7;border-left:4px solid #7A8FA6;border-radius:0 8px 8px 0;padding:8px 12px;margin-top:9px;
  font-size:.9rem;font-weight:700;color:#3D5166;line-height:1.75}
.sub{text-align:center;margin-top:24px}
.sbtn{background:linear-gradient(135deg,var(--teal),var(--violet),var(--coral));color:#fff;border:none;
  border-radius:999px;padding:13px 40px;font-size:1.18rem;cursor:pointer;box-shadow:0 8px 22px rgba(123,97,255,.45)}
.sbtn:hover{transform:translateY(-3px)}
.ov{position:fixed;inset:0;background:rgba(5,0,26,.72);z-index:99;display:none;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(5px)}
.ov.on{display:flex}
.mb{background:rgba(255,255,255,.96);border-radius:22px;box-shadow:0 14px 44px rgba(3,20,50,.4);padding:24px;
  width:420px;max-width:96%;text-align:center;border:2px solid #fff;max-height:90vh;overflow-y:auto}
.mb h2{font-size:1.3rem;color:var(--deep);margin-bottom:11px}
.mb input{width:100%;padding:11px;border:2px solid rgba(123,97,255,.4);border-radius:11px;font-family:'Nunito';
  font-weight:800;font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#FFE3E3;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Fredoka',sans-serif;font-size:1.2rem;color:var(--deep);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Fredoka',sans-serif;font-size:2.5rem;color:var(--teal)}
.mb .rt{font-weight:900;color:#4B2FBF;font-size:1.05rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.92rem;line-height:1.65;margin-bottom:10px;color:#5A4A66}
.mb img{width:100%;max-width:250px;border-radius:13px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="sun"></div>
<div class="city2" id="city2"></div>
<div class="city" id="city"></div>
<div class="fly" id="fly"></div>
<div class="wrap">
  <div class="hdr gl">
    <h1>🐠 SECOND MIDTERM TEST 2</h1>
    <div class="sub">PART 1 · DEEP-SEA EXPEDITION</div>
    <p>🎓 Giáo viên tạo: Ms MS Chí Nên &nbsp;·&nbsp; Phần <b>I–VI</b> + <b>IX–XI</b><br>
    28 câu &nbsp;·&nbsp; <i>(bỏ phần VII — đoạn văn điền từ &amp; VIII — bài đọc hiểu theo yêu cầu)</i></p>
  </div>
  <div class="sb">🐬 <b><span id="sc">0</span>/<span id="tt">0</span></b>
    <div class="tr"><div class="fl" id="fb"></div></div><span id="md">💪</span></div>
  <div id="app"></div>
  <div class="sub"><button class="sbtn" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
</div>
<div class="ov" id="nOv"><div class="mb"><h2>✍️ Nhập tên của con</h2>
  <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="em" id="nEr">⚠️ Con chưa nhập tên kìa!</div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="showResult()">🚀 Xem kết quả</button></div></div>
<div class="ov" id="rOv"><div class="mb"><div class="gr" id="rG"></div>
  <div class="rs" id="rS"></div><div class="rt" id="rT"></div><img id="rI" alt=""><div class="rm" id="rM"></div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="location.reload()">🔄 Làm lại</button></div></div>

<script>
/* ══ RẠN SAN HÔ + RONG BIỂN + BONG BÓNG + CÁ + SỨA ══ */
(function(){
 function reef(el,n,minH,maxH,minW,maxW){
  for(let i=0;i<n;i++){
   if(i%5===4){const t=document.createElement('div');t.className='tr2';
    t.style.height=(minH*0.7).toFixed(0)+'px';t.style.animationDelay=(-Math.random()*3).toFixed(1)+'s';
    el.appendChild(t);continue}
   const b=document.createElement('div');b.className='bd'+(i%9===3?' spire':(i%9===7?' spire2':''));
   b.style.width=(minW+Math.random()*(maxW-minW)).toFixed(0)+'px';
   b.style.height=(minH+Math.random()*(maxH-minH)).toFixed(0)+'px';
   b.style.borderRadius=(i%2===0?'60% 40% 55% 45%/55% 65% 35% 45%':'45% 55% 40% 60%/60% 50% 50% 40%');
   el.appendChild(b);
  }
 }
 reef(document.getElementById('city2'),30,40,100,22,50);
 reef(document.getElementById('city'),26,60,190,26,60);
 for(let i=0;i<6;i++){
  const f=document.createElement('div');f.className='swf';
  f.textContent=['🐠','🐟','🐡','🐢'][i%4];
  f.style.bottom=(2+Math.random()*22)+'vh';
  f.style.animationDuration=(22+Math.random()*20).toFixed(1)+'s';
  f.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  document.body.appendChild(f);
 }
 const L=document.getElementById('fly');
 const C=[['#4CC9F0','#7B61FF'],['#06D6A0','#4CC9F0'],['#FFD166','#FF6B6B'],
          ['#7B61FF','#06D6A0'],['#4361EE','#4CC9F0']];
 for(let i=0;i<22;i++){
  const d=document.createElement('div');d.className='fo';
  const inner=document.createElement('i');
  if(i%6===5){inner.textContent=['🐠','🐟','🐡'][i%3];
   inner.style.fontSize=(16+Math.random()*14).toFixed(0)+'px';}
  else if(i%9===4){inner.textContent='🪼';inner.style.fontSize=(20+Math.random()*16).toFixed(0)+'px';
   inner.style.filter='drop-shadow(0 0 6px rgba(123,97,255,.7))';}
  else{const b=document.createElement('div');b.className='bal';
   b.style.setProperty('--s',(9+Math.random()*18).toFixed(0)+'px');
   b.style.setProperty('--c1',C[i%C.length][0]);b.style.setProperty('--c2',C[i%C.length][1]);
   inner.appendChild(b);}
  d.style.left=(Math.random()*93)+'%';
  d.style.animationDuration=(15+Math.random()*16).toFixed(1)+'s';
  d.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  inner.style.animationDuration=(3+Math.random()*3).toFixed(1)+'s';
  d.appendChild(inner);L.appendChild(d);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#FFD166','#FF6B6B','#7B61FF','#06D6A0','#4CC9F0'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fil(sec,num,q,correct,accept,ex,ph){Q.push({t:'fill',sec,num,q,correct,accept,ex,ph:ph||'Điền...'})}
function fxq(sec,num,pre,parts,letter,corr,accept,ex){Q.push({t:'fix',sec,num,pre,parts,letter,corr,accept,ex})}
function T(w,ty,m){return "<div><span class='p-word'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TG(w,ty,m){return "<div><span class='hl-green'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TP(w,ipa,m){return "<div><span class='p-word'>"+w+"</span> <span class='p-phonetic'>"+ipa+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TPG(w,ipa,m){return "<div><span class='hl-green'>"+w+"</span> <span class='p-phonetic'>"+ipa+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function EX(kb,vn,cells,right,wrong){
 return '<div class="kb">✅ '+kb+'</div><div class="vnt">💬 <b>Dịch:</b> '+vn+'</div>'+
  '<ol><li><b>🔎 Phân tích đáp án:</b><div class="grid2">'+cells+'</div></li>'+
  '<li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class="p-grammar">'+right+'</span></li>'+
  '<li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class="p-grammar">'+wrong+'</span></li></ol>'}

/* ═════ I — PHÁT ÂM (2) ═════ */
const s1=(n,o,a,vn,c,r,w)=>mcq('S1',n,'<b>'+n+'.</b> Chọn từ có phần gạch chân phát âm KHÁC 3 từ còn lại:',a,o,
 EX(a.replace(/<\/?u>/g,''),vn,c,r,w),'c4');
s1(1,['homet<u>ow</u>n','tomorr<u>ow</u>','rainb<u>ow</u>','pill<u>ow</u>'],'homet<u>ow</u>n',
 'Chọn từ có phần “ow” được gạch chân phát âm khác 3 từ còn lại. (hometown, tomorrow, rainbow, pillow)',
 TPG('homet<u>ow</u>n','/ˈhəʊmtaʊn/','quê nhà, quê hương')+TP('tomorr<u>ow</u>','/təˈmɒrəʊ/','ngày mai')+
 TP('rainb<u>ow</u>','/ˈreɪnbəʊ/','cầu vồng')+TP('pill<u>ow</u>','/ˈpɪləʊ/','cái gối'),
 '<b>tomorrow, rainbow, pillow</b> đều đọc “ow” là <b>/əʊ/</b>. Riêng <b>hometown</b> là TỪ GHÉP (home + town), '+
 '“ow” ở đây thuộc âm tiết “town” /taʊn/ nên đọc <b>/aʊ/</b> → khác 3 từ còn lại.',
 'Bẫy: cả 4 từ đều có “ow” ở cuối nên rất dễ đoán nhầm là giống nhau. Ghi nhớ: TỪ GHÉP (compound word) như '+
 'hometown thường giữ nguyên âm gốc /aʊ/ của “town”, khác với đuôi “-ow” thông thường /əʊ/ trong tomorrow/rainbow/pillow.');
s1(2,['tenni<u>s</u>','vi<u>s</u>it','<u>s</u>wan','expen<u>s</u>ive'],'vi<u>s</u>it',
 'Chọn từ có phần “s” được gạch chân phát âm khác 3 từ còn lại. (tennis, visit, swan, expensive)',
 TP('tenni<u>s</u>','/ˈtenɪs/','môn quần vợt')+TPG('vi<u>s</u>it','/ˈvɪzɪt/','thăm, ghé thăm')+
 TP('<u>s</u>wan','/swɒn/','con thiên nga')+TP('expen<u>s</u>ive','/ɪkˈspensɪv/','đắt tiền'),
 '<b>tennis, swan, expensive</b> đều đọc “s” là âm <b>/s/</b> (vô thanh). Riêng <b>visit</b> đọc “s” là <b>/z/</b> '+
 '(hữu thanh, do đứng giữa 2 nguyên âm “i–i”).',
 'Bẫy: chữ “s” thường được mặc định là /s/, nhưng khi đứng GIỮA HAI NGUYÊN ÂM (vi-s-it) rất dễ chuyển thành âm '+
 'hữu thanh /z/, giống các từ present /ˈprezənt/, music /ˈmjuːzɪk/.');

/* ═════ II — TỪ KHÁC LOẠI (2) ═════ */
const s2=(n,o,a,vn,c,r,w)=>mcq('S2',n,'<b>'+n+'.</b> Chọn từ KHÁC LOẠI với 3 từ còn lại:',a,o,
 EX(a,vn,c,r,w),'c4');
s2(3,['court','viewer','field','pool'],'viewer',
 'Chọn từ khác loại với 3 từ còn lại. (court, viewer, field, pool)',
 T('court','n','sân (chơi tennis/cầu lông…) — một ĐỊA ĐIỂM chơi thể thao')+
 TG('viewer','n','người xem (một NGƯỜI, không phải địa điểm)')+
 T('field','n','sân (bóng đá, điền kinh…) — một ĐỊA ĐIỂM')+T('pool','n','bể bơi — một ĐỊA ĐIỂM'),
 '<b>court, field, pool</b> đều là ĐỊA ĐIỂM để chơi/tập một môn thể thao cụ thể; <b>viewer</b> là một NGƯỜI xem, '+
 'khác hẳn về nghĩa.',
 'Cả 4 đều là danh từ (n) nên phải xét theo Ý NGHĨA: 3 từ kia chỉ NƠI CHỐN, còn “viewer” chỉ CON NGƯỜI.');
s2(4,['statue','tower','temple','film star'],'film star',
 'Chọn từ khác loại với 3 từ còn lại. (statue, tower, temple, film star)',
 T('statue','n','bức tượng — một CÔNG TRÌNH/vật thể')+T('tower','n','tòa tháp — một CÔNG TRÌNH')+
 T('temple','n','ngôi đền — một CÔNG TRÌNH')+TG('film star','n','ngôi sao điện ảnh (một NGƯỜI, không phải công trình)'),
 '<b>statue, tower, temple</b> đều là những CÔNG TRÌNH/địa danh du khách đến tham quan; <b>film star</b> là một '+
 'CON NGƯỜI (diễn viên nổi tiếng).',
 'Bẫy: “film star” cũng có thể gợi liên tưởng đến điểm tham quan (như đại lộ danh vọng), nhưng bản thân từ này '+
 'chỉ MỘT NGƯỜI, khác hẳn nhóm công trình kiến trúc.');

/* ═════ III — TRẮC NGHIỆM (10) ═════ */
const s3=(n,s,a,o,vn,c,r,w,cl)=>mcq('S3',n,'<b>'+n+'.</b> '+s,a,o,EX(a,vn,c,r,w),cl||'c4');
s3(5,'You run so fast! Do you want to take <span class="bl">?</span> in the 200m race on Sports Day?','part',
 ['care','place','part','note'],
 'Bạn chạy nhanh thế! Bạn có muốn tham gia cuộc đua 200m vào Ngày Hội thao không?',
 T('care','n','sự chăm sóc, cẩn thận (take care = cẩn thận)')+
 T('place','n','nơi chốn (take place = diễn ra — dùng cho SỰ KIỆN, không phải người)')+
 TG('part','n','phần (take part IN st = tham gia vào cái gì)')+T('note','n','ghi chú (take note = ghi chú)'),
 'Cụm cố định <b>take part IN + hoạt động</b> = THAM GIA vào hoạt động đó → phù hợp với việc “muốn tham gia cuộc đua”.',
 '“take place” ✘ nghĩa là “diễn ra” (dùng cho sự kiện tự nó xảy ra, không phải cho người tham gia). “take care” ✘ '+
 'và “take note” ✘ đều không đi cùng giới từ “in” theo nghĩa tham gia.');
s3(6,'Hide-and-seek is a popular <span class="bl">?</span> for children around the world.','game',
 ['sport','game','competition','tournament'],
 'Trốn tìm là một trò chơi phổ biến đối với trẻ em trên khắp thế giới.',
 T('sport','n','môn thể thao (cần luật thi đấu chính thức, dụng cụ…)')+
 TG('game','n','trò chơi (hoạt động giải trí đơn giản, không cần luật chính thức)')+
 T('competition','n','cuộc thi (có người thắng thua, ban giám khảo)')+
 T('tournament','n','giải đấu (gồm nhiều trận, nhiều đội tham gia)'),
 'Trốn tìm chỉ là một trò chơi giải trí đơn giản của trẻ em, không phải môn thể thao hay giải đấu chính thức → '+
 'dùng <b>game</b>.',
 '“sport” ✘ đòi hỏi tính chất thi đấu thể chất có tổ chức. “competition” ✘ và “tournament” ✘ đều cần có người '+
 'thắng-thua/nhiều đội tham gia theo thể thức, không phù hợp với trò chơi trẻ con đơn giản như trốn tìm.');
s3(7,'<span class="bl">?</span> team do you think will win the next game?','Which',
 ['How many','Which','When','Who'],
 'Bạn nghĩ đội nào sẽ thắng trận đấu tiếp theo?',
 T('How many','wh-word','bao nhiêu (hỏi SỐ LƯỢNG, cần danh từ số nhiều)')+
 TG('Which','wh-word','… nào (chọn 1 trong số các đội đã biết + danh từ SỐ ÍT “team”)')+
 T('When','wh-word','khi nào')+T('Who','wh-word','ai'),
 'Ngay sau chỗ trống là danh từ SỐ ÍT “team”, và câu hỏi “đội NÀO sẽ thắng” → dùng <b>Which</b> (chọn trong số '+
 'các đội đã biết).',
 '“How many team” ✘ sai vì “team” đang ở số ít trong khi “how many” cần danh từ số nhiều. “When/Who” ✘ đều '+
 'không đi cùng danh từ “team” ngay sau.');
s3(8,'I’d like to <span class="bl">?</span> karate, but I don’t know where to start.','do',
 ['play','take','do','go'],
 'Tôi muốn học võ karate, nhưng tôi không biết bắt đầu từ đâu.',
 T('play','v','chơi (dùng cho môn có BÓNG hoặc trò chơi: play football/chess)')+
 T('take','v','tham gia (take a course/class — không đi trực tiếp với tên môn võ)')+
 TG('do','v','tập, luyện (do + môn võ thuật/thể dục cá nhân: do karate/yoga/aerobics)')+
 T('go','v','đi (go + V-ing: go swimming — không đi trực tiếp với danh từ “karate”)'),
 'Với các môn VÕ THUẬT và thể dục cá nhân (karate, judo, yoga, gymnastics), động từ đi kèm cố định là <b>do</b> '+
 '→ “do karate”.',
 '“play karate” ✘ vì “play” chỉ dùng cho môn có bóng/dụng cụ chơi hoặc trò chơi bàn cờ. “go karate” ✘ sai vì '+
 '“go” cần V-ing theo sau. “take karate” ✘ không phải cụm cố định.');
s3(9,'Frank: “What’s on Channel 9 tonight?” – Kate: “___”','There’s a new game show.',
 ['It’s at 9 o’clock.','There’s a new game show.','I’m going out with my friends.','Because it’s entertaining.'],
 'Frank: “Tối nay có gì trên kênh 9 vậy?” – Kate: “___”',
 T('It’s at 9 o’clock.','answer','Nó lúc 9 giờ. (trả lời cho câu hỏi WHEN, không phải WHAT’S ON)')+
 TG('There’s a new game show.','answer','Có một chương trình trò chơi mới. (đúng trọng tâm: CÓ GÌ trên kênh 9)')+
 T('I’m going out with my friends.','answer','Tôi sẽ đi chơi với bạn bè. (không liên quan nội dung kênh 9)')+
 T('Because it’s entertaining.','answer','Vì nó giải trí. (trả lời cho câu hỏi WHY, không phải WHAT’S ON)'),
 'Câu hỏi “What’s on…?” hỏi về CHƯƠNG TRÌNH đang/sắp chiếu → câu trả lời phải nêu TÊN LOẠI CHƯƠNG TRÌNH, đó là '+
 '“There’s a new game show.”',
 'Đáp án A trả lời cho câu hỏi giờ giấc (When), đáp án D trả lời cho câu hỏi lý do (Why), đáp án C hoàn toàn '+
 'lạc đề — không đáp án nào khác nêu được NỘI DUNG chương trình trên kênh 9.','c1');
s3(10,'Dolphins are my favourite sea animal <span class="bl">?</span> they are clever and friendly.','because',
 ['and','but','so','because'],
 'Cá heo là loài động vật biển yêu thích của tôi vì chúng thông minh và thân thiện.',
 T('and','conj','và (nối 2 ý cùng chiều, không nêu NGUYÊN NHÂN)')+T('but','conj','nhưng (nối 2 ý trái ngược)')+
 T('so','conj','nên (kết quả đứng SAU nguyên nhân, không phù hợp thứ tự ở đây)')+
 TG('because','conj','vì (nêu LÝ DO/nguyên nhân cho ý đứng trước)'),
 'Vế sau giải thích LÝ DO tại sao cá heo là loài yêu thích (“vì chúng thông minh và thân thiện”) → dùng liên từ '+
 'chỉ nguyên nhân <b>because</b>.',
 '“so” ✘ vì nếu dùng “so” thì trật tự phải đảo ngược (nguyên nhân trước, kết quả sau), không phù hợp ở đây khi '+
 'vế sau chính là LÝ DO. “and” ✘ và “but” ✘ không diễn tả được quan hệ nhân – quả.');
s3(11,'Mr Jones has a <span class="bl">?</span> in the market. He sells fresh fruit from his garden there.','stall',
 ['landmark','room','workshop','stall'],
 'Ông Jones có một gian hàng ở chợ. Ông bán trái cây tươi từ vườn nhà mình ở đó.',
 T('landmark','n','địa danh, công trình nổi tiếng')+T('room','n','căn phòng')+T('workshop','n','xưởng, buổi hội thảo')+
 TG('stall','n','gian hàng, quầy hàng (nơi bán đồ trong chợ)'),
 'Bán trái cây “in the market” (trong chợ) → nơi bán hàng nhỏ trong chợ gọi là <b>stall</b> (quầy/gian hàng).',
 '“landmark” ✘ là địa danh du lịch, không phải nơi bán hàng. “room” ✘ và “workshop” ✘ đều không phải là nơi bày '+
 'bán hàng hóa trong chợ.');
s3(12,'The family always go to <span class="bl">?</span> favourite restaurant when they visit Da Lat.','their',
 ['our','its','his','their'],
 'Cả gia đình luôn đến nhà hàng yêu thích của họ mỗi khi ghé thăm Đà Lạt.',
 T('our','det','của chúng tôi (không khớp chủ ngữ “the family” — không phải ngôi thứ nhất)')+
 T('its','det','của nó (dùng khi coi cả gia đình là MỘT ĐƠN VỊ, ít dùng cho sở thích chung)')+
 T('his','det','của anh ấy (chỉ MỘT người, không khớp “the family” gồm nhiều người)')+
 TG('their','det','của họ (dùng khi “the family” được xem như tập hợp NHIỀU NGƯỜI có sở thích chung)'),
 '“The family” ở đây được hiểu là NHIỀU THÀNH VIÊN cùng đi (they visit) → dùng tính từ sở hữu số nhiều <b>their</b>.',
 '“our” ✘ sai ngôi (chủ ngữ là ngôi thứ ba “the family”, không phải “we”). “his” ✘ chỉ một người, trong khi vế '+
 'sau dùng “they”. “its” ✘ thường dùng khi coi gia đình là một khối duy nhất, không khớp đại từ “they” đã dùng.');
s3(13,'Chris isn’t very good <span class="bl">?</span> dancing, so he practises hard every day.','at',
 ['at','along','above','on'],
 'Chris không giỏi nhảy múa lắm, vì vậy cậu ấy luyện tập chăm chỉ mỗi ngày.',
 TG('at','prep','cụm cố định “be good AT + V-ing/danh từ” = giỏi về cái gì')+T('along','prep','dọc theo')+
 T('above','prep','ở trên, cao hơn')+T('on','prep','trên (bề mặt)'),
 'Cụm cố định là <b>be good AT st/V-ing</b> → “isn’t very good at dancing”.',
 '“along/above/on” ✘ đều không kết hợp với “good” theo nghĩa “giỏi về việc gì” — đây là một cụm giới từ cố định '+
 'cần học thuộc.');
s3(14,'I think Melbourne is a(n) <span class="bl">?</span> city.','fantastic',
 ['royal','excited','tasty','fantastic'],
 'Tôi nghĩ Melbourne là một thành phố tuyệt vời.',
 T('royal','adj','thuộc hoàng gia (dùng cho cung điện, gia đình vua chúa — không tự nhiên khi khen 1 thành phố)')+
 T('excited','adj','cảm thấy phấn khích (chỉ dùng cho NGƯỜI, không dùng cho địa điểm)')+
 T('tasty','adj','ngon (dùng cho ĐỒ ĂN, không dùng cho thành phố)')+
 TG('fantastic','adj','tuyệt vời (tính từ cảm nhận chung, phù hợp để khen một thành phố)'),
 '“fantastic” là tính từ miêu tả cảm nhận TÍCH CỰC chung chung, phù hợp để khen một thành phố tuyệt vời.',
 '“excited” ✘ chỉ dùng cho NGƯỜI (I’m excited), không dùng cho thành phố. “tasty” ✘ chỉ dùng cho món ăn. “royal” ✘ '+
 'chỉ phù hợp khi nói về hoàng gia/cung điện, không phải cảm nhận chung về một thành phố.');

/* ═════ IV — TÌM & SỬA LỖI (2) ═════ */
const s4=(n,pre,parts,aL,corr,accept,vn,pk,r,w)=>fxq('S4',n,pre,parts,aL,corr,accept,
 EX('Lỗi ở chữ <b>'+aL+'</b> ➔ '+pk.k,vn,pk.c,r,w));
s4(15,'The Owls played fewer matches ',[['A','than',' the Eagles, '],['B','so',' they '],
 ['C','scored',' more '],['D','points','.']],'B','but',['but'],
 'Đội Owls đã chơi ít trận hơn đội Eagles, nhưng họ lại ghi được nhiều điểm hơn.',
 {k:'<span class="hl-red">so</span> ➔ <span class="hl-green">but</span>',
  c:T('than','conj','hơn (so sánh) – ĐÚNG, giữ nguyên')+
    TG('but','conj','nhưng (nối 2 ý TRÁI NGƯỢC/bất ngờ)')+
    T('scored / points','v / n','ghi điểm / điểm số – ĐÚNG, giữ nguyên')},
 '“Chơi ÍT trận hơn” nhưng lại “ghi được NHIỀU điểm hơn” là một sự việc BẤT NGỜ, TRÁI NGƯỢC với logic thông '+
 'thường → phải dùng liên từ tương phản <b>but</b>, không phải “so”.',
 '“so” ✘ diễn tả quan hệ nhân–quả (chơi ít trận NÊN ghi nhiều điểm) — điều này vô lý về logic. Ba ô A, C, D '+

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="qt">'+h+'Tìm chữ cái chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="segs" id="sg_'+gid+'">'+(m.pre||'')+
   m.parts.map(p=>'<span class="sg" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     '<b>'+p[0]+'</b>'+p[1]+'</span>'+(p[2]||'')).join('')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào chữ cái con cho là SAI.</div>'+
   '<div class="fz" id="fz_'+gid+'"><span class="fzl" id="fl_'+gid+'"></span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  c.querySelector('#b_'+gid).onclick=()=>chkf(gid);
  c.querySelector('#i_'+gid).addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Đã chọn chữ <b>'+L+'</b>. <b>Bước 2:</b> gõ phần đã sửa rồi '+
  'bấm <b>KIỂM TRA</b>. (Bấm chữ khác nếu muốn đổi.)';
 document.getElementById('fz_'+gid).classList.add('open');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa chữ <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),
       inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),460);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter,okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>{
  s.classList.remove('sel');s.classList.add('dn');
  if(s.dataset.l===m.letter)s.classList.add('sgok');
  else if(s.dataset.l===sel[gid])s.classList.add('sgno');
  else s.classList.add('sgdim');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
  ? '🎉 <b>Tuyệt vời!</b> Đúng chữ <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
  : (okL?'⚠️ Đúng chữ <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
       :(okW?'⚠️ Sửa đúng từ nhưng chọn SAI chữ. Lỗi nằm ở chữ <b>'+m.letter+'</b>.'
            :'❌ Lỗi nằm ở chữ <b>'+m.letter+'</b>, phải sửa thành <b>'+m.corr+'</b>.'));
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 THIÊN TÀI, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu – xuất sắc tuyệt đối! 🐬';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ xem lại cụm “take part in”, “good at” và '+
  'thể bị động nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại lời giải từng câu rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
