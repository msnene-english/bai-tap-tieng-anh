<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏝️ SECOND MIDTERM TEST 3 · P1 — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B3D3A;--deep:#065A52;--coral:#FF7A59;--peach:#FFD27A;--violet:#118AB2;
  --gold:#FFD27A;--teal:#06D6A0;--good:#0E9F6E;--bad:#E63946;--glass:rgba(255,255,255,.88)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,#BFEFFF 0%,#7FDBFF 16%,#3FC1E9 36%,#17B8A6 56%,#0B8A86 76%,#065A52 100%);
  background-size:100% 220%;background-attachment:fixed;animation:sky 30s ease-in-out infinite alternate}
@keyframes sky{from{background-position:50% 0%}to{background-position:50% 100%}}
/* ── MẶT TRỜI GIỮA TRƯA ── */
.sun{position:fixed;left:50%;top:5vh;transform:translateX(-50%);width:190px;height:190px;border-radius:50%;
  z-index:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#FFFDF0 10%,#FFE9A0 40%,#FFC24C 66%,rgba(255,194,76,0) 76%);
  animation:glow 7s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.8;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
/* ── ĐỤN CÁT + CÂY DỪA ── */
.city{position:fixed;left:0;right:0;bottom:0;height:32vh;min-height:200px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:6px;opacity:.96}
.bd{position:relative;flex:0 0 auto;background:linear-gradient(180deg,#FFDDA1,#E8AF5C);
  border-radius:60% 40% 50% 50%/70% 70% 30% 30%}
.bd::before{content:'';position:absolute;left:0;right:0;top:0;height:100%;
  background-image:radial-gradient(circle,rgba(255,255,255,.7) 1.6px,transparent 1.8px);
  background-size:13px 16px;background-position:5px 9px;opacity:.5;animation:win 4s steps(2) infinite}
@keyframes win{0%,100%{opacity:.35}50%{opacity:.75}}
.bd.spire{background:linear-gradient(180deg,#EF8354,#C1502E)}
.bd.spire2{background:linear-gradient(180deg,#FF7A59,#E8556D)}
.tr2{position:relative;flex:0 0 auto;align-self:flex-end;font-size:38px;line-height:1;
  animation:sway 3.6s ease-in-out infinite alternate;transform-origin:bottom center;
  filter:drop-shadow(0 3px 3px rgba(6,90,82,.3))}
.city2{position:fixed;left:0;right:0;bottom:0;height:22vh;min-height:120px;z-index:0;pointer-events:none;
  display:flex;align-items:flex-end;gap:6px;opacity:.55;filter:blur(.6px)}
.city2 .bd{background:linear-gradient(180deg,#7FDBFF,#3FC1E9)}
.city2 .tr2{font-size:26px;filter:none;opacity:.8}
/* ── SÓNG, THUYỀN BUỒM & CHIM BIỂN ── */
.swf{position:fixed;bottom:2vh;z-index:0;pointer-events:none;font-size:22px;
  animation:swim linear infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
@keyframes swim{0%{transform:translateX(-10vw) scaleX(1)}49%{transform:translateX(100vw) scaleX(1)}
  50%{transform:translateX(100vw) scaleX(-1)}99%{transform:translateX(-10vw) scaleX(-1)}
  100%{transform:translateX(-10vw) scaleX(1)}}
.fly{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fo{position:absolute;bottom:-90px;animation:up linear infinite}
.fo i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes up{0%{transform:translateY(0);opacity:0}9%{opacity:.95}86%{opacity:.75}
  100%{transform:translateY(-118vh);opacity:0}}
@keyframes sway{from{transform:translateX(-16px) rotate(-7deg)}to{transform:translateX(16px) rotate(7deg)}}
.bal{position:relative;width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),rgba(255,255,255,.06) 45%,
   color-mix(in srgb, var(--c1) 50%, transparent) 70%);
  border:1.5px solid rgba(255,255,255,.6);box-shadow:0 0 10px rgba(255,255,255,.4),inset 0 0 8px rgba(255,255,255,.5)}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:16px 14px 30vh}
h1,h2,.pill,.qn,.sbtn,.ck{font-family:'Fredoka',sans-serif;font-weight:700}
.gl{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:2px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 10px 30px rgba(6,60,60,.28)}
.hdr{padding:20px 20px 17px;text-align:center;margin:8px 0 18px}
.hdr h1{font-size:clamp(18px,4.1vw,29px);line-height:1.25;
  background:linear-gradient(90deg,var(--deep),var(--coral),var(--violet),var(--deep));
  background-size:280% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:shim 6s linear infinite}
@keyframes shim{0%{background-position:0%}100%{background-position:280%}}
.hdr .sub{display:inline-block;margin-top:8px;font-family:'Fredoka',sans-serif;font-size:.92rem;color:#fff;
  background:linear-gradient(135deg,var(--teal),var(--violet));padding:3px 16px;border-radius:999px}
.hdr p{font-size:.8rem;font-weight:700;color:var(--deep);margin-top:9px;line-height:1.75}
.sb{position:sticky;top:8px;z-index:9;display:flex;align-items:center;gap:11px;padding:9px 17px;margin-bottom:18px;
  border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border:2px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(6,60,60,.22)}
.sb b{font-family:'Fredoka',sans-serif;font-size:1.14rem;color:var(--deep)}
.tr{flex:1;height:11px;background:rgba(6,214,160,.18);border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--violet),var(--coral));transition:width .45s}
.sec{padding:20px 17px 19px;margin-bottom:24px}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.pill{color:#fff;border-radius:999px;padding:3px 15px;font-size:.9rem;box-shadow:0 3px 10px rgba(6,60,60,.26)}
.st h2{font-size:1.08rem;color:var(--deep);font-family:'Fredoka',sans-serif}
.si{font-size:.85rem;font-weight:700;color:#3E7A72;font-style:italic;margin:2px 0 15px;line-height:1.8}
.q{background:rgba(255,255,255,.9);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  border-radius:16px;padding:18px 18px 19px;margin-bottom:18px;
  box-shadow:0 4px 14px rgba(6,60,60,.16);border-left:5px solid var(--teal)}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff;
  border-radius:10px;min-width:32px;text-align:center;padding:1px 8px;margin-right:8px;font-size:.92rem}
.qt{font-weight:700;font-size:1.15rem;line-height:2.05}
.qt .bl{display:inline-block;min-width:100px;border-bottom:3px solid var(--violet);text-align:center;
  color:var(--deep);font-weight:900}
.src{background:#EAFBF6;border-left:4px solid var(--teal);border-radius:0 11px 11px 0;padding:10px 13px;
  margin-top:9px;font-weight:800;font-size:1.05rem;line-height:1.9}
.cue{background:#FFF6E3;border:2px dashed var(--gold);border-radius:11px;padding:10px 13px;margin-top:9px;
  font-weight:800;font-size:1.05rem;line-height:1.9;color:#8A5A00}
.tg{display:inline-block;background:#E6F7FE;border:1.5px solid var(--violet);color:#0B5B78;border-radius:8px;
  padding:0 9px;font-size:.78rem;margin-left:6px;font-weight:800}
u{background:#B8F2E6;border-radius:4px;padding:0 4px;text-decoration:none;font-weight:800}
.ob u,.og u,.qt u{background:#9BE8D8;border-radius:3px;padding:0 1px;margin:0 -1px;font-weight:900;
  text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;text-decoration-color:var(--deep)}
/* ── TÌM & SỬA LỖI ── */
.segs{margin-top:13px;font-weight:700;font-size:1.08rem;line-height:2.6;
  background:#EAFBF6;border-left:4px solid var(--teal);border-radius:0 11px 11px 0;padding:12px 15px}
.sg{display:inline-block;background:#fff;border:2px solid var(--violet);border-radius:10px;padding:2px 9px;
  margin:0 2px;font-weight:800;font-size:1.02rem;cursor:pointer;transition:.14s;color:#0B5B78;
  box-shadow:0 2px 5px rgba(17,138,178,.2)}
.sg b{display:inline-block;background:var(--violet);color:#fff;border-radius:6px;padding:0 6px;margin-right:6px;
  font-size:.75rem;font-family:'Fredoka',sans-serif}
.sg:hover:not(.dn){transform:translateY(-2px);background:#EAF8FF}
.sg.sel{border-color:var(--gold);background:#FFF6E3;box-shadow:0 0 0 3px rgba(255,210,122,.4)}
.sg.dn{cursor:default;transform:none}
.sg.sgok{background:#D6F5E6;border-color:var(--good);color:#08663f}.sg.sgok b{background:var(--good)}
.sg.sgno{background:#FFE3E3;border-color:var(--bad);color:#96140f}.sg.sgno b{background:var(--bad)}
.sg.sgdim{opacity:.4}
.fz{max-height:0;overflow:hidden;transition:max-height .32s ease;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fz.open{max-height:220px;margin-top:12px}
.fzl{font-weight:900;color:#8A5A00;font-size:.95rem;width:100%}
.hint{margin-top:10px;background:#FFF6E3;border:2px dashed var(--gold);border-radius:10px;padding:8px 12px;
  font-size:.91rem;font-weight:700;color:#8A5A00;line-height:1.8}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:680px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.og{grid-template-columns:1fr}}
.ob{background:#FFFDFE;border:2px solid rgba(17,138,178,.4);border-radius:14px;padding:12px 14px;
  font-family:'Nunito';font-size:1.08rem;font-weight:800;cursor:pointer;transition:.15s;text-align:center;
  line-height:1.6;color:var(--ink);box-shadow:0 3px 8px rgba(17,138,178,.14)}
.ob:hover:not(.dn){transform:translateY(-2px) scale(1.02);background:#EAF8FF;border-color:var(--violet)}
.ob.ok{background:#D6F5E6;border-color:var(--good);color:#08663f}
.ob.no{background:#FFE3E3;border-color:var(--bad);color:#96140f}
.ob.dim{opacity:.42}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ti{flex:1;min-width:200px;padding:10px 14px;border:2px solid rgba(17,138,178,.4);border-radius:11px;
  font-family:'Nunito';font-size:1rem;font-weight:800;outline:none;background:#FFFDFE;color:var(--ink)}
.ti::placeholder{color:#9FC2C0}
.ti:focus{border-color:var(--violet);background:#fff}
.ti.ok{border-color:var(--good);background:#D6F5E6}.ti.no{border-color:var(--bad);background:#FFE3E3}
.ck{background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff;border:none;border-radius:11px;
  padding:10px 20px;font-size:.97rem;cursor:pointer;box-shadow:0 4px 12px rgba(17,138,178,.4);white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.42;cursor:default}
.ex{display:none;margin-top:13px;background:#FFFDFE;border:1.5px solid rgba(17,138,178,.3);border-radius:14px;
  padding:15px 16px;font-size:1rem;line-height:1.85}
.ex.show{display:block}
.kb{background:#D6F5E6;border:1.5px solid var(--good);border-radius:9px;padding:8px 12px;margin-bottom:10px;
  font-weight:900;color:#08663f;line-height:1.75}
.vnt{background:#FFF1DE;border-left:4px solid var(--peach);border-radius:0 10px 10px 0;padding:9px 13px;
  margin-bottom:11px;font-weight:800;color:#8A4B00;line-height:1.85}
.ex ol{padding-left:20px}
.ex ol li{margin-bottom:12px;line-height:1.9}
.ex ol li:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.grid2>div{background:#fff;border:1.5px solid #DCF3ED;border-radius:10px;padding:8px 11px;line-height:1.7;font-weight:700}
.p-word{color:#1D6FB8;font-weight:800}
.hl-green{color:var(--good);font-weight:900}
.hl-red{color:var(--bad);font-weight:900}
.wt{background:#E6F7FE;color:#0B5B78;padding:1px 6px;border-radius:5px;font-size:.79em;font-weight:800;margin:0 4px}
.p-mean{color:#C2410C;font-weight:700}
.p-phonetic{color:#0B5B78;background:rgba(11,91,120,.09);border-radius:4px;padding:1px 6px;
  font-family:'Courier New',monospace;font-size:.9em;font-weight:800}
.p-grammar{text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2.5px;
  text-underline-offset:3px;font-weight:700}
.note{background:#EEF2F7;border-left:4px solid #7A8FA6;border-radius:0 8px 8px 0;padding:8px 12px;margin-top:9px;
  font-size:.9rem;font-weight:700;color:#3D5166;line-height:1.75}
.sub{text-align:center;margin-top:24px}
.sbtn{background:linear-gradient(135deg,var(--teal),var(--violet),var(--coral));color:#fff;border:none;
  border-radius:999px;padding:13px 40px;font-size:1.18rem;cursor:pointer;box-shadow:0 8px 22px rgba(17,138,178,.45)}
.sbtn:hover{transform:translateY(-3px)}
.ov{position:fixed;inset:0;background:rgba(6,40,38,.72);z-index:99;display:none;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(5px)}
.ov.on{display:flex}
.mb{background:rgba(255,255,255,.96);border-radius:22px;box-shadow:0 14px 44px rgba(6,60,60,.4);padding:24px;
  width:420px;max-width:96%;text-align:center;border:2px solid #fff;max-height:90vh;overflow-y:auto}
.mb h2{font-size:1.3rem;color:var(--deep);margin-bottom:11px}
.mb input{width:100%;padding:11px;border:2px solid rgba(17,138,178,.4);border-radius:11px;font-family:'Nunito';
  font-weight:800;font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#FFE3E3;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Fredoka',sans-serif;font-size:1.2rem;color:var(--deep);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Fredoka',sans-serif;font-size:2.5rem;color:var(--teal)}
.mb .rt{font-weight:900;color:#0B5B78;font-size:1.05rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.92rem;line-height:1.65;margin-bottom:10px;color:#5A4A66}
.mb img{width:100%;max-width:250px;border-radius:13px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
</head>
<body>
<div class="sun"></div>
<div class="city2" id="city2"></div>
<div class="city" id="city"></div>
<div class="fly" id="fly"></div>
<div class="wrap">
  <div class="hdr gl">
    <h1>🏝️ SECOND MIDTERM TEST 3</h1>
    <div class="sub">PART 1 · LAGOON TREASURE HUNT</div>
    <p>🎓 Giáo viên tạo: Ms. Chí Nên &nbsp;·&nbsp; Phần <b>I–VI</b> + <b>IX–XI</b><br>
    28 câu &nbsp;·&nbsp; <i>(bỏ phần VII — đoạn văn điền từ &amp; VIII — bài đọc hiểu theo yêu cầu)</i></p>
  </div>
  <div class="sb">⚓ <b><span id="sc">0</span>/<span id="tt">0</span></b>
    <div class="tr"><div class="fl" id="fb"></div></div><span id="md">💪</span></div>
  <div id="app"></div>
  <div class="sub"><button class="sbtn" onclick="openName()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button></div>
</div>
<div class="ov" id="nOv"><div class="mb"><h2>✍️ Nhập tên của con</h2>
  <input id="nIn" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')showResult()">
  <div class="em" id="nEr">⚠️ Con chưa nhập tên kìa!</div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="showResult()">🚀 Xem kết quả</button></div></div>
<div class="ov" id="rOv"><div class="mb"><div class="gr" id="rG"></div>
  <div class="rs" id="rS"></div><div class="rt" id="rT"></div><img id="rI" alt=""><div class="rm" id="rM"></div>
  <button class="sbtn" style="width:100%;font-size:1.04rem;padding:10px" onclick="location.reload()">🔄 Làm lại</button></div></div>

<script>
/* ══ ĐỤN CÁT + CÂY DỪA + THUYỀN BUỒM + BONG BÓNG + CHIM BIỂN ══ */
(function(){
 function beach(el,n,minH,maxH,minW,maxW,palmSize){
  for(let i=0;i<n;i++){
   if(i%5===4){const t=document.createElement('div');t.className='tr2';
    t.textContent='🌴';t.style.fontSize=palmSize+'px';
    t.style.animationDelay=(-Math.random()*3).toFixed(1)+'s';el.appendChild(t);continue}
   const b=document.createElement('div');b.className='bd'+(i%9===3?' spire':(i%9===7?' spire2':''));
   b.style.width=(minW+Math.random()*(maxW-minW)).toFixed(0)+'px';
   b.style.height=(minH+Math.random()*(maxH-minH)).toFixed(0)+'px';
   el.appendChild(b);
  }
 }
 beach(document.getElementById('city2'),24,30,80,24,52,26);
 beach(document.getElementById('city'),20,50,180,28,64,40);
 for(let i=0;i<4;i++){
  const s=document.createElement('div');s.className='swf';
  s.textContent=['⛵','🚤','🐬','🕊️'][i%4];
  s.style.bottom=(4+Math.random()*24)+'vh';
  s.style.animationDuration=(24+Math.random()*20).toFixed(1)+'s';
  s.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  document.body.appendChild(s);
 }
 const L=document.getElementById('fly');
 const C=[['#7FDBFF','#118AB2'],['#06D6A0','#7FDBFF'],['#FFD27A','#FF7A59'],
          ['#118AB2','#06D6A0'],['#3FC1E9','#7FDBFF']];
 for(let i=0;i<22;i++){
  const d=document.createElement('div');d.className='fo';
  const inner=document.createElement('i');
  if(i%6===5){inner.textContent=['🕊️','🐦'][i%2];
   inner.style.fontSize=(14+Math.random()*12).toFixed(0)+'px';}
  else if(i%9===4){inner.textContent=['🐚','⭐','🦀'][i%3];inner.style.fontSize=(16+Math.random()*12).toFixed(0)+'px';}
  else{const b=document.createElement('div');b.className='bal';
   b.style.setProperty('--s',(8+Math.random()*16).toFixed(0)+'px');
   b.style.setProperty('--c1',C[i%C.length][0]);b.style.setProperty('--c2',C[i%C.length][1]);
   inner.appendChild(b);}
  d.style.left=(Math.random()*93)+'%';
  d.style.animationDuration=(15+Math.random()*16).toFixed(1)+'s';
  d.style.animationDelay=(-Math.random()*30).toFixed(1)+'s';
  inner.style.animationDuration=(3+Math.random()*3).toFixed(1)+'s';
  d.appendChild(inner);L.appendChild(d);
 }
})();
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});
function confetti(){const c=['#FFD27A','#FF7A59','#118AB2','#06D6A0','#7FDBFF'];
 for(let i=0;i<30;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];
  d.style.left=(Math.random()*100)+'vw';d.style.animation='fall '+(1.4+Math.random()*1.3)+'s linear forwards';
  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').toLowerCase().replace(/[’'`´]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
</script>

<script>
const Q=[];
function mcq(sec,num,q,correct,opts,ex,cls){Q.push({t:'mcq',sec,num,q,correct,opts,ex,cls:cls||''})}
function fil(sec,num,q,correct,accept,ex,ph){Q.push({t:'fill',sec,num,q,correct,accept,ex,ph:ph||'Điền...'})}
function fxq(sec,num,pre,parts,letter,corr,accept,ex){Q.push({t:'fix',sec,num,pre,parts,letter,corr,accept,ex})}
function T(w,ty,m){return "<div><span class='p-word'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TG(w,ty,m){return "<div><span class='hl-green'>"+w+"</span> <span class='wt'>"+ty+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TP(w,ipa,m){return "<div><span class='p-word'>"+w+"</span> <span class='p-phonetic'>"+ipa+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function TPG(w,ipa,m){return "<div><span class='hl-green'>"+w+"</span> <span class='p-phonetic'>"+ipa+"</span> = <span class='p-mean'>"+m+"</span></div>"}
function EX(kb,vn,cells,right,wrong){
 return '<div class="kb">✅ '+kb+'</div><div class="vnt">💬 <b>Dịch:</b> '+vn+'</div>'+
  '<ol><li><b>🔎 Phân tích đáp án:</b><div class="grid2">'+cells+'</div></li>'+
  '<li><span class="hl-green">✅ TẠI SAO ĐÚNG?</span> <span class="p-grammar">'+right+'</span></li>'+
  '<li><span class="hl-red">❌ TẠI SAO SAI?</span> <span class="p-grammar">'+wrong+'</span></li></ol>'}

/* ═════ I — PHÁT ÂM (2) ═════ */
const s1=(n,o,a,vn,c,r,w)=>mcq('S1',n,'<b>'+n+'.</b> Chọn từ có phần gạch chân phát âm KHÁC 3 từ còn lại:',a,o,
 EX(a.replace(/<\/?u>/g,''),vn,c,r,w),'c4');
s1(1,['discu<u>ss</u>ion','acro<u>ss</u>','cla<u>ss</u>mate','busine<u>ss</u>'],'discu<u>ss</u>ion',
 'Chọn từ có phần “ss” được gạch chân phát âm khác 3 từ còn lại. (discussion, across, classmate, business)',
 TPG('discu<u>ss</u>ion','/dɪˈskʌʃn/','cuộc thảo luận')+TP('acro<u>ss</u>','/əˈkrɒs/','băng qua, ngang qua')+
 TP('cla<u>ss</u>mate','/ˈklɑːsmeɪt/','bạn cùng lớp')+TP('busine<u>ss</u>','/ˈbɪznəs/','công việc kinh doanh'),
 '<b>across, classmate, business</b> đều đọc “ss” là <b>/s/</b>. Riêng <b>discussion</b>, “ss” đứng ngay trước '+
 'đuôi “-ion” nên đọc thành <b>/ʃ/</b> → khác 3 từ còn lại.',
 'Quy tắc: đuôi “-ssion” trong danh từ (discussion, mission, permission…) luôn đọc là /ʃn/, khác với “ss” '+
 'thông thường vẫn giữ âm /s/ như trong across, classmate, business.');
s1(2,['n<u>a</u>tional','l<u>a</u>nguage','landsc<u>a</u>pe','m<u>a</u>tch'],'landsc<u>a</u>pe',
 'Chọn từ có phần “a” được gạch chân phát âm khác 3 từ còn lại. (national, language, landscape, match)',
 TP('n<u>a</u>tional','/ˈnæʃnəl/','thuộc quốc gia')+TP('l<u>a</u>nguage','/ˈlæŋɡwɪdʒ/','ngôn ngữ')+
 TPG('landsc<u>a</u>pe','/ˈlændskeɪp/','phong cảnh')+TP('m<u>a</u>tch','/mætʃ/','trận đấu, que diêm'),
 '<b>national, language, match</b> đều đọc “a” là <b>/æ/</b>. Riêng <b>landscape</b>, chữ “a” gạch chân nằm '+
 'trong âm tiết “-scape” nên đọc là <b>/eɪ/</b> → khác 3 từ còn lại.',
 'Bẫy: “landscape” = land + scape, chữ “a” đầu tiên (trong “land”) vẫn đọc /æ/ giống các từ kia, nhưng đề gạch '+
 'chân chữ “a” THỨ HAI (trong “scape”) nên đọc /eɪ/. Luôn xác định đúng vị trí chữ cái được gạch chân trong '+
 'từ ghép.');

/* ═════ II — TRỌNG ÂM (2) ═════ */
const s2=(n,o,a,vn,c,r,w)=>mcq('S2',n,'<b>'+n+'.</b> Chọn từ có trọng âm KHÁC 3 từ còn lại:',a,o,
 EX(a,vn,c,r,w),'c4');
s2(3,['chopsticks','borrow','central','arrive'],'arrive',
 'Chọn từ có trọng âm khác 3 từ còn lại. (chopsticks, borrow, central, arrive)',
 T('CHOPsticks','n','đôi đũa — trọng âm rơi vào âm tiết 1')+T('BORrow','v','mượn — trọng âm rơi vào âm tiết 1')+
 T('CENtral','adj','trung tâm, trọng yếu — trọng âm rơi vào âm tiết 1')+
 TG('arRIVE','v','đến nơi — trọng âm rơi vào âm tiết 2'),
 '<b>chopsticks, borrow, central</b> đều là từ 2 âm tiết có trọng âm rơi vào ÂM TIẾT THỨ NHẤT. Riêng '+
 '<b>arrive</b> có trọng âm rơi vào ÂM TIẾT THỨ HAI → khác 3 từ còn lại.',
 'Không thể đoán trọng âm chỉ qua số lượng âm tiết (cả 4 từ đều có 2 âm tiết) — phải nhớ TRỌNG ÂM cụ thể của '+
 'từng từ. “arrive” là một trong số ít động từ có trọng âm rơi vào âm tiết cuối.');
s2(4,['temperature','serious','presentation','industry'],'presentation',
 'Chọn từ có trọng âm khác 3 từ còn lại. (temperature, serious, presentation, industry)',
 T('TEMperature','n','nhiệt độ — trọng âm âm tiết 1')+T('SErious','adj','nghiêm túc — trọng âm âm tiết 1')+
 TG('presenTAtion','n','buổi thuyết trình — trọng âm âm tiết 3')+
 T('INdustry','n','ngành công nghiệp — trọng âm âm tiết 1'),
 '<b>temperature, serious, industry</b> đều có trọng âm rơi vào ÂM TIẾT ĐẦU TIÊN. Riêng <b>presentation</b> '+
 'có trọng âm rơi vào ÂM TIẾT THỨ BA (ngay trước đuôi “-tion”) → khác 3 từ còn lại.',
 'Bẫy: nhiều danh từ đuôi “-tion” có trọng âm rơi ngay TRƯỚC “-tion” (presentaTIon, informaTIon) — khác với '+
 'thói quen trọng âm rơi vào âm tiết đầu như đa số từ còn lại trong nhóm này.');

/* ═════ III — TRẮC NGHIỆM (10) ═════ */
const s3=(n,s,a,o,vn,c,r,w,cl)=>mcq('S3',n,'<b>'+n+'.</b> '+s,a,o,EX(a,vn,c,r,w),cl||'c4');
s3(5,'<span class="bl">?</span> are you going to Disneyland with?','Who',
 ['How','When','Who','Why'],
 'Bạn sẽ đi Disneyland cùng với ai vậy?',
 T('How','wh-word','như thế nào (không đi với giới từ “with” theo nghĩa đồng hành)')+
 T('When','wh-word','khi nào')+TG('Who','wh-word','với AI (Who…with? = hỏi người đi cùng)')+
 T('Why','wh-word','tại sao'),
 'Cụm “…are you going with?” hỏi về NGƯỜI đi cùng → dùng <b>Who</b> (Who…with = với ai).',
 '“How/When/Why” ✘ đều không phù hợp khi đi cùng giới từ “with” ở cuối câu để hỏi về NGƯỜI đồng hành.');
s3(6,'Remember to take <span class="bl">?</span> pair of swimming goggles with you to the pool!','a',
 ['any','a','few','some'],
 'Nhớ mang theo một cặp kính bơi khi đi đến bể bơi nhé!',
 T('any','quantifier','bất kỳ (dùng với danh từ số nhiều/không đếm được, không đi với “pair” số ít)')+
 TG('a','art','một (mạo từ, đi trước cụm đếm được số ít “pair of…”)')+
 T('few','quantifier','một vài, ít (đi với danh từ số nhiều)')+
 T('some','quantifier','một ít (thường đi với danh từ số nhiều/không đếm được)'),
 '“pair” là danh từ SỐ ÍT (a pair of + N số nhiều) → cần mạo từ <b>a</b> đứng trước.',
 '“any/some/few” ✘ đều dùng cho danh từ số nhiều hoặc không đếm được, không phù hợp trước danh từ số ít “pair”.');
s3(7,'In <i>Plants vs Zombies</i>, you can use different plants to <span class="bl">?</span> at zombies.','shoot',
 ['shoot','educate','attract','score'],
 'Trong trò Plants vs Zombies, bạn có thể dùng các loại cây khác nhau để bắn vào lũ zombie.',
 TG('shoot','v','bắn (shoot AT + mục tiêu)')+T('educate','v','giáo dục (không liên quan hành động bắn súng)')+
 T('attract','v','thu hút (ngược nghĩa với việc tấn công kẻ địch)')+
 T('score','v','ghi điểm (không đi với giới từ “at”)'),
 'Cụm cố định <b>shoot AT + mục tiêu</b> = bắn VÀO cái gì, khớp hoàn toàn với ngữ cảnh trò chơi bắn zombie.',
 '“attract” ✘ mang nghĩa THU HÚT (ngược hoàn toàn với việc tấn công). “educate/score” ✘ đều không đi tự nhiên '+
 'với giới từ “at” theo nghĩa tấn công mục tiêu.');
s3(8,'Alex: “What do you like about <i>The Masked Singer</i>?” – Laura: “___”','I think the costumes are funny.',
 ['It’s on HTV2.','I think the costumes are funny.','Let’s watch this weekend.','My younger brother loves it.'],
 'Alex: “Bạn thích điều gì ở chương trình The Masked Singer?” – Laura: “___”',
 T('It’s on HTV2.','answer','Nó chiếu trên kênh HTV2. (trả lời cho câu hỏi WHERE, không phải WHAT DO YOU LIKE)')+
 TG('I think the costumes are funny.','answer','Tôi thấy trang phục rất buồn cười. (nêu ĐIỀU cụ thể mình thích)')+
 T('Let’s watch this weekend.','answer','Cùng xem vào cuối tuần này nhé. (lời rủ, không trả lời câu hỏi)')+
 T('My younger brother loves it.','answer','Em trai tôi rất thích nó. (nói về người khác, không phải bản thân người trả lời)'),
 'Câu hỏi “What do you like about…?” cần câu trả lời nêu MỘT ĐIỀU CỤ THỂ mà bản thân người trả lời thích → '+
 '“I think the costumes are funny.”',
 'Đáp án A trả lời cho câu hỏi kênh chiếu (Where), đáp án C là lời rủ chứ không phải câu trả lời, đáp án D nói '+
 'về cảm nhận của em trai chứ không phải của Laura.','c1');
s3(9,'Please <span class="bl">?</span> down quickly so the show can start.','sit',
 ['sitting','should sit','must sit','sit'],
 'Làm ơn ngồi xuống nhanh lên để chương trình có thể bắt đầu.',
 T('sitting','v-ing','đang ngồi (không dùng sau “please” trong câu mệnh lệnh)')+
 T('should sit','modal','nên ngồi (lời khuyên nhẹ, không phù hợp với yêu cầu trực tiếp)')+
 T('must sit','modal','phải ngồi (quá nặng nề so với lời nhắc lịch sự có “please”)')+
 TG('sit','v','ngồi (ĐỘNG TỪ NGUYÊN THỂ sau “please” trong câu mệnh lệnh lịch sự)'),
 '“Please + V nguyên thể” là cấu trúc câu YÊU CẦU/MỆNH LỆNH LỊCH SỰ chuẩn → dùng <b>sit</b>.',
 '“sitting” ✘ sai cấu trúc ngữ pháp sau “please”. “should/must sit” ✘ đều không cần thiết và không tự nhiên '+
 'trong câu yêu cầu ngắn gọn có “please”.');
s3(10,'Many ships enter and leave this <span class="bl">?</span> every day.','harbour',
 ['stadium','station','tower','harbour'],
 'Nhiều con tàu ra vào bến cảng này mỗi ngày.',
 T('stadium','n','sân vận động (không liên quan đến tàu thuyền)')+
 T('station','n','nhà ga (thường dùng cho tàu hỏa/xe buýt, không phải tàu thủy)')+T('tower','n','tòa tháp')+
 TG('harbour','n','bến cảng, hải cảng (nơi tàu thuyền ra vào)'),
 '“ships enter and leave” (tàu ra vào) chỉ xảy ra ở <b>harbour</b> (bến cảng) — nơi dành riêng cho tàu thuyền.',
 '“stadium/tower” ✘ không liên quan gì đến tàu thuyền. “station” ✘ thường dùng cho phương tiện trên bộ, không '+
 'phải nơi tàu THỦY ra vào.');
s3(11,'<i>Minions</i> is one of the most popular <span class="bl">?</span> among children.','animated films',
 ['comedies','animated films','game shows','action films'],
 'Minions là một trong những bộ phim hoạt hình phổ biến nhất đối với trẻ em.',
 T('comedies','n','phim/chương trình hài (Minions vui nhộn nhưng thể loại chính xác hơn là phim HOẠT HÌNH)')+
 TG('animated films','n','phim hoạt hình (đúng thể loại của Minions)')+
 T('game shows','n','chương trình trò chơi truyền hình')+T('action films','n','phim hành động'),
 'Minions là một bộ phim HOẠT HÌNH nổi tiếng dành cho trẻ em → <b>animated films</b> là thể loại chính xác nhất.',
 '“comedies” ✘ tuy Minions có yếu tố hài nhưng đây không phải NHÃN THỂ LOẠI chính xác. “game shows/action '+
 'films” ✘ hoàn toàn sai thể loại.');
s3(12,'Melinda’s dad got her a guitar for <span class="bl">?</span> birthday.','her',
 ['its','his','her','hers'],
 'Bố của Melinda đã tặng cô ấy một cây đàn guitar nhân dịp sinh nhật của cô ấy.',
 T('its','det','của nó (dùng cho vật/con vật, không dùng cho người)')+
 T('his','det','của anh ấy (sai giới tính, Melinda là tên nữ)')+
 TG('her','det','của cô ấy (tính từ sở hữu, đứng trước danh từ “birthday”)')+
 T('hers','pron','của cô ấy (đại từ sở hữu, đứng MỘT MÌNH, không đứng trước danh từ)'),
 'Chỗ trống đứng ngay trước danh từ “birthday” và chủ nhân là Melinda (nữ) → dùng tính từ sở hữu <b>her</b>.',
 '“his” ✘ sai giới tính. “its” ✘ dùng cho vật. “hers” ✘ là đại từ sở hữu, không thể đứng trực tiếp trước danh '+
 'từ “birthday”.');
s3(13,'You must look both ways before <span class="bl">?</span> the street.','crossing',
 ['turning','crossing','going','driving'],
 'Bạn phải nhìn cả hai bên trước khi băng qua đường.',
 T('turning','v-ing','rẽ, quay (không đi trực tiếp với “the street” theo nghĩa băng qua)')+
 TG('crossing','v-ing','băng qua, đi qua (cross the street = băng qua đường)')+
 T('going','v-ing','đi (quá chung chung, không diễn tả rõ hành động băng qua đường)')+
 T('driving','v-ing','lái xe (không khớp với hành động của người đi bộ)'),
 'Cụm cố định <b>cross the street</b> = băng qua đường, đúng ngữ cảnh “nhìn hai bên trước khi…”.',
 '“turning/going/driving” ✘ đều không tạo thành cụm tự nhiên với “the street” theo nghĩa băng qua đường như '+
 '“crossing”.');
s3(14,'Please put the books back <span class="bl">?</span> the bookcase after you finish reading them.','in',
 ['under','in','at','from'],
 'Làm ơn để sách trở lại vào trong tủ sách sau khi bạn đọc xong chúng.',
 T('under','prep','ở dưới (sách thường được đặt VÀO TRONG kệ, không phải dưới nó)')+
 TG('in','prep','ở trong (put st IN the bookcase = đặt cái gì vào trong tủ sách)')+
 T('at','prep','tại (không diễn tả vị trí bên trong một vật có khoang chứa)')+
 T('from','prep','từ (chỉ nguồn gốc, không phải vị trí đặt đồ)'),
 'Tủ sách (bookcase) là vật có khoang chứa → dùng giới từ <b>in</b> để chỉ vị trí BÊN TRONG.',
 '“under” ✘ nghĩa là ở dưới gầm tủ, sai với thói quen cất sách. “at/from” ✘ đều không phù hợp để chỉ vị trí '+
 'đặt đồ vào bên trong một vật có khoang chứa.');

/* ═════ IV — TÌM & SỬA LỖI (2) ═════ */
const s4=(n,pre,parts,aL,corr,accept,vn,pk,r,w)=>fxq('S4',n,pre,parts,aL,corr,accept,
 EX('Lỗi ở chữ <b>'+aL+'</b> ➔ '+pk.k,vn,pk.c,r,w));
s4(15,'Clarence ',[['A','isn’t knowing',' much '],['B','about',' popular destinations in '],
 ['C','popular',' '],['D','his','city.']],'A','doesn’t know',['doesnt know','does not know'],
 'Clarence không biết nhiều về các điểm đến nổi tiếng ở thành phố của cậu ấy.',
 {k:'<span class="hl-red">isn’t knowing</span> ➔ <span class="hl-green">doesn’t know</span>',
  c:TG('doesn’t know','v (hiện tại đơn)','không biết — "know" là ĐỘNG TỪ TRẠNG THÁI, không dùng ở thì tiếp diễn')+
    T('isn’t knowing','v-ing','SAI vì "know" diễn tả trạng thái nhận thức, không phải hành động đang diễn ra')+
    T('about / popular / his','prep / adj / det','ĐÚNG, giữ nguyên')},
 '“know” thuộc nhóm ĐỘNG TỪ TRẠNG THÁI (stative verbs: know, like, want, believe…) — KHÔNG chia ở thì tiếp '+

 '“isn’t knowing” ✘ sai vì động từ trạng thái không được thêm “-ing”. Ba ô B, C, D đều đúng.');
s4(16,'The singer made ',[['A','a mistake',' during '],['B','lively',' a programme, '],
 ['C','so',' she cried '],['D','a lot','.']],'B','live',['live'],
 'Ca sĩ đã mắc lỗi trong một chương trình trực tiếp, vì vậy cô ấy đã khóc rất nhiều.',
 {k:'<span class="hl-red">lively</span> ➔ <span class="hl-green">live</span>',

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="qt">'+h+'Tìm chữ cái chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="segs" id="sg_'+gid+'">'+(m.pre||'')+
   m.parts.map(p=>'<span class="sg" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     '<b>'+p[0]+'</b>'+p[1]+'</span>'+(p[2]||'')).join('')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào chữ cái con cho là SAI.</div>'+
   '<div class="fz" id="fz_'+gid+'"><span class="fzl" id="fl_'+gid+'"></span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  c.querySelector('#b_'+gid).onclick=()=>chkf(gid);
  c.querySelector('#i_'+gid).addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">KIỂM TRA</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Đã chọn chữ <b>'+L+'</b>. <b>Bước 2:</b> gõ phần đã sửa rồi '+
  'bấm <b>KIỂM TRA</b>. (Bấm chữ khác nếu muốn đổi.)';
 document.getElementById('fz_'+gid).classList.add('open');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa chữ <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),
       inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');setTimeout(()=>inp.classList.remove('no'),460);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter,okW=m.accept.map(norm).indexOf(v)>-1,ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>{
  s.classList.remove('sel');s.classList.add('dn');
  if(s.dataset.l===m.letter)s.classList.add('sgok');
  else if(s.dataset.l===sel[gid])s.classList.add('sgno');
  else s.classList.add('sgdim');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
  ? '🎉 <b>Tuyệt vời!</b> Đúng chữ <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
  : (okL?'⚠️ Đúng chữ <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
       :(okW?'⚠️ Sửa đúng từ nhưng chọn SAI chữ. Lỗi nằm ở chữ <b>'+m.letter+'</b>.'
            :'❌ Lỗi nằm ở chữ <b>'+m.letter+'</b>, phải sửa thành <b>'+m.corr+'</b>.'));
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function openName(){document.getElementById('nOv').classList.add('on');setTimeout(()=>document.getElementById('nIn').focus(),180)}
function showResult(){
 const inp=document.getElementById('nIn'),er=document.getElementById('nEr'),nm=inp.value.trim();
 if(!nm){inp.classList.add('er');er.style.display='block';setTimeout(()=>inp.classList.remove('er'),470);return}
 er.style.display='none';document.getElementById('nOv').classList.remove('on');
 const pct=score/TOTAL,ten=(pct*10).toFixed(2);
 let g,msg,gif;
 if(score===TOTAL){g='🏆 THIÊN TÀI, '+nm+'!';msg='Con đúng TOÀN BỘ '+TOTAL+' câu – tìm thấy kho báu rồi! 🏝️';
  gif='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';}
 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ xem lại “live/lively” và trọng âm từ '+
  'nhiều âm tiết nhé!';gif='https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif';}
 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại lời giải từng câu rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;
 document.getElementById('rT').textContent='🎓 Quy đổi: '+ten+' / 10 điểm';
 document.getElementById('rI').src=gif;
 document.getElementById('rM').textContent=msg;
 document.getElementById('rOv').classList.add('on');
 if(pct>=.6){confetti();ding()}
}
</script>
